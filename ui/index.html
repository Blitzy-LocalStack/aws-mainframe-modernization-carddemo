<!doctype html>
<!--
  =============================================================================
  ui/index.html
  =============================================================================
  Purpose: Vite build input and history-fallback document for the React SPA.
    It defines the root mount node, the TypeScript entry module, the browser
    title, and the public favicon path used by every client-side route.

    This document is not a static asset. Vite treats it as the BUILD INPUT: it
    parses this file, follows the module reference in the body, and derives the
    whole application module graph from there. That is why ui/vite.config.ts is
    to declare no explicit build input of its own, and why a wrong module path
    yields no build at all rather than a page that merely looks broken.

    The built copy of this file is also what ui/nginx.conf and the CloudFront
    distribution are to return as the history fallback, so all 21 client side
    routes (/signon, /menu, /account/update, /cards/:opaqueCardId, /authorizations/:key
    and the rest) are served this one document, and the router then decides what
    renders.

      COUNTERPARTIES, named once here rather than repeated at every element that
      depends on one. This document asserts contracts against ui/.env.example,
      ui/src/messages/messages.ts, ui/public/favicon.svg, ui/vite.config.ts,
      ui/nginx.conf, the entry module ui/src/main.tsx that the body references,
      and ui/src/theme/antdTheme.ts, where styling belongs.

    WHY (non-obvious design decisions):
      - Assumptions: three cross file contracts are asserted by this document and
        only one of them is checked while the bundle is built. Vite resolves the
        module path, so a wrong path fails the build; the mount node id must match
        the lookup in ui/src/main.tsx and the icon path must match the file Vite
        emits out of ui/public, and neither is type checked. Each contract is
        documented at the element that asserts it. The absence of a build time
        check on those two is the reason to write them down rather than a detail
        to note in passing: no compiler error will catch a mismatch, so a wrong id
        presents as a blank page and a wrong icon path as a missing icon at run
        time.
      - Trade-offs: the document is deliberately minimal, and what keeps it minimal
        is that every value a richer entry document could hold belongs to a layer
        that can carry a per environment value while this one cannot. This file is
        copied verbatim into the bundle, and Vite rewrites only the script
        reference, so a value written here would be identical in every environment
        whether or not that is correct. Styling therefore lives in
        ui/src/theme/antdTheme.ts, response headers in ui/nginx.conf and in the
        CloudFront response headers policy, and configuration in import.meta.env,
        whose values Vite inlines into the bundle at build time from the variable
        names documented in ui/.env.example.
      - Assumptions: the bundle is built once per environment, not once in total.
        Vite resolves import.meta.env while building, so each VITE_ prefixed value
        becomes a literal in the emitted JavaScript and the artifact is specific to
        the environment whose variables were present at that moment. This document
        is byte identical across those builds; the JavaScript it loads is not.
        Reading it as evidence that one built bundle serves every environment would
        be a mistake, and a costly one, because such a bundle would address
        whichever API origin happened to be inlined first.
    - Assumptions: no comment in this file may contain two consecutive hyphens.
      The HTML grammar forbids that sequence inside a comment body, and a parser
      or minifier that meets it may close the comment early and spill the rest
      of the prose into the rendered page. The rules above therefore use '='
      where the house header template in .github/workflows/tests.yml uses a rule
      of hyphens, and this repository's double hyphen dash idiom, which occurs
      20 times in that one workflow, is spelled out in words here instead.
    - Trade-offs: the doctype is written in lower case. The HTML doctype is ASCII
      case insensitive, so both spellings select standards mode identically and
      nothing observable turns on the choice; but Prettier 3, which this package
      runs through its format script, normalises the doctype to lower case and
      offers no option to disable that. Upper case would therefore be the only
      formatting complaint in this file and would fail the format gate in CI,
      and anyone who ran the formatter in write mode would silently flip it back
      and produce a diff nobody asked for. Please do not upper case it again.
  =============================================================================
-->

<!--
  Assumptions: the document language is fixed because the
  migration carries every user visible string across character for character
  (AAP transformation rule T8), and every one of those strings is English: the
  three PIC X(40) title constants in app/cpy/COTTL01Y.cpy, the PIC X(50) common
  messages in app/cpy/CSMSG01Y.cpy, and the sign on messages in
  app/cbl/COSGN00C.cbl. No localisation layer is in scope, so there is no second
  language for the document to choose between, and assistive technology can be
  told the language outright instead of guessing it from the content.
-->
<html lang="en">
  <head>
    <!--
      Assumptions: the encoding declaration comes first because
      the parser has to know the encoding before it reads any byte that could be
      decoded wrongly, and byte for byte fidelity of the baseline's strings is
      this application's whole premise. The ETL half of the same migration
      decodes the 13 EBCDIC seed datasets per fixed width field rather than per
      record for the identical reason: a decoding mistake raises no error, it
      silently produces plausible wrong characters.
    -->
    <meta charset="UTF-8" />

    <!--
      Trade-offs: a responsive viewport replaces the 3270
      original is a fixed 24 by 80 character cell canvas, declared as
      DFHMDI SIZE=(24,80) in 17 of the 17 base mapsets, which between them
      position all 902 of their DFHMDF fields absolutely by POS=(row,column).
      AAP gap G1 records the deliberate deviation: reproducing absolute
      character positioning in a browser would be both hostile to accessibility
      and impossible to make responsive, so field grouping, reading order and
      tab order are preserved while positioning of one pixel per character is
      not. This tag is where that deviation becomes visible, because it is what
      lets the antd Layout reflow to the device width instead of leaving the
      browser to scale a fixed canvas.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Assumptions: the icon path names no directory. Vite copies the contents of
      ui/public verbatim to the root of the build output, so a favicon authored
      there is served as /favicon.svg and the directory it was authored in forms
      no part of any served path. Naming that directory in the path here is the
      single most common mistake with Vite's public directory, and it resolves in
      no environment at all, because such a path does not exist once the bundle
      is built.
        Assumptions: the icon is not content hashed, because Vite copies the public
        directory without rewriting names. Both delivery layers account for that by
        serving it with a short revalidated lifetime rather than the immutable year
        the hashed bundle gets, so replacing the icon takes effect. A request for it
        when the file is absent is answered 404 by both layers, not with this
        document, so a missing icon is reported as a missing icon.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Assumptions: this text is the trimmed CCDA-TITLE02 constant
      from app/cpy/COTTL01Y.cpy line 22, declared
      PIC X(40) VALUE '              CardDemo                  '. The 14 leading
      and 18 trailing spaces are the centring of a 40 column 3270 title field,
      which the browser tab has no use for, so the tab takes the trimmed value.
      Line 21 of that copybook holds a disabled variant reading
      'Credit Card Demo Application (CCDA)' that is also exactly 40 characters
      long, so nothing but the '*' in column 7 marks it dead; it is not the live
      value and is not used here. ui/src/messages/messages.ts owns the same
      constant at run time and states that this file must agree with it, which
      it does: SCREEN_TITLES.TITLE02.text trimmed is the text below.
    -->
    <title>CardDemo</title>

    <!--
      Refactoring Rationale: this element was absent, and its absence was reported
      by an automated audit as a missing description rather than as a decision. The
      block below on progressive-web-app, Open Graph and card metadata argues that
      this application is never a public, shareable or installable page and that
      each of those tags would buy an asset request nothing consumes. That argument
      does not extend to this tag, and the difference is what it costs: a
      description is inert text in a document already being fetched, so it adds no
      request, no script and no third party, and it is what a browser's history,
      bookmark list and tab preview show when the title alone is one word.
      Assumptions: the text is a plain statement of what the application is and
      names nothing internal -- no module path, no route, no endpoint, no field
      inventory. That constraint is the point rather than a nicety: this element
      SURVIVES into the emitted bundle, unlike the commentary around it, which
      ui/vite.config.ts strips from the served document precisely because it names
      such things.
      Trade-offs: the text duplicates nothing and so can agree with nothing
      mechanically -- there is no baseline constant for "what this application is",
      the way COTTL01Y.cpy holds the title above. It is therefore prose, and it is
      kept to one sentence so a future reader has one sentence to keep true.
    -->
    <meta
      name="description"
      content="CardDemo credit card administration: account, card, transaction, bill payment, authorization and reporting screens."
    />

    <!--
      Alternatives Considered: no stylesheet is linked because antd 6 defaults to
      pure CSS variables theming and injects the styles it needs at run time, so
      unlike its earlier majors it publishes no stylesheet for an application to
      import. Adding a reset sheet or a bespoke one was the alternative, and it
      was rejected because it would put design values in a second place beside
      ui/src/theme/antdTheme.ts, which breaks both the rule that every value
      resolves to an antd theme variable rather than to a literal, and the rule
      that theming happens in exactly one place.

      Refactoring Rationale: the block below is the ONE exception to that, and it
      is admitted because it carries no design value at all. It holds a user agent
      margin reset and the viewport sizing of the mount point, which are the two
      things a document owns and a component cannot: neither is a colour, a spacing
      step, a radius, a typographic value or a motion duration, so neither can
      resolve to an antd token and neither competes with ui/src/theme/antdTheme.ts.
      What it replaces is a minHeight of 100dvh written inline in
      ui/src/layout/AppShell.tsx, which was flagged there as an unresolved literal
      and which a browser measurement showed produced a permanent 16px vertical
      scrollbar: the frame was exactly one viewport tall and the user agent's own
      body margin of 8px added 8px above and below it. Compensating inside the
      component was rejected outright, because subtracting one document's margin
      from a component's height encodes that document into every other document
      that might mount the component, and it becomes wrong the moment a reset
      arrives.
    -->
    <style>
      /*
        Assumptions: the reset is confined to the three elements that wrap the
        application - the two the user agent gives a margin to, and the mount point
        - rather than being a general reset. A wildcard reset would silently
        override padding the design system's own components set on themselves,
        which is the failure mode a reset sheet is usually blamed for; naming three
        elements cannot reach a component.

        Trade-offs: the mount point is sized in dvh, which is a literal, and it is
        accepted HERE and nowhere else because the design system publishes no token
        that can express "as tall as the window" - its scales cover colour, spacing,
        radius, typography and motion. dvh rather than vh is used because a mobile
        browser's dynamic toolbar makes vh overshoot the visible area, which would
        push the shell's row-24 key legend out of sight on exactly the narrow
        viewports the responsive reflow exists to serve.

        Assumptions: the mount point is a flex column, which is what lets the shell
        fill it. antd's own layout primitive sets flex: auto on itself, so a Layout
        rendered as this element's child stretches to the full height without the
        shell declaring any height of its own - preserving the property the removed
        declaration existed for, that the key legend sits at the bottom edge of the
        display exactly as terminal row 24 always did.
      */
      html,
      body {
        margin: 0;
      }

      /*
        WHY : Assumptions: the min-height below is the ONE layout value in this
        application that no antd token can express, and it is registered as such
        rather than merely written here - ui/src/theme/tokens.ts records it at
        ADDITIVE_LAYOUT_VALUES.viewportMinimumHeight and states its evidence under
        design gap G8, whose resolution names THIS declaration as the owner. The
        register is documentation and this rule is the mechanism, so the two are
        held in agreement mechanically: ui/src/layout/appShell.test.tsx reads this
        file and asserts that the mount point declares exactly the registered value,
        that the body margin reset above is still present - the other half of the
        measured 16px scrollbar - and that AppShell declares no competing height.

        Trade-offs: two records of one value can drift, which is the defect that
        removal of a duplicate registry in tokens.ts corrected. It is accepted here
        because a stylesheet cannot import a TypeScript constant, and the choice was
        between an unreferenced literal and a literal with a named owner plus a test
        that fails when they disagree.
      */
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
      }
    </style>

    <!--
      Trade-offs: a progressive web app
      manifest, an Apple touch icon, Open Graph and Twitter card metadata, and a
      tag manager or usage tracking snippet are all absent because this
      application sits behind a JWT authorizer at the gateway and is never a
      public, shareable or installable page, so each would buy an asset request
      that nothing consumes. A content security policy meta element is absent
      for two sharper reasons. A meta element cannot express the whole policy:
      frame ancestors is ignored in meta form, and Strict Transport Security is
      not a policy directive at all, so the document could carry only part of what
      the two delivery layers already carry in full. And a third copy is a third
      thing to keep in step: this document is copied verbatim into the bundle, so
      a policy written here would have to be reconciled by hand with ui/nginx.conf
      and with the CloudFront response headers policy every time any of the three
      changed. Those two having drifted apart from each other is precisely the
      defect that made this file's own delivery contract wrong, so adding a third
      source would widen the problem rather than help. Response headers are
      therefore set only at the layers that serve the document, in ui/nginx.conf
      for the container and in the CloudFront response headers policy for the
      distribution.
    -->
  </head>

  <body>
    <!--
      Assumptions: this id and no other, because ui/src/main.tsx resolves its
      mount point with document.getElementById('root') and passes the result to
      createRoot. Nothing verifies that the two spellings agree while the bundle
      is built, so a rename fails at run time instead: React finds no container,
      mounts nothing, and the page renders blank with only a console error to
      account for it. The element is authored empty because the entire tree,
      the antd ConfigProvider that applies the theme included, is constructed in
      that module rather than here; this document contributes the mount point and
      nothing else.
    -->
    <div id="root"></div>

    <!--
      Assumptions: the module path is root relative because Vite resolves a leading
      slash against the project root, which here is ui, making this the
      documented form and the entry of the module graph. The alternative, a
      document relative path written with a leading dot and slash, resolves
      against the URL of the page instead, so it drifts the moment the built
      document is served from a nested path, which is precisely what the nginx
      and CloudFront history fallback does when it returns this document for a
      deep route such as /cards/:opaqueCardId. The module type is what makes the browser
      request the file as an ES module; the build rewrites this reference to the
      content hashed bundle it emits.

      Trade-offs: naming the entry here rather than letting a bundler discover it
      means the reference and the file it names can disagree. That is accepted
      because the disagreement is never silent: Vite treats a missing entry as a
      build failure rather than emitting a document whose script tag resolves to
      nothing, so the mistake surfaces at build time in CI instead of as a blank
      page in a browser. The loud failure is the reason this form is chosen.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
