# =============================================================================
# ui/nginx.conf
# -----------------------------------------------------------------------------
# Purpose:
#   Static-serving configuration for the CardDemo single-page application: the
#   React 19 and TypeScript front end that replaces all 21 CICS/BMS online
#   screens, being the 17 base mapsets under app/bms plus the 4 extension
#   mapsets. Where the CICS region sent a 3270 datastream to a terminal -- the
#   sign-on canvas is declared DFHMDI SIZE=(24,80) in app/bms/COSGN00.bms --
#   this file serves a built JavaScript bundle to a browser. It is that
#   terminal's replacement delivery path, which is the reason a static-file
#   server appears in a mainframe migration at all.
#
#   Four things are settled here and nothing else: that every one of the 21
#   client-side routes resolves to the one built document, how long each class
#   of file may be cached, what a container health probe receives, and which
#   response headers accompany every reply.
#
#   FORM AND DESTINATION, stated here because nothing checks either. This file
#   is a SERVER-BLOCK FRAGMENT, not a whole nginx.conf: it declares no `events`
#   and no `http` block and cannot start a server by itself. ui/Dockerfile must
#   copy it to /etc/nginx/conf.d/default.conf inside its nginx:1.30.4-alpine
#   runtime stage. That exact path matters twice over. The stock image's
#   /etc/nginx/nginx.conf ends with `include /etc/nginx/conf.d/*.conf;`, so any
#   name ending in .conf placed there is loaded -- but the image also SHIPS a
#   default.conf whose own server block listens on port 80 and roots itself at
#   the same document root. Copying this file over that name replaces it, while
#   copying it under any other name leaves both server blocks live. Copying it
#   to /etc/nginx/nginx.conf instead is refused outright rather than degrading:
#   nginx reports `"server" directive is not allowed here`, because a server
#   block is valid only inside an http context and this file deliberately
#   supplies none.
#
#   The counterpart contracts are that ui/vite.config.ts builds to `dist` and
#   leaves `base` at the site root, and that ui/Dockerfile copies that `dist`
#   directory to /usr/share/nginx/html and runs the container as a non-root
#   user.
#
# WHY (non-obvious design decisions):
#   - Alternatives Considered: a complete nginx.conf replacing the image's own
#     was evaluated and rejected. The stock /etc/nginx/nginx.conf supplies three
#     things this fragment inherits and would otherwise have to restate --
#     `include /etc/nginx/mime.types`, the `main` log format, and the worker and
#     keepalive settings. Restating them freezes a copy that a base-image patch
#     can no longer improve, and it grows the surface this file has to keep
#     correct for no gain, because nothing below needs a directive that only the
#     main or events context accepts.
#   - Assumptions: the same bundle is delivered two ways and both must classify a
#     request identically. This container is one path; the other is a CloudFront
#     distribution over a private S3 bucket reached by an origin access control,
#     where the same decision is made by a viewer-request function that rewrites a
#     path to /index.html only when its last segment carries no dot. The locations
#     below apply that identical test with a regular expression, so a client route
#     is answered with the entry document under 200 on both paths and a missing
#     file is answered 404 on both. The mechanisms differ because the platforms
#     differ; the observable behaviour does not, and a change to routing made here
#     and not in infra/modules/cloudfront-spa would leave the two paths
#     disagreeing -- with each still looking correct when tested alone, which is
#     how the previous divergence survived.
#   - Alternatives Considered: no `proxy_pass`, no `upstream` and no API
#     forwarding appears anywhere below, and that absence is a decision. The SPA
#     addresses the API through the absolute base URL supplied as
#     VITE_API_BASE_URL, whose name ui/.env.example documents and whose value
#     names the gateway fronting the internal load balancer. Proxying the API
#     through this container would insert a second, undocumented hop, would let
#     browser traffic reach the services without passing the gateway's JWT
#     authorizer, and would couple two independently deployed tiers through a
#     file baked into an image. ui/vite.config.ts rejects a dev-server proxy on
#     matching grounds, so development and production agree on one topology.
#   - Assumptions: TLS terminates upstream, at the CloudFront distribution or at
#     the load balancer, so no `listen 443 ssl`, no `ssl_protocols` and no
#     certificate path appears below. A certificate path here would name a
#     private key inside a container image, which is the one thing this
#     repository must never carry. Strict-Transport-Security is left to that
#     same upstream, and for a sharper reason than tidiness: this origin is
#     reached over the proxy's cleartext leg and cannot know whether the
#     browser's own connection was encrypted, so a policy asserted from here
#     would be a claim it has no evidence for.
#   - Assumptions: nothing environment-specific may appear in this file, and the
#     reason is that this file is the part of the image that does NOT vary. A
#     hostname, an endpoint, an account identifier or a credential written here
#     would be both wrong somewhere and public everywhere.
#     What varies is the bundle these bytes serve, and it varies at BUILD time,
#     not at run time: Vite inlines every VITE_-prefixed value into the emitted
#     JavaScript as a literal, so `vite build` runs once per environment and each
#     environment gets its own image wrapping its own bundle. No environment
#     variable set on this running container is read by the browser, and there is
#     no substitution step after the build that could supply one. The single
#     exception where this file must nonetheless name a per-environment value is
#     the Content-Security-Policy `connect-src` directive, and it is handled by
#     stating the same-origin base here and declaring the API origin in the
#     CloudFront policy; the header block below argues that case at the directive
#     itself rather than in the abstract here.
# =============================================================================

server {
    # Assumptions: port 8080 is bindable by the required non-root runtime and
    # matches the task definition, target group, and security-group contract.
    listen 8080;

    # Assumptions: the upstream edge owns environment-specific hostnames, so the
    # image accepts any host routed to this server.
    server_name _;

    # Assumptions: the runtime image must copy Vite's dist output to the stock
    # nginx document root or the image will serve its welcome page instead.
    root /usr/share/nginx/html;

    # Assumptions: Vite emits index.html and no index.htm alternative.
    index index.html;

    # Assumptions: suppressing the version banner reduces passive
    # reconnaissance without replacing image patching.
    server_tokens off;

    # Assumptions: directory listings stay off so that /assets/ cannot be
    # enumerated. What that protects is the inventory, not the contents: every
    # file under it is already retrievable by name, and index.html names the ones
    # the application needs, so the value of the directive is that it does not
    # hand a reader the complete set of hashed filenames -- including any left
    # behind by a partial deploy -- in one request. nginx already defaults to off,
    # and the default is written out because a later editor enabling listings for
    # convenience would withdraw that property silently.
    #
    # Refactoring Rationale: this directive was previously justified as the thing
    # that made published source maps safe, on the ground that a map is served
    # only as a named request and never advertised by a listable directory. That
    # ground was false: a bundle's own `sourceMappingURL` comment names its map, so
    # the URL was never unguessable and disabling listings withheld nothing. The
    # premise has been removed rather than re-argued -- ui/vite.config.ts now sets
    # `sourcemap` to false, so no map is emitted and none can be requested from
    # here at all. The regular-expression location below answers a request for one
    # with 404 like any other missing file.
    autoindex off;

    # Assumptions: locations that add Cache-Control repeat this security set
    # because nginx replaces inherited add_header values rather than appending.

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Frame-Options "DENY" always;

    # Assumptions: only the origin, never the path, is disclosed as a referrer
    # to another site. This matters more here than the header's ubiquity
    # suggests. The migration moves the baseline's selection context into the
    # URL -- but protected selectors are opaque rather than copied from
    # CDEMO-ACCT-ID, CDEMO-CARD-NUM or CDEMO-CUST-ID in app/cpy/COCOM01Y.cpy.
    # Card routes use /cards/:opaqueCardId, so neither same-origin access logs
    # nor a cross-origin referrer can receive a PAN from the address bar.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Refactoring Rationale: this policy previously carried only the four
    # capability directives and deferred every resource-loading directive to the
    # CloudFront response-headers policy. The reasoning was that the API origin is
    # not knowable when this image is built, which is true, but the conclusion did
    # not follow: only `connect-src` depends on that origin, and deferring the rest
    # with it meant this path enforced no `script-src` at all. `script-src 'self'`
    # is the directive that actually blunts injected script, so withholding it left
    # the most valuable half of the policy unenforced on this delivery path while
    # the header read as though a policy were in force. Worse, the deferral pointed
    # at a policy that did not carry these directives either, so between the two
    # paths no resource-loading rule was enforced anywhere.
    #
    # Assumptions: every directive below except `connect-src` is
    # environment-invariant, so it is correct in every environment and no
    # configuration can invalidate it. `script-src 'self'` holds because the bundle
    # is the only script and ui/index.html carries no inline script element.
    # `style-src` must keep 'unsafe-inline': antd 6 themes through CSS variables and
    # injects the styles it needs at run time, so removing it would strip the design
    # system from every screen. A nonce or a hash is the stronger form and is not
    # available here, because the style elements are created by the browser at run
    # time and neither this server nor the static document can know their content
    # in advance. `img-src` and `font-src` admit `data:` because inlined assets are
    # emitted as data URIs. `object-src 'none'`, `base-uri 'self'`, `form-action
    # 'self'` and `frame-ancestors 'none'` constrain capabilities this application
    # never exercises, the last being the modern specified form of the
    # X-Frame-Options above, which is retained because it is what older browsers
    # honour.
    #
    # Trade-offs: `connect-src` is the ONE directive that cannot be identical on
    # both paths, and it is resolved by narrowing rather than by omission. This
    # image states the tightest environment-invariant form, `'self' https:`, which
    # still forbids cleartext and WebSocket exfiltration while permitting the
    # cross-origin HTTPS API whose hostname it cannot know. The CloudFront policy in
    # infra/modules/cloudfront-spa/main.tf states the same directive narrowed to the
    # exact API origins for that environment, supplied as a module input. So the two
    # policies differ in exactly one directive, in one direction, and the
    # distribution is the stricter of the two -- which is the correct asymmetry,
    # since it fronts the deployed application.
    #
    # Alternatives Considered: declaring the policy once in an nginx variable and
    # referencing it from each location, instead of repeating the literal in all
    # five places. Rejected on failure mode rather than on style: `add_header`
    # evaluates a variable at output time, so any path where it resolved empty would
    # emit `Content-Security-Policy:` with no value, which a scanner records as
    # present and a browser enforces as nothing. A repeated literal cannot fail that
    # way. The five copies must stay byte-identical, which is the accepted cost, and
    # it is the same cost the four headers above already pay for the same reason:
    # `add_header` in a location REPLACES the inherited set rather than extending it.
    # ui/index.html reaches this same conclusion from its own side, declining to
    # carry a policy meta element and naming this file and the distribution as where
    # such headers belong.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Trade-offs: dynamic gzip spends small origin CPU to reduce JavaScript, CSS,
    # JSON, and SVG transfer size. gzip_static is excluded because Vite emits no
    # precompressed siblings.
    gzip on;

    # Assumptions: both JavaScript MIME spellings are retained across nginx
    # versions; already-compressed binary formats are intentionally excluded.
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        image/svg+xml;

    # Assumptions: shared caches must vary representations by Accept-Encoding.
    gzip_vary on;

    # Assumptions: deployed requests are proxied and may carry Via, so compression
    # must not be limited to direct requests.
    gzip_proxied any;

    # Trade-offs: responses below one kilobyte avoid compression framing and CPU
    # that can exceed the saved bytes.
    gzip_min_length 1024;

    # Assumptions: the runtime image and target group must both probe this exact
    # path; changing it requires coordinated updates to those consumers.
    location = /healthz {
        # Assumptions: a literal response tests nginx routing without coupling
        # server health to a particular bundle file or backend dependency.
        return 200 "ok\n";

        # Assumptions: default_type avoids a duplicate Content-Type header and
        # preserves inherited security headers.
        default_type text/plain;

        # Trade-offs: continuous probes are omitted from access logs to control
        # noise and storage; the orchestrator still records health transitions.
        access_log off;
    }

    # Assumptions: index.html keeps a stable name while referencing new hashed
    # assets on each deploy, so storing it can strand clients on removed names.
    location = /index.html {
        # Assumptions: no-store prevents reuse; must-revalidate protects against
        # intermediaries that retain a copy despite that directive.
        add_header Cache-Control "no-store, must-revalidate" always;

        # Assumptions: Cache-Control suppresses inherited add_header values, so
        # the server-level security set must be repeated verbatim.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Alternatives Considered: a file-extension rule would also capture stable
    # public names such as /favicon.svg. The /assets/ boundary contains only
    # content-hashed build output and remains stable as asset types change.
    location ^~ /assets/ {
        # Assumptions: content hashes make successful asset responses immutable.
        # `always` is omitted so a rolling-deployment 404 is never cached for a
        # year.
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Assumptions: Cache-Control suppresses inherited add_header values.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # -------------------------------------------------------------------------
    # Static files anywhere else -- a miss here is a 404, never the SPA document
    # -------------------------------------------------------------------------

    # Assumptions: this location exists to keep the history fallback below from
    # answering a request for a FILE. The regular expression matches any URI whose
    # last path segment contains a dot, which is the same test the CloudFront
    # viewer-request function applies in infra/modules/cloudfront-spa/main.tf, so
    # both delivery paths classify a request identically. Requests that reach it
    # are the un-hashed files Vite copies verbatim from ui/public to the site
    # root -- /favicon.svg today -- plus anything dotted that does not exist.
    #
    # Assumptions: matching on a dotted last segment rather than on a list of
    # extensions is what makes the classification total. An allow-list would leave
    # every unlisted extension falling through to the fallback, so /logo.bmp would
    # still be answered with HTML while /logo.svg was not, and the two delivery
    # paths would disagree again for exactly the inputs nobody thought to list. A
    # path such as /foo.bar/baz is correctly NOT matched: its last segment carries
    # no dot, so it is a client route, and the function above agrees.
    #
    # This is the regular-expression location the /assets/ block above anticipated
    # when it chose `^~`. That prefix is settled before regular expressions are
    # considered, so hashed bundle requests never reach here and keep their
    # immutable year; this location governs the site root only. The cache argument
    # made there still stands unchanged -- an extension-matched IMMUTABLE rule
    # would pin a stale /favicon.svg into browsers for a year -- which is why the
    # policy below is the short revalidated one and not that year.
    location ~ \.[^/]*$ {
        # Assumptions: a missing file is answered 404 and nothing else. This is
        # the line that closes the defect: without it these requests fell through
        # to the fallback below and a mistyped or undeployed asset was answered
        # with the application document under HTTP 200. A browser then parsed HTML
        # as JavaScript, an image, or a stylesheet and reported a syntax error or a
        # broken image, so the diagnosis pointed at the asset's contents instead of
        # at its absence -- and a monitor watching status codes saw a healthy 200
        # for a request that had failed. `=404` restores the honest status.
        try_files $uri =404;

        # Trade-offs: the short revalidated lifetime is carried over from the
        # fallback location that used to serve these files, so the caching
        # behaviour of /favicon.svg is unchanged by this location existing. It
        # cannot be lengthened: Vite copies ui/public to the site root WITHOUT
        # hashing, so these names are reused across deploys and a long lifetime
        # would leave a replaced file unreachable. A short window still spares the
        # repeat requests a no-store policy would force, and it applies
        # automatically to any file later added to ui/public.
        #
        # Assumptions: `always` is omitted for the reason argued at the /assets/
        # location -- a lifetime describes a successful representation, so the 404
        # this location now returns must not inherit one.
        add_header Cache-Control "public, max-age=300, must-revalidate";

        # Assumptions: this one rationale governs all FOUR headers below.
        # They restate the server-level set because the Cache-Control above
        # suppresses inheritance of it; what each header prevents is argued
        # once at its server-level declaration rather than copied here. They keep
        # `always` so the 404 responses this location returns carry them too.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location / {
        # Assumptions: the 21 routes of this application are resolved in the
        # browser and NONE of them is a file in the document root. The build
        # emits index.html and a hashed asset directory and nothing else, so
        # /account/update, /cards/:opaqueCardId, /authorizations/:key and every other
        # route names no path on disk. Clicking through the application never
        # reveals this, because the router answers those navigations without a
        # request reaching this server at all. Refreshing the page, restoring a
        # bookmark or opening a deep link does issue the request -- GET
        # /account/update -- and without the final parameter below nginx looks
        # for that file, does not find it, and returns 404. The application would
        # then appear broken on every refresh while working perfectly under
        # every click, which is why this line and not any other is the reason
        # this file exists.
        #
        # Assumptions: only client routes reach this location now. Every URI whose
        # last segment carries a dot is claimed by the regular-expression location
        # above, and the hashed bundle is claimed by /assets/ before that, so the
        # fallback can no longer be reached by a request for a file. That is what
        # makes applying it unconditionally safe: the requests left here are
        # extensionless paths, and none of the 21 routes is a file on disk.
        #
        # The two earlier parameters are retained rather than needed. The build
        # emits no extensionless file and no directory below the root, so `$uri`
        # and `$uri/` do not match in practice; they are kept so that a real file
        # would still win over the fallback if one were ever added, which is the
        # conservative order. The fallback then applies to every remaining path, so
        # an unrecognised route is answered with the application document and the
        # router renders its own not-found screen -- which is the correct outcome
        # for a route, and precisely the wrong one for a file.
        #
        # Refactoring Rationale: this fallback previously ran for dotted paths too,
        # so a mistyped or undeployed asset such as /logo.svg was answered with HTML
        # under HTTP 200. The exclusion was declined at the time on the grounds that
        # the CloudFront path expressed the same fallback as a blanket custom error
        # response that could not discriminate by extension, so excluding here alone
        # would have made the two delivery paths answer one request two ways. That
        # reasoning was sound and the conclusion was not: the fix was to give
        # CloudFront the discrimination it lacked rather than to keep this path
        # equally wrong. It now has a viewer-request function applying the same
        # dotted-last-segment test, so both paths classify identically AND both
        # return an honest 404 for a missing file.
        #
        # Assumptions: the fallback is an internal redirect, so location matching
        # runs again for /index.html and the no-store policy defined above
        # applies to the response. That is required rather than incidental: the
        # deep-link and refresh requests users actually make are served through
        # this path, so if the fallback response were cacheable the staleness
        # problem described above would return by the back door.
        try_files $uri $uri/ /index.html;

        # Assumptions: this header does NOT govern the fallback response. The
        # fallback's final parameter is a URI, so nginx performs an internal
        # redirect, location matching runs again for /index.html, and the no-store
        # policy declared at that exact-match location applies instead. Keeping
        # /index.html LAST in the try_files list is what preserves that: named as
        # an earlier parameter it would be served in place and the SPA document
        # would inherit this five-minute lifetime instead, reintroducing exactly
        # the staleness the no-store exists to prevent through an ordering change
        # that looks cosmetic.
        #
        # What it does govern is the residual case: an extensionless real file or a
        # directory index, if either is ever added. Root static files no longer
        # reach this location at all, having been claimed by the
        # regular-expression location above, which carries this same short
        # revalidated policy so that /favicon.svg is cached exactly as it was
        # before that location existed.
        #
        # Assumptions: `always` is omitted for the same reason as in the /assets/
        # location -- a lifetime describes a successful representation, and an
        # error is not that representation, so it must not inherit one. The
        # exposure here is five minutes rather than a year, but the principle is
        # what keeps the locations reading consistently. The no-store on
        # index.html above is the one caching header that DOES keep `always`,
        # because forbidding storage can only ever protect an error response.
        add_header Cache-Control "public, max-age=300, must-revalidate";

        # Assumptions: Cache-Control suppresses inherited add_header values.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
