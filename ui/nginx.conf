# =============================================================================
# ui/nginx.conf
# -----------------------------------------------------------------------------
# Purpose:
#   Static-serving configuration for the CardDemo single-page application: the
#   React 19 and TypeScript front end that replaces all 21 CICS/BMS online
#   screens, being the 17 base mapsets under app/bms plus the 4 extension
#   mapsets. Where the CICS region sent a 3270 datastream to a terminal -- the
#   sign-on canvas is declared DFHMDI SIZE=(24,80) in app/bms/COSGN00.bms --
#   this file serves a built JavaScript bundle to a browser. It is that
#   terminal's replacement delivery path, which is the reason a static-file
#   server appears in a mainframe migration at all.
#
#   Four things are settled here and nothing else: that every one of the 21
#   client-side routes resolves to the one built document, how long each class
#   of file may be cached, what a container health probe receives, and which
#   response headers accompany every reply.
#
#   FORM AND DESTINATION, stated here because nothing checks either. This file
#   is a SERVER-BLOCK FRAGMENT, not a whole nginx.conf: it declares no `events`
#   and no `http` block and cannot start a server by itself. ui/Dockerfile must
#   copy it to /etc/nginx/conf.d/default.conf inside its nginx:1.30.4-alpine
#   runtime stage. That exact path matters twice over. The stock image's
#   /etc/nginx/nginx.conf ends with `include /etc/nginx/conf.d/*.conf;`, so any
#   name ending in .conf placed there is loaded -- but the image also SHIPS a
#   default.conf whose own server block listens on port 80 and roots itself at
#   the same document root. Copying this file over that name replaces it, while
#   copying it under any other name leaves both server blocks live. Copying it
#   to /etc/nginx/nginx.conf instead is refused outright rather than degrading:
#   nginx reports `"server" directive is not allowed here`, because a server
#   block is valid only inside an http context and this file deliberately
#   supplies none.
#
#   The counterpart contracts are that ui/vite.config.ts builds to `dist` and
#   leaves `base` at the site root, and that ui/Dockerfile copies that `dist`
#   directory to /usr/share/nginx/html and runs the container as a non-root
#   user.
#
# WHY (non-obvious design decisions):
#   - Alternatives Considered: a complete nginx.conf replacing the image's own
#     was evaluated and rejected. The stock /etc/nginx/nginx.conf supplies three
#     things this fragment inherits and would otherwise have to restate --
#     `include /etc/nginx/mime.types`, the `main` log format, and the worker and
#     keepalive settings. Restating them freezes a copy that a base-image patch
#     can no longer improve, and it grows the surface this file has to keep
#     correct for no gain, because nothing below needs a directive that only the
#     main or events context accepts.
#   - Assumptions: the same bundle is delivered two ways and both must implement
#     the same history fallback. This container is one path; the other is a
#     CloudFront distribution over a private S3 bucket reached by an origin
#     access control, where the fallback is expressed as a custom error response
#     mapping 403 and 404 to /index.html rather than as `try_files`. The
#     mechanisms differ, the contract does not, so a change to routing behaviour
#     made here and not in infra/modules/cloudfront-spa leaves the two paths
#     disagreeing -- and each of them still looks correct when tested alone.
#   - Alternatives Considered: no `proxy_pass`, no `upstream` and no API
#     forwarding appears anywhere below, and that absence is a decision. The SPA
#     addresses the API through the absolute base URL supplied as
#     VITE_API_BASE_URL, whose name ui/.env.example documents and whose value
#     names the gateway fronting the internal load balancer. Proxying the API
#     through this container would insert a second, undocumented hop, would let
#     browser traffic reach the services without passing the gateway's JWT
#     authorizer, and would couple two independently deployed tiers through a
#     file baked into an image. ui/vite.config.ts rejects a dev-server proxy on
#     matching grounds, so development and production agree on one topology.
#   - Assumptions: TLS terminates upstream, at the CloudFront distribution or at
#     the load balancer, so no `listen 443 ssl`, no `ssl_protocols` and no
#     certificate path appears below. A certificate path here would name a
#     private key inside a container image, which is the one thing this
#     repository must never carry. Strict-Transport-Security is left to that
#     same upstream, and for a sharper reason than tidiness: this origin is
#     reached over the proxy's cleartext leg and cannot know whether the
#     browser's own connection was encrypted, so a policy asserted from here
#     would be a claim it has no evidence for.
#   - Assumptions: nothing environment-specific may appear in this file. It is
#     baked into a container image and the identical bytes run in every
#     environment, so a hostname, an endpoint, an account identifier or a
#     credential written here would be both wrong somewhere and public
#     everywhere. Everything that varies is supplied at run time -- to the
#     browser through the VITE_-prefixed variables, and to the platform through
#     the load balancer and gateway in front of this container.
# =============================================================================

server {
    # Assumptions: 8080 is chosen because it is above 1024 and so is bindable
    # without privilege. ui/Dockerfile runs this container as a non-root user,
    # and a non-root master process cannot bind a port below 1024, so `listen
    # 80` here would not merely be unconventional -- it would fail at startup
    # with a permission error and the container would never become healthy. The
    # number is not free either: the task definition and target group expect
    # 8080, and the security-group design admits traffic from the load balancer
    # to the application on that port alone, so any other non-privileged port
    # would start cleanly and then receive nothing.
    listen 8080;

    # Assumptions: the catch-all name accepts whatever Host header arrives. This
    # container is reached only through the load balancer or the distribution in
    # front of it, and each environment presents a different hostname, so
    # matching a literal domain would make the image environment-specific and
    # would leave the wrong environment's requests falling through to whatever
    # nginx treats as its default server.
    server_name _;

    # Assumptions: this is the nginx:alpine document root, and so it is the
    # destination ui/Dockerfile must copy `ui/dist` into; ui/vite.config.ts
    # fixes the source half by building to `dist`. Nothing verifies the pair,
    # and the failure mode is quiet rather than loud: the stock image ships its
    # own index.html at this path, so a copy that lands anywhere else leaves
    # nginx serving the nginx welcome page. The container starts, the health
    # probe passes, every route returns 200, and none of the application is in
    # any of them.
    root /usr/share/nginx/html;

    # Assumptions: one index name, where the stock configuration tries both
    # index.html and index.htm. This build emits no .htm file at all, so the
    # shorter list keeps a directory request from resolving to something the
    # build never produced.
    index index.html;

    # Assumptions: the version banner is withheld from responses and error
    # pages. nginx publishes its exact patch level by default, which hands a
    # scanner the list of published vulnerabilities worth trying without it
    # having to probe for any of them. Withholding it removes that free
    # reconnaissance; it is not a substitute for keeping the pinned base image
    # current, which is where the actual fix for any such vulnerability lives.
    server_tokens off;

    # Assumptions: directory listings stay off, and on this file that is
    # load-bearing rather than tidy. ui/vite.config.ts publishes source maps
    # beside the bundle and accepts exposing this application's own sources
    # explicitly, on the stated ground that a map is served only as a named
    # request and is never advertised by a listable directory. This directive is
    # what makes that ground true on this delivery path. nginx already defaults
    # to off, and the default is written out because a later editor enabling
    # listings for convenience would silently withdraw the premise that
    # decision rests on.
    autoindex off;

    # -------------------------------------------------------------------------
    # Response headers carried by every reply this server sends.
    #
    # Assumptions: nginx inherits `add_header` from an enclosing level ONLY for
    # as long as the inner level adds none of its own. The first `add_header` in
    # a location REPLACES this entire set rather than extending it, and the
    # `always` flag does not change that -- `always` governs whether a header
    # reaches an error response, not whether an inner level inherits. Every
    # location below that sets a Cache-Control therefore repeats these four
    # headers verbatim, and the repetition is deliberate rather than careless:
    # it is the only mechanism the stock image offers. The headers-more module's
    # `more_set_headers`, which does accumulate across levels, is not compiled
    # into nginx:1.30.4-alpine, and factoring the four lines into an `include`d
    # snippet would create a second file that ui/Dockerfile would also have to
    # copy -- turning one silent coupling into two.
    # -------------------------------------------------------------------------

    # Assumptions: the browser must honour the declared Content-Type rather than
    # inferring one from the bytes. Sniffing is what allows a response served as
    # one type to be executed as another, and with this whole application
    # delivered as script and JSON from this origin, withdrawing the browser's
    # licence to guess removes that class of confusion outright.
    add_header X-Content-Type-Options "nosniff" always;

    # Assumptions: no origin may frame this application. The UI is driven by a
    # bearer token the browser holds, so a page able to embed it in an invisible
    # frame could act on a signed-in user's behalf. DENY is chosen over
    # SAMEORIGIN because nothing in this system frames the SPA at all, so
    # same-origin framing is a capability there is no reason to keep open.
    add_header X-Frame-Options "DENY" always;

    # Assumptions: only the origin, never the path, is disclosed as a referrer
    # to another site. This matters more here than the header's ubiquity
    # suggests. The migration moves the baseline's selection context into the
    # URL -- CDEMO-ACCT-ID, CDEMO-CARD-NUM and CDEMO-CUST-ID in
    # app/cpy/COCOM01Y.cpy become path parameters such as /cards/:num -- so a
    # full-URL referrer would hand a real account or card number to any
    # third-party host the browser is subsequently sent to. Within this origin
    # the full path is still sent, where it is already known.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Alternatives Considered: a full content-security policy is deliberately
    # NOT set here, and the partial one below is a decision rather than a
    # half-finished job. A policy has two halves and only one of them is
    # knowable when this image is built. The directives listed constrain
    # capabilities this application never exercises, so they are correct in
    # every environment and no configuration can invalidate them: no plugin
    # content, no base-tag rewriting of relative URLs, no form submission
    # off-origin, and no framing -- that last being the modern specified form of
    # the X-Frame-Options above, which is retained because it is what older
    # browsers honour.
    #
    # The resource-loading half is left to the CloudFront response-headers
    # policy, where the API origin is known. `default-src 'self'` is the
    # intuitive addition and it would break the application outright:
    # `connect-src` falls back to it, and the API is a DIFFERENT origin supplied
    # per environment as VITE_API_BASE_URL, so every request the SPA makes would
    # be blocked -- and blocked only once deployed, since a developer serving
    # both halves from one origin would never see it. Naming that origin here
    # instead would bake one environment's endpoint into an image shared by all
    # of them. A second constraint applies to styles: antd 6 themes through CSS
    # variables and injects the styles it needs at run time, so a `style-src`
    # without 'unsafe-inline' would strip the design system from every screen.
    # ui/index.html reaches this same conclusion from its own side, declining to
    # carry a policy meta element and naming this file and the distribution as
    # where such headers belong.
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # -------------------------------------------------------------------------
    # Compression
    # -------------------------------------------------------------------------

    # Trade-offs: responses are compressed as they are sent, spending a little
    # CPU per request to cut transfer size. The exchange is worth making for
    # this bundle in particular -- an antd-based application ships a large
    # amount of JavaScript and CSS, both of which are text and compress by
    # roughly a factor of four -- and the cost lands on a container whose only
    # other work is reading files from disk. The inherited http context has this
    # switched off rather than on, so this is a change in behaviour and not a
    # default written out for emphasis.
    #
    # Alternatives Considered: precompression via `gzip_static`, which serves a
    # `.gz` sibling prepared once at build time instead of compressing on every
    # request, was evaluated and rejected. It requires the build to emit those
    # siblings, and ui/vite.config.ts emits none: its plugin list is closed at a
    # single entry and names a compression plugin among the additions it
    # declines. Enabling the directive without that build step is worse than
    # leaving it off, because nginx would silently fall through to serving the
    # uncompressed file and the configuration would read as though compression
    # were precomputed when it is not.
    gzip on;

    # Assumptions: the MIME type of a JavaScript response is spelled two ways
    # across nginx versions and both are listed on purpose. The pinned image
    # maps .js to application/javascript, while nginx changed that mapping to
    # text/javascript in a later mainline series; listing only the current
    # spelling would mean a base-image update quietly stops compressing the
    # largest files in the bundle, with nothing failing to reveal it. text/html
    # is absent because nginx compresses it whenever gzip is on, so listing it
    # would do nothing. The binary types this application serves -- the woff2
    # font format and the png and jpeg image formats -- are excluded because
    # they are already compressed, and passing them through the compressor would
    # spend CPU to make them marginally larger. image/svg+xml is included
    # despite sitting among the image types because an SVG is XML text.
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        image/svg+xml;

    # Assumptions: a shared cache must key its stored copy on the request's
    # Accept-Encoding. Without this header a cache that stored a compressed
    # response can hand those bytes to the next client whether or not that
    # client advertised gzip, and a client that did not advertise it has no
    # reason to inflate what it receives -- so the page arrives as unreadable
    # binary. Both delivery paths for this bundle sit behind a shared cache, so
    # the condition is routine here rather than hypothetical.
    gzip_vary on;

    # Assumptions: nginx does not compress a proxied request unless told to, and
    # every request this container ever sees is proxied. The default suppresses
    # compression for any request carrying a Via header, which CloudFront adds,
    # and this container is never reached directly -- the load balancer and
    # gateway in front of it are the only routes to it. Omitting this directive
    # therefore produces the most misleading failure available: compression
    # works perfectly against a local curl and never once engages in a deployed
    # environment.
    gzip_proxied any;

    # Trade-offs: responses under a kilobyte are sent uncompressed. gzip adds
    # framing of its own, so nginx's 20-byte floor lets it compress a response
    # too small to benefit and hand back MORE bytes than it was given, having
    # spent CPU to do so. A kilobyte is above the size at which that inversion
    # can happen while remaining far below any file in this bundle that matters,
    # so nothing worth compressing is excluded by it.
    gzip_min_length 1024;

    # -------------------------------------------------------------------------
    # Health probe
    # -------------------------------------------------------------------------

    # Assumptions: this path is a contract with two consumers that cannot see
    # each other -- the HEALTHCHECK instruction in ui/Dockerfile, and the health
    # check path configured on the load balancer's target group. Renaming it
    # here without renaming it in both of those places produces a container that
    # serves the application correctly and is nonetheless reported unhealthy and
    # replaced.
    location = /healthz {
        # Assumptions: a literal response is returned instead of a file on disk,
        # because what this probe must answer is whether nginx is accepting
        # connections and routing them, and a probe that reads a file also fails
        # whenever the file is missing -- conflating a dead server with an empty
        # document root. It is deliberately NOT an application health check
        # either: this container serves a static bundle and has no backend
        # dependency of its own to report on, so a probe that claimed to check
        # the application would be asserting something it cannot observe.
        return 200 "ok\n";

        # Assumptions: the type must be stated because the inherited http
        # context sets a binary default type, so this response would otherwise
        # be labelled application/octet-stream and a browser would offer to
        # download the word "ok" instead of showing it. `default_type` is used
        # rather than an added Content-Type header for two reasons: nginx sets
        # Content-Type itself, so adding one risks emitting the field twice; and
        # an `add_header` in this location would replace every inherited
        # security header, per the inheritance note above.
        default_type text/plain;

        # Trade-offs: this one path is exempt from the access log. The probe runs
        # continuously for the life of the container, so logging it buries real
        # request history under a monotonous majority and inflates the log
        # volume that the observability stack's log groups retain and bill for.
        # The cost accepted is that a probe failure leaves no access-log trace;
        # that is tolerable because the orchestrator records the health
        # transition itself, and because errors still reach the error log, which
        # this does not silence.
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Caching
    # -------------------------------------------------------------------------

    # Assumptions: index.html is the one file whose NAME is stable while its
    # CONTENT changes on every deploy, because it carries the hashed filenames
    # of the bundle it was built with. That asymmetry is the whole reason this
    # location exists. Were it cached, a returning browser would keep asking for
    # the previous deploy's asset filenames, and those names no longer exist
    # after the build that replaced them -- so the user gets a blank or broken
    # page until they force a reload, and the deploy appears simply not to have
    # happened. Serving it uncached costs one small conditional request per
    # navigation and makes every deploy take effect on the next one.
    location = /index.html {
        # Assumptions: no-store is chosen over no-cache, which permits storage
        # and only requires revalidation. A stored copy is exactly what must not
        # exist here, because the failure above happens when a browser reuses
        # this document at all rather than when it reuses it without asking.
        # must-revalidate accompanies it for any intermediary that stores the
        # response despite no-store. The `expires` directive is deliberately not
        # used alongside this: `expires` emits a Cache-Control of its own, so the
        # pair would send the field twice with conflicting directives inside it.
        add_header Cache-Control "no-store, must-revalidate" always;

        # Assumptions: this one rationale governs all FOUR headers below, which
        # restate the server-level set verbatim. They are repeated because the
        # Cache-Control above suppresses inheritance of that set, per the
        # inheritance note earlier in this file. What each individual header
        # prevents is argued once at its server-level declaration and is not
        # restated here, because four copies of one argument are four things
        # that can drift apart. This location serves every deep-link and refresh
        # request in the application, so it is the single worst place in the
        # file to lose them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Alternatives Considered: the long-lived cache is keyed on this DIRECTORY
    # rather than on a list of file extensions, which is the more common form and
    # is wrong here. ui/vite.config.ts leaves the asset directory at its default,
    # so everything the build emits into /assets/ carries a content hash in its
    # name -- scripts, stylesheets and the source maps beside them alike. An
    # extension-matched rule would additionally capture the files Vite copies
    # verbatim out of ui/public to the site root, and those are NOT hashed:
    # /favicon.svg keeps one name across every build, so an extension rule would
    # pin a stale icon into browsers for a year with no means of revoking it. The
    # directory boundary also needs no editing when the build starts emitting a
    # new asset type, whereas an extension list silently omits it.
    #
    # `^~` is used rather than a bare prefix so this match is settled without
    # regard to any regular-expression location a later editor may add, which
    # would otherwise take precedence over a plain prefix and quietly capture
    # these requests.
    location ^~ /assets/ {
        # Assumptions: content hashing is the entire warrant for `immutable` and
        # for a year-long lifetime. Because the filename changes whenever the
        # bytes change, the response at any one of these names can never need
        # revalidating -- a deploy publishes new names rather than new content at
        # old ones. `immutable` is what stops a browser revalidating these on a
        # manual reload, which is the case a bare max-age does not cover. Remove
        # the hashing and this rule becomes the most damaging line in the file;
        # it is safe only for as long as that build behaviour holds.
        #
        # Assumptions: `always` is deliberately absent HERE while every security
        # header below keeps it, and the asymmetry is the point. `always` extends
        # a header to error responses, which is wanted for the security headers
        # -- an nginx 404 page should still carry them -- and actively harmful
        # for this one, because it would stamp a 404 as cacheable for a year.
        # That is reachable rather than theoretical under the rolling deployment
        # this service uses: while a rollout is in progress both bundle versions
        # are served behind one load balancer, so a browser can hold the NEW
        # index.html (uncached, per the no-store above), request the new hashed
        # asset it names, be routed to a task still carrying the OLD bundle, and
        # receive a 404. Cached for a year that browser never asks again, so the
        # application stays broken for that user long after the rollout finishes
        # and no amount of no-store on the document can rescue it. Without
        # `always`, nginx applies this only to the success statuses, and the 404
        # is left revalidatable.
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Assumptions: this one rationale governs all FOUR headers below.
        # They restate the server-level set because the Cache-Control above
        # suppresses inheritance of it; what each header prevents is argued
        # once at its server-level declaration rather than copied here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # -------------------------------------------------------------------------
    # History fallback -- the behaviour this file exists to provide
    # -------------------------------------------------------------------------

    location / {
        # Assumptions: the 21 routes of this application are resolved in the
        # browser and NONE of them is a file in the document root. The build
        # emits index.html and a hashed asset directory and nothing else, so
        # /account/update, /cards/:num, /authorizations/:key and every other
        # route names no path on disk. Clicking through the application never
        # reveals this, because the router answers those navigations without a
        # request reaching this server at all. Refreshing the page, restoring a
        # bookmark or opening a deep link does issue the request -- GET
        # /account/update -- and without the final parameter below nginx looks
        # for that file, does not find it, and returns 404. The application would
        # then appear broken on every refresh while working perfectly under
        # every click, which is why this line and not any other is the reason
        # this file exists.
        #
        # The two earlier parameters are tried first so that a real file still
        # wins: `$uri` serves the un-hashed files Vite copies from ui/public to
        # the site root, and `$uri/` lets a directory resolve through the `index`
        # directive. When both miss the fallback applies unconditionally, so any
        # unrecognised path under this location is answered with the application
        # document and the router renders its own not-found screen.
        #
        # Trade-offs: that unconditional fallback means a mistyped path which
        # merely looks like a file -- /logo.svg, say -- is answered with HTML and
        # a 200 rather than a 404. Excluding asset-like extensions from the
        # fallback was the alternative and it was rejected, because the
        # CloudFront path expresses this same fallback as a blanket custom error
        # response that cannot discriminate by extension; adding the exclusion
        # here alone would make the two delivery paths answer one request two
        # ways, which is exactly the divergence the header warns about. Requests
        # for the hashed bundle are unaffected: /assets/ is claimed by its own
        # location above, which has no fallback of its own, so a missing hashed
        # asset still returns 404 rather than an HTML document that a script tag
        # cannot parse -- and a broken deploy therefore still looks broken.
        #
        # Assumptions: the fallback is an internal redirect, so location matching
        # runs again for /index.html and the no-store policy defined above
        # applies to the response. That is required rather than incidental: the
        # deep-link and refresh requests users actually make are served through
        # this path, so if the fallback response were cacheable the staleness
        # problem described above would return by the back door.
        try_files $uri $uri/ /index.html;

        # Trade-offs: the un-hashed files served directly from here get a short
        # lifetime with revalidation, rather than the immutable year granted to
        # /assets/. Vite copies ui/public to the site root without hashing, so
        # these names are reused across deploys and cannot carry a long
        # lifetime -- a cached /favicon.svg could not be replaced. A short window
        # still spares the repeat requests a no-store policy would force, and it
        # applies automatically to any file later added to ui/public, so adding
        # one cannot mistakenly inherit the immutable rule.
        #
        # Assumptions: `always` is omitted for the same reason as in the /assets/
        # location -- a lifetime describes a successful representation, and an
        # error is not that representation, so it must not inherit one. The
        # exposure here is five minutes rather than a year, but the principle is
        # what keeps the two locations reading consistently. The no-store on
        # index.html above is the one caching header that DOES keep `always`,
        # because forbidding storage can only ever protect an error response.
        add_header Cache-Control "public, max-age=300, must-revalidate";

        # Assumptions: this one rationale governs all FOUR headers below.
        # They restate the server-level set because the Cache-Control above
        # suppresses inheritance of it; what each header prevents is argued
        # once at its server-level declaration rather than copied here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
