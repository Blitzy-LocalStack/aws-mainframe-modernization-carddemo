# =============================================================================
# ui/nginx.conf
# -----------------------------------------------------------------------------
# Purpose:
#   Static-serving configuration for the CardDemo single-page application: the
#   React 19 and TypeScript front end that replaces all 21 CICS/BMS online
#   screens, being the 17 base mapsets under app/bms plus the 4 extension
#   mapsets. Where the CICS region sent a 3270 datastream to a terminal -- the
#   sign-on canvas is declared DFHMDI SIZE=(24,80) in app/bms/COSGN00.bms --
#   this file serves a built JavaScript bundle to a browser. It is that
#   terminal's replacement delivery path, which is the reason a static-file
#   server appears in a mainframe migration at all.
#
#   Four things are settled here and nothing else: that every one of the 21
#   client-side routes resolves to the one built document, how long each class
#   of file may be cached, what a container health probe receives, and which
#   response headers accompany every reply.
#
#   FORM AND DESTINATION, stated here because nothing checks either. This file
#   is a SERVER-BLOCK FRAGMENT, not a whole nginx.conf: it declares no `events`
#   and no `http` block and cannot start a server by itself. It is also not the
#   configuration nginx reads. It is a TEMPLATE: ui/Dockerfile line 226 copies it
#   to /etc/nginx/templates/default.conf.template inside its nginx:1.30.4-alpine
#   runtime stage, into the directory that file's line 205 creates, and nothing
#   in the image reads it from there directly.
#
#   What nginx reads is produced at container start. ui/Dockerfile line 314 makes
#   ui/docker-entrypoint.sh the entrypoint, and that script names this template at
#   its line 57, names /etc/nginx/conf.d/default.conf as the rendered output at its
#   line 58, substitutes the one placeholder at its line 203, and only then replaces
#   itself with nginx at its line 242. So the bytes below are the input to a
#   substitution and the file at that conf.d path is the output; a reader debugging
#   a served header should expect to find it there and not here.
#
#   That rendered path is exact, and it matters twice over. The stock image's
#   /etc/nginx/nginx.conf ends with `include /etc/nginx/conf.d/*.conf;`, so any
#   name ending in .conf placed there is loaded -- but the image also SHIPS a
#   default.conf whose own server block listens on port 80 and roots itself at
#   the same document root. Rendering over that name replaces it, while rendering
#   under any other name would leave both server blocks live. Rendering to
#   /etc/nginx/nginx.conf instead is refused outright rather than degrading: nginx
#   reports `"server" directive is not allowed here`, because a server block is
#   valid only inside an http context and this file deliberately supplies none.
#
#   The counterpart contracts are that ui/vite.config.ts builds to `dist` and
#   leaves `base` at the site root, and that ui/Dockerfile line 241 copies that
#   `dist` directory to /usr/share/nginx/html and runs the container as the
#   non-root uid 10001 its line 175 declares.
#
# WHY (non-obvious design decisions):
#   - Alternatives Considered: a complete nginx.conf replacing the image's own
#     was evaluated and rejected. The stock /etc/nginx/nginx.conf supplies three
#     things this fragment inherits and would otherwise have to restate --
#     `include /etc/nginx/mime.types`, the `main` log format, and the worker and
#     keepalive settings. Restating them freezes a copy that a base-image patch
#     can no longer improve, and it grows the surface this file has to keep
#     correct for no gain, because nothing below needs a directive that only the
#     main or events context accepts.
#   - Assumptions: the same bundle is delivered two ways and both must classify a
#     request identically. This container is one path; the other is a CloudFront
#     distribution over a private S3 bucket reached by an origin access control,
#     where the same decision is made by a viewer-request function. Both apply the
#     SAME test, stated once here: a dotted last segment means a FILE only when it
#     sits at the site root or under /assets/; a dotted last segment anywhere
#     deeper is a client route. A client route is answered with the entry document
#     under 200 on both paths and a missing file is answered 404 on both. The
#     mechanisms differ because the platforms differ; the observable behaviour does
#     not, and a change to routing made here and not in
#     infra/modules/cloudfront-spa would leave the two paths disagreeing -- with
#     each still looking correct when tested alone, which is how the previous
#     divergence survived.
#   - Refactoring Rationale: that test used to be "a dotted last segment ANYWHERE
#     means a file", and it was wrong for exactly one of the 21 routes.
#     /authorizations/:key carries an opaque cursor token minted by CursorToken,
#     whose shape is v2.<16 chars>.<1-200 chars> -- TWO dots in the last path
#     segment, structurally, for every authorization that screen can reach. Under
#     the old rule a refresh, a bookmark or a shared link to an authorization
#     detail was answered 404 by this container, and on the CloudFront path was
#     answered with the entry document under an HTTP 404 status. Every other
#     parameterised route is safe under either rule -- SealedSelector.SEALED_SHAPE
#     is [A-Za-z0-9_-]+ with no dot, and the remaining identifiers are numeric or
#     fixed-width alphanumeric -- so the blast radius was that one route and the
#     narrowing below is correspondingly narrow.
#     Assumptions: the honest-404 property the old rule existed for is PRESERVED
#     rather than traded away, and it is preserved by two separate locations
#     rather than one. Content-hashed bundle output is claimed by `^~ /assets/`,
#     which has no fallback of its own, so /assets/missing.js is still answered
#     404 and a monitor watching status codes still sees the failure. Un-hashed
#     public files are claimed by the root-level regular expression below, so a
#     mistyped or undeployed /favicon.svg is still answered 404 and not with HTML
#     under 200. What changed is only the classification of a NESTED dotted path,
#     which this build can never emit: `vite build` writes index.html plus the
#     hashed assets directory, and ui/public -- copied verbatim to the site root --
#     holds exactly one file, favicon.svg, and no subdirectory.
#     Trade-offs: that leaves one residual case. A future nested un-hashed static
#     file added under ui/public/<dir>/ would, when MISSING, be answered with the
#     entry document under 200 again. It is accepted, and it is bounded by the
#     `location /` block below still trying $uri first, so such a file is served
#     correctly when it EXISTS; the alternative was an extension allow-list, which
#     was rejected because it decides the same question by enumerating file types
#     nobody has thought of yet and would have answered /logo.bmp with HTML while
#     answering /logo.svg 404.
#   - Alternatives Considered: no `proxy_pass`, no `upstream` and no API
#     forwarding appears anywhere below, and that absence is a decision. The SPA
#     addresses the API through an absolute base URL it FETCHES, not one this
#     container forwards to: the `location = /config.json` block below serves a
#     document whose apiBaseUrl names the gateway fronting the internal load
#     balancer, ui/src/api/runtimeConfig.ts reads it at that path, and
#     ui/src/api/client.ts prefers it over the build-time VITE_API_BASE_URL whose
#     name ui/.env.example documents at its line 184. Proxying the API through this
#     container would insert a second, undocumented hop, would let browser traffic
#     reach the services without passing the gateway's JWT authorizer, and would
#     couple two independently deployed tiers through a file baked into an image.
#     ui/vite.config.ts rejects a dev-server proxy on matching grounds, so
#     development and production agree on one topology.
#   - Assumptions: TLS terminates upstream, at the CloudFront distribution or at
#     the load balancer, so no `listen 443 ssl`, no `ssl_protocols` and no
#     certificate path appears below. A certificate path here would name a
#     private key inside a container image, which is the one thing this
#     repository must never carry. Strict-Transport-Security is left to that
#     same upstream, and for a sharper reason than tidiness: this origin is
#     reached over the proxy's cleartext leg and cannot know whether the
#     browser's own connection was encrypted, so a policy asserted from here
#     would be a claim it has no evidence for.
#   - Assumptions: no environment-specific value is WRITTEN in this file, and that
#     is a different claim from the file being invariant. A hostname, an endpoint,
#     an account identifier or a credential written here as a literal would be both
#     wrong somewhere and public everywhere, so none is. What this file does carry
#     is one PLACEHOLDER, `__CARDDEMO_API_CONNECT_SRC__`, appearing in each
#     Content-Security-Policy header below; ui/docker-entrypoint.sh replaces it at
#     container start with the union of CARDDEMO_API_CONNECT_SRC_ORIGINS and the
#     origin of the required CARDDEMO_API_BASE_URL, and refuses to start nginx if
#     the placeholder survived rather than serving it inside a live header. The
#     directive block below argues that case at the header itself.
#     Assumptions: the API origin is DERIVED from the base URL rather than supplied
#     separately, so a container cannot be configured to call an origin its own
#     policy blocks -- a state that starts cleanly and then has every request
#     refused by the browser.
#   - Refactoring Rationale: two per-environment values therefore reach a browser
#     at RUN time, and this bullet formerly denied that any could. The CSP origins
#     arrive through the substitution just described, and the API base URL arrives
#     through the /config.json document the location below serves. The correction
#     matters because the denial was load-bearing: a reader who believed no runtime
#     substitution existed would have read the placeholder as a mistake and
#     resolved it to a literal origin, which is precisely the change that turns one
#     reviewed image into one image per environment.
#   - Trade-offs: Vite does inline every VITE_-prefixed value into the emitted
#     JavaScript as a literal, which is why the build-time variable is kept only as
#     a fallback and the fetched document is preferred. Relying on the inlined value
#     alone would make `vite build` run once per environment and give each its own
#     bundle and its own image; reading a document at start-up costs one request
#     before the first API call and buys a single reviewed artifact that dev and
#     prod share. The absent value is handled rather than assumed: an unset origin
#     list renders `connect-src 'self'`, which is stated at the header below.
#     Assumptions: the document itself is NOT optional on this path. The entrypoint
#     writes it from CARDDEMO_API_BASE_URL before nginx starts and refuses to start
#     without one, because a bundle with no inlined fallback and no document mounts
#     an application whose every request is unconfigured -- which reaches an
#     operator as a sign-on refusing a credential that never left the browser.
# =============================================================================

server {
    # Assumptions: port 8080 is bindable by the required non-root runtime and
    # matches the task definition, target group, and security-group contract.
    listen 8080;

    # Assumptions: the upstream edge owns environment-specific hostnames, so the
    # image accepts any host routed to this server.
    server_name _;

    # Assumptions: the runtime image must copy Vite's dist output to the stock
    # nginx document root or the image will serve its welcome page instead.
    root /usr/share/nginx/html;

    # Assumptions: Vite emits index.html and no index.htm alternative.
    index index.html;

    # Refactoring Rationale: the served Content-Type carried no charset parameter --
    # `text/html` and nothing more -- so the encoding reached the browser only from
    # the document's own meta element. That is the weaker of the two channels: a
    # header beats an in-document declaration, and the parser has to begin decoding
    # before it reaches the meta tag. ui/index.html's own note explains why byte-for
    # -byte fidelity of the baseline's strings is this application's whole premise,
    # and a decoding mistake raises no error -- it produces plausible wrong
    # characters, which is exactly the failure the ETL half of this migration
    # decodes per fixed-width field to avoid.
    # Assumptions: this directive appends `; charset=utf-8` to the types in nginx's
    # default `charset_types`, which includes text/html, so the entry document and
    # the 404 body below both carry it. It does NOT reach `application/json`, so
    # /config.json is unchanged -- correctly, because JSON is defined as UTF-8 and a
    # charset parameter on it is at best redundant.
    # Trade-offs: nginx re-codes a response when the declared source charset differs
    # from this one. Here they cannot differ: `source_charset` is unset, so nginx
    # treats the file as already being in this charset and adds the label without
    # transcoding, which is what makes this safe to apply to the whole server.
    charset utf-8;

    # Assumptions: suppressing the version banner reduces passive
    # reconnaissance without replacing image patching.
    server_tokens off;

    # Refactoring Rationale: `server_tokens off` above suppresses the VERSION and
    # nothing else. nginx's built-in error page still renders the software NAME in
    # its footer -- `<hr><center>nginx</center>` -- so an anonymous request for any
    # missing path told the caller which server it was talking to, in an origin that
    # otherwise sets its headers deliberately enough to leave Strict-Transport-
    # Security to the layer that can actually assert it. Replacing the page is the
    # only way to remove that string: the footer is emitted by nginx itself, not by
    # a header this file could unset.
    #
    # Assumptions: the `=` form is used so the handler's own status is what reaches
    # the client, which is 404 -- the honest status the /assets/ and root-level
    # locations exist to produce. Without the `=` nginx preserves the original
    # status, which happens to be the same here, but the two forms differ the moment
    # a handler wants to answer with anything else, so the intent is stated.
    #
    # Trade-offs: the `Server: nginx` RESPONSE HEADER cannot be removed from this
    # image. Unsetting it needs ngx_headers_more, which nginx:alpine does not ship,
    # and `add_header Server ""` appends a second header rather than replacing the
    # built-in one -- which discloses the same string twice. The body is where an
    # anonymous visitor reads it without inspecting headers, so the body is fixed
    # here and the header is recorded as a known residual rather than papered over.
    error_page 404 = @not_found;

    # Assumptions: this handler declares NO add_header of its own, deliberately, so
    # it inherits the server-level security set below verbatim. Adding even one
    # header here would replace that whole set -- the inheritance rule this file
    # restates at every other location -- and a 404 would lose nosniff, the frame
    # denial, the referrer policy and the content-security policy at once.
    # Assumptions: no Cache-Control either, which matches the behaviour the dotted
    # and /assets/ locations already chose by omitting `always` from theirs: a
    # lifetime describes a successful representation, and a 404 is not one.
    location @not_found {
        # Assumptions: default_type rather than a Content-Type add_header, for the
        # same reason /healthz uses it -- add_header would emit a second
        # Content-Type beside the one nginx sets, and would additionally suppress
        # the inherited security set this handler depends on.
        #
        # Assumptions: the empty `types` block is what makes default_type actually
        # apply, and it was added after MEASURING the alternative. A named location
        # does not change $uri, so nginx still resolved the mime type from the
        # ORIGINAL request path: `curl -i /assets/missing.js` returned this
        # fourteen-byte plain-text body labelled `Content-Type:
        # application/javascript`. Emptying the map for this location alone forces
        # the fallback type, so the label matches the body. It is stated because an
        # empty block reads like a leftover.
        types { }
        default_type text/plain;

        # Assumptions: the body states the status and nothing else. It names no
        # server, no version, no path and no document root, so the response carries
        # no more information than the status line already does.
        return 404 "404 Not Found\n";
    }

    # Assumptions: directory listings stay off so that /assets/ cannot be
    # enumerated. What that protects is the inventory, not the contents: every
    # file under it is already retrievable by name, and index.html names the ones
    # the application needs, so the value of the directive is that it does not
    # hand a reader the complete set of hashed filenames -- including any left
    # behind by a partial deploy -- in one request. nginx already defaults to off,
    # and the default is written out because a later editor enabling listings for
    # convenience would withdraw that property silently.
    #
    # Refactoring Rationale: this directive was previously justified as the thing
    # that made published source maps safe, on the ground that a map is served
    # only as a named request and never advertised by a listable directory. That
    # ground was false: a bundle's own `sourceMappingURL` comment names its map, so
    # the URL was never unguessable and disabling listings withheld nothing. The
    # premise has been removed rather than re-argued -- ui/vite.config.ts now sets
    # `sourcemap` to false, so no map is emitted and none can be requested from
    # here at all. The regular-expression location below answers a request for one
    # with 404 like any other missing file.
    autoindex off;

    # Assumptions: locations that add Cache-Control repeat this security set
    # because nginx replaces inherited add_header values rather than appending.

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Frame-Options "DENY" always;

    # Assumptions: only the origin, never the path, is disclosed as a referrer
    # to another site. This matters more here than the header's ubiquity
    # suggests. The migration moves the baseline's selection context into the
    # URL -- but protected selectors are opaque rather than copied from
    # CDEMO-ACCT-ID, CDEMO-CARD-NUM or CDEMO-CUST-ID in app/cpy/COCOM01Y.cpy.
    # Card routes use /cards/:opaqueCardId, so neither same-origin access logs
    # nor a cross-origin referrer can receive a PAN from the address bar.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Refactoring Rationale: this policy previously carried only the four
    # capability directives and deferred every resource-loading directive to the
    # CloudFront response-headers policy. The reasoning was that the API origin is
    # not knowable when this image is built, which is true, but the conclusion did
    # not follow: only `connect-src` depends on that origin, and deferring the rest
    # with it meant this path enforced no `script-src` at all. `script-src 'self'`
    # is the directive that actually blunts injected script, so withholding it left
    # the most valuable half of the policy unenforced on this delivery path while
    # the header read as though a policy were in force. Worse, the deferral pointed
    # at a policy that did not carry these directives either, so between the two
    # paths no resource-loading rule was enforced anywhere.
    #
    # Assumptions: every directive below except `connect-src` is
    # environment-invariant, so it is correct in every environment and no
    # configuration can invalidate it. `script-src 'self'` holds because the bundle
    # is the only script and ui/index.html carries no inline script element.
    # `style-src` must keep 'unsafe-inline': antd 6 themes through CSS variables and
    # injects the styles it needs at run time, so removing it would strip the design
    # system from every screen. A nonce or a hash is the stronger form and is not
    # available here, because the style elements are created by the browser at run
    # time and neither this server nor the static document can know their content
    # in advance. `img-src` and `font-src` admit `data:` because inlined assets are
    # emitted as data URIs. `object-src 'none'`, `base-uri 'self'`, `form-action
    # 'self'` and `frame-ancestors 'none'` constrain capabilities this application
    # never exercises, the last being the modern specified form of the
    # X-Frame-Options above, which is retained because it is what older browsers
    # honour.
    #
    # Refactoring Rationale: `connect-src` is RENDERED AT CONTAINER START and no
    # longer states a blanket `'self' https:`. The earlier reasoning was that this
    # is "the tightest environment-invariant form", and the premise was right --
    # the API hostname is not knowable when this image is built -- but the form is
    # not tight at all: `https:` is a scheme-source, so it admits an XHR or fetch
    # to ANY host on the internet over HTTPS, which is precisely the exfiltration
    # path this directive exists to close. Forbidding cleartext and WebSocket while
    # permitting every HTTPS host is close to no restriction, because an exfiltrating
    # script chooses its own destination and would choose an HTTPS one.
    #
    # The premise's conclusion does not follow either: the origin is unknown at BUILD
    # time and known at CONTAINER START time. This file is therefore installed as a
    # template whose `__CARDDEMO_API_CONNECT_SRC__` placeholder ui/docker-entrypoint.sh
    # replaces with the exact origins from CARDDEMO_API_CONNECT_SRC_ORIGINS before
    # nginx starts, refusing to start on a wildcard, a path or a non-HTTPS scheme, and
    # refusing to start if the placeholder survives. The image stays
    # environment-agnostic -- it ships a placeholder, never an origin -- so `dev` and
    # `prod` still share one reviewed artifact.
    #
    # Assumptions: an unset origin list renders `connect-src 'self'`, which fails
    # closed. That also makes the two delivery paths agree in EVERY directive rather
    # than differing in one: the distribution policy in
    # infra/modules/cloudfront-spa/main.tf joins `'self'` with its configured origins
    # and so yields `connect-src 'self'` for an empty input too. The asymmetry the
    # previous note described as "the correct asymmetry" is gone, and it was never
    # desirable -- it left the containerised path permitting hosts the deployed path
    # refused, on an artifact this repository ships.
    #
    # Alternatives Considered: declaring the policy once in an nginx variable and
    # referencing it from each location, instead of repeating the literal in all
    # SIX places -- this server-level default and the five location blocks that
    # replace it. Rejected on failure mode rather than on style: `add_header`
    # evaluates a variable at output time, so any path where it resolved empty would
    # emit `Content-Security-Policy:` with no value, which a scanner records as
    # present and a browser enforces as nothing. A repeated literal cannot fail that
    # way. The six copies must stay byte-identical, which is the accepted cost, and
    # it is the same cost the four headers above already pay for the same reason:
    # `add_header` in a location REPLACES the inherited set rather than extending it.
    # ui/index.html reaches this same conclusion from its own side, declining to
    # carry a policy meta element and naming this file and the distribution as where
    # such headers belong.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'__CARDDEMO_API_CONNECT_SRC__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Assumptions: this one rationale governs all FOUR headers below and their five
    # restatements in the locations further down, in the same way the four headers
    # above are argued once here and only repeated there. Each of the four denies a
    # capability this application never exercises, and each was absent from BOTH
    # delivery paths, which is why they arrive together rather than one at a time.
    #
    # Permissions-Policy denies every powerful feature outright. `payment=()` is the
    # entry worth naming in a card-management application: it disables the Payment
    # Request API, which no screen calls -- the migrated bill-pay and transaction-add
    # screens post a form to the transaction service, they do not invoke a browser
    # payment sheet -- so any invocation reaching this origin would not be the
    # application's. The rest of the list is the sensor, capture, device and identity
    # surface: camera, microphone, geolocation, USB, serial, HID, Bluetooth, MIDI,
    # display capture, screen wake lock, idle detection and WebAuthn assertion. A
    # feature a browser does not recognise is ignored rather than erroring, so an
    # entry that is unnecessary today costs nothing and closes the feature the day
    # the browser ships it.
    # Trade-offs: an allow-list is used rather than a wildcard denial, because the
    # header has no "deny everything" token -- `*` is the opposite, an ALLOW -- so a
    # complete list is the only available form and it has to be maintained.
    #
    # Cross-Origin-Opener-Policy severs the opener relationship with any
    # cross-origin document, which removes the cross-window scripting surface a
    # tab-napping or window.opener attack needs. Nothing here opens a cross-origin
    # window, so there is no relationship to lose.
    #
    # Cross-Origin-Resource-Policy stops another origin embedding this one's
    # responses as a subresource, which is the reading half of a cross-site leak.
    # `same-origin` rather than `same-site` because this bundle is consumed by
    # exactly one origin.
    #
    # Cross-Origin-Embedder-Policy is the one of the four that can break a page, so
    # `require-corp` is chosen on proof rather than on preference: it refuses any
    # cross-origin subresource that has not opted in, and the policy declared
    # immediately above already refuses every cross-origin subresource
    # unconditionally -- `default-src 'self'`, `script-src 'self'`, `style-src 'self'
    # 'unsafe-inline'`, `img-src 'self' data:`, `font-src 'self' data:`,
    # `object-src 'none'`. Same-origin responses and `data:` URLs satisfy COEP with
    # no CORP header of their own, so this header can block nothing the policy above
    # permits. antd 6 injects its styles as inline style elements from the bundle
    # itself, so the design system is same-origin too.
    # Assumptions: the API calls are unaffected. COEP constrains EMBEDDED
    # subresources; the fetches this application makes carry an Authorization header
    # and are therefore CORS-mode requests, which COEP does not gate. Those origins
    # are admitted by `connect-src` and by nothing else.
    # Trade-offs: together with the opener policy above this makes the document
    # cross-origin isolated, which is a side effect rather than a goal and buys
    # nothing this application uses. If a future screen ever needs a genuinely
    # cross-origin subresource -- a map tile, an off-origin font -- this is the
    # header that will refuse it first, and the fix is to add the origin to the
    # policy above AND to have that origin send `Cross-Origin-Resource-Policy:
    # cross-origin`, not to drop this line.
    add_header Permissions-Policy "accelerometer=(), autoplay=(), bluetooth=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Trade-offs: dynamic gzip spends small origin CPU to reduce JavaScript, CSS,
    # JSON, and SVG transfer size. gzip_static is excluded because Vite emits no
    # precompressed siblings.
    gzip on;

    # Assumptions: both JavaScript MIME spellings are retained across nginx
    # versions; already-compressed binary formats are intentionally excluded.
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        image/svg+xml;

    # Assumptions: shared caches must vary representations by Accept-Encoding.
    gzip_vary on;

    # Assumptions: deployed requests are proxied and may carry Via, so compression
    # must not be limited to direct requests.
    gzip_proxied any;

    # Trade-offs: responses below one kilobyte avoid compression framing and CPU
    # that can exceed the saved bytes.
    gzip_min_length 1024;

    # Assumptions: the runtime image and target group must both probe this exact
    # path; changing it requires coordinated updates to those consumers.
    location = /healthz {
        # Assumptions: a literal response tests nginx routing without coupling
        # server health to a particular bundle file or backend dependency.
        return 200 "ok\n";

        # Assumptions: default_type avoids a duplicate Content-Type header and
        # preserves inherited security headers.
        default_type text/plain;

        # Trade-offs: continuous probes are omitted from access logs to control
        # noise and storage; the orchestrator still records health transitions.
        access_log off;
    }

    # Assumptions: index.html keeps a stable name while referencing new hashed
    # assets on each deploy, so storing it can strand clients on removed names.
    location = /index.html {
        # Assumptions: no-store prevents reuse; must-revalidate protects against
        # intermediaries that retain a copy despite that directive.
        #
        # Trade-offs: this directive also disables the browser's back/forward cache
        # for every document response, which an automated audit reports as a failing
        # check, and it is KEPT deliberately. The session this application holds is
        # memory-only by design -- ui/src/hooks/useAuth.ts keeps the token in module
        # state and writes it to no storage, which is what makes a reload sign the
        # operator out -- and a restored back/forward entry would resurrect a
        # rendered screen from a session that had already been discarded. So the same
        # header that costs the audit is the header that makes the memory-only
        # session correct, and the two cannot be had separately: bfcache eligibility
        # requires the document to be storable. Anyone reading the audit result
        # should read this paragraph before removing the directive.
        add_header Cache-Control "no-store, must-revalidate" always;

        # Assumptions: Cache-Control suppresses inherited add_header values, so
        # the server-level security set must be repeated verbatim -- all EIGHT
        # headers, argued once at their server-level declarations.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'__CARDDEMO_API_CONNECT_SRC__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        add_header Permissions-Policy "accelerometer=(), autoplay=(), bluetooth=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # WHY : Assumptions: the runtime configuration document must never be reused from a cache, for
    #       the same reason /index.html must not: it is rewritten in place on every deployment while
    #       every hashed asset is immutable, so a retained copy would point a freshly published
    #       bundle at the previous deployment's API endpoint. This location exists because the
    #       extension rule further down would otherwise class a .json file with the cacheable static
    #       files and serve it with a long lifetime.
    #       Assumptions: the object is also uploaded to the bucket with the same directive by the
    #       deployment, because the two delivery paths are independent -- this block governs the
    #       container image's own nginx, and the bucket header governs the edge cache in front of S3.
    #       Assumptions: on THIS path the document is written by ui/docker-entrypoint.sh at container
    #       start, into the document root, from CARDDEMO_API_BASE_URL; on the CloudFront path it is
    #       generated from Terraform outputs and synced to the bucket. Both publish the identical
    #       shape, {"apiBaseUrl": "..."}, because one reader parses both.
    location = /config.json {
        add_header Cache-Control "no-store, must-revalidate" always;

        # Assumptions: Cache-Control suppresses inherited add_header values, so the server-level
        # security set must be repeated verbatim -- all EIGHT headers -- exactly as the
        # /index.html location does.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'__CARDDEMO_API_CONNECT_SRC__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        add_header Permissions-Policy "accelerometer=(), autoplay=(), bluetooth=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Alternatives Considered: a file-extension rule would also capture stable
    # public names such as /favicon.svg. The /assets/ boundary contains only
    # content-hashed build output and remains stable as asset types change.
    location ^~ /assets/ {
        # Assumptions: content hashes make successful asset responses immutable.
        # `always` is omitted so a rolling-deployment 404 is never cached for a
        # year.
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Assumptions: Cache-Control suppresses inherited add_header values, so all
        # EIGHT server-level security headers are repeated verbatim below.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'__CARDDEMO_API_CONNECT_SRC__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        add_header Permissions-Policy "accelerometer=(), autoplay=(), bluetooth=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # -------------------------------------------------------------------------
    # Static files anywhere else -- a miss here is a 404, never the SPA document
    # -------------------------------------------------------------------------

    # Assumptions: this location exists to keep the history fallback below from
    # answering a request for a FILE. It matches a dotted last segment at the SITE
    # ROOT only -- one leading slash, then a single segment containing a dot -- which
    # is the same test the CloudFront viewer-request function applies in
    # infra/modules/cloudfront-spa/main.tf, so both delivery paths classify a
    # request identically. Requests that reach it are the un-hashed files Vite
    # copies verbatim from ui/public to the site root -- /favicon.svg today -- plus
    # anything dotted at the root that does not exist, including the /.env probe a
    # scanner sends, which the `[^/]*` before the dot admits deliberately so it is
    # answered 404 rather than with the entry document.
    #
    # Assumptions: that guarantee covers the site ROOT and nothing deeper, and the
    # boundary was measured against a running container rather than reasoned about.
    # /.env is answered 404; a NESTED probe such as /.git/config is not, because its
    # last segment carries no dot, so the expression cannot claim it and it falls
    # through to the history fallback -- a scanner records 200. Nothing is disclosed,
    # because the reply is the ordinary entry document and no such file exists in
    # the image, but it is recorded here because an earlier version of this comment
    # asserted /.git/config was answered 404: anyone tuning an alert on scanner 404s
    # would have been working from a false premise, and narrowing the expression
    # further to catch it would re-open the nested-dotted-path regression that the
    # rationale below exists to close.
    #
    # Refactoring Rationale: the expression was `\.[^/]*$`, unanchored, so it
    # claimed a dotted last segment at ANY depth. That is what hard-404'd
    # /authorizations/:key, whose cursor token always contains two dots; the file
    # header above records the full reasoning and the residual case this narrowing
    # accepts. Anchoring at the root rather than enumerating extensions keeps the
    # classification total for the depth it governs: every dotted name at the root
    # is a file whether or not anyone listed its extension.
    #
    # Assumptions: a nested path such as /foo.bar/baz was correctly NOT matched
    # before and still is not -- its last segment carries no dot, so it is a client
    # route. What is new is that /foo/bar.baz is also not matched, and is likewise
    # a client route.
    #
    # This is the regular-expression location the /assets/ block above anticipated
    # when it chose `^~`. That prefix is settled before regular expressions are
    # considered, so hashed bundle requests never reach here and keep their
    # immutable year; this location governs the site root only. The cache argument
    # made there still stands unchanged -- an extension-matched IMMUTABLE rule
    # would pin a stale /favicon.svg into browsers for a year -- which is why the
    # policy below is the short revalidated one and not that year.
    location ~ ^/[^/]*\.[^/]*$ {
        # Assumptions: a missing file is answered 404 and nothing else. This is
        # the line that closes the defect: without it these requests fell through
        # to the fallback below and a mistyped or undeployed asset was answered
        # with the application document under HTTP 200. A browser then parsed HTML
        # as JavaScript, an image, or a stylesheet and reported a syntax error or a
        # broken image, so the diagnosis pointed at the asset's contents instead of
        # at its absence -- and a monitor watching status codes saw a healthy 200
        # for a request that had failed. `=404` restores the honest status.
        try_files $uri =404;

        # Trade-offs: the short revalidated lifetime is carried over from the
        # fallback location that used to serve these files, so the caching
        # behaviour of /favicon.svg is unchanged by this location existing. It
        # cannot be lengthened: Vite copies ui/public to the site root WITHOUT
        # hashing, so these names are reused across deploys and a long lifetime
        # would leave a replaced file unreachable. A short window still spares the
        # repeat requests a no-store policy would force, and it applies
        # automatically to any file later added to ui/public.
        #
        # Assumptions: `always` is omitted for the reason argued at the /assets/
        # location -- a lifetime describes a successful representation, so the 404
        # this location now returns must not inherit one.
        add_header Cache-Control "public, max-age=300, must-revalidate";

        # Assumptions: this one rationale governs all EIGHT headers below.
        # They restate the server-level set because the Cache-Control above
        # suppresses inheritance of it; what each header prevents is argued
        # once at its server-level declaration rather than copied here. They keep
        # `always` so the 404 responses this location returns carry them too.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'__CARDDEMO_API_CONNECT_SRC__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        add_header Permissions-Policy "accelerometer=(), autoplay=(), bluetooth=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location / {
        # Assumptions: the 21 routes of this application are resolved in the
        # browser and NONE of them is a file in the document root. The build
        # emits index.html and a hashed asset directory and nothing else, so
        # /account/update, /cards/:opaqueCardId, /authorizations/:key and every other
        # route names no path on disk. Clicking through the application never
        # reveals this, because the router answers those navigations without a
        # request reaching this server at all. Refreshing the page, restoring a
        # bookmark or opening a deep link does issue the request -- GET
        # /account/update -- and without the final parameter below nginx looks
        # for that file, does not find it, and returns 404. The application would
        # then appear broken on every refresh while working perfectly under
        # every click, which is why this line and not any other is the reason
        # this file exists.
        #
        # Assumptions: what reaches this location is client routes and nothing that
        # this build emits as a file. A dotted name at the site ROOT is claimed by
        # the regular-expression location above, and the hashed bundle is claimed by
        # /assets/ before that, so neither can reach the fallback. What DOES reach it
        # and carries a dot is a nested client route -- /authorizations/:key, whose
        # cursor token always contains two of them -- and that is the request this
        # fallback has to answer with the entry document.
        #
        # Refactoring Rationale: the paragraph here used to say "every URI whose last
        # segment carries a dot is claimed by the regular-expression location above",
        # and that was true of the expression as it stood and is the defect the file
        # header records: it claimed the authorization route as well, so a refresh or
        # a bookmark of an authorization detail was answered 404. The expression is
        # now anchored to the root, so the sentence is narrowed to match what it
        # actually does.
        #
        # The two earlier parameters are retained AND load-bearing now, where before
        # they were retained rather than needed. `$uri` is what would serve a nested
        # un-hashed file under ui/public/<dir>/ if one were ever added, which is the
        # residual case the file header accepts: such a file is served correctly when
        # it exists and only a MISSING one falls through to the document. The
        # fallback then applies to every remaining path, so an unrecognised route is
        # answered with the application document and the router renders its own
        # not-found screen -- which is the correct outcome for a route, and precisely
        # the wrong one for a file.
        #
        # Refactoring Rationale: this fallback previously ran for dotted paths too,
        # so a mistyped or undeployed asset such as /logo.svg was answered with HTML
        # under HTTP 200. The exclusion was declined at the time on the grounds that
        # the CloudFront path expressed the same fallback as a blanket custom error
        # response that could not discriminate by extension, so excluding here alone
        # would have made the two delivery paths answer one request two ways. That
        # reasoning was sound and the conclusion was not: the fix was to give
        # CloudFront the discrimination it lacked rather than to keep this path
        # equally wrong. It now has a viewer-request function applying the same
        # root-level-dotted-name test, so both paths classify identically AND both
        # return an honest 404 for a missing file.
        #
        # Assumptions: the fallback is an internal redirect, so location matching
        # runs again for /index.html and the no-store policy defined above
        # applies to the response. That is required rather than incidental: the
        # deep-link and refresh requests users actually make are served through
        # this path, so if the fallback response were cacheable the staleness
        # problem described above would return by the back door.
        try_files $uri $uri/ /index.html;

        # WHY : Assumptions: the requests this location answers are the ones that
        #       carry a client route in the request line, and two of those routes
        #       carry a per-card identifier. ui/src/routes/cards.ts declares
        #       CARD_DETAIL_ROUTE = '/cards/:cardKey' and
        #       CARD_EDIT_ROUTE = '/cards/:cardKey/edit', and cardKey is the sealed
        #       selector -- encrypted under a service-held key and carrying no digit
        #       of the number it addresses -- so the request line no longer exposes a
        #       primary account number. The suppression is retained for what the
        #       selector still is: a DETERMINISTIC, durable identifier for exactly one
        #       card, deterministic by design so a route stays bookmarkable and
        #       cacheable. A retained request line is therefore a stable per-card key
        #       that correlates every deep link and refresh against one card in a
        #       container log, which is a durable store with a broader read audience
        #       than the API's own record.
        # WHY : Refactoring Rationale: this rationale previously said the routes
        #       address a card by its sixteen-digit number and cited
        #       /cards/4111111111111111 as a real request target. That was true of the
        #       routes it was written against and became false when the selector
        #       landed. It is corrected rather than deleted along with the
        #       suppression, because a reader who checked the old claim would
        #       correctly conclude the stated risk was gone and could re-enable the
        #       log on that basis -- losing a control that still earns its cost for
        #       the different reason stated above.
        # WHY : Refactoring Rationale: this suppression is the container-side twin of
        #       the CloudFront delivery's omission of cs-uri-stem, and the two are
        #       deliberately the same decision at two delivery paths rather than one
        #       control and one oversight. docs/architecture/observability.md states
        #       it as a control and its regression script asserts it, and this line is
        #       what makes both true; without it the document described a control the
        #       server did not carry.
        # WHY : Trade-offs: an operator loses the per-request record of deep-link and
        #       refresh traffic to this container. What remains still diagnoses the
        #       failures this location can produce, because the error log is
        #       untouched, /assets/ requests are still logged and carry only
        #       content-hashed filenames, and the edge record retains the status, the
        #       method and the request identifier for the same hop. The service-side
        #       path IS retained, in the API's own record, where common-lib's
        #       CardNumberMasker redacts the number first -- so the path is observable
        #       exactly where it can be redacted and nowhere it cannot.
        # WHY : Alternatives Considered: a custom log_format that omitted $request
        #       while keeping the rest of the line. Rejected because nginx has no
        #       per-request redaction of a variable's value, so the only way to keep
        #       the line was to drop the field entirely -- at which point the record
        #       carries a status and a byte count for an unidentifiable request, which
        #       is less useful than the edge record that already covers the same hop.
        access_log off;

        # Assumptions: this header does NOT govern the fallback response. The
        # fallback's final parameter is a URI, so nginx performs an internal
        # redirect, location matching runs again for /index.html, and the no-store
        # policy declared at that exact-match location applies instead. Keeping
        # /index.html LAST in the try_files list is what preserves that: named as
        # an earlier parameter it would be served in place and the SPA document
        # would inherit this five-minute lifetime instead, reintroducing exactly
        # the staleness the no-store exists to prevent through an ordering change
        # that looks cosmetic.
        #
        # What it does govern is the residual case: an extensionless real file or a
        # directory index, if either is ever added. Root static files no longer
        # reach this location at all, having been claimed by the
        # regular-expression location above, which carries this same short
        # revalidated policy so that /favicon.svg is cached exactly as it was
        # before that location existed.
        #
        # Assumptions: `always` is omitted for the same reason as in the /assets/
        # location -- a lifetime describes a successful representation, and an
        # error is not that representation, so it must not inherit one. The
        # exposure here is five minutes rather than a year, but the principle is
        # what keeps the locations reading consistently. The no-store on
        # index.html above is the one caching header that DOES keep `always`,
        # because forbidding storage can only ever protect an error response.
        add_header Cache-Control "public, max-age=300, must-revalidate";

        # Assumptions: Cache-Control suppresses inherited add_header values, so all
        # EIGHT server-level security headers are repeated verbatim below.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'__CARDDEMO_API_CONNECT_SRC__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        add_header Permissions-Policy "accelerometer=(), autoplay=(), bluetooth=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
