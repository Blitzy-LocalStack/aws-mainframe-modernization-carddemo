# =============================================================================
# .github/workflows/services-ci.yml
# -----------------------------------------------------------------------------
# Purpose:
#   Continuous-integration workflow for the migrated CardDemo Java services and
#   the Python ETL package. On every push and pull request to the default branch
#   (and on manual dispatch) it builds and tests the nine-module Maven reactor,
#   enforces the Java and Python documentation gates that make the repository's
#   explainability convention mechanical, asserts the reactor's named ArchUnit
#   layering execution, validates the ETL distribution against its installed
#   artifact, and proves every service Dockerfile builds -- WITHOUT publishing an
#   image.
#
#   The word for the layering step is "asserts", not "invokes":
#   services/common-lib/src/test/java/com/carddemo/common/architecture/LayeringRulesTest.java
#   is evaluated in every service module that consumes the kernel's test artifact,
#   and a violated boundary reddens the run. Step 4b enumerates that class by role
#   -- boundary assertions and anti-vacuity guards -- and deliberately states no
#   count, for the reason recorded there.
#
#   This workflow owns ONLY the migrated trees. The COBOL baseline under app/**,
#   the parity-oracle suite under tests/**, its runners under scripts/**, and the
#   mainframe build samples under samples/** are reference-only here: they are
#   excluded from the path filters below, no step reads or writes them, and their
#   own pipeline (.github/workflows/tests.yml) remains untouched.
#
# Parameters:
#   workflow_dispatch.build_images (boolean, default true) -- when false, omits
#   the container-image validation while leaving every source, test and
#   documentation gate enabled, so a maintainer can re-run the cheap gates alone
#   after a documentation-only fix. It has no effect on push or pull_request.
#
# Return values:
#   One deterministic pass/fail status, plus two uploaded report artifacts and two
#   check-annotation surfaces. GATING -- any failure reddens the run: the Maven
#   reactor build and unit tests; the Checkstyle documentation gate; the Ruff
#   pydocstyle gate; the ETL distribution build/install; the ETL pytest run;
#   every service image build; the ArchUnit layering execution asserted by step 4b,
#   which fails the run on a violated boundary AND on a vanished one, because the
#   execution carries `failIfNoTests` through an inherited profile in
#   services/pom.xml keyed on a module owning `src/main/java`; and the report
#   uploads, whose `if-no-files-found: error` turns a missing report into a failure.
#   ADVISORY -- never overrides the authoritative status: the two JUnit
#   check-annotation publishers, and nothing else.
#
# Exceptions or errors:
#   Every gate fails the job on a non-zero exit; the uploads and publishers run
#   under `if: always()` so evidence survives an earlier failure. The ONLY
#   tolerated non-zero exits are the two advisory publishers' own
#   `continue-on-error` / `fail_on_failure: false`.
#   Alternatives Considered: the COBOL suite's condition-code rubric (0 pass /
#   4 warn / 8 fail / 16 fatal), which tests.yml maps with an `rc -le 4`
#   tolerance to accommodate a documented, immutable baseline defect. Rejected
#   here: Maven, Checkstyle, Surefire, Ruff, pytest and docker build all use
#   plain zero/non-zero exits and this workflow has no soft-warn condition to
#   accommodate, so importing that tolerance would silently swallow real
#   failures.
#
# Design decisions:
#   - Alternatives Considered: one serial job covering both languages. Rejected
#     because the Java reactor and the ETL package consume none of each other's
#     build products, so declaring no `needs:` edge between them lets a Java
#     failure and a Python failure surface in the same run instead of the second
#     being hidden behind the first.
#   - Trade-offs: a dependency cache is mutable state shared across runs. The
#     Maven cache is accepted because setup-java keys it on the committed POM
#     graph rather than on a branch-wide mutable key; the Python job stays
#     deliberately cacheless, matching the repository's existing cacheless CI
#     baseline, because its install is already hash-verified and a cache would
#     add a poisoning surface without removing a download the lock does not
#     already pin.
#   - Assumptions: this workflow needs NO AWS credential, no registry login and
#     no secret of any kind, and none is declared at any scope. Image publication
#     and every AWS interaction belong to the deployment workflow, so a
#     compromise of any step here has no credential to read.
#   - Assumptions: the sibling trees this workflow drives (services/**,
#     config/checkstyle/**, data-migration/**) own their own tool and version
#     pins -- the Spring Boot parent, the Checkstyle ruleset, the hash-locked
#     Python closures and each Dockerfile's base images. This file invokes them
#     and deliberately restates none of those pins, so a pin can never disagree
#     between the build and the pipeline that runs it.
# =============================================================================

name: CardDemo Services CI

# Assumptions: CONTRIBUTING.md L37 asks contributors to "Pay attention to any automated CI
# failures reported in the pull request", which only works if the gates run on pull_request;
# running on push as well means the default branch is verified even for a change that reached it
# without a pull request. CONTRIBUTING.md L26 states contributions are made "against the latest
# source on the *main* branch", which is why both triggers are scoped to `main`. workflow_dispatch
# adds a manual entry point plus the image-build toggle documented under Parameters above.
#
# Assumptions: the four path filters below are the complete set of trees whose
# change can invalidate a gate in this workflow -- services/** for the reactor,
# config/checkstyle/** because the Java documentation gate reads its ruleset from
# there rather than from the reactor, data-migration/** for the ETL package, and
# this file itself so that editing the pipeline revalidates it under its own
# rules. An over-narrow filter is the dangerous direction: it produces a green
# pull request that never ran the owning gate, which reads as a pass but proves
# nothing. Deliberately OUT: app/**, tests/**, scripts/** and samples/** are the
# reference-only COBOL baseline and its parity-oracle suite, owned by
# .github/workflows/tests.yml; including them here would run these gates against
# trees they do not govern and duplicate that pipeline's authority.
on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "config/checkstyle/**"
      - "data-migration/**"
      - ".github/workflows/services-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "config/checkstyle/**"
      - "data-migration/**"
      - ".github/workflows/services-ci.yml"
  workflow_dispatch:
    inputs:
      # Trade-offs: this input exists because the container-image validation is by far the
      # most expensive gate here, and it is the one gate that proves nothing about a change
      # confined to documentation or to a test. Exposing a toggle lets a maintainer re-run every
      # source, test and documentation gate without paying for the image builds again. It defaults
      # to true so the DEFAULT behaviour is the complete gate set -- opting out has to be a
      # deliberate act on a manual run, and the toggle is unreachable from push and pull_request,
      # so it can never weaken an automatic run.
      build_images:
        description: "Build every service container image after the tests; set false only for a manual, diagnostics-only re-run."
        required: false
        type: boolean
        default: true

# Trade-offs: least privilege -- the workflow-level default is read-only, so any job or step
# added later starts with no write capability and must ask for it deliberately. `contents: read`
# is the single scope needed at this level, and it exists for exactly one step per job:
# actions/checkout, which reads the reviewed revision. Every other scope is granted per job below
# rather than here, so a scope is never in scope for a job that has no step needing it.
permissions:
  contents: read

# Trade-offs: the group key is the workflow plus the ref, so runs are superseded only within
# one branch and two branches never cancel each other. cancel-in-progress is true because this
# workflow only reads the repository and writes throwaway build output -- cancelling it mid-flight
# leaves no remote state, no published image and no deployment half-finished, so rapid pushes
# replace redundant validation instead of queueing it behind work whose result is already stale.
# Trade-offs: the superseded run publishes no reports, which is acceptable because only the newest
# commit's evidence is reviewable; the deployment workflow, whose cancellation WOULD strand remote
# state, owns the opposite setting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Assumptions: this job carries no `needs:` because nothing produces an input it consumes;
  # it and the data-migration job below are deliberately independent so both languages' failures
  # appear in one run (see the header's first WHY).
  java-services:
    name: Build, test and gate the Java services
    # Trade-offs: the runner image is pinned rather than drifting silently with
    # `ubuntu-latest`, because this job depends on the image's Docker daemon and its preinstalled
    # JDK layout; an unreviewed image change could alter either and turn an unrelated week into a
    # build failure with no commit to blame.
    runs-on: ubuntu-24.04
    # Trade-offs: a bounded ceiling so a hung Maven resolution or a stalled image build
    # releases the runner instead of occupying a slot until the platform's own limit expires. The
    # value is deliberately well clear of an ordinary run so it acts only as a runaway stop, never
    # as a pass/fail signal -- a timeout here means something is wrong, not that the build needed
    # more room.
    timeout-minutes: 60
    # Assumptions: least privilege -- `contents: read` and nothing else. This job runs
    # repository-controlled build steps -- Maven with the committed POM graph and
    # its plugin closure, and `docker build` over each committed Dockerfile -- so a
    # change to any of those files executes here. A token that could also write
    # check runs or comment on pull requests would be reachable from that code, and
    # the write scopes are needed by exactly one step, an ADVISORY publisher that
    # only reads an uploaded artifact.
    # Refactoring Rationale: the publisher therefore moved out of this job
    # into `publish-java-reports` below, which runs no build step at all. An earlier
    # revision granted `checks: write` and `pull-requests: write` here and relied on
    # the publisher being the last step -- but step ordering is not an isolation
    # boundary: every earlier step in the job already holds the job's whole token,
    # so the two write scopes were reachable from Maven, from any plugin it
    # resolved, and from every Dockerfile build. Splitting the job is what makes the
    # narrowing real rather than positional.
    permissions:
      contents: read

    steps:
      # Step 1: obtain the exact revision under review, so every gate below runs
      # against the reviewed tree rather than a moving branch tip.
      # Alternatives Considered: CWE-1357, supply-chain hardening -- even a FIRST-party
      # GitHub-authored action is pinned to an immutable full 40-character commit
      # SHA rather than the mutable major tag `@v4`. A floating tag can be
      # silently repointed -- by a tag move, a branch-protection lapse or a
      # maintainer-account compromise -- to run attacker code with this job's
      # token on trusted push and workflow_dispatch runs; a full SHA is
      # content-addressed and cannot be moved. The trailing `# v4.2.2` keeps the
      # pin human-readable and lets Dependabot or Renovate bump it forward.
      # Assumptions: CWE-522, `persist-credentials: false` -- by default checkout leaves the
      # job's `GITHUB_TOKEN` in `.git/config` as an extraheader for the rest of the
      # job, so every later step -- a Maven plugin, a `docker build`, a transitively
      # resolved dependency's build script -- runs with a usable write-capable
      # credential sitting on disk that none of them needs. Nothing in this job
      # pushes, tags or comments through git; the two publisher steps use the API
      # through their own action inputs. Removing the credential after the fetch
      # therefore costs this job nothing and removes the token from the reach of
      # every step that follows.
      # Trade-offs: a future step that genuinely needs to push would have to
      # re-authenticate explicitly rather than inherit a credential silently. That
      # is the point: it makes granting write access a visible edit here instead of
      # an invisible default.
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Step 2a: provide the JDK the reactor targets.
      # Assumptions: the version pin -- the reactor's enforcer requires Java 21 and the
      # Spring Boot parent targets a Java 21 release, so 21 is the toolchain the POM already
      # demands rather than a preference expressed here.
      # Assumptions: the distribution -- Corretto matches the vendor each service Dockerfile
      # uses for BOTH its build and runtime stages, so a vendor-specific or class-file-level
      # behaviour cannot pass CI and then appear only in the shipped image.
      # Trade-offs: the cache key -- `cache-dependency-path` narrows the cache to the
      # committed POM graph, so the key changes when a declared dependency changes and a stale
      # entry cannot mask a dependency that no longer resolves. A branch-wide key was rejected for
      # exactly that reason.
      # Alternatives Considered: a mutable tag (CWE-1357). Pinned to an immutable full
      # commit SHA for the same supply-chain reason as checkout above; the trailing `# v5.7.0`
      # lets Dependabot bump it forward under review.
      # WHY : Refactoring Rationale: this pin was v4.7.1, and the note here argued for STAYING on
      # the v4 line so that hardening provenance would not "take on a major-version behavioural
      # change at the same time". That argument is withdrawn, because a full SHA freezes the bundle
      # it names and this particular bundle was vulnerable: the lock committed at
      # actions/setup-java@v4.7.1 resolves `form-data` 2.5.1 and 4.0.0, both below the 2.5.4/4.0.4
      # fix line of GHSA-fjxv-7rqg-78g4 (unsafe random boundary selection), reached through
      # `@azure/core-http` behind `@actions/cache`. The v5.0.0 release notes name the fix
      # explicitly -- "Upgrade form-data to bring in fix for critical vulnerability" -- and the lock
      # at v5.7.0 carries no `form-data` entry at all. Measured from the published locks at those
      # tags rather than inferred from a version number.
      # WHY : Assumptions: the SAME defect was measured in three further pins this workflow family
      # used and is fixed the same way, so the four moves are one decision recorded once here:
      # actions/setup-python v5.3.0 (2.5.1 and 4.0.0) -> v7.0.0, actions/upload-artifact v4.4.3
      # (4.0.0) -> v7.0.1, actions/download-artifact v4.1.8 (4.0.0) -> v8.0.1. A fifth, unflagged
      # by review, was found by the same measurement and moved with them: actions/setup-node
      # v4.4.0 in ui-ci.yml and deploy.yml carried 2.5.1 and 4.0.0 through the same cache
      # dependency. actions/checkout@v4.2.2 was measured too and resolves NO `form-data`, which is
      # why it is left where it is rather than moved for symmetry.
      # WHY : Assumptions: every one of these majors runs on `node24` and therefore requires an
      # Actions Runner of 2.327.1 or newer. That is satisfied here without action, because every
      # job in this file runs on the GitHub-hosted `ubuntu-24.04` image, whose runner is updated by
      # GitHub and has been past that release since 2025. Trade-offs: a SELF-HOSTED runner would
      # have to be updated before these pins can run, and the failure mode is a startup error
      # rather than a silent fallback -- recorded because this repository's workflows are otherwise
      # written to be portable to a self-hosted fleet.
      # WHY : Assumptions: the inputs used here survive the major change unchanged --
      # `distribution`, `java-version`, `cache` and `cache-dependency-path` are all still declared
      # by v5 -- and v5.7.0's only deprecation, the legacy Adopt distributions, does not touch
      # `corretto`. The v4 line is now formally deprecated in any case: v4.9.1 exists solely to add
      # a deprecation warning.
      - name: Configure Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
          cache-dependency-path: services/pom.xml

      # Step 2b: install the exact Maven release the reactor is validated against.
      # Alternatives Considered: a pinned release rather than the runner's preinstalled
      # Maven: the reactor's enforcer requires Maven 3.9 or newer, and the runner image's bundled
      # version can move without a commit here; pinning makes the build tool as reviewable as the
      # code it builds.
      # Alternatives Considered: another action instead of verifying the checksum --
      # comparing against the SHA-512 Apache publishes for this exact artifact makes a direct
      # download as immutable as an action SHA pin -- the bytes are content-verified, so a
      # compromised or substituted mirror fails closed -- while adding no further third-party
      # action to the supply chain.
      # Assumptions: two mirrors -- downloads.apache.org serves only the CURRENT release of
      # each line and moves superseded ones to archive.apache.org, so a single-mirror download
      # breaks permanently the day this version is superseded, with no change here to explain it.
      # archive.apache.org retains every release, so it is the durable fallback. Trade-offs: two
      # candidate sources instead of one, accepted because the checksum below governs whichever
      # mirror served the bytes -- so the fallback widens availability without widening trust.
      - name: Install the reviewed Maven release
        shell: bash
        run: |
          set -euo pipefail
          version="3.9.16"
          archive="apache-maven-${version}-bin.tar.gz"
          expected="831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"
          for base in \
            "https://downloads.apache.org/maven/maven-3" \
            "https://archive.apache.org/dist/maven/maven-3"
          do
            echo "[ci-services] fetching ${archive} from ${base}"
            if curl -fsSLo "$archive" "${base}/${version}/binaries/${archive}"; then
              break
            fi
            rm -f "$archive"
          done
          # A missing archive here means BOTH mirrors failed; fail loudly rather
          # than letting the checksum report a confusing "no such file".
          test -s "$archive"
          printf '%s  %s\n' "$expected" "$archive" | sha512sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${version}/bin" >> "$GITHUB_PATH"

      # Step 2c: prove the toolchain resolved before any gate depends on it.
      # Trade-offs: a dedicated step -- a toolchain that is absent or the wrong major
      # version otherwise surfaces as a confusing compilation or plugin error deep inside the
      # reactor output. Failing here instead names the real cause in a step whose title already
      # says what was being checked.
      - name: Verify Java and Maven toolchains
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -version

      # Step 3: the authoritative build. One invocation compiles all nine modules
      # and runs, in a single lifecycle, the Checkstyle documentation gate bound to
      # `validate`, the `architecture-rules` Surefire execution, and every module's
      # unit tests. GATING: any of those failing fails this step.
      #
      # Assumptions: every item in that list gates on real content, the middle one
      # included, and step 4b records its wiring in full. Measured on this reactor,
      # the `architecture-rules` execution reports NINE times in a full run -- eight
      # consumer modules plus the kernel's own `default-test` run -- and the profile
      # `architecture-rules-fail-if-absent` makes an empty selection fail rather than
      # pass, so the gate cannot report green on no tests.
      #
      # Refactoring Rationale: this paragraph previously qualified that middle item
      # as having a reach "narrower than its name suggests", because the rule class
      # its include pattern names was "authored at a later index of the plan" and so
      # "selects no test". That class has since landed, and step 4b's own rationale
      # already records the same correction from the other side -- so this file held
      # both the live description and the superseded one, forty lines apart. The
      # stale half is the more expensive one to leave: it invites a reader to treat a
      # green architecture result as meaningless and to remove the wiring that
      # produces it.
      #
      # Assumptions: `verify` reaches the integration tier, and that is why no
      # separate step invokes Failsafe. Failsafe binds `integration-test` and
      # `verify`, both of which a `clean verify` lifecycle passes through, and it is
      # the second goal that ASSERTS the results the first only records -- so a
      # failing `*IT` fails this step. Trade-offs: the integration tests need a
      # container runtime, which the `ubuntu-24.04` runner image provides. If a
      # future runner does not, this step must fail rather than be made conditional:
      # a repository test tier that silently does not run is the exact condition the
      # widening from `test` to `verify` was made to end.
      #
      # Refactoring Rationale: this step ran `clean test`, and the reason recorded
      # here was that `verify` additionally runs the Spring Boot `repackage` goal,
      # which failed on every module declaring no application main class. That was
      # true and is no longer: all eight services now declare an entry point, so
      # `clean verify` completes for the whole reactor. Restoring it is not a
      # preference -- stopping at `test` skipped two gates outright. `repackage`
      # never ran, so CI never proved that the executable jar each Dockerfile copies
      # can actually be produced; and Failsafe is bound to `integration-test`, which
      # `test` does not reach, so the integration suite was structurally unreachable
      # no matter how many `*IT` classes existed. The reactor now has real ones.
      # Alternatives Considered: keeping `test` and adding a separate `package` step,
      # or running `verify` with `-Dmaven.test.failure.ignore` or a skipped
      # repackage. All three were rejected: the first re-resolves and re-runs the
      # reactor for a phase the single lifecycle already contains, and the other two
      # put a tolerance on the primary build, which is precisely the mechanism that
      # lets a real compilation or test failure pass unnoticed.
      # GATING and FAIL-CLOSED: there is no `continue-on-error`, no `|| true` and no
      # numeric return-code tolerance on this step. Maven's exit status is the
      # authoritative result for the whole reactor -- Checkstyle bound to `validate`,
      # the ArchUnit `architecture-rules` execution, every module's Surefire suite,
      # Failsafe's integration suite and `repackage` -- and any one of them failing
      # fails this step and therefore this job.
      # Assumptions: the flags -- `-B` selects non-interactive batch output and
      # `--no-transfer-progress` suppresses per-artifact download lines, so a
      # failure is findable in the log instead of buried in resolution chatter.
      # WHY : Assumptions: ONE integration test in this reactor does not run here, and
      # the omission is deliberate and visible rather than silent.
      # account-service's AwsStarterRuntimeIT drives a real parameter-store import and
      # a real queue round trip against the pinned emulator release, which refuses to
      # start without a licence token; with no LOCALSTACK_AUTH_TOKEN in this
      # environment it aborts its own assumption and reports as skipped. Trade-offs:
      # this job therefore verifies that the Spring Cloud AWS starters START under the
      # pinned Spring Boot -- AwsIntegrationStartupTest needs no network and does run
      # here -- and not that they reach a real endpoint. A pipeline holding an emulator
      # token can set CARDDEMO_REQUIRE_LOCALSTACK=1 alongside it, which turns that skip
      # into a failure so a run that meant to exercise the layer cannot pass having
      # skipped it. The same two variables carry the same two meanings in the
      # repository's COBOL harness, so one convention governs both.
      # WHY : Assumptions: the OPENAPI CONTRACT gates also run inside this step and have
      # no step of their own, which is recorded here because a reader auditing "which
      # step enforces the published contract?" would otherwise find no answer. Each
      # service that publishes one carries a Surefire test holding its committed
      # document to the metadata its own configuration serves -- for example
      # com/carddemo/reporting/api/ReportingApiContractTest.java and
      # com/carddemo/authorization/config/ContractPublicationTest.java -- so a
      # contract that is absent, unparseable, routed outside the prefix both hops
      # forward, or disagreeing with its module about the contract's identity fails
      # this step. What those tests do NOT decide is agreement with the browser
      # client, because that comparison spans two languages and two packages: it is
      # the "Check API contract agreement" step in ui-ci.yml, whose path filter
      # deliberately includes services/*/src/main/resources/openapi/** so that a
      # change made on THIS side triggers it. Naming both halves keeps a reader from
      # assuming either one covers the other.
      - name: Run the reactor build, test and packaging gates
        shell: bash
        run: mvn -B --no-transfer-progress -f services/pom.xml clean verify

      # Step 4a: the Java documentation gate, surfaced on its own.
      # GATING -- a missing or incomplete Javadoc fails this step. This gate is
      # what makes the repository's explainability convention mechanical rather
      # than aspirational: the convention's stated validation gate is that code
      # missing its documentation fails review, and Checkstyle is how that is
      # decided by a tool instead of by whoever is reviewing.
      # Refactoring Rationale: this repeats the `validate` phase that Step 3
      # already ran, and the repetition is deliberate -- the repository's existing
      # pipeline uses the same intentionally-redundant-step pattern so that a
      # specific failure reports under a step title naming it. A missing Javadoc
      # here reads as "the documentation gate failed" instead of being buried
      # among the reactor's compilation and test output.
      # Trade-offs: no skip or tolerance flag -- `-Dcheckstyle.skip`,
      # `-Dcheckstyle.failOnViolation=false` and a trailing `|| true` would each turn this gate
      # into a decoration. None is present, and none may be added.
      - name: Run the Checkstyle documentation gate explicitly
        shell: bash
        run: mvn -B --no-transfer-progress -f services/pom.xml validate -DskipTests

      # Step 4b: the reactor's ArchUnit layering execution, surfaced on its own.
      #
      # GATING ON A BOUNDARY: a violated boundary fails this step. The authoritative
      # roster is the class itself --
      # services/common-lib/src/test/java/com/carddemo/common/architecture/LayeringRulesTest.java
      # -- and it is described below by ROLE rather than by count. Refactoring
      # Rationale: a count here is wrong the moment a rule is added, whereas the two
      # roles are stable and a reader can check the class against them directly.
      # Every `@Test` in it is one of:
      #
      #   a BOUNDARY assertion over one of the `ArchRule` constants the class
      #     declares -- A1 a domain type may not reach for an AWS SDK, Spring Web or
      #     Jakarta Servlet type; A2 no bounded context may reach into another
      #     context's domain model; A3 no type in the money path may declare binary
      #     floating point in any member position; A4 every security-chain
      #     configuration installs the shared refusal renderers; A5 no CardDemo class
      #     may depend on a retry or resilience library, which is the SOURCE half of
      #     the decision in docs/adr/ADR-002-compute-platform.md whose MANIFEST half
      #     is the `bannedDependencies` enforcer rule in services/pom.xml;
      #
      #   an ANTI-VACUITY guard, which fails when the boundary assertions have
      #     stopped being able to see anything -- an empty scanned class graph, a
      #     drifted package-root inventory, a prohibition list naming a construct no
      #     longer present, and a planted `double` that the money rule must reject.
      #     A rule set that silently stopped seeing code therefore cannot pass.
      #
      # Assumptions: the rules are evaluated in the CONSUMERS, not in the module
      # that owns them, which is why this step names an execution and not a class.
      # services/pom.xml declares the Surefire execution `architecture-rules` whose
      # `dependenciesToScan` collects the kernel's test classes; services/common-lib
      # publishes them as a test-jar and skips the inherited execution itself. Each
      # consumer therefore evaluates the rules against its own production classpath,
      # which is the only place a cross-service dependency exists to be caught, and
      # the kernel's ordinary `default-test` run covers the one module no consumer's
      # classpath reaches.
      #
      # Assumptions: the execution is FAIL-CLOSED as well as gating, through the
      # inherited `architecture-rules-fail-if-absent` profile in services/pom.xml --
      # activated by a module owning `${basedir}/src/main/java`, which every real
      # module has and the `pom`-packaged aggregator does not. Keeping it there
      # rather than on this command line is what makes the guarantee hold for a local
      # `mvn clean test` too; a command-line property would apply to this invocation
      # alone, and would name the aggregator as the culprit rather than the module
      # whose rule class went missing.
      #
      # Alternatives Considered: naming the rule class directly, as
      # `-pl common-lib -Dtest=LayeringRulesTest`. Rejected on two independent
      # grounds: that invocation targets the one module which skips the gate, and a
      # `-Dtest=` selector matching nothing aborts Maven rather than reporting an
      # architecture result. Naming the execution keeps the selector where it belongs
      # -- the reactor decides what constitutes the gate, this file only asks for it.
      # Alternatives Considered: adding `-Dsurefire.failIfNoSpecifiedTests=false` to
      # quiet that abort. Rejected -- that converts "the gate did not run" into a
      # silent pass, which is the precise failure this workflow exists to prevent.
      - name: Assert the reactor's ArchUnit layering execution
        shell: bash
        run: mvn -B --no-transfer-progress -f services/pom.xml test-compile surefire:test@architecture-rules

      # Step 5: prove every service image definition still builds. VALIDATION
      # ONLY -- nothing is pushed, no registry is contacted and no credential is
      # used, which is why this step needs no secret and no AWS permission at all.
      # GATING: a Dockerfile that no longer builds fails this step.
      #
      # Trade-offs: this repeats work the deployment workflow also performs, following
      # the repository's intentionally-redundant-step pattern. Paying the duplicate
      # build here catches a broken container definition on the pull request that
      # introduced it, instead of deferring the same failure to a point where it
      # blocks a release rather than a review.
      #
      # Assumptions: the repository root is the build context -- each service Dockerfile
      # compiles the unpublished common-lib sibling from source and its inherited
      # documentation gate reads config/checkstyle, which sits OUTSIDE the services
      # reactor -- so its COPY paths are repository-root-relative and every one of
      # them fails if the context is narrowed to services/. Each Dockerfile states
      # this contract in its own header; `.` is what satisfies it.
      # Alternatives Considered: guarding only that the discovery matched SOMETHING,
      # on the reasoning that an expected count turns adding a service into an
      # unrelated CI failure. Rejected because it inverts the risk: a `-eq 0` guard
      # passes while every image but one goes unbuilt, and reports success for
      # validating "1 service image definition(s)" -- a message that reads like a
      # pass. A missing image is not a neutral absence; it is a service that cannot
      # be deployed, which is precisely what a gate on image validation is for.
      # Assumptions: the canonical count is 8 -- one per reactor module except
      # common-lib, which is a library and produces no image. It is a literal because
      # deriving it at run time would read the same tree the assertion is checking, so
      # a module and its image disappearing together would still pass. Trade-offs: the
      # cost is one line to edit when a service is added or removed, in the diff beside
      # that module, so a reviewer sees the count change deliberately.
      # GATING: a count other than 8, or any `docker build` failure, fails this step.
      # Assumptions: the image is tagged locally -- the tag exists only so `docker build` has a stable name to
      # report; it names no registry host and no account, so nothing here can be
      # mistaken for a publishable reference.
      - name: Build all service images without pushing
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_images }}
        shell: bash
        run: |
          set -euo pipefail
          expected=8
          mapfile -t dockerfiles < <(find services -mindepth 2 -maxdepth 2 -name Dockerfile -print | sort)
          if [ "${#dockerfiles[@]}" -ne "$expected" ]; then
            echo "[ci-services] expected ${expected} services/*/Dockerfile, found ${#dockerfiles[@]}:" >&2
            printf '[ci-services]   %s\n' "${dockerfiles[@]:-<none>}" >&2
            echo "[ci-services] refusing to report success -- every service module except common-lib ships an image" >&2
            exit 1
          fi
          echo "[ci-services] validating all ${#dockerfiles[@]} service image definitions"
          for dockerfile in "${dockerfiles[@]}"; do
            service="$(basename "$(dirname "$dockerfile")")"
            echo "[ci-services] building ${service} from ${dockerfile}"
            docker build --file "$dockerfile" --tag "carddemo-ci/${service}:${GITHUB_SHA}" .
          done

      # Step 6: retain the machine-readable evidence for audit.
      # Trade-offs: `if: always()` -- the reports are most valuable precisely when a gate
      # failed, so this runs even after an earlier failure; skipping it on failure would discard
      # the only record of WHICH assertion broke.
      # Assumptions: these three paths -- Surefire and Failsafe write to their default
      # report directories and the reactor's POM records that this pipeline collects from exactly
      # those two, deliberately not relocating either -- moving one would leave the build green
      # while the pipeline published nothing. The Checkstyle result file is included so a
      # documentation-gate failure is auditable as data rather than only as log text. The Failsafe
      # directory is absent until the first integration test exists; a multi-pattern upload
      # succeeds while any one pattern matches, so naming it now keeps the collection contract
      # aligned with the POM rather than needing an edit later.
      # Trade-offs: `error` and not `warn` -- the reactor always writes Surefire XML, so an
      # empty result set means the tests did not run at all -- a genuine breach of the CI
      # contract. `error` fails the upload loudly instead of hiding a missing-report regression
      # behind a green run. GATING for that reason.
      # Alternatives Considered: a mutable tag (CWE-1357). Immutable full-SHA pin, same
      # supply-chain rationale as the actions above; `# v7.0.1` keeps it readable and
      # Dependabot-bumpable.
      # WHY : Refactoring Rationale: advanced from v4.4.3, whose bundle carried the vulnerable
      # `form-data` 4.0.0. The measurement and the runner requirement are recorded once at the
      # setup-java pin above and deliberately not restated, because two copies of one verification
      # claim drift apart and then one of them is false.
      # WHY : Assumptions: the three inputs below are unchanged by the major move. v7 adds an
      # `archive` input that turns a single-file upload into a direct, unzipped one; it defaults to
      # archiving and is not set here, because this step uploads a multi-glob report set and v7
      # fails a direct upload whose glob resolves to more than one file.
      - name: Upload Java test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carddemo-services-reports
          path: |
            services/*/target/surefire-reports/**
            services/*/target/failsafe-reports/**
            services/*/target/checkstyle-result.xml
          if-no-files-found: error

  # Assumptions: this job exists at all because it holds the two write scopes the advisory JUnit
  # publisher needs, in a job that runs NO repository-controlled code. It checks
  # nothing out, resolves no dependency, and builds no image; its only inputs are
  # the artifacts the build job uploaded. That is what makes the narrowing in
  # `java-services` above real rather than positional -- the token that can create
  # a check run is never present in a job where Maven, a Maven plugin or a
  # Dockerfile executes.
  # Assumptions: `needs` plus `if: always()` -- the annotations matter most when a gate
  # failed, so this must run after a failed build as well as a passing one.
  # `needs` orders it after the build without making it a gate; the authoritative
  # status was already set by Maven's exit code in the job above and nothing here
  # can change it.
  publish-java-reports:
    name: Publish the Java test annotations
    needs: java-services
    if: always()
    runs-on: ubuntu-24.04
    # Assumptions: a short ceiling -- this job downloads an artifact and calls one action, so
    # anything beyond a few minutes is a hang rather than a slow run.
    timeout-minutes: 10
    # Assumptions: least privilege -- exactly the two scopes the publisher uses, and no
    # `contents` scope at all -- it never reads the repository. `checks: write`
    # creates the check run that carries the annotations and `pull-requests: write`
    # attaches them to the pull request.
    permissions:
      checks: write
      pull-requests: write

    steps:
      # Assumptions: CWE-1357 -- immutable full-SHA pin, same supply-chain rationale as
      # every other pin in this file. Its SHA is verified rather than copied:
      # `3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c` is the commit the `v8.0.1` tag of
      # `actions/download-artifact` resolves to, read from that repository's own tag
      # reference. Recorded here rather than left implicit because the comments
      # around it assert that pins are verified, and an unverified pin sitting under
      # that assertion would be precisely the kind of untrue claim these conventions
      # exist to prevent.
      # Refactoring Rationale: advanced from v4.1.8, whose bundle carried the
      # vulnerable `form-data` 4.0.0; the measurement is recorded once at the
      # setup-java pin above. The previous note corroborated its SHA against the
      # SHA/tag pairing used by two large public workflow sets, which established
      # that the pin named the release it claimed to -- and could not establish
      # anything about what that release BUNDLED. Reading the release's own lock is
      # what closed the question, and it is the check this pin is now held to.
      # Assumptions: v8 changes two defaults in this action's favour and neither
      # affects the inputs below. A digest mismatch on the downloaded artifact now
      # FAILS the step instead of logging a warning, which is the behaviour this
      # repository would have chosen anyway; and non-zipped downloads are no longer
      # unzipped blindly, which does not arise here because the artifact this step
      # reads is uploaded as an archive.
      # Assumptions: the version differs from this file's `upload-artifact` pin -- the two
      # actions ship from separate repositories on separate cadences, so matching
      # version numbers would be a coincidence, not a consistency requirement.
      # ADVISORY -- like the publish step below, this step may fail without
      # consequence. Trade-offs: `continue-on-error` is required here because
      # `if: always()` also runs this job when the build job was skipped or
      # cancelled, in which case no artifact exists and a hard download failure
      # would red a run whose build never executed. Tolerating it costs nothing,
      # because the GATING existence check lives in the build job: its
      # upload-artifact step is declared `if-no-files-found: error`, so a missing
      # report already fails there rather than here.
      - name: Download the Java test reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: carddemo-services-reports
          path: java-reports

      # ADVISORY -- permitted to fail without consequence. Trade-offs:
      # `continue-on-error` plus `fail_on_failure: false` means a publisher outage
      # cannot red an otherwise-passing run, and equally cannot green a failing one.
      # Annotation is added visibility and must never become the thing that decides
      # the result.
      # Assumptions: CWE-1357 -- this is a THIRD-party action, so the immutable full-SHA pin
      # matters more here than anywhere else -- a maintainer-account takeover or a
      # tag move (as happened publicly to another widely-used action) would
      # otherwise execute attacker code with this job's token. It is pinned to a
      # release whose full 40-character SHA was authoritatively verifiable; a later
      # patch is adopted only once the same is true of it.
      # Assumptions: both report globs are published -- the build job runs Surefire and Failsafe as separate
      # gates and uploads both directories, so publishing only the Surefire glob
      # would leave the integration results unannotated -- the half most likely to
      # fail for an environmental reason a reader needs to see.
      - name: Publish Java JUnit annotations
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        with:
          report_paths: |
            java-reports/*/target/surefire-reports/*.xml
            java-reports/*/target/failsafe-reports/*.xml
          check_name: CardDemo Services Test Results
          fail_on_failure: false

  # Assumptions: no `needs:` on this job -- the ETL package consumes nothing the Java
  # reactor produces -- it is a separate distribution with its own dependency closure -- so making
  # it wait would only delay Python feedback and hide an ETL failure behind an unrelated Java one.
  # Alternatives Considered: chaining it after java-services to halve peak runner usage; rejected
  # because both failures are independently actionable and seeing both in one run is worth more
  # than the saved concurrency.
  data-migration:
    name: Lint and test the data-migration package
    # Trade-offs: pinned for the same reason as the Java job -- the ETL gates depend on the
    # image's system Python and build toolchain, so the image is reviewed rather than allowed to
    # drift with `ubuntu-latest`.
    runs-on: ubuntu-24.04
    # Trade-offs: a bounded runaway stop, as in the Java job. This job installs a
    # hash-verified closure and runs a fast suite, so the ceiling is lower than the Java job's; it
    # still sits well clear of an ordinary run so that reaching it signals a hang, never merely a
    # slow suite.
    timeout-minutes: 45
    # Assumptions: least privilege -- `contents: read` and nothing else, for the same reason
    # as the Java job above. This job installs a dependency closure and runs Ruff
    # and pytest over committed source, so a change to any of those executes here;
    # its advisory publisher moved to `publish-etl-reports` below, which runs no
    # repository code and holds the two write scopes on its own.
    permissions:
      contents: read

    steps:
      # Step 1: obtain the reviewed revision.
      # Alternatives Considered: CWE-1357 -- an immutable full-SHA pin rather than the mutable `@v4` tag,
      # for the same reason as the Java job's checkout -- a movable tag can be
      # repointed to run attacker code with this job's token, a content-addressed
      # SHA cannot.
      # Assumptions: CWE-522, `persist-credentials: false` -- by default checkout leaves the
      # job's `GITHUB_TOKEN` in `.git/config` as an extraheader for the rest of the
      # job, so every later step -- a Maven plugin, a `docker build`, a transitively
      # resolved dependency's build script -- runs with a usable write-capable
      # credential sitting on disk that none of them needs. Nothing in this job
      # pushes, tags or comments through git; the two publisher steps use the API
      # through their own action inputs. Removing the credential after the fetch
      # therefore costs this job nothing and removes the token from the reach of
      # every step that follows.
      # Trade-offs: a future step that genuinely needs to push would have to
      # re-authenticate explicitly rather than inherit a credential silently. That
      # is the point: it makes granting write access a visible edit here instead of
      # an invisible default.
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Step 2: provide the interpreter the ETL is pinned to.
      # Assumptions: 3.13 specifically -- the ETL container image is built on a 3.13 base
      # and the repository's existing COBOL harness already runs 3.13, so validating on 3.13 means
      # the fixed-point and EBCDIC codec behaviour under test is the same behaviour that runs in
      # production. An interpreter mismatch here would be the worst kind of drift, because a codec
      # that rounds or decodes differently produces plausible numbers that are quietly wrong.
      # Alternatives Considered: a mutable tag (CWE-1357). Immutable full-SHA pin.
      # Refactoring Rationale: advanced from v5.3.0, whose bundle carried the vulnerable
      # `form-data` 2.5.1 and 4.0.0. The note here previously argued for keeping the v5 line so
      # provenance would harden "without absorbing a major-version runtime change"; that reasoning
      # is withdrawn for the reason recorded once at the setup-java pin above -- a full SHA freezes
      # whatever the named release bundled, so staying put preserved the defect precisely.
      # Assumptions: the only input this step sets, `python-version`, is unchanged by the two
      # major moves. v7 removes the `pip-install` input, which this step never set, and drops
      # end-of-life interpreter versions, which does not touch 3.13 -- the version the ETL image
      # and the repository's existing harness both run.
      - name: Configure Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Step 3a: install the ETL's dependency closure, hash-verified.
      # Assumptions: requirements-dev.txt INCLUDES the runtime manifest rather than
      # restating it, and adds the pinned Ruff, pytest and coverage releases, so
      # one install produces the complete lint-and-test closure and the two files
      # can never disagree about a version they both hold.
      # Trade-offs: `--require-hashes` forces pip to verify every resolved artifact against
      # the SHA-256 recorded in the manifest and to REJECT any unpinned or unhashed requirement,
      # including transitive ones, so a tampered or substituted dependency fails the install
      # closed instead of installing quietly. This is available only because both manifests are
      # hash-complete; the flag fails closed against a merely version-pinned file, so it is used
      # here as a verified property of these manifests rather than as a habit.
      - name: Install ETL dependencies
        shell: bash
        run: python -m pip install --require-hashes -r data-migration/requirements-dev.txt

      # Step 3b: build and install the distribution itself, then test THAT.
      # Assumptions: this step exists because the package uses a src layout, which keeps the
      # checkout off the default import path precisely so the import the tests exercise is the one
      # the container performs. Step 3a installs only dependencies, so without this step `import
      # carddemo_migration` cannot resolve and the whole suite fails at collection. Alternatives
      # Considered: putting the source tree back on the import path, via `PYTHONPATH` here or a
      # `pythonpath` entry in the package's pytest configuration. Rejected, and the package's own
      # configuration records the same decision: a source-path injection shadows the installed
      # copy, so the tests would verify the source tree and never the built artifact -- meaning a
      # subpackage missing from the wheel, a broken package discovery or an unpackaged console
      # entry point would pass every test here and fail for the first time in the container. That
      # is the exact failure the src layout exists to expose. Building and installing instead
      # makes distribution correctness something the test run genuinely covers.
      # Assumptions: `--no-deps` -- every dependency is already present from the
      # hash-verified install above, so this invocation must not be allowed to resolve anything
      # itself; without the flag pip could fetch an unhashed artifact and quietly undercut the
      # closure Step 3a just guaranteed.
      # Assumptions: the `./` prefix -- `pip install data-migration` would resolve an
      # unrelated distribution of that name from the index; the leading `./` forces pip to treat
      # the argument as this local project directory.
      - name: Build and install the ETL distribution
        shell: bash
        run: python -m pip install --no-deps ./data-migration

      # Step 3c: smoke-test BOTH declared entry points of the installed distribution.
      # Assumptions: this step exists because nothing else in this workflow invokes the package. The
      # lint gate reads files and the test gate imports modules, so a distribution
      # whose sole documented invocation does not resolve installed cleanly and
      # passed every gate -- which is exactly what happened while
      # `carddemo_migration.cli` was absent: `pip install` succeeded, the
      # console-script wrapper was generated, and both the documented `python -m`
      # form and the container ENTRYPOINT exited with ModuleNotFoundError with no
      # gate able to notice.
      # Assumptions: `cd "$RUNNER_TEMP"` is what makes this a test of the INSTALLED
      # distribution. Run from the checkout, `python -m carddemo_migration.cli` could
      # still resolve through the source tree under a src layout, so the step would
      # pass for a wheel that never contained the module -- the same shadowing the
      # install step above refuses for the test suite, applied to the entry points.
      # Assumptions: `--help` is the whole of the check. It exercises module
      # resolution, the console-script wrapper, argument parsing and the documented
      # exit-zero-on-help contract that this package's Dockerfile depends on for its
      # `CMD ["--help"]`, and it contacts no database, object store or credential, so
      # it needs no environment and cannot be flaky.
      # GATING and FAIL-CLOSED: `set -euo pipefail` with no tolerance, so a
      # non-resolving module, a missing wrapper or a non-zero help status fails this
      # step. Trade-offs: `--help` proves an entry point resolves and parses, not
      # that a subcommand does its work; that is what the test suite in the next
      # steps covers, and keeping the two separate means an unrunnable entry point is
      # reported as an entry-point failure rather than as a test error.
      - name: Smoke-test the ETL entry points
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python -m carddemo_migration.cli --help
          carddemo-migrate --help

      # Step 4: the Python documentation gate.
      # GATING -- a missing or malformed docstring fails this step. Assumptions:
      # Ruff resolves configuration from the nearest pyproject.toml as it walks up
      # from each file, so running from the package directory is what makes the
      # package's own rule selection authoritative -- including the pydocstyle `D`
      # family that turns the repository's explainability convention into a
      # build-failing check for Python, the counterpart of Checkstyle for Java.
      # Trade-offs: no tolerance -- no `|| true` and no `continue-on-error`, for the same
      # reason as the Java documentation gate -- a documentation gate that cannot fail is not a
      # gate.
      - name: Run Ruff and the Python documentation gate
        working-directory: data-migration
        shell: bash
        run: ruff check .

      # Step 5: run the ETL suite against the installed distribution.
      # GATING -- any failing or uncollectable test fails this step. Because Step 3b
      # installed the package, `import carddemo_migration` resolves in
      # site-packages, so these tests exercise the same import path the container
      # does.
      # This step is also the SECOND HALF of the Python documentation gate, and not
      # only a functional suite. Assumptions: the D presence checks Step 4 runs are
      # public-declaration checks, so `data-migration/tests/test_docstring_gate.py`
      # walks the package and this suite with `ast` and asserts a docstring on every
      # declaration at any visibility and any nesting depth. Measured when that gate
      # was added, against the pinned ruff: 90 of 221 declarations in the package
      # source were invisible to Step 4. Excluding or deselecting that module leaves
      # those declarations enforced by nothing.
      # Assumptions: an explicit `--junitxml` into a dedicated directory -- the suite writes
      # no machine-readable report by default, and the upload below is what makes the result
      # auditable. The directory is created first because pytest will not create a missing parent
      # for the report file. It is deliberately NOT the repository's `reports/` directory, which
      # belongs to the COBOL parity oracle's pipeline; writing there would collide with that
      # suite's artifacts.
      - name: Run ETL tests
        shell: bash
        run: |
          mkdir -p data-migration-reports
          python -m pytest data-migration/tests --junitxml=data-migration-reports/pytest.xml

      # Step 6: retain the ETL evidence under its own artifact name.
      # Assumptions: a distinct artifact name -- the Java job uploads separately, and two
      # jobs uploading under one name would collide; keeping them separate also means an ETL-only
      # failure is downloadable without the Java reports.
      # Trade-offs: `if: always()` -- as in the Java job, the report matters most when a
      # gate failed, so it is collected even after a failure.
      # Trade-offs: `error` and not `warn` -- Step 5 always writes this XML when it runs, so
      # an empty directory means the suite did not execute -- exactly the unexecuted-but-green
      # outcome this gate exists to prevent. GATING for that reason.
      # Alternatives Considered: a mutable tag (CWE-1357). Immutable full-SHA pin, same
      # rationale as every other pin in this file, and advanced off the vulnerable v4.4.3 bundle
      # with the rest -- measured once at the setup-java pin above.
      - name: Upload ETL test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carddemo-data-migration-reports
          path: data-migration-reports/**
          if-no-files-found: error

  # Alternatives Considered: one publisher shared with the Java reports, rejected -- the two
  # build jobs are deliberately independent -- the ETL consumes nothing the Java
  # reactor produces -- so a shared publisher would have to wait for both and would
  # delay ETL feedback behind an unrelated Java build. Each publisher waits only on
  # the job whose artifact it reads.
  publish-etl-reports:
    name: Publish the ETL test annotations
    needs: data-migration
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Assumptions: least privilege -- the same two scopes as the Java publisher, no
    # `contents` scope, and no repository code in the job.
    permissions:
      checks: write
      pull-requests: write

    steps:
      # Assumptions: CWE-1357 -- immutable full-SHA pin, same rationale as every other pin.
      # This is the same `download-artifact` SHA the Java publisher above uses, and
      # the provenance note recorded there covers it -- deliberately not restated,
      # because two copies of one verification claim can drift apart and then one of
      # them is false.
      # ADVISORY -- like the publish step below, this step may fail without
      # consequence. Trade-offs: `continue-on-error` is required here because
      # `if: always()` also runs this job when the build job was skipped or
      # cancelled, in which case no artifact exists and a hard download failure
      # would red a run whose build never executed. Tolerating it costs nothing,
      # because the GATING existence check lives in the build job: its
      # upload-artifact step is declared `if-no-files-found: error`, so a missing
      # report already fails there rather than here.
      - name: Download the ETL test reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: carddemo-data-migration-reports
          path: etl-reports

      # ADVISORY -- the second and last tolerated failure in this workflow.
      # Trade-offs: as with the Java publisher, `continue-on-error` plus
      # `fail_on_failure: false` keeps a publisher outage from reddening a passing
      # run and, equally important, keeps it from greening a failing one -- pytest's
      # exit code in the build job already set the authoritative status.
      # Assumptions: a distinct check name -- it must not collide with the Java job's check or
      # with the COBOL suite's, so each of the three reports under its own heading.
      # Assumptions: CWE-1357 -- third-party action, immutable full-SHA pin, adopted only at
      # a release whose full 40-character SHA was authoritatively verifiable.
      - name: Publish ETL JUnit annotations
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        with:
          report_paths: "etl-reports/*.xml"
          check_name: CardDemo Data Migration Test Results
          fail_on_failure: false
