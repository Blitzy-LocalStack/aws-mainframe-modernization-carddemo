# =============================================================================
# .github/workflows/infra-ci.yml
# -----------------------------------------------------------------------------
# Purpose:
#   Performs credential-free Terraform format, initialization, validation,
#   lint, documentation-drift, secret, and explicit material-security policy
#   gates, plus a Rule 1 gate over the Python this file itself embeds. A manual
#   same-repository run may additionally produce a real remote-state plan through
#   short-lived OIDC credentials. This workflow never mutates infrastructure.
#
# Parameters:
#   workflow_dispatch.run_plan selects the optional credentialed plan job;
#   workflow_dispatch.environment selects the one environment root it evaluates.
# Return values:
#   Every static gate and required artifact is GATING. The plan job is
#   CONDITIONAL, but once selected every initialization and plan error is fatal.
# Exceptions or errors:
#   Fork pull requests run the credential-free graph only. No lint, docs,
#   secret, or policy failure is tolerated.
#
# WHY (non-obvious design decisions):
#   - Alternatives Considered: action wrappers for Terraform and security tools.
#     Rejected where no reviewed SHA was needed; checksum-pinned binaries preserve
#     native exit codes and avoid a mutable wrapper in the policy gate.
#   - Trade-offs: tool downloads are intentionally cacheless, accepting repeated
#     transfer in exchange for no cache-poisoning surface in a security job.
#   - Assumptions: backend-free init validates providers and modules without AWS
#     credentials; backend correctness is exercised by the optional real plan.
#   - Assumptions: the Python embedded in this file is gated by this file. Ruff
#     walks files on disk and a heredoc body is a string inside a YAML value, so
#     no packaged Python gate can reach it; one step extracts every block and
#     applies Ruff plus a Rule 1 element check, including to itself. The full
#     argument, and why a governed .py module was rejected, is at that step.
# =============================================================================

name: CardDemo Infrastructure CI

# Refactoring Rationale: these triggers were an ALLOW-LIST of migration-owned paths
# (infra, services, ui, data-migration, config, docs, three root documents, .gitignore
# and .github/workflows). That shape defeated the one gate this workflow exists to
# provide. The secret scan below stages every tracked file, so it catches a credential
# anywhere -- but only once the workflow RUNS, and a revision whose only changed path
# sat outside the allow-list never started it. A force-added top-level `.env`,
# `secrets.pem`, `credentials` or `terraform.tfstate` is exactly such a revision, which
# made the ignore-file's claim that content scanning cannot be bypassed untrue.
# Inverting to an ignore-list closes that hole by construction: any changed path that is
# not one of the four immutable reference trees starts this workflow, so there is no
# path a credential can be committed at without being scanned.
#
# Assumptions: `paths-ignore` skips a revision only when EVERY changed file matches one
# of its patterns. A baseline-only revision therefore still skips this workflow and stays
# owned by tests.yml, while a revision that touches a baseline file AND a root credential
# runs, because not every changed file matched.
# Trade-offs: this widens the trigger to paths that cannot affect Terraform -- LICENSE,
# NOTICE and any tree added later -- so those revisions now pay for a Terraform format,
# init, validate, lint and documentation-drift pass they cannot fail meaningfully. That
# cost is accepted because the alternative is a security gate with a documented bypass,
# and because narrowing the trigger again is precisely how the bypass reappeared.
on:
  push:
    branches: [main]
    paths-ignore:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "samples/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "samples/**"
  workflow_dispatch:
    inputs:
      run_plan:
        description: "Run a real remote-state Terraform plan after all credential-free gates pass."
        required: false
        type: boolean
        default: false
      environment:
        description: "Environment root to plan when run_plan is enabled."
        required: false
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

# Trade-offs: static validation has no persistent side effect, so a stale run
# may be cancelled safely instead of racing a newer revision for runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-static:
    name: Format, validate, lint and scan the Terraform package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Assumptions: Python 3.13 is used only to install the exact CI-only
      # Checkov release; it never enters a runtime artifact.
      # Refactoring Rationale: advanced from setup-python v5.3.0, whose bundle
      # carried the vulnerable `form-data` 2.5.1 and 4.0.0; the measurement, the
      # node24 runner requirement and the input-compatibility check are recorded
      # once at the setup-java pin in services-ci.yml. `python-version` is the only
      # input set here and v7 still declares it.
      - name: Configure Python for the policy scanner
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Assumptions: every archive is bound to a reviewed release and literal
      # digest. The visible version checks fail before a gate runs with the wrong
      # executable.
      - name: Install checksum-pinned infrastructure tools
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/carddemo-infra-tools"
          mkdir -p "$install_dir"

          terraform_version="1.15.8"
          terraform_archive="terraform_${terraform_version}_linux_amd64.zip"
          curl -fsSLo "$install_dir/$terraform_archive" "https://releases.hashicorp.com/terraform/${terraform_version}/${terraform_archive}"
          printf '%s  %s\n' "d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d" "$install_dir/$terraform_archive" | sha256sum -c -
          unzip -q "$install_dir/$terraform_archive" -d "$install_dir"

          tflint_version="0.64.0"
          tflint_archive="tflint_linux_amd64.zip"
          curl -fsSLo "$install_dir/$tflint_archive" "https://github.com/terraform-linters/tflint/releases/download/v${tflint_version}/${tflint_archive}"
          printf '%s  %s\n' "cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537" "$install_dir/$tflint_archive" | sha256sum -c -
          unzip -q "$install_dir/$tflint_archive" -d "$install_dir"

          docs_version="0.20.0"
          docs_archive="terraform-docs-v${docs_version}-linux-amd64.tar.gz"
          curl -fsSLo "$install_dir/$docs_archive" "https://github.com/terraform-docs/terraform-docs/releases/download/v${docs_version}/${docs_archive}"
          printf '%s  %s\n' "34ae01772412bb11474e6718ea62113e38ff5964ee570a98c69fafe3a6dff286" "$install_dir/$docs_archive" | sha256sum -c -
          tar -xzf "$install_dir/$docs_archive" -C "$install_dir"

          gitleaks_version="8.30.1"
          gitleaks_archive="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          curl -fsSLo "$install_dir/$gitleaks_archive" "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/${gitleaks_archive}"
          printf '%s  %s\n' "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" "$install_dir/$gitleaks_archive" | sha256sum -c -
          tar -xzf "$install_dir/$gitleaks_archive" -C "$install_dir" gitleaks

          echo "$install_dir" >> "$GITHUB_PATH"
          python -m pip install "checkov==3.3.8"

          # Assumptions: ruff is pinned to the same 0.16.0 the data-migration package
          #   pins, so the embedded-Python gate below and the packaged Python gate cannot
          #   disagree about what a docstring rule means. A floating version would let a
          #   new release change this workflow's verdict without any change to this
          #   workflow.
          python -m pip install "ruff==0.16.0"

      - name: Verify infrastructure tool versions
        shell: bash
        run: |
          set -euo pipefail
          terraform version
          tflint --version
          terraform-docs --version
          gitleaks version
          checkov --version
          ruff --version

      # Assumptions: the Python inside this workflow is source code and Rule 1 binds it,
      #   but it reaches no Python gate on its own. Ruff walks files on disk; a heredoc
      #   body is a string inside a YAML value, so `ruff check .` never sees it, and the
      #   data-migration AST gate walks that package only. Two of the blocks below had
      #   shipped with no module docstring at all and five of their functions documented
      #   neither their parameters nor their return value, which is the exact shape the
      #   packaged gates exist to prevent and were never asked about here. This step
      #   extracts every block and applies both halves to it: ruff for the rules a linter
      #   can decide, and an explicit check that each docstring names the elements Rule 1
      #   enumerates.
      #   Alternatives Considered: moving the code into governed .py files under a package
      #   and calling them from the workflow. Rejected for a reason specific to what these
      #   blocks are -- three of the five assert facts about THIS workflow file and about
      #   the roots it drives, so they are configuration checks rather than reusable code,
      #   and a package would put a step's own precondition a directory away from the step
      #   that depends on it. The blocks are also each run exactly once, by one step, so
      #   there is no second caller for a module to serve.
      #   Assumptions: the extraction is exact rather than best-effort. The expected block
      #   count is asserted, so a newly added block that does not match the opener pattern
      #   fails this gate instead of being skipped in silence -- a silent skip being the
      #   failure mode that let the two undocumented blocks through in the first place.
      #   Trade-offs: the Rule 1 element check is a section-NAME check, not a semantic one.
      #   It decides that a docstring states its parameters and its return value, and
      #   cannot decide whether the prose is accurate; that half stays with review, exactly
      #   as `docs/CODE_DOCUMENTATION_STANDARD.md` records for every language. The cheaper
      #   alternative of selecting ruff's own D417 was measured and does not substitute:
      #   the pep257 convention this repository uses disables it, and enabling it would
      #   additionally require the Google or NumPy section syntax, which is not the form
      #   these docstrings or the packaged ones are written in.
      - name: Verify the workflow's embedded Python against the Rule 1 gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'GATE'
          """Extract every heredoc Python block in this workflow and gate each one.

          Parameters:
              None. The workflow path and the expected block count are module constants,
              because this module checks exactly one file -- the one it is embedded in.
          Returns:
              None. Successful completion lets the workflow step exit zero.
          Raises:
              AssertionError: If the number of extracted blocks differs from the expected
                  count, which is what stops a newly added block from escaping the gate.
              SystemExit: With a non-zero status if any block breaks a ruff rule or omits a
                  Rule 1 docstring element. Raised deliberately so the step fails.
              OSError: If the workflow file cannot be read.
          """

          import ast
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          WORKFLOW = Path(".github/workflows/infra-ci.yml")

          # Assumptions: the count includes THIS block, so the gate covers itself. A gate
          #   exempt from its own rule is the first place a convention decays.
          EXPECTED_BLOCKS = 5

          OPENER = re.compile(r"^(?P<indent> *)python3? - <<'(?P<delimiter>[A-Z]+)'$")


          def blocks(text):
              """Return one dedented Python source per heredoc block, in file order.

              Parameters:
                  text (str): The whole workflow file as a single string.
              Returns:
                  list[tuple[str, str]]: A (delimiter, source) pair for each block found.
              Raises:
                  AssertionError: If a heredoc is opened and never closed by its delimiter,
                      which would otherwise silently swallow the rest of the file into one
                      block and lint it as Python.
              """
              found = []
              lines = text.splitlines()
              index = 0
              while index < len(lines):
                  opened = OPENER.match(lines[index])
                  if opened is None:
                      index += 1
                      continue
                  # Assumptions: the opener's own indentation is the block's left margin.
                  #   A YAML literal scalar has already had its base indentation removed
                  #   by the time the shell runs, so subtracting that margin reproduces
                  #   the source the interpreter actually receives rather than an
                  #   approximation of it.
                  margin = len(opened.group("indent"))
                  delimiter = opened.group("delimiter")
                  index += 1
                  body = []
                  while index < len(lines) and lines[index].strip() != delimiter:
                      body.append(lines[index][margin:])
                      index += 1
                  assert index < len(lines), f"heredoc <<'{delimiter}' is never closed"
                  found.append((delimiter, "\n".join(body) + "\n"))
                  index += 1
              return found


          def raises_something(node):
              """Report whether a body can raise, counting assert as a raise.

              Parameters:
                  node (ast.AST): The module or function node whose body is examined.
              Returns:
                  bool: True if the body contains a raise or an assert statement.
              Raises:
                  None.
              """
              # Assumptions: a nested function's own statements are not counted for its
              #   parent, so each definition is judged on what it does itself.
              for child in ast.walk(node):
                  if isinstance(child, (ast.Raise, ast.Assert)):
                      return True
              return False


          def missing_elements(source, label):
              """List the Rule 1 docstring elements the module and its functions omit.

              Parameters:
                  source (str): One extracted block's Python source.
                  label (str): Name used to identify the block in a report line.
              Returns:
                  list[str]: One human-readable line per omission, empty when the block
                      documents every element Rule 1 enumerates.
              Raises:
                  SyntaxError: If the extracted block is not valid Python, which means the
                      extraction margin was wrong rather than the source being bad.
              """
              tree = ast.parse(source)
              problems = []
              subjects = [(label + " module", tree)]
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      subjects.append((f"{label} function {node.name}", node))

              for name, node in subjects:
                  text = ast.get_docstring(node)
                  if not text:
                      problems.append(f"{name}: no docstring")
                      continue
                  required = ["Parameters:", "Returns:"]
                  if raises_something(node):
                      required.append("Raises:")
                  for section in required:
                      if section not in text:
                          problems.append(f"{name}: docstring omits {section}")
              return problems


          extracted = blocks(WORKFLOW.read_text(encoding="utf-8"))
          assert len(extracted) == EXPECTED_BLOCKS, (
              f"expected {EXPECTED_BLOCKS} embedded Python blocks, found {len(extracted)}"
          )

          omissions = []
          for ordinal, (delimiter, source) in enumerate(extracted, start=1):
              omissions.extend(missing_elements(source, f"block {ordinal} <<{delimiter}>>"))

          with tempfile.TemporaryDirectory() as staging:
              paths = []
              for ordinal, (delimiter, source) in enumerate(extracted, start=1):
                  staged = Path(staging) / f"block_{ordinal:02d}_{delimiter.lower()}.py"
                  staged.write_text(source, encoding="utf-8")
                  paths.append(str(staged))
              # Assumptions: --isolated with an explicit selection rather than the
              #   data-migration pyproject. That file also configures first-party import
              #   resolution and a relative-import ban for a package these blocks are not
              #   members of, so pointing at it would apply rules about a package layout
              #   that does not exist here. The rule families and the convention are the
              #   same ones it selects, which is the part that has to match.
              linted = subprocess.run(
                  [
                      "ruff", "check", "--isolated", "--no-cache",
                      "--select", "D,E,W,F,I", "--line-length", "100",
                      "--config", 'lint.pydocstyle.convention = "pep257"',
                      *paths,
                  ],
                  check=False,
              )

          for problem in omissions:
              print(f"Rule 1 element missing: {problem}")

          if omissions or linted.returncode != 0:
              sys.exit(1)

          print(f"Embedded Python gate: PASS ({len(extracted)} blocks)")
          GATE


      # Alternatives Considered: bare terraform fmt, which rewrites the checkout
      # and lets drift pass. Check mode preserves the review boundary.
      - name: Check Terraform formatting without mutation
        shell: bash
        run: terraform fmt -check -recursive infra/

      # Assumptions: validate needs initialized provider schemas, while a normal
      # init would require the remote backend and credentials. -backend=false
      # resolves modules/providers without touching state.
      - name: Initialize and validate every Terraform root without a backend
        shell: bash
        run: |
          set -euo pipefail
          for root in infra/bootstrap infra/envs/dev infra/envs/prod; do
            terraform -chdir="$root" init -backend=false -lockfile=readonly -input=false
            terraform -chdir="$root" validate
          done

      # Assumptions: the AWS ruleset is itself pinned in infra/.tflint.hcl.
      # Initialization verifies its signature before recursive lint executes.
      - name: Run the Rule 1 HCL lint gate
        shell: bash
        run: |
          set -euo pipefail
          tflint --init --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"
          tflint --recursive --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"

      # Alternatives Considered: regenerating README tables in CI. Rejected
      # because silent mutation would hide the documentation drift this gate is
      # intended to make reviewable.
      - name: Check terraform-docs drift across all modules and roots
        shell: bash
        run: |
          set -euo pipefail
          for dir in infra/bootstrap infra/modules/* infra/envs/dev infra/envs/prod; do
            terraform-docs --config "$GITHUB_WORKSPACE/infra/.terraform-docs.yml" --output-check "$dir"
          done

      # WHY : terraform-docs above regenerates the GENERATED table and can therefore only
      #       detect drift in the part of a document a tool writes. Every count claim in this
      #       package lives in the hand-written header comment ABOVE that table -- "Ten
      #       outputs", "the fourteen inputs", "Six outputs ... where main.tf creates sixteen
      #       resources" -- and a generator has nothing to say about those. Five files had
      #       counts that disagreed with their own declarations, one of them omitting two
      #       outputs the kms module reads as a cross-module contract, which is how a reader
      #       ends up concluding a published value is not published. This gate re-derives each
      #       claimed number from the declarations themselves.
      #       Alternatives Considered: deleting the counts and letting the generated table
      #       speak. Rejected because the header states what the surface IS FOR -- which values
      #       are contracts, which are null for which instantiation -- and a table of names and
      #       types cannot carry that. Counting is what keeps the prose checkable.
      #       Assumptions: only the claims that are countable from HCL are asserted. Prose about
      #       intent is not, and narrowing what a reviewer must verify by hand to exactly that
      #       set is the purpose.
      - name: Verify hand-written Terraform prose counts against the declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PROSE'
          """Verify every spelled-out count in a Terraform header against the declarations.

          Parameters:
              None. The paths and prose patterns are literals below, one per claim,
              because each claim is a different sentence in a different file.
          Returns:
              None. Successful completion lets the workflow step exit zero.
          Raises:
              AssertionError: If a header states a count no declaration supports, if a
                  claimed sentence is absent from the file that should carry it, or if a
                  header spells a number this module does not recognise.
          """

          import re
          from pathlib import Path

          SPELLED = {
              "one": 1, "two": 2, "three": 3, "four": 4, "five": 5, "six": 6, "seven": 7,
              "eight": 8, "nine": 9, "ten": 10, "eleven": 11, "twelve": 12, "thirteen": 13,
              "fourteen": 14, "fifteen": 15, "sixteen": 16, "seventeen": 17, "eighteen": 18,
              "nineteen": 19, "twenty": 20, "twenty-one": 21, "twenty-two": 22,
          }


          def declared(path, kind):
              """Count top-level blocks of one kind in one Terraform file.

              Parameters:
                  path (str): Repository-relative path of the Terraform file to read.
                  kind (str): Block keyword to count, such as "output" or "variable".
              Returns:
                  int: How many blocks of that kind the file declares at top level.
              Raises:
                  OSError: If the path does not exist or cannot be read, which is a
                      moved or renamed file rather than a prose defect and is left to
                      surface as itself instead of being reported as a count mismatch.
              """
              body = Path(path).read_text()
              # Assumptions: the match is anchored at column zero, so a nested block or a
              #   block name quoted inside a comment cannot inflate the count.
              return len(re.findall(r'(?m)^%s "' % kind, body))


          def spelled(path, pattern):
              """Read one spelled number out of a file's header comment.

              Parameters:
                  path (str): Repository-relative path of the file whose header is read.
                  pattern (str): Regular expression whose first group captures the number
                      word, written to match the surrounding sentence so that the claim
                      being checked is identified by its own wording.
              Returns:
                  int: The numeric value of the captured word.
              Raises:
                  AssertionError: If the pattern matches nothing, which means the sentence
                      was reworded or removed, or if the captured word is not one this
                      module maps -- both of which leave the claim unchecked and so are
                      failures rather than skips.
                  OSError: If the path cannot be read.
              """
              found = re.search(pattern, Path(path).read_text())
              assert found, f"{path}: no prose count matching {pattern}"
              # WHY: a sentence-initial number is capitalised ("Ten outputs"), so the word is
              #   lowered before lookup rather than the pattern being written twice.
              word = found.group(1).lower()
              assert word in SPELLED, f"{path}: unrecognised number word {word!r}"
              return SPELLED[word]


          alb_out = "infra/modules/alb/outputs.tf"
          assert spelled(alb_out, r"([A-Za-z-]+) outputs, and every one of") == declared(alb_out, "output")
          assert spelled(alb_out, r"variables\.tf's ([A-Za-z-]+) inputs are invisible") == declared(
              "infra/modules/alb/variables.tf", "variable")
          assert spelled(alb_out, r"the ([A-Za-z-]+) `variable` blocks in variables\.tf") == declared(
              "infra/modules/alb/variables.tf", "variable")

          svc_out = "infra/modules/ecs-service/outputs.tf"
          assert spelled(svc_out, r"([A-Za-z-]+) values -- [a-z-]+ strings and one number") == declared(
              svc_out, "output")
          assert spelled(svc_out, r"[a-z-]+ values -- ([A-Za-z-]+) strings and one number") == declared(
              svc_out, "output") - 1

          spa_out = "infra/modules/cloudfront-spa/outputs.tf"
          assert spelled(spa_out, r"([A-Za-z-]+) outputs, each of type string") == declared(
              spa_out, "output")
          assert spelled(spa_out, r"NARROW -- ([A-Za-z-]+) outputs where") == declared(spa_out, "output")
          assert spelled(spa_out, r"main\.tf creates ([A-Za-z-]+) resources") == declared(
              "infra/modules/cloudfront-spa/main.tf", "resource")
          assert spelled(spa_out, r"resources and reads ([A-Za-z-]+) data sources") == declared(
              "infra/modules/cloudfront-spa/main.tf", "data")

          cluster = "infra/modules/ecs-cluster/main.tf"
          assert spelled(cluster, r"([A-Za-z-]+) resources and deliberately nothing else") == declared(
              cluster, "resource")
          assert spelled(cluster, r"the ([A-Za-z-]+) customer-managed keys to `kms`") == len(
              re.findall(r'(?m)^resource "aws_kms_key"',
                         Path("infra/modules/kms/main.tf").read_text()))

          boot = "infra/bootstrap/variables.tf"
          assert spelled(boot, r"Parameters -- the ([A-Za-z-]+) inputs") == declared(boot, "variable")
          assert spelled(boot, r"The ([A-Za-z-]+) nullable overrides") == len(
              re.findall(r"(?m)^  default     = null$", Path(boot).read_text()))

          # WHY : Refactoring Rationale: the network module was NOT covered here, and it
          #       drifted furthest of any module -- twenty-one published outputs against a
          #       contract specified at sixteen, with its own header still claiming
          #       twenty-one in one place and the input count stale in three files. Prose
          #       and declarations agreeing by review is exactly what did not happen, so
          #       the module is now counted like the other five.
          # WHY : Assumptions: the output count is asserted from THREE files, not one.
          #       outputs.tf states it in its return-value inventory, main.tf restates it
          #       because a reader of the resources wants to know what leaves, and both
          #       must equal what is declared. A single-file check would let the other
          #       copy drift, which is how the stale twenty-one survived.
          net_out = "infra/modules/network/outputs.tf"
          net_main = "infra/modules/network/main.tf"
          net_vars = "infra/modules/network/variables.tf"
          assert spelled(net_out, r"([A-Za-z-]+) outputs in [a-z-]+ groups") == declared(
              net_out, "output")
          assert spelled(net_main, r"outputs\.tf publishes ([A-Za-z-]+) values read") == declared(
              net_out, "output")
          assert spelled(net_out, r"All ([A-Za-z-]+) module inputs are declared") == declared(
              net_vars, "variable")
          assert spelled(net_main, r"All ([A-Za-z-]+) inputs are declared") == declared(
              net_vars, "variable")
          assert spelled(net_vars, r"consumes all ([A-Za-z-]+) variables") == declared(
              net_vars, "variable")
          assert spelled(net_vars, r"Parameters -- ([A-Za-z-]+), of which one is required") == declared(
              net_vars, "variable")

          # WHY : Assumptions: this is a CONNECTIVITY assertion rather than a count, and it
          #       is here because the two rules it names were missing and their absence did
          #       not fail anything -- validate, tflint, terraform-docs and the policy scan
          #       all passed while every object-storage call was dropped at the ENI and no
          #       service could fetch the Cognito JWK set it needs to start. A rule whose
          #       absence is invisible to every other gate needs one of its own.
          # WHY : Trade-offs: it asserts the rules EXIST, not that they are reachable at
          #       run time, which no static gate can know. Naming the two resources is
          #       still enough to stop a future tidy-up removing them as unused, which is
          #       the regression that actually happened once.
          network_body = Path(net_main).read_text()
          for required_rule in (
              "app_to_s3_gateway",
              "data_to_s3_gateway",
              "app_to_identity_provider",
          ):
              assert re.search(
                  r'(?m)^resource "aws_vpc_security_group_egress_rule" "%s"' % required_rule,
                  network_body,
              ), (
                  f"infra/modules/network/main.tf: egress rule {required_rule} is absent. "
                  "The S3 gateway endpoint carries no security group, so S3 needs a "
                  "prefix-list rule, and Cognito has no interface endpoint in the "
                  "specified eight-service set, so its JWK set leaves through NAT. "
                  "Without these rules the tiers are provisioned and unreachable."
              )

          # WHY : Assumptions: a confused-deputy condition pair is the kind of thing a
          #       refactor drops silently, because removing it changes no plan output that
          #       a reviewer reads.
          # WHY : Trade-offs: the match is against the `variable = "<key>"` ARGUMENT and is
          #       scoped to the assume-role document, not against the key name anywhere in
          #       the file. A bare substring test was tried first and was WRONG -- it passed
          #       with the condition deleted, because the surrounding why-comment names both
          #       keys, so prose alone satisfied it. A gate a comment can satisfy is not a
          #       gate. Slicing the document out first also stops a condition on some other
          #       policy in this file from standing in for this one.
          assume_doc = re.search(
              r'(?ms)^data "aws_iam_policy_document" "flow_logs_assume_role" \{.*?^\}',
              network_body,
          )
          assert assume_doc, (
              "infra/modules/network/main.tf: the flow-log assume-role policy document is "
              "absent or no longer a top-level block, so its trust conditions cannot be "
              "verified."
          )
          for condition_key in ("aws:SourceAccount", "aws:SourceArn"):
              assert re.search(
                  r'variable\s*=\s*"%s"' % re.escape(condition_key), assume_doc.group(0)
              ), (
                  f"infra/modules/network/main.tf: the flow-log role trust policy must "
                  f"carry a {condition_key} condition argument. Without both, the VPC Flow "
                  "Logs service can assume this role on behalf of a flow log in another "
                  "account."
              )

          print("Terraform prose counts: PASS")
          PROSE

      # WHY : This gate exists because the two failures it detects are both SILENT at review
      #       time and only surface against a live account. A declared variable with no
      #       default and no producer fails the apply with "No value for required variable";
      #       a produced name that no root declares is DISCARDED -- silently for TF_VAR_, and
      #       with a warning nobody reads for a tfvars file -- so the value simply never
      #       arrives. Both had happened: seven required variables had no producer at all and
      #       six produced names were declared nowhere. Reading a Terraform output that does
      #       not exist is the same class of fault on the way back out, and three reads named
      #       outputs the roots never published.
      #       Alternatives Considered: relying on the credentialed plan job below to surface
      #       these. Rejected because that job needs AWS credentials and a protected
      #       environment, so it does not run on an ordinary pull request -- exactly the point
      #       at which the divergence is cheapest to fix. This check reads files only.
      - name: Verify workflow input and output closure against the roots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          """Verify every root variable has a producer and every read output exists.

          Parameters:
              None.
          Returns:
              None. Successful completion lets the workflow step exit zero.
          Raises:
              AssertionError: If the two roots disagree, if a declared no-default variable
                  has no producing workflow, if a workflow produces a name no root declares,
                  or if a workflow reads a Terraform output no root publishes.
          """

          import re
          from pathlib import Path

          ROOTS = ("dev", "prod")


          def declarations(root):
              """Return (all variable names, names with no default) for one environment root.

              Parameters:
                  root (str): Environment directory name under infra/envs, "dev" or "prod".
              Returns:
                  tuple[set[str], set[str]]: Every declared variable name, and the subset
                      that declares no default and therefore must have a producer.
              Raises:
                  OSError: If that root declares no variables.tf, which is a missing root
                      rather than a closure defect.
                  IndexError: If a variable block is opened and never closed, which is
                      unbalanced HCL that terraform validate reports in its own words.
              """
              text = Path(f"infra/envs/{root}/variables.tf").read_text()
              names, required = set(), set()
              for match in re.finditer(r'^variable "([^"]+)" \{', text, re.M):
                  name, start = match.group(1), match.end()
                  depth, index = 1, start
                  while depth:
                      if text[index] == "{":
                          depth += 1
                      elif text[index] == "}":
                          depth -= 1
                      index += 1
                  # Assumptions: comments are stripped before looking for "default" so that a
                  #     variable whose prose merely DISCUSSES a default is not mistaken for one
                  #     that declares it -- which would hide a genuinely required variable.
                  body = "\n".join(
                      line.split("#", 1)[0] for line in text[start:index].splitlines()
                  )
                  names.add(name)
                  if not re.search(r"^\s*default\s*=", body, re.M):
                      required.add(name)
              return names, required


          def outputs(root):
              """Return the set of output names one environment root publishes.

              Parameters:
                  root (str): Environment directory name under infra/envs, "dev" or "prod".
              Returns:
                  set[str]: Every output name the root publishes, which is the whole of
                      what a workflow step is allowed to read back from it.
              Raises:
                  OSError: If that root declares no outputs.tf.
              """
              text = Path(f"infra/envs/{root}/outputs.tf").read_text()
              return set(re.findall(r'^output "([^"]+)" \{', text, re.M))


          def configuration(path):
              """Return workflow text with whole-line comments removed.

              Parameters:
                  path (str): Repository-relative path of the workflow file to read.
              Returns:
                  str: The same text with entirely-commented lines dropped, so that a
                      variable name discussed in a comment cannot be mistaken for one the
                      workflow actually supplies.
              Raises:
                  OSError: If the workflow file cannot be read.
              """
              # Assumptions: only lines that are ENTIRELY a comment are dropped. A "#" inside an
              #     expression or a quoted value is left alone, so nothing that actually
              #     configures the run is discarded by this filter.
              return "\n".join(
                  line
                  for line in Path(path).read_text().splitlines()
                  if not line.strip().startswith("#")
              )


          declared, required = declarations(ROOTS[0])
          for root in ROOTS[1:]:
              other_declared, other_required = declarations(root)
              assert declared == other_declared, (
                  "the environment roots declare different variables: "
                  f"{sorted(declared ^ other_declared)}"
              )
              assert required == other_required, (
                  "the environment roots disagree on which variables are required: "
                  f"{sorted(required ^ other_required)}"
              )

          published = outputs(ROOTS[0])
          for root in ROOTS[1:]:
              assert published == outputs(root), (
                  f"the environment roots publish different outputs: {sorted(published ^ outputs(root))}"
              )

          deploy = configuration(".github/workflows/deploy.yml")
          review = configuration(".github/workflows/infra-ci.yml")

          # Assumptions: deploy.yml supplies variables through an auto-loaded tfvars document
          #     rather than TF_VAR_, so its producer set is the key set of that jq object. The
          #     match is anchored on the redirection target so it cannot drift onto another
          #     jq invocation in the same file.
          document = re.search(
              r'jq -n \\(.*?)> "\$root/deployment\.auto\.tfvars\.json"', deploy, re.DOTALL
          )
          assert document is not None, "deploy.yml no longer writes deployment.auto.tfvars.json"
          produced = {
              "deploy.yml": set(re.findall(r"^\s*([a-z_][a-z0-9_]*):", document.group(1), re.M)),
              "infra-ci.yml": set(re.findall(r"TF_VAR_([a-z_][a-z0-9_]*)", review)),
          }

          for workflow, names in produced.items():
              assert names, f"{workflow} produces no Terraform variable at all"
              missing = sorted(required - names)
              assert not missing, (
                  f"{workflow} supplies no value for required variable(s) {missing}; "
                  "terraform plan fails with 'No value for required variable'"
              )
              undeclared = sorted(names - declared)
              assert not undeclared, (
                  f"{workflow} supplies {undeclared}, which no environment root declares; "
                  "Terraform discards an undeclared variable rather than failing"
              )

          # Assumptions: the runbook is held to the same standard as the workflows, because the
          #     manual path is the one a human follows and an undocumented required variable
          #     stops it at `plan` just as surely. This is not documentation polish: the runbook
          #     block was the ONLY place the correct variable vocabulary was written down while
          #     both workflows used a stale one, so keeping it in the comparison is what makes
          #     the three agree rather than making two of them agree with each other.
          runbook = Path("docs/runbooks/deploy.md").read_text()
          exported = set(re.findall(r"export TF_VAR_([a-z_][a-z0-9_]*)=", runbook))
          undocumented = sorted(required - exported)
          assert not undocumented, (
              f"docs/runbooks/deploy.md documents no export for required variable(s) {undocumented}; "
              "an operator following it exactly cannot reach a successful plan"
          )
          stale_prose = sorted(exported - declared)
          assert not stale_prose, (
              f"docs/runbooks/deploy.md exports {stale_prose}, which no environment root declares"
          )

          for workflow in (".github/workflows/deploy.yml", ".github/workflows/infra-ci.yml"):
              read = set(
                  re.findall(
                      r"output\s+(?:-json|-raw)\s+([a-z_][a-z0-9_]*)", configuration(workflow)
                  )
              )
              absent = sorted(read - published)
              assert not absent, (
                  f"{workflow} reads Terraform output(s) {absent} that no environment root "
                  "publishes; the read fails after the apply it follows has already run"
              )
          PY

      # Refactoring Rationale: the immutable baseline contains known sample
      # credentials, so the scanner stages only migration-owned tracked files.
      # This remains a hard gate rather than a repository-wide suppression, and the
      # staged set is defined by SUBTRACTION -- every tracked path except the four
      # reference trees -- so a file at a location nobody anticipated is scanned by
      # default instead of being missed by an allow-list that never named it. That
      # subtraction is what the `paths-ignore` triggers above were inverted to match:
      # the same four trees are excluded in both places, so a path this step would
      # scan can never be a path the trigger declines to start.
      - name: Scan migration-owned source for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p infra-reports secret-scan
          while IFS= read -r -d '' path; do
            case "$path" in
              app/*|tests/*|scripts/*|samples/*) continue ;;
            esac
            mkdir -p "secret-scan/$(dirname "$path")"
            cp "$path" "secret-scan/$path"
          done < <(git ls-files -z)

          # Assumptions: these two exact literals are cryptographic algorithm
          # identifiers, not credentials. The allowlist matches the complete
          # assignment so a real value beside the same field name still fails.
          #
          # WHY the second allowlist exists -- Refactoring Rationale: widening this
          #   workflow's trigger from an infrastructure path allow-list to a
          #   reference-tree paths-ignore made the scan run on essentially every
          #   commit, which is the point of the change. It also made a latent
          #   failure manifest: the default ruleset's generic-api-key rule matches
          #   two fabricated symmetric keys committed as TEST FIXTURES, at
          #   InternalApiSecurityConfigTest (two constants),
          #   MessagingIdentityConfigTest (one constant) and the account-service
          #   test profile's signing-key. The step runs under `set -euo pipefail`
          #   and gitleaks exits non-zero when it reports anything, so the gate
          #   would have failed on all four every time. A gate that always fails
          #   is strictly worse than no gate: a real leak becomes indistinguishable
          #   from the standing noise, and the usual response is to switch the gate
          #   off. Admitting exactly these two strings restores a gate whose red
          #   means something.
          # WHY match the VALUE and not the field name -- Trade-offs: allowlisting
          #   `signing-key`, `KEY` or `RAW_KEY` by name would admit ANY value ever
          #   assigned to those names, including a production key pasted into a
          #   test. Pinning the two literals instead is the narrowest exception
          #   available: the escape applies to these exact fabricated bytes and to
          #   nothing else, so the same field names still fail on any other value.
          #   Each literal is a visibly non-production pattern -- counting hex and
          #   its reverse -- at exactly the minimum admissible key length, and each
          #   is documented as fabricated at its own declaration site.
          # Assumptions: the four fixtures prove the SHAPE of a signing boundary --
          #   that a token signed with the shared key verifies and one signed with a
          #   different key does not. Because the values are committed, no test using
          #   them asserts anything about the confidentiality of a deployed key, and
          #   none is read by any deployed profile.
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'TOML'
          [extend]
          useDefault = true

          [[allowlists]]
          description = "Reviewed Terraform cryptographic algorithm identifiers"
          regexTarget = "line"
          regexes = [
            '''password_encryption"\s*=\s*"scram-sha-256"''',
            '''key_algorithm\s*=\s*"EC_prime256v1"''',
          ]

          [[allowlists]]
          description = "Reviewed fabricated test-fixture signing keys, matched by exact value"
          regexTarget = "line"
          regexes = [
            '''\b0123456789abcdef0123456789abcdef\b''',
            '''\bfedcba9876543210fedcba9876543210\b''',
          ]
          TOML

          gitleaks dir secret-scan --config "$RUNNER_TEMP/gitleaks.toml" \
            --no-banner --redact \
            --report-format sarif --report-path infra-reports/gitleaks.sarif \
            2>&1 | tee infra-reports/gitleaks.log

      # Assumptions: scanner exceptions are architecture contracts rather than
      # blanket suppressions. This guard fails if an exception broadens or loses
      # the condition that made it acceptable before Checkov runs.
      - name: Verify bounded policy-scan exceptions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          """Verify that each bounded Checkov exception retains its control.

          Parameters:
              None.
          Returns:
              None. Successful completion lets the workflow step exit zero.
          Raises:
              AssertionError: If an exception or compensating control is absent.
          """

          from pathlib import Path

          api = Path("infra/modules/api-gateway-http/main.tf").read_text()
          sqs = Path("infra/modules/sqs/main.tf").read_text()
          step = Path("infra/modules/step-functions-batch/main.tf").read_text()
          cognito = Path("infra/modules/cognito/main.tf").read_text()
          observability = Path("infra/modules/observability/main.tf").read_text()
          datasets = Path("infra/modules/s3-datasets/main.tf").read_text()

          assert "#checkov:skip=CKV_AWS_309:" in api
          assert 'resource "aws_apigatewayv2_route" "public"' in api
          assert 'authorization_type = "NONE"' in api
          assert 'for_each = toset(var.public_route_keys)' in api

          assert 'resource "aws_sqs_queue_policy" "tls_only"' in sqs
          assert '"aws:SecureTransport" = "false"' in sqs
          assert 'resource "aws_sqs_queue_redrive_allow_policy" "exact_source"' in sqs
          assert 'redrivePermission = "byQueue"' in sqs

          assert 'sid       = "ObserveAndStopTasksInApprovedCluster"' in step
          assert 'actions   = ["ecs:DescribeTasks", "ecs:StopTask"]' in step
          assert 'variable = "ecs:cluster"' in step
          assert 'sid    = "DeliverExecutionLogs"' in step
          assert '"logs:CreateLogDelivery"' in step
          assert step.count('resources = ["*"]') >= 2

          # Assumptions: the two CKV2_AWS_57 exceptions live in this module.
          # One has an API-driven client-secret rotation bridge; the other is a
          # one-time seed credential bounded by temporary-password validity.
          assert cognito.count("checkov:skip=CKV2_AWS_57:") == 2
          assert 'resource "aws_secretsmanager_secret" "app_client"' in cognito
          assert 'resource "terraform_data" "app_client_secret_rotation"' in cognito
          assert "add-user-pool-client-secret" in cognito
          assert 'resource "aws_secretsmanager_secret" "seed_user"' in cognito
          assert 'temporary_password_validity_days = var.temporary_password_validity_days' in cognito

          assert observability.count("checkov:skip=CKV_AWS_145:") == 1
          assert 'sse_algorithm = "AES256"' in observability

          assert datasets.count("checkov:skip=CKV_AWS_145:") == 1
          assert datasets.count("checkov:skip=CKV_AWS_35:") == 1
          assert 'resource "aws_cloudtrail" "dataset_object_access"' in datasets
          assert 'enable_log_file_validation    = true' in datasets

          # Assumptions: the three log-delivery destinations below cannot carry
          # SSE-KMS, because the delivering service would have to be granted use
          # of the key or, for CloudFront and S3 server access logging, cannot
          # write an SSE-KMS destination at all. Each exception is therefore
          # bounded by asserting the AES256 fallback together with the
          # compensating controls that stand in for the customer key: public
          # access blocked and versioning enabled, so a delivered record can be
          # neither read publicly nor deleted without trace.
          alb = Path("infra/modules/alb/main.tf").read_text()
          spa = Path("infra/modules/cloudfront-spa/main.tf").read_text()
          secrets = Path("infra/modules/secrets/main.tf").read_text()

          assert alb.count("checkov:skip=CKV_AWS_145:") == 1
          assert 'sse_algorithm = "AES256"' in alb
          assert 'resource "aws_s3_bucket_versioning" "access_logs"' in alb
          assert 'resource "aws_s3_bucket_public_access_block" "access_logs"' in alb

          assert spa.count("checkov:skip=CKV_AWS_145:") == 1
          assert 'resource "aws_s3_bucket_versioning" "logs"' in spa
          assert 'resource "aws_s3_bucket_public_access_block" "logs"' in spa

          # Assumptions: the rotation-interval exception is a cross-module
          # rendering artifact, not a relaxed control, so it is bounded by
          # asserting that the interval is still driven by the input whose
          # default and both tfvars values sit inside the required window. The
          # two TLS entries hold operator-issued material that no rotation
          # function can mint, so they are bounded by asserting they remain
          # caller-supplied rather than acquiring a schedule.
          assert secrets.count("checkov:skip=CKV_AWS_304:") == 1
          assert 'automatically_after_days = var.rotation_automatically_after_days' in secrets
          assert 'resource "aws_secretsmanager_secret_rotation" "service"' in secrets
          # Refactoring Rationale: two assertions were removed from this cluster because they
          #   asserted a configuration that does not exist and so failed on every run. They
          #   required TWO CKV2_AWS_57 exceptions in the secrets module and a
          #   `count = local.create_service_tls_secrets ? 1 : 0` conditional; the module has
          #   ZERO of the former and no service-TLS secret resources at all. The comment above
          #   still described "the two TLS entries", which were removed from the module without
          #   this gate being updated -- the same drift that left CARDDEMO_SERVER_TLS_* admitted
          #   by infra/modules/ecs-service long after its last reader had gone.
          # Assumptions: the absence is now asserted rather than left unstated, so a
          #   reintroduced service-TLS secret has to come back with its exception and its
          #   conditional together, and cannot arrive as an unbounded entry.
          assert secrets.count("checkov:skip=CKV2_AWS_57:") == 0
          assert "create_service_tls_secrets" not in secrets
          PY

      # Trade-offs: the offline Checkov distribution does not carry policy
      # severities, so `--check HIGH,CRITICAL` selects zero checks and creates a
      # false-green gate. The first scan keeps the complete result set visible;
      # the second hard-fails on an explicit, reviewable material-security
      # baseline spanning IAM, encryption, audit, network, edge, messaging and
      # workload isolation. The summary assertion prevents an empty selection
      # from ever reporting success again.
      - name: Run the Terraform material-security policy gate
        shell: bash
        run: |
          set -euo pipefail

          checkov -d infra --framework terraform --soft-fail \
            --skip-path '\.terraform' --compact --output json \
            2>&1 | tee infra-reports/checkov-all.json

          material_checks=(
            CKV_AWS_1 CKV_AWS_2 CKV_AWS_7 CKV_AWS_17 CKV_AWS_19
            CKV_AWS_20 CKV_AWS_21 CKV_AWS_23 CKV_AWS_24 CKV_AWS_25
            CKV_AWS_26 CKV_AWS_27 CKV_AWS_28 CKV_AWS_33 CKV_AWS_34
            CKV_AWS_35 CKV_AWS_36 CKV_AWS_41 CKV_AWS_45 CKV_AWS_51
            CKV_AWS_53 CKV_AWS_54 CKV_AWS_55 CKV_AWS_56 CKV_AWS_57
            CKV_AWS_60 CKV_AWS_61 CKV_AWS_62 CKV_AWS_63 CKV_AWS_66
            CKV_AWS_72 CKV_AWS_76 CKV_AWS_91 CKV_AWS_93 CKV_AWS_96
            CKV_AWS_97 CKV_AWS_103 CKV_AWS_107 CKV_AWS_108 CKV_AWS_110
            CKV_AWS_119 CKV_AWS_130 CKV_AWS_136 CKV_AWS_145 CKV_AWS_149
            CKV_AWS_158 CKV_AWS_163 CKV_AWS_168 CKV_AWS_174 CKV_AWS_223
            CKV_AWS_227 CKV_AWS_251 CKV_AWS_260 CKV_AWS_274 CKV_AWS_277
            CKV_AWS_283 CKV_AWS_285 CKV_AWS_301 CKV_AWS_304 CKV_AWS_309
            CKV_AWS_324 CKV_AWS_327 CKV_AWS_333 CKV_AWS_336 CKV_AWS_337
            CKV_AWS_358 CKV_AWS_382 CKV_AWS_387 CKV_AWS_393
            CKV2_AWS_6 CKV2_AWS_11 CKV2_AWS_12 CKV2_AWS_20
            CKV2_AWS_32 CKV2_AWS_40 CKV2_AWS_42 CKV2_AWS_46
            CKV2_AWS_54 CKV2_AWS_56 CKV2_AWS_57 CKV2_AWS_64
            CKV2_AWS_65 CKV2_AWS_72
          )
          material_checks_csv="$(IFS=,; echo "${material_checks[*]}")"

          checkov -d infra --framework terraform --check "$material_checks_csv" \
            --skip-path '\.terraform' --compact --output json \
            2>&1 | tee infra-reports/checkov.json

          python - <<'PY'
          """Assert the policy scan actually scanned something and found nothing material.

          Parameters:
              None. The report path is the file the scanner was just told to write.
          Returns:
              None. Successful completion lets the workflow step exit zero.
          Raises:
              AssertionError: If the scan evaluated no resources, passed no checks, failed
                  any check, or hit a parsing error. The first two are the reason this
                  module exists: a scanner invocation that matched nothing exits zero, so
                  without them a mistyped path would read as a clean infrastructure.
              KeyError: If the report carries no summary, which means the scanner changed
                  its output shape rather than that the infrastructure is clean.
              json.JSONDecodeError: If the scanner wrote something that is not JSON.
          """

          import json
          from pathlib import Path

          report = json.loads(Path("infra-reports/checkov.json").read_text())
          summary = report["summary"]
          assert summary["resource_count"] > 0, summary
          assert summary["passed"] > 0, summary
          assert summary["failed"] == 0, summary
          assert summary["parsing_errors"] == 0, summary
          PY

      # Assumptions: advanced from upload-artifact v4.4.3 with every other pin in
      # this workflow family, for the reason measured once in services-ci.yml.
      - name: Upload infrastructure security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carddemo-infra-reports
          path: infra-reports/**
          if-no-files-found: error

  terraform-plan:
    name: Produce a real plan for the selected environment
    needs: terraform-static
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_plan }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      # Assumptions: this scope mints a per-run OIDC token that STS exchanges for
      # short-lived credentials, eliminating any stored cloud access key.
      id-token: write

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.CARDDEMO_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.CARDDEMO_AWS_REGION }}
          role-session-name: carddemo-infra-plan
          mask-aws-account-id: true

      - name: Install checksum-pinned Terraform
        shell: bash
        run: |
          set -euo pipefail
          version="1.15.8"
          archive="terraform_${version}_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://releases.hashicorp.com/terraform/${version}/${archive}"
          printf '%s  %s\n' "d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d" "$RUNNER_TEMP/$archive" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/terraform-bin"
          echo "$RUNNER_TEMP/terraform-bin" >> "$GITHUB_PATH"

      # Assumptions: environment tfvars contains sizing/retention only. Resource
      # identifiers arrive from protected GitHub environment variables and the
      # current deployed image-digest map, never from a committed credential.
      - name: Initialize remote state and create the plan
        shell: bash
        env:
          TF_STATE_BUCKET: ${{ vars.CARDDEMO_TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.CARDDEMO_TF_STATE_REGION }}
          TF_STATE_LOCK_TABLE: ${{ vars.CARDDEMO_TF_STATE_LOCK_TABLE }}
          TF_STATE_KMS_KEY_ID: ${{ vars.CARDDEMO_TF_STATE_KMS_KEY_ID }}
          # Refactoring Rationale: this block supplied NINE names of which six --
          # release_version, route53_zone_id, spa_domain_name, alb_tls_server_name,
          # service_tls_domain_name and batch_glue_function_arns -- are declared by neither
          # root. An undeclared TF_VAR_ is discarded in SILENCE: Terraform does not even
          # warn, so those six looked wired and set nothing. At the same time SEVEN declared
          # no-default variables had no producer here, and each of those is a hard
          # "No value for required variable" -- so the plan step below could not have
          # succeeded on any run. The set is now exactly the ten declared no-default
          # variables, and the closure check in this same workflow compares it against
          # variables.tf in both directions so the divergence cannot recur unnoticed.
          TF_VAR_permissions_boundary_arn: ${{ vars.CARDDEMO_PERMISSIONS_BOUNDARY_ARN }}
          TF_VAR_mask_hmac_secret_arn: ${{ vars.CARDDEMO_MASK_HMAC_SECRET_ARN }}
          TF_VAR_alb_certificate_arn: ${{ vars.CARDDEMO_ALB_CERTIFICATE_ARN }}
          TF_VAR_internal_service_domain_name: ${{ vars.CARDDEMO_INTERNAL_SERVICE_DOMAIN_NAME }}
          TF_VAR_cloudfront_acm_certificate_arn: ${{ vars.CARDDEMO_CLOUDFRONT_ACM_CERTIFICATE_ARN }}
          # Assumptions: a list-typed variable is supplied to Terraform as JSON, which is
          # valid HCL for a list, so the _JSON-suffixed environment variables carry a
          # document such as ["app.example.com"] rather than a delimited string.
          # cloudfront_aliases additionally validates length > 0, so an unset environment
          # variable fails the plan rather than planning a distribution with no alias.
          TF_VAR_cloudfront_aliases: ${{ vars.CARDDEMO_CLOUDFRONT_ALIASES_JSON }}
          # Assumptions: both roots declare alarm_email_endpoints with NO default and refuse
          # an empty list, so a plan cannot be produced without a recipient. It is supplied
          # from a protected repository variable rather than from terraform.tfvars because an
          # on-call address is personal data this tree does not carry.
          TF_VAR_alarm_email_endpoints: ${{ vars.CARDDEMO_ALARM_EMAIL_ENDPOINTS_JSON }}
          TF_VAR_github_oidc_provider_arn: ${{ vars.CARDDEMO_GITHUB_OIDC_PROVIDER_ARN }}
          # Trade-offs: taken from the run context rather than from a protected environment
          # variable, for the same reason deploy.yml does so -- the contract is the
          # owner/name of the repository whose environment may assume the publication role,
          # and that is this repository, so the context value cannot disagree with reality.
          TF_VAR_github_repository: ${{ github.repository }}
          # Assumptions: the review plan uses the commit under review as the image tag. It
          # never pushes an image, so the tag only has to satisfy the variable's format
          # rule; using the SHA keeps the planned task definitions attributable to the
          # commit that produced the plan.
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_image_digests: ${{ vars.CARDDEMO_IMAGE_DIGESTS_JSON }}
          # Trade-offs: an EMPTY list rather than a protected environment variable. The API
          # endpoint does not exist until an apply creates it, and deploy.yml supplies the
          # same empty list on its first pass before narrowing it afterwards, so a review
          # plan has nothing truer available. The variable's own validation accepts an empty
          # list -- its alltrue() is vacuously true -- and empty is the fail-closed value,
          # yielding connect-src 'self'. This plan is never applied, so the narrow policy
          # it shows is never served.
          TF_VAR_cloudfront_api_connect_src_origins: "[]"
        run: |
          set -euo pipefail
          root="infra/envs/${{ inputs.environment }}"
          mkdir -p infra-reports
          terraform -chdir="$root" init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE" \
            -backend-config="kms_key_id=$TF_STATE_KMS_KEY_ID"
          # WHY : Assumptions: the saved plan is named "<env>.tfplan" rather than a
          #   bare "tfplan" because a saved plan embeds every resolved attribute the
          #   apply would set, including the generated Aurora master password and the
          #   Cognito seed-user passwords, and the repository ignore rules match on the
          #   ".tfplan" SUFFIX. A bare "tfplan" has no suffix to match, so it stays
          #   trackable, and this runner shares the naming convention with
          #   infra/README.md and infra/bootstrap/README.md so an operator reproducing
          #   this step locally writes a name that "git check-ignore" already covers.
          #   Trade-offs: the runner is ephemeral and never commits, so the risk here is
          #   lower than on a workstation; the convention is kept identical anyway,
          #   because a divergent example in CI is what a reader copies.
          plan_file="${{ inputs.environment }}.tfplan"
          terraform -chdir="$root" plan -input=false \
            -var-file=terraform.tfvars -out="$plan_file"
          terraform -chdir="$root" show -no-color "$plan_file" > "$GITHUB_WORKSPACE/infra-reports/${{ inputs.environment }}-plan.txt"

      # Assumptions: the same advanced upload-artifact pin as the static job above,
      # and the same reason. A plan is audit evidence, so the digest checks the
      # newer artifact line enforces on retrieval matter here specifically.
      - name: Upload the environment plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carddemo-infra-plan-${{ inputs.environment }}
          path: infra-reports/${{ inputs.environment }}-plan.txt
          if-no-files-found: error
