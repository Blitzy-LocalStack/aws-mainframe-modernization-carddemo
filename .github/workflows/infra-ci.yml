# =============================================================================
# .github/workflows/infra-ci.yml
# -----------------------------------------------------------------------------
# Purpose:
#   Performs credential-free Terraform format, initialization, validation,
#   lint, documentation-drift, secret, and explicit material-security policy
#   gates, plus a Rule 1 gate over the Python this file itself embeds. A manual
#   same-repository run may additionally produce a real remote-state plan through
#   short-lived OIDC credentials. This workflow never mutates infrastructure.
#
# Parameters:
#   workflow_dispatch.run_plan selects the optional credentialed plan job;
#   workflow_dispatch.environment selects the one environment root it evaluates.
# Return values:
#   Every static gate and required artifact is GATING. The plan job is
#   CONDITIONAL, but once selected every initialization and plan error is fatal.
# Exceptions or errors:
#   Fork pull requests run the credential-free graph only. No lint, docs,
#   secret, or policy failure is tolerated.
#
# WHY (non-obvious design decisions):
#   - Alternatives Considered: action wrappers for Terraform and security tools.
#     Rejected where no reviewed SHA was needed; checksum-pinned binaries preserve
#     native exit codes and avoid a mutable wrapper in the policy gate.
#   - Trade-offs: tool downloads are intentionally cacheless, accepting repeated
#     transfer in exchange for no cache-poisoning surface in a security job.
#   - Assumptions: backend-free init validates providers and modules without AWS
#     credentials; backend correctness is exercised by the optional real plan.
#   - Assumptions: the Python embedded in this file is gated by this file. Ruff
#     walks files on disk and a heredoc body is a string inside a YAML value, so
#     no packaged Python gate can reach it; one step extracts every block and
#     applies Ruff plus a Rule 1 element check, including to itself. The full
#     argument, and why a governed .py module was rejected, is at that step.
# =============================================================================

name: CardDemo Infrastructure CI

# Refactoring Rationale: these triggers were an ALLOW-LIST of migration-owned paths
# (infra, services, ui, data-migration, config, docs, three root documents, .gitignore
# and .github/workflows). That shape defeated the one gate this workflow exists to
# provide. The secret scan below stages every tracked file, so it catches a credential
# anywhere -- but only once the workflow RUNS, and a revision whose only changed path
# sat outside the allow-list never started it. A force-added top-level `.env`,
# `secrets.pem`, `credentials` or `terraform.tfstate` is exactly such a revision, which
# made the ignore-file's claim that content scanning cannot be bypassed untrue.
# Inverting to an ignore-list closes that hole by construction: any changed path that is
# not one of the four immutable reference trees starts this workflow, so there is no
# path a credential can be committed at without being scanned.
#
# Assumptions: `paths-ignore` skips a revision only when EVERY changed file matches one
# of its patterns. A baseline-only revision therefore still skips this workflow and stays
# owned by tests.yml, while a revision that touches a baseline file AND a root credential
# runs, because not every changed file matched.
# Trade-offs: this widens the trigger to paths that cannot affect Terraform -- LICENSE,
# NOTICE and any tree added later -- so those revisions now pay for a Terraform format,
# init, validate, lint and documentation-drift pass they cannot fail meaningfully. That
# cost is accepted because the alternative is a security gate with a documented bypass,
# and because narrowing the trigger again is precisely how the bypass reappeared.
on:
  push:
    branches: [main]
    paths-ignore:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "samples/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "samples/**"
  workflow_dispatch:
    inputs:
      run_plan:
        description: "Run a real remote-state Terraform plan after all credential-free gates pass."
        required: false
        type: boolean
        default: false
      environment:
        description: "Environment root to plan when run_plan is enabled."
        required: false
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

# Trade-offs: static validation has no persistent side effect, so a stale run
# may be cancelled safely instead of racing a newer revision for runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-static:
    name: Format, validate, lint and scan the Terraform package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Assumptions: Python 3.13 is used only to install the exact CI-only
      # Checkov release; it never enters a runtime artifact.
      # Refactoring Rationale: advanced from setup-python v5.3.0, whose bundle
      # carried the vulnerable `form-data` 2.5.1 and 4.0.0; the measurement, the
      # node24 runner requirement and the input-compatibility check are recorded
      # once at the setup-java pin in services-ci.yml. `python-version` is the only
      # input set here and v7 still declares it.
      - name: Configure Python for the policy scanner
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Assumptions: every archive is bound to a reviewed release and literal
      # digest. The visible version checks fail before a gate runs with the wrong
      # executable.
      - name: Install checksum-pinned infrastructure tools
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/carddemo-infra-tools"
          mkdir -p "$install_dir"

          terraform_version="1.15.8"
          terraform_archive="terraform_${terraform_version}_linux_amd64.zip"
          curl -fsSLo "$install_dir/$terraform_archive" "https://releases.hashicorp.com/terraform/${terraform_version}/${terraform_archive}"
          printf '%s  %s\n' "d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d" "$install_dir/$terraform_archive" | sha256sum -c -
          unzip -q "$install_dir/$terraform_archive" -d "$install_dir"

          tflint_version="0.64.0"
          tflint_archive="tflint_linux_amd64.zip"
          curl -fsSLo "$install_dir/$tflint_archive" "https://github.com/terraform-linters/tflint/releases/download/v${tflint_version}/${tflint_archive}"
          printf '%s  %s\n' "cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537" "$install_dir/$tflint_archive" | sha256sum -c -
          unzip -q "$install_dir/$tflint_archive" -d "$install_dir"

          docs_version="0.20.0"
          docs_archive="terraform-docs-v${docs_version}-linux-amd64.tar.gz"
          curl -fsSLo "$install_dir/$docs_archive" "https://github.com/terraform-docs/terraform-docs/releases/download/v${docs_version}/${docs_archive}"
          printf '%s  %s\n' "34ae01772412bb11474e6718ea62113e38ff5964ee570a98c69fafe3a6dff286" "$install_dir/$docs_archive" | sha256sum -c -
          tar -xzf "$install_dir/$docs_archive" -C "$install_dir"

          gitleaks_version="8.30.1"
          gitleaks_archive="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          curl -fsSLo "$install_dir/$gitleaks_archive" "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/${gitleaks_archive}"
          printf '%s  %s\n' "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" "$install_dir/$gitleaks_archive" | sha256sum -c -
          tar -xzf "$install_dir/$gitleaks_archive" -C "$install_dir" gitleaks

          echo "$install_dir" >> "$GITHUB_PATH"
          python -m pip install "checkov==3.3.8"

          # Assumptions: ruff is pinned to the same 0.16.0 the data-migration package
          #   pins, so the embedded-Python gate below and the packaged Python gate cannot
          #   disagree about what a docstring rule means. A floating version would let a
          #   new release change this workflow's verdict without any change to this
          #   workflow.
          python -m pip install "ruff==0.16.0"

      - name: Verify infrastructure tool versions
        shell: bash
        run: |
          set -euo pipefail
          terraform version
          tflint --version
          terraform-docs --version
          gitleaks version
          checkov --version
          ruff --version

      # Assumptions: the Python inside this workflow is source code and Rule 1 binds it,
      #   but it reaches no Python gate on its own. Ruff walks files on disk; a heredoc
      #   body is a string inside a YAML value, so `ruff check .` never sees it, and the
      #   data-migration AST gate walks THREE roots on disk -- that package, its own test
      #   suite and config/rule1 -- none of which contains a workflow file.
      #   Refactoring Rationale: this said that gate "walks that package only", which
      #   understated its reach by two roots and, worse, implied the exemption here rested
      #   on a narrower gate than the one that exists. The exemption rests on the medium:
      #   no on-disk walk of any root reaches a heredoc, however many roots it covers.
      #   Two of the blocks below had
      #   shipped with no module docstring at all and five of their functions documented
      #   neither their parameters nor their return value, which is the exact shape the
      #   packaged gates exist to prevent and were never asked about here. This step
      #   extracts every block and applies both halves to it: ruff for the rules a linter
      #   can decide, and an explicit check that each docstring names the elements Rule 1
      #   enumerates.
      #   Alternatives Considered: moving the code into governed .py files under a package
      #   and calling them from the workflow. Rejected for a reason specific to what these
      #   blocks are -- every one of the EIGHT asserts a fact about this workflow file, about
      #   the Terraform roots and modules it drives, or about a report an earlier step in the
      #   same job wrote, and two of them read this file itself. They are configuration
      #   checks rather than reusable code, and a package would put a step's own
      #   precondition a directory away from the step that depends on it. The blocks are
      #   also each run exactly once, by one step, so there is no second caller for a module
      #   to serve.
      #   Refactoring Rationale: this read "three of the five", counting a population that
      #   had since grown to eight and conceding that the other two were something else --
      #   which weakened the very argument it was making, because a block that asserts
      #   nothing about this workflow or its roots is precisely one that belongs in a
      #   package. All eight do, so the argument holds for the whole set.
      #   Assumptions: the extraction is exact rather than best-effort. The expected block
      #   count is asserted, so a newly added block that does not match the opener pattern
      #   fails this gate instead of being skipped in silence -- a silent skip being the
      #   failure mode that let the two undocumented blocks through in the first place.
      #   Assumptions: the subjects are the module, every class and every function, at any
      #   nesting depth and any visibility. Classes were previously absent from the walk, so
      #   a class in one of these blocks carried no requirement here and none in ruff either
      #   -- D101 is a public-declaration check, so a privately named or function-nested
      #   class evades it. A class is held to docstring PRESENCE, and to Raises: when its own
      #   body raises; Parameters: and Returns: are function elements and are not demanded of
      #   a declaration that takes no parameters and returns nothing. The walk is proved
      #   negatively inside the block, against a probe carrying exactly those evading shapes,
      #   because every class in these blocks is documented and a narrowed walk would
      #   otherwise report nothing and pass.
      #   Trade-offs: the Rule 1 element check is a section-NAME check, not a semantic one.
      #   It decides that a docstring states its parameters and its return value, and
      #   cannot decide whether the prose is accurate; that half stays with review, exactly
      #   as `docs/CODE_DOCUMENTATION_STANDARD.md` records for every language. The cheaper
      #   alternative of selecting ruff's own D417 was measured and does not substitute:
      #   the pep257 convention this repository uses disables it, and enabling it would
      #   additionally require the Google or NumPy section syntax, which is not the form
      #   these docstrings or the packaged ones are written in.
      - name: Verify the workflow's embedded Python against the Rule 1 gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'GATE'
          """Extract every heredoc Python block in this workflow and gate each one.

          Parameters:
              None. The workflow path and the expected block count are module constants,
              because this module checks exactly one file -- the one it is embedded in.
          Returns:
              None. Successful completion lets the workflow step exit zero.
          Raises:
              AssertionError: If the number of extracted blocks differs from the expected
                  count, which is what stops a newly added block from escaping the gate.
              SystemExit: With a non-zero status if any block breaks a ruff rule or omits a
                  Rule 1 docstring element. Raised deliberately so the step fails.
              OSError: If the workflow file cannot be read.
          """

          import ast
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          WORKFLOW = Path(".github/workflows/infra-ci.yml")

          # Assumptions: the count includes THIS block, so the gate covers itself. A gate
          #   exempt from its own rule is the first place a convention decays.
          # Assumptions: NINE is the number of heredoc blocks this workflow currently
          #   carries, and it is written as a literal rather than derived from the extraction
          #   because a derived count would agree with any number of blocks, including zero. It
          #   is raised by hand each time a gate is added, which is what makes a newly added
          #   block fail this step until someone has looked at it.
          #   Refactoring Rationale: the value is stated rather than narrated as a growth path.
          #   One earlier revision of this comment traced the count "from 5 to 7" beside a
          #   literal of 8 and another traced it to 9, so the prose and the constant disagreed
          #   in both -- the one question a comment sitting on a constant exists to settle. The
          #   current value is the only part a reader has to trust, and it is measured against
          #   the file rather than carried forward.
          EXPECTED_BLOCKS = 9

          OPENER = re.compile(r"^(?P<indent> *)python3? - <<'(?P<delimiter>[A-Z]+)'$")


          def blocks(text):
              """Return one dedented Python source per heredoc block, in file order.

              Parameters:
                  text (str): The whole workflow file as a single string.
              Returns:
                  list[tuple[str, str]]: A (delimiter, source) pair for each block found.
              Raises:
                  AssertionError: If a heredoc is opened and never closed by its delimiter,
                      which would otherwise silently swallow the rest of the file into one
                      block and lint it as Python.
              """
              found = []
              lines = text.splitlines()
              index = 0
              while index < len(lines):
                  opened = OPENER.match(lines[index])
                  if opened is None:
                      index += 1
                      continue
                  # Assumptions: the opener's own indentation is the block's left margin.
                  #   A YAML literal scalar has already had its base indentation removed
                  #   by the time the shell runs, so subtracting that margin reproduces
                  #   the source the interpreter actually receives rather than an
                  #   approximation of it.
                  margin = len(opened.group("indent"))
                  delimiter = opened.group("delimiter")
                  index += 1
                  body = []
                  while index < len(lines) and lines[index].strip() != delimiter:
                      body.append(lines[index][margin:])
                      index += 1
                  assert index < len(lines), f"heredoc <<'{delimiter}' is never closed"
                  found.append((delimiter, "\n".join(body) + "\n"))
                  index += 1
              return found


          NESTED_DECLARATION = (
              ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef, ast.Lambda
          )


          def raises_something(node):
              """Report whether one body can raise, counting assert as a raise.

              Parameters:
                  node (ast.AST): The module or function node whose OWN body is examined.
              Returns:
                  bool: True if that body contains a raise or an assert statement outside
                      any nested declaration.
              Raises:
                  None.
              """
              # Assumptions: a nested function's own statements are not counted for its
              #   parent, so each definition is judged on what it does itself. That is why
              #   this walks explicitly instead of calling ast.walk: ast.walk descends
              #   through EVERY child including nested FunctionDef, ClassDef and Lambda
              #   bodies, so a parent that raises nothing would have been required to
              #   document Raises: because an inner helper raises -- while the same inner
              #   helper is also judged on its own, one entry later in `subjects`. The
              #   traversal below stops at each declaration boundary, so exactly one
              #   subject accounts for each raise.
              # WHY : Refactoring Rationale: the comment above described this behaviour
              #   while the code did the opposite. The direction of the error was
              #   conservative -- it over-required Raises: rather than under-requiring it,
              #   so no undocumented raise escaped -- but the gate reported the reason
              #   wrongly, naming a parent for a raise it does not contain, which is the
              #   part that costs a reader time.
              pending = list(ast.iter_child_nodes(node))
              while pending:
                  child = pending.pop()
                  if isinstance(child, NESTED_DECLARATION):
                      continue
                  if isinstance(child, (ast.Raise, ast.Assert)):
                      return True
                  pending.extend(ast.iter_child_nodes(child))
              return False


          # Assumptions: the boundary above is asserted here rather than trusted, because
          #   it is the one behaviour of this gate that its own output cannot reveal -- an
          #   over-broad traversal still produces a green run on a compliant workflow, so
          #   the defect it had would have survived every passing build. The two snippets
          #   are the smallest pair that distinguishes the two traversals: `outer` raises
          #   nothing itself and must answer False, while the nested `inner` and the
          #   enclosing module must both answer True.
          _BOUNDARY_PROBE = ast.parse(
              "raise ValueError('module level')\n"
              "def outer():\n"
              "    def inner():\n"
              "        raise KeyError('nested')\n"
              "    return inner\n"
          )
          _PROBE_OUTER = _BOUNDARY_PROBE.body[1]
          _PROBE_INNER = _PROBE_OUTER.body[0]
          assert raises_something(_BOUNDARY_PROBE), (
              "raises_something must see a module-level raise"
          )
          assert not raises_something(_PROBE_OUTER), (
              "raises_something must NOT attribute a nested function's raise to its parent"
          )
          assert raises_something(_PROBE_INNER), (
              "raises_something must see a nested function's own raise when judging it"
          )


          def missing_elements(source, label):
              """List the Rule 1 docstring elements the module, classes and functions omit.

              Parameters:
                  source (str): One extracted block's Python source.
                  label (str): Name used to identify the block in a report line.
              Returns:
                  list[str]: One human-readable line per omission, empty when the block
                      documents every element Rule 1 enumerates.
              Raises:
                  SyntaxError: If the extracted block is not valid Python, which means the
                      extraction margin was wrong rather than the source being bad.
              """
              # Assumptions: CLASSES are subjects too, and their element set is narrower
              #   than a function's. A class declaration takes no parameters and returns
              #   nothing, so only presence -- and Raises: when its own body raises -- can
              #   be required of it; demanding Parameters: and Returns: would report every
              #   compliant class in the tree and teach a reader to ignore this gate.
              # WHY : Refactoring Rationale: ClassDef was absent from this walk, so a class
              #   declared in one of these blocks carried no docstring requirement here at
              #   all. Ruff cannot cover the gap either: its D101 is a public-declaration
              #   check, so a privately named or function-nested class evades both, and the
              #   step above claims to apply the Rule 1 elements to every subject in these
              #   blocks. The negative probe below is what keeps the claim honest.
              tree = ast.parse(source)
              problems = []
              subjects = [(label + " module", tree, "module")]
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      subjects.append((f"{label} function {node.name}", node, "function"))
                  elif isinstance(node, ast.ClassDef):
                      subjects.append((f"{label} class {node.name}", node, "class"))

              for name, node, kind in subjects:
                  text = ast.get_docstring(node)
                  if not text:
                      problems.append(f"{name}: no docstring")
                      continue
                  required = [] if kind == "class" else ["Parameters:", "Returns:"]
                  if raises_something(node):
                      required.append("Raises:")
                  for section in required:
                      if section not in text:
                          problems.append(f"{name}: docstring omits {section}")
              return problems


          # WHY : Assumptions: this probe is NEGATIVE and it is the only thing that can show
          #       the walk above still reports. Every class and function in the five blocks
          #       is documented, so a walk narrowed back to functions -- or narrowed to
          #       nothing at all -- produces the same silent green run as a correct one. The
          #       three shapes are the ones no ruff presence check reports: a privately
          #       named class, a class nested inside a function body, and a documented
          #       public class whose docstring omits a Raises: its own body needs.
          # WHY : Trade-offs: the probe is parsed in memory and asserted here rather than
          #       written as a separate step, because adding a step would add a heredoc block
          #       and the extraction count above is asserted exactly. Running it in this
          #       block keeps EXPECTED_BLOCKS true and keeps the probe beside the walk it
          #       guards.
          _CLASS_PROBE = (
              '"""Module probe.\n'
              "\n"
              "Parameters:\n"
              "    None.\n"
              "Returns:\n"
              "    None.\n"
              '"""\n'
              "\n"
              "class _BarePrivateClass:\n"
              "    pass\n"
              "\n"
              "class RaisingClass:\n"
              '    """Documented class whose own body raises."""\n'
              "    raise ValueError('class body')\n"
              "\n"
              "def outer():\n"
              '    """Do a thing.\n'
              "\n"
              "    Parameters:\n"
              "        None.\n"
              "    Returns:\n"
              "        None.\n"
              '    """\n'
              "\n"
              "    class BareNestedClass:\n"
              "        pass\n"
              "\n"
              "    return BareNestedClass\n"
          )
          _CLASS_PROBE_FINDINGS = set(missing_elements(_CLASS_PROBE, "probe"))
          assert _CLASS_PROBE_FINDINGS == {
              "probe class _BarePrivateClass: no docstring",
              "probe class BareNestedClass: no docstring",
              "probe class RaisingClass: docstring omits Raises:",
          }, (
              "the element walk must report an undocumented private class, an undocumented "
              "class nested in a function body, and a documented class whose own body "
              f"raises without a Raises: section; it reported {sorted(_CLASS_PROBE_FINDINGS)}"
          )


          extracted = blocks(WORKFLOW.read_text(encoding="utf-8"))
          assert len(extracted) == EXPECTED_BLOCKS, (
              f"expected {EXPECTED_BLOCKS} embedded Python blocks, found {len(extracted)}"
          )

          omissions = []
          for ordinal, (delimiter, source) in enumerate(extracted, start=1):
              omissions.extend(missing_elements(source, f"block {ordinal} <<{delimiter}>>"))

          with tempfile.TemporaryDirectory() as staging:
              paths = []
              for ordinal, (delimiter, source) in enumerate(extracted, start=1):
                  staged = Path(staging) / f"block_{ordinal:02d}_{delimiter.lower()}.py"
                  staged.write_text(source, encoding="utf-8")
                  paths.append(str(staged))
              # Assumptions: --isolated with an explicit selection rather than the
              #   data-migration pyproject. That file also configures first-party import
              #   resolution and a relative-import ban for a package these blocks are not
              #   members of, so pointing at it would apply rules about a package layout
              #   that does not exist here. The rule families and the convention are the
              #   same ones it selects, which is the part that has to match.
              linted = subprocess.run(
                  [
                      "ruff", "check", "--isolated", "--no-cache",
                      "--select", "D,E,W,F,I", "--line-length", "100",
                      "--config", 'lint.pydocstyle.convention = "pep257"',
                      *paths,
                  ],
                  check=False,
              )

          for problem in omissions:
              print(f"Rule 1 element missing: {problem}")

          if omissions or linted.returncode != 0:
              sys.exit(1)

          print(f"Embedded Python gate: PASS ({len(extracted)} blocks)")
          GATE


      # Alternatives Considered: bare terraform fmt, which rewrites the checkout
      # and lets drift pass. Check mode preserves the review boundary.
      - name: Check Terraform formatting without mutation
        shell: bash
        run: terraform fmt -check -recursive infra/

      # Assumptions: validate needs initialized provider schemas, while a normal
      # init would require the remote backend and credentials. -backend=false
      # resolves modules/providers without touching state.
      # Assumptions: the environment roots are reached by the GLOB infra/envs/*/ for
      # the same reason the terraform-docs step below uses one -- this step's own name
      # claims it covers "every Terraform root", and with dev and prod written out by
      # hand that claim was true only for as long as there are exactly two
      # environments. A third one would have gone unvalidated with the step still
      # reporting green and still calling itself exhaustive. bootstrap stays explicit
      # because it is not an environment and does not sit under infra/envs.
      # Trade-offs: the glob needs the same floor the drift step needs, because an
      # unmatched pattern survives `set -u` as a literal and a loop over nothing exits
      # zero. Three is a lower bound, so adding an environment is not a failure.
      # WHY : ⚠️ Refactoring Rationale: this step exists because the operational Lambda
      #       packages are no longer built by Terraform. They were assembled by
      #       `hashicorp/archive` data sources, a provider the frozen AAP inventory does
      #       not name, so packaging moved to infra/lambda/build_packages.py -- standard
      #       library only. Both `validate` and `plan` evaluate `filebase64sha256` over
      #       the built archive, so the packages have to exist before either runs.
      # WHY : Assumptions: the builder is deterministic -- it pins member timestamps and
      #       modes -- so running it here produces byte-identical archives to the ones a
      #       developer builds locally, and therefore an identical `source_code_hash`. A
      #       non-deterministic packager would make every plan report all four functions
      #       updating on a commit that changed no handler.
      # GATING and FAIL-CLOSED: `--check` is deliberately NOT used here. This job's
      #       purpose is to produce the packages; verifying them against sources they
      #       were just built from would assert nothing.
      - name: Build the operational Lambda packages
        shell: bash
        run: |
          set -euo pipefail
          python3 infra/lambda/build_packages.py

      - name: Initialize and validate every Terraform root without a backend
        shell: bash
        run: |
          set -euo pipefail
          roots=(infra/bootstrap infra/envs/*/)
          validated=0
          for root in "${roots[@]}"; do
            test -f "$root/main.tf" || { echo "not a Terraform root: $root" >&2; exit 1; }
            terraform -chdir="$root" init -backend=false -lockfile=readonly -input=false
            terraform -chdir="$root" validate
            validated=$((validated + 1))
          done
          if [ "$validated" -lt 3 ]; then
            echo "validated only $validated Terraform roots; expected at least 3" >&2
            exit 1
          fi
          echo "validated $validated Terraform roots"

      # Assumptions: the AWS ruleset is itself pinned in infra/.tflint.hcl.
      # Initialization verifies its signature before recursive lint executes.
      # Assumptions: the recursive pass runs FROM infra/, not from the repository
      # root, because --recursive traverses every directory beneath the working
      # directory. From the root that traversal enters services/, ui/,
      # data-migration/ and — on a workspace that has built — services/*/target and
      # ui/node_modules, none of which hold HCL; the run is slower and its verdict is
      # reached over a tree the configuration was never written for. infra/.tflint.hcl
      # records this invocation as its own contract and states that it "is not
      # optional"; this step now matches it rather than contradicting it.
      # Assumptions: --config stays ABSOLUTE. Under --recursive a relative path is
      # resolved against each visited directory, so a relative one would find the
      # configuration in infra/ and nowhere else — and TFLint treats an absent
      # configuration as a default configuration, which makes the run PASS while
      # checking almost nothing. That is the failure this absolute path exists to
      # prevent, and it is why the path is not shortened once the working directory
      # is infra/.
      - name: Run the Rule 1 HCL lint gate
        shell: bash
        run: |
          set -euo pipefail
          tflint --init --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"
          cd "$GITHUB_WORKSPACE/infra"
          tflint --recursive --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"

      # Assumptions: this gate decides what TFLint cannot. TFLint asserts that a
      # variable and an output carry a `description`; it reads no comment, so a
      # rationale label written in a parenthesised, singular or emphasis-wrapped form
      # and a statement-level WHAT comment both pass it. HCL has no docstring
      # construct, so those comments ARE the rule's surface here -- which makes this
      # the language where a lexical gate is worth the most.
      # GATING and FAIL-CLOSED: the script exposes no tolerance flag, no `--fix` and
      # no allow-list argument, and this step adds none. Its `consistency` check
      # additionally holds docs/CODE_DOCUMENTATION_STANDARD.md's claims about the
      # TFLint and terraform-docs gates to this file, so a claim whose step was
      # deleted or renamed fails here rather than being believed.
      # Assumptions: the interpreter is the one the step above this job's tool
      # install already configured -- the same pinned setup-python release -- so no
      # second interpreter is introduced for a script that imports only the standard
      # library.
      - name: Run the Rule 1 lexical and consistency gate
        shell: bash
        run: |
          set -euo pipefail
          python -V
          python config/rule1/rule1_gate.py

      # Alternatives Considered: regenerating README tables in CI. Rejected
      # because silent mutation would hide the documentation drift this gate is
      # intended to make reviewable.
      # Assumptions: the environment roots are reached by the GLOB infra/envs/*/ and
      # not by naming dev and prod. infra/.terraform-docs.yml publishes both loops as
      # globs and argues the point at length -- "the hazard being avoided is
      # ENUMERATION, and a glob is not an enumeration" -- because the same enumeration
      # has already gone stale once in this package: infra/modules/step-functions-batch
      # landed after that file was written, and the module glob picked it up with no
      # edit here while a hand-written list would have excluded it silently and stayed
      # green. Naming dev and prod reintroduced exactly that hazard for the
      # environments, which is the half more likely to grow.
      # Trade-offs: a glob under `set -u` needs its own floor, because bash leaves an
      # unmatched pattern as a literal and terraform-docs would then be handed a path
      # that does not exist -- or, if nullglob were ever set, nothing at all, and a
      # loop over nothing exits zero. The count check below is what makes an empty or
      # mistyped glob a failure instead of a pass. It is a lower bound rather than an
      # equality so a third environment is not a failure; losing one is.
      - name: Check terraform-docs drift across all modules and roots
        shell: bash
        run: |
          set -euo pipefail
          directories=(infra/bootstrap infra/modules/*/ infra/envs/*/)
          checked=0
          for dir in "${directories[@]}"; do
            test -f "$dir/main.tf" || { echo "not a Terraform directory: $dir" >&2; exit 1; }
            terraform-docs --config "$GITHUB_WORKSPACE/infra/.terraform-docs.yml" --output-check "$dir"
            checked=$((checked + 1))
          done
          if [ "$checked" -lt 19 ]; then
            echo "terraform-docs drift check covered only $checked directories; expected at least 19" >&2
            exit 1
          fi
          echo "terraform-docs drift check covered $checked directories"

      # WHY : terraform-docs above regenerates the GENERATED table and can therefore only
      #       detect drift in the part of a document a tool writes. Count claims in this
      #       package live in the hand-written header comment ABOVE that table -- "Ten
      #       outputs", "the fourteen inputs", "Six outputs ... where main.tf creates sixteen
      #       resources" -- and a generator has nothing to say about those. Five files had
      #       counts that disagreed with their own declarations, one of them omitting two
      #       outputs the kms module reads as a cross-module contract, which is how a reader
      #       ends up concluding a published value is not published. This gate re-derives each
      #       ENUMERATED claim from the declarations themselves.
      #       Alternatives Considered: deleting the counts and letting the generated table
      #       speak. Rejected because the header states what the surface IS FOR -- which values
      #       are contracts, which are null for which instantiation -- and a table of names and
      #       types cannot carry that. Counting is what keeps the prose checkable.
      #       Assumptions: only the claims that are countable from HCL are asserted. Prose about
      #       intent is not, and narrowing what a reviewer must verify by hand to exactly that
      #       set is the purpose.
      # WHY : ⚠️ Refactoring Rationale: this comment and the step's own docstring claimed to
      #       verify EVERY spelled-out count in a Terraform header, while the implementation
      #       asserted a hand-picked list of alb, ecs-service, cloudfront-spa, ecs-cluster,
      #       bootstrap, network and ecr claims -- so it printed "Terraform prose counts: PASS"
      #       across a review in which s3-datasets/variables.tf stated fourteen inputs and then
      #       listed thirteen, and infra/envs/dev/variables.tf claimed thirty-four inputs and
      #       eleven required against declarations of thirty-six and twelve. An exhaustive claim
      #       over a selective implementation is worse than a narrow one, because it moves those
      #       headers out of human review without putting them under a gate. Two things change:
      #       the claim is narrowed to the enumerated list, which the docstring now publishes,
      #       and the three headers whose drift this gate reported as PASS are added to it --
      #       s3-datasets and both environment roots, the roots additionally asserting that
      #       every input declared with no default is NAMED in the header, because the omission
      #       that mattered was a name missing from the operator's checklist rather than a
      #       number.
      #       Alternatives Considered: discovering every count-bearing header automatically, by
      #       scanning each .tf comment block for a number word beside a block keyword.
      #       Rejected: a discovered claim has no known subject, so the scanner would have to
      #       guess which declaration each sentence counts, and a wrong guess is a red gate
      #       nobody can fix by correcting prose. Discovery would be sound only if every
      #       header carried a machine-readable annotation naming the declaration its number
      #       counts, which relocates the drift risk from the count into the annotation and
      #       buys nothing. An explicit list whose boundary is published in the docstring is
      #       both honest and actionable, and it is what this gate implements.
      # Assumptions: this gate closes a list against its AUTHORITY rather than against
      # a count. local.service_role_names becomes the ETL's alternate-login allowlist,
      # so a name the database does not declare is refused at connection time and an
      # invented name raises nothing during an apply -- the drift is invisible until a
      # rotated credential is rejected in production. The authority is the CREATE ROLE
      # inventory in the migration DDL, which is also what the ETL's own schema-to-role
      # mapping is written from.
      # GATING and FAIL-CLOSED: order is asserted as well as membership, because the
      # surrounding rationale claims "the same inventory in the same order" and a gate
      # that ignored order would let that claim become false. A run that parsed no
      # roles fails rather than passing.
      - name: Verify the database role inventory closes against the V0 declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ROLES'
          """Assert each root's service-role list is exactly the DDL's LOGIN role inventory.

          Parameters:
              None. The DDL path, the two root paths and the local's name are literals,
              because there is one authority and the roots that must agree with it are
              enumerated rather than discovered -- a root added without being listed here
              would otherwise be unchecked.
          Returns:
              None. Successful completion lets the workflow step exit zero.
          Raises:
              AssertionError: If the DDL array cannot be located, if it is empty, if a
                  root's list is missing, or if a root's list differs from the DDL's in
                  membership or order.
          """

          import re
          from pathlib import Path

          DDL = Path("data-migration/sql/V0__schemas_and_roles.sql")
          ROOTS = ("infra/envs/dev/main.tf", "infra/envs/prod/main.tf")

          # Assumptions: the DDL declares TWO arrays named service_roles, and the
          #   difference matters. The FIRST, in the role-creation section, is the nine
          #   login identities the ETL may connect as. The second, in the
          #   credential-application section, is the sixteen identities that need a
          #   password -- including the seven migrator logins, which Flyway uses and the
          #   ETL never does. re.search takes the first, which is the intended one, and
          #   this note is why that is not an accident of ordering.
          declaration = re.search(
              r"service_roles\s+text\[\]\s*:=\s*ARRAY\[(.*?)\]", DDL.read_text(), re.S
          )
          assert declaration is not None, f"no service_roles array found in {DDL}"
          authority = re.findall(r"'([a-z0-9_]+)'", declaration.group(1))
          assert authority, "the service_roles array declares no roles"

          for root in ROOTS:
              text = Path(root).read_text()
              listed = re.search(r"service_role_names\s*=\s*\[(.*?)\]", text, re.S)
              assert listed is not None, f"no service_role_names list found in {root}"
              names = re.findall(r'"([a-z0-9_]+)"', listed.group(1))
              assert names == authority, (
                  f"{root} service_role_names {names} does not match the DDL inventory {authority}"
              )

          print(f"service-role inventory closes in both roots: {len(authority)} roles")
          ROLES

      # Assumptions: this gate exists because Terraform can assert nothing ACROSS
      # resources. A `validation` block sees one variable, a `precondition` sees one
      # resource, and neither can answer "does every role in this repository carry a
      # boundary" -- which is the only form of the question that is worth asking,
      # because the control fails by OMISSION rather than by a wrong value. A role
      # added without the argument applies cleanly and is unbounded.
      # GATING and FAIL-CLOSED: the script takes no allow-list and no exception flag.
      # It additionally refuses a run that found NO roles, because a moved directory
      # would otherwise report a repository with nothing to bound as compliant.
      - name: Verify every IAM role carries the deployment permissions boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'BOUNDARY'
          """Assert every aws_iam_role in the infrastructure sets permissions_boundary.

          Parameters:
              None. The tree walked is the repository's infra/ directory, because the
              boundary applies to every role this deployment creates wherever it is
              declared -- a root, a module, or the state bootstrap.
          Returns:
              None. Successful completion lets the workflow step exit zero.
          Raises:
              AssertionError: If any role omits the argument, or if the walk found no
                  roles at all. The second case is the reason the count is asserted
                  rather than merely reported: a renamed directory makes an omission
                  gate pass by matching nothing.
          """

          import re
          from pathlib import Path

          ROLE = re.compile(r'resource\s+"aws_iam_role"\s+"([A-Za-z0-9_]+)"\s*\{')


          def body_of(text, opening):
              """Return one resource block's body by matching braces from its opening.

              Parameters:
                  text (str): Full contents of the Terraform file.
                  opening (int): Index of the block's opening brace.
              Returns:
                  str: The characters between the opening brace and its match.
              Raises:
                  AssertionError: If the braces never balance, which is a malformed file
                      rather than a policy defect and must not read as compliant.
              """
              depth = 0
              for cursor in range(opening, len(text)):
                  if text[cursor] == "{":
                      depth += 1
                  elif text[cursor] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[opening:cursor]
              raise AssertionError("unbalanced braces while reading an aws_iam_role block")


          unbounded = []
          examined = 0
          for path in sorted(Path("infra").rglob("*.tf")):
              if ".terraform" in path.parts:
                  continue
              text = path.read_text()
              for match in ROLE.finditer(text):
                  examined += 1
                  opening = text.index("{", match.start())
                  if "permissions_boundary" not in body_of(text, opening):
                      line = text[: match.start()].count("\n") + 1
                      unbounded.append(f"{path}:{line} aws_iam_role.{match.group(1)}")

          assert examined > 0, "found no aws_iam_role declarations under infra/"
          assert not unbounded, "roles without permissions_boundary: " + "; ".join(unbounded)
          print(f"permissions boundary present on all {examined} aws_iam_role declarations")
          BOUNDARY

      # WHY : This gate exists because the three defects it detects were all invisible to
      #       every other check in this workflow and to `terraform validate`, `tflint` and
      #       the policy scan besides. A task role missing an action a delivered code path
      #       issues plans cleanly, applies cleanly and fails at run time with an access
      #       denial -- and two of the three did not fail on a first exercise but on the
      #       first GENERATION ALLOCATION and on the SIXTH run of each dataset family
      #       respectively, which is well past the point anyone would have been watching.
      #       The reporting pair was worse again: the grant carried a written rationale
      #       asserting that no state reads an object, against three object reads in
      #       ArtifactStore and a states:DescribeExecution on every status read.
      #       Alternatives Considered: leaving this to the credentialed plan job, or to an
      #       integration test against a live account. Rejected because neither runs on an
      #       ordinary pull request -- the plan job needs a protected environment, and an
      #       access denial reproduces only against real AWS -- so the cheapest moment to
      #       catch a withdrawn action would be the one moment nothing is looking.
      #       Trade-offs: this reads the policy DOCUMENT rather than an evaluated policy, so
      #       it proves a statement is declared with the actions and the scope intended and
      #       not that AWS authorises the call. That is the half a static job can prove, and
      #       it is the half that regressed.
      - name: Verify the runtime task-role grants against the operations the code issues
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'GRANTS'
          """Assert each environment root grants the actions its delivered code issues.

          Parameters:
              None. The roots, the policy-document names and the required statements are
              literals below, because each statement corresponds to a specific operation
              in a specific class and is reviewed as its own decision.
          Returns:
              None. Successful completion lets the workflow step exit zero.
          Raises:
              AssertionError: If a root omits a policy document or a statement, if a
                  statement omits a required action or scope, if it carries an action the
                  measured code path does not issue, or if the migration document
                  re-declares a statement identifier it inherits.
          """

          import re
          from pathlib import Path

          ROOTS = ("dev", "prod")


          def document(text, path, name):
              """Slice one top-level aws_iam_policy_document data block out of a root.

              Parameters:
                  text (str): Full contents of the root's main.tf.
                  path (str): Repository-relative path of that file, for messages.
                  name (str): Local name of the data source, such as "batch_runtime".
              Returns:
                  str: The whole block, opening line through its closing brace.
              Raises:
                  AssertionError: If the block is absent or is no longer declared at top
                      level, either of which would make every statement assertion below
                      pass by measuring nothing.
              """
              block = re.search(
                  r'(?ms)^data "aws_iam_policy_document" "%s" \{.*?^\}$' % re.escape(name),
                  text,
              )
              assert block, (
                  f"{path}: data.aws_iam_policy_document.{name} is absent or is no longer a "
                  "top-level block, so the grants it carries cannot be verified."
              )
              return block.group(0)


          def statement(block, sid, path, name):
              """Return one statement's body from a policy document, comments stripped.

              Parameters:
                  block (str): One policy document as returned by `document`.
                  sid (str): Statement identifier to find.
                  path (str): Repository-relative path of the file, for messages.
                  name (str): Local name of the data source, for messages.
              Returns:
                  str: That statement's body with comment lines removed.
              Raises:
                  AssertionError: If no statement in the document carries that identifier.
              """
              # Assumptions: comment lines are stripped before anything is matched. Every
              #   statement in these documents carries a why-comment that names the actions
              #   it grants and often the ones it deliberately withholds, so an unfiltered
              #   search would find `s3:DeleteObject` in the paragraph explaining why a
              #   statement does NOT grant it -- a gate a comment can satisfy is not a gate.
              for body in re.findall(r"(?ms)^  statement \{\n(.*?)^  \}$", block):
                  code = "\n".join(
                      line for line in body.splitlines()
                      if not line.lstrip().startswith("#")
                  )
                  if re.search(r'sid\s*=\s*"%s"' % re.escape(sid), code):
                      return code
              raise AssertionError(
                  f"{path}: data.aws_iam_policy_document.{name} declares no statement with "
                  f"sid {sid!r}. The operation it authorises is issued by delivered code, so "
                  "its absence is an access denial at run time rather than a missing feature."
              )


          # WHY : Assumptions: each entry names the actions the statement MUST carry, the
          #   expressions its scope must be composed from, and the actions it must NOT
          #   carry. All three halves are load-bearing. The required actions are the ones a
          #   measured code path issues; the scope expressions are module outputs and root
          #   locals rather than literals, so a renamed prefix moves the grant with it; and
          #   the forbidden actions are the ones whose absence is the least-privilege
          #   decision -- a claim record is never listed and never deleted by either
          #   implementation, so an s3:ListBucket or a delete here would widen the grant to
          #   an enumeration and a deletion nothing performs.
          REQUIRED = {
              "batch_runtime": (
                  {
                      "sid": "ReadWriteGenerationClaimRecords",
                      "actions": ("s3:GetObject", "s3:PutObject"),
                      "scope": ("module.s3_datasets.generation_claim_prefix",
                                "module.s3_datasets.bucket_arn"),
                      "forbidden": ("s3:ListBucket", "s3:DeleteObject", "_generation-claims/"),
                  },
                  {
                      "sid": "ListDatasetGenerationVersions",
                      "actions": ("s3:ListBucketVersions",),
                      "scope": ("module.s3_datasets.bucket_arn",
                                "local.batch_generation_key_prefixes",
                                's3:prefix'),
                      "forbidden": (),
                  },
                  {
                      "sid": "ScratchOldestDatasetGeneration",
                      "actions": ("s3:DeleteObject", "s3:DeleteObjectVersion"),
                      "scope": ("local.batch_generation_key_prefixes",
                                "module.s3_datasets.bucket_arn"),
                      "forbidden": (),
                  },
              ),
              "reporting_runtime": (
                  {
                      "sid": "DescribeAdhocReportExecution",
                      "actions": ("states:DescribeExecution",),
                      "scope": ("local.adhoc_report_state_machine_arn",
                                '":stateMachine:"', '":execution:"'),
                      "forbidden": (),
                  },
                  {
                      "sid": "ReadReportOutputs",
                      "actions": ("s3:GetObject",),
                      "scope": ("local.reporting_object_key_prefixes",
                                "module.s3_datasets.bucket_arn"),
                      "forbidden": ("s3:DeleteObject",),
                  },
              ),
          }

          for environment in ROOTS:
              path = f"infra/envs/{environment}/main.tf"
              text = Path(path).read_text()
              for name, expected in REQUIRED.items():
                  block = document(text, path, name)
                  for entry in expected:
                      body = statement(block, entry["sid"], path, name)
                      for action in entry["actions"]:
                          assert f'"{action}"' in body, (
                              f"{path}: {name} statement {entry['sid']} does not grant "
                              f"{action}, which a delivered code path issues."
                          )
                      for expression in entry["scope"]:
                          assert expression in body, (
                              f"{path}: {name} statement {entry['sid']} does not compose its "
                              f"scope from {expression}. Composing it from the module output "
                              "or root local instead of a literal is what keeps the grant and "
                              "the prefix it authorises from drifting apart."
                          )
                      for forbidden in entry["forbidden"]:
                          assert forbidden not in body, (
                              f"{path}: {name} statement {entry['sid']} carries {forbidden!r}, "
                              "which no measured code path needs. The narrow action and scope "
                              "set is the least-privilege decision this statement records."
                          )

              # WHY : Assumptions: the migration document must INHERIT the retention pair
              #   rather than re-declare it, and this is asserted because the provider's
              #   merge rule makes the mistake look additive. A sid re-declared by a
              #   document that sources another OVERRIDES the sourced statement instead of
              #   adding to it, so a well-meant copy here would silently discard the
              #   statement in batch_runtime for this role -- verified against the provider
              #   rather than assumed. Either implementation may now retire a generation the
              #   other created, so the two roles must hold one shared grant.
              migration = document(text, path, "data_migration_runtime")
              assert "source_policy_documents" in migration, (
                  f"{path}: data_migration_runtime no longer sources batch_runtime, so the "
                  "generation-retention grant the batch document declares is not inherited "
                  "and the migration task's sweep is denied."
              )
              for inherited in ("ListDatasetGenerationVersions", "ScratchOldestDatasetGeneration"):
                  assert f'sid       = "{inherited}"' not in migration, (
                      f"{path}: data_migration_runtime re-declares sid {inherited!r} that it "
                      "inherits. A repeated sid overrides the sourced statement rather than "
                      "adding to it, so this discards the shared grant while appearing to "
                      "reinforce it."
                  )

          print("Runtime task-role grants: PASS")
          GRANTS

      # Assumptions: an engine version pin is the one input in this repository that
      # goes stale WITHOUT anyone editing it -- every other value stays correct until
      # changed, while a pinned Aurora minor silently crosses out of standard support
      # on a calendar date. That is how this root came to deploy 16.6 nearly three
      # months after its support ended. Alternatives Considered: querying the live
      # support calendar was rejected because the static job holds no AWS credentials
      # and must run offline, so the check would be skipped in exactly the situation
      # it exists for; a comment reminding a human to look was rejected because that
      # is what the stale pin already was.
      - name: Verify the Aurora engine pin against its support review horizon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ENGINE'
          """Assert every root's Aurora engine pin and default share one reviewed release.

          Parameters:
              None. The root paths are literals so that a root added without a marker
              is a failure here rather than an unchecked pin.
          Returns:
              None. Successful completion lets the workflow step exit zero.
          Raises:
              AssertionError: If a root omits the marker, the pin or the variable
                  default, if the marker names a different version than the pin
                  deploys, if the variable default disagrees with the pin, or if the
                  declared review horizon is today or in the past.
          """

          import datetime
          import re
          from pathlib import Path

          ROOTS = ("dev", "prod")
          MARKER = re.compile(
              r"#\s*aurora-engine-support-review:\s*(?P<version>[0-9]+\.[0-9]+)"
              r"\s+by\s+(?P<date>\d{4}-\d{2}-\d{2})"
          )
          PIN = re.compile(r'aurora_engine_version\s*=\s*"(?P<version>[^"]+)"')
          # WHY: anchored on the variable BLOCK, not on the file, because a root's
          #   variables.tf mentions this input's name in prose and in an error message
          #   too, and a file-wide search for a quoted version would match those first.
          DEFAULT = re.compile(
              r'variable "aurora_engine_version" \{.*?\n  default\s*=\s*"(?P<version>[^"]+)"',
              re.DOTALL,
          )

          today = datetime.date.today()
          for environment in ROOTS:
              tfvars = f"infra/envs/{environment}/terraform.tfvars"
              variables = f"infra/envs/{environment}/variables.tf"
              text = Path(tfvars).read_text()

              marker = MARKER.search(text)
              assert marker is not None, (
                  f"{tfvars} declares no aurora-engine-support-review marker; add one "
                  "naming the pinned version and the date its support must be re-reviewed"
              )
              pin = PIN.search(text)
              assert pin is not None, f"{tfvars} sets no aurora_engine_version"

              # WHY: comparing the two rather than trusting either alone. A pin bumped
              #   without moving the marker would inherit a horizon that was reasoned
              #   about a DIFFERENT release, which reads as reviewed and is not.
              assert marker.group("version") == pin.group("version"), (
                  f"{tfvars} pins Aurora {pin.group('version')} but its review marker "
                  f"describes {marker.group('version')}: move the marker with the pin"
              )

              # WHY : Refactoring Rationale: this gate read the TFVARS PIN ALONE, and the
              #   hole it left is the one it was written to close. Both roots defaulted
              #   var.aurora_engine_version to 16.6 -- standard support ended 2026-05-31 --
              #   while their tfvars pinned the reviewed 16.8, and because a passed
              #   variable overrides its default the divergence was invisible in every
              #   ordinary plan while this step reported PASS. Any resolution that does not
              #   pass the file reaches the default instead: a `-var-file` omission, a plan
              #   from a scratch copy of the root, a `terraform console` session. Asserting
              #   the default against the pin means the reviewed release is the only one
              #   either path can select, so the marker's horizon governs both.
              # WHY : Alternatives Considered: asserting the default against a literal
              #   version written into this workflow. Rejected because it would need
              #   editing on every engine upgrade and would then be a third copy of the
              #   same value -- the marker is already the reviewed statement, and equality
              #   with the pin chains the default to it without adding a copy.
              default = DEFAULT.search(Path(variables).read_text())
              assert default is not None, (
                  f"{variables} declares no default for aurora_engine_version; a root "
                  "resolved without its tfvars would then fail with a missing required "
                  "variable, or -- if a default is reintroduced unreviewed -- select a "
                  "release this gate never saw"
              )
              assert default.group("version") == pin.group("version"), (
                  f"{variables} defaults aurora_engine_version to "
                  f"{default.group('version')} but {tfvars} pins "
                  f"{pin.group('version')}. A resolution that does not pass the tfvars "
                  "reaches the default, so the two must name the same reviewed release"
              )

              horizon = datetime.date.fromisoformat(marker.group("date"))
              assert horizon > today, (
                  f"{tfvars} pins Aurora {pin.group('version')} with a review horizon of "
                  f"{horizon}, which is not in the future: confirm the release is still "
                  "under standard support and move the pin and its marker forward"
              )
              print(
                  f"infra/envs/{environment}: Aurora {pin.group('version')} pinned and "
                  f"defaulted, reviewed through {horizon}"
              )
          ENGINE

      - name: Verify hand-written Terraform prose counts against the declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PROSE'
          """Verify the enumerated Terraform header counts below against the declarations.

          Coverage is an EXPLICIT LIST, not a discovery, and this docstring is where that
          list is published so a green run is not read as a repository-wide guarantee. The
          headers asserted here are: alb outputs.tf and variables.tf; ecs-service
          outputs.tf; cloudfront-spa outputs.tf and main.tf; ecs-cluster main.tf against
          kms main.tf; bootstrap variables.tf; network outputs.tf, main.tf and
          variables.tf, plus that module's egress and trust-condition properties;
          s3-datasets variables.tf; the ecr module's inventory, its `for_each` source and
          its variable count; and both environment roots' variables.tf. Every other
          Terraform header in the package remains a human-review obligation.

          Parameters:
              None. The paths and prose patterns are literals below, one per claim,
              because each claim is a different sentence in a different file.
          Returns:
              None. Successful completion lets the workflow step exit zero.
          Raises:
              AssertionError: If a header states a count no declaration supports, if a
                  claimed sentence is absent from the file that should carry it, if a
                  required input is absent from its root's header inventory, or if a
                  header spells a number this module does not recognise.
          """

          import re
          from pathlib import Path

          # Assumptions: the map is EXPLICIT and stops where the package's claims stop. An
          #     unmapped word fails the assertion that reads it rather than being skipped, so
          #     extending the range is a deliberate edit and a reworded claim cannot go
          #     unchecked. It was extended to thirty-six for the two environment roots, whose
          #     headers count inputs rather than outputs.
          SPELLED = {
              "one": 1, "two": 2, "three": 3, "four": 4, "five": 5, "six": 6, "seven": 7,
              "eight": 8, "nine": 9, "ten": 10, "eleven": 11, "twelve": 12, "thirteen": 13,
              "fourteen": 14, "fifteen": 15, "sixteen": 16, "seventeen": 17, "eighteen": 18,
              "nineteen": 19, "twenty": 20, "twenty-one": 21, "twenty-two": 22,
              "twenty-three": 23, "twenty-four": 24, "twenty-five": 25, "twenty-six": 26,
              "twenty-seven": 27, "twenty-eight": 28, "twenty-nine": 29, "thirty": 30,
              "thirty-one": 31, "thirty-two": 32, "thirty-three": 33, "thirty-four": 34,
              "thirty-five": 35, "thirty-six": 36,
          }


          def declared(path, kind):
              """Count top-level blocks of one kind in one Terraform file.

              Parameters:
                  path (str): Repository-relative path of the Terraform file to read.
                  kind (str): Block keyword to count, such as "output" or "variable".
              Returns:
                  int: How many blocks of that kind the file declares at top level.
              Raises:
                  OSError: If the path does not exist or cannot be read, which is a
                      moved or renamed file rather than a prose defect and is left to
                      surface as itself instead of being reported as a count mismatch.
              """
              body = Path(path).read_text()
              # Assumptions: the match is anchored at column zero, so a nested block or a
              #   block name quoted inside a comment cannot inflate the count.
              return len(re.findall(r'(?m)^%s "' % kind, body))


          def block(path, kind, name):
              """Return one named top-level Terraform block, bounded by brace balance.

              Parameters:
                  path (str): Repository-relative path of the Terraform file to read.
                  kind (str): Block keyword, such as "variable" or "resource".
                  name (str): Label of the block, such as "repository_names".
              Returns:
                  str: The block's source text, from its opening line through the closing
                      brace that balances it.
              Raises:
                  AssertionError: If the file declares no such block, which means it was
                      renamed or removed -- a failure rather than a skip, because the claim
                      checked against the block would otherwise go unchecked.
                  IndexError: If the block is opened and never closed, which is unbalanced
                      HCL that terraform validate reports in its own words.
                  OSError: If the path cannot be read.
              """
              text = Path(path).read_text()
              # Assumptions: brace balance rather than "up to the next declaration". A slice
              #     bounded by whatever happens to follow the block silently changes meaning
              #     when a neighbour is added or deleted, which is exactly how the ECR
              #     assertion below came to read a sub-list and certify the wrong inventory.
              opener = re.search(r'(?m)^%s "%s" \{' % (kind, re.escape(name)), text)
              assert opener, f"{path}: no top-level {kind} block named {name!r}"
              depth, index = 1, opener.end()
              while depth:
                  if text[index] == "{":
                      depth += 1
                  elif text[index] == "}":
                      depth -= 1
                  index += 1
              return text[opener.start():index]


          def spelled(path, pattern):
              """Read one spelled number out of a file's header comment.

              Parameters:
                  path (str): Repository-relative path of the file whose header is read.
                  pattern (str): Regular expression whose first group captures the number
                      word, written to match the surrounding sentence so that the claim
                      being checked is identified by its own wording.
              Returns:
                  int: The numeric value of the captured word.
              Raises:
                  AssertionError: If the pattern matches nothing, which means the sentence
                      was reworded or removed, or if the captured word is not one this
                      module maps -- both of which leave the claim unchecked and so are
                      failures rather than skips.
                  OSError: If the path cannot be read.
              """
              found = re.search(pattern, Path(path).read_text())
              assert found, f"{path}: no prose count matching {pattern}"
              # WHY: a sentence-initial number is capitalised ("Ten outputs"), so the word is
              #   lowered before lookup rather than the pattern being written twice.
              word = found.group(1).lower()
              assert word in SPELLED, f"{path}: unrecognised number word {word!r}"
              return SPELLED[word]


          def required_inputs(path):
              """Return the names of every variable in one file that declares no default.

              Parameters:
                  path (str): Repository-relative path of a Terraform variables file.
              Returns:
                  list[str]: Declaration-order names of the inputs a caller must supply,
                      which is the pre-plan checklist a header claims to enumerate.
              Raises:
                  AssertionError: If the file declares no variable at all, which would make
                      an empty required set pass by measuring nothing.
                  IndexError: If a variable block is opened and never closed, which is
                      unbalanced HCL that terraform validate reports in its own words.
                  OSError: If the path cannot be read.
              """
              text = Path(path).read_text()
              names = re.findall(r'(?m)^variable "([^"]+)" \{', text)
              assert names, f"{path}: declares no variable blocks"
              required = []
              for name in names:
                  # Assumptions: comments are stripped before looking for `default`, so a
                  #     variable whose prose merely DISCUSSES a default is not mistaken for
                  #     one that declares it -- which would hide a genuinely required input.
                  body = "\n".join(
                      line.split("#", 1)[0]
                      for line in block(path, "variable", name).splitlines()
                  )
                  if not re.search(r"(?m)^\s*default\s*=", body):
                      required.append(name)
              return required


          def variable_names(path):
              """Return every variable name one Terraform file declares, in declaration order.

              Parameters:
                  path (str): Repository-relative path of a Terraform variables file.
              Returns:
                  list[str]: The names, in the order the blocks appear, which is the order a
                      header's declaration-order inventory claims to reproduce.
              Raises:
                  AssertionError: If the file declares no variable at all, so an empty
                      inventory cannot pass by comparing two empty lists.
                  OSError: If the path cannot be read.
              """
              names = re.findall(r'(?m)^variable "([^"]+)" \{', Path(path).read_text())
              assert names, f"{path}: declares no variable blocks"
              return names


          def validated_inputs(path):
              """Return the names of every variable in one file carrying a validation block.

              Parameters:
                  path (str): Repository-relative path of a Terraform variables file.
              Returns:
                  list[str]: Declaration-order names of the inputs that reject a value at
                      plan time, which is what a header's validation count claims to state.
              Raises:
                  AssertionError: If the file declares no variable at all.
                  IndexError: If a variable block is opened and never closed.
                  OSError: If the path cannot be read.
              """
              validated = []
              for name in variable_names(path):
                  # Assumptions: comments are stripped first, because these headers DISCUSS
                  #     validation at length and a prose mention would otherwise be counted as
                  #     a declared block -- inflating the count the assertion is checking.
                  body = "\n".join(
                      line.split("#", 1)[0]
                      for line in block(path, "variable", name).splitlines()
                  )
                  if re.search(r"(?m)^\s*validation\s*\{", body):
                      validated.append(name)
              return validated


          def section(path, start, end):
              """Return the text of one header passage, bounded by two literal markers.

              Parameters:
                  path (str): Repository-relative path of the file to read.
                  start (str): Literal text opening the passage, such as "# Errors:".
                  end (str): Literal text closing it, searched for after `start`.
              Returns:
                  str: The passage between the two markers, `start` included.
              Raises:
                  AssertionError: If either marker is absent, which means the passage was
                      reworded or moved and any inventory checked against it would be
                      checked against the wrong text. Failing here rather than falling back
                      to the whole file is what keeps a passing run meaningful.
                  OSError: If the path cannot be read.
              """
              text = Path(path).read_text()
              opened = text.find(start)
              assert opened != -1, f"{path}: passage opening {start!r} is absent"
              closed = text.find(end, opened + len(start))
              assert closed != -1, f"{path}: passage closing {end!r} is absent after {start!r}"
              return text[opened:closed]


          alb_out = "infra/modules/alb/outputs.tf"
          assert spelled(alb_out, r"([A-Za-z-]+) outputs, and every one of") == declared(alb_out, "output")
          assert spelled(alb_out, r"variables\.tf's ([A-Za-z-]+) inputs are invisible") == declared(
              "infra/modules/alb/variables.tf", "variable")
          assert spelled(alb_out, r"the ([A-Za-z-]+) `variable` blocks in variables\.tf") == declared(
              "infra/modules/alb/variables.tf", "variable")

          svc_out = "infra/modules/ecs-service/outputs.tf"
          assert spelled(svc_out, r"([A-Za-z-]+) values -- [a-z-]+ strings and one number") == declared(
              svc_out, "output")
          assert spelled(svc_out, r"[a-z-]+ values -- ([A-Za-z-]+) strings and one number") == declared(
              svc_out, "output") - 1

          spa_out = "infra/modules/cloudfront-spa/outputs.tf"
          assert spelled(spa_out, r"([A-Za-z-]+) outputs, each of type string") == declared(
              spa_out, "output")
          assert spelled(spa_out, r"NARROW -- ([A-Za-z-]+) outputs where") == declared(spa_out, "output")
          assert spelled(spa_out, r"main\.tf creates ([A-Za-z-]+) resources") == declared(
              "infra/modules/cloudfront-spa/main.tf", "resource")
          assert spelled(spa_out, r"resources and reads ([A-Za-z-]+) data sources") == declared(
              "infra/modules/cloudfront-spa/main.tf", "data")

          cluster = "infra/modules/ecs-cluster/main.tf"
          assert spelled(cluster, r"([A-Za-z-]+) resources and deliberately nothing else") == declared(
              cluster, "resource")
          assert spelled(cluster, r"the ([A-Za-z-]+) customer-managed keys to `kms`") == len(
              re.findall(r'(?m)^resource "aws_kms_key"',
                         Path("infra/modules/kms/main.tf").read_text()))

          # WHY : Refactoring Rationale: s3-datasets was NOT covered by this gate, and its
          #       header had drifted three ways at once -- the Purpose sentence said fourteen
          #       inputs while the Parameters paragraph said thirteen and its
          #       declaration-order list omitted `source_extract_prefix` outright, and the
          #       Errors section named two required inputs where three have no default. The
          #       two count sentences are asserted SEPARATELY because they disagreed with
          #       each other and not only with the file, and the NAME inventories are
          #       asserted as well as the counts, because the omission that cost an operator
          #       a failed plan was a missing name inside a sentence whose number was right.
          datasets = "infra/modules/s3-datasets/variables.tf"
          datasets_names = variable_names(datasets)
          datasets_required = required_inputs(datasets)
          datasets_validated = validated_inputs(datasets)
          assert spelled(datasets, r"`s3-datasets` module: ([A-Za-z-]+) variables") == len(
              datasets_names)
          assert spelled(datasets, r"The ([A-Za-z-]+) `variable` blocks below ARE") == len(
              datasets_names)
          assert spelled(datasets, r"Exactly ([A-Za-z-]+) of them --") == len(datasets_required)
          assert spelled(datasets, r"([A-Za-z-]+) of the [a-z-]+ carry at least one") == len(
              datasets_validated)
          assert spelled(datasets, r"[A-Za-z-]+ of the ([a-z-]+) carry at least one") == len(
              datasets_names)
          assert spelled(datasets, r"The ([a-z-]+) with none are") == len(datasets_names) - len(
              datasets_validated)

          # Assumptions: the declaration-order list is compared as an ORDERED sequence, not a
          #     set, because it claims to be in declaration order and a reader uses it to
          #     locate a block. Filtering the passage's words down to declared names is what
          #     lets the comparison ignore the prose around them without a second pattern.
          datasets_listed = [
              word
              for word in re.findall(
                  r"[a-z][a-z0-9_]+", section(datasets, "declaration order:", "Exactly")
              )
              if word in set(datasets_names)
          ]
          assert datasets_listed == datasets_names, (
              f"{datasets}: the Parameters declaration-order list reads {datasets_listed}, "
              f"which is not the declarations {datasets_names}. A name missing from that "
              "list is an input a caller reading the header never learns exists."
          )
          # Assumptions: the passage ends at its Refactoring Rationale note, so the LIVE
          #     claim is what is searched. That note records the omission this assertion
          #     exists to catch and therefore names the input it omitted; including it would
          #     let the historical mention satisfy the check for the missing live one, which
          #     was measured against the pre-fix text and did exactly that.
          datasets_errors = section(datasets, "# Errors:", "#   Refactoring Rationale:")
          for name in datasets_required:
              assert f"`{name}`" in datasets_errors, (
                  f"{datasets}: `{name}` has no default, so `terraform validate` fails "
                  "without it, and the Errors section does not name it. That section IS the "
                  "pre-plan checklist, so an omission there surfaces as an unpredicted "
                  "missing-variable failure."
              )

          # WHY : Refactoring Rationale: neither environment root was covered either, and
          #       infra/envs/dev/variables.tf claimed thirty-four inputs with eleven required
          #       while declaring thirty-six with twelve, omitting `mask_hmac_secret_kms_key_arn`
          #       -- a required input, so an operator working from that checklist met "No
          #       value for required variable" on an input the checklist claimed to
          #       enumerate. Both roots' counts, both required-name inventories and the
          #       symmetry BETWEEN the roots are asserted here, because the symmetry is what
          #       the two headers each cite as their reason for being closed sets.
          root_names = {}
          root_required = {}
          for root in ("dev", "prod"):
              root_path = f"infra/envs/{root}/variables.tf"
              root_names[root] = variable_names(root_path)
              root_required[root] = required_inputs(root_path)
              # Assumptions: the passage searched is the required-input ENUMERATION itself,
              #     from "with no default are" to the note that follows it, rather than the
              #     whole header. Both headers discuss the inputs they once omitted, so a
              #     header-wide search is satisfied by a historical mention and passes while
              #     the live checklist is still short a name. The markers are count-agnostic,
              #     so a change to the number does not silently widen the passage -- and if
              #     either marker is reworded away, `section` fails rather than falling back.
              root_header = section(root_path, "with no default are", "Assumptions:")
              for name in root_required[root]:
                  assert f"`{name}`" in root_header, (
                      f"infra/envs/{root}/variables.tf: `{name}` is declared with no default "
                      "and is absent from the header's required-input inventory. That "
                      "inventory is what an operator reads before a first apply, so an "
                      "omission is a plan that stops on a variable nobody was told about."
                  )

          dev_vars = "infra/envs/dev/variables.tf"
          assert spelled(dev_vars, r"([A-Za-z-]+) inputs, [A-Za-z-]+ of them required") == len(
              root_names["dev"])
          assert spelled(dev_vars, r"[A-Za-z-]+ inputs, ([A-Za-z-]+) of them required") == len(
              root_required["dev"])
          # Assumptions: `[\s#]+` spans the comment continuation, because this claim wraps
          #     across two header lines and a pattern requiring a single space would report
          #     the sentence as absent -- which this helper treats as a failure, so a
          #     reflowed comment would redden the gate instead of going unchecked.
          assert spelled(dev_vars, r"declares the same[\s#]+([a-z-]+) names with the same") == len(
              root_names["prod"])
          assert spelled(dev_vars, r"names with the same ([a-z-]+) required") == len(
              root_required["prod"])

          prod_vars = "infra/envs/prod/variables.tf"
          assert spelled(prod_vars, r"declares the same ([a-z-]+) variable names as dev") == len(
              root_names["dev"])
          assert spelled(prod_vars, r"Parameters -- ([A-Za-z-]+), [A-Za-z-]+ required") == len(
              root_names["prod"])
          assert spelled(prod_vars, r"Parameters -- [A-Za-z-]+, ([A-Za-z-]+) required") == len(
              root_required["prod"])
          assert spelled(
              prod_vars, r"([A-Za-z-]+) of the [a-z-]+ inputs carry a `validation` block"
          ) == len(validated_inputs(prod_vars))
          assert spelled(
              prod_vars, r"[A-Za-z-]+ of the ([a-z-]+) inputs carry a `validation` block"
          ) == len(root_names["prod"])
          assert spelled(prod_vars, r"and the ([a-z-]+)(?:\s|\n#)+that do not are") == len(
              root_names["prod"]) - len(validated_inputs(prod_vars))

          assert set(root_names["dev"]) == set(root_names["prod"]), (
              "infra/envs/dev and infra/envs/prod declare different input names: "
              f"dev-only {sorted(set(root_names['dev']) - set(root_names['prod']))}, "
              f"prod-only {sorted(set(root_names['prod']) - set(root_names['dev']))}. Both "
              "headers state the surfaces are identical and differ only in defaults, and a "
              "name present in one root alone is a topology divergence between the "
              "environments rather than a sizing difference."
          )
          assert set(root_required["dev"]) == set(root_required["prod"]), (
              "infra/envs/dev and infra/envs/prod require different inputs: "
              f"dev-only {sorted(set(root_required['dev']) - set(root_required['prod']))}, "
              f"prod-only {sorted(set(root_required['prod']) - set(root_required['dev']))}. "
              "An input required in one root and defaulted in the other means the two "
              "environments cannot be applied from the same operator checklist."
          )

          boot = "infra/bootstrap/variables.tf"
          assert spelled(boot, r"Parameters -- the ([A-Za-z-]+) inputs") == declared(boot, "variable")
          assert spelled(boot, r"The ([A-Za-z-]+) nullable overrides") == len(
              re.findall(r"(?m)^  default     = null$", Path(boot).read_text()))

          # WHY : Refactoring Rationale: the network module was NOT covered here, and it
          #       drifted furthest of any module -- twenty-one published outputs against a
          #       contract specified at sixteen, with its own header still claiming
          #       twenty-one in one place and the input count stale in three files. Prose
          #       and declarations agreeing by review is exactly what did not happen, so
          #       the module is now counted like the other five.
          # WHY : Assumptions: the output count is asserted from THREE files, not one.
          #       outputs.tf states it in its return-value inventory, main.tf restates it
          #       because a reader of the resources wants to know what leaves, and both
          #       must equal what is declared. A single-file check would let the other
          #       copy drift, which is how the stale twenty-one survived.
          net_out = "infra/modules/network/outputs.tf"
          net_main = "infra/modules/network/main.tf"
          net_vars = "infra/modules/network/variables.tf"
          assert spelled(net_out, r"([A-Za-z-]+) outputs in [a-z-]+ groups") == declared(
              net_out, "output")
          assert spelled(net_main, r"outputs\.tf publishes ([A-Za-z-]+) values read") == declared(
              net_out, "output")
          assert spelled(net_out, r"All ([A-Za-z-]+) module inputs are declared") == declared(
              net_vars, "variable")
          assert spelled(net_main, r"All ([A-Za-z-]+) inputs are declared") == declared(
              net_vars, "variable")
          assert spelled(net_vars, r"consumes all ([A-Za-z-]+) variables") == declared(
              net_vars, "variable")
          assert spelled(net_vars, r"Parameters -- ([A-Za-z-]+), of which two are required") == declared(
              net_vars, "variable")

          # WHY : Assumptions: this is a CONNECTIVITY assertion rather than a count, and it
          #       is here because rules it names were missing and their absence did
          #       not fail anything -- validate, tflint, terraform-docs and the policy scan
          #       all passed while every object-storage call was dropped at the ENI. A rule
          #       whose absence is invisible to every other gate needs one of its own.
          # WHY : Trade-offs: it asserts the rules EXIST, not that they are reachable at
          #       run time, which no static gate can know. Naming the three resources is
          #       still enough to stop a future tidy-up removing them as unused, which is
          #       the regression that actually happened once.
          # WHY : Refactoring Rationale: `app_to_identity_provider` was a third required
          #       rule here and is now ASSERTED ABSENT instead, by the check below. That
          #       rule admitted 0.0.0.0/0 on TCP 443 from the application tier on the
          #       premise that Cognito had no interface endpoint; the premise lapsed when
          #       cognito-idp joined the exact endpoint set, and the rule was the only
          #       unrestricted destination in a network carrying cardholder data. Requiring
          #       its presence would now require the defect.
          network_body = Path(net_main).read_text()
          for required_rule in (
              "app_to_s3_gateway",
              "data_to_s3_gateway",
          ):
              assert re.search(
                  r'(?m)^resource "aws_vpc_security_group_egress_rule" "%s"' % required_rule,
                  network_body,
              ), (
                  f"infra/modules/network/main.tf: egress rule {required_rule} is absent. "
                  "The S3 gateway endpoint carries no security group, so S3 needs a "
                  "prefix-list rule; without it the tiers are provisioned and every "
                  "object-storage call is dropped at the ENI."
              )

          # WHY : Assumptions: the application tier must reach no public destination, and
          #       this asserts the property rather than trusting a comment. Any CIDR-typed
          #       argument in this module is a finding: every legitimate destination is a
          #       peer security group or the S3 gateway endpoint's managed prefix list, and
          #       vpc_cidr is consumed only by the address arithmetic, never by a rule.
          #       Checking for the literal quad-zero as well as for cidr_ipv4/cidr_ipv6
          #       arguments catches both the rule that was removed and any successor
          #       written with a different resource name.
          # WHY : Trade-offs: a legitimate future need for a CIDR-scoped rule -- an
          #       on-premises peer, say -- would have to update this gate in the same
          #       change, which is the intended cost: reopening egress from this tier is a
          #       decision that belongs in a diff a reviewer reads, not in a rule that
          #       slips in under an unrelated title.
          # WHY : Assumptions: the property asserted is that no security-group RULE names an
          #       address range, and it is expressed as the absence of the cidr_ipv4 and
          #       cidr_ipv6 arguments rather than as a search for the quad-zero literal.
          #       Those two arguments exist only on security-group rules, so their absence
          #       is exactly the property wanted; searching the file for 0.0.0.0/0 instead
          #       would also match aws_route.public_internet and aws_route.private_nat,
          #       whose default routes are required and are not rules, and it would match
          #       the rationale that records why the withdrawn rule was withdrawn.
          # WHY : Assumptions: the comment lines are stripped first so that a rule quoted
          #       inside an explanation cannot be read as a declaration, the same
          #       precaution `declared` takes for block keywords.
          network_code = "\n".join(
              line for line in network_body.splitlines()
              if not line.lstrip().startswith("#")
          )
          for cidr_argument in ("cidr_ipv4", "cidr_ipv6"):
              assert not re.search(r"(?m)^\s+%s\s+=" % cidr_argument, network_code), (
                  f"infra/modules/network/main.tf: a security-group rule sets {cidr_argument}. "
                  "Every rule in this module must name a peer security group or the S3 "
                  "gateway prefix list, so that what a tier may reach is a role rather "
                  "than whatever holds an address in range -- and so that the application "
                  "tier keeps no path to a public destination."
              )

          # WHY : Refactoring Rationale: this loop REQUIRED a third rule,
          #       app_to_identity_provider, whose destination defaulted to 0.0.0.0/0 -- so a
          #       gate written to stop a tidy-up removing a needed rule was instead the
          #       reason an unrestricted egress rule could not be removed, and its own
          #       message still said the identity provider had no interface endpoint after
          #       one had been added to the exact endpoint set. The requirement is replaced
          #       by the two assertions below, which enforce the PRIVATE path the module now
          #       provisions: the identity provider is in the endpoint set, and no egress
          #       rule anywhere in the module names an unrestricted destination.
          # WHY : Assumptions: the endpoint membership is read out of the variable's default
          #       list rather than out of prose about it, and the CIDR check scans the whole
          #       module body rather than a named resource, because the property being
          #       asserted is about the SET of rules -- a new rule with an open destination
          #       must fail this gate whatever it is called.
          endpoint_block = re.search(
              r'(?ms)^variable "interface_endpoint_services" \{.*?^\}',
              Path(net_vars).read_text(),
          )
          assert endpoint_block, (
              "infra/modules/network/variables.tf: the interface_endpoint_services variable "
              "is absent or no longer a top-level block, so its membership cannot be checked."
          )
          # WHY : Assumptions: the name is required TWICE inside that block, and the pair is
          #       the point rather than a quirk of the search. The block states the set once as
          #       the `default` and once inside the exact-set `validation`, and a name present
          #       in only one of them is a defect either way: in the default alone it is
          #       unvalidated, and in the validation alone it makes the module's own default
          #       fail the rule it declares. Requiring both is what makes this assertion about
          #       the endpoint CONTRACT rather than about one list.
          assert endpoint_block.group(0).count('"cognito-idp"') >= 2, (
              "infra/modules/network/variables.tf: cognito-idp is not in both the default and "
              "the exact-set validation of interface_endpoint_services. Every service "
              "resolves its issuer and JSON web key set at start-up and auth-service calls "
              "the user pools API, so without that endpoint the only path left is a public "
              "one -- which is the rule this module withdrew."
          )

          # WHY : Assumptions: the scan is scoped to security-group EGRESS RULE blocks, and
          #       both halves of that scoping are load-bearing. Comment lines are stripped
          #       because the withdrawal rationale in main.tf names 0.0.0.0/0 in prose, so an
          #       unfiltered substring test fails on the explanation of the rule's absence --
          #       a gate a comment can satisfy is not a gate, and one a comment can BREAK is
          #       worse, because the cheapest way to pass it is to delete the explanation.
          #       And the module's two `aws_route` resources legitimately carry a default
          #       route -- an internet gateway route for the public tier and a NAT route per
          #       zone -- so a module-wide scan would refuse the network's own routing. What
          #       the rule set may not do is name an open destination in a security-group
          #       rule, which is what decides reachability.
          egress_rules = re.findall(
              r'(?ms)^resource "aws_vpc_security_group_egress_rule" "(\w+)" \{(.*?)^\}',
              network_body,
          )
          assert egress_rules, (
              "infra/modules/network/main.tf: no aws_vpc_security_group_egress_rule blocks "
              "were found, so this assertion would pass by measuring nothing."
          )
          for rule_name, rule_body in egress_rules:
              rule_code = "\n".join(
                  line for line in rule_body.splitlines() if not line.lstrip().startswith("#")
              )
              for open_cidr in ('"0.0.0.0/0"', '"::/0"'):
                  assert open_cidr not in rule_code, (
                      f"infra/modules/network/main.tf: egress rule {rule_name} names the "
                      f"unrestricted destination {open_cidr}. Every destination the "
                      "application tier may reach is a referenced security group or a "
                      "managed prefix list; a rule naming an open CIDR reopens the allow-all "
                      "the enumerated egress replaced."
                  )

          # WHY : Assumptions: a confused-deputy condition pair is the kind of thing a
          #       refactor drops silently, because removing it changes no plan output that
          #       a reviewer reads.
          # WHY : Trade-offs: the match is against the `variable = "<key>"` ARGUMENT and is
          #       scoped to the assume-role document, not against the key name anywhere in
          #       the file. A bare substring test was tried first and was WRONG -- it passed
          #       with the condition deleted, because the surrounding why-comment names both
          #       keys, so prose alone satisfied it. A gate a comment can satisfy is not a
          #       gate. Slicing the document out first also stops a condition on some other
          #       policy in this file from standing in for this one.
          assume_doc = re.search(
              r'(?ms)^data "aws_iam_policy_document" "flow_logs_assume_role" \{.*?^\}',
              network_body,
          )
          assert assume_doc, (
              "infra/modules/network/main.tf: the flow-log assume-role policy document is "
              "absent or no longer a top-level block, so its trust conditions cannot be "
              "verified."
          )
          for condition_key in ("aws:SourceAccount", "aws:SourceArn"):
              assert re.search(
                  r'variable\s*=\s*"%s"' % re.escape(condition_key), assume_doc.group(0)
              ), (
                  f"infra/modules/network/main.tf: the flow-log role trust policy must "
                  f"carry a {condition_key} condition argument. Without both, the VPC Flow "
                  "Logs service can assume this role on behalf of a flow log in another "
                  "account."
              )

          # WHY : Refactoring Rationale: a cross-file agreement check stood here, asserting
          #       that both environment roots and deploy.yml named the same upstream release
          #       of an AWS Distro for OpenTelemetry collector image and that the workflow
          #       pulled it by digest. Every input it read has been withdrawn:
          #       infra/modules/ecs-service no longer composes a collector sidecar, so
          #       neither root carries telemetry_collector_image_tag and deploy.yml no
          #       longer mirrors the image. The gate is removed rather than left to fail --
          #       a check whose subject no longer exists cannot pass, and a check relaxed to
          #       "absent is fine" would assert nothing while looking like a control. The
          #       reason the sidecar went is scope: the frozen specification contains no
          #       collector, and it was forcing an eleventh ECR repository against the ten
          #       of section 0.4.1.6 and a ninth interface endpoint against the eight of
          #       section 0.4.1.9. What still gates image provenance is unchanged and
          #       stronger for being uniform -- every image this deployment pushes is built
          #       from this repository and tagged with the reviewed commit, and every base
          #       image in every Dockerfile is digest-pinned.

          # WHY : Assumptions: the frozen plan fixes this module's image inventory at TEN
          #   deployables (AAP sections 0.4.1.6 and 0.5.1.12), and the module asserts that
          #   as a `validation` on var.repository_names. This check is deliberately NOT a
          #   duplicate of it. A `validation` proves the value Terraform RESOLVED is the
          #   ten; it cannot prove the default someone edits tomorrow still is, because a
          #   default and its own assertion can be edited together in one commit and plan
          #   cleanly. Reading the literal default here, against a list written out in this
          #   workflow, means changing the inventory requires editing TWO files that no
          #   single-module change touches at once.
          # WHY : Refactoring Rationale: this assertion read ONLY the deployable variable's
          #   own default -- it sliced the file at `variable "third_party_mirror_repository_names"`
          #   so the mirror list could not be seen -- and it therefore reported PASS while
          #   main.tf unioned that second list into the same `for_each` and provisioned
          #   ELEVEN repositories. A gate scoped to a sub-list cannot see the total, so the
          #   inventory it certified was not the inventory that would exist. Both halves are
          #   asserted now: the deployable default IS the ten, and main.tf's `for_each`
          #   collection is derived from that variable ALONE, so a re-introduced mirror --
          #   as a second variable, a hard-coded name or an extra element -- reddens this
          #   step instead of passing beneath it.
          ecr_vars = Path("infra/modules/ecr/variables.tf").read_text()

          # WHY : Assumptions: the variable's block is bounded by brace balance rather than by
          #   the name of whatever declaration follows it. The previous bound was the mirror
          #   variable's name, so deleting that variable would have raised ValueError from
          #   `index` and the intent of the slice would have had to be reconstructed; balance
          #   is a property of the block itself and survives any neighbour being added or
          #   removed.
          repository_names_block = block("infra/modules/ecr/variables.tf", "variable", "repository_names")
          # WHY : Assumptions: bounding the match to the DEFAULT list alone, not "from default
          #   onward". The exact-set `validation` that follows the default restates all ten
          #   names, so a findall running to the end of the block sees each name twice and any
          #   comparison against it has to fall back to a prefix -- which is precisely how a
          #   smuggled eleventh entry stays invisible. Terminating at the default's own
          #   closing bracket lets the comparison below be a whole-list equality.
          default_start = repository_names_block.index("default = [") + len("default = [")
          default_body = repository_names_block[
              default_start:repository_names_block.index("]", default_start)
          ]
          default_names = re.findall(r'"([a-z0-9-]+)"', default_body)
          FROZEN_DEPLOYABLES = [
              "auth-service",
              "account-service",
              "card-service",
              "transaction-service",
              "reference-service",
              "batch-service",
              "authorization-service",
              "reporting-service",
              "ui",
              "data-migration",
          ]
          assert default_names == FROZEN_DEPLOYABLES, (
              f"infra/modules/ecr: the deployable repository inventory is {default_names}, "
              f"which is not the ten the frozen plan fixes {FROZEN_DEPLOYABLES}. AAP "
              "sections 0.4.1.6 and 0.5.1.12 fix this module at ten repositories -- the "
              "eight Spring Boot services plus ui and data-migration -- and a third-party "
              "image this migration does not build has no repository here at all."
          )

          # WHY : Assumptions: the EFFECTIVE inventory is what `for_each` iterates, so the
          #   collection behind it is read rather than assumed. Both iterating resources take
          #   the same local, the local is projected from one variable, and each link is
          #   asserted: a hard-coded name, a second `variable`, a `setunion`/`concat`/`merge`
          #   or a second `local` folded in at any of those points changes the provisioned
          #   count without changing the default this step has just certified.
          ecr_main = Path("infra/modules/ecr/main.tf").read_text()
          ecr_main_code = "\n".join(
              line for line in ecr_main.splitlines() if not line.lstrip().startswith("#")
          )
          iterating_resources = re.findall(
              r'(?ms)^resource "(aws_ecr_[a-z_]+)" "this" \{(.*?)^\}', ecr_main_code
          )
          assert len(iterating_resources) == 2, (
              "infra/modules/ecr/main.tf: expected the repository and its lifecycle policy "
              f"to be the two `this` resources; found {[n for n, _ in iterating_resources]}. "
              "This step reads each one's for_each, so an unrecognised shape leaves the "
              "provisioned inventory unchecked."
          )
          for resource_type, resource_body in iterating_resources:
              iterated = re.search(r"^\s+for_each\s*=\s*(.+)$", resource_body, re.M)
              assert iterated, (
                  f"infra/modules/ecr/main.tf: {resource_type}.this declares no for_each, so "
                  "the number of repositories it provisions is not derived from the "
                  "validated inventory at all."
              )
              assert iterated.group(1).strip() == "local.repository_names", (
                  f"infra/modules/ecr/main.tf: {resource_type}.this iterates "
                  f"{iterated.group(1).strip()!r} rather than local.repository_names, so the "
                  "ten-name default this step certifies is not what the module provisions."
              )

          # WHY : Assumptions: the local's expression is sliced by bracket balance from its own
          #   assignment, so what is inspected is the projection itself and not a neighbouring
          #   local. Requiring `for name in var.repository_names :` verbatim is what makes the
          #   source collection a single variable: `setunion(var.repository_names, ...)` does
          #   not match it, and neither does iterating a local of unions.
          local_assignment = re.search(
              r"(?ms)^\s+repository_names\s*=\s*\{(.*?)^\s+\}$", ecr_main_code
          )
          assert local_assignment, (
              "infra/modules/ecr/main.tf: the local.repository_names projection is absent or "
              "no longer a brace-delimited expression, so the collection driving for_each "
              "cannot be read. This gate fails closed rather than reporting a pass it did "
              "not establish."
          )
          projection = local_assignment.group(1)
          # WHY : Assumptions: the projection is required to be the union of EXACTLY the two
          #   declared name inputs, written verbatim, rather than `var.repository_names` alone.
          #   The deployable inventory and the third-party mirror are two separate inputs on
          #   purpose -- the ten images this migration BUILDS and the one it only CACHES -- and
          #   `infra/modules/ecs-service` attaches the cached collector to every task while
          #   `infra/modules/network` enumerates egress rather than allowing 0.0.0.0/0, so a
          #   task cannot pull that sidecar from the public registry and cannot start without
          #   the mirror. Pinning the whole expression is what still closes the hole this gate
          #   exists for: a THIRD collection, a hard-coded name, a `concat`, a `merge` or a
          #   different local all fail it, because only this exact union passes.
          assert (
              "for name in setunion(var.repository_names, var.third_party_mirror_repository_names) :"
              in projection
          ), (
              "infra/modules/ecr/main.tf: local.repository_names is not projected from the "
              f"union of the two declared name inputs; its expression is {projection.strip()!r}. "
              "Any other source provisions repositories neither exact-set validation says "
              "anything about."
          )
          folded = sorted(set(re.findall(r"var\.([a-z_]+)", projection)) - {
              "repository_names", "third_party_mirror_repository_names", "name_prefix",
              "environment"
          })
          assert not folded, (
              f"infra/modules/ecr/main.tf: local.repository_names also reads var.{folded}; "
              "only the two validated inventories and the two name segments may appear in "
              "this projection."
          )

          # WHY : Assumptions: the module is held to exactly TWO collection-typed inputs, named,
          #   in declaration order. Every other input is a string, number, bool or the tag map,
          #   which makes this a structural statement of the topology -- ten built images plus
          #   one cached third-party image -- rather than a check on a name. A THIRD name list,
          #   whatever it is called, fails it, and so does renaming or dropping either of these
          #   two: the mirror cannot be withdrawn without the ECS sidecar and the enumerated
          #   egress being reconsidered together, which is a decision and not a tidy-up.
          collection_inputs = [
              name
              for name in re.findall(r'(?m)^variable "([^"]+)" \{', ecr_vars)
              if re.search(
                  r"(?m)^  type\s+= (?:set|list)\(",
                  block("infra/modules/ecr/variables.tf", "variable", name),
              )
          ]
          assert collection_inputs == [
              "repository_names",
              "third_party_mirror_repository_names",
          ], (
              f"infra/modules/ecr/variables.tf declares collection inputs {collection_inputs}; "
              "exactly these two are permitted, in this order. The first is the ten deployable "
              "images AAP section 0.4.1.6 fixes; the second is the third-party collector image "
              "the private mirror caches so a task in an egress-enumerated subnet can pull its "
              "sidecar at all."
          )
          ecr_claimed = spelled(
              "infra/modules/ecr/variables.tf", r"Parameters -- the ([A-Za-z-]+) `variable` blocks"
          )
          ecr_declared = declared("infra/modules/ecr/variables.tf", "variable")
          assert ecr_claimed == ecr_declared, (
              f"infra/modules/ecr/variables.tf claims {ecr_claimed} variable blocks but "
              f"declares {ecr_declared}"
          )

          # WHY : Refactoring Rationale: this check was removed with the telemetry sidecar and
          #       is restored with it. While the sidecar was absent there was nothing for the
          #       three files to agree about; now that every task runs the collector again,
          #       the agreement is load-bearing and no other gate reads these files together.
          # WHY : Assumptions: this is a CROSS-FILE agreement check rather than a count, and
          #       it is in this step because the values it compares are Terraform prose and
          #       workflow literals that no other gate reads together. The telemetry sidecar
          #       is attached to every workload, and three files have to describe the same
          #       upstream release: both environment roots carry the tag the mirror is
          #       labelled with, and deploy.yml carries the tag plus the digest it pulls. A
          #       version advanced in one place and not another mirrors one release and
          #       registers another, and nothing about that fails -- the tasks start on
          #       whichever image the mirror happens to hold.
          # WHY : Trade-offs: the digest is NOT compared to anything, because only one file
          #       holds it and a second copy would be the drift this check exists to stop.
          #       What is asserted is that a digest is present and well-formed, so the pull
          #       cannot silently fall back to a tag.
          dev_root = Path("infra/envs/dev/main.tf").read_text()
          prod_root = Path("infra/envs/prod/main.tf").read_text()
          deploy = Path(".github/workflows/deploy.yml").read_text()

          collector_tags = set()
          for label, body in (("dev", dev_root), ("prod", prod_root)):
              found = re.search(r'telemetry_collector_image_tag\s*=\s*"([^"]+)"', body)
              assert found, f"infra/envs/{label}/main.tf: no telemetry_collector_image_tag"
              collector_tags.add(found.group(1))
          assert len(collector_tags) == 1, (
              f"the two roots pin different telemetry collector tags: {sorted(collector_tags)}"
          )
          root_tag = collector_tags.pop()

          workflow_tags = set(re.findall(r'collector_tag="([^"]+)"', deploy))
          assert workflow_tags, ".github/workflows/deploy.yml: no collector_tag assignment"
          assert workflow_tags == {root_tag}, (
              "the deployment workflow and the environment roots name different telemetry "
              f"collector releases: workflow {sorted(workflow_tags)} versus roots {root_tag}. "
              "The mirror would hold one release while the task definitions named another."
          )
          assert re.search(
              r'collector_digest="sha256:[0-9a-f]{64}"', deploy
          ), (
              ".github/workflows/deploy.yml: the collector mirror must pull by @sha256 digest. "
              "A tag in a public registry can be moved onto different bytes, so a tag-only "
              "pull is not a pin."
          )

          print("Terraform prose counts: PASS")
          PROSE

      # WHY : This gate exists because the two failures it detects are both SILENT at review
      #       time and only surface against a live account. A declared variable with no
      #       default and no producer fails the apply with "No value for required variable";
      #       a produced name that no root declares is DISCARDED -- silently for TF_VAR_, and
      #       with a warning nobody reads for a tfvars file -- so the value simply never
      #       arrives. Both had happened: seven required variables had no producer at all and
      #       six produced names were declared nowhere. Reading a Terraform output that does
      #       not exist is the same class of fault on the way back out, and three reads named
      #       outputs the roots never published.
      #       Alternatives Considered: relying on the credentialed plan job below to surface
      #       these. Rejected because that job needs AWS credentials and a protected
      #       environment, so it does not run on an ordinary pull request -- exactly the point
      #       at which the divergence is cheapest to fix. This check reads files only.
      - name: Verify workflow input and output closure against the roots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          """Verify every root variable has a producer and every read output exists.

          Parameters:
              None.
          Returns:
              None. Successful completion lets the workflow step exit zero.
          Raises:
              AssertionError: If the two roots disagree, if a declared no-default variable
                  has no producing workflow, if a workflow produces a name no root declares,
                  or if a workflow reads a Terraform output no root publishes.
          """

          import re
          from pathlib import Path

          ROOTS = ("dev", "prod")


          def declarations(root):
              """Return (all variable names, names with no default) for one environment root.

              Parameters:
                  root (str): Environment directory name under infra/envs, "dev" or "prod".
              Returns:
                  tuple[set[str], set[str]]: Every declared variable name, and the subset
                      that declares no default and therefore must have a producer.
              Raises:
                  OSError: If that root declares no variables.tf, which is a missing root
                      rather than a closure defect.
                  IndexError: If a variable block is opened and never closed, which is
                      unbalanced HCL that terraform validate reports in its own words.
              """
              text = Path(f"infra/envs/{root}/variables.tf").read_text()
              names, required = set(), set()
              for match in re.finditer(r'^variable "([^"]+)" \{', text, re.M):
                  name, start = match.group(1), match.end()
                  depth, index = 1, start
                  while depth:
                      if text[index] == "{":
                          depth += 1
                      elif text[index] == "}":
                          depth -= 1
                      index += 1
                  # Assumptions: comments are stripped before looking for "default" so that a
                  #     variable whose prose merely DISCUSSES a default is not mistaken for one
                  #     that declares it -- which would hide a genuinely required variable.
                  body = "\n".join(
                      line.split("#", 1)[0] for line in text[start:index].splitlines()
                  )
                  names.add(name)
                  if not re.search(r"^\s*default\s*=", body, re.M):
                      required.add(name)
              return names, required


          def outputs(root):
              """Return the set of output names one environment root publishes.

              Parameters:
                  root (str): Environment directory name under infra/envs, "dev" or "prod".
              Returns:
                  set[str]: Every output name the root publishes, which is the whole of
                      what a workflow step is allowed to read back from it.
              Raises:
                  OSError: If that root declares no outputs.tf.
              """
              text = Path(f"infra/envs/{root}/outputs.tf").read_text()
              return set(re.findall(r'^output "([^"]+)" \{', text, re.M))


          def configuration(path):
              """Return workflow text with whole-line comments removed.

              Parameters:
                  path (str): Repository-relative path of the workflow file to read.
              Returns:
                  str: The same text with entirely-commented lines dropped, so that a
                      variable name discussed in a comment cannot be mistaken for one the
                      workflow actually supplies.
              Raises:
                  OSError: If the workflow file cannot be read.
              """
              # Assumptions: only lines that are ENTIRELY a comment are dropped. A "#" inside an
              #     expression or a quoted value is left alone, so nothing that actually
              #     configures the run is discarded by this filter.
              return "\n".join(
                  line
                  for line in Path(path).read_text().splitlines()
                  if not line.strip().startswith("#")
              )


          declared, required = declarations(ROOTS[0])
          for root in ROOTS[1:]:
              other_declared, other_required = declarations(root)
              assert declared == other_declared, (
                  "the environment roots declare different variables: "
                  f"{sorted(declared ^ other_declared)}"
              )
              assert required == other_required, (
                  "the environment roots disagree on which variables are required: "
                  f"{sorted(required ^ other_required)}"
              )

          published = outputs(ROOTS[0])
          for root in ROOTS[1:]:
              assert published == outputs(root), (
                  f"the environment roots publish different outputs: {sorted(published ^ outputs(root))}"
              )

          deploy = configuration(".github/workflows/deploy.yml")
          review = configuration(".github/workflows/infra-ci.yml")

          # Assumptions: deploy.yml supplies variables through an auto-loaded tfvars document
          #     rather than TF_VAR_, so its producer set is the key set of that jq object. The
          #     match is anchored on the redirection target so it cannot drift onto another
          #     jq invocation in the same file.
          document = re.search(
              r'jq -n \\(.*?)> "\$root/deployment\.auto\.tfvars\.json"', deploy, re.DOTALL
          )
          assert document is not None, "deploy.yml no longer writes deployment.auto.tfvars.json"
          produced = {
              "deploy.yml": set(re.findall(r"^\s*([a-z_][a-z0-9_]*):", document.group(1), re.M)),
              "infra-ci.yml": set(re.findall(r"TF_VAR_([a-z_][a-z0-9_]*)", review)),
          }

          for workflow, names in produced.items():
              assert names, f"{workflow} produces no Terraform variable at all"
              missing = sorted(required - names)
              assert not missing, (
                  f"{workflow} supplies no value for required variable(s) {missing}; "
                  "terraform plan fails with 'No value for required variable'"
              )
              undeclared = sorted(names - declared)
              assert not undeclared, (
                  f"{workflow} supplies {undeclared}, which no environment root declares; "
                  "Terraform discards an undeclared variable rather than failing"
              )

          # Assumptions: the runbook is held to the same standard as the workflows, because the
          #     manual path is the one a human follows and an undocumented required variable
          #     stops it at `plan` just as surely. This is not documentation polish: the runbook
          #     block was the ONLY place the correct variable vocabulary was written down while
          #     both workflows used a stale one, so keeping it in the comparison is what makes
          #     the three agree rather than making two of them agree with each other.
          runbook = Path("docs/runbooks/deploy.md").read_text()
          exported = set(re.findall(r"export TF_VAR_([a-z_][a-z0-9_]*)=", runbook))
          undocumented = sorted(required - exported)
          assert not undocumented, (
              f"docs/runbooks/deploy.md documents no export for required variable(s) {undocumented}; "
              "an operator following it exactly cannot reach a successful plan"
          )
          stale_prose = sorted(exported - declared)
          assert not stale_prose, (
              f"docs/runbooks/deploy.md exports {stale_prose}, which no environment root declares"
          )

          for workflow in (".github/workflows/deploy.yml", ".github/workflows/infra-ci.yml"):
              read = set(
                  re.findall(
                      r"output\s+(?:-json|-raw)\s+([a-z_][a-z0-9_]*)", configuration(workflow)
                  )
              )
              absent = sorted(read - published)
              assert not absent, (
                  f"{workflow} reads Terraform output(s) {absent} that no environment root "
                  "publishes; the read fails after the apply it follows has already run"
              )
          PY

      # Refactoring Rationale: the immutable baseline contains known sample
      # credentials, so the scanner stages only migration-owned tracked files.
      # This remains a hard gate rather than a repository-wide suppression, and the
      # staged set is defined by SUBTRACTION -- every tracked path except the four
      # reference trees -- so a file at a location nobody anticipated is scanned by
      # default instead of being missed by an allow-list that never named it. That
      # subtraction is what the `paths-ignore` triggers above were inverted to match:
      # the same four trees are excluded in both places, so a path this step would
      # scan can never be a path the trigger declines to start.
      - name: Scan migration-owned source for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p infra-reports secret-scan
          while IFS= read -r -d '' path; do
            case "$path" in
              app/*|tests/*|scripts/*|samples/*) continue ;;
            esac
            mkdir -p "secret-scan/$(dirname "$path")"
            cp "$path" "secret-scan/$path"
          done < <(git ls-files -z)

          # Assumptions: these two exact literals are cryptographic algorithm
          # identifiers, not credentials. The allowlist matches the complete
          # assignment so a real value beside the same field name still fails.
          #
          # WHY the second allowlist exists -- Refactoring Rationale: widening this
          #   workflow's trigger from an infrastructure path allow-list to a
          #   reference-tree paths-ignore made the scan run on essentially every
          #   commit, which is the point of the change. It also made a latent
          #   failure manifest: the default ruleset's generic-api-key rule matches
          #   two fabricated symmetric keys committed as TEST FIXTURES, in test
          #   sources under common-lib, account-service and authorization-service.
          #   Refactoring Rationale: this note used to enumerate the fixture SITES
          #   by class and count them. That enumeration went stale twice -- once as
          #   fixtures were added and once when MessagingIdentityConfigTest was
          #   deleted with the tokeniser chain it covered -- so the exception is
          #   now described by the two literal VALUES it admits, which is what the
          #   allowlist below actually matches and what cannot drift as fixture
          #   sites move. The step runs under `set -euo pipefail`
          #   and gitleaks exits non-zero when it reports anything, so the gate
          #   would have failed on every such fixture every time. A gate that always fails
          #   is strictly worse than no gate: a real leak becomes indistinguishable
          #   from the standing noise, and the usual response is to switch the gate
          #   off. Admitting exactly these two strings restores a gate whose red
          #   means something.
          # WHY match the VALUE and not the field name -- Trade-offs: allowlisting
          #   `signing-key`, `KEY` or `RAW_KEY` by name would admit ANY value ever
          #   assigned to those names, including a production key pasted into a
          #   test. Pinning the two literals instead is the narrowest exception
          #   available: the escape applies to these exact fabricated bytes and to
          #   nothing else, so the same field names still fail on any other value.
          #   Each literal is a visibly non-production pattern -- counting hex and
          #   its reverse -- at exactly the minimum admissible key length, and each
          #   is documented as fabricated at its own declaration site.
          # Assumptions: every fixture using either literal proves the SHAPE of a
          #   signing boundary -- that a token signed with the shared key verifies
          #   and one signed with a different key does not. Because the values are
          #   committed, no test using them asserts anything about the
          #   confidentiality of a deployed key, and none is read by any deployed
          #   profile. `RAW_KEY` is named above and no longer occurs: it was the
          #   constant of the deleted MessagingIdentityConfigTest, and it is kept in
          #   the reasoning because the reasoning is about field NAMES that must stay
          #   unallowlisted whether or not one of them is currently in use.
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'TOML'
          [extend]
          useDefault = true

          [[allowlists]]
          description = "Reviewed Terraform cryptographic algorithm identifiers"
          regexTarget = "line"
          regexes = [
            '''password_encryption"\s*=\s*"scram-sha-256"''',
            '''key_algorithm\s*=\s*"EC_prime256v1"''',
          ]

          [[allowlists]]
          description = "Reviewed fabricated test-fixture signing keys, matched by exact value"
          regexTarget = "line"
          regexes = [
            '''\b0123456789abcdef0123456789abcdef\b''',
            '''\bfedcba9876543210fedcba9876543210\b''',
          ]
          TOML

          gitleaks dir secret-scan --config "$RUNNER_TEMP/gitleaks.toml" \
            --no-banner --redact \
            --report-format sarif --report-path infra-reports/gitleaks.sarif \
            2>&1 | tee infra-reports/gitleaks.log

      # Assumptions: scanner exceptions are architecture contracts rather than
      # blanket suppressions. This guard fails if an exception broadens or loses
      # the condition that made it acceptable before Checkov runs.
      - name: Verify bounded policy-scan exceptions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          """Verify that each bounded Checkov exception retains its control.

          Parameters:
              None.
          Returns:
              None. Successful completion lets the workflow step exit zero.
          Raises:
              AssertionError: If an exception or compensating control is absent.
          """

          from pathlib import Path

          api = Path("infra/modules/api-gateway-http/main.tf").read_text()
          sqs = Path("infra/modules/sqs/main.tf").read_text()
          step = Path("infra/modules/step-functions-batch/main.tf").read_text()
          cognito = Path("infra/modules/cognito/main.tf").read_text()
          observability = Path("infra/modules/observability/main.tf").read_text()
          datasets = Path("infra/modules/s3-datasets/main.tf").read_text()

          assert "#checkov:skip=CKV_AWS_309:" in api
          assert 'resource "aws_apigatewayv2_route" "public"' in api
          assert 'authorization_type = "NONE"' in api
          assert 'for_each = toset(var.public_route_keys)' in api

          assert 'resource "aws_sqs_queue_policy" "tls_only"' in sqs
          assert '"aws:SecureTransport" = "false"' in sqs
          assert 'resource "aws_sqs_queue_redrive_allow_policy" "exact_source"' in sqs
          assert 'redrivePermission = "byQueue"' in sqs

          # Refactoring Rationale: this cluster asserted one combined
          #   ObserveAndStopTasksInApprovedCluster statement carrying
          #   ["ecs:DescribeTasks", "ecs:StopTask"] under a shared ecs:cluster
          #   condition. AWS's service authorization reference lists the task
          #   resource type for StopTask, so the narrowest supported bound for it
          #   is a task ARN rather than a condition; the statement is now split so
          #   each action carries the bound its own service enforces. The
          #   assertions follow the split rather than being relaxed: StopTask must
          #   be scoped to the cluster's task ARN pattern and must NOT reacquire a
          #   condition, and the read and list actions keep the cluster condition.
          assert 'sid       = "StopTasksInApprovedCluster"' in step
          assert 'actions   = ["ecs:StopTask"]' in step
          assert 'resources = [local.cluster_task_arn_pattern]' in step
          assert 'sid       = "DescribeTasksInApprovedCluster"' in step
          assert 'actions   = ["ecs:DescribeTasks"]' in step
          assert 'sid       = "ListTasksInApprovedCluster"' in step
          assert 'actions   = ["ecs:ListTasks"]' in step
          assert 'ObserveAndStopTasksInApprovedCluster' not in step
          assert 'variable = "ecs:cluster"' in step
          assert 'sid       = "TagTasksCreatedByRunTask"' in step
          assert 'variable = "ecs:CreateAction"' in step
          assert 'sid    = "DeliverExecutionLogs"' in step
          assert '"logs:CreateLogDelivery"' in step
          assert step.count('resources = ["*"]') >= 2

          # Assumptions: the two CKV2_AWS_57 exceptions live in this module.
          # One has an API-driven client-secret rotation bridge; the other is a
          # one-time seed credential bounded by temporary-password validity.
          assert cognito.count("checkov:skip=CKV2_AWS_57:") == 2
          assert 'resource "aws_secretsmanager_secret" "app_client"' in cognito
          assert 'resource "terraform_data" "app_client_secret_rotation"' in cognito
          assert "add-user-pool-client-secret" in cognito
          assert 'resource "aws_secretsmanager_secret" "seed_user"' in cognito
          assert 'temporary_password_validity_days = var.temporary_password_validity_days' in cognito

          assert observability.count("checkov:skip=CKV_AWS_145:") == 1
          assert 'sse_algorithm = "AES256"' in observability

          assert datasets.count("checkov:skip=CKV_AWS_145:") == 1
          assert datasets.count("checkov:skip=CKV_AWS_35:") == 1
          assert 'resource "aws_cloudtrail" "dataset_object_access"' in datasets
          assert 'enable_log_file_validation    = true' in datasets

          # Assumptions: the three log-delivery destinations below cannot carry
          # SSE-KMS, because the delivering service would have to be granted use
          # of the key or, for CloudFront and S3 server access logging, cannot
          # write an SSE-KMS destination at all. Each exception is therefore
          # bounded by asserting the AES256 fallback together with the
          # compensating controls that stand in for the customer key: public
          # access blocked and versioning enabled, so a delivered record can be
          # neither read publicly nor deleted without trace.
          alb = Path("infra/modules/alb/main.tf").read_text()
          spa = Path("infra/modules/cloudfront-spa/main.tf").read_text()
          secrets = Path("infra/modules/secrets/main.tf").read_text()

          assert alb.count("checkov:skip=CKV_AWS_145:") == 1
          assert 'sse_algorithm = "AES256"' in alb
          assert 'resource "aws_s3_bucket_versioning" "access_logs"' in alb
          assert 'resource "aws_s3_bucket_public_access_block" "access_logs"' in alb

          assert spa.count("checkov:skip=CKV_AWS_145:") == 1
          assert 'resource "aws_s3_bucket_versioning" "logs"' in spa
          assert 'resource "aws_s3_bucket_public_access_block" "logs"' in spa

          # Assumptions: the rotation-interval exception is a cross-module
          # rendering artifact, not a relaxed control, so it is bounded by
          # asserting that the interval is still driven by the input whose
          # default and both tfvars values sit inside the required window. The
          # two TLS entries hold operator-issued material that no rotation
          # function can mint, so they are bounded by asserting they remain
          # caller-supplied rather than acquiring a schedule.
          assert secrets.count("checkov:skip=CKV_AWS_304:") == 1
          assert 'automatically_after_days = var.rotation_automatically_after_days' in secrets
          assert 'resource "aws_secretsmanager_secret_rotation" "service"' in secrets
          # Refactoring Rationale: two assertions were removed from this cluster because they
          #   asserted a configuration that does not exist and so failed on every run. They
          #   required TWO CKV2_AWS_57 exceptions in the secrets module and a
          #   `count = local.create_service_tls_secrets ? 1 : 0` conditional; the module has
          #   ZERO of the former and no service-TLS secret resources at all. The comment above
          #   still described "the two TLS entries", which were removed from the module without
          #   this gate being updated -- the same drift that left CARDDEMO_SERVER_TLS_* admitted
          #   by infra/modules/ecs-service long after its last reader had gone.
          # Assumptions: the absence is now asserted rather than left unstated, so a
          #   reintroduced service-TLS secret has to come back with its exception and its
          #   conditional together, and cannot arrive as an unbounded entry.
          assert secrets.count("checkov:skip=CKV2_AWS_57:") == 0
          assert "create_service_tls_secrets" not in secrets
          PY

      # Trade-offs: the offline Checkov distribution does not carry policy
      # severities, so `--check HIGH,CRITICAL` selects zero checks and creates a
      # false-green gate. The first scan keeps the complete result set visible;
      # the second hard-fails on an explicit, reviewable material-security
      # baseline spanning IAM, encryption, audit, network, edge, messaging and
      # workload isolation. The summary assertion prevents an empty selection
      # from ever reporting success again.
      - name: Run the Terraform material-security policy gate
        shell: bash
        run: |
          set -euo pipefail

          checkov -d infra --framework terraform --soft-fail \
            --skip-path '\.terraform' --compact --output json \
            2>&1 | tee infra-reports/checkov-all.json

          material_checks=(
            CKV_AWS_1 CKV_AWS_2 CKV_AWS_7 CKV_AWS_17 CKV_AWS_19
            CKV_AWS_20 CKV_AWS_21 CKV_AWS_23 CKV_AWS_24 CKV_AWS_25
            CKV_AWS_26 CKV_AWS_27 CKV_AWS_28 CKV_AWS_33 CKV_AWS_34
            CKV_AWS_35 CKV_AWS_36 CKV_AWS_41 CKV_AWS_45 CKV_AWS_51
            CKV_AWS_53 CKV_AWS_54 CKV_AWS_55 CKV_AWS_56 CKV_AWS_57
            CKV_AWS_60 CKV_AWS_61 CKV_AWS_62 CKV_AWS_63 CKV_AWS_66
            CKV_AWS_72 CKV_AWS_76 CKV_AWS_91 CKV_AWS_93 CKV_AWS_96
            CKV_AWS_97 CKV_AWS_103 CKV_AWS_107 CKV_AWS_108 CKV_AWS_110
            CKV_AWS_119 CKV_AWS_130 CKV_AWS_136 CKV_AWS_145 CKV_AWS_149
            CKV_AWS_158 CKV_AWS_163 CKV_AWS_168 CKV_AWS_174 CKV_AWS_223
            CKV_AWS_227 CKV_AWS_251 CKV_AWS_260 CKV_AWS_274 CKV_AWS_277
            CKV_AWS_283 CKV_AWS_285 CKV_AWS_301 CKV_AWS_304 CKV_AWS_309
            CKV_AWS_324 CKV_AWS_327 CKV_AWS_333 CKV_AWS_336 CKV_AWS_337
            CKV_AWS_358 CKV_AWS_382 CKV_AWS_387 CKV_AWS_393
            CKV2_AWS_6 CKV2_AWS_11 CKV2_AWS_12 CKV2_AWS_20
            CKV2_AWS_32 CKV2_AWS_40 CKV2_AWS_42 CKV2_AWS_46
            CKV2_AWS_54 CKV2_AWS_56 CKV2_AWS_57 CKV2_AWS_64
            CKV2_AWS_65 CKV2_AWS_72
          )
          material_checks_csv="$(IFS=,; echo "${material_checks[*]}")"

          checkov -d infra --framework terraform --check "$material_checks_csv" \
            --skip-path '\.terraform' --compact --output json \
            2>&1 | tee infra-reports/checkov.json

          python - <<'PY'
          """Assert the policy scan actually scanned something and found nothing material.

          Parameters:
              None. The report path is the file the scanner was just told to write.
          Returns:
              None. Successful completion lets the workflow step exit zero.
          Raises:
              AssertionError: If the scan evaluated no resources, passed no checks, failed
                  any check, or hit a parsing error. The first two are the reason this
                  module exists: a scanner invocation that matched nothing exits zero, so
                  without them a mistyped path would read as a clean infrastructure.
              KeyError: If the report carries no summary, which means the scanner changed
                  its output shape rather than that the infrastructure is clean.
              json.JSONDecodeError: If the scanner wrote something that is not JSON.
          """

          import json
          from pathlib import Path

          report = json.loads(Path("infra-reports/checkov.json").read_text())
          summary = report["summary"]
          assert summary["resource_count"] > 0, summary
          assert summary["passed"] > 0, summary
          assert summary["failed"] == 0, summary
          assert summary["parsing_errors"] == 0, summary
          PY

      # Assumptions: advanced from upload-artifact v4.4.3 with every other pin in
      # this workflow family, for the reason measured once in services-ci.yml.
      - name: Upload infrastructure security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carddemo-infra-reports
          path: infra-reports/**
          if-no-files-found: error

  terraform-plan:
    name: Produce a real plan for the selected environment
    needs: terraform-static
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_plan }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      # Assumptions: this scope mints a per-run OIDC token that STS exchanges for
      # short-lived credentials, eliminating any stored cloud access key.
      id-token: write

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.CARDDEMO_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.CARDDEMO_AWS_REGION }}
          role-session-name: carddemo-infra-plan
          mask-aws-account-id: true

      - name: Install checksum-pinned Terraform
        shell: bash
        run: |
          set -euo pipefail
          version="1.15.8"
          archive="terraform_${version}_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://releases.hashicorp.com/terraform/${version}/${archive}"
          printf '%s  %s\n' "d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d" "$RUNNER_TEMP/$archive" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/terraform-bin"
          echo "$RUNNER_TEMP/terraform-bin" >> "$GITHUB_PATH"

      # Assumptions: environment tfvars contains sizing/retention only. Resource
      # identifiers arrive from protected GitHub environment variables and the
      # current deployed image-digest map, never from a committed credential.
      - name: Initialize remote state and create the plan
        shell: bash
        env:
          TF_STATE_BUCKET: ${{ vars.CARDDEMO_TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.CARDDEMO_TF_STATE_REGION }}
          TF_STATE_LOCK_TABLE: ${{ vars.CARDDEMO_TF_STATE_LOCK_TABLE }}
          TF_STATE_KMS_KEY_ID: ${{ vars.CARDDEMO_TF_STATE_KMS_KEY_ID }}
          # Refactoring Rationale: this block supplied NINE names of which six --
          # release_version, route53_zone_id, spa_domain_name, alb_tls_server_name,
          # service_tls_domain_name and batch_glue_function_arns -- are declared by neither
          # root. An undeclared TF_VAR_ is discarded in SILENCE: Terraform does not even
          # warn, so those six looked wired and set nothing. At the same time SEVEN declared
          # no-default variables had no producer here, and each of those is a hard
          # "No value for required variable" -- so the plan step below could not have
          # succeeded on any run. The set is now exactly the ten declared no-default
          # variables, and the closure check in this same workflow compares it against
          # variables.tf in both directions so the divergence cannot recur unnoticed.
          TF_VAR_permissions_boundary_arn: ${{ vars.CARDDEMO_PERMISSIONS_BOUNDARY_ARN }}
          TF_VAR_mask_hmac_secret_arn: ${{ vars.CARDDEMO_MASK_HMAC_SECRET_ARN }}
          TF_VAR_mask_hmac_secret_kms_key_arn: ${{ vars.CARDDEMO_MASK_HMAC_SECRET_KMS_KEY_ARN }}
          TF_VAR_alb_certificate_arn: ${{ vars.CARDDEMO_ALB_CERTIFICATE_ARN }}
          TF_VAR_internal_service_domain_name: ${{ vars.CARDDEMO_INTERNAL_SERVICE_DOMAIN_NAME }}
          TF_VAR_cloudfront_acm_certificate_arn: ${{ vars.CARDDEMO_CLOUDFRONT_ACM_CERTIFICATE_ARN }}
          # Assumptions: a list-typed variable is supplied to Terraform as JSON, which is
          # valid HCL for a list, so the _JSON-suffixed environment variables carry a
          # document such as ["app.example.com"] rather than a delimited string.
          # cloudfront_aliases additionally validates length > 0, so an unset environment
          # variable fails the plan rather than planning a distribution with no alias.
          TF_VAR_cloudfront_aliases: ${{ vars.CARDDEMO_CLOUDFRONT_ALIASES_JSON }}
          # Assumptions: both roots declare alarm_email_endpoints with NO default and refuse
          # an empty list, so a plan cannot be produced without a recipient. It is supplied
          # from a protected repository variable rather than from terraform.tfvars because an
          # on-call address is personal data this tree does not carry.
          TF_VAR_alarm_email_endpoints: ${{ vars.CARDDEMO_ALARM_EMAIL_ENDPOINTS_JSON }}
          TF_VAR_github_oidc_provider_arn: ${{ vars.CARDDEMO_GITHUB_OIDC_PROVIDER_ARN }}
          # Trade-offs: taken from the run context rather than from a protected environment
          # variable, for the same reason deploy.yml does so -- the contract is the
          # owner/name of the repository whose environment may assume the publication role,
          # and that is this repository, so the context value cannot disagree with reality.
          TF_VAR_github_repository: ${{ github.repository }}
          # Assumptions: the review plan uses the commit under review as the image tag. It
          # never pushes an image, so the tag only has to satisfy the variable's format
          # rule; using the SHA keeps the planned task definitions attributable to the
          # commit that produced the plan.
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_image_digests: ${{ vars.CARDDEMO_IMAGE_DIGESTS_JSON }}
          # Trade-offs: an EMPTY list rather than a protected environment variable. The API
          # endpoint does not exist until an apply creates it, and deploy.yml supplies the
          # same empty list on its first pass before narrowing it afterwards, so a review
          # plan has nothing truer available. The variable's own validation accepts an empty
          # list -- its alltrue() is vacuously true -- and empty is the fail-closed value,
          # yielding connect-src 'self'. This plan is never applied, so the narrow policy
          # it shows is never served.
          TF_VAR_cloudfront_api_connect_src_origins: "[]"
        run: |
          set -euo pipefail
          root="infra/envs/${{ inputs.environment }}"
          mkdir -p infra-reports
          # WHY : Assumptions: rebuilt in THIS job rather than carried from the static job
          #   as an artifact. The archives are deterministic, so rebuilding costs a second
          #   and removes an artifact whose staleness could not be detected; a carried
          #   archive from a different commit would plan a function this commit does not
          #   contain, and the hash would look perfectly valid.
          python3 infra/lambda/build_packages.py
          terraform -chdir="$root" init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE" \
            -backend-config="kms_key_id=$TF_STATE_KMS_KEY_ID"
          # WHY : Assumptions: the saved plan is named "<env>.tfplan" rather than a
          #   bare "tfplan" because a saved plan embeds every resolved attribute the
          #   apply would set, including the generated Aurora master password and the
          #   Cognito seed-user passwords, and the repository ignore rules match on the
          #   ".tfplan" SUFFIX. A bare "tfplan" has no suffix to match, so it stays
          #   trackable, and this runner shares the naming convention with
          #   infra/README.md and infra/bootstrap/README.md so an operator reproducing
          #   this step locally writes a name that "git check-ignore" already covers.
          #   Trade-offs: the runner is ephemeral and never commits, so the risk here is
          #   lower than on a workstation; the convention is kept identical anyway,
          #   because a divergent example in CI is what a reader copies.
          plan_file="${{ inputs.environment }}.tfplan"
          terraform -chdir="$root" plan -input=false \
            -var-file=terraform.tfvars -out="$plan_file"
          terraform -chdir="$root" show -no-color "$plan_file" > "$GITHUB_WORKSPACE/infra-reports/${{ inputs.environment }}-plan.txt"

      # Assumptions: the same advanced upload-artifact pin as the static job above,
      # and the same reason. A plan is audit evidence, so the digest checks the
      # newer artifact line enforces on retrieval matter here specifically.
      - name: Upload the environment plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carddemo-infra-plan-${{ inputs.environment }}
          path: infra-reports/${{ inputs.environment }}-plan.txt
          if-no-files-found: error
