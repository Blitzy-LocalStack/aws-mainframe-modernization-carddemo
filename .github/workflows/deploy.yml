# =============================================================================
# .github/workflows/deploy.yml
# -----------------------------------------------------------------------------
# Purpose:
#   Uses short-lived OIDC credentials to provision the selected environment's
#   ECR repositories, build and push the ten immutable images this repository
#   builds, mirror the one pinned third-party telemetry image it does not, apply
#   the reviewed complete Terraform plan, and publish the SPA bundle. It never
#   tears down an environment, never applies infra/bootstrap, never runs a test
#   suite -- the three checking workflows own that and this one ships what they
#   passed -- and never performs blue-green or canary traffic shifting. Roll-forward
#   is a rolling ECS service deployment carrying an updated image tag; teardown is
#   an operator action in docs/runbooks/teardown.md, taken in the reverse order with
#   bootstrap last.
#   Assumptions: ten built plus one mirrored is eleven repositories and ten
#   Dockerfiles, and the asymmetry is deliberate -- infra/modules/ecr asserts the
#   ten deployables as an exact set and holds the mirror in a separate input, so
#   the count the frozen plan fixes stays assertable while the cached sidecar
#   image stays visible. That eleventh repository EXCEEDS the ten AAP section
#   0.4.1.6 fixes and is a ratified deviation rather than an accident: the
#   approval, the alternatives refused and the recurring cost are recorded in
#   docs/adr/ADR-002-compute-platform.md, and every step below that iterates the
#   registry -- the push loop, the mirror and the vulnerability gate -- treats the
#   two kinds of repository by their own tag convention rather than as one set.
#
# Parameters:
#   workflow_dispatch.environment (choice, dev|prod, default dev) selects which
#   environment root is initialised, planned and applied, and is also the
#   concurrency key so the two never serialise against each other.
#   workflow_dispatch.image_tag (string, default "" meaning the commit SHA)
#   overrides the immutable artifact identity every pushed image is tagged with.
# Return values:
#   GATING -- the OIDC role assumption, the checksum-verified Terraform install,
#   init, the targeted registry plan and apply, the SPA bundle build, every docker
#   build, tag and push, the image vulnerability gate, the complete plan and the
#   apply of that saved plan, the content-security narrowing plan and apply, the
#   SPA publication and invalidation, the prod environment's approval gate, and the
#   audit upload's if-no-files-found: error. ADVISORY -- the version displays in
#   the Terraform install step, and nothing else. Produced artifacts: the pushed
#   image digests, the rendered plans, and the carddemo-deploy-audit-<env> record.
# Exceptions or errors:
#   Any GATING step failing fails the run at that point, leaving a partial
#   environment that the next run converges rather than repairs, because Terraform
#   is declarative and the saved-plan path re-derives the difference from the state
#   the failed run actually reached. A partial infrastructure operation remains
#   protected by the remote state lock and is never cancelled in progress; the
#   timeout ceiling exists so a wedged apply releases that lock. Production
#   additionally waits on its GitHub environment approval policy. The audit upload
#   and the removal of runner-local material both run under if: always(), so
#   evidence survives a failure and generated inputs do not survive the runner.
#
# WHY (non-obvious design decisions):
#   - Refactoring Rationale: CBADMCDJ.jcl:38 told an operator to uncomment the
#     CBADMCDJ.jcl:42 DELETE GROUP(CARDDEMO) before rerunning, so the baseline
#     deployment was not idempotent and its rerun path was manually destructive;
#     saved Terraform plans converge idempotently under one state lock instead.
#   - Refactoring Rationale: that same deck had drifted from the system it
#     installed -- MAPSET(COSGN00M) is defined twice at CBADMCDJ.jcl:50 and :53,
#     and CBADMCDJ.jcl:148-157 name PROGRAM(COADM00C) and COTSTP1C-COTSTP4C, none
#     of which exists in app/cbl -- which is what an imperative, hand-maintained
#     deck does over time. A plan rendered and reviewed before it is applied is the
#     control that surfaces exactly that drift, which is why nothing here applies
#     without a saved plan.
#   - Trade-offs: deployments queue per environment rather than cancelling,
#     preventing an interrupted state mutation from becoming a second incident.
#   - Alternatives Considered: stored cloud access keys. Rejected because OIDC
#     sessions are short-lived and bound to this repository and run.
#   - Assumptions: infra/bootstrap has already been applied once for this account.
#     It provisions the state bucket and lock table that infra/envs/*/backend.tf
#     names, so it must exist before the init below can run at all -- applying it
#     from here would depend on the backend it is the thing that creates. It is
#     deliberately outside this workflow; docs/runbooks/deploy.md owns it.
# =============================================================================

name: CardDemo Deploy

# Assumptions: deployment is an explicit operator action. pull_request is absent
# so untrusted fork code can never request the account-mutating OIDC role.
on:
  workflow_dispatch:
    inputs:
      # Assumptions: this input exists because the two environments are one
      # topology parameterised by sizing and retention, so the target is a choice
      # made at dispatch rather than a second workflow file. A `choice` rather than
      # a free-text string is what makes an unreachable value impossible: the
      # selection is interpolated into `infra/envs/<value>` and into the
      # concurrency group, and a typo in a free-text form would either init a
      # directory that does not exist or -- worse -- serialise against the wrong
      # environment's lock. Trade-offs: it defaults to dev rather than having no
      # default, so a dispatch submitted without reading the form targets the
      # disposable environment; defaulting to prod would make the most consequential
      # target the one reached by doing nothing.
      environment:
        description: "Environment to deploy; the prod GitHub environment must require approval."
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      # Assumptions: blank is the normal case and the default identity is the
      # commit SHA, which is the CBADMCDJ.jcl:166 version-stamp analogue -- that
      # deck recorded `Ver: CardDemo_v1.0-70-g193b394-123` inside the artifact it
      # installed, and the tag plays the same role here.
      # Alternatives Considered: tagging the images `latest` and letting the task
      # definitions pull that. Rejected because a mutable tag makes a task
      # definition non-reproducible -- two tasks launched from one revision can
      # receive different bytes -- and it removes the only cheap rollback this
      # design has, which is to re-apply naming a tag that is known to have worked.
      # The registry enforces the same conclusion independently:
      # infra/modules/ecr sets image_tag_mutability to IMMUTABLE, so a re-push of
      # an existing tag is refused rather than silently rebound.
      # Trade-offs: the override is retained for the case a reviewed release has to
      # be re-deployed from a later commit of this workflow, and it is validated
      # against the registry's tag grammar below rather than trusted, so a value
      # that could not name an image fails before the first build.
      image_tag:
        description: "Immutable image tag override; blank uses the reviewed commit SHA."
        required: false
        type: string
        default: ""

# Assumptions: this top-level block is a read-only FLOOR for the file rather than
# the grant the deployment runs under. With no `permissions:` key at all every job
# would inherit the repository default token, which on many repositories still
# carries write scopes; declaring `contents: read` here means a job added later
# starts read-only and has to widen its own scope deliberately, in the job that
# performs the write. Trade-offs: the deploy job below restates its own scope
# instead of leaning on this default, which is redundant on the page and is kept
# that way because the scope a token actually carries should be readable at the
# job that runs the code rather than inferred from a key sixty lines above it.
permissions:
  contents: read

# Refactoring Rationale: the mainframe deployment utility took exclusive
# CSD(READWRITE) access. The DynamoDB state lock is the cloud equivalent, so a
# running deployment is allowed to finish and later requests queue by environment.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Alternatives Considered: splitting this into a `build-and-push` job and a
  # `deploy` job joined by `needs:`, which is the shape the three checking
  # workflows use and which would let the pushes fan out across runners. Rejected
  # because every stage here consumes runner-local state the previous stage
  # produced and a job boundary is a machine boundary: the resolved image-digest
  # map is merged into $root/deployment.auto.tfvars.json that the apply reads, the
  # SPA bundle in ui/dist is published by a later step, and deploy-reports/
  # accumulates the audit record across all of them. A two-job split would have to
  # carry all three between jobs as artifacts, which adds an upload/download round
  # trip per stage and -- for the tfvars document and the saved plan -- would place
  # planned values that can embed generated credentials into artifact storage,
  # where they outlive the runner. Ordering is therefore enforced by step sequence
  # rather than by `needs:`, and the ordering that matters is the same one either
  # shape would express: every image is pushed and scanned BEFORE the apply, so no
  # task definition can name a tag that failed to build or that carries a blocking
  # finding.
  deploy:
    name: Build artifacts and deploy ${{ inputs.environment }}
    # Trade-offs: the runner image is pinned rather than allowed to drift with
    # `ubuntu-latest`, because three things this job depends on come from the image
    # rather than from a step that pins them: the Docker daemon that builds all ten
    # images, the AWS CLI that reads the registry and the Terraform outputs, and the
    # `python3` that builds the operational Lambda packages before init. A silent
    # image bump could move any of them underneath a deployment with no commit to
    # attribute the change to, and this is the one workflow whose failures land
    # against a live account rather than against a pull request.
    runs-on: ubuntu-24.04
    # Assumptions: a bounded ceiling, not a budget. CBADMCDJ.jcl:2 bounded the
    # baseline deployment the same way with `TIME=1440`, so a ceiling here
    # preserves a property the mainframe job already had rather than inventing one.
    # The specific hazard it answers is this workflow's own: a wedged apply holds
    # the DynamoDB state lock for as long as the job lives, and an unbounded job
    # would hold it indefinitely, blocking every later deployment until an operator
    # force-unlocks the state. Trade-offs: the figure is deliberately generous
    # rather than fitted to the work, because a ceiling tight enough to cut a
    # legitimately slow run would fail deployments for the wrong reason -- and this
    # job cannot be safely cancelled mid-apply, which is the same reason
    # cancel-in-progress is false above.
    timeout-minutes: 180
    # Assumptions: the asymmetry between the two environments lives in the GitHub
    # environment's own protection rules rather than in this file, which is what
    # lets one job body serve both. dev is disposable and sized to minimum capacity
    # -- its Aurora configuration is permitted to scale to zero -- so an unreviewed
    # apply there is cheap and recoverable; prod carries deletion protection and
    # final-snapshot flags, where the control that matters is a human deciding
    # whether the reviewed plan should run at all. CBADMCDJ.jcl:2's
    # `NOTIFY=&SYSUID` is the baseline analogue and the weaker one: it told an
    # operator after the fact, whereas a required reviewer on the prod environment
    # blocks until someone answers. Trade-offs: the approval requirement is
    # therefore NOT assertable from this repository -- a prod environment
    # configured without a required reviewer would apply unattended -- so the
    # obligation is stated in the input description above and in
    # docs/runbooks/deploy.md, where the environment is configured.
    environment: ${{ inputs.environment }}
    permissions:
      # Assumptions: `contents: read` is what actions/checkout needs to fetch the
      # reviewed revision, and reading is all this job does to the repository --
      # every artifact it produces is written to the registry, to S3 or to the
      # runner, and nothing is committed back. Trade-offs: `checks: write` and
      # `pull-requests: write` are both absent, unlike the three checking
      # workflows, because this workflow publishes no JUnit report and comments on
      # no pull request; `packages: write` is absent because images go to the
      # account's own registry rather than to GitHub Packages; and `actions: write`
      # is absent because nothing here re-dispatches a workflow. A job's token is
      # reachable from every step in the job, not from the step that uses it
      # onward, so each scope withheld is one a compromised action or dependency in
      # any step cannot reach.
      contents: read
      # Assumptions: id-token is the sole mechanism that lets the official AWS
      # action exchange a signed per-run token for temporary role credentials.
      # Alternatives Considered: a long-lived IAM user access key held as a
      # repository secret, which is the arrangement this scope exists to make
      # unnecessary. Rejected because such a key never expires, cannot be scoped to
      # one run, and grants standing account access to anyone who reads it once,
      # whereas the token minted under this scope is signed per run, carries this
      # repository and ref as claims the role's trust policy checks, and trades for
      # a session that expires on its own. This is why no AWS access-key identifier
      # or secret appears anywhere in this file.
      id-token: write

    steps:
      # Assumptions: this pin, and every other action reference in this file, names
      # an immutable 40-character commit SHA rather than a movable tag such as `@v4`
      # (CWE-1357, reliance on an uncontrolled component). A tag is a mutable
      # pointer its owner can repoint -- by a deliberate tag move, a lapse in the
      # action repository's branch protection, or a maintainer-account takeover, of
      # which the tj-actions/changed-files compromise is the worked precedent --
      # and whatever it then points at executes inside this job with this job's
      # token. A SHA is content-addressed and cannot be moved. The reason this
      # matters MORE here than in the three checking workflows is the scope
      # granted immediately above: those jobs hold a read-only token, whereas this
      # one holds `id-token: write` and therefore a path to the deployment role, so
      # a substituted action here reaches the AWS account rather than a pull
      # request. Trade-offs: a SHA is unreadable, which is why each pin carries a
      # `# vX.Y.Z` trailer -- it keeps the version legible and lets Dependabot or
      # Renovate propose the bump as a reviewable commit. Assumptions: a pin is
      # adopted only when its full SHA is authoritatively verifiable; a version
      # whose SHA could not be confirmed is not guessed at, and the three pins
      # below record the measurement behind each of their versions.
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Assumptions: Node is required to produce ui/dist for S3 publication.
      # npm's cache is scoped by the reviewed lock rather than by a mutable branch.
      # Refactoring Rationale: advanced from setup-node v4.4.0, whose bundle carried
      # the vulnerable `form-data` 2.5.1 and 4.0.0 through `@actions/cache`. The
      # measurement is recorded at the same pin in ui-ci.yml and the runner
      # requirement once in services-ci.yml. This workflow is the one that PUBLISHES
      # artifacts to an account, so a compromised bundle here reaches further than
      # in either checking workflow -- which is why the pin moves here first rather
      # than last.
      # Refactoring Rationale: the Node version this action installs advanced from
      # 22.23.1 to 22.23.2 in the same change, tracking the UI image's build-stage
      # pin and ui/package.json's engines floor so this workflow cannot publish a
      # bundle built by a toolchain the checking workflow never ran. 22.23.2 is the
      # first 22.x release carrying the three HIGH fixes from Node's 29 July 2026
      # release -- CVE-2026-56846, CVE-2026-56848 and CVE-2026-58043 -- which are
      # enumerated once at the same pin in ui-ci.yml rather than repeated here.
      - name: Configure the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Assumptions: this full-SHA official action receives the OIDC token and
      # no stored access key. Account-id masking prevents identity metadata from
      # being copied from logs into unrelated diagnostics.
      - name: Configure short-lived AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.CARDDEMO_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.CARDDEMO_AWS_REGION }}
          role-session-name: carddemo-deploy-${{ inputs.environment }}
          mask-aws-account-id: true

      # Assumptions: Terraform 1.15.8 is the reviewed CLI, and a literal digest
      # protects the direct download without an action wrapper that rewrites exits.
      - name: Install checksum-pinned Terraform
        shell: bash
        run: |
          set -euo pipefail
          version="1.15.8"
          archive="terraform_${version}_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://releases.hashicorp.com/terraform/${version}/${archive}"
          printf '%s  %s\n' "d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d" "$RUNNER_TEMP/$archive" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/terraform-bin"
          echo "$RUNNER_TEMP/terraform-bin" >> "$GITHUB_PATH"
          terraform version
          aws --version
          docker --version

      # Assumptions: the tracked tfvars carries sizing and retention only.
      # Account-specific identifiers are injected from the protected GitHub
      # environment into an untracked auto-tfvars file that is deleted at the end.
      - name: Materialize non-secret deployment inputs
        shell: bash
        env:
          # Refactoring Rationale: this block named SEVEN values, and six of them --
          # ROUTE53_ZONE_ID, SPA_DOMAIN_NAME, ALB_TLS_SERVER_NAME,
          # SERVICE_TLS_DOMAIN_NAME, BATCH_GLUE_FUNCTION_ARNS and a release_version --
          # were written into the auto-tfvars file under names that infra/envs/*/variables.tf
          # does not declare. Terraform WARNS on an undeclared variable in a tfvars file
          # and then ignores it, so those six were dead plumbing wired to protected
          # environment variables that no configuration read. Meanwhile SEVEN variables
          # that ARE declared with no default had no producer here at all, and a required
          # variable with no value is a hard "No value for required variable" at plan.
          # The set below is now exactly the declared no-default variables this workflow
          # is responsible for, and infra-ci.yml carries a static check that keeps the two
          # in step.
          PERMISSIONS_BOUNDARY_ARN: ${{ vars.CARDDEMO_PERMISSIONS_BOUNDARY_ARN }}
          MASK_HMAC_SECRET_ARN: ${{ vars.CARDDEMO_MASK_HMAC_SECRET_ARN }}
          # Assumptions: a repository VARIABLE rather than a secret, matching the ARN it
          # accompanies. A key ARN identifies material without disclosing it, and holding it
          # as a variable is what lets the plan artifact name the key a reviewer can check.
          MASK_HMAC_SECRET_KMS_KEY_ARN: ${{ vars.CARDDEMO_MASK_HMAC_SECRET_KMS_KEY_ARN }}
          ALB_CERTIFICATE_ARN: ${{ vars.CARDDEMO_ALB_CERTIFICATE_ARN }}
          INTERNAL_SERVICE_DOMAIN_NAME: ${{ vars.CARDDEMO_INTERNAL_SERVICE_DOMAIN_NAME }}
          CLOUDFRONT_ACM_CERTIFICATE_ARN: ${{ vars.CARDDEMO_CLOUDFRONT_ACM_CERTIFICATE_ARN }}
          # Assumptions: a list-typed variable arrives as a JSON document in one
          # environment variable rather than as a delimited string, matching the _JSON
          # suffix convention already used for the image-digest map. jq --argjson parses it,
          # so a malformed value fails this step instead of reaching Terraform as a string
          # where a list is required.
          CLOUDFRONT_ALIASES: ${{ vars.CARDDEMO_CLOUDFRONT_ALIASES_JSON }}
          # Assumptions: the alarm recipients arrive as a JSON list for the same reason
          # CLOUDFRONT_ALIASES does, and they arrive from a protected environment variable
          # rather than from this repository because an on-call address is personal data the
          # tree does not carry. Both roots declare alarm_email_endpoints with NO default and
          # refuse an empty list, so a deployment that omits this stops at plan rather than
          # provisioning thirteen alarms whose only action is a topic nobody is subscribed to.
          ALARM_EMAIL_ENDPOINTS: ${{ vars.CARDDEMO_ALARM_EMAIL_ENDPOINTS_JSON }}
          # Assumptions: the OIDC provider is created once per account by infra/bootstrap,
          # which is deliberately outside this workflow, so its ARN is an input here rather
          # than something this run can discover.
          GITHUB_OIDC_PROVIDER_ARN: ${{ vars.CARDDEMO_GITHUB_OIDC_PROVIDER_ARN }}
          # Trade-offs: github_repository comes from the run context rather than from a
          # protected environment variable. The variable's contract is the owner/name of the
          # repository whose environment may assume the SPA publication role, and that IS
          # this repository -- so reading it from the context makes the two impossible to
          # disagree, whereas an operator-set value could name a different repository and
          # would grant the role to it.
          GITHUB_REPOSITORY_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          root="infra/envs/${{ inputs.environment }}"
          mkdir -p deploy-reports
          tag="${{ inputs.image_tag }}"
          if [ -z "$tag" ]; then tag="$GITHUB_SHA"; fi
          printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          echo "CARDDEMO_IMAGE_TAG=$tag" >> "$GITHUB_ENV"

          placeholder="$(printf '0%.0s' {1..64})"
          digests='{}'
          for name in auth-service account-service card-service transaction-service reference-service batch-service authorization-service reporting-service data-migration; do
            digests="$(jq --arg name "$name" --arg digest "sha256:$placeholder" '. + {($name): $digest}' <<<"$digests")"
          done
          # Assumptions: every key below is a variable infra/envs/*/variables.tf DECLARES.
          # An undeclared key here is not an error Terraform stops on -- it warns and
          # ignores the value -- so a stale name looks exactly like a working one until
          # something downstream is unexpectedly unconfigured. The closure check in
          # infra-ci.yml compares this object against the declared no-default set in both
          # directions so neither drift can recur silently.
          jq -n \
            --arg boundary "$PERMISSIONS_BOUNDARY_ARN" \
            --arg mask "$MASK_HMAC_SECRET_ARN" \
            --arg maskkey "$MASK_HMAC_SECRET_KMS_KEY_ARN" \
            --arg albcert "$ALB_CERTIFICATE_ARN" \
            --arg internaldns "$INTERNAL_SERVICE_DOMAIN_NAME" \
            --arg cfcert "$CLOUDFRONT_ACM_CERTIFICATE_ARN" \
            --arg oidc "$GITHUB_OIDC_PROVIDER_ARN" \
            --arg repository "$GITHUB_REPOSITORY_SLUG" \
            --arg tag "$tag" \
            --argjson aliases "$CLOUDFRONT_ALIASES" \
            --argjson alarms "$ALARM_EMAIL_ENDPOINTS" \
            --argjson digests "$digests" \
            '{
              cloudfront_api_connect_src_origins: [],
              permissions_boundary_arn: $boundary,
              mask_hmac_secret_arn: $mask,
              mask_hmac_secret_kms_key_arn: $maskkey,
              alb_certificate_arn: $albcert,
              internal_service_domain_name: $internaldns,
              cloudfront_acm_certificate_arn: $cfcert,
              cloudfront_aliases: $aliases,
              alarm_email_endpoints: $alarms,
              github_oidc_provider_arn: $oidc,
              github_repository: $repository,
              image_tag: $tag,
              image_digests: $digests
            }' > "$root/deployment.auto.tfvars.json"
          printf 'environment=%s\nimage_tag=%s\n' "${{ inputs.environment }}" "$tag" > deploy-reports/deployment.txt

          # WHY : Assumptions: cloudfront_api_connect_src_origins is written as an EMPTY list here and
          #       narrowed to the real origin after the apply, because the origin does not exist yet.
          #       The variable is required and non-nullable by design -- a content-security control
          #       that a root could omit silently would not be a control -- so a value has to be
          #       supplied on this pass, and the empty list is the fail-closed one: it yields
          #       `connect-src 'self'`, which permits no cross-origin call at all. The SPA is not
          #       published until the narrowing step has run, so no visitor ever meets the empty
          #       policy. Alternatives Considered: allowing a wildcard such as
          #       https://*.execute-api.<region>.amazonaws.com on the first pass, which would remove
          #       the second pass entirely. Rejected because the variable's own validation forbids a
          #       wildcard, and for a good reason: it would admit every API Gateway endpoint in the
          #       partition rather than this deployment's one.

      # Assumptions: infra/bootstrap already exists once per account and is
      # deliberately excluded. The selected root uses that real backend so the
      # registry bootstrap and full deployment share one locked state.
      - name: Initialize the selected environment
        shell: bash
        env:
          TF_STATE_BUCKET: ${{ vars.CARDDEMO_TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.CARDDEMO_TF_STATE_REGION }}
          TF_STATE_LOCK_TABLE: ${{ vars.CARDDEMO_TF_STATE_LOCK_TABLE }}
          TF_STATE_KMS_KEY_ID: ${{ vars.CARDDEMO_TF_STATE_KMS_KEY_ID }}
        run: |
          set -euo pipefail
          root="infra/envs/${{ inputs.environment }}"
          # WHY : Assumptions: the operational Lambda packages are built here, before init,
          #   because both plan and apply evaluate `filebase64sha256` over them. They are
          #   deterministic and gitignored rather than committed, so every pipeline that
          #   plans builds them; see infra/lambda/build_packages.py for why the provider
          #   that used to do this was removed.
          python3 infra/lambda/build_packages.py
          # WHY : Assumptions: -lockfile=readonly holds the run to the provider
          #   checksums in the tracked .terraform.lock.hcl. Without it a provider
          #   whose recorded hash no longer matches what the registry serves is not
          #   an error -- init REWRITES the lock and continues, so a deployment
          #   would proceed on unreviewed provider bytes and the only evidence
          #   would be a modified file on a runner that is then discarded. Readonly
          #   turns that into a failed init instead. Trade-offs: advancing a
          #   provider now requires a committed lock update, which is the intended
          #   cost -- the lock is a reviewed artifact in this repository, and
          #   infra-ci.yml plans against the same 19 locks.
          # WHY : Assumptions: the backend is ENABLED here, unlike infra-ci.yml's
          #   static path which inits with -backend=false. The two differ because
          #   they answer different questions: that workflow must validate on a
          #   fork pull request where no credential exists, whereas this one holds
          #   credentials by design and needs the real remote state to plan against
          #   what is actually deployed.
          terraform -chdir="$root" init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE" \
            -backend-config="kms_key_id=$TF_STATE_KMS_KEY_ID"

      # Alternatives Considered: creating repositories with ad-hoc CLI calls.
      # Rejected because Terraform would then discover unmanaged resources on the
      # full plan. A saved targeted plan establishes the artifact registry under
      # the same state before any image is pushed.
      - name: Provision the Terraform-managed artifact registry
        shell: bash
        run: |
          set -euo pipefail
          root="infra/envs/${{ inputs.environment }}"
          terraform -chdir="$root" plan -input=false -var-file=terraform.tfvars \
            -target=module.ecr -out=ecr.tfplan
          # WHY : Assumptions: this targeted plan is rendered into the audit record
          #   for the same reason the complete plan and the content-security
          #   narrowing are. It is the step that creates the repositories every
          #   later push writes to, so an operator reconstructing what a
          #   deployment did needs it as much as the others -- and leaving one of
          #   the three applies unrendered would make the audit artifact a partial
          #   account of the run rather than a complete one. CBADMCDJ.jcl:159
          #   echoed the whole installed group with LIST GROUP(CARDDEMO) rather
          #   than a chosen part of it, and this keeps that property.
          terraform -chdir="$root" show -no-color ecr.tfplan \
            > deploy-reports/terraform-plan-registry.txt
          terraform -chdir="$root" apply -input=false ecr.tfplan
          # Refactoring Rationale: this read named an output that does not exist. The roots
          # publish ONE aggregate per module -- "registry" is the whole ecr module -- so the
          # map of logical artifact name to registry address is registry.repository_urls, not a
          # top-level ecr_repository_urls. A read of an absent output fails the step with
          # "Output \"ecr_repository_urls\" not found", after the targeted apply has already run.
          # The jq projection keeps the file shape the next step expects: a flat name-to-URL map.
          terraform -chdir="$root" output -json registry \
            | jq -e '.repository_urls' > deploy-reports/ecr-repositories.json

      # Alternatives Considered: npm install. npm ci is bound to the reviewed
      # lock and cannot silently rewrite the dependency graph.
      - name: Build the SPA bundle for S3 publication
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      # Trade-offs: CI repeats image builds already validated by services-ci and
      # ui-ci. The deployment rebuild is the artifact that actually ships, while
      # the review-time build proves Dockerfiles before account credentials exist.
      - name: Build and push ten immutable images
        shell: bash
        run: |
          set -euo pipefail
          repos="$(cat deploy-reports/ecr-repositories.json)"
          registry="$(jq -r 'to_entries[0].value | split("/")[0]' <<<"$repos")"
          # WHY : Assumptions: the token is handed to docker on STDIN rather than as
          #   `--password "$(aws ecr get-login-password ...)"`. A credential passed
          #   as an argument is visible in /proc/<pid>/cmdline for the life of the
          #   process, so any other process on the runner -- including one started
          #   by a dependency's install script during the builds below -- can read
          #   it, and it would additionally be recoverable from the shell's history
          #   in an interactive reproduction of this step. Piping keeps it in a file
          #   descriptor that only docker holds. docker itself warns on the
          #   argument form for this reason.
          aws ecr get-login-password --region "${{ vars.CARDDEMO_AWS_REGION }}" |
            docker login --username AWS --password-stdin "$registry"

          # WHY : Refactoring Rationale: the third column is the build CONTEXT, and for
          #       the eight service rows it read `services` and had to become `.`. Every
          #       service Dockerfile is written against the repository root -- it copies
          #       services/<name>/pom.xml and the unpublished services/common-lib source,
          #       config/checkstyle for its inherited documentation gate, and
          #       config/docker for the shared entry point and the database trust-anchor
          #       installer -- so with `services` as the context none of config/ is inside
          #       the context at all and the build fails at the first COPY of it, with
          #       "/config/docker/generate-listener-material.sh: not found". Measured by
          #       running that exact build. This step is the one that produces the
          #       artifacts that ship, so the divergence meant no deployment could reach
          #       its first push; services-ci.yml passes `.` for the same eight files and
          #       each Dockerfile's own header states the contract.
          # WHY : Assumptions: the ui and data-migration rows keep their own narrower
          #       contexts and are correct as they stand. Each of those images copies
          #       nothing from outside its own tree and each carries its own
          #       .dockerignore at that context root, which is also why the root
          #       .dockerignore governs exactly the eight service builds.
          # WHY : Assumptions: the table below has TEN rows and services/ has NINE
          #   Maven modules, and the difference is common-lib, which is deliberately
          #   absent. It is a library the eight service images compile against and
          #   package inside themselves, not a deployable -- it has no entry point,
          #   no Dockerfile, and nothing would run it. Listing it would ask
          #   infra/modules/ecr for an eleventh built repository whose exact-set
          #   validation does not admit it, so the mismatch would surface as a
          #   confusing registry error rather than as the naming mistake it is. The
          #   count is stated here because eight-of-nine is exactly the off-by-one a
          #   reader would otherwise have to rediscover from the module list.
          # WHY : Alternatives Considered: a `strategy: matrix:` over these ten rows,
          #   which is the idiomatic Actions shape and would build them
          #   concurrently on ten runners. Rejected because each build's OUTPUT is
          #   needed here, in this job: the loop accumulates the registry-resolved
          #   digest of every image into one object that is merged into
          #   $root/deployment.auto.tfvars.json and read by the apply below. A
          #   matrix fans out to separate machines, so that object would have to be
          #   reassembled from ten artifacts by a further job -- and the tfvars
          #   document it feeds is precisely the file this workflow keeps
          #   runner-local and deletes at the end, so publishing fragments of it to
          #   artifact storage would work against that. Trade-offs: the ten builds
          #   run sequentially, which is slower than a fan-out, accepted because
          #   `set -euo pipefail` then makes the loop fail on the FIRST failing
          #   build and stop -- the equivalent of `fail-fast: true` -- so a broken
          #   image never reaches the push, the scan gate or the apply.
          cat > "$RUNNER_TEMP/carddemo-images.tsv" <<'IMAGES'
          auth-service	services/auth-service/Dockerfile	.
          account-service	services/account-service/Dockerfile	.
          card-service	services/card-service/Dockerfile	.
          transaction-service	services/transaction-service/Dockerfile	.
          reference-service	services/reference-service/Dockerfile	.
          batch-service	services/batch-service/Dockerfile	.
          authorization-service	services/authorization-service/Dockerfile	.
          reporting-service	services/reporting-service/Dockerfile	.
          ui	ui/Dockerfile	ui
          data-migration	data-migration/Dockerfile	data-migration
          IMAGES

          digests='{}'
          while IFS=$'\t' read -r name dockerfile context; do
            repository="$(jq -er --arg name "$name" '.[$name]' <<<"$repos")"
            image="${repository}:${CARDDEMO_IMAGE_TAG}"
            docker build --file "$dockerfile" --tag "$image" "$context"
            docker push "$image"
            repository_name="${repository#*/}"
            digest="$(aws ecr describe-images \
              --repository-name "$repository_name" \
              --image-ids "imageTag=${CARDDEMO_IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' --output text)"
            if [ "$name" != "ui" ]; then
              digests="$(jq --arg name "$name" --arg digest "$digest" '. + {($name): $digest}' <<<"$digests")"
            fi
          done < "$RUNNER_TEMP/carddemo-images.tsv"

          jq -c . <<<"$digests" > deploy-reports/image-digests.json
          root="infra/envs/${{ inputs.environment }}"
          jq --argjson digests "$digests" '.image_digests = $digests' \
            "$root/deployment.auto.tfvars.json" > "$root/deployment.auto.tfvars.json.tmp"
          mv "$root/deployment.auto.tfvars.json.tmp" "$root/deployment.auto.tfvars.json"

      # WHY : Refactoring Rationale: this step was WITHDRAWN on the reasoning that
      #       there was no sidecar to pull an image for, the collector having been
      #       removed from infra/modules/ecs-service. Removing the collector removed
      #       centralized metrics and tracing with it -- nothing scraped the Prometheus
      #       endpoint, no span was exported, the operations dashboard read a namespace
      #       with no publisher, and the state machine still pushed reporting metrics to
      #       a loopback receiver that no longer existed -- against a requirement the
      #       frozen plan states outright in sections 0.2.1.4 and 0.9.3. The collector is
      #       restored, so its mirror is required again and this step is required with
      #       it: without it the apply below registers task definitions naming an image
      #       that was never pushed, and every task stops with CannotPullContainerError.
      #       docs/runbooks/deploy.md carries the same procedure for an operator applying
      #       by hand, and the two are deliberately the same commands in the same order.
      #       Assumptions: this is the ONE third-party repository the registry holds, so
      #       the inventory this workflow pushes to is ten deployables plus one approved
      #       mirror -- eleven repositories against the ten AAP section 0.4.1.6 fixes.
      #       infra/modules/ecr admits that one name and no other, and the deviation is
      #       ratified in docs/adr/ADR-002-compute-platform.md rather than left implicit
      #       in this step.
      # WHY : This step exists because the environment roots point every task's
      #       telemetry sidecar at a PRIVATE registry reference rather than at the
      #       upstream public one. infra/modules/network enumerates the application
      #       tier's egress instead of allowing 0.0.0.0/0, and the public registry
      #       has neither an interface endpoint nor a managed prefix list, so a task
      #       pointed upstream cannot pull its sidecar -- and the sidecar is attached
      #       to every workload by default, so no task would start. Without this
      #       mirror the apply below would register task definitions naming an image
      #       that was never pushed, which is the failure mode the ecr module's own
      #       exact-set validation exists to prevent for the ten built images.
      #       Assumptions: the tag is the UPSTREAM version, matching
      #       local.telemetry_collector_image_tag in both roots, and NOT this
      #       release's commit tag. The artifact is not built here, so tagging it
      #       with a CardDemo commit would claim a provenance it does not have.
      #       Refactoring Rationale: the push was UNCONDITIONAL, on the reasoning that
      #       "a re-push of identical content is a no-op at the layer level" and that a
      #       conditional would need a describe-images call whose "not found" path is
      #       indistinguishable from a permissions failure. The first half is wrong for
      #       this registry and the second half is answerable. infra/modules/ecr sets
      #       image_tag_mutability to IMMUTABLE, so re-pushing an existing tag is not a
      #       no-op -- the registry refuses it with ImageTagAlreadyExistsException -- and
      #       because the collector tag is a fixed upstream version rather than this
      #       release's commit, EVERY deployment after the first pushed the same tag
      #       again. The failure therefore did not depend on anything changing: the
      #       second deployment of any release broke here, before the apply. The two
      #       "not found" cases are also distinguishable, because the API names the
      #       exception, and the check below tests for that name rather than for a
      #       non-zero status.
      #       Refactoring Rationale: the source reference was a mutable version TAG,
      #       accepted on the reasoning that upstream release tags are immutable by
      #       convention. A convention is not a control, and the artifact this pulls is
      #       the one container attached to every workload, so the pull now names the
      #       reviewed OCI index DIGEST and the tag is used only as the mirror's label.
      #       Assumptions: the digest below and local.telemetry_collector_image_tag in
      #       both roots describe the same upstream artifact, and a gate in
      #       .github/workflows/infra-ci.yml asserts the tag halves agree.
      #       Assumptions: the mirror's own digest is NOT the upstream digest. This
      #       copies through the local daemon, which resolves one platform manifest out
      #       of the upstream index, so the pushed manifest is a different object with a
      #       different digest. That is why the value recorded for Terraform is read
      #       back from the registry rather than reused from the pull.
      - name: Mirror the pinned telemetry collector image into the private registry
        shell: bash
        run: |
          set -euo pipefail
          repos="$(cat deploy-reports/ecr-repositories.json)"
          collector_repository="$(jq -er '."aws-otel-collector"' <<<"$repos")"
          collector_repository_name="${collector_repository#*/}"
          collector_tag="v0.49.0"
          collector_digest="sha256:d2bdfff2c377c3d71d78bd5d9ce9862fd535b12134a5739d87a07801297cf9fd"
          upstream="public.ecr.aws/aws-observability/aws-otel-collector@${collector_digest}"
          mirror="${collector_repository}:${collector_tag}"

          # WHY : Assumptions: a describe-images failure is classified by the exception
          #       the API names, not by its exit status. ImageNotFoundException means the
          #       tag is absent and the mirror has work to do; anything else -- an access
          #       denial, a throttle, a missing repository -- must fail the deployment
          #       rather than be read as "absent" and turned into a push that then fails
          #       for a second reason. This is what the previous comment treated as
          #       impossible to distinguish.
          existing=""
          if describe_output="$(aws ecr describe-images \
                --repository-name "$collector_repository_name" \
                --image-ids "imageTag=${collector_tag}" \
                --query 'imageDetails[0].imageDigest' --output text 2>describe.err)"; then
            existing="$describe_output"
          elif grep -q 'ImageNotFoundException' describe.err; then
            existing=""
          else
            echo "[ci-deploy] describe-images failed for ${collector_repository_name}:${collector_tag}" >&2
            cat describe.err >&2
            rm -f describe.err
            exit 1
          fi
          rm -f describe.err

          if [ -n "$existing" ]; then
            echo "[ci-deploy] mirror already holds ${mirror} at ${existing}; skipping the push"
            mirror_digest="$existing"
          else
              # WHY : Assumptions: the platform is named explicitly because the pinned
            #       reference is an OCI INDEX carrying a linux/amd64 and a linux/arm64
            #       manifest, and the Fargate platform these task definitions declare is
            #       X86_64. A pull that let the daemon choose would mirror whichever
            #       architecture the runner happens to be, and an arm64 sidecar in an
            #       x86_64 task fails at start with an exec format error rather than at
            #       any point a gate could see. docs/runbooks/deploy.md names the same
            #       platform for the manual procedure.
            docker pull --platform linux/amd64 "$upstream"
            docker tag "$upstream" "$mirror"
            docker push "$mirror"
            mirror_digest="$(aws ecr describe-images \
              --repository-name "$collector_repository_name" \
              --image-ids "imageTag=${collector_tag}" \
              --query 'imageDetails[0].imageDigest' --output text)"
            echo "[ci-deploy] mirrored ${upstream} to ${mirror} at ${mirror_digest}"
          fi

          # WHY : Assumptions: the digest is merged into the SAME image_digests object
          #       the built images use, so the task definitions name the sidecar by
          #       digest exactly as they name a service. Both roots declare
          #       aws-otel-collector as an admissible key and prefer a digest when one is
          #       present, so a plan run before any mirror exists still resolves the tag
          #       form instead of failing on a missing key.
          root="infra/envs/${{ inputs.environment }}"
          jq --arg digest "$mirror_digest" \
            '.image_digests["aws-otel-collector"] = $digest' \
            "$root/deployment.auto.tfvars.json" > "$root/deployment.auto.tfvars.json.tmp"
          mv "$root/deployment.auto.tfvars.json.tmp" "$root/deployment.auto.tfvars.json"
          jq --arg digest "$mirror_digest" \
            '. + {"aws-otel-collector": $digest}' \
            deploy-reports/image-digests.json > deploy-reports/image-digests.json.tmp
          mv deploy-reports/image-digests.json.tmp deploy-reports/image-digests.json


      # WHY : This gate exists because scan-on-push produced findings that nothing read.
      #       infra/modules/ecr enables image_scanning_configuration.scan_on_push for every
      #       repository, and its own comment records the limit of that setting: the scan
      #       runs after the push has already succeeded, so it is not a push-blocking
      #       control. Nothing downstream consumed the result either, which left the
      #       registry generating a vulnerability report per image and the deployment
      #       proceeding regardless of what it said. This step is the missing consumer:
      #       it waits for each pushed image's scan and refuses the deployment on a
      #       CRITICAL or HIGH finding.
      #       Assumptions: it runs BEFORE the apply and after every push, which is the
      #       only window in which the finding is both available and still actionable --
      #       the images exist, so they can be scanned, and no task definition names them
      #       yet, so refusing costs nothing but a release.
      #       Alternatives Considered: registry-level Amazon Inspector enhanced scanning
      #       instead. Rejected here for the reason infra/modules/ecr records for
      #       aws_ecr_registry_scanning_configuration -- it is one account-wide,
      #       region-wide object that two environment roots would each declare and each
      #       apply would revert the other -- and because enhanced scanning is continuous
      #       and asynchronous, so it reports on an image after a deployment rather than
      #       gating one.
      #       Alternatives Considered: an override input so an operator can deploy past a
      #       finding. Deliberately NOT added: an override that exists is an override that
      #       is used, and the remedy this repository already has is better -- every base
      #       image is digest-pinned, so the answer to a finding is to advance the pin and
      #       rebuild, which is a reviewed change rather than a waived one.
      #       Trade-offs: a new advisory published against an unchanged base image can
      #       block a deployment of unrelated code, and that is the accepted cost of the
      #       gate. It fails with the repository, the tag and the severity counts, so the
      #       required action -- advance a base-image pin -- is legible from
      #       the log rather than requiring a console visit.
      #       Assumptions: the deployment role needs ecr:DescribeImageScanFindings in
      #       addition to the ECR actions the push already uses. docs/runbooks/deploy.md
      #       lists it with the others.
      - name: Gate the deployment on image vulnerability findings
        shell: bash
        run: |
          set -euo pipefail
          repos="$(cat deploy-reports/ecr-repositories.json)"
          blocking=0
          : > deploy-reports/image-scan-findings.txt

          # WHY : Refactoring Rationale: this loop dropped its per-repository tag
          #       selection on the reasoning that every repository the workflow pushes to
          #       is now one this repository builds, so every image carries this release's
          #       tag. That is false, and the loop's own input says so: it iterates the
          #       keys of the ecr module's repository_urls output, which holds ELEVEN
          #       repositories -- the ten deployables AAP section 0.4.1.6 fixes plus the
          #       one approved aws-otel-collector mirror ratified in
          #       docs/adr/ADR-002-compute-platform.md. The mirror is pushed by the step
          #       above under the collector's upstream release tag and never under this
          #       release's tag, so a single tag="$CARDDEMO_IMAGE_TAG" asked the registry
          #       for an image identifier that has never existed: the waiter returns
          #       immediately, describe-image-scan-findings yields nothing, the status
          #       reads UNKNOWN and the wildcard branch below sets blocking=1 -- refusing
          #       EVERY deployment whatever the findings actually say, and reporting a
          #       missing scan rather than a missing tag. The branch is restored together
          #       with the mirror it exists for, so the mirror is gated on its own tag
          #       instead of being gated out of existence.
          # WHY : Assumptions: the collector's tag is spelled here as a literal rather
          #       than carried over from the mirror step, because each `run:` block is a
          #       separate shell and nothing survives between two of them except what is
          #       written to the environment file. It cannot drift unnoticed: the prose
          #       gate in .github/workflows/infra-ci.yml reads every collector_tag=
          #       literal in this file and requires the set to equal the single
          #       telemetry_collector_image_tag both environment roots pass, so a release
          #       advanced in one place and not the other fails review rather than
          #       reintroducing this defect from the other direction.
          # WHY : Trade-offs: the mirror is gated on exactly the same CRITICAL/HIGH rule
          #       as an image this repository builds, even though the remedy differs -- a
          #       finding here is answered by advancing the pinned upstream digest in the
          #       mirror step rather than by rebuilding a Dockerfile. Accepted: the
          #       collector runs as an essential sidecar in every task, so exempting it
          #       would leave the one container present in all eleven task definitions as
          #       the only unscanned one.
          collector_tag="v0.49.0"
          while IFS= read -r name; do
            repository="$(jq -er --arg name "$name" '.[$name]' <<<"$repos")"
            repository_name="${repository#*/}"
            if [ "$name" = "aws-otel-collector" ]; then
              tag="$collector_tag"
            else
              tag="$CARDDEMO_IMAGE_TAG"
            fi

            # WHY : Assumptions: the waiter is allowed to fail. It returns non-zero when a
            #       scan finishes in a state other than COMPLETE, and the status is read
            #       explicitly below so each terminal state gets its own decision rather
            #       than every one of them becoming the same failure.
            aws ecr wait image-scan-complete \
              --repository-name "$repository_name" \
              --image-id "imageTag=${tag}" || true

            findings="$(aws ecr describe-image-scan-findings \
              --repository-name "$repository_name" \
              --image-id "imageTag=${tag}" --output json 2>/dev/null || echo '{}')"
            status="$(jq -r '.imageScanStatus.status // "UNKNOWN"' <<<"$findings")"

            case "$status" in
              COMPLETE)
                critical="$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' <<<"$findings")"
                high="$(jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0' <<<"$findings")"
                medium="$(jq -r '.imageScanFindings.findingSeverityCounts.MEDIUM // 0' <<<"$findings")"
                printf '%s:%s status=%s critical=%s high=%s medium=%s\n' \
                  "$repository_name" "$tag" "$status" "$critical" "$high" "$medium" \
                  | tee -a deploy-reports/image-scan-findings.txt
                if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ]; then
                  echo "[ci-deploy] BLOCKING: ${repository_name}:${tag} carries ${critical} critical and ${high} high findings" >&2
                  blocking=1
                fi
                ;;
              UNSUPPORTED_IMAGE)
                # WHY : Trade-offs: an image the registry cannot scan is reported and
                #       allowed through, because there is no finding set to gate on and
                #       refusing would make a registry capability -- not a vulnerability --
                #       block a release. The compensating control is that every base image
                #       in this repository is digest-pinned and reviewed.
                printf '%s:%s status=%s (registry cannot scan this image; not gated)\n' \
                  "$repository_name" "$tag" "$status" \
                  | tee -a deploy-reports/image-scan-findings.txt
                ;;
              *)
                printf '%s:%s status=%s\n' "$repository_name" "$tag" "$status" \
                  | tee -a deploy-reports/image-scan-findings.txt
                echo "[ci-deploy] BLOCKING: no completed scan for ${repository_name}:${tag} (status ${status})" >&2
                blocking=1
                ;;
            esac
          done < <(jq -r 'keys[]' <<<"$repos")

          if [ "$blocking" -ne 0 ]; then
            echo "[ci-deploy] refusing to apply: at least one image carries a critical or high finding, or has no completed scan" >&2
            echo "[ci-deploy] advance the affected base-image pin and rebuild; findings are summarised in deploy-reports/image-scan-findings.txt" >&2
            exit 1
          fi
          echo "[ci-deploy] image vulnerability gate: PASS"

      # Alternatives Considered: a bare auto-approved apply. Rejected because it
      # re-plans at execution time; applying the saved plan guarantees the
      # reviewed change set is the one sent to AWS.
      # Assumptions: the saved plan is named "<env>.tfplan" rather than a bare
      # "tfplan". A saved plan embeds the resolved value of every attribute the
      # apply will set, which for this stack includes the generated Aurora master
      # password and the Cognito seed-user passwords, and the repository ignore
      # rules match on the ".tfplan" SUFFIX -- a bare "tfplan" has no suffix to
      # match and stays trackable. infra/README.md, infra/bootstrap/README.md and
      # both environment READMEs use the same convention, so an operator
      # reproducing this step locally writes a name "git check-ignore" covers.
      # Assumptions: reading the TRACKED terraform.tfvars in CI is safe because it
      # carries sizing and retention only -- capacity units, task counts, log
      # retention, price class and the protection flags. It holds no credential by
      # construction rather than by inspection: the database master password and
      # the Cognito seed-user passwords are GENERATED at apply time and written
      # straight to Secrets Manager, which is what makes "no secrets committed"
      # structurally true for this repository instead of merely observed. The
      # account-specific inputs that are not sizing arrive separately, from the
      # protected GitHub environment into the untracked auto-tfvars document the
      # step above writes and the cleanup step below deletes.
      - name: Plan and apply the complete environment
        shell: bash
        run: |
          set -euo pipefail
          root="infra/envs/${{ inputs.environment }}"
          plan_file="${{ inputs.environment }}.tfplan"
          terraform -chdir="$root" plan -input=false -var-file=terraform.tfvars -out="$plan_file"
          terraform -chdir="$root" show -no-color "$plan_file" > deploy-reports/terraform-plan.txt
          terraform -chdir="$root" apply -input=false "$plan_file"

      # WHY : This step exists because the SPA's API endpoint is not knowable before the apply that
      #       creates it, and two things depend on that endpoint: the browser has to be told where to
      #       send requests, and the distribution's content-security policy has to permit them.
      #       Refactoring Rationale: previously neither happened. The bundle was built with no
      #       VITE_API_BASE_URL -- inlined at build time, and the build runs before this apply -- so
      #       the application threw on its first render; and the required connect-src input was never
      #       supplied at all, so the apply could not complete. Discovering the endpoint here and
      #       feeding it to both consumers is what makes the deployed SPA able to reach its API.
      #       Assumptions: the base URL carries the /api/v1 prefix. Every published route key sits
      #       under that prefix while the browser client addresses operations relatively -- /cards,
      #       /auth/signon -- so a base URL without it produces a 404 on every request while looking
      #       correct in the client and in the gateway when each is read on its own.
      #       Trade-offs: a SECOND apply runs, narrowly targeted at the distribution. It is the cost
      #       of a policy that names a resource created in the same apply, and it is safe precisely
      #       because Terraform is idempotent: the only change it can make is to the response-headers
      #       policy, and re-running it with an unchanged endpoint is a no-op.
      - name: Publish runtime configuration and narrow the content-security policy
        shell: bash
        run: |
          set -euo pipefail
          root="infra/envs/${{ inputs.environment }}"
          api_base="$(terraform -chdir="$root" output -json api_gateway | jq -r '.api_endpoint_url')"
          printf '%s' "$api_base" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?(/.*)?$'

          # Assumptions: the origin is scheme and host only, which is what the connect-src directive
          #   takes and what the variable's validation enforces; the base URL keeps its path.
          api_origin="$(printf '%s' "$api_base" | sed -E 's#^(https://[^/]+).*#\1#')"
          api_base_url="${api_base%/}/api/v1"

          tfvars="$root/deployment.auto.tfvars.json"
          jq --arg origin "$api_origin" \
            '.cloudfront_api_connect_src_origins = [$origin]' "$tfvars" > "$tfvars.next"
          mv "$tfvars.next" "$tfvars"

          # WHY : Refactoring Rationale: this narrowing used to run as a single
          #   auto-approved apply. That contradicted the discipline the complete
          #   apply above is built on for no reason other than brevity: an
          #   auto-approved apply re-plans at execution time, so what it sends to
          #   the account is decided inside the same command that performs it and
          #   is never rendered anywhere a reviewer or an audit record can see it.
          #   The narrowing is small but it is not cosmetic -- it rewrites the
          #   response-headers policy that governs which origins the published SPA
          #   is allowed to call -- so it is now planned to a file, rendered into
          #   the audit record, and applied from that exact saved plan, which is
          #   the same three-step shape the registry step and the complete
          #   environment apply already use. Alternatives Considered: leaving the
          #   auto-approved form because the change set is bounded by -target.
          #   Rejected because -target bounds WHICH resources may change, not what
          #   the change is, and it is the second half that the frozen plan
          #   requires to be reviewable.
          # WHY : Assumptions: the plan file carries the ".tfplan" suffix the
          #   repository ignore rules match on, for the same reason the complete
          #   plan does, and the cleanup step below removes it by that name. The
          #   rendering is the human `show -no-color` form rather than `show
          #   -json`, which is what keeps sensitive planned attributes redacted in
          #   the artifact a reviewer reads.
          csp_plan="${{ inputs.environment }}-cloudfront.tfplan"
          terraform -chdir="$root" plan -input=false -var-file=terraform.tfvars \
            -target=module.cloudfront_spa -out="$csp_plan"
          terraform -chdir="$root" show -no-color "$csp_plan" \
            > deploy-reports/terraform-plan-cloudfront.txt
          terraform -chdir="$root" apply -input=false "$csp_plan"

          # Assumptions: the document is written into the build output so the existing sync publishes
          #   it alongside the bundle, which keeps one publication step rather than two.
          jq -n --arg apiBaseUrl "$api_base_url" '{apiBaseUrl: $apiBaseUrl}' > ui/dist/config.json
          cp ui/dist/config.json deploy-reports/runtime-config.json

      # Assumptions: CloudFront serves the S3 origin, not the UI container image.
      # The invalidation is limited to the entry document and route fallback so
      # content-hashed assets remain cacheable.
      - name: Publish the SPA and invalidate its entry document
        shell: bash
        run: |
          set -euo pipefail
          root="infra/envs/${{ inputs.environment }}"
          # Refactoring Rationale: these two read outputs that do not exist -- there is no
          # top-level spa_bucket_name and no cloudfront_distribution_id. The values live in the
          # "spa_publication" aggregate, whose own description says it exists to carry exactly
          # the non-secret values this workflow needs, under the keys spa_bucket_name and
          # spa_distribution_id. Note the second name differs from the one read here before:
          # the aggregate spells it spa_distribution_id, so a mechanical rename would still
          # have failed. One -json read feeds both, and jq -e turns a missing key into a
          # non-zero exit rather than an empty string that would later publish to "s3:///".
          publication="$(terraform -chdir="$root" output -json spa_publication)"
          bucket="$(jq -er '.spa_bucket_name' <<<"$publication")"
          distribution="$(jq -er '.spa_distribution_id' <<<"$publication")"
          aws s3 sync ui/dist "s3://${bucket}/" --delete

          # WHY : Assumptions: the configuration document is uploaded a second time with an explicit
          #       no-cache directive, overwriting the copy the sync just made. It is the one object
          #       here that is rewritten in place on every deployment -- every other asset is
          #       content-hashed and safely cacheable forever -- so a cached copy would point a newly
          #       published bundle at the previous deployment's endpoint. The client also requests it
          #       with `cache: 'no-store'`, and both halves are needed: the request header governs the
          #       browser, this header governs the edge cache.
          aws s3 cp ui/dist/config.json "s3://${bucket}/config.json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json" >/dev/null

          aws cloudfront create-invalidation \
            --distribution-id "$distribution" \
            --paths "/" "/index.html" "/config.json" "/*" >/dev/null

      # Assumptions: audit evidence is more valuable after a failed deployment,
      # so upload runs unconditionally and missing evidence fails loudly.
      # Assumptions: advanced from upload-artifact v4.4.3 with every other pin, for
      # the reason measured once in services-ci.yml. The inputs are unchanged.
      - name: Upload the deployment audit record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carddemo-deploy-audit-${{ inputs.environment }}
          path: deploy-reports/**
          if-no-files-found: error

      # Assumptions: generated tfvars and saved binary plans can contain account
      # identifiers or sensitive planned values. They remain runner-local and are
      # removed even when a prior gate fails; state and .terraform are never uploaded.
      - name: Remove runner-local deployment material
        if: always()
        shell: bash
        run: |
          root="infra/envs/${{ inputs.environment }}"
          rm -f "$root/deployment.auto.tfvars.json" "$root/ecr.tfplan" \
                "$root/${{ inputs.environment }}.tfplan" \
                "$root/${{ inputs.environment }}-cloudfront.tfplan"
