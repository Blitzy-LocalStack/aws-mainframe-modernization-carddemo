# =============================================================================
# .github/workflows/ui-ci.yml
# -----------------------------------------------------------------------------
# Purpose:
#   Installs the lock-file-exact SPA dependency graph, type-checks it, enforces
#   the JSDoc gate, runs component tests, audits high-severity advisories, and
#   creates the production bundle without publishing it. All source gates and
#   report presence are GATING; JUnit annotations alone are ADVISORY.
#
# Parameters:
#   workflow_dispatch.run_format_check controls only the independently labelled
#   Prettier check on a manual diagnostic run; type, documentation, test, audit,
#   and production-build gates are never optional.
# Return values:
#   A failing gate returns failure. The report upload is ATTEMPTED unconditionally
#   (`if: always()`), and the ABSENCE of a report is itself gating: the upload runs
#   with `if-no-files-found: error`, so a run whose type, documentation, contract or
#   lint gate failed before Vitest executed fails at the upload with no artifact
#   rather than producing one. An artifact is therefore promised only for a run that
#   reached the test step.
# Exceptions or errors:
#   The annotation publisher may degrade without masking Vitest. No other
#   non-zero exit is tolerated.
#
# WHY (non-obvious design decisions):
#   - Assumptions: every command runs under ui/, so one job-level working
#     directory prevents path drift between the lock file and the tools it pins.
#   - Trade-offs: npm caching is scoped by ui/package-lock.json; the extra cache
#     dependency is accepted because npm ci still verifies the reviewed lock.
#   - Alternatives Considered: uploading ui/dist from CI. Rejected because this
#     workflow validates only; deploy.yml rebuilds and publishes the artifact.
#   - Assumptions: the run is TWO jobs, and the split is a privilege boundary
#     rather than an organisational one. `ui` executes repository and dependency
#     code and holds `contents: read`; `publish-ui-reports` holds the single
#     `checks: write` scope and executes none, taking the artifact as its only
#     input. Refactoring Rationale: both lived in one job, which meant the
#     check-writing token was present while npm ci, ESLint, Vitest and Vite ran.
#     The full argument is at the two `permissions` blocks below.
# =============================================================================

name: CardDemo UI CI

# Assumptions: UI source, manifest, delivery config, the service-held OpenAPI
# documents, the Rule 1 lexical gate's own source, the documentation standard that
# gate is measured against, and this workflow are the complete owning surface.
# Infrastructure and immutable baseline paths have separate workflows and are
# intentionally excluded.
#
# Assumptions: config/rule1/** and docs/CODE_DOCUMENTATION_STANDARD.md are triggers
# because the lexical gate below reads the WHOLE tree, this SPA included, and the
# standard is authoritative over the gate rather than descriptive of it. A change to
# either can turn this SPA's prose from compliant to non-compliant without touching
# a file under ui/, and a filter that named neither would let that change reach the
# default branch with no run.
#
# Refactoring Rationale: the third pattern, the openapi trees under services, was
# ADDED and is not a UI path. Without it this workflow's own contract-agreement
# gate could not do its job: `ui/src/api/contracts.test.ts` compares this SPA's
# typed client layer with those six documents, and the drift it exists to catch is
# most often introduced from the SERVICE side -- an operation renamed, moved or
# withdrawn there. With the filter limited to ui/**, exactly that change ran no
# job here at all, so the gate would have fired only on the pull request that
# later touched the SPA, attributing the divergence to whoever noticed it rather
# than to the change that caused it. Trade-offs: an OpenAPI edit now runs the full
# SPA job, including the production build, which is more work than the comparison
# strictly needs; a contracts-only job would be cheaper and was rejected because a
# second job installing the same lock file is a second place for the Node version
# and the install step to drift from this one.
on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "services/*/src/main/resources/openapi/**"
      - "config/rule1/**"
      - "docs/CODE_DOCUMENTATION_STANDARD.md"
      - ".github/workflows/ui-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ui/**"
      - "services/*/src/main/resources/openapi/**"
      - "config/rule1/**"
      - "docs/CODE_DOCUMENTATION_STANDARD.md"
      - ".github/workflows/ui-ci.yml"
  workflow_dispatch:
    inputs:
      run_format_check:
        description: "Run the independent Prettier drift check in addition to all mandatory gates."
        required: false
        type: boolean
        default: true

# Assumptions: this top-level block is a floor for the whole file rather than a
# convenience. With no `permissions:` key at all, every job inherits the repository
# default, which on many repositories is still a read/write token; declaring
# `contents: read` here means any job added later starts read-only and has to widen
# its own scope deliberately. Trade-offs: both jobs below restate their own scope
# instead of leaning on this default, which is redundant on the page and is kept
# that way so the grant a token actually carries is readable at the job that runs
# the code, not inferred from a key seventy lines above it.
permissions:
  contents: read

# Trade-offs: validation has no remote mutation, so replacing a stale run is
# safer than allowing redundant dependency installs and test suites to queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Lint, type-check, test and build the CardDemo SPA
    # Trade-offs: the runner image is pinned rather than allowed to drift with
    # `ubuntu-latest`, because this job depends on the image in two places that a
    # silent image change would move underneath it: the npm layout that
    # `actions/setup-node` below layers its pinned runtime onto, and the system
    # `python3` the Rule 1 lexical gate runs on without a setup step of its own.
    # An unreviewed image bump could alter either and produce a build failure with
    # no commit to blame, which is the failure mode a reviewed pin removes.
    runs-on: ubuntu-24.04
    # Assumptions: a bounded ceiling is preferred to the platform default because
    # every step here either completes or hangs -- `npm ci` waiting on a registry
    # that never answers, or a test environment that never exits -- and an
    # unbounded job would hold a runner on that hang instead of failing it. The
    # figure is deliberately generous rather than fitted to the work: it is a hang
    # detector, not a budget, so it must not red a legitimately slow cold install
    # on a run whose cache was empty. Trade-offs: a genuinely slower pipeline would
    # have to raise this deliberately, which is preferable to a ceiling so tight
    # that it fails runs for the wrong reason.
    timeout-minutes: 45
    # Assumptions: least privilege -- `contents: read` for actions/checkout and
    # nothing else. This job runs repository-controlled and dependency-controlled
    # code from its second step onward: `npm ci` executes install scripts from the
    # committed graph, and TypeScript, ESLint, Vitest and Vite each load
    # configuration and plugins out of that graph. Everything it needs it needs only
    # to READ, so no write scope belongs here.
    # Refactoring Rationale: `checks: write` used to be granted here, for the
    # advisory Vitest publisher that was the job's last step, and that arrangement
    # was unsafe in a way step ordering cannot fix. A job's token is present for
    # every step in the job, not from the step that uses it onward, so the
    # check-run-creating scope was reachable from `npm ci`, from any lifecycle
    # script in the installed graph, and from every ESLint and Vite plugin loaded
    # after it -- a compromised dependency could have recovered a token able to
    # forge check runs on this repository. The publisher therefore moved into
    # `publish-ui-reports` below, which checks nothing out and installs nothing, so
    # the narrowing is structural rather than positional. This is the same split
    # `services-ci.yml` already applies to its own reactor job for the same reason.
    # Assumptions: `pull-requests: write` is absent from BOTH jobs, which is a
    # narrower grant than `services-ci.yml`'s equivalent publisher takes. The
    # publisher receives `report_paths`, `check_name` and `fail_on_failure` only, so
    # it posts no pull-request comment, and a check run reaches the pull request
    # through the checks tab without any pull-request scope. Write access to
    # pull-request bodies, comments, labels and reviews would widen the token for no
    # behaviour this workflow uses.
    # Assumptions: anything added later that writes beyond the runner must request
    # its scope deliberately -- and in the job that actually performs the write,
    # not in this one.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui

    steps:
      # Assumptions: full-SHA action pins cannot be moved to attacker-controlled
      # code while this job's token remains trusted (CWE-1357).
      # Assumptions: CWE-522, `persist-credentials: false` -- by default checkout
      # leaves the job's `GITHUB_TOKEN` in `.git/config` as an extraheader for the
      # remainder of the job, so every later step would run with a usable credential
      # sitting on disk. That matters more in this job than in most: the steps after
      # this one execute install scripts, an ESLint plugin graph, a Vitest
      # environment and a Vite build, all resolved from the dependency tree, and none
      # of them needs git credentials at all. Nothing here pushes, tags or comments
      # through git. Removing the credential after the fetch therefore costs the job
      # nothing and takes the token out of reach of everything that follows.
      # Trade-offs: a future step that genuinely needs to push would have to
      # re-authenticate explicitly instead of inheriting a credential silently, which
      # is the point -- it makes that a visible edit here rather than a default.
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Assumptions: Node 22.23.2 matches the pinned UI build-stage line and the
      # engines floor ui/package.json declares, and all three move together. The
      # ACTION major and the Node version it installs are independent: setup-node v7
      # runs its own code on node24 and still installs whatever `node-version` names,
      # so the reviewed 22.23.2 line is unaffected by the move below.
      # Refactoring Rationale: this was 22.23.1, advanced for the same reason as the
      # image pin rather than for anything about this workflow. Node's 29 July 2026
      # release fixed eleven CVEs including three HIGH -- CVE-2026-56846 (HTTP/2
      # maxSessionMemory evasion), CVE-2026-56848 (heap use-after-free in bundled
      # nghttp2) and CVE-2026-58043 (Permission Model radix-prefix over-grant) --
      # and 22.23.1 predates all three. Trade-offs: none of the three is reachable by
      # a typecheck, lint or vite build, so this is hygiene rather than a fix for an
      # exploitable path here; it is taken because leaving CI one patch behind the
      # image it validates is how the two silently diverge, and because the version
      # this job installs is the one whose `npm ci` resolution the reviewer trusts.
      # Trade-offs: TypeScript remains 6.0.3 because typescript-eslint 8.65.0
      # accepts >=4.8.4 <6.1.0; raising the compiler alone disables the
      # type-aware lint/JSDoc gate while leaving installation apparently green.
      # Refactoring Rationale: this pin was v4.4.0, and review did not flag it --
      # it was found by applying the same measurement that condemned the four pins
      # review DID flag. The lock committed at actions/setup-node@v4.4.0 resolves
      # `form-data` 2.5.1 and 4.0.0, both below the 2.5.4/4.0.4 fix line of
      # GHSA-fjxv-7rqg-78g4, reached through `@azure/core-http` behind
      # `@actions/cache` -- the same path as setup-java and setup-python. The lock
      # at v7.0.0 carries no `form-data` entry. Fixing only what was reported would
      # have left the identical vulnerable bundle in this workflow and in deploy.yml.
      # Assumptions: `node-version`, `cache` and `cache-dependency-path` are all
      # still declared by v7; the removals in v6 and v7 -- `always-auth` handling
      # and a dummy NODE_AUTH_TOKEN export -- concern npm publication, which no job
      # in this file performs. v7 runs on node24 and therefore needs an Actions
      # Runner of 2.327.1 or newer, which the GitHub-hosted ubuntu-24.04 image this
      # job names has carried since 2025. Trade-offs: a self-hosted runner would
      # have to be updated first, and would fail at startup rather than silently.
      - name: Configure the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Alternatives Considered: npm install. Rejected because it may rewrite
      # the lock and resolve a graph different from the one reviewed.
      - name: Install the lock-file-exact dependency graph
        shell: bash
        run: npm ci

      # Assumptions: this script compiles BOTH TypeScript projects -- tsconfig.json
      # for the application and tsconfig.node.json for the Vite and Vitest
      # configuration files -- because those configuration files are TypeScript too,
      # and a type error in one of them breaks the build and the test run while never
      # appearing in an application-only check.
      # Trade-offs: the production build step below repeats this compile through its
      # own prerequisite, so the work is done twice. That is accepted because it gives
      # a type failure its own titled step instead of surfacing it part-way through a
      # build log, which is the same reasoning the contract gate below records for
      # running ahead of the suite that would also have collected it.
      - name: Type-check application and tool configuration
        shell: bash
        run: npm run typecheck

      # Assumptions: --max-warnings=0 is already part of the script and turns a
      # JSDoc warning into a failing Rule 1 gate rather than decorative output.
      - name: Run ESLint and the JSDoc documentation gate
        shell: bash
        run: npm run lint

      # Assumptions: this step and the one above enforce DIFFERENT halves of Rule 1
      # over the same files, which is why both run here. ESLint decides docstring
      # PRESENCE and tag coverage on TypeScript declarations; the lexical gate
      # decides the written FORM of a rationale label and the prohibition on a
      # statement-level WHAT comment, in every language at once -- neither of which
      # any ESLint rule expresses. A repository-wide gate appears in three workflows
      # for that reason: whichever one a change triggers, the property is checked.
      # GATING and FAIL-CLOSED: the script exposes no tolerance flag, no `--fix` and
      # no allow-list argument, and this step adds none.
      # Alternatives Considered: relying on the copy in services-ci.yml alone.
      # Rejected -- a change confined to ui/** does not trigger that workflow, so a
      # prohibited form introduced in a screen or a message catalog would reach the
      # default branch unexamined. Trade-offs: the gate therefore runs up to three
      # times for a change touching several trees, which costs seconds because it
      # imports only the standard library.
      # Assumptions: the runner image's own `python3` is used rather than a pinned
      # setup-python step, because this job is otherwise Node-only and the gate needs
      # no third-party package. The `python3 -V` line makes the interpreter the run
      # actually used visible in the log, so a future image change is diagnosable
      # from the same step that would fail.
      # ⚠️ Assumptions: this step runs from the REPOSITORY ROOT and overrides the job's
      # `ui` default, because the gate is repository-wide: it walks every governed tree
      # and reads `docs/CODE_DOCUMENTATION_STANDARD.md`, both of which are outside
      # `ui/`. Without the override the invocation resolved to
      # `ui/config/rule1/rule1_gate.py`, which does not exist, so the step exited 2 with
      # `can't open file` on every run of this workflow -- the one workflow a change
      # confined to `ui/**` triggers, which is the reason the paragraph above gives for
      # having a third copy of the gate at all. The two other copies, in
      # services-ci.yml and infra-ci.yml, need no override because neither of those jobs
      # sets a default working directory.
      - name: Run the Rule 1 lexical and consistency gate
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          python3 -V
          python3 config/rule1/rule1_gate.py

      - name: Check formatting drift
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_format_check }}
        shell: bash
        run: npm run format

      # Refactoring Rationale: the contract-agreement gate runs as its own step
      # AHEAD of the full suite, even though `npm test` below also collects the
      # file it targets. Three reasons make the duplication worth its cost. It is
      # the only step in this workflow that reads outside ui/ -- it compares this
      # package's typed API client layer with the six OpenAPI documents held in
      # services/*/src/main/resources/openapi -- so a failure here means a service
      # contract and this SPA have diverged, which is a different diagnosis from
      # any component-test failure and deserves its own title in the run log.
      # docs/adr/ADR-006-api-and-ui.md cites this step by name as the delivered
      # mechanism for that agreement, so a reader auditing that decision record
      # finds a step rather than a claim. And it is fast -- it starts no jsdom
      # environment and renders nothing -- so running it first surfaces the
      # cheapest, most localised failure before the expensive suite begins.
      # Trade-offs: the same file is executed twice per run, costing a few
      # hundred milliseconds; that is accepted for a named gate, and it is not
      # removed by excluding the file from the suite below, because a developer
      # running `npm test` locally must still see it.
      - name: Check API contract agreement
        shell: bash
        run: npm run contracts

      # Assumptions: Vitest's run mode exits after one pass; watch mode would
      # wait for input indefinitely on a non-interactive runner.
      - name: Run component tests once and emit JUnit XML
        shell: bash
        run: |
          mkdir -p ../ui-reports
          npm test -- --reporter=junit --outputFile=../ui-reports/vitest.xml

      # GATING at the `high` threshold -- a non-zero exit reddens the run, and no
      # tolerance is applied here.
      # Assumptions: this SPA's manifest and lock file are the FIRST npm dependency
      # surface the repository has ever declared. tests.yml records that npm is
      # deliberately not audited there because the repository declares no
      # package.json to scan, and that statement remains accurate for the scope it
      # covers -- the COBOL parity oracle still declares none. The obligation
      # therefore arrives with this tree and is discharged in this file, rather than
      # by amending a reference pipeline that would then be auditing a surface it
      # does not own.
      # Alternatives Considered: making this advisory, the way tests.yml treats its
      # own Python audit, where the gate degrades to a warning so a transient
      # advisory-database outage cannot red an unrelated change. Rejected for this
      # tree on the strength of what each graph reaches: that audit guards a
      # TEST-only closure whose worst outcome is a stale local report, whereas this
      # graph is compiled into the bundle served to every operator of a financial
      # application, so a known high-severity finding in it is a release blocker and
      # a gate that only warned would let exactly that ship.
      # Trade-offs: the advisory database is consequently a hard network dependency
      # of this job, and an outage fails the run instead of waving it through. The
      # explicit `high` floor is what keeps that trade acceptable -- informational
      # and low-severity churn in a transitive development dependency cannot stop a
      # release, while anything material still does.
      - name: Audit production and development dependencies
        shell: bash
        run: npm audit --audit-level=high

      # Assumptions: ui/dist is intentionally git-ignored. Producing it proves
      # the shipping bundle is valid; only deploy.yml publishes a fresh rebuild.
      - name: Build the production SPA bundle
        shell: bash
        run: npm run build

      # Assumptions: advanced from upload-artifact v4.4.3, whose bundle carried the
      # vulnerable `form-data` 4.0.0; the full measurement and the runner
      # requirement are recorded once at the setup-java pin in services-ci.yml and
      # deliberately not restated. The three inputs below are unchanged by the move.
      # Assumptions: this upload is the GATING report-presence check and the only
      # channel by which the test results leave this job. `if-no-files-found: error`
      # is what makes a silently absent Vitest report fail here, which is why the
      # publisher job downstream is allowed to tolerate a missing artifact.
      # Assumptions: `if: always()` means the upload is ATTEMPTED after an earlier
      # failure, NOT that an artifact exists after one. A run that failed its
      # typecheck, documentation, contract or lint gate never reached the test step,
      # so `ui-reports/` is empty and this step fails on no files -- adding a second
      # red step to an already-red run and producing nothing to download. That is the
      # intended behaviour of the two settings together and it is stated here because
      # the pair reads as a promise of an artifact in every outcome; the header's
      # Return values section states the same bound so a reader meets it first.
      - name: Upload Vitest reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carddemo-ui-reports
          path: ui-reports/**
          if-no-files-found: error

  # Assumptions: this job exists to hold the one write scope the advisory JUnit
  # publisher needs, in a job that runs NO repository-controlled and no
  # dependency-controlled code. It checks nothing out, installs no package and
  # builds nothing; its only input is the artifact the job above uploaded. That is
  # what makes `contents: read` in `ui` a real narrowing rather than a positional
  # one -- the token able to create a check run is never present in a job where
  # `npm ci`, an ESLint plugin or a Vite plugin executes.
  # Assumptions: `needs` plus `if: always()` -- annotations matter most when a gate
  # failed, so this must run after a failed build as well as a passing one. `needs`
  # orders it after the build without making it a gate: the authoritative status was
  # already decided by the gating steps above and nothing in this job can change it.
  publish-ui-reports:
    name: Publish the UI test annotations
    needs: ui
    if: always()
    # Trade-offs: pinned for the same reason as the build job above -- the image is
    # reviewed rather than allowed to drift with `ubuntu-latest`. The dependence is
    # lighter here, since this job only downloads an artifact and calls one action,
    # but a drifting image would still change the Node runtime those actions execute
    # on without a commit to attribute it to.
    runs-on: ubuntu-24.04
    # Assumptions: a short ceiling -- this job downloads one artifact and calls one
    # action, so anything beyond a few minutes is a hang rather than a slow run.
    timeout-minutes: 10
    # Assumptions: least privilege -- exactly the one scope the publisher uses, and
    # no `contents` scope at all, because it never reads the repository. `checks:
    # write` creates the check run that carries the annotations; the reason
    # `pull-requests: write` is not requested is recorded at the build job above.
    permissions:
      checks: write

    steps:
      # Assumptions: CWE-1357 -- immutable full-SHA pin, the same supply-chain
      # rationale as every other pin in this workflow family. The SHA is the commit
      # the `v8.0.1` tag of `actions/download-artifact` resolves to, and the version
      # differs from this file's `upload-artifact` pin because the two actions ship
      # from separate repositories on separate cadences.
      # ADVISORY. Trade-offs: `continue-on-error` is required because `if: always()`
      # also runs this job when the build job was skipped or cancelled, in which case
      # no artifact exists and a hard download failure would red a run whose build
      # never executed. Tolerating it costs nothing, because the GATING existence
      # check lives in the build job: its upload step is declared
      # `if-no-files-found: error`, so a missing report already fails there.
      - name: Download the UI test reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: carddemo-ui-reports
          path: ui-reports

      # ADVISORY -- permitted to fail without consequence. Trade-offs:
      # `continue-on-error` plus `fail_on_failure: false` means a publisher outage
      # cannot red an otherwise-passing run, and equally cannot green a failing one.
      # Annotation is added visibility and must never become the thing that decides
      # the result.
      # Assumptions: CWE-1357 -- this is a THIRD-party action, so the immutable
      # full-SHA pin matters more here than anywhere else: a maintainer-account
      # takeover or a tag move would otherwise execute attacker code with this job's
      # token, and this is the one job in the file whose token can write.
      # Assumptions: the glob matches the artifact's own layout. `upload-artifact`
      # roots an archive at the least common ancestor of what it matched, so
      # `ui-reports/**` uploads `vitest.xml` at the archive root and the download
      # above restores it to `ui-reports/vitest.xml`.
      - name: Publish UI JUnit annotations
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        with:
          report_paths: "ui-reports/*.xml"
          check_name: CardDemo UI Test Results
          fail_on_failure: false
