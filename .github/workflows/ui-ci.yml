# =============================================================================
# .github/workflows/ui-ci.yml
# -----------------------------------------------------------------------------
# Purpose:
#   Installs the lock-file-exact SPA dependency graph, type-checks it, enforces
#   the JSDoc gate, runs component tests, audits high-severity advisories, and
#   creates the production bundle without publishing it. All source gates and
#   report presence are GATING; JUnit annotations alone are ADVISORY.
#
# Parameters:
#   workflow_dispatch.run_format_check controls only the independently labelled
#   Prettier check on a manual diagnostic run; type, documentation, test, audit,
#   and production-build gates are never optional.
# Return values:
#   A failing gate returns failure and a Vitest JUnit artifact is uploaded even
#   when an earlier step fails.
# Exceptions or errors:
#   The annotation publisher may degrade without masking Vitest. No other
#   non-zero exit is tolerated.
#
# WHY (non-obvious design decisions):
#   - Assumptions: every command runs under ui/, so one job-level working
#     directory prevents path drift between the lock file and the tools it pins.
#   - Trade-offs: npm caching is scoped by ui/package-lock.json; the extra cache
#     dependency is accepted because npm ci still verifies the reviewed lock.
#   - Alternatives Considered: uploading ui/dist from CI. Rejected because this
#     workflow validates only; deploy.yml rebuilds and publishes the artifact.
# =============================================================================

name: CardDemo UI CI

# Assumptions: UI source, manifest, delivery config, the service-held OpenAPI
# documents and this workflow are the complete owning surface. Infrastructure and
# immutable baseline paths have separate workflows and are intentionally excluded.
#
# Refactoring Rationale: the third pattern, the openapi trees under services, was
# ADDED and is not a UI path. Without it this workflow's own contract-agreement
# gate could not do its job: `ui/src/api/contracts.test.ts` compares this SPA's
# typed client layer with those six documents, and the drift it exists to catch is
# most often introduced from the SERVICE side -- an operation renamed, moved or
# withdrawn there. With the filter limited to ui/**, exactly that change ran no
# job here at all, so the gate would have fired only on the pull request that
# later touched the SPA, attributing the divergence to whoever noticed it rather
# than to the change that caused it. Trade-offs: an OpenAPI edit now runs the full
# SPA job, including the production build, which is more work than the comparison
# strictly needs; a contracts-only job would be cheaper and was rejected because a
# second job installing the same lock file is a second place for the Node version
# and the install step to drift from this one.
on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "services/*/src/main/resources/openapi/**"
      - ".github/workflows/ui-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ui/**"
      - "services/*/src/main/resources/openapi/**"
      - ".github/workflows/ui-ci.yml"
  workflow_dispatch:
    inputs:
      run_format_check:
        description: "Run the independent Prettier drift check in addition to all mandatory gates."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# Trade-offs: validation has no remote mutation, so replacing a stale run is
# safer than allowing redundant dependency installs and test suites to queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Lint, type-check, test and build the CardDemo SPA
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # WHY (least privilege): `contents: read` is for actions/checkout and
    # `checks: write` is for the advisory Vitest JUnit publisher below, which uses
    # it to create the check run carrying the annotations. `pull-requests: write` is
    # deliberately absent: that publisher receives `report_paths`, `check_name` and
    # `fail_on_failure` only, so it posts no pull-request comment, and a check run
    # reaches the pull request through the checks tab without any pull-request
    # scope. Granting write access to pull-request bodies, comments, labels and
    # reviews for annotations the check run already carries would widen the token
    # for no behaviour.
    # Assumptions: this job mutates nothing outside the runner -- it installs from
    # the committed lock, lints, type-checks, tests and builds -- so read access to
    # the tree plus the single check-run scope is the whole of what it legitimately
    # needs. Anything added later that writes beyond the runner must request its
    # scope here deliberately rather than inherit one.
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ui

    steps:
      # Assumptions: full-SHA action pins cannot be moved to attacker-controlled
      # code while this job's token remains trusted (CWE-1357).
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Assumptions: Node 22.23.1 matches the pinned UI build-stage line. The ACTION
      # major and the Node version it installs are independent: setup-node v7 runs
      # its own code on node24 and still installs whatever `node-version` names, so
      # the reviewed 22.23.1 line is unchanged by the move below.
      # Trade-offs: TypeScript remains 6.0.3 because typescript-eslint 8.65.0
      # accepts >=4.8.4 <6.1.0; raising the compiler alone disables the
      # type-aware lint/JSDoc gate while leaving installation apparently green.
      # Refactoring Rationale: this pin was v4.4.0, and review did not flag it --
      # it was found by applying the same measurement that condemned the four pins
      # review DID flag. The lock committed at actions/setup-node@v4.4.0 resolves
      # `form-data` 2.5.1 and 4.0.0, both below the 2.5.4/4.0.4 fix line of
      # GHSA-fjxv-7rqg-78g4, reached through `@azure/core-http` behind
      # `@actions/cache` -- the same path as setup-java and setup-python. The lock
      # at v7.0.0 carries no `form-data` entry. Fixing only what was reported would
      # have left the identical vulnerable bundle in this workflow and in deploy.yml.
      # Assumptions: `node-version`, `cache` and `cache-dependency-path` are all
      # still declared by v7; the removals in v6 and v7 -- `always-auth` handling
      # and a dummy NODE_AUTH_TOKEN export -- concern npm publication, which no job
      # in this file performs. v7 runs on node24 and therefore needs an Actions
      # Runner of 2.327.1 or newer, which the GitHub-hosted ubuntu-24.04 image this
      # job names has carried since 2025. Trade-offs: a self-hosted runner would
      # have to be updated first, and would fail at startup rather than silently.
      - name: Configure the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Alternatives Considered: npm install. Rejected because it may rewrite
      # the lock and resolve a graph different from the one reviewed.
      - name: Install the lock-file-exact dependency graph
        shell: bash
        run: npm ci

      - name: Type-check application and tool configuration
        shell: bash
        run: npm run typecheck

      # Assumptions: --max-warnings=0 is already part of the script and turns a
      # JSDoc warning into a failing Rule 1 gate rather than decorative output.
      - name: Run ESLint and the JSDoc documentation gate
        shell: bash
        run: npm run lint

      - name: Check formatting drift
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_format_check }}
        shell: bash
        run: npm run format

      # Refactoring Rationale: the contract-agreement gate runs as its own step
      # AHEAD of the full suite, even though `npm test` below also collects the
      # file it targets. Three reasons make the duplication worth its cost. It is
      # the only step in this workflow that reads outside ui/ -- it compares this
      # package's typed API client layer with the six OpenAPI documents held in
      # services/*/src/main/resources/openapi -- so a failure here means a service
      # contract and this SPA have diverged, which is a different diagnosis from
      # any component-test failure and deserves its own title in the run log.
      # docs/adr/ADR-006-api-and-ui.md cites this step by name as the delivered
      # mechanism for that agreement, so a reader auditing that decision record
      # finds a step rather than a claim. And it is fast -- it starts no jsdom
      # environment and renders nothing -- so running it first surfaces the
      # cheapest, most localised failure before the expensive suite begins.
      # Trade-offs: the same file is executed twice per run, costing a few
      # hundred milliseconds; that is accepted for a named gate, and it is not
      # removed by excluding the file from the suite below, because a developer
      # running `npm test` locally must still see it.
      - name: Check API contract agreement
        shell: bash
        run: npm run contracts

      # Assumptions: Vitest's run mode exits after one pass; watch mode would
      # wait for input indefinitely on a non-interactive runner.
      - name: Run component tests once and emit JUnit XML
        shell: bash
        run: |
          mkdir -p ../ui-reports
          npm test -- --reporter=junit --outputFile=../ui-reports/vitest.xml

      # Trade-offs: the advisory database is a network dependency, but a known
      # high-severity UI vulnerability is a release blocker. The explicit
      # threshold avoids failing on informational churn while keeping this gate
      # authoritative for material findings.
      - name: Audit production and development dependencies
        shell: bash
        run: npm audit --audit-level=high

      # Assumptions: ui/dist is intentionally git-ignored. Producing it proves
      # the shipping bundle is valid; only deploy.yml publishes a fresh rebuild.
      - name: Build the production SPA bundle
        shell: bash
        run: npm run build

      # Assumptions: advanced from upload-artifact v4.4.3, whose bundle carried the
      # vulnerable `form-data` 4.0.0; the full measurement and the runner
      # requirement are recorded once at the setup-java pin in services-ci.yml and
      # deliberately not restated. The three inputs below are unchanged by the move.
      - name: Upload Vitest reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carddemo-ui-reports
          path: ui-reports/**
          if-no-files-found: error

      # Trade-offs: check annotations are convenient but non-authoritative; a
      # publisher outage cannot turn a passing or failing Vitest result around.
      - name: Publish UI JUnit annotations
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        with:
          report_paths: "ui-reports/*.xml"
          check_name: CardDemo UI Test Results
          fail_on_failure: false
