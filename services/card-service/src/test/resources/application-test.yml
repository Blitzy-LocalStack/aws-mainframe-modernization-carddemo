# =============================================================================
# services/card-service/src/test/resources/application-test.yml
# -----------------------------------------------------------------------------
# Purpose:
#   The `test` profile overlay for the CardDemo card bounded context, which is
#   the migration target of four REFERENCE ONLY programs -- app/cbl/COCRDLIC.cbl
#   (card list), app/cbl/COCRDSLC.cbl (card detail), app/cbl/COCRDUPC.cbl (card
#   update) and app/cbl/CBACT02C.cbl (the sequential read path) -- over the
#   150-byte record declared at app/cpy/CVACT02Y.cpy line 4.
#
#   This is an OVERLAY and not a standalone configuration. Maven puts both
#   src/main/resources and src/test/resources on the test classpath, so
#   application.yml under src/main/resources is in force during every test run
#   and this file overrides VALUES on keys whose shapes that file already owns.
#   Nothing here introduces a key that is absent there.
#
#   Activation is by @ActiveProfiles("test") on the test classes themselves.
#   Neither services/pom.xml nor services/card-service/pom.xml sets
#   spring.profiles.active, so a test class that omits that annotation does not
#   read this file at all and meets the base profile's unresolved placeholders
#   instead. That is worth knowing before debugging a startup failure here: the
#   first question is whether the profile was active, not what this file sets.
#
#   Four consumers, of which two read this file and two do not:
#     - CardRepositoryIT (com.carddemo.card.repository). A real database started
#       by Testcontainers, which owns the claim that the generated SQL is right.
#       Every load-bearing setting below exists for this class.
#     - CardControllerTest (com.carddemo.card.api). A mock MVC slice owning the
#       single-card detail route, including the split between an administrative
#       caller and an ordinary one. It builds no listener and no connection
#       pool, so the transport and pool settings are inert for it while the
#       resource-server and logging settings are not.
#     - CardListServiceTest and CardUpdateServiceTest
#       (com.carddemo.card.service). Both drive a MOCKED repository, load no
#       Spring context and read nothing here. They are named so that their
#       absence from the list above reads as deliberate.
#
#   Five settings are load-bearing rather than tidy: without each one, a context
#   that reads this file either cannot start or cannot reach the schema it is
#   meant to exercise. Each is marked LOAD-BEARING where it is set, with the
#   exact failure it prevents.
#
# Parameters:
#   A Spring profile takes no arguments; its parameters are the 21 properties it
#   binds below, each with its type evident from its value and its purpose given
#   at the key. Three connection properties are deliberately NOT defined here --
#   spring.datasource.url, spring.datasource.username and
#   spring.datasource.password -- because the container assigns its host port
#   when it starts, so no literal authored beforehand can be correct;
#   CardRepositoryIT registers all three through @DynamicPropertySource. Nine
#   further properties are deliberately absent altogether, each with its reason
#   in the register at the foot of this file.
#
# Return values:
#   The effective Environment handed to a Spring test context, and nothing else.
#   A profile returns no value to application code; what each setting
#   contributes to that Environment is stated at the setting.
#
# Exceptions or errors:
#   Startup failure modes in the order a context reaches them. The first four
#   are what the load-bearing settings prevent, so meeting one is evidence that
#   the setting named beside it was removed or that the profile is not active.
#     1. Unresolved issuer placeholder. The base file leaves the issuer a
#        placeholder with no fallback, and the resource-server
#        auto-configuration reads it through the Environment while evaluating a
#        condition, which throws. Without the override below EVERY test that
#        loads a context fails before any test method runs, with
#        PlaceholderResolutionException naming
#        SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI.
#     2. Absent schema. Flyway aborts with `schema "card" does not exist` if
#        create-schemas below is false. This module's migration creates objects
#        INSIDE card and creates no schema, and the bootstrap DDL that does
#        create it lives under data-migration/sql/ and is not on this module's
#        classpath, so a container has `public` and nothing else.
#     3. Refused transport negotiation. Every connection fails with
#        `PSQLException: The server does not support SSL.` if the sslmode
#        override below is removed, because a container built from the stock
#        image starts with no certificate and refuses the negotiation outright.
#     4. Certificate looked up as a filename. A context that starts a real
#        listener fails on a missing file whose name is the literal placeholder
#        text if server.ssl.enabled below is not false, because binding leaves
#        an unresolvable placeholder as a literal string and a resource loader
#        then treats that string as a path.
#     5. Missing migration dialect support. flyway-core ALONE fails at run time
#        rather than at build time: PostgreSQL support moved out of core at
#        version 10, so org.flywaydb:flyway-database-postgresql is a required
#        companion with no compile-time signal for its absence. This profile is
#        the only place in the build where a migration executes, so the failure
#        surfaces in CardRepositoryIT and nowhere else.
#     6. Disagreeing schema resolution. A mapping failure occurs if
#        spring.jpa.properties.hibernate.default_schema and the pool's search
#        path name different schemas, because the provider qualifies its
#        generated SQL from its own setting rather than from the connection.
#        Both are set below, to the same schema, for that reason.
# =============================================================================

# Assumptions: the base file permits a profile to differ in four things only --
#   log levels, connection-pool sizing, actuator exposure breadth and the Flyway
#   clean flag -- and forbids differing in service topology, route structure,
#   schema ownership, identity mechanism, transport usage or datastore type,
#   because topology that varies by environment cannot be verified in one and
#   then trusted in another. This profile holds to that: the same single card
#   schema, the same JWT resource server, the same absence of any queue, the
#   same PostgreSQL.
# Trade-offs: four value overrides sit OUTSIDE those four permitted axes, and
#   they are counted here rather than glossed. server.ssl.enabled and
#   spring.datasource.hikari.data-source-properties.sslmode are the difference
#   between a test that can open a connection at all and one that cannot;
#   spring.flyway.create-schemas is the difference between a migration that can
#   run and one that cannot; and the resource-server issuer is the only key of
#   the four whose value every profile already supplies differently by design,
#   since the base file leaves it a platform-injected placeholder, so a stub
#   fills an injection point rather than moving an axis. Each is argued at the
#   property it governs.

server:
  ssl:
    # LOAD-BEARING. Without this line a context that starts a real listener
    # fails at startup because it cannot open a keystore.
    #
    # Refactoring Rationale: this note used to say the failure is a
    #   `FileNotFoundException` naming the literal placeholder text
    #   `${SERVER_SSL_CERTIFICATE}`, because the base file read PEM content from
    #   two unresolvable placeholders. Both properties are gone. The base file now
    #   reads a PKCS#12 keystore that the IMAGE ENTRY POINT mints per task
    #   (config/docker/generate-listener-material.sh), and a test runs no entry
    #   point, so no keystore exists and `server.ssl.key-store-password` -- which
    #   deliberately carries no fallback -- resolves to nothing. The override is
    #   still load-bearing; only the shape of the failure changed.
    #
    # Assumptions: the base file enables TLS on purpose and gives its password
    #   placeholder no fallback, so a deployment cannot come up in cleartext by
    #   accident. A mock MVC slice constructs no listener, so this setting is inert
    #   for a @WebMvcTest class and matters to any test that asks for a real port.
    #
    # Trade-offs: the inbound hop is cleartext in a test, and that gives up nothing
    #   this profile could otherwise have. The property exists in the base to keep
    #   encryption from stopping at the load balancer; in a test there is no load
    #   balancer and both ends of the hop are the same machine. Alternatives
    #   Considered: running the entry point, or committing a throwaway keystore.
    #   The first makes every test depend on `keytool` and on a writable path; the
    #   second puts private-key material in the repository to encrypt a hop that
    #   carries no traffic.
    enabled: false

spring:

  # Alternatives Considered: no connection literal of any kind appears in this
  #   profile -- no url, no username, no credential. CardRepositoryIT registers
  #   all three through @DynamicPropertySource, reading them from the
  #   PostgreSQLContainer it started, which contributes a property source
  #   ranking above this file so the base file's unresolved placeholders are
  #   never consulted. A literal was rejected twice over: the container's host
  #   port is assigned when it starts, so a literal either points at nothing
  #   or, on a developer machine, at whatever real database happens to be
  #   listening on the port that was guessed.
  #
  # Assumptions: @DynamicPropertySource is named rather than @ServiceConnection
  #   because of this module's classpath, not a preference. @ServiceConnection
  #   comes from org.springframework.boot:spring-boot-testcontainers, which
  #   services/card-service/pom.xml does NOT declare -- it declares
  #   org.testcontainers:testcontainers-postgresql and
  #   testcontainers-junit-jupiter only. Two sibling modules do declare it and
  #   their test profiles are written against the annotation it supplies, so a
  #   reader arriving from one of those files would otherwise expect a mechanism
  #   that cannot resolve here.
  #
  # Alternatives Considered: an in-memory substitute such as H2 was rejected.
  #   V1__card.sql declares a fixed-width CHAR(16) primary key, a BYTEA column
  #   for the encrypted card verification value, a NAMED check constraint
  #   restricting the active status to Y or N, and a NON-UNIQUE index on the
  #   account identifier. The repository test has to establish partly the
  #   REJECTION the constraint performs and partly which index the planner
  #   chooses for a keyset page; a substitute would either fail to parse that
  #   DDL or accept a value PostgreSQL refuses, making the test green exactly
  #   where it is meant to be load-bearing. The accepted cost is a container
  #   start on every integration run.
  datasource:
    hikari:

      # LOAD-BEARING, together with hibernate.default_schema further down.
      #
      # Assumptions: this restates the base value because in this profile it is
      #   the only mechanism left that pins the search path on the connection. A
      #   pool initialisation statement is independent of how the connection
      #   string arrived, which is why it survives here: the string is generated
      #   by the container and this file never sees it.
      #
      # Alternatives Considered: appending a schema parameter to the connection
      #   string, the more usual way to do this. It is unavailable here because
      #   this profile does not compose the string at all, so the parameter
      #   would have to be appended by the test class, splitting one pin across
      #   a resource and a Java file where either half could move alone.
      #
      # Assumptions: this runs safely before the schema exists, because
      #   PostgreSQL resolves search-path names lazily rather than validating
      #   them, so the statement succeeds on a bare container and Flyway then
      #   creates the schema and migrates into it. The failure the pin prevents
      #   is the worse of two: without it an unqualified table name either fails
      #   to resolve, or silently resolves against `public`, so the test reads a
      #   table the migration never built and passes while establishing nothing.
      connection-init-sql: SET search_path TO card

      # LOAD-BEARING. Without this override every connection fails with
      # `PSQLException: The server does not support SSL.`
      #
      # Assumptions: the base file requires the driver's strictest mode, which
      #   verifies both the certificate chain and the host name, paired with a
      #   trust bundle that exists in the service image. A container built from
      #   the stock image is built with the capability but starts with no
      #   certificate and no key, so it refuses the negotiation outright rather
      #   than falling back. The base value therefore cannot open a connection
      #   here at all.
      #
      # Alternatives Considered: the driver's opportunistic mode, which
      #   negotiates when the server offers and falls back silently when it does
      #   not. It would connect, but it makes the transport depend on whether
      #   the image in use happens to have been started with a certificate, so
      #   the same test could run encrypted on one image and in cleartext on
      #   another with nothing in the repository having changed -- and because
      #   that mode verifies nothing, the encrypted case would carry no
      #   guarantee to show for the inconsistency. Issuing a certificate for the
      #   container was also rejected: it would add key material and a trust
      #   anchor to the repository to verify an identity the test itself minted.
      data-source-properties:
        sslmode: disable

      # Trade-offs: the ceiling is narrower than the base file's ten and the
      #   floor is zero rather than two, both values on the pool sizing axis a
      #   profile may move. A test run holds several pools at once, because
      #   Surefire and Failsafe fork per module and a container's own connection
      #   ceiling is shared across them; and an idle floor opens connections a
      #   context which never issues a query would never use, which also
      #   lengthens teardown. The accepted cost is that a test needing more than
      #   four concurrent connections waits rather than opening a fifth. No test
      #   in this module issues concurrent queries, and the base file's
      #   connection timeout bounds that wait rather than letting it hang.
      maximum-pool-size: 4
      minimum-idle: 0

  jpa:
    hibernate:
      # Assumptions: this restates the base value, and the restatement is the
      #   point -- this profile is the only place in the build where the
      #   migration actually executes, so the question of who owns the schema is
      #   live here in a way it is not anywhere else. The answer is Flyway,
      #   alone: the provider emits no DDL.
      #
      # Alternatives Considered: generation, through `create`, `create-drop` or
      #   `update`. Rejected outright. Any of the three would make the schema
      #   under test the provider's inference rather than the migration's
      #   output, so a defect in V1__card.sql would still produce a green run
      #   and the migration would stop being tested by the only test that tests
      #   it. Generation also cannot express four things the migration states,
      #   each from the REFERENCE ONLY baseline rather than from taste: the
      #   fixed-width CHAR(16) primary key that app/cpy/CVACT02Y.cpy line 5
      #   fixes as CARD-NUM PIC X(16); the named CHECK constraint restricting
      #   the active status to Y or N; the BYTEA column holding the encrypted
      #   card verification value, whose source field at line 7 is CARD-CVV-CD
      #   PIC 9(03) and would otherwise be inferred as a numeric column storing
      #   the value in the clear; and the non-unique index on the account
      #   identifier that carries the browse path the baseline served through an
      #   alternate index.
      #
      # Alternatives Considered: `validate`, which all three sibling test
      #   profiles in this build set, so expecting it here is reasonable. It is
      #   stricter than `none` rather than weaker -- it emits no DDL either and
      #   additionally asserts at startup that every mapped entity matches the
      #   schema the migration produced. It is not taken here for a reason
      #   specific to this module's primary key: a String field maps to a
      #   variable-width column by default, whereas this table's key is CHAR(16)
      #   because the baseline record is fixed width, and the validator compares
      #   the JDBC type code rather than the width alone -- so it reports a
      #   mismatch against a schema that is in fact correct unless the entity
      #   declares the fixed-width type explicitly.
      # WHY : Trade-offs: holding this at `none` means a failing card repository
      #       test always indicates a query or a data defect and never the
      #       validator's opinion about a column type, which is what makes the
      #       failure attributable. The cost is accepted rather than denied:
      #       entity-to-migration drift is not detected by this profile, so it
      #       has to be caught by the assertions in CardRepositoryIT, which read
      #       and write through the migrated table and therefore fail on a
      #       column that is missing or wrongly typed.
      ddl-auto: none

    # Assumptions: this restates the base value because a repository test must
    #   not lean on a persistence session that outlives its transaction. Left at
    #   the permissive default, a lazy association touched outside a transaction
    #   resolves quietly by opening another query on a still-open session, and
    #   the same code then fails in a deployed service where no view-scoped
    #   session exists.
    #
    # Trade-offs: lazy access outside a transaction now throws inside the test,
    #   which costs an explicit fetch for every association a test needs. That
    #   is the desired signal rather than a cost to be avoided -- the throw is
    #   what makes the test agree with the deployed service.
    open-in-view: false

    properties:
      hibernate:
        # LOAD-BEARING, together with spring.flyway.default-schema below.
        #
        # Assumptions: the provider qualifies its generated SQL from this
        #   setting rather than from the connection's search path, so the pin on
        #   the pool above does not cover it and the two are stated together
        #   rather than one being inferred from the other. Naming different
        #   schemas in the two places is failure mode 6 in the header.
        #
        # Trade-offs: two properties are carried where a reader might take one
        #   for redundant inheritance. That is accepted in exchange for removing
        #   a failure mode in which the test's verdict has nothing to do with
        #   the code under test, because it read a table in `public` that no
        #   migration built.
        default_schema: card

  # Assumptions: this block restates four base values and inverts a fifth. The
  #   restatements are here rather than inherited because this profile is the
  #   ONLY place in the build where a migration actually runs, so a reader
  #   debugging a migration failure needs the switch, the source location and
  #   the target schema visible in the file that runs it.
  #
  # Assumptions: spring.flyway.clean-disabled is deliberately NOT set here. That
  #   flag belongs to application-prod.yml, the only file in this module that
  #   defines it and where destroying a schema must be impossible. No test in
  #   this module invokes clean, and each test reaches a container that is
  #   discarded when the run ends, so the flag would have no effect here in
  #   either position.
  flyway:

    # Assumptions: migration runs in-process during startup, before the JPA
    #   EntityManagerFactory is built, so the table exists by the time anything
    #   maps it. That ordering is what makes a repository test possible at all:
    #   applying migrations from a separate step would let the context start
    #   against a schema that has no table in it yet.
    enabled: true

    # Assumptions: this location resolves inside this module's own build output,
    #   which is what makes the migration travel with the code that maps it. It
    #   is restated because it answers the first question a migration failure
    #   raises -- which file ran -- and because the directory holds exactly one
    #   migration, V1__card.sql. There is no V2 here: the reference data seed
    #   belongs to reference-service, which owns the lookup data.
    locations: classpath:db/migration

    # Assumptions: card is the only schema this module touches and it holds
    #   exactly one table, because app/cpy/CVACT02Y.cpy is the only record this
    #   bounded context owns. The two keys name the same schema while doing
    #   different jobs, and both are stated rather than one left to follow the
    #   other: the first is the set the migrator may manage and therefore
    #   create, the second is where the migration history table is placed.
    #   Setting only the first would let the history table land in whatever
    #   schema the connection resolved to -- on a container whose search path
    #   had not been pinned, `public` -- putting this context's migration state
    #   outside the one schema it owns.
    schemas: card
    default-schema: card

    # LOAD-BEARING, and the single most important line in this file. Without
    # this override Flyway cannot migrate at all and startup aborts with
    # `schema "card" does not exist`.
    #
    # Assumptions: this INVERTS the base value, which is false, and every link
    #   of the reasoning is checkable. V1__card.sql creates objects INSIDE the
    #   schema -- its statement is CREATE TABLE card.cards, schema-qualified --
    #   and contains no CREATE SCHEMA, no CREATE ROLE and no GRANT. The
    #   authority that does create the schema, its owning role and its grants is
    #   data-migration/sql/V0__schemas_and_roles.sql, which lives outside this
    #   module's classpath, so the locations key above cannot apply it. And a
    #   PostgreSQL container started from the stock image ships with `public`
    #   and nothing else. Together those mean the schema does not exist unless
    #   this profile makes it exist.
    #
    # Alternatives Considered: letting this module's own migration create what
    #   it needs. Rejected outright: it would move CREATE SCHEMA, CREATE ROLE
    #   and GRANT -- privileged, cluster-wide statements -- into a per-service
    #   migration, which is the coupling schema-per-service exists to prevent,
    #   and it would then run in deployed environments too, where the base file
    #   sets this false precisely so a missing bootstrap fails loudly instead of
    #   being papered over by a differently-owned schema.
    #
    # Trade-offs: a schema created here is owned by whichever role the container
    #   connected as and carries none of the privileges V0 grants, so this
    #   profile exercises the TABLE and its constraints and not the privilege
    #   graph around it. A defect reachable only through a grant is invisible to
    #   every test in this module and belongs to a test run against a
    #   provisioned environment. Reproducing V0 here was rejected on the same
    #   ground as above: it would duplicate cluster-wide privileged DDL into a
    #   per-service test resource, where it would drift from its authority.
    create-schemas: true

    # Assumptions: false is stated explicitly rather than left to the default
    #   because the failure it prevents is silent, and one local practice makes
    #   that failure reachable. A developer may enable container reuse to
    #   shorten a run, at which point a database can survive into a later run
    #   already holding card.cards. Were this true, a schema holding objects but
    #   no history table would be marked already-migrated, V1__card.sql would
    #   never run, and a table missing the named check constraint or carrying a
    #   variable-width key where CHAR(16) is required would pass startup
    #   unnoticed and diverge later, inside comparisons.
    baseline-on-migrate: false

    # Assumptions: `user` and `password` are deliberately ABSENT here while
    #   application.yml binds both to SPRING_FLYWAY_* with no fallback, and the
    #   absence resolves rather than conflicts. Boot only reads those two keys
    #   through PropertiesFlywayConnectionDetails, which
    #   FlywayAutoConfiguration creates @ConditionalOnMissingBean
    #   (FlywayConnectionDetails.class). The container below carries
    #   @ServiceConnection, whose JdbcConnectionDetails is adapted into a
    #   FlywayConnectionDetails bean by
    #   JdbcAdaptingFlywayConnectionDetailsFactory -- measured, not assumed: with
    #   the keys added and no SPRING_FLYWAY_USER in the environment, the context
    #   reached Flyway and failed on the SQL below rather than on an unresolved
    #   placeholder. So the container's own generated credential migrates here,
    #   and no stand-in credential has to be invented for a role this profile
    #   never creates with a password.
    #
    # Refactoring Rationale: `init-sqls` IS restated, and it has to be. The base
    #   file's single statement is `SET ROLE carddemo_card_owner`, naming the
    #   NOLOGIN role data-migration/sql/V0__schemas_and_roles.sql creates and this
    #   container has never heard of; left inherited, every test in the four
    #   *RepositoryIT classes failed context load with
    #   `role "carddemo_card_owner" does not exist`.
    #
    # Alternatives Considered: overriding this to an empty list, or to a no-op
    #   statement, so the ownership split simply does not happen under test.
    #   Rejected: it would leave the mechanism the deployed configuration depends
    #   on asserted by nothing, and the mechanism is the whole of the control --
    #   objects a migration creates must belong to the NOLOGIN owner, because every
    #   ALTER DEFAULT PRIVILEGES FOR ROLE clause in the bootstrap SQL is keyed on
    #   the CREATING role and is inert otherwise. The statements below reproduce it
    #   instead: the role is created if absent, granted CREATE on whichever
    #   database the container generated, and then assumed -- so Flyway creates the
    #   schema, the history table and every V1 object as carddemo_card_owner,
    #   exactly as it does in a deployed environment.
    #
    # Assumptions: the first statement is idempotent because Flyway runs every
    #   string here on EACH connection it opens, not once per migration. The role
    #   test and the grant are both re-runnable, and the grant is issued through
    #   `format` with `%I` on `current_database()` rather than a literal, because
    #   Testcontainers generates the database name and no fixed value would match
    #   it. CREATE on the database is required and is not implied by role
    #   creation: a fresh role holds only the PUBLIC grants, which are CONNECT and
    #   TEMPORARY, so without it `CREATE SCHEMA` fails once the SET ROLE takes
    #   effect.
    # Trade-offs: the container's user is a superuser and could therefore assume
    #   this role with no grant at all, which would make the GRANT look
    #   superfluous. It is kept because the grant is what the OWNER needs to create
    #   the schema, not what the connecting user needs to become it -- and
    #   `SET ROLE` drops the superuser attribute for the remainder of the session.
    init-sqls:
      - "DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'carddemo_card_owner') THEN CREATE ROLE carddemo_card_owner NOLOGIN; END IF; EXECUTE format('GRANT CREATE ON DATABASE %I TO carddemo_card_owner', current_database()); END $$;"
      - "SET ROLE carddemo_card_owner;"


  security:
    oauth2:
      resourceserver:
        jwt:
          # LOAD-BEARING. Without this line EVERY test that loads a Spring
          # context fails before any test method runs, with
          # PlaceholderResolutionException naming
          # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI.
          #
          # Assumptions: it is fatal rather than merely untidy because this
          #   property is read EAGERLY, which was verified against the pinned
          #   Spring Boot release rather than assumed. Most unresolved
          #   placeholders are tolerated in a test, because
          #   configuration-properties binding leaves one as a literal string
          #   instead of throwing. This one is read by the auto-configuration's
          #   own condition through Environment.getProperty, whose
          #   single-argument form resolves placeholders and throws on one it
          #   cannot resolve.
          #
          # Assumptions: a non-empty value here costs no network call at
          #   startup, likewise verified against the pinned release: the bean
          #   the issuer-location path contributes is a supplier-backed decoder,
          #   so discovery is deferred until a token is actually decoded. No
          #   test in this module decodes a real token -- the module declares
          #   spring-security-test so CardControllerTest can attach a
          #   pre-authenticated JWT through its request post-processor, which
          #   populates the security context directly and never invokes the
          #   decoder -- so discovery is never reached.
          #
          # Alternatives Considered: leaving the value EMPTY, which one sibling
          #   test profile does. An empty value makes the condition not match,
          #   so NO decoder bean is contributed and every context that
          #   configures a resource server has to supply a mock one. Rejected
          #   because it removes the filter chain from the thing under test: the
          #   chain that maps a group claim onto authorities through
          #   common-lib's converter would no longer be exercised, and
          #   CardControllerTest's whole claim is the split between an
          #   administrative caller and an ordinary one on the card-detail
          #   route -- the one route that returns an unmasked primary account
          #   number. An assertion that passes because no chain ran is worse
          #   than no assertion, because it reads as coverage.
          #
          # Alternatives Considered: pointing at a key set instead of an issuer.
          #   Rejected because it names key material this repository must not
          #   carry, and it removes no startup cost: it fetches the key set
          #   during refresh exactly as the issuer form fetches the provider
          #   document. Supplying a local public key was also rejected: it needs
          #   a key file committed beside this one.
          #
          # Refactoring Rationale: this note previously said the key-set path was
          #   eager on a "harder ground" than the issuer path, implying the
          #   issuer path was not. That contrast was wrong, and the correction
          #   comes from running the process rather than from re-reading the API.
          #   NimbusJwtDecoder.withIssuerLocation defers nothing: build() calls
          #   processor(), which calls jwkSource(), which invokes the supplier
          #   that issues GET <issuer>/.well-known/openid-configuration. A
          #   context that creates a decoder bean therefore attempts that request
          #   while it refreshes, and against this issuer it fails with
          #   UnknownHostException naming the host. That is true of the
          #   auto-configured decoder and of the explicit one
          #   config/SecurityConfig.java now declares.
          #
          # Trade-offs: the consequence is stated plainly so a test author is not
          #   surprised by it. This value satisfies that class's fallback-free
          #   @Value, so every test that does NOT load a Spring context runs
          #   against the deployed property shape; a test that DOES load one must
          #   register a reachable stub issuer through dynamic properties,
          #   exactly as it already registers the container-generated datasource
          #   triple. Keeping an unreachable `.invalid` value rather than a
          #   plausible-looking host stays deliberate: RFC 2606 reserves it, so
          #   the failure is immediate and local, no unit test can reach a real
          #   provider, and no user pool, account, region or live endpoint is
          #   named or implied.
          #
          # Trade-offs: this verifies the shape of the chain and the
          #   authority-mapping path, NOT signature verification, because no key
          #   material backs a stub issuer. Real signature verification needs a
          #   live provider and belongs to a test run against a provisioned
          #   environment; accepting that boundary is what keeps this module's
          #   tests runnable with no network and no cloud account.
          issuer-uri: https://issuer.invalid/carddemo-card-test

management:
  endpoints:
    web:
      exposure:
        # Assumptions: health is retained because GET /actuator/health is polled
        #   by two components that cannot present a token -- the load balancer
        #   target group, which decides whether a task receives traffic, and the
        #   health-check instruction in services/card-service/Dockerfile, which
        #   decides whether the container is alive. Dropping it would let this
        #   profile's actuator surface differ from the one both depend on, so a
        #   regression on that path could pass here and fail at deployment.
        #
        # Trade-offs: the two other endpoints the base file publishes, the build
        #   identifier and the metrics scrape path, are dropped rather than
        #   carried forward. No test in this module reads either, and exposure
        #   breadth is one of the four axes a profile may move. The accepted
        #   cost is that a test wanting to assert on a meter has to add the
        #   endpoint back deliberately, which is the intended friction.
        include: health

logging:
  # Trade-offs: the root logger drops below the base file's level so a passing
  #   run is quiet and a failing one is readable. The cost is that diagnosing a
  #   failure takes a deliberate override, which is accepted because the
  #   alternative is thousands of framework lines per context start obscuring
  #   the assertion that failed.
  # Trade-offs: this module's own package is deliberately NOT dropped with the
  #   root. It carries the validation chain transcribed from app/cbl/COCRDUPC.cbl
  #   and the keyset decisions transcribed from app/cbl/COCRDLIC.cbl, which is
  #   the output that tells a reader WHICH branch a failing assertion took.
  # Assumptions: the migration logger is likewise held up rather than quieted.
  #   Its output is the only direct evidence that the schema was created and
  #   that V1 applied to card rather than somewhere else -- precisely the
  #   failure the create-schemas and default-schema settings above prevent.
  # Assumptions: the last two loggers are pinned and must NOT be lowered by this
  #   or any other profile, for a reason that is not the reason for the quiet
  #   default. At debug level they emit card numbers -- the statement logger in
  #   its predicates and the bind logger as parameter values. That is the one
  #   class of data this context must keep out of log storage, because the
  #   masking applied at the API edge does not reach a log file. Holding them at
  #   warn rather than off keeps a genuine binding failure reportable, since
  #   that message carries the failure without carrying the parameter values.
  # Assumptions: the bind logger's name belongs to the current persistence
  #   provider's package layout and is not the pre-6.x spelling; a stale name
  #   would bind to nothing and would look like a control while being none.
  level:
    root: WARN
    com.carddemo: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

carddemo:
  security:
    jwt:
      # WHY : (1) Refactoring Rationale: this block did not exist while the base
      #       file's three carddemo.security.jwt keys had no reader. They have one
      #       now: config/SecurityConfig.java declares an explicit JwtDecoder bean
      #       and takes all three through @Value, so the values are consumed by
      #       constructor injection rather than by configuration-property binding.
      #       That difference decides whether this profile needs the block at all.
      #       Property binding leaves an unresolvable placeholder as literal text
      #       and does not raise, which is why the base file's datasource
      #       placeholders can stay unset here; @Value calls
      #       resolveRequiredPlaceholders, which DOES raise, so the base value
      #       ${CARDDEMO_SECURITY_JWT_EXPECTED_CLIENT_ID} aborts bean creation on
      #       any host that does not set that variable - which is every build host.
      #       Without this block, every context-loading test in this module fails
      #       before its first assertion.
      #       (2) Assumptions: on this module the check the value enables is the one
      #       that matters most in the whole reactor. The administrative
      #       card-detail route is the single endpoint in the system that returns an
      #       UNMASKED primary account number, and it is guarded by the
      #       carddemo-admin authority that common-lib's JwtRoleConverter derives
      #       from a token's group claim. A Cognito user pool mints an identity token
      #       and an access token from the same signing key, and both validate
      #       against the configured issuer, so without the token-use and client
      #       checks an identity token - the one a browser most readily holds - would
      #       reach the converter and could carry that group. A test profile that
      #       omitted this block would not merely fail to start; if a later reader
      #       "fixed" the failure by defaulting the value to blank, the validator
      #       would treat the client check as skipped and the suite would then pass
      #       while proving the opposite of what it asserts.
      #       (3) Assumptions: this string is NOT a credential and NOT a secret. A
      #       Cognito app client id is a public identifier carried in every token
      #       this service accepts; the value below is additionally fabricated and
      #       visibly non-production, so it identifies nothing that exists. What it
      #       buys is that CognitoAccessTokenValidator is CONSTRUCTED with a
      #       non-blank client id, so a test asserting that a token minted for a
      #       different client of the same pool is rejected has a client to differ
      #       from.
      #       (4) Trade-offs: the two adjacent claim values are repeated rather than
      #       inherited so the complete accepted-token contract is readable in one
      #       place. The cost is that a deliberate change to either in the base file
      #       must be mirrored here or the suite stops exercising the deployed
      #       contract. The two carddemo.security.cognito group names are NOT
      #       repeated, because the base declares each with the default
      #       infra/modules/cognito fixes and both therefore resolve with no
      #       environment at all - and because JwtRoleConverter compares them
      #       against its own compiled constants and refuses to start on a mismatch,
      #       so overriding them here would test a vocabulary no deployment uses.
      expected-client-id: card-test-app-client
      expected-token-use: access
      required-scope: aws.cognito.signin.user.admin

    # WHY : (1) Assumptions: present here for exactly the reason the block above is.
    #       com.carddemo.card.service.CardVerificationValueCipher takes this value
    #       through @Value, which calls resolveRequiredPlaceholders and RAISES on an
    #       unresolved placeholder - so the base file's
    #       ${CARDDEMO_SECURITY_CVV_KEY_ID} would abort bean creation on every build
    #       host, none of which sets that variable. Without this key every
    #       context-loading test in this module fails before its first assertion.
    #       (2) Assumptions: this is NOT a credential and NOT a secret. A
    #       key-management alias is a public name; the value below is additionally
    #       fabricated and visibly non-production, so it identifies no key that
    #       exists. What it buys is that the cipher is CONSTRUCTED with a non-blank
    #       identifier, which is what its own blank-value refusal has to differ from.
    #       (3) Assumptions: no test reaches a real key through it. The cipher's own
    #       tests hand it a mocked key-management client, so the identifier travels
    #       into a request that is captured and asserted rather than sent - which is
    #       why a fabricated alias is sufficient and a real one would be worse,
    #       coupling the suite to an account.
    cvv:
      key-id: alias/carddemo-card-cvv-test


# =============================================================================
# Register of deliberate absences
# -----------------------------------------------------------------------------
#   1. server.port
#      Assumptions: the base file fixes 8080 and three artifacts outside it
#      agree on that number -- this service's Dockerfile exposes it, the load
#      balancer target group registers each task on it, and the security-group
#      design admits application traffic on it alone. A mock MVC slice binds no
#      port, and the repository test reaches its database rather than being
#      reached over HTTP, so moving it here would change a number three unseen
#      artifacts depend on in order to affect nothing that runs.
#
#   2. spring.flyway.clean-disabled -- argued at the Flyway block above; it
#      belongs to application-prod.yml, the sole file in this module defining it.
#
#   3. spring.datasource.url, spring.datasource.username and the credential --
#      argued at the datasource block above. The rule against a committed
#      credential is structural here rather than a matter of review: there is no
#      connection literal to redact, since the values arrive at run time.
#
#   4. spring.application.name and the Micrometer tag keys
#      Assumptions: the base file sets the name and derives the metric service
#      tag from that property rather than repeating the literal, so the two
#      cannot drift; the environment and version tags come from
#      carddemo-common-defaults.yml in common-lib, each with a fallback that is
#      deliberately not the name of any real environment. Metrics are
#      inherited, not configured.
#
#   5. Every messaging and batch property
#      Assumptions: this bounded context has neither. It consumes no queue,
#      registers no listener, constructs no cloud client and runs no batch job;
#      services/card-service/pom.xml declares no messaging artifact and no batch
#      starter. A sibling reference context does stub queue names in its own
#      test profile, which is why the absence is stated rather than left to be
#      noticed: an added key with no artifact behind it is silently ignored,
#      which would describe a transport this service does not use.
#
#   6. Any page-size, page-number or offset property
#      Assumptions: the card list's page size is SEVEN and it is a baseline
#      contract rather than something to tune -- app/cbl/COCRDLIC.cbl lines 177
#      and 178 declare WS-MAX-SCREEN-LINES with VALUE 7, and the base file
#      already carries that number. Overriding it here would let a test assert
#      a page boundary the deployed service does not have. Offset paging is
#      rejected outright rather than merely unconfigured: under concurrent
#      inserts it skips and repeats rows, which the baseline's browse-by-key
#      does not, so it would change observable behaviour.
#
#   7. carddemo.security.jwt.expected-client-id
#      Assumptions: the base file leaves the client identifier a placeholder
#      injected by the platform. It is absent rather than stubbed because the
#      resource-server auto-configuration this profile activates reads only the
#      issuer, and configuration-properties binding tolerates an unresolved
#      placeholder by leaving it a literal string, so a context starts with it
#      unset. That was confirmed by starting a context with the variable absent
#      rather than reasoned about, since the same tolerance does not apply to
#      the issuer above.
#      Trade-offs: a component that read it eagerly would fail the way an absent
#      issuer does, and the resolution then is a non-credential stub for an
#      IDENTIFIER and never for a credential. That boundary is what this
#      register holds: an identifier may be stubbed, a confidential value may
#      not, and neither may be shaped so that a reader or a scanner has to treat
#      it as real.
#
#   8. The springdoc keys
#      Assumptions: the base file publishes a generated contract so it can be
#      compared against the hand-authored one. No test in this module fetches
#      either document, so the comparison is a build-level concern and enabling
#      the endpoint here would serve a document no assertion reads.
#
#   9. A threshold for the security logger
#      Assumptions: the base file declares five logger thresholds and the
#      security logger is not among them, so setting one here would introduce a
#      key the base does not own -- and this profile overrides values on existing
#      keys rather than adding keys. It is also redundant: root is warn above,
#      and the security logger resolves to warn by logger hierarchy.
#      Alternatives Considered: pinning it anyway as a protective floor, so an
#      explicit warn would hold the security logger down if some later profile
#      raised root to debug and put token claims into log output. Rejected
#      because it buys that protection by breaking the one invariant this file is
#      held to, while leaving the same exposure open on every logger nobody
#      thought to pin. If a profile ever does raise root to debug, the pin
#      belongs in that profile beside the change that needs it.
#
#  10. Any oracle claim
#      Assumptions: this is not a property, and it is registered because it is
#      the assumption most likely to be added by mistake. NO golden-master
#      oracle exists for any path in this module. The COBOL parity suite under
#      tests records at lines 83 to 85 of its README.md that the online CICS
#      programs cannot run end to end without a CICS runtime, which the runner
#      does not provide; all three card programs are online, none is batch, and
#      that suite's golden masters cover the batch flows. Parity for this module
#      therefore rests on rules transcribed from the sources cited above, not on
#      a byte comparison, and no setting in this file should be described as
#      enabling one. That suite is REFERENCE and is neither modified nor
#      re-pinned by anything here.
# =============================================================================
