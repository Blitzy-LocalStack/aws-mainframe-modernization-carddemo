              value:
                code: CARDDEMO-0400
                secondaryCode: ''
                message: Card Active Status must be Y or N
                severity: WARNING
                subsystem: APPLICATION
                status: 400
                correlationId: 2b7a91d0-55e4-4f0a-8c31-d90b6e1a7c58
                path: /api/v1/cards/************0011
                timestamp: '2026-08-05 09:15:02.117640'
                fieldErrors:
