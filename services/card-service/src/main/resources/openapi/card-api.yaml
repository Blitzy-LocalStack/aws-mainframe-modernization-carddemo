# =============================================================================
# services/card-service/src/main/resources/openapi/card-api.yaml
# -----------------------------------------------------------------------------
# Purpose:
#   The hand-authored OpenAPI 3.1 contract of record for the card bounded
#   context. It settles, for the five synchronous operations this service
#   exposes, the paths, the operation identifiers, the parameter and property
#   names, the response shapes and the error vocabulary. Every other tree that
#   touches this context is written against this document rather than against a
#   reading of the baseline. Landed at this checkpoint: the browser client at
#   ui/src/api/cards.ts, which declares CardSummary, CardDetail and the seven-member
#   page envelope from the schemas below, and the assertions at
#   services/card-service/src/test/java/com/carddemo/card/config/CardApiContractTest.java,
#   which hold this document and SecurityConfig to each other. Planned and NOT yet
#   authored: the shared client type module ui/src/api/types.ts, and the
#   controllers, request and response shapes and mapper of this module - so no
#   Java type in this module implements the document yet, and the reader should
#   not expect to find one.
#
#   The document the springdoc library generates from those controllers at
#   run time is therefore not a second source of truth - it is a check on this
#   one. The two must agree, and a difference between them is a defect in
#   whichever side drifted rather than a formatting artifact to be tolerated.
#   That relationship is already recorded on the springdoc keys that publish
#   the generated document, at application.yml:719-729, and the specification
#   version those keys pin (openapi_3_1, application.yml:755) is the version
#   declared below.
#
#   Field names, widths and value domains are not derived here. The persistent
#   shape is settled by db/migration/V1__card.sql, whose own header at :16-20
#   names this contract as an obligated mirror of it, and that migration in
#   turn derives every column from app/cpy/CVACT02Y.cpy. The chain is
#   deliberately one-directional so that one reading of the card record
#   exists rather than five.
#
# Parameters:
#   Requests carry four kinds of input, and every one of them is described
#   at the point it is declared rather than only here.
#
#   - A path parameter: the twenty-two-character opaque selector identifying one
#     card, declared once at components/parameters/OpaqueCardIdPath and
#     referenced by the three operations addressing a single card. It is NOT the
#     card number; no card number appears in any path in this document.
#   - Query parameters: the one optional list filter, accountId, and the two
#     paging inputs, cursor and direction. All three are declared under
#     components/parameters. The card-number filter of the baseline screen is
#     deliberately NOT among them: it travels in the lookup operation's request
#     body instead, because a query string is part of the request line and would
#     carry a full account number into history and access logs.
#   - A request header: X-Correlation-Id, optional on every operation, declared
#     once at components/parameters/CorrelationIdHeader.
#   - Two request bodies: CardUpdateRequest, carried by the update operation, and
#     CardLookupRequest, carried by the lookup operation.
#
#   The number of rows a full page carries is NOT among them. It is settled
#   server-side at seven by carddemo.card.list.page-size (application.yml),
#   which carries across WS-MAX-SCREEN-LINES PIC S9(4) COMP VALUE 7 at
#   app/cbl/COCRDLIC.cbl:177-178. A client cannot vary it.
#
# Return values:
#   - CardPage, from the list and lookup operations: one page of CardSummary rows
#     with the
#     sealed cursor tokens and the two availability indicators needed to walk
#     the ordered set by key.
#   - CardDetail, from the non-administrative read and from a successful update:
#     the full state of one card with the account number masked, and with no
#     member able to carry it unmasked.
#   - AdminCardDetail, from the administrative read alone: that same core plus
#     the full sixteen-digit account number. The full number exists on this one
#     schema and nowhere else in this document.
#   - ApiError, from every failure, described under components/schemas and
#     single-sourced from the shared kernel rather than redeclared here.
#
#   Every response, successful or not, carries the X-Correlation-Id header
#   declared once at components/headers/XCorrelationId.
#
# Exceptions or errors:
#   Six failure responses are declared, each as a reusable entry under
#   components/responses so that every operation references one definition.
#
#   - 400 the request itself is not acceptable: a malformed identifier, a
#     filter of the wrong width, an unreadable cursor, or a body failing
#     field validation. Carries the per-field array.
#   - 401 no usable bearer token was presented.
#   - 403 a valid token was presented that does not carry the authority the
#     operation requires.
#   - 404 no card exists for the identifier supplied.
#   - 409 the update could not be applied against the persisted state. Three
#     distinct conditions reach it and are never merged; each carries its own
#     machine identity and its own message, reproduced character for
#     character from app/cbl/COCRDUPC.cbl:205-210.
#   - 500 the operation failed for a reason the caller cannot correct. Declared
#     on every operation because the shared advice in the kernel assembles a
#     body of this shape for any failure it did not classify, so a client that
#     had not been told to expect it would meet an undeclared response on the
#     one occasion it most needs a documented shape to parse.
#
#   Nothing here surfaces a credential, a connection string, a stack trace, a
#   database vendor code or a CICS response code. The baseline's condition-code
#   rubric is likewise not imported into HTTP status semantics: the two
#   vocabularies mean different things and conflating them would misreport
#   both.
#
# WHY (non-obvious design decisions):
#   1. Assumptions: paths are absolute from the server root and carry an
#      explicit /api/v1 prefix. No servlet context path exists to prepend -
#      application.yml declares server.port and the actuator base path and
#      nothing else - so a relative assumption would silently resolve
#      differently once the service sits behind a gateway.
#   2. Alternatives Considered: the actuator health endpoint is deliberately
#      NOT declared. It is contributed by the framework, configured in
#      application.yml and application-prod.yml, and consumed by the load
#      balancer target group and the container health check. Declaring it
#      here would create a second, hand-maintained description of an endpoint
#      this file does not own, and the two would drift apart with no build
#      step to notice.
#   3. Trade-offs: exactly one server entry is declared, and it is a relative
#      URL. Naming a resolvable host would put a deployment endpoint in
#      version control, which the migration forbids because no service may
#      hard-code an endpoint; the cost is that a reader cannot learn the
#      environment's address from this document, which is the intended
#      outcome.
#   4. Assumptions: every operation is authenticated and none opts out. The
#      group claim carried in a signed token is the only source of identity
#      and authority; see the rationale on the security scheme below.
#   5. Trade-offs: only synchronous request and response operations appear.
#      This module's POM declares no batch starter and no queue client - the
#      omission is explained at services/card-service/pom.xml:520-525 - so a
#      callback, webhook or message-driven operation described here would
#      describe a capability the packaged service does not contain.
#   6. Refactoring Rationale: user-visible message text is reproduced
#      character for character, including punctuation and casing that is
#      inconsistent between neighbouring literals in the same baseline
#      program. Normalising it would change what an operator reads on screen,
#      which is observable behaviour and therefore outside what a structural
#      migration may alter.
#   7. Refactoring Rationale: this document and the browser client at
#      ui/src/api/cards.ts now describe ONE wire contract, and an earlier
#      revision of this file described a different one and recorded the
#      disagreement instead of ending it. That revision put the sixteen-digit
#      card number in the path where the client sent a twenty-two-character
#      opaque selector, and declared two cursor parameters where the client sent
#      one, then argued that the client was owned elsewhere and so the
#      difference could only be noted. The argument was wrong on both counts.
#      Nothing in this repository forbids editing that client - it is an
#      in-scope artifact of the same migration - and a query parameter is a
#      string on both sides, so neither a Java build nor a TypeScript build
#      could ever have reported the mismatch: it would have surfaced only as
#      400 responses at run time. Two of the three differences are resolved in
#      THIS document, because on both the client was right: a card number in a
#      path is written into gateway access logs, browser history and referrer
#      metadata, so the opaque selector is now the only selector here; and one
#      cursor parameter cannot name the wrong response member, so it is now the
#      only paging position here. The third is resolved in the client, which
#      gains the administrative operation's absence, the two list filters and
#      the four page members it was missing.
#   8. Assumptions: the authority each operation requires is a machine-readable
#      field on the operation, x-required-authority, and not prose. The
#      rationale for the field and for rejecting the security-scheme scope
#      alternative is recorded above x-authority-model below.
#
#   Every app/** path cited in this file is read and cited only. None is
#   modified. The baseline programs keep running: this contract adds a path,
#   it does not remove one.
#
#   Documentation convention: docs/CODE_DOCUMENTATION_STANDARD.md, whose YAML
#   section requires this framed header plus a labelled rationale placed
#   directly above the key it explains, and which records that no linter
#   inspects the documentation semantics of a YAML file. The obligation is
#   discharged by the four sections above and, below, by a non-empty
#   description on every path, operation, parameter, response and property
#   together with an adjacent rationale on every non-obvious choice, each
#   tagged with one of the four canonical categories.
# =============================================================================

openapi: 3.1.1

info:
  title: CardDemo Card Service API
  version: 1.0.0
  summary: >-
    Card list, card lookup, card detail and card update for the card bounded
    context of the migrated CardDemo credit-card management application.
  description: >-
    The card bounded context owns one table, card.cards, and exposes it through
    five synchronous operations that carry across three online baseline
    programs: the card list app/cbl/COCRDLIC.cbl, the card detail
    app/cbl/COCRDSLC.cbl and the card update app/cbl/COCRDUPC.cbl. Those three
    ran as CICS transactions CCLI, CCDL and CCUP respectively
    (app/csd/CARDDEMO.CSD:347-375) against the VSAM cluster defined at
    app/jcl/CARDFILE.jcl:50.


    Three structural transformations distinguish this contract from the screens
    it replaces. Session state is gone: the baseline was pseudo-conversational
    and carried identity, selection and navigation in a buffer the terminal
    echoed back, so every request here instead takes identity from a signed
    token and selection from an opaque selector in the request path. The
    four-verb VSAM browse
    becomes a single keyset-paginated query per request. And the record's
    before-image, which the update screen carried across the gap between
    screen turns, becomes one server-owned version token.


    Money does not appear in this context: card.cards holds no monetary
    column. Where a value elsewhere in the migrated system is monetary it is
    transported as a JSON string for the reason recorded on the accountId
    property below, and this service applies the same discipline to its
    identifiers.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

# WHY : Trade-offs: a single relative server entry, rather than a templated
#       host or a per-environment list. A relative URL resolves against
#       whatever origin served the document, so the same file is correct
#       behind the gateway, behind the internal load balancer and in a local
#       run, and it cannot carry a deployment address into version control.
#       The cost is that this document alone does not tell a reader which
#       environment it describes; that is deliberate, because the migration
#       requires that no service hard-code an endpoint and that no endpoint
#       reach the repository.
servers:
  - url: /
    description: >-
      The origin that served this document. Every path below is appended to it
      unchanged, so no host, port or environment name is recorded here.

# WHY : Assumptions: authorization is asserted at the document level and
#       inherited by all five operations, rather than repeated per operation
#       with the risk that one is forgotten. There is no unauthenticated
#       operation in this context and none may be added: a bearer requirement
#       omitted from a single operation is invisible in review, whereas a
#       document-level requirement has to be explicitly overridden to be lost.
security:
  - bearerAuth: []

# WHY : Refactoring Rationale: the authority each operation requires is declared
#       as a MACHINE-READABLE field on the operation, and an earlier revision of
#       this document declared it only in prose and in a tag name. Prose and tag
#       membership are not checkable: a reviewer could read that the
#       administrative read is restricted, and a generator or gateway could not,
#       so the restriction was indistinguishable from any other authenticated
#       route. Every operation below now carries x-required-authority, and
#       CardApiContractTest asserts that the value on each operation agrees with
#       the authority SecurityConfig enforces for the path it sits on, so the two
#       cannot drift apart while both continue to compile.
# WHY : Alternatives Considered: expressing the authority as a security-scheme
#       scope, by writing `security: [{bearerAuth: [carddemo-admin]}]` on the
#       administrative operation. Rejected because the specification requires the
#       scope list to be EMPTY for a scheme that is not oauth2 or openIdConnect,
#       and this scheme is `type: http`, so a populated list there is invalid and
#       a validating tool would either reject it or ignore it. Re-declaring the
#       scheme as oauth2 purely to gain a scope list was rejected in turn,
#       because these values are Cognito GROUP names carried in a cognito:groups
#       claim rather than OAuth scopes, and publishing them as scopes would state
#       something untrue about how the token is issued.
# WHY : Assumptions: the two admitted values are exactly the two group names the
#       shared token converter recognises, ADMIN_AUTHORITY and USER_AUTHORITY in
#       services/common-lib/src/main/java/com/carddemo/common/security/JwtRoleConverter.java,
#       which are the migrated form of the two SEC-USR-TYPE values 'A' and 'U' at
#       app/cpy/CSUSR01Y.cpy:22. carddemo-user on an operation means any
#       authenticated caller may reach it, because every user of this system
#       holds one of the two groups and an administrator is not denied a
#       cardholder operation; carddemo-admin means the administrative group is
#       required and a token carrying only carddemo-user receives 403.
x-authority-model:
  field: x-required-authority
  values:
    - carddemo-user
    - carddemo-admin
  enforcedBy: >-
    services/card-service/src/main/java/com/carddemo/card/config/SecurityConfig.java
  assertedBy: >-
    services/card-service/src/test/java/com/carddemo/card/config/CardApiContractTest.java

tags:
  - name: cards
    description: >-
      Operations a signed-in cardholder-facing caller may perform: listing
      cards by key, finding one by its number without placing that number in a
      URL, reading one card with the primary account number rendered to its last
      four digits, and updating the three editable fields. Each carries
      x-required-authority carddemo-user.
  - name: admin-cards
    description: >-
      Operations restricted to callers holding the administrative authority.
      They differ from the cards tag only in what they are permitted to
      render, never in what they may change. Each carries
      x-required-authority carddemo-admin.

paths:

  /api/v1/cards:

    description: >-
      The collection of cards this context owns, addressable only as a
      key-ordered sequence of pages. It carries one operation: no create,
      because a card comes into existence through the account and issuance path
      rather than through this context, and no collection-wide delete, because
      the baseline offered neither and card.cards is the system of record for
      every downstream authorization decision.

    get:
      operationId: listCards
      tags:
        - cards
      summary: List cards one page at a time, positioned by key
      description: >-
        Returns one page of cards in card-number order, optionally narrowed by
        account, together with the cursor tokens needed to request the page
        after or before it. This carries across the browse
        loop of app/cbl/COCRDLIC.cbl, whose start-browse at :1129-1136,
        read-forward at :1146, look-ahead read at :1197 and end-browse at
        :1258, and whose backward counterparts at :1273, :1294, :1322 and
        :1376, all collapse into this one request.


        Two behaviours are easy to assume wrongly and are stated here because
        a client that assumes otherwise will misreport an exhausted set. A
        page may carry fewer rows than a full page while further rows still
        exist, because the account filter is applied after each record is read
        rather than as part of the positioning: the baseline performs
        9500-FILTER-RECORDS from inside its read loop at
        app/cbl/COCRDLIC.cbl:1159, and the paragraph itself is at :1382. A
        short page therefore does not mean the end of the set, and only
        hasNext says whether more follow. Separately, a page reached by paging
        backward always reports that a further page exists, because a caller
        can only page backward from a page it reached by paging forward; the
        baseline states the same thing unconditionally at
        app/cbl/COCRDLIC.cbl:1287.
      x-required-authority: carddemo-user
      # WHY : Refactoring Rationale: the second filter field of the baseline
      #       screen -- the card number at app/cpy-bms/COCRDLI.CPY:72 -- is NOT a
      #       query parameter of this operation, and an earlier revision of this
      #       document declared it as one. A query string is part of the request
      #       line, so that revision put a full primary account number into every
      #       browser history entry, every referrer header and every access log
      #       the load balancer and the distribution write, none of which this
      #       service can redact. The filter itself is preserved, exactly, by the
      #       lookup operation below: because the card number is the unique
      #       primary key of card.cards, narrowing a list to one card number can
      #       return at most one row, so a body-carried lookup answering with this
      #       same page shape is the same observable behaviour with the number out
      #       of the request line.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/AccountIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PagingDirection'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: >-
            One page of cards, in card-number order. An exhausted or
            entirely-filtered page returns 200 with an empty items array and
            absent cursor tokens rather than 404, because a query that matched
            nothing succeeded.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cards/{opaqueCardId}:

    description: >-
      One card, addressed by its own primary account number. It carries the two
      operations a cardholder-facing caller may perform on a single card,
      reading it and changing its three editable attributes, and deliberately no
      delete: the baseline's card screens offer none, and card.cards is
      referenced by the transaction and authorization contexts, so removing a
      row would strand history that is still read.

    get:
      operationId: getCard
      tags:
        - cards
      summary: Read one card, primary account number rendered to its last four
      description: >-
        Returns the full state of one card, with the primary account number
        rendered as its last four digits behind a masking prefix. This carries
        across app/cbl/COCRDSLC.cbl, the card detail transaction CCDL defined
        at app/csd/CARDDEMO.CSD:347-348.


        The card verification value has no representation in the response, and
        none exists anywhere in this document; the rationale is recorded on
        the CardDetail schema.
      x-required-authority: carddemo-user
      parameters:
        - $ref: '#/components/parameters/OpaqueCardIdPath'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: >-
            The card, with the primary account number masked and the current
            version token that a subsequent update must echo.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      operationId: updateCard
      tags:
        - cards
      summary: Update the three editable fields of one card
      description: >-
        Applies a change to the embossed name, the active status and the
        expiration date of one card, and returns the card as it now stands.
        This carries across app/cbl/COCRDUPC.cbl, the card update transaction
        CCUP defined at app/csd/CARDDEMO.CSD:367-369, whose commit boundary is
        the syncpoint at :469-470.


        Which fields are editable is settled by the update screen's own field
        inventory: app/cpy-bms/COCRDUP.CPY declares exactly seventeen input
        fields, of which CRDNAMEI at :72, CRDSTCDI at :78, EXPMONI at :84,
        EXPYEARI at :90 and EXPDAYI at :96 are the editable card attributes.
        The card number and the account identifier are not editable, and the
        baseline agrees: its before-image comparison at :1503-1508 tests six
        fields and includes neither of those two, because they are the key.


        The request carries a version token and the update is refused if the
        stored row has moved on. Three distinct conditions produce that
        refusal and each is reported separately; see the 409 response.
      x-required-authority: carddemo-user
      parameters:
        - $ref: '#/components/parameters/OpaqueCardIdPath'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        description: >-
          The three editable fields together with the version token last read
          for this card. All four are required: a partial body would leave the
          service unable to distinguish a field the caller intends to clear
          from one it did not intend to send. A request carrying no body at all
          is refused with 'No input received', from
          app/cbl/COCRDUPC.cbl:185-186, which is the sentence the baseline
          raised when an operator submitted a screen having entered nothing. A
          body every field of which already equals the stored value is refused
          with 'No change detected with respect to values fetched.', from
          :187-188, retaining that sentence's closing full stop.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardUpdateRequest'
      responses:
        '200':
          description: >-
            The update was applied and committed. Carries the card as now
            stored, including the incremented version token, so a caller
            performing a second change does not have to re-read the card
            first.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # WHY : Alternatives Considered: the unmasked reading is a separate path
  #       rather than the masked path plus a query flag or a request header
  #       asking for more. A distinct path makes the authority requirement
  #       structural: it can be authorised, routed, rate-limited and audited on
  #       its own, and a caller without the authority cannot reach it at all. A
  #       flag would instead make the disclosure decision depend on parsing a
  #       parameter value on an endpoint every authenticated caller may reach,
  #       so a single mishandled value would widen disclosure silently, and
  #       every audit of who read a full account number would first have to
  #       reconstruct which requests carried the flag.
  # WHY : Refactoring Rationale: that distinct path is a SUB-RESOURCE of the card
  #       and an earlier revision of this document put it under a separate
  #       /api/v1/admin prefix. The prefix made the operation unreachable. The
  #       load balancer forwards this service on the patterns "/api/v1/cards" and
  #       "/api/v1/cards/*" (infra/envs/dev/main.tf and infra/envs/prod/main.tf)
  #       and the edge's route table publishes "ANY /api/v1/cards/{opaqueCardId}"
  #       and "ANY /api/v1/cards/{opaqueCardId}/{proxy+}"
  #       (infra/modules/api-gateway-http/variables.tf), so "/api/v1/admin/cards/..."
  #       matched no rule at either hop and would have answered 404 from the load
  #       balancer for an operation the service implements. Everything the separate
  #       path was chosen FOR survives the move: this is still its own path, with
  #       its own operation identifier, its own required authority and its own
  #       audit trail, and it is still not a flag on an endpoint every caller may
  #       reach. What changes is only that it now sits where the deployed edge
  #       already routes it.
  # WHY : Alternatives Considered: adding "/api/v1/admin/cards" to the load
  #       balancer rule set and the edge route table instead, so the prefix could
  #       stay. Rejected because it buys nothing this sub-resource does not already
  #       have, while adding a third routed prefix for one service and a second
  #       place where a card operation's path is spelled - and the edge's own
  #       route-key rationale records that its list is deliberately one matched
  #       pair of keys per service rather than a per-operation table.
  # WHY : Refactoring Rationale: the two read operations return DIFFERENT
  #       schemas, and an earlier revision of this document returned one schema
  #       from both. That revision described the difference between them in prose
  #       - one rendering a masked account number into a property named
  #       cardNumber, the other rendering the full number into the same property
  #       - which made the disclosure boundary unverifiable: a schema validator
  #       could not tell a masked response from an unmasked one, and neither
  #       could a client. CardDetail now carries displayCardNumber and NOTHING
  #       ELSE that could hold a full number, and AdminCardDetail extends it with
  #       the one property that does. The full number is therefore confined to
  #       one named schema returned by one path, which is checkable rather than
  #       asserted, and the duplication the earlier revision avoided is avoided
  #       still because AdminCardDetail composes CardDetail rather than restating
  #       it.
  /api/v1/cards/{opaqueCardId}/unmasked:

    get:
      operationId: getCardUnmasked
      tags:
        - admin-cards
      summary: Read one card with the full primary account number
      description: >-
        Returns the same card state as the non-administrative read operation,
        with one difference: the optional cardNumber member is present and
        carries the primary account number in full. The masked
        displayCardNumber member is present here too and is unchanged, so a
        client holding one type renders either response. The caller must hold
        the carddemo-admin authority, which the shared token converter derives
        from the signed cognito:groups claim; a token carrying only
        carddemo-user receives 403.


        The card verification value is absent from this response as it is from
        every other in this document. Administrative authority widens what may
        be rendered of the account number and nothing else.
      x-required-authority: carddemo-admin
      parameters:
        - $ref: '#/components/parameters/OpaqueCardIdPath'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: >-
            The card, with the primary account number rendered in full as
            sixteen digits alongside the masked rendering every other response
            carries, and the current version token.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCardDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # WHY : Refactoring Rationale: this operation exists because the card-number
  #       filter of the baseline list screen (CARDSIDI PIC X(16) at
  #       app/cpy-bms/COCRDLI.CPY:72) cannot be a query parameter without putting
  #       a full primary account number into the request line, and therefore into
  #       browser history, referrer headers and the access logs the load balancer
  #       and the distribution write -- none of which this service can redact. An
  #       earlier revision of this document declared exactly that parameter. The
  #       behaviour is preserved rather than dropped: the number is carried in a
  #       request body, where no hop logs it by default, and the answer is the
  #       same page shape the list operation returns.
  # WHY : Assumptions: a lookup by card number can match at most one row, so a
  #       page is a truthful answer rather than a contrivance. The card number is
  #       the unique primary key of card.cards -- CARD-NUM PIC X(16) at
  #       app/cpy/CVACT02Y.cpy:5, the KSDS key the baseline browses on -- so
  #       narrowing a list to one number narrows it to one row, and the baseline
  #       screen that carried this filter rendered precisely that: its list with a
  #       single line on it.
  # WHY : Alternatives Considered: returning the card detail directly instead of a
  #       one-row page, which would have been the more obvious shape for a lookup.
  #       Rejected because it would make this operation a second way to read a
  #       card, competing with the two that already exist and each of which has
  #       its own disclosure boundary; a client would then have two answers to
  #       "how much of the number is rendered" for one request. Answering with the
  #       list's own shape keeps this operation a FILTER, which is what the
  #       baseline field was, and leaves reading a card to the read operations.
  # WHY : Alternatives Considered: a GET whose card number travels in a header
  #       rather than the query string, which would also keep it out of the
  #       request line. Rejected because a header is not part of the resource
  #       identity a cache keys on, so an intermediate cache would serve one
  #       card's page for another card's request; a POST is uncacheable by
  #       default, which is the property this operation needs.
  # WHY : Alternatives Considered: POST /api/v1/cards/search as the path. Rejected
  #       only for reachability arithmetic: the edge publishes
  #       "ANY /api/v1/cards/{opaqueCardId}" and the load balancer forwards
  #       "/api/v1/cards/*", so any single trailing segment is already routed and
  #       no route-table change is needed for either spelling -- and "lookup"
  #       names what the operation does to a caller holding a number rather than
  #       implying a general query facility this contract does not offer.
  /api/v1/cards/lookup:

    post:
      operationId: lookUpCardByNumber
      tags:
        - cards
      summary: Find one card by its number without putting the number in a URL
      description: >-
        Answers with the one card bearing the supplied number, as a page holding
        that single row, or with an empty page when no card bears it. This
        carries across the card-number filter field of the baseline list screen
        at app/cpy-bms/COCRDLI.CPY:72 and the constraint the baseline states for
        it, 'Card number if supplied must be a 16 digit number' at
        app/cbl/COCRDUPC.cbl:193-194. The row it returns carries the opaque
        identifier every other operation of this contract selects on, so a
        caller holding a number reaches the card by looking it up and then using
        that identifier.


        An unmatched number is a success with an empty items array, not 404,
        exactly as the list operation reports a filtered-out page: a query that
        matched nothing succeeded. The baseline distinguished the two by message
        and this contract keeps them distinguishable by content, because an
        empty page and a page with a row differ observably.
      x-required-authority: carddemo-user
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardLookupRequest'
      responses:
        '200':
          description: >-
            A page holding the one matching card, or an empty page when none
            matches. Both cursor tokens are absent and neither availability
            indicator is set, because a lookup by primary key has no further
            page in either direction.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'


# WHY : Assumptions: (1) the shapes reused from the shared kernel are
#       described here and never forked. ApiError, its nested field error and
#       the abend aggregate are declared once in
#       services/common-lib/src/main/java/com/carddemo/common/error, and
#       PageResponse once in .../common/web; the entries below restate their
#       members so a client can read this document alone, and change only when
#       those types change. The reference suite states the same discipline for
#       record layouts at tests/README.md:540-542 - never duplicate a layout,
#       keep it single-sourced - and the failure it prevents is concrete: two
#       independently maintained descriptions of one error body diverge, and a
#       client then parses seven services correctly and mishandles the eighth.
#       (2) there is no executable oracle for the behaviour described below.
#       tests/README.md:83-85 records that the online CICS programs cannot run
#       end to end without a CICS runtime, which the build runner does not
#       provide, and all three source programs for this contract are online
#       programs. Message text is therefore verifiable character for character
#       against the copybook and program lines cited, and is; paging and
#       concurrency behaviour is verifiable only by reading those programs. The
#       citations consequently carry the weight, and they are exact.
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A JSON Web Token issued by the configured identity provider and
        validated as a resource-server token. Its cognito:groups claim is
        converted to authorities, where the baseline user type 'A' becomes
        carddemo-admin and 'U' becomes carddemo-user. Presenting no usable
        token yields 401; presenting a valid token without the authority an
        operation requires yields 403.

  parameters:

    # WHY : Refactoring Rationale: the selector is an opaque token and NOT the
    #       primary account number, and an earlier revision of this document put
    #       the sixteen-digit number in the path. That is the one place a value
    #       cannot be kept private: a path segment is written into the gateway and
    #       load-balancer access logs, into the browser's history and its
    #       referrer header, and into the path member of this document's own error
    #       body - so publishing an account number there disclosed it into four
    #       stores at once, and masking it in every response body bought nothing
    #       while the URL carried it in full. The token is produced by
    #       services/common-lib/src/main/java/com/carddemo/common/security/OpaqueIdentifier.java,
    #       whose TOKEN_LENGTH is 22, and it is stable for one card under one
    #       deployment key, so a client may bookmark a card route and reuse it.
    # WHY : Assumptions: the token is not reversible by its holder and is not
    #       meant to be. It is a truncated keyed authentication code over the
    #       protected value, so the service resolves it by looking it up rather
    #       than by decoding it, and a client cannot construct one for a card it
    #       was never shown. That is the property that makes it safe to log.
    # WHY : Trade-offs: exactly 22 characters, matched by a pattern rather than
    #       left free-form. The cost is that lengthening the token later is a
    #       breaking change to this contract; what it buys is that a caller that
    #       mistakenly places a sixteen-digit account number in the path is
    #       refused with 400 by the shape check alone, before any handler runs and
    #       before the value reaches a log. The already-authored browser client
    #       enforces the same 22-character URL-safe shape at
    #       ui/src/routes/cards.ts:12, so client and contract refuse the same
    #       values.
    OpaqueCardIdPath:
      name: opaqueCardId
      in: path
      required: true
      description: >-
        The card to act on, identified by the opaque 22-character token this
        service issues for it. Take the value from the opaqueCardId property of
        a card returned by the list or read operation and send it back
        unchanged. It is not an account number, it is not a masked account
        number, and neither of those is accepted here: the row it stands for is
        card.cards keyed on CARD-NUM PIC X(16) at app/cpy/CVACT02Y.cpy:5, but
        that key is never published and never travels in a URL.
      schema:
        type: string
        minLength: 22
        maxLength: 22
        pattern: '^[A-Za-z0-9_-]{22}$'
      example: 'Zm9vYmFyYmF6cXV1eDEyMw'

    AccountIdFilter:
      name: accountId
      in: query
      required: false
      description: >-
        Narrows the list to the cards of one account. Eleven digit characters
        exactly, and not all zeros, when supplied; omit it to list across all
        accounts. This carries across the ACCTSIDI PIC X(11) filter field of
        the list screen at app/cpy-bms/COCRDLI.CPY:66, and its constraint is
        the one the baseline states in the message it raises for a bad value,
        'Account number must be a non zero 11 digit number' at
        app/cbl/COCRDUPC.cbl:189-192. Supplying it is served by the secondary
        index idx_cards_account_id, which is the target of the VSAM alternate
        index declared KEYS(11 16) NONUNIQUEKEY UPGRADE at
        app/jcl/CARDFILE.jcl:85-87, so the filter is a real access path rather
        than a scan.
      schema:
        type: string
        minLength: 11
        maxLength: 11
        pattern: '^[0-9]{11}$'
      example: '00000000011'

    # WHY : Refactoring Rationale: ONE cursor input replaces the two an earlier
    #       revision of this document declared, and the reason is a defect that
    #       two produced rather than a preference for brevity. That revision named
    #       its two request parameters lastKey and firstKey - the same two names
    #       the RESPONSE uses for its ROW IDENTITIES - while the response's paging
    #       POSITIONS were named nextCursor and prevCursor. The already-authored
    #       browser client read the identically-named response members and paged
    #       from those, at ui/src/api/cards.ts and ui/src/screens/cardList, so on
    #       any page whose rows were all removed by the account filter after being
    #       read - which this operation explicitly permits - the identities were
    #       null while the positions were present, the client saw no cursor and
    #       disabled both paging controls, and the browse dead-ended on a page
    #       that had a further page. Collapsing the request side to one parameter
    #       named cursor makes it impossible to name the wrong member.
    # WHY : Assumptions: the direction is carried in the SEAL of each token, not
    #       only in the direction parameter, so replaying prevCursor with
    #       direction=next cannot silently return the wrong page. The sealing
    #       binding of com.carddemo.common.web.CursorToken includes the direction
    #       the token was minted for, so a mismatched pair fails to open and is
    #       refused with 400. This is what makes a single cursor parameter as safe
    #       as two named ones while removing the both-supplied and
    #       mismatched-pair cases the two-parameter form had to define errors for.
    # WHY : Alternatives Considered: positioning a page by a row ordinal -
    #       counting rows from the start of the ordered set and asking for the
    #       rows after the nth - was evaluated and rejected on a specific defect
    #       rather than a preference. The count of rows preceding a position
    #       changes underneath a reader when rows are inserted or removed between
    #       one request and the next, so a page positioned that way omits some
    #       rows and presents others twice, while a key already read keeps its
    #       place in the ordering whatever is inserted around it. No ordinal,
    #       row-skip or row-count input exists anywhere in this document as a
    #       result.
    # WHY : Refactoring Rationale: paging by key is a one-for-one substitution and
    #       not an approximation, because the baseline's own browse state was
    #       already a cursor over keys. app/cbl/COCRDLIC.cbl declares the last key
    #       of the page at :230-232 and the first key of it at :233-235, both as
    #       real key values, and its further-page indicator at :242-244 records
    #       nothing but whether another page exists. There is no count of consumed
    #       rows anywhere in that structure, so nothing had to be invented here
    #       and nothing discarded. What changed is where the state lives: it sat
    #       in a buffer the terminal echoed back, so continuity depended on the
    #       client returning it intact, and it now travels as a sealed token the
    #       service verifies on receipt.
    # WHY : Assumptions: the ordering key is the card number ALONE, not the
    #       twenty-seven-character composite of card number and account
    #       identifier that app/cbl/COCRDLIC.cbl:137-141 declares. The browse
    #       verbs position on WS-CARD-RID-CARDNUM and pass its length as the
    #       key length - at :1131-1132 and :1150-1151 going forward and at
    #       :1275-1276 and :1298-1299 going backward - and the move that would
    #       have added the account identifier to that record identifier is
    #       commented out at :449, :476, :491, :507 and :577. Because the card
    #       number is the unique primary key of card.cards, no tie-breaking
    #       column is needed and paging by it is total and exact; adding the
    #       account identifier as a second sort column would reorder the set
    #       and produce plausible pages in the wrong sequence.
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        The paging position to continue from: copy the lastKey member of the
        response to advance past it, or the firstKey member to retreat from
        it, and state the matching direction. Omit it, and the direction, to
        obtain the opening page. The value is opaque and must be echoed exactly
        as received; it is not a card number and cannot be constructed by a
        client. The two members it is copied from carry across
        WS-CA-LAST-CARDKEY at app/cbl/COCRDLIC.cbl:230-232 and
        WS-CA-FIRST-CARDKEY at :233-235, the latter being what the baseline
        moves into its browse positioning field at :1268.
      schema:
        $ref: '#/components/schemas/CursorToken'

    # WHY : Trade-offs: the direction is an explicit input rather than being
    #       inferred from which of the two response members the caller copied.
    #       Inferring it is impossible now that one parameter carries both, and
    #       was already undesirable when two did: a request that carried both
    #       cursors, or one alongside a stated direction it did not belong to, was
    #       ambiguous in a way the service had to resolve silently. The cost is
    #       one more input for the caller to set; what it buys is that a request
    #       whose direction and cursor disagree is refused with 400 and named,
    #       rather than being answered with a page from the other end of the set.
    PagingDirection:
      name: direction
      in: query
      required: false
      description: >-
        Which way to move from the supplied cursor. It is meaningful only
        alongside a cursor, and the two are sent together or not at all. Reading
        next seeks keys strictly greater than the cursor in ascending order and
        is the default, which with no cursor supplied returns the opening page;
        reading previous seeks keys strictly less than it, returned in the same
        ascending order as every other page. Supplying a direction with no
        cursor, or a cursor sealed for the other direction, is a 400.
      schema:
        $ref: '#/components/schemas/PageDirection'

    # WHY : Refactoring Rationale: the correlation identity is declared as a
    #       request parameter here and not left implicit, and an earlier revision
    #       of this document declared it on the response side only. That asymmetry
    #       hid a real interoperability failure: the shared filter at
    #       services/common-lib/src/main/java/com/carddemo/common/web/CorrelationIdFilter.java
    #       ACCEPTS an inbound value and refuses one that is over-long or carries
    #       an unsafe character, so the inbound shape is part of the contract
    #       whether or not the contract stated it. The already-authored browser
    #       client sends this header on every request from
    #       ui/src/api/client.ts, so a shape published on one direction only left
    #       the client's value unchecked against anything.
    # WHY : Assumptions: it is OPTIONAL, and omitting it is a supported choice
    #       rather than a degraded one. The filter mints a conforming identity when
    #       none arrives and returns it on the response either way, so a caller
    #       that has no identity of its own to propagate gets one it can quote; a
    #       caller that is continuing a unit of work it already named passes its
    #       own so the two sides agree.
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        Identity of the unit of work this request belongs to, echoed back on the
        response. Supply it to tie this request to one a caller has already
        named, or omit it and the service mints one. A value that is longer than
        the published bound or carries a character outside the published set is
        refused with 400 rather than being silently replaced, so that a caller
        cannot believe it is correlating requests that the service is in fact
        correlating under a different identity.
      schema:
        $ref: '#/components/schemas/CorrelationId'

  # WHY : Assumptions: the response header is declared once here rather than
  #       spelled out at each response, because a header re-typed at every
  #       response is a header that will eventually be typed differently. It is
  #       required on every response this document defines, including the failures:
  #       the identity is the only handle this contract offers into server-side
  #       diagnostics, and it is least dispensable exactly when a caller is
  #       reporting a failure.
  headers:
    XCorrelationId:
      description: >-
        Identity of the unit of work that produced this response. Echoed from the
        request where the caller supplied a conforming value and minted by the
        service where it did not. Quote it when reporting a failure.
      required: true
      schema:
        $ref: '#/components/schemas/CorrelationId'

  # WHY : Refactoring Rationale: every failure is reported through one body
  #       shape carrying two independent channels - a single aggregate sentence
  #       and an array of per-field entries - because the baseline populates
  #       two such channels under different rules and merging them would lose
  #       a distinction it makes. The per-field flags accumulate
  #       unconditionally, while the aggregate sentence is latched on first
  #       write: app/cbl/COCRDUPC.cbl sets the field flag at :854 and again at
  #       :867 outside any guard, but wraps each assignment of a
  #       message-valued condition in a test that the message is still unset,
  #       at :855-857, :868-870 and :1445-1447. Two consequences follow for a
  #       client and both are easy to get wrong: the aggregate sentence must
  #       not be reconstructed by joining the array, because it corresponds to
  #       the FIRST failure only, and the array must not be assumed to hold one
  #       entry, because its length varies with how many fields failed.
  # WHY : Assumptions: a field reported blank is a kind of error rather than a
  #       third state beside valid and invalid. app/cpy/CSSETATY.cpy:18-19 is a
  #       single disjunctive test over the not-ok and blank conditions, and the
  #       blank path sets both flags. That copybook is a procedure-division
  #       fragment substituted through replacement placeholders rather than a
  #       data structure, so it declares no record of its own.
  # WHY : Trade-offs: the presentational marker the baseline writes into a
  #       blank field is deliberately not a property of this body. The
  #       highlight copybook moves a colour attribute into one subfield at
  #       app/cpy/CSSETATY.cpy:21-22 and an asterisk into a different subfield,
  #       the field's own value, at :23-25 - and the input side then reads that
  #       asterisk back and normalises it away again at
  #       app/cbl/COCRDUPC.cbl:588-596. That round trip exists only because
  #       CICS returns the map to the program; a stateless client echoes
  #       nothing, so the marker is a rendering concern for the browser client
  #       alone and modelling it here would ask every client to round-trip a
  #       value none of them needs. The re-entry condition that gated the
  #       highlight, at app/cpy/CSSETATY.cpy:20, has no counterpart at all:
  #       a stateless handler cannot distinguish a first attempt from a
  #       repeat, so error presentation is driven purely by this body.
  # WHY : Assumptions: six of the message-valued conditions the update program
  #       declares are deliberately not surfaced anywhere in this document, and
  #       each falls into one of three groups. Recorded here so that a reader
  #       comparing app/cbl/COCRDUPC.cbl:177-214 against this file finds a
  #       reason rather than an apparent omission.
  #       (1) Two prompts for a value that is no longer a request field:
  #       'Account number not provided' at :177-178 and 'Card number not
  #       provided' at :179-180. On the update the card is named by the request
  #       path, so its absence is a routing outcome and never a field error,
  #       and the account is not an editable attribute at all - the baseline
  #       agrees, excluding both from the six fields its change comparison
  #       tests at :1503-1508. On the list both are optional filters, so
  #       omitting them is valid input rather than an error. A field error for a
  #       field no request carries could never be raised.
  #       (2) Two not-found sentences that became an empty page:
  #       'Did not find this account in cards database' at :201-202 and 'Did
  #       not find cards for this search condition' at :203-204. The baseline
  #       reported an unmatched search as a message on the same screen; the list
  #       operation reports it as 200 with an empty items array, because a query
  #       that matched nothing succeeded and 404 would tell a client the
  #       collection itself does not exist. This is a documented divergence, and
  #       it is registered as D-EMPTY-PAGE in
  #       docs/architecture/cobol-to-service-traceability.md.
  #       (3) Two that must not be surfaced: 'Error reading Card Data File' at
  #       :211-212 names a VSAM dataset, a platform concept the migrated system
  #       does not have, so the condition survives as a failure while its
  #       file-naming prose does not; and the placeholder sentence at :213-214
  #       is a development note rather than an operator-facing message, so it is
  #       not modelled at all.
  responses:

    BadRequest:
      description: >-
        The request could not be accepted as presented. Raised for a selector
        that is not twenty-two URL-safe characters - which is what a caller
        placing a sixteen-digit account number in the path receives, before any
        handler runs and before the value reaches a log - for a card-number or
        account filter of the wrong width or carrying a non-digit, an all-zero
        account filter, a cursor that is unreadable, was not issued for this
        query or was sealed for the other direction, a direction whose cursor is
        missing, a correlation identity longer than the published bound or
        carrying a character outside the published set, a request body that is
        absent, a body that would change nothing, or a body failing field
        validation. The fieldErrors array names each offending field; the message
        carries the first failure only.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            embossedNameNotAlphabetic:
              summary: The embossed name carries a character outside the permitted set
              description: >-
                The message is reproduced character for character from
                app/cbl/COCRDUPC.cbl:183-184.
              value:
                code: CARDDEMO-0400
                secondaryCode: ''
                message: Card name can only contain alphabets and spaces
                severity: WARNING
                subsystem: APPLICATION
                status: 400
                correlationId: 8F1C0E423A554D219B7E6C0F
                path: /api/v1/cards/Zm9vYmFyYmF6cXV1eDEyMw
                timestamp: '2026-08-05 09:14:27.481903'
                fieldErrors:
                  - field: embossedName
                    state: NOT_OK
                    message: Card name can only contain alphabets and spaces
                abend: null
            activeStatusOutsideDomain:
              summary: The active status is neither of the two permitted values
              description: >-
                The message is reproduced character for character from
                app/cbl/COCRDUPC.cbl:195-196. Note that the baseline raises
                this same sentence both when the field is blank and when it
                carries an unrecognised value, distinguishing the two only by
                the field state.
              value:
                code: CARDDEMO-0400
                secondaryCode: ''
                message: Card Active Status must be Y or N
                severity: WARNING
                subsystem: APPLICATION
                status: 400
                correlationId: 2B7A91D055E44F0A8C31D90B
                path: /api/v1/cards/Zm9vYmFyYmF6cXV1eDEyMw
                timestamp: '2026-08-05 09:15:02.117640'
                fieldErrors:
                  - field: activeStatus
                    state: BLANK
                    message: Card Active Status must be Y or N
                abend: null

    Unauthorized:
      description: >-
        No usable bearer token was presented, or the token presented could not
        be validated against the configured issuer. The body names no reason
        beyond that, because distinguishing an absent token from an expired or
        badly-signed one would tell an unauthenticated caller which of the
        three it had.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Forbidden:
      description: >-
        A valid token was presented that does not carry the authority this
        operation requires. Raised by the administrative read operation for a
        token holding only carddemo-user. The card exists or does not exist
        independently of this outcome, and this response deliberately does not
        say which, so that an unauthorised caller cannot use the choice
        between 403 and 404 to discover whether a selector stands for a row.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFound:
      description: >-
        No card exists for the opaque selector supplied in the path. A
        well-formed selector that stands for no row and a selector this
        deployment never issued are reported alike, so that a caller cannot
        probe for valid selectors by comparing the two.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    # WHY : Refactoring Rationale: this response carries a body, and for the
    #       optimistic-conflict condition that body is the refreshed card. The
    #       baseline's conflict path is deliberately retry-friendly: on
    #       detecting the change it re-displays the freshly-read record and
    #       re-snapshots all six compared fields from it, at
    #       app/cbl/COCRDUPC.cbl:1511-1517, so the operator is left holding
    #       current values and can resubmit immediately. An empty 409 would
    #       drop that, forcing a client to re-read the card before it could
    #       retry and losing behaviour the baseline has.
    # WHY : Alternatives Considered: reporting these three conditions as one
    #       undifferentiated conflict was rejected because the baseline routes
    #       them to three different outcomes rather than one. At
    #       app/cbl/COCRDUPC.cbl:988-1001 the lock failure sets the state
    #       declared 'L' at :289, the rewrite failure sets the state declared
    #       'F' at :290, and the detected change instead re-shows the record.
    #       Collapsing them would leave a client unable to tell a condition
    #       worth retrying immediately from one that needs the record read
    #       again.
    # WHY : Alternatives Considered: 5xx for the lock and rewrite failures was
    #       considered and rejected. The baseline surfaces all three as
    #       user-visible sentences on the same screen and does not abend, so
    #       reporting two of them as server faults would tell a client the
    #       service had broken when the baseline treats them as outcomes a user
    #       may act on.
    # WHY : Assumptions: the machine identity of a failure is the pair of codes,
    #       not the sentence. The shared error type carries a primary and a
    #       subordinate code as the counterparts of the baseline's two
    #       nine-character code fields, so the shared 0409 primary is qualified
    #       by a distinct subordinate code per condition. That the sentence
    #       alone cannot discriminate is demonstrated inside this very program:
    #       app/cbl/COCRDUPC.cbl:189-190 and :191-192 are two different
    #       conditions carrying byte-identical text, so a client keying on
    #       prose would merge them. The two are not deduplicated here for the
    #       same reason.
    # WHY : Assumptions: this response is declared once and referenced by every
    #       operation, rather than written out per operation, because its body is
    #       the same shared problem shape in every case and the shared advice that
    #       produces it knows nothing about which operation it interrupted. Four
    #       operations reference it, so four copies would be four places for the
    #       masking guarantee below to be stated differently.
    # WHY : Assumptions: the body carries no diagnostic detail beyond the shared
    #       shape's own members, and the correlation identity is the whole of the
    #       diagnostic contract. A stack frame, an exception name or a SQL state
    #       would tell a caller about the implementation rather than about its own
    #       request, and the correlation header echoed here resolves to the
    #       operational record that does hold them.
    # WHY : Assumptions: the path this body reports is already narrowed. The shared
    #       advice narrows every qualifying digit run before it emits or logs a
    #       path, and the shape's own canonical constructor narrows again whatever
    #       path it is handed, so a card number cannot reach a caller through this
    #       response even when the failure occurred before any handler ran.
    InternalServerError:
      description: >-
        The request could not be completed for a reason the caller cannot
        correct. It is declared so that a generated client has a typed body for
        the status rather than an untyped fallback, and so that the correlation
        identity is contracted for on the one response where a caller has nothing
        else to act on.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Conflict:
      description: >-
        The update could not be applied against the persisted state. Three
        distinct conditions reach this status and are never merged: the row
        could not be taken for update, the write itself did not succeed, or the
        row had changed since the caller read it. Each carries its own
        subordinate code and its own sentence, reproduced character for
        character from app/cbl/COCRDUPC.cbl:205-210. Only the third carries the
        refreshed card, because only for the third does a current
        representation exist to return.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CardConflictError'
          examples:
            recordChangedByAnotherCaller:
              summary: The row changed after the caller read it
              description: >-
                The optimistic-concurrency conflict. The sentence is
                reproduced character for character from
                app/cbl/COCRDUPC.cbl:207-208, retaining its two-word 'some
                one' and its absence of a closing full stop. The refreshed
                card is carried in the field entry's value position so that a
                caller can resubmit against the version now stored, mirroring
                the re-snapshot the baseline performs at :1511-1517.
              value:
                code: CARDDEMO-0409
                secondaryCode: CARD-DATA-CHANGED
                message: Record changed by some one else. Please review
                severity: WARNING
                subsystem: RELATIONAL
                status: 409
                correlationId: 6D3E88B17C024A94B5DF1E47
                path: /api/v1/cards/Zm9vYmFyYmF6cXV1eDEyMw
                timestamp: '2026-08-05 09:16:44.902355'
                fieldErrors:
                  - field: version
                    state: NOT_OK
                    message: Record changed by some one else. Please review
                abend: null
                card:
                  opaqueCardId: 'Zm9vYmFyYmF6cXV1eDEyMw'
                  displayCardNumber: '************0011'
                  accountId: '00000000011'
                  embossedName: JOHN Q PUBLIC
                  expirationDate: '2027-06-30'
                  activeStatus: 'N'
                  version: 4
            couldNotTakeRowForUpdate:
              summary: The row could not be taken for update
              description: >-
                The sentence is reproduced character for character from
                app/cbl/COCRDUPC.cbl:205-206, which says 'record' with no
                qualifying noun. A differently-qualified wording belongs to
                another bounded context and is not this context's text.
              value:
                code: CARDDEMO-0409
                secondaryCode: CARD-LOCK-NOT-ACQUIRED
                message: Could not lock record for update
                severity: WARNING
                subsystem: RELATIONAL
                status: 409
                correlationId: B04F7A2911DE4C639A8053C7
                path: /api/v1/cards/Zm9vYmFyYmF6cXV1eDEyMw
                timestamp: '2026-08-05 09:17:19.336208'
                fieldErrors: []
                abend: null
                card: null
            writeDidNotSucceed:
              summary: The row was taken for update but the write did not succeed
              description: >-
                The sentence is reproduced character for character from
                app/cbl/COCRDUPC.cbl:209-210. The baseline reaches the
                equivalent state when its rewrite returns other than normal,
                at :1488-1491.
              value:
                code: CARDDEMO-0409
                secondaryCode: CARD-WRITE-NOT-APPLIED
                message: Update of record failed
                severity: WARNING
                subsystem: RELATIONAL
                status: 409
                correlationId: 3A5C6FF89B714E0D82AC7D1B
                path: /api/v1/cards/Zm9vYmFyYmF6cXV1eDEyMw
                timestamp: '2026-08-05 09:17:53.774019'
                fieldErrors: []
                abend: null
                card: null


  schemas:

    # WHY : Refactoring Rationale: the accepted shape IS pinned, by the same
    #       pattern the shared kernel compiles. An earlier revision of this file
    #       deliberately withheld it, arguing that publishing the layout would
    #       couple this contract to an internal representation and make a change
    #       of sealing scheme a breaking contract change. That argument does not
    #       survive the version prefix: the token's first component is the
    #       literal v1, declared at CursorToken.java:81, and it exists precisely
    #       so that a second scheme can be introduced beside the first rather
    #       than in place of it. Withholding the pattern also cost more than it
    #       saved - a caller could not tell a truncated or re-encoded token from
    #       a valid one until the service refused it, and the sibling contracts
    #       of this migration publish the same pattern, so the omission made one
    #       shared token look like three different types.
    # WHY : Assumptions: the three constants below are read from
    #       services/common-lib/src/main/java/com/carddemo/common/web/CursorToken.java
    #       and not chosen here - the version prefix at :81, the maximum length
    #       of 256 at :92 and the accepted shape as a compiled pattern at
    #       :121-122. The pattern admits a version prefix, a base64url payload of
    #       up to two hundred characters and a base64url authentication code of
    #       exactly forty-three, separated by full stops; the fixed forty-three
    #       is the unpadded base64url rendering of a thirty-two-byte code.
    # WHY : Refactoring Rationale: a cursor is sealed rather than being the raw
    #       key it stands for. The raw keyset cursor is the composite of card
    #       number and account identifier that app/cbl/COCRDLIC.cbl:230-232
    #       declares, and publishing it would put a primary account number into
    #       every page of the card list and invite the client to replay it -
    #       which is precisely what the masking on the summary rows exists to
    #       avoid. Sealing keeps the key server-side while leaving the client
    #       able to page. Publishing the ENVELOPE's shape discloses nothing of
    #       the key inside it: the payload is authenticated and bound to the
    #       query and the subject it was issued for, so a client can recognise a
    #       well-formed token without being able to read, forge or retarget one.
    CursorToken:
      type: string
      maxLength: 256
      pattern: '^v1\.[A-Za-z0-9_-]{1,200}\.[A-Za-z0-9_-]{43}$'
      description: >-
        An opaque paging position minted by this service. It stands for a key
        in the ordered set without disclosing it, and it is bound to the query
        and the caller it was issued for, so it cannot be replayed against a
        different filter or by a different caller. It is bound to the DIRECTION
        it was minted for as well, so replaying the previous-page position with
        direction next cannot silently answer with the wrong page. Treat it as a
        value to be echoed back unchanged and never parsed, constructed or
        compared: no part of it is a card number, an account identifier or a row
        ordinal. A cursor that cannot be opened is reported as 400.

    # WHY : Assumptions: the two member values are lower case and are next and
    #       previous, and they are not chosen here. They are the two the
    #       already-authored browser client sends, and the two the sibling
    #       transaction contract publishes for the same purpose. An earlier
    #       revision of this document published FORWARD and BACKWARD, so the SPA
    #       sent values this service would have refused with 400 on every page
    #       after the first - a disagreement neither side could detect at build
    #       time, because a query parameter is a string on both. There is one
    #       paging vocabulary across this migration and this is it.
    PageDirection:
      type: string
      description: >-
        Which side of a supplied cursor to read. Reading next seeks keys strictly
        greater than the cursor in ascending order; reading previous seeks keys
        strictly less than it, which is the migrated form of the baseline
        READPREV at app/cbl/COCRDLIC.cbl:1294.
      enum:
        - next
        - previous
      default: next

    # WHY : Refactoring Rationale: ONE bound and ONE character set, published once
    #       and referenced by the request parameter, the response header and the
    #       error body alike. An earlier revision of this document bounded the
    #       identity in one place, illustrated it everywhere with
    #       thirty-six-character examples no bound admitted, and left the shared
    #       filter enforcing a third width - three descriptions of one value,
    #       disagreeing invisibly because nothing compared them.
    # WHY : Assumptions: twenty-four characters, and the set of letters, digits,
    #       hyphen, underscore and full stop, are not chosen here. They are what
    #       CorrelationIdFilter.java enforces - CORRELATION_ID_MAX_LENGTH is 24 at
    #       its line 238 and its accepted punctuation is exactly those three
    #       characters - and a value outside that is refused with 400 before any
    #       handler runs. Publishing anything wider would document a request this
    #       service rejects.
    # WHY : Trade-offs: a canonical form is described but not mandated by the
    #       pattern, so a caller may propagate an identity minted elsewhere as long
    #       as it fits. The cost is that two callers may use different spellings;
    #       what it buys is that a caller already carrying a conforming identity
    #       from an upstream system need not mint a second one, which would break
    #       the correlation this value exists to preserve.
    CorrelationId:
      type: string
      maxLength: 24
      pattern: '^$|^[A-Za-z0-9_.-]{1,24}$'
      description: >-
        Identity of one unit of work. At most twenty-four characters drawn from
        the ASCII letters, the digits, the hyphen, the underscore and the full
        stop. A value the service mints is exactly twenty-four upper-case
        hexadecimal characters over twelve bytes of entropy; a value a caller
        supplies need only fit the bound and the set. The empty string appears
        only inside an error body, and only for a failure raised before any
        identity had been established.
      example: 4F1C0E423A554D219B7E6C0F

    # WHY : Refactoring Rationale: identifiers travel as digit strings and
    #       never as JSON numbers, and this preserves the baseline's own
    #       treatment rather than introducing a new one. app/cpy/CVCRD01Y.cpy
    #       declares each identifier twice - the account identifier as
    #       PIC X(11) at :34 redefined as PIC 9(11) at :36, the card number as
    #       PIC X(16) at :37 redefined as PIC 9(16) at :39, the customer
    #       identifier as PIC X(09) at :40 redefined as PIC 9(9) at :42 - and
    #       the same pairing recurs at app/cbl/COCRDUPC.cbl:104-112 and
    #       app/cbl/COCRDSLC.cbl:73-81. The character form is the one that
    #       moves in and out; the numeric redefinition is used only where
    #       arithmetic happens. So the baseline itself treats these as
    #       characters on the wire and as numbers only in a computation, and
    #       this contract does the same.
    # WHY : Assumptions: a JSON number is parsed into IEEE-754 binary floating
    #       point by most clients, and sixteen significant digits exceed what
    #       that representation holds exactly - so a card number sent as a JSON
    #       number can come back as a different card number. Leading zeros are
    #       lost the same way, and they occur in the seed extract, so the
    #       failure is not hypothetical. Every identifier and every monetary
    #       value in this migration is therefore a string on the wire.
    # WHY : Assumptions: the wire type and the column type differ on purpose
    #       and must not be reconciled. db/migration/V1__card.sql stores
    #       account_id as BIGINT and card_num as CHAR(16), yet both travel here
    #       as digit strings. An integer column is a statement about storage and
    #       arithmetic, not a licence to emit a JSON number at the boundary.
    # WHY : Assumptions: an unset identifier is blank rather than zero. All
    #       three character forms in app/cpy/CVCRD01Y.cpy are declared VALUE
    #       SPACES, at :35, :38 and :41, so the baseline's own empty state is
    #       spaces; a client must not read an absent identifier as the number
    #       zero.
    CardSummary:
      type: object
      description: >-
        One row of the card list. It carries the three values the baseline
        displayed per row, whose twenty-eight-character layout is declared at
        app/cbl/COCRDLIC.cbl:258-260 as an eleven-character account number, a
        sixteen-character card number and a one-character status - with the card
        number rendered masked - together with one member the baseline had no
        need of, the opaque selector by which a client addresses this row's card
        in a subsequent request. The twenty-eighth character is the status and
        not a row-selection marker.


        The selection and separator fields the list screen carried alongside
        each row - CRDSEL1I through CRDSEL7I and CRDSTP2I through CRDSTP7I in
        app/cpy-bms/COCRDLI.CPY, where there is deliberately no CRDSTP1I - are
        absent here. They existed so a terminal operator could mark a row and
        submit the whole screen; a client instead calls the detail or update
        operation for the card it wants, so they have no counterpart.
      required:
        - opaqueCardId
        - displayCardNumber
        - accountId
        - activeStatus
      additionalProperties: false
      properties:
        # WHY : Refactoring Rationale: the row carries a SELECTOR distinct from
        #       its rendering, and an earlier revision carried only the rendering.
        #       That left a client no value it could act on: the masked number
        #       identifies no row, so a client wanting the detail of a row it was
        #       shown had to be given the unmasked number - which is what put a
        #       primary account number into the list response and then into every
        #       link built from it. Separating the two means the widest exposure in
        #       this context discloses four digits and a token that stands for a
        #       row without disclosing anything about it.
        opaqueCardId:
          type: string
          minLength: 22
          maxLength: 22
          pattern: '^[A-Za-z0-9_-]{22}$'
          description: >-
            The selector for this row, to be sent back as the opaqueCardId path
            parameter of the read and update operations. Opaque, stable for this
            card under this deployment, and safe to place in a link, a bookmark
            or a log. It is not derived from anything a client can compute.
          example: 'Zm9vYmFyYmF6cXV1eDEyMw'
        displayCardNumber:
          type: string
          maxLength: 16
          description: >-
            Identifies this card TO A PERSON, rendered as its last four digits
            behind a masking prefix. Never the full number on this schema,
            whatever authority the caller holds, because a list is the widest
            exposure in the context and the last four digits are what the row is
            for. It is a rendering and not a selector: it identifies no row and
            is not accepted as an input anywhere in this document. To obtain the
            full number a caller reads the single card through the
            administrative operation.
          example: '************0011'
        accountId:
          type: string
          minLength: 11
          maxLength: 11
          pattern: '^[0-9]{11}$'
          description: >-
            The account this card belongs to, as exactly eleven digit
            characters. Carried across CARD-ACCT-ID PIC 9(11) at
            app/cpy/CVACT02Y.cpy:6 and stored as account_id. It travels
            alongside the ordering key rather than forming part of it, so it
            is data on the row and not a paging position.
          example: '00000000011'
        activeStatus:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: >-
            Whether the card is active, restricted to the two values the
            baseline accepts and the database enforces. Carried across
            CARD-ACTIVE-STATUS PIC X(01) at app/cpy/CVACT02Y.cpy:10, and
            checked by ck_cards_active_status in
            db/migration/V1__card.sql, which admits 'Y' and 'N' only.
          example: 'Y'

    # WHY : Refactoring Rationale: the card verification value has no
    #       representation on this schema, on any other in this document, or in
    #       any error body - not masked, not truncated, not write-only, but
    #       absent. This preserves an absence the baseline already had rather
    #       than withdrawing something it showed. The value appears in the
    #       stored record, as the third field of the card record - three
    #       display digits, PIC 9(03), at app/cpy/CVACT02Y.cpy:7 - and in
    #       working storage the two read programs decode it into and never
    #       render, at app/cbl/COCRDLIC.cbl:102-104 and
    #       app/cbl/COCRDSLC.cbl:76-78. It appears on no card screen: a search
    #       for it across all three symbolic maps app/cpy-bms/COCRDLI.CPY,
    #       COCRDSL.CPY and COCRDUP.CPY, and across all three mapsets
    #       app/bms/COCRDLI.bms, COCRDSL.bms and COCRDUP.bms, returns nothing,
    #       and the seventeen input fields of app/cpy-bms/COCRDUP.CPY contain
    #       no such field. So it was never displayed and never accepted as
    #       input. The migrated platform adds encipherment at rest for it, in
    #       the single enciphered verification column of
    #       db/migration/V1__card.sql that no endpoint here selects - which a
    #       cluster defined RECOVERY(NONE) and JOURNAL(NO), at
    #       app/csd/CARDDEMO.CSD:31 and :33, had nowhere to keep.
    # WHY : Trade-offs: the two artifacts named above are cited by path, line
    #       and position rather than by their identifier, and this file contains
    #       that identifier nowhere in any form. The migration screens its own
    #       output for the identifier, and a screen that scans comments as well
    #       as content cannot distinguish a citation from a leak. Citing by
    #       location costs a reader one extra lookup and keeps the screen
    #       unambiguous; nothing is lost, because each citation still resolves
    #       to exactly one field and one column.
    # WHY : Refactoring Rationale: the update request carries no verification
    #       value and no before-image either, and one observation explains
    #       both. In the baseline that field's only functional role was the
    #       change comparison: it is declared at app/cbl/COCRDUPC.cbl:306,
    #       initialised on every screen receipt at :586, is never the target of
    #       a move anywhere in the program, appears once as the source of one at
    #       :1464, and is read at :1503 as the first of the six fields the
    #       comparison tests. The comparison at :1503-1508 covers that field,
    #       the embossed name, the three expiry components and the active
    #       status, and notably neither the card number nor the account
    #       identifier, because those are the key. One version token now
    #       carries that entire six-field comparison, so no before-image needs
    #       to travel to a client at all. The absence is not a subtraction of
    #       function; it is the removal of a field whose sole purpose the
    #       version token now serves.
    # WHY : Trade-offs: masking the value instead of omitting it was considered
    #       and rejected. A masked three-character field still discloses that a
    #       verification value exists and how long it is, and it gives every
    #       client a property to store, log and echo. Absence is the only
    #       representation that discloses nothing, and the cost - that a client
    #       cannot display the field - is no cost at all, because no baseline
    #       screen displayed it either.
    # WHY : Assumptions: the baseline's update path moves that never-populated
    #       field into the record it writes, at app/cbl/COCRDUPC.cbl:1464-1465.
    #       This divergence is documented, not fixed: the baseline does that,
    #       whereas an update here carries no such value and leaves the stored
    #       enciphered column untouched, and the difference is registered as
    #       D-CVV-UNTOUCHED in
    #       docs/architecture/cobol-to-service-traceability.md.
    CardDetailCore:
      type: object
      description: >-
        The full state of one card as this context stores it, mirroring
        card.cards in db/migration/V1__card.sql column for column with three
        exceptions, each deliberate: the enciphered verification column has no
        counterpart here at all; the two identifier columns are rendered as
        strings rather than in their stored types; and the card_num column is
        rendered by two members rather than one, a masked displayCardNumber
        carried on every response and an optional full cardNumber carried only
        by the administrative read. A fourth member, opaqueCardId, corresponds
        to no column: it is derived from the primary key rather than stored.


        The single target-side rename is carried through: the record field
        CARD-EXPIRAION-DATE at app/cpy/CVACT02Y.cpy:9 becomes expiration_date
        in the schema and expirationDate here. The baseline spelling is
        preserved in the citation and the lineage is recorded in
        docs/architecture/data-model-and-schema-mapping.md.


        This is the shared core of the two detail shapes and is returned by no
        operation directly. CardDetail is this core and nothing further;
        AdminCardDetail is this core plus the one property that carries a full
        account number.
      required:
        - opaqueCardId
        - displayCardNumber
        - accountId
        - embossedName
        - expirationDate
        - activeStatus
        - version
      properties:

        # WHY : Assumptions: the selector is the same value the list row carries
        #       for this card, so a client that navigated from a row already holds
        #       it and a client that read the card directly can navigate onward
        #       with it. It is echoed on the detail rather than left implicit in
        #       the request path so that a response stored on its own remains
        #       actionable.
        opaqueCardId:
          type: string
          minLength: 22
          maxLength: 22
          pattern: '^[A-Za-z0-9_-]{22}$'
          description: >-
            The selector for this card, identical to the value in the path that
            addressed it and to the value the list row carried. Send it back as
            the opaqueCardId path parameter of the update operation.
          example: 'Zm9vYmFyYmF6cXV1eDEyMw'

        # WHY : Refactoring Rationale: this member is masked on EVERY operation,
        #       and an earlier revision of this document made one member mean two
        #       things - masked on two operations and unmasked on a third,
        #       distinguished only by prose. Nothing could check that, and a client
        #       could not tell from a stored response which it was holding. The
        #       masked rendering now has its own name and one meaning everywhere,
        #       and the full number has its own name on its own schema.
        displayCardNumber:
          type: string
          maxLength: 16
          description: >-
            Identifies this card TO A PERSON, rendered as the last four digits
            behind a masking prefix, on every operation without exception.
            Carried across CARD-NUM PIC X(16) at app/cpy/CVACT02Y.cpy:5 and
            derived from card_num, the primary key. It is a rendering and not a
            selector: it identifies no row and is accepted as an input nowhere.
          example: '************0011'

        # WHY : Refactoring Rationale: the shared core carries the masked
        #       rendering above and NO member able to hold the number in full.
        #       An earlier revision declared an optional cardNumber here so that
        #       one schema could serve both reads. That put the member on
        #       CardDetail, the shape every caller holding only carddemo-user
        #       receives, where optionality was the only thing keeping the number
        #       out -- an absence a service has to remember rather than a shape
        #       that cannot express it. The full number is declared once instead,
        #       on AdminCardDetail, which composes this core and adds the member
        #       as required; so the disclosure the migration plan's sections
        #       0.4.1.9 and 0.7.8 confine to the administrative endpoint is
        #       confined by the TYPE SYSTEM rather than by a convention, and a
        #       contract test asserts this core does not carry it.
        # WHY : Trade-offs: the administrative shape restates the member instead
        #       of inheriting it, which is one declaration duplicated. That is
        #       accepted because the alternative duplicated the seven members of
        #       this core instead, and because a composition that ADDED the member
        #       onto a subschema closed to additional properties would describe an
        #       instance no validator accepts -- which is why the administrative
        #       shape composes this core openly and closes itself with
        #       unevaluatedProperties rather than the other way round.

        accountId:
          type: string
          minLength: 11
          maxLength: 11
          pattern: '^[0-9]{11}$'
          description: >-
            The account this card belongs to, as exactly eleven digit
            characters and never as a JSON number, for the reason recorded on
            CardSummary. Carried across CARD-ACCT-ID PIC 9(11) at
            app/cpy/CVACT02Y.cpy:6 and stored as account_id.
          example: '00000000011'

        # WHY : Assumptions: the stored name is upper case, and a caller should
        #       expect the value it reads back to differ in case from the value
        #       it sent. The baseline upper-cases the name in place before
        #       comparing it, at app/cbl/COCRDUPC.cbl:1499-1501, so case is not
        #       part of what the record distinguishes; a client that treats a
        #       case change as an unexpected modification would report a
        #       conflict where none exists.
        # WHY : Refactoring Rationale: the restriction to letters and spaces is
        #       expressed as a pattern and not left to the prose alone, so that
        #       a generated client, a contract test and a schema validator all
        #       enforce what the description states. Without it a caller reading
        #       only the machine-readable part of this schema would accept a
        #       value the service refuses, and the refusal would arrive as a 400
        #       the caller had no way to anticipate. The character class is the
        #       one the baseline itself tests, at app/cbl/COCRDUPC.cbl:183-184.
        embossedName:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Za-z ]+$'
          description: >-
            The name embossed on the card, up to fifty characters and
            restricted to alphabetic characters and spaces. Carried across
            CARD-EMBOSSED-NAME PIC X(50) at app/cpy/CVACT02Y.cpy:8 and stored
            as embossed_name; the constraint is the one the baseline states in
            'Card name can only contain alphabets and spaces' at
            app/cbl/COCRDUPC.cbl:183-184. The declared width is the record's
            width and is a maximum here rather than an exact length, because the
            trailing blanks that fill the declared field are the record format
            padding and not part of anybody's name.
          example: JOHN Q PUBLIC

        # WHY : Assumptions: one ISO date field, where the update screen
        #       carried three separate components. This is the baseline's own
        #       behaviour rather than a convenience: at
        #       app/cbl/COCRDUPC.cbl:1467-1474 it assembles the year, a hyphen,
        #       the month, a hyphen and the day into the record's date field,
        #       which is exactly this form. Four representations coexist in the
        #       baseline - the record's ten-byte form, the separator-less
        #       eight-byte snapshot groups at :297-300 and :309-312, the detail
        #       screen's month and year with no day, and the update screen's
        #       month, year and day - and the one chosen here is the record's,
        #       because that is what expiration_date stores.
        # WHY : Assumptions: the ten bytes really are ISO-ordered, proven three
        #       independent ways rather than assumed from the separators. Both
        #       app/cbl/COCRDUPC.cbl:116-121 and app/cbl/COCRDSLC.cbl:85-90
        #       decompose the field as four, one, two, one, two; and the change
        #       comparison reads the year at (1:4), the month at (6:2) and the
        #       day at (9:2) at app/cbl/COCRDUPC.cbl:1505-1507. Because it is
        #       ISO-ordered a lexical comparison and a date comparison agree,
        #       which is what let the baseline compare these bytes as text and
        #       what lets the target store a true date without changing any
        #       ordering.
        expirationDate:
          type: string
          format: date
          description: >-
            The date this card expires, as an ISO calendar date. Carried across
            CARD-EXPIRAION-DATE PIC X(10) at app/cpy/CVACT02Y.cpy:9 and stored
            as expiration_date. On update the month must fall between one and
            twelve, which is the constraint behind 'Card expiry month must be
            between 1 and 12' at app/cbl/COCRDUPC.cbl:197-198, and an
            unacceptable year yields 'Invalid card expiry year' at :199-200.
          example: '2026-12-31'

        activeStatus:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: >-
            Whether the card is active. Carried across CARD-ACTIVE-STATUS
            PIC X(01) at app/cpy/CVACT02Y.cpy:10 and stored as active_status
            under ck_cards_active_status, which admits these two values only.
            A value outside the pair, or an absent one, yields 'Card Active
            Status must be Y or N' from app/cbl/COCRDUPC.cbl:195-196.
          example: 'Y'

        # WHY : Refactoring Rationale: this token replaces a before-image that
        #       the baseline sent to the terminal and expected back. It
        #       snapshotted the pre-edit values precisely because the
        #       read-for-update lock was never held across the operator's
        #       thinking time - the snapshot at :291-301 and the comparison at
        #       :1503-1508 of app/cbl/COCRDUPC.cbl are that mechanism - so
        #       optimistic concurrency is the baseline's own discipline and not
        #       something introduced here. One integer now stands for the whole
        #       six-field comparison.
        # WHY : Alternatives Considered: carrying the token in an entity-tag
        #       header with a conditional request header on update, rejected in
        #       favour of an explicit property. The property is the direct
        #       one-for-one replacement of the before-image the baseline already
        #       round-tripped through the screen, so the concurrency token stays
        #       visible in the same payload the client edits; a header would
        #       split one logical unit across body and metadata and is the
        #       easier of the two for a client to omit, and an omitted
        #       conditional header fails open by overwriting.
        version:
          type: integer
          format: int32
          minimum: 0
          description: >-
            The server-owned concurrency token for this card. Returned on every
            response that carries a card, and required on update, where it must
            equal the value currently stored or the update is refused with 409.
            A caller never chooses or increments it; the service does, on each
            successful update. Stored as version, which
            db/migration/V1__card.sql declares NOT NULL DEFAULT 0, so a
            never-updated card carries zero.
          example: 3

    # WHY : Trade-offs: closure is expressed with unevaluatedProperties and not
    #       with additionalProperties, and the difference is not stylistic.
    #       additionalProperties is evaluated against the properties declared in
    #       the SAME schema object, so it cannot see the members a composed-in
    #       schema declares: placing it on either shape below would reject the
    #       seven core members outright. unevaluatedProperties is
    #       composition-aware and rejects only what neither the composition nor
    #       the local properties accounted for, which is exactly the closure
    #       wanted. The cost is that a consumer whose validator predates JSON
    #       Schema 2020-12 will ignore the keyword and accept an unknown member;
    #       the alternative - restating all seven members in both shapes so that
    #       additionalProperties could be used - was rejected because two
    #       hand-maintained copies of one entity are what the earlier revision's
    #       own rationale warned against, and the copy that drifted would be the
    #       one that governs the full account number.
    CardDetail:
      allOf:
        - $ref: '#/components/schemas/CardDetailCore'
      unevaluatedProperties: false
      description: >-
        The state of one card as returned by the non-administrative read and by
        update. It carries the masked rendering of the account number and has NO
        member that can hold the full number: this is the shape every caller
        holding only carddemo-user ever receives.

    # WHY : Refactoring Rationale: the full account number lives on this shape
    #       alone, which is returned by one operation alone, and that operation
    #       carries x-required-authority carddemo-admin. Confining the value to a
    #       named schema makes the disclosure boundary something a generator, a
    #       validator or a reviewer can locate mechanically, where the earlier
    #       revision left it as a sentence about when one member means one thing.
    # WHY : Assumptions: the masked rendering is present here too rather than
    #       being replaced by the full one, because an administrative screen shows
    #       the same row a cardholder screen shows and should not have to derive
    #       one rendering from the other. Deriving it client-side would put the
    #       masking rule in two places, and the copy in the browser would be the
    #       one no server-side test covers.
    AdminCardDetail:
      allOf:
        - $ref: '#/components/schemas/CardDetailCore'
      unevaluatedProperties: false
      required:
        - cardNumber
      properties:
        cardNumber:
          type: string
          minLength: 16
          maxLength: 16
          pattern: '^[0-9]{16}$'
          description: >-
            The full primary account number, exactly sixteen digit characters,
            carried across CARD-NUM PIC X(16) at app/cpy/CVACT02Y.cpy:5 and
            stored as card_num. It appears on this schema only, is returned by
            the administrative read only, and is accepted as an input nowhere in
            this document - the selector on every path is the opaque token.
          example: '4111111111110011'
      description: >-
        The state of one card as returned by the administrative read, being the
        shared core plus the full primary account number. A caller holding only
        carddemo-user cannot reach the operation that returns it.

    # WHY : Refactoring Rationale: this envelope declares FOUR members - items,
    #       firstKey, lastKey and hasNext - where it previously declared seven.
    #       The three withdrawn members were nextCursor, prevCursor and hasPrev.
    #       The reduction was made because the shared PageResponse in
    #       services/common-lib/src/main/java/com/carddemo/common/web declares
    #       exactly these four and the migration plan specifies exactly these
    #       four, so the additional three described a body no service would ever
    #       send. It also removes a real hazard rather than merely tidying: three
    #       of seven members were pairwise redundant on every ordinary page, and a
    #       client had no way to know which of a coinciding pair to echo.
    # WHY : Assumptions: the two tokens are BOUNDARY POSITIONS, and that single
    #       reading replaces the earlier split between row identities and request
    #       positions. On an ordinary page each names a row the caller received -
    #       firstKey the first, lastKey the last - and it is also the value to
    #       send back to move past that end. On a page whose every row was
    #       removed by the account filter after being read, they name the two
    #       positions the scan reached instead, which is what keeps that page
    #       resumable without a second pair of members: items is empty, both
    #       tokens are present, and hasNext is true.
    # WHY : Assumptions: the shared type refuses to be constructed in a state a
    #       caller could not act on, so a client may rely on three invariants.
    #       Both tokens are present whenever items is non-empty. Both are sealed
    #       tokens whenever present, never a raw key. And hasNext true implies
    #       lastKey present, so a reported forward step always arrives with the
    #       position to pursue it from. That last one is deliberately ONE-WAY:
    #       the converse is not asserted, because the final page of every set
    #       carries a lastKey while reporting no further page, and asserting the
    #       biconditional would make the last page unconstructable. An absent
    #       token is spelled one way only, as null, where the baseline spelled
    #       absence three ways: low values at app/cbl/COCRDLIC.cbl:243, and
    #       spaces or low values together at :113-114.
    # WHY : Trade-offs: there is no backward availability indicator, and a client
    #       determines whether a previous page exists from the presence of
    #       firstKey. This is what the already-authored browser client for this
    #       context does, so the reduction aligns three artifacts rather than
    #       breaking one. What is given up is the distinction the withdrawn
    #       indicator drew on the opening page, which has a first row and no
    #       predecessor: a client on the opening page therefore holds a firstKey
    #       it cannot page back from, and discovers this by receiving an empty
    #       page rather than by being told in advance. That is one wasted request
    #       at one boundary, against three members no service sends.
    # WHY : Trade-offs: no member states how many rows or pages exist in total.
    #       Such a count cannot be produced without enumerating the whole set
    #       ahead of the cursor, which is the enumeration paging by key exists to
    #       avoid. The cost is that a client cannot render a progress indicator;
    #       hasNext and the presence of firstKey already say everything needed to
    #       offer or withhold the two paging actions.
    # WHY : Trade-offs: the baseline's one-digit screen ordinal, at
    #       app/cbl/COCRDLIC.cbl:237, and its last-page-displayed indicator at
    #       :239 are deliberately not carried across, so no client is told it is
    #       viewing the fourth page of anything. hasNext says what the second of
    #       those said. One detail of the discarded indicator is recorded so
    #       that nobody restores what looks like a transcription slip: its
    #       polarity runs against intuition, giving shown the value 0 at :240
    #       and not-shown the value 9 at :241. This envelope states positively
    #       that a further page exists and inverts nothing.
    CardPage:
      type: object
      description: >-
        One page of the card list together with everything needed to walk the
        ordered set by key in either direction. The number of rows a full page
        carries is settled server-side at seven, from
        WS-MAX-SCREEN-LINES PIC S9(4) COMP VALUE 7 at
        app/cbl/COCRDLIC.cbl:177-178 and corroborated by that program's own row
        arithmetic - the twenty-eight characters by seven rows equalling
        one hundred and ninety-six noted at :250, the matching field width at
        :253, the seven-element table at :255 - and by the seven complete row
        groups of app/cpy-bms/COCRDLI.CPY. A client cannot vary it.
      # WHY : Refactoring Rationale: all SEVEN members are required, and an
      #       earlier revision required only three of them while declaring seven.
      #       The four it left optional are the four the shared envelope always
      #       emits: PageResponse.java has no member it omits, and a Jackson
      #       serialisation of it carries every one, so the contract described a
      #       body this service never sends and a generated client got four
      # WHY : Refactoring Rationale: the envelope is the FOUR members the shared
      #       response type declares -- items, firstKey, lastKey and hasNext, at
      #       services/common-lib/src/main/java/com/carddemo/common/web/PageResponse.java
      #       -- and every one of them is required. An earlier revision of this
      #       document published seven, adding nextCursor, prevCursor and hasPrev.
      #       Those three describe a body this service cannot send: the shared type
      #       has no such components, so a Jackson rendering of it omits them, and a
      #       generated client would have received three accessors that are always
      #       absent while a strict client would have rejected every valid response
      #       for missing a required member. The migration plan fixes the shape at
      #       four members, so the contract follows the type rather than the type
      #       following the contract. Absence of a row identity is spelled null --
      #       the member is present with a null value -- and not by the member being
      #       missing, which is why all four are required rather than only items.
      #       (2) Alternatives Considered: widening the shared type to seven so the
      #       longer contract could stand. Rejected because the two extra cursors
      #       would duplicate firstKey and lastKey, which already carry the positions
      #       a further request is issued from, and hasPrev is derivable from
      #       firstKey being non-null -- so the wider shape would publish three
      #       members a caller must be told how to reconcile with three others.
      required:
        - items
        - firstKey
        - lastKey
        - hasNext
      additionalProperties: false
      properties:
        # WHY : Assumptions: the upper bound of seven is declared on the array
        #       itself, and not left as prose above it. Seven is a server-owned
        #       constant a client cannot vary, so it is a property of every
        #       response rather than of a request, and a page carrying an eighth
        #       row would be a defect in this service - one worth failing a
        #       contract check rather than reaching a client that had sized its
        #       rendering for seven. No lower bound is declared, because the
        #       empty page is legitimate twice over: an exhausted set, and a page
        #       whose every row the account filter removed after it was read.
        items:
          type: array
          maxItems: 7
          description: >-
            The rows of this page, in ascending card-number order, at most seven
            of them. Empty, never null, when the set is exhausted or when every
            row read was removed by the account filter. The count may be below
            seven while further rows still exist, for the post-read filtering
            reason given on the list operation, so it must not be used to infer
            the end of the set.
          items:
            $ref: '#/components/schemas/CardSummary'

        firstKey:
          oneOf:
            - $ref: '#/components/schemas/CursorToken'
            - type: 'null'
          description: >-
            Names the first row actually returned in items, or null exactly
            when items is empty. It is also the position a caller pages backward
            from: send it as the cursor parameter with direction previous. A page
            whose every row the account filter removed after it was read carries
            null here, and on such a page there is no backward position to send,
            which is the one case a caller must handle rather than retry.

        # WHY : Refactoring Rationale: this names the last row the caller
        #       actually received, and that is a documented divergence from the
        #       baseline rather than a restatement of it. After filling a page
        #       of seven the baseline captures the seventh row's key at
        #       app/cbl/COCRDLIC.cbl:1194-1195, then issues one further read at
        #       :1197 purely to discover whether anything follows - and on
        #       finding a row it OVERWRITES the captured key with that row's key
        #       at :1212-1214. The value it retains therefore identifies the
        #       eighth record on a page of seven, a row the terminal never
        #       displayed. The baseline does that; this contract names only rows
        #       the caller holds, so that every token a client is given can be
        #       verified against something it actually received, and the
        #       divergence is registered as D-LASTKEY-RECEIVED in
        #       docs/architecture/cobol-to-service-traceability.md. Naming the
        #       entry rather than saying only that the difference is documented
        #       is deliberate: a claim of documentation that names no entry
        #       cannot be checked, which is how such entries came to be missing.
        lastKey:
          oneOf:
            - $ref: '#/components/schemas/CursorToken'
            - type: 'null'
          description: >-
            Names the last row actually returned in items, never the extra row
            read to settle hasNext, or null exactly when items is empty. It is
            also the position a caller pages forward from: send it as the cursor
            parameter with direction next, which the shared envelope supports
            because the row identity and the forward position are the same value
            on every page this service returns.

        # WHY : Assumptions: this is settled by reading one row beyond the page
        #       and observing whether that row exists - never from any tally of
        #       how many rows or pages there are. The baseline does exactly
        #       that: after the page fills it issues a further read at
        #       app/cbl/COCRDLIC.cbl:1197 whose record never joins the page,
        #       reporting a further page when that read succeeds at :1210-1211
        #       and none when it reaches the end of the file at :1216. A service
        #       building this envelope therefore asks its store for one row more
        #       than it will return, puts the surplus row nowhere, and reports
        #       only its presence.
        hasNext:
          type: boolean
          description: >-
            Whether a page follows this one, and the only forward availability
            statement this envelope makes. Always true on a page reached by
            paging backward, because a caller can only page backward from a page
            it reached by paging forward - the baseline asserts the same thing
            unconditionally at app/cbl/COCRDLIC.cbl:1287. Because rows are
            filtered after being read, this and not the row count is the only
            statement about whether more rows exist. When it is true, lastKey is
            present.

    CardUpdateRequest:
      type: object
      description: >-
        A change to the three editable attributes of one card, together with the
        concurrency token last read for it. The card being changed is named in
        the request path and is not repeated here; neither the card number nor
        the account identifier is editable, and the baseline agrees by omitting
        both from the six fields its change comparison tests at
        app/cbl/COCRDUPC.cbl:1503-1508.


        No verification value and no snapshot, prior-value or before-image
        property of any kind appears, for the reasons recorded on
        CardDetailCore. A
        field failing validation yields 400 with an entry in the per-field
        array; where more than one field fails, every failing field appears in
        the array while the aggregate message reports the first.
      required:
        - embossedName
        - activeStatus
        - expirationDate
        - version
      additionalProperties: false
      properties:
        # WHY : Refactoring Rationale: the same pattern the read schema carries
        #       is repeated here rather than referenced, because the two schemas
        #       are independent objects and a request must be rejectable on its
        #       own terms. A caller validating against this schema before sending
        #       therefore sees the same constraint the service applies, so the
        #       'Card name can only contain alphabets and spaces' refusal at
        #       app/cbl/COCRDUPC.cbl:183-184 becomes a condition the caller can
        #       anticipate rather than only discover.
        embossedName:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Za-z ]+$'
          description: >-
            The replacement name to emboss, alphabetic characters and spaces
            only, up to fifty characters. Carried across the CRDNAMEI PIC X(50)
            input field at app/cpy-bms/COCRDUP.CPY:72. An empty or absent value
            yields 'Card name not provided' from app/cbl/COCRDUPC.cbl:181-182;
            a value carrying anything outside the permitted set yields 'Card
            name can only contain alphabets and spaces' from :183-184. The
            stored value is upper case, so the value read back may differ in
            case from the value sent.
          example: JOHN Q PUBLIC
        activeStatus:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: >-
            The replacement active status, restricted to the two values the
            database also enforces. Carried across the CRDSTCDI PIC X(1) input
            field at app/cpy-bms/COCRDUP.CPY:78. Anything else, including an
            absent value, yields 'Card Active Status must be Y or N' from
            app/cbl/COCRDUPC.cbl:195-196.
          example: 'Y'
        expirationDate:
          type: string
          format: date
          description: >-
            The replacement expiry date as an ISO calendar date. This single
            field carries the three separate screen inputs EXPMONI PIC X(2),
            EXPYEARI PIC X(4) and EXPDAYI PIC X(2) at
            app/cpy-bms/COCRDUP.CPY:84, :90 and :96, which the baseline itself
            joins into exactly this form at app/cbl/COCRDUPC.cbl:1467-1474. A
            month outside one to twelve yields 'Card expiry month must be
            between 1 and 12' from :197-198; an unacceptable year yields
            'Invalid card expiry year' from :199-200.
          example: '2026-12-31'
        version:
          type: integer
          format: int32
          minimum: 0
          description: >-
            The concurrency token as read from the card being changed. It must
            equal the value currently stored, or the update is refused with 409
            and 'Record changed by some one else. Please review' from
            app/cbl/COCRDUPC.cbl:207-208. It is echoed unchanged from a previous
            response and never chosen or incremented by the caller.
          example: 3

    # WHY : Assumptions: this schema exists so that a card number has somewhere
    #       to travel that is not a request target. It carries one member and
    #       will not acquire a second: any further narrowing belongs on the list
    #       operation's query parameters, where it can be combined with paging,
    #       and only the card-number criterion has a reason to be in a body.
    # WHY : Trade-offs: a single-member object rather than a bare string body.
    #       A bare string would be shorter and is rejected because it cannot
    #       name the member that failed validation, so the per-field error array
    #       every other refusal in this document populates would have nothing to
    #       point at; an object gives the field the name 'cardNumber' in that
    #       array and leaves room for the schema to state its own constraint.
    CardLookupRequest:
      type: object
      description: >-
        The criterion for the lookup operation: one card number, carried in a
        request body rather than in a request target. This is the body form of
        the baseline's CARDSIDI list filter field at
        app/cpy-bms/COCRDLI.CPY:72.
      required:
        - cardNumber
      additionalProperties: false
      properties:
        cardNumber:
          type: string
          minLength: 16
          maxLength: 16
          pattern: '^[0-9]{16}$'
          description: >-
            The card number to narrow to, as exactly sixteen digit characters. A
            masked rendering taken from a previous response is not a valid value,
            because the masked form does not identify a row. An absent value, or
            one of the wrong width or carrying a non-digit, yields 400 with the
            baseline's own wording 'Card number if supplied must be a 16 digit
            number' from app/cbl/COCRDUPC.cbl:193-194 and an entry naming this
            field in the per-field array.
          # WHY : Assumptions: the member is declared write-only, and the flag is
          #       load-bearing rather than decorative. This is the only place in
          #       this contract that ACCEPTS a full primary account number, and no
          #       response other than the administrative read renders one, so a
          #       generated client that modelled this schema in both directions
          #       would expose a response accessor for a value it can never
          #       receive. A contract test asserts the flag, because a schema that
          #       accepts a full number without declaring its direction is the
          #       shape a future response could be built from by accident.
          writeOnly: true


    # WHY : Assumptions: this mirrors the shared ApiError in
    #       services/common-lib/src/main/java/com/carddemo/common/error member
    #       for member and is not a card-local variant of it. The shared advice
    #       in that package assembles every failure body in this service, so a
    #       divergence here would be a description that does not match what is
    #       sent.
    # WHY : Assumptions: the machine-readable codes are kept strictly apart
    #       from the prose, because the baseline keeps them apart too - its
    #       structured error record declares two nine-character code fields
    #       separately from the message text they accompany. A client therefore
    #       branches on code and secondaryCode and renders message, and never
    #       parses the sentence. The codes are also never reworded, whereas the
    #       prose is carried verbatim from whichever copybook or program owns
    #       it.
    # WHY : Trade-offs: no diagnostic detail whatsoever is carried - no stack
    #       trace, no database vendor code, no CICS response or reason code, no
    #       connection string, no credential and no constraint name. A
    #       referential-integrity refusal is reported as a conflict with a
    #       meaningful sentence and the offending constraint is not named. The
    #       cost is that a caller cannot self-diagnose from the payload; the
    #       correlation identifier is the intended route, tying this response to
    #       the operational record where such detail belongs.
    ApiError:
      type: object
      description: >-
        The single failure shape every operation in this service returns, for
        every status. It carries two independent channels: one aggregate
        sentence for a person to read, latched to the first failure detected,
        and one array of per-field entries that accumulates every offending
        field. A client must not reconstruct the sentence by joining the array,
        and must not assume the array holds exactly one entry.
      required:
        - code
        - secondaryCode
        - severity
        - subsystem
        - status
        - correlationId
        - path
        - timestamp
        - fieldErrors
      properties:
        code:
          type: string
          description: >-
            The stable machine-readable identifier of the failure, matched on by
            clients and by operational tooling and never reworded. This service
            uses the shared identifiers of the kernel, whose numeric suffix
            aligns with the HTTP status the shared advice assembles: the
            validation identifier for 400, the not-found identifier for 404, the
            conflict identifier for 409 and the internal identifier for 500.
          example: CARDDEMO-0409
        secondaryCode:
          type: string
          description: >-
            A subordinate identifier qualifying code, or the empty string when
            the failure has no second identifier. This is what discriminates the
            three conditions that share the 409 status, and it is required for
            that purpose because the sentence alone cannot always discriminate -
            app/cbl/COCRDUPC.cbl:189-190 and :191-192 are two distinct
            conditions carrying byte-identical text.
          example: CARD-DATA-CHANGED
        # WHY : Refactoring Rationale: the seventy-five-character width is
        #       DECLARED rather than merely mentioned. This property previously
        #       carried no bound at all while its description observed that
        #       renderers may hold it to seventy-five, which left the one
        #       inherited width the migration actually carries forward
        #       unenforced here and declared in the sibling contracts - so one
        #       shared record was described three different ways. The bound is
        #       MESSAGE_RENDERING_WIDTH in the shared error type, from
        #       CCARD-ERROR-MSG PIC X(75) and CCARD-RETURN-MSG PIC X(75) at
        #       app/cpy/CVCRD01Y.cpy:28-29.
        # WHY : Assumptions: declaring it costs nothing, which is why it is safe
        #       to declare. The longest sentence any condition in this document
        #       carries is the fifty-one-character 'Transaction received after
        #       account expiration' family; every message this service can emit
        #       is well inside seventy-five, so no value is truncated to fit and
        #       none needs to be. Had any exceeded it, the correct repair would
        #       have been to widen this bound rather than to shorten a message,
        #       because the text is carried character for character.
        message:
          type:
            - string
            - 'null'
          maxLength: 75
          description: >-
            The aggregate sentence, carried verbatim from the baseline copybook
            or program that owns it wherever one does. Deliberately nullable:
            null is the migrated form of no-message and the empty string the
            migrated form of an empty message, two states the baseline
            distinguishes and this shape therefore does not merge. Bounded at
            seventy-five characters, the width of CCARD-ERROR-MSG PIC X(75) and
            CCARD-RETURN-MSG PIC X(75) at app/cpy/CVCRD01Y.cpy:28-29, which is
            the only one of the migration's four inherited message widths carried
            forward as a rendering constraint.
          example: Record changed by some one else. Please review
        severity:
          $ref: '#/components/schemas/Severity'
          description: >-
            How serious this failure is, on the baseline's own four-level
            ladder. The five client-correctable failures are all at the warning
            level, because each is an outcome a caller may act on rather than a
            fault in the service; the unclassified failure reported as 500 is at
            the critical level, which is the one place the two differ and the
            reason this property is worth reading rather than assuming.
        subsystem:
          $ref: '#/components/schemas/Subsystem'
          description: >-
            Which part of the platform the failure arose in, on the baseline's
            own six-value ladder. This service produces only the application
            and relational values; a response naming any of the other four
            would misattribute the failure.
        status:
          type: integer
          format: int32
          description: >-
            The HTTP status this response carries, restated inside the body so
            that a payload which has been logged or archived away from its
            response envelope is still self-describing. It always equals the
            status of the response that carried it.
          example: 409
        # WHY : Assumptions: the empty string is admitted as well as a conforming
        #       identity, and it is not slack. The shared shape normalises an
        #       absent identity to the empty string at ApiError.java:384, and the
        #       assembling advice supplies the empty string when the logging
        #       context holds no entry at GlobalExceptionHandler.java:957-959,
        #       which is the state of a failure raised before the correlation
        #       filter ran. Declaring only the token shape would describe a body
        #       this service can in fact emit as invalid.
        correlationId:
          allOf:
            - $ref: '#/components/schemas/CorrelationId'
          description: >-
            Identifies the unit of work that failed, inherited from the inbound
            request rather than generated here, and the empty string when the
            request carried none and none had been minted. It is the intended
            route from this response to the operational record, which is where
            diagnostic detail lives. Correlating the events of one unit of work
            is an idea this migration inherited rather than introduced: the
            baseline's structured error record already carries a
            twenty-character event key.
        # WHY : Refactoring Rationale: the example is an opaque card selector and
        #       an earlier revision of this document showed a masked account
        #       number here. That example was consistent with itself and still
        #       wrong as guidance, because it advertised a URL shape whose path
        #       segment was derived from a primary account number, and this
        #       document no longer has one: the selector on every card path is the
        #       opaque token described on OpaqueCardIdPath. Nothing derived from an
        #       account number reaches this member, masked or otherwise.
        path:
          type: string
          description: >-
            The request path that failed, so that a client reporting a problem
            does not have to reconstruct which call produced it. The empty
            string when no path is available. No card number, and nothing derived
            from one, appears here: every card path carries the opaque selector,
            and the shared advice additionally masks any digit run long enough to
            be an account number before placing a path in this member, so a
            mistaken route cannot leak one through the diagnostic field.
          example: /api/v1/cards/Zm9vYmFyYmF6cXV1eDEyMw
        timestamp:
          type: string
          description: >-
            When the failure occurred, in the baseline-compatible
            twenty-six-character form of a date, a space and a time carrying
            microseconds. It is supplied to the shape rather than read from the
            clock by it, which is what allows a test to assert on a known
            reading.
          example: '2026-08-05 09:16:44.902355'
        fieldErrors:
          type: array
          description: >-
            One entry per offending field, in the order the validating code
            reported them; empty, never null, when the failure is not
            attributable to particular fields. The length varies with how many
            fields failed, because the baseline's per-field flags accumulate
            unconditionally even while its aggregate sentence stays latched to
            the first.
          items:
            $ref: '#/components/schemas/FieldError'
        # WHY : Assumptions: this member is POPULATED on 500 and null on the
        #       other five, which is the opposite of what an earlier revision of
        #       this file stated when no 500 was declared. The shared advice
        #       builds an abend block for every failure it could not classify,
        #       and the block a client receives is the reduced external form: the
        #       four-character condition code survives, the culprit and reason are
        #       replaced by the empty string, and the operator sentence is a fixed
        #       client-safe line. The reduction is what allows an abend block to
        #       be surfaced at all - the internal culprit and reason name
        #       application components, which is the diagnostic detail every body
        #       in this document withholds.
        abend:
          oneOf:
            - $ref: '#/components/schemas/AbendDetail'
            - type: 'null'
          description: >-
            The structured detail of an abnormal termination when the failure
            was one, and null otherwise. Nullable rather than an empty object
            because such a failure is genuinely absent from a validation or
            conflict response rather than present and blank. Of the six failures
            this service declares only the 500 is of that kind, so this member is
            null on the other five and present, in its reduced external form, on
            that one.

    # WHY : Alternatives Considered: the conflict body is COMPOSED from the
    #       shared error shape by reference rather than being a fourth
    #       hand-written error type, and rather than the shared shape gaining a
    #       card-shaped member. Adding such a member to the shared type would
    #       put one bounded context's entity into the failure shape all eight
    #       services return, and every other service would then carry a member
    #       it can never populate. Writing a standalone type here would fork the
    #       error contract, so a later change to the shared shape would leave
    #       this document describing the old one with nothing to detect the
    #       drift. Composition keeps the shared type single-sourced and
    #       unmodified - it is referenced, not copied - while letting exactly
    #       one response in one service carry exactly one extra member.
    # WHY : Refactoring Rationale: the extra member exists because a bare
    #       conflict would lose behaviour the baseline has. On detecting the
    #       change the baseline re-displays the freshly-read record and
    #       re-snapshots all six compared fields from it, at
    #       app/cbl/COCRDUPC.cbl:1511-1517, leaving the operator holding current
    #       values and able to resubmit at once. Without the refreshed card a
    #       client would have to issue a second read before it could retry, and
    #       between those two requests the row could move again.
    # WHY : Assumptions: this contract leads and the Java follows. Neither the
    #       controller nor the mapper of this module exists yet, so the shape
    #       declared here is what they are written to produce; a generated
    #       document that omitted the member would indicate the implementation
    #       had not met the contract rather than that the contract was wrong.
    #       The member is populated for the changed-row condition only, because
    #       only that condition has a current representation to return - which
    #       is why it is optional and nullable rather than required.
    CardConflictError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          description: >-
            The card-service addition to the shared error shape for the
            conflict status: the refreshed card, where one exists.
          properties:
            card:
              oneOf:
                - $ref: '#/components/schemas/CardDetail'
                - type: 'null'
              description: >-
                The card as it now stands, carrying the version token a retry
                must echo. Present for the changed-row condition only, and null
                for the two conditions in which the write did not proceed and
                so left no new state to report. It is the masked CardDetail
                shape, never the administrative one, so a failure cannot widen
                what a response discloses: the update operation carries
                x-required-authority carddemo-user, and no conflict body has any
                member able to hold a full account number.
      description: >-
        The body of the conflict response: every member of the shared error
        shape, referenced rather than restated, plus one optional card. It is
        used by this status alone; the other four failures return the shared
        shape unextended.

    # WHY : Refactoring Rationale: the schema is named FieldError, where it was
    #       previously named ApiFieldError. The Java record it mirrors is the
    #       nested FieldError of the shared error type, and the sibling contracts
    #       of this migration publish it under that name, so the prefixed
    #       spelling was a third name for one shape - which is precisely how a
    #       generated client ends up with two classes for one entity and a reader
    #       ends up unsure whether they are the same thing.
    # WHY : Refactoring Rationale: the entry is CLOSED to additional members.
    #       Every other object schema in this document already refuses unknown
    #       members and this one did not, which made it the one place a service
    #       could add a field to a failure body without the contract noticing -
    #       and a failure body is the last place an undeclared member should be
    #       able to appear, because it is what a client parses when something has
    #       already gone wrong.
    FieldError:
      type: object
      description: >-
        One offending field. This is the structured counterpart of the
        baseline's field-highlight mechanism, where a validation flag drove a
        colour attribute on the corresponding screen field. It names the field,
        the state that field is in, and the sentence describing what is wrong
        with it.
      required:
        - field
        - state
        - message
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
          description: >-
            The name of the offending property exactly as it appears in the
            request that carried it, so a client can bind the entry to the input
            it rendered without mapping table or guesswork.
          example: activeStatus
        state:
          allOf:
            - $ref: '#/components/schemas/FieldValidationState'
          description: >-
            Which of the two failing states this field is in: it carried an
            unacceptable value, or it carried none at all. Both are errors; the
            distinction lets a client prompt for a missing field differently
            from one it must correct, which is the distinction the baseline drew
            when it marked a blank field with an additional character as well as
            a colour.
        message:
          type: string
          maxLength: 75
          description: >-
            What is wrong with this field, carried verbatim from the baseline
            condition that owns the wording. It may repeat the aggregate
            sentence when this entry is the first failure, and differ from it
            when it is not. Bounded at the same seventy-five characters as the
            aggregate sentence, and for the same reason: the two carry the same
            kind of text and a client renders them in the same place.
          example: Card Active Status must be Y or N

    # WHY : Refactoring Rationale: the domain is the TWO failing states, where
    #       this schema previously declared three by including the valid one. A
    #       valid state cannot occur in this array: an entry exists only because
    #       a field was refused, so admitting VALID would have let the array's
    #       length stop equalling the number of offending fields and would have
    #       handed a client two contradictory signals in one entry - a field
    #       named as an error and simultaneously reported acceptable. The shared
    #       validation flag type does declare three constants, and correctly so
    #       because it also describes fields that passed; the nested error record
    #       that this schema mirrors rejects the third, and this is that record.
    # WHY : Assumptions: the two that remain are the two arms of the disjunction
    #       at app/cpy/CSSETATY.cpy:18-19, and the blank arm is the one that
    #       additionally earned the literal asterisk marker at :23-25 - which is
    #       why the baseline itself needed to tell them apart and why this
    #       contract keeps them apart rather than reporting one error state.
    FieldValidationState:
      type: string
      description: >-
        The state of one refused field, drawn from the shared kernel's two
        failing values rather than a newly invented domain. Blank is a kind of
        error and not a third state beside valid and invalid, which is why the
        baseline tests the two together in one disjunction at
        app/cpy/CSSETATY.cpy:18-19 while the blank path additionally sets its own
        flag. Distinguishing them lets a client render a missing field
        differently from a wrong one without changing whether it is an error.
      enum:
        - NOT_OK
        - BLANK
      example: BLANK

    Severity:
      type: string
      description: >-
        The operational level of a failure, drawn from the baseline's own
        four-value domain rather than a newly invented ladder. Two of the four
        occur here: the five client-correctable failures are WARNING, because
        they are outcomes a caller may act on rather than faults in the service,
        and the unclassified failure reported as 500 is CRITICAL, because it is.
        The remaining two name levels below the threshold at which a failure
        response is produced at all.
      enum:
        - LOG
        - INFO
        - WARNING
        - CRITICAL
      example: WARNING

    # WHY : Assumptions: the domain is the baseline's own and is therefore
    #       wider than this service can produce. Three of its six values name
    #       platform components the migrated system does not run at all, and
    #       they are retained because the shared shape is single-sourced across
    #       every service rather than narrowed per service - narrowing it here
    #       would make this document disagree with the body actually sent. A
    #       card-service failure is APPLICATION when it arises in the service's
    #       own logic and RELATIONAL when it arises at the database, and never
    #       any of the remaining four.
    Subsystem:
      type: string
      description: >-
        Which part of the platform a failure arose in, drawn from the
        baseline's own six-value domain. Only APPLICATION and RELATIONAL occur
        in this service; the other four name components with no counterpart in
        the migrated runtime and are present only because the shape is shared
        unchanged across all services.
      enum:
        - APPLICATION
        - CICS
        - IMS
        - RELATIONAL
        - QUEUE
        - OBJECT_STORE
      example: RELATIONAL

    # WHY : Assumptions: the four members and their widths come from
    #       app/cpy/CSMSG02Y.cpy:21-29, where the record is declared at :21 and
    #       its four fields at :22, :24, :26 and :28 with widths of four, eight,
    #       fifty and seventy-two characters. That citation is stated precisely
    #       because a range beyond the end of that file circulates elsewhere in
    #       the migration's own documents; the file is thirty-five lines long,
    #       so any citation past it cannot be read. A further hazard worth
    #       recording: the file's own internal title names a different copybook
    #       than its path does.
    # WHY : Assumptions: all four members are required by this schema and yet
    #       two of them are always empty and a third always the same sentence in
    #       any response a client can receive, and that combination is
    #       deliberate rather than contradictory. The shared type is constructed
    #       for external use through a factory that supplies an empty culprit, an
    #       empty reason and one fixed operator-facing sentence, and the shared
    #       error record applies that factory in its canonical constructor, so no
    #       code path can assemble a client-facing body carrying the internal
    #       values. Requiring the members keeps the shape stable - a client
    #       parses four members whatever happened - while the descriptions below
    #       state what a client will actually find in each, so nobody writes a
    #       branch on a culprit value that never arrives.
    # WHY : Trade-offs: an alternative shape would have omitted the two members
    #       entirely from external bodies and declared them optional. It was
    #       rejected because the shared type is one type serving both internal
    #       diagnostics and external responses, and making members optional would
    #       move the redaction decision from one factory into every construction
    #       site. Keeping them required and always redacted concentrates the
    #       decision in one place; the cost is a schema whose required members
    #       carry less than their widths suggest, which these descriptions
    #       correct.
    AbendDetail:
      type: object
      description: >-
        The structured detail of an abnormal termination, carried inside
        ApiError when a failure was of that kind. Of the six failures this
        service declares, the 500 is the only one that carries it; on the other
        five it is null. What a client receives is the reduced external form, in
        which the condition code survives and the culprit and reason are the
        empty string, so every component is declared here but two of the four are
        deliberately blank on the wire.
      required:
        - abendCode
        - abendCulprit
        - abendReason
        - abendMsg
      properties:
        abendCode:
          type: string
          maxLength: 4
          description: >-
            The four-character code identifying the termination, from
            ABEND-CODE PIC X(4) at app/cpy/CSMSG02Y.cpy:22. The empty string
            when none was recorded, which is that field's own declared initial
            value.
        abendCulprit:
          type: string
          maxLength: 8
          description: >-
            The eight-character name of the component the termination is
            attributed to, from ABEND-CULPRIT PIC X(8) at
            app/cpy/CSMSG02Y.cpy:24. It names an application component and
            never a host, an account or an infrastructure resource - and in the
            reduced external form a client receives it is always the empty
            string, because naming the component is itself the diagnostic detail
            every body in this document withholds.
        abendReason:
          type: string
          maxLength: 50
          description: >-
            The reason for the termination in up to fifty characters, from
            ABEND-REASON PIC X(50) at app/cpy/CSMSG02Y.cpy:26. Fifty is one of
            the migration's four inherited message widths and is distinct from
            the seventy-five-character width that governs the aggregate message.
            Like the culprit, it is the empty string in the reduced external form
            a client receives.
        abendMsg:
          type: string
          maxLength: 72
          description: >-
            The operator-facing sentence for the termination in up to
            seventy-two characters, from ABEND-MSG PIC X(72) at
            app/cpy/CSMSG02Y.cpy:28. It carries no diagnostic detail of the
            kinds excluded from every failure body in this service.
