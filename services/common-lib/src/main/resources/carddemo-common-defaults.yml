# =============================================================================
# CardDemo migration | services/common-lib/src/main/resources/carddemo-common-defaults.yml
# The ONE definition of the structured log line and of the three metric tag
# values, shared by every migrated service.
# =============================================================================
#
# Purpose:
#   Carries the six cross-cutting configuration values that have to be identical
#   in every bounded context, so that they are written once here rather than
#   copied into eight application.yml files:
#
#     1. logging.structured.* -- the STRUCTURED APPLICATION LOG FORMAT: one JSON
#        object per event, carrying the three metric tag values as service
#        dimensions and every mapped-diagnostic-context key -- the correlation
#        identity among them -- as a queryable field.
#     2. logging.pattern.console -- the human-readable console layout, which
#        names the two mapped-diagnostic-context keys the shared correlation
#        filter publishes. It is the fallback layout, in force only when the
#        structured format above is switched off.
#     3. carddemo.environment / carddemo.version -- the two metric tag values
#        the shared meter filter reads, which the structured log format also
#        reads. The third tag value, the service name, is
#        spring.application.name and is genuinely per-service, so it is NOT
#        defaulted here.
#     4. OpenTelemetry export defaults -- traces, logs and OTLP metrics stay off
#        outside a deployment that explicitly supplies the task-local collector.
#     5. The two REFUSAL-RENDERING defaults: what the framework's fallback error
#        body may disclose (server.error.*, below) and which dispatcher types the
#        security filter chain applies to
#        (spring.security.filter.dispatcher-types, below). Both are cross-cutting
#        in exactly the same sense as the first four -- eight services must answer
#        a refused request identically -- and both were reached by review finding
#        one service answering wrongly rather than by design.
#     6. spring.datasource.hikari.data-source-properties.logServerErrorDetail --
#        whether the PostgreSQL driver folds the server's DETAIL and HINT fields,
#        and the bound parameter values inlined into them, into the exception
#        message that every log site downstream then renders. Withheld here for
#        all eight services, for the reason stated at the key itself.
#
#   The count in the opening sentence read "four" while the list already carried
#   five entries; it was corrected to six when the sixth was added, because a
#   stale count invites a reader to stop at the fourth item.
#
# How a service consumes it:
#   One line in the service's own application.yml:
#
#     spring:
#       config:
#         import: "classpath:/carddemo-common-defaults.yml"
#
#   Imported values sit BENEATH the importing file in precedence, so a service
#   that has a reason to override the pattern still can, and the override is
#   visible in that service's own file.
#
# Refactoring Rationale: why this file exists at all.
#   Only one service carried a console pattern naming the correlation key, so the
#   correlation identity the filter published reached the log output of exactly
#   one of them; the framework's default pattern names no context key, so the
#   identity was present in the context and absent from every line. And most
#   services supplied no value for the environment and version tags, so their
#   meters carried the "unspecified" fallback the meter filter substitutes. Both
#   defects have the same shape -- a shared component correctly written and then
#   not given the configuration it reads -- so both are answered in one place.
#
# Alternatives Considered: a classpath import rather than eight copies.
#   Eight identical literals were the obvious alternative and were rejected: the
#   pattern names context keys owned by a class in this module, so a key renamed
#   in the class has to be renamed in every copy, and a copy missed produces a
#   line with an empty field rather than an error. An environment post-processor
#   contributing the same defaults programmatically was also considered and
#   rejected as a second registration file plus a class, to deliver values that
#   are static text. Config-data import is resolved before the logging system
#   initialises, so a pattern supplied this way is in force for the first line a
#   service logs.
#
# Trade-offs: a property file rather than a logback include.
#   A logback-spring.xml fragment would also single-source the layout, and it was
#   rejected because it would bind every service to one logging implementation
#   and would express the metric tag values nowhere -- leaving two mechanisms for
#   two halves of one concern. A property file expresses both.
# =============================================================================

logging:
  structured:
    format:
      # WHY : (1) Refactoring Rationale: this key is what makes centralized
      #       structured logging an implemented control rather than an
      #       obligation on whoever configures an encoder later. Before it
      #       existed, no module shipped a logback-spring.xml and no
      #       application.yml named a structured format, so every service
      #       emitted the framework's default console layout while
      #       docs/architecture/observability.md specified one JSON object per
      #       event -- a specified control with no implementation, and the
      #       failure was silent because prose lines still appeared in the log
      #       group and still looked like logging.
      #       (2) Assumptions: the value is `ecs`, which is one of the three
      #       formats the pinned framework recognises by identifier -- `ecs`,
      #       `logstash` and `gelf` -- and it is chosen rather than defaulted.
      #       ECS carries the service NAME, VERSION and ENVIRONMENT as declared
      #       members, which are exactly the three common tags the shared meter
      #       filter puts on every metric, so a log record and a metric series
      #       can be filtered by the same three dimensions with the same three
      #       spellings. `logstash` has no equivalent service block and `gelf`
      #       carries only a version, so either would have left two of the three
      #       dimensions expressible on metrics and not on logs.
      #       (3) Assumptions: the mapped diagnostic context reaches the record
      #       as top-level fields, which is what carries the correlation
      #       identity com.carddemo.common.web.CorrelationIdFilter publishes --
      #       correlationId and requestId -- plus the traceId and spanId
      #       Micrometer tracing contributes. This is the property that makes a
      #       log line joinable to the API Gateway edge record for the same
      #       request, and it is asserted by
      #       StructuredLoggingDefaultsTest rather than assumed.
      #       (4) Trade-offs: the value is indirected through an environment
      #       variable so a developer reading a terminal can switch back to the
      #       bracketed pattern below by exporting the variable EMPTY. An empty
      #       value is what the framework treats as "no structured format", so
      #       the switch needs no second key and cannot leave both layouts
      #       claiming the console. The cost is that the deployed format is
      #       overridable at all; the compensation is that the override is one
      #       named variable whose absence is the secure default, rather than a
      #       local edit to this file that could be committed by accident.
      console: ${CARDDEMO_LOG_CONSOLE_FORMAT:ecs}

    ecs:
      service:
        # WHY : Assumptions: these three are the SAME values the shared meter
        #       filter reads -- spring.application.name for the service
        #       dimension and the two carddemo.* keys below for environment and
        #       version -- and they are referenced here rather than restated as
        #       literals. Restating them is what would let a service's metrics
        #       and its log records disagree about which environment produced
        #       them, with nothing failing on either side. The service name has
        #       no default in this file because it is genuinely per-service, so
        #       the placeholder carries a last-resort literal that is
        #       recognisably not a service name rather than the name of some
        #       arbitrary one.
        name: ${spring.application.name:carddemo-unnamed-service}
        environment: ${carddemo.environment}
        version: ${carddemo.version}

  pattern:
    # WHY : (1) Assumptions: traceId and spanId are contributed by Micrometer
    #       tracing, while correlationId and requestId are the two keys
    #       com.carddemo.common.web.CorrelationIdFilter puts into the mapped
    #       diagnostic context and removes in a finally block. The four fields
    #       have different origins and remain separate so one service line can
    #       pivot to its distributed trace and to the matching API Gateway edge
    #       record without replacing the caller's correlation identity.
    #       (2) Assumptions: the ":-" default in each substitution renders an
    #       empty field rather than the literal text "correlationId_IS_UNDEFINED"
    #       that an unqualified reference emits when the key is absent. A key IS
    #       absent on any line logged outside a request -- startup, shutdown, a
    #       scheduled task -- so without the default every such line would carry a
    #       spurious token.
    #       (3) Trade-offs: the four context identifiers are bracketed and
    #       separated by a single space rather than emitted as key=value pairs.
    #       Bracketing keeps the line readable in a terminal during development,
    #       which is where this pattern is actually read.
    #       (4) Assumptions: this pattern is the FALLBACK layout and not the
    #       default one, and the distinction is stated here because the file
    #       reads as though it were the default. Whenever
    #       logging.structured.format.console above resolves to a non-empty
    #       format identifier -- which it does unless CARDDEMO_LOG_CONSOLE_FORMAT
    #       is exported empty -- the console appender is built from the
    #       structured encoder and this pattern has no effect at all. It is kept
    #       rather than deleted because the two layouts answer different
    #       questions: the structured record is what a log-insights query reads,
    #       and this line is what a developer reads while a service is starting
    #       in a terminal. An earlier revision of this comment described a
    #       structured encoder as a deployment-time choice that would replace
    #       this pattern wholesale; the encoder is now configured in this same
    #       file, so the replacement is expressed here rather than deferred.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%X{traceId:-} %X{spanId:-} %X{correlationId:-} %X{requestId:-}] %logger{36} : %msg%n"

  level:
    # WHY : (1) Refactoring Rationale: this ONE framework logger is switched off,
    #       and it is switched off because it defeats every redaction this
    #       repository owns. The pinned starter's message sink logs
    #       `error("Error processing message {}.", id, throwable)` with the
    #       throwable as its trailing argument -- verified from the compiled
    #       class, io.awspring.cloud.sqs.listener.sink
    #       .AbstractMessageProcessingPipelineSink -- so the logging facade
    #       renders the exception, then every cause, then their MESSAGES. Those
    #       messages are not written here: they come from a JDBC driver quoting
    #       the statement it could not run, a codec quoting the bytes it could not
    #       read, a validation library naming the value it rejected. Any of them
    #       can carry a primary account number or a whole request record, and this
    #       is the queue-side counterpart of exactly the exposure
    #       com.carddemo.common.observability.ThrowableDigest exists to close on
    #       the servlet side.
    #       (2) Assumptions: the line is unreachable by any other means. It fires
    #       from inside the framework whether or not a listener registers an
    #       error handler, so a handler cannot suppress it; and this repository
    #       ships no logback-spring.xml -- deliberately, because one would take
    #       over the appender chain wholesale -- so there is no filter to install
    #       instead. A level of `off` is the only mechanism that reaches it, and
    #       it is declarative and resolved before the logging system initialises.
    #       (3) Assumptions: nothing diagnostic is lost, because a replacement
    #       record is written by code this repository owns. Each of the three
    #       consuming contexts -- account-service, authorization-service and
    #       reference-service -- publishes
    #       com.carddemo.common.messaging.RethrowingDigestErrorHandler as
    #       an ErrorHandler bean, which the starter's own factory method takes from
    #       the context and installs. It logs the failure as a ThrowableDigest --
    #       the chain of TYPES and the frames, with no message text -- and then
    #       rethrows, so the delivery semantics are untouched: the message becomes
    #       visible again after its visibility timeout and reaches the dead-letter
    #       queue at the fifth receive exactly as before. The rethrow is not
    #       stylistic. The starter installs its error-handler stage as a RECOVERY
    #       step, so a handler that returned normally would leave the pipeline
    #       result successful and the acknowledgement stage that runs after it
    #       would DELETE the message; that case has its own test.
    #       (4) Trade-offs: this pins one logger by its fully qualified name, so a
    #       future starter version that renames or relocates that class would
    #       silently stop the suppression. Accepted because the alternative --
    #       switching off the whole `io.awspring.cloud.sqs.listener.sink` package
    #       -- would also silence the sink's legitimate lifecycle records, and
    #       because a rename is caught by common-lib's own
    #       MessageSinkSuppressionTest, which loads the class by that exact name,
    #       reads its logger field and asserts the logger carries that same name,
    #       and resolves this very property through the same config-data import a
    #       service uses. A rename upstream, a moved class or an edited key each
    #       fail there rather than silently restoring the exposure.
    io.awspring.cloud.sqs.listener.sink.AbstractMessageProcessingPipelineSink: "off"

    # WHY : (1) ⚠️ Refactoring Rationale: these three persistence loggers are pinned
    #       HERE, where exactly one service pinned them for itself and the other
    #       seven inherited the framework's defaults. The one that did found the
    #       exposure by MEASUREMENT -- planting a check constraint one insert
    #       violated and reading the log -- and recorded that
    #       org.hibernate.orm.jdbc.error emits the driver's whole message at WARN,
    #       which for a constraint violation IS the failing row: on that line the
    #       account identifier, the primary account number, the amount, the
    #       merchant identifier and the merchant name all appeared in clear. The
    #       same driver, the same logger and the same rows are reachable from every
    #       service that writes, so a pin in one base document closed one eighth of
    #       the exposure. The same run of this repository's own build reproduced it
    #       on auth-service, whose log carried
    #       `Failing row contains (ADMIN001, Given, Family, X, 227ce75a-...)`.
    #       (2) Assumptions: ERROR rather than OFF for the error category. That
    #       logger's value-bearing output is emitted at WARN, so ERROR is the lowest
    #       level that suppresses it, and choosing ERROR over OFF leaves anything
    #       Hibernate raises at ERROR on the same category still visible. OFF would
    #       also silence a future diagnostic that carries no row at all.
    #       (3) Assumptions: the two SQL categories are pinned at WARN rather than
    #       left to inherit, because at DEBUG and TRACE respectively they write the
    #       statement and every bound parameter -- and the parameters on these paths
    #       are primary account numbers, national identifiers and amounts. Pinning
    #       means no profile can turn them up by raising a broader level, which is
    #       the failure mode a root-level change would otherwise produce silently.
    #       (4) Assumptions: nothing diagnostic is lost that this repository does not
    #       replace. The queue side already logs the database condition and its
    #       five-character SQL state through
    #       com.carddemo.common.observability.FailureSummary.databaseConditionOf,
    #       which masks a card number and replaces every run of three or more digits
    #       with hashes, and the servlet side renders failures through
    #       com.carddemo.common.observability.ThrowableDigest. So an operator still
    #       learns which constraint was violated and with which state code, and
    #       learns nothing about the customer.
    #       (5) Trade-offs: an operator who needs the literal failing row must
    #       reproduce it against a non-production dataset with the category raised
    #       for that one package -- a scoped and auditable act. The alternative is
    #       that every constraint violation in any of eight services writes a
    #       cardholder record into a log store retained far more widely than the
    #       database it came from. Alternatives Considered: leaving each service to
    #       pin its own, which is what produced the seven-service gap; and a Logback
    #       filter, which this repository deliberately cannot use because it ships no
    #       logback-spring.xml. A service that genuinely needs a different level can
    #       still override any of the three in its own document, because a
    #       config-data import is lower precedence than the importing file.
    org.hibernate.orm.jdbc.error: ERROR
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.SQL: WARN

spring:
  datasource:
    hikari:
      # WHY : (1) Refactoring Rationale: the PostgreSQL driver is told to WITHHOLD
      #       server error detail, and it was not. `logServerErrorDetail` defaults
      #       to true in pgjdbc, which folds the server's DETAIL and HINT fields --
      #       and the bound parameter values the server inlines into them -- into
      #       the message carried by the SQLException. Every log site that renders a
      #       failure message then republishes those values. On this schema the
      #       values in question are the ones the migration exists to protect: a
      #       unique violation on a customer row answers `Detail: Key (...)=(...)
      #       already exists.` naming the colliding value, and a check or
      #       not-null violation names the offending row's contents. Cardholder
      #       names, addresses and merchant free text are all reachable this way, so
      #       the driver default turns an ordinary constraint violation into a
      #       cardholder-data disclosure in the log sink.
      #       (2) Assumptions: this is one of TWO independent controls, and both are
      #       wanted. This key stops the detail entering the exception at the driver;
      #       FailureSummary.databaseConditionOf refuses to render free text even if
      #       it is present. Either alone leaves a gap -- this key governs only
      #       PostgreSQL connections and nothing else in the failure path, while the
      #       renderer governs every throwable but cannot help a log site that calls
      #       getMessage() directly, and there is no way to prove none ever will.
      #       Defence in depth is the point, not redundancy.
      #       (3) Alternatives Considered: writing the key into each of the eight
      #       services' own `data-source-properties` blocks, beside sslmode and
      #       sslrootcert. Rejected for the reason this whole file exists -- eight
      #       copies of one decision, and a ninth service added later inheriting the
      #       driver default silently. `data-source-properties` binds as a map, and
      #       map keys accumulate across property sources rather than replacing one
      #       another, so a service's own block keeps its TLS keys and gains this one
      #       without either file mentioning the other. Also considered: leaving the
      #       detail on and stripping it downstream in the renderer alone. Rejected
      #       because the sensitive text would still exist in every stack trace, in
      #       any framework-authored log line, and in the outbox column that stores a
      #       last-error string -- places the renderer never sees.
      #       (4) Trade-offs: an operator loses the DETAIL line, which is genuinely
      #       useful when diagnosing which row collided. What survives is the
      #       SQLSTATE and the constraint name, which identify WHICH rule was broken
      #       and on which relation -- the diagnostic half -- while the cardholder
      #       value, the identifying half, is the part withheld. Recovering a
      #       specific row is a governed database query, not a log read.
      data-source-properties:
        logServerErrorDetail: false
  jackson:
    deserialization:
      # WHY : (1) ⚠️ Refactoring Rationale: the refusal of an UNDECLARED member is
      #       stated here because four services set it and three did not, while all
      #       seven publish `additionalProperties: false` on every request body they
      #       declare. Thirteen body operations therefore accepted and silently
      #       DISCARDED a member their own contract refuses. The measured shape of
      #       that defect on the service that found it: a listing request carrying
      #       `Direction` with a capital D was answered 200 with the FORWARD page
      #       while the caller had asked to move backward, because the misspelled
      #       member was dropped and the direction it carried went with it -- an
      #       answer a caller cannot detect as wrong, since the page it receives is
      #       well formed and simply the opposite one.
      #       (2) Assumptions: the framework leaves this OFF, so this key is a change
      #       and not a pin. The trailing-token refusal is deliberately NOT restated
      #       beside it: the pinned Jackson generation already enables
      #       FAIL_ON_TRAILING_TOKENS, so a second JSON value after the body is
      #       already refused, and writing the key here would read as though the
      #       refusal depended on it.
      #       (3) ⚠️ Assumptions: this is safe for the four cross-context READS in
      #       this system only because each declares every member of the upstream
      #       schema it reads, and each of those schemas is itself closed. Any member
      #       added upstream must therefore be declared on the reading side in the
      #       same change that starts sending it -- transaction-service learned this
      #       the expensive way, where a narrower subset turned every successful
      #       lookup into a 500. The cross-context wire records are gated by contract
      #       tests in their own modules for exactly this reason.
      #       (4) Trade-offs: strictness over forward compatibility. Adding a member
      #       to a request body becomes a deliberate contract change made in the
      #       document and the DTO together, rather than something a client can start
      #       sending unilaterally. Accepted because these bodies are closed field
      #       sets taken from the reference maps, which have no representation for a
      #       field they do not define.
      fail-on-unknown-properties: true

    read:
      # WHY : (1) ⚠️ Refactoring Rationale: duplicate-member refusal is stated here
      #       because one service set it and six did not, and the streaming default
      #       resolves the ambiguity silently by keeping the LAST occurrence. A body
      #       naming `accountId` twice was answered 200 for the second account, so a
      #       caller reading its own request back saw the account it asked about
      #       while the answer described a different one. The same shape reaches a
      #       selector, an optimistic-concurrency version and a credential field on
      #       the six services that had no such refusal, which is a parser
      #       differential rather than a formatting preference: an intermediary and
      #       the service can resolve one document differently.
      #       (2) Trade-offs: the cost is one extra name-set per nesting level while
      #       parsing, which is immaterial for bodies of at most a few dozen members.
      #       Refusing the body says the two occurrences disagree instead of picking
      #       one for the caller.
      strict-duplicate-detection: true

    # WHY : (1) ⚠️ Refactoring Rationale: always-inclusion is PINNED here because all seven
    #       API documents already assert it as settled fact -- each ApiError block
    #       explains that `message` and `abend` are `required` and nullable rather than
    #       optional, and closes the argument with "the services set
    #       default-property-inclusion: always". Only ONE service actually set it. The
    #       other six were relying on the serialiser's own default to make a published
    #       contractual claim, which held only for as long as nobody set the key to
    #       something else in one service's profile. Pinning it centrally makes the
    #       claim true for every service at once, in one place all eight import.
    #       (2) Assumptions: this is a PIN and not a behaviour change. The serialiser
    #       already includes null-valued members by default, so no response body moves;
    #       what changes is that the behaviour is now declared rather than inherited.
    #       Verified by the wire-shape assertions, which emit `"message":null` and
    #       `"abend":null` and would fail on either NON_NULL or NON_EMPTY.
    #       (3) ⚠️ Assumptions: the money contract depends on this, which is why the pin
    #       belongs with the other contract-preserving defaults rather than in a service.
    #       Money is carried as a JSON STRING so no client parses it into a binary
    #       float, and a money member with no value must therefore be present and null
    #       rather than absent -- an absent key reads as "this account has no balance"
    #       where null reads as "no amount applies", and a reference screen renders the
    #       two differently.
    #       (4) ⚠️ Assumptions: the drift was MEASURED rather than inferred -- a probe
    #       that imports this file and reads the resolved environment reported the key
    #       as null before this block existed and `always` after it. The framework's
    #       own default is what MASKED the drift and is why no test caught it: the six
    #       services emitted exactly the wire shape their contracts promised while
    #       promising it on a false basis, so the failure mode was latent. Any future
    #       service-local `non_null` or `non_empty`, or a changed framework default,
    #       would have falsified six published contracts at once with nothing to fail.
    #       (5) ⚠️ Assumptions: `always` is what the REFERENCE behaviour requires and not
    #       merely what happens to be in force. A BMS map writes every field position on
    #       every screen turn whether the position holds a value or a blank -- the fixed
    #       24x80 geometry has no way to omit a field -- so the migrated response shape
    #       is CONSTANT by contract. Omitting a null would oblige the browser client to
    #       distinguish a field that was not supplied from a field that is empty, a
    #       distinction the 3270 contract never made and for which the single-page
    #       application therefore has no rule.
    #       (6) Alternatives Considered: rewriting the seven rationales to say the
    #       default is merely inherited, which would also have made them accurate.
    #       Rejected because a required-and-nullable member is a promise to every
    #       generated client, and resting it on an unstated default leaves it removable
    #       by a one-line profile override in any service, with the breakage appearing
    #       as a client-side missing-key fault far from the change. Also considered:
    #       annotating each response type with an inclusion annotation, which is the
    #       more commonly written form and which one type in this reactor already
    #       carries. Rejected as the GENERAL mechanism for the reason every other value
    #       in this file is here -- it restates one fleet-wide decision once per type, a
    #       type added later inherits whatever the framework default happens to be, and
    #       the seven contracts cite a SETTING rather than an annotation, so an
    #       annotation-only fix would leave all seven claims still false. The one
    #       existing annotation is left in place: it is narrower than this default,
    #       agrees with it, and documents the intent at the type it guards.
    #       (7) Trade-offs: an imported value sits BENEATH the importing file in
    #       precedence, so a service retains the ability to override this and falsify
    #       its own contract. Accepted, because forcing the value from a post-processor
    #       a service cannot override would hide a fleet-wide serialisation decision
    #       behind a class, and because an override is visible in the overriding
    #       service's own file, where a reviewer reads it beside the contract it breaks.
    default-property-inclusion: always

  security:
    filter:
      # WHY : (1) ⚠️ Refactoring Rationale: the security filter chain is taken OFF
      #       the container's internal ERROR dispatch, and it was on it -- the
      #       framework's default for this key is REQUEST, ASYNC, ERROR. With ERROR
      #       included, a request that was refused before reaching a controller and
      #       then routed to the error path was authorised a SECOND time, and the
      #       second decision replaced the first. The observed case: a doubled path
      #       separator is refused by the HTTP firewall, the container dispatches to
      #       the error path, the bearer-token filter does NOT run there -- it is a
      #       once-per-request filter and those skip error dispatches by default --
      #       so the request arrives anonymous, the deny-by-default rule refuses it,
      #       and a caller holding a valid token is answered 401 for a request whose
      #       real fault was a 400. The status, the code and the severity were all
      #       wrong, and a client with token-refresh logic would refresh a token that
      #       was never the problem.
      #       (2) Assumptions: this does NOT make the error path reachable. A caller
      #       addressing it directly arrives on a REQUEST dispatch, which is still
      #       secured and still refused by each service's deny-by-default rule; only
      #       the container's own internal dispatch is exempt, and that dispatch is by
      #       construction preceded by the original request's authorisation decision.
      #       (3) Assumptions: the fallback body that dispatch renders discloses
      #       nothing, which is the other half of why this is safe -- every
      #       server.error.include-* key below is withheld, so the body carries a
      #       status and a timestamp and no request-authored value.
      #       (4) Alternatives Considered: a per-service authorisation rule permitting
      #       the ERROR dispatch type, which is the more commonly written form.
      #       Rejected because it restates one decision in eight files and a service
      #       added later would inherit the wrong default again -- the same reason
      #       every other value in this file is here. Also considered: leaving this
      #       alone and relying solely on the shared firewall-rejection handler, which
      #       answers the observed case before any dispatch happens. Rejected as a fix
      #       for one path rather than for the class: any other refusal that reaches
      #       the container as an error would still be re-authorised and mislabelled.
      dispatcher-types: REQUEST, ASYNC

server:
  error:
    # WHY : (1) Refactoring Rationale: the request path is withheld from the
    #       framework's FALLBACK error body, and it was not. Spring Boot defaults
    #       server.error.include-path to `always` while defaulting the message,
    #       the exception, the stack trace and the binding errors to withheld, so
    #       the path was the one attacker-supplied value the fallback body echoed.
    #       That body is produced for the errors the shared advice does not see --
    #       a dispatcher 404, a container-level failure -- and the path there is
    #       assembled by whoever sent the request, so a caller inventing
    #       /api/v1/4111111111111111 had it reflected back verbatim.
    #       (2) Assumptions: this does NOT weaken the diagnostics the shared
    #       advice produces. com.carddemo.common.error.ApiError carries its own
    #       path member and the advice populates it through
    #       com.carddemo.common.security.CardNumberMasker, so the handled path
    #       keeps a masked path and this key governs only the unhandled fallback
    #       -- two bodies, two owners, and the one without a masker is the one
    #       silenced.
    #       (3) Alternatives Considered: masking the fallback path instead, by
    #       contributing a DefaultErrorAttributes subclass. Rejected as more
    #       moving parts for less: it would add a bean to every service to
    #       improve a body no client of this system reads, where every published
    #       operation answers through the advice. Withholding is the simpler
    #       control and it cannot be bypassed by an error arising before the bean
    #       is reachable.
    include-path: never

    # WHY : Assumptions: the framework's own defaults for these four are already
    #       `never`/false, and they are PINNED here rather than left implicit
    #       because they are the other four members of the same body and an
    #       upstream default change to any of them would reopen the same class of
    #       exposure with nothing in this repository recording it. Stating them
    #       costs four lines and makes the whole fallback body's contract
    #       readable in one place.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  logging:
    export:
      otlp:
        # WHY : Assumptions: ECS already forwards stdout and stderr to the
        #       customer-key-encrypted service log group. A second OTLP log
        #       exporter would duplicate every event and its storage charge
        #       without adding a correlation field.
        enabled: false

  otlp:
    metrics:
      export:
        # WHY : Assumptions: meters are exposed for scraping on the existing
        #       Prometheus endpoint rather than pushed. Enabling this exporter as
        #       well would publish each meter twice through two independent
        #       temporality paths wherever a scraper is present.
        # WHY : Refactoring Rationale: this note said "the task-local collector
        #       scrapes the existing Prometheus endpoint and exports those meters
        #       through CloudWatch EMF". That collector was a sidecar
        #       infra/modules/ecs-service composed into every task, and it has been
        #       withdrawn -- it is outside the frozen technical specification and was
        #       forcing an eleventh ECR repository and a ninth interface endpoint,
        #       both also outside it. The reason to leave this exporter disabled is
        #       unchanged and does not depend on a collector existing: pushing and
        #       scraping the same meters is double publication. What DOES depend on
        #       the collector is where scraped meters ended up, and that is recorded
        #       in docs/architecture/observability.md rather than restated here.
        enabled: false

  tracing:
    export:
      otlp:
        # WHY : Assumptions: the OpenTelemetry starter is shared by every
        #       service, including local builds and tests where no collector is
        #       listening. Defaulting export on would turn an absent collector into
        #       repeated connection failures in otherwise valid local runs.
        # WHY : Refactoring Rationale: this note ended "ECS overrides this default
        #       with OTEL_TRACES_EXPORTER and the task-local endpoint, so the deployed
        #       path stays explicit." It no longer does. The task-local collector
        #       sidecar has been withdrawn from infra/modules/ecs-service, along with
        #       the OTEL_* variables that pointed the application at it, because the
        #       collector is outside the frozen technical specification and was forcing
        #       an eleventh ECR repository against the ten of section 0.4.1.6 and a
        #       ninth interface endpoint for xray against the eight of section 0.4.1.9.
        #       So this default is now the effective setting in EVERY environment:
        #       spans are produced by the shared starter and are not exported anywhere.
        #       Trade-offs: cross-service followability does not depend on that export
        #       -- CorrelationIdFilter puts one identifier into the diagnostic context
        #       and onto the response, so a unit of work is traceable through the logs.
        #       Re-introducing span export has to argue for its own interface endpoint
        #       or its own egress, which is the argument that was skipped when the
        #       sidecar was added. docs/architecture/observability.md records the gap.
        enabled: false

carddemo:
  # WHY : Assumptions: ONE environment-variable name for the environment label,
  #       CARDDEMO_ENVIRONMENT, and no second spelling anywhere. An earlier
  #       revision had one service addressing its Parameter Store path from
  #       CARDDEMO_ENV while every other deployment and metric path used
  #       CARDDEMO_ENVIRONMENT; two names for one value means a task definition
  #       that sets one of them produces a service whose metrics are labelled and
  #       whose configuration is not, or the reverse, with nothing failing.
  # WHY : Trade-offs: the fallback is the literal "unspecified" rather than a
  #       plausible value such as "dev". A wrong-but-plausible default is the
  #       worse failure: a production task whose variable was not injected would
  #       publish its series under the development label and be silently merged
  #       with it on every graph and every alarm. "unspecified" is a value no
  #       dashboard filter matches, so the omission is visible where it matters.
  environment: ${CARDDEMO_ENVIRONMENT:unspecified}
  version: ${CARDDEMO_VERSION:unspecified}
