# =============================================================================
# services/reporting-service/src/main/resources/application-dev.yml
# -----------------------------------------------------------------------------
# Purpose:
#   The dev profile overlay for the CardDemo reporting bounded context, the
#   migration target of COBOL programs CORPT00C, CBTRN03C, CBSTM03A and
#   CBSTM03B. It overrides VALUES ONLY, on keys that application.yml beside
#   it already declares, and it introduces no key that is absent there. Six
#   keys are set, across the only axes a profile in this project may vary:
#   log verbosity, connection-pool sizing, streaming fetch size and actuator
#   health detail. Every base setting this file does not name -- the
#   view-binding flag, the schema-management mode, the acquisition timeout, the
#   actuator exposure list and every level pin on a category not listed below --
#   stays in force BY OMISSION, and not restating it is what preserves it.
#
#   Nothing here changes topology and nothing here changes security posture.
#   The datasource is still Aurora PostgreSQL resolved from the platform, the
#   read-only cross-schema views are still reached through the same
#   SELECT-only role and the same connection search path, the single TLS
#   listener and its port are untouched, and identity still arrives as a
#   validated token whose group claims common-lib maps to authorities. A
#   defect reproduced in dev is therefore reproducible in prod, because the
#   only difference between the two environments is the value of these six
#   keys.
#
#   No endpoint, credential, identifier, bucket name or region appears below,
#   and no stand-in for one. Every such value stays an unresolved placeholder
#   in application.yml and is injected by the platform at deployment.
#
# WHY (non-obvious design decisions):
#   - Assumptions: the dev cluster is provisioned with a minimum capacity of
#     zero, and Aurora pauses an instance only while no connection initiated
#     by user activity exists. That one platform rule is what makes pool
#     sizing a correctness question in this file rather than a tuning one: a
#     pool holding any connection open keeps the cluster awake for the whole
#     time the environment sits unused, which cancels the reason for
#     provisioning a zero minimum at all.
#   - Trade-offs: three settings a dev overlay conventionally carries are
#     deliberately NOT restated here, because for each one the base value is
#     already correct for dev and repeating it would assert a decision this
#     file has not made. The pool acquisition timeout stays as application.yml
#     sets it -- draining the pool to empty means the first caller after an
#     idle period pays a resume, so that wait must be long enough to contain
#     it, and shortening it in the one profile whose cluster actually pauses
#     would fail precisely the request that triggers the resume. The idle and
#     lifetime ceilings stay as the base sets them, because with a floor of
#     zero the base idle ceiling already retires the last connection and lets
#     the pool reach empty. The actuator exposure list stays closed, because
#     widening what a process publishes is not a change in sizing and this
#     overlay has no standing to make one.
#   - Alternatives Considered: a logging back-end configuration file, the
#     conventional way to vary verbosity per environment. Rejected on the
#     ground application.yml already records: the whole configuration is
#     expressed as properties, and such a file in this folder would take over
#     the appender chain wholesale, so the console pattern carrying the
#     correlation identifier would silently stop applying.
# =============================================================================

# WHY : Trade-offs:
#       Dev accepts a log volume prod will not. Both levels below are raised so
#       a report or statement run reads as a sequence of handler and service
#       lines that can be checked against the golden masters under
#       tests/golden/reporting/ and tests/golden/statement/happy_path/ (both
#       REFERENCE-ONLY), rather than being inferred from a stack trace after
#       the fact. The cost is per request and unbounded in aggregate, and log
#       ingestion is billed by the gigabyte, which is why this sits in the dev
#       overlay and not in application.yml. Nothing raised here lowers a
#       category that would print identity material or a bound statement
#       parameter.
logging:
  level:
    # WHY : Alternatives Considered:
    #       Leaving this at the base WARN and raising only the project package.
    #       Rejected because the misconfiguration this environment actually
    #       produces is invisible under it: application.yml imports
    #       configuration with the optional prefix, so a wrong prefix resolves
    #       nothing and startup continues on unresolved placeholders. The line
    #       recording what each import resolved comes from the framework's own
    #       configuration machinery rather than from the project package. At
    #       WARN that line never prints, and the fault then presents later as
    #       an unrelated failure somewhere else.
    #
    # WHY : Trade-offs:
    #       INFO rather than DEBUG. DEBUG here would lower every framework
    #       package this service neither owns nor diagnoses, leaving the lines
    #       worth reading a minority of the output.
    root: INFO
    # WHY : Trade-offs:
    #       DEBUG is what makes the transcribed COBOL paragraph logic
    #       inspectable -- which validation branch a request took, and which
    #       report preset it resolved. The correlation identifier alone cannot
    #       show that, because it identifies a request without describing the
    #       path followed inside it. Prod keeps this at INFO for the ingestion
    #       reason above.
    com.carddemo: DEBUG

spring:
  # WHY : Assumptions:
  #       This pool is the read side of a SELECT-only role, and every
  #       borrow it serves is a cursor walk rather than a keyed read, so one
  #       connection is held for the length of a whole report or statement
  #       rather than for a single statement. The datasource URL, its
  #       credentials and its TLS terms are not touched here and stay exactly
  #       where the base leaves them.
  datasource:
    # WHY : Trade-offs:
    #       This pool is sized DOWN from the base rather than up, which
    #       inverts the usual direction of a dev overlay. One Aurora cluster is
    #       shared with the seven peer services, and a dev cluster sits at the
    #       bottom of its capacity range, so its connection budget is far
    #       smaller than the figure the base was sized against. A pool left at
    #       the base width would exhaust that budget before a single statement
    #       query finished, and the symptom would surface in the other seven
    #       services as refused connections rather than here, which is the
    #       harder fault to trace.
    hikari:
      # WHY : Alternatives Considered:
      #       Mirroring the base ceiling so dev and prod behave alike under
      #       load. Rejected because the two clusters do not have the same
      #       connection budget, so matching the number reproduces a prod-width
      #       pool against a fraction of a prod database. A burst queueing on a
      #       narrow pool is visible in the pool's own metrics, where a small
      #       cluster refusing connections to its other tenants is not.
      maximum-pool-size: 2
      # WHY : Assumptions:
      #       Aurora pauses only while no connection initiated by user
      #       activity exists, and the base floor of one holds exactly such a
      #       connection open for as long as the process runs. Keeping the base
      #       value would therefore not merely delay the pause, it would prevent
      #       it for the whole life of the task, and the zero minimum this
      #       environment is provisioned with would never take effect at all.
      #
      # WHY : Trade-offs:
      #       Draining to empty means the next caller pays a fresh
      #       handshake, and a resume as well if the cluster did pause. That is
      #       accepted, and it is the reason the acquisition timeout in
      #       application.yml is left at its base value rather than tightened.
      minimum-idle: 0
  jpa:
    # WHY : Assumptions:
    #       This map is an untyped passthrough handed to the
    #       persistence provider, not a set of typed framework properties, so
    #       each key must be spelled exactly as the provider expects it; a
    #       misspelling binds silently and the setting is simply never applied.
    properties:
      # WHY : Trade-offs:
      #       The value below is halved from the base, trading round
      #       trips for the heap a single open cursor holds, because a dev task
      #       runs with a smaller memory reservation than a prod one and the
      #       per-cursor high-water mark matters more there than the fetch
      #       count.
      hibernate:
        # WHY : Assumptions:
        #       This is a transport batch size and NOT a cap. It bounds
        #       how many rows cross the wire per fetch, never how many rows a
        #       report or statement may contain. Both preconditions for a
        #       server-side cursor still hold unchanged: the value stays
        #       positive, and application.yml keeps automatic commit disabled.
        #       Without that condition the driver buffers the entire result set
        #       on the client and reintroduces the in-memory materialisation
        #       this setting exists to avoid.
        jdbc:
          # WHY : Alternatives Considered:
          #       A value equal to one of the statement
          #       table bounds documented for the baseline generator. Rejected
          #       deliberately, so that no reader can mistake a transport
          #       figure for one of those bounds; the bounds themselves are
          #       recorded in
          #       docs/architecture/cobol-to-service-traceability.md.
          fetch_size: 100

# WHY : Refactoring Rationale:
#       An earlier revision of this profile set `always` on the health
#       endpoint, reasoning that the dev load balancer is internal and the
#       actuator path is not routed through the public front door. That is
#       withdrawn, because it is not a control this file can enforce: which
#       profile a task activates is a property of its task definition, so
#       `always` in a file that ships beside `prod` is one deployment variable
#       away from publishing the datasource and schema layout of the system that
#       serves statements and reports. Both pollers of the aggregate path are
#       unauthenticated -- the load balancer target group and the container
#       health check -- so whatever that body carries is readable by anything
#       able to reach the task inside the private application subnets. The
#       detail is not deleted; it moves to its own authorized path below.
management:
  endpoint:
    # WHY : Trade-offs:
    #       A detail payload names the datasource and the schemas the
    #       connection reaches, which turns a "why is the pool empty"
    #       investigation from a guess into a reading. That reading is kept, and
    #       what changes is who may take it: an authorized caller on a named
    #       path rather than anything that can reach the probe port. Every
    #       non-development activation keeps the closed answer because
    #       application.yml sets `never` and this overlay is the only file in the
    #       module that touches the setting at all.
    health:
      # WHY : (1) Refactoring Rationale: `never` on the aggregate path, replacing
      #       the `always` recorded above. The earlier revision rejected
      #       `when-authorized` here on the correct observation that both pollers
      #       are unauthenticated and would therefore receive the same bare status
      #       as `never` while the setting appeared to be configured. That
      #       objection stands, and it is answered by the GROUP below rather than
      #       by widening this path: the aggregate path answers the pollers with
      #       the status word, and the detail lives on its own path where an
      #       authorized caller asks for it and is distinguishable in an access
      #       log. This is the arrangement the transaction-service dev overlay
      #       already uses, so the two profiles now fail in the same direction.
      #       (2) Assumptions: show-components is closed alongside show-details.
      #       Left open it would enumerate the contributor NAMES to an
      #       unauthenticated poller -- which discloses that a datasource
      #       contributor exists and is therefore the same class of leak in a
      #       smaller quantity.
      show-details: never
      show-components: never

      # WHY : Assumptions: the role is named explicitly rather than left unset.
      #       Unset, the framework treats ANY authenticated caller as authorized,
      #       and an authenticated caller here is any holder of a valid user-pool
      #       token -- an ordinary cardholder included, and a cardholder is not an
      #       operator. The value is the authority JwtRoleConverter publishes for
      #       the administrative Cognito group, named there as the constant
      #       ADMIN_AUTHORITY so the two cannot drift apart.
      #       Assumptions: the actuator's authorization test delegates to the
      #       servlet role check, which prepends the framework's role prefix to a
      #       value that does not already carry one, while this system's
      #       authorities are the provider's group names with NO prefix. The
      #       consequence is stated rather than glossed: this arrangement fails
      #       CLOSED. Until the resource-server configuration grants a caller the
      #       named role, the group below discloses the status word and nothing
      #       else -- the same answer the aggregate path gives, and the safe
      #       direction to fail in.
      roles: carddemo-admin

      group:
        # WHY : (1) Assumptions: the contributors are the ones THIS module
        #       actually registers, so the group resolves rather than silently
        #       matching nothing -- `db` from the datasource that reads the
        #       read-only cross-schema views, and `diskSpace` and `ping` from the
        #       framework defaults.
        #       (2) Alternatives Considered: including `flyway` as the
        #       transaction-service overlay does. Rejected on evidence rather than
        #       symmetry: services/reporting-service/pom.xml declares no Flyway
        #       dependency, because this context owns no schema and runs no
        #       migration -- it reads views another service migrates. Naming a
        #       contributor this module cannot register would make the group
        #       resolve to a smaller set than it appears to name, which is the
        #       silent-mismatch failure this note exists to prevent.
        #       (3) Trade-offs: the question a failed deployment raises here --
        #       did the pool connect to the reporting role -- is answered on this
        #       path for a caller entitled to ask. What is given up is reading
        #       that answer out of an unauthenticated probe reply, which is
        #       exactly the disclosure being closed.
        diagnostics:
          include: db,diskSpace,ping
          show-details: when-authorized
          show-components: when-authorized
