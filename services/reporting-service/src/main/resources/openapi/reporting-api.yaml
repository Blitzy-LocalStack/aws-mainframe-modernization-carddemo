# =============================================================================
# services/reporting-service/src/main/resources/openapi/reporting-api.yaml
# -----------------------------------------------------------------------------
# Purpose:
#   The OpenAPI 3.1 contract of record for the reporting bounded context. It
#   settles the eight paths, the operation identifiers, every property name and
#   width, the rendering of money, the paging mechanism and the refusal
#   behaviour of this context, so that the browser client at
#   ui/src/api/reporting.ts is written against one published agreement rather
#   than against a reading of this module's Java. ReportingApiContractTest pins
#   the eight paths and the eight operation identifiers, which is what makes that
#   figure checkable rather than merely maintained.
#
#   Four reference programs are surfaced here, and each is read as the
#   specification and never modified:
#     - app/cbl/CORPT00C.cbl, the online report-request program driving the
#       CR00 transaction, which contributes the three report types, the
#       confirmation state machine and every user-visible message quoted below;
#     - app/cbl/CBTRN03C.cbl, the batch writer of the 133-column daily
#       transaction report, which contributes the detail line, the three
#       subtotal bands and the inclusive processing-date predicate;
#     - app/cbl/CBSTM03A.CBL, the statement generator, which owns BOTH rendered
#       artifacts -- its file descriptions at L45 and L47 fix an 80-byte
#       plain-text record and a 100-byte markup record;
#     - app/cbl/CBSTM03B.CBL, its file-handling subprogram.
#   The upper-case extension on the last two is load-bearing; a lower-case
#   citation of either one is a dead reference.
#
#   Three artifacts must agree about these paths and none can see the other two
#   at build time, which is why this is a committed file and not generated
#   output: this module's request handlers, which answer them; the edge, whose
#   listener rule and route keys forward only the "/api/v1/reports" prefix; and
#   the browser client, which composes each target from its configured base URL.
#   Every path below therefore sits beneath that prefix, and one that did not
#   would be unreachable through both hops while remaining perfectly valid here.
#
# Parameters:
#   Input arrives in four forms, each described again where it is declared.
#     - THREE request bodies, carrying TWO schemas. ReportRequest selects a
#       report by type and, for a caller-supplied run, by an inclusive range, on
#       submitTransactionReport. StatementRequest names one card or one account,
#       and is the body of BOTH generateStatement and listStatementTransactions.
#       Refactoring Rationale: this read "Two request bodies", counting the
#       schemas and not the operations that take one. The two figures differ
#       because one schema is reused, and the count a reader needs here is the
#       number of operations that will refuse an empty body -- three -- since
#       that is what decides whether a caller may issue a bare request. The
#       schema count is stated beside it so the reuse is visible rather than
#       looking like a fourth shape that went missing.
#     - FIVE query parameter types over THREE read operations: the inclusive
#       bounds of a processing-date range (startDate, endDate), a sealed browse
#       position with the direction it was issued for (cursor, direction), and
#       the report selector on the artifact collection (type).
#       Refactoring Rationale: this read "Four query parameters on the two read
#       operations", which undercounted both. The fifth is ReportTypeQuery, added
#       with collectReportArtifact, and the operations that carry a query
#       parameter are listTransactionReportLines with four,
#       readTransactionReportTotals with two and collectReportArtifact with
#       three. Both figures are recomputed from components/parameters and the
#       per-operation parameter lists rather than maintained by hand.
#     - TWO request headers. X-Correlation-Id is accepted on every operation;
#       Idempotency-Key is accepted on submitTransactionReport alone, which is
#       the one operation that starts work a repeat would start twice. Both are
#       declared once under components/parameters.
#       Refactoring Rationale: this read "One request header", which omitted the
#       idempotency key entirely -- the one input that decides whether a retried
#       submission launches a second execution, so its absence from this summary
#       is the omission most likely to be acted on.
#     - Two path parameters, both on the read side of a lifecycle and neither
#       naming a person: executionName on the execution-status operation, which
#       is the name a submission returned, and selector on the statement-artifact
#       operation, which is an opaque token the service minted.
#       Assumptions: a primary account number may not appear in a target, which is
#       why the statement operations select by request body and why the artifact is
#       reached through a minted token rather than through the card it was rendered
#       for. The rule bars cardholder values from a target; it does not bar a path
#       parameter as such, which is why these two are admissible.
#
# Return values:
#     - ReportSubmissionOutcome from the submission operation, at 201 for a
#       started execution and at 200 for either of the two turns that start
#       nothing -- a deliberate cancellation and a confirmation not yet answered.
#       Its own outcome member says which of the three occurred; the status alone
#       cannot, because two of them share 200. Its nested
#       ReportSubmissionResponse carries the run's executionName, which the
#       execution-status operation is addressed by, and is null on both 200 turns.
#     - TransactionReportLinePage from the detail browse, one bounded page.
#     - TransactionReportTotals from the totals read, the three bands.
#     - StatementResponse from the statement operation, carrying the two
#       rendered artifacts by location rather than inline.
#     - StatementTransactionCollection from the statement-transaction read.
#
# Exceptions / error responses:
#   Every failure is rendered by the shared advice in common-lib as one problem
#   document, so this error vocabulary is identical to every sibling contract.
#   TEN reusable responses are declared under components/responses and every one
#   of them is reachable: 400 for a request that does not satisfy a declared
#   constraint, 401 for a caller presenting no usable token, 403 for a token
#   lacking the required authority, 404 for an absent card or account, 405 for a
#   method this path does not serve, 406 for an Accept header no representation
#   satisfies, 413 for a body over the accepted size, 415 for a media type this
#   service does not read, 503 while the batch window holds the data, and 500 for
#   an unexpected failure.
#   Refactoring Rationale: this list held six of the ten and omitted 405, 406,
#   413 and 415. All four are declared here and referenced by operations, so a
#   client written to the shorter list would meet a status its error handling had
#   no branch for -- and three of the four are the ones a MISCONFIGURED client
#   provokes first, which is exactly when a caller reaches for this section.
#
# Rationale for the non-obvious decisions in this file:
#   - Trade-offs: every monetary value is a JSON string and never a JSON number.
#     A number costs the client nothing to read, but most clients parse one into
#     IEEE-754 binary floating point, and app/cpy/CVACT01Y.cpy L7 declares
#     ACCT-CURR-BAL PIC S9(10)V99 -- twelve significant digits, which leaves
#     that representation no margin, so cents would be wrong at the boundary the
#     user reads. The accepted cost is an explicit decimal parse per amount.
#   - Alternatives Considered: paging by a counted row position, which is the
#     obvious shape and would let a caller jump to an arbitrary window. Rejected
#     because under concurrent inserts it omits rows and repeats others, and
#     inserts really do land mid-key-space while a browse is in flight:
#     app/cbl/COBIL00C.cbl L212 moves high values into the transaction id, L213
#     starts a browse, L214 reads backwards for the highest, L215 ENDS the
#     browse, and only L217 adds one -- so no lock spans read-maximum to
#     increment to insert, and two concurrent bill payments can compute the same
#     next identifier. Keyset paging over the same key columns is used instead.
#   - Assumptions: both statement timestamps are opaque twenty-six-character
#     strings and carry no date-time format. Two independent reasons. The sort
#     step at app/jcl/CREASTMT.JCL L54 reformats with
#     OUTREC FIELDS=(1:263,16,17:1,262,279:279,50), which yields 328 of the
#     record's 350 bytes; TRAN-ORIG-TS X(26) sits at one-based 279 and
#     TRAN-PROC-TS X(26) at 305, so the last segment copies the origin stamp
#     whole and only 24 of the processing stamp's 26 characters, leaving bytes
#     329 to 350 unset -- a blank or short stamp is a legitimate value that a
#     strict parse would reject. Separately, common-lib TimestampFormatter fixes
#     the shape as 'yyyy-MM-dd HH:mm:ss.SSSSSS', a zone-less local value
#     separated by a SPACE and not by a 'T'.
#   - Assumptions: identifiers are digits-only strings and never integers. The
#     baseline itself treats them as characters on the wire and as numbers only
#     in arithmetic: app/cpy/CVCRD01Y.cpy declares three X-over-9 REDEFINES
#     pairs, CC-ACCT-ID X(11) at L34 over CC-ACCT-ID-N 9(11) at L36,
#     CC-CARD-NUM X(16) at L37 over 9(16) at L39, and CC-CUST-ID X(09) at L40
#     over 9(9) at L42. An integer would additionally discard the leading zeroes
#     a numeric picture stores.
#   - Trade-offs: each three-part screen date is consolidated into one ISO value.
#     The screen collects six components -- SDTMMI, SDTDDI and SDTYYYY at
#     app/cpy-bms/CORPT00.CPY L78, L84 and L90 and the matching trio at L96,
#     L102 and L108 -- so a caller can no longer submit a month without a year.
#     Nothing observable is given up: all twelve per-component messages remain
#     reachable as fieldErrors entries, and the assembled form is what the
#     program itself works in.
#   - Assumptions: both statement renderings are always produced, so each is
#     published as a location and there is no format selector of any kind. The
#     generator step at app/jcl/CREASTMT.JCL L79 creates both datasets
#     unconditionally, the plain text at L87 to L91 and the markup at L92 to
#     L96. A rerun REPLACES rather than appends -- the delete step at L66
#     removes both first -- so a location is stable across runs.
#   - Assumptions: this document leads its handlers on wording and they lead it
#     on shape. Every property name, width and nullability below is the
#     component list of a record under com.carddemo.reporting.dto, and
#     ReportingApiContractTest holds the two together: it asserts that this file
#     parses, that its information block equals the one OpenApiConfig serves,
#     that every operation carries an identifier and an authority, that every
#     reference resolves, and that the documented routes and the handler routes
#     agree in BOTH directions.
# =============================================================================

openapi: 3.1.0

info:
  title: CardDemo Reporting Service API
  version: 1.0.0
  summary: >-
    Transaction reports and account statements for the migrated CardDemo
    system, plus the starting of an on-demand report execution.
  # WHY : ⚠️ Refactoring Rationale: the privilege sentence below read "a database role holding
  #       select and nothing else". It omitted the login's only executable privilege --
  #       reporting.resolve_card(character varying), which
  #       data-migration/sql/V1__reporting_views.sql revokes from PUBLIC and grants EXECUTE on to
  #       this login -- and it left the readable surface uncounted, which is ten relations for the
  #       login against the eight this context queries, the other two being the aggregate-only
  #       verification relations of data-migration/sql/V3__verification_surfaces.sql. The rationale
  #       sits in this comment rather than in the description because a comment is not served: a
  #       published description is where a caller learns what the service does, not where it learns
  #       what a previous revision of the description got wrong.
  # WHY : Assumptions: this value is BYTE-IDENTICAL to CONTRACT_DESCRIPTION in
  #       services/reporting-service/src/main/java/com/carddemo/reporting/config/OpenApiConfig.java,
  #       paragraph breaks included, and ReportingApiContractTest compares the two -- so an edit here
  #       that is not mirrored there fails the build rather than drifting.
  description: >-
    Reports and statements for the migrated CardDemo credit-card system. This
    context reads and never writes: its queries resolve against the eight
    read-only cross-schema views created by
    data-migration/sql/V1__reporting_views.sql, under a database login holding
    SELECT on the reporting schema's ten views, EXECUTE on its one function and
    nothing else, and it owns no table, index or constraint. It therefore ships
    no schema-migration directory, and one appearing beneath this module would
    itself be a defect.


    Three surfaces are published. The transaction detail report preserves the
    133-column width that the X(133) separator at app/cpy/CVTRA07Y.cpy L48
    fixes, and it preserves its two distinct COBOL edit masks separately rather
    than unifying them: L30 declares a leading-minus mask for a detail amount,
    while L54, L60 and L66 declare a leading-plus mask for the page, account
    and grand totals. The account statement pair is rendered as plain text and
    as HTML and is returned by URI. The submission operation stands in for the
    baseline's writing of job-control text to a transient data queue, which
    app/csd/CARDDEMO.CSD L502 maps to the internal reader.


    Monetary amounts are carried as JSON strings so that no client parses one
    into IEEE-754 binary floating point.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: /
    description: >-
      The origin that served this document. Every path below is appended to it
      unchanged, so no host, port or environment name is recorded here. The two
      hops in front of this service -- the public HTTP API and the internal load
      balancer -- are not observable from inside it, so naming either one here
      would advertise an address no browser can resolve.

# WHY : Assumptions: there is no unauthenticated operation in this context and
#       none may be added. Declaring the requirement once rather than eight times
#       removes the failure mode where a ninth operation is added and its
#       per-operation requirement is forgotten, which serialises without
#       complaint and reads as a deliberately public route. The external
#       contract relied on is the filter chain at
#       services/reporting-service/src/main/java/com/carddemo/reporting/config/SecurityConfig.java,
#       whose catch-all rule admits only a token carrying one of the two group
#       authorities and refuses one carrying neither before a handler is
#       reached; the single unauthenticated diagnostic path it permits is
#       deliberately not an operation of this contract, because the two probes
#       that read it live outside this repository's Java and neither can present
#       a token.
security:
  - bearerAuth: []

# Alternatives Considered: conveying the required authority in prose, and
# conveying it by tag membership. Both were rejected because neither is
# checkable: a restriction expressed either way is indistinguishable to a
# generator or a gateway from any other authenticated route, and a tag
# rename removes it with nothing failing. Naming the requirement in a field
# makes it assertable, and ReportingApiContractTest asserts that every
# operation carries it with a value this model admits.
x-authority-model:
  field: x-required-authority
  values:
    - carddemo-user
    - carddemo-admin
  enforcedBy: >-
    services/reporting-service/src/main/java/com/carddemo/reporting/config/SecurityConfig.java
  assertedBy: >-
    services/reporting-service/src/test/java/com/carddemo/reporting/api/ReportingApiContractTest.java

tags:
  - name: reports
    description: >-
      The transaction detail report: starting an on-demand execution of it, and
      reading the detail lines and the subtotal bands of a completed one. Each
      operation carries x-required-authority carddemo-user.
  - name: statements
    description: >-
      The account statement pair rendered from one card's posted transactions,
      and the transactions a statement was rendered from. Each operation
      carries x-required-authority carddemo-user.

paths:

  /api/v1/reports/transaction-report:

    description: >-
      The transaction detail report as a resource that can be asked to run. It
      carries one operation and deliberately no delete: an execution already
      started is owned by the orchestrator rather than by this context, so
      nothing here can withdraw one.

    post:
      operationId: submitTransactionReport
      tags:
        - reports
      x-required-authority: carddemo-user
      summary: Starts an on-demand transaction report execution.
      description: >-
        Replaces the report-request screen and the confirmation gate in front of
        it. At least one of the three type selectors must be marked; marking none
        is refused with the verbatim message app/cbl/CORPT00C.cbl raises at
        L438, 'Select a report type to print report...'. Marking more than one is
        NOT refused: the reference selects the FIRST marked type in the order
        monthly, yearly, custom -- its condition chain at L213, L239 and L256
        stops at the first matching arm -- and the reportName in the response
        names which type ran. The two range bounds are read only by the custom
        type.


        Generation is ASYNCHRONOUS. A started run answers 201 with a durable
        handle and the caller polls the detail and totals operations; the long
        assembly is delegated to a state machine and is never held open on a
        request thread. The three report types resolve to a range once, at this
        edge, through an injectable clock, and both generators receive an
        explicit resolved range so that neither reads a clock. MONTHLY resolves
        to a FULL CALENDAR MONTH -- app/cbl/CORPT00C.cbl L223 sets the day to 1,
        L224 adds one to the month, L225 to L228 roll the year, and L229 to L230
        take the date of the integer of the date minus one, which lands on the
        LAST day of the current month. YEARLY resolves to the first of January
        through the thirty-first of December, at L241 to L255. Both presets
        therefore legitimately carry an end date later than the current day for
        most of their period.


        Three confirmation outcomes are distinguished, and a deliberate
        cancellation is NOT an error. A value of 'Y' or 'y' starts the run at
        201, whose message the baseline composes at L447 to L454 as the report
        name followed by ' report submitted for printing ...' -- note the SPACE
        before those three dots, which the confirmation prompt does not have;
        the two strings are similar and are never merged. A value of 'N' or 'n'
        cancels at 200: the branch at L480 to L483 performs
        INITIALIZE-ALL-FIELDS, raises the error flag and re-sends the screen with
        NO MESSAGE SET AT ALL, so a cancellation carries no message either --
        this response's message member is null on that branch and nothing is
        composed to stand in for it. A blank or unset confirmation is the third
        outcome and it is answered with 200 and an outcome of UNANSWERED, whose
        message member carries the prompt the baseline composes at L465 to L469
        from 'Please confirm to print the ', the report name and ' report...'. It
        is a question being asked rather than a fault being reported, which is
        why it is neither a 400 nor a DECLINED. Nothing is started on that turn,
        so a caller re-submits with an answer. Any other
        value IS answered 400, whose message the baseline composes at L485 to
        L489 as the quoted value followed by '" is not a valid value to
        confirm...'.


        Repeat submissions are the CALLER's decision. Omitting the
        Idempotency-Key header starts a distinct run every time, so the same
        report may be produced again over the same range -- after the underlying
        rows are corrected, for instance. Sending the same key twice makes the
        second attempt a duplicate the orchestrator refuses, which is how a
        client retrying a call whose response was lost avoids starting a second
        run.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        description: >-
          The report selection: one marked type, the confirmation answer, and
          the two range bounds when the custom type is marked.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: >-
            Nothing was started and no error occurred, which happens on two
            distinct turns and the body's outcome member says which. DECLINED is
            the caller answering no: message and submission are both present and
            null, because the baseline writes nothing into the message line at
            L480 to L483 and there is no run to describe. UNANSWERED is a
            confirmation not yet answered: submission is null and message carries
            the baseline's own prompt from L464 to L474, which is a question being
            asked rather than a mistake being reported.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSubmissionOutcome'
        '201':
          description: >-
            An execution was started. The body's outcome member is STARTED and
            its submission member carries the handle to poll with.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSubmissionOutcome'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/reports/transaction-report/lines:

    description: >-
      The detail lines of the transaction report over an inclusive
      processing-date range, addressable only as a key-ordered sequence of
      bounded windows.

    get:
      operationId: listTransactionReportLines
      tags:
        - reports
      x-required-authority: carddemo-user
      summary: Reads one window of transaction report detail lines.
      description: >-
        Each line carries the eight values the printed detail band carries, with
        its amount rendered from the leading-minus mask declared at
        app/cpy/CVTRA07Y.cpy L30. Three of the eight are join results --
        accountId, typeDescription and categoryDescription -- because the
        transaction master itself carries no account identifier and no
        description: app/cbl/CBTRN03C.cbl resolves them at L364, L366 and L368
        while emitting the band with eight and only eight moves at L363 to L370.


        The range predicate is inclusive at BOTH ends and compares the DATE PART
        ONLY: app/cbl/CBTRN03C.cbl L173 to L174 tests the first ten characters of
        the twenty-six-character processing timestamp with a greater-or-equal and
        a less-or-equal. app/jcl/TRANREPT.jcl L47 to L48 corroborates it with an
        INCLUDE condition, which is a RECORD-SELECTION predicate -- the analogue
        of a filter clause -- and never a step gate.


        Alternatives Considered: paging by a counted row position. Rejected on
        the row-omission-and-repetition grounds recorded in this file's header,
        which are grounded in a specific unlocked read-then-increment in the
        baseline rather than in a general claim. This window is keyset-ordered
        instead, and its boundary tokens are sealed by the service, so replaying
        a backward boundary while asking to read forward is refused with 400
        rather than answered with the wrong rows.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/StartDateQuery'
        - $ref: '#/components/parameters/EndDateQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PagingDirection'
      responses:
        '200':
          description: >-
            One bounded window of report detail lines with the two sealed
            boundaries a following or preceding request is issued from.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionReportLinePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/reports/transaction-report/totals:

    description: >-
      The three subtotal bands the transaction report emits over an inclusive
      processing-date range.

    get:
      operationId: readTransactionReportTotals
      tags:
        - reports
      x-required-authority: carddemo-user
      summary: Reads the subtotal bands of the transaction report.
      description: >-
        The bands are returned in the order the report emits them, each with the
        verbatim label its reference group declares and its amount rendered from
        the leading-plus mask at app/cpy/CVTRA07Y.cpy L54, L60 and L66. That
        mask is deliberately NOT unified with the leading-minus detail mask at
        L30; treating them as one would change the bytes this context emits.


        Assumptions: the roll-up chain is reproduced exactly as the reference
        computes it, and two properties of it are surprising enough to state.
        app/cbl/CBTRN03C.cbl L287 to L288 adds one transaction to the page and
        the account accumulators, and L297 adds the PAGE accumulator to the
        grand accumulator -- so the grand band sums page bands and never
        receives the account band. Separately, the band labelled 'Account Total'
        actually breaks on the CARD NUMBER, held in WS-CURR-CARD-NUM X(16) at
        L137 and tested at L181, because app/jcl/TRANREPT.jcl L46 sorts the
        input by card number. Substituting a per-account grouping would change
        the output for every account holding more than one card, so the label is
        carried verbatim and the break is not reinterpreted. Both are artifact
        observations of the immutable baseline and neither is a defect; the
        register for documented divergences is
        docs/architecture/cobol-to-service-traceability.md.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/StartDateQuery'
        - $ref: '#/components/parameters/EndDateQuery'
      responses:
        '200':
          description: >-
            The subtotal bands of one range, in the order the report emits them.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionReportTotals'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/reports/executions/{executionName}:

    description: >-
      One accepted report submission: what became of it, and where its output is.

    get:
      operationId: readReportExecution
      tags:
        - reports
      x-required-authority: carddemo-user
      summary: Reports what became of one submitted report.
      description: >-
        Answers the handle a submission returned. Reports whether the run is
        still going, has succeeded or has failed; echoes the report type and the
        resolved bounds the run received, which matters because two of the three
        report types resolve bounds the caller never supplied; and, once the run
        has succeeded and its artifact is stored, carries the path the produced
        report is collected from.


        Refactoring Rationale: this operation is what the submission handle is
        for. Without it a caller could not tell a run still going from one that
        had failed, and could not reach the document it produced: reading the two
        range operations instead reports the CURRENT contents of the ledger, which
        is not the same thing as the report a particular run rendered. The
        baseline has no equivalent for a different reason -- it writes card images
        to the transient data queue at app/csd/CARDDEMO.CSD L499 to L505 and
        receives no identity back at all -- so this is a documented improvement
        rather than a port, registered as D-REPORT-LIFECYCLE-OBSERVABLE.


        Assumptions: the run is named by its NAME and never by an orchestration
        handle in full. The service composes the handle from the state machine it
        is configured with, so nothing a caller sends can reach another state
        machine, another account or another environment. A name of the wrong
        SHAPE is refused with 400, since the shape is published below; a
        well-formed name the orchestration does not know is answered with 404,
        which is also the answer for a name it has forgotten -- a completed run is
        retained for ninety days -- so neither reveals which names exist.


        Assumptions: the result location is present only where the store HOLDS
        the artifact, so a location this operation returns always resolves. A run
        that succeeded and whose artifact a lifecycle rule has since expired
        reports its status with no location.
      parameters:
        - $ref: '#/components/parameters/ExecutionNamePath'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: >-
            What the orchestration reports about the run, with the artifact's
            location and write instant when one is stored.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExecutionStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/reports/transaction-report/artifact:

    description: >-
      The rendered transaction report a run produced, for one type and range.

    get:
      operationId: collectReportArtifact
      tags:
        - reports
      x-required-authority: carddemo-user
      summary: Collects the rendered transaction report for one type and range.
      description: >-
        Streams the 133-column report a run wrote -- the width fixed by
        FD-REPTFILE-REC PIC X(133) at app/cbl/CBTRN03C.cbl L85 -- for the type and
        the inclusive range that identify it. Take the location from the
        execution-status operation, or compose it from coordinates already held.


        Refactoring Rationale: this operation is the only way the artifact a run
        writes can be collected. The dataset bucket admits only the VPC endpoint,
        so even an operator holding the object key cannot fetch it over HTTPS.
        Streaming it here keeps collection inside the same bearer token, the same
        authority check and the same audit trail as every other read of this
        contract. Alternatives Considered: a pre-signed URL. Rejected because it
        is a bearer credential in a query string that outlives the session, is
        recorded in browser history and in every intermediary's access log, cannot
        be revoked, and carries none of this surface's rules.


        Assumptions: the artifact is addressed by its COORDINATES rather than by
        an opaque selector, which is the opposite of how a statement artifact is
        addressed, and the difference is the subject matter. A statement selector
        protects a card identity; a report type and a date range describe a query
        and name no person. An opaque token would also stop an operator from
        constructing the location of a run whose coordinates they know, which is
        what a runbook does when a report is chased after the fact. What replaces
        the token as a safeguard is validation: the type is admitted only from the
        closed domain below and each bound is parsed as a calendar date, so no
        caller-supplied text reaches an object key uninterpreted.


        Trade-offs: the body is an opaque attachment rather than declared text,
        for the same reason the statement artifacts are. The report is a
        fixed-width document compared byte for byte against the golden masters,
        and declaring a text media type invites a client to re-encode it.
      parameters:
        - $ref: '#/components/parameters/ReportTypeQuery'
        - $ref: '#/components/parameters/StartDateQuery'
        - $ref: '#/components/parameters/EndDateQuery'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: >-
            The report's bytes, as an attachment. The length is declared from the
            store's own record of the stored object and the body is streamed
            rather than assembled.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Content-Disposition:
              $ref: '#/components/headers/AttachmentDisposition'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: >-
                  The report exactly as it was written: 133-column fixed-width
                  records, one per line, with the page and account banding the
                  reference emits.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/reports/statements:

    description: >-
      The account statement pair for one card or one account.

    post:
      operationId: generateStatement
      tags:
        - statements
      x-required-authority: carddemo-user
      summary: Renders the statement pair for one card or account.
      description: >-
        Returns the heading figures, the assembled total and the locations of
        the two rendered artifacts. Both are always produced and neither is
        negotiated: there is no content-negotiation switch, no format query
        parameter and no output-format selector anywhere in this contract,
        because app/jcl/CREASTMT.JCL L79 creates both datasets in one step --
        the 80-byte plain text at L87 to L91 and the 100-byte markup at L92 to
        L96, the width itself at L94. The 80 declared in the DELETE stanza at
        L67 to L71 is inert, because the utility running that step writes no
        data, and it is not the markup width.


        Trade-offs: this is a POST although it changes nothing, and the reason is
        disclosure rather than semantics. The statement is selected by a primary
        account number, and a request line is written into the access log of
        every intermediary and retained in browser history and in a referrer
        header -- none of which this service can redact afterwards. Carrying the
        selector in a body keeps it out of all of them, at the cost of an
        operation that is neither cacheable nor idempotent by method.


        The artifacts are returned by location rather than inline because the
        plain-text form is the byte-for-byte parity artifact compared against
        the golden masters, and inlining it would require an encoding step that
        no longer preserves those bytes.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        description: >-
          The selector: exactly one of a sixteen-digit card number or an
          eleven-digit account identifier.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementRequest'
      responses:
        '200':
          description: >-
            The statement summary and the locations of its two renderings.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/reports/statements/transactions:

    description: >-
      The posted transactions one statement was rendered from.

    post:
      operationId: listStatementTransactions
      tags:
        - statements
      x-required-authority: carddemo-user
      summary: Reads the transactions behind one statement.
      description: >-
        Takes the same selector as the statement operation and for the same
        disclosure reason, so a primary account number never reaches a target.
        The rows are ordered CARD NUMBER FIRST and then transaction identifier,
        which is the reference key order verified twice: app/cpy/COSTM01.CPY
        declares TRNX-KEY at L21 as TRNX-CARD-NUM X(16) at L22 followed by
        TRNX-ID X(16) at L23, a thirty-two-byte key with the card number
        leading, and app/jcl/CREASTMT.JCL L53 sorts
        FIELDS=(263,16,CH,A,1,16,CH,A) -- the card number at position 263 then
        the identifier at position 1, both ascending.


        The set is returned as ONE body rather than as a sequence of windows,
        because a statement covers one card's posted transactions for one period
        and that set is delimited by the statement itself, so there is no
        open-ended sequence for a boundary token to walk. It is nonetheless
        bounded at a row ceiling, and the body says so: transactionCount reports
        what the statement covers and truncated reports whether the array is
        short of it.


        Assumptions: the set is NOT returned whole, and the two bounds in play
        here are different bounds. The service carries a response ceiling of 1000
        rows, which keeps the response path safe against an allocation sized by a
        cardholder's history -- registered as divergence
        D-STMT-RESPONSE-BOUNDED -- while remaining free of any arity standing in
        for the reference's three table limits. Both statements are corrected
        together, and the ceiling is now declared as maxItems on the array.


        Trade-offs: the reference bound is a table arity rather than a query
        limit, and it is unchecked, so this operation answers where the baseline
        aborts. Three separate numbers describe it and they are never conflated
        into one figure: app/cbl/CBSTM03A.CBL L226 declares WS-CARD-TBL OCCURS
        51 TIMES, so the 52nd distinct card overruns the outer table; L228
        declares an inner arity of 10; and the measured same-card threshold is
        512, so the 513th transaction for one card overruns the inner area. The
        arithmetic reconciling 512 with the declared 10 is that the table is 51
        cards times 16 plus 10 times 334 bytes, which is 171,156 bytes, while
        the Nth same-card write lands at 16 plus N minus 1 times 334 and so
        stays inside that area only while N is at most 512. The migrated service
        carries no fixed arity standing in for any of the three and does not
        abort at any of them: the RENDERED ARTIFACT is unbounded in the same
        sense the reference intended, which is divergence D-2. What it does carry
        is a ceiling on this HTTP RESPONSE, declared as maxItems on the array and
        reported per body by transactionCount and truncated, which is a bound on
        a surface the baseline does not publish at all and is registered
        separately as D-STMT-RESPONSE-BOUNDED. Both are documented divergences
        rather than silent improvements, registered in
        docs/architecture/cobol-to-service-traceability.md.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        description: >-
          The selector, identical in shape to the statement operation's: exactly
          one of a card number or an account identifier.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementRequest'
      responses:
        '200':
          description: >-
            The transactions the statement was rendered from, ordered by card
            number and then by transaction identifier, together with the count
            the statement covers and whether the array is short of it.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementTransactionCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'


  /api/v1/reports/statements/artifacts/{selector}:

    description: >-
      One stored statement rendering, collected by the opaque selector a
      statement response published for it.

    get:
      operationId: collectArtifact
      tags:
        - statements
      x-required-authority: carddemo-user
      summary: Collects one stored statement rendering.
      description: >-
        Streams the bytes of the artifact the selector names: the 80-byte plain
        text of FD-STMTFILE-REC at app/cbl/CBSTM03A.CBL L45 or the 100-byte
        markup of FD-HTMLFILE-REC at its L47, whichever the selector was minted
        for. Take the selector from the plainTextUri or htmlUri of a statement
        response and pass the whole path back unchanged.


        Refactoring Rationale: this operation exists because a location the two
        statement operations publish has to be served by something. The dataset
        bucket admits only the VPC endpoint, so a caller holding a location cannot
        open it directly, and a per-card object location would name something no
        writer produces at all. Two alternatives are rejected. Widening
        the bucket policy would make every artifact of every run reachable from
        the internet on the strength of a key name, with no authorization rule
        between a caller and a statement. A pre-signed URL is a bearer credential
        carried in a query string: it outlives the session, is recorded in browser
        history and in every intermediary's access log, cannot be revoked, and
        carries none of this surface's own rules. Serving the bytes here keeps
        collection inside the same token, the same authority check and the same
        audit trail as every other read of this contract.


        Trade-offs: BOTH renderings are returned as application/octet-stream with
        an attachment disposition, and the markup is deliberately NOT returned as
        text/html. The markup is built from cardholder data, and declaring it
        renderable invites a browser to execute it in this origin -- exactly the
        case the content-security policy and the attachment disposition on every
        response of this surface exist to prevent. A caller that wants to display
        it saves it and opens it itself.


        Assumptions: an unknown selector, a selector this deployment did not mint
        and an artifact the store does not hold are all reported as 404 and are
        not distinguished. Distinguishing them would let a caller discover which
        selectors are real, and no caller can act on the difference. A selector of
        the wrong SHAPE is refused with 400 instead, before the store is consulted:
        the shape is published as ArtifactSelector in this document, so refusing it
        discloses nothing, and it cannot name an artifact.
      parameters:
        - $ref: '#/components/parameters/ArtifactSelectorPath'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: >-
            The artifact's bytes, as an attachment. The length is declared from
            the store's own record of the stored object, and the body is streamed
            rather than assembled, so a statement run covering a large portfolio
            is not held in memory to be served.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Content-Disposition:
              $ref: '#/components/headers/AttachmentDisposition'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            Content-Security-Policy:
              $ref: '#/components/headers/StatementContentSecurityPolicy'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: >-
                  The artifact exactly as it was written: fixed-length records,
                  one per line, at the width of the rendering the selector names.
                  The plain-text form is the byte-for-byte parity artifact
                  compared against the golden masters, which is why it is served
                  unencoded and unmodified.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token minted by the project's managed identity provider and
        validated by this service acting as a resource server. The token's group
        claim is converted to authorities, where the baseline user type 'A'
        becomes the administrator group and 'U' becomes the ordinary user group.
        Presenting no usable token yields 401; presenting a valid token that
        lacks the authority an operation requires yields 403.

  headers:

    CorrelationId:
      description: >-
        The identity of the unit of work that produced this response, echoed
        verbatim when the caller supplied one and freshly minted otherwise. It
        is the value to quote when reporting a problem, and it appears on every
        response this contract declares.
      required: false
      schema:
        $ref: '#/components/schemas/CorrelationId'

    # Assumptions: the three headers below are declared as COMPONENTS even
    # though one operation returns them, because the operation that returns
    # them is the one whose body a browser could render and a header omitted
    # from a document is a header a client does not know to expect. They are
    # set together by one helper in StatementController for the same reason.
    AttachmentDisposition:
      description: >-
        Instructs a browser to save the body rather than display it. Stated
        WITHOUT a filename: a filename derived from a card or an account would
        put an identifier into a value the browser writes to the file system.
      required: true
      schema:
        type: string
        enum:
          - attachment

    ContentTypeOptions:
      description: >-
        Forbids content-type sniffing, so a body served as an opaque attachment
        cannot be re-interpreted as markup by a browser that guesses.
      required: true
      schema:
        type: string
        enum:
          - nosniff

    StatementContentSecurityPolicy:
      description: >-
        Denies every fetch and sandboxes the document, so statement markup opened
        from this origin can load nothing and execute nothing.
      required: true
      schema:
        type: string
        enum:
          - "default-src 'none'; sandbox"

  parameters:

    # Assumptions: the width is twenty-four characters because that is what
    # the reference correlation field holds --
    # app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl L45 declares
    # WS-SAVE-CORRELID PIC X(24), echoed at L745. The 48-byte fields at its
    # L43 and L44 are QUEUE NAMES rather than identifiers and are not
    # conflated with it, and no message-identifier width is asserted here
    # because the messaging copybooks are absent from this repository and
    # the value would be unverifiable.
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        A caller-supplied request identifier, echoed on the response and carried
        into every log line the request produces. Omitting it is normal: the
        shared filter in common-lib mints one in the same shape. At most
        twenty-four characters, enforced before any handler runs. It must never
        carry a credential, because it is written to logs by design.
      # Assumptions: the shared CorrelationId schema admits the EMPTY string, because
      # ApiError normalises an absent identity to "" at L619 and every problem
      # document carries the member, so the schema a BODY member names has to admit
      # it. A REQUEST header must not: conformsWithin in CorrelationIdFilter
      # declines an empty value and the filter then answers 400. This parameter
      # therefore narrows the shared schema by one facet instead of restating its
      # alphabet and width, which would be a second statement of both. Omitting the
      # header entirely stays valid -- that is governed by required above.
      schema:
        allOf:
          - $ref: '#/components/schemas/CorrelationId'
          - minLength: 1

    # Assumptions: the key travels as a header rather than as a member of
    # the request body because it describes the submission ATTEMPT and not
    # the report being requested, and ReportRequest derives its component
    # count arithmetically from the named fields of app/bms/CORPT00.bms --
    # so a member for this would be one the screen does not account for.
    # Assumptions: this key is OPTIONAL, so retry protection is requested by a
    # caller rather than imposed on one. Deriving the execution name from the
    # report type and both bounds alone would make it unique to the report and
    # the range for the 90 days the orchestrator remembers a completed
    # execution, so the first submission of a range would succeed and every
    # later one be refused -- including a rerun after the underlying rows were
    # corrected, which is not a duplicate submission at all.
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        An optional caller-supplied key identifying this submission ATTEMPT.
        Send the same key again to retry a submission whose response was lost:
        the second attempt is then recognised as a duplicate and refused rather
        than starting a second run of the same report. Omit it -- which is
        normal -- and every submission starts a distinct run, which is what
        allows the same report to be produced again over the same range. At most
        forty characters, and only letters, digits, hyphens and underscores,
        because the value becomes part of the orchestrator's execution name; a
        key outside that is refused with 400 rather than trimmed, since two
        different keys must never be shortened into one.
      schema:
        type: string
        minLength: 1
        maxLength: 40
        pattern: '^[A-Za-z0-9_-]+$'
        example: monthly-2022-07-retry-1

    ExecutionNamePath:
      name: executionName
      in: path
      required: true
      description: >-
        The name identifying one accepted run, taken verbatim from the
        executionName a submission returned. The service composes the
        orchestration handle from this name and the state machine it is configured
        with, so a name cannot reach another state machine or another environment.
      schema:
        $ref: '#/components/schemas/ExecutionName'

    ReportTypeQuery:
      name: type
      in: query
      required: true
      description: >-
        Which report the artifact belongs to. The nightly scheduled run publishes
        under daily -- it is the reference's app/jcl/TRANREPT.jcl output over one
        business date and is deliberately not one of the three the request surface
        offers -- and an on-demand run publishes under the lower-cased form of its
        own type.
      schema:
        $ref: '#/components/schemas/ReportTypeToken'

    ArtifactSelectorPath:
      name: selector
      in: path
      required: true
      description: >-
        The opaque selector naming one stored statement artifact, taken verbatim
        from the plainTextUri or htmlUri of a statement response. It is resolved
        against the two artifacts this service publishes and is never treated as
        an object key, so no selector -- however manipulated -- can address
        another object of the dataset bucket.
      schema:
        $ref: '#/components/schemas/ArtifactSelector'

    StartDateQuery:
      name: startDate
      in: query
      required: true
      description: >-
        Inclusive lower bound of the processing-date range, as YYYY-MM-DD. It is
        a parameter rather than a clock read so that a rerun over the same range
        produces the same output; app/jcl/TRANREPT.jcl L43 injects exactly this
        bound as a job argument for the same reason.
      schema:
        $ref: '#/components/schemas/IsoDate'

    EndDateQuery:
      name: endDate
      in: query
      required: true
      description: >-
        Inclusive upper bound of the processing-date range, as YYYY-MM-DD,
        injected as a job argument at app/jcl/TRANREPT.jcl L44. Inclusive at
        this end as well as at the lower one, matching the greater-or-equal and
        less-or-equal pair at app/cbl/CBTRN03C.cbl L173 to L174.
      schema:
        $ref: '#/components/schemas/IsoDate'

    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        An opaque sealed position issued by this service as the firstKey or
        lastKey of a window already held. Omitted to read the first window. The
        direction it was issued for is sealed into it, so replaying a backward
        position while asking to read forward is refused with 400 rather than
        answered with the wrong rows.
      schema:
        $ref: '#/components/schemas/CursorToken'

    PagingDirection:
      name: direction
      in: query
      required: false
      description: >-
        Which way to read from the supplied cursor. Meaningful only alongside
        one, and treated as next when omitted. The backward value is what the
        reference PF7 key requested and the forward value what PF8 requested.
      schema:
        $ref: '#/components/schemas/PageDirection'

  responses:

    # Alternatives Considered: declaring each refusal inline on each
    # operation, which reads more locally and is what a generator emits.
    # Rejected because it is how one operation ends up publishing a
    # different error shape from its siblings -- the bodies are produced by
    # one advice class,
    # services/common-lib/src/main/java/com/carddemo/common/error/GlobalExceptionHandler.java,
    # so five inline copies would be five chances to describe one shape
    # five ways, and a client writing a single error path for the whole
    # contract is exactly what that class exists to make possible.
    BadRequest:
      description: >-
        The request did not satisfy a declared constraint. The body's fieldErrors
        array names each failing property and carries the verbatim message the
        baseline raises for it, and its first entry is the field a client should
        move focus to.
      # Assumptions: every shared refusal declares the correlation header, and these six did
      # not while the four protocol refusals beside them did. The identifier is set by
      # services/common-lib/src/main/java/com/carddemo/common/web/CorrelationIdFilter.java on
      # the way in and echoed on EVERY response, refusals included, so a component that
      # omitted it described a header the runtime sends anyway -- across thirty-eight of this
      # document's published responses, since each of these six is referenced many times.
      # Declared on the component rather than at each reference so the sixty references state
      # it once.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Unauthorized:
      description: >-
        No usable token was presented. Decided by the filter chain before any
        handler runs, and rendered with a body because config/SecurityConfig.java
        installs the shared refusal handlers precisely so that it carries one.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Forbidden:
      description: >-
        A valid token was presented that carries neither group authority. Decided
        after the credential has been accepted, which is what distinguishes it
        from the 401 above.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFound:
      description: >-
        No card or account matches the selector. The response names no digit of
        the value that was searched for, so a caller cannot use the refusal
        itself to confirm a number.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    ServiceUnavailable:
      description: >-
        The operation was refused because the environment is not currently
        accepting mutating work, and NOTHING WAS APPLIED -- the refusal is issued
        before the handler runs, so no part of the request took effect. A caller
        repeating the same request unchanged once the window reopens succeeds.


        This is the target equivalent of the reference quiesce:
        app/jcl/CLOSEFIL.jcl closed VSAM files to the online region for the
        duration of the posting chain and app/jcl/OPENFIL.jcl reopened them, so a
        write attempted in between received a file-status error. The migrated
        bracket deliberately closes WRITES only, so every read this contract
        publishes keeps answering while the window is closed -- which is why only
        the submission operation declares this refusal.


        Assumptions: 503 rather than 409 or 403, because the distinction is the one
        a client acts on. The request is well formed and its caller is entitled
        to make it; only the window in which it may be applied is absent. No
        retry hint is sent, because the window is reopened by a state machine
        whose remaining work this service cannot see, so any value would be a
        guess a client would then schedule against.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    InternalError:
      description: >-
        An unexpected failure. The body carries a correlation identifier and a
        code; it never carries the text of the underlying throwable, so nothing
        about the internal call path is disclosed to a caller.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    # Assumptions: each response component is defined exactly ONCE under this key, and a second
    #   definition of one is a defect rather than an override. A duplicate mapping key is the most
    #   deceptive shape a defect here can take: YAML resolves a repeated key to the LAST definition,
    #   so the earlier copy becomes dead text that still reads as the contract, and no schema-shaped
    #   test can tell because both copies parse and both carry the correlation header. Checking for
    #   the condition needs a duplicate-key-aware composer, since a plain safe load hides it by
    #   construction.
    PayloadTooLarge:
      description: >-
        The request body exceeds the byte ceiling this service accepts, and
        carries the machine code CARDDEMO-0413. The ceiling is 65536 bytes unless
        the deployment names another under carddemo.web.max-request-body-bytes,
        and it is enforced by a servlet filter ordered ahead of the security
        chain rather than by a handler -- which is why it applies to every
        operation that accepts a body and why the refusal reaches a caller that
        presented no token at all.


        Assumptions: the body of this response carries no fieldErrors entry and
        cannot. The refusal is raised before any member is parsed, so there is no
        bound object to have fields; the message names the ceiling and the size
        the request declared, which is what distinguishes a misconfigured client
        from a deliberate flood.


        Assumptions: a body that declares no length is not refused for that alone.
        It is read up to the ceiling and refused only if it exceeds it, and the
        bytes already read are forwarded to the handler when it does not, so a
        chunked request within the bound is served normally. For that case the
        message states that the body declares no length and exceeds the bound,
        because the exact size is the one thing that was never learned.


        Assumptions: this response carries the correlation identifier like every
        other, and that is a property of filter ORDER rather than of this filter.
        The correlation filter is registered one position ahead of it and has
        already put the identifier on the response before the body is written.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'


    # Assumptions: the transport refusals below are DECLARED because the shared advice in
    # services/common-lib produces every one of them, so each is reachable on every operation
    # of this contract. Leaving them undeclared would give a client no branch for them --
    # ui/src/api/client.ts could only treat each as an unrecognised body -- and declaring them
    # here without handling them there would document a response no caller could recognise.
    # Assumptions: each carries the same ApiError shape as every other refusal of this
    # contract, with its own machine code -- CARDDEMO-0405, CARDDEMO-0406 and
    # CARDDEMO-0415. A distinct code per condition is what lets a client branch without
    # reading the sentence, which is the same reason the 400 and the 401 do not share one.
    # Assumptions: the body is declared application/json because that is what the shared
    # advice writes -- it returns a plain ApiError record and this build registers no
    # problem+json converter -- and because the 406 arm pins MediaType.APPLICATION_JSON
    # explicitly, which is the single call that lets a body be produced at all for a caller
    # whose Accept header matched nothing.
    MethodNotAllowed:
      description: >-
        The route addressed does not publish the method the request named. The response
        carries an Allow header naming the methods it does publish, which is where a client
        reads them; the body does not repeat that list, so the two cannot disagree.


        Assumptions: this has no reference counterpart. A 3270 terminal cannot address a
        transaction with a verb the program did not define, so no reference literal or
        condition name corresponds to this outcome. It exists because a target route is
        addressed by callers this system does not control.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Allow:
          description: >-
            The methods the addressed route publishes, joined with a comma and a space.
            Composed from the methods the framework's handler mapping reports, which are
            server-authored; the method the caller USED is echoed nowhere. It is omitted
            rather than sent empty when the framework reported no supported set, because an
            empty Allow states that the route supports no method at all, which would be a
            different and false claim.
          required: false
          schema:
            type: string
            example: 'GET, PUT'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    UnsupportedMediaType:
      description: >-
        The request carried a body in a media type this route does not accept, or carried a
        body with no Content-Type at all. Every operation of this contract that accepts a
        body accepts application/json and nothing else.


        The body carries no fieldErrors entry and cannot: the refusal is raised before any
        member has been parsed, so there is no bound object to have fields. That is why this
        is a distinct code from CARDDEMO-0400 rather than a 400 with an empty array, which a
        caller could not tell from a body it had mis-spelled.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotAcceptable:
      description: >-
        The request's Accept header names no media type this route can produce. Every
        operation of this contract produces application/json, EXCEPT the two artifact
        collections -- the transaction-report artifact and the statement artifacts -- which
        produce application/octet-stream and nothing else. An Accept naming a renderable type
        is refused there deliberately, because the markup artifact is composed from cardholder
        data and is delivered as an attachment rather than as a page.


        Assumptions: the body of this response is itself application/json, which is a type
        the caller has just said it will not accept. That is deliberate. The alternative is
        an empty 406, which carries neither the machine code nor the correlation identifier
        a support enquiry needs and tells the caller nothing about which header to change.
        The content type is set explicitly by the shared advice for a second reason recorded
        there: a body left to content negotiation would be negotiated against the same
        Accept header that already matched nothing, and the request would then be forwarded
        to the container error path, which this service publishes no route for.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'


  schemas:

    # -----------------------------------------------------------------------
    # Scalar contracts, referenced by the record schemas below
    # -----------------------------------------------------------------------

    # Trade-offs: money is a STRING and never a JSON number. A number is
    # cheaper for a client to read, but most clients parse one into
    # IEEE-754 binary floating point, which cannot represent every value
    # app/cpy/CVACT01Y.cpy L7 admits -- PIC S9(10)V99 is twelve significant
    # digits -- so cents would be silently wrong at the boundary the user
    # reads. The accepted cost is an explicit decimal parse per amount.
    # The width below is the widest carrier plus its sign and point rather
    # than a guess, and the base-master regime it comes from is ZONED
    # decimal with sign overpunch rather than packed, which
    # app/jcl/PRTCATBL.jcl L50 corroborates by declaring
    # TRAN-CAT-BAL,18,11,ZD.
    # Assumptions: the bound is NINE integer digits, matching the nine-digit
    # pictures the description names underneath, and a wider publication is not
    # harmless slack. A ten-digit total cannot be encoded by either report total
    # mask, both of which provide nine integer positions at
    # app/cpy/CVTRA07Y.cpy L54 and L60, so a value a wider schema admitted
    # would be refused by the encoder that has to print it. Publishing the
    # true bound makes the overflow a refused REQUEST rather than a report
    # that stops mid-band.
    # Assumptions: maxLength is thirteen and is derived, not chosen -- one
    # optional minus, nine integer digits, the point and two fractional
    # digits. minLength stays four, which is the shortest conforming value
    # 0.00. The width and the pattern therefore agree by construction: a width
    # admitting one more character than the pattern can match would publish a
    # bound the encoder underneath cannot honour.
    MonetaryAmount:
      type: string
      pattern: '^-?[0-9]{1,9}\.[0-9]{2}$'
      minLength: 4
      maxLength: 13
      description: >-
        An exact fixed-point amount at scale 2, always carrying both fractional
        digits and a leading minus when negative. Never a JSON number. Both
        report accumulators and the statement amount are PIC S9(09)V99 in the
        reference, at app/cbl/CBTRN03C.cbl L134 to L136 and app/cpy/COSTM01.CPY
        L29 respectively, so nine integer digits is the whole domain and not a
        cautious subset of it.

    # Alternatives Considered: constraining this to sixteen characters and
    # nothing more, which is the obvious reading of the X(16) width that
    # app/cpy/COSTM01.CPY L22 declares for TRNX-CARD-NUM. Rejected because
    # the reference number IS sixteen digits, so such a pattern admits a
    # completely unmasked value and would let a masking failure in
    # com.carddemo.reporting.mapper.ReportingDtoMapper serialise as a
    # perfectly valid response. Requiring the twelve asterisks makes that
    # failure unrepresentable rather than merely unlikely, and
    # ReportingApiContractTest pins this exact pattern for the same reason.
    MaskedCardNumber:
      type: string
      pattern: '^\*{12}[0-9]{4}$'
      minLength: 16
      maxLength: 16
      description: >-
        A primary account number rendered to its last four digits behind twelve
        asterisks. No operation in this contract returns an unmasked one, none
        accepts one in a target, and no card verification value appears anywhere
        in this contract at all.

    IsoDate:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      minLength: 10
      maxLength: 10
      description: >-
        A calendar date as YYYY-MM-DD, the ten-character form
        app/cbl/CORPT00C.cbl L72 names in WS-DATE-FORMAT. The order is already
        the one the baseline stores, so a lexical comparison and a date
        comparison agree, which is what lets the range predicate compare the
        leading ten characters of a timestamp directly.

    # Assumptions: no date-time format is declared on it.
    # services/common-lib/src/main/java/com/carddemo/common/time/TimestampFormatter.java
    # fixes the shape as 'yyyy-MM-dd HH:mm:ss.SSSSSS', separated by a SPACE
    # rather than a 'T' and carrying no zone, which a strict date-time
    # parse rejects even when the value is perfectly well formed.
    # Assumptions: the width is EXACT -- minLength and maxLength are both 26 --
    # and the pattern is declared, because the emitting side admits nothing
    # else. opaqueTimestamp in
    # services/reporting-service/src/main/java/com/carddemo/reporting/mapper/ReportingDtoMapper.java
    # refuses any non-null value whose length is not exactly
    # TimestampFormatter.TIMESTAMP_LENGTH, and TimestampFormatter emits exactly
    # that width. A maxLength-only declaration would admit the empty string and
    # every truncation of a stamp on all five members that reference this
    # schema -- values this service can neither produce nor accept -- and
    # transaction-api.yaml declares the same scalar strictly.
    # Alternatives Considered: keeping one loose scalar so that the single
    # short-tolerant member could go on sharing it. Rejected because that
    # member's tolerance is a property of ONE field's reformatting artifact,
    # not of timestamps in this contract, and one loose scalar spread the
    # exception across four members that have no such artifact. The artifact
    # is modelled by StatementProcessingTimestamp26 below instead, so the
    # exception is declared exactly where it applies and is legible as an
    # exception rather than as the general rule.
    # Assumptions: the selector's shape is DERIVED and not chosen. It is
    # exactly what common-lib OpaqueIdentifier emits -- TOKEN_LENGTH is 22 and
    # the encoding is unpadded URL-safe base64, so the alphabet is letters,
    # digits, underscore and hyphen -- and publishing the derived facets lets a
    # client reject a malformed selector without a round trip. Trade-offs: the
    # facets couple this document to that token width, which is the intended
    # coupling: a change of width has to be a change of contract, because a
    # location a caller already holds is composed from it.
    ExecutionName:
      type: string
      minLength: 1
      maxLength: 80
      pattern: '^[A-Za-z0-9_-]{1,80}$'
      description: >-
        The name of one report execution. Eighty characters is the orchestration's
        own limit on an execution name, and the alphabet is the one this service
        composes names from. Treat it as opaque: take it from a submission and
        pass it back unchanged.

    ReportTypeToken:
      type: string
      enum:
        - daily
        - monthly
        - yearly
        - custom
      description: >-
        The closed set of report types this service publishes artifacts for. The
        three on-demand tokens are the lower-cased report names the submission
        surface resolves; daily is the scheduled nightly run, which is a report
        over one business date rather than any of the three.

    ReportExecutionStatusResponse:
      type: object
      additionalProperties: false
      required:
        - executionName
        - status
        - startedAt
        - stoppedAt
        - reportType
        - startDate
        - endDate
        - resultUri
        - resultGeneratedAt
      description: >-
        What became of one accepted submission. The component list of
        com.carddemo.reporting.dto.ReportExecutionStatusResponse name for name.


        SIX MEMBERS ARE NULLABLE AND THEY MOVE IN GROUPS. stoppedAt is absent
        while the run is still going. The report type and the two bounds are
        absent only for a run started outside this surface -- the nightly schedule
        starts the same state machine -- because their values are recovered from
        the execution's own input, which such a run does not carry in the shape
        this service composes. The result location and its write instant are
        present exactly when the store holds the artifact, so a location here
        always resolves.


        It carries NO monetary value and no cardholder value of any kind: a run
        name, a status, two instants, a type, a date range and a served path.
      properties:
        executionName:
          allOf:
            - $ref: '#/components/schemas/ExecutionName'
          description: >-
            The run this status is about, echoed from the request.
        status:
          type: string
          enum:
            - RUNNING
            - SUCCEEDED
            - FAILED
            - TIMED_OUT
            - ABORTED
            - PENDING_REDRIVE
          description: >-
            Which state the orchestration reports the run in, carried across by
            name rather than reduced to a smaller set. The distinctions are ones
            an operator acts on: a timed-out run is retried, an aborted run was
            stopped deliberately, and a run awaiting redrive is one an operator
            has already been told about. Only SUCCEEDED can have an artifact.
        startedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp26'
          description: >-
            When the orchestration started the run.
        stoppedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp26'
            - type: 'null'
          description: >-
            When the run stopped, or null while it is still going.
        reportType:
          oneOf:
            - $ref: '#/components/schemas/ReportTypeToken'
            - type: 'null'
          description: >-
            Which report the run produces, or null for a run started outside this
            surface.
        startDate:
          oneOf:
            - $ref: '#/components/schemas/IsoDate'
            - type: 'null'
          description: >-
            Inclusive lower bound of the range the run covered, as the run
            received it -- which for the two preset types is a bound the caller
            never supplied. Null on the same terms as the report type.
        endDate:
          oneOf:
            - $ref: '#/components/schemas/IsoDate'
            - type: 'null'
          description: >-
            Inclusive upper bound of that range, null on the same terms. It is
            also the date the run is attributed to, which is what the on-demand
            task passes as its run date.
        resultUri:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 256
          description: >-
            WHERE TO COLLECT the produced report: the collect operation's path
            with the run's own type and bounds as query parameters. Follow it with
            the same bearer token. Null whenever no artifact is stored -- while
            the run is going, after it failed, and after a lifecycle rule has
            expired what it wrote -- so a location present here always resolves.
          examples:
            - /api/v1/reports/transaction-report/artifact?type=monthly&startDate=2022-06-01&endDate=2022-06-30
        resultGeneratedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp26'
            - type: 'null'
          description: >-
            When the stored artifact was written, taken from the object store's
            own record of the completed object. Null on exactly the same terms as
            the location: the two describe one stored artifact and neither is
            usable alone.

    ArtifactSelector:
      type: string
      minLength: 22
      maxLength: 22
      pattern: '^[A-Za-z0-9_-]{22}$'
      description: >-
        The opaque, keyed selector naming ONE stored statement artifact. It is
        derived from the artifact's name under a server-held key, so it spells out
        no account identifier, no card number and no object key, which is what
        makes it safe to place in a response body, a browser history entry and an
        intermediary's access log. It is STABLE, so the same artifact answers to
        the same selector across runs. Treat it as opaque: take it from a statement
        response and pass it back unchanged, and do not compose one.
      examples:
        - 0oL2fQ8xVn4tKpR7wZbY1s

    ArtifactLocation:
      type: string
      minLength: 59
      maxLength: 59
      pattern: '^/api/v1/reports/statements/artifacts/[A-Za-z0-9_-]{22}$'
      description: >-
        The path one stored statement artifact is collected from: the collect
        operation's own path with a selector appended. It is a path served by this
        deployment rather than an object-store location, because the dataset bucket
        admits only the VPC endpoint and an s3:// location is therefore unusable by
        every caller of this contract. Follow it with the same bearer token used
        for the operation that returned it.
      examples:
        - /api/v1/reports/statements/artifacts/0oL2fQ8xVn4tKpR7wZbY1s

    Timestamp26:
      type: string
      minLength: 26
      maxLength: 26
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}$'
      description: >-
        A twenty-six-character local timestamp of the form
        'YYYY-MM-DD HH:MM:SS.mmmmmm', space-separated, with microsecond precision
        and no zone designator. It is the width common-lib TimestampFormatter
        emits and the width the reference layouts declare. Treat it as OPAQUE
        text: compare and display it, but do not parse it as a zoned instant.
      examples:
        - '2022-07-18 22:10:31.000000'

    # Refactoring Rationale: this scalar exists because exactly one member
    # carries a baseline artifact the strict form above cannot describe.
    # app/jcl/CREASTMT.JCL L54 reformats with
    # OUTREC FIELDS=(1:263,16,17:1,262,279:279,50), whose final segment
    # copies 50 bytes from one-based 279 -- enough for the origination stamp
    # whole and only 24 of TRNX-PROC-TS's 26 characters, so the last two
    # positions arrive BLANK. The field is still 26 characters wide, which is
    # why the width here is exact and matches what the mapper enforces; it is
    # the CONTENT that differs, and the second alternative below is what
    # admits it.
    # Assumptions: the two alternatives are stated as a closed set rather
    # than as a relaxed pattern such as a trailing '.{6}'. A relaxed pattern
    # would also admit six arbitrary characters in the fractional position,
    # which is neither form the baseline produces, and this contract's job is
    # to describe the two it does.
    StatementProcessingTimestamp26:
      type: string
      minLength: 26
      maxLength: 26
      anyOf:
        - pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}$'
        - pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{4}  $'
      description: >-
        A twenty-six-character local timestamp on the same terms as Timestamp26,
        additionally admitting the form the reference reformatting step produces:
        twenty-four significant characters followed by two blanks, where the last
        two digits of the microsecond fraction were not copied. Treat it as OPAQUE
        text and never substitute a derived instant for it.
      examples:
        - '2022-07-18 22:10:31.000000'
        - '2022-07-18 22:10:31.0000  '

    # Assumptions: the width is 75 and not 78. app/cpy/CVCRD01Y.cpy L28 and
    # L29 declare CCARD-ERROR-MSG and CCARD-RETURN-MSG as PIC X(75), which
    # is the WIRE carrier; the 78 at app/cpy-bms/CORPT00.CPY L120 and L224
    # is the SCREEN field and so a rendering target rather than a wire
    # width. The two are never merged. Note also that L30 attaches a
    # low-values sentinel to the RETURN message only and not to the error
    # message, which is why null and the empty string are two DISTINCT wire
    # states here rather than synonyms: null means no message was set,
    # while empty means one was set to nothing.
    ReturnMessage:
      type:
        - string
        - 'null'
      maxLength: 75
      description: >-
        A single line of user-visible text at the seventy-five-character wire
        width, or null when no message was set at all. A deliberate cancellation
        of a report submission is the case that produces no message, because the
        baseline branch at app/cbl/CORPT00C.cbl L480 to L482 sets none.

    # Assumptions: both facets below are the sealer's own, character for character, rather
    #   than a looser publication. com.carddemo.common.web.CursorToken refuses a token longer
    #   than 256 characters and refuses one that is not the three-part v2 shape, so a wider
    #   width or an absent pattern would have this contract call valid a body the service
    #   refuses -- the class of disagreement a published contract exists to prevent, and one
    #   invisible to a compiler because one side is a number in a document. They are the same
    #   two the five sibling
    #   contexts publish, so there is one cursor shape across the migration rather than
    #   this one plus a looser exception.
    # Assumptions: minLength is dropped rather than kept at 1, because the pattern
    #   subsumes it -- the shortest string the expression admits is longer than one
    #   character -- and two facets expressing one floor invite them to disagree.
    CursorToken:
      type: string
      maxLength: 256
      pattern: '^v2\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]{1,200}$'
      description: >-
        An opaque, authenticated, enciphered, expiring position in an ordered result
        set, minted by this service and echoed back by the caller unchanged. Its three
        period-separated parts are a version marker, a nonce and an enciphered payload
        carrying its own authentication tag; a caller must not parse, edit, decode or
        construct one, because base64url-decoding it yields ciphertext and because the
        tag covers both that ciphertext and a binding naming the query, the subject and
        the DIRECTION the token was issued for -- so an altered or borrowed token fails
        to decipher and is refused with 400, and replaying a page's leading position
        with direction next cannot silently answer with the wrong page. It is opaque
        because the reference browse screens use positions of different shapes, so
        exposing a structure would publish one screen's key layout as the API's own.
        The shape is declared once here and referenced by the cursor parameter and by
        both cursor members of the page envelope, so none of the three can acquire a
        different bound. It is a string in every direction and never a number.

    PageDirection:
      type: string
      enum:
        - next
        - previous
      default: next
      description: >-
        Reading direction relative to a supplied cursor: next reads keys strictly
        greater than the lastKey ascending, previous reads keys strictly less
        than the firstKey descending. The two values are spelled in lower case
        because that is the wire vocabulary the shared request types accept.

    # Assumptions: the facets below are the shared filter's own accepted domain
    # and are never narrowed here, because a narrower publication disagrees with
    # the filter and with the six sibling contracts in two ways that both reach
    # a caller. Excluding the full stop or the underscore, which
    # CorrelationIdFilter accepts, would have a conforming upstream identity
    # such as order.1234 accepted by the filter, echoed on the response header
    # and then rejected by a client validating against this document. Excluding
    # the EMPTY value would declare invalid the one response a caller most needs
    # to parse, since that is what an error body carries for a failure raised
    # before any identity was established.
    # Assumptions: the pattern is copied character for character from the
    # sibling contracts rather than re-derived, because seven documents
    # describing one shared filter must describe it identically; a
    # cross-contract gate compares them.
    # Trade-offs: a canonical form is described but not mandated by the
    # pattern, so a caller may propagate an identity minted elsewhere as long
    # as it fits. The cost is that two callers may use different spellings;
    # what it buys is that a caller already carrying a conforming identity
    # from an upstream system need not mint a second one, which would break
    # the correlation this value exists to preserve.
    CorrelationId:
      type: string
      maxLength: 24
      pattern: '^$|^(?!(?:[._-]*[0-9]){9,}[._-]*$)[A-Za-z0-9_.-]{1,24}$'
      description: >-
        Identity of one unit of work. At most twenty-four characters drawn from
        the ASCII letters, the digits, the hyphen, the underscore and the full
        stop. A value the service mints is exactly the two-character prefix CD
        followed by twenty-two upper-case hexadecimal characters over eleven
        bytes of entropy; a value a caller supplies need only fit the bound and
        the set. The empty string appears only inside an error body, and only for
        a failure raised before any identity had been established. The pattern additionally refuses one narrow class the character set alone
        admits: a value made up only of digits and the three separators, carrying nine
        or more digits. That is the shape of every protected identifier this system
        holds, in contiguous form and in every separated form -- a customer identifier
        and a national identifier are nine digits, an account identifier eleven, a
        card number sixteen -- and the shared correlation filter refuses it because
        this identity is echoed on the response and written to every log line for the
        request, so accepting one would copy a protected identifier into both.
        Ordinary values are unaffected: a date-like 2022-07-18 carries eight digits
        and is accepted, and any value containing a letter is accepted whatever its
        digits. It must never carry a
        credential, because it is written to logs by design.

    # -----------------------------------------------------------------------
    # Report submission
    # -----------------------------------------------------------------------

    # Assumptions: thirteen is arithmetic rather than preference.
    # app/bms/CORPT00.bms declares 42 field definitions and only 17 carry a
    # name; the other 25 are captions, separators and the function-key
    # legend, which address no storage and have nothing for a request to
    # carry. Six of the 17 are the two three-part range composites, each
    # consolidated here into one value, so the count is 17 minus 6 plus 2.
    # This is the component list of com.carddemo.reporting.dto.ReportRequest
    # name for name, and every width below is the declared symbolic-map
    # width at app/cpy-bms/CORPT00.CPY, so the 3270 field-length contract
    # survives as a bean-validated bound.
    ReportRequest:
      type: object
      additionalProperties: false
      description: >-
        Selects a transaction report by type and, for a caller-supplied run, by
        an inclusive range. At least one of monthly, yearly and custom must be
        marked; marking none is refused with the verbatim message
        app/cbl/CORPT00C.cbl raises at L438. Marking two or three is accepted and
        the FIRST in the order monthly, yearly, custom is the one that runs,
        because the reference's condition chain stops at its first matching arm.
        No property is declared required,
        because none of the thirteen is unconditionally present -- which must be
        supplied depends on the type selected, and that is a rule the service
        applies rather than one a schema can state. A request that breaks it is
        answered 400 with a fieldErrors entry naming the offending property.
      properties:
        transactionName:
          type: string
          maxLength: 4
          description: >-
            The four-character transaction identifier the screen displays, at
            the X(4) width of TRNNAMEI at app/cpy-bms/CORPT00.CPY L24.
        title01:
          type: string
          maxLength: 40
          description: >-
            First title line, at the X(40) width of TITLE01I at
            app/cpy-bms/CORPT00.CPY L30, taken from the shared title constants.
        currentDate:
          type: string
          maxLength: 8
          description: >-
            The date stamp the screen renders, at the X(8) width of CURDATEI at
            app/cpy-bms/CORPT00.CPY L36. Echoed unchanged and never parsed.
        programName:
          type: string
          maxLength: 8
          description: >-
            The program name the screen displays, at the X(8) width of PGMNAMEI
            at app/cpy-bms/CORPT00.CPY L42.
        title02:
          type: string
          maxLength: 40
          description: >-
            Second title line, at the X(40) width of TITLE02I at
            app/cpy-bms/CORPT00.CPY L48.
        currentTime:
          type: string
          maxLength: 8
          description: >-
            The time stamp the screen renders, at the X(8) width of CURTIMEI at
            app/cpy-bms/CORPT00.CPY L54. Echoed unchanged and never parsed.
        monthly:
          type: string
          pattern: '[^\x00 ]'
          maxLength: 1
          description: >-
            Marked to select the current-month report, at the X(1) width of
            MONTHLYI at app/cpy-bms/CORPT00.CPY L60. Any character that is
            neither a space nor a null counts as a mark, which is the test the
            baseline applies. The resolved range is the FULL CALENDAR MONTH, the
            first through the last day of the current month. This is the FIRST
            arm of the reference's chain, at app/cbl/CORPT00C.cbl L213, so a
            request marking this and another type runs this one.
        yearly:
          type: string
          pattern: '[^\x00 ]'
          maxLength: 1
          description: >-
            Marked to select the current-year report, at the X(1) width of
            YEARLYI at app/cpy-bms/CORPT00.CPY L66. The resolved range is the
            first of January through the thirty-first of December. This is the
            SECOND arm of the reference's chain, at app/cbl/CORPT00C.cbl L239, so
            it runs only when monthly is unmarked.
        custom:
          type: string
          pattern: '[^\x00 ]'
          maxLength: 1
          description: >-
            Marked to select a caller-supplied range, at the X(1) width of
            CUSTOMI at app/cpy-bms/CORPT00.CPY L72. This is the only type for
            which startDate and endDate are read, and the only one whose
            submission is guarded on the validation flag, at
            app/cbl/CORPT00C.cbl L434 to L436. This is the LAST arm of the
            reference's chain, at L256, so it runs only when neither monthly nor
            yearly is marked.
        startDate:
          allOf:
            - $ref: '#/components/schemas/IsoDate'
          description: >-
            Inclusive lower bound, read only when custom is marked. It replaces
            the three screen components SDTMMI, SDTDDI and SDTYYYY at
            app/cpy-bms/CORPT00.CPY L78, L84 and L90, whose six per-component
            messages remain individually reachable as fieldErrors entries.
        endDate:
          allOf:
            - $ref: '#/components/schemas/IsoDate'
          description: >-
            Inclusive upper bound, read only when custom is marked. It replaces
            EDTMMI, EDTDDI and EDTYYYY at app/cpy-bms/CORPT00.CPY L96, L102 and
            L108.
        confirm:
          type: string
          pattern: '[YyNn]'
          maxLength: 1
          description: >-
            The confirmation answer, at the X(1) width of CONFIRMI at
            app/cpy-bms/CORPT00.CPY L114. Omitted or blank re-prompts at 200;
            'Y' or 'y' starts the execution at 201; 'N' or 'n' is a deliberate
            cancellation answered 200 with no message; any other value is a
            validation failure answered 400. The flag is a four-state machine in
            the baseline and is not silently dropped here.
        errorMessage:
          type: string
          maxLength: 78
          description: >-
            The screen's own message line, at the X(78) width of ERRMSGI at
            app/cpy-bms/CORPT00.CPY L120. Present because the symbolic map
            declares it, and IGNORED on input -- a value a caller places here
            has no effect on the outcome.

    # Assumptions: one shape serves both outcomes and the execution handle
    # is what varies, rather than two sibling shapes chosen by status. This
    # is the component list of
    # com.carddemo.reporting.dto.ReportSubmissionOutcome name for name, and
    # the handler returns it for the cancellation and for the started run
    # alike, so a client may read either the status or the submitted member
    # and reach the same conclusion. Publishing two shapes would let those
    # two readings disagree.
    ReportSubmissionOutcome:
      type: object
      additionalProperties: false
      # Assumptions: message and submission are REQUIRED here and nullable in
      # their own blocks, which is a different statement from optional. The
      # handler returns a record whose three components are all serialised, so
      # both members are always PRESENT on the wire and null is how each reports
      # that it carries nothing. Declaring them optional would promise a caller a
      # body in which either key could be absent, which this service cannot
      # emit -- the drift the nullable-and-required members of
      # AccountViewResponse and of every keyset page in this repository are
      # declared to avoid.
      required:
        - outcome
        - message
        - submission
      description: >-
        The outcome of one submission request, discriminating THREE turns: a
        started run, a deliberate cancellation, and a confirmation not yet
        answered. Neither of the latter two is an error and neither carries a
        problem document, so both are answered 200. The baseline branch for a
        cancellation at app/cbl/CORPT00C.cbl L480 to L483 performs
        INITIALIZE-ALL-FIELDS, raises the error flag and re-sends the screen with
        no message at all, so at flag level a cancel is indistinguishable from a
        validation failure and the screen redisplays cleared with no feedback
        about which occurred; the unanswered turn at L464 to L474 composes a
        question instead. Separating all three across a status and this member
        preserves the suppression the flag existed for while giving the caller
        the feedback a single flag could not carry.


        Assumptions: all THREE turns are named here and not two, because the
        outcome member below enumerates three and this is the level a reader
        meets first. A reader who stopped at a two-turn description would read
        the unanswered turn as a cancellation and report "you cancelled" to a
        caller that had merely left the confirmation blank.
      properties:
        outcome:
          type: string
          enum:
            - STARTED
            - DECLINED
            - UNANSWERED
          description: >-
            WHICH OF THE THREE TURNS this was. STARTED means a run was accepted,
            and only that value accompanies 201. DECLINED means the caller
            answered no, and UNANSWERED means the confirmation has not been
            answered yet; both accompany 200, and both start nothing.


            Refactoring Rationale: this member is an enumeration and not a
            boolean, because the baseline distinguishes THREE outcomes -- at L478,
            L480 and L464 of app/cbl/CORPT00C.cbl -- where a boolean carries two.
            Under a boolean an unanswered confirmation reads exactly like a
            decline, and the two are separable only by whether message happens to
            be null. The unanswered turn is answered 200 carrying the baseline's
            own prompt rather than 400 with a problem document, because the
            baseline treats an unanswered confirmation as a question being asked
            rather than a mistake being reported.


            Assumptions: the discriminator is a member and not only a status.
            The status separates a started run from a turn that started nothing;
            what it cannot do is separate the two turns that share 200, and
            inferring that from the presence of another member is exactly the
            inference that produced a caller being told it had cancelled when it
            had merely not answered.
        message:
          type:
            - string
            - 'null'
          maxLength: 78
          description: >-
            A sentence for a person to read, at the X(78) width of the report
            map's own message field at app/cpy-bms/CORPT00.CPY L120 rather than
            the 75 of the shared error carrier. On a started run it is the report
            name followed by ' report submitted for printing ...' -- the
            baseline composes it at app/cbl/CORPT00C.cbl L447 to L454 and moves
            the GREEN attribute into the message colour, whereas the error path
            uses red. Null on a deliberate cancellation, where the baseline
            writes nothing into the message at L480 to L483 and the turn's
            opening MOVE SPACES at L169 has already blanked the field the screen
            is sent from at L560.
          # Assumptions: this member carries THREE states -- the submitted
          # sentence on a started run, the prompt on an unanswered turn, and null
          # on a decline, where the baseline writes nothing. The unanswered turn
          # is answered 200 with the prompt in this member rather than as a 400
          # problem document, because the baseline composes a question at L464 to
          # L474 rather than reporting a fault. The prompt strings differ from the
          # submitted one by the space before the three dots and are never merged
          # with it.
          examples:
            - 'Monthly report submitted for printing ...'
            - 'Yearly report submitted for printing ...'
            - 'Custom report submitted for printing ...'
        submission:
          oneOf:
            - $ref: '#/components/schemas/ReportSubmissionResponse'
            - type: 'null'
          description: >-
            The accepted run and its execution handle, present only when outcome
            is STARTED and null otherwise. Poll the run with the executionName it
            carries, through the execution-status operation of this contract, and
            collect the produced report from the location that operation reports
            once the run has succeeded.

    ReportSubmissionResponse:
      type: object
      additionalProperties: false
      required:
        - executionName
        - reportName
        - shortName
        - longName
        - startDate
        - endDate
        - submittedAt
      description: >-
        A started execution. The component list of
        com.carddemo.reporting.dto.ReportSubmissionResponse name for name. It
        carries NO monetary value: it describes a run that has been accepted, not
        any figure the run will produce.
      properties:
        # Refactoring Rationale: this handle replaces the baseline's
        # writing of job-control text to the transient data queue defined
        # at app/csd/CARDDEMO.CSD L499 to L505 -- DEFINE TDQUEUE(JOBS) at
        # L499, DESCRIPTION(SUBMIT JOBS FROM CICS) at L500, then
        # TYPE(EXTRA) DATABUFFERS(1) DDNAME(INREADER) ERROROPTION(IGNORE)
        # all on L501, RECORDSIZE(80) on L502 and DISPOSITION(MOD) on L503.
        # The property that decides the replacement is precise and is easy
        # to state too broadly: ERROROPTION(IGNORE) on L501 has CICS ITSELF
        # silently swallow an extrapartition write error, so a submission
        # can fail with nothing raised by the platform. The program is not
        # negligent -- app/cbl/CORPT00C.cbl L526 to L534 does check the
        # response code and has its own failure message at L531, 'Unable to
        # Write TDQ (JOBS)...' -- but a queue whose error option is IGNORE
        # gives a correct caller nothing to check in the cases CICS
        # absorbs, and it returned no identity either, so an operator had
        # to find the job by name. Starting a state machine returns this
        # durable handle and fails loudly instead.
        # Assumptions: this member is the execution NAME and never the
        # orchestration handle in full, because the two halves of the
        # lifecycle have to meet: readReportExecution is addressed by
        # ExecutionNamePath, and a handle in full is the one value that
        # operation does not accept -- sent as a path value its colons and
        # slashes are percent-encoded into a single segment and refused on
        # the published shape. The name is what pairs, and it is what the
        # service composes anyway. Alternatives Considered:
        # publishing both. Rejected because the ARN had no consumer at all
        # and it embeds the account identifier and region of the deployment
        # that ran the report, which no caller of this surface needs; the
        # service derives it from this name whenever it needs one.
        executionName:
          allOf:
            - $ref: '#/components/schemas/ExecutionName'
          description: >-
            The name the accepted run was started under, and the value the
            execution-status operation of this contract is addressed by. Pass it
            back unchanged; treat it as opaque, since the way this service
            composes a name is not part of this contract.
        reportName:
          type: string
          maxLength: 10
          description: >-
            The report type that was started, at the X(10) width of
            WS-REPORT-NAME at app/cbl/CORPT00C.cbl L58. One of the three
            verbatim values the baseline moves into it at L214, L240 and L433.
          enum:
            - Monthly
            - Yearly
            - Custom
        shortName:
          type: string
          maxLength: 38
          description: >-
            The report's short display name, at the X(38) width declared at
            app/cpy/CVTRA07Y.cpy L5 with its verbatim value on L6.
          examples:
            - DALYREPT
        longName:
          type: string
          maxLength: 41
          description: >-
            The report's long display name, at the X(41) width declared at
            app/cpy/CVTRA07Y.cpy L7 with its verbatim value on L8.
          examples:
            - Daily Transaction Report
        startDate:
          allOf:
            - $ref: '#/components/schemas/IsoDate'
          description: >-
            The resolved inclusive lower bound the run will cover, echoed so that
            a caller of a preset type learns the range it was given. For MONTHLY
            this is the first day of the current month.
          examples:
            - '2022-07-01'
        endDate:
          allOf:
            - $ref: '#/components/schemas/IsoDate'
          description: >-
            The resolved inclusive upper bound. For MONTHLY this is the LAST day
            of the current month and for YEARLY the thirty-first of December, so
            for most of either period it is legitimately later than the current
            day.
          examples:
            - '2022-07-31'
        submittedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp26'
          description: >-
            When the run was accepted, as an opaque twenty-six-character stamp
            rather than a parsed date-time, for the reasons recorded on
            Timestamp26.


    # -----------------------------------------------------------------------
    # Report content
    # -----------------------------------------------------------------------

    # Assumptions: three of the eight values are JOIN RESULTS and not columns
    # of the transaction master, which matters to anyone reading the widths
    # against a single copybook and failing to find them. app/cpy/CVTRA05Y.cpy
    # carries NO account identifier at all -- its thirteen fields at L5 to
    # L17 plus a FILLER X(20) at L18 total 350 bytes and none of them is one
    # -- so app/cbl/CBTRN03C.cbl resolves accountId from the cross-reference
    # at L364 and the two descriptions from the reference dimensions at L366
    # and L368. The eight and only eight moves at L363 to L370 are what fixes
    # the count.
    TransactionReportLineResponse:
      type: object
      additionalProperties: false
      required:
        - transactionId
        - accountId
        - typeCode
        - typeDescription
        - categoryCode
        - categoryDescription
        - source
        - amount
      description: >-
        One detail line of the transaction report. The component list of
        com.carddemo.reporting.dto.TransactionReportLineResponse name for name,
        with every width taken from the eight data fields of
        app/cpy/CVTRA07Y.cpy at L16, L18, L20, L22, L24, L26, L28 and L30.
      properties:
        transactionId:
          type: string
          maxLength: 16
          description: >-
            The transaction's identity, a digits-only string of at most sixteen
            characters rather than an integer, for the X-over-9 reason recorded
            in this file's header.
        accountId:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 11
          description: >-
            The owning account, at the X(11) width the baseline uses. A JOIN
            RESULT resolved from the card cross-reference at
            app/cbl/CBTRN03C.cbl L364, because the transaction record carries no
            account identifier. Digits-only, and a string so that the leading
            zeroes a numeric picture stores survive.
        typeCode:
          type: string
          maxLength: 2
          description: >-
            The transaction type, at the X(02) width of TRAN-REPORT-TYPE-CD at
            app/cpy/CVTRA07Y.cpy L20.
        typeDescription:
          type: string
          maxLength: 15
          description: >-
            The type's display text, at the X(15) width of
            TRAN-REPORT-TYPE-DESC at app/cpy/CVTRA07Y.cpy L22. A JOIN RESULT
            resolved at app/cbl/CBTRN03C.cbl L366.
        categoryCode:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 4
          description: >-
            The transaction category, at the 9(04) width of TRAN-REPORT-CAT-CD at
            app/cpy/CVTRA07Y.cpy L24. A DIGITS-ONLY STRING rather than an integer
            specifically because that numeric picture preserves leading zeroes,
            which an integer would discard.
        categoryDescription:
          type: string
          maxLength: 29
          description: >-
            The category's display text, at the X(29) width of
            TRAN-REPORT-CAT-DESC at app/cpy/CVTRA07Y.cpy L26. A JOIN RESULT
            resolved at app/cbl/CBTRN03C.cbl L368.
        source:
          type: string
          maxLength: 10
          description: >-
            Where the transaction originated, at the X(10) width of
            TRAN-REPORT-SOURCE at app/cpy/CVTRA07Y.cpy L28.
        amount:
          allOf:
            - $ref: '#/components/schemas/MonetaryAmount'
          description: >-
            The transaction amount. In print it is rendered by the LEADING-MINUS
            mask at app/cpy/CVTRA07Y.cpy L30, which is deliberately a different
            mask from the leading-plus one the total bands use; on the wire it is
            an unformatted exact decimal string and the caller renders it.

    # Alternatives Considered: a body carrying a total row count so a client
    # could compute how many windows remain. Rejected because the count
    # would have to be read as a second query against a moving population,
    # so it could disagree with the rows beside it; the boundary tokens plus
    # the two availability flags answer the only question a client acts on --
    # whether another window exists -- and hasNext is established by reading
    # ONE ROW MORE than the window holds, which is the same mechanism
    # app/cbl/COCRDLIC.cbl uses for its own next-window indicator.
    TransactionReportLinePage:
      type: object
      additionalProperties: false
      required:
        - items
        - firstKey
        - lastKey
        - hasNext
      description: >-
        One bounded keyset window. FOUR members, which is the component list of
        the shared envelope com.carddemo.common.web.PageResponse name for name:
        the rows, the two sealed boundaries, and the further-page flag the
        reference PF8 key binds to. The PF7 key binds to the LEADING boundary
        instead, because whether a page precedes this one is answered by the page
        ordinal the reference keeps on the terminal and not by any member of this
        window. Nothing here is addressed by a counted row position.
      properties:
        # Assumptions: the upper bound is declared on the ARRAY and not left as
        # prose above it, and it is the value ReportController.PAGE_SIZE
        # carries -- the report's own page length, which that constant takes from
        # TransactionReportService.LINE_COUNTER_MODULUS so one window of this
        # operation holds exactly one printed page of the 133-column report.
        # A page carrying one row more would be a defect in this service, which
        # is worth failing a contract check rather than reaching a client that
        # had sized its rendering for the published bound. No lower bound is
        # declared: an empty page is legitimate for an exhausted set and for a
        # filter that removed every row it read.
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/TransactionReportLineResponse'
          description: >-
            The detail lines of this window, in ascending key order. Empty when
            the range selects nothing, in which case both boundaries are null.
        firstKey:
          oneOf:
            - $ref: '#/components/schemas/CursorToken'
            - type: 'null'
          description: >-
            The sealed position of the FIRST returned row, and the cursor a
            backward request is issued from. Null on an empty window.
        lastKey:
          oneOf:
            - $ref: '#/components/schemas/CursorToken'
            - type: 'null'
          description: >-
            The sealed position of the LAST RETURNED row -- not of the lookahead
            row read to establish hasNext -- and the cursor a forward request is
            issued from. Null on an empty window.
        hasNext:
          type: boolean
          description: >-
            Whether a forward request would yield rows. Established by reading one
            row more than the window holds rather than from any total, and bound
            by a client to the control that the reference PF8 key drove.

    # Trade-offs: the verbatim label is carried on the wire even though the
    # band member already determines it, so the body is deliberately
    # redundant. The cost is one derivable field per band; what it buys is
    # that a consumer renders a band line without holding its own copy of
    # the mapping, which is the copy that would drift from
    # app/cpy/CVTRA07Y.cpy L51, L57 and L63 the moment a label changed
    # there. The enumeration below is what stops the redundancy becoming a
    # second source of truth: a label disagreeing with its band is
    # unrepresentable rather than merely discouraged.
    ReportTotalsResponse:
      type: object
      additionalProperties: false
      required:
        - band
        - label
        - amount
      description: >-
        One subtotal band. The component list of
        com.carddemo.reporting.dto.ReportTotalsResponse name for name.
      properties:
        band:
          type: string
          enum:
            - PAGE
            - ACCOUNT
            - GRAND
          description: >-
            Which subtotal this is. PAGE closes a printed page, whose boundary
            app/cbl/CBTRN03C.cbl L282 takes when the line counter modulo
            WS-PAGE-SIZE is zero -- that size is 20 at its L131 and L132, but the
            number of DETAIL rows a page holds is DERIVED and smaller, because
            heading and band lines consume counter increments too, four at L327,
            L331, L335 and L339, two at L299 and L302, two at L311 and L314 and
            one per detail at L373, which yields sixteen detail rows on the first
            page and fewer thereafter. This printed page-break concept is a
            different thing from the window envelope above and the two are never
            conflated. ACCOUNT closes a run of one CARD NUMBER despite its label.
            GRAND closes the report and sums the PAGE bands rather than the
            ACCOUNT ones, per L297.
        label:
          type: string
          enum:
            - Page Total
            - Account Total
            - Grand Total
          maxLength: 13
          description: >-
            The verbatim label its reference group declares, at
            app/cpy/CVTRA07Y.cpy L51 and L52 for X(11) 'Page Total', L57 and L58
            for X(13) 'Account Total', and L63 and L64 for X(11) 'Grand Total'.
            The declared width of 13 is the widest of the three.
        amount:
          allOf:
            - $ref: '#/components/schemas/MonetaryAmount'
          description: >-
            The band's accumulated amount, held as PIC S9(09)V99 at
            app/cbl/CBTRN03C.cbl L134, L135 and L136. In print it is rendered by
            the LEADING-PLUS mask at app/cpy/CVTRA07Y.cpy L54, L60 and L66, which
            is not the detail line's mask.

    TransactionReportTotals:
      type: object
      additionalProperties: false
      required:
        - bands
      description: >-
        The subtotal bands of one report range. The component list of
        com.carddemo.reporting.dto.TransactionReportTotals, whose single member
        keeps the bands addressable as a named member rather than as a bare
        array, so a later member can be added without changing the body's type.
      properties:
        bands:
          type: array
          items:
            $ref: '#/components/schemas/ReportTotalsResponse'
          description: >-
            The bands in the order the report emits them. This operation is
            separate from the detail window deliberately: pairing one window of
            lines with the totals of a whole range would report a grand total
            that did not match the lines beside it.

    # -----------------------------------------------------------------------
    # Statements
    # -----------------------------------------------------------------------

    # Assumptions: there is no date range here and none is missing.
    # app/jcl/CREASTMT.JCL declares no date-parameter data definition at
    # all, unlike app/jcl/TRANREPT.jcl which injects both bounds at its L43
    # and L44; the statement generator instead breaks on the card, holding
    # it in WS-SAVE-CARD PIC X(16) at app/cbl/CBSTM03A.CBL L69. There is
    # likewise no output-format selector, because both renderings are always
    # produced.
    # Trade-offs: each component is bounded on BOTH sides at its declared
    # width rather than given a ceiling alone. TRNX-CARD-NUM is PIC X(16) at
    # app/cpy/COSTM01.CPY L22 and the account identifier is PIC 9(11), and a
    # numeric picture is zero-filled on the left, so a shorter value cannot
    # match a stored row under any circumstances. The cost is that a caller
    # must left-pad; the gain is that a malformed request is refused as
    # malformed instead of being answered as an absent record.
    StatementRequest:
      type: object
      additionalProperties: false
      description: >-
        Names one card or one account. Exactly one of the two must be supplied;
        neither is declared required because either may be the omitted one, and
        the exactly-one-of rule is applied by the service rather than expressible
        here -- a request supplying both, or neither, is answered 400 with a
        fieldErrors entry naming the component at fault. The component list of
        com.carddemo.reporting.dto.StatementRequest name for name.
      properties:
        cardNumber:
          type: string
          pattern: '^[0-9]+$'
          minLength: 16
          maxLength: 16
          description: >-
            The card's unmasked number in all sixteen positions, digits only.
            This is the ONLY place in this contract an unmasked number appears,
            and it appears in a request body rather than in a target so that
            neither an intermediary's access log nor the browser's history
            records it. Every response masks it to the last four digits.
        accountId:
          type: string
          pattern: '^[0-9]+$'
          minLength: 11
          maxLength: 11
          description: >-
            The account identifier in all eleven positions, digits only, with the
            leading zeroes the record holds. Supplied instead of a card number
            when the caller selects by account.

    StatementResponse:
      type: object
      additionalProperties: false
      required:
        - cardNumber
        - accountId
        - customerName
        - totalAmount
        - transactionCount
        - plainTextUri
        - htmlUri
        - generatedAt
        - firstRecord
        - recordCount
      description: >-
        The summary of one statement and, where the store holds them, the
        locations the two renderings are collected from. The component list of
        com.carddemo.reporting.dto.StatementResponse name for name, with widths
        from the statement layout block at app/cbl/CBSTM03A.CBL L85 to L146.


        FIVE MEMBERS ARE NULLABLE AND THEY MOVE TOGETHER. Each location is
        present exactly when that artifact is stored, the instant is present
        exactly when at least one of them is, and the two artifact positions are
        present exactly when the run's index names this card -- so a response
        describes a statement that has been rendered or one that has not, and
        never claims both.


        It is a METADATA ENVELOPE POINTING AT THE ARTIFACTS rather than a
        reproduction of them, and the difference is worth stating plainly: the
        plain-text rendering also carries a current balance at
        app/cbl/CBSTM03A.CBL L113 and a credit score at its L118 that this JSON
        summary deliberately does not surface. A caller needing either reads the
        artifact.
      properties:
        cardNumber:
          allOf:
            - $ref: '#/components/schemas/MaskedCardNumber'
          description: >-
            The card the statement covers, MASKED TO ITS LAST FOUR DIGITS. The
            unmasked value is accepted on the request and never returned.
        accountId:
          type: string
          maxLength: 20
          description: >-
            The account identifier as the statement LAYOUT carries it, at the
            X(20) width of ST-ACCT-ID at app/cbl/CBSTM03A.CBL L109. That is wider
            than the eleven digits the request accepts, and the response reports
            the layout's width rather than the request's so that a value the
            layout can hold is never truncated on the way out.
        customerName:
          type: string
          maxLength: 75
          description: >-
            The customer name as the statement layout composes it, at the X(75)
            width of ST-NAME at app/cbl/CBSTM03A.CBL L91. Free text at a bounded
            width: the reference constrains the width and not the alphabet.
        totalAmount:
          allOf:
            - $ref: '#/components/schemas/MonetaryAmount'
          description: >-
            The assembled statement total. In the plain-text artifact it is
            rendered by ST-TOTAL-TRAMT PIC Z(9).99- at app/cbl/CBSTM03A.CBL
            L142 -- a TRAILING-SIGN, non-comma-grouped mask that is deliberately
            a different family from both report masks, and one of two statement
            masks: the Z form at L137 and L142 suppresses leading zeroes while
            the 9 form at L113 shows them.
        transactionCount:
          type: integer
          format: int32
          minimum: 0
          description: >-
            How many transactions the statement covers. An exact count of rows
            rather than a monetary value, which is why it is an integer here
            while every amount is a string. No maximum is declared, because this
            is a count of what EXISTS rather than of what is returned: the
            service carries no arity standing in for the reference's three table
            limits. The row ceiling that does exist bounds the transaction
            ARRAY of the sibling operation, where it is declared as maxItems.
        plainTextUri:
          oneOf:
            - $ref: '#/components/schemas/ArtifactLocation'
            - type: 'null'
          description: >-
            WHERE TO COLLECT the 80-byte plain-text rendering -- the width fixed
            by FD-STMTFILE-REC PIC X(80) at app/cbl/CBSTM03A.CBL L45 and by
            app/jcl/CREASTMT.JCL L89. Returned by reference rather than inline
            because that rendering is the byte-for-byte parity artifact compared
            against the golden masters, and inlining it would require an encoding
            step that no longer preserves those bytes.


            The value is a PATH THIS DEPLOYMENT SERVES, always beneath
            /api/v1/reports/statements/artifacts/, ending in an opaque selector.
            Follow it with the collect-artifact operation of this contract and the
            same bearer token. It is null exactly when no such artifact is stored,
            which is the state before the statement run of the current period has
            produced one.


            Assumptions: this member carries a FOLLOWABLE location on this
            contract, or null when there is nothing to follow. An s3:// location
            naming the dataset bucket would be unopenable by any caller of this
            contract -- the bucket policy admits only the VPC endpoint -- and a
            per-card object location would name something no writer produces,
            because the run publishes two artifacts for the whole run rather than
            one pair per card. It is NULLABLE rather than required, so a caller can
            tell a rendered statement from an unrendered one, and it is null rather
            than omitted because the member is written on every response, leaving a
            caller one state to read instead of two.
          examples:
            - /api/v1/reports/statements/artifacts/0oL2fQ8xVn4tKpR7wZbY1s
        htmlUri:
          oneOf:
            - $ref: '#/components/schemas/ArtifactLocation'
            - type: 'null'
          description: >-
            WHERE TO COLLECT the 100-byte markup rendering -- the width fixed by
            FD-HTMLFILE-REC PIC X(100) at app/cbl/CBSTM03A.CBL L47 and by
            app/jcl/CREASTMT.JCL L94. Every variable cell in it is contextually
            escaped, so a merchant name or description carrying markup is
            rendered as text rather than interpreted.


            A path of the same shape as the plain-text location, null on the same
            terms, and described independently of it: a run interrupted between
            its two writes leaves one artifact stored, and this contract reports
            the one that exists rather than both or neither. The collect operation
            returns it as a binary attachment and never as text/html, for the
            reason recorded there.
          examples:
            - /api/v1/reports/statements/artifacts/9tB4mE7kXw2pQzA5nR8vLj
        generatedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp26'
            - type: 'null'
          description: >-
            WHEN THE STORED ARTIFACT WAS WRITTEN, as an opaque
            twenty-six-character stamp taken from the object store's own record of
            the completed object. A rerun REPLACES both artifacts rather than
            appending to them -- the delete step at app/jcl/CREASTMT.JCL L66
            removes both before the generator step recreates them -- so this value
            moves with each run while the two locations stay stable.


            It is null exactly when no artifact is stored, and where both are
            stored it is the plain-text artifact's instant, that being the one the
            reference job writes first at app/jcl/CREASTMT.JCL L87.


            Assumptions: this field is NULLABLE rather than carrying a fixed
            placeholder. Twenty-six blanks would avoid inventing a clock reading
            and would still publish a placeholder in a field this contract calls an
            instant, so a caller reading it would learn nothing and could not tell
            that it had learned nothing. Null says the absence outright.
        firstRecord:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: >-
            WHERE THIS CARD'S STATEMENT BEGINS inside the plain-text artifact, as
            a zero-based RECORD ORDINAL. The artifact covers the whole run rather
            than this card alone -- app/jcl/CREASTMT.JCL L79 runs one generator
            step over every cross-reference row, writing one plain-text data set
            at L87 and one markup data set at L92 -- so this pair is what makes
            the artifact usable from a per-card response: seek to this record and
            read recordCount records.


            It is an ordinal and not a byte offset because the records are fixed
            width, FD-STMTFILE-REC PIC X(80) at app/cbl/CBSTM03A.CBL L45, so an
            ordinal locates a statement exactly while a byte offset would also
            encode how the artifact is framed in transport -- a framing detail
            this contract deliberately does not publish.


            Null when no plain-text artifact is stored, and null when the run's
            index does not name this card, which is the state for a card added
            after the last statement run.
          examples:
            - 240
        recordCount:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: >-
            HOW MANY CONSECUTIVE RECORDS this card's statement occupies from
            firstRecord. Null on exactly the same terms as firstRecord: the two
            locate one statement together and neither is usable alone, so a
            response carries both or neither.


            It is not the transaction count. A statement carries heading,
            transaction and trailer records, so this figure exceeds
            transactionCount by the fixed banding the layout at
            app/cbl/CBSTM03A.CBL L85 to L146 declares.
          examples:
            - 27

    # Assumptions: thirteen properties, matching the THIRTEEN ELEMENTARY
    # NAMED FIELDS of the 350-byte TRNX-RECORD at app/cpy/COSTM01.CPY L20 to
    # L36 -- two inside the group TRNX-KEY at L21 and eleven inside the group
    # TRNX-REST at L24 -- with the FILLER X(20) at L36 dropped as padding. A
    # count of fourteen would be counting one of those two GROUP items as a
    # field; thirteen is the figure that closes against the record and
    # against the data-transfer type alike.
    StatementTransactionResponse:
      type: object
      additionalProperties: false
      required:
        - cardNumber
        - transactionId
        - typeCode
        - categoryCode
        - source
        - description
        - amount
        - merchantId
        - merchantName
        - merchantCity
        - merchantZip
        - originTimestamp
        - processingTimestamp
      description: >-
        One posted transaction as a statement carries it. The component list of
        com.carddemo.reporting.dto.StatementTransactionResponse name for name,
        with every width taken from app/cpy/COSTM01.CPY.


        Only three of these thirteen reach the plain-text rendering, which is why
        this operation exists at all: app/cbl/CBSTM03A.CBL L133 prints the
        identifier, L135 prints ST-TRANDT X(49) -- the X(100) description
        TRUNCATED TO 49 -- and L137 the amount, with that line summing to exactly
        80 bytes. A caller needing the untruncated description or any merchant
        field reads it here rather than from the artifact.
      properties:
        cardNumber:
          allOf:
            - $ref: '#/components/schemas/MaskedCardNumber'
          description: >-
            The card the transaction belongs to, MASKED TO ITS LAST FOUR DIGITS.
            It is also the leading component of the row order, ahead of the
            identifier.
        transactionId:
          type: string
          maxLength: 16
          description: >-
            The transaction's identity, at the X(16) width of TRNX-ID at
            app/cpy/COSTM01.CPY L23. The second and final component of the row
            order.
        typeCode:
          type: string
          maxLength: 2
          description: >-
            The transaction type, at the X(02) width of TRNX-TYPE-CD at
            app/cpy/COSTM01.CPY L25.
        categoryCode:
          type: string
          maxLength: 4
          description: >-
            The transaction category, at the 9(04) width of TRNX-CAT-CD at
            app/cpy/COSTM01.CPY L26. A string rather than an integer so that
            leading zeroes survive.
        source:
          type: string
          maxLength: 10
          description: >-
            Where the transaction originated, at the X(10) width of TRNX-SOURCE
            at app/cpy/COSTM01.CPY L27.
        description:
          type: string
          maxLength: 100
          description: >-
            The transaction narrative at its FULL X(100) width, declared by
            TRNX-DESC at app/cpy/COSTM01.CPY L28. The plain-text artifact
            truncates it to 49 characters; this member does not.
        amount:
          allOf:
            - $ref: '#/components/schemas/MonetaryAmount'
          description: >-
            The transaction amount, held as PIC S9(09)V99 by TRNX-AMT at
            app/cpy/COSTM01.CPY L29 -- zoned decimal with sign overpunch rather
            than packed. Rendered in the artifact by ST-TRANAMT PIC Z(9).99- at
            app/cbl/CBSTM03A.CBL L137.
        merchantId:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 9
          description: >-
            The merchant's identity, at the 9(09) width of TRNX-MERCHANT-ID at
            app/cpy/COSTM01.CPY L30. Digits-only and a string, so leading zeroes
            survive.
        merchantName:
          type: string
          maxLength: 50
          description: >-
            The merchant's name, at the X(50) width of TRNX-MERCHANT-NAME at
            app/cpy/COSTM01.CPY L31. Free text at a bounded width.
        merchantCity:
          type: string
          maxLength: 50
          description: >-
            The merchant's city, at the X(50) width of TRNX-MERCHANT-CITY at
            app/cpy/COSTM01.CPY L32.
        merchantZip:
          type: string
          maxLength: 10
          description: >-
            The merchant's postal code, at the X(10) width of TRNX-MERCHANT-ZIP
            at app/cpy/COSTM01.CPY L33. A string rather than a number because the
            reference constrains a width and admits non-digit forms.
        originTimestamp:
          allOf:
            - $ref: '#/components/schemas/Timestamp26'
          description: >-
            When the transaction originated, at the X(26) width of TRNX-ORIG-TS
            at app/cpy/COSTM01.CPY L34. Opaque text: the reformatting step copies
            this stamp whole, but see processingTimestamp for the one it does not.
        processingTimestamp:
          allOf:
            - $ref: '#/components/schemas/StatementProcessingTimestamp26'
          description: >-
            When the transaction was posted, at the X(26) width of TRNX-PROC-TS
            at app/cpy/COSTM01.CPY L35. This is the ONE member the reformatting
            step at app/jcl/CREASTMT.JCL L54 leaves short -- its final segment
            copies 50 bytes from one-based 279, which spans the origin stamp whole
            and only 24 of this one's 26 characters, so the final two positions
            arrive blank. That is why it names its own scalar rather than
            Timestamp26: the field is still twenty-six characters wide and the
            mapper enforces that width, but the two trailing blanks are content
            the strict form does not describe and must not be rejected.

    StatementTransactionCollection:
      type: object
      additionalProperties: false
      required:
        - items
        - transactionCount
        - truncated
      description: >-
        The transactions one statement was rendered from, with the count the
        statement covers beside them. The component list of
        com.carddemo.reporting.dto.StatementTransactionCollection. Not a page:
        the set is delimited by the statement's own period, so no boundary token
        is published and no counted row position is accepted anywhere. It IS a
        bounded window all the same, at the row ceiling maxItems declares below,
        and the two count members are how a caller tells a bounded body from a
        whole one.


        Assumptions: this body IS a bounded window, and it carries a count
        alongside the rows for that reason. The service bounds the composed window
        at 1000 rows -- registered as divergence D-STMT-RESPONSE-BOUNDED in
        docs/architecture/cobol-to-service-traceability.md -- and truncation stays
        measurable only where a caller can compare what it received against the
        card's true count. The statement operation supplies that count in its
        heading; this operation returns this object and nothing else, so the count
        belongs here, or the array is silently shortened with nothing to compare it
        against.
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/StatementTransactionResponse'
          description: >-
            The transactions, ordered by CARD NUMBER FIRST and then by
            transaction identifier, which is the thirty-two-byte reference key
            order at app/cpy/COSTM01.CPY L22 and L23 and the sort order at
            app/jcl/CREASTMT.JCL L53. Empty when the selected card or account has
            no posted transactions.


            Assumptions: maxItems is DECLARED here, because three paragraphs of
            this document say the ceiling is declared on this array -- the
            operation description above, the transactionCount member of the sibling
            schema and the paragraph below this one. Left undeclared, a generated
            client would bound nothing while the service bounded at 1000, and a
            reader auditing the ceiling would find only claims that it existed. The
            value is
            com.carddemo.reporting.service.StatementService.MAX_RESPONSE_TRANSACTIONS
            and ReportingApiContractTest reads the two against each other, so the
            number here cannot drift from the number enforced.


            The ceiling is
            com.carddemo.reporting.service.StatementService.MAX_RESPONSE_TRANSACTIONS,
            which bounds this RESPONSE and not the rendered artifact -- that is
            unbounded in the same sense the reference is, which is divergence
            D-2. A statement whose card carries more than the ceiling is returned
            short, with truncated true and transactionCount reporting the whole.
        transactionCount:
          type: integer
          format: int32
          minimum: 0
          description: >-
            How many transactions the statement covers in total, from a database
            aggregate over the whole card rather than from the length of the
            array above. It equals that length on every statement short of the
            ceiling and exceeds it on exactly the statements where the difference
            matters, which is why the array's own length is not published in its
            place.
        truncated:
          type: boolean
          description: >-
            Whether the array is short of transactionCount. Derived by the
            service from the two counts and never accepted from a caller, so the
            three members cannot disagree. False on every statement whose card
            carries no more transactions than the ceiling.


    # -----------------------------------------------------------------------
    # Shared problem shape
    # -----------------------------------------------------------------------

    # Assumptions: this is the shape
    # services/common-lib/src/main/java/com/carddemo/common/error/ApiError.java
    # renders, restated here because an OpenAPI document cannot reference a
    # schema in another file that no build step assembles. It is declared
    # identically in every sibling contract for the same reason, so a
    # divergence between any two of them is a defect in whichever diverged
    # rather than a local choice.
    # Assumptions: the date-edit diagnostic is a STRUCTURED TRIPLE and not a
    # boolean, and it is representable here without a schema of its own.
    # app/cbl/CORPT00C.cbl declares CSUTLDTC-PARM at L129 with an 80-byte
    # result -- severity X(04) at L133, a FILLER X(11) at L134, a message
    # number X(04) at L135 and a message X(61) at L136 -- and the caller's
    # tolerance depends on all three: L396 and L416 continue on a severity of
    # '0000', while L399 and L419 TOLERATE a non-zero severity when the
    # message number IS '2513'. The severity travels in code, the message
    # number in secondaryCode and the text in message, so that branch stays
    # expressible; collapsing the triple to a pass-or-fail flag would make it
    # unrepresentable.
    ApiError:
      type: object
      additionalProperties: false
      # Refactoring Rationale: `message` and `abend` are REQUIRED and NULLABLE, which is a
      # different statement from optional and is the one this shape has to make. Both are record
      # components of ApiError in
      # services/common-lib/src/main/java/com/carddemo/common/error/ApiError.java, and a record
      # component is always written, so the key is present with a null value on every response --
      # `ApiErrorWireShapeTest` asserts exactly that, emitting `"message":null` and `"abend":null`.
      # Omitting them from this list would tell a generated client the keys might be missing and
      # leave it unable to distinguish "not supplied" from "nothing to report", and a strict
      # validator reading `additionalProperties: false` alongside the omission would have no member
      # to bind the emitted keys to at all.
      # Alternatives Considered: suppressing the two keys when null, with an inclusion setting, so
      # the omission became true. Rejected because the aggregate sentence is the reference's own
      # 75-character message field and a client renders the band from it unconditionally, so a
      # key that comes and goes moves that decision into every client; and because
      # always-inclusion is PINNED for every service in
      # services/common-lib/src/main/resources/carddemo-common-defaults.yml, which the
      # money contract SEPARATELY depends on -- a money member with no value must be
      # present and null rather than absent, because absent reads as "no balance" where
      # null reads as "no amount applies". That is a second consumer of the same pin and
      # NOT the reason these two keys are required here: the reason is the record shape
      # above, and this schema carries no monetary member at all. The two are kept apart
      # so that a problem document's nullability is not read as following from a money
      # rule.
      # Assumptions: the always-inclusion setting this promise rests on is declared ONCE,
      # in the shared defaults every service imports, rather than per service. A promise
      # published by seven contracts and settled in seven places is one a reader cannot
      # verify; settled in one it is verifiable by reading one file.
      required:
        - code
        - secondaryCode
        - message
        - severity
        - subsystem
        - status
        - correlationId
        - path
        - timestamp
        - fieldErrors
        - abend
      description: >-
        One problem document, rendered by the shared advice class for every
        refusal this contract declares.
      properties:
        code:
          type: string
          maxLength: 13
          description: >-
            The stable machine-readable identifier for the failure, matched on by
            clients rather than parsed out of the message. For a date-edit
            refusal it carries the four-character severity the reference date
            routine returns.
          # Assumptions: the bound is 22 and is derived from the widest value the shared writer
          # can emit, measured on CARD-LOCK-NOT-ACQUIRED and CARD-WRITE-NOT-APPLIED in
          # services/card-service/src/main/java/com/carddemo/card/api/CardController.java. It is
          # deliberately NOT the 13 of `code` above -- `CARDDEMO-` and four digits -- because this
          # member carries a subordinate condition name drawn from a different vocabulary. This
          # service emits only the empty string, so the narrower bound would not be violated here,
          # but one generated client type reads a problem document from any of the seven services,
          # and a bound that differs between them is a type that differs between them.
        secondaryCode:
          type: string
          maxLength: 22
          description: >-
            The subordinate machine-readable identifier qualifying code, and the
            empty string when there is none. For a date-edit refusal it carries
            the four-character message number, which is what makes the reference
            tolerance for '2513' expressible to a client.
        message:
          allOf:
            - $ref: '#/components/schemas/ReturnMessage'
          description: >-
            The human-readable aggregate sentence, carried VERBATIM from the
            originating reference message. Null when no message was set at all,
            which is a distinct state from an empty one. The two aggregate
            refusals of the submission surface are enumerated below: the first is
            composed at app/cbl/CORPT00C.cbl L485 to L489 from the quoted value
            the caller supplied, and the second is the submission failure at its
            L531.
          examples:
            - '"X" is not a valid value to confirm...'
            - 'Unable to Write TDQ (JOBS)...'
        severity:
          allOf:
            - $ref: '#/components/schemas/Severity'
          description: >-
            The operational level of the failure, drawn from the baseline's own
            four-value vocabulary rather than invented for the wire.
        subsystem:
          allOf:
            - $ref: '#/components/schemas/Subsystem'
          description: >-
            Which part of the platform the failure arose in, drawn from the
            baseline's own vocabulary.
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: >-
            The HTTP status this response carries, restated inside the body so
            that a logged or forwarded document remains self-describing once it
            has been separated from its response.
        correlationId:
          allOf:
            - $ref: '#/components/schemas/CorrelationId'
          description: >-
            The identity of the unit of work that failed, inherited from the
            inbound header when one was supplied. This is the value to quote when
            reporting the problem.
        path:
          type: string
          description: >-
            The request path that failed, so a client reporting a problem need not
            reconstruct it. It never carries a primary account number, because no
            operation in this contract puts one in a target.
        timestamp:
          allOf:
            - $ref: '#/components/schemas/Timestamp26'
          description: >-
            The instant of the failure in the baseline-compatible
            twenty-six-character form, opaque for the reasons recorded on
            Timestamp26.
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: >-
            One entry per offending field, empty when the failure was not a
            field-level one. Its FIRST entry is the focus pointer: the field a
            client should move the cursor to, which is what replaces the
            reference idiom of moving a negative value into a screen field's
            length subfield -- done at app/cbl/CORPT00C.cbl L264, L271, L278,
            L285, L292 and L299 for the six date components and at L471 and L493
            for the confirmation.
        abend:
          oneOf:
            - $ref: '#/components/schemas/AbendDetail'
            - type: 'null'
          description: >-
            The structured abend aggregate when the failure was an abend, and null
            otherwise. Its presence is what distinguishes an unrecoverable
            platform failure from an ordinary refusal.

    # Assumptions: BLANK is a SUBSET of error rather than a third peer state,
    # because app/cpy/CSSETATY.cpy L18 to L19 is a SINGLE DISJUNCTIVE test --
    # not-ok OR blank -- so a blank field is an erroring field that
    # additionally earns a marker. The marker and the highlight also go to
    # DIFFERENT targets in the reference: L21 to L22 move the red attribute
    # into the field's COLOUR subfield while L24 to L25 move a literal
    # asterisk into its OUTPUT subfield, so the marker is kept distinct from
    # the state value here rather than folded into it.
    # Assumptions: there is NO re-entry member and none may be added.
    # app/cpy/CSSETATY.cpy L20 gates the highlight on the pseudo-conversational
    # re-entry condition, whose discriminator is CDEMO-PGM-CONTEXT in
    # app/cpy/COCOM01Y.cpy. A stateless service has no such flag, so
    # field-error highlighting is driven PURELY by this response body, which
    # is why this array must express the failure completely on its own.
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - state
        - message
      description: >-
        One failing property. The structured form of the baseline's not-ok and
        blank condition pattern together with the highlight app/cpy/CSSETATY.cpy
        applies, which a browser renders as a field-level validation state with
        help text. The component list of the shared FieldError record name for
        name.
      properties:
        field:
          type: string
          minLength: 1
          description: >-
            The response-field identity a client attaches the help text to,
            spelled as the property name of the request schema. A consolidated
            date bound reports the specific component at fault, so the twelve
            per-component reference messages stay individually addressable even
            though the wire carries one value per bound.
        state:
          allOf:
            - $ref: '#/components/schemas/FieldValidationState'
          description: >-
            Which of the baseline's two failure conditions applies to this field.
        message:
          type: string
          minLength: 1
          maxLength: 75
          description: >-
            The help text for the field, carried VERBATIM from the reference
            message at the seventy-five-character wire width. The six empty-field
            messages are at app/cbl/CORPT00C.cbl L261, L268, L275, L282, L289 and
            L296 -- for example 'Start Date - Month can NOT be empty...' -- and
            the six range messages at L331, L340, L348, L357, L366 and L374, for
            example 'Start Date - Not a valid Month...'. The two assembled-date
            messages are 'Start Date - Not a valid date...' at L400 and
            'End Date - Not a valid date...' at L420. Capitalisation and the
            three trailing full stops are part of the text.


            The complete catalog is enumerated below rather than described,
            because these strings are the contract: the browser client copies
            them into its own message catalog, and a paraphrase would be a
            user-visible behavioural change. Each is three ASCII full stops and
            never a single ellipsis character, and the capitalised NOT is the
            reference's own.
          examples:
            - 'Start Date - Month can NOT be empty...'
            - 'Start Date - Day can NOT be empty...'
            - 'Start Date - Year can NOT be empty...'
            - 'End Date - Month can NOT be empty...'
            - 'End Date - Day can NOT be empty...'
            - 'End Date - Year can NOT be empty...'
            - 'Start Date - Not a valid Month...'
            - 'Start Date - Not a valid Day...'
            - 'Start Date - Not a valid Year...'
            - 'End Date - Not a valid Month...'
            - 'End Date - Not a valid Day...'
            - 'End Date - Not a valid Year...'
            - 'Start Date - Not a valid date...'
            - 'End Date - Not a valid date...'
            - 'Select a report type to print report...'

    FieldValidationState:
      type: string
      enum:
        - NOT_OK
        - BLANK
      description: >-
        Which of the baseline's two failure conditions applies. BLANK additionally
        causes a client to render the literal asterisk marker the reference writes
        into an empty field's output subfield, which is a rendering instruction
        rather than a second state.

    Severity:
      type: string
      enum:
        - LOG
        - INFO
        - WARNING
        - CRITICAL
      description: >-
        The operational level of a failure, drawn from the baseline's own
        four-value vocabulary so that a migrated diagnostic keeps the level it
        had. It is unrelated to the reference test suite's graded job-condition
        rubric, which belongs to that suite alone and never appears on this wire.

    Subsystem:
      type: string
      enum:
        - APPLICATION
        - CICS
        - IMS
        - RELATIONAL
        - QUEUE
        - OBJECT_STORE
      description: >-
        Which part of the platform a failure arose in. The vocabulary is shared
        across every service in this migration and so names origins this context
        cannot itself produce; a reporting refusal will name the application, the
        relational store or the object store.

    # Assumptions: the four widths are read from app/cpy/CSMSG02Y.cpy L21 to
    # L29 -- ABEND-DATA at L21, then ABEND-CODE X(4) at L22, ABEND-CULPRIT
    # X(8) at L24, ABEND-REASON X(50) at L26 and ABEND-MSG X(72) at L28,
    # totalling 134 bytes with each initialised to spaces. The anchors matter
    # because that copybook is only 35 lines long: a citation of L45 to L53 in
    # it is a DEAD REFERENCE and must not be written.
    AbendDetail:
      type: object
      additionalProperties: false
      required:
        - abendCode
        - abendCulprit
        - abendReason
        - abendMsg
      description: >-
        The structured equivalent of the baseline's ABEND-DATA group at
        app/cpy/CSMSG02Y.cpy L21 to L29, at its declared widths. The component
        list of com.carddemo.common.error.AbendDetail name for name. All four are
        modelled as four members rather than as one concatenated line, so a client
        can present the culprit without parsing.
      properties:
        abendCode:
          type: string
          maxLength: 4
          description: >-
            The abend code, at the X(4) width of ABEND-CODE at
            app/cpy/CSMSG02Y.cpy L22. Spaces when the reference set none.
        abendCulprit:
          type: string
          maxLength: 8
          description: >-
            Which component failed, at the X(8) width of ABEND-CULPRIT at
            app/cpy/CSMSG02Y.cpy L24 -- eight characters because that is a
            reference program-name width.
        abendReason:
          type: string
          maxLength: 50
          description: >-
            Why it failed, at the X(50) width of ABEND-REASON at
            app/cpy/CSMSG02Y.cpy L26.
        abendMsg:
          type: string
          maxLength: 72
          description: >-
            The operator-facing line, at the X(72) width of ABEND-MSG at
            app/cpy/CSMSG02Y.cpy L28. This 72 is its own width regime and is
            merged with neither the 75 of the wire message carrier nor the 78 of
            the report screen's message field.
