# =============================================================================
# services/reporting-service/src/main/resources/application.yml
# -----------------------------------------------------------------------------
# Purpose:
#   Base, profile-independent Spring Boot configuration for reporting-service,
#   the REPORTING AND STATEMENT bounded context of the CardDemo
#   mainframe-to-microservices migration. It settles the values every
#   environment shares: the HTTP listener and its drain budget, the Aurora
#   PostgreSQL datasource and its connection pool, the read-only persistence
#   posture, resource-server identity, the Actuator probe surface, log levels
#   and log pattern, and the module-local report-execution and object-storage
#   keys this context owns.
#
#   BOTH application-dev.yml AND application-prod.yml NOW EXIST FOR THIS MODULE.
#   This document remains written to start the service with no profile active at
#   all -- which is why every value a profile would otherwise tune is a concrete
#   literal here rather than a deployment-injection marker -- and the two overlays
#   beside it differ from it only in sizing, retention and verbosity, never in
#   topology, so a setting that changes behaviour rather than capacity belongs here
#   and not in a profile. Every statement below about what a profile MAY and MAY
#   NOT vary is therefore a constraint those two files are HELD TO rather than a
#   forward-looking note: the development overlay narrows the pool to two
#   connections with no idle floor, halves the streaming fetch size, raises the root
#   and project log levels and widens the health detail payload; the production
#   overlay widens the pool to eight with a floor of two, shortens the acquisition
#   timeout to ten seconds, and restates the fetch size, both log levels and the
#   closed health detail so that no development value can be read as applying
#   everywhere. A reader confirms the set with
#   `ls services/reporting-service/src/main/resources`.
#
#   Refactoring Rationale: this paragraph previously stated that neither overlay
#   existed. It was accurate when written and became false as each was authored,
#   which is precisely the drift a reader cannot detect from inside the file -- the
#   surrounding constraints read identically whether they describe files that exist
#   or files that do not. It is restated as a description of the shipped tree so
#   that the check named above actually falsifies it if it goes stale again.
#
#   Four COBOL programs are the behavioural oracle for this context. They are
#   read and never modified, and the uppercase .CBL and .JCL spellings are the
#   on-disk spellings, so a lowercase citation is a dead reference:
#     app/cbl/CORPT00C.cbl  online report request. Its ad hoc submission path
#                           is replaced rather than reimplemented, and that is
#                           argued in full at
#                           carddemo.reporting.step-functions.state-machine-arn.
#     app/cbl/CBTRN03C.cbl  transaction detail report writer.
#     app/cbl/CBSTM03A.CBL  statement generator, emitting TWO formats.
#     app/cbl/CBSTM03B.CBL  statement subprogram, called by CBSTM03A.
#
#   THREE artifact widths are FD-declared, so they are contracts inherited from
#   the baseline rather than choices made here, and any output configuration
#   respects them:
#     133  transaction detail report -- app/cpy/CVTRA07Y.cpy L48
#          (01 TRANSACTION-HEADER-2 PIC X(133)), app/cbl/CBTRN03C.cbl L85
#          (FD-REPTFILE-REC PIC X(133)) and L133 (WS-BLANK-LINE PIC X(133)),
#          and app/jcl/TRANREPT.jcl L78 (DCB LRECL=133).
#      80  plain-text statement -- app/cbl/CBSTM03A.CBL L45
#          (FD-STMTFILE-REC PIC X(80)) and app/jcl/CREASTMT.JCL L89.
#     100  HTML statement -- app/cbl/CBSTM03A.CBL L47
#          (FD-HTMLFILE-REC PIC X(100)) and app/jcl/CREASTMT.JCL L94.
#   Both CREASTMT.JCL citations above sit inside the STEP040 stanzas that
#   allocate the outputs, L87 to L91 and L92 to L96. The identical LRECL=80 that
#   also appears at L69 and at L73 is INERT: those two stanzas belong to STEP030,
#   which runs IEFBR14 with DISP=(MOD,DELETE,DELETE) and writes no data at all,
#   so neither is a width source, and the L69 occurrence in particular is not
#   the HTML width.
#
#   A FOURTH width exists and stands OUTSIDE the 133-column contract. It is
#   recorded here so that nobody forces it into the CVTRA07Y mould.
#   app/jcl/PRTCATBL.jcl is formatted entirely by DFSORT with no COBOL program
#   participating (L43, STEP10R EXEC PGM=SORT). Its physical record is 40 bytes
#   per DCB=(LRECL=40,RECFM=FB,BLKSIZE=0) at L61, while the OUTREC FIELDS
#   arithmetic at L53 to L56 sums to 41 (11 + 1 + 2 + 1 + 4 + 1 + 12 + 9). For
#   RECFM=FB the DCB governs, so the one trailing blank is never written. That
#   is an artifact observation about the baseline and not a defect claim: the
#   baseline behaves as it behaves, the target records the difference, and this
#   migration adds a path rather than removing one. The doctrine followed here
#   is the house one at tests/README.md L50 to L51 -- document honestly so that
#   no claim hides a blocked feature, as a financial-enterprise auditability
#   requirement.
#
#   This module CREATES nothing in the database and OWNS nothing in it: no table,
#   no index, no constraint and no DDL of any kind, and no schema-migration
#   artifact on its classpath. It is precise to say it owns no schema either --
#   the `reporting` schema its connections pin below does exist, and it is owned by
#   carddemo_reporting_owner, a separate NON-LOGIN role, specifically so that this
#   service's own login cannot create, replace or drop anything in it. What this
#   service holds is USAGE on that schema and SELECT on the named views inside it.
#   Two different files supply that, and the split matters because a missing
#   relation and a missing privilege are reported in different places:
#     - data-migration/sql/V0__schemas_and_roles.sql creates the schema, its owner
#       role and this service's login role, grants the USAGE, and grants the OWNER
#       the SELECT it needs on ledger, account, card and reference. It creates NO
#       VIEW, and says so itself: a view cannot be created before the tables it
#       reads exist, and no table exists when that script runs.
#     - data-migration/sql/V1__reporting_views.sql creates the views and grants
#       SELECT on each one to this service's role. It is ordered AFTER every
#       per-service Flyway migration for that same reason.
#   A view or a privilege missing at run time is a defect to report against those
#   two files, never something for this module to create for itself.
#
#   NO CREDENTIAL, ENDPOINT, BUCKET NAME, RESOURCE IDENTIFIER, ACCOUNT
#   IDENTIFIER OR USER-POOL IDENTIFIER APPEARS ANYWHERE IN THIS FILE. Two
#   interpolation classes are used and the difference between them is deliberate:
#     - a value the DEPLOYMENT injects -- the datasource triple, the token
#       issuer, the state-machine identifier, the output bucket, and the listener
#       certificate and its private key -- is an unresolved ${...} interpolation
#       carrying NO fallback, so an absent one stops start-up loudly rather than
#       starting a reporting service that cannot reach its data, serve TLS, or
#       write its artifacts. The certificate pair is the newest member of this
#       class and the one most easily mistaken for optional: the target group's
#       protocol is fixed at HTTPS by infra/modules/ecs-service, so a task
#       without it never turns healthy;
#     - a value a PROFILE would otherwise tune -- pool sizing, log levels,
#       health detail, fetch size, object-key prefixes, timeouts -- is a
#       concrete literal here, so that this document stands alone.
#   Every value in the first class arrives at run time from Terraform outputs by
#   way of Parameter Store and Secrets Manager.
#
#   Documentation convention: docs/CODE_DOCUMENTATION_STANDARD.md.
# -----------------------------------------------------------------------------
# WHY (non-obvious design decisions):
#
#   - Assumptions: this document is authored BEFORE the Java that binds it, so the
#     property keys below are the contract that config/DataSourceConfig.java,
#     config/SecurityConfig.java, config/StepFunctionsConfig.java and
#     service/ReportExecutionService.java are written against. Two consequences
#     follow and both shaped what is here: a key nothing binds is dead weight,
#     and a key something needs but that is missing is a start-up failure. Every
#     name that had to agree with an already-authored class was therefore read
#     out of that class rather than guessed -- see the MetricsConfig and
#     CorrelationIdFilter bullets below.
#   - Assumptions: this document must start the application with NO profile
#     supplied. The ECS task definition sets SPRING_PROFILES_ACTIVE, and if the
#     base were incomplete a task launched without that variable would fail to
#     start rather than start degraded. Detail at spring.config.import.
#   - Assumptions: the one listener this service exposes serves HTTPS, so the
#     load-balancer-to-task hop is encrypted rather than stopping the protected
#     path at the load balancer. This is half of a two-part change whose other
#     half, target_protocol in infra/modules/ecs-service, is validated to accept
#     "HTTPS" and nothing else -- so a cleartext task is one whose probes all
#     speak the wrong protocol. Detail at server.ssl.
#   - Assumptions: the token contract is recorded in two places because it binds
#     through two mechanisms, and reading either half alone overstates what is
#     checked. The issuer key settles who signed the token; three keys under a
#     namespace this project owns settle what kind of token it is, which client it
#     was minted for and which scope it carries. The framework's own audiences key
#     is deliberately absent and the reason is argued in place. Detail at
#     spring.security and at carddemo.security.jwt.
#   - Alternatives Considered: naming the four source schemas in the connection
#     search path, which is the obvious reading of "cross-schema views" and is
#     wrong against the authored privilege model. Rejected. Detail at
#     spring.datasource.hikari.connection-init-sql.
#   - Alternatives Considered: an Aurora reader endpoint, a second datasource or a
#     routing datasource, so that reporting reads never reach the writer.
#     Rejected. Detail at spring.datasource.
#   - Alternatives Considered: modelling the report request as a queued message,
#     the way the authorization context models its request and reply exchange.
#     Rejected. Detail at carddemo.reporting.step-functions.state-machine-arn.
#   - Alternatives Considered: a global JSON inclusion policy, and a bespoke
#     logging back-end configuration file. Both rejected, and each absence is
#     argued where it would otherwise have been declared -- the first at
#     `spring`, the second at `logging`.
#   - Assumptions: no schema-migration key appears anywhere in this document, not
#     even one disabling migration. services/reporting-service/pom.xml declares
#     neither the migration-tool core artifact nor its PostgreSQL companion --
#     that POM names both of them in its DELIBERATELY ABSENT block, which is
#     where they stay named so that this document does not become a second place
#     to maintain the pair. Such a key here would bind nothing AND would falsely
#     imply the tool was available, inviting the next reader to add the library
#     rather than remove the key. This module owns no schema, so it owns no
#     migration directory either; a db/migration directory here would be an
#     affirmative defect, which is the same conclusion that POM reaches
#     independently.
#   - Assumptions: no queue key and no batch-job-repository key appears either,
#     for the same classpath reason. This context consumes none of the migrated
#     queues, and batch-service owns the step ledger that supplies restart
#     semantics; a second ledger here would be a second, competing account of
#     whether a step completed.
#   - Assumptions: MetricsConfig in com.carddemo.common.observability publishes
#     three Micrometer common tags from three named properties, and those names
#     were taken from that class rather than invented:
#     spring.application.name, carddemo.environment and carddemo.version, each
#     defaulting in that class to the literal `unspecified`. All three are
#     declared below so the tags carry meaning. Detail at
#     spring.application.name and at `carddemo`.
#   - Assumptions: CorrelationIdFilter in com.carddemo.common.web publishes the
#     request correlation identity to the SLF4J mapped diagnostic context under
#     the key `correlationId`, and that class's own documentation states the key
#     is a contract with a logging configuration rather than an internal detail.
#     Detail at logging.pattern.console.
#   - Trade-offs: the connection pool is sized deliberately small against a
#     cluster-wide connection budget shared with seven peer services, because a
#     borrow here can be held for the whole of a cursor walk rather than for a
#     keyed read. Detail at spring.datasource.hikari.maximum-pool-size.
#   - Trade-offs: the shutdown drain budget is pinned BELOW the container
#     platform's own default stop timeout, because a budget above it is a budget
#     the platform never honours. Detail at
#     spring.lifecycle.timeout-per-shutdown-phase.
#   - Assumptions: the fetch size below is a TRANSPORT BATCH SIZE and is not a cap
#     of any kind. The baseline's two unchecked statement tables and their three
#     distinct numbers are recorded there so that the value can never be read as
#     standing in for one of them. Detail at
#     spring.jpa.properties.hibernate.jdbc.fetch_size.
#   - Assumptions: the Actuator health path is a deployment contract with two
#     consumers defined outside this repository's Java, and they fail in
#     different places. Detail at `management`.
#   - Trade-offs: this file carries no mechanical documentation gate and is held
#     to Rule 1 by the written standard and by review instead.
#     config/checkstyle/checkstyle.xml sets fileExtensions to java at Checker
#     scope, so no linter in this project inspects a .yml file for
#     documentation, and docs/CODE_DOCUMENTATION_STANDARD.md records the same
#     limit for YAML. The absence of a linter is not an absence of obligation,
#     and no comment in this file claims a gate enforces something it does not.
# =============================================================================

server:

  # WHY : Assumptions: three artifacts outside this file are built against 8080
  #       and they do not negotiate it -- this module's Dockerfile EXPOSEs it and
  #       aims its HEALTHCHECK at 127.0.0.1:8080, the load balancer target group
  #       registers the task on it, and the task security group admits it.
  #       Moving it here would leave every one of those three addressing a port
  #       nothing is listening on, and the resulting symptom is a task that never
  #       turns healthy rather than an error naming a port, which is why the
  #       coupling is recorded rather than left to be rediscovered.
  port: 8080

  ssl:

    # WHY : (1) Assumptions: without this block the load-balancer-to-task hop is
    #       cleartext while the hop in front of it is encrypted under the TLS 1.2
    #       floor the alb module pins on its listener, so the protected path stops
    #       at the load balancer and every response then crosses the private
    #       application subnets readable. For this context that traffic is the
    #       whole of the published read surface: statement and report payloads
    #       carrying account identifiers, primary account numbers, customer names
    #       and money amounts, alongside the bearer token that authorised each
    #       request. Being inside a VPC bounds who can observe the traffic; it does
    #       not make the traffic unreadable, and the design requires encryption in
    #       transit end to end rather than up to the edge.
    #       (2) Assumptions: this is one half of a two-part change and neither half
    #       works alone. The other half is target_protocol = "HTTPS" in
    #       infra/modules/ecs-service, which fixes the protocol of both the target
    #       group and its health check -- and that module VALIDATES the value to
    #       exactly "HTTPS", refusing anything else with the instruction to fix the
    #       service's server.ssl configuration rather than lower the target. So the
    #       protocol is not a choice made here; a task serving cleartext is a task
    #       whose probes all speak the wrong protocol and which therefore never
    #       turns healthy.
    #       (3) Assumptions: the port does not change. The EXPOSE instruction in
    #       this module's image, the target group registration and the task
    #       security group are all built against 8080, as the port key above
    #       records, so this encrypts the existing listener in place rather than
    #       moving it.
    enabled: true

    # WHY : Refactoring Rationale: these four properties replace a
    #       `certificate` / `certificate-private-key` pair that read PEM CONTENT
    #       from two environment variables injected from Secrets Manager. The
    #       comment that stood here claimed the material was "not stored in the
    #       task definition, in Terraform state or in plan output"; the first and
    #       last were true and the middle one was FALSE. The pair was produced by
    #       a managed `tls_private_key` resource in each environment root, so the
    #       private key was written to Terraform state, and the SAME key was then
    #       copied into two Secrets Manager entries and injected into every online
    #       task -- one key for all eight services, held by anyone who could read
    #       the state file. The claim is withdrawn and the mechanism is changed
    #       rather than the sentence rewritten.
    # WHY : Assumptions: the keystore is minted by THIS TASK at startup, by
    #       config/docker/generate-listener-material.sh, which is the image's
    #       entry point. It draws a fresh 2048-bit RSA key and a self-signed leaf
    #       with keytool, writes them mode 0600 on the task's own encrypted
    #       ephemeral volume, exports the three placeholders below, and then
    #       `exec`s the JVM. No key is expressible in source, reaches Terraform
    #       state, reaches Secrets Manager, or is shared by two tasks. That
    #       script's header records the three alternatives measured and rejected,
    #       including why an ephemeral `tls_private_key` cannot be used here.
    # WHY : Assumptions: an Application Load Balancer does NOT validate the
    #       certificate a target in an HTTPS target group presents, so a per-task
    #       self-signed leaf is accepted at that hop exactly as the previous
    #       shared self-signed leaf was. The certificate that IS verified -- the
    #       one API Gateway checks against `server_name_to_verify` -- belongs to
    #       the load balancer's own listener and is the operator-supplied ACM
    #       certificate, which this change does not touch.
    # WHY : Alternatives Considered: keeping PEM properties and having the script
    #       write cert.pem and key.pem for `file:` locations, which these
    #       properties also accept. Rejected on a measured limitation rather than
    #       a preference: keytool exports a certificate as PEM but cannot export a
    #       private key at all, so a PEM pair would need openssl, which is absent
    #       from the pinned runtime digest. PKCS#12 is the one format the tooling
    #       already in the image can produce.
    # WHY : Trade-offs: `key-store` and `key-alias` carry defaults matching what
    #       the script writes, so a local `java -jar` run against a hand-made
    #       keystore needs only the password. `key-store-password` deliberately
    #       carries NO default: a literal here would read as a committed secret to
    #       every reader and to the repository's secret scanner, and an absent
    #       password must stop startup rather than fall back to cleartext, which
    #       would present as a healthy service that had quietly stopped meeting
    #       the requirement this block exists for.
    key-store: ${CARDDEMO_SERVER_TLS_KEYSTORE:file:/tmp/carddemo-tls/listener.p12}
    key-store-type: PKCS12
    key-store-password: ${CARDDEMO_SERVER_TLS_KEYSTORE_PASSWORD}
    key-alias: ${CARDDEMO_SERVER_TLS_KEY_ALIAS:carddemo-listener}

    # WHY : (1) Assumptions: the two versions are named rather than left to the
    #       runtime default, which still negotiates the withdrawn TLS 1.1 and, on
    #       some distributions, TLS 1.0. Naming them holds the same floor the alb
    #       module pins on its listener and the cloudfront-spa module enforces for
    #       viewers, so one floor applies at all three hops instead of three
    #       independently chosen ones.
    #       (2) Trade-offs: no cipher list is set. A hand-written list ages into a
    #       liability, silently permitting a suite the runtime has since deprecated
    #       and excluding suites added later, whereas the runtime's own default set
    #       for these two versions is maintained by whoever ships it. What is given
    #       up is the ability to pin an exact suite; what is kept is a set that
    #       does not rot.
    #       (3) Assumptions: the load balancer does not verify this certificate --
    #       an Application Load Balancer trusts whatever a registered target
    #       presents -- so this encrypts the hop without authenticating it. That
    #       residual is recorded on target_protocol in the ecs-service module and
    #       is not something this file can close.
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3

  # WHY : (1) Assumptions: deployment is a rolling task replacement, because
  #       blue-green and canary deployment are out of scope, so the platform
  #       stops a task that may be midway through serving a request. The baseline
  #       has no counterpart to this setting, so nothing is being replaced here.
  #       (2) Assumptions: a statement or report run walks an open server-side
  #       cursor and streams bytes to object storage, so an abrupt stop severs it
  #       mid-write and leaves a TRUNCATED artifact behind rather than a clean
  #       failure. A truncated fixed-width artifact is the worst of the three
  #       possible outcomes, because it is indistinguishable from a complete one
  #       until a reader reaches the short record.
  #       (3) Trade-offs: task replacement takes longer in exchange for artifacts
  #       that are either complete or absent, never partial. The wait is bounded
  #       at spring.lifecycle.timeout-per-shutdown-phase below.
  shutdown: graceful

  # WHY : (1) Assumptions: this service is reached through two hops it cannot
  #       see -- an API Gateway HTTP API in front, and an INTERNAL load balancer
  #       behind it over a private link -- so the scheme, host and port on the
  #       request as received are the internal ones, not the ones the caller
  #       used.
  #       (2) Alternatives Considered: leaving this unset, which is the framework
  #       default. Rejected because of a concrete, checkable consequence rather
  #       than a stylistic one: the springdoc-served contract advertises a server
  #       URL derived from the request, and a report submission answers with a
  #       Location header naming the execution it created. Left unset, both would
  #       name the internal load balancer host, which no browser can resolve and
  #       no client outside the private network can reach -- so the contract
  #       would document an unreachable address and the Location header would
  #       point at one.
  #       (3) Alternatives Considered: the `native` strategy, which delegates to
  #       the servlet container. Rejected because it is the container that then
  #       decides which proxies to trust, and that decision would live in neither
  #       this file nor the Terraform that provisions the two hops. `framework`
  #       keeps the handling in one place that this document can describe.
  forward-headers-strategy: native

  # WHY : (1) Refactoring Rationale: the strategy is `native` and not `framework`,
  #       and the change is a trust decision rather than a preference. The
  #       framework strategy applies the forwarded headers unconditionally: any
  #       caller that can reach this port -- which inside the private application
  #       subnets is every other task in the tier -- can therefore dictate the
  #       scheme, host and port this service believes it was reached on, and those
  #       values travel into the published contract's server URL and into the
  #       Location header a report submission answers with. The native strategy
  #       applies them only when the immediate peer is one of the proxies named
  #       below, so an unlisted caller's headers are ignored instead of obeyed.
  #       (2) Assumptions: the earlier note against `native` was that the servlet
  #       container would then decide which proxies to trust and that the decision
  #       would live in neither this file nor the Terraform. That is answered by
  #       naming the trusted range HERE, as a bounded value with a documented
  #       source, rather than by leaving the container's default in place.
  tomcat:
    remoteip:
      # WHY : Assumptions: the two hops in front of this service are an API
      #       Gateway HTTP API and an INTERNAL load balancer reached over a VPC
      #       link, and only the second one is a direct peer. Its addresses are
      #       drawn from the VPC's own subnets, so the trusted set is expressed as
      #       the VPC CIDR the network module provisions -- 10.0.0.0/16 by default
      #       -- rendered as the regular expression this property expects. The
      #       value is supplied by the environment so that a deployment on a
      #       different CIDR narrows it without an edit here; the default is the
      #       private range the plan's own network module uses, and NOT the
      #       container's default, which additionally trusts the loopback and
      #       every other private range. The `10.0.0.0/16` figure is the
      #       network module's own vpc_cidr default.
      # WHY : Assumptions: the expression uses `\d+` and not `\d{1,3}`, and the
      #       reason is a placeholder-parsing hazard rather than a matter of
      #       precision. A property placeholder is terminated by the first
      #       closing brace, so a repetition count written with braces inside
      #       the default value would end the placeholder early and leave the
      #       remainder as literal text -- a pattern that then matches nothing
      #       and silently trusts no proxy. Nothing is lost: an octet is at most
      #       three digits in any dotted-quad address a peer can present.
      internal-proxies: ${CARDDEMO_TRUSTED_PROXY_PATTERN:10\.0\.\d+\.\d+}

      # WHY : Assumptions: the two header names are stated rather than inherited,
      #       because the load balancer sets exactly these and a value read from
      #       the wrong header is worse than reading none -- it would be applied
      #       with the same confidence.
      protocol-header: x-forwarded-proto
      remote-ip-header: x-forwarded-for

# WHY : Alternatives Considered: a spring.jackson block, and in particular a
#       global non-null inclusion policy. Rejected, and the reasoning is the
#       reason no such key appears anywhere below. The argument FOR one is real:
#       the report submission response has to omit its execution identifier
#       entirely, not send it as null, for the two confirm outcomes that submit
#       nothing. The argument against is decisive, because the same global
#       setting reaches every serialised type -- it would also suppress the
#       deliberately nullable first-key and last-key cursor tokens of the shared
#       keyset page envelope, turning a four-component envelope into a
#       three-component one on a first page and breaking the contract the browser
#       client is written against. Presence and absence are therefore a
#       per-property concern belonging to the DTO and to the shared kernel types,
#       not a document-wide default. There is a second, independent reason to
#       leave Jackson alone from configuration: config/OpenApiConfig.java
#       deliberately declares no object-mapper bean, because declaring one backs
#       off the framework's Jackson autoconfiguration and would leave the shared
#       money module unbound, at which point every money field silently
#       serialises as a JSON number in violation of the migration's fixed-point
#       money rule. A document-wide Jackson default set here is the same hazard
#       approached from the other side.
# WHY : Refactoring Rationale: this block stood twice, byte-identically, immediately
#       above this line. One copy was removed and this one kept because it is the
#       one adjacent to what it explains -- the `spring:` mapping below, in which no
#       `jackson` key appears. The duplication was not merely untidy: a rationale
#       held in two places is edited in one, and the surviving stale copy then reads
#       as though it were current, which is the same failure mode that let a
#       superseded claim survive elsewhere in this checkpoint. Both assertions above
#       were re-verified against the code before the copy was dropped: `grep jackson`
#       over this service's resources matches only this comment, and
#       `config/OpenApiConfig.java` names ObjectMapper only to record that it
#       declares no such bean.
spring:

  # WHY : Assumptions: this value has two consumers that must agree, and it was
  #       matched to the first of them by reading that class rather than by
  #       convention. MetricsConfig in com.carddemo.common.observability exposes
  #       the constant SERVICE_PROPERTY with the value `spring.application.name`
  #       and turns whatever it resolves to into the Micrometer `service` common
  #       tag attached to every meter, falling back to the literal `unspecified`
  #       when unset. The same name is what identifies this service's log group
  #       and stream. Leaving it unset would therefore publish meters tagged
  #       `service=unspecified` that no dashboard could attribute, and the failure
  #       is silent -- the metrics arrive, they simply cannot be attributed.
  application:
    name: reporting-service

  # WHY : (1) Assumptions: both locations carry the `optional:` prefix, and that
  #       prefix is what makes profile-free and offline start-up real rather than
  #       aspirational. Without it an unreachable control plane -- a developer
  #       machine with no credentials, a task whose endpoint policy is still
  #       settling -- is a hard start-up failure instead of a start that falls
  #       through to the injected environment variables this document already
  #       reads. The two starters that resolve these locations are on the
  #       classpath for exactly this: services/reporting-service/pom.xml declares
  #       the parameter-store and the secrets-manager starter and nothing else
  #       from that family.
  #       (2) Alternatives Considered: writing two different literal namespace
  #       paths, one in each profile overlay. Rejected because a parameter path
  #       is TOPOLOGY, and the two overlays are permitted to differ only in
  #       sizing, retention and verbosity; a path that differed between them would
  #       smuggle a topology difference into a file whose stated contract forbids
  #       one, and the two overlays would then have to be diffed to answer where a
  #       value came from. Carrying the environment-varying segment in one
  #       variable keeps both overlays identical in this respect and keeps the
  #       answer in one place.
  #       (3) Assumptions: the fallback is a bare namespace path and holds no
  #       account identifier and no environment credential. A namespace is not a
  #       secret; an account-qualified path would be, which is why the fallback
  #       stops at the service segment.
  #       (4) Refactoring Rationale: the classpath entry was ADDED, and it is
  #       first in the list. This service was the only one of the eight that
  #       depended on common-lib and never imported the cross-cutting defaults
  #       that module publishes, and the omission had a visible cost: the console
  #       pattern below was a locally-written copy naming ONE of the four
  #       mapped-diagnostic-context keys, so the edge-request identity that
  #       CorrelationIdFilter publishes under `requestId` -- the key that joins a
  #       service line to its API Gateway access-log record -- was present in the
  #       context and absent from every line this service logged, and the two
  #       tracing keys with it. Importing the shared document supplies the
  #       four-key pattern that the other seven services already log, so one
  #       query spans all eight. It also supplies the OpenTelemetry export
  #       defaults, which this file never set: without them a local run or a test
  #       of this service alone would attempt OTLP export to a collector that is
  #       not listening, because the exporter arrives on the classpath through the
  #       shared starter whether or not a deployment supplies a sidecar.
  #       (5) Assumptions: importing cannot silently change any value this file
  #       already sets. The imported document's own header records that imported
  #       values sit BENEATH the importing file in precedence, so every key
  #       declared below still wins -- including `carddemo.environment` and
  #       `carddemo.version`, which this file declares for its own reasons and
  #       which the shared document also defaults from the same two variables to
  #       the same sentinel.
  config:
    import:
      - "classpath:/carddemo-common-defaults.yml"
      - "optional:aws-parameterstore:${CARDDEMO_CONFIG_PREFIX:/carddemo/reporting}/"
      - "optional:aws-secretsmanager:${CARDDEMO_CONFIG_PREFIX:/carddemo/reporting}/"

  # WHY : Alternatives Considered: leaving the start-up banner at its default of
  #       `console`. Rejected on a measurable cost rather than a matter of taste.
  #       Log storage is billed per ingested gigabyte; the banner is several lines
  #       emitted on every process start, a rolling replacement starts one process
  #       per task slot per deployment, and no line of it is actionable. What it
  #       would have shown is already published twice over and in queryable form:
  #       the build version travels as the Micrometer `version` common tag that
  #       MetricsConfig applies, and the framework version is available on the
  #       Actuator info endpoint exposed below. Suppressing it removes billed
  #       bytes and removes no diagnostic.
  main:
    banner-mode: "off"

  # WHY : (1) Trade-offs: twenty seconds is chosen against the window the
  #       container platform itself allows, not against how long a report might
  #       take. A Linux task on this platform is given thirty seconds by default
  #       between SIGTERM and SIGKILL, and the JVM is killed at the end of it
  #       whatever the framework is still draining. A budget at or above that
  #       figure is therefore one the platform will not honour: it would read as
  #       configured while producing exactly the truncated artifact that
  #       server.shutdown above exists to prevent. Twenty seconds leaves headroom
  #       inside the window that is actually granted for the drain to finish and
  #       for the connection pool to close.
  #       (2) Alternatives Considered: a longer budget -- forty-five or sixty
  #       seconds -- on the assumption that the task definition raises the stop
  #       timeout to match. Rejected because this document cannot see the task
  #       definition and cannot verify that assumption, and the failure mode of
  #       assuming wrongly is silent. If a run legitimately needs longer than the
  #       drain window, the answer is to run it as a batch execution rather than
  #       to widen a budget whose ceiling is set elsewhere.
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # WHY : Alternatives Considered: a second datasource aimed at an Aurora reader
  #       endpoint, or a routing datasource that sent reads there and left the
  #       writer for everyone else. Rejected, and the absence is documented
  #       because a reader would reasonably expect it in a reporting service. A
  #       replica adds cost and it adds replica-lag semantics for no parity
  #       benefit: the baseline's report and statement programs read the very same
  #       key-sequenced datasets the online programs read, so a replica would
  #       introduce a staleness window the baseline never had, and the golden
  #       masters -- which compare bytes -- have no way to express "correct, but
  #       for a slightly earlier instant". Reads here go to the writer through the
  #       read-only views instead, which costs nothing and keeps the comparison
  #       meaningful. There is exactly ONE datasource in this document.
  datasource:

    # WHY : Assumptions: all three arrive as environment variables that the task
    #       definition resolves from Parameter Store and Secrets Manager, and none
    #       carries a fallback. An absent one stops start-up loudly, which is the
    #       intended behaviour: the alternative -- a default pointing at a local
    #       database -- would let a task start, pass its health check and serve
    #       reports built from whatever happened to be reachable, which is a
    #       worse outcome than not starting. The name resolved into is the
    #       SELECT-only role, not an owning role.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

    hikari:

      # WHY : Assumptions: eight services connect to one cluster, so pool
      #       telemetry and server-side session listings are only readable if each
      #       pool is named for its owner. The default name is shared by every
      #       Hikari pool in existence, which is what makes it useless here.
      pool-name: reporting-pool

      # WHY : Alternatives Considered: relying on the database role's SELECT-only
      #       privileges alone, which do already make a write impossible.
      #       Rejected because of WHERE each check lives and how each one reports.
      #       The privilege model is administered in
      #       data-migration/sql/V0__schemas_and_roles.sql and is invisible from
      #       this module, so a reader here cannot tell that writes are barred and
      #       a change there is not visible in this repository's Java at all. A
      #       read-only connection fails at the point a write is attempted, in
      #       this process, naming this pool. The two together mean the read-only
      #       posture is asserted twice and independently -- once by the database
      #       and once by the client -- and a single mistake in either place no
      #       longer opens a write path.
      read-only: true

      # WHY : (1) Assumptions: a PostgreSQL server-side cursor materialises rows
      #       lazily only when BOTH preconditions hold -- a positive JDBC fetch
      #       size, set at
      #       spring.jpa.properties.hibernate.jdbc.fetch_size below, AND a
      #       connection that is not in auto-commit. Hikari's default for this
      #       key is on, and while the transaction manager switches it off when a
      #       transaction begins, pinning it off at the pool means the
      #       precondition holds for every borrow instead of only for a borrow
      #       that happens to be inside one.
      #       (2) Alternatives Considered: leaving the default on and relying on
      #       the transaction manager. Rejected because the failure mode is
      #       silent rather than loud: a streaming read that ran outside a
      #       transactional boundary would return exactly the right rows, having
      #       buffered the entire result set into the driver first, so the only
      #       symptom is heap that grows with the size of the result. That is
      #       precisely the whole-result materialisation the fetch size exists to
      #       avoid, and nothing would report it.
      #       (3) Trade-offs: every borrow now opens a transaction implicitly, so
      #       a connection returned without a commit or a rollback would sit idle
      #       inside one. The window is bounded by the framework closing and
      #       returning the connection at the end of each request, and a leaked
      #       one is retired by max-lifetime below; because the connection is
      #       read-only, such a session can hold no uncommitted data.
      auto-commit: false

      # WHY : (1) Assumptions: this context reads exclusively through read-only
      #       cross-schema views, under a role holding SELECT-only privileges, so
      #       no write path exists at any layer. Those views live in the
      #       `reporting` schema and are owned by a separate, non-login role;
      #       data-migration/sql/V0__schemas_and_roles.sql establishes that schema
      #       at L564 to L565 and gives this service's login role USAGE on it at
      #       L917 while withholding everything else. That same file deliberately
      #       sets no search path for any role -- its stated reason is that one
      #       setting with two owners drifts -- so this key is the single owner of
      #       schema resolution for this service, and the resolution has to be
      #       correct here or nowhere.
      #       (2) Assumptions: the views span three source schemas, and the
      #       evidence is two DIFFERENT four-way joins that must never be
      #       conflated. They overlap only in the transaction projection and the
      #       card cross-reference. The statement generator's four data inputs are
      #       the DD statements at app/jcl/CREASTMT.JCL L83 to L86 -- TRNXFILE,
      #       XREFFILE, ACCTFILE and CUSTFILE -- which map to the card-ordered
      #       transaction projection plus account.card_xref, account.accounts and
      #       account.customers.
      #       (3) Assumptions: the transaction report's four data inputs are a
      #       different set, the DD statements at app/jcl/TRANREPT.jcl L65
      #       (TRANFILE), L67 (CARDXREF), L69 (TRANTYPE) and L71 (TRANCATG),
      #       which map to the transaction projection plus account.card_xref,
      #       reference.transaction_types and reference.transaction_categories.
      #       The fifth DD statement in that step, DATEPARM at L73 to L74, is a
      #       PARAMETER file and not a joined data source -- which is exactly why
      #       the reporting date range is a job parameter and why both generators
      #       are free of any read of the wall clock. Union of the two: ledger,
      #       account and reference.
      #       (4) Alternatives Considered: naming those three source schemas here,
      #       or naming all four of ledger, account, reference and card, which is
      #       the obvious reading of "cross-schema views". Rejected on two
      #       independent grounds, either sufficient. First it would resolve
      #       nothing: V0 withdraws this login role's USAGE on all four at L915,
      #       and PostgreSQL silently ignores a search-path entry whose schema the
      #       role cannot use, so every unqualified name would fail to resolve and
      #       the entries would be decoration. Second, and worse, they would not
      #       stay decoration -- the day somebody restores that apparently
      #       missing USAGE, unqualified names would begin resolving to the BASE
      #       TABLES instead of to the views, and the masking those views carry
      #       (an account number rendered to its last four digits, a card
      #       verification value never returned, encrypted identifiers returned
      #       masked) would be bypassed in silence by queries that had not
      #       changed. Naming one schema makes that failure unreachable.
      #       (5) Assumptions: `card` is neither silently dropped from this
      #       decision nor silently promoted into it. It is read by NEITHER
      #       program: the DD evidence above never reaches it, and every card
      #       number surfaced by this context originates in account.card_xref and
      #       in the card-ordered statement projection of app/cpy/COSTM01.CPY
      #       rather than in card.cards. Should a card attribute later surface on
      #       an endpoint, it reaches this service the same way every other column
      #       does -- through a view in the `reporting` schema -- so this value
      #       still would not change.
      #       (6) Assumptions: the SCHEMA, the roles and the USAGE grant come from
      #       data-migration/sql/V0__schemas_and_roles.sql; the VIEWS themselves and
      #       the per-view SELECT grants come from
      #       data-migration/sql/V1__reporting_views.sql, which is ordered after
      #       every per-service migration because a view cannot precede the tables
      #       it reads. Neither comes from here. A view or a privilege missing at
      #       run time surfaces as a permission or undefined-relation error naming
      #       the view, and that is a data-migration defect to be reported against
      #       whichever of those two files owns it, rather than anything for this
      #       module to remedy for itself.
      connection-init-sql: "SET search_path TO reporting"

      # WHY : (1) Trade-offs: four is small for an HTTP service and is chosen
      #       against the shape of the work rather than against request volume. A
      #       borrow in this context is held for the whole of a cursor walk over a
      #       card-ordered projection, not for a keyed read that returns and
      #       releases, so a pool of four here means four LONG holds rather than
      #       four short ones. The figure that has to fit is cluster-wide: one
      #       Aurora cluster is shared with seven peer services -- auth, account,
      #       card, transaction, reference, batch and authorization -- and the
      #       total is the sum over all eight of tasks multiplied by this bound.
      #       What four buys is that a burst of report traffic cannot starve the
      #       other seven of the short keyed reads that sign-on and posting need.
      #       What it costs is that a fifth concurrent run on one task waits, and
      #       then fails with a pool timeout after connection-timeout below rather
      #       than queueing without limit.
      #       (2) Alternatives Considered: ten, which is what the online peers
      #       auth-service, card-service and transaction-service each use.
      #       Rejected because those pools serve keyed reads measured in
      #       milliseconds while this one serves cursor walks; adopting their
      #       figure would multiply this module's long holds by two and a half
      #       against the same shared total, and the symptom would appear in the
      #       OTHER seven services as refused connections during a reporting
      #       burst, which is the hardest kind of fault to attribute.
      #       (3) Trade-offs: minimum-idle is one rather than equal to the
      #       maximum. One warm connection means the first report after a quiet
      #       period does not pay a fresh handshake, while a fixed pool would hold
      #       four connections open against the shared total continuously -- and
      #       in the development environment, where Aurora capacity is allowed to
      #       fall to zero, a fixed pool would keep prodding a cluster that is
      #       trying to pause and would defeat the saving outright.
      maximum-pool-size: 4
      minimum-idle: 1

      # WHY : Alternatives Considered: ten seconds, which is what card-service and
      #       transaction-service both use. Rejected for a concrete reason: when
      #       Aurora capacity has fallen to zero and auto-pause has taken effect,
      #       the cluster takes on the order of fifteen seconds to resume, and the
      #       request that triggers the resume is the one waiting on this timeout.
      #       At ten seconds the first report after a quiet period in the
      #       development environment would abort before the cluster had finished
      #       resuming, and it would abort with a pool timeout that names nothing
      #       about capacity -- so it reads as a broken service rather than as a
      #       cold start. Thirty seconds clears the resume with headroom, and it
      #       matches what auth-service already uses, so the two services that can
      #       be first to touch a paused cluster behave the same way.
      connection-timeout: 30000

      # WHY : (1) Assumptions: both figures match transaction-service exactly, so
      #       that every pool aimed at this one cluster recycles on a single
      #       cadence instead of eight services each retiring connections on their
      #       own rhythm against one server-side session limit.
      #       (2) Alternatives Considered: leaving max-lifetime at the pool's own
      #       default, which is longer. Rejected because the requirement is that
      #       the POOL retire a connection before anything on the far side does --
      #       a server-side or proxy-side idle reaper, or an Aurora capacity change
      #       that drops sessions. When the far end wins that race the symptom is
      #       an intermittent query failure on a connection the pool still
      #       believed was good, which presents as a flaky database rather than as
      #       a pool event. Fifteen minutes keeps the pool ahead of it.
      idle-timeout: 300000
      max-lifetime: 900000

      # WHY : (1) Refactoring Rationale: transport security is asserted HERE and no
      #       longer left to whatever the injected URL happens to carry. The three
      #       connection values above arrive as environment variables, so the URL is
      #       supplied by the task definition; a URL that omitted an SSL mode, or
      #       carried `require`, would connect successfully and read the ledger over
      #       a channel that is either plaintext or encrypted-but-unauthenticated,
      #       and nothing would report it. These properties are applied by the pool
      #       to every connection it opens, so the mode is a property of this module
      #       rather than of the string it was handed.
      #       (2) Assumptions: `verify-full` and not `verify-ca`. Both validate the
      #       certificate chain; only `verify-full` also checks that the certificate
      #       identifies the host actually connected to, which is the half that
      #       defeats redirection to another endpoint presenting a legitimately
      #       issued certificate of its own. The reporting role reads the account,
      #       card and ledger schemas, so that is exactly the hop worth binding to a
      #       host identity.
      #       (3) Assumptions: the trust anchor is a filesystem path and not a
      #       secret, so a default is committed and an override is an environment
      #       value. It matches the anchor the ETL package resolves under the same
      #       variable name, which is what keeps one deployment from trusting two
      #       different sets of authorities for one cluster.
      #       (4) Trade-offs: a missing or wrong anchor now stops start-up rather
      #       than downgrading the connection, which is the intended direction: the
      #       alternative failure -- a task that starts, turns healthy and serves
      #       statements over an unverified channel -- is undetectable from outside.
      data-source-properties:
        sslmode: verify-full
        sslrootcert: ${CARDDEMO_DB_SSL_ROOT_CERT:/etc/ssl/certs/carddemo-rds-ca-bundle.pem}

        # WHY : (1) Refactoring Rationale: this entry exists because
        #       `connection-init-sql` above, on its own, DOES NOT PIN THE SEARCH PATH
        #       IN THIS POOL, and that was measured rather than reasoned about.
        #       repository/ReportingDeployedRelationIT reads
        #       current_setting('search_path') back off a borrowed connection; before
        #       this entry it read `"$user", public`, not `reporting`. The cause is
        #       the interaction between two settings this file deliberately keeps: a
        #       PostgreSQL `SET` is TRANSACTIONAL, and `auto-commit: false` above
        #       means the pool runs its initialisation statement inside a transaction
        #       it never commits, so the value is discarded when that transaction is
        #       disposed of and the borrower sees the server default. Under the
        #       default auto-commit the same statement would take effect immediately,
        #       which is why the six sibling services that leave auto-commit alone are
        #       unaffected and this pool is not.
        #       (2) Assumptions: a startup-packet option is immune to that, and that
        #       is the whole reason it is the mechanism chosen. The driver sends it in
        #       the connection request, so the value is established before any
        #       transaction exists and no rollback can revert it.
        #       (3) Alternatives Considered, and why each was refused. Turning
        #       auto-commit on: refused, the disabled auto-commit is what makes a
        #       server-side cursor possible, and the streaming statement read depends
        #       on one. Setting `isolate-internal-queries: true` so the pool commits
        #       the statement: refused, that flag makes the pool ROLL BACK the
        #       initialisation statement when auto-commit is off, so it would make the
        #       observed behaviour deliberate rather than fix it. `ALTER ROLE ... SET
        #       search_path`: refused because data-migration/sql/V0__schemas_and_roles.sql
        #       records the decision NOT to set a role-level path, on the ground that
        #       it would silently outrank whatever a pool declares.
        #       (4) Trade-offs: the schema name is now written in this file twice,
        #       here and in `connection-init-sql`, and two spellings of one value can
        #       drift. That cost is accepted rather than hidden, and it is closed by a
        #       test rather than by a comment: the integration test named above reads
        #       the effective path off a borrowed connection and requires it to be the
        #       `reporting` schema, so changing one spelling and not the other fails
        #       the build. The initialisation statement is KEPT rather than replaced,
        #       because the start-up guard in config/DataSourceConfig.java parses it to
        #       prove this service pins exactly one schema, and
        #       common-lib's CrossSchemaPrivilegeContractTest reads it to cross-check
        #       this pool's reach against the grants the bootstrap issues.
        options: "-c search_path=reporting"

  jpa:

    # WHY : (1) Trade-offs: closing the persistence context before the response
    #       is rendered means a repository or service must fetch everything it
    #       needs while still inside its transaction, and a lazy association
    #       touched during serialisation raises an error instead of quietly
    #       working. That is accepted deliberately here, more than in a
    #       CRUD-shaped peer: with the view left open, the entity manager and its
    #       pooled connection stay bound for the whole request INCLUDING response
    #       serialisation, so a streaming statement read would hold one of only
    #       four connections while bytes were written to a client whose speed this
    #       service does not control. A slow reader would then consume a
    #       connection from a total shared with seven other services.
    #       (2) Assumptions: the error a lazy touch raises is the intended
    #       outcome, because it is loud and it appears in development, whereas the
    #       cost of leaving the view open is invisible until connections run short
    #       under load.
    open-in-view: false

    hibernate:

      # WHY : (1) Assumptions: this module must be unable to emit DDL even by
      #       accident. It owns no relational object, and the objects it reads are
      #       views owned by another role and provisioned by
      #       data-migration/sql/V1__reporting_views.sql, whose schema, owner and
      #       USAGE grant come in turn from
      #       data-migration/sql/V0__schemas_and_roles.sql.
      #       (2) Alternatives Considered: `validate`, which is attractive here
      #       because it would act as a start-up canary for a view that had not
      #       been provisioned. Rejected for two reasons. Entity-to-VIEW metadata
      #       validation is not dependable across dialect versions, so a spurious
      #       failure would block start-up for a service that provably cannot emit
      #       DDL -- trading a clear run-time error for an opaque start-up one.
      #       And a genuinely absent view already reports itself at query time, as
      #       a permission or undefined-relation error naming the view, which is a
      #       data-migration defect to be reported rather than remedied from here.
      ddl-auto: none

    properties:
      hibernate:
        jdbc:

          # WHY : (1) Assumptions: a positive value is one of the two
          #       preconditions for a PostgreSQL server-side cursor to
          #       materialise lazily; the other is a connection outside
          #       auto-commit, pinned above at
          #       spring.datasource.hikari.auto-commit. Miss either and the JDBC
          #       driver buffers the ENTIRE result set client-side before the
          #       first row is handed over.
          #       (2) Assumptions: the repository methods that stream run inside a
          #       read-only transactional boundary, which is what keeps the second
          #       precondition true for the duration of the walk.
          #       (3) Trade-offs: two hundred trades round trips against the heap
          #       held per open cursor. A much larger figure would cut round trips
          #       but raise the per-cursor high-water mark on a task with a fixed
          #       memory reservation, so two concurrent statement runs would
          #       contend for heap rather than for connections -- and heap
          #       exhaustion kills the task, where connection contention merely
          #       makes a request wait.
          #       (4) Assumptions: THIS VALUE IS NOT A CAP AND MUST NEVER BE READ
          #       AS ONE. It bounds rows in flight per round trip; it does not
          #       bound how many transactions a statement may contain, nor how
          #       many cards a run may cover. service/StatementService.java
          #       carries no fixed arity at all and streams instead of assembling
          #       an in-memory card-grouped table, which is divergence D-2 in
          #       docs/architecture/cobol-to-service-traceability.md.
          #       (5) Assumptions: divergence D-2 involves THREE distinct numbers
          #       in the baseline and they are recorded separately here, because
          #       conflating them is the documented failure. The baseline
          #       app/cbl/CBSTM03A.CBL declares two independent unchecked tables.
          #       512 is the MEASURED inner, same-card bound: one card renders up
          #       to 512 transactions and the 513th overruns the inner table and
          #       faults, marker F-STMT-INNER-OVERFLOW. 51 is the DECLARED and
          #       measured outer, distinct-card bound, from L226
          #       (05 WS-CARD-TBL OCCURS 51 TIMES) with its separate counter table
          #       at L232 (05 WS-TRN-TBL-CTR OCCURS 51 TIMES): 51 distinct cards
          #       render and the 52nd overruns, marker F-STMT-OUTER-OVERFLOW. 10
          #       is MERELY DECLARED, the inner arity at L228
          #       (10 WS-TRAN-TBL OCCURS 10 TIMES), and is not a measured bound at
          #       all. Together those declarations reserve 51 x (16 + 10 x
          #       (16 + 318)) = 171,156 bytes of working storage. tests/README.md
          #       L70 to L82 states the point directly: there is no single
          #       transaction-count limit, because that figure conflates the two
          #       tables, hides the far larger same-card bound and mislabels the
          #       fault as a transaction-count issue when it is two separate table
          #       overruns. The baseline behaves that way and is reference-only;
          #       the target carries no fixed arity; the divergence is documented
          #       in the register named above.
          #       (6) Trade-offs: two hundred was chosen partly so that it is
          #       none of 10, 51 or 512. Any of those three would invite a reader
          #       to take this transport setting for one of the baseline's table
          #       arities, and a value that can be misread as a cap is worse than
          #       one that cannot, whatever it costs in round trips.
          fetch_size: 200

  # WHY : Alternatives Considered: relying on the fact that this module ships no
  #       schema.sql and no data.sql, and leaving this key unset. Rejected
  #       because that absence is enforced by nothing at all -- the framework runs
  #       either file automatically the moment it appears on the classpath, and
  #       this module owns no relational object, so such a file arriving here by
  #       copy from a peer that does own a schema would be executed against a
  #       role holding SELECT-only privileges. Pinning `never` makes that
  #       structurally impossible instead of merely unlikely, and it costs
  #       nothing, because there is no initialisation this module wants.
  sql:
    init:
      mode: never

  # WHY : (1) Assumptions: config/SecurityConfig.java deliberately declares no
  #       decoder bean, no injected value and no issuer literal, so the
  #       framework's auto-configured decoder reads THIS key. That is the whole
  #       reason a user-pool issuer never appears in this module's Java, and it
  #       is why the key is declared here even though nothing in this file reads
  #       it: the binding site is autoconfiguration, not a class in this
  #       repository.
  #       (2) Assumptions: identity comes from validated token claims and from
  #       nowhere else. JwtRoleConverter in com.carddemo.common.security maps the
  #       group claim to authorities. The structure this replaces is the CICS
  #       communication area, which was storage the terminal echoed back, so a
  #       client could in principle assert its own user type; a signed claim
  #       cannot be asserted by the client at all, which makes this a security
  #       correction rather than a like-for-like port.
  #       (3) Assumptions: nothing about the servlet filter chain is declared
  #       here. config/SecurityConfig.java is the settled owner of registering
  #       the shared correlation filter, because filter ORDER is a property of
  #       the chain that defines it, and a registration property here would be a
  #       second place that order could be decided from. This service is
  #       stateless besides -- there is no server-side conversation to keep -- so
  #       no session store, no session timeout and no cookie policy is declared
  #       either.
  #       (4) Assumptions: this key is one half of the token contract and not the
  #       whole of it. It settles WHO signed the token; the three
  #       carddemo.security.jwt keys at the foot of this file settle WHAT KIND of
  #       token it is, WHICH client it was minted for and WHICH scope it carries.
  #       The two halves are one decision recorded in two places because they bind
  #       through different mechanisms -- this one through the framework's own
  #       autoconfiguration, those three through a validator config/SecurityConfig
  #       installs -- and reading either half alone overstates what is checked.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

  # WHY : (1) Assumptions: this list REPLACES the framework's default static
  #       locations rather than adding to them, so all four defaults are restated
  #       and classpath:/openapi/ is appended. Writing only the fifth entry would
  #       silently drop the four the framework serves from, and the loss would
  #       present as unrelated assets 404ing rather than as a configuration error.
  #       (2) Refactoring Rationale: classpath:/openapi/ is here so that
  #       src/main/resources/openapi/reporting-api.yaml -- the contract of record
  #       this module's OpenApiConfig names, and the document ui/src/api/
  #       reporting.ts is written against -- is reachable over HTTP at
  #       /reporting-api.yaml. Before it was added, that file was on the classpath
  #       and served by nothing, so a browser client had no way to read the
  #       contract it was generated from and the swagger-ui selector below would
  #       have resolved to a 404.
  #       (3) Assumptions: this is the same arrangement the card, transaction,
  #       reference and authorization modules use, and it is repeated per module
  #       rather than pushed into the shared defaults deliberately: each module
  #       serves exactly ONE contract and names it by filename in the springdoc
  #       block below, so a shared default would have to serve every contract from
  #       every service and each service would then publish four documents that
  #       describe something else.
  web:
    resources:
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        - classpath:/openapi/

# WHY : (1) Assumptions: the interactive view is served so that the contract of
#       record is readable by a human at the same origin that answers the
#       operations, which is what makes a reachability check on it meaningful.
#       (2) Assumptions: url names the path spring.web.resources.static-locations
#       above resolves openapi/reporting-api.yaml to, so the two move together:
#       remove classpath:/openapi/ from that list and this URL 404s.
#       (3) Assumptions: the bundled sample definition is disabled. Without that,
#       the view offers its own sample in the SAME selector as the contract, so a
#       reader can silently end up studying a document that describes nothing in
#       this service. Disabling it leaves exactly one definition in the selector.
#       (4) Assumptions: the GENERATED document is pinned to the same specification
#       version the authored contract declares, 3.1. The generator defaults to
#       emitting 3.0, and a 3.0 stand-in beside a 3.1 contract reports drift on
#       every single schema that uses a 3.1 construct -- a nullable member written
#       as `oneOf` with `type: 'null'`, of which this contract has six -- so the
#       check the generated document is supposed to provide would be useless noise.
#       (5) Assumptions: keys are written in declaration order rather than sorted,
#       so a diff of two generated documents shows what changed instead of showing
#       a reordering.
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    url: /reporting-api.yaml
    disable-swagger-default-url: true
  writer-with-order-by-keys: true

# WHY : (1) Assumptions: /actuator/health on port 8080 is a deployment contract
#       with two consumers that live outside this repository's Java and that fail
#       in different places, and BOTH of them now request it over HTTPS because
#       the server.ssl block above encrypts the one listener they share with
#       application traffic. The load balancer target group polls it over HTTPS
#       because target_protocol in infra/modules/ecs-service fixes the protocol of
#       the target group and its health check together, and that module validates
#       the value to exactly "HTTPS". This module's container HEALTHCHECK must
#       therefore probe https://127.0.0.1:8080/actuator/health, and it must do so
#       with certificate verification disabled for that loopback hop: the
#       certificate is issued for the task's registered name rather than for the
#       loopback address, so a verifying probe fails against a correctly
#       configured service and the platform replaces a task that is in fact
#       serving. The first consumer decides whether the container is serving and
#       the second decides whether traffic is routed to the task at all, so a
#       probe left on cleartext takes a healthy task out of service rather than
#       reporting a protocol error. There is deliberately NO separate management
#       port and NO relocated base path anywhere in this folder: either one would
#       let those two consumers disagree about liveness, with one reporting the
#       task healthy while the other killed it, and that disagreement presents as
#       a task flapping for no visible reason.
#       (2) Assumptions: the Prometheus scrape endpoint is exposed because
#       micrometer-registry-prometheus is on the classpath at runtime scope for
#       exactly this purpose, and because the three common tags MetricsConfig
#       applies -- service, environment and version -- are only worth applying if
#       something can collect them. The observability module provisions the
#       collector. The endpoint identifier is `prometheus`, which was read off the
#       endpoint annotation in the pinned framework release rather than assumed;
#       that same release publishes no per-endpoint enable or access property for
#       it, so this exposure list is the correct and the only lever, and writing
#       such a property would have bound nothing.
#       (3) Alternatives Considered: enabling the liveness and readiness probe
#       groups additively. Rejected because nothing in this deployment polls
#       them: the two consumers above both poll the aggregate path, and the
#       platform is a container service behind a target group rather than an
#       orchestrator that splits the two signals. Enabling them would publish two
#       further paths with no collector, and an endpoint with no consumer is
#       surface without a purpose. /actuator/health stays available and
#       unrelocated regardless, because the Dockerfile hard-codes it.
#       (4) Assumptions: the exposure list is closed rather than open. Every other
#       endpoint -- environment, configuration properties, loggers, thread dump,
#       heap dump -- stays unexposed, and the reason is specific to this service:
#       its configuration names the datasource, the search path and the token
#       issuer, so an exposed environment endpoint would publish the data-tier
#       topology to anything that could reach the port.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:

      # WHY : Trade-offs: the probe body is reduced to a bare status, giving up
      #       the detail that would help diagnose a failing health check in
      #       exchange for not disclosing the data tier to anything that can
      #       reach the path. With detail on, the payload enumerates the
      #       datasource contributor -- which names the database -- to two
      #       pollers that are both unauthenticated and neither of which reads
      #       anything beyond the status. The development overlay may widen this;
      #       the production overlay does not.
      show-details: never

# WHY : (1) Refactoring Rationale: NO console pattern is declared here, and the
#       one that was declared here has been removed. It was a local copy naming
#       only %X{correlationId}, which left the other three context keys off every
#       line this service logged -- %X{requestId}, the edge identity that joins a
#       service line to its API Gateway access-log record, and the two tracing
#       keys Micrometer contributes. The pattern is single-sourced in
#       carddemo-common-defaults.yml, imported by the spring.config.import above,
#       exactly as the six peer services that already import it do. Two sources for
#       one pattern is how a request ends up rendered two different ways depending
#       on which service logged it, and it is also how a key renamed in
#       CorrelationIdFilter gets renamed in the shared file and missed here --
#       which produces a line with a silently empty field rather than an error.
#       (2) Assumptions: the keys are a contract with that filter and not an
#       internal detail. CorrelationIdFilter in com.carddemo.common.web echoes an
#       inbound X-Correlation-Id header verbatim or mints a fresh identity,
#       publishes it under CORRELATION_ID_MDC_KEY (`correlationId`), publishes the
#       edge identity under REQUEST_ID_MDC_KEY (`requestId`), and clears both in a
#       finally block. The correlation identity is at most twenty-four characters,
#       the declared width of 05 WS-SAVE-CORRELID PIC X(24) at
#       app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl L45, and neither key ever
#       carries a credential -- which is what makes rendering both on every line
#       safe.
#       (3) Alternatives Considered: keeping the local pattern and merely appending
#       the missing key to it. Rejected because it would have fixed the symptom and
#       kept the duplication that caused it, and it would still have omitted the
#       two tracing keys. A logging back-end configuration file in this folder was
#       also considered and must not be added: the framework's own logging plus the
#       shared MetricsConfig cover what this service needs, and a bespoke appender
#       would diverge from the log-group shape the seven peer services produce,
#       which is what makes one query able to span them.
#       (4) Trade-offs: the levels below ARE declared here, because they are
#       genuinely per-service. The root logger sits at WARN and only this project's
#       own package is raised to INFO, so framework start-up narration stays out of
#       a stream billed by ingested volume. What is given up is that narration; what
#       is kept is every line this project's own code emits, which is where a
#       report submission or a failed view read is reported.
logging:
  level:
    root: WARN
    com.carddemo: INFO

carddemo:

  # WHY : (1) Assumptions: these two key names were read out of
  #       com.carddemo.common.observability.MetricsConfig rather than chosen --
  #       it exposes ENVIRONMENT_PROPERTY as `carddemo.environment` and
  #       VERSION_PROPERTY as `carddemo.version`, and turns each into the
  #       `environment` and `version` common tag. A different spelling here would
  #       bind nothing and fail silently, publishing meters that no dashboard
  #       could attribute while the service looked healthy.
  #       (2) Assumptions: each fallback is the literal `unspecified`, which is
  #       the same sentinel MetricsConfig itself falls back to, so the sentinel
  #       has ONE definition rather than two that could drift. The deployment
  #       supplies the real values, and neither is a topology setting the two
  #       profile overlays should differ on structurally.
  #       (3) Alternatives Considered: omitting both keys and relying on the
  #       framework's relaxed binding to map the injected environment variables
  #       onto the property names by itself, which it does. Rejected because the
  #       binding would then be invisible from this document: nothing here would
  #       record that two specific variables feed the metric tags, and the next
  #       reader adding a tag would have no example to follow. Declaring them
  #       changes no resolved value -- an injected variable outranks this file
  #       either way -- and makes the contract legible.
  environment: ${CARDDEMO_ENVIRONMENT:unspecified}
  version: ${CARDDEMO_VERSION:unspecified}

  # WHY : (1) Assumptions: validating the issuer is not validating the token, and
  #       the gap is reachable rather than theoretical. The issuer-uri declared
  #       under spring.security above makes the filter chain verify the signature,
  #       the issuer and the time claims, and that is where its guarantees end. One
  #       user pool mints TWO token kinds from the same signing key: an access
  #       token, whose token_use claim is `access`, and an identity token, whose
  #       token_use claim is `id`. Both are validly signed by the configured
  #       issuer, so without the check below an identity token -- meant to describe
  #       a user to a client and never to authorize an API call -- would be
  #       accepted as authorization here. It is also the token a browser is most
  #       likely to have to hand. In this context the consequence is disclosure
  #       rather than money movement: the endpoints here read statement and report
  #       surfaces spanning the ledger, account and reference schemas, so a request
  #       admitted on the wrong token kind reads customer, account and transaction
  #       detail it was never authorized for.
  #       (2) Assumptions: one pool can hold more than one app client, and a token
  #       minted for a different client of the same pool carries that pool's
  #       issuer. Binding the accepted client identifier closes that, and it is why
  #       the value is a placeholder rather than a literal -- the identifier is an
  #       environment fact supplied by the deployment, not a property of this file.
  #       (3) Alternatives Considered: expressing this through the framework's own
  #       spring.security.oauth2.resourceserver.jwt.audiences key, which is the
  #       obvious declarative route and is wrong here. A Cognito ACCESS token
  #       carries no aud claim at all -- the client identifier travels in client_id
  #       instead -- so an audience validator would reject every access token the
  #       sign-on flow issues while accepting the identity tokens this block exists
  #       to refuse. It would invert the control, which is worse than having no
  #       control, and that is why no audiences key appears anywhere in this file.
  #       (4) Assumptions: these keys are read by config/JwtDecoderConfig.java --
  #       NOT by config/SecurityConfig.java, which this note named until the two
  #       classes were checked against it. This context is the one module whose
  #       decoder lives in its own class, recorded at both ends: SecurityConfig
  #       carries the filter chain and the group mapping and declares no decoder
  #       bean, because a second bean of that type would make which one the
  #       resource server used depend on bean ordering. JwtDecoderConfig installs a
  #       delegating token validator ahead of the group mapping, so a token failing
  #       any of the three never reaches JwtRoleConverter and no authority is
  #       derived from it. The shared kernel's security package owns
  #       the group mapping alone and explicitly no token validation, so the
  #       validator belongs to each service; the property shape is identical in
  #       every service so the eight filter chains cannot diverge in what they
  #       accept.
  #       (5) Trade-offs: required-scope names the scope the pool grants to a token
  #       obtained through its own authentication API rather than a custom
  #       resource-server scope. Custom scopes are granted only through the OAuth
  #       flows this design does not use, so requiring one would reject every token
  #       the sign-on flow can produce. What the value still buys is decisive: an
  #       identity token carries no scope claim whatsoever, so requiring any scope
  #       at all is a second, independent rejection of the wrong token kind, and it
  #       is the same claim the API Gateway route authorization scopes assert at the
  #       edge -- so edge and service agree rather than each guessing.
  security:
    jwt:
      expected-token-use: access
      expected-client-id: ${CARDDEMO_SECURITY_JWT_EXPECTED_CLIENT_ID}
      required-scope: aws.cognito.signin.user.admin

    # WHY : Assumptions: the two group names are declared here, in the same shape
    #       every other context declares them, and are read by
    #       config/SecurityConfig.java -- which hands them to the shared
    #       JwtRoleConverter. The converter compares each against its own compiled
    #       constant and refuses to start on a mismatch, so this pair is what turns
    #       a user pool whose groups were renamed into a startup failure instead of
    #       a service that authenticates every request and authorizes none.
    #       Trade-offs: the fallbacks are the two names infra/modules/cognito fixes
    #       as non-overridable, so a local run needs no environment at all, while a
    #       deployment that renames a group sets the variables and fails fast if the
    #       new name and the compiled constant disagree. A no-default form was
    #       considered and rejected here specifically: unlike the client id, which
    #       is deployment-specific and must never be guessed, these two names are
    #       part of the application's own authorization vocabulary and a wrong value
    #       is caught by the converter rather than being silently accepted.
    cognito:
      admin-group-name: ${CARDDEMO_COGNITO_ADMIN_GROUP_NAME:carddemo-admin}
      user-group-name: ${CARDDEMO_COGNITO_USER_GROUP_NAME:carddemo-user}

  # Two properties are deliberately NOT declared in this file and are documented here instead,
  # because api/ReportController.java takes CursorToken as a constructor argument and a
  # bean that is not published cannot be injected:
  #
  #   carddemo.pagination.cursor.signing-key   base64 key material, at least 32 bytes
  #   carddemo.pagination.cursor.lifetime      ISO-8601 duration, defaulting to PT15M
  #
  # CardDemoCommonAutoConfiguration publishes one CursorToken bean and publishes it only when the
  # first property is set, so supplying it IS the wiring. The deployment supplies it from the
  # purpose-scoped secret both Terraform roots create, as the environment variable
  # CARDDEMO_PAGINATION_CURSOR_SIGNING_KEY -- Spring Boot's relaxed binding maps that spelling onto
  # the hyphenated property name, which CardDemoCommonAutoConfigurationIT asserts rather than
  # assumes. infra/modules/ecs-service lists the name in required_secret_environment_names for this
  # service and asserts biconditionally that exactly the list-publishing services receive it,
  # so a deployment that omits it fails at plan rather than at container start.
  # Trade-offs: no key is written here even as an environment placeholder, and the second half of
  #   that is the part worth stating. A literal default would be a signing key committed to source,
  #   and any deployment failing to override it would accept keyset cursors minted by anyone holding
  #   this repository. A placeholder with no default is no better: the property then EXISTS and
  #   resolves during condition evaluation, so every context that merely imports the
  #   auto-configuration fails on an unresolvable placeholder rather than simply doing without the
  #   sealer -- which would break every repository integration test in this module, none of which
  #   pages anything. Leaving the property absent withholds the bean cleanly, and a deployed task
  #   that omits the variable still fails at startup, because the components named above require it.
  #   This matches services/transaction-service/src/main/resources/application.yml, which reached the
  #   same conclusion first; the reasoning is repeated rather than cross-referenced because a reader
  #   of this file would otherwise see an undeclared property and add the placeholder that breaks it.

  reporting:

    step-functions:

      # WHY : (1) Refactoring Rationale: this replaces the baseline's ad hoc
      #       submission path, and the accurate account of what was wrong with it
      #       is subtler than the obvious one, so both halves are stated rather
      #       than collapsed into one. app/csd/CARDDEMO.CSD defines the submission
      #       queue at L499 to L505 -- DEFINE TDQUEUE(JOBS) at L499, described
      #       "SUBMIT JOBS FROM CICS" at L500 -- and L501 carries
      #       TYPE(EXTRA) DATABUFFERS(1) DDNAME(INREADER) ERROROPTION(IGNORE),
      #       with RECORDSIZE(80) at L502 and DISPOSITION(MOD) at L503. The first
      #       half: ERROROPTION(IGNORE) is what makes CICS ITSELF swallow an
      #       extrapartition I/O error, so a request could be accepted at the
      #       screen and never reach the job entry subsystem with nothing
      #       recording the loss. The second half, and it is a DIFFERENT
      #       statement: the program app/cbl/CORPT00C.cbl DOES check the response
      #       code and DOES carry its own failure message,
      #       'Unable to Write TDQ (JOBS)...' at L531 -- the program is not
      #       negligent. It is the queue definition that makes the region ignore
      #       the condition the program stands ready to report. The replacement
      #       answers that directly: starting a state machine execution accepts
      #       typed input rather than eighty-byte card images, returns an execution
      #       identifier that makes the run observable and addressable afterwards,
      #       and raises an error instead of discarding one -- so a failed
      #       submission can no longer be lost silently. The baseline path is
      #       neither disparaged nor retired by any of this: the migration adds a
      #       path, it does not remove one.
      #       (2) Assumptions: the value arrives as an environment variable the
      #       task definition resolves from Parameter Store, and no resource
      #       identifier literal appears in this file. It carries no fallback, for
      #       the same reason the datasource triple carries none: a reporting
      #       service that starts without knowing what to submit to would accept
      #       requests it could never fulfil.
      state-machine-arn: ${CARDDEMO_REPORTING_STEP_FUNCTIONS_STATE_MACHINE_ARN}

      # WHY : Alternatives Considered: leaving the software development kit's own
      #       default in place, which leaves the overall per-call ceiling unset
      #       and bounds only the socket and connect phases. Rejected because the
      #       call is made on a request thread with a browser waiting on the other
      #       end, so an unbounded call is a request that neither completes nor
      #       reports -- which would reproduce in the target exactly the silence
      #       that ERROROPTION(IGNORE) produced in the baseline, and the whole
      #       point of the transport change above is that a submission fails
      #       loudly. A bounded ceiling is the mechanism available: a circuit
      #       breaker is out of scope and no resilience library is on this
      #       classpath, so explicit timeouts are what stands in for one. Ten
      #       seconds is generous for a single control-plane call and still short
      #       enough that the caller learns of the failure rather than waiting on
      #       a connection that has already stopped progressing.
      api-call-timeout: 10s

    s3:

      # WHY : Assumptions: this arrives as an environment variable resolved from
      #       Parameter Store, and no bucket name and no storage hostname appears
      #       in this file. It carries no fallback deliberately: a default would
      #       let a task start and then fail only at the moment a report was
      #       finally produced, which moves the error from start-up, where it is
      #       obvious, to the end of a long run, where the work is already done
      #       and lost.
      output-bucket: ${CARDDEMO_REPORTING_S3_OUTPUT_BUCKET}

      # WHY : (1) Assumptions: a rerun REPLACES its prior output and never appends
      #       to it, and that is inherited from the baseline rather than invented.
      #       app/jcl/CREASTMT.JCL is explicitly idempotent about its own outputs:
      #       STEP030 at L66 runs IEFBR14 over both of them with
      #       DISP=(MOD,DELETE,DELETE) -- HTMLFILE at L67 to L71 and STMTFILE at
      #       L72 to L75 -- and only then does STEP040 at L79 allocate both fresh
      #       with DISP=(NEW,CATLG,DELETE). Delete-then-allocate is replace
      #       semantics, and on object storage a write to an existing key
      #       reproduces it exactly, so a deterministic key is what carries the
      #       behaviour across.
      #       (2) Alternatives Considered: a timestamped or generation-suffixed
      #       key, which is the usual instinct for object storage and is wrong
      #       here. Rejected because it silently converts a rerun into an append:
      #       two runs of the same report over the same date range would both
      #       persist under one logical report, nothing in the key would say which
      #       one a reader should trust, and the divergent artifacts would
      #       accumulate indefinitely. Generation retention belongs to the
      #       nightly dataset families, which are a different concern owned
      #       elsewhere, and borrowing their shape here would contradict the
      #       delete-then-allocate contract above.
      #       (3) Assumptions: the prefixes are literals rather than placeholders
      #       because a key layout inside a bucket is neither a credential nor a
      #       topology setting, so it belongs in the base document where both
      #       profile overlays inherit one layout and artifacts stay at the same
      #       place in every environment.
      #       (4) Assumptions: this value is only the PREFIX. Everything that
      #       distinguishes one report from another is appended below it by
      #       ReportArtifactPublisher as further partitions -- dt= for the run
      #       date, type= for the report type and from=/to= for the two range
      #       bounds -- so "the same report over the same date range" in (2) means
      #       the same type over the same bounds and nothing else. An earlier
      #       revision appended only the run date, which made the nightly report
      #       and any requested period ending on that date share one key.
      report-prefix: reports/transaction-detail/
      statement-prefix: statements/

      # WHY : (1) Purpose: the category-balance report app/jcl/PRTCATBL.jcl
      #       produces gets its own prefix rather than a partition under the
      #       transaction report's, because the two are different reports with
      #       different record lengths -- 40 bytes at PRTCATBL.jcl:61 against 133
      #       at TRANREPT.jcl:78 -- and a fixed-width consumer reading one prefix
      #       must find one width under it.
      #       (2) Assumptions: the key beneath this prefix is FIXED and carries no
      #       date or generation partition, because the reference deletes and
      #       recreates one dataset: its DELDEF step at PRTCATBL.jcl:21-25 removes
      #       AWS.M2.CARDDEMO.TCATBALF.REPT with DISP=(MOD,DELETE) and STEP10R
      #       recreates it with DISP=(NEW,CATLG,DELETE) at :59. Bucket versioning
      #       expresses that pair as a new current version over the same key, which
      #       is the same delete-then-allocate contract the statement prefix above
      #       relies on and is strictly more recoverable than the reference, which
      #       retained nothing of the deleted copy.
      #       (3) Alternatives Considered: writing this report into the tranrept
      #       generation family beside the transaction report. Rejected because
      #       TCATBALF.REPT has NO generation base anywhere in the baseline -- an
      #       exhaustive search for DEFINE GENERATIONDATAGROUP matches only
      #       app/jcl/DEFGDGB.jcl, DEFGDGD.jcl, DALYREJS.jcl and REPTFILE.jcl and
      #       none of them defines it -- so treating it as a generation would
      #       invent a retention contract the baseline never had for it.
      category-balance-prefix: reports/category-balance/

    artifact:

      # WHY : (1) Purpose: a per-request statement artifact is stored under a key
      #       that has to name WHICH statement it is, and the obvious key names it
      #       with the account identifier and the card number's last four digits.
      #       That is the defect this key exists to remove: an object key is
      #       metadata, it appears in a bucket listing, in an access log, in a
      #       lifecycle report and in a storage-inventory export, and every one of
      #       those surfaces is read by principals who are not entitled to the
      #       cardholder data the artifact holds. Listing a prefix would enumerate
      #       the portfolio without a single object ever being read. The key is
      #       therefore derived through common-lib's OpaqueIdentifier, which emits
      #       a twenty-two character token, and the account identifier and the
      #       masked tail appear nowhere in it.
      #       (2) Alternatives Considered: an unkeyed digest of the same inputs, or
      #       a keyed digest with a published salt. Both rejected for the same
      #       reason the queue group identity in the authorization context rejects
      #       them: an account identifier is an eleven-digit number and a masked
      #       tail is four digits, so the candidate space is small enough to
      #       enumerate, and anyone holding a listing could confirm which account
      #       produced which object. Only a secret key makes the token
      #       unconfirmable, which is the entire property being bought.
      #       (3) Alternatives Considered: a random token recorded in a lookup
      #       table. Rejected because it makes the key unreproducible: a rerun
      #       would store a second artifact rather than replacing the first, which
      #       contradicts the delete-then-allocate replace semantics the
      #       statement-prefix block above inherits from CREASTMT.JCL L66. A keyed
      #       derivation is deterministic, so the same request writes the same key
      #       and a rerun replaces.
      #       (4) Assumptions: this is a DIFFERENT secret from the pagination
      #       cursor signing key and from the authorization context's messaging
      #       key. The three have different holders and different trust purposes,
      #       so sharing one value would let a holder of any of them compute the
      #       others' tokens and would make rotating one require stopping all
      #       three.
      #       (5) Assumptions: the value arrives as a container secret from the
      #       deployment's secret store, in base64 or as raw text, and it is never
      #       a literal in this file or in any tfvars file. It carries no fallback:
      #       config/ArtifactIdentityConfig.java refuses a blank value at start-up
      #       and refuses anything shorter than the tokeniser's minimum key length,
      #       because a default would publish real cardholder metadata under a key
      #       every deployment could reproduce.
      hmac-key: ${CARDDEMO_REPORTING_ARTIFACT_HMAC_KEY}
