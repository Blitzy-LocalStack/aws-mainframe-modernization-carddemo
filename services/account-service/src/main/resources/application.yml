# =============================================================================
# services/account-service/src/main/resources/application.yml
# -----------------------------------------------------------------------------
# Purpose:
#   Base runtime configuration for the CardDemo account-service, the bounded
#   context that owns the account master, the customer master and the card
#   cross-reference. This file is the property-key contract for the whole
#   module: the configuration classes under com.carddemo.account.config bind
#   against the keys declared here, and application-dev.yml and
#   application-prod.yml override the VALUES of these keys without adding a
#   key, removing a key, or changing the shape of one.
#
#   The behaviour being configured comes from six programs and three record
#   layouts, all of which are REFERENCE ONLY and are never modified:
#   app/cbl/COACTVWC.cbl (account view), app/cbl/COACTUPC.cbl (account update),
#   app/cbl/CBACT01C.cbl (sequential account read), app/cbl/CBACT03C.cbl
#   (cross-reference read), app/cbl/CBCUS01C.cbl (customer read) and
#   app/app-vsam-mq/cbl/COACCT01.cbl (the request/reply account inquiry); and
#   app/cpy/CVACT01Y.cpy (the 300-byte account record), app/cpy/CVCUS01Y.cpy
#   (the 500-byte customer record) and app/cpy/CVACT03Y.cpy (the 50-byte card
#   cross-reference record), from which THREE of this module's four tables are
#   derived. The fourth, account.inquiry_reply_ledger, derives from no copybook: it
#   is the duplicate-reply claim the inquiry consumer keeps, created by the second
#   migration named below.
#
#   The artifacts this file's keys depend on, stated once here rather than
#   repeated at every key that names one of them. Every one of them EXISTS, so no
#   key in this file is anticipatory and none is a placeholder for a component yet
#   to be written:
#     - AccountApplication.java, the Spring Boot entry point, so the keys below
#       are read by a context that actually starts.
#     - config/SecurityConfig.java, which binds five of the keys declared
#       below: spring.security.oauth2.resourceserver.jwt.issuer-uri, the three
#       carddemo.security.jwt.* keys, and the two carddemo.security.cognito.*
#       group names. An absent value fails this module's context refresh.
#     - db/migration/V1__account.sql, the FIRST of the two Flyway migrations this
#       module owns, creating account.accounts, account.customers and
#       account.card_xref and the idx_card_xref_account_id index, and creating no
#       schema.
#     - db/migration/V2__account_inquiry_reply_ledger.sql, the second, creating
#       account.inquiry_reply_ledger and idx_inquiry_reply_ledger_claimed_at and
#       altering nothing that exists. Refactoring Rationale: it is a separate
#       version rather than an edit to V1 because Flyway checksums an applied
#       migration and refuses a changed one, so folding it in would have been
#       unable to reach any database V1 had already run against.
#     - domain/{Account,Customer,CardXref}.java, the three entities that
#       migration is checked against at startup; see ddl-auto below.
#     - openapi/account-api.yaml, the hand-authored OpenAPI 3.1 contract of
#       record, and the three controllers under api/ that answer its operations.
#     - service/InquiryMessageListener.java, the SQS consumer that replaces
#       COACCT01's MQGET/MQPUT pair. It binds request-queue-url through its
#       @SqsListener annotation and reply-queue-url and error-queue-url through
#       constructor @Value parameters that carry no default and refuse a blank.
#     - service/AddressValidationService.java, which reads no property at all -
#       its allow-lists come from app/cpy/CSLKPCDY.cpy by way of
#       reference-service, not from configuration - together with
#       service/RestReferenceAddressLookup.java, the @Component that satisfies
#       its nested ReferenceAddressLookup port.
#
# Assumptions: the inventory above is a MEASUREMENT of the module and every
#   artifact it names is present, which is what makes the keys below readable as
#   live wiring. A header that under-reported it would cause exactly the
#   misreadings it exists to prevent: a reader would size the deployment's
#   required-variable list from the shorter list, and would take the springdoc keys
#   to be publishing an empty document and the Flyway location to be resolving to
#   nothing.
#
#   Every key below is declared deliberately: these are the decisions a
#   module author needs settled BEFORE writing the first class, and a schema
#   search path or a migration location retrofitted afterwards is exactly how a
#   service ends up applying another context's migration into its own schema.
#
#   Documentation convention: docs/CODE_DOCUMENTATION_STANDARD.md. YAML has no
#   docstring construct, so this header block is the module-entry-point
#   equivalent, and every non-obvious key below carries an adjacent rationale
#   naming at least one of Alternatives Considered, Refactoring Rationale,
#   Assumptions or Trade-offs, as the project's single user-specified rule
#   requires. Assumptions: no linter in this project reads this file --
#   config/checkstyle/checkstyle.xml narrows itself to fileExtensions="java" at
#   its L209, and that standard records the same limit for YAML -- so the
#   obligation rests on the written standard and on review. No comment in this
#   file claims a gate enforces something it does not.
#
# Parameters:
#   Environment variables this configuration consumes. They are listed by name
#   only. No value for any of them appears in this file, in either profile that
#   overrides it, or anywhere else in this repository.
#
#   SPRING_PROFILES_ACTIVE
#     String. Selects application-dev.yml or application-prod.yml. Deliberately
#     not baked into the container image, so one built image serves both
#     environments and the environment is chosen at task launch.
#   SPRING_DATASOURCE_URL
#     String. Connection string for the Aurora cluster writer endpoint.
#   SPRING_DATASOURCE_USERNAME
#     String. The database role this service authenticates as, which is
#     carddemo_account - the runtime role for the account schema created by
#     data-migration/sql/V0__schemas_and_roles.sql at its L502-L503.
#   SPRING_DATASOURCE_PASSWORD
#     String. The credential for that role, injected from the managed
#     credential store named in the notes on spring.datasource below.
#   SPRING_FLYWAY_USER
#   SPRING_FLYWAY_PASSWORD
#     Strings. The migration role and its credential, kept separate from the
#     runtime pair above so the table OWNER is not the role that reads them.
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
#     String. The user-pool issuer whose tokens this resource server validates.
#   CARDDEMO_SECURITY_JWT_EXPECTED_CLIENT_ID
#     String. The single app client whose tokens this service accepts. Read by
#     config/SecurityConfig.java. No fallback, for the reason recorded on it.
#   CARDDEMO_COGNITO_ADMIN_GROUP_NAME
#   CARDDEMO_COGNITO_USER_GROUP_NAME
#     Strings. Optional overrides of the two group names. Both default to the
#     names infra/modules/cognito fixes, so a local run needs neither.
#   CARDDEMO_SECURITY_CUSTOMER_IDENTIFIER_KEY_ID
#     String. The managed key ALIAS - not key material - that the customer
#     national and government-issued identifier columns are encrypted under.
#   CARDDEMO_INTERNAL_IDENTITY_AUTHORIZATION_SIGNING_KEY
#   CARDDEMO_INTERNAL_IDENTITY_TRANSACTION_SIGNING_KEY
#     Strings. KEY MATERIAL, one symmetric secret per calling service, verified
#     by config/InternalApiSecurityConfig.java. Neither carries a default.
#   CARDDEMO_REFERENCE_CONTEXT_BASE_URL
#     String. In-VPC address of reference-service, which owns the three address
#     allow-list tables this service validates against.
#   CARDDEMO_SERVER_TLS_KEYSTORE
#   CARDDEMO_SERVER_TLS_KEYSTORE_PASSWORD
#   CARDDEMO_SERVER_TLS_KEY_ALIAS
#     The listener keystore location, its password and its alias. All three are
#     exported by the image entry point, which mints this TASK's own key pair and
#     self-signed certificate into a PKCS#12 keystore on the task's encrypted
#     ephemeral volume before the JVM starts. Only the password has no default,
#     so only it is required, and none of the three is a deployment input: no
#     listener key reaches Terraform state, Secrets Manager, a task definition or
#     an image layer, and no two tasks share one.
#   CARDDEMO_DB_SSL_ROOT_CERT
#     String. Optional path override for the certificate bundle the JDBC driver
#     verifies the cluster against. Defaults to the path the service image
#     places the managed bundle at.
#   AWS_REGION
#     String. The deployment region. Required to START, not merely to reach
#     AWS; see the note on spring.cloud.aws.region.
#   CARDDEMO_ENVIRONMENT
#     String. The environment label. Consumed by the shared defaults document
#     this file imports, and by the Parameter Store prefix both profiles build.
#   CARDDEMO_ACCOUNT_INQUIRY_REQUEST_QUEUE_URL
#   CARDDEMO_ACCOUNT_INQUIRY_REPLY_QUEUE_URL
#   CARDDEMO_ACCOUNT_INQUIRY_ERROR_QUEUE_URL
#     Strings. The three SQS queue names replacing COACCT01's queue triple.
#   SERVER_PORT
#     Integer. Overrides the listen port. The value declared below is the
#     contract the image and the load balancer are built against, so an
#     override has to be made in all three places at once.
#   MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
#     Comma-separated string. Widens or narrows the actuator surface. This is an
#     environment-variable override and NOT one of the four profile axes listed
#     in the closing block: neither profile restates the exposure list, so the
#     three endpoints named below answer in every environment unless an operator
#     sets this variable deliberately.
#
# Return values:
#   The effective Environment handed to the Spring application context, and
#   nothing else. This file returns no value to application code; its output is
#   the resolved Environment that the configuration classes then read. That
#   Environment yields: one TLS listener on the port below; one pooled
#   DataSource whose every connection has its schema search path pinned to
#   account and requires fully verified TLS; a Flyway run that applies
#   db/migration/V1__account.sql and then
#   db/migration/V2__account_inquiry_reply_ledger.sql into that schema, in version
#   order, before the JPA EntityManagerFactory is built; a JWT resource-server configuration whose
#   decoder additionally enforces the three Cognito claim checks; an SQS client
#   serving service/InquiryMessageListener.java, which consumes the request queue
#   named below and publishes its fixed-width reply to the reply queue; an
#   actuator surface answering GET /actuator/health, /actuator/info and the
#   metrics scrape path; the served OpenAPI 3.1 document at
#   openapi/account-api.yaml; and the base log levels the two profiles adjust.
#
# WHY : Refactoring Rationale: three clauses above carried a "once ... lands"
#   qualifier and all three have landed. Both migrations exist -- V1__account.sql
#   creating the three copybook-derived tables and
#   V2__account_inquiry_reply_ledger.sql creating the reply ledger, four in total; the contract document exists and
#   publishes eleven operations; and the queue listener exists, so the SQS client
#   is not merely "able to serve" one. The qualifiers are removed rather than
#   left as harmless surplus, because each of them told a reader that a startup
#   step would be SKIPPED -- so a reader debugging a Flyway or a listener failure
#   would have ruled out the very step that had failed.
#
# Exceptions or errors:
#   Startup failure modes a reader will actually meet, in the order the context
#   reaches them.
#
#   1. Unresolved placeholder. SIXTEEN of the variables above are required, and
#      they are exactly the sixteen written as a bare placeholder below: the
#      three datasource variables, the two migration-role variables, the issuer
#      URI, the expected client id, the customer-identifier key alias, the two
#      internal-identity signing keys, the three queue names, the reference
#      context base URL, the listener keystore password, and the region. Any one
#      of them being unset aborts context refresh with IllegalArgumentException
#      "Could not resolve placeholder", naming it. The rest are optional
#      overrides Spring binds when present, so an unset one changes nothing.
#   2. Rejected claim configuration. config/SecurityConfig.java validates its
#      own inputs before it builds a decoder: a carddemo.security.jwt.
#      expected-token-use other than "access", or a blank expected client id,
#      raises IllegalStateException naming the key. A blank value that resolved
#      would silently disable the corresponding check, which is why the class
#      refuses it rather than accepting it.
#   3. Missing region. The SQS client bean cannot be built without a region, so
#      a context with no AWS_REGION fails before any listener can start. WHY :
#      Refactoring Rationale: this entry used to add "even though this module
#      sends no message today", which is no longer true --
#      service/InquiryMessageListener.java publishes a reply on every request it
#      consumes, so the client is on the request path rather than merely
#      constructed. The correction matters because the old wording implied the
#      region requirement was incidental, which invited an operator to leave it
#      unset in a local run and meet the failure at the first inquiry instead of
#      at startup.
#   4. Unreachable database. HikariCP abandons the first connection attempt
#      after connection-timeout and the context fails to start, rather than the
#      task going healthy and then failing every read it is sent.
#   5. Migration that cannot apply. FlywayException aborts startup. The three
#      realistic causes are a checksum mismatch on an already-applied migration --
#      either of the two, and V2 is the one a reader is likelier to have edited --
#      the migration role lacking CREATE on the account
#      schema, and an account schema that already holds objects but has no
#      Flyway history table, which fails rather than silently baselining.
#   6. Absent or unreachable issuer. The resource server resolves the issuer's
#      signing keys during startup, so a wrong or unreachable issuer fails the
#      context instead of producing a service that rejects every token it is
#      ever presented.
#
# WHY : Refactoring Rationale: this list is an INDEX of the non-obvious decisions
#      below, each anchored to the key that records it in full, and every entry now
#      carries the rationale category it belongs to. It previously carried none, so
#      a reader could not tell an assumption from an accepted cost from a rejected
#      alternative without opening the key each entry points at - which is exactly
#      what an index exists to spare them - and a literal search for a category
#      found the anchor sites while missing the summary that introduces them.
#   1. Assumptions: Flyway migrates the account schema and is deliberately NOT
#      permitted to create it: data-migration/sql/V0__schemas_and_roles.sql is the
#      exclusive authority for schemas, roles and grants, and its completion is a
#      precondition of this service starting. Recorded on
#      spring.flyway.create-schemas.
#   2. Trade-offs: GET /actuator/health is at a single unchanging path and is not
#      token-protected, because the two things that poll it cannot present a
#      token. Recorded on management.endpoints.web.
#   3. Assumptions: port 8080 is a contract with the container image and with the
#      security groups, not a local preference. Recorded on server.port.
#   4. Assumptions: Hibernate never emits DDL. Three characteristics these three
#      tables genuinely need - the encrypted columns, the optimistic-locking
#      version columns, and the secondary index replacing the CXACAIX alternate
#      index - cannot be derived from a JPA entity. Recorded on
#      spring.jpa.hibernate.ddl-auto.
#   5. Assumptions: every pooled connection pins its schema search path to the one
#      schema this context owns. Recorded on
#      spring.datasource.hikari.connection-init-sql.
#   5a. Assumptions: every pooled connection also requires fully verified TLS,
#      declared as driver properties rather than trusted to the injected URL, which
#      matters here because the rows behind this pool carry the encrypted national
#      identifier and government-issued identifier columns. Recorded on
#      spring.datasource.hikari.data-source-properties.
#   6. Trade-offs: everything environment-specific is an unresolved placeholder
#      with no fallback value, so absent configuration fails fast instead of
#      starting against the wrong environment. Recorded on spring.datasource.
#   7. Alternatives Considered: this context runs NO transactional outbox, which is
#      the exact opposite of authorization-service, and the difference is drawn
#      from the baseline rather than from preference. It DOES run a durable reply
#      CLAIM, in account.inquiry_reply_ledger, and the two are not the same
#      mechanism: an outbox guarantees a reply exists for every committed decision,
#      which this exchange does not need because its read commits nothing, while a
#      claim guarantees one reply is not sent twice after a redelivery. Recorded on
#      carddemo.account.inquiry.
#   8. Assumptions: the property SHAPES in this file are identical in every
#      environment; the two profiles vary values along four axes and no others.
#      Recorded in the closing block at the end of the file.
# =============================================================================

# -----------------------------------------------------------------------------
# Assumptions: (1) every value in this block is read by something built outside
#       this repository tree - the container image, the load balancer target
#       group, or the JDK's TLS stack - so none of them is free to change on its
#       own; (2) they are grouped first because everything below them is reached
#       through this listener.
# -----------------------------------------------------------------------------
server:

  # Assumptions: 8080 is a three-way contract and not a preference. The
  #   HEALTHCHECK and EXPOSE instructions in services/account-service/Dockerfile
  #   name it, the load-balancer target group forwards to it, and the security
  #   group permits load-balancer-to-application traffic on exactly this port.
  #   Changing it here alone produces a task that listens where nothing polls.
  #
  # Assumptions: a port above 1024 is required rather than conventional. The
  #   image runs as a non-root user, and a non-root process cannot bind a port
  #   below 1024, so 80 or 443 would fail at bind time inside the container and
  #   the task would never reach a listening state.
  port: 8080

  ssl:
    # WHY : (1) Assumptions: this block is not optional and is not a hardening
    #       extra. infra/modules/ecs-service constrains the target protocol to
    #       the single value HTTPS, and that one variable sets the protocol of
    #       both the target group and its health check. A task serving cleartext
    #       therefore has every probe arrive over TLS against a listener that
    #       cannot complete a handshake: the task never turns healthy, is
    #       deregistered, and is replaced, while the process itself looks fine in
    #       its own logs.
    #       (2) Alternatives Considered: terminating TLS at the load balancer and
    #       leaving this hop cleartext, which is the more common shape. Rejected
    #       because what crosses the private application subnets on this hop is
    #       the bearer token in the Authorization header together with account
    #       and customer records - including the masked national identifier and
    #       the postal address. Being inside a VPC bounds who can observe that
    #       traffic; it does not make the traffic unreadable, and the design
    #       requires encryption in transit end to end rather than up to the edge.
    #       (3) Assumptions: the port does NOT change with the scheme. 8080 is
    #       pinned by the Dockerfile's EXPOSE and by the security group above, so
    #       this encrypts the existing listener in place rather than moving it to
    #       8443. Renumbering would require both of those artifacts to change in
    #       the same commit; the number carries no meaning beyond agreement
    #       between them.
    enabled: true

    # WHY : Refactoring Rationale: these four properties replace a
    #       `certificate` / `certificate-private-key` pair that read PEM CONTENT
    #       from two environment variables injected from Secrets Manager. The
    #       comment that stood here claimed the material was "not stored in the
    #       task definition, in Terraform state or in plan output"; the first and
    #       last were true and the middle one was FALSE. The pair was produced by
    #       a managed `tls_private_key` resource in each environment root, so the
    #       private key was written to Terraform state, and the SAME key was then
    #       copied into two Secrets Manager entries and injected into every online
    #       task -- one key for all eight services, held by anyone who could read
    #       the state file. The claim is withdrawn and the mechanism is changed
    #       rather than the sentence rewritten.
    # WHY : Assumptions: the keystore is minted by THIS TASK at startup, by
    #       config/docker/generate-listener-material.sh, which is the image's
    #       entry point. It draws a fresh 2048-bit RSA key and a self-signed leaf
    #       with keytool, writes them mode 0600 on the task's own encrypted
    #       ephemeral volume, exports the three placeholders below, and then
    #       `exec`s the JVM. No key is expressible in source, reaches Terraform
    #       state, reaches Secrets Manager, or is shared by two tasks. That
    #       script's header records the three alternatives measured and rejected,
    #       including why an ephemeral `tls_private_key` cannot be used here.
    # WHY : Assumptions: an Application Load Balancer does NOT validate the
    #       certificate a target in an HTTPS target group presents, so a per-task
    #       self-signed leaf is accepted at that hop exactly as the previous
    #       shared self-signed leaf was. The certificate that IS verified -- the
    #       one API Gateway checks against `server_name_to_verify` -- belongs to
    #       the load balancer's own listener and is the operator-supplied ACM
    #       certificate, which this change does not touch.
    # WHY : Alternatives Considered: keeping PEM properties and having the script
    #       write cert.pem and key.pem for `file:` locations, which these
    #       properties also accept. Rejected on a measured limitation rather than
    #       a preference: keytool exports a certificate as PEM but cannot export a
    #       private key at all, so a PEM pair would need openssl, which is absent
    #       from the pinned runtime digest. PKCS#12 is the one format the tooling
    #       already in the image can produce.
    # WHY : Trade-offs: `key-store` and `key-alias` carry defaults matching what
    #       the script writes, so a local `java -jar` run against a hand-made
    #       keystore needs only the password. `key-store-password` deliberately
    #       carries NO default: a literal here would read as a committed secret to
    #       every reader and to the repository's secret scanner, and an absent
    #       password must stop startup rather than fall back to cleartext, which
    #       would present as a healthy service that had quietly stopped meeting
    #       the requirement this block exists for.
    key-store: ${CARDDEMO_SERVER_TLS_KEYSTORE:file:/tmp/carddemo-tls/listener.p12}
    key-store-type: PKCS12
    key-store-password: ${CARDDEMO_SERVER_TLS_KEYSTORE_PASSWORD}
    key-alias: ${CARDDEMO_SERVER_TLS_KEY_ALIAS:carddemo-listener}

    # Assumptions: the two versions are named rather than left to the JDK
    #   default, which on some distributions still negotiates TLS 1.1 and 1.0.
    #   Both are withdrawn and have practical attacks against them. Naming 1.2
    #   and 1.3 holds the same floor the alb module pins on its listener, so one
    #   floor applies at every hop instead of each module choosing its own.
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3

  # Assumptions: this service is to consume an SQS queue, so a task being
  #   replaced may hold an in-flight inquiry whose reply has not yet been
  #   published. Graceful shutdown lets the listener finish the message it holds
  #   instead of the task dying mid-handler, which would leave the request to
  #   reappear after the visibility timeout and be answered twice. The setting
  #   is declared now rather than with the listener because it also bounds the
  #   in-flight HTTP requests this module already serves.
  shutdown: graceful

spring:

  application:
    # Assumptions: this string must equal the Maven artifactId in
    #   services/account-service/pom.xml character for character, because two
    #   things downstream derive from it rather than from the module directory.
    #   common-lib's com.carddemo.common.observability.MetricsConfig reads
    #   spring.application.name and publishes it as the service common tag on
    #   every metric, and the log group each task writes to is named from the
    #   same value. A mismatch does not fail anything - it splits one deployable
    #   into two identities, so a dashboard grouping by service shows a gap where
    #   this module should be and an alarm aggregating over that tag quietly
    #   stops covering it.
    name: account-service

  config:
    # WHY : (1) Assumptions: the shared defaults document is imported FIRST and
    #       from the classpath. It carries the ONE console log pattern that renders
    #       the four mapped-diagnostic-context keys -- the correlation and edge
    #       identities CorrelationIdFilter publishes and the two tracing keys
    #       Micrometer contributes -- so without this import every line this
    #       service logged would omit the values that tie a request to its caller
    #       and to its trace. It is listed first so anything the parameter store
    #       publishes still outranks it.
    #       (2) Assumptions: both remote locations carry the `optional:` prefix,
    #       and that prefix is what makes profile-free and offline start-up real
    #       rather than aspirational. Without it an unreachable control plane -- a
    #       developer machine with no credentials, a task whose endpoint policy is
    #       still settling -- is a hard start-up failure instead of a start that
    #       falls through to the injected environment variables this document
    #       already reads. The two starters that resolve them are on the classpath
    #       for exactly this: services/account-service/pom.xml declares the
    #       parameter-store and the secrets-manager starter, and the two services
    #       that also declare them both import their locations, so this module
    #       follows a pattern rather than inventing one.
    #       (3) Assumptions: the path segments match what the roots actually
    #       create. infra/envs/dev/main.tf names each parameter
    #       ${parameter_prefix}/${environment}/${service}/${variable} with
    #       parameter_prefix = "/carddemo", so the prefix below resolves to exactly
    #       the namespace this service's own parameters live in. A path missing the
    #       environment segment would resolve, find nothing, and -- because the
    #       import is optional -- say nothing about it.
    #       (4) Trade-offs: the environment label is the one placeholder in this
    #       file that carries a default. It needs one because an unresolved
    #       placeholder inside this key aborts the earliest configuration-loading
    #       phase, before `optional:` can take effect; a label that always resolves
    #       keeps that phase survivable off-platform while every VALUE imported
    #       through the prefix still has no fallback. The label is a label, not a
    #       location or a credential, so defaulting it discloses nothing.
    import:
      - "classpath:/carddemo-common-defaults.yml"
      - "optional:aws-parameterstore:/carddemo/${CARDDEMO_ENVIRONMENT:local}/account/"
      - "optional:aws-secretsmanager:/carddemo/${CARDDEMO_ENVIRONMENT:local}/account/"

  # Assumptions: this bounds the graceful shutdown enabled above. Twenty seconds
  #   is longer than the five-second inquiry poll declared below plus the handler
  #   it feeds, so a task being replaced finishes the message it holds; and it is
  #   shorter than the deregistration delay the load balancer applies, so the
  #   task is already out of rotation before the timer starts. A longer value
  #   would delay every deployment by the difference; a shorter one would cut a
  #   poll that had just returned a message.
  lifecycle:
    timeout-per-shutdown-phase: 20s

  cloud:
    aws:

      # Assumptions: a region is required for this module to START, not merely
      #   to reach AWS, and that is the non-obvious part. Declaring
      #   spring-cloud-aws-starter-sqs in services/account-service/pom.xml puts
      #   its auto-configuration on the classpath, and the SQS client bean is
      #   built as the context is constructed rather than on first use. A client
      #   cannot be built without a region, so a context with no region fails
      #   even though this module publishes and receives nothing today.
      #   Credentials behave differently and are NOT needed to start, because
      #   they are resolved on first call rather than at build time.
      #
      # Assumptions: no fallback, deliberately, and no region name appears in
      #   this repository. AWS_REGION is the same variable the SDK's own
      #   resolution chain consults first, so declaring it here changes nothing
      #   about how a deployed task resolves its region; what it buys is a
      #   failure that NAMES the missing variable instead of the chain's own
      #   message, which reports an inability to reach the instance metadata
      #   service and sends a reader looking for an EC2 problem a Fargate task
      #   does not have.
      #
      # Trade-offs: a baked default such as a single hard-coded region would let
      #   a JVM with no environment at all start, and is refused. The deployment
      #   is single-region, so a default that disagreed with it would point every
      #   queue operation at a region holding none of the queues, and the first
      #   visible symptom would be a queue-not-found abort far from its cause.
      region:
        static: ${AWS_REGION}

      sqs:

        # Assumptions: this is the one setting whose DEFAULT is actively harmful
        #   here, which is why it is declared rather than inherited. Verified
        #   against the pinned spring-cloud-aws-sqs 4.1.0 rather than assumed:
        #   io.awspring.cloud.sqs.listener.QueueNotFoundStrategy declares exactly
        #   two constants, FAIL and CREATE, and the container options builder
        #   defaults to CREATE. Left unset, a listener pointed at a queue that
        #   does not exist CREATES one - and the queue it creates is not the queue
        #   this system is designed around. infra/modules/sqs provisions each
        #   queue with a dead-letter queue at a maxReceiveCount of 5 and SSE-KMS
        #   encryption; an application-created queue has neither, so a poison
        #   message loops instead of being parked and the payload sits unencrypted
        #   at rest.
        #
        # Trade-offs: the accepted cost is that a developer running this service
        #   against an empty local emulator must create the three queues first,
        #   rather than having them appear. That is preferred to the alternative
        #   failure, which is silent: with CREATE the service starts healthy
        #   against queues nothing else publishes to, and the absence of traffic
        #   looks like an idle system rather than a misconfigured one.
        queue-not-found-strategy: fail

        # Refactoring Rationale: this block is the SINGLE authority for the three
        #   polling bounds, and it was not always in force. The listener's
        #   @SqsListener annotation previously also carried maxConcurrentMessages,
        #   maxMessagesPerPoll and pollTimeoutSeconds. A non-null annotation
        #   attribute is applied OVER the container factory the listener would
        #   otherwise inherit from, so the per-profile numbers written here - and
        #   application-dev.yml's deliberately smaller pair in particular - were
        #   read, logged by nothing, and then overridden by the annotation's own
        #   values. The dev profile's concurrency ceiling of 2, sized against a
        #   four-connection pool, was silently a ceiling of 10.
        #
        # Trade-offs: declaring the bounds only here costs the ability to size two
        #   listeners in one service differently; this service has one. It buys a
        #   sizing an operator can read from the profile actually in force, which is
        #   the property the previous arrangement lacked.
        listener:

          # Assumptions: five seconds is transcribed from the baseline, not
          #   chosen. app/app-vsam-mq/cbl/COACCT01.cbl physical line 337 reads
          #   "MOVE 5000 TO MQGMO-WAITINTERVAL", and physical lines 347 and 350
          #   compute MQGMO-OPTIONS as MQGMO-SYNCPOINT + MQGMO-WAIT, so the wait
          #   interval is the blocking receive the baseline actually performs.
          #   5000 ms is WaitTimeSeconds=5 on the target, which preserves the
          #   baseline's throughput characteristics instead of silently changing
          #   them: a shorter poll bills more empty receives, and a longer one
          #   lengthens the shutdown drain bounded above.
          #
          # Assumptions: poll-timeout is the property that carries this value,
          #   and the name is not self-evident. Verified first-hand against the
          #   pinned 4.1.0 artifacts rather than from documentation: the published
          #   configuration metadata describes
          #   spring.cloud.aws.sqs.listener.poll-timeout as "The maximum amount
          #   of time for a poll to SQS", and
          #   io.awspring.cloud.sqs.listener.source.AbstractSqsMessageSource
          #   carries getPollTimeout together with waitTimeSeconds, which is the
          #   ReceiveMessage parameter it becomes. The neighbouring
          #   max-delay-between-polls is a different quantity - the pause between
          #   consecutive polls - and setting that one instead would leave the
          #   receive itself short-polling.
          poll-timeout: 5s

          # Assumptions: ten is the ReceiveMessage maximum the service accepts,
          #   so this asks for the largest batch a single poll can return rather
          #   than a tuned number. It stands in for the baseline's own batching
          #   discipline: COACCT01 answers requests in a bounded loop rather than
          #   one request per program invocation, and a full-batch receive keeps
          #   that shape while spending one API call where ten would otherwise be
          #   billed.
          max-messages-per-poll: 10

          # Trade-offs: this ceiling is deliberately equal to the batch size
          #   above and no larger. Each in-flight inquiry occupies a database
          #   connection from the pool sized below while it reads the account, the
          #   customer and the cross-reference, so a concurrency ceiling above the
          #   pool maximum would convert queue depth into connection-acquisition
          #   waits and time out handlers that would otherwise have succeeded.
          #   The accepted cost is that a deeper backlog drains at this rate
          #   instead of faster.
          max-concurrent-messages: 10



  # -----------------------------------------------------------------------------
  # Assumptions: (1) every value in this block arrives from outside the
  #       repository - the Aurora writer endpoint, the role name and the
  #       credential - and not one of them has a fallback; (2) the pool settings
  #       below are the two profiles' first permitted axis of variation, so each
  #       records what its own number costs rather than leaving a reader to infer
  #       it from the default.
  # -----------------------------------------------------------------------------
  datasource:

    # Trade-offs: none of the three values below has a fallback, so an unset
    #   variable aborts startup with a named placeholder rather than producing a
    #   running service. The alternative - a working default such as a localhost
    #   connection string and a development credential - was rejected because a
    #   default that resolves is a default that can be deployed by accident: a
    #   task launched with a mis-typed variable name would silently fall back and
    #   come up healthy against the wrong database, and nothing in the health
    #   check or the logs would say so. Failing to start is loud, immediate and
    #   attributable, and that is the compromise accepted here.
    #
    # Assumptions: these arrive as environment variables set by the container
    #   task definition, which sources non-secret values from Systems Manager
    #   Parameter Store and the credential from Secrets Manager, both populated
    #   from Terraform module outputs. The credential itself is generated at apply
    #   time by the hashicorp/random provider directly into Secrets Manager, so it
    #   exists only there and never passes through this repository. Section 0.5.3.5
    #   of the migration plan states the governing rule verbatim: "No service
    #   hard-codes an endpoint."
    #
    # Assumptions: the ${...} form survives the build untouched, and that is not
    #   incidental. spring-boot-starter-parent puts every application*.yml under
    #   src/main/resources through resource filtering, but it also sets
    #   resource.delimiter to @ and turns useDefaultDelimiters off, so Maven
    #   substitutes only @...@ here and leaves ${...} for Spring to resolve at run
    #   time. Writing these in the @SPRING_DATASOURCE_URL@ form instead would
    #   resolve them during packaging and freeze a build-machine value into the
    #   image, which is the failure this note exists to prevent.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

    # Refactoring Rationale: the three characteristics this block declares - how
    #   many concurrent readers there may be, what isolation a read gets, and what
    #   is recoverable afterwards - were previously declared per file in a
    #   region-wide resource definition, at app/csd/CARDDEMO.CSD:1-11 for ACCTDAT,
    #   :37-48 for CCXREF, :50-61 for CUSTDAT and :63-74 for CXACAIX. The programs
    #   that depended on those settings could neither see them nor ship with them,
    #   so a program and the file characteristics it assumed were versioned and
    #   deployed separately. Declaring them here puts them in the same deployable
    #   as the code that depends on them, so a change to either travels with the
    #   other and a task cannot run against characteristics it was not built for.
    #
    #   This is a difference in where the declaration lives, not a judgement about
    #   the baseline: a region-wide definition is the right shape when many
    #   programs share one CICS region, and it has no equivalent in a per-service
    #   container that owns its own connections.
    hikari:

      # Assumptions: Hikari publishes its pool metrics and names its own threads
      #   using this string. Left unset the pool is called HikariPool-1, which is
      #   what every other pooled service would also be called, so a shared
      #   metrics view could not tell one service's saturated pool from another's.
      pool-name: account-service-pool

      # Assumptions: there is no baseline number to preserve here, and that is
      #   worth stating because most values in this file are derived from one. All
      #   four files this context replaces were defined with STRINGS(1) -
      #   app/csd/CARDDEMO.CSD:4 for ACCTDAT, :41 for CCXREF, :54 for CUSTDAT and
      #   :67 for CXACAIX - so the baseline platform served each of them through
      #   exactly one string and its concurrency ceiling was one. Concurrent pooled
      #   access is a capability the relational engine provides and the
      #   indexed-file platform did not, so pool sizing is a new degree of freedom
      #   the migration introduces, not a tunable carried across.
      #
      # Trade-offs: the number below is a starting point that the two profiles
      #   vary along the permitted sizing axis, and it is deliberately small. The
      #   quantity that has to fit the cluster's connection budget is not this
      #   number but the product of it with the task count and with every other
      #   service doing the same, so raising it in one service silently spends a
      #   shared allowance. The accepted cost is that a burst beyond this many
      #   concurrent database operations waits for a connection instead of opening
      #   one.
      maximum-pool-size: 10

      # Trade-offs: keeping a floor of idle connections means the first request
      #   after a quiet period does not pay connection establishment and the TLS
      #   handshake inside the request. The accepted cost is that those
      #   connections are held while nothing is using them, which in an
      #   environment configured to release database capacity when idle keeps a
      #   small amount of it awake. The floor is therefore two rather than the pool
      #   maximum.
      minimum-idle: 2

      # Trade-offs: ten seconds rather than the thirty-second default. The
      #   specific consequence of the default is a cascade: during pool exhaustion
      #   each waiting request occupies its servlet thread for thirty seconds, the
      #   thread pool saturates, the health endpoint is served by that same pool
      #   and stops answering, the load balancer deregisters the task, and a
      #   database slowdown has become a task replacement loop. A shorter wait
      #   fails the individual request and leaves the task answerable. The accepted
      #   cost is that a genuinely slow but recovering database sheds requests it
      #   would eventually have served.
      connection-timeout: 10000

      # Assumptions: five minutes bounds how long an unused connection is held.
      #   It exists for the same reason the idle floor above is two rather than
      #   ten: a pool that grew during a burst and never shrank would keep database
      #   capacity awake for the rest of the task's life.
      idle-timeout: 300000

      # Assumptions: a connection must be retired by the pool before anything
      #   between the pool and the engine retires it. If an idle-connection reaper
      #   closes a socket the pool still believes is good, the pool hands that
      #   socket to a caller and the first statement on it fails with a broken-pipe
      #   error that reads like an application defect rather than an infrastructure
      #   timeout. Fifteen minutes sits below the reaping windows these connections
      #   pass through.
      max-lifetime: 900000

      # Assumptions: read committed is pinned here rather than inherited from the
      #   engine default, so a change to that default cannot move this service's
      #   isolation level without a change to this file. The baseline read all four
      #   of its files with READINTEG(UNCOMMITTED) - app/csd/CARDDEMO.CSD:3, :40,
      #   :53 and :66 - and defined them RECOVERY(NONE) at :9, :46, :59 and :72
      #   with JOURNAL(NO) at :7, :44, :57 and :70, so reads could observe
      #   uncommitted changes and nothing was logged for recovery.
      #   Committed-read isolation, encryption at rest and automated backups are
      #   capabilities the relational engine provides that the indexed-file
      #   platform did not; the baseline behaves one way, this service behaves the
      #   other, and the divergence is recorded in
      #   docs/architecture/cobol-to-service-traceability.md.
      #
      # Assumptions: committed-read is also what makes the optimistic-locking
      #   check this context depends on meaningful rather than decorative.
      #   app/cbl/COACTUPC.cbl already performs that check by hand: it snapshots
      #   the pre-edit record into ACUP-OLD-DETAILS at physical line 669, carries
      #   WS-DATACHANGED-FLAG declared at line 168 with its 88-level
      #   DATA-WAS-CHANGED-BEFORE-UPDATE at line 521, and issues SYNCPOINT
      #   ROLLBACK at line 4100 when the rewrite finds the record changed. Here
      #   that becomes a JPA version column, and the 409 Conflict it produces comes
      #   from common-lib's GlobalExceptionHandler rather than from this module.
      transaction-isolation: TRANSACTION_READ_COMMITTED

      # Assumptions: app/cpy/CVACT01Y.cpy, app/cpy/CVCUS01Y.cpy and
      #   app/cpy/CVACT03Y.cpy are the three records this bounded context owns, so
      #   account is its single schema and holds exactly FOUR tables: those three,
      #   plus account.inquiry_reply_ledger, which owns no record and exists so a
      #   redelivered inquiry is answered once. Cross-schema access is not part of
      #   this service's contract. The concrete consequence
      #   of pinning the search path is that an unqualified table name in a query
      #   or a migration cannot silently resolve into another bounded context's
      #   schema; it either finds the object in account or it fails.
      #
      # Alternatives Considered: appending currentSchema=account to the JDBC URL,
      #   which is the more usual way to do this. It is not available here because
      #   the URL is an opaque placeholder in this file - appending a parameter
      #   would mean either splitting the URL into parts this file assembles, or
      #   requiring whoever sets the variable to remember the parameter, and the
      #   second of those fails silently when forgotten. Pool initialisation SQL
      #   keeps the pin in the file that asserts it.
      #
      # Assumptions: this runs safely even before the schema's tables exist.
      #   PostgreSQL does not validate schema names when the search path is set,
      #   resolving them lazily instead, so the statement succeeds and Flyway then
      #   applies its migration. It does NOT excuse a missing schema: create-schemas
      #   below is false, so a database on which the bootstrap DDL never ran fails
      #   at the migration rather than here, and the message names the absent
      #   schema.
      connection-init-sql: "SET search_path TO account"

      # WHY : Assumptions: the URL above arrives from the platform as an opaque
      #   string, so this file cannot inspect it and cannot rely on it carrying any
      #   TLS parameter. Driver properties set here are handed to the driver
      #   alongside the URL, so a URL with no ssl parameter still negotiates on
      #   these terms. Stating them here is the only way this file can REQUIRE
      #   verified encryption rather than hope for it, and it matters more for this
      #   context than most: the rows behind this pool carry the encrypted national
      #   identifier and government-issued identifier columns derived from
      #   app/cpy/CVCUS01Y.cpy, together with every cardholder's postal address.
      # WHY : Assumptions: verify-full is the strongest mode the driver offers and
      #   the only one that closes the whole gap. `require` encrypts and accepts
      #   ANY certificate, so it defeats a passive listener but not an active one;
      #   `verify-ca` checks the chain but not the host name, so a valid
      #   certificate issued for a different host is accepted. Only verify-full
      #   checks both, which is what makes the endpoint reached the endpoint the
      #   credential was issued for.
      # WHY : Assumptions: this is the CLIENT half of a two-sided requirement. The
      #   cluster parameter group sets rds.force_ssl, so the server refuses an
      #   unencrypted connection outright. Neither half is redundant: without the
      #   server flag a misconfigured client could downgrade, and without these
      #   properties a forced-TLS server would still accept a connection that
      #   verified no certificate at all.
      # WHY : Assumptions: verify-full needs a trust anchor, and this driver has no
      #   option to fall back to the JVM trust store, so the bundle path is
      #   explicit. The default names where the service image places the managed
      #   certificate bundle; an environment holding it elsewhere overrides the
      #   variable rather than editing this file. A missing bundle fails the
      #   connection with a message naming the file, which is correct: connecting
      #   with no trust anchor is precisely what this setting prevents.
      data-source-properties:
        sslmode: verify-full
        sslrootcert: ${CARDDEMO_DB_SSL_ROOT_CERT:/etc/ssl/certs/carddemo-rds-ca-bundle.pem}

      # Trade-offs: a connection held longer than this logs a warning naming the
      #   acquiring stack, at the cost of one tracking task per checkout. Left at
      #   0 the check is off and a leak presents as an undersized pool -
      #   connection-timeout errors under load with nothing naming the code that
      #   never returned a connection.
      #
      # Assumptions: the value must sit INSIDE the pool's own accepted band, which
      #   is at least 2000 and no more than max-lifetime above. A value outside it
      #   is not rejected and does not fail startup - the pool logs
      #   "leakDetectionThreshold is less than 2000ms or more than maxLifetime,
      #   disabling it" and runs with the check OFF, which is the worst outcome
      #   available because the key still reads as though detection were on. That
      #   was observed here by starting the service with a value above
      #   max-lifetime, so it is recorded rather than inferred. Sixty seconds is
      #   chosen inside the band on its own merits: every path in this module that
      #   takes a connection is either an HTTP request or one inquiry message, and
      #   neither has any legitimate reason to hold one for a minute.
      leak-detection-threshold: 60000

  # -----------------------------------------------------------------------------
  # Assumptions: (1) this module maps three entities onto three of its schema's four
  #       tables, so the settings here are about boundaries rather than about mapping
  #       breadth. The fourth, account.inquiry_reply_ledger, is deliberately mapped by
  #       NO entity: its claim is an INSERT ... ON CONFLICT DO NOTHING and its
  #       retirement a guarded UPDATE, neither of which a JPA write expresses, so
  #       repository/InquiryReplyLedger.java issues them as native statements.
  #       Trade-offs: that table is therefore outside what ddl-auto validate checks,
  #       which is recorded again on that key rather than only here; (2) the DDL
  #       decision is the load-bearing one and is recorded on ddl-auto below.
  # -----------------------------------------------------------------------------
  jpa:

    hibernate:

      # Alternatives Considered: letting Hibernate generate the schema, with
      #   ddl-auto set to update or to create. Rejected because three things these
      #   tables need cannot be derived from an entity, and all three come from the
      #   REFERENCE ONLY baseline: the two columns held encrypted as BYTEA and
      #   returned masked, from app/cpy/CVCUS01Y.cpy, which no attribute expresses;
      #   idx_card_xref_account_id, replacing the CXACAIX alternate index at
      #   app/csd/CARDDEMO.CSD:63-74, whose absence would cost latency alone and so
      #   would fail no test; and the widths and scales that ARE the contract, the
      #   balance columns being NUMERIC(12,2) per app/cpy/CVACT01Y.cpy PIC S9(10)V99.
      #
      # Alternatives Considered: `none`, which also emits no DDL and was the
      #   previous setting here. Rejected because it additionally validates
      #   NOTHING: the three entities and V1__account.sql are required to agree
      #   column for column -- and only those three, because account.inquiry_reply_ledger
      #   is mapped by no entity, so nothing about it is asserted at startup and its
      #   agreement with V2__account_inquiry_reply_ledger.sql is asserted by
      #   InquiryReplyLedgerIT against a real engine instead. Under `none` a member
      #   naming a column the
      #   migration does not declare starts cleanly and fails later on the first
      #   query that touches it. `validate` turns that agreement into a startup
      #   assertion instead, which is why Flyway is ordered before the
      #   EntityManagerFactory: the migration has just run, so what is checked is
      #   the schema this task will actually use. A failure here means the entity
      #   or the migration is wrong and one of them is to be corrected; it is
      #   never to be answered by weakening this key back to `none`.
      ddl-auto: validate

    # Trade-offs: Spring Boot leaves this true by default, which binds the
    #   EntityManager - and with it a pooled connection - from the moment the
    #   controller is entered until the response has been written. The specific
    #   consequence is that connections are held during response serialisation,
    #   which needs no database at all, so the pool exhausts at a concurrency well
    #   below maximum-pool-size and the symptom appears as connection-timeout
    #   errors under load that no slow query explains. Setting it false confines
    #   connection use to the transactional service methods. The accepted cost is
    #   that a lazily-mapped association touched after the service method returns
    #   raises LazyInitializationException instead of quietly issuing another
    #   query, which is the correct place for that mistake to surface.
    open-in-view: false

    # Assumptions: statement echo is off in the base configuration and is one of
    #   the two diagnostics the dev overlay may raise. It writes to standard
    #   output rather than through a logger, so it cannot be narrowed by a level
    #   once enabled - which is why the decision belongs in a profile rather than
    #   being left to a logging change.
    show-sql: false

    properties:
      hibernate:
        # Assumptions: this is the same schema the pool's initialisation SQL pins
        #   and the same one Flyway migrates into, declared a third time because
        #   Hibernate qualifies generated SQL from its own setting rather than from
        #   the connection's search path. Leaving it unset would work only for as
        #   long as the search path happens to agree, so the two are stated
        #   together rather than one being inferred from the other.
        default_schema: account

  # -----------------------------------------------------------------------------
  # Assumptions: (1) schema ownership and code ownership ship in the same
  #       deployable, so the four tables, the two migrations that create them and the
  #       entities that map three of them cannot be applied out of step; (2) three of the settings below - create-schemas,
  #       baseline-on-migrate and clean-disabled - decide what happens when the
  #       schema is not in the state expected, and none of them papers over it, so
  #       each records its own consequence rather than leaving a reader to infer it
  #       from the default.
  # -----------------------------------------------------------------------------
  flyway:

    # Assumptions: migration runs in-process at startup, before the JPA
    #   EntityManagerFactory is built, so the tables exist by the time anything
    #   maps them. The alternative of applying migrations from a separate step
    #   would let a task start against a schema its own code predates.
    enabled: true

    # Assumptions: this is Flyway's own default and is declared rather than
    #   inherited, so the directory holding this module's DDL is visible in the
    #   same block that turns Hibernate's off. The path resolves inside the jar,
    #   which is what makes the migration travel with the code that maps it: a task
    #   cannot apply a migration from a different build than the one it is running.
    locations: classpath:db/migration

    # Assumptions: account is the only schema this module touches, and it holds
    #   exactly four tables. Three are copybook-derived, because app/cpy/CVACT01Y.cpy,
    #   app/cpy/CVCUS01Y.cpy and app/cpy/CVACT03Y.cpy are the only records this bounded
    #   context owns; the fourth, account.inquiry_reply_ledger, derives from no record
    #   and is created by the second migration.
    #   The two settings below therefore name the same schema while doing
    #   different jobs, and both are stated rather than one being left to follow
    #   the other: the first is the set Flyway is permitted to manage, and the
    #   second is where it places its history table and how it resolves an
    #   unqualified object name inside a migration. Naming the second explicitly is
    #   what keeps each service's migration state in its own schema, so one
    #   service's history cannot be truncated by another's.
    schemas: account
    default-schema: account

    # Assumptions: data-migration/sql/V0__schemas_and_roles.sql is the EXCLUSIVE
    #   authority for schemas, roles and grants in this system. It creates the
    #   account schema owned by the NOLOGIN role carddemo_account_owner at its
    #   L687-L688, together with the three tiers of role behind the eight schemas
    #   -- eight NOLOGIN owners, seven migration logins and eight runtime logins --
    #   the credential binding for every login role, and the whole cross-schema
    #   privilege graph - including the narrowly-scoped write grants that let batch-service
    #   post a transaction and update an account in one commit. Its completion is a
    #   deployment precondition of this service rather than something this service
    #   can substitute for, so this flag is false: Flyway may migrate the account
    #   schema and may not create it.
    #
    # Trade-offs: the cost is that a bare database, including one started by
    #   Testcontainers for a repository integration test, now needs its schema
    #   created before this service can migrate. The test profile supplies that for
    #   itself, which is a visible act in a reviewable test resource rather than a
    #   production default that conceals a missing precondition. The alternative of
    #   making this module's own migration create what it needs was rejected
    #   outright: it would put CREATE ROLE and GRANT statements into
    #   V1__account.sql - privileged, cluster-wide statements in a per-service
    #   migration, which is exactly the coupling schema-per-service exists to
    #   avoid.
    create-schemas: false

    # Assumptions: false is stated explicitly rather than left to the default,
    #   because the failure it prevents is silent. Were it true, an account schema
    #   that already held objects but no Flyway history table would be marked as
    #   already-migrated and V1__account.sql would never run, so a table missing
    #   the version column, or carrying VARCHAR where CHAR(16) is required, would
    #   pass startup unnoticed and only diverge later, under load, in comparisons.
    #   With it false that situation aborts startup and names itself.
    baseline-on-migrate: false

    # Assumptions: Flyway's own default already disables clean, and it is restated
    #   here so that no profile, environment variable or configuration import can
    #   enable it without an edit to this file. The operation drops every object in
    #   the managed schema; in this context that is the account master, the
    #   customer master and the cross-reference in one statement, and there is no
    #   confirmation step between the call and the drop.
    clean-disabled: true


  # -----------------------------------------------------------------------------
  # Refactoring Rationale: (1) identity is asserted by a signed token rather than
  #       by a field the client sends, which is the whole point of the change
  #       recorded below; (2) only the issuer is configured here - which routes
  #       require which authority is code, and lives in config/SecurityConfig.java.
  # -----------------------------------------------------------------------------

    # Assumptions: Flyway authenticates as a DIFFERENT database role than the one
    #   the datasource above uses, and the two are not interchangeable.
    #   data-migration/sql/V0__schemas_and_roles.sql creates three tiers of role
    #   per bounded context: a NOLOGIN carddemo_account_owner that owns the
    #   schema and everything in it, a carddemo_account_migrator login that is a
    #   member of that owner, and the carddemo_account login this service serves
    #   requests as. The runtime role holds USAGE on the schema plus SELECT,
    #   INSERT and UPDATE on its tables -- CREATE is explicitly REVOKEd from it --
    #   so it could not apply this migration even if asked to, and equally cannot
    #   drop or alter the tables it reads.
    # Refactoring Rationale: these two keys did not exist, and Flyway therefore
    #   migrated under the runtime credential. That made the runtime role the
    #   owner of the schema and of every table the migration created, so the one
    #   long-lived credential every request ran under also held DDL authority over
    #   the data it served. Naming a separate migration credential here is what
    #   allows the bootstrap SQL to reduce the runtime role to named DML.
    # Trade-offs: no fallback value, for the same reason the datasource
    #   credential above has none -- a default would let the process start against
    #   a credential nobody chose. The consequence is deliberate: a deployment
    #   that injects the runtime credential and forgets this one fails at startup
    #   on an unresolved placeholder, which names the variable it is missing,
    #   rather than migrating as the wrong identity and succeeding.
    # Assumptions: setting spring.flyway.user is also what gives Flyway its own
    #   DataSource. Spring Boot builds a separate SimpleDriverDataSource derived
    #   from the application DataSource whenever this key is set -- verified
    #   against FlywayAutoConfiguration in spring-boot-flyway 4.1.0, whose
    #   getMigrationDataSource falls to a derivedFrom builder when the Flyway URL
    #   is absent and the Flyway user is not -- so the URL, driver and TLS terms
    #   are inherited while the credential is replaced. That separation matters
    #   beyond tidiness: sharing the Hikari pool would leave the SET ROLE below
    #   applied to pooled connections that later serve runtime queries.
    user: ${SPRING_FLYWAY_USER}
    password: ${SPRING_FLYWAY_PASSWORD}

    # Refactoring Rationale: `init-sqls` stood here with the single entry
    #   `SET ROLE carddemo_account_owner;`, and the decision it carried now lives at
    #   carddemo.database.flyway.owner-role in this file, where the reasoning that
    #   used to sit above this key has moved with it. Spring Boot maps
    #   `spring.flyway.init-sqls` onto Flyway's `initSql` setting, which Flyway 13
    #   deprecates: the engine printed a removal notice on every connection it
    #   opened, 70 of them in one reactor build across the seven migrating
    #   services. The replacement is a Callback bean contributed by common-lib that
    #   issues the same statement on the same connections, so the ownership
    #   arrangement is unchanged. What the move buys beyond silencing the notice:
    #   the role name is validated against an identifier allow-list and quoted
    #   before it reaches SET ROLE, which a YAML string spliced into a script could
    #   not be.

    # Assumptions: stated rather than inherited, for the same reason the springdoc
    #   keys below are. It is the engine's own default, so the line changes nothing
    #   today; it is here because it is the guard that makes the history table
    #   meaningful, and a default silently reversed by an upgrade would leave an
    #   ALREADY-APPLIED V1__account.sql free to be edited without complaint. With
    #   it on, an edit to an applied migration fails startup on a checksum mismatch
    #   instead, which is the third of the migration failures recorded in the
    #   header block above. The remedy for that failure is a new versioned
    #   migration, never a repair of the applied one.
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:

          # Refactoring Rationale: the baseline carried identity in storage the
          #   client echoed back. app/cpy/COCOM01Y.cpy L19-L44 declares
          #   CDEMO-USER-ID PIC X(8) and CDEMO-USER-TYPE PIC X(1) inside the
          #   COMMAREA that every online program passes to the terminal and
          #   receives again on the next turn, so a client could in principle
          #   assert its own user type. Here the group claim is signed by the
          #   issuer named below and the client cannot assert anything. That is a
          #   security improvement rather than a port, and it is recorded as such
          #   in docs/architecture/security-and-identity.md.
          #
          # Assumptions: common-lib's JwtRoleConverter maps the cognito:groups
          #   claim onto Spring Security authorities. This file supplies the issuer
          #   and nothing else; the route-to-authority mapping is code, not
          #   configuration, and lives in config/SecurityConfig.java. That class
          #   guards every account, customer and cross-reference route behind
          #   authentication and declares no admin-only route, because
          #   app/cbl/COMEN01C.cbl reaches the account view and update
          #   transactions from the ordinary user menu rather than from the
          #   administrative one.
          #
          # Trade-offs: no fallback, for the same reason given on the datasource
          #   above. A default issuer that resolved would produce a service that
          #   validates tokens against the wrong authority, which is worse than one
          #   that does not start, because it looks like it is working.
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

  # ---------------------------------------------------------------------------
  # Alternatives Considered: a blanket WRITE_NUMBERS_AS_STRINGS on this mapper,
  #       which is the obvious way to guarantee that no money value ever reaches a
  #       client as a JSON number. Rejected because it is indiscriminate: it would
  #       also stringify page sizes, counts and the credit score, where exactness
  #       is not at stake, and it would cost every one of those its declared JSON
  #       type for no gain. Money's string form is instead produced by exactly one
  #       targeted mechanism, common-lib's MoneyModule, contributed to every
  #       service by CardDemoCommonAutoConfiguration's carddemoMoneyModule() bean
  #       under the missing-bean guard beside it -- which is also why this module
  #       does not register it by name, and why there is no Jackson key here that
  #       touches number rendering at all.
  #
  #       The reason money must never travel as a JSON number: most clients parse
  #       one into an IEEE-754 double, which cannot represent every two-decimal
  #       value exactly, so the loss lands on the figure the user reads. The
  #       baseline never had that exposure to begin with -- the amounts are
  #       zoned decimal in storage, app/cpy/CVACT01Y.cpy L7 declaring
  #       ACCT-CURR-BAL as PIC S9(10)V99, and alphanumeric on the wire, every
  #       money field on both symbolic maps being PIC X(15), as with ACURBALI at
  #       app/cpy-bms/COACTVW.CPY L102 and app/cpy-bms/COACTUP.CPY L138. Carrying
  #       the string form forward preserves that rather than introducing a
  #       floating-point hop the 3270 path never had.
  # ---------------------------------------------------------------------------
  jackson:
    deserialization:

      # Trade-offs: strictness over forward compatibility. An unknown property is
      #   a client sending a field this contract does not define, which means the
      #   two disagree; answering 400 says so, while the framework default of
      #   discarding it silently accepts a request whose author believes it carried
      #   more than it did. On an update route that rewrites the account master,
      #   silently dropping a field the caller thought it was setting is the worse
      #   of the two failures. The baseline had no third option here: a 24x80 map
      #   has no representation for a field it does not define. The accepted cost
      #   is that adding a request field becomes a deliberate contract change,
      #   made in openapi/account-api.yaml and the DTO together.
      fail-on-unknown-properties: true


# -----------------------------------------------------------------------------
# Trade-offs: (1) the health path is a deployment contract and is documented as
#       one, not as a convenience; (2) the surface is kept to three endpoints
#       because exposing an endpoint here is what makes it EXIST, and an endpoint
#       that exists is one more thing reachable from inside the private network.
#       Whether it answers without a token is a separate decision made in
#       config/SecurityConfig.java, and exposure here does not settle it. That
#       class grants /actuator/health/** from ANY address, because the two things
#       that poll it - the load balancer target group and the container health
#       check - reach it from off-task and present no token. It grants info and
#       the scrape path by LOOPBACK RANGE instead, because their only configured
#       consumer is the task-local collector sidecar, which also presents no
#       header, so an authority rule there would have stopped the sole consumer
#       rather than narrowing it. Everything else in the namespace is denied
#       outright. Verified against this configuration by probing all three: from
#       127.0.0.1 all three answer 200; from a non-loopback address health still
#       answers 200 while info and the scrape path answer 401. The list below and
#       that class are therefore two independent narrowings of one surface, and
#       neither substitutes for the other.
# -----------------------------------------------------------------------------
management:
  endpoints:
    web:

      # Assumptions: two components consume GET /actuator/health at exactly this
      #   path, and neither of them can present a token. The load balancer target
      #   group polls it to decide whether a task receives traffic, and the
      #   HEALTHCHECK instruction in services/account-service/Dockerfile polls it
      #   to decide whether the container is alive. The endpoint is safe to leave
      #   unauthenticated because it exposes no business data - show-details and
      #   show-components below are both set to never, so the response body is a
      #   status word and nothing else.
      #
      #   Moving this path, or requiring a token on it, breaks load-balancer
      #   registration and container liveness together and in the same deployment:
      #   the task would come up, answer nothing the balancer accepted, be
      #   deregistered, and be replaced. Authorization for every other route is
      #   implemented in config/SecurityConfig.java, not here.
      base-path: /actuator

      exposure:

        # Trade-offs: three endpoints rather than the single default, and
        #   deliberately not the wildcard. health is the deployment contract above;
        #   info identifies which build a task is running, which is what makes a
        #   report of a defect attributable to a version; prometheus is the scrape
        #   path, and without it the dashboards and alarms the Terraform
        #   observability module provisions have nothing to read and report healthy
        #   silence rather than an error. The accepted cost of naming three is that
        #   adding a fourth needs an edit here or an override through the exposure
        #   variable; the wildcard was rejected because it would also publish heap
        #   dumps, the environment listing and the mappings, none of which anything
        #   polls and all of which describe the service to anything that reaches
        #   the port.
        include: health,info,prometheus

  endpoint:
    health:

      # Assumptions: this key does NOT create /actuator/health/liveness or
      #   /actuator/health/readiness. Spring Boot 4.1.0 publishes both group paths
      #   regardless of its value - measured, not assumed, by running one service
      #   image three times with the property unset, explicitly false and
      #   explicitly true, and probing both paths in each case: all three answered
      #   200 on both. What the key declares is that those groups are backed by
      #   the application-availability state rather than left as an empty group,
      #   so a future orchestrator check can distinguish "started but not ready"
      #   from "failed". The aggregate at /actuator/health remains the path the two
      #   consumers above use, and none of this changes what the aggregate reports.
      # Assumptions: the paragraph above deliberately does NOT say that enabling
      #   the groups "adds" the two paths. That phrasing reads as a statement about
      #   reachability and is false on this Boot version, so a reader sizing an
      #   ingress rule or a probe configuration from it would conclude the two paths
      #   are absent unless this key is set, when they are reachable either way.
      # Alternatives Considered: deleting the key, since it changes no path. Rejected
      #   on two grounds: it still expresses the intended backing for the groups, and
      #   the three sibling web contexts declare it identically -- a no-op deletion
      #   here would make this module differ from them for a reason no reader of one
      #   file could see.
      probes:
        enabled: true

      # Assumptions: both settings below are narrowed so the response body is a
      #   status word and nothing else, which is the property the unauthenticated
      #   health path above depends on. They suppress two different things and so
      #   are both stated: the first withholds each contributor's own detail, and
      #   the second withholds the list of which contributors are registered at
      #   all. Either one left open would let an endpoint reachable from inside the
      #   network describe this service's dependencies - for this module the
      #   database, its validation query and the SQS client - to anything that
      #   reached the port. Widening either is one of the four permitted profile
      #   axes; the base value is the narrow one so that widening is always a
      #   deliberate act.
      #
      # Trade-offs: diagnostic richness is what is given up, and knowingly. With
      #   detail shown, an operator reading the health body alone could tell a
      #   database outage from an SQS one without opening a log; with it withheld
      #   they get a single status word and have to go to CloudWatch or the
      #   authenticated endpoints for the same answer. That cost is accepted
      #   because the probe only needs a binary verdict to do its job, while the
      #   detail would be readable by anything that reached the port - and the
      #   aggregate path is the one route here that answers with no token at all.
      show-details: never
      show-components: never

# -----------------------------------------------------------------------------
# Assumptions: (1) the served document has to agree with a hand-authored
#       contract, so the settings below are chosen to make disagreement visible;
#       (2) the version is pinned rather than inherited for the reason recorded on
#       it.
# -----------------------------------------------------------------------------
springdoc:

  # Assumptions: services/account-service/src/main/resources/openapi/account-api.yaml
  #   is the hand-authored OpenAPI 3.1 contract of record for this service. The
  #   document springdoc generates from the controllers is therefore not a second
  #   source of truth - it is a check on the first. The two must agree, and any
  #   difference between them is a bug in whichever side drifted, not a formatting
  #   artifact to be tolerated.
  # Assumptions: the contract exists at the path named above and declares ten
  #   operations, and the three controllers that answer them are under
  #   src/main/java/com/carddemo/account/api, so the keys below describe a document
  #   this service serves rather than settling where one will be published.
  # Assumptions: NO browser client addresses this contract, by design rather than by
  #   omission. Its operations require a machine token that InternalApiSecurityConfig
  #   demands and no browser can mint, and ui/src/api/contracts.test.ts asserts that
  #   no browser client addresses any of its paths, so a reader looking for an
  #   accounts client under ui/src/api will not find one and is not missing a file.
  api-docs:

    # Assumptions: stated explicitly because the library's two defaults for this
    #   setting disagree. Its autoconfiguration is conditional on the property with
    #   match-if-missing, so an absent property leaves the endpoint served; but the
    #   backing properties object declares the field as a plain boolean with no
    #   initialiser, so anything reading that object while the property is absent is
    #   told the document is disabled. Setting it true makes the two agree, which is
    #   why the line is here rather than left to the default.
    enabled: true

    # Assumptions: this is the library's default path, pinned so that the path a
    #   contract comparison fetches cannot move under a library upgrade. A moved
    #   path does not fail a build; it returns 404 to whatever was fetching the
    #   document.
    path: /v3/api-docs

    # Assumptions: pinned rather than inherited. This release already defaults to
    #   the 3.1 form, so the line changes nothing today; it is here because the
    #   contract of record is 3.1 and a future default reverting to 3.0 would serve
    #   a document in a different specification version than the file it is checked
    #   against, and the resulting mismatch would be reported as contract drift
    #   when it was really a library default moving underneath.
    version: openapi_3_1

  swagger-ui:

    # Alternatives Considered: serving the interactive console, which is the
    #   library's default and was the previous setting here. Rejected because it
    #   adds reachable surface without adding authority: the contract of record is
    #   openapi/account-api.yaml, the generated document at the path above is the
    #   check on it, and the console is a third rendering that can only agree with
    #   the second. It is also unusable for its own purpose here - every operation
    #   this service publishes requires a machine token that
    #   config/InternalApiSecurityConfig.java demands and the console cannot mint,
    #   so a "try it out" reaches 401 in every case. Disabling it removes the
    #   console's bundled static assets from the served surface too, which is where
    #   this library's advisories have historically landed. The generated document
    #   itself stays enabled deliberately, because that is what lets CI diff the
    #   served document against the committed contract and catch drift.
    enabled: false

    # Assumptions: the library's default, pinned so the disabled state above is
    #   asserted against a known path rather than one a version bump could move.
    path: /swagger-ui.html

  # Trade-offs: sorting the generated document's keys costs a little serialisation
  #   work on each request for it, and buys a document that is diffable. Without it
  #   the key order follows reflection order, which can change between builds for
  #   reasons that have nothing to do with the API, so a diff against
  #   account-api.yaml would report noise and the drift check that comparison
  #   exists to perform would stop being trusted.
  writer-with-order-by-keys: true

# -----------------------------------------------------------------------------
# Trade-offs: (1) these are the floor, and adjusting them is the first of the four
#       axes the two profiles may vary; (2) two of the five exist to keep
#       cardholder and customer data out of log storage, which is recorded on them
#       individually rather than asserted here.
# -----------------------------------------------------------------------------
logging:
  level:

    # Trade-offs: info rather than debug for both of the levels below. Debug at the
    #   root emits framework internals on every request, and debug on this module's
    #   own package emits the validation chain transcribed from
    #   app/cbl/COACTUPC.cbl on every field of every update - and that program
    #   validates 128 screen fields. The accepted cost of not having either by
    #   default is that reproducing a problem at that depth needs a profile change;
    #   the cost of having them would be paid on every request in every
    #   environment, including production.
    #
    # Assumptions: the second entry is the package root every class in this module
    #   sits under, so one level governs the whole context. It is stated separately
    #   from the root level because the two are raised for different reasons and a
    #   profile commonly raises one without the other.
    root: INFO
    com.carddemo: INFO

    # Assumptions: Flyway announces at info level which migration it applied and
    #   which it skipped. That line is the only durable record that
    #   V1__account.sql ran against a given task's database, so raising this to
    #   warn would remove the evidence needed to answer whether a schema is
    #   current.
    org.flywaydb: INFO

    # Assumptions: the SQS listener container's own package is declared here, at
    #   warn, so that the two profiles have a key to override rather than a key to
    #   introduce - the closing block's contract is that a profile varies values
    #   and never the shape, and a logger the base did not name would breach it.
    #   Warn is the right floor: at warn a genuine visibility or acknowledgement
    #   fault is reported and routine polling is not, and routine polling here is
    #   one receive every five seconds for the lifetime of every task.
    #
    # Assumptions: this level is live from the first run, before any message is
    #   consumed. The SQS client bean is built as the context is constructed, for the
    #   reason recorded on spring.cloud.aws.region, so a client that cannot resolve
    #   its region reports through this logger even on a task that receives nothing.
    io.awspring.cloud.sqs: WARN

    # Assumptions: statement logging is off in the base configuration because this
    #   service's statements carry account and customer identifiers in their
    #   predicates, and its parameter binding carries the plaintext side of the
    #   masked identifier columns as bound values. Turning either on ships that
    #   material into log storage, where the masking applied at the API edge by
    #   common-lib's GlobalExceptionHandler and by this module's mapper does not
    #   reach. The dev profile may raise the statement logger; neither profile may
    #   raise the bind logger, and the reason it must not is this one rather than
    #   log volume.
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

# -----------------------------------------------------------------------------
# Alternatives Considered: (1) each key below is either a security control the
#       framework publishes no key for, or a queue name the baseline itself took
#       from configuration rather than from code, so both are declared here instead
#       of being written into a service class; (2) they live under a single
#       carddemo namespace so that everything non-standard in this module is
#       findable in one place.
# -----------------------------------------------------------------------------
carddemo:

  database:
    flyway:
      # Assumptions: this is the other half of the ownership split, and without it
      #   the migration credential alone achieves nothing. V0 grants
      #   carddemo_account_migrator its owner WITH INHERIT FALSE, so a session
      #   authenticated as the migrator holds NO privilege at all until it assumes
      #   the owner explicitly. common-lib's FlywayOwnerRoleDataSourceCustomizer
      #   assumes this role on every connection Flyway is handed, and its
      #   FlywayOwnerRoleCallback re-asserts it on connect and before each
      #   migration, so
      #   every object V1 creates is owned by carddemo_account_owner rather than by the
      #   credential that connected.
      # Trade-offs: INHERIT FALSE plus an explicit SET ROLE is more moving parts
      #   than granting the migrator ownership directly, and it buys two properties
      #   that arrangement cannot have. A stolen migrator credential used without
      #   this statement can read and write nothing, and every
      #   ALTER DEFAULT PRIVILEGES FOR ROLE carddemo_account_owner clause in the
      #   bootstrap SQL fires -- those clauses are keyed on the CREATING role, so a
      #   migration that created tables as the migrator would leave them all inert
      #   and the runtime role would receive no grants on the tables it must read.
      # Alternatives Considered: ALTER ROLE carddemo_account_migrator SET role,
      #   which is a per-role server-side default and needs nothing in this file.
      #   Rejected because it makes a privilege decision invisible at the point it
      #   takes effect: a reader of this configuration would see a migration running
      #   as the migrator and have no way to learn that the server silently
      #   substitutes another identity.
      # Assumptions: the value is a bare role name, NOT a statement. Both shared
      #   components read it through one allow-list, MigrationOwnerRole, which holds
      #   it to a lower-case identifier and quotes it, so a semicolon, a second
      #   statement or a quoting character is refused at startup rather than reaching
      #   the server -- which is why the terminating semicolon the removed list entry
      #   needed is absent here and must not be reintroduced.
      # Refactoring Rationale: this comment named the callback alone as the
      #   mechanism, which was measured to be insufficient. Flyway records a
      #   session's role when it wraps a connection and restores that recorded role
      #   around every schema-history write, so a role the callback assumes is undone
      #   before flyway_schema_history is created -- observed as
      #   'permission denied for schema <name>' with SQLSTATE 42501. The customizer
      #   named above acts where the removed spring.flyway.init-sqls acted, on the
      #   JDBC connection ahead of that wrapper, which is why the ownership now
      #   holds. This property is unchanged; only what reads it has grown a second
      #   half.
      owner-role: carddemo_account_owner

  # WHY : (1) Assumptions: validating the issuer is not validating the token. The
  #       issuer-uri above makes the filter chain verify the signature, the issuer
  #       and the time claims, and that is where its guarantees end. One user pool
  #       mints TWO token kinds from the same signing key: an access token, whose
  #       token_use claim is `access`, and an identity token, whose token_use claim
  #       is `id`. Both are validly signed by the configured issuer, so without the
  #       check below an identity token - meant to describe a user to a client,
  #       never to authorize an API call - would be accepted as authorization here.
  #       It is also the token a browser is most likely to have to hand, which is
  #       what makes the gap reachable rather than theoretical. On this service
  #       specifically the consequence is concrete: the update route rewrites the
  #       account master, and the customer route returns a postal address and a
  #       masked national identifier.
  #       (2) Assumptions: one pool can hold more than one app client, and a token
  #       minted for a different client of this pool carries this pool's issuer.
  #       Binding the accepted client id closes that.
  #       (3) Alternatives Considered: expressing this through the framework's own
  #       spring.security.oauth2.resourceserver.jwt.audiences key, which is the
  #       obvious declarative route and is wrong here. A Cognito ACCESS token
  #       carries no aud claim at all - the client id travels in client_id instead -
  #       so an audience validator would reject every access token the sign-on flow
  #       issues while accepting the identity tokens this block exists to refuse. It
  #       would invert the control.
  #       (4) Assumptions: these keys are read by config/SecurityConfig.java, which
  #       installs common-lib's CognitoAccessTokenValidator behind the framework's
  #       own default validator and ahead of the group mapping, so a token failing
  #       any of the three never reaches JwtRoleConverter and no authority is
  #       derived from it. common-lib's security package owns the group mapping
  #       alone and explicitly no token validation, so the validator belongs to each
  #       service; the property shape is identical in every service so the seven
  #       web filter chains cannot diverge in what they accept.
  #       (5) Trade-offs: required-scope names the scope the pool grants to a token
  #       obtained through its authentication API rather than a custom
  #       resource-server scope. Custom scopes are granted only through the OAuth
  #       flows this design does not use, so requiring one would reject every token
  #       the sign-on flow can produce. What the value still buys is decisive: an
  #       identity token carries no scope claim whatsoever, so requiring any scope
  #       at all is a second, independent rejection of the wrong token kind, and it
  #       is the same claim the API Gateway route authorization scopes assert at the
  #       edge, so edge and service agree rather than each guessing.
  security:
    jwt:
      expected-token-use: access
      expected-client-id: ${CARDDEMO_SECURITY_JWT_EXPECTED_CLIENT_ID}
      required-scope: aws.cognito.signin.user.admin

    # WHY : Assumptions: the two group names are declared here, in the same shape
    #       every other context declares them, and are read by
    #       config/SecurityConfig.java -- which hands them to the shared
    #       JwtRoleConverter. The converter compares each against its own compiled
    #       constant and refuses to start on a mismatch, so this pair is what turns
    #       a user pool whose groups were renamed into a startup failure instead of
    #       a service that authenticates every request and authorizes none.
    #       Trade-offs: the fallbacks are the two names infra/modules/cognito fixes
    #       as non-overridable, so a local run needs no environment at all, while a
    #       deployment that renames a group sets the variables and fails fast if the
    #       new name and the compiled constant disagree. A no-default form was
    #       considered and rejected here specifically: unlike the client id, which
    #       is deployment-specific and must never be guessed, these two names are
    #       part of the application's own authorization vocabulary and a wrong value
    #       is caught by the converter rather than being silently accepted.
    cognito:
      admin-group-name: ${CARDDEMO_COGNITO_ADMIN_GROUP_NAME:carddemo-admin}
      user-group-name: ${CARDDEMO_COGNITO_USER_GROUP_NAME:carddemo-user}

    # WHY : (1) Assumptions: the key arrives from the environment with NO default, so a
    #       deployment that has not been given one fails at start-up rather than
    #       enciphering the two protected customer identifiers under the account's
    #       default key. An envelope wrapped under a key nobody named is one no re-key
    #       and no cross-environment restore can locate, and the failure would surface
    #       only when a value had to be read back -- long after the rows were written.
    #       (2) Trade-offs: this mirrors card-service's carddemo.security.cvv.key-id
    #       exactly, including the absence of a default. The cost is that a developer
    #       running this module locally must set one variable; the benefit is that
    #       pointing development at the production key, or the reverse, yields
    #       envelopes that fail to decipher instead of yielding national identifiers
    #       across an environment boundary.
    #       (3) Assumptions: ONE key for both protected columns rather than one each.
    #       The envelopes are bound to their column through the encryption context
    #       carddemo:column, which is authenticated additional data, so an envelope
    #       moved between ssn_encrypted and govt_issued_id_encrypted already fails its
    #       authentication check. A second key would add a second rotation schedule and
    #       a second grant to manage for a separation the context already provides.
    customer-identifier:
      key-id: ${CARDDEMO_SECURITY_CUSTOMER_IDENTIFIER_KEY_ID}

  account:
    inquiry:
      # WHY : (1) Assumptions: all three destinations arrive from the environment and
      #       none is written here, and the reason is drawn from the baseline rather than
      #       from a general preference. app/app-vsam-mq/cbl/COACCT01.cbl declares
      #       01 QUEUE-INFO. at physical line 92, holding four PIC X(48) queue-name
      #       fields at physical lines 93 to 96, and every one of them is
      #       initialised VALUE SPACES and filled at run time. The baseline already
      #       treats a queue name as configuration rather than as code, so writing
      #       one here would be LESS faithful to it, not more.
      #       (2) Assumptions: the baseline's names cannot survive as written in any
      #       case. SQS permits only alphanumerics, hyphens and underscores in a
      #       queue name, with a dot appearing solely as the ".fifo" suffix, so a
      #       dotted uppercase name of the CARD.DEMO.* form is not a legal SQS queue
      #       name. The target names are carddemo-inquiry-request-<env>,
      #       carddemo-inquiry-reply-<env> and carddemo-error-<env>, they carry an
      #       environment suffix this file cannot know, and the renaming is recorded
      #       in docs/architecture/messaging-contracts.md.
      #       (2a) Assumptions: each value is a queue NAME and never a queue URL, and
      #       the distinction is load-bearing rather than stylistic. @SqsListener
      #       binds a name, and the reply and error paths resolve an address from a
      #       name with GetQueueUrl(QueueName=...), so a root that published
      #       infra/modules/sqs's *_queue_url outputs into these variables would
      #       start the context, pass every placeholder check, and then fail on the
      #       first reply with a name-not-found error naming a "queue" whose name
      #       contained a scheme and a host. The calling roots therefore publish the
      #       module's *_queue_name outputs; that pairing is asserted by the
      #       runtime-configuration contract test rather than left to review.
      #       (2b) Refactoring Rationale: request-queue names the ONE shared inquiry
      #       request queue, not a per-consumer queue. app/app-vsam-mq/README.md
      #       defines a single request destination at physical line 53,
      #       DEFINE QLOCAL('CARDDEMO.REQUEST.QUEUE'), aliased to CICS as
      #       MQQUEUE(CARDREQ) at physical line 71, and both inquiry transactions -
      #       COACCT01 and CODATE01 - are driven from it. The migrated topology keeps
      #       that shape: infra/modules/sqs provisions one carddemo-inquiry-request
      #       queue, this service is its only consumer, and
      #       service/InquiryMessageListener.java dispatches on the request's own
      #       four-character function code - 'INQA' to the account route, 'DATE' to
      #       the shared date renderer in common-lib, anything else to COACCT01's
      #       invalid-parameters reply. A second consumer elsewhere is not a second
      #       reader of the same work but a thief of it, because a receive hides the
      #       message from every other consumer, so the reference context holds no
      #       receive grant on this queue and binds no listener to it.
      #       (3) Alternatives Considered: FIFO queues, as the authorization flow
      #       uses. Rejected because account inquiry has no ordering requirement -
      #       each inquiry is independent and its reply is routed by correlation
      #       rather than by position. The authorization flow needs FIFO with the card
      #       number itself as the message group, per specification 0.4.1.8, because
      #       authorizations for one card must be applied in order; imposing the same here would
      #       serialise independent inquiries behind one another and cap throughput
      #       to no purpose. These three are standard queues, each with a
      #       dead-letter queue at a maxReceiveCount of 5 and SSE-KMS, provisioned
      #       by infra/modules/sqs.
      #       (4) Assumptions: NO transactional outbox is needed. COACCT01 reads and
      #       replies inside one unit of work - physical line 347 computes
      #       MQGMO-OPTIONS as MQGMO-SYNCPOINT and physical line 475 computes
      #       MQPMO-OPTIONS as MQPMO-SYNCPOINT - so there is no window in which the
      #       work is committed and the reply is lost. That is the opposite of the
      #       authorization consumer, which reads and publishes with
      #       MQGMO-NO-SYNCPOINT and MQPMO-NO-SYNCPOINT at
      #       app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl L389 and L753 and
      #       therefore does need an outbox to close that window. Reading the two
      #       flows as one discipline would either add machinery this service has no
      #       need of or drop machinery that service cannot do without.
      #       (4a) Refactoring Rationale: entry (4) previously also claimed that
      #       delete-on-success plus the visibility timeout was the WHOLE of the
      #       delivery contract for this flow, and that clause is withdrawn. It was
      #       complete about one direction of the baseline's syncpoint bracket and
      #       silent about the other: a unit of work spanning get, read and put rolls
      #       the PUT back when it fails, so the baseline can neither lose a reply nor
      #       send one twice, and delete-on-success reproduces only the first half.
      #       The send is committed at the queue the moment it returns and the
      #       acknowledgement is a separate call afterwards, so a task killed between
      #       them leaves the request visible and the next delivery sends a SECOND
      #       reply carrying the same correlation identifier as the first - a
      #       divergence from the baseline rather than a property of it. The
      #       account.inquiry_reply_ledger table created by
      #       V2__account_inquiry_reply_ledger.sql closes it: the reply is recorded
      #       under the requester's own identity and committed, then sent, then marked
      #       sent, so a redelivery either suppresses its duplicate or re-sends the
      #       recorded bytes. That is a CLAIM and not the outbox entry (4) rules out;
      #       an outbox guarantees a reply exists for every committed decision, which
      #       this read-only exchange does not need, and a claim guarantees a reply is
      #       not sent twice, which it does.
      #       (5) Assumptions: all three keys ARE bound, and by one bean --
      #       service/InquiryMessageListener.java. It binds request-queue-url through
      #       its @SqsListener annotation, and reply-queue-url and error-queue-url
      #       through constructor @Value parameters carrying no defaults. That binding
      #       site is named because it is what makes item (6) below true: a reader who
      #       took these keys for unbound configuration would size the deployment's
      #       required-variable list short by three.
      #       (6) Assumptions: all three are consequently STARTUP-CRITICAL. A
      #       placeholder read through @Value is resolved with
      #       resolveRequiredPlaceholders and raises, so a deployment missing any of
      #       them aborts context refresh instead of starting and silently consuming
      #       nothing. The listener additionally refuses a reply or error destination
      #       that is not a fully-qualified queue URL in its constructor, naming the
      #       property, because a consumer able to take requests off the request queue
      #       but unable to address its reply queue would acknowledge requests it
      #       never answered.
      #       (7) Assumptions: infra/modules/ecs-service therefore lists all three in
      #       required_parameter_environment_names.account, so a root that omits one
      #       fails at plan rather than at container start.
      #       (8) Refactoring Rationale: all three properties are named "-queue-url"
      #       and all three variables "..._QUEUE_URL", because all three values ARE
      #       addresses. infra/envs/dev/main.tf and infra/envs/prod/main.tf set each
      #       from a module.sqs.*_queue_url output, so the deployment has always
      #       supplied an address; the properties were nonetheless named for a queue
      #       NAME, and the listener read them that way and asked the queue service to
      #       look up a queue whose name was a URL. That could only fail, and it
      #       failed on the reply and diagnostic paths alone -- here reached only
      #       AFTER the request's ledger claim had been committed -- so requests were
      #       consumed, recorded as claimed and never answered while start-up and
      #       health both reported a working service. The names now state the
      #       contract, and com.carddemo.common.messaging.QueueDestination validates
      #       the shape at construction so a bare name stops start-up instead of
      #       stopping replies. This follows the naming
      #       CARDDEMO_MESSAGING_ERROR_QUEUE_URL already established in the same
      #       roots for the same reason.
      request-queue-url: ${CARDDEMO_ACCOUNT_INQUIRY_REQUEST_QUEUE_URL}
      reply-queue-url: ${CARDDEMO_ACCOUNT_INQUIRY_REPLY_QUEUE_URL}
      error-queue-url: ${CARDDEMO_ACCOUNT_INQUIRY_ERROR_QUEUE_URL}

      # WHY : (1) Refactoring Rationale: these three are declared HERE, as ordinary
      #       properties of this flow, because the @SqsListener attributes that read
      #       them no longer carry an inline default. They previously fell back to ten
      #       concurrent messages, ten per poll and a five-second wait written into
      #       the annotation itself. An annotation attribute takes precedence over the
      #       container factory's setting, so those fallbacks silently overrode
      #       application-dev.yml's deliberately smaller pair: the profile lowered
      #       spring.cloud.aws.sqs.listener.max-concurrent-messages and
      #       max-messages-per-poll to two, recorded a careful argument about
      #       oversubscribing the connection pool, and had no effect at all.
      #       Declaring the properties makes them mandatory, so an undeclared limit
      #       stops start-up rather than reinstating a value no file states, and it
      #       puts the number a profile has to override in the same place the
      #       annotation reads it from.
      #       (2) Assumptions: the base values MATCH the container-factory defaults
      #       above -- spring.cloud.aws.sqs.listener max-concurrent-messages and
      #       max-messages-per-poll are both ten and poll-timeout is 5s -- so this
      #       change alters no deployed behaviour by itself. It only makes the values
      #       reachable by a profile.
      #       (3) Assumptions: the pair must be lowered TOGETHER by any profile that
      #       lowers either. Spring Cloud AWS validates that max-messages-per-poll is
      #       less than or equal to max-concurrent-messages and refuses to start the
      #       container otherwise, so halving concurrency alone would not produce a
      #       smaller consumer -- it would produce a task that never starts.
      #       (4) Assumptions: the long-poll wait is expressed in whole SECONDS here
      #       because the annotation attribute is a second count, whereas
      #       spring.cloud.aws.sqs.listener.poll-timeout above is a duration. The two
      #       therefore cannot be aliased, and the value is written twice with this
      #       note rather than derived, because the number itself comes from the
      #       baseline's bounded get wait. It is the one number in this block no
      #       profile may vary.
      max-concurrent-messages: 10
      max-messages-per-poll: 10
      poll-timeout-seconds: 5

  internal-identity:
    # WHY : (1) Assumptions: these are KEY MATERIAL, not names or identifiers. Each is
    #       the symmetric secret one CALLING service signs its machine-to-machine
    #       bearer token with and this service verifies that caller's tokens against.
    #       Neither carries a default: a default would be a shared secret published in
    #       source, and anything able to read this repository could then mint a token
    #       this service accepts.
      #       Alternatives Considered: ONE key shared by both callers, which is the
    #       obvious simplification. Rejected -- with shared bytes either caller can
    #       mint a token carrying the other's subject and this service cannot tell,
    #       so its refusal and its audit record would name a caller they had no way
    #       to verify. One key PER CALLER lets this service select between them by
    #       the subject a presented token names, and it makes the blast radius of a
    #       leak specific rather than total: a key unlocks only the families its own
    #       caller is permitted to scope, which for the transaction context excludes
    #       the customer addresses entirely.
    #       Assumptions: the authoritative enumeration is ANCHORED here rather than
    #       copied -- config/InternalApiSecurityConfig.java internalPaths() for the
    #       addresses, and the closed table in common-lib InternalServiceToken for
    #       which caller may reach which family. A copied list understates what a
    #       leak unlocks the moment an address is added, and understating that is
    #       the one direction a disclosure statement must never err in.
    #       (2) Assumptions: config/InternalApiSecurityConfig.java reads this key
    #       through @Value with no default, refuses a blank value naming this
    #       property, and refuses one shorter than the digest width. The length check
    #       is performed there explicitly rather than left to the decoder builder,
    #       which was verified by running it and accepts a short key silently.
    #       (3) Alternatives Considered: a client-credentials grant from the managed
    #       identity provider, which would remove this value entirely. Unavailable,
    #       because infra/modules/cognito provisions the user pool with no hosted
    #       domain and therefore exposes no token endpoint for a machine caller. The
    #       full rationale, including why mutual TLS and a static shared header were
    #       both rejected, is recorded once on the security scheme in
    #       openapi/account-api.yaml rather than repeated here.
    #       (4) Assumptions: this value is UNRELATED to
    #       carddemo.security.jwt.expected-client-id above. That names the public
    #       identifier of the human app client and is not secret; this is a signing
    #       key. They are consumed by two different filter chains, and only the chain
    #       at config/InternalApiSecurityConfig.java consults this one.
    #       (5) Assumptions: unlike the three inquiry queue names below, these
    #       placeholders ARE bound by a bean and DO abort startup when unset, because
    #       they are read through @Value. A deployment missing either fails fast rather
    #       than serving the internal paths with a chain that can verify only one
    #       caller -- which would be worse than failing, because one caller's traffic
    #       would keep working and the other's would be refused with a 401 naming no
    #       property.
    authorization-signing-key: ${CARDDEMO_INTERNAL_IDENTITY_AUTHORIZATION_SIGNING_KEY}
    transaction-signing-key: ${CARDDEMO_INTERNAL_IDENTITY_TRANSACTION_SIGNING_KEY}

  # Two properties are deliberately NOT declared in this file and are documented here instead,
  # because service/AccountViewService.java takes CursorToken as a constructor argument -- it seals
  # the two boundary positions of the customer scan api/CustomerController.java publishes -- and a
  # bean that is not published cannot be injected:
  #
  #   carddemo.pagination.cursor.signing-key   base64 key material, at least 32 bytes
  #   carddemo.pagination.cursor.lifetime      ISO-8601 duration, defaulting to PT15M
  #
  # CardDemoCommonAutoConfiguration publishes one CursorToken bean and publishes it only when the
  # first property is set, so supplying it IS the wiring. The deployment supplies it from the
  # purpose-scoped secret both Terraform roots create, as the environment variable
  # CARDDEMO_PAGINATION_CURSOR_SIGNING_KEY -- Spring Boot's relaxed binding maps that spelling onto
  # the hyphenated property name. infra/modules/ecs-service lists the name in
  # required_secret_environment_names for this service and asserts biconditionally that exactly the
  # list-publishing services receive it, so a deployment that omits it fails at plan rather than at
  # container start.
  # Trade-offs: no key is written here even as an environment placeholder, and the second half of
  #   that is the part worth stating. A literal default would be a signing key committed to source,
  #   and any deployment failing to override it would accept keyset cursors minted by anyone holding
  #   this repository. A placeholder with no default is no better: the property then EXISTS and
  #   resolves during condition evaluation, so every context that merely imports the
  #   auto-configuration fails on an unresolvable placeholder rather than simply doing without the
  #   sealer -- which would break every repository integration test in this module, none of which
  #   pages anything. Leaving the property absent withholds the bean cleanly, and a deployed task
  #   that omits the variable still fails at startup, because the component named above requires it.
  #   This matches the same conclusion reached in the transaction, reference, reporting and
  #   authorization contexts; the reasoning is repeated rather than cross-referenced because a reader
  #   of this file would otherwise see an undeclared property and add the placeholder that breaks it.

  reference-context:
    # WHY : (1) Assumptions: the account update path validates three address fields
    #       against allow-lists this service does not own. app/cbl/COACTUPC.cbl
    #       checks the phone area code at line 2298, the state code and the
    #       state-with-postal-prefix pairing against the lists that originate in
    #       app/cpy/CSLKPCDY.cpy at L521, L931, L1013 and L1073. The migration seeds
    #       those rows into the reference context's schema, so under
    #       schema-per-service they are read over that context's published contract
    #       rather than over a database grant.
    #       (2) Assumptions: the address carries NO default, for the same reason the
    #       account context's own callers give. A default would let this service
    #       start against a plausible-looking wrong address and then report every
    #       address as invalid or every lookup as unavailable -- a wrong answer an
    #       operator would read as a data problem rather than as a misconfiguration.
    #       The value arrives from a Terraform output; infra/envs/{dev,prod}/main.tf
    #       set it.
    #       (3) Alternatives Considered: no internal-identity credential is needed
    #       for this hop, unlike the transaction context's reads of THIS service.
    #       The reference service grants every GET under /api/v1/reference/** to
    #       either group -- see the read rule in its config/SecurityConfig.java -- so
    #       service/RestReferenceAddressLookup.java relays the calling user's own
    #       bearer token. A minted machine token would grant MORE than the caller
    #       holds and would require a new audience, a new chain on the far side and a
    #       new key here, all to express an authority the caller already has.
    #       (4) Trade-offs: both timeouts are set and both are short, because setting
    #       one leaves the other unbounded and it is the read that hangs. These calls
    #       run inside the account update request, so an unbounded read would hold
    #       that request open for as long as the dependency stayed silent.
    base-url: ${CARDDEMO_REFERENCE_CONTEXT_BASE_URL}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

  messaging:
    # WHY : (1) Assumptions: these three are read TOGETHER by config/SqsConfig.java and
    #       are meaningless apart. The first two bound the queue client's own calls --
    #       the whole call including retries, and one network attempt within it -- and
    #       the third is the period the queue keeps a received message invisible to
    #       other consumers. common-lib's QueueClientBudget requires the whole-call
    #       bound to be STRICTLY shorter than that period, and refuses to start
    #       otherwise; the property names are published by that type so this file and
    #       the binding cannot drift apart.
    #       (2) Assumptions: the software development kit's default for both client
    #       bounds is NO bound, which is why they are declared at all. The inquiry
    #       reply is published from inside the message handler, before the listener
    #       returns, so a stalled publish is a stalled handler -- and a handler that
    #       outlives visibility does not merely run late: the queue makes the request
    #       visible again, a second consumer takes it, and two handlers answer one
    #       inquiry. Nothing in a log distinguishes that from ordinary redelivery.
    #       (3) Assumptions: visibility-timeout-seconds is a PROPERTY here rather than
    #       a value read from the queue, and sixty is what infra/modules/sqs provisions
    #       through its own visibility_timeout_seconds default. Reading it from the
    #       queue at startup was the alternative and is rejected twice over: context
    #       refresh would then require a reachable queue, and the check would silently
    #       pass in every test and local run where no queue exists. The consequence is
    #       that lowering the queue's period in Terraform without lowering it here
    #       leaves the comparison made against a number the queue no longer uses,
    #       which is why both defaults are the same value and why this names the
    #       module.
    #       (4) Assumptions: this property does NOT set the queue's visibility period.
    #       Nothing in this service can -- the period is a queue attribute owned by the
    #       infrastructure module. Stating that plainly is the point: a reader who took
    #       it for the setting would tune it expecting the queue to follow.
    api-call-timeout-ms: 10000
    api-call-attempt-timeout-ms: 5000
    visibility-timeout-seconds: 60

# =============================================================================
# Closing notes
# -----------------------------------------------------------------------------
# Alternatives Considered: setting management.metrics.tags.service,
#   management.metrics.tags.environment and management.metrics.tags.version here.
#   Those keys exist and would work - they were checked against this Spring Boot
#   release rather than assumed - so their absence is a decision and not an
#   omission. It was rejected because common-lib's MetricsConfig already
#   contributes exactly those three common tags for every service, and declaring
#   them again here would give one tag set two sources. The specific consequence
#   of that duplication is that this module's tag values could drift from its
#   siblings' after a single-file edit, and a dashboard grouping by service would
#   then show one deployable as two series while an alarm aggregating over the tag
#   would quietly stop covering it. What this file contributes to the tag set
#   instead is the inputs: spring.application.name above supplies the service
#   value, the imported shared defaults supply the environment and version values,
#   and the prometheus endpoint in the exposure list keeps the surface those tags
#   decorate reachable.
#
# Assumptions: this base file owns the common SHAPES - the listener, the
#   datasource, the pool, Flyway, JPA, the resource server, the SQS client, the
#   actuator, the served contract and the log levels - and application-dev.yml and
#   application-prod.yml override VALUES only. That is a contract, because both
#   profile files are written against it, so it is stated here rather than left as
#   a convention.
#
#   Four axes of variation are permitted, and only four: log levels; Hikari
#   connection-pool sizing, including the acquisition timeout a pausing dev
#   cluster needs; SQS listener sizing, meaning the concurrency ceiling and the
#   poll batch width; and log retention. Nothing else may differ between the two.
#
#   Alternatives Considered: two further axes that are deliberately NOT permitted
#   -- the breadth of the actuator health detail, and the statement echo flag
#   spring.jpa.show-sql. Both are excluded because permitting them is actively
#   harmful rather than merely loose. A dev profile free to widen the health detail
#   publishes a description of the data tier on the ONE route SecurityConfig leaves
#   unauthenticated, since neither the load-balancer target group nor the container
#   health check can present a token. A profile free to set spring.jpa.show-sql
#   points at a switch that writes to standard output OUTSIDE the logging
#   subsystem, so no level below can narrow it and the shared console pattern never
#   reaches it; org.hibernate.SQL below is the supported control and is what both
#   profiles use. Neither key is restated by either profile, so the actuator surface
#   and the echo flag are identical in both environments by construction rather
#   than by two values that could drift.
#
#   Assumptions: the listener axis is named because the concurrency ceiling and
#   the pool ceiling are one decision, not two. Each in-flight inquiry holds a
#   connection for the length of its three reads, so a concurrency ceiling above
#   the pool ceiling converts queue depth into connection-acquisition waits -- the
#   condition that existed while the dev profile narrowed the pool to four and
#   left this ceiling at the base ten. Both profiles now state both numbers, which
#   is what keeps the pair auditable side by side.
#
#   Retention is the fourth axis and is the one axis with NO key in any of these
#   three files: it is a property of the CloudWatch log group, owned by
#   infra/modules/observability. Both profiles record that where their log levels
#   are set, so that a reader does not invent an application-level retention key
#   -- the binder would accept it, it would appear to have been set, and it would
#   do nothing.
#
#   Six axes are forbidden outright: service topology, route structure, schema
#   ownership, identity mechanism, use of a message transport, and datastore type.
#   A profile that changed any of those would no longer be the same service
#   configured differently.
#
#   The concrete consequence of holding the shapes invariant is diagnostic:
#   because dev and prod differ only in those four values, a defect reproduced in
#   dev is reproducible in prod, and a failure seen only in prod is attributable
#   to data or to capacity rather than to configuration drift. Without the
#   invariant, every prod-only failure would first have to be cleared of being a
#   configuration difference before it could be investigated as anything else.
#
# Assumptions: this module runs no scheduled job and no batch job, so there is no
#   spring.batch key and no scheduling key here. services/account-service/pom.xml
#   declares neither spring-boot-starter-batch nor spring-boot-starter-quartz, and
#   both files record the absence for the same reason: an added key with no
#   artifact behind it is silently ignored, and an added artifact with no caller
#   enlarges the image and the task role's permissions for nothing. The sequential
#   read programs this context absorbs - app/cbl/CBACT01C.cbl, CBACT03C.cbl and
#   CBCUS01C.cbl - are read paths behind endpoints here, not scheduled jobs; the
#   nightly chain lives in batch-service and is driven by Step Functions.
#
# Assumptions: there is deliberately no spring.sql.init key. This module owns a
#   Flyway migration, so the framework's schema.sql and data.sql mechanism must
#   never also run; the absence is safe here because no such file exists in this
#   module and Flyway is the declared owner of the DDL. reporting-service pins the
#   key explicitly because it owns no relational object at all and therefore has a
#   different failure to prevent.
# =============================================================================
