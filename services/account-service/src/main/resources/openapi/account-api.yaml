# =============================================================================
# services/account-service/src/main/resources/openapi/account-api.yaml
# -----------------------------------------------------------------------------
# Purpose:
#   The OpenAPI 3.1 contract of record for every operation the account bounded
#   context publishes. It settles the paths, the operation identifiers, the
#   property names, the response shapes, the rendering of money, the concurrency
#   precondition and the status set of each, so that a consumer is written
#   against this document rather than against a reading of this module's Java.
#
# The two surfaces this document covers, and how to tell them apart:
#   SEVEN INTERNAL READS, tagged internal, are consumed by neighbouring bounded
#   contexts rather than by a browser. Five are DECISION-PATH reads that the
#   pending-authorization and transaction contexts issue while deciding: the
#   three cross-reference lookups, the account lookup and the customer presence
#   check. The remaining two -- the ascending customer scan and the keyed
#   customer record read -- are the migrated surface of app/cbl/CBCUS01C.cbl and
#   disclose a whole customer record; they require a DIFFERENT scope, declared on
#   each as an x-carddemo-required-scope, and no caller in this deployment issues
#   either. The decision-path client is
#   services/authorization-service/src/main/java/com/carddemo/authorization/
#   service/RestAccountContextClient.java, which builds each path itself and
#   deserialises each response into its own record. The modules are separate
#   deployables and the layering rules forbid either importing the other's
#   types, so no compiler and no build sees both halves of that agreement. This
#   document is the only place the whole of it is written down.
#
#   Refactoring Rationale: this count read THREE and named one consuming context.
#   It was accurate when the internal surface was three cross-reference lookups
#   and it stopped being accurate as the surface grew, twice over -- so a reader
#   counting operations found seven where the document promised three, and had no
#   way to tell which of the two numbers was the mistake.
#
#   THREE END-USER OPERATIONS, tagged end-user, are consumed by the browser
#   client. They are the migrated forms of the two account screens and of the
#   baseline's by-account alternate-index browse.
#
#   Assumptions: the two surfaces are distinguished three ways at once, each
#   machine-readable rather than prose: by tag, by the security scheme each
#   operation names, and by the origin each declares under servers. They are
#   NOT distinguished by path prefix, because the account master is legitimately
#   read both ways and a second prefix for one caller would mean two published
#   contracts and two handlers for one query -- recorded in full on
#   SecurityConfig.ACCOUNT_PATH_PATTERN, where the separation is made by filter
#   CHAIN instead.
#
# Why every mounted operation appears here:
#   Refactoring Rationale: an earlier revision of this document declared the
#   three internal reads ALONE, and recorded a deliberate decision to leave the
#   human account view and update out until they were built. They were then
#   built and mounted, and this document was not extended -- so three routes
#   answered requests that no contract described, which is the exact inverse of
#   the defect the sibling auth and card contracts were corrected for, where a
#   contract published operations no handler served. Both directions are now
#   asserted mechanically: AccountContextContractTest compares the set of
#   mapping annotations across all three adapters of this package with the set
#   of operations declared below and fails on any difference in either
#   direction, so a route added without a contract entry fails the build and so
#   does a contract entry added without a route.
#
# Parameters:
#   Requests carry input in four forms and each is described again where it is
#   declared.
#     - Two path parameters: the account identifier and the customer
#       identifier, both integers, declared under components/parameters. Both are
#       carried ONLY by end-user operations and by the keyed customer record
#       read; no decision-path lookup places an identifier in a path.
#     - Four request bodies: CardXrefLookupRequest, AccountLookupRequest and
#       CustomerLookupRequest on the internal lookups, each carrying in a body an
#       identifier that would otherwise reach the load balancer's access record
#       through the request line; and AccountUpdateRequest on the end-user
#       update.
#     - One required request header: If-Match on the update, carrying the
#       revision the caller was given. It is required rather than optional
#       because an optional precondition is one a caller opts out of by omitting
#       it, and opting out means the silent overwrite the check exists to
#       remove.
#     - Query parameters on the two PAGED walks only: cursor and direction on the
#       by-account cross-reference search, cursor and size on the customer scan.
#       Each carries a position or a bound and never an identifier, so none of
#       them puts a prohibited value in a request line. Refactoring Rationale:
#       this entry read "No query parameter is accepted by any operation", which
#       was true of the three-operation surface it was written for and false of
#       both paged walks added since.
#     - The correlation header the platform propagates is accepted on every path
#       in this system and is not redeclared per operation here.
#
# Return values:
#     - CardXrefView, from the two internal cross-reference lookups: the account
#       and the customer the card belongs to. It does not echo the card number.
#     - CardXrefPage, from the internal by-account cross-reference search: one
#       keyed page of rows with its two boundary tokens.
#     - AccountContextView, from the internal account lookup: the credit limit,
#       the cash credit limit and the posted balance, each rendered as a JSON
#       string.
#     - No body at all from the internal customer presence check. Its whole
#       answer is its status, on both outcomes.
#     - CustomerPage from the internal customer scan and CustomerResponse from the
#       internal keyed record read. These are the two operations that disclose a
#       whole customer record and are the reason they carry a scope of their own.
#     - AccountViewResponse, from the end-user view: the account's ten fields
#       beside its customer's eighteen, with the revision in an ETag header.
#     - AccountUpdateResponse, from the end-user update: the committed state and
#       the NEW revision in an ETag header, so consecutive edits need no
#       intervening read.
#     - An array of CardXrefResponse from the end-user by-account listing,
#       empty when the account holds no card.
#
# Exceptions / error responses:
#   Every failure is rendered by the shared advice in common-lib as one problem
#   document, so the error vocabulary is identical to every other contract in
#   this migration and a client writes one error handler rather than one per
#   service. The statuses this document emits, and what each means here:
#     - 400  Caller input refused, nothing read and nothing written. The
#            fieldErrors array names the offending request property. On the two
#            end-user account operations this also covers an all-zeroes account
#            identifier, because the reference refuses that key rather than
#            treating it as one that matches nothing.
#     - 401  No credential, or one the verifier does not admit.
#     - 403  A credential the verifier admits but which lacks the authority or
#            the scope the route requires. An internal token presented to an
#            end-user operation, or the reverse, lands here rather than on 401.
#     - 404  The keyed row does not exist. Never returned as a 200 carrying
#            nulls, because the consuming context treats an absence as a
#            decision input and a missing member as a dependency failure, and
#            those two have opposite meanings on its side.
#     - 409  THE OPTIMISTIC-LOCK CONFLICT, and the status this document exists
#            to get right. It is emitted by the update alone, when the If-Match
#            revision does not name the stored state -- either because another
#            writer changed the row between the caller's read and its request,
#            or because the precondition was blank, or because the persistence
#            provider found the version stale between this transaction's read
#            and its flush. The body carries the reference's own changed-record
#            sentence verbatim and a fieldErrors entry keyed version reporting
#            the CURRENT revision, so a caller re-reads and retries without a
#            second round trip. It is the target form of the before-image
#            comparison app/cbl/COACTUPC.cbl performs across the
#            pseudo-conversational gap, whose failure branch there rolls the
#            unit of work back at L4100 rather than reporting a status.
#     - 500  A fault that is not the caller's. This is the only status whose
#            body carries the abend block; its presence is the signal that the
#            failure was not caller input.
#     - 503  A dependency is unavailable, or writes are quiesced for the batch
#            window.
#   Assumptions: each operation declares EVERY status it can produce and no
#   status it cannot. Both halves of that are load bearing -- a declared status
#   no response can produce is a branch a client writes and never reaches, and
#   an undeclared status it does produce is a branch the client does not write
#   at all. Two consequences are worth naming because they are easy to get wrong
#   in the other direction: the by-account listing declares NO 404, because an
#   account with no card is an empty list rather than an absence; and every
#   operation with a numeric path parameter declares 400, because a segment that
#   will not convert to that number is refused as caller input.
#
# Authorization:
#   The internal reads are governed by a dedicated filter chain,
#   src/main/java/com/carddemo/account/config/InternalApiSecurityConfig.java,
#   ordered ahead of the application chain and matching exactly the seven
#   method-and-address pairs below. It requires a bearer token issued by the
#   calling service, naming itself as the token subject from the closed set the
#   verifier admits, and carrying the scope that route's group requires -- the
#   decision-path scope for five of them and the customer-master scope for the
#   two that disclose a record. An identity-provider token does not satisfy it.
#   The end-user operations are governed by the application chain in
#   src/main/java/com/carddemo/account/config/SecurityConfig.java, whose
#   catch-all admits either business group -- so each declares
#   x-required-authorities naming both, and the contract test compares that list
#   with the constant the chain enforces.
#
# Reference sources (REFERENCE-ONLY; read as the specification, never modified):
#   app/cbl/CBACT03C.cbl  - the cross-reference reader, 178 lines. Its file is
#                           keyed by card number, which is why the lookup below
#                           takes a card number and returns the two identifiers.
#   app/cbl/CBACT01C.cbl  - the account master reader, 430 lines.
#   app/cbl/CBCUS01C.cbl  - the customer master reader, 178 lines.
#   app/cbl/COACTVWC.cbl  - the account-view screen program, migrated as the
#                           end-user view operation.
#   app/cbl/COACTUPC.cbl  - the account-update screen program, migrated as the
#                           end-user update operation. Its before-image
#                           comparison at L669 and L521 is what the ETag and
#                           If-Match pair reproduces.
#   app/cpy/CVACT03Y.cpy  - the 50-byte cross-reference record layout.
#   app/cpy/CVACT01Y.cpy  - the 300-byte account record layout, which declares
#                           each monetary field as a signed zoned decimal with
#                           two fractional digits.
#   app/cpy/CVCUS01Y.cpy  - the 500-byte customer record layout.
#   app/cpy-bms/COACTVW.CPY, app/cpy-bms/COACTUP.CPY - the two symbolic maps the
#                           end-user shapes take their SCREEN widths from, which
#                           disagree with the record widths for four fields.
#   app/csd/CARDDEMO.CSD  - L63 defines the CXACAIX alternate index this
#                           context replaces with a secondary index.
# =============================================================================

openapi: 3.1.0

# WHY : Assumptions: THIS FILE IS THE CONTRACT OF RECORD, and the four info members below
#       are the source the Java side copies rather than the other way round.
#       config/OpenApiConfig.java holds a title, version, summary and description as
#       string constants and states in its own header that each is reproduced from the
#       corresponding member here, so that a comparison between the document springdoc
#       generates at run time and this file finds those members equal rather than merely
#       similar. The direction matters because the two are edited by different hands: an
#       edit to any member below obliges the same edit to the matching constant there,
#       and an edit made only on the Java side is a regression against this file no
#       matter which value reads better. It is recorded here because nothing in the
#       build compares the two -- the contract tests pin the security scheme, its
#       scopes and the specification version, and stop short of the info block -- so a
#       divergence in these four members is visible to a reader and to nothing else.
# WHY : Assumptions: the specification version is declared 3.1.0 and not a 3.0 release,
#       and members used below exist only from 3.1 -- a summary on the info object, a
#       type union expressed as an explicit 'null' member rather than the 3.0-era
#       nullable flag, and an SPDX-era licence object. Decision D6 of the migration
#       plan fixes 3.1 for every service contract, so a 3.0 declaration here would not
#       merely be older, it would make the nullable page cursors below unexpressible in
#       the form the shared page envelope actually serialises.
info:
  title: CardDemo Account Context API
  version: 2.0.0
  summary: >-
    The account master, its customer and its card cross-reference, published on
    an internal surface a workload credential reaches and on an end-user surface
    the browser client reaches as the two migrated account screens and the
    by-account browse.
  description: >-
    This document covers both surfaces of the account bounded context. Three of
    the internal reads each replace one keyed file read performed by a reference
    batch program, and together they supply the three facts an authorization
    decision needs: which account and customer a card belongs to, what that
    account's limits and balance are, and whether the customer exists. The three
    end-user operations replace app/cbl/COACTVWC.cbl, app/cbl/COACTUPC.cbl and
    the baseline's CXACAIX alternate-index browse.


    The remaining two internal reads -- the customer record projection and the
    ascending customer scan -- carry app/cbl/CBCUS01C.cbl, whose file definition
    declares ACCESS MODE IS SEQUENTIAL at line 31 and RECORD KEY IS FD-CUST-ID at
    line 32, and whose driver loop at lines 70 to 87 sweeps that key ascending
    with no filter. They are published on the internal surface rather than the
    end-user one because no baseline screen reads a customer record directly:
    that program carries no EXEC CICS verb and appears in no resource definition,
    so a workload credential is the only one that fits, and granting a business
    group would add a capability the reference never had. This paragraph was
    added because the two operations were mounted and declared while the prose
    above still described the internal surface as three reads -- the same
    contract-versus-handler drift the version note below records, in the
    direction where the prose rather than the route set falls behind.


    Money is rendered as a JSON string throughout. That is not a stylistic
    choice: every monetary field in the reference layouts is an exact
    fixed-point value with two fractional digits, and a JSON number is parsed
    into a binary floating-point double by most clients, which cannot represent
    every such value exactly. Transformation rule T3 of the migration plan
    forbids binary floating point anywhere in the money path, and a string is
    how that prohibition survives the wire.


    The version is 2.0.0 rather than 1.1.0 because the previous revision
    described this service as publishing an internal read surface only, and the
    shape of the ApiError problem document it declared was not the shape this
    system emits -- so a client generated from 1.0.0 has both an incomplete
    route set and an error type it cannot bind. Neither is a compatible
    addition.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://{internalHost}
    description: >-
      The internal service origin. These operations are not published at the
      public edge: they are reachable only from inside the private network, and
      the calling service additionally pins this origin exactly before it will
      send a request to it.
    variables:
      internalHost:
        default: carddemo-dev.services.internal
        description: >-
          The internal host name the environment provisions. The value shown is
          the development default; each environment supplies its own and the
          caller reads it from configuration rather than composing it.

# WHY : Assumptions: two of the five tags name the SURFACE rather than the
#       subject, and every operation carries one of them. That is what makes the
#       internal / end-user split machine-readable: a generator, a gateway or a
#       reviewer can select one surface without reading prose, where the previous
#       revision's split was implicit in which operations happened to be present.
tags:
  - name: internal
    description: >-
      Reachable only with a service-minted token carrying the internal read
      scope, and only from inside the private network. An identity-provider
      token does not satisfy these operations and the internal token satisfies
      no other path.
  - name: end-user
    description: >-
      Reachable with an identity-provider token carrying either business group,
      through the public edge. These are the migrated online screens.
  - name: card-cross-reference
    description: >-
      Resolution of a primary account number to its account and customer, and
      the by-account listing that replaces the CXACAIX alternate index.
  - name: account
    description: Reads and edits of the account master.
  - name: customer
    description: >-
      Reads of the customer master and the presence check the authorization path
      issues against it. The reads replace app/cbl/CBCUS01C.cbl, a batch reader
      with no CICS transaction behind it, which is why they carry a workload
      credential rather than an identity-provider one.

paths:

  /api/v1/card-xrefs/lookup:
    post:
      tags: [internal, card-cross-reference]
      operationId: lookupCardCrossReference
      summary: Resolve a primary account number to its account and customer.
      description: >-
        Replaces the keyed read of the cross-reference file at
        app/cbl/CBACT03C.cbl, whose record is declared with
        RECORD KEY IS FD-XREF-CARD-NUM at L32.


        This operation is a POST carrying a body rather than a GET carrying the
        card number in the path, and that is a deliberate departure from the
        shape a read would otherwise take. A path segment is recorded verbatim
        in the access log of every hop it traverses -- the load balancer, the
        gateway and the application -- and a primary account number in a log is
        a disclosure that no amount of downstream masking can withdraw. A body
        is not logged by default at any of those hops. The alternative
        considered was a GET with the card number as a query parameter, which
        was rejected for the same reason: query strings are logged with the
        path.
      security:
        - internalServiceToken: []
      requestBody:
        description: >-
          The primary account number to resolve, as the sole input. It travels in
          the body and not in the request line because a request line is composed
          into an access record before any application code runs, and this value is
          one the logging contract withholds from a durable diagnostic.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardXrefLookupRequest'
      responses:
        '200':
          description: >-
            The card is cross-referenced. The body carries the account and the
            customer it belongs to and does not echo the card number: the caller
            supplied it, so returning it would place a primary account number in
            a further response body and a further client's memory for no gain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardXrefView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            No cross-reference row exists for the card. The problem document's
            detail names no part of the card number, because the caller already
            knows which card it asked about. The calling context reads this
            status as its card-not-found decision input, which corresponds to
            reject reason 100 in the reference posting program.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/card-xrefs/lookup-by-account:
    post:
      tags: [internal, card-cross-reference]
      operationId: lookupCardCrossReferenceByAccount
      summary: Resolve an account to the cross-reference row its lowest card holds.
      description: >-
        This is the CXACAIX access path as a single keyed read. The baseline
        surfaces the alternate index to the online region under the literal
        declared at app/cbl/COACTVWC.cbl L192 and L193, and paragraph
        9200-GETCARDXREF-BYACCT. at L723 consumes it at L727 through L732 as ONE
        EXEC CICS READ with RIDFLD and KEYLENGTH -- a deterministic
        single-record read and not a browse. The base cluster cannot serve this
        read: its key is the card number, per RECORD KEY IS FD-XREF-CARD-NUM at
        L32 of app/cbl/CBACT03C.cbl.


        Assumptions: the target index idx_card_xref_account_id is NOT unique, so
        an account may hold more than one row. This operation answers with the
        row whose card number orders lowest, which is the base cluster's own
        order per ACCESS MODE IS SEQUENTIAL at L31 of app/cbl/CBACT03C.cbl, so
        two identical requests cannot differ. A caller needing every row of a
        multi-card account uses the paged walk below instead.


        Assumptions: the account identifier travels in a body rather than in the
        request line, for the same reason the card-keyed lookup above does. A
        load balancer composes its access record from the request line before
        any application code runs, and the migration's sensitive-data logging
        contract names account identifiers among the values a durable diagnostic
        may not hold.
      security:
        - internalServiceToken: []
      requestBody:
        description: >-
          The internal account identifier whose cross-reference row is wanted, as
          the sole input. It is carried in the body for the same reason the
          card-keyed lookup beside it is: the key is withheld from access records.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLookupRequest'
      responses:
        '200':
          description: >-
            The account is cross-referenced. The body carries the account, the
            customer AND the selected card number in full.


            Refactoring Rationale: this response previously carried CardXrefView,
            the same two-identifier shape the card-keyed lookup answers with, and
            said that it "does not echo any card number". That was the wrong shape
            for this operation and the sentence described the defect rather than a
            protection: a card-keyed caller supplied the card and needs the account
            and customer, while an ACCOUNT-keyed caller supplied the account and the
            value it asked for is the card. The consuming context transcribes
            READ-CXACAIX-FILE at lines 576 to 604 of app/cbl/COTRN02C.cbl and the
            same read at line 414 of app/cbl/COBIL00C.cbl, both of which take
            XREF-CARD-NUM from the record and write the row they produce under it,
            so neither could produce a row at all from the narrower shape.


            Trade-offs: the card number is NOT masked here, where the paged walk
            below masks the same column to its last four digits. The two contracts
            serve different audiences: that one is an end-user page where a whole
            primary account number has no reader, while this one answers a machine
            operation whose consumer writes the value into a ledger row as a KEY, so
            a masked value would be a different key and the transaction would be
            written against a card that does not exist. What limits the exposure is
            reachability instead -- this prefix requires a machine token, the public
            gateway publishes no route to it, and the load balancer forwards it only
            from inside the network.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardXrefByAccountView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            The account has no cross-referenced card. The baseline declares this
            outcome at app/cbl/COACTVWC.cbl L129 and L130 as
            DID-NOT-FIND-ACCT-IN-CARDXREF with the sentence "Did not find this
            account in account card xref file". The calling context reads this
            status as its account-not-cross-referenced decision input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/card-xrefs/search-by-account:
    post:
      tags: [internal, card-cross-reference]
      operationId: searchCardCrossReferencesByAccount
      summary: Walk one account's cross-reference rows a page at a time.
      description: >-
        Refactoring Rationale: this operation is a documented SUPERSET of the
        baseline's account-keyed access rather than a restatement of it. The
        baseline performs a single keyed read -- one EXEC CICS READ at
        app/cbl/COACTVWC.cbl L727 through L732, inside
        9200-GETCARDXREF-BYACCT. at L723 -- and so answers with one record,
        while the target index idx_card_xref_account_id is not unique and an
        account may hold several rows. This operation therefore returns a
        bounded, ordered set where the baseline returns one row. The divergence
        is documented here rather than introduced silently, and the
        single-record shape remains available at
        /api/v1/card-xrefs/lookup-by-account.


        Alternatives Considered: addressing a page by its ordinal position in
        the result was rejected in favour of paging by key. Under concurrent
        insertion a row inserted ahead of the reader's position shifts every
        later row by one, so the following request re-serves a row already
        received and passes over one that was not. The baseline is already a
        keyset cursor: app/cbl/COCRDLIC.cbl carries a last-key pair at L230
        through L232, a first-key pair at L233 through L235, a screen number at
        L237, a last-page-displayed flag at L239 whose conditions read 0 for
        shown at L240 and 9 for not shown at L241, and a next-page indicator at
        L242 through L244 set by discovering one more record than the seven a
        screen holds, declared at L177 and L178 and counted at L145. There is no
        offset, no row number and no page-size member anywhere in that
        structure. The screen number and the last-page flag are deliberately
        dropped, so no page number crosses the wire.


        Assumptions: the cursor is opaque and sealed rather than raw. The
        physical key it carries is the card number, a PIC X(16) primary account
        number per L5 of app/cpy/CVACT03Y.cpy, so a raw cursor would publish in
        every page the value this context masks everywhere else. The token is
        bound to this query, to the direction and to the subject it was issued
        for, and the subject is read from the validated token rather than from
        the request.


        Assumptions: the page size is fixed by the service at the seven rows the
        baseline screen holds and is not accepted from the caller, so the
        surplus-row probe that settles hasNext stays inside the layer issuing
        the query.
      security:
        - internalServiceToken: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: >-
            The sealed boundary token the previous page ended on. Omitted to read
            the first page.
          schema:
            type: string
            maxLength: 256
        - name: direction
          in: query
          required: false
          description: >-
            The step to take from that boundary. A backward step with no cursor
            reads the first page forward rather than failing, because a backward
            walk is only expressible from a set already returned.
          schema:
            type: string
            enum: [next, previous]
      requestBody:
        description: >-
          The internal account identifier whose cross-reference rows are wanted, as
          the sole body input. The page position and bound travel as query
          parameters instead, because a cursor names no account and nothing is
          withheld by logging it.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLookupRequest'
      responses:
        '200':
          description: >-
            One page of the account's rows in ascending card-number order, with
            both boundary tokens and the further-page indicator. An account with
            no card yields an EMPTY page rather than a 404, matching an
            alternate-index browse that ends immediately. Every card number is
            masked to its last four digits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardXrefPage'
        '400':
          description: >-
            The account identifier would not convert to a number, or the cursor
            could not be opened because it was sealed for another query, another
            subject or the other direction. The fieldErrors array names the
            member at fault.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/accounts/lookup:
    post:
      tags: [internal, account]
      operationId: lookupAccountContext
      summary: Read the limits and posted balance of one account.
      description: >-
        Replaces the keyed read of the account master at app/cbl/CBACT01C.cbl.
        The three values returned are the three the reference authorization
        decision examines; the remaining account columns are deliberately not
        published, because a consumer that does not read a value should not
        receive it.


        Refactoring Rationale: this operation was GET /api/v1/accounts/{accountId}
        and the identifier travelled in the path. It is now a POST carrying the
        identifier in a body, for the same reason the two account-keyed
        cross-reference operations above give: a load balancer composes its access
        record from the request line before any application code runs, and the
        migration's sensitive-data logging contract names account identifiers among
        the values a durable diagnostic may not hold. The keyed form is REMOVED
        rather than retained as an alias, because an alias would leave that
        disclosure reachable by anyone who addressed it.


        Trade-offs: as a POST the operation is neither cacheable nor idempotent by
        method semantics. Neither costs its two consumers anything -- both are
        internal service clients calling it once inside a transaction they are
        about to commit or roll back, so neither would reuse a cached answer.
      security:
        - internalServiceToken: []
      requestBody:
        description: >-
          The internal account identifier to resolve, as the sole input. This
          operation exists because the neighbouring authorization context reads
          three amounts against an account; the identifier moved out of the request
          line so it appears in no access record on either side.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLookupRequest'
      responses:
        '200':
          description: The account exists. Every monetary value is a JSON string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountContextView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            The account master holds no such row. The calling context reads this
            status as its account-not-found decision input, which corresponds to
            reject reason 101 in the reference posting program.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/accounts/update:
    post:
      tags: [end-user, account]
      operationId: updateAccount
      summary: Apply an edited account and customer under a revision precondition.
      description: >-
        Replaces app/cbl/COACTUPC.cbl. One submission carries the account's
        editable fields and its customer's together, because the reference screen
        does: its map has 128 fields across both records and one enter key
        commits them, so splitting them into two operations would make a screen
        that either succeeded or failed as a whole succeed in halves.


        The precondition is REQUIRED. The reference performs a genuine
        before-image comparison across the pseudo-conversational gap -- it
        snapshots the whole pre-edit record at app/cbl/COACTUPC.cbl L669 and
        tests a change flag at L521 -- because its read-for-update lock is not
        held across a user's think time. The target reproduces that with an
        optimistic version, published as an ETag by the view operation and
        required back here as If-Match.


        Alternatives Considered: answering a stale precondition with 412
        Precondition Failed, which is the status HTTP defines for a failed
        If-Match. Rejected in favour of 409, because the reference's own answer
        is a screen message naming the condition and this system carries that
        sentence verbatim in a conflict body; 412 is defined as bodyless in
        spirit and would leave the sentence nowhere to go. The trade-off is
        recorded rather than hidden: a client written to HTTP semantics alone
        will not expect 409 here, which is why it is declared explicitly below.


        Refactoring Rationale: this operation was PUT /api/v1/accounts/{accountId} and
        the identifier travelled in the path. It is now a POST at a fixed address with
        the identifier in the body, for the reason the account lookup above gives: a
        load balancer composes its access record from the request line, inside the
        process terminating the connection and before any application code runs, so a
        path segment reaches a durable store no masker, filter or exception handler
        inside a service can reach -- and this migration's sensitive-data contract names
        account identifiers among the values a durable diagnostic may not hold. The keyed
        form is REMOVED rather than kept as an alias, because an alias would leave the
        disclosure reachable by anyone who addressed the older shape.


        Assumptions: the move added NO property to the request. The submitted record
        already carried the account identifier as its first member -- screen field
        ACCTSIDI at app/cpy-bms/COACTUP.CPY L60, which the reference user types into the
        map -- so the path variable was a second spelling of a value the body already
        held, and the body's is the one the reference has. One consequence is an
        improvement rather than a cost: the operation now has ONE key where it had two,
        so a submitted identifier that disagreed with the addressed one is no longer
        expressible.


        Trade-offs: POST rather than PUT gives up idempotence by method semantics, and
        costs this operation nothing because it was never idempotent in effect -- it is
        conditional on If-Match, so a repeated submission of the same body is refused
        with 409 by the precondition rather than applied twice.
      servers:
        - url: /
          description: >-
            The origin that served this document. This operation is published at
            the public edge behind the gateway's identity-provider authorizer,
            not at the internal origin the document-level entry names.
      security:
        - bearerAuth: []
      x-required-authorities: [carddemo-admin, carddemo-user]
      parameters:
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        description: >-
          The complete submitted state of the account edit -- all forty-three screen
          values, every one a string, the FIRST of which names the account to update.
          Absent and unchanged are not distinguished here: the reference normalises a
          blank or asterisk to low-values before validating, so a value the caller
          leaves empty arrives empty rather than missing. The revision the edit is
          conditional on travels in the If-Match header and not in this body.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: >-
            The edit committed. The body carries the state as stored, with both
            protected identifiers already masked, and the ETag header carries the
            NEW revision so a caller performing consecutive edits does not have
            to re-read the account between them.
          headers:
            ETag:
              $ref: '#/components/headers/RevisionETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUpdateResponse'
        '400':
          description: >-
            The request was refused before anything was written. Five causes
            produce this status and each names its offending request property in
            the fieldErrors array: the If-Match header was absent; the body could
            not be read; the submitted account identifier was absent, was not
            digits, was wider than eleven of them or was all zeroes, which the
            reference's own key edit refuses under accountId with the sentence it
            composes; a submitted value was absent where the reference requires
            one, was wider than the field it is stored in, held a character its
            numeric picture cannot carry, or was one part of a telephone number
            or date of birth whose other parts were not supplied; or a submitted
            state, postal or area code lies outside a reference allow-list.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            The account master or the customer the account resolves to holds no
            such row. Nothing was written.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        # WHY : Assumptions: the sentence in the example below is reproduced BYTE-FOR-BYTE
        #       from app/cbl/COACTUPC.cbl, where 88 DATA-WAS-CHANGED-BEFORE-UPDATE is
        #       declared at L521 with its literal at L522, and two of its properties are
        #       load-bearing rather than typographical. "some one" is TWO WORDS in the
        #       reference, so the single-word spelling is a different string and would be a
        #       reworded message rather than a carried one; and the literal ENDS at
        #       "review" with no closing period, because the period that appears after the
        #       closing quote at L522 is the COBOL statement terminator and not part of the
        #       value. No character count is asserted for it here on purpose: the physical
        #       line is the only authority for its length, and a count written into prose
        #       is a second place for that fact to be wrong.
        # WHY : Assumptions: this status is emitted by the SHARED advice in common-lib and
        #       not by any local handler, so the wording below and the wording that advice
        #       carries must agree. Recording the coupling here is what stops one of the
        #       two being edited alone.
        '409':
          description: >-
            The precondition does not name the stored state, so the row was
            changed by another writer between the caller's read and this request,
            and nothing was written. The body carries the reference's own
            changed-record sentence and a fieldErrors entry keyed version
            reporting the CURRENT revision, so a caller can re-read and retry
            without a second round trip to discover what it changed to. The same
            status answers a blank precondition and a version the persistence
            provider found stale between this transaction's read and its flush.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
              # WHY : Assumptions: every member below is the value the shared advice actually
              #       emits for this condition, read from ApiError.CODE_CONFLICT and the
              #       ofConflict factory in common-lib rather than chosen to look plausible:
              #       the code is CARDDEMO-0409, the severity WARNING, and the subsystem
              #       RELATIONAL. RELATIONAL rather than a subsystem naming this context is
              #       what the Subsystem schema requires -- a contention refusal reports the
              #       store the contention is over even when this service is what noticed it
              #       -- and the fieldErrors entry is keyed version because that is the key
              #       the FieldError schema reserves for a 409. An example that disagreed
              #       with the advice would be a client's binding failure rather than a
              #       documentation nit, since this body is the only one a 409 ever carries.
              example:
                code: 'CARDDEMO-0409'
                secondaryCode: ''
                message: 'Record changed by some one else. Please review'
                severity: WARNING
                subsystem: RELATIONAL
                status: 409
                correlationId: '00000000-0000-4000-8000-000000000000'
                path: /api/v1/accounts/update
                timestamp: '2024-01-15 09:30:00.000000'
                fieldErrors:
                  - field: version
                    state: NOT_OK
                    message: 'Record changed by some one else. Please review'
                    error: true
                abend: null
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/accounts/view:
    post:
      tags: [end-user, account]
      operationId: readAccountView
      summary: Read one account and its customer for the account-view screen.
      description: >-
        Replaces app/cbl/COACTVWC.cbl, which reads the account master by key,
        follows the pairing to the customer master and fills one screen from
        both. Both reads happen in ONE read-only transaction, so the account and
        the customer on one screen are consistent with each other; two
        transactions could return a pairing that never existed.


        This is a SEPARATE path from the internal read at the parent address, and
        deliberately so: that one serves a neighbouring bounded context and
        carries three amounts, this one serves a screen and carries the account's
        ten fields beside its customer's eighteen. One path returning whichever
        shape a caller preferred would make the response type depend on a header,
        and neither caller could then be given a stable contract.


        The customer is located through the CROSS-REFERENCE rather than through a
        column on the account, because the account record declares no customer
        identifier -- the baseline resolves the pairing through CXACAIX. A
        missing cross-reference row and a missing customer row are reported as
        the same 404 as a missing account: the distinction is real but is not
        actionable by the caller, and naming which would disclose the shape of
        the data.


        Refactoring Rationale: this operation was GET /api/v1/accounts/{accountId}/view
        and the identifier travelled in the path. It is now a POST at a fixed address
        with the identifier in the body, for the reason the account lookup above gives:
        the load balancer's access record is composed from the request line before any
        application code runs, and this migration's sensitive-data contract names account
        identifiers among the values a durable diagnostic may not hold. The keyed form is
        REMOVED rather than kept as an alias.


        Trade-offs: as a POST this read is no longer cacheable by method semantics. That
        costs nothing here and would have been unsafe to rely on in any case: the answer
        carries the ETag the update requires back as If-Match, so a caller that served a
        cached body would submit a revision the store had already moved past and receive
        409 for a conflict that did not exist. Alternatives Considered: keeping the GET
        and sealing the identifier into an opaque selector, which is how the card contract
        addresses one card. Rejected because a selector has to be MINTED by the service
        and handed to the caller, and this operation is the ENTRY point -- the user types
        the identifier into a filter field, so there is no prior response for a token to
        come from and a selector scheme would still need a body-carrying operation here to
        issue one.
      servers:
        - url: /
          description: >-
            The origin that served this document. This operation is published at
            the public edge behind the gateway's identity-provider authorizer,
            not at the internal origin the document-level entry names.
      security:
        - bearerAuth: []
      x-required-authorities: [carddemo-admin, carddemo-user]
      requestBody:
        description: >-
          The account to read, as the sole input. It is carried in the body rather than
          in the request line for the reason recorded above, and the schema is the one
          the internal context read uses: both operations take an account identifier and
          nothing else, so a second identical schema would be two places for one shape to
          be wrong.


          Assumptions: the declared floor is ZERO although this operation refuses an
          all-zeroes key. The refusal is the reference's own -- app/cbl/COACTVWC.cbl
          tests the key at L666 with L667 before it reads any file -- and it is answered
          with the sentence that program moves into the message channel at L672, reported
          under accountId. Declaring a floor of one here would move the refusal to the
          binding layer, where the wording would be a framework default and not the
          reference's, so the wider floor is what keeps the screen saying what it says.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLookupRequest'
      responses:
        '200':
          description: >-
            The account and its customer. The ETag header carries the revision
            the update operation requires back as If-Match; a caller that intends
            to edit must keep it.
          headers:
            ETag:
              $ref: '#/components/headers/RevisionETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountViewResponse'
        # WHY : Assumptions: the sentence in the example below is the one the reference
        #       actually EMITS, taken from the MOVE at app/cbl/COACTVWC.cbl L672, and it is
        #       reproduced with its two consecutive spaces between "must" and "be" intact.
        #       That doubled space is in the source literal, so normalising it to one would
        #       change what the screen says. The wording also carries an ASCII hyphen in
        #       "non-zero" and the word "Filter".
        # WHY : Trade-offs: this document reproduces the EMITTED wording and not the
        #       DECLARED one, and the two genuinely differ. The conditions declared at
        #       app/cbl/COACTVWC.cbl L125 with L126 and L127 with L128 read "Account number
        #       must be a non zero 11 digit number" -- single-spaced, no hyphen, the word
        #       "number" -- and are byte-identical to each other under two distinct
        #       condition names, while the MOVE at L672 overwrites the channel with the
        #       "Filter" wording. What is accepted is that a reader comparing this contract
        #       with the declarations will find a mismatch; what it buys is that the
        #       contract states what a caller receives. The two must never be folded
        #       together on the strength of describing one condition.
        '400':
          description: >-
            The submitted account identifier was absent, would not convert to a
            number, or converted to zero. The fieldErrors array names accountId.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
              # WHY : Assumptions: the code, severity and subsystem below are read from
              #       ApiError.CODE_VALIDATION and the ofFieldErrors factory in common-lib
              #       rather than chosen to look plausible -- CARDDEMO-0400 with WARNING
              #       severity and the APPLICATION subsystem. APPLICATION rather than
              #       RELATIONAL because nothing reached the store: the identifier is refused
              #       at the binding stage, which is the same point app/cbl/COACTVWC.cbl
              #       refuses it at L666 with L667 before any file read. The path member below is
              #       the operation's own fixed address and no longer the resolved one it used to
              #       show: the identifier left the request line, so a rendered path can no
              #       longer demonstrate which key was refused, and the fieldErrors entry is
              #       where a caller reads that instead. The abend member is
              #       null because the ApiError schema reserves it for a 500, and its
              #       presence is what distinguishes a service fault from a refusal the
              #       caller can correct.
              example:
                code: 'CARDDEMO-0400'
                secondaryCode: ''
                message: 'Account Filter must  be a non-zero 11 digit number'
                severity: WARNING
                subsystem: APPLICATION
                status: 400
                correlationId: '00000000-0000-4000-8000-000000000000'
                path: /api/v1/accounts/view
                timestamp: '2024-01-15 09:30:00.000000'
                fieldErrors:
                  - field: accountId
                    state: NOT_OK
                    message: 'Account Filter must  be a non-zero 11 digit number'
                    error: true
                abend: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            The account master holds no such row, or the account has no
            cross-reference row, or the row names a customer the customer master
            does not hold.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/accounts/card-cross-references/search:
    post:
      tags: [end-user, card-cross-reference]
      operationId: listAccountCardCrossReferences
      summary: List an account's card cross-reference rows in card-number order.
      description: >-
        This is the CXACAIX access path, which the baseline surfaces to the
        online region as an alternate index over the cross-reference file and
        reads by account. The target declares idx_card_xref_account_id and reads
        it with an ordered query.


        The order is by card number ascending and is part of the CONTRACT rather
        than an artefact of the query, because an alternate-index read returns
        its rows in index order and a caller diffing the list depends on that
        order being stable.


        Assumptions: the route hangs off the ACCOUNT rather than living under a
        cross-reference subtree of its own, because the by-account read is a
        property of an account and because the standalone cross-reference subtree
        is denied to end users by the filter chain -- it carries the by-card
        lookup, which takes a whole primary account number and is reachable only
        from inside the network.


        Refactoring Rationale: this operation returned the WHOLE of an account's
        cross-reference rows in one array and now returns a bounded keyset page of
        at most seven. The unbounded shape had no ceiling of any kind: the
        by-account index is not unique, so the row count is whatever the data
        holds, and every row carries a primary account number -- so one request
        decided how much cardholder data the service read and serialised. Seven is
        the reference screen's own capacity rather than a number chosen here.
        Trade-offs: a caller wanting every row now issues several requests; what
        that buys is that no single request can be made arbitrarily large by the
        data.


        The page is positioned by KEY and never by offset or page number, for the
        reason the customer scan records: an offset is evaluated against the table
        as it stands when each page is fetched, so a row inserted or removed
        between two fetches shifts the window and the caller skips a row or
        receives one twice.


        Refactoring Rationale: this operation was
        GET /api/v1/accounts/{accountId}/card-cross-references and the account travelled
        in the path. It is now a POST with the account in the body, for the reason the
        account lookup above gives: the load balancer's access record is composed from
        the request line before any application code runs, and this migration's
        sensitive-data contract names account identifiers among the values a durable
        diagnostic may not hold. The keyed form is REMOVED rather than kept as an alias.


        Assumptions: the cursor and the direction STAY in the query string, and the split
        is deliberate. A query string is part of the request line and is persisted exactly
        as a path segment is, so the test is not where a value sits but whether the
        contract prohibits it -- and a sealed cursor is confidential by construction while
        a direction is one of two published words. Neither is an account identifier, so
        neither has to move, and moving them would have made the two boundaries the
        response returns awkward to echo back.


        Assumptions: the address keeps the collection segment and gains /search rather
        than becoming a POST on the collection itself. This document spells a bounded POST
        read that way wherever it has one -- /api/v1/card-xrefs/search-by-account is this
        very walk on the internal surface -- and a POST on a collection address would read
        as a create, which this context publishes for no cross-reference row at all.
      servers:
        - url: /
          description: >-
            The origin that served this document. This operation is published at
            the public edge behind the gateway's identity-provider authorizer,
            not at the internal origin the document-level entry names.
      security:
        - bearerAuth: []
      x-required-authorities: [carddemo-admin, carddemo-user]
      requestBody:
        description: >-
          The account whose cross-reference rows are wanted, as the sole body input. The
          schema is the one the internal reads use, and its floor of zero is correct for
          this operation on its own merits rather than by reuse: this walk serves the
          migrated CXACAIX access path, which the reference reaches from a stored row
          rather than from a typed field, so refusing an all-zeroes value would turn a
          data condition into a validation failure the caller cannot act on.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLookupRequest'
      parameters:
        - name: cursor
          in: query
          required: false
          description: >-
            The opaque boundary a previous page of THIS account's walk issued,
            resumed strictly beyond it. Absent reads the opening page; a blank
            value also reads the opening page, because blank is treated as a
            subset of error rather than as a third state.


            Assumptions: the token is sealed against the query, the authenticated
            caller, the ACCOUNT in the body and the direction together, so a page
            issued to one caller walking one account cannot reposition another
            caller or another account. The account is part of the seal because the
            value the token carries is a card number, and the same card number
            under a different account is a valid position the caller never saw --
            so without it a page could begin part way through another account's
            rows, or come back empty, with nothing in the response saying so.
          schema:
            type: string
            maxLength: 256
        - name: direction
          in: query
          required: false
          description: >-
            Which way to step from the cursor. Meaningful only alongside one: with
            no cursor supplied the opening page is returned whichever direction is
            named, because a backward walk is expressible only from a set already
            returned.
          schema:
            type: string
            enum: [next, previous]
            default: next
      responses:
        '200':
          description: >-
            One page of at most seven of the account's cross-reference rows in
            ascending card-number order, with both sealed boundaries and both
            availability indicators. An account with no card yields an EMPTY page
            rather than a 404, matching an alternate-index browse that ends
            immediately: an account legitimately has no card, and that is not an
            absence of the account. Every card number is masked to its last four
            digits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardXrefPage'
        '400':
          description: >-
            The submitted account identifier was absent or would not convert to a
            number, the direction is not one of the two admitted words, or the cursor
            could not be opened -- altered, expired, or issued for another query,
            caller, account or direction. The fieldErrors array names accountId,
            direction or cursor accordingly.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/customers:

    # WHY : Assumptions: this operation is on the INTERNAL surface rather than the
    #       end-user one, and the reason is the reference rather than a preference.
    #       app/cbl/CBCUS01C.cbl carries no EXEC CICS verb and appears in no
    #       resource definition, so it is a batch reader with no terminal behind
    #       it; SecurityConfig accordingly denies this whole subtree to both
    #       business groups, on the ground that granting one would add a
    #       capability no baseline screen had.
    # WHY : Assumptions: this operation and the keyed record read below it require a
    #       DIFFERENT scope from every other internal operation in this document,
    #       declared on each as an x-carddemo-required-scope of its own. The reason
    #       is recorded in full at the record read; in short, these two are the
    #       operations that disclose a whole customer record and they shared one
    #       scope with the decision-path reads.
    get:
      tags: [internal, customer]
      operationId: listCustomers
      x-carddemo-required-scope: internal:customer-master.read
      summary: Read one ascending page of the customer master.
      description: >-
        Replaces the whole-file sweep of app/cbl/CBCUS01C.cbl, which walks the
        master at L74 to L81 and writes each record out at L78. The order and the
        access path are carried across exactly -- ascending CUST-ID, the primary
        key declared at L32 beside ACCESS MODE IS SEQUENTIAL at L31 -- and the
        page bound is the one accepted difference, because an operation answering
        a request cannot stream an entire master into one response.


        Requires the internal:customer-master.read scope rather than the
        decision-read scope the lookups use, because this answer carries whole
        customer records and can be walked to the end of the master. Sharing the
        decision scope let a token minted to resolve one card number page the
        entire file.


        The page is positioned by KEY and never by offset or page number. The
        reference settles that: the browse state it carries between terminal turns
        at app/cbl/COCRDLIC.cbl L230 to L244 is already a keyset cursor, holding
        two key pairs and two flags and no offset, row number or page-size field
        at all. An offset is evaluated against the table as it stands when each
        page is fetched, so a row inserted or removed between two fetches shifts
        the window and the caller skips a row or receives one twice.
      security:
        - internalServiceToken: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: >-
            The opaque position a previous page issued, resumed strictly after.
            Absent reads the opening page; a blank value also reads the opening
            page, because blank is treated as a subset of error rather than as a
            third state and is therefore never carried into the sealer.
          schema:
            type: string
            maxLength: 256
        - name: size
          in: query
          required: false
          description: >-
            The number of rows the page may carry. Absent takes the scan's own
            default. The ceiling is what makes the bounded scan bounded and is
            enforced in the service as well as here, so a second caller of that
            method inherits it.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: >-
            One ascending page. An exhausted scan answers 200 with no rows and no
            boundaries rather than 404, because reaching the end of a master is a
            normal outcome of a walk and not a missing resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/customers/lookup:

    # WHY : Refactoring Rationale: ONE operation replaces the HEAD and GET pair
    #       this document previously declared at /api/v1/customers/{customerId}.
    #       Two facts drove the change. The consuming context had already moved to
    #       this address with a JSON body -- see RestAccountContextClient in
    #       authorization-service -- so while only the keyed forms were published,
    #       every existence check reached this service as a dispatcher 404, which
    #       the caller cannot tell apart from "no such customer" and would read as
    #       a legitimate decision input. And the identifier left the request line
    #       because a load balancer composes its access record from that line
    #       before any application code runs, and the migration's sensitive-data
    #       logging contract names customer identifiers among the values a durable
    #       diagnostic may not hold.
    #       Assumptions: collapsing the pair loses nothing. One handler served
    #       both -- the framework answers HEAD from a GET mapping by discarding the
    #       body -- and both declared the same status codes, so the document
    #       described one behaviour twice. The answer was never in a body, so this
    #       operation still transfers none.
    post:
      tags: [internal, customer]
      operationId: customerExists
      summary: Report whether the customer master holds one customer.
      description: >-
        Replaces the keyed read of the customer master at app/cbl/CBCUS01C.cbl,
        reduced to the question the caller actually asks. The implementation
        issues an existence check rather than a read: the answer is a status
        either way, and reading the row would carry eighteen columns including
        two encrypted identifiers out of the database and into a process's heap
        to answer a yes-or-no question.


        A successful answer is 204 rather than 200 because there is no
        representation to return; 200 would announce one. This operation
        therefore returns no body on either answer.


        Trade-offs: POST is not idempotent by method semantics, which reads oddly
        for a check that changes nothing. It is accepted for the same reason the
        sibling lookups accept it; the alternative that would have preserved
        method semantics -- keeping HEAD and moving the identifier into a header
        -- was rejected because a resource identifier in a header is not
        addressable, leaves the request no longer self-describing, and would still
        have to be excluded from the access log's header set by inspection rather
        than by construction.
      security:
        - internalServiceToken: []
      requestBody:
        description: >-
          The nine-digit customer identifier whose existence is being tested, as the
          sole input. The answer is a status and never a body, so a caller wanting
          only presence transfers no customer data at all.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerLookupRequest'
      responses:
        '204':
          description: The customer master holds the row. There is no body.
        # WHY : Assumptions: 400 is declared because a caller can provoke it. The
        #       identifier is bound as a bounded number, so a non-numeric or
        #       out-of-range value is refused at the binding stage and the shared
        #       advice answers it as caller input. A status a caller can provoke
        #       and the document denies is worse than an undocumented one, because
        #       the document is what a caller trusts.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            The customer master holds no such row. There is no body on this answer
            either, so both outcomes of the check have one shape.
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/customers/display:

    # WHY : Refactoring Rationale: this address is NEW, and the gap it closes is a
    #       screen whose fields were absent on every request while nothing failed.
    #       The pending-authorization detail screen renders a cardholder's name, two
    #       address lines and a telephone number; its client obtained them by
    #       deserialising the response of the existence check above, which answers
    #       204 or 404 with NO body by contract. A bodiless 204 deserialises to
    #       nothing rather than to an error, so the display fields rendered as absent
    #       silently. The client's own seam record additionally declared a composed
    #       name member that this contract does not publish and no column exists for.
    # WHY : Alternatives Considered: pointing that consumer at /api/v1/customers/record
    #       below, which needs no new address at all. Rejected on least privilege:
    #       that operation answers with the WHOLE record and is therefore gated on
    #       internal:customer-master.read, a scope this system mints for no context
    #       because it reads a national identifier, a government-issued identifier
    #       and a credit score for any customer. Serving nine fields under it would be
    #       the escalation that scope split was introduced to prevent.
    # WHY : Trade-offs: this contract now carries a field list that belongs to another
    #       context's screen, so widening that screen later requires a change here.
    #       That coupling is accepted because the alternative left the consumer
    #       choosing between no fields and every field, and because the exposure is
    #       now a decision the context that owns the customer master takes and can
    #       refuse.
    post:
      tags: [internal, customer]
      operationId: readCustomerDisplay
      x-carddemo-required-scope: internal:account-context.customer.read
      summary: Read the nine customer fields a neighbouring screen renders.
      description: >-
        The name, address and telephone fields the pending-authorization detail
        screen renders beside the authorization it is showing. All nine come from
        the customer record this context owns: CUST-FIRST-NAME PIC X(25) at L6 of
        app/cpy/CVCUS01Y.cpy, CUST-MIDDLE-NAME at L7, CUST-LAST-NAME at L8, the three
        address lines at L9, L10 and L11, CUST-ADDR-STATE-CD at L12,
        CUST-ADDR-ZIP at L14, and CUST-PHONE-NUM-1 at L15 with L16 at its
        stored width of fifteen characters.


        Assumptions: the NAME arrives as its three stored components and is not
        composed here. The record declares no composed name, so composing one would
        publish a value no column holds and would fix the separator -- and the
        collapse of an absent middle name -- inside this context on behalf of a
        screen it cannot see.


        Assumptions: no protected value appears in the response at all, so nothing
        is masked. The two encrypted identifiers at L17 and L18 and the credit score
        are ABSENT rather than masked, because a masked member is still a member a
        future consumer would begin reading.


        Requires internal:account-context.customer.read -- the decision-read scope
        the consumer already holds -- and NOT internal:customer-master.read, which
        the whole-record read below requires.
      security:
        - internalServiceToken: []
      requestBody:
        description: >-
          The nine-digit customer identifier whose display fields are wanted, as the
          sole input. It is carried in the body rather than in a path segment so the
          key reaches no access record, for the reason the two lookups beside it
          record.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerLookupRequest'
      responses:
        '200':
          description: >-
            The customer exists. The body carries exactly nine fields and no
            protected value of any kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDisplayView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            The customer master holds no such row. The consumer reads this status as
            its own absent-customer outcome and renders the screen with the display
            fields unpopulated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/customers/record:

    # WHY : Assumptions: the keyed read is published at a segment of its own rather
    #       than sharing an address with the existence check above. Both now carry
    #       their key in a body, so neither has a keyed address to occupy, and the
    #       two must still be distinguishable because their responses differ in
    #       shape -- one is a status with no body, the other a whole record. A
    #       segment of its own keeps the response shape a property of the address
    #       rather than of the request.
    # WHY : Alternatives Considered: naming the segment /view, the segment the
    #       account read above uses. Rejected because in this document /view names
    #       a screen projection and this reference has no screen; the segment is
    #       named for what the reference writes, DISPLAY CUSTOMER-RECORD at L78
    #       over the group item declared at L4 of app/cpy/CVCUS01Y.cpy.
    # WHY : Refactoring Rationale: this operation and the master scan above require
    #       the internal:customer-master.read scope, where both previously answered
    #       to internal:account-context.read -- the same value the single-key
    #       decision reads use. That was an escalation and not merely an imprecise
    #       name: the two contexts holding the decision scope mint it to resolve
    #       ONE card number, and while these two shared it, a token issued for that
    #       lookup could return every field of any customer record and page the
    #       whole master. The scheme object lists every scope this document uses;
    #       which one an operation requires is stated per operation, here.
    post:
      tags: [internal, customer]
      operationId: readCustomerRecord
      x-carddemo-required-scope: internal:customer-master.read
      summary: Read one customer of the customer master by its key.
      description: >-
        The keyed arm of the access surface app/cbl/CBCUS01C.cbl declares, taken
        from RECORD KEY IS FD-CUST-ID at L32. The published fields are the
        copybook's rather than the file description's: that description carves the
        record into a nine-digit key at L39 and 491 opaque bytes at L40, and the
        meaningful layout arrives at L45 through COPY CVCUS01Y.


        Both stored identifiers are returned MASKED and never whole. CUST-SSN at
        L17 of app/cpy/CVCUS01Y.cpy and CUST-GOVT-ISSUED-ID at L18 are held
        encrypted, and only their disclosure treatment coincides -- L17 is
        declared PIC 9(09), numeric, while L18 is declared PIC X(20),
        alphanumeric.


        Requires the internal:customer-master.read scope rather than the
        decision-read scope the lookups above accept, because this answer carries
        a whole customer record.
      security:
        - internalServiceToken: []
      requestBody:
        description: >-
          The nine-digit customer identifier whose record is wanted, as the sole
          input. It is carried in the body rather than in a path segment so the key
          reaches no access record, which is why this read is a post and the
          cursor-positioned scan beside it is a get.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerLookupRequest'
      responses:
        '200':
          description: >-
            The customer exists. Every numeric field is a digits-only JSON string,
            which is the separation the reference itself keeps: app/cbl/COACTUPC.cbl
            L671 declares the screen value as characters and L672 with L673
            redefines the same storage as digits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            The customer master holds no such row, carrying the reference sentence
            for that outcome verbatim.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    internalServiceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      # WHY : Trade-offs: the scope a presented token must carry is published HERE as a vendor
      #   extension rather than in each operation's security requirement list. Under 3.1 that list
      #   may name roles for a non-oauth2 scheme, so the populated form this file used to carry was
      #   legal; it is dropped because 3.1 defines those names as not exchanged in-band, so the list
      #   is documentation either way, and a populated one reads as an OAuth scope to every 3.0-era
      #   reader and tool. An x- member says plainly that this is the system's own vocabulary. The
      #   values are the same constants InternalApiSecurityConfig composes its required authorities
      #   from.
      # WHY : Refactoring Rationale: the extension names FOUR scopes where it named one. A single value
      #   was accurate while one authority governed every internal address, and stopped being accurate
      #   twice over: the two whole-customer-record reads moved onto internal:customer-master.read, and
      #   the decision reads were then split one scope per operation family so that a credential minted
      #   to resolve a card number no longer reads an account's balance or a customer's identifiers.
      #   Keeping the one value would tell a reader that one token reaches every internal operation
      #   here -- exactly the escalation the split removed, so the stale documentation would describe a
      #   system less safe than the one that ships.
      # WHY : Trade-offs: both scopes sit on ONE scheme rather than two schemes being declared. Both
      #   are verified by the same chain, decoder and issuer and audience validators -- the credential
      #   is identical and only the claim value differs -- so two schemes would describe one mechanism
      #   twice. Which of the two an operation requires is stated in that operation's description,
      #   which is where an operation-specific fact belongs.
      x-carddemo-required-scope:
        - internal:account-context.card-xref.read
        - internal:account-context.account.read
        - internal:account-context.customer.read
        - internal:customer-master.read
      description: >-
        A bearer token minted by the calling service and verified by this one
        against a signing key both hold. It is not an identity-provider token
        and it is not interchangeable with one.


        Alternatives Considered: a client-credentials grant from the managed
        identity provider, which would be the conventional choice. It is
        unavailable here: the provisioned user pool has no hosted domain, so it
        exposes no token endpoint for a machine caller to obtain a token from.
        Mutual TLS was also considered and rejected as disproportionate for a
        single caller inside one private network, since it would introduce
        certificate issuance and rotation for two services. A static shared
        header was rejected outright because it carries no expiry, names no
        audience and cannot be scoped, so a single capture would be a permanent
        credential.


        The token names this service as its audience, names its own service as
        the subject from a closed set this verifier admits, and carries exactly
        one scope -- so a token minted for another callee, by an unnamed workload,
        or for the other group of routes is refused rather than accepted for the
        wrong path. Its lifetime is bounded at five minutes and the caller mints
        a fresh one per request.


        Four scopes exist and each governs one group of routes. The five
        decision-path reads take one scope per operation family -- three
        cross-reference reads, one account read and one customer read -- each
        named in x-carddemo-required-scope above. The two operations that
        disclose a whole customer record require
        x-carddemo-customer-master-scope instead, and each declares that
        requirement on itself. A token carrying one scope does not satisfy any
        other group.

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A JSON Web Token issued by the configured identity provider and validated
        as a resource-server token. Its cognito:groups claim is converted to
        authorities, where the baseline user type 'A' becomes carddemo-admin and
        'U' becomes carddemo-user. Presenting no usable token yields 401;
        presenting a valid token without the authority an operation requires
        yields 403.


        Assumptions: this scheme is named bearerAuth to match every other
        end-user contract in this migration, so a generated client presents one
        scheme name across services rather than one per service. It is a
        DIFFERENT credential from internalServiceToken above and neither
        satisfies the other's operations.

  headers:
    RevisionETag:
      description: >-
        The revision of the account and customer pair, as an opaque entity tag.
        The update operation requires it back in If-Match.


        Trade-offs: the tag is WEAK, prefixed W/. A strong tag asserts octet
        equality of the representation, which this value cannot promise -- two
        responses at the same revision are semantically identical but need not be
        byte-identical, since the masked identifiers and the message channels are
        assembled per response. A weak tag asserts semantic equivalence, which is
        exactly what a revision means here.
      required: true
      schema:
        type: string
        pattern: '^W/"[^"]+"$'
      example: 'W/"7:3"'

  parameters:
    IfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: >-
        The revision the caller was given by the view operation, echoed back so
        the edit is refused if the stored state moved in between. The value the
        view emitted is accepted verbatim; the comparison tolerates the W/ prefix
        and the surrounding quotes being reformatted, because an intermediary is
        permitted to reformat an entity tag and a caller that echoes what it
        received must not be refused for a difference it did not make.


        Assumptions: absence is a 400 and not a 428. RFC 6585 defines 428
        Precondition Required for exactly this case and would be the more precise
        status, but it would be the only 428 in this migration and no client in it
        handles one, whereas every client already handles the 400 shape and can
        read which value was missing from the fieldErrors array. The precision is
        traded for one client error vocabulary, and the trade is recorded here
        rather than left to be discovered.
      schema:
        type: string
        minLength: 1
      example: 'W/"7:3"'

  # WHY : Refactoring Rationale: there is no CustomerIdPath, AccountIdPath or
  #       AccountIdEndUserPath parameter. All three were declared here and referenced by
  #       operations that carried an identifier in the request line -- the customer one
  #       by three operations, and the two account ones by the account view, the account
  #       update and the by-account cross-reference walk. Every one of those operations
  #       moved its identifier into a request body or onto a cursor, so all three
  #       components became unreferenced, and an unreferenced path parameter for an
  #       identifier this document has decided not to put in a path is an invitation to
  #       reintroduce the disclosure. They are removed rather than retained.
  # WHY : Assumptions: the pair of account components did not survive the move in any
  #       form, and the distinction they existed for did not need to. Their only
  #       difference was a floor -- one carried a floor of ONE for the two operations
  #       that apply the reference's own key edit at app/cbl/COACTVWC.cbl L666 with L667,
  #       the other a floor of ZERO for the by-account walk, which the reference reaches
  #       from a stored row rather than from a typed field. In a body both operations
  #       take AccountLookupRequest, whose floor is zero, and the all-zeroes refusal is
  #       made by the key edit itself under accountId with that program's own sentence
  #       from L672. Trade-offs: the DECLARED floor is therefore wider than the accepted
  #       domain on two of the three operations, and each says so in its own request-body
  #       description; what that buys is that the refusal keeps the reference's wording
  #       instead of a framework default, which a narrower declared floor would have
  #       substituted.

  responses:
    BadRequest:
      description: >-
        The request does not satisfy its declared constraints. The body is a
        problem document carrying one entry per rejected field, which is the
        target form of the reference programs' per-field validation flags.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Unauthorized:
      description: >-
        No acceptable credential was presented. Every distinguishable cause -- an
        absent token, a token signed with another key, one naming another
        audience, one that has expired -- produces this same status and the same
        body, deliberately: telling a caller which check refused it tells an
        unauthorized caller how to make progress.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Forbidden:
      description: >-
        A valid credential was presented and does not carry the authority this
        operation requires -- for an internal operation, the read scope; for an
        end-user operation, either business group.


        Assumptions: this is declared on every operation rather than only where a
        narrowing rule exists, because the refusal is produced by the filter chain
        before any handler runs and is therefore reachable on all of them. The
        previous revision declared it on none, which left a client with no branch
        for the one refusal it can provoke by presenting the wrong credential type
        to the right path.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'

    ServiceUnavailable:
      description: >-
        The operation was refused because the environment is not currently
        accepting mutating work. The nightly batch chain owns the data for the
        duration of its window, and NOTHING WAS APPLIED -- the refusal is issued
        before the handler runs, so no part of the request took effect. A caller
        that repeats the same request unchanged once the window reopens succeeds.


        This is the target equivalent of the reference quiesce. app/jcl/CLOSEFIL.jcl
        lines 26 to 30 closed five VSAM files to the CICS region for the duration of
        the posting chain and app/jcl/OPENFIL.jcl reopened them, so a write attempted
        in between received a file-status error and abended. The migrated bracket
        deliberately closes WRITES only, so every read this service publishes keeps
        answering while the window is closed.


        Assumptions: 503 rather than 409 or 403, because the distinction is the one a
        client acts on. The request is well formed and its caller is entitled to make
        it; only the window in which it may be applied is absent. No Retry-After is
        sent, because the window is reopened by a state machine whose remaining work
        this service cannot see, so any value would be a guess a client would then
        schedule against.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'

    InternalError:
      description: >-
        The request could not be completed. The body carries an abend block whose
        four members are the target form of the reference's own ABEND-CODE,
        ABEND-CULPRIT, ABEND-REASON and ABEND-MSG fields at app/cpy/CSMSG02Y.cpy
        L21 to L29, and its message never carries a value the caller sent: the
        advice logs a reduced representation of the failure that keeps the type
        chain and the frames and drops every message, so a driver or parser
        sentence quoting a record cannot reach either destination.


        Assumptions: this status is declared on every operation because any of
        them can meet an unavailable dependency. On the update it is also the
        status a failure of the reference-context lookup produces, which is a
        transport failure rather than a validation outcome and is deliberately not
        reported as the caller's mistake.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:

    CardXrefLookupRequest:
      type: object
      additionalProperties: false
      required: [cardNumber]
      description: >-
        Names the card to resolve. The single property is required and is
        validated for exact width and digits only before any lookup is
        attempted.
      properties:
        cardNumber:
          type: string
          minLength: 16
          maxLength: 16
          pattern: '^[0-9]{16}$'
          description: >-
            The unmasked primary account number, exactly sixteen digits, matching
            the PIC X(16) width of XREF-CARD-NUM at app/cpy/CVACT03Y.cpy. It is
            unmasked because it is the lookup key: a masked value identifies no
            row. This is the only property in this document that carries one, and
            it travels only inbound and only in a body.
          example: '4111111111111111'

    CardXrefView:
      type: object
      additionalProperties: false
      required: [accountId, customerId]
      description: >-
        The account and customer a card belongs to. Both members are declared
        required because the reference record declares both, and a row missing
        either is a data defect rather than a representable state -- the calling
        context refuses such a response rather than proceeding on half of it.
      properties:
        accountId:
          type: integer
          format: int64
          description: The account the card belongs to.
          example: 12345678901
        customerId:
          type: integer
          format: int64
          description: The customer the card belongs to.
          example: 987654321

    # WHY : Refactoring Rationale: this schema exists because the ACCOUNT-keyed lookup
    #       answered with CardXrefView above, whose whole point is that it withholds the
    #       card number. Withholding it is right for a caller that supplied the card and
    #       wrong for a caller that supplied the account, so the two operations now have
    #       one schema each and each declares exactly what its own consumer reads. The
    #       name matches the Java record for the reason recorded further down this
    #       document: AccountContextContractTest reflects over each record's components
    #       and requires the schema of the same name to declare exactly those properties,
    #       so a component added to one without the other following fails the build.
    # WHY : Trade-offs: three schemas now describe one stored row -- this one, CardXrefView
    #       above and CardXrefResponse below -- which is duplication accepted on purpose.
    #       Each drops or transforms something the others keep: CardXrefView drops the card
    #       number, CardXrefResponse masks it and renders both identifiers as strings for a
    #       browser, and this one carries all three columns unmasked for a machine. Collapsing
    #       them onto the widest shape would publish an unmasked primary account number to the
    #       end-user surface, and collapsing them onto the narrowest would leave the ledger
    #       with no key to write.
    CardXrefByAccountView:
      type: object
      additionalProperties: false
      required: [accountId, customerId, cardNumber]
      description: >-
        The cross-reference row an account resolves to, carrying the selected card
        number in full. All three members are declared required because the
        reference record declares all three -- XREF-CARD-NUM PIC X(16) at L5 of
        app/cpy/CVACT03Y.cpy, XREF-CUST-ID PIC 9(09) at L6 and XREF-ACCT-ID
        PIC 9(11) at L7 -- and a row missing any of them is a data defect rather
        than a representable state. The calling context refuses such a response
        rather than proceeding on part of it.
      properties:
        accountId:
          type: integer
          format: int64
          description: The account the row is keyed by, from XREF-ACCT-ID PIC 9(11).
          example: 12345678901
        customerId:
          type: integer
          format: int64
          description: The customer the card belongs to, from XREF-CUST-ID PIC 9(09).
          example: 987654321
        cardNumber:
          type: string
          minLength: 16
          maxLength: 16
          pattern: '^[0-9]{16}$'
          description: >-
            The selected card number in full, from XREF-CARD-NUM PIC X(16). It is a
            string of digit characters rather than an integer because the reference
            declares it as CHARACTERS, a leading zero is significant in it, and
            sixteen digits exceed what a 32-bit integer can hold. It is the value
            the consuming context writes its ledger row under, so it is carried
            unmasked; the reachability limits that make that acceptable are recorded
            on the operation's own 200 response.
          example: '4111111111111111'

    AccountContextView:
      type: object
      additionalProperties: false
      required: [creditLimit, cashCreditLimit, currentBalance]
      description: >-
        The three monetary values an authorization decision examines. Each is a
        string for the reason recorded in this document's description, and each
        is rendered with exactly two fractional digits regardless of the scale
        the value is stored at, so a whole number of units renders as ".00"
        rather than as an integer.
      properties:
        creditLimit:
          $ref: '#/components/schemas/Money'
          description: >-
            The account's credit limit, from ACCT-CREDIT-LIMIT PIC S9(10)V99 at
            app/cpy/CVACT01Y.cpy. The over-limit comparison in the reference
            posting program is inclusive: a balance exactly at this value posts,
            and one cent beyond it rejects.
        cashCreditLimit:
          $ref: '#/components/schemas/Money'
          description: >-
            The account's cash credit limit, from ACCT-CASH-CREDIT-LIMIT
            PIC S9(10)V99.
        currentBalance:
          $ref: '#/components/schemas/Money'
          description: >-
            The posted balance, from ACCT-CURR-BAL PIC S9(10)V99. It may be
            negative, and the sign is carried as a leading minus in the string.

    # WHY : Assumptions: the six schemas below are named for the Java records they
    #       describe -- AccountViewResponse, AccountDetail, CustomerDetail,
    #       AccountUpdateRequest, AccountUpdateResponse, CardXrefResponse -- which
    #       is the convention the three schemas above already follow. The naming is
    #       not cosmetic: AccountContextContractTest reflects over each record's
    #       components and asserts the schema of the same name declares exactly
    #       those properties, so a component added to a record without a
    #       corresponding property here fails the build. A schema named for the
    #       operation rather than the record would leave that check with nothing to
    #       resolve.
    AccountViewResponse:
      type: object
      additionalProperties: false
      required: [accountId, account, customer, informationMessage, returnMessage]
      description: >-
        One account and its customer, at the widths the account-view MAP declares
        rather than at the widths the records declare. The two disagree for four
        values -- the postal code, the national identifier and both telephone
        numbers -- and the reference itself shows the narrower form on this screen
        by moving a wider stored value into a narrower field, so the narrowing is
        reproduced rather than corrected.
      properties:
        accountId:
          type: string
          maxLength: 11
          pattern: '^[0-9]{1,11}$'
          description: >-
            The account read, echoed as digits. It is a string here and an integer
            in the path parameter, and the difference is deliberate: the reference
            holds it as an eleven-digit display field and every value on this
            screen is character data, so a body member typed as a number would be
            the only one a client had to convert.
          example: '12345678901'
        account:
          $ref: '#/components/schemas/AccountDetail'
        customer:
          $ref: '#/components/schemas/CustomerDetail'
        # WHY : Assumptions: the two message members carry DIFFERENT widths because the
        #       reference declares two separate channels, and the narrower of the two is
        #       not a rounding of the other. app/cbl/COACTVWC.cbl declares
        #       05 WS-INFO-MSG PIC X(40) at L110 and 05 WS-RETURN-MSG PIC X(75) at L117,
        #       and app/cbl/COACTUPC.cbl repeats the same pair at L463 and L479. The
        #       symbolic map gives each container MORE room than the program that fills
        #       it -- INFOMSGI PIC X(45) at L234 and ERRMSGI PIC X(78) at L240 of
        #       app/cpy-bms/COACTVW.CPY -- so 45 and 78 are the sizes of the boxes while
        #       40 and 75 are the sizes of what the programs actually move into them. The
        #       PROGRAM width is the binding contract for that reason: a caller allocating
        #       45 would be sizing for a value this system never emits.
        informationMessage:
          oneOf:
            - type: string
              maxLength: 40
            - type: 'null'
          description: >-
            The screen's information line, or null. It is always null on this
            operation and is declared because the shape is shared with the update
            response, where it is not. The width is the 40 characters
            WS-INFO-MSG declares at L110 of app/cbl/COACTVWC.cbl, not the 45 its
            screen container holds. Assumptions: it is not omitted from the
            response when null -- the serialiser emits declared members as null
            rather than dropping them -- so a client sees the key either way.
        returnMessage:
          oneOf:
            - type: string
              maxLength: 75
            - type: 'null'
          description: >-
            The screen's message line, or null; always null on this operation. The
            width is the 75 characters CCARD-ERROR-MSG and CCARD-RETURN-MSG
            declare, matching WS-RETURN-MSG at L117 of app/cbl/COACTVWC.cbl, which
            is a rendering constraint carried across rather than a suggestion.

    AccountDetail:
      type: object
      additionalProperties: false
      required:
        - activeStatus
        - openDate
        - creditLimit
        - expirationDate
        - cashCreditLimit
        - reissueDate
        - currentBalance
        - currentCycleCredit
        - groupId
        - currentCycleDebit
      description: >-
        The account's ten screen fields. The member ORDER is the order the
        symbolic map declares them in, which is the order they appear on the
        screen, and it is preserved so that a reader comparing this schema with
        app/cpy-bms/COACTVW.CPY reads them in one order rather than two.
      properties:
        activeStatus:
          type: string
          maxLength: 1
          description: ACSTTUSI PIC X(1), from ACCT-ACTIVE-STATUS PIC X(01).
          example: 'Y'
        openDate:
          type: string
          maxLength: 10
          description: >-
            ADTOPENI PIC X(10), from ACCT-OPEN-DATE PIC X(10). Carried as text
            rather than as a date-typed member because the stored value is already
            ISO-ordered characters, so a lexical comparison is a date comparison
            and no conversion is owed by either side.
          example: '2020-01-01'
        creditLimit:
          $ref: '#/components/schemas/Money'
        expirationDate:
          type: string
          maxLength: 10
          description: >-
            AEXPDTI PIC X(10), from the field the baseline declares as
            ACCT-EXPIRAION-DATE -- the misspelling is the reference's own and is
            corrected in the target column name, which is recorded in
            docs/architecture/data-model-and-schema-mapping.md so the lineage is
            never ambiguous.
          example: '2027-12-31'
        cashCreditLimit:
          $ref: '#/components/schemas/Money'
        reissueDate:
          type: string
          maxLength: 10
          description: AREISDTI PIC X(10), from ACCT-REISSUE-DATE PIC X(10).
          example: '2024-06-01'
        currentBalance:
          $ref: '#/components/schemas/Money'
        currentCycleCredit:
          $ref: '#/components/schemas/Money'
        groupId:
          type: string
          maxLength: 10
          description: >-
            AADDGRPI PIC X(10), from ACCT-GROUP-ID PIC X(10). The disclosure group
            whose rate the interest calculation uses, falling back to the DEFAULT
            group when the account's own group is not found.
          example: 'DEFAULT'
        currentCycleDebit:
          $ref: '#/components/schemas/Money'

    CustomerDetail:
      type: object
      additionalProperties: false
      required:
        - customerId
        - ssnMasked
        - dateOfBirth
        - ficoCreditScore
        - firstName
        - middleName
        - lastName
        - addressLine1
        - stateCode
        - addressLine2
        - zipCode
        - city
        - countryCode
        - phoneNumber1
        - governmentIssuedIdMasked
        - phoneNumber2
        - eftAccountId
        - primaryCardHolderIndicator
      description: >-
        The customer's eighteen screen fields. Both protected identifiers are
        MASKED and neither is ever carried whole: this service publishes no
        clear-identifier accessor at all, so there is nothing for a caller to
        request. Two members are declared nullable because the record declares
        their columns nullable -- a middle name and a second telephone number are
        legitimately absent.
      properties:
        customerId:
          type: string
          maxLength: 9
          pattern: '^[0-9]{1,9}$'
          description: ACSTNUMI PIC X(9), from CUST-ID PIC 9(09), digits only.
          example: '987654321'
        ssnMasked:
          type: string
          maxLength: 12
          description: >-
            ACSTSSNI PIC X(12), from CUST-SSN PIC 9(09). The baseline composes the
            whole nine digits onto this screen; the target masks all but the last
            four, which is a documented, deliberate divergence rather than an
            omission -- the stored value is enciphered and this context has no
            decipher route by design.
          example: '***-**-6789'
        dateOfBirth:
          type: string
          maxLength: 10
          description: ACSTDOBI PIC X(10), from CUST-DOB-YYYY-MM-DD PIC X(10).
          example: '1980-01-01'
        ficoCreditScore:
          type: string
          maxLength: 3
          pattern: '^[0-9]{1,3}$'
          description: ACSTFCOI PIC X(3), from CUST-FICO-CREDIT-SCORE PIC 9(03).
          example: '750'
        firstName:
          type: string
          maxLength: 25
          description: ACSFNAMI PIC X(25), from CUST-FIRST-NAME PIC X(25).
          example: 'JOHN'
        middleName:
          oneOf:
            - type: string
              maxLength: 25
            - type: 'null'
          description: >-
            ACSMNAMI PIC X(25), from CUST-MIDDLE-NAME PIC X(25). Nullable because
            the column is: a customer legitimately has no middle name, and the
            load records that trailing blanks in the fixed-width record are
            padding rather than data.
        lastName:
          type: string
          maxLength: 25
          description: ACSLNAMI PIC X(25), from CUST-LAST-NAME PIC X(25).
          example: 'DOE'
        addressLine1:
          type: string
          maxLength: 50
          description: ACSADL1I PIC X(50), from CUST-ADDR-LINE-1 PIC X(50).
        stateCode:
          type: string
          maxLength: 2
          description: >-
            ACSSTTEI PIC X(2), from CUST-ADDR-STATE-CD PIC X(02). Whether the code
            names a real state is answered against the reference lookup asset by
            the reference bounded context, not here.
          example: 'VA'
        addressLine2:
          oneOf:
            - type: string
              maxLength: 50
            - type: 'null'
          description: >-
            ACSADL2I PIC X(50), from CUST-ADDR-LINE-2 PIC X(50). Nullable because
            the column is.
        zipCode:
          type: string
          maxLength: 5
          description: >-
            ACSZIPCI PIC X(5), narrowed from the wider CUST-ADDR-ZIP PIC X(10) by
            the reference's own direct move. This is the FIRST of the four
            record-versus-screen width disagreements, and the narrowing is
            reproduced rather than corrected because the reference screen shows
            five of the ten.
          example: '12546'
        city:
          type: string
          maxLength: 50
          description: >-
            ACSCITYI PIC X(50), sourced from CUST-ADDR-LINE-3 PIC X(50). The
            screen labels the third address line as the city and there is no
            stored field named for a city anywhere under app, so the screen name
            appears only on this screen-derived shape.
        countryCode:
          type: string
          maxLength: 3
          description: ACSCTRYI PIC X(3), from CUST-ADDR-COUNTRY-CD PIC X(03).
          example: 'USA'
        phoneNumber1:
          type: string
          maxLength: 13
          description: >-
            ACSPHN1I PIC X(13), narrowed from CUST-PHONE-NUM-1 PIC X(15) by the
            reference's own direct move, which drops exactly the declared
            two-character trailing pad.
          example: '(703)5551234'
        governmentIssuedIdMasked:
          type: string
          maxLength: 20
          description: >-
            ACSGOVTI PIC X(20), from CUST-GOVT-ISSUED-ID PIC X(20), masked for the
            same reason and on the same terms as the national identifier above.
        phoneNumber2:
          oneOf:
            - type: string
              maxLength: 13
            - type: 'null'
          description: >-
            ACSPHN2I PIC X(13), narrowed from CUST-PHONE-NUM-2 PIC X(15). Nullable
            because the column is.
        eftAccountId:
          type: string
          maxLength: 10
          description: ACSEFTCI PIC X(10), from CUST-EFT-ACCOUNT-ID PIC X(10).
        primaryCardHolderIndicator:
          type: string
          maxLength: 1
          description: ACSPFLGI PIC X(1), from CUST-PRI-CARD-HOLDER-IND PIC X(01).
          example: 'Y'

    AccountUpdateRequest:
      type: object
      additionalProperties: false
      description: >-
        One submission of the account-update screen, carrying the account's
        editable fields and its customer's together. Every member is a string at
        the width app/cpy-bms/COACTUP.CPY declares, because every field on that
        map is character data and the reference validates each as characters
        before it converts any.


        Assumptions: this shape is INBOUND ONLY and is never a component of any
        response. It carries the national identifier in three clear parts and the
        government-issued identifier in the clear, because an edit has to be able
        to replace them; the committed state comes back as AccountUpdateResponse,
        whose customer member is the masked screen shape. Reusing this record
        outbound would return both identifiers in the clear to whoever could read
        one, which is why the two directions are separate types.


        Assumptions: the three date fields arrive in PARTS rather than as one
        value, matching the map, which declares a separate year, month and day
        field for each. All three parts of one date are required together: the
        reference composes them with separators into the stored ten characters, so
        a missing part has no position to occupy. The same holds for each
        telephone number's three parts.


        Assumptions: no member is declared required. Presence is enforced one
        layer down, per field, because the reference distinguishes a value that
        was never supplied from one supplied and refused -- its FLG-*-BLANK and
        FLG-*-NOT-OK conditions -- and a schema-level required list collapses that
        distinction into a single body-shape refusal that names no field. A
        refusal from the layer below names each offending property and its state,
        which is what rule T7 asks of it.
      properties:
        accountId:
          type: string
          maxLength: 11
          description: ACCTSIDI PIC X(11); the account being edited.
        activeStatus:
          type: string
          maxLength: 1
          description: ACSTTUSI PIC X(1), for ACCT-ACTIVE-STATUS PIC X(01).
        creditLimit:
          type: string
          maxLength: 15
          description: >-
            ACRDLIMI PIC X(15), for ACCT-CREDIT-LIMIT PIC S9(10)V99. A string
            rather than a number for the reason recorded on Money.
        cashCreditLimit:
          type: string
          maxLength: 15
          description: ACSHLIMI PIC X(15), for ACCT-CASH-CREDIT-LIMIT.
        currentBalance:
          type: string
          maxLength: 15
          description: ACURBALI PIC X(15), for ACCT-CURR-BAL.
        currentCycleCredit:
          type: string
          maxLength: 15
          description: ACRCYCRI PIC X(15), for ACCT-CURR-CYC-CREDIT.
        currentCycleDebit:
          type: string
          maxLength: 15
          description: ACRCYDBI PIC X(15), for ACCT-CURR-CYC-DEBIT.
        openDateYear:
          type: string
          maxLength: 4
          description: OPNYEARI PIC X(4); one part of ACCT-OPEN-DATE PIC X(10).
        openDateMonth:
          type: string
          maxLength: 2
          description: OPNMONI PIC X(2).
        openDateDay:
          type: string
          maxLength: 2
          description: OPNDAYI PIC X(2).
        expirationDateYear:
          type: string
          maxLength: 4
          description: EXPYEARI PIC X(4).
        expirationDateMonth:
          type: string
          maxLength: 2
          description: EXPMONI PIC X(2).
        expirationDateDay:
          type: string
          maxLength: 2
          description: EXPDAYI PIC X(2).
        reissueDateYear:
          type: string
          maxLength: 4
          description: RISYEARI PIC X(4).
        reissueDateMonth:
          type: string
          maxLength: 2
          description: RISMONI PIC X(2).
        reissueDateDay:
          type: string
          maxLength: 2
          description: RISDAYI PIC X(2).
        groupId:
          type: string
          maxLength: 10
          description: AADDGRPI PIC X(10), for ACCT-GROUP-ID PIC X(10).
        customerId:
          type: string
          maxLength: 9
          description: ACSTNUMI PIC X(9); the customer the account resolves to.
        ssnPart1:
          type: string
          maxLength: 3
          description: >-
            ACTSSN1I PIC X(3); the first three digits of the national identifier.
            Clear, inbound only, and never returned by any operation.
        ssnPart2:
          type: string
          maxLength: 2
          description: ACTSSN2I PIC X(2); the middle two digits.
        ssnPart3:
          type: string
          maxLength: 4
          description: ACTSSN3I PIC X(4); the last four digits.
        dateOfBirthYear:
          type: string
          maxLength: 4
          description: DOBYEARI PIC X(4); one part of CUST-DOB-YYYY-MM-DD.
        dateOfBirthMonth:
          type: string
          maxLength: 2
          description: DOBMONI PIC X(2).
        dateOfBirthDay:
          type: string
          maxLength: 2
          description: DOBDAYI PIC X(2).
        ficoCreditScore:
          type: string
          maxLength: 3
          description: ACSTFCOI PIC X(3), for CUST-FICO-CREDIT-SCORE PIC 9(03).
        firstName:
          type: string
          maxLength: 25
          description: ACSFNAMI PIC X(25).
        middleName:
          type: string
          maxLength: 25
          description: ACSMNAMI PIC X(25); optional, matching the nullable column.
        lastName:
          type: string
          maxLength: 25
          description: ACSLNAMI PIC X(25).
        addressLine1:
          type: string
          maxLength: 50
          description: ACSADL1I PIC X(50).
        addressLine2:
          type: string
          maxLength: 50
          description: ACSADL2I PIC X(50); optional.
        city:
          type: string
          maxLength: 50
          description: >-
            ACSCITYI PIC X(50); stored as CUST-ADDR-LINE-3, for the reason
            recorded on the view shape's city member.
        stateCode:
          type: string
          maxLength: 2
          description: >-
            ACSSTTEI PIC X(2). A code outside the reference state list is refused
            with a 400 naming this property.
        countryCode:
          type: string
          maxLength: 3
          description: ACSCTRYI PIC X(3).
        zipCode:
          type: string
          maxLength: 5
          description: >-
            ACSZIPCI PIC X(5), the SCREEN width, against the stored
            CUST-ADDR-ZIP PIC X(10). Assumptions: a five-character submission
            replaces only the leading five of the stored ten and PRESERVES the
            stored tail, because the screen cannot show the tail and a caller
            cannot resubmit what it was never shown -- narrowing the stored value
            to what the screen carries would delete positions 6 to 10 for every
            edit of any other field on the form.
        phone1AreaCode:
          type: string
          maxLength: 3
          description: >-
            ACTPHA1I PIC X(3); one part of CUST-PHONE-NUM-1 PIC X(15). An area code
            outside the reference's general-purpose list is refused with a 400
            naming this property.
        phone1Prefix:
          type: string
          maxLength: 3
          description: ACTPHB1I PIC X(3).
        phone1LineNumber:
          type: string
          maxLength: 4
          description: ACTPHC1I PIC X(4).
        phone2AreaCode:
          type: string
          maxLength: 3
          description: ACTPHA2I PIC X(3); one part of CUST-PHONE-NUM-2 PIC X(15).
        phone2Prefix:
          type: string
          maxLength: 3
          description: ACTPHB2I PIC X(3).
        phone2LineNumber:
          type: string
          maxLength: 4
          description: ACTPHC2I PIC X(4).
        governmentIssuedId:
          type: string
          maxLength: 20
          description: >-
            ACSGOVTI PIC X(20), for CUST-GOVT-ISSUED-ID PIC X(20). Clear, inbound
            only, never returned. Assumptions: OMITTING it preserves the stored
            ciphertext rather than clearing it, because the screen shows a masked
            value and a caller that did not retype what it could not read has not
            asked for the identifier to be deleted.
        eftAccountId:
          type: string
          maxLength: 10
          description: ACSEFTCI PIC X(10).
        primaryCardHolderIndicator:
          type: string
          maxLength: 1
          description: ACSPFLGI PIC X(1).

    AccountUpdateResponse:
      type: object
      additionalProperties: false
      required: [accountId, informationMessage, returnMessage, fieldErrors, account, customer]
      description: >-
        The state as committed, with the reference's own acceptance sentence and
        both protected identifiers already masked.


        Assumptions: the account and customer members are the SAME two schemas the
        view operation returns rather than an echo of the submission. That is what
        keeps the clear identifiers out of every response: the submitted shape and
        the returned shape are different types, so there is no path by which a
        cleartext member reaches a body.


        Assumptions: the revision is published as an ETag header and NOT as a body
        member. An optimistic-lock version is transport metadata, and a value with
        two homes is a value whose two homes can disagree.
      properties:
        accountId:
          type: string
          maxLength: 11
          pattern: '^[0-9]{1,11}$'
          description: The account that was updated, echoed as digits.
          example: '12345678901'
        # WHY : Assumptions: the acceptance sentence belongs to the INFORMATION channel and
        #       not to the return channel, which is why the two members below carry
        #       different widths and different examples. app/cbl/COACTUPC.cbl declares
        #       88 CONFIRM-UPDATE-SUCCESS VALUE 'Changes committed to database' at L474
        #       with L475, and that condition is declared under 05 WS-INFO-MSG PIC X(40)
        #       at L463 -- so the sentence a caller reads on success is a 40-character
        #       value. The return channel at L479 is 75 characters and carries the refusal
        #       and conflict wordings instead.
        informationMessage:
          oneOf:
            - type: string
              maxLength: 40
            - type: 'null'
          description: >-
            The screen's information line, or null. On a committed edit it carries
            the reference's own acceptance sentence character for character. The
            width is the 40 characters WS-INFO-MSG declares at L463 of
            app/cbl/COACTUPC.cbl, not the 45 its screen container holds.
          example: 'Changes committed to database'
        # WHY : Trade-offs: the example below is the reference's DEVELOPER-PLACEHOLDER
        #       wording, declared 88 CODING-TO-BE-DONE VALUE 'Looks Good.... so far' at
        #       app/cbl/COACTUPC.cbl L527 with L528, and it is retained rather than
        #       replaced by an invented sentence. What is accepted is that the example
        #       shows a placeholder; what it buys is that no wording appears in this
        #       contract that the reference cannot produce. It is NOT the acceptance
        #       sentence -- that one is on the information channel above -- and labelling
        #       it as such would attribute an outcome to a value the program only ever
        #       moves where its logic is unfinished.
        returnMessage:
          oneOf:
            - type: string
              maxLength: 75
            - type: 'null'
          description: >-
            The screen's message line, or null; empty on a committed edit. Any
            wording it carries is taken character for character from the
            conditions declared under WS-RETURN-MSG at L479 of
            app/cbl/COACTUPC.cbl rather than reworded.
          example: 'Looks Good.... so far'
        fieldErrors:
          type: array
          description: >-
            Empty on this response, and declared because the shape is the one the
            screen carries. A refusal is not returned here at all: it is a 400
            whose problem document carries the entries, so a client reads field
            errors from ONE place rather than from two shapes depending on status.
          items:
            $ref: '#/components/schemas/FieldError'
        account:
          $ref: '#/components/schemas/AccountDetail'
        customer:
          $ref: '#/components/schemas/CustomerDetail'

    CardXrefResponse:
      type: object
      additionalProperties: false
      required: [cardNumberMasked, customerId, accountId]
      description: >-
        One cross-reference row as an end user may see it, from the 50-byte record
        at app/cpy/CVACT03Y.cpy. It differs from CardXrefView above in exactly one
        respect and deliberately: it carries the card the row is FOR, masked to
        its last four digits, because a list of an account's cards is unreadable
        without something to tell the rows apart. CardXrefView omits the card
        entirely because its caller supplied it.
      properties:
        cardNumberMasked:
          type: string
          maxLength: 16
          description: >-
            XREF-CARD-NUM PIC X(16), masked to its last four digits. The mask is
            applied by the shared masker so that every context narrows a card
            number the same way, and the length is preserved so the rendering
            still aligns in a fixed-pitch column.
          example: '************1111'
        customerId:
          type: string
          maxLength: 9
          pattern: '^[0-9]{1,9}$'
          description: XREF-CUST-ID PIC 9(09), as digits.
          example: '987654321'
        accountId:
          type: string
          maxLength: 11
          pattern: '^[0-9]{1,11}$'
          description: XREF-ACCT-ID PIC 9(11), as digits.
          example: '12345678901'

    # WHY : Refactoring Rationale: this schema is the narrow counterpart of CustomerResponse
    #       below and exists for the reason recorded on /api/v1/customers/display: the two
    #       shapes available to a neighbouring screen were an empty body and the whole
    #       record, and neither is a screen's field list. It is named for the Java record it
    #       describes, which is the convention this document follows throughout --
    #       AccountContextContractTest reflects over each record's components and requires
    #       the schema of the same name to declare exactly those properties, so a component
    #       added to one without the other following fails the build.
    # WHY : Assumptions: two members are nullable and four are not, and the split is the
    #       reference's. app/cbl/COACTUPC.cbl edits the FIRST address line for presence at
    #       L1824 and requires nothing of the second, and a middle name is an ordinary
    #       fixed-width field a screen may leave blank; the remaining four are values every
    #       stored row carries.
    CustomerDisplayView:
      type: object
      additionalProperties: false
      required: [firstName, lastName, addressLine1, addressLine3, stateCode,
                 zipCode, phoneNumber1]
      description: >-
        The nine customer fields a neighbouring context's screen renders. No
        protected value appears here at all: the national identifier at L17 of
        app/cpy/CVCUS01Y.cpy, the government-issued identifier at L18 and the
        credit score are ABSENT rather than masked, because a masked member is
        still a member a future consumer would begin reading.


        The ADDRESS is published as five stored components rather than as the two
        lines the consuming screen shows, and the postal code is published
        UNNARROWED at its stored ten characters. That screen composes its first
        line from CUST-ADDR-LINE-1 and CUST-ADDR-LINE-2 at L766 to L770 of
        app/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl, and its SECOND line
        from CUST-ADDR-LINE-3, CUST-ADDR-STATE-CD and CUST-ADDR-ZIP(1:5) at L771
        to L777 -- so the join separators and the ten-to-five narrowing are
        decisions of the display, taken where the display is. Composing here
        would publish one consumer's presentation as though it were the layout.


        The country code at L13 is deliberately absent even though it sits
        between two published components: no line of that screen reads it, and
        this projection publishes the field list one screen needs rather than the
        contiguous span of the record those fields happen to occupy.
      properties:
        firstName:
          type: string
          maxLength: 25
          description: The cardholder's given name, from CUST-FIRST-NAME PIC X(25) at L6.
          example: ADA
        middleName:
          type: [string, 'null']
          maxLength: 25
          description: >-
            The cardholder's middle name, from CUST-MIDDLE-NAME PIC X(25) at L7, or
            null when the stored field is blank. The union type is 3.1's own form and
            is used rather than the 3.0 nullable keyword, which 3.1 removed.
          example: M
        lastName:
          type: string
          maxLength: 25
          description: The cardholder's family name, from CUST-LAST-NAME PIC X(25) at L8.
          example: LOVELACE
        addressLine1:
          type: string
          maxLength: 50
          description: The first address line, from CUST-ADDR-LINE-1 PIC X(50) at L9.
          example: 1 SYNTHETIC WAY
        addressLine2:
          type: [string, 'null']
          maxLength: 50
          description: >-
            The second address line, from CUST-ADDR-LINE-2 PIC X(50) at L10, or null
            when the stored field is blank.
          example: SUITE 100
        addressLine3:
          type: string
          maxLength: 50
          description: >-
            The third address line, which carries the CITY, from
            CUST-ADDR-LINE-3 PIC X(50) at L11. Required because the schema this
            context owns declares the column NOT NULL.
          example: SYNTHETIC CITY
        stateCode:
          type: string
          maxLength: 2
          description: >-
            The two-character state code, from CUST-ADDR-STATE-CD PIC X(02) at L12.
            Not validated against the state lookup table on this READ path: the
            column already holds a value this context accepted on write, and
            re-editing a stored value on the way out would turn a reference-data
            change into a read failure for rows that were valid when written.
          example: NY
        zipCode:
          type: string
          maxLength: 10
          description: >-
            The postal code at its STORED width of ten characters, from
            CUST-ADDR-ZIP PIC X(10) at L14, UNNARROWED. The consuming screen
            renders CUST-ADDR-ZIP(1:5) at L775 of COPAUS0C, so narrowing here
            would adopt that display truncation as though it were the layout and
            would discard the four-digit extension for every later reader.
          example: '100010001'
        phoneNumber1:
          type: string
          maxLength: 15
          description: >-
            The primary telephone number at its STORED width of fifteen characters,
            from CUST-PHONE-NUM-1 at L15 with L16 -- not the thirteen the account view
            screen carries at L204 of app/cpy-bms/COACTVW.CPY. The two differ by
            exactly the trailing two-character pad app/cbl/COACTUPC.cbl L731 declares,
            so publishing thirteen would adopt the screen's truncation as though it
            were the layout.
          example: (212)5550100

    CustomerResponse:
      type: object
      additionalProperties: false
      required: [customerId, firstName, middleName, lastName, addressLine1,
                 addressLine2, addressLine3, stateCode, countryCode, zipCode,
                 phoneNumber1, phoneNumber2, ssnMasked,
                 governmentIssuedIdMasked, dateOfBirth, eftAccountId,
                 primaryCardHolderIndicator, ficoCreditScore]
      description: >-
        One customer as the customer master stores it, derived at RECORD widths
        from the eighteen named fields app/cpy/CVCUS01Y.cpy declares at L5 to L22.
        That copybook additionally declares FILLER PIC X(168) at L23, which brings
        the record to its documented 500 bytes and is dropped here: it is padding
        to a fixed length rather than data.


        This shape is NOT the customer grouping of AccountViewResponse. That one is
        derived at the widths of the symbolic map and narrows four fields to what a
        3270 screen could show; this one is derived at the widths of the record, so
        it is the only projection through which the stored value of those four can
        be read at all. Neither is a subset of the other and they are deliberately
        separate types.


        Every numeric field travels as a digits-only string rather than as a
        numeric member, so that no client parses an identifier through a binary
        representation that cannot hold it exactly.
      properties:
        customerId:
          type: string
          maxLength: 9
          pattern: '^[0-9]{1,9}$'
          description: CUST-ID PIC 9(09) at app/cpy/CVCUS01Y.cpy L5, as digits.
          example: '987654321'
        firstName:
          type: string
          maxLength: 25
          description: CUST-FIRST-NAME PIC X(25) at L6.
          example: 'JOHN'
        middleName:
          oneOf:
            - type: string
              maxLength: 25
            - type: 'null'
          description: >-
            CUST-MIDDLE-NAME PIC X(25) at L7. Null when the column holds nothing:
            a customer without a middle name is not a defective row, and the
            declared width is a maximum for a descriptive value rather than a
            length the value must reach.
        lastName:
          type: string
          maxLength: 25
          description: CUST-LAST-NAME PIC X(25) at L8.
          example: 'DOE'
        addressLine1:
          type: string
          maxLength: 50
          description: CUST-ADDR-LINE-1 PIC X(50) at L9.
        addressLine2:
          oneOf:
            - type: string
              maxLength: 50
            - type: 'null'
          description: CUST-ADDR-LINE-2 PIC X(50) at L10. Null when unpopulated.
        addressLine3:
          type: string
          maxLength: 50
          description: >-
            CUST-ADDR-LINE-3 PIC X(50) at L11. This component is named for the
            copybook field and carries the value the account view screen labels as
            the city. There is no CUST-CITY field to name it after -- a search
            returns nothing anywhere under app -- while app/cbl/COACTVWC.cbl L513
            moves CUST-ADDR-LINE-3 straight into the screen's city field. The two
            widths match exactly at PIC X(50), so this is a difference of NAME and
            not a narrowing.
        stateCode:
          type: string
          maxLength: 2
          description: CUST-ADDR-STATE-CD PIC X(02) at L12.
          example: 'VA'
        countryCode:
          type: string
          maxLength: 3
          description: CUST-ADDR-COUNTRY-CD PIC X(03) at L13.
          example: 'USA'
        zipCode:
          type: string
          maxLength: 10
          description: >-
            CUST-ADDR-ZIP PIC X(10) at L14, carrying all ten characters. The
            screen field ACSZIPCI is PIC X(5) at app/cpy-bms/COACTVW.CPY L186 and
            app/cbl/COACTVWC.cbl L515 moves the wider value into it, so the
            baseline itself shows five of the ten there.
          example: '12546'
        phoneNumber1:
          oneOf:
            - type: string
              maxLength: 15
            - type: 'null'
          description: >-
            CUST-PHONE-NUM-1 PIC X(15) at L15, at record width. The screen carries
            thirteen, ACSPHN1I PIC X(13) at app/cpy-bms/COACTVW.CPY L204, and
            app/cbl/COACTVWC.cbl L517 drops exactly the trailing two-character pad
            the baseline's own redefinition at app/cbl/COACTUPC.cbl L723 to L731
            accounts for.
        phoneNumber2:
          oneOf:
            - type: string
              maxLength: 15
            - type: 'null'
          description: CUST-PHONE-NUM-2 PIC X(15) at L16, on the same terms.
        ssnMasked:
          type: string
          maxLength: 12
          description: >-
            Derived from CUST-SSN PIC 9(09) at L17, which is declared NUMERIC. The
            stored value is enciphered and this context has no decipher route by
            design, so a fixed redaction marker is published rather than any part
            of the value. No example is given, deliberately: an example on this
            property would be the one place a shape resembling a national
            identifier appeared in this document.
        governmentIssuedIdMasked:
          type: string
          maxLength: 20
          description: >-
            Derived from CUST-GOVT-ISSUED-ID PIC X(20) at L18, which is declared
            ALPHANUMERIC and is therefore not the same kind of field as the
            national identifier above, though its disclosure treatment is
            identical. The screen field is ACSGOVTI PIC X(20) at
            app/cpy-bms/COACTVW.CPY L210, matching the record width exactly. No
            example is given, for the same reason.
        dateOfBirth:
          type: string
          maxLength: 10
          description: >-
            CUST-DOB-YYYY-MM-DD PIC X(10) at L19, the only date the customer
            record declares. It is already ordered year, month, day, so a lexical
            comparison of two values orders them as dates.
          example: '1980-01-01'
        eftAccountId:
          type: string
          maxLength: 10
          description: CUST-EFT-ACCOUNT-ID PIC X(10) at L20.
        primaryCardHolderIndicator:
          type: string
          maxLength: 1
          description: CUST-PRI-CARD-HOLDER-IND PIC X(01) at L21.
          example: 'Y'
        ficoCreditScore:
          type: string
          maxLength: 3
          pattern: '^[0-9]{1,3}$'
          description: >-
            CUST-FICO-CREDIT-SCORE PIC 9(03) at L22, as digits. It is a bounded
            small integer and is not an amount of money.
          example: '750'

    CustomerPage:
      type: object
      additionalProperties: false
      required: [items, firstKey, lastKey, hasNext]
      description: >-
        One page of the customer scan in the shared keyset envelope. The envelope
        has exactly these four members and carries no total count, no page number
        and no backward availability answer, because the reference browse state it
        replaces carries neither of the first two and keeps the third on the
        terminal: at app/cbl/COCRDLIC.cbl L230 to L244 it holds a trailing key
        pair, a leading key pair, a screen ordinal, a last-screen flag and a
        further-rows indicator, and the three members not carried across are the
        screen ordinal at L237, the last-screen flag at L239 to L241 and any claim
        that an earlier page exists -- which that program answers from the ordinal
        alone at L902 to L903. No page number crosses the wire, and a client that
        withholds a backward control on its opening page does so from the ordinal
        it keeps itself.
      properties:
        items:
          type: array
          description: >-
            The rows of this page in ascending CUST-ID order, which is the order
            the reference walk produces by construction from ACCESS MODE IS
            SEQUENTIAL at app/cbl/CBCUS01C.cbl L31 over RECORD KEY IS FD-CUST-ID at
            L32. Empty when the scan is exhausted.
          items:
            $ref: '#/components/schemas/CustomerResponse'
        firstKey:
          oneOf:
            - type: string
              maxLength: 256
            - type: 'null'
          description: >-
            The opaque position of the FIRST row of this page. Null on an
            exhausted page. It names a row the caller actually received, which is
            a documented divergence from the reference: app/cbl/COCRDLIC.cbl
            captures the last displayed key at L1194 with L1195 and then
            overwrites it with the probe row's key at L1212 to L1214, so the value
            it retains names a record the terminal never showed.
        lastKey:
          oneOf:
            - type: string
              maxLength: 256
            - type: 'null'
          description: >-
            The opaque position of the LAST row of this page, to be sent back as
            the cursor of the following request. Null on an exhausted page.
        hasNext:
          type: boolean
          description: >-
            Whether a further row follows this page. It is settled by asking the
            store for one row more than the page carries and observing whether
            that row arrives, never by counting the master -- which is the
            reference's own method, since the further-rows state at
            app/cbl/COCRDLIC.cbl L242 to L244 is a single flag raised by
            discovering one record beyond what the screen holds. The surplus row
            is trimmed before this page is published and appears nowhere in it.

    CardXrefPage:
      type: object
      additionalProperties: false
      required: [items, firstKey, lastKey, hasNext]
      description: >-
        One page of an account's cross-reference walk in the shared keyset
        envelope. The four members are the shared ones and are described on
        CustomerPage; only the row type and the ordering differ.


        Assumptions: the ordering is ascending card number and is part of the
        CONTRACT rather than an artefact of the query, because an alternate-index
        read returns its rows in index order and a caller diffing two pages depends
        on that order being stable. It is the base cluster's own order, which
        app/cbl/CBACT03C.cbl states with ACCESS MODE IS SEQUENTIAL at L31 beside
        RECORD KEY IS FD-XREF-CARD-NUM at L32.
      properties:
        items:
          type: array
          description: >-
            The rows of this page in ascending card-number order, at most seven of
            them. Empty when the account holds no card.
          items:
            $ref: '#/components/schemas/CardXrefResponse'
        firstKey:
          oneOf:
            - type: string
              maxLength: 256
            - type: 'null'
          description: >-
            The opaque boundary of the FIRST row of this page, to be sent back as
            the cursor of a backward request. Null on an empty page.
        lastKey:
          oneOf:
            - type: string
              maxLength: 256
            - type: 'null'
          description: >-
            The opaque boundary of the LAST row of this page, to be sent back as
            the cursor of a forward request. Null on an empty page.
        hasNext:
          type: boolean
          description: >-
            Whether a further row follows this page. Settled by reading one row
            more than the page carries and observing whether it arrived, never by
            counting -- which is the reference's own method at
            app/cbl/COCRDLIC.cbl L242 to L244. The surplus row is trimmed before
            the page is published and appears nowhere in it.

    AccountLookupRequest:
      type: object
      additionalProperties: false
      required: [accountId]
      description: >-
        Names the account to resolve. The single property is required and is
        range-checked before any lookup is attempted. It is a body rather than a
        path segment because a load balancer composes its access record from the
        request line before any application code runs, and the migration's
        sensitive-data logging contract names account identifiers among the values
        a durable diagnostic may not hold.
      properties:
        accountId:
          type: integer
          format: int64
          minimum: 0
          maximum: 99999999999
          description: >-
            The account identifier, within the eleven-digit range XREF-ACCT-ID
            PIC 9(11) declares at L7 of app/cpy/CVACT03Y.cpy.
          example: 12345678901

    CustomerLookupRequest:
      type: object
      additionalProperties: false
      required: [customerId]
      description: >-
        Names the customer to check for or to read. The single property is required
        and is range-checked before any lookup is attempted. It is a body rather
        than a path segment because a load balancer composes its access record from
        the request line before any application code runs, and the migration's
        sensitive-data logging contract names customer identifiers among the values
        a durable diagnostic may not hold.


        Assumptions: ONE record serves both the existence check and the keyed
        record read, because the two constrain the same nine-digit key to the same
        range. A second record would be the same constraint in a second place, and
        the two copies would drift the first time the width changed.
      properties:
        customerId:
          type: integer
          format: int64
          minimum: 0
          maximum: 999999999
          description: >-
            The customer identifier, within the nine-digit range CUST-ID
            PIC 9(09) declares at L5 of app/cpy/CVCUS01Y.cpy.
          example: 987654321

    Money:
      type: string
      pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
      description: >-
        An exact monetary amount with two fractional digits, carried as a string
        so that no client parses it into a binary double. The integral width of
        ten digits is the width the reference layouts declare.
      examples:
        - '5000.00'
        - '-123.45'
        - '0.00'

    # WHY : Refactoring Rationale: THIS SCHEMA WAS WRONG, and not in a detail. The
    #       previous revision declared the RFC 7807 members type, title, detail and
    #       instance, and this system emits none of them: the shared advice in
    #       common-lib renders code, secondaryCode, message, severity, subsystem,
    #       status, correlationId, path, timestamp, fieldErrors and abend. A client
    #       generated from that revision could not bind a single error response,
    #       and every sibling contract in this migration already declared the real
    #       shape -- so this document alone described an error type that does not
    #       exist. It is corrected here rather than referenced from elsewhere,
    #       because this document has to be readable on its own.
    ApiError:
      type: object
      additionalProperties: false
      # WHY : Refactoring Rationale: `message` and `abend` are REQUIRED and NULLABLE, which is a
      #       different statement from optional and is the one this shape has to make. Both are record
      #       components of ApiError in
      #       services/common-lib/src/main/java/com/carddemo/common/error/ApiError.java, and a record
      #       component is always written, so the key is present with a null value on every response --
      #       `ApiErrorWireShapeTest` asserts exactly that, emitting `"message":null` and `"abend":null`.
      #       An earlier revision omitted them from this list, which told a generated client the keys
      #       might be missing and left it unable to distinguish "not supplied" from "nothing to
      #       report"; a strict validator reading `additionalProperties: false` alongside the omission
      #       had no member to bind the emitted keys to at all.
      # WHY : Alternatives Considered: suppressing the two keys when null, with an inclusion setting, so
      #       the omission became true. Rejected because the aggregate sentence is the reference's own
      #       75-character message field and a client renders the band from it unconditionally, so a
      #       key that comes and goes moves that decision into every client; and because the services
      #       set `default-property-inclusion: always`, which the money contract depends on.
      required:
        - code
        - secondaryCode
        - message
        - severity
        - subsystem
        - status
        - correlationId
        - path
        - timestamp
        - fieldErrors
        - abend
      description: >-
        The shared problem document this system returns for every failure. Its
        shape is defined once in common-lib and is identical across every service
        contract in this migration, so a client writes one error handler rather
        than one per service.
      properties:
        code:
          type: string
          maxLength: 13
          description: >-
            The stable identifier of the failure kind, matched on by alert rules
            and log queries. It is a field of its own rather than a token inside
            the message, because a token inside a sentence is matchable only by
            substring.
          example: 'CARDDEMO-0400'
        secondaryCode:
          type: string
          maxLength: 13
          description: >-
            A narrowing identifier where the kind has one, and the empty string
            otherwise. It is never null, so a client need not distinguish absent
            from empty.
        message:
          oneOf:
            - type: string
              maxLength: 75
            - type: 'null'
          description: >-
            The operator- and user-facing sentence. Where the reference has its own
            wording for the condition, that wording is carried character for
            character; otherwise it is one of this system's fixed sentences. It
            never carries a value the caller sent, an encrypted identifier, or a
            message composed by a driver, a parser or a validation library.
          example: 'Please correct the highlighted fields'
        severity:
          $ref: '#/components/schemas/Severity'
        subsystem:
          $ref: '#/components/schemas/Subsystem'
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: The HTTP status code, repeated in the body.
        correlationId:
          type: string
          description: >-
            The correlation identifier of the request, echoed so a caller can find
            the same request in this service's logs.
        path:
          type: string
          description: >-
            The path the failure occurred on. Every digit run in it long enough to
            be a primary account number is narrowed to a mask and its last four
            digits before the value is emitted or logged.
        timestamp:
          type: string
          description: >-
            When the failure was rendered, in the reference's own 26-character
            form. It is NOT an RFC 3339 instant and is deliberately not declared
            with format date-time: the reference renders a timestamp as
            'YYYY-MM-DD HH:MM:SS.mmmmmm' with a space rather than a T and no zone
            designator, and this system carries that rendering unchanged so that a
            value read from a migrated record and a value read from a response are
            comparable as text.
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}$'
          example: '2026-08-07 00:00:00.000000'
        # WHY : Refactoring Rationale: THIS ARRAY IS WHERE A PSEUDO-CONVERSATIONAL COUPLING
        #       IS SEVERED, and the severance is the most consequential structural
        #       difference between the reference presentation and this contract. The
        #       templated highlight at app/cpy/CSSETATY.cpy conjoins THREE conditions at
        #       L18, L19 and L20: the field's flag is unacceptable, OR the flag is absent,
        #       AND the program is on a re-entry. That third conjunct is a session fact,
        #       declared as CDEMO-PGM-CONTEXT PIC 9(01) at app/cpy/COCOM01Y.cpy L29 with
        #       its two conditions at L30 and L31, and it survives between screen turns
        #       only because the terminal echoes the communication area back. Its effect
        #       is that on a FIRST entry a rejected field is not marked at all -- the
        #       refusal is real but invisible.
        #       Alternatives Considered: carrying that flag forward, as a body member, a
        #       header or a server-side session entry, so the rendering rule could be
        #       transcribed unchanged. Rejected because a stateless handler has no turn to
        #       remember, so the flag would have to be manufactured by the very client
        #       whose display it then governs -- and a client that can assert "this is a
        #       first entry" can suppress the marking of its own refused fields. This
        #       array is instead the WHOLE input to field-error rendering: an entry is
        #       present exactly when a field was refused, so the first response marks
        #       every refusal and no client-supplied value can change that.
        #       Trade-offs: the reference's two-turn behaviour is therefore NOT
        #       reproduced, and that is an intentional, documented divergence rather than
        #       an omission -- a refusal is marked one turn earlier here than on the 3270
        #       screen. What is given up is byte-identical first-entry behaviour; what is
        #       bought is that a refusal is never silent.
        fieldErrors:
          type: array
          description: >-
            One entry per rejected field on a 400, and an empty array on every
            other status. This is the target form of the reference programs'
            FLG-*-NOT-OK and FLG-*-BLANK validation flags and of the templated
            field highlight at app/cpy/CSSETATY.cpy L17 to L27, with the re-entry
            conjunct at L20 deliberately not carried across. On a 409 it carries
            one entry keyed version reporting the current revision.
          items:
            $ref: '#/components/schemas/FieldError'
        abend:
          oneOf:
            - $ref: '#/components/schemas/AbendDetail'
            - type: 'null'
          description: >-
            Present only on a 500, null otherwise. Its presence is the signal that
            the failure was not the caller's: a refusal of caller input carries
            warning severity and no abend block, and a service fault carries
            critical severity and this one.

    FieldError:
      type: object
      additionalProperties: false
      required: [field, state, message]
      # WHY : Refactoring Rationale: an earlier revision of this schema declared a fourth `error`
      #       boolean here, because the emitted record published its derived `isError()` predicate as a
      #       property and this schema seals itself against unknown members. The member has been
      #       withdrawn on the EMITTING side instead: `isError()` in
      #       services/common-lib/src/main/java/com/carddemo/common/error/ApiError.java now carries
      #       `@JsonIgnore`, and `ApiErrorWireShapeTest` pins the emitted property set at these three.
      #       Amending the contract was the wrong half of the pair to change, because the other six
      #       published contracts declare three members with `additionalProperties: false`, so the
      #       fourth property made every one of their services send a body its own contract refused --
      #       and a value that is a pure function of `state`, and unconditionally true because the
      #       record refuses a valid state, gave a caller a second statement of one fact to reconcile.
      description: >-
        One failing property, keyed by the REQUEST PROPERTY the value arrived in so
        that a form can attach the refusal to the control it submitted.
        #
        # Refactoring Rationale: this schema declared a fourth boolean member named
        #   `error` and required it, on the ground that the emitted record derived
        #   one and that a sealed schema had to admit it. That ground was correct
        #   about the emitted record and wrong about the remedy: the six sibling
        #   contracts in this repository all publish these three members and no
        #   fourth, so declaring it here made THIS document the outlier and left a
        #   client that had been generated from any other one unable to validate an
        #   account refusal. The derived member is now suppressed at the source, on
        #   ApiError.FieldError, and asserted absent by the emitted-key-set case in
        #   services/common-lib/src/test/java/com/carddemo/common/error/ApiErrorTest.java,
        #   so all seven documents and the browser client describe one shape.
        # Alternatives Considered: adding the member to the other six documents and
        #   to ui/src/api/types.ts instead. Rejected because the value is a constant
        #   -- the record's constructor refuses any state that is not an error, so
        #   the predicate is true for every entry that can exist -- and publishing a
        #   constant invites a client to branch on something that never varies. The
        #   `state` member below already carries the distinction a client can act on.
      properties:
        field:
          type: string
          minLength: 1
          description: >-
            The offending request property's name, or the literal 'request' when
            the refusal names no single property, or 'version' on a 409.
          example: 'stateCode'
        state:
          $ref: '#/components/schemas/FieldValidationState'
        message:
          type: string
          minLength: 1
          maxLength: 75
          description: >-
            Why it was rejected. It never echoes the rejected value: for a value
            that will not convert, the property is named and the value is not, and
            for a value that is too wide the declared width is reported rather than
            the text.

    FieldValidationState:
      type: string
      enum: [NOT_OK, BLANK]
      description: >-
        Which of the reference's two failure conditions applies. BLANK means
        nothing was supplied and additionally causes the client to render the
        literal asterisk marker the reference copybook writes into an empty field;
        NOT_OK means a value was supplied and refused, which the reference marks by
        recolouring the field alone.

    Severity:
      type: string
      enum: [LOG, INFO, WARNING, CRITICAL]
      description: >-
        How the failure should be read operationally. A refusal of caller input is
        WARNING; a service fault is CRITICAL. The distinction is what keeps the
        channel that means a service is broken from carrying a steady stream of
        requests that were merely wrong.

    Subsystem:
      type: string
      enum: [APPLICATION, CICS, IMS, RELATIONAL, QUEUE, OBJECT_STORE]
      description: >-
        Where the failure arose. A contention refusal reports RELATIONAL even when
        this service, rather than the persistence provider, is what noticed it,
        because it is the relational store the contention is over.

    AbendDetail:
      type: object
      additionalProperties: false
      required: [abendCode, abendCulprit, abendReason, abendMsg]
      # WHY : Refactoring Rationale: the citation reads L21 to L29 because that is where the structure
      #       actually is. app/cpy/CSMSG02Y.cpy is THIRTY-FIVE lines long, so the L45 to L53 an earlier
      #       revision named resolves to nothing at all -- `01 ABEND-DATA` is at L21, and its four
      #       subordinate fields are at L22, L24, L26 and L28, each followed by a VALUE SPACES clause.
      #       A citation that cannot be opened is worse than none, because a reader who follows it
      #       concludes the field does not exist rather than that the number was wrong.
      # WHY : Refactoring Rationale: each width is now declared, and each is the PICTURE width of the
      #       field it mirrors -- ABEND-CODE PIC X(4) at L22, ABEND-CULPRIT PIC X(8) at L24,
      #       ABEND-REASON PIC X(50) at L26 and ABEND-MSG PIC X(72) at L28. The last of those had been
      #       declared as 75, which is the width of the AGGREGATE message field CCARD-ERROR-MSG at
      #       app/cpy/CSMSG01Y.cpy and not of this one; the two are separate fields and a contract that
      #       admits 75 here would accept three characters the reference field cannot hold. The other
      #       six published contracts already declare 4, 8, 50 and 72, so this document was the outlier.
      description: >-
        The target form of the reference's own abend fields at
        app/cpy/CSMSG02Y.cpy L21 to L29. Its four members are fixed text about
        where the failure was recognised and never carry anything derived from the
        caught throwable, so a provider's internal wording cannot reach a response
        through them.
        #
        # Refactoring Rationale: the citation read L45 to L53 and named nothing --
        #   that copybook is 35 lines long, so the range addressed no declaration at
        #   all and a reader checking the widths below against it found an empty
        #   span. `01 ABEND-DATA` stands at L21 and its four members occupy L22 to
        #   L29: ABEND-CODE PIC X(4) at L22, ABEND-CULPRIT PIC X(8) at L24,
        #   ABEND-REASON PIC X(50) at L26 and ABEND-MSG PIC X(72) at L28. The five
        #   sibling contracts in this repository already cite L21 to L29, so this
        #   document was the only one pointing past the end of the file.
      properties:
        abendCode:
          type: string
          maxLength: 4
          description: >-
            Which abend condition was recognised, at most four characters, from
            ABEND-CODE PIC X(4) at app/cpy/CSMSG02Y.cpy L22.
          example: 'SVCE'
        abendCulprit:
          type: string
          maxLength: 8
          description: >-
            Which component recognised it, or the empty string, mirroring
            ABEND-CULPRIT PIC X(8) at app/cpy/CSMSG02Y.cpy L24. The external
            projection blanks it rather than naming an internal program.
        abendReason:
          type: string
          maxLength: 50
          description: >-
            Why it was recognised, or the empty string, mirroring ABEND-REASON
            PIC X(50) at app/cpy/CSMSG02Y.cpy L26. Blanked for the same reason as
            abendCulprit: its value is a platform diagnostic a client cannot act on.
        abendMsg:
          type: string
          maxLength: 72
          description: >-
            The operator-facing sentence for the condition, at most seventy-two
            characters, from ABEND-MSG PIC X(72) at app/cpy/CSMSG02Y.cpy L28.
