# =============================================================================
# services/account-service/src/test/resources/application-test.yml
# -----------------------------------------------------------------------------
# Purpose:
#   Supplies the Spring `test` profile overlay for account-service, the bounded
#   context that owns the account master, the customer master and the card
#   cross-reference. It changes only the values a database-backed test cannot
#   inherit: the transport mode the base profile requires of a managed engine,
#   the pool sizing a shared container cannot absorb, the two remote
#   configuration sources a test must not contact, the queue poller a test with
#   no broker must not start, and the log levels a test run needs.
#
#   Every other production mechanism is inherited on purpose, so that a passing
#   test exercises the deployed shape rather than a test-only substitute. The
#   migration applied here is the one this module owns,
#   db/migration/V1__account.sql, and the mappings it is checked against are the
#   entities under com.carddemo.account.domain.
#
#   Two classes activate this profile, both of them repository integration
#   tests: repository/AccountScreenProjectionIT.java and
#   repository/CustomerMasterRepositoryIT.java. Each starts a PostgreSQL
#   container, creates the account schema and its owning role before the context
#   is built, publishes the generated connection coordinates and the matching
#   migration pair through @DynamicPropertySource, and loads a narrow
#   @SpringBootConfiguration that reaches only this context's entities and
#   repositories. No other test class in this module reads this file, and no
#   build plugin activates the profile on their behalf. That division of labour
#   is what keeps every schema, role and grant statement out of this file.
#
# Parameters:
#   Each property key below is the YAML analogue of a parameter, and every one
#   of them differs from src/main/resources/application.yml. Three are
#   deliberate restatements rather than changes, and each says so where it
#   appears: the two schema selectors and the bind-parameter logger.
#
#   This file consumes no environment variable and declares no value that names
#   a network location, an account, a role credential, or key material of any
#   kind. That is a property of the file rather than an accident of it: the
#   values a deployment injects arrive here from the container the two tests
#   start, and the values a deployment keeps in a managed store are read by
#   neither context.
#
# Return values:
#   The effective Spring Environment after this overlay is merged over
#   src/main/resources/application.yml and the classpath defaults document that
#   file imports. That Environment yields: a cleartext loopback connection to a
#   container-supplied database over a narrow pool; a Flyway run that applies
#   V1__account.sql into the account schema the test setup created, under the
#   ownership the base profile's own statement selects; a Hibernate mapping
#   validation against the tables that migration produced; no remote
#   configuration lookup; and no running queue listener.
#
# Exceptions or errors:
#   A misspelled Spring property raises nothing whatsoever, which is why every
#   key here was checked against the configuration metadata published by the
#   pinned artifact that binds it rather than against recollection. The failures
#   this overlay exists to prevent are all start-up failures, and each is named
#   at the value that prevents it: a rejected connection when the inherited
#   transport mode meets an engine serving no TLS; a missing relation, or a
#   silently wrong one, when no schema selector is in force; a remote
#   configuration lookup that fails or stalls because the source is reachable
#   from one host and not from another; and a queue poller that reports a
#   transport failure in a test that never asked for a queue. One further
#   start-up failure belongs to the test setup rather than to this file and is
#   noted where the schema is discussed: the base profile's ownership statement
#   names a role that only the cluster bootstrap creates, so a container where
#   that role is absent ends context load on the first migration connection.
#
# WHY (non-obvious design decisions):
#   1. The two remote configuration sources the base profile imports are
#      switched off rather than left optional, because optional governs a
#      missing value and not an attempted call. Recorded on
#      spring.cloud.aws.parameterstore.
#   2. Transport is disabled outright rather than downgraded to a negotiating
#      mode, because a mode that negotiates verifies nothing. Recorded on
#      sslmode.
#   3. This file creates no schema, no role and no grant, and leaves the base
#      profile's create-schemas setting and ownership statement exactly as they
#      are, because the test setup in the java tree supplies that prerequisite
#      instead. Recorded on spring.flyway.
#   4. Both schema selectors are restated even though the base profile already
#      sets them, because the failure they prevent is a PASSING test rather than
#      a failing one. Recorded on spring.jpa.properties.hibernate.
#   5. The queue listener is stopped from starting even though the repository
#      tests reading this profile build none. Recorded on
#      spring.cloud.aws.sqs.listener.
#   6. The bind-parameter logger is pinned even though the level it is pinned to
#      is the level it would otherwise inherit. Recorded on logging.level.
#   7. Documentation convention: docs/CODE_DOCUMENTATION_STANDARD.md. YAML has
#      no docstring construct, so this header block is the module-entry-point
#      equivalent, and every value below carries an adjacent rationale under one
#      of the four category labels that standard fixes. No linter reads this
#      file, so no comment here claims a gate enforces something it does not.
#   8. A register at the foot of the file records what this overlay deliberately
#      does NOT set, because several of those values are ones a reasonable
#      reader would expect to find.
# =============================================================================

spring:

  cloud:
    aws:

      # Assumptions: the base profile draws its endpoints, credentials, issuer
      #   and queue names from two remote sources and marks both imports
      #   optional. Optional decides what happens when a parameter is ABSENT; it
      #   does not decide whether the lookup is attempted. Left enabled, the
      #   config-data resolver builds a client and calls the service while the
      #   Environment is still being assembled, so a test fails or stalls on
      #   endpoint and credential resolution before its first assertion runs --
      #   and does so differently on a host that carries an instance profile
      #   than on one that does not, which is the defect shape that reads as
      #   flaky rather than as misconfigured.
      # Alternatives Considered: overriding spring.config.import to drop the two
      #   remote entries. Rejected because that key is a list, so replacing it
      #   also drops the classpath defaults document the base imports in the
      #   same list, and the shared metric tags and environment label this
      #   module reads from that document would silently disappear. These two
      #   flags disable exactly the two sources named and leave the classpath
      #   import untouched.
      parameterstore:
        enabled: false
      secretsmanager:
        enabled: false

      sqs:
        listener:
          # Assumptions: the base profile does not set this key, so the
          #   framework default applies and a listener container starts with the
          #   context. The repository tests using this profile build no
          #   listener, because each excludes the queue auto-configuration by
          #   name and none reaches the package holding the inquiry listener.
          #   The flag is set for the contexts that do: a messaging test, or any
          #   test that reaches the service package, would otherwise start a
          #   poller that resolves a queue name against no broker and report a
          #   failure belonging to the transport rather than to the behaviour
          #   under test.
          # Trade-offs: a test that DOES want the listener has to start it
          #   deliberately, registering this key as true through its own dynamic
          #   property or @TestPropertySource beside the emulator coordinates it
          #   has to supply in any case. That is one line in the one test that
          #   wants a poller, against a poller in every other context here.
          auto-startup: false

  datasource:
    hikari:

      data-source-properties:
        # Assumptions: the base profile demands full verification and names a
        #   certificate bundle, because the managed engine serves TLS and its
        #   parameter group refuses a cleartext session. A PostgreSQL container
        #   starts with TLS off, so the inherited mode rejects every connection
        #   with a server-does-not-support-SSL error before Flyway opens its
        #   first one. The inherited bundle path is left alone deliberately:
        #   this key binds as a property map, so overriding one entry leaves the
        #   other in place, and the driver ignores a bundle once verification is
        #   off.
        # Alternatives Considered: a negotiating mode. Rejected because it would
        #   choose the transport from however the image happened to start and
        #   verify no identity even when it did negotiate TLS, so the same test
        #   could run encrypted on one host and cleartext on another with
        #   nothing in the output to distinguish them. An explicit disable is
        #   the honest description of a loopback hop to a throwaway container.
        # Trade-offs: the database hop under test is therefore cleartext. The
        #   container holds only test rows and is discarded with the run, and
        #   both deployed profiles keep full verification, so what is given up
        #   is coverage of the handshake itself -- which belongs to an
        #   environment test against the managed engine, not to this module.
        sslmode: disable

      # Trade-offs: four connections with no idle floor, against the larger
      #   deployed sizing. A repository test issues its queries serially, while
      #   several reactor forks can hold pools against one container at the same
      #   time, so a narrow pool with no floor is what keeps a parallel build
      #   inside the container's own connection limit instead of failing on
      #   too-many-clients. The cost is that a concurrent fifth query waits for
      #   a connection rather than opening one, which no test here can observe.
      maximum-pool-size: 4
      minimum-idle: 0

  jpa:
    properties:
      hibernate:
        # Assumptions: this restates the base value deliberately, and the
        #   underscore is Hibernate's own spelling of the setting rather than a
        #   variant of Flyway's hyphenated key. It is restated because the
        #   failure it prevents is a PASSING test: with no schema selector in
        #   force an unqualified mapping resolves through the session search
        #   path, and a run that meets a same-named table outside this bounded
        #   context validates against that table and reports success. A missing
        #   relation fails loudly and would be caught by the first run; a wrong
        #   relation is silent and would not.
        # Trade-offs: two documents now name the schema, so a deliberate change
        #   in the base needs a matching change here or the integration suite
        #   stops proving what it appears to prove. Being made to write that
        #   second diff is the point of the duplication: the alternative is a
        #   base edit that changes the meaning of a green suite with no evidence
        #   of the change anywhere in the test tree.
        default_schema: account

  flyway:
    # Assumptions: restated for the same reason as the Hibernate selector above.
    #   This key decides where the schema history table and every unqualified
    #   object resolve, so a run without it can leave migration state outside
    #   the schema the tables land in, and a repeated run then reads a history
    #   that describes neither of them.
    default-schema: account

    # Assumptions: NOTHING about schema creation, role creation or granting is
    #   set here, and that is the decision rather than an omission.
    #   data-migration/sql/V0__schemas_and_roles.sql is the exclusive authority
    #   for schemas, owner roles, runtime roles and grants in this system, which
    #   is why the base profile forbids Flyway from creating a schema and why
    #   db/migration/V1__account.sql carries no CREATE SCHEMA, no CREATE ROLE
    #   and no GRANT of its own. A PostgreSQL container has never run that
    #   bootstrap, so the schema and its owning role have to exist before Flyway
    #   opens its first connection -- and the integration-test setup in the java
    #   tree is what creates them, in a documented step on each of the two
    #   consuming classes, ahead of context refresh. This file inherits
    #   create-schemas unchanged and leaves the base profile's own ownership
    #   statement in force, so the deployed mechanism that makes migrated
    #   objects belong to the NOLOGIN owner is the mechanism these tests
    #   actually exercise. CustomerMasterRepositoryIT asserts the resulting
    #   owner by name, which is what would catch that statement being lost.
    # Alternatives Considered: two shapes are rejected here.
    #   Turning Flyway's create-schemas on for the test profile makes
    #   the schema appear but leaves it owned by whichever user the container
    #   generated, so every default-privilege grant keyed on the owning role is
    #   inert and the ownership assertion fails. Adding statements to
    #   spring.flyway.init-sqls that create the role, grant it rights and then
    #   assume it makes the assertion pass, but it turns this profile into a
    #   second, unversioned definition of the cluster's role graph -- free to
    #   drift from the document that holds that authority, and recorded in no
    #   migration history. Placing the prerequisite in the test setup keeps one
    #   authority for the deployed graph and one harness step for the container.
    # Trade-offs: the two consuming classes therefore each carry a small setup
    #   step that a reader has to find in java rather than here, and the same
    #   prerequisite is expressed twice because a shared base class would be a
    #   new type for two callers. What is bought is that this file names no
    #   role, grants no right and creates no schema, so it cannot disagree with
    #   the document that does all three.

logging:
  level:
    # Trade-offs: framework narration is reduced so that one migration line or
    #   one assertion failure is not buried in start-up output. The project
    #   package and the migration engine keep the levels the base gives them, so
    #   the applied version and this context's own decisions stay visible. What
    #   is given up is the start-up detail that explains a context failure,
    #   which a developer investigating one can raise for that run alone.
    root: WARN

    # Assumptions: this restates the base value, and it restates it as a
    #   data-protection control rather than a log-volume one -- the same reason
    #   application-dev.yml and application-prod.yml each pin it as well. The
    #   bound values on this context's statements are account and customer
    #   identifiers together with the plaintext side of the two columns stored
    #   encrypted precisely so they do not appear in the clear, and the customer
    #   records this module loads carry values of exactly that shape. Pinning it
    #   here is what stops a later broadening above from raising it by accident:
    #   root is set to WARN above, and a developer who sets root to DEBUG to
    #   investigate a context failure would otherwise print every bound
    #   identifier in the run.
    # Trade-offs: bind values are therefore unavailable when a repository test
    #   fails on a query, and the statement text alone has to answer the
    #   question. That is a real cost during investigation, accepted because a
    #   test run's log output is the one destination the masking this module
    #   applies at its API edge never reaches.
    org.hibernate.orm.jdbc.bind: WARN

# -----------------------------------------------------------------------------
# Register of deliberate omissions. Each entry below is a value a reasonable
# reader would expect this overlay to set. Each is absent for a reason that was
# established by reading the two consuming test classes and the base profile,
# rather than assumed.
# -----------------------------------------------------------------------------
#
#   1. No datasource URL, user name or credential, and no migration pair.
#      Assumptions: both consumers publish all five of those through
#      @DynamicPropertySource from the container they start, and a dynamic
#      property outranks a profile document. Committing a connection string was
#      rejected on the ground that a default which resolves is a default that
#      can be run against by accident -- and a port and database name generated
#      per run could not be matched by any committed value in the first place.
#
#   2. No ddl-auto.
#      Assumptions: the base profile already selects validation, which is what a
#      migration test wants -- Flyway produces the tables and Hibernate checks
#      the mappings against them. Restating a value that already agrees is how
#      two documents come to disagree later, so it is inherited instead.
#      Alternatives Considered: a generating mode. Rejected because any of them
#      lets Hibernate author the schema in place of V1__account.sql, and the two
#      things Hibernate cannot infer -- the encrypted identifier columns and the
#      secondary index standing in for the cross-reference alternate index --
#      are the two the migration exists to create. A defective migration would
#      then pass against tables Hibernate wrote.
#
#   3. No endpoint, no queue location, no issuer, no role credential and no key
#      material of any kind.
#      Assumptions: neither consumer reads any of them. Both exclude the
#      resource-server and queue auto-configurations by name, and neither
#      reaches the api, service, mapper or config packages, so the beans that
#      would read an issuer, an application client identifier, a key alias, the
#      three queue names, the two internal signing keys or the reference-context
#      address are absent from both contexts. Spring resolves a placeholder only
#      when something reads the property, so the base profile's fallback-free
#      entries raise nothing here. A later test that does need one registers it
#      dynamically, beside the container coordinates it already registers.
#      Alternatives Considered: committing visibly fabricated stand-ins for all
#      of them, so that any future context would start without being edited.
#      Rejected on two independent counts. A committed signing key is key
#      material in the repository whatever its value, and the constraint this
#      migration accepted is that no secret is committed at all, not that no
#      USEFUL secret is; and a stand-in that resolves is an invitation for a
#      context to reach it. The baseline takes the same position about runtime
#      locations: app/app-vsam-mq/cbl/COACCT01.cbl declares its queue block at
#      L92, and each of the four queue-name fields at L93-L96 is initialised to
#      spaces, so the program that ran on the mainframe carried no queue
#      location in its source either and expected one at run time.
#
#   4. No actuator exposure override.
#      Assumptions: both consumers run with no web environment, so no actuator
#      surface exists for a narrower list to describe. The inherited list is
#      left exactly as it stands because the unauthenticated health route on it
#      is the one the load-balancer target group and the container health check
#      poll, and neither of those callers can present a token; narrowing it here
#      would describe a surface no deployment has.
#
#   5. No server port, no listener transport and no application name override.
#      Assumptions: neither consumer binds a listener, so the inherited port and
#      the inherited transport settings are never read. The port is shared with
#      the container image and the load-balancer contract, and the application
#      name is the service identity that logging and metrics tag every record
#      with, so changing either here would make an assertion observe an identity
#      no deployed task carries. Alternatives Considered: committing a throwaway
#      certificate and key so a future listener-bound test could start
#      unmodified. Rejected because it would place private key material in this
#      repository for a loopback hop, which the no-committed-secret constraint
#      forbids outright; such a test disables the transport in its own
#      annotation instead.
#
#   6. No second datasource and no read replica.
#      Assumptions: the base declares one datasource, and the target design
#      keeps reporting reads on the writer through read-only cross-schema views,
#      so there is no second connection for this profile to describe.
#
#   7. No batch key and no scheduling key.
#      Assumptions: this module's POM declares no batch starter. The sequential
#      read programs this context absorbs are read paths behind endpoints here
#      rather than scheduled jobs, so a job repository would create tables in a
#      schema this service does not own and would describe a runtime mechanism
#      the module cannot load.
#
#   8. No profile-selection key.
#      Assumptions: the profile is chosen by the @ActiveProfiles annotation on
#      the two consuming classes. A document that named its own profile would
#      either agree redundantly or contradict the annotation that loaded it.
#
#   9. No test-record path.
#      Assumptions: the flat records this module ships for its tests are
#      resolved by classpath name from the test sources. A path here would be a
#      second place to change when one of them moves, and the one place no
#      compiler and no test would check.
# =============================================================================
