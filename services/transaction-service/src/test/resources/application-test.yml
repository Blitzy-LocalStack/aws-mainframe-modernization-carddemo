# =============================================================================
# services/transaction-service/src/test/resources/application-test.yml
# -----------------------------------------------------------------------------
# Purpose:
#   The Spring `test` profile for transaction-service, the LEDGER bounded context.
#   It is an OVERLAY on src/main/resources/application.yml, active whenever the
#   test classpath resolves profile `test`, and it changes only what a build host
#   must change: where the database connection comes from, on what terms it is
#   opened, how the `ledger` schema is reached on a database that starts empty,
#   and how loudly the run reports itself. Every other value is inherited.
#
#   Two shapes of test read it: every *RepositoryIT, which Failsafe runs against a
#   real PostgreSQL container and which is the only shape that opens a connection,
#   applies db/migration/V1__ledger.sql and queries the four `ledger` tables; and
#   every context-loading *Test, which Surefire runs and which reaches no
#   database. Records those tests read live in the sibling fixtures/ folder.
#
#   NO CONNECTION STRING, HOST, PORT, USER NAME OR CREDENTIAL APPEARS ANYWHERE IN
#   THIS FILE, and neither does a reachable issuer or any other endpoint value.
#
#   Documentation convention: docs/CODE_DOCUMENTATION_STANDARD.md. YAML has no
#   docstring construct, so the analogue used here is this header plus one
#   labelled rationale directly above each key it explains. The Explainability
#   gate over this file is REVIEW rather than a linter: checkstyle.xml narrows its
#   Checker with fileExtensions="java", so nothing mechanical inspects the prose
#   below.
#
#   Profile invariance: a profile may differ from the base in sizing, pool limits,
#   log level, retention and diagnostic verbosity, and in nothing else. Schema
#   ownership is `ledger`, identity is a JWT resource server, queue usage is none
#   and the datastore is PostgreSQL -- all four identical to the base. Exactly
#   three settings DEPART from the base rather than narrowing it, each argued at
#   its key: the schema-creation allowance, the Hibernate schema assertion and the
#   transport-security mode. The first two exist because a container database
#   starts empty where a deployed one does not; the third because a container
#   serves no TLS.
#
# Deliberate absences, recorded here because an absent key has no line to sit
# beside. Only the load-bearing ones are listed; the rest are simply inherited.
#
# - The datasource URL, user name and credential keys, and any host, port or
#   connection string.
#   Alternatives Considered: writing them here. Rejected because the container's
#     port is assigned at run time, so a written connection string either
#     addresses nothing or addresses whichever database happens to be listening --
#     and the second failure mode is worse, because it passes.
#   Assumptions: coordinates arrive through exactly ONE mechanism instead. Every
#     *RepositoryIT annotates its PostgreSQLContainer field @ServiceConnection,
#     which contributes a JdbcConnectionDetails bean the auto-configuration
#     prefers over spring.datasource.url. @DynamicPropertySource would work with
#     one fewer test-scoped artifact and is rejected as an EITHER/OR rather than
#     recorded as a second route: a profile documenting two ways in lets an author
#     pick the one this classpath does not support and find out by compilation
#     failure. The base document's placeholders stay unresolved during a test run,
#     which is safe because binding leaves an unresolvable placeholder as literal
#     text rather than raising.
#
# - Any key naming the size of a page, a page number, or an offset-and-limit
#   query.
#   Refactoring Rationale: paging here is KEYSET paging over the same key columns
#     the CICS browse walked, carried by common-lib's PageResponse envelope. An
#     offset-and-limit query is rejected outright because under concurrent inserts
#     it skips and repeats rows, changing observable behaviour that browse-by-key
#     does not. Exposing page size as a property would additionally let a test
#     drift from the screen contract the baseline establishes, so that number
#     lives in code beside the query and its one-extra-row probe.
#
# - Any clock or current-time property.
#   Assumptions: determinism for the 26-character timestamp is supplied as a BEAN
#     and not as a property -- common-lib's TimestampFormatter takes the clock as a
#     parameter and throws rather than reading an ambient one, so a test supplies a
#     clock pinned through Clock.fixed. Normalising an ambient reading before
#     comparison is the parity oracle's technique for a batch program compared
#     against a committed file, and no such file covers this module at all: the
#     four programs it migrates are online CICS programs, which tests/README.md
#     section 1.1 records cannot be run end to end without a CICS runtime.
#     Injecting determinism at the source is the only mechanism available, and it
#     is the house direction that tests/README.md section 11 states.
#
# - Every server.*, Spring Cloud AWS, messaging and Batch key.
#   Assumptions: neither shape of test binds a listener, this module declares
#     neither io.awspring.cloud nor software.amazon.awssdk, and it owns no job
#     repository. Naming a key from an absent library binds nothing and would read
#     as a missing dependency, inviting the next reader to add the library rather
#     than remove the key.
# =============================================================================

spring:

  datasource:

    # Alternatives Considered: an in-memory database, and H2 by name, so the
    #   repository suite could run with no container. Rejected on mechanism rather
    #   than a preference for realism: V1__ledger.sql creates two NON-UNIQUE
    #   indexes over ledger.transactions, and idx_transactions_proc_ts is the
    #   PostgreSQL analogue of the batch alternate index at app/jcl/TRANIDX.jcl
    #   line 27. The keyset access paths the *RepositoryIT suite exists to prove
    #   run over exactly those columns, and an in-memory substitute would either
    #   refuse the DDL or accept the access patterns while planning them
    #   differently, so the suite would report a guarantee the deployed engine was
    #   never asked to make.
    # Trade-offs: one container start per integration run, and a build host able
    #   to run one at all. Accepted in exchange for deleting every hand-written
    #   connection property and the drift they invite. The parity suite under
    #   tests/** makes the same trade in the same direction.
    hikari:

      data-source-properties:
        # Assumptions: the base requires verify-full, paired with the server-side
        #   force-SSL cluster parameter, because the rows behind that pool are
        #   posted money movement. A PostgreSQL container serves no TLS at all, so
        #   inheriting that value makes every connection here fail before an
        #   assertion runs -- measured against driver 42.7.13 and a PostgreSQL 17
        #   container, which refuses verify-full with "The server does not support
        #   SSL."
        # Trade-offs: this is the loosest of the six modes the driver offers, and
        #   it is scoped to a database that exists only for the duration of a build
        #   and holds only records this suite wrote. Nothing in this file reaches a
        #   deployed cluster, so no deployed connection is loosened.
        sslmode: disable

      # Assumptions: inherited from the base and restated because its behaviour on
      #   an empty database differs visibly. PostgreSQL accepts a search path
      #   naming a schema that does not exist -- measured on PostgreSQL 17, setting
      #   the path to an absent schema SUCCEEDS and current_schema() then reports
      #   nothing -- so on a container database this statement cannot be relied on
      #   to reach `ledger` and cannot report that it failed to. It is kept for the
      #   affirmative reason: once Flyway has created the schema, pinning the path
      #   to `ledger` alone makes a stray unqualified reference to another
      #   context's table fail loudly in a test.
      connection-init-sql: SET search_path TO ledger

      # Trade-offs: four connections rather than the base document's ten. The base
      #   is sized against one Aurora cluster shared with seven peer services and
      #   the batch role; the constraint here is a single container holding the
      #   engine's default connection limit, possibly shared with a parallel
      #   Failsafe fork running its own pool. An idle floor of zero holds no
      #   connection between test classes, which a deployed profile cannot do
      #   because it would pay a handshake on the first request after an idle
      #   period.
      maximum-pool-size: 4
      minimum-idle: 0

  flyway:

    # Assumptions: the Flyway engine alone is not enough, and the way it fails is
    #   why the requirement is named HERE. Flyway 10 moved database-specific
    #   support out of core into per-database modules and the split persists at the
    #   13.0.0 the parent manages, so this module declares
    #   flyway-database-postgresql beside the starter that brings flyway-core.
    #   Omitting the companion breaks nothing at build time: it aborts when a
    #   connection is first resolved to a database type. This profile is the ONE
    #   place in the build where the migration runs against a database, so that
    #   abort surfaces here as an integration-test failure and nowhere as a compile
    #   error.
    enabled: true
    locations: classpath:db/migration

    # Assumptions: the schema history table has to sit in the same schema as the
    #   objects it records, so that a container database discarded whole cannot
    #   leave a history row behind pointing at objects that no longer exist. The
    #   eight schemas and the whole cross-schema privilege graph live in
    #   data-migration/sql/V0__schemas_and_roles.sql; this module owns exactly one
    #   migration and there is no second one here.
    schemas: ledger

    # Assumptions: under a container-supplied connection the JDBC URL is GENERATED,
    #   so no schema parameter can ride on it and the default schema has to be
    #   named as a property. This is the first half of the schema resolution; its
    #   Hibernate counterpart below is the second, and both are needed because
    #   Flyway and Hibernate read different keys for the same fact.
    default-schema: ledger

    # Assumptions: a container database starts EMPTY and V1__ledger.sql creates
    #   objects inside `ledger` without creating the schema itself, because a
    #   deployed cluster has it already from V0. This allowance is one of the three
    #   settings that DEPART from the base rather than narrowing it.
    # Trade-offs: two components can now create the same schema object. The cost is
    #   accepted because the alternative is a suite that fails on a missing schema
    #   before any assertion executes.
    create-schemas: true

    # Assumptions: baselining is the remedy a reader reaches for when Flyway
    #   reports a non-empty schema, and it is refused here precisely because it
    #   would mark the migration applied WITHOUT running it -- leaving a suite
    #   asserting against tables that were never created.
    baseline-on-migrate: false

    # Assumptions: `user` and `password` are deliberately ABSENT here while
    #   application.yml binds both to SPRING_FLYWAY_* with no fallback, and the
    #   absence resolves rather than conflicts. Boot only reads those two keys
    #   through PropertiesFlywayConnectionDetails, which
    #   FlywayAutoConfiguration creates @ConditionalOnMissingBean
    #   (FlywayConnectionDetails.class). The container below carries
    #   @ServiceConnection, whose JdbcConnectionDetails is adapted into a
    #   FlywayConnectionDetails bean by
    #   JdbcAdaptingFlywayConnectionDetailsFactory -- measured, not assumed: with
    #   the keys added and no SPRING_FLYWAY_USER in the environment, the context
    #   reached Flyway and failed on the SQL below rather than on an unresolved
    #   placeholder. So the container's own generated credential migrates here,
    #   and no stand-in credential has to be invented for a role this profile
    #   never creates with a password.
    #
    # Refactoring Rationale: `init-sqls` IS restated, and it has to be. The base
    #   file's single statement is `SET ROLE carddemo_ledger_owner`, naming the
    #   NOLOGIN role data-migration/sql/V0__schemas_and_roles.sql creates and this
    #   container has never heard of; left inherited, every test in the four
    #   *RepositoryIT classes failed context load with
    #   `role "carddemo_ledger_owner" does not exist`.
    #
    # Alternatives Considered: overriding this to an empty list, or to a no-op
    #   statement, so the ownership split simply does not happen under test.
    #   Rejected: it would leave the mechanism the deployed configuration depends
    #   on asserted by nothing, and the mechanism is the whole of the control --
    #   objects a migration creates must belong to the NOLOGIN owner, because every
    #   ALTER DEFAULT PRIVILEGES FOR ROLE clause in the bootstrap SQL is keyed on
    #   the CREATING role and is inert otherwise. The statements below reproduce it
    #   instead: the role is created if absent, granted CREATE on whichever
    #   database the container generated, and then assumed -- so Flyway creates the
    #   schema, the history table and every V1 object as carddemo_ledger_owner,
    #   exactly as it does in a deployed environment.
    #
    # Assumptions: the first statement is idempotent because Flyway runs every
    #   string here on EACH connection it opens, not once per migration. The role
    #   test and the grant are both re-runnable, and the grant is issued through
    #   `format` with `%I` on `current_database()` rather than a literal, because
    #   Testcontainers generates the database name and no fixed value would match
    #   it. CREATE on the database is required and is not implied by role
    #   creation: a fresh role holds only the PUBLIC grants, which are CONNECT and
    #   TEMPORARY, so without it `CREATE SCHEMA` fails once the SET ROLE takes
    #   effect.
    # Trade-offs: the container's user is a superuser and could therefore assume
    #   this role with no grant at all, which would make the GRANT look
    #   superfluous. It is kept because the grant is what the OWNER needs to create
    #   the schema, not what the connecting user needs to become it -- and
    #   `SET ROLE` drops the superuser attribute for the remainder of the session.
    init-sqls:
      - "DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'carddemo_ledger_owner') THEN CREATE ROLE carddemo_ledger_owner NOLOGIN; END IF; EXECUTE format('GRANT CREATE ON DATABASE %I TO carddemo_ledger_owner', current_database()); END $$;"
      - "SET ROLE carddemo_ledger_owner;"


  jpa:

    hibernate:
      # Refactoring Rationale: the base sets `none` because a deployed schema is
      #   owned by the migration and nothing may reconcile against it at start-up.
      #   Here `validate` is stricter and is one of the three deliberate
      #   departures: the container schema was just built by that same migration,
      #   so an entity-to-column disagreement is a defect in this module rather
      #   than a difference from a deployed cluster, and validation is the only
      #   mechanism that reports it at start-up instead of at the first query.
      # Trade-offs: any drift between an entity and the migration now aborts the
      #   context rather than surfacing as a failing assertion. That is the point:
      #   the abort names the column, whereas a failing query names only the
      #   statement.
      ddl-auto: validate

    # Trade-offs: lazy access outside a transaction now fails loudly here rather
    #   than being silently served by a request-scoped session. A repository test
    #   must not lean on a session the deployed profile does not open either, since
    #   the base closes this too.
    open-in-view: false

    # Trade-offs: statements are not echoed. This key writes them through the
    #   framework's own printer rather than the logger, so it cannot be filtered by
    #   level; the two Hibernate log floors below are what a reader raises instead.
    show-sql: false

    properties:
      hibernate:
        # Assumptions: the second half of the schema resolution above. Hibernate
        #   reads this key rather than Flyway's, so both are set for one fact, and
        #   an unqualified entity resolves to `ledger` rather than to whatever else
        #   the connection can see.
        default_schema: ledger

  security:
    oauth2:
      resourceserver:
        jwt:
          # Assumptions: the reserved `.invalid` top-level domain is guaranteed
          #   never to resolve, so this value names no reachable provider and is
          #   not an endpoint in any operational sense -- which is what lets the key
          #   carry a value at all without putting a real issuer in this
          #   repository. It is the form the auth, card and reference test profiles
          #   already use, so four modules state the same contract the same way.
          # Alternatives Considered: leaving the value EMPTY. Rejected because
          #   config/SecurityConfig.java declares its own JwtDecoder bean, built
          #   unconditionally and taking this key through @Value: an empty value
          #   therefore builds a decoder whose issuer validator expects an empty
          #   `iss` claim, which rejects every real token while appearing
          #   configured. A fallback-free @Value additionally raises on an
          #   unresolved placeholder, so the key cannot simply be omitted.
          # Trade-offs: building the decoder DOES perform a network call --
          #   NimbusJwtDecoder.withIssuerLocation defers nothing, and build()
          #   issues GET <issuer>/.well-known/openid-configuration -- so a test that
          #   loads a Spring context must register a reachable stub issuer through
          #   dynamic properties. Controller tests use spring-security-test mock
          #   JWTs and common-lib's JwtRoleConverter maps cognito:groups to
          #   authorities without decoding anything, so none of them needs the
          #   decoder to answer. This keeps the production filter-chain shape while
          #   proving no signature validation, which belongs to an environment test
          #   with a real identity provider.
          issuer-uri: https://issuer.invalid/carddemo-transaction-test

logging:
  level:
    # Trade-offs: the run stays quiet. A failing assertion reports its own cause
    #   and a Flyway abort names the object it could not resolve, so raising the
    #   framework's startup narration buys nothing a failure does not already say,
    #   while a container-backed suite would emit it once per context. This
    #   project's own package stays at INFO so that a transcribed business rule can
    #   still report itself.
    root: WARN
    com.carddemo: INFO

    # Trade-offs: these two are floors rather than raises, set even though the
    #   inherited root level would already suppress them. They are the keys a
    #   reader turns up to DEBUG and TRACE when a repository assertion disagrees
    #   with the engine, and naming them at their quiet value is what makes them
    #   discoverable at the moment they are wanted. Bind-parameter logging in
    #   particular must never be raised in a deployed profile, because these rows
    #   carry primary account numbers.
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

carddemo:
  security:
    jwt:
      # Assumptions: these three are read by config/SecurityConfig.java rather
      #   than by framework auto-configuration, and its @Value declarations carry
      #   no fallback, so a context-loading test needs all three present. The
      #   client identifier is a per-deployment value and the fixed literal here
      #   names no real app client; the token-use and scope values are the same
      #   ones the base states, restated so the three arrive together rather than
      #   two from here and one from a document a reader has to find.
      expected-client-id: transaction-test-app-client
      expected-token-use: access
      required-scope: aws.cognito.signin.user.admin
