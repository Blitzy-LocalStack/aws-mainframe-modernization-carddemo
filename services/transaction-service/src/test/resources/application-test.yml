# =============================================================================
# services/transaction-service/src/test/resources/application-test.yml
# -----------------------------------------------------------------------------
# Purpose:
#   The Spring `test` profile for transaction-service, the LEDGER bounded
#   context of the CardDemo mainframe-to-microservices migration. It is an
#   OVERLAY on src/main/resources/application.yml [present], active whenever
#   the test classpath resolves profile `test`, and it changes only what a
#   build host must change: where the database connection comes from, on what
#   terms that connection is opened, how the `ledger` schema is reached on a
#   database that starts empty, and how loudly the run reports itself. Every
#   other value is inherited from the base document rather than restated here.
#
#   What consumes this file. Two shapes of test read it. Both are stated here
#   as forward contracts, because src/test/java is [planned] and holds a single
#   package-info today, so no class named below exists yet to be inspected:
#     - every *RepositoryIT, which Failsafe runs against a real PostgreSQL
#       container. These are the only tests that open a connection, apply
#       db/migration/V1__ledger.sql [present] and query the four `ledger`
#       tables;
#     - every context-loading *Test, which Surefire runs. These bind no
#       listener and reach no database.
#   Records those tests read live in the sibling fixtures/ folder [planned].
#
#   The four tables this context owns are ledger.transactions,
#   ledger.daily_transactions, ledger.transaction_rejects and
#   ledger.transaction_category_balances. Their columns derive from
#   app/cpy/CVTRA05Y.cpy, the 350-byte TRAN-RECORD layout whose field widths
#   16+2+4+10+100+11+9+50+50+10+16+26+26+20 sum to exactly the 350 its line 2
#   declares. That tree is REFERENCE-ONLY: this file cites it by path and line
#   and never modifies it.
#
#   NO CONNECTION STRING, HOST, PORT, USER NAME OR CREDENTIAL APPEARS ANYWHERE
#   IN THIS FILE, and neither does an issuer or any other endpoint value. The
#   container supplies the connection coordinates at run time; see decision 1.
#
#   Documentation convention: docs/CODE_DOCUMENTATION_STANDARD.md [present].
#
# WHY (non-obvious design decisions):
#
#   - Assumptions: YAML has no docstring construct, so the project
#     Explainability rule reaches this file through its "module entry point"
#     wording at rule line 15 and the allowance on standard docstring formats
#     at line 22. A profile is the entry point of the test runtime, so the
#     language-appropriate analogue is this ruled header block plus a labelled
#     rationale line sitting directly above each key it explains. That is also
#     the form docs/CODE_DOCUMENTATION_STANDARD.md prescribes for a
#     configuration key, and the reason no statement in this file carries a
#     narrating comment: the same standard forbids a statement-level WHAT
#     comment in a .yml file outright, and the rule's own first forbidden
#     pattern is a comment that restates the code beside it.
#   - Assumptions: the Explainability gate over this file is REVIEW, not a
#     linter. config/checkstyle/checkstyle.xml [present] declares
#     <module name="Checker"> at line 158 and narrows it with
#     fileExtensions="java" at line 185, and the aggregator binds that ruleset
#     to the Maven validate phase under execution id
#     checkstyle-documentation-gate. A .yml file is therefore outside the
#     Checker's reach entirely, so nothing mechanical inspects the prose below.
#     Authoring discipline and human review are the only protection, which is
#     exactly where the rule leaves it at line 43 and where tests/README.md
#     section 12 leaves the equivalent house obligation at its line 549.
#   - Alternatives Considered: an in-memory database, and H2 by name, in place
#     of a container. Rejected. Detail at spring.datasource.hikari.
#   - Assumptions: a database container starts empty, and the migration this
#     module owns creates no schema of its own. Detail at
#     spring.flyway.create-schemas.
#   - Assumptions: schema resolution cannot come from the connection string in
#     this profile, and the search-path pin the base relies on fails silently
#     rather than loudly on an empty database. Detail at
#     spring.flyway.default-schema and
#     spring.jpa.properties.hibernate.default_schema.
#   - Assumptions: Flyway needs a second artifact beyond its engine, and this
#     profile is the one place in the whole build where that requirement is
#     actually exercised. Detail at spring.flyway.enabled.
#   - Refactoring Rationale: Hibernate asserts the migrated schema here instead
#     of ignoring it, which is a deliberate divergence from the base profile.
#     Detail at spring.jpa.hibernate.ddl-auto.
#   - Trade-offs: a lazy association touched outside a transaction fails in the
#     test rather than resolving quietly. Detail at spring.jpa.open-in-view.
#   - Trade-offs: statement and bind-parameter logging stay floored off,
#     because a bound parameter in this context can be a sixteen-digit card
#     number. Detail at spring.jpa.show-sql and at `logging`.
#   - Assumptions: transport security is loosened for a container database and
#     for nothing else. Detail at
#     spring.datasource.hikari.data-source-properties.
#   - Assumptions: the resource-server issuer is emptied rather than left to
#     the base placeholder, because the condition that reads it resolves
#     placeholders strictly and would abort context startup. Detail at
#     spring.security.oauth2.resourceserver.jwt.issuer-uri.
#   - Assumptions: several keys are deliberately ABSENT, and each absence is a
#     decision with a reasonable alternative rather than an oversight. They are
#     recorded together in the block immediately below, because an absent key
#     has no line to sit beside.
# =============================================================================

# -----------------------------------------------------------------------------
# DELIBERATE ABSENCES. Each entry is a key this profile could plausibly carry
# and does not. Recorded so that a reader does not restore one as an apparent
# omission, and so that the two absences which are themselves load-bearing
# decisions - the pinned clock and the paging contract - are documented at the
# only place available to them.
#
# 1. The datasource URL, user name and credential keys, and any host, port or
#    connection string.
#    Alternatives Considered: writing them here, which is what a profile that
#      has not thought about it does. Rejected because the container's port is
#      assigned at run time, so a written connection string either addresses
#      nothing or addresses whichever database happens to be listening on a
#      developer's machine - and the second failure mode is worse than the
#      first, because it passes.
#    Assumptions: the container supplies those coordinates to the test context
#      instead. Two routes do that and both leave this file unchanged: a
#      Testcontainers @ServiceConnection on the PostgreSQLContainer field of a
#      *RepositoryIT, which needs the spring-boot-testcontainers artifact that
#      services/auth-service/pom.xml declares at its line 343 and this module's
#      POM does not yet carry; or @DynamicPropertySource, which needs nothing
#      beyond the Testcontainers 2.0.5 modules already on this module's test
#      classpath. Either way the coordinates arrive as a bean or a dynamic
#      property and never as text in this document, which is why no credential
#      appears here to be committed.
#    Trade-offs: the base document's three placeholders stay unresolved during
#      a test run. That is safe and it is not an accident:
#      configuration-property binding leaves an unresolvable placeholder as
#      literal text rather than raising, verified against the pinned Spring
#      Boot 4.1.0 binder, and the container-supplied connection details take
#      precedence over the bound values in any case. The contrast with the
#      issuer key further down is the whole reason that one key needs different
#      treatment.
#
# 2. Every `server.*` key, including the listener port and the transport
#    settings of the HTTPS listener the base profile enables.
#    Assumptions: neither shape of test in this module binds a listener. A
#      context-loading *Test drives MockMvc, which starts no web server, and a
#      *RepositoryIT reaches only the database. The base pins its port to 8080
#      because this module's Dockerfile EXPOSEs that port and the internal load
#      balancer's target group forwards to it, so the value is a deployment
#      contract that a test has no standing to renegotiate. The inherited
#      listener block is therefore inert here rather than misconfigured, and
#      that is why its certificate placeholders never resolve and never matter.
#
# 3. Any Spring Cloud AWS key, any queue or messaging key, and any key naming a
#    local AWS emulator.
#    Assumptions: this module declares neither io.awspring.cloud nor
#      software.amazon.awssdk, verified by resolving its test classpath. This
#      bounded context owns no queue, so there is no messaging configuration
#      class here at all. Naming a key from a library that is absent binds
#      nothing and would read as a missing dependency, inviting the next reader
#      to add the library rather than remove the key. Those concerns belong to
#      authorization-service and batch-service.
#
# 4. Any Batch key, and any job-repository setting.
#    Assumptions: this module declares no spring-boot-starter-batch and owns no
#      job repository. The nightly jobs that write ledger.transactions run in
#      batch-service, under the narrowly scoped cross-schema grant that
#      data-migration/sql/V0__schemas_and_roles.sql [present] issues to
#      carddemo_batch at its lines 644 and 666. A batch starter enabled here
#      would create job-repository tables in a schema that does not own them.
#
# 5. Any in-memory database configuration.
#    Alternatives Considered: covered as a decision at
#      spring.datasource.hikari, because the reason is specific to what the
#      repository suite exists to prove rather than a general preference.
#
# 6. Flyway's destructive clean operation and the key that governs it.
#    Assumptions: the base pins that control so that no profile can enable a
#      drop against a ledger. A container database is discarded whole when the
#      run ends, so there is nothing for a test-side setting to protect and no
#      artifact for it to produce.
#
# 7. Any key naming the size of a page, a page number, or an offset-and-limit
#    query.
#    Assumptions: paging in this context is KEYSET paging over the same key
#      columns the CICS browse walked, carried by the PageResponse envelope
#      from common-lib - items, firstKey, lastKey and a next-page indicator
#      discovered by fetching one row more than a page holds, which is exactly
#      how the COBOL discovers it.
#    Refactoring Rationale: an offset-and-limit query is rejected outright
#      because under concurrent inserts it skips and repeats rows, changing
#      observable behaviour that browse-by-key does not. Exposing the size of a
#      page as a tunable property would additionally let a test drift from the
#      screen contract the baseline establishes, so that number lives in code
#      beside the query and its one-extra-row probe, where the two can be read
#      together.
#
# 8. Any clock or current-time property.
#    Assumptions: the twenty-six character timestamp is a copybook contract
#      rather than a formatting preference. app/cpy/CSDAT01Y.cpy declares
#      05 WS-TIMESTAMP at line 42 and its thirteen members across lines 43 to
#      55 - 9(04), '-', 9(02), '-', 9(02), ' ', 9(02), ':', 9(02), ':', 9(02),
#      '.', 9(06) - sum to exactly 26, giving 'YYYY-MM-DD HH:MM:SS.mmmmmm' with
#      the space at character 11 and the point at character 20.
#      app/cbl/COBIL00C.cbl corroborates the geometry from a program rather
#      than a layout: line 264 moves a ten-character date to
#      WS-TIMESTAMP(01:10) and line 265 moves an eight-character time to
#      WS-TIMESTAMP(12:08), leaving characters 11 and 20 to the FILLERs, while
#      line 266 moves ZEROS to WS-TIMESTAMP-TM-MS6 so bill payment emits
#      '.000000' and orig_ts equals proc_ts. Determinism for that value is
#      supplied as a BEAN and not as a property, which is why this file sets
#      nothing for it: common-lib's TimestampFormatter takes the clock as a
#      parameter at its line 418 and throws rather than reading an ambient one,
#      recording at its lines 401 to 406 that a clock pinned to a single
#      instant yields one predictable rendering whereas a method reading the
#      ambient clock could not be asserted against at all. A test therefore
#      supplies a clock pinned to one instant through the Clock.fixed factory,
#      as common-lib's own TimestampFormatterTest already does.
#    Alternatives Considered: reading the ambient clock and normalising the
#      value before comparison. Rejected for this module. Normalisation is the
#      parity oracle's technique for a batch program whose output is compared
#      against a committed file, and tests/fixtures/README.md section 6.3
#      establishes its precise asymmetry: only the runtime processing timestamp
#      is masked, while an input originating timestamp is load-bearing and must
#      be a literal. No such committed comparison file covers this module at
#      all - the four programs it migrates, COTRN00C, COTRN01C, COTRN02C and
#      COBIL00C, are online CICS programs, and tests/README.md section 1.1
#      records that those cannot be run end to end without a CICS runtime - so
#      injecting determinism at the source is the only mechanism available. It
#      is also the house direction: tests/README.md section 11, whose heading
#      is at line 475, states at lines 488 to 489 that business dates are
#      injected rather than read from the wall clock so that reruns produce
#      identical output.
#
# 9. The project's own JWT-validation namespace, and the base document's
#    Jackson, springdoc and management keys.
#    Assumptions: the JWT-validation keys are read by a configuration class
#      this module has not yet authored, so the binding style that decides
#      whether an unresolved placeholder is tolerated is not yet observable
#      from the code; a context-loading test that installs the filter chain
#      arranges those values for itself. The remaining three groups settle
#      encoding, the published contract and the Actuator surface, and a test
#      changes none of them, so restating them would add drift surface and
#      answer no question.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# PROFILE INVARIANCE, stated once because the sameness is deliberate rather
# than accidental. A profile may differ from the base in sizing, pool limits,
# log level, retention and diagnostic verbosity, and in nothing else. This is a
# fourth profile beside dev and prod and it holds that line: schema ownership
# is `ledger`, identity is a JWT resource server, queue usage is none, and the
# datastore is PostgreSQL - all four identical to the base document.
#
# Exactly three settings below depart from the base rather than narrowing it,
# and each carries its own labelled rationale at the key: the schema-creation
# allowance, the Hibernate schema assertion, and the transport-security mode.
# The first two exist because a container database starts empty where a
# deployed one does not; the third because a container serves no TLS.
# -----------------------------------------------------------------------------

spring:

  datasource:

    # Every datasource setting this profile touches sits under `hikari`. The
    # URL, user name and credential keys are absent by deliberate absence 1.
    #
    # Alternatives Considered: an in-memory database, and H2 by name, so the
    #   repository suite could run with no container at all. Rejected on a
    #   specific mechanism rather than on a preference for realism.
    #   db/migration/V1__ledger.sql creates two NON-UNIQUE indexes over
    #   ledger.transactions - idx_transactions_proc_ts and
    #   idx_transactions_card_num - and the first is the PostgreSQL analogue of
    #   the batch alternate index the baseline defines at app/jcl/TRANIDX.jcl,
    #   whose line 27 declares KEYS(26 304), line 28 NONUNIQUEKEY, line 29
    #   UPGRADE and line 30 RECORDSIZE(350,350). That zero-based offset 304 is
    #   TRAN-PROC-TS, corroborated from an artifact sharing no code with the
    #   copybooks: app/jcl/TRANREPT.jcl line 42 declares the sort symbol
    #   TRAN-PROC-DT,305,10,CH, whose one-based 305 is the same position. The
    #   keyset access paths the *RepositoryIT suite exists to prove run over
    #   exactly those columns, and an in-memory substitute would either refuse
    #   the DDL or accept the access patterns while planning them differently,
    #   so the suite would report a guarantee the deployed engine was never
    #   asked to make.
    # Trade-offs: one container start per integration run, and a build host
    #   able to run one at all. Accepted in exchange for deleting every
    #   hand-written connection property and the drift they invite. The parity
    #   suite under tests/** makes the same trade in the same direction,
    #   loading flat fixtures into real indexed files before a program runs
    #   instead of asserting against an in-process stand-in.
    hikari:

      data-source-properties:
        # Assumptions: the base profile requires verify-full at its line 348,
        #   paired with the server-side force-SSL cluster parameter, because
        #   the rows behind that pool are posted money movement. A PostgreSQL
        #   container serves no TLS at all, so inheriting that value makes
        #   every connection in this profile fail before an assertion runs.
        #   Measured against the pinned driver 42.7.13 and a PostgreSQL 17
        #   container rather than assumed: verify-full is refused with "The
        #   server does not support SSL." while `disable` connects and the
        #   search-path statement below then executes.
        # Trade-offs: this is the loosest of the six modes the driver offers,
        #   and it is scoped to a database that exists only for the duration of
        #   a build and holds only records this suite itself wrote. The base's
        #   trust-anchor entry survives beside this one, because map binding
        #   merges these entries by key rather than replacing the group; the
        #   driver never reads it while encryption is off. Nothing in this file
        #   reaches a deployed cluster, so no deployed connection is loosened.
        sslmode: disable

      # Assumptions: this statement is INHERITED from the base at its line 291
      #   and restated because its behaviour on an empty database differs in a
      #   way a reader must be able to see from this file. PostgreSQL accepts a
      #   search path naming a schema that does not exist: measured on
      #   PostgreSQL 17, setting the path to an absent schema SUCCEEDS and
      #   current_schema() then reports nothing. On a container database this
      #   statement therefore cannot be relied on to reach `ledger`, and cannot
      #   report that it failed to. It is kept for the affirmative reason
      #   instead: once Flyway has created the schema, pinning the path to
      #   `ledger` alone is what makes a stray unqualified reference to another
      #   context's table fail loudly in a test rather than resolve against
      #   whatever else the connection can see.
      connection-init-sql: SET search_path TO ledger

      # Trade-offs: four connections rather than the base document's ten. The
      #   base is sized against one Aurora cluster shared with seven peer
      #   services and the batch role; the constraint here is a single
      #   container holding the engine's default connection limit, possibly
      #   shared with a parallel Failsafe fork running its own pool. Four
      #   covers a suite whose repository tests run one at a time and leaves
      #   that fork room. An idle floor of zero holds no connection between
      #   test classes, which a deployed profile cannot do because it would pay
      #   a handshake on the first request after an idle period.
      maximum-pool-size: 4
      minimum-idle: 0

  flyway:

    # Assumptions: the Flyway engine alone is not enough, and the way it fails
    #   is why the requirement is worth naming HERE of all places. Flyway 10
    #   moved database-specific support out of the core artifact into
    #   per-database modules, and that split persists at the 13.0.0 the parent
    #   manages, so this module declares flyway-database-postgresql beside the
    #   starter that brings flyway-core. Omitting the companion breaks nothing
    #   at build time: it aborts when a connection is first resolved to a
    #   database type, because nothing on the classpath claims a PostgreSQL
    #   URL. This profile is the ONE place in the entire build where the
    #   migration actually runs against a database, so that abort surfaces here
    #   as an integration-test failure and nowhere as a compile error, which is
    #   precisely why a reader debugging it needs the pointer at hand. Both
    #   artifacts were confirmed present at 13.0.0 on this module's resolved
    #   test classpath.
    enabled: true

    # Assumptions: restating the base location proves a negative that matters.
    #   This module owns exactly one migration, V1__ledger.sql; there is no
    #   second one here, and only reference-service carries a seed migration.
    #   The eight schemas, the per-service roles and the whole cross-schema
    #   privilege graph live in data-migration/sql/V0__schemas_and_roles.sql
    #   [present], whose lines 454 to 539 create those schemas including
    #   `ledger` at line 463. That file is NOT on this classpath and cannot be
    #   reached from this location, so no test run can apply another context's
    #   bootstrap into `ledger`, and nothing but this module's own migration
    #   runs when the suite starts.
    locations: classpath:db/migration

    # Assumptions: the schema history table has to sit in the same schema as
    #   the objects it describes, because each service connects under a role
    #   scoped to its own schema and could not otherwise read its own migration
    #   state. Naming the schema explicitly also means the migration does not
    #   lean on the pooled connection's search path, so the two mechanisms
    #   agree independently instead of one depending quietly on the other.
    # Trade-offs: deliberate redundancy with the base rather than silent
    #   inheritance. A reader of this file alone must be able to tell which
    #   schema a test run migrates, and an edit to the base must not be able to
    #   change what a test proves invisibly. The compromise accepted is two
    #   places naming the same schema.
    schemas: ledger

    # Assumptions: under a container-supplied connection the JDBC URL is
    #   GENERATED by the container, so no schema parameter can ride on it. The
    #   base could not use that route either and records why at its lines 285
    #   to 290, having rejected a currentSchema URL parameter because the URL
    #   arrives from the environment and an operator editing it would silently
    #   drop the pin. Both profiles therefore resolve the schema from
    #   properties, for different reasons, and this is the profile in which the
    #   search-path pin above cannot be trusted to have worked - see the
    #   measured behaviour recorded at that key.
    # Trade-offs: two extra properties, this one and its Hibernate counterpart
    #   further down, in exchange for removing a failure mode in which objects
    #   resolve against the default schema and the suite then passes or fails
    #   for reasons unrelated to the code under test. Of the two outcomes the
    #   silent one is the reason the properties are worth their redundancy.
    default-schema: ledger

    # Assumptions: a container database starts EMPTY, and V1__ledger.sql
    #   qualifies every object as ledger.<table> while issuing no CREATE
    #   SCHEMA, no CREATE ROLE, no GRANT and no REVOKE - verified by reading
    #   its executable statements. Nothing else on this classpath creates the
    #   schema, so without this allowance every *RepositoryIT fails on a
    #   missing schema before it can assert anything. The base sets the
    #   opposite value at its line 426 and delegates this case explicitly,
    #   recording at its lines 421 to 425 that a bare database "including one
    #   started by Testcontainers for a repository integration test" needs its
    #   schema created first and that the test profile supplies that for
    #   itself. This key is that supply.
    # Trade-offs: two components can now create the same schema object - this
    #   allowance and the bootstrap DDL. Accepted because the alternative is
    #   importing a deployment precondition into a service that has no business
    #   holding one, and because a visible act in a reviewable test resource is
    #   what the base asked for in preference to a production default that
    #   conceals the precondition.
    create-schemas: true

    # Assumptions: baselining is the remedy a reader reaches for when Flyway
    #   meets a populated schema, and it is the wrong one here. It tells Flyway
    #   to treat whatever objects it finds as the baseline version when no
    #   history table is present, which would mark `ledger` as already migrated
    #   and skip V1__ledger.sql outright. Every table the suite queries would
    #   then be absent while the migration reported a clean start, leaving the
    #   schema assertion below as the only thing able to catch it.
    baseline-on-migrate: false

  jpa:

    hibernate:
      # Refactoring Rationale: the base sets `none` and rejected `validate` at
      #   its lines 447 to 449, on the ground that a mapping mismatch would
      #   fail startup even where Flyway was about to resolve it on a following
      #   migration, turning an ordering difference into an outage. That
      #   reasoning is about a rolling deployment and has no counterpart in a
      #   test: the migration and the entities ship in one build, and Flyway
      #   runs to completion before the context finishes starting, so there is
      #   no ordering window to be caught in. `validate` therefore goes FURTHER
      #   than `none` rather than merely differing from it - it asserts that
      #   Flyway's output matches the entity mapping. Generating the schema
      #   instead would substitute Hibernate's inference for the migration's
      #   actual output, so a defective V1__ledger.sql would still yield a
      #   green suite; and that inference cannot express what the migration
      #   expresses. Each of the following is derived from a copybook and is
      #   asserted only because the migration, not Hibernate, declares it:
      #   transaction_id and card_num as CHAR(16), from TRAN-ID at
      #   app/cpy/CVTRA05Y.cpy line 5 and TRAN-CARD-NUM at line 15; amount as
      #   NUMERIC(11,2), from TRAN-AMT PIC S9(09)V99 at line 10, exact to the
      #   cent; orig_ts and proc_ts as TIMESTAMP(6), from the two PIC X(26)
      #   fields at lines 16 and 17, with transactions.proc_ts NOT NULL while
      #   daily_transactions.proc_ts is NULLABLE - the same asymmetry the
      #   parity fixtures rely on, since an input record carries a blank
      #   processing timestamp; transaction_rejects.raw_record left
      #   UNDECOMPOSED as CHAR(350) beside reason_code SMALLINT and reason_desc
      #   VARCHAR(76), preserving the 430-byte reject the baseline composes
      #   from REJECT-TRAN-DATA PIC X(350) and VALIDATION-TRAILER PIC X(80) at
      #   app/cbl/CBTRN02C.cbl lines 177 and 178, itself split into 9(04) and
      #   X(76) at lines 181 and 182 and declared LRECL=430 at
      #   app/jcl/POSTTRAN.jcl line 36; and the composite primary key on
      #   transaction_category_balances mirroring the TRAN-CAT-KEY group whose
      #   three members at app/cpy/CVTRA01Y.cpy lines 5 to 8 measure 11+2+4.
      # Trade-offs: any drift between an entity and the migration now aborts
      #   context startup instead of surfacing further along as a query failure
      #   whose real cause is a column. Accepted: an abort names the mismatched
      #   object, and a suite that refuses to start is a sharper signal than
      #   one that runs against a schema nobody declared. `create`,
      #   `create-drop` and `update` are excluded by the same reasoning.
      ddl-auto: validate

    # Assumptions: a repository test must not lean on a request-scoped
    #   persistence session, because there is no request in one. Left at its
    #   permissive default, a lazy association touched outside a transaction
    #   would resolve quietly here and then fail where no view-scoped session
    #   exists. The base already sets this value; restating it means an edit
    #   there cannot change what a test proves without also deleting a
    #   documented decision here.
    # Trade-offs: lazy access outside a transaction now fails loudly in the
    #   test. That failure is the signal this setting exists to produce, and
    #   what is given up is that a mapper written to depend on the session has
    #   to be changed rather than accommodated.
    open-in-view: false

    # Trade-offs: statements are not echoed. This key writes them through the
    #   provider straight to standard output, so no logger level filters it and
    #   the floors under `logging` below do not reach it, which makes this the
    #   only place the decision can be made at all. What is given up is the
    #   readiest way to read the generated SQL for the keyset paths; the reason
    #   to give it up is recorded under `logging`.
    show-sql: false

    properties:
      hibernate:
        # Assumptions: this is the second half of the schema resolution
        #   described at spring.flyway.default-schema, and it is the half the
        #   base document does not carry at all - it has no such key, because a
        #   deployed connection is pinned by the pooled search-path statement
        #   whose value can be trusted there. Here Hibernate has to be told
        #   directly: it renders unqualified entity table names, so if the
        #   search path silently failed to reach `ledger` those names resolve
        #   against the default schema instead, which is a missing-relation
        #   error at best and a query against the wrong schema at worst.
        default_schema: ledger

  security:
    oauth2:
      resourceserver:
        jwt:
          # Assumptions: the value is EMPTIED rather than left to the base
          #   placeholder, and the mechanism is the difference between a suite
          #   that starts and one that cannot. The base resolves this key from
          #   an environment variable with no fallback, which no build host
          #   supplies. The two ways a value is read behave differently on an
          #   unresolvable placeholder, both verified against the pinned Spring
          #   Boot 4.1.0 rather than assumed: configuration-property binding
          #   leaves the placeholder as literal text and does not raise, which
          #   is why the datasource keys in deliberate absence 1 can safely
          #   stay unset, whereas Environment.getProperty raises on it - and
          #   the condition gating the resource server's decoder reads THIS key
          #   through exactly that call before testing it for text. Left as the
          #   inherited placeholder, condition evaluation aborts and every
          #   context-loading test in this module fails before an assertion
          #   runs. Emptied, the condition does not match, no decoder is
          #   auto-configured, and a test that installs the filter chain
          #   supplies its own. That no issuer or other endpoint value belongs
          #   in this repository is the second, independent reason the key is
          #   emptied rather than filled.
          issuer-uri: ""

logging:
  level:
    # Trade-offs: the run stays quiet. A failing assertion reports its own
    #   cause and a Flyway abort names the object it could not resolve, so
    #   raising the framework's startup narration buys nothing a failure does
    #   not already say, while a container-backed suite would emit that
    #   narration once per context. This project's own package stays at INFO so
    #   that a transcribed business rule can still report itself.
    root: WARN
    com.carddemo: INFO

    # Trade-offs: these two are floors, and they are set even though their
    #   parent already sits at WARN, because the more specific level wins and a
    #   profile that raises org.hibernate wholesale during an investigation
    #   must still not turn them on. A parameter bound into a statement in this
    #   context is a sixteen-digit card number: every response here masks that
    #   number to its last four digits, and a bind-parameter dump would hand
    #   over at the log boundary precisely the value the mask withholds, into a
    #   build log that outlives the container that produced it. The volume such
    #   a dump adds to a suite starting a database per class is the smaller of
    #   the two reasons.
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
