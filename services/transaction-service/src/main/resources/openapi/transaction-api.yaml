# =============================================================================
# services/transaction-service/src/main/resources/openapi/transaction-api.yaml
# -----------------------------------------------------------------------------
# Purpose:
#   The hand-authored OpenAPI 3.1 contract of record for transaction-service,
#   the LEDGER bounded context of the CardDemo mainframe-to-microservices
#   migration. Everything that touches this context is written against it rather
#   than against a reading of the baseline. Every consumer this document was
#   written for now exists: the request and response records under
#   src/main/java/com/carddemo/transaction/dto, whose member names, widths, value
#   domains and paging vocabulary this document and
#   src/test/java/com/carddemo/transaction/dto/TransactionApiContractTest.java hold
#   to each other; the two controllers under
#   src/main/java/com/carddemo/transaction/api that serve all four operations
#   below, held to the routes and status codes declared here by
#   src/test/java/com/carddemo/transaction/api/TransactionApiRoutingContractTest.java
#   and asserted body-by-body by TransactionControllerTest and
#   BillPaymentControllerTest; the six service types and two mappers behind them;
#   and the browser SPA's transaction client at ui/src/api/transactions.ts, which
#   ui/src/api/contracts.test.ts binds back to this file so a drift fails the SPA
#   build.
#
#   Refactoring Rationale: this paragraph previously recorded that every
#   controller, service and mapper of this module was unauthored and that no
#   operation below was served. That was accurate when written and is now false of
#   all of them, so it is replaced rather than annotated. Correcting it matters
#   beyond tidiness: a reader who believed no operation was served would have read
#   a mismatch between this document and a handler as a documentation defect, when
#   it is now a live contract breach that TransactionApiRoutingContractTest fails
#   the build over. What is genuinely NOT proven here is runtime behaviour against
#   a provisioned AWS environment, which no test in this module claims.
#
#   It is served as a static classpath resource:
#   application.yml adds
#   `classpath:/openapi/` to spring.web.resources.static-locations at L601 and
#   pins springdoc.swagger-ui.url to /transaction-api.yaml at L621, so this
#   file -- not an annotation-scanned document -- is what the browser view
#   presents as authoritative.
#
#   This contract publishes exactly four operation groups, one per CICS
#   transaction this service replaces. The names are taken verbatim from the
#   transaction inventory table in the root README.md:
#     CT00  Transaction List  COTRN00C  README.md L298  app/csd/CARDDEMO.CSD L419 to L420
#     CT01  Transaction View  COTRN01C  README.md L299  app/csd/CARDDEMO.CSD L429 to L430
#     CT02  Transaction Add   COTRN02C  README.md L300  app/csd/CARDDEMO.CSD L439 to L440
#     CB00  Bill Payment      COBIL00C  README.md L302  app/csd/CARDDEMO.CSD L337 to L338
#
#   The COBOL under app/** is the behavioural specification for every shape
#   below. It is read and cited by path and line, and it is never modified.
#   Where the migrated behaviour differs from the baseline, the divergence is
#   stated here rather than introduced silently.
#
#   Field widths, types and nullability derive from app/cpy/CVTRA05Y.cpy, the
#   350-byte TRAN-RECORD layout, which is the normative wire and storage
#   contract for this context. app/cpy/CVTRA06Y.cpy declares the same fourteen
#   fields at the same widths under a DALYTRAN- prefix, and app/cpy/CVTRA01Y.cpy
#   declares the 50-byte transaction-category-balance record.
#
#   NO SECRET, CREDENTIAL, HOST NAME, CONNECTION STRING OR RESOURCE IDENTIFIER
#   APPEARS ANYWHERE IN THIS FILE. The single server entry is a relative path
#   supplied through a server variable, every example value is drawn from the
#   committed app/data/ASCII seed data, and no dependency version of any kind
#   is emitted -- versions live in the POMs.
#
#   Verification caveat, stated because overclaiming it would be worse than
#   omitting it: all four programs this contract migrates are online CO*
#   programs. tests/README.md records at L83 to L85 that online CO* CICS
#   programs cannot run end to end without a CICS runtime, which the runner
#   does not have, and that only their extractable field-validation logic is
#   unit tested. There is therefore NO golden-master oracle for any of these
#   four operations, which this contract carries on three paths -- the
#   collection path serves both the list and the create. Parity rests on
#   transcription fidelity against the cited
#   source lines, and every user-visible string below is reproduced
#   character for character from the line it is attributed to.
#
#   Documentation convention: docs/CODE_DOCUMENTATION_STANDARD.md. That
#   standard forbids a statement-level WHAT: comment in a .yaml file at L841
#   and places purpose in a file-header block instead, so purpose is stated
#   here once and every inline comment below carries a canonical rationale
#   label and nothing else, in the form its L779 template and L785 to L787
#   note prescribe: one labelled line directly above the key it explains.
# -----------------------------------------------------------------------------
# WHY (non-obvious design decisions):
#
#   Alternatives Considered: paging by an offset, a page number or a row count
#     is rejected outright, and no such parameter, property or prose appears
#     anywhere below. Under concurrent insertion the number of rows preceding a
#     position changes beneath a reader between one request and the next, so a
#     page positioned by counting omits some rows and presents others twice; a
#     key already read keeps its place in the ordering whatever is inserted
#     around it. The concurrency is attested by the baseline itself, not
#     assumed: app/cbl/COBIL00C.cbl L212 to L217 reads the highest transaction
#     key and increments it across six statements -- MOVE HIGH-VALUES at L212,
#     STARTBR at L213, READPREV at L214, ENDBR at L215, MOVE at L216, ADD 1 at
#     L217 -- with nothing holding a lock across them, and app/cbl/COTRN02C.cbl
#     repeats the idiom at L444 and L449. Two concurrent callers can therefore
#     read the same maximum and insert either side of a browse in flight.
#     app/csd/CARDDEMO.CSD reinforces it at L78, where FILE(TRANSACT) is
#     defined READINTEG(UNCOMMITTED).
#   Assumptions: the baseline browse state is ALREADY a cursor over keys, so
#     the substitution is one-to-one rather than an approximation. The proof is
#     inside this very service: app/cbl/COTRN00C.cbl declares
#     CDEMO-CT00-TRNID-FIRST at L63, CDEMO-CT00-TRNID-LAST at L64 and
#     CDEMO-CT00-NEXT-PAGE-FLG at L66, and its two paging paths seek off those
#     keys at L236 to L252 and L258 to L275. Nothing in that block counts rows
#     already consumed. The general precedent is the card list at
#     app/cbl/COCRDLIC.cbl L230 to L244.
#   Refactoring Rationale: no session cookie, no server-side cursor handle and
#     no continuation header appears below. All four transactions are defined
#     TWASIZE(0) -- app/csd/CARDDEMO.CSD L337 to L338, L419 to L420, L429 to
#     L430 and L439 to L440 -- so no Transaction Work Area held anything
#     between screen turns and every continuation value travelled in the
#     DFHCOMMAREA, a buffer the client echoed back. Moving those values into
#     the response body ends the dependency on a client returning a buffer
#     intact: the server reads each cursor back off the next request and
#     verifies its seal. Identity comes from validated JWT claims rather than
#     from the client-echoed CDEMO-USER-TYPE, and the CDEMO-PGM-CONTEXT
#     re-entry discriminator disappears entirely, because a stateless handler
#     that answers with a field-error array has no first-entry-versus-re-entry
#     distinction to make.
#   Alternatives Considered: transporting money as a JSON number, rejected on a
#     measurable loss rather than a preference. A JSON number carries no scale
#     and most clients parse it into an IEEE-754 binary64 value, which destroys
#     exactness at the boundary the user actually sees. Every monetary value
#     below is therefore a string, which is what
#     services/common-lib/src/main/java/com/carddemo/common/money/MoneyModule.java
#     emits at L324 through Money.toPlainString().
#   Trade-offs: no unmasked primary account number and no card verification
#     value appears in any response, under any status code. What is given up is
#     full-PAN visibility on the list and view responses, which the 3270
#     screens did show -- app/cpy-bms/COTRN01.CPY declares CARDNUMI PIC X(16)
#     at L72. It is given up because no operation in this service is the
#     administrative card-detail endpoint, so no unmasked path belongs here;
#     a caller needing the full number asks the service that owns cards.
#   Assumptions: this contract is one self-contained document. No $ref leaves
#     it, because springdoc serves this single classpath resource and the SPA
#     client is written against it as one artifact; a schema-level reference
#     into another service's contract would also make this published API
#     change whenever that one did.
# =============================================================================

openapi: 3.1.1

info:
  title: CardDemo Transaction Service API
  summary: Transaction list, view and add, and full-balance bill payment for the CardDemo ledger.
  description: >-
    The published HTTP surface of the CardDemo LEDGER bounded context. It
    replaces four CICS transactions with stateless request handling: CT00
    Transaction List (app/cbl/COTRN00C.cbl), CT01 Transaction View
    (app/cbl/COTRN01C.cbl), CT02 Transaction Add (app/cbl/COTRN02C.cbl) and
    CB00 Bill Payment (app/cbl/COBIL00C.cbl).


    Amounts are exact fixed-point decimals carried as JSON strings, never as
    JSON numbers. Transaction identifiers, card numbers and account
    identifiers are digits-only fixed-width strings, never integers, because
    the committed seed data is zero-padded and an integer type would discard
    leading digits. Primary account numbers are masked to their last four
    digits in every response, and no card verification value appears anywhere.


    Browse results are paged by sealed keyset cursor. There is no offset, page
    number or total count in this contract, and one operation only -- the
    transaction list -- is paged.


    Verification caveat: all four source programs are online CO* CICS
    programs, which tests/README.md L83 to L85 records as impossible to run
    end to end without a CICS runtime, so no golden-master oracle exists for
    these paths. Parity rests on transcription fidelity against the cited
    source lines.
  # WHY : Assumptions: this is the version of the CONTRACT, not of any dependency
  #       and not of the build. It is stated independently of the module
  #       coordinate in services/transaction-service/pom.xml because a contract
  #       and an artifact revise for different reasons: a snapshot rebuild that
  #       changes no observable shape must not appear to clients as a new API,
  #       and springdoc serves this file verbatim, so whatever is written here
  #       is what a client sees.
  version: 1.0.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0

# WHY : (1) Assumptions: the single entry is a RELATIVE root expressed through a
#       server variable, and deliberately carries no scheme and no host. The
#       browser client resolves its own origin from the VITE_API_BASE_URL build
#       variable read at ui/src/api/client.ts L19 and applied as the axios
#       baseURL at L124, so a host written here would either contradict that
#       build variable or commit a deployment endpoint to source control, which
#       the no-secrets constraint forbids. The path is a variable rather than a
#       bare "/" so that a gateway stage prefix can be substituted without
#       editing this document.
#       (2) Assumptions: this entry contributes a DEPLOYMENT ROOT only, and the
#       /api/v1 version segment is carried by every operation path below rather
#       than by this variable. The edge publishes absolute versioned route keys --
#       "ANY /api/v1/transactions" and "ANY /api/v1/transactions/{proxy+}" at
#       infra/modules/api-gateway-http/variables.tf L382 to L383 -- and forwards
#       the request path unrewritten, its only request-parameter mapping being an
#       overwrite of the x-request-id header at
#       infra/modules/api-gateway-http/main.tf L591 to L593. The load-balancer
#       rules that forwarded path must then match are absolute too:
#       infra/envs/dev/main.tf L90 and infra/envs/prod/main.tf L90 both list
#       "/api/v1/transactions", "/api/v1/transactions/*", "/api/v1/billpay" and
#       "/api/v1/billpay/*", and the comment above the first of those states that a
#       pattern without the prefix can never match a request forwarded from that
#       edge.
#       (3) Alternatives Considered: carrying the /api/v1 segment in this
#       variable's default instead of in the paths, leaving each path unversioned.
#       Rejected because the two sibling contracts in this repository publish
#       absolute versioned paths -- services/auth-service/src/main/resources/
#       openapi/auth-api.yaml L230 and services/card-service/src/main/resources/
#       openapi/card-api.yaml L225 -- so one gateway prefix could not be applied
#       uniformly across the three: it would resolve correctly here while doubling
#       the segment on the other two, and a reader comparing the three documents
#       could not tell which of two prefixing strategies any one of them assumed.
servers:
  - url: "{basePath}"
    description: >-
      The deployment root this contract is served beneath. Requests are issued
      against the origin the client is configured with, and this value contributes
      only a stage prefix in front of the absolute, already-versioned operation
      paths below.
    variables:
      basePath:
        default: "/"
        description: >-
          Stage prefix in front of every operation path. It is "/" both when the
          service is reached directly and when it is reached through the HTTP API,
          whose route keys already carry the same /api/v1 segment every path below
          spells out, and it is set to a stage or route prefix only where an edge
          adds one of its own.

# WHY : Assumptions: there are exactly four tags because there are exactly four
#       source programs, and each tag name is the operation name recorded in the
#       root README.md transaction inventory rather than a name invented here.
#       Using the inventory's own wording keeps the traceability matrix a
#       lookup rather than a translation.
tags:
  - name: Transaction List
    description: >-
      Keyset-paged browse over the ledger, migrated from CICS transaction CT00
      and app/cbl/COTRN00C.cbl. Named after the inventory row at README.md L298.
  - name: Transaction View
    description: >-
      Retrieval of one transaction by identifier, migrated from CICS transaction
      CT01 and app/cbl/COTRN01C.cbl. Named after the inventory row at
      README.md L299.
  - name: Transaction Add
    description: >-
      Creation of one transaction with a server-assigned identifier, migrated
      from CICS transaction CT02 and app/cbl/COTRN02C.cbl. Named after the
      inventory row at README.md L300.
  - name: Bill Payment
    description: >-
      Full-balance payment against an account, migrated from CICS transaction
      CB00 and app/cbl/COBIL00C.cbl. Named after the inventory row at
      README.md L302.

# WHY : Refactoring Rationale: one scheme, applied to every operation, replaces
#       the baseline's sign-on state. The reference system carried the user
#       identity and the administrator flag in the DFHCOMMAREA, storage the
#       client echoed back, so a client could in principle assert its own user
#       type; a signed claim set cannot be asserted by its bearer. No second
#       scheme is declared -- no API key and no basic authentication -- because
#       a second admitted credential form would be a second thing to get wrong
#       at the edge for no capability the first does not already provide.
security:
  - bearerAuth: []

# WHY : Refactoring Rationale: every operation below carries x-required-authority,
#       and this document was for a time the only contract in the reactor that
#       carried none. The consequence was not cosmetic. Five sibling contracts
#       publish the field and each has a test that compares the value on every
#       operation against the authority its own filter chain enforces for that
#       operation's path, so a route whose contract and chain disagree fails a
#       build. This document could not be checked that way at all, which left the
#       only statement of who may reach these operations in prose -- and prose that
#       no build reads is prose that drifts. TransactionApiRoutingContractTest
#       performs the comparison, driving the chain's own authorization manager
#       rather than restating a string, so the two statements of one rule cannot be
#       edited apart.
# WHY : Alternatives Considered: expressing the authority as a security-scheme
#       scope, by writing `security: [{bearerAuth: [carddemo-user]}]` on each
#       operation. Rejected because the specification requires the scope list to be
#       EMPTY for a scheme that is not oauth2 or openIdConnect, and bearerAuth here
#       is `type: http`, so a populated list is invalid and a validating tool would
#       either reject it or ignore it. Re-declaring the scheme as oauth2 purely to
#       gain a scope list was rejected in turn: these values are Cognito GROUP names
#       carried in a cognito:groups claim, not OAuth scopes, and publishing them as
#       scopes would state something untrue about how the token is issued.
# WHY : Assumptions: the two admitted values are exactly the two group names the
#       shared token converter recognises, ADMIN_AUTHORITY and USER_AUTHORITY in
#       services/common-lib/src/main/java/com/carddemo/common/security/JwtRoleConverter.java,
#       which are the migrated form of the two SEC-USR-TYPE values 'A' and 'U' at
#       app/cpy/CSUSR01Y.cpy:22. carddemo-user on an operation means any
#       authenticated caller of this context may reach it, because every user of
#       this system holds one of the two groups and an administrator is not denied a
#       cardholder operation; carddemo-admin would mean the administrative group is
#       required, which no operation in this context asks for -- every one of them is
#       a cardholder operation the reference reaches from the main menu.
x-authority-model:
  field: x-required-authority
  values:
    - carddemo-user
    - carddemo-admin
  enforcedBy: >-
    services/transaction-service/src/main/java/com/carddemo/transaction/config/SecurityConfig.java
  assertedBy: >-
    services/transaction-service/src/test/java/com/carddemo/transaction/api/TransactionApiRoutingContractTest.java

# WHY : Refactoring Rationale: every path below carries the /api/v1 prefix, and
#       the bill-payment collection is published at /api/v1/billpay rather than at
#       a plural resource name of this document's choosing. An earlier revision
#       published /transactions, /transactions/{transactionId} and /bill-payments
#       unversioned, which no request could ever reach on a provisioned
#       environment: the load balancer rule that forwards to this service matches
#       "/api/v1/transactions", "/api/v1/transactions/*", "/api/v1/billpay" and
#       "/api/v1/billpay/*" (infra/envs/dev/main.tf and infra/envs/prod/main.tf),
#       the module that owns those rules refuses any path pattern not beginning
#       "/api/v1/" (infra/modules/alb/variables.tf), and the edge publishes only
#       versioned route keys (infra/modules/api-gateway-http/variables.tf). An
#       unversioned path authenticates at the edge and is then answered 404 by the
#       load balancer, which reads as a broken service rather than as a path that
#       was never routed. The paths are aligned to the provisioned edge rather than
#       the edge to a name this document invented, because the /api/v1 prefix is a
#       published invariant of the whole API surface while a spelling of the
#       bill-payment collection is not.
# WHY : Assumptions: the load balancer rule was necessary and was not sufficient,
#       so the edge route table names this segment too. The authorized route keys
#       now include the bare "ANY /api/v1/billpay"
#       (infra/modules/api-gateway-http/variables.tf); without it the request would
#       have stopped one layer earlier than the case above, answered by the API's
#       own 404 with no integration attempted and no load balancer rule consulted.
#       It is a BARE key with no greedy sibling because this document publishes one
#       operation at that exact path and nothing beneath it, so a greedy key would
#       publish a subtree with nothing behind it.
paths:

  # WHY : Refactoring Rationale: every path carries the /api/v1 prefix, and an
  #       earlier revision of this document published these three operations
  #       WITHOUT it. That was not a cosmetic omission. The load balancer routes
  #       this service on the patterns "/api/v1/transactions",
  #       "/api/v1/transactions/*", "/api/v1/billpay" and "/api/v1/billpay/*"
  #       (infra/envs/dev/main.tf and infra/envs/prod/main.tf), the edge's route
  #       table admits only keys beginning "/api/v1/"
  #       (infra/modules/api-gateway-http/variables.tf validates the prefix and
  #       states why), and an unprefixed path matches neither - so a client
  #       written against the earlier revision received a 404 from the load
  #       balancer for a service that was running, with nothing to distinguish
  #       that from a genuinely missing transaction. The server entry stays a
  #       path variable defaulting to "/" so a gateway stage prefix can still be
  #       substituted in front of these paths; the version segment is part of the
  #       contract and belongs here rather than there, for the reasons recorded
  #       on that route-key variable.
  /api/v1/transactions:
    description: >-
      The ledger collection. It is browsed by sealed keyset cursor and appended
      to with a server-assigned identifier, migrated from CICS transactions CT00
      and CT02 respectively.

    get:
      tags: [Transaction List]
      operationId: listTransactions
      x-required-authority: carddemo-user
      summary: List transactions as one keyset-paged page.
      description: >-
        Returns one bounded page of transactions in ascending transaction-id
        order, migrated from app/cbl/COTRN00C.cbl.


        A page holds at most ten rows. That bound is a baseline fact rather than
        a tuning choice: app/cbl/COTRN00C.cbl fixes it five times, at L290
        (PERFORM VARYING ... UNTIL WS-IDX > 10), L297 (PERFORM UNTIL WS-IDX >= 11
        ...), L344 (the same bound on the backward path), L349 (MOVE 10 TO
        WS-IDX) and L351 (the backward walk counting down until WS-IDX <= 0).
        The bound is not a request parameter, so a caller cannot widen it.


        Paging is by key, never by position. An opening request supplies no
        parameters. A subsequent request replays one of the two cursors from the
        previous response together with the direction it belongs to: forward
        seeks keys strictly greater than the cursor in ascending order, and
        backward seeks keys strictly less than it in descending order, which is
        exactly what the baseline READPREV at app/cbl/COTRN00C.cbl L660 does.


        Whether a further page follows is settled by reading one row beyond the
        page and observing whether that row exists, never from a total count.
        The baseline does the same: after its page loop, app/cbl/COTRN00C.cbl
        performs one extra read at L308 and sets its next-page indicator true at
        L310 or false at L312.
      parameters:
        - $ref: "#/components/parameters/TransactionIdFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: >-
            One page of transactions, with the cursors and availability
            indicators needed to request the adjacent pages. An exhausted or
            empty result is this status with an empty item array, not an error.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          description: >-
            The browse failed. The aggregate message is "Unable to lookup
            transaction..." verbatim from app/cbl/COTRN00C.cbl L615, which the
            program also emits at L649 and L683 for its forward and backward paths.
            Its lower-case t is this program's form and differs from the
            capitalised form the other three programs emit.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    post:
      tags: [Transaction Add]
      operationId: addTransaction
      x-required-authority: carddemo-user
      summary: Add one transaction with a server-assigned identifier.
      description: >-
        Creates one transaction, migrated from app/cbl/COTRN02C.cbl.


        The identifier is assigned by the service and is not accepted from the
        caller. The baseline derives it by reading the highest existing key and
        incrementing it -- app/cbl/COTRN02C.cbl L444 to L449, into
        WS-TRAN-ID-N PIC 9(16) declared at L57 -- and the migrated service
        assigns it the same way from the sequence that owns the column, so a
        request carrying an identifier would be asserting a value the service
        alone is entitled to choose.


        At least one of accountId and cardNumber is required, and the account
        identifier takes precedence when both are supplied. The baseline evaluates
        them in that order at L195 to L226: an account identifier that is present
        is validated numeric at L197 and used to look the card number up through
        the cross-reference at L206 to L209 -- so a card number supplied alongside
        it is discarded by that lookup rather than refused -- a card number that is
        present is validated numeric at L211 and used to look the account
        identifier up at L220 to L223, and supplying neither is refused at L226.
        Whichever is used, the card number is what the stored record carries, per
        the MOVE at L459.


        The confirmation decides whether the write happens, which is why one
        operation answers both 200 and 201. The baseline validates the whole
        submission first at L166 and L167 and only then evaluates that one
        character at L169 to L188: 'Y' or 'y' performs the write at L172, while
        'N', 'n', spaces and low values fall to L173 through L176, which write
        nothing and ask for a confirmation with the prompt at L178. Splitting the
        unconfirmed turn into its own operation would invent an endpoint the
        baseline does not have.
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        description: >-
          The transaction to create, carrying every field the baseline add
          screen collects and none the service assigns for itself.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreateRequest"
      responses:
        # WHY : Refactoring Rationale: a withheld confirmation answers 200 with
        #       nothing written, rather than 201 or an error, because the baseline
        #       treats it as a normal turn of the same transaction rather than as a
        #       failure. app/cbl/COTRN02C.cbl L166 and L167 validate the submission
        #       first, L383 to L386 normalise the amount and write the normalised
        #       form back into the screen field, and only then does L169 examine the
        #       confirmation: L173 to L176 answer 'N', 'n', SPACES and LOW-VALUES
        #       with the prompt at L178 and perform no write at all. Answering an
        #       error there would report a failure where the baseline reports a
        #       prompt, and answering 201 would claim a write that did not happen.
        #       The sibling bill-payment operation in this document answers its own
        #       withheld confirmation the same way, so one contract does not
        #       describe two conventions for one situation.
        "200":
          description: >-
            The confirmation was withheld, so no transaction was written. The body
            reports the normalised amount the submission would be captured at and
            the prompt "Confirm to add this transaction..." verbatim from
            app/cbl/COTRN02C.cbl L178.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionAddPreview"
        "201":
          description: >-
            The transaction was written. The body carries the assigned
            identifier, the normalised amount and the baseline's own success
            sentence, and the Location header addresses the new resource.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
            Location:
              description: >-
                Absolute path of the created transaction, addressing the view
                operation for the assigned identifier.
              required: true
              schema:
                type: string
                description: >-
                  Path of the created transaction, of the form
                  /api/v1/transactions/{transactionId}, matching the view
                  operation's own path key.
                examples:
                  - "/api/v1/transactions/0000000000683580"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            Neither the supplied account identifier nor the supplied card number
            resolves through the cross-reference. The aggregate message is
            "Account ID NOT found..." verbatim from app/cbl/COTRN02C.cbl L593
            when the account identifier was supplied, and "Card Number NOT
            found..." verbatim from L626 when the card number was.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        # WHY : Refactoring Rationale: two CICS conditions collapse into this one
        #       status because the baseline itself gave them one outcome.
        #       app/cbl/COTRN02C.cbl L735 (WHEN DFHRESP(DUPKEY)) and L736 (WHEN
        #       DFHRESP(DUPREC)) fall through to a single shared handler, whose
        #       first act at L738 is to move one message, "Tran ID already
        #       exist...", into the message line. Reporting them as two statuses
        #       would invent a distinction the baseline does not draw and would
        #       force a client to branch on something no message tells it apart.
        "409":
          description: >-
            The assigned identifier already exists. The aggregate message is
            "Tran ID already exist..." verbatim from app/cbl/COTRN02C.cbl L738,
            singular verb included, and it is the response for both of the
            duplicate conditions the baseline handles together at L735 and L736.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: >-
            The write, or one of the lookups preceding it, failed for a reason the
            caller cannot correct. The aggregate message is one of "Unable to Add
            Transaction..." verbatim from app/cbl/COTRN02C.cbl L745 when the write
            itself failed, "Unable to lookup Acct in XREF AIX file..." from L600
            when the account-id form could not be resolved through the
            cross-reference, "Unable to lookup Card # in XREF file..." from L633
            when the card-number form could not be, or "Unable to lookup
            Transaction..." from L664 and L693 when reading the highest existing
            identifier failed.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # WHY : ⚠️ Refactoring Rationale: this operation publishes the baseline's PF5
  #       "copy last transaction" action, which was implemented in
  #       TransactionAddService.copyLastTransactionData and reachable from nothing.
  #       app/cbl/COTRN02C.cbl binds it at L146 and L147 and performs
  #       COPY-LAST-TRAN-DATA at L471, which validates the key fields at L473, reads
  #       the most recent record backwards across L475 to L478, copies eleven of its
  #       data columns across L480 to L493 and then re-enters PROCESS-ENTER-KEY at
  #       L495. Leaving it unpublished meant a documented baseline capability existed
  #       in the migrated code and could not be exercised by any client, which reads
  #       from the outside as a parity gap and from the inside as dead code.
  #       Alternatives Considered: deleting the service method and recording the
  #       action as not migrated. Rejected because the action IS in the baseline and
  #       the AAP maps COTRN02C wholesale onto this context, so dropping it would be
  #       a silent scope reduction; the method is also already transcribed and tested,
  #       so the cheaper of the two corrections is to publish it.
  #       Alternatives Considered: expressing it as a flag on the add operation --
  #       a "copySource: LAST" member on TransactionCreateRequest. Rejected because
  #       the baseline reaches it from a DIFFERENT attention identifier than Enter,
  #       so it is a separate action rather than a variant of the capture, and a flag
  #       would make eleven of the request's members conditionally meaningless
  #       without any schema being able to say so.
  #       Assumptions: it is a POST rather than a GET even though it can end without
  #       writing, because the confirmed form writes a row. The same reasoning the
  #       add operation records applies unchanged: one operation answers both 200 and
  #       201 because the baseline makes that choice inside one EVALUATE.
  /api/v1/transactions/copy-last:
    post:
      tags: [Transaction Add]
      operationId: copyLastTransaction
      x-required-authority: carddemo-user
      summary: Re-capture the most recently stored transaction as a new one.
      description: >-
        Copies the most recently stored transaction into a fresh submission and
        captures it, migrated from COPY-LAST-TRAN-DATA at app/cbl/COTRN02C.cbl
        L471, which the baseline reaches from PF5 at L146 and L147.


        The request carries a KEY and a confirmation and no data members, because
        L473 performs VALIDATE-INPUT-KEY-FIELDS and nothing else before the read:
        the eleven data members are this action's OUTPUT, filled from the copied
        record at L481 to L492 and validated afterwards by the re-entry at L495.
        At least one of accountId and cardNumber selects the account or card the
        new transaction is recorded against, and the account resolves first when
        both are supplied.


        ⚠️ Refactoring Rationale: this operation used to be declared over
        TransactionCreateRequest, whose eleven data members are each required --
        so the action was reachable only from a screen that was ALREADY filled
        in, which is the opposite of what an operator presses the key for. The
        earlier text here required "eleven data members" of a body whose eleven
        data members the service was about to overwrite.


        The confirmation decides whether the copied capture is written, exactly
        as it does for the add operation, because L495 re-enters
        PROCESS-ENTER-KEY and the copied values therefore travel the full
        validation chain rather than a shortened one.


        ⚠️ A client is expected to reach this operation ONCE per action. Its
        withheld answer publishes the copied members, so a confirming turn goes
        through POST /api/v1/transactions carrying the values that were
        previewed. Reaching this operation a second time to confirm would
        re-resolve which row is last, and a row appended in between would
        silently replace what the operator was shown -- which the baseline cannot
        do, because its copy block moves the values into the operator's own map
        fields at L480 to L493 and every later turn reads them back off the
        screen.
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        description: >-
          The key that selects the account or card, and the confirmation that
          decides whether the copied capture is written.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyLastRequest"
      responses:
        "200":
          description: >-
            The confirmation was withheld, so no transaction was written. The body
            reports the normalised amount the copied submission would be captured
            at, the prompt "Confirm to add this transaction..." verbatim from
            app/cbl/COTRN02C.cbl L178, and -- unlike the same status on the capture
            operation -- a non-null `copied` member carrying the other ten copied
            values and the identifier of the row they came from, which is the
            screen state L482 to L492 leaves the operator looking at.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionAddPreview"
        "201":
          description: >-
            The copied transaction was written. The body carries the assigned
            identifier, the normalised amount and the baseline's own success
            sentence, and the Location header addresses the new resource.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
            Location:
              description: >-
                Absolute path of the created transaction, addressing the view
                operation for the assigned identifier.
              required: true
              schema:
                type: string
                description: >-
                  Path of the created transaction, of the form
                  /api/v1/transactions/{transactionId}, matching the view
                  operation's own path key.
                examples:
                  - "/api/v1/transactions/0000000000683581"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        # WHY : Assumptions: this status covers TWO absences where the add operation
        #       covers one, and the second is specific to this action. The supplied
        #       key may resolve through no cross-reference entry, exactly as for the
        #       add; or the table may hold no row to copy at all, which the baseline
        #       reaches through its own backward read at L475 to L478 and reports
        #       with the read sentence at L664 and L693.
        "404":
          description: >-
            Neither the supplied account identifier nor the supplied card number
            resolves through the cross-reference, or the table holds no
            transaction to copy. The aggregate message is "Account ID NOT
            found..." verbatim from app/cbl/COTRN02C.cbl L593 when the account
            identifier was supplied, "Card Number NOT found..." verbatim from
            L626 when the card number was, and "Unable to lookup Transaction..."
            from L664 and L693 when there was no row to copy.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          description: >-
            The assigned identifier already exists. The aggregate message is
            "Tran ID already exist..." verbatim from app/cbl/COTRN02C.cbl L738,
            singular verb included, and it is the response for both of the
            duplicate conditions the baseline handles together at L735 and L736.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: >-
            The copy, one of the lookups preceding it, or the write failed for a
            reason the caller cannot correct. The aggregate message is one of
            "Unable to Add Transaction..." verbatim from app/cbl/COTRN02C.cbl
            L745, "Unable to lookup Acct in XREF AIX file..." from L600, "Unable
            to lookup Card # in XREF file..." from L633, or "Unable to lookup
            Transaction..." from L664 and L693.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/transactions/{transactionId}:
    description: >-
      One transaction addressed by its identifier, migrated from CICS
      transaction CT01.
    # Assumptions: this path-level list carries the PATH parameter alone. The
    #   correlation header is declared by each operation instead, which is where
    #   every other operation in this document declares it, and re-declaring it
    #   here as well made the only operation on this path carry the same
    #   (name, in) pair twice over -- once inherited and once of its own. The
    #   specification permits an operation to OVERRIDE an inherited parameter,
    #   but the two declarations here were the identical reference, so the
    #   override carried no difference and left a reader unable to tell which
    #   one was meant to win.
    parameters:
      - $ref: "#/components/parameters/TransactionId"

    get:
      tags: [Transaction View]
      operationId: viewTransaction
      x-required-authority: carddemo-user
      summary: View one transaction by identifier.
      description: >-
        Returns the thirteen record fields the baseline view screen displays,
        migrated from app/cbl/COTRN01C.cbl. The thirteen are the thirteen MOVE
        statements at L178 to L190, in the order the record declares them.


        The identifier is a path parameter rather than a request body or a query
        argument because it IS the selection context. The baseline carried it in
        the DFHCOMMAREA as CDEMO-CT01-TRN-SELECTED and copied it into the input
        field on entry when the list screen had set it -- app/cbl/COTRN01C.cbl
        L103 to L107 -- and selection context that arrives in the request path
        makes each request self-describing and therefore independently
        authorizable.
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: >-
            The transaction, with its card number masked to the last four digits
            and its amount carried as an exact decimal string.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDetail"
        "400":
          description: >-
            The identifier is absent or is not sixteen digits. The aggregate
            message is "Tran ID can NOT be empty..." verbatim from
            app/cbl/COTRN01C.cbl L149 when it is absent, with the emphatic
            capitalisation of NOT preserved as the baseline writes it.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            No transaction carries that identifier. The aggregate message is
            "Transaction ID NOT found..." verbatim from app/cbl/COTRN01C.cbl
            L285.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        # WHY : Assumptions: the lookup-failure sentence exists in TWO cases across
        #       these four programs and stays two constants, never one. The
        #       capitalised "Unable to lookup Transaction..." is emitted by
        #       app/cbl/COTRN01C.cbl L292, app/cbl/COTRN02C.cbl L664 and L693, and
        #       app/cbl/COBIL00C.cbl L463 and L492, while the lower-case "Unable
        #       to lookup transaction..." is emitted by app/cbl/COTRN00C.cbl L615,
        #       L649 and L683. Folding them into one constant would change what a
        #       user reads on one of the two sets of screens, and choosing which
        #       set to change would be an arbitrary decision affecting eight
        #       source lines.
        "500":
          description: >-
            The read failed for a reason other than absence. The aggregate
            message is "Unable to lookup Transaction..." verbatim from
            app/cbl/COTRN01C.cbl L292, whose capital T is the view program's form;
            the list operation emits the lower-case "Unable to lookup
            transaction..." from app/cbl/COTRN00C.cbl L615, and the two are not
            interchangeable.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # WHY : Refactoring Rationale: this path carries ONE operation and gets NO
  #       paged list and NO page envelope, correcting a reading of
  #       app/cbl/COBIL00C.cbl L439 to L503 as a browse that becomes a paged
  #       query. It is not a browse. Grepping the whole 572-line program for
  #       READNEXT returns nothing, and grepping it for GTEQ returns nothing --
  #       against six and one respectively in app/cbl/COTRN00C.cbl -- so its
  #       STARTBR at L441, READPREV at L472 and ENDBR at L501 have no forward
  #       read to pair with and no greater-or-equal positioning option. They
  #       exist solely to serve the highest-key sequence at L210 to L219, whose
  #       end-of-file branch at L487 to L488 moves ZEROS into the key as an
  #       empty sentinel. Its relational equivalent is a maximum over the key
  #       column, not a page, so a page envelope here would describe an
  #       operation no source program justifies.
  # WHY : Refactoring Rationale: this path is /api/v1/billpay and an earlier
  #       revision published it as /bill-payments. Two independent things were
  #       wrong with that. It carried no version prefix, so nothing routed it at
  #       all; and its collection noun was not the one the deployed edge names -
  #       the load balancer forwards "/api/v1/billpay" and "/api/v1/billpay/*" to
  #       this service, so even prefixed, "/api/v1/bill-payments" would have
  #       matched no rule. The routed spelling is adopted here rather than the
  #       infrastructure being renamed to the plural because the edge's own
  #       route-key list is the published contract at the front door and is
  #       already consumed by the load-balancer rule set, whereas this operation
  #       has no caller yet to break.
  # WHY : Trade-offs: the segment is a verb-like noun rather than the plural
  #       resource noun the two neighbouring paths use. The cost is a small
  #       inconsistency in this document; what it buys is that one spelling of
  #       this operation exists across the OpenAPI contract, the load-balancer
  #       rule, the edge route key and any future caller, which is the property
  #       whose absence made the earlier revision unroutable.
  /api/v1/billpay:
    description: >-
      Full-balance payments against an account, migrated from CICS transaction
      CB00. The collection is appended to and is deliberately not browsable. Its
      path segment is billpay because that is the segment the environment roots
      already route to this service and the browser shell already reserves for the
      screen; see the rationale above the paths section.

    post:
      tags: [Bill Payment]
      operationId: payAccountBalanceInFull
      x-required-authority: carddemo-user
      summary: Pay an account's entire current balance, or preview what would be paid.
      description: >-
        Pays the whole of an account's current balance, migrated from
        app/cbl/COBIL00C.cbl.


        The payment is full-balance only and the request carries no amount. The
        baseline moves the entire account balance into the transaction amount at
        L224 (MOVE ACCT-CURR-BAL TO TRAN-AMT) and subtracts that same amount
        back out of the balance at L234, so the amount is derived rather than
        chosen and there is no partial-amount input field on the screen to
        migrate. A non-positive balance is refused at L198 with "You have
        nothing to pay...".


        The confirmation field selects between previewing and paying, which is
        why one operation serves both. The baseline makes that choice inside a
        single EVALUATE at L173 to L191 within one transaction and one input
        set: Y or y confirms and posts, N or n declines, and a blank or
        low-values confirmation reads the account and shows the balance with the
        prompt "Confirm to make a bill payment..." at L237. Splitting the
        preview into its own operation would invent an endpoint the baseline
        does not have, and reading the balance from this service would reach
        across into the context that owns accounts.


        The posted transaction is almost entirely constant. The baseline fixes
        the type code to 02 at L220, the category code to 2 at L221, the source
        to POS TERM at L222, the description to BILL PAYMENT - ONLINE at L223,
        the merchant identifier to 999999999 at L226, the merchant name to BILL
        PAYMENT at L227 and both the merchant city and zip to N/A at L228 and
        L229, and it takes the card number from the cross-reference at L225.
        None of those is a request field.
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        description: >-
          The account to pay and the confirmation that selects between previewing
          the payable balance and posting the payment.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillPaymentRequest"
      responses:
        # WHY : Refactoring Rationale: a withheld confirmation answers 200 with no
        #       payment made, rather than 201 or an error, because the baseline
        #       treats it as a normal turn of the same transaction. At L182 to
        #       L184 a blank or low-values confirmation performs
        #       READ-ACCTDAT-FILE and falls through to display the balance at
        #       L193 to L194, and at L236 to L239 an unconfirmed request is
        #       answered with the confirm prompt. Answering an error there would
        #       report a failure where the baseline reports a prompt.
        # WHY : Assumptions: this status covers THREE baseline turns, not one, and the
        #       description now names all three. A withheld confirmation reaches
        #       READ-ACCTDAT-FILE at L184 and reports the balance with the prompt at
        #       L237; a non-positive balance reports it with the advisory at L198; and
        #       a DECLINED confirmation at L178 to L181 clears the screen at L180
        #       without reaching the account read at all, so it reports the account
        #       identifier and nothing else. Naming only the first left the declined
        #       turn undescribed, which is how a client comes to treat an absent
        #       balance as a defect.
        "200":
          description: >-
            The confirmation was withheld or declined, so no payment was made. On a
            withheld confirmation the body reports the balance that would be paid
            together with the prompt "Confirm to make a bill payment..." verbatim
            from app/cbl/COBIL00C.cbl L237, or "You have nothing to pay..." from
            L198 when the balance is not positive. On a declined confirmation it
            reports the account identifier alone, with neither a balance nor a
            sentence, because L180 clears the screen and L178 reaches no account
            read.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillPaymentPreview"
        "201":
          description: >-
            The payment was posted and the account balance was reduced by the
            amount paid, which for this operation is the whole balance. The body
            carries the assigned transaction identifier and the balance as it stood
            before the payment -- the figure the baseline screen displays and the
            amount the transaction carries -- and the Location header addresses the
            transaction that was written.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
            Location:
              description: >-
                Absolute path of the transaction the payment wrote, addressing
                the view operation for the assigned identifier.
              required: true
              schema:
                type: string
                description: >-
                  Path of the transaction written by the payment, of the form
                  /api/v1/transactions/{transactionId}, matching the view
                  operation's own path key.
                examples:
                  - "/api/v1/transactions/0000000000683581"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillPaymentResponse"
        "400":
          description: >-
            The account identifier is absent or not numeric, or the confirmation
            is a value the baseline does not accept. The aggregate message is
            "Acct ID can NOT be empty..." verbatim from app/cbl/COBIL00C.cbl
            L161, or "Invalid value. Valid values are (Y/N)..." verbatim from
            L187.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            No account carries that identifier, or it has no cross-reference
            entry. The aggregate message is "Account ID NOT found..." verbatim
            from app/cbl/COBIL00C.cbl L361, which the baseline also emits from
            the update path at L392 and the cross-reference path at L425.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "409":
          description: >-
            The account state refuses the payment. The aggregate message is "You
            have nothing to pay..." verbatim from app/cbl/COBIL00C.cbl L201 when
            the balance is not positive, or "Tran ID already exist..." verbatim
            from L536 when the identifier the payment derived is already taken.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: >-
            The payment failed after validation. The aggregate message is one of
            "Unable to lookup Account..." verbatim from app/cbl/COBIL00C.cbl
            L368, "Unable to lookup XREF AIX file..." from L432, "Unable to
            lookup Transaction..." from L463 and L492, "Unable to Add Bill pay
            Transaction..." from L543, or "Unable to Update Account..." from
            L399.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/XCorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The bearer token the managed identity provider issues and the gateway
        authorizer validates. Group membership travels in the token's group
        claim and is converted to service authorities by JwtRoleConverter in
        com.carddemo.common.security, which is what replaces the baseline's
        client-echoed CDEMO-USER-TYPE flag.

  parameters:

    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        A sealed cursor token copied from a previous response: that page's lastKey
        to read forward, or its firstKey to read backward, with direction saying
        which. It is omitted on an opening request, which starts at the beginning of
        the ordering. It must be replayed exactly as it was received, because it is
        sealed against tampering and any alteration invalidates it.
      schema:
        $ref: "#/components/schemas/CursorToken"

    Direction:
      name: direction
      in: query
      required: false
      description: >-
        Which side of the supplied cursor to read. It is meaningful only alongside a
        cursor, and the browser client sends the two together or neither. `next`
        seeks keys strictly greater than the cursor in ascending order; `previous`
        seeks keys strictly less than it in descending order.
      schema:
        $ref: "#/components/schemas/PageDirection"

    # WHY : Refactoring Rationale: the starting identifier is PUBLISHED, and an
    #       earlier revision of this document declared only the two paging inputs
    #       while the already-authored request record
    #       services/transaction-service/.../dto/TransactionListRequest.java
    #       carried a third component for it. An unpublished input is worse than a
    #       missing one: the record binds it, the reference screen collects it at
    #       TRNIDINI PIC X(16) (app/cpy-bms/COTRN00.CPY L66) and the reference
    #       program branches on it at app/cbl/COTRN00C.cbl L206 to L210, so the
    #       behaviour existed and no client could discover it. Publishing it makes
    #       the browse this operation replaces reachable.
    # WHY : Assumptions: it is a FILTER on where the ordering starts and not a
    #       selector for one row - a supplied value positions the browse and the
    #       page still carries up to ten rows from there. Omitting it, or sending
    #       an empty value, begins at the start of the key space, which is the
    #       branch app/cbl/COTRN00C.cbl L206 takes for a blank field.
    TransactionIdFilter:
      name: transactionIdFilter
      in: query
      required: false
      description: >-
        The transaction identifier the browse is to begin at, as exactly sixteen
        decimal digits when supplied. Omit it to begin at the start of the
        ordering. It cannot be combined with a cursor: a cursor already states a
        position, so supplying both is a 400 rather than being silently resolved
        in favour of one.
      schema:
        $ref: "#/components/schemas/TransactionId"

    TransactionId:
      name: transactionId
      in: path
      required: true
      description: >-
        The sixteen-digit identifier of the transaction to address, as it appears
        in the transactionId member of a list row.
      schema:
        $ref: "#/components/schemas/TransactionId"

    # WHY : Refactoring Rationale: the correlation identity is declared on the
    #       REQUEST side as well as the response, and an earlier revision declared
    #       it on neither - it bounded the member inside the error body at twenty
    #       characters and stopped there. The inbound shape is part of the contract
    #       whether or not the contract states it, because
    #       services/common-lib/src/main/java/com/carddemo/common/web/CorrelationIdFilter.java
    #       accepts an inbound value and refuses one that is over-long or carries
    #       an unsafe character. Twenty was also simply wrong: the filter's
    #       CORRELATION_ID_MAX_LENGTH is 24 at its line 238, and the value it
    #       mints when a caller sends none is exactly twenty-four characters, so a
    #       body carrying a service-minted identity did not satisfy this document's
    #       own bound.
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        Identity of the unit of work this request belongs to, echoed back on the
        response. Supply it to tie this request to one a caller has already
        named, or omit it and the service mints one. A value longer than the
        published bound, or carrying a character outside the published set, is
        refused with 400 rather than being silently replaced, so a caller cannot
        believe it is correlating requests the service is in fact correlating
        under a different identity. A value whose shape is that of a protected identifier -- only digits and the
        three separators, with nine or more digits -- is refused on the same terms, because this
        identity is echoed and logged. The refusal carries the shared problem body
        and the response correlation header, the same as any other 400, and it names
        the rule it applied without ever repeating the value it refused.
      # WHY : Measured: the shared CorrelationId schema admits the EMPTY string, because
      #       ApiError normalises an absent identity to "" at L619 and every problem
      #       document carries the member, so the schema a BODY member names has to admit
      #       it. A REQUEST header must not: conformsWithin in CorrelationIdFilter
      #       declines an empty value and the filter then answers 400. This parameter
      #       therefore narrows the shared schema by one facet instead of restating its
      #       alphabet and width, which would be a second statement of both. Omitting the
      #       header entirely stays valid -- that is governed by required above.
      schema:
        allOf:
          - $ref: "#/components/schemas/CorrelationId"
          - minLength: 1

  # WHY : Assumptions: the response header is declared once here rather than at
  #       each response, because a header re-typed at every response is one that
  #       will eventually be typed differently. It is required on every response
  #       including the failures: the identity is the only handle this contract
  #       offers into server-side diagnostics, and it is least dispensable exactly
  #       when a caller is reporting a failure.
  headers:
    XCorrelationId:
      description: >-
        Identity of the unit of work that produced this response. Echoed from the
        request where the caller supplied a conforming value, and minted by the
        service where it did not. Quote it when reporting a failure.
      required: true
      schema:
        $ref: "#/components/schemas/CorrelationId"

  responses:

    BadRequest:
      description: >-
        The request was refused by field validation. The body carries the
        aggregate sentence and one entry per offending field, each entry naming
        the field and carrying that field's verbatim baseline message.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Unauthorized:
      description: >-
        No bearer token was presented, or the token presented could not be
        validated. No field entries accompany this status, because nothing about
        the request body was examined.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Forbidden:
      description: >-
        The token was valid but its group claim does not carry the authority this
        operation requires.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    ServiceUnavailable:
      description: >-
        The operation was refused because the environment is not currently
        accepting mutating work. The nightly batch chain owns the data for the
        duration of its window, and NOTHING WAS APPLIED -- the refusal is issued
        before the handler runs, so no part of the request took effect. A caller
        that repeats the same request unchanged once the window reopens succeeds.


        This is the target equivalent of the reference quiesce. app/jcl/CLOSEFIL.jcl
        lines 26 to 30 closed five VSAM files to the CICS region for the duration of
        the posting chain and app/jcl/OPENFIL.jcl reopened them, so a write attempted
        in between received a file-status error and abended. The migrated bracket
        deliberately closes WRITES only, so every read this service publishes keeps
        answering while the window is closed.


        Assumptions: 503 rather than 409 or 403, because the distinction is the one a
        client acts on. The request is well formed and its caller is entitled to make
        it; only the window in which it may be applied is absent. No Retry-After is
        sent, because the window is reopened by a state machine whose remaining work
        this service cannot see, so any value would be a guess a client would then
        schedule against.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"


    # WHY : Refactoring Rationale: the transport refusals below were UNDECLARED while the shared
    #       advice in services/common-lib produces every one of them, so each was reachable on
    #       every operation of this contract with no published shape. A client had no branch for
    #       them: ui/src/api/client.ts could only treat each as an unrecognised body. Declaring
    #       them here and handling them there are two halves of one correction, and declaring one
    #       half alone would have documented a response no caller could recognise.
    # WHY : Assumptions: each carries the same ApiError shape as every other refusal of this
    #       contract, with its own machine code -- CARDDEMO-0405, CARDDEMO-0406 and
    #       CARDDEMO-0415. A distinct code per condition is what lets a client branch without
    #       reading the sentence, which is the same reason the 400 and the 401 do not share one.
    # WHY : Assumptions: the body is declared application/json because that is what the shared
    #       advice writes -- it returns a plain ApiError record and this build registers no
    #       problem+json converter -- and because the 406 arm pins MediaType.APPLICATION_JSON
    #       explicitly, which is the single call that lets a body be produced at all for a caller
    #       whose Accept header matched nothing.
    MethodNotAllowed:
      description: >-
        The route addressed does not publish the method the request named. The response
        carries an Allow header naming the methods it does publish, which is where a client
        reads them; the body does not repeat that list, so the two cannot disagree.


        Assumptions: this has no reference counterpart. A 3270 terminal cannot address a
        transaction with a verb the program did not define, so no reference literal or
        condition name corresponds to this outcome. It exists because a target route is
        addressed by callers this system does not control.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
        Allow:
          description: >-
            The methods the addressed route publishes, joined with a comma and a space.
            Composed from the methods the framework's handler mapping reports, which are
            server-authored; the method the caller USED is echoed nowhere. It is omitted
            rather than sent empty when the framework reported no supported set, because an
            empty Allow states that the route supports no method at all, which would be a
            different and false claim.
          required: false
          schema:
            type: string
            example: "GET, PUT"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    UnsupportedMediaType:
      description: >-
        The request carried a body in a media type this route does not accept, or carried a
        body with no Content-Type at all. Every operation of this contract that accepts a
        body accepts application/json and nothing else.


        The body carries no fieldErrors entry and cannot: the refusal is raised before any
        member has been parsed, so there is no bound object to have fields. That is why this
        is a distinct code from CARDDEMO-0400 rather than a 400 with an empty array, which a
        caller could not tell from a body it had mis-spelled.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotAcceptable:
      description: >-
        The request's Accept header names no media type this service can produce. The shared
        advice answers with JSON and nothing else.


        Assumptions: the body of this response is itself application/json, which is a type
        the caller has just said it will not accept. That is deliberate. The alternative is
        an empty 406, which carries neither the machine code nor the correlation identifier
        a support enquiry needs and tells the caller nothing about which header to change.
        The content type is set explicitly by the shared advice for a second reason recorded
        there: a body left to content negotiation would be negotiated against the same
        Accept header that already matched nothing, and the request would then be forwarded
        to the container error path, which this service publishes no route for.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  # WHY : Assumptions: there is deliberately NO shared InternalServerError entry
  #       here, and its absence is a decision rather than an omission. The four
  #       entries above are shared precisely because their meaning does not vary
  #       by operation: a field-validation refusal, a missing or unvalidatable
  #       token, a group claim without the required authority, and a write refused
  #       because the batch window is closed all read the same whichever operation
  #       returned them -- the last of them says nothing about the operation at all,
  #       only about the environment, which is the clearest case for sharing there
  #       is. A 500 in this context does not. Each
  #       of the four operations declares its own, because each carries the
  #       VERBATIM aggregate message of the baseline paragraph that detected the
  #       failure, together with the program and line it came from -- and those
  #       messages are not interchangeable. The browse emits "Unable to lookup
  #       transaction..." with a lower-case t from app/cbl/COTRN00C.cbl L615 while
  #       the single read emits the capitalised "Unable to lookup Transaction..."
  #       from app/cbl/COTRN01C.cbl L292, and preserving that difference is a
  #       parity requirement rather than a stylistic one.
  #       Alternatives Considered: (1) keeping the shared entry and referencing it
  #       from all four operations, moving the per-program message text up into
  #       each operation's description. Rejected because the text describes the
  #       RESPONSE, not the operation: a reader looking at the 500 would no longer
  #       find which message it carries, and the four sets of messages -- one of
  #       which lists six distinct sentences -- would sit in the wrong place to be
  #       checked against the COBOL. (2) Keeping the shared entry unreferenced, as
  #       an earlier revision of this file did. Rejected because an unreferenced
  #       response component is worse than absent: a generator emits it as a type
  #       nothing returns, and a reader reasonably infers that it IS the declared
  #       shape of this context's 500s, which was not true even when it was
  #       present. That inference is exactly the kind of false premise this
  #       contract is meant not to invite.
  #       Assumptions: being unreferenced is not by itself the defect, and this
  #       document holds the counter-example, so the distinction is stated here
  #       rather than left for a reader to reconcile. The PageBoundaryMessage
  #       schema below is ALSO referenced by nothing, and it stays: it is a catalog
  #       of five verbatim baseline sentences published for a client to render, its
  #       own rationale says outright that it is deliberately a member of no
  #       response, and it carries content that exists nowhere else in the
  #       contract. The removed response carried no content of its own -- every
  #       sentence it might have held is stated more precisely by the four
  #       operations -- and nothing recorded why it was unreferenced. An orphan
  #       whose purpose is written down is documentation; an orphan with no stated
  #       purpose is drift, and only the second kind was removed.

    # WHY : Refactoring Rationale: a SECOND definition of MethodNotAllowed, NotAcceptable and
    #   UnsupportedMediaType stood here and all three are withdrawn. They were a whole earlier
    #   generation of the same three components, merged alongside the surviving generation, and a
    #   duplicate mapping key is the most deceptive shape this can take: YAML resolves a repeated
    #   key to the LAST definition, so one of every pair was dead text that still read as the
    #   contract, and no schema-shaped test could tell -- both copies were well formed and both
    #   carried the correlation header. The survivors are the generation that states the Allow
    #   header's composition rule with an example and attributes the pinned content type to the
    #   shared advice rather than to a per-service handler; the withdrawn copies said only that
    #   Allow is 'comma separated'. Detected with a duplicate-key-aware composer, because
    #   yaml.safe_load hides the condition by construction.
    PayloadTooLarge:
      description: >-
        The request body exceeds the byte ceiling this service accepts, and
        carries the machine code CARDDEMO-0413. The ceiling is 65536 bytes unless
        the deployment names another under carddemo.web.max-request-body-bytes,
        and it is enforced by a servlet filter ordered ahead of the security
        chain rather than by a handler -- which is why it applies to every
        operation that accepts a body and why the refusal reaches a caller that
        presented no token at all.


        Assumptions: the body of this response carries no fieldErrors entry and
        cannot. The refusal is raised before any member is parsed, so there is no
        bound object to have fields; the message names the ceiling and the size
        the request declared, which is what distinguishes a misconfigured client
        from a deliberate flood.


        Assumptions: a body that declares no length is not refused for that alone.
        It is read up to the ceiling and refused only if it exceeds it, and the
        bytes already read are forwarded to the handler when it does not, so a
        chunked request within the bound is served normally. For that case the
        message states that the body declares no length and exceeds the bound,
        because the exact size is the one thing that was never learned.


        Assumptions: this response carries the correlation identifier like every
        other, and that is a property of filter ORDER rather than of this filter.
        The correlation filter is registered one position ahead of it and has
        already put the identifier on the response before the body is written.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:

    # -------------------------------------------------------------------------
    # Primitive field types.
    # -------------------------------------------------------------------------

    # WHY : Assumptions: the COPYBOOK is the normative wire and storage contract
    #       for this context, so every width below is the PICTURE width of the
    #       named field in app/cpy/CVTRA05Y.cpy and none is a number chosen here.
    #       Naming the copybook and the field in each description is what makes a
    #       width auditable rather than something a reader has to trust: the
    #       fourteen declared widths are 16, 2, 4, 10, 100, 11, 9, 50, 50, 10, 16,
    #       26, 26 and 20 at one-based offsets 1, 17, 19, 23, 33, 133, 144, 153,
    #       203, 253, 263, 279, 305 and 331, and they sum to exactly the 350 bytes
    #       the copybook's own header states as the record length at L2.
    #       app/cpy/CVTRA06Y.cpy L5 to L18 declares the same fourteen fields at
    #       the same widths under a DALYTRAN- prefix, so the two agree
    #       field for field and only the name prefix differs.
    # WHY : Assumptions: the fourteenth field is DROPPED and appears in no schema.
    #       FILLER PIC X(20) at app/cpy/CVTRA05Y.cpy L18 is padding that carries
    #       the record to its fixed 350-byte length -- all 300 records of
    #       app/data/ASCII/dailytran.txt hold twenty spaces at one-based bytes 331
    #       to 350 -- so it holds no value a caller could act on. Publishing it
    #       would invite a client to read or write bytes that mean nothing, and
    #       the same applies to the FILLER PIC X(22) that closes the 50-byte
    #       record at app/cpy/CVTRA01Y.cpy L10.

    # WHY : Assumptions: a string, never an integer, and the committed seed data
    #       is why rather than the copybook alone. app/cpy/CVTRA05Y.cpy L5
    #       declares TRAN-ID PIC X(16), a character field, and in the 300 records
    #       of app/data/ASCII/dailytran.txt -- each exactly 350 bytes -- ALL 300
    #       of the identifiers at one-based offset 1 to 16 are zero-padded, for
    #       example 0000000000683580, 0000000001774260 and 0000000006292564. An
    #       integer or number type would discard leading zeros on every single
    #       record and no round trip would survive.
    TransactionId:
      type: string
      description: >-
        A transaction identifier: exactly sixteen decimal digits, zero-padded on
        the left. Declared TRAN-ID PIC X(16) at app/cpy/CVTRA05Y.cpy L5, stored
        as transaction_id CHAR(16) at
        services/transaction-service/src/main/resources/db/migration/V1__ledger.sql
        L126, and assigned by the service rather than supplied by a caller.
      minLength: 16
      maxLength: 16
      pattern: "^[0-9]{16}$"
      examples:
        - "0000000000683580"

    # WHY : Trade-offs: the response carries the masked form only, so a client
    #       cannot display or re-key the full number from anything this service
    #       returns. That is given up deliberately: the baseline view screen did
    #       show all sixteen characters, declared CARDNUMI PIC X(16) at
    #       app/cpy-bms/COTRN01.CPY L72, but no operation here is the
    #       administrative card-detail endpoint and so no unmasked path belongs
    #       in this contract. The masking is applied by the mapper, which is why
    #       the type is an ordinary string rather than something claiming to
    #       enforce it.
    MaskedCardNumber:
      type: string
      description: >-
        A primary account number masked to its last four digits, rendered as
        twelve asterisks followed by those four digits. The unmasked field is
        declared TRAN-CARD-NUM PIC X(16) at app/cpy/CVTRA05Y.cpy L15; the
        sixteen-character form never leaves this service.
      minLength: 16
      maxLength: 16
      pattern: "^[*]{12}[0-9]{4}$"
      examples:
        - "************6232"

    # WHY : Assumptions: a string for the same reason as the transaction
    #       identifier, measured on the same data. app/cpy/CVTRA05Y.cpy L15
    #       declares TRAN-CARD-NUM PIC X(16), and 30 of the 300 card numbers at
    #       one-based offset 263 to 278 of app/data/ASCII/dailytran.txt begin
    #       with a zero -- 0***********6232, 0***********5740 and
    #       0***********7330 among them -- as do 5 of the 50 in
    #       app/data/ASCII/carddata.txt. A numeric type loses that leading digit
    #       and turns a valid card number into a fifteen-digit one.
    #       Trade-offs: the three are shown with their interior digits masked, in
    #       the same twelve-asterisk form MaskedCardNumber publishes above. The
    #       evidence this comment needs is that the first character is a zero and
    #       that the field is sixteen positions wide; the remaining digits add
    #       nothing to it and would place usable primary account numbers in a
    #       published contract, which the masking rule elsewhere in this document
    #       exists to prevent.
    CardNumber:
      type: string
      description: >-
        A primary account number as supplied on a request: exactly sixteen
        decimal digits, leading zeros significant. Declared TRAN-CARD-NUM PIC
        X(16) at app/cpy/CVTRA05Y.cpy L15 and stored as card_num CHAR(16) at
        V1__ledger.sql L220. It appears on requests only; responses carry the
        masked form.
      minLength: 16
      maxLength: 16
      pattern: "^[0-9]{16}$"
      # WHY : Assumptions: the example is SYNTHETIC and matches no row of any seed
      #       extract, verified by search. It has to satisfy the sixteen-digit
      #       pattern above, so it cannot be masked the way a response example
      #       can; a real seed card number in its place would be a usable primary
      #       account number published in a contract that clients copy examples
      #       out of. Its leading zero is retained because that is the property
      #       the comment above this schema measures.
      examples:
        - "0123456789012345"

    # WHY : Assumptions: eleven digits as a string, measured rather than assumed.
    #       app/cpy-bms/COBIL00.CPY L60 declares ACTIDINI PIC X(11) and
    #       app/cpy-bms/COTRN02.CPY L60 declares the same, and ALL 50 of the
    #       account identifiers at one-based offset 1 to 11 of
    #       app/data/ASCII/acctdata.txt are zero-padded -- 00000000001 and its
    #       successors -- so an integer type would discard leading zeros on every
    #       record in the file. The baseline validates the field with a NOT
    #       NUMERIC test at app/cbl/COTRN02C.cbl L197, which is a digits-only
    #       check on characters, not a numeric conversion.
    AccountId:
      type: string
      description: >-
        An account identifier: exactly eleven decimal digits, zero-padded on the
        left. Declared ACTIDINI PIC X(11) at app/cpy-bms/COBIL00.CPY L60, and
        held as account_id BIGINT at V1__ledger.sql L557 where the leading zeros
        are restored by the declared width on the way out.
      minLength: 11
      maxLength: 11
      pattern: "^[0-9]{11}$"
      examples:
        - "00000000001"

    # WHY : Alternatives Considered: typing money as a JSON number, rejected
    #       because a JSON number carries no scale and most clients parse it into
    #       an IEEE-754 binary64 value, which cannot hold most two-place decimals
    #       exactly and so destroys exactness at the boundary the user actually
    #       sees. A string preserves the scale and the sign, and it is what
    #       MoneyModule L324 emits through Money.toPlainString(). The reference
    #       data shows why the sign has to survive: the amount at one-based bytes
    #       133 to 143 of app/data/ASCII/dailytran.txt is zoned decimal with a
    #       trailing sign overpunch, so 0000005047G is positive and 0000009190}
    #       is negative, and 50 of the 300 records carry a negative overpunch.
    TransactionAmount:
      type: string
      description: >-
        A signed transaction amount as an exact decimal string with exactly two
        fractional digits and no exponent. Declared TRAN-AMT PIC S9(09)V99 at
        app/cpy/CVTRA05Y.cpy L10, stored as amount NUMERIC(11,2) at
        V1__ledger.sql L178, and carried in Java as
        com.carddemo.common.money.Money, whose scale is 2 and whose general
        rounding mode is HALF_UP. Nine integer digits are admissible, so the
        magnitude bound is 999999999.99.
      maxLength: 13
      pattern: "^-?[0-9]{1,9}\\.[0-9]{2}$"
      examples:
        - "50.47"
        - "-91.90"

    # WHY : Assumptions: the account balance admits TEN integer digits where a
    #       transaction amount admits nine, so it is a separate type rather than
    #       a reuse. app/cbl/COBIL00C.cbl L56 declares WS-CURR-BAL PIC
    #       +9999999999.99, the fourteen character positions
    #       app/cpy-bms/COBIL00.CPY L66 renders as CURBALI PIC X(14), and
    #       Money.MAX_MAGNITUDE is 9999999999.99 to match. Reusing the
    #       nine-digit transaction bound here would reject a balance the baseline
    #       can hold.
    AccountBalance:
      type: string
      description: >-
        A signed account balance as an exact decimal string with exactly two
        fractional digits and no exponent. Ten integer digits are admissible,
        matching WS-CURR-BAL PIC +9999999999.99 at app/cbl/COBIL00C.cbl L56 and
        the fourteen-position rendering CURBALI PIC X(14) at
        app/cpy-bms/COBIL00.CPY L66.
      maxLength: 14
      pattern: "^-?[0-9]{1,10}\\.[0-9]{2}$"
      examples:
        - "1234.56"
        - "0.00"

    # WHY : Assumptions: twenty-six characters, not an RFC 3339 instant, because
    #       the field is declared TRAN-ORIG-TS PIC X(26) at app/cpy/CVTRA05Y.cpy
    #       L16 and TRAN-PROC-TS PIC X(26) at L17, and the committed data holds
    #       exactly that form: record 1 of app/data/ASCII/dailytran.txt carries
    #       "2022-06-10 19:27:53.000000" at one-based bytes 279 to 304. The
    #       separator is a space and there is no zone designator, so declaring
    #       date-time here would assert an offset the stored value does not
    #       carry. TimestampFormatter in com.carddemo.common.time emits this
    #       form.
    Timestamp26:
      type: string
      description: >-
        A twenty-six-character local timestamp of the form
        YYYY-MM-DD HH:MM:SS.mmmmmm, space-separated and with microsecond
        precision and no zone designator. Declared PIC X(26) at
        app/cpy/CVTRA05Y.cpy L16 and L17 and stored as TIMESTAMP(6) at
        V1__ledger.sql L229 and L245.
      minLength: 26
      maxLength: 26
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{6}$"
      examples:
        - "2022-06-10 19:27:53.000000"

    # WHY : Assumptions: ten characters, and a DIFFERENT type from the
    #       twenty-six-character timestamp above even though both land in the
    #       same record field. The add screen declares TORIGDTI PIC X(10) at
    #       app/cpy-bms/COTRN02.CPY L102 and TPROCDTI PIC X(10) at L108, calls
    #       them dates in its own messages -- "Orig Date can NOT be empty..." at
    #       app/cbl/COTRN02C.cbl L284 and "Orig Date - Not a valid date..." at
    #       L401 -- and moves them into the X(26) record fields at L464 and L465,
    #       where an alphanumeric MOVE left-justifies and pads with sixteen
    #       spaces. Accepting a twenty-six-character value here would accept
    #       something the screen cannot express; requiring one would reject
    #       everything the screen can send.
    DateOnly10:
      type: string
      description: >-
        A ten-character calendar date of the form YYYY-MM-DD, as the add screen
        collects it. Declared TORIGDTI and TPROCDTI PIC X(10) at
        app/cpy-bms/COTRN02.CPY L102 and L108, validated by the date-edit rules
        the baseline reaches through app/cbl/CSUTLDTC.cbl, and stored
        left-justified within the twenty-six-character record field.
      minLength: 10
      maxLength: 10
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      examples:
        - "2022-06-10"

    # WHY : Assumptions: the shape is fixed by
    #       services/common-lib/src/main/java/com/carddemo/common/web/CursorToken.java,
    #       which declares VERSION "v1" at L81, a maximum length of 256 at L92,
    #       and the accepted shape as a compiled pattern at L121 to L122. The
    #       token is SEALED, not a raw key: L172 to L179 of PageResponse.java
    #       records that an earlier design let the raw composite key serve as the
    #       cursor, which would have serialised a primary account number into
    #       every page of a browse and handed it to the client to replay. Its
    #       payload is bound with an HMAC to the query and the subject it was
    #       issued for, so a client cannot construct, decode or retarget one.
    CursorToken:
      type: string
      description: >-
        An opaque sealed keyset cursor issued by this service. It carries a
        version prefix, a base64url nonce and a base64url ENCIPHERED payload with
        its own authentication tag, separated by full stops, and it is meaningful
        only to the service that sealed it. A caller stores it and replays it
        unaltered; it is never parsed, decoded, composed or compared by a client,
        and decoding it yields ciphertext rather than the key it stands for.
      maxLength: 256
      pattern: "^v2\\.[A-Za-z0-9_-]{16}\\.[A-Za-z0-9_-]{1,200}$"

    # WHY : Refactoring Rationale: ONE bound and ONE character set for the
    #       correlation identity, published once and referenced by the request
    #       parameter, the response header and the error body alike. Three
    #       descriptions of one value existed across this migration's three
    #       contracts - twenty characters here, twenty-four in the auth contract
    #       and unbounded with thirty-six-character examples in the card contract -
    #       and nothing compared them, so the disagreement was invisible until a
    #       request was refused.
    # WHY : Assumptions: twenty-four characters, and the set of letters, digits,
    #       hyphen, underscore and full stop, are not chosen here. They are what
    #       CorrelationIdFilter.java enforces - CORRELATION_ID_MAX_LENGTH is 24 at
    #       its line 238 and its accepted punctuation is exactly those three
    #       characters - so a value outside that is refused with 400 before any
    #       handler runs, and publishing anything wider would document a request
    #       this service rejects.
    # WHY : Assumptions: the empty string is admitted as well as a conforming
    #       identity, and it is not slack. The shared error shape normalises an
    #       absent identity to the empty string, and the assembling advice supplies
    #       the empty string when the logging context holds no entry - the state of
    #       a failure raised before the correlation filter ran. Declaring only the
    #       token shape would describe a body this service can in fact emit as
    #       invalid.
    CorrelationId:
      type: string
      maxLength: 24
      pattern: '^$|^(?!(?:[._-]*[0-9]){9,}[._-]*$)[A-Za-z0-9_.-]{1,24}$'
      description: >-
        Identity of one unit of work. At most twenty-four characters drawn from
        the ASCII letters, the digits, the hyphen, the underscore and the full
        stop. A value the service mints is exactly the two-character prefix CD followed by twenty-two upper-case hexadecimal
        characters over eleven bytes of entropy; a value a caller
        supplies need only fit the bound and the set. The empty string appears
        only inside an error body, and only for a failure raised before any
        identity had been established. The pattern additionally refuses one narrow class the character set alone
        admits: a value made up only of digits and the three separators, carrying nine
        or more digits. That is the shape of every protected identifier this system
        holds, in contiguous form and in every separated form -- a customer identifier
        and a national identifier are nine digits, an account identifier eleven, a
        card number sixteen -- and the shared correlation filter refuses it because
        this identity is echoed on the response and written to every log line for the
        request, so accepting one would copy a protected identifier into both.
        Ordinary values are unaffected: a date-like 2022-07-18 carries eight digits
        and is accepted, and any value containing a letter is accepted whatever its
        digits. The CD prefix on a minted identity is what keeps a minted value out
        of the refused class.
      examples:
        - "4F1C0E423A554D219B7E6C0F"

    # WHY : Assumptions: the two member values are the two the already-authored
    #       browser client sends, declared as the union "next" | "previous" at
    #       ui/src/api/cards.ts L45 with "next" as its default. Naming them
    #       forward and backward here would read more naturally and would leave
    #       the SPA sending values this contract rejects. The sibling card
    #       contract publishes the same two for the same purpose, so there is one
    #       paging vocabulary across this migration.
    # WHY : Refactoring Rationale: the two admitted values are next and previous,
    #       and an earlier revision of this document published FORWARD and
    #       BACKWARD. Those are the NAMES of the constants on
    #       services/transaction-service/.../dto/TransactionListRequest.java's
    #       Direction enum, not the values it accepts: each constant carries a
    #       lower-case wire value read by an explicit JSON creator, so a request
    #       sending the constant name is refused with 400 before any handler runs.
    #       The contract therefore described exactly the values the service does
    #       not take, and a client generated from it could not page at all. The
    #       sibling auth and card contracts already publish next and previous, so
    #       this also removes a second paging vocabulary from the platform, and a
    #       contract test now asserts the published set equals the enum's own wire
    #       values so the two cannot drift again.
    PageDirection:
      type: string
      description: >-
        Which side of a supplied cursor to read. `next` seeks keys strictly greater
        than the cursor in ascending order; `previous` seeks keys strictly less than
        it in descending order, which is the migrated form of the baseline READPREV
        at app/cbl/COTRN00C.cbl L660.
      enum: [next, previous]
      default: next

    # WHY : Refactoring Rationale: there is no schema here for the baseline's
    #       page-boundary sentences, and an earlier revision published one -- an
    #       enumeration of the five strings, deliberately referenced by no response.
    #       A component no response references is pruned by every generator that
    #       reads this document, so it reached no client anyway, and the strings have
    #       a single home already: ui/src/messages/messages.ts carries all five
    #       verbatim, which is where every user-visible string in the migrated system
    #       lives. Publishing them twice would give one sentence two sources that can
    #       drift. The five remain distinct there -- app/cbl/COTRN00C.cbl emits them
    #       at L248, L270, L608, L642 and L676, and three differ only in wording
    #       about reaching the top -- and a client selects among them from hasNext
    #       and from the presence of firstKey, which is what the paging controls
    #       already bind to.
    # -------------------------------------------------------------------------
    # Resource shapes.
    # -------------------------------------------------------------------------

    TransactionSummary:
      type: object
      description: >-
        One row of the transaction list, carrying the four values the baseline
        list screen renders per row plus the identifier the row is selected by.
        The baseline populates a row at app/cbl/COTRN00C.cbl L381 to L445, moving
        the identifier, a derived date, the description and the edited amount into
        the row's four map fields.
      required: [transactionId, originTimestamp, description, amount]
      additionalProperties: false
      properties:
        transactionId:
          allOf:
            - $ref: "#/components/schemas/TransactionId"
          description: >-
            The identifier of this row, and the value to place in the path of the
            view operation. The baseline moves it into the row's TRNIDnnI field
            and, for the first and tenth rows, into the two cursor fields as well.
        # WHY : Refactoring Rationale: the row carries the full twenty-six-character
        #       origin timestamp, replacing the eight-character date column the
        #       screen rendered. That column was derived, not stored: app/cbl/
        #       COTRN00C.cbl L384 to L388 takes TRAN-ORIG-TS, slices the last two
        #       digits of the year with WS-TIMESTAMP-DT-YYYY(3:2), and assembles
        #       WS-CURDATE-MM-DD-YY, whose group at app/cpy/CSDAT01Y.cpy L30 to
        #       L35 is MM/DD/YY with a TWO-DIGIT year. Carrying that form on the
        #       wire would ship a value from which the century cannot be
        #       recovered, so the contract carries the source field and the client
        #       formats it for display.
        originTimestamp:
          allOf:
            - $ref: "#/components/schemas/Timestamp26"
          description: >-
            When the transaction originated. The baseline list row displays this
            value reduced to an eight-character MM/DD/YY date; the full stored
            value is carried here so no client has to guess a century.
        # WHY : Assumptions: the description is carried at its full copybook width
        #       of 100, not at the 26 the list row rendered. TDESCnnI is PIC X(26)
        #       on the map -- app/cpy-bms/COTRN00.CPY L90 for the first row -- so
        #       an alphanumeric MOVE at app/cbl/COTRN00C.cbl L395 truncates the
        #       X(100) record field to fit the screen. The copybook is the
        #       normative contract, so the API carries the whole value and lets
        #       the client truncate for its own column width; truncating here
        #       would discard 74 characters no consumer could recover.
        description:
          allOf:
            - $ref: "#/components/schemas/TransactionDescription"
          description: >-
            What the transaction was for, at the full width the record declares.
            The baseline list row renders only its first 26 characters.
        # WHY : Assumptions: the amount is carried at the record's nine integer
        #       digits, not the eight the screen's edited field holds. WS-TRAN-AMT
        #       is PIC +99999999.99 at app/cbl/COTRN00C.cbl L56 -- twelve
        #       positions, eight integer digits -- while the stored TRAN-AMT is
        #       S9(09)V99 at app/cpy/CVTRA05Y.cpy L10. The edited field is
        #       narrower than the record it renders, so honouring the screen width
        #       here would silently refuse the largest amounts the ledger can hold.
        amount:
          allOf:
            - $ref: "#/components/schemas/TransactionAmount"
          description: >-
            The signed amount, at the full precision the record declares rather
            than the narrower precision the screen's edited field renders.

    # WHY : Trade-offs: there is no member naming how many rows a full page holds
    #       and none naming an absolute page ordinal. app/cbl/COTRN00C.cbl L65
    #       declares CDEMO-CT00-PAGE-NUM PIC 9(08) and the baseline does maintain
    #       it -- incrementing it at L306 to L307 and testing it at L245 -- but it
    #       is display-only and never participates in a key comparison, and a
    #       cursor positioned by key cannot derive an absolute ordinal without
    #       enumerating everything ahead of it, which is the enumeration this
    #       design exists to avoid. What is given up is the ability to tell a user
    #       they are on page four of anything. The page size is likewise absent
    #       because the baseline disagrees with itself about it: seven rows in the
    #       card list against ten here.
    # WHY : Refactoring Rationale: FOUR members, and the required list names all
    #       four. An earlier revision declared seven -- the two boundary tokens plus
    #       a separate forward and backward request position and a backward
    #       availability indicator -- and required only three of them, so this
    #       document, its two sibling contracts and the shared record all described
    #       one envelope differently. Four is the shape the migration fixed and the
    #       shape the shared record now declares, and the required list is now
    #       identical in all three contracts so one generated client type reads a
    #       page from any of them. Nothing is lost: a page whose rows were all
    #       filtered away after being read carries its two scan positions in
    #       firstKey and lastKey, which is what they are on such a page, and a
    #       backward step is expressible exactly when firstKey is present.
    TransactionPage:
      type: object
      description: >-
        One page of transactions together with everything a caller needs to walk
        to the adjacent pages. The envelope publishes exactly four members --
        items, firstKey, lastKey and hasNext. firstKey and lastKey identify the
        first and last rows the caller received, and they are also the positions a
        further request is issued from: a forward step sends lastKey, a backward
        step sends firstKey, with the direction carried by the request's own
        direction parameter. Two further members named nextCursor and prevCursor
        were WITHDRAWN, as the comment below and the card contract's own envelope
        record, so no member of either name exists for a caller to copy.
      # WHY : Refactoring Rationale: the envelope is the FOUR members the shared
      #       response type declares -- items, firstKey, lastKey and hasNext, at
      #       services/common-lib/src/main/java/com/carddemo/common/web/PageResponse.java
      #       -- and every one of them is required. An earlier revision of this
      #       document published seven, adding nextCursor, prevCursor and hasPrev.
      #       Those three describe a body this service cannot send: the shared type
      #       has no such components, so a Jackson rendering of it omits them, and a
      #       generated client would have received three accessors that are always
      #       absent while a strict client would have rejected every valid response
      #       for missing a required member. The migration plan fixes the shape at
      #       four members, so the contract follows the type rather than the type
      #       following the contract. Absence of a row identity is spelled null --
      #       the member is present with a null value -- and not by the member being
      #       missing, which is why all four are required rather than only items.
      #       (2) Alternatives Considered: widening the shared type to seven so the
      #       longer contract could stand. Rejected because the two extra cursors
      #       would duplicate firstKey and lastKey, which already carry the positions
      #       a further request is issued from, and hasPrev is derivable from
      #       firstKey being non-null -- so the wider shape would publish three
      #       members a caller must be told how to reconcile with three others.
      required: [items, firstKey, lastKey, hasNext]
      additionalProperties: false
      properties:
        # WHY : Assumptions: the bound of ten is a BASELINE FACT, not a tuning
        #       choice, and the one program establishes it five separate times.
        #       app/cbl/COTRN00C.cbl L290 walks the row table with UNTIL WS-IDX >
        #       10, L297 reads forward with UNTIL WS-IDX >= 11, L344 repeats the
        #       first bound on the backward path, L349 primes the backward walk
        #       with MOVE 10 TO WS-IDX, and L351 counts it down with UNTIL WS-IDX
        #       <= 0. Because the number is the screen's row capacity rather than
        #       a preference, it is not a request parameter and a caller cannot
        #       widen it; a different value here would return more rows than the
        #       screen this operation replaces could ever show.
        items:
          type: array
          description: >-
            The rows of this page, in ascending transaction-id order, at most ten
            of them. An exhausted or empty result is an empty array rather than a
            null, so a caller never has to distinguish the two.
          maxItems: 10
          items:
            $ref: "#/components/schemas/TransactionSummary"
        firstKey:
          description: >-
            The sealed token naming this page's leading boundary: the first row in
            items, or -- on a page whose every row was filtered away after being
            read -- the key at which the backward scan stopped. Null when neither
            exists. A backward request replays it as the cursor parameter with
            direction `previous`, so its presence is what tells a caller a backward
            step is expressible. The baseline keeps the same value in
            CDEMO-CT00-TRNID-FIRST, declared at app/cbl/COTRN00C.cbl L63 and set
            from the first row at L392 to L393.
          oneOf:
            - $ref: "#/components/schemas/CursorToken"
            - type: "null"
        # WHY : Assumptions: lastKey identifies the last row the caller ACTUALLY
        #       RECEIVED and never the surplus row read to settle hasNext. That
        #       had to be chosen rather than inherited, because the two baseline
        #       browse screens disagree: the card list overwrites its stored last
        #       key with the probe row's key, so it retains a key for a row the
        #       terminal never displayed, whereas this service's own program does
        #       not -- app/cbl/COTRN00C.cbl sets CDEMO-CT00-TRNID-LAST inside the
        #       tenth row's branch at L437 to L439, and its probe read at L308
        #       runs after the page loop has finished and never touches that
        #       field. A token naming a row the caller never received cannot be
        #       verified by that caller.
        lastKey:
          description: >-
            The sealed token naming this page's trailing boundary: the last row in
            items -- a row the caller received, never the extra row read to
            establish whether a further page follows -- or, on a filtered-away
            page, the key at which the forward scan stopped. Null when neither
            exists, and present whenever hasNext is true. A forward request replays
            it as the cursor parameter with direction `next`. The baseline keeps
            the same value in CDEMO-CT00-TRNID-LAST at app/cbl/COTRN00C.cbl L64.
          oneOf:
            - $ref: "#/components/schemas/CursorToken"
            - type: "null"
        # WHY : Assumptions: hasNext is established by asking the store for one row
        #       beyond the page and observing whether that row exists, never from
        #       a tally of rows or pages. The baseline does exactly this: after
        #       its page loop app/cbl/COTRN00C.cbl performs one further read at
        #       L308 and sets NEXT-PAGE-YES at L310 or NEXT-PAGE-NO at L312, the
        #       condition names declared at L67 and L68 against
        #       CDEMO-CT00-NEXT-PAGE-FLG at L66. That surplus row is never placed
        #       in items.
        hasNext:
          type: boolean
          description: >-
            Whether a further page follows this one, discovered by reading one row
            beyond the page. When it is false, a forward request would return no
            rows and the baseline answers the attempt with "You are already at the
            bottom of the page..." from app/cbl/COTRN00C.cbl L270.

        # WHY : Trade-offs: no member states whether a page PRECEDES this one, and the
        #       answer is the presence of firstKey instead. The envelope has four
        #       members and a backward indicator is not one of them, and the question
        #       a client actually asks of a response is whether it holds something to
        #       page backward from. The cost is that an opening page, which names its
        #       own first row like every other page, offers a backward step that
        #       returns an empty page; that is the same answer the baseline gives,
        #       which reports "You are already at the top of the page..." at
        #       app/cbl/COTRN00C.cbl L248 rather than withholding the key.

    TransactionDescription:
      type: string
      description: >-
        Free text describing a transaction, at the width the record declares:
        TRAN-DESC PIC X(100) at app/cpy/CVTRA05Y.cpy L9, stored as description
        VARCHAR(100) at V1__ledger.sql L166. The view screen renders 60
        characters of it and the list row 26, both narrower than the record.
      maxLength: 100
      examples:
        - "BILL PAYMENT - ONLINE"

    # WHY : Assumptions: two DIGIT characters, not two characters of any kind. The
    #       Java request record holds the same value to a digits-only expression and
    #       carries the reference program's own message for a violation, "Type CD
    #       must be Numeric..." at app/cbl/COTRN02C.cbl L325, so the digit domain is
    #       the service's rule and this schema restated only half of it. The sibling
    #       category code already publishes its digit shape, which is what made the
    #       omission here visible.
    # WHY : Trade-offs: the shape is published and the VALUE SET is still not. The
    #       committed reference data holds 01 through 07 (app/data/ASCII/trantype.txt),
    #       but the domain is owned by the reference context and a type added there
    #       must not require an edit here, so an enumeration would be a second
    #       authority that drifts. A pattern bounds the shape without claiming the
    #       set.
    TransactionTypeCode:
      type: string
      description: >-
        The transaction type code: exactly two decimal digits. Declared
        TRAN-TYPE-CD PIC X(02) at app/cpy/CVTRA05Y.cpy L6 and stored as
        type_cd CHAR(2) at
        V1__ledger.sql L132. The domain is owned by the reference context, so no
        enumeration is asserted here.
      minLength: 2
      maxLength: 2
      # WHY : Refactoring Rationale: the digit pattern is DECLARED and an earlier
      #       revision asserted the constraint in the description alone, promising
      #       that a non-numeric value is refused with "Type CD must be Numeric..."
      #       while admitting one structurally. The reference program tests the
      #       field NOT NUMERIC at app/cbl/COTRN02C.cbl L331, so the constraint is
      #       real; a description a validator cannot read is not a contract.
      pattern: "^[0-9]{2}$"
      examples:
        - "01"

    # WHY : Assumptions: four digits as a string, because the record declares
    #       TRAN-CAT-CD PIC 9(04) at app/cpy/CVTRA05Y.cpy L7 and the committed
    #       data is zero-padded to that width -- record 1 of
    #       app/data/ASCII/dailytran.txt carries "0001" at one-based bytes 19 to
    #       22. The baseline validates the field with a NOT NUMERIC test at
    #       app/cbl/COTRN02C.cbl L331, a digits-only check on characters, and
    #       V1__ledger.sql L146 stores it as category_cd CHAR(4) rather than as a
    #       number for the same reason.
    TransactionCategoryCode:
      type: string
      description: >-
        The transaction category code: exactly four decimal digits, zero-padded on
        the left. Declared TRAN-CAT-CD PIC 9(04) at app/cpy/CVTRA05Y.cpy L7 and
        stored as category_cd CHAR(4) at V1__ledger.sql L146.
      minLength: 4
      maxLength: 4
      pattern: "^[0-9]{4}$"
      examples:
        - "0001"

    TransactionSource:
      type: string
      description: >-
        Where the transaction entered the system. Declared TRAN-SOURCE PIC X(10)
        at app/cpy/CVTRA05Y.cpy L8 and stored as source CHAR(10) at
        V1__ledger.sql L156. The baseline writes POS TERM for both an added
        transaction's default and a bill payment, at app/cbl/COBIL00C.cbl L222.
      maxLength: 10
      examples:
        - "POS TERM"

    # WHY : Assumptions: nine digits as a string, following the same measurement as
    #       the other identifiers. app/cpy/CVTRA05Y.cpy L11 declares
    #       TRAN-MERCHANT-ID PIC 9(09), record 1 of app/data/ASCII/dailytran.txt
    #       carries "800000000" at one-based bytes 144 to 152, and the baseline
    #       validates it with a NOT NUMERIC test at app/cbl/COTRN02C.cbl L432.
    #       V1__ledger.sql L187 stores it as merchant_id BIGINT, so the declared
    #       width here is what restores the padding on the way out; the
    #       already-authored view DTO likewise declares it a string.
    MerchantId:
      type: string
      description: >-
        The merchant identifier: exactly nine decimal digits, zero-padded on the
        left. Declared TRAN-MERCHANT-ID PIC 9(09) at app/cpy/CVTRA05Y.cpy L11 and
        held as merchant_id BIGINT at V1__ledger.sql L187. A bill payment writes
        the fixed value 999999999, per app/cbl/COBIL00C.cbl L226.
      minLength: 9
      maxLength: 9
      pattern: "^[0-9]{9}$"
      examples:
        - "800000000"

    # WHY : Assumptions: the fourteen members and their names mirror the
    #       already-authored
    #       services/transaction-service/src/main/java/com/carddemo/transaction/dto/TransactionDetailResponse.java
    #       L315 to L344 component for component, because that record is what this
    #       operation serialises. Its order is the record's own declaration order
    #       from app/cpy/CVTRA05Y.cpy L5 to L17 rather than the order the baseline
    #       happened to move the fields to the screen in, so a reader comparing
    #       this schema against the copybook reads both top to bottom.
    TransactionDetail:
      type: object
      description: >-
        One transaction in full: the thirteen record fields the baseline view
        screen displays, plus the message line that screen carries. The thirteen
        are the thirteen MOVE statements at app/cbl/COTRN01C.cbl L178 to L190,
        counted in the source and confirmed to be exactly thirteen.
      # WHY : Refactoring Rationale: every property below is REQUIRED, including the nullable
      #       ones, and that is a correction rather than a tightening. carddemo-common-defaults.yml
      #       pins default-property-inclusion to always, so every record component is written on
      #       every response and a nullable member arrives as null, NEVER absent. Publishing such
      #       a member as optional described an omission this service cannot produce, and generated
      #       a type that was optional AND nullable -- two states for one fact.
      required:
        - transactionId
        - typeCode
        - categoryCode
        - source
        - description
        - amount
        - merchantId
        - merchantName
        - merchantCity
        - merchantZip
        - cardNumber
        - originTimestamp
        - processTimestamp
        - returnMessage
      additionalProperties: false
      properties:
        transactionId:
          allOf:
            - $ref: "#/components/schemas/TransactionId"
          description: >-
            The identifier of this transaction, moved to the screen at
            app/cbl/COTRN01C.cbl L178.
        typeCode:
          allOf:
            - $ref: "#/components/schemas/TransactionTypeCode"
          description: >-
            The transaction type code, moved to the screen at
            app/cbl/COTRN01C.cbl L180.
        categoryCode:
          allOf:
            - $ref: "#/components/schemas/TransactionCategoryCode"
          description: >-
            The transaction category code, moved to the screen at
            app/cbl/COTRN01C.cbl L181.
        source:
          allOf:
            - $ref: "#/components/schemas/TransactionSource"
          description: >-
            Where the transaction entered the system, moved to the screen at
            app/cbl/COTRN01C.cbl L182.
        description:
          allOf:
            - $ref: "#/components/schemas/TransactionDescription"
          description: >-
            What the transaction was for, moved to the screen at
            app/cbl/COTRN01C.cbl L184, where the map field TDESCI PIC X(60) at
            app/cpy-bms/COTRN01.CPY L96 renders 60 of the record's 100 characters.
        amount:
          allOf:
            - $ref: "#/components/schemas/TransactionAmount"
          description: >-
            The signed amount. The baseline edits it into WS-TRAN-AMT at
            app/cbl/COTRN01C.cbl L177 and moves the edited form to the screen at
            L183; this contract carries the record's own precision instead of the
            edited field's narrower eight integer digits.
        merchantId:
          allOf:
            - $ref: "#/components/schemas/MerchantId"
          description: >-
            The merchant identifier, moved to the screen at app/cbl/COTRN01C.cbl
            L187.
        merchantName:
          type: string
          description: >-
            The merchant's name, at the record's declared width. Declared
            TRAN-MERCHANT-NAME PIC X(50) at app/cpy/CVTRA05Y.cpy L12 and stored
            as merchant_name VARCHAR(50) at V1__ledger.sql L195. Moved to the
            screen at app/cbl/COTRN01C.cbl L188, where MNAMEI PIC X(30) at
            app/cpy-bms/COTRN01.CPY L126 renders 30 of the 50.
          maxLength: 50
          examples:
            - "BILL PAYMENT"
        merchantCity:
          type: string
          description: >-
            The merchant's city, at the record's declared width. Declared
            TRAN-MERCHANT-CITY PIC X(50) at app/cpy/CVTRA05Y.cpy L13 and stored
            as merchant_city VARCHAR(50) at V1__ledger.sql L199. Moved to the
            screen at app/cbl/COTRN01C.cbl L189, where MCITYI PIC X(25) at
            app/cpy-bms/COTRN01.CPY L132 renders 25 of the 50.
          maxLength: 50
          examples:
            - "N/A"
        merchantZip:
          type: string
          description: >-
            The merchant's postal code. Declared TRAN-MERCHANT-ZIP PIC X(10) at
            app/cpy/CVTRA05Y.cpy L14 and stored as merchant_zip CHAR(10) at
            V1__ledger.sql L206. Moved to the screen at app/cbl/COTRN01C.cbl L190.
          maxLength: 10
          examples:
            - "N/A"
        cardNumber:
          allOf:
            - $ref: "#/components/schemas/MaskedCardNumber"
          description: >-
            The card the transaction was made on, masked to its last four digits.
            The baseline moves all sixteen characters to the screen at
            app/cbl/COTRN01C.cbl L179; this contract carries the masked form only.
        originTimestamp:
          allOf:
            - $ref: "#/components/schemas/Timestamp26"
          description: >-
            When the transaction originated, moved to the screen at
            app/cbl/COTRN01C.cbl L185.
        # WHY : Assumptions: NULLABLE, because the reference data proves the field
        #       is legitimately empty before posting. TRAN-PROC-TS is declared PIC
        #       X(26) at app/cpy/CVTRA05Y.cpy L17, and in
        #       app/data/ASCII/dailytran.txt ALL 300 records carry twenty-six
        #       spaces at one-based bytes 305 to 330 -- the pre-posting feed has no
        #       processing timestamp yet. Declaring it required would make every
        #       record in the committed seed data unrepresentable. The batch
        #       context that posts a transaction is what fills it, which is why
        #       V1__ledger.sql L245 can declare the column NOT NULL for posted
        #       rows while this response still admits its absence.
        processTimestamp:
          description: >-
            When the transaction was processed, or null when it has not been
            processed yet. Moved to the screen at app/cbl/COTRN01C.cbl L186.
          oneOf:
            - $ref: "#/components/schemas/Timestamp26"
            - type: "null"
        returnMessage:
          allOf:
            - $ref: "#/components/schemas/ReturnMessage"
          description: >-
            The message line the view screen carried for this transaction, or
            null when the read set none. A successful read sets no message, so
            null is the ordinary value here.

    # WHY : Assumptions: seventy-five characters, and NULLABLE, both taken from
    #       app/cpy/CVCRD01Y.cpy. L28 declares CCARD-ERROR-MSG PIC X(75) and L29
    #       declares CCARD-RETURN-MSG PIC X(75), and L30 attaches the condition
    #       name CCARD-RETURN-MSG-OFF with VALUE LOW-VALUES to the return message
    #       alone. Low values and spaces are NOT interchangeable there: an absent
    #       message and a message that is present but empty are different states,
    #       so absence maps to null and is not folded into the empty string.
    #       ApiError.MESSAGE_RENDERING_WIDTH is 75 for the same reason.
    # WHY : Trade-offs: three other message widths exist in the baseline and none
    #       of them is this one. Fifty characters govern the shared constants at
    #       app/cpy/CSMSG01Y.cpy L18 and L20, seventy-two the abend message at
    #       app/cpy/CSMSG02Y.cpy L28, and seventy-eight the map fields ERRMSGI and
    #       ERRMSGO -- app/cpy-bms/COTRN00.CPY L372 and L728,
    #       app/cpy-bms/COTRN01.CPY L144 and L272, app/cpy-bms/COTRN02.CPY L144
    #       and L272, app/cpy-bms/COBIL00.CPY L78 and L140. Choosing 75 accepts
    #       that a longer sentence a map could have rendered will not fit this
    #       field. The eighty-character WS-MESSAGE at app/cbl/COTRN01C.cbl L38 is
    #       deliberately NOT a fourth wire width: L217 moves it into an X(78) map
    #       field, so the program itself truncates two bytes, which makes it a
    #       work field rather than a contract.
    ReturnMessage:
      description: >-
        The single-sentence message line a screen carried, or null when no message
        is set. It is reproduced character for character from the copybook or
        program constant that supplies it, trailing ellipsis included. Null means
        no message; an empty string means a message that is present and empty, and
        the two are distinct.
      oneOf:
        - type: string
          description: >-
            The message text, at the seventy-five-character width
            app/cpy/CVCRD01Y.cpy L29 declares.
          maxLength: 75
        - type: "null"

    # WHY : Assumptions: at least one of accountId and cardNumber, expressed as a
    #       schema constraint rather than left to prose, because the baseline
    #       refuses a request carrying neither and derives whichever it was not
    #       given. app/cbl/COTRN02C.cbl L196 takes the account-id branch when that
    #       field is not blank and fills the card number in from the
    #       cross-reference at L209; L210 takes the card-number branch -- only when
    #       no account identifier was supplied, because L196 has precedence -- and
    #       fills the account id in at L223; L224 to L226 refuses a request
    #       carrying neither with "Account or Card Number must be entered...".
    #       Requiring both would reject a request the baseline accepts, requiring
    #       neither would admit one it refuses, and requiring exactly one -- which
    #       an earlier revision did -- rejected a request the baseline captures on
    #       the account arm while silently discarding the card number.
    # WHY : Refactoring Rationale: the confirmation IS published, as an optional
    #       property. An earlier revision omitted it, reasoning that a confirmation
    #       is a terminal interaction step and an HTTP request either asks for the
    #       write or does not. The Java request record disagrees, and it is the one
    #       the runtime binds: it declares a confirmation component constrained to
    #       the baseline's value domain, and because that constraint admits an absent
    #       value there was nothing to reject a request that carried none -- so with
    #       the property absent from this schema and additionalProperties false, the
    #       component was unreachable and the confirm-before-write gate the reference
    #       program applies at app/cbl/COTRN02C.cbl L169 to L188 could never be
    #       exercised. Publishing the property restores the gate; leaving it optional
    #       preserves the reference's own first-turn behaviour, where a blank
    #       confirmation asks for another turn at L178 rather than rejecting the
    #       submission.
    TransactionCreateRequest:
      type: object
      description: >-
        The fields the baseline add screen collects, migrated from
        app/cbl/COTRN02C.cbl. The transaction identifier is absent by design: the
        service assigns it, per L444 to L451. The confirmation the screen collects
        is present, and is the last member below, because the baseline decides
        between writing and prompting on that one character at L169 to L188 and
        answers each of its three states differently.
      required:
        - typeCode
        - categoryCode
        - source
        - description
        - amount
        - originDate
        - processDate
        - merchantId
        - merchantName
        - merchantCity
        - merchantZip
      additionalProperties: false
      # WHY : Refactoring Rationale: confirm is PUBLISHED below, and an earlier
      #       revision omitted it and argued that "a confirmation is a terminal
      #       interaction step and an HTTP request either asks for the write or
      #       does not". Two things were wrong with that. It contradicted the
      #       already-authored request record
      #       services/transaction-service/.../dto/TransactionAddRequest.java,
      #       which carries the component and constrains its value, so this
      #       document described a body the service does not bind; and it discarded
      #       a behaviour the baseline has - app/cbl/COTRN02C.cbl L169 to L188
      #       answers a blank confirmation with the prompt at L178, which asks for
      #       another turn, and an unrecognised character with the complaint at
      #       L184, so the field distinguishes three outcomes rather than two.
      #       Dropping it would also have left this contract disagreeing with its
      #       own bill-payment operation, which models the identical field.
      # WHY : ⚠️ Refactoring Rationale: anyOf, where this was oneOf with a `not` on
      #       each branch -- so it required EXACTLY one key and refused a body
      #       carrying both. That refused a submission the baseline captures. The
      #       reference's paragraph SELECTS rather than validates: L196 takes the
      #       account arm and the card arm at L210 is then never evaluated at all, so
      #       a body carrying both is processed on the account and the card number is
      #       discarded at L209 by the cross-reference lookup. No branch in the
      #       paragraph reports a contradiction and no sentence exists for one. The
      #       exclusive form also made the account-first precedence unreachable: the
      #       body was rejected at validation, before the service could apply it.
      #       Assumptions: the only refusal the paragraph contains is the
      #       fall-through at L224 to L226, reached when NEITHER key was supplied and
      #       answered with "Account or Card Number must be entered...". anyOf is
      #       exactly that: at least one branch must hold.
      #       Trade-offs: a caller may now send a card number that disagrees with the
      #       account and receive a success naming neither the disagreement nor the
      #       value that won. Accepted because it is the baseline's behaviour;
      #       reporting the conflict would refuse submissions this screen accepts.
      anyOf:
        - required: [accountId]
          description: >-
            The account-id form, which is also the form a both-keys submission
            resolves through. The card number is resolved from the
            cross-reference, as the baseline does at app/cbl/COTRN02C.cbl L206 to
            L209, and a card number supplied alongside is discarded by that lookup.
        - required: [cardNumber]
          description: >-
            The card-number form, reached only when no account identifier was
            supplied. The account identifier is resolved from the
            cross-reference, as the baseline does at app/cbl/COTRN02C.cbl L220 to
            L223. Taken only when no account identifier was supplied, because L196
            gives that field precedence.
      properties:
        accountId:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          description: >-
            The account to attribute the transaction to, supplied instead of a
            card number. A value that is not eleven digits is refused with
            "Account ID must be Numeric..." verbatim from app/cbl/COTRN02C.cbl
            L199.
        cardNumber:
          allOf:
            - $ref: "#/components/schemas/CardNumber"
          description: >-
            The card to attribute the transaction to, supplied instead of an
            account identifier. A value that is not sixteen digits is refused with
            "Card Number must be Numeric..." verbatim from app/cbl/COTRN02C.cbl
            L213.
        typeCode:
          allOf:
            - $ref: "#/components/schemas/TransactionTypeCode"
          description: >-
            The transaction type code. An absent value is refused with "Type CD
            can NOT be empty..." verbatim from app/cbl/COTRN02C.cbl L254, and a
            non-numeric one with "Type CD must be Numeric..." from L325.
        categoryCode:
          allOf:
            - $ref: "#/components/schemas/TransactionCategoryCode"
          description: >-
            The transaction category code. An absent value is refused with
            "Category CD can NOT be empty..." verbatim from app/cbl/COTRN02C.cbl
            L260, and a non-numeric one with "Category CD must be Numeric..." from
            L331.
        source:
          allOf:
            - $ref: "#/components/schemas/TransactionSource"
          description: >-
            Where the transaction entered the system. An absent value is refused
            with "Source can NOT be empty..." verbatim from app/cbl/COTRN02C.cbl
            L266.
          minLength: 1
        description:
          allOf:
            - $ref: "#/components/schemas/TransactionDescription"
          description: >-
            What the transaction was for. An absent value is refused with
            "Description can NOT be empty..." verbatim from app/cbl/COTRN02C.cbl
            L272.
          minLength: 1
        amount:
          allOf:
            - $ref: "#/components/schemas/TransactionAmount"
          description: >-
            The signed amount. An absent value is refused with "Amount can NOT be
            empty..." verbatim from app/cbl/COTRN02C.cbl L278. The baseline parses
            the screen field with FUNCTION NUMVAL-C at L456 into WS-TRAN-AMT-N PIC
            S9(9)V99 declared at L58, which is the nine-integer-digit bound this
            type carries.
        originDate:
          allOf:
            - $ref: "#/components/schemas/DateOnly10"
          description: >-
            The date the transaction originated. An absent value is refused with
            "Orig Date can NOT be empty..." verbatim from app/cbl/COTRN02C.cbl
            L284, and an unparseable one with "Orig Date - Not a valid date..."
            from L401.
        processDate:
          allOf:
            - $ref: "#/components/schemas/DateOnly10"
          description: >-
            The date the transaction is to be processed. An absent value is
            refused with "Proc Date can NOT be empty..." verbatim from
            app/cbl/COTRN02C.cbl L290, and an unparseable one with "Proc Date -
            Not a valid date..." from L421.
        merchantId:
          allOf:
            - $ref: "#/components/schemas/MerchantId"
          description: >-
            The merchant identifier. An absent value is refused with "Merchant ID
            can NOT be empty..." verbatim from app/cbl/COTRN02C.cbl L296, and a
            non-numeric one with "Merchant ID must be Numeric..." from L432.
        merchantName:
          type: string
          description: >-
            The merchant's name, at the width TRAN-MERCHANT-NAME PIC X(50) declares
            at app/cpy/CVTRA05Y.cpy L12. An absent value is refused with "Merchant
            Name can NOT be empty..." verbatim from app/cbl/COTRN02C.cbl L302.
          minLength: 1
          maxLength: 50
        merchantCity:
          type: string
          description: >-
            The merchant's city, at the width TRAN-MERCHANT-CITY PIC X(50) declares
            at app/cpy/CVTRA05Y.cpy L13. An absent value is refused with "Merchant
            City can NOT be empty..." verbatim from app/cbl/COTRN02C.cbl L308.
          minLength: 1
          maxLength: 50
        merchantZip:
          type: string
          description: >-
            The merchant's postal code, at the width TRAN-MERCHANT-ZIP PIC X(10)
            declares at app/cpy/CVTRA05Y.cpy L14. An absent value is refused with
            "Merchant Zip can NOT be empty..." verbatim from app/cbl/COTRN02C.cbl
            L314.
          minLength: 1
          maxLength: 10
        # WHY : (1) Assumptions: the member is OPTIONAL where the bill-payment body
        #       requires its own, and the asymmetry is the baseline's rather than a
        #       preference. app/cbl/COTRN02C.cbl L169 to L172 writes only for 'Y' or
        #       'y', while L173 to L176 place 'N', 'n', SPACES and LOW-VALUES on one
        #       branch that writes nothing and asks for a confirmation, so an absent
        #       value is the first turn of an exchange the baseline conducts rather
        #       than a malformed submission. Requiring it here would refuse that
        #       turn. A bill payment requires its confirmation because the
        #       unconfirmed turn there reports a stored balance the caller cannot
        #       compute; an add carries every value it needs already.
        #       (2) Assumptions: one Confirmation schema serves both request bodies,
        #       because L184 of that program and L187 of app/cbl/COBIL00C.cbl refuse
        #       an out-of-domain character with the identical sentence and both
        #       screens declare the field one character wide. A second
        #       one-character enumeration declared here would put one value domain
        #       in two places that could then disagree while both went on parsing.
        #       (3) Assumptions: SPACES and LOW-VALUES are distinct byte states in
        #       the baseline and share the prompt branch only at L175 and L176. Both
        #       reach this contract as an absent member, so nothing here restates
        #       the distinction.
        confirmation:
          allOf:
            - $ref: "#/components/schemas/Confirmation"
          description: >-
            Whether to write the transaction. A confirming value writes it and is
            answered with 201; a declining or absent value writes nothing and is
            answered with 200 carrying the prompt "Confirm to add this
            transaction..." verbatim from app/cbl/COTRN02C.cbl L178; any other
            character is refused with "Invalid value. Valid values are (Y/N)..."
            verbatim from L184.

    # WHY : (1) Assumptions: this shape carries no transaction identifier, because
    #       on the turn it describes the baseline has not minted one. The identifier
    #       is generated inside ADD-TRANSACTION at app/cbl/COTRN02C.cbl L442 to
    #       L449, which the confirmation branch at L173 to L176 never reaches, so an
    #       identifier member here could only ever be empty or invented.
    #       (2) Assumptions: the amount IS carried, because the baseline has already
    #       normalised it by this point and shows the operator the result -- L385
    #       edits the parsed value and L386 writes that edited form back into the
    #       keyed screen field, both of which run at L167 before the confirmation is
    #       examined at L169.
    #       (3) Trade-offs: this is a second reported shape for one operation, where
    #       a single shape with everything nullable would have been fewer lines. The
    #       cost accepted is the extra schema; what it buys is that the 201 body can
    #       require its identifier, which a shared shape could not, so a client
    #       cannot receive a body that claims a capture without naming it. The
    #       bill-payment operation in this document makes the same trade with its own
    #       preview and response pair.
    TransactionAddPreview:
      type: object
      description: >-
        What an add would capture, returned when the confirmation was withheld and
        nothing was written. It mirrors the baseline turn at app/cbl/COTRN02C.cbl
        L166 to L181, which validates the submission, normalises the amount and
        then asks for a confirmation without writing.
      # WHY : Refactoring Rationale: every property below is REQUIRED, including the nullable
      #       ones, and that is a correction rather than a tightening. carddemo-common-defaults.yml
      #       pins default-property-inclusion to always, so every record component is written on
      #       every response and a nullable member arrives as null, NEVER absent. Publishing such
      #       a member as optional described an omission this service cannot produce, and generated
      #       a type that was optional AND nullable -- two states for one fact.
      required:
        [amount, written, returnMessage, resolvedAccountId, resolvedCardNumber, copied]
      additionalProperties: false
      properties:
        amount:
          allOf:
            - $ref: "#/components/schemas/TransactionAmount"
          description: >-
            The normalised amount a confirmed submission would be captured at, as
            parsed and edited at app/cbl/COTRN02C.cbl L383 to L385 and written back
            into the keyed field at L386.
        written:
          type: boolean
          description: >-
            Always false on this response. It is stated explicitly rather than
            implied by the status code so that a client logging or replaying the
            body alone cannot mistake a prompt for a capture.
          const: false
        # WHY : Assumptions: the member is the shared message line rather than a
        #       locally declared string, so the seventy-five-character width and the
        #       null-versus-empty distinction at app/cpy/CVCRD01Y.cpy L29 and L30 are
        #       stated in one place. On this response it carries the prompt at
        #       app/cbl/COTRN02C.cbl L178, which that branch always sets.
        returnMessage:
          $ref: "#/components/schemas/ReturnMessage"
        # WHY : ⚠️ Refactoring Rationale: this PAIR is published on every withheld
        #       answer, and it was declared inside CopiedTransactionData -- which the
        #       copy operation alone attaches -- so an ordinary capture published
        #       neither. The reference resolves and repaints BOTH key fields on every
        #       turn: L166 performs VALIDATE-INPUT-KEY-FIELDS for the Enter arm as
        #       L473 does for the copy arm, L209 moves the cross-reference's card
        #       number into CARDNINI on the account path, L221 moves the entry's
        #       account identifier into ACTIDINI on the card path, and L173 to L176
        #       then re-send the screen. So the operator giving the confirming
        #       keystroke has already been shown the resolved pair; a client that
        #       could not read it rendered the key that was TYPED while this service
        #       wrote the key it resolved.
        # WHY : Assumptions: the pair lives HERE rather than in a second identity
        #       object beside the copied one. Two objects would both describe one
        #       screen state and a client would have to choose which it was
        #       confirming; one pair on the shape both turns answer with keeps one
        #       answer per call.
        resolvedAccountId:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          description: >-
            The account identifier the key resolution settled on. On the account path
            it is the submitted value converted to its eleven declared positions,
            which app/cbl/COTRN02C.cbl L206 moves back into the screen's own field;
            on the card path it is the cross-reference entry's account, which L221
            moves into that field.
        resolvedCardNumber:
          allOf:
            - $ref: "#/components/schemas/CardNumber"
          description: >-
            The card number the cross-reference resolved, in full and unmasked. It is
            the value app/cbl/COTRN02C.cbl L209 moves over the screen's card field on
            the account path, and the value L459 then stores. It is published
            unmasked because a suffix cannot distinguish two cards on one account,
            which is the only comparison this disclosure exists to support; the
            sensitive-data prohibition is on durable diagnostics, which is why the
            record's own rendering withholds it and this body does not.
        # WHY : ⚠️ Refactoring Rationale: this member is new, and the omission it
        #       closes was a WRITE hazard rather than a display gap. The copy-last
        #       operation used to answer with the normalised amount alone, so a
        #       browser could restore one of the eleven values the copy block moves
        #       and had no way to hold the other ten -- which forced its confirming
        #       turn back through the copy operation, re-resolving which row is last
        #       and silently replacing what the operator had previewed with any row
        #       appended in between. Publishing the copied members lets the
        #       confirming turn use the ordinary capture operation, so "last" is
        #       resolved exactly once per action, as it is at
        #       app/cbl/COTRN02C.cbl L471 to L495.
        # WHY : Assumptions: the member is NULL on the capture operation's own
        #       withheld turn, which copies nothing, and both operations keep
        #       pointing at this one schema. Declaring a third response shape for a
        #       single differing member would have duplicated the other three plus
        #       the status mapping; the reasoning is recorded in full at
        #       CopiedTransactionData.java.
        copied:
          oneOf:
            - $ref: "#/components/schemas/CopiedTransactionData"
            - type: "null"
          description: >-
            The ten data members a copy-last turn lifted out of the stored row,
            paired with that row's identifier, or null on the ordinary capture
            operation. The eleventh copied value is the normalised amount this same
            body publishes above: ten of the eleven moves at app/cbl/COTRN02C.cbl
            L482 to L492 are plain field-to-field moves, while the amount is the one
            value TRANSFORMED on its way to the screen -- L481 renders it through
            WS-TRAN-AMT-E PIC +99999999.99 and L485 moves that rendering -- so
            repeating it inside this member would publish one figure twice.

    # WHY : ⚠️ Refactoring Rationale: this request schema is new, and it exists
    #       because the copy-last operation was declared over
    #       TransactionCreateRequest -- whose eleven data members are each required
    #       -- so the action was reachable only from a screen that was already
    #       filled in. app/cbl/COTRN02C.cbl L473 performs VALIDATE-INPUT-KEY-FIELDS
    #       and nothing else before the read, and L481 to L492 then FILL those
    #       eleven fields, so they are the action's output rather than its input.
    # WHY : Alternatives Considered: keeping the shared request body and having a
    #       client send placeholder values for the eleven members. Rejected because
    #       it puts invented data on the wire -- values no operator keyed, validated
    #       as though they had been. Also considered: relaxing the eleven members to
    #       optional on the shared shape, rejected because they are genuinely
    #       required by the CAPTURE operation and one schema cannot state two
    #       obligations.
    # WHY : Assumptions: the two key members and the confirmation point at the SAME
    #       component schemas the capture request points at. They are the same three
    #       screen controls, and a second declaration is how two operations come to
    #       refuse different values for one control.
    CopyLastRequest:
      type: object
      description: >-
        What a copy-last submission carries: the key that selects the account, and
        the operator's confirmation. Migrated from COPY-LAST-TRAN-DATA at
        app/cbl/COTRN02C.cbl L471, whose first statement at L473 validates the key
        fields and whose L481 to L492 then fill the eleven data fields from the
        copied record.


        At least one of accountId and cardNumber must be supplied. Supplying
        neither is refused with the sentence L226 moves, reported against both
        members because either is the one the operator may fill in. Supplying both
        is accepted and the account resolves first, which is the baseline's own
        ordered selection at L195.
      additionalProperties: false
      # WHY : Assumptions: anyOf and not oneOf, for the reason the capture body's own
      #       block records at length: the reference's paragraph SELECTS rather than
      #       validates, so a body carrying both keys is processed on the account and
      #       the card number is discarded by the cross-reference lookup at L209. An
      #       exclusive form would refuse a submission the baseline captures. Both
      #       bodies express one rule because L473 and L133 perform one paragraph.
      anyOf:
        - required: [accountId]
          description: >-
            The account-id form, which is also the form a both-keys submission
            resolves through.
        - required: [cardNumber]
          description: >-
            The card-number form, reached only when no account identifier was
            supplied.
      properties:
        accountId:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          description: >-
            The account the copied transaction is recorded against, keyed at
            ACTIDINI PIC X(11) on app/cpy-bms/COTRN02.CPY L60. A non-numeric value
            is refused with "Account ID must be Numeric..." verbatim from
            app/cbl/COTRN02C.cbl L199.
        cardNumber:
          allOf:
            - $ref: "#/components/schemas/CardNumber"
          description: >-
            The card the copied transaction is recorded against, keyed at CARDNINI
            PIC X(16) on app/cpy-bms/COTRN02.CPY L66. A non-numeric value is
            refused with "Card Number must be Numeric..." verbatim from
            app/cbl/COTRN02C.cbl L213.
        confirmation:
          allOf:
            - $ref: "#/components/schemas/Confirmation"
          description: >-
            Whether to write the copied transaction. A confirming value copies and
            writes in one turn, which is the reference's own fall-through at L495
            into PROCESS-ENTER-KEY, and is answered with 201; a declining or absent
            value copies without writing and is answered with 200 carrying the
            copied members and the prompt from L178.

    # WHY : Assumptions: this schema is CLOSED and every member is required, on the
    #       same reasoning the shape that carries it records: the services pin
    #       default-property-inclusion to always, so every record component is
    #       written on every response and none of these can be absent.
    # WHY : Assumptions: NO key member appears here -- no account identifier, no card
    #       number and no confirmation. The copy block at app/cbl/COTRN02C.cbl L480
    #       to L493 moves nothing into those three, so a browser adopting this shape
    #       leaves its own key controls and its confirmation exactly as the operator
    #       left them, which is what makes the copied capture land against the
    #       account being worked on rather than the account the copied row belonged
    #       to.
    CopiedTransactionData:
      type: object
      description: >-
        What a copy-last turn put on the screen, migrated from COPY-LAST-TRAN-DATA at
        app/cbl/COTRN02C.cbl L471 to L495. That paragraph writes nothing: it moves
        eleven values out of the row it read into the unprotected map fields the
        operator is looking at and then performs PROCESS-ENTER-KEY at L495, so
        everything a confirming turn writes is read off the screen and the row that
        was copied is never consulted again. This shape is that screen state.
      required:
        - sourceTransactionId
        - typeCode
        - categoryCode
        - source
        - description
        - merchantId
        - merchantName
        - merchantCity
        - merchantZip
        - originDate
        - processDate
      additionalProperties: false
      properties:
        # WHY : Assumptions: the identifier is published as ITSELF and is not sealed,
        #       because every other transaction operation publishes it as itself --
        #       the detail operation is keyed by it -- so sealing it here would
        #       introduce a second spelling of one identity while masking nothing: a
        #       ledger identifier is neither a primary account number nor sensitive
        #       authentication data.
        sourceTransactionId:
          allOf:
            - $ref: "#/components/schemas/TransactionId"
          description: >-
            Identifier of the row these members were copied out of. It is what makes
            the preview a STABLE reference to one stored row: a caller holding it can
            tell that two copy turns copied the same row, and an audit of the
            appended capture can name the row it was taken from.
        # WHY : Assumptions: the six members below point at the SAME component
        #       schemas TransactionCreateRequest points at, rather than restating
        #       their widths and patterns. A copied value is a value that came out of
        #       the ledger and is about to be submitted BACK through the capture
        #       operation, so any bound stated more loosely here would publish a value
        #       that body would then refuse -- and stating it twice is how the two
        #       come to disagree.
        typeCode:
          allOf:
            - $ref: "#/components/schemas/TransactionTypeCode"
          description: >-
            The copied transaction type, from app/cbl/COTRN02C.cbl L482;
            TRAN-TYPE-CD PIC X(02) at app/cpy/CVTRA05Y.cpy L6.
        categoryCode:
          allOf:
            - $ref: "#/components/schemas/TransactionCategoryCode"
          description: >-
            The copied transaction category, from L483; TRAN-CAT-CD PIC 9(04) at
            app/cpy/CVTRA05Y.cpy L7, carried as characters because the map field it is
            painted into is a character field.
        source:
          allOf:
            - $ref: "#/components/schemas/TransactionSource"
          description: >-
            The copied source, from L484; TRAN-SOURCE PIC X(10) at
            app/cpy/CVTRA05Y.cpy L8.
        description:
          allOf:
            - $ref: "#/components/schemas/TransactionDescription"
          description: >-
            The copied description, from L486; TRAN-DESC PIC X(100) at
            app/cpy/CVTRA05Y.cpy L9.
        merchantId:
          allOf:
            - $ref: "#/components/schemas/MerchantId"
          description: >-
            The copied merchant identifier, from L489; TRAN-MERCHANT-ID PIC 9(09) at
            app/cpy/CVTRA05Y.cpy L11, zero-padded to its nine declared positions
            because the map field is nine characters wide and the reference moves a
            zoned display field into it.
        merchantName:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            The copied merchant name, from L490; TRAN-MERCHANT-NAME PIC X(50) at
            app/cpy/CVTRA05Y.cpy L12.
        merchantCity:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            The copied merchant city, from L491; TRAN-MERCHANT-CITY PIC X(50) at
            app/cpy/CVTRA05Y.cpy L13.
        merchantZip:
          type: string
          minLength: 1
          maxLength: 10
          description: >-
            The copied merchant postal code, from L492; TRAN-MERCHANT-ZIP PIC X(10) at
            app/cpy/CVTRA05Y.cpy L14.
        # WHY : Assumptions: both dates are DATES at the declared width of the MAP
        #       fields rather than of the columns. L487 and L488 move a PIC X(26)
        #       record field into a PIC X(10) screen field, which truncates to the
        #       leftmost ten characters, so what is published is what the reference
        #       would have painted.
        originDate:
          allOf:
            - $ref: "#/components/schemas/DateOnly10"
          description: >-
            The copied origination date, from L487, being the leftmost ten characters
            of TRAN-ORIG-TS PIC X(26) at app/cpy/CVTRA05Y.cpy L15.
        processDate:
          allOf:
            - $ref: "#/components/schemas/DateOnly10"
          description: >-
            The copied processing date, from L488, being the leftmost ten characters
            of TRAN-PROC-TS PIC X(26) at app/cpy/CVTRA05Y.cpy L16.

    # WHY : Refactoring Rationale: THREE members, including the amount. An earlier
    #       revision declared two and set additionalProperties false, while the Java
    #       response record serialises a third -- the normalised monetary amount the
    #       reference program rewrites before storing, at app/cbl/COTRN02C.cbl L442
    #       to L446 -- with nothing suppressing it. The body a caller actually
    #       receives was therefore invalid against its own schema, which a strict
    #       client rejects outright. The amount is declared rather than suppressed
    #       because it is the one submitted value the write can change, so a caller
    #       that echoes what it sent would show a figure the ledger does not hold.
    TransactionCreated:
      type: object
      description: >-
        Confirmation that a transaction was written, carrying the identifier the
        service assigned, the amount it was captured at, and the baseline's own
        success sentence.
      # WHY : Refactoring Rationale: THREE members, and an earlier revision
      #       declared two while closing the object with additionalProperties.
      #       The already-authored response record
      #       services/transaction-service/.../dto/TransactionAddResponse.java
      #       carries a third, the normalised amount, and it is present there for
      #       a stated reason: it is the one submitted value the reference program
      #       rewrites before storing, so a caller cannot compute it from what it
      #       sent. A closed object missing a member the service emits is the worst
      #       of the two failure modes available - a strict client would have
      #       rejected a valid response outright.
      required: [transactionId, amount, returnMessage]
      additionalProperties: false
      properties:
        transactionId:
          allOf:
            - $ref: "#/components/schemas/TransactionId"
          description: >-
            The identifier the service assigned to the new transaction, and the
            value the Location header addresses.
        # WHY : (1) Assumptions: the amount is published because the baseline
        #       NORMALISES it and shows the operator the result, so reporting it is
        #       transcription rather than addition. app/cbl/COTRN02C.cbl L383 to
        #       L384 parse the keyed text through FUNCTION NUMVAL-C into
        #       WS-TRAN-AMT-N, L385 moves that into the edited WS-TRAN-AMT-E, and
        #       L386 writes the edited form back into the very screen field the
        #       operator keyed; L456 to L458 then re-parse that rewritten field into
        #       the record. A canonical sign and decimal placement are therefore
        #       properties of the baseline's own behaviour, and a caller that never
        #       received them back would have to read the record again to learn what
        #       was stored.
        #       (2) Assumptions: the member is required, because it is the one
        #       submitted value the baseline rewrites and the service always has it
        #       by the time a write succeeds. Only the return message is nullable
        #       here, and its sentinel at app/cpy/CVCRD01Y.cpy L30 is what makes it
        #       so.
        #       (3) Alternatives Considered: omitting it and directing a caller to
        #       the view operation for the stored value. Rejected because that
        #       spends a second request to recover a value this response already
        #       holds, and because the normalisation is exactly the difference
        #       between what the caller sent and what the ledger now carries.
        amount:
          allOf:
            - $ref: "#/components/schemas/TransactionAmount"
          description: >-
            The normalised amount the transaction was captured at, at the nine
            integer digits TRAN-AMT PIC S9(09)V99 declares at app/cpy/CVTRA05Y.cpy
            L10 and carried as an exact decimal string. The baseline's own edited
            form at app/cbl/COTRN02C.cbl L385 narrows to eight integer digits; the
            migrated service carries the record's nine, and the divergence is
            documented in docs/architecture/cobol-to-service-traceability.md.
        # WHY : Assumptions: the sentence is assembled, not a single constant, so it
        #       is reproduced as the baseline builds it. app/cbl/COTRN02C.cbl L728
        #       to L733 concatenates "Transaction added successfully. " and " Your
        #       Tran ID is " around the identifier and appends a full stop, which
        #       is why the rendered text carries a double space before "Your" and
        #       the identifier is delimited by space rather than by size.
        returnMessage:
          type: string
          description: >-
            The success sentence, assembled exactly as app/cbl/COTRN02C.cbl L728
            to L733 assembles it: "Transaction added successfully. " followed by
            " Your Tran ID is ", the assigned identifier, and a full stop.
          maxLength: 75
          examples:
            - "Transaction added successfully.  Your Tran ID is 0000000000683580."

    # WHY : Assumptions: TWO members and NO amount. The payment is full-balance
    #       only: app/cbl/COBIL00C.cbl L224 moves the whole of ACCT-CURR-BAL into
    #       TRAN-AMT and L234 computes the balance back down by that same amount,
    #       so the amount is derived from the account rather than chosen by the
    #       caller, and the baseline screen has no partial-amount field to
    #       migrate. Admitting an amount here would create a payment the reference
    #       system cannot make and would let a caller leave a residual balance the
    #       baseline always zeroes.
    # WHY : Refactoring Rationale: the property is named confirmation and the Java
    #       record's component was renamed to match it, rather than the property being
    #       renamed to match the component. A record component name is the wire name
    #       in that package -- it declares no property-naming strategy and no
    #       per-property annotation -- so the two spellings had to be reconciled, and
    #       this one is the spelling the contract, its sibling create request and any
    #       generated client share. Left unreconciled, a conformant client's value was
    #       rejected as an unknown property by this closed object, and had it been
    #       admitted it would have bound nothing: the component would read null on
    #       every request, which on this operation means never confirmed and therefore
    #       never paid.
    # WHY : Trade-offs: only the account identifier is required. The confirmation is
    #       optional because its absence is a meaningful state rather than an
    #       omission: app/cbl/COBIL00C.cbl L173 to L191 routes a blank or low-values
    #       confirmation to the prompt at L237, which asks for the payment to be
    #       confirmed and posts nothing, and the Java component is nullable for
    #       exactly that reason. Requiring it would leave that reachable state
    #       unexpressible by a conformant client -- the same defect the rename above
    #       repairs, arrived at from the other direction. A declining value reaches
    #       the same preview outcome, so nothing is lost by a caller that always
    #       sends one.
    BillPaymentRequest:
      type: object
      description: >-
        The account to pay and the confirmation that decides whether to pay it.
        There is no amount member, because the amount is always the account's
        entire current balance.
      # WHY : Refactoring Rationale: the member is named confirmation and is NOT
      #       required, and the two halves of that were settled against different
      #       evidence. The name: a record component name IS the published member
      #       name in these services -- no property-naming strategy and no
      #       per-property serialisation annotation is declared anywhere in them --
      #       and the already-authored request record
      #       services/transaction-service/.../dto/BillPaymentRequest.java calls
      #       its component confirmation, as does the sibling add request and the
      #       same member on TransactionCreateRequest below. Publishing the shorter
      #       spelling here while the record binds the longer one refused every
      #       contract-conformant body outright, because
      #       spring.jackson.deserialization.fail-on-unknown-properties is true in
      #       this module's application.yml and this object closes itself with
      #       additionalProperties. Transformation rule T1 makes the copybook
      #       normative for the value domain -- CONFIRMI PIC X(1) at
      #       app/cpy-bms/COBIL00.CPY L72, one character, which the shared
      #       Confirmation schema below carries -- and not for the wire spelling of
      #       a screen control that is stored nowhere. The requiredness:
      #       app/cbl/COBIL00C.cbl L182 to L194 answers a withheld confirmation by
      #       displaying the payable balance without posting, so demanding the
      #       member would remove the preview turn the baseline has and this
      #       document's own BillPaymentPreview response describes; the record
      #       component carries a width constraint and no null check, which admits
      #       the same absent state.
      required: [accountId]
      additionalProperties: false
      properties:
        accountId:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          description: >-
            The account whose balance is to be paid. An absent value is refused
            with "Acct ID can NOT be empty..." verbatim from app/cbl/COBIL00C.cbl
            L161.
        confirmation:
          allOf:
            - $ref: "#/components/schemas/Confirmation"
          description: >-
            Whether to post the payment. A confirming value posts it; a declining
            value, the empty string, or omitting the member returns the payable
            balance without posting.

    # WHY : Assumptions: four accepted letters, both cases of each, because the
    #       baseline accepts both cases explicitly. app/cbl/COBIL00C.cbl evaluates
    #       the field at L173 to L191 with separate WHEN arms for 'Y' at L174 and
    #       'y' at L175, and for 'N' at L178 and 'n' at L179, and refuses anything
    #       else at L185 to L187. Normalising to upper case here would silently
    #       accept a value the baseline distinguishes at a source-line level, and
    #       admitting only upper case would reject one it accepts.
    #       app/cbl/COTRN02C.cbl uses the same convention and the same message at
    #       L184.
    # WHY : Refactoring Rationale: the EMPTY string is admitted alongside the four
    #       letters, and an earlier revision published a bare four-value
    #       enumeration. That enumeration could not express the never-confirmed
    #       state, which is a real state and not a missing input: a blank field
    #       reaches app/cbl/COBIL00C.cbl L182 to L194, which reads the account and
    #       DISPLAYS its balance without posting, and reaches
    #       app/cbl/COTRN02C.cbl L178, which asks for another turn. Refusing a
    #       blank value would turn the baseline's preview turn into a field error.
    #       A pattern rather than an enumeration is what admits it, so the shape is
    #       still machine-checked. Omitting the property entirely means the same
    #       thing as sending the empty string, which is why it is not required.
    # WHY : Assumptions: this pattern is EXACTLY the constraint the already-authored
    #       request records carry, whose CONFIRM_VALUES is "[YyNn]?" - Bean
    #       Validation anchors a pattern against the whole value, so that
    #       expression and this one admit the same five spellings. An earlier
    #       revision of those records admitted a run of white space as a sixth; over
    #       HTTP a padded screen field has no counterpart, absence being spelled by
    #       omission or by the empty string, so the white-space arm described a
    #       value no client sends.
    Confirmation:
      type: string
      description: >-
        A single-character confirmation, as the baseline screens collect it:
        declared CONFIRMI PIC X(1) at app/cpy-bms/COBIL00.CPY L72. Y or y confirms
        and N or n declines. The empty string, and omitting the property, are the
        never-confirmed state, which previews rather than posting. Any other value
        is refused with "Invalid value. Valid values are (Y/N)..." verbatim from
        app/cbl/COBIL00C.cbl L187.
      maxLength: 1
      pattern: "^[YyNn]?$"
      examples:
        - "Y"

    # WHY : ⚠️ Refactoring Rationale: payableBalance left the required list and became
    #       nullable, and the change is a correction rather than a relaxation. THREE
    #       baseline turns pay nothing and this schema answers all three, not two.
    #       Two of them read the account and report its balance -- the withheld
    #       confirmation at app/cbl/COBIL00C.cbl L182 to L194 and the nothing-to-pay
    #       advisory at L200 to L204. The third is the DECLINED confirmation at L178
    #       to L181, which performs CLEAR-CURRENT-SCREEN at L180 and never reaches
    #       READ-ACCTDAT-FILE at L343 at all -- only L177 and L184 do -- so it has
    #       no balance to report and blanks the field instead of filling it. While
    #       the member was required, the service had to read an account on that turn
    #       to satisfy this schema, which charged the account context for an access
    #       the baseline does not perform and turned a decline on an unknown
    #       identifier into a 404 where the baseline simply clears the screen.
    #       Alternatives Considered: a third closed schema for the declined turn,
    #       carrying no balance member at all. Rejected because it would publish
    #       three bodies for one operation where the baseline distinguishes two
    #       outcomes, paid and not paid, and every client would then need a third
    #       branch. A nullable member on one schema says the same thing once.
    #       Assumptions: absence is spelled null and never zero. Zero is a balance an
    #       account can genuinely carry, and it is exactly what the nothing-to-pay
    #       branch reports, so the two states have to remain distinguishable.
    BillPaymentPreview:
      type: object
      description: >-
        What a bill payment would pay, returned on a turn that paid nothing. It
        mirrors three baseline turns: the withheld confirmation at
        app/cbl/COBIL00C.cbl L182 to L194, which reads the account and displays its
        balance without posting; the nothing-to-pay advisory at L200 to L204; and
        the declined confirmation at L178 to L181, which clears the screen and
        reports neither a balance nor a sentence.
      # WHY : Refactoring Rationale: every property below is REQUIRED, including the nullable
      #       ones, and that is a correction rather than a tightening. carddemo-common-defaults.yml
      #       pins default-property-inclusion to always, so every record component is written on
      #       every response and a nullable member arrives as null, NEVER absent. Publishing such
      #       a member as optional described an omission this service cannot produce, and generated
      #       a type that was optional AND nullable -- two states for one fact.
      required: [accountId, payableBalance, paid, returnMessage]
      additionalProperties: false
      properties:
        accountId:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          description: >-
            The account the preview was requested for, echoed from the request on
            every one of the three turns including the declined one, which reads
            nothing and so can echo only what it was sent.
        payableBalance:
          # WHY : Refactoring Rationale: oneOf with an explicit null branch rather than a bare
          #       allOf reference, because BillPaymentPreview.cleared at
          #       dto/BillPaymentPreview.java L150 constructs this component as null and the
          #       pinned inclusion policy then writes it as null. The bare reference resolves to
          #       AccountBalance, which is type: string with a two-fractional-digit pattern, so
          #       the document promised a decimal string on a turn that answers null -- a strict
          #       client generated from it would reject the declined turn outright.
          oneOf:
            - $ref: "#/components/schemas/AccountBalance"
            - type: "null"
          description: >-
            The balance that a confirmed request would pay in full. The baseline
            moves the same value to its display field at app/cbl/COBIL00C.cbl L193
            to L194. Null on the declined turn alone, which clears the screen at
            L180 without reaching the account read at L343.
        paid:
          type: boolean
          description: >-
            Always false on this response. It is stated explicitly rather than
            implied by the status code so that a client logging or replaying the
            body alone cannot mistake a preview for a payment.
          const: false
        returnMessage:
          allOf:
            - $ref: "#/components/schemas/ReturnMessage"
          description: >-
            The prompt inviting the caller to confirm, verbatim
            "Confirm to make a bill payment..." from app/cbl/COBIL00C.cbl L237,
            or the refusal "You have nothing to pay..." from L198 when the
            balance is not positive. Null on the declined turn, which sets its
            error flag at L181 as a control-flow short-circuit and moves no
            sentence into the message field.

    # WHY : Refactoring Rationale: this schema was NARROWED to the four data
    #       members the service actually emits plus the discriminator, and the
    #       narrowing is a correction rather than a simplification. An earlier
    #       revision declared seven members where
    #       services/transaction-service/.../dto/BillPaymentResponse.java declared
    #       four, and described its own currentBalance as the figure L234 computes
    #       where that record documents the figure L194 displays -- so a client
    #       generated from this document would have failed against a service that
    #       was itself correct, and would have read the balance with the wrong
    #       meaning even when the member was present. A mapper now constructs the
    #       shape (TransactionMapper.toBillPaymentResponse), so the two sides are
    #       held together by a build step instead of by review.
    # WHY : Refactoring Rationale: the POST-PAYMENT balance member is gone because
    #       it is information-free, not merely redundant. L224 moves the WHOLE
    #       balance into the transaction amount and L234 subtracts that amount from
    #       that balance, so the figure L234 leaves behind is ALWAYS exactly zero --
    #       this baseline pays the balance in full and admits no partial amount. A
    #       member whose every value is zero tells a caller nothing while costing it
    #       a second money field to disambiguate from the one that carries the
    #       figure. Alternatives Considered: keeping both and renaming them.
    #       Rejected: there is only one number to report.
    # WHY : Refactoring Rationale: the masked card number is gone because the
    #       baseline screen has no field for it. L225 moves XREF-CARD-NUM into the
    #       transaction record, so the number is persisted, but
    #       app/cpy-bms/COBIL00.CPY declares no card field and the screen never
    #       shows it -- publishing it here would be additive rather than
    #       parity-preserving. A client needing the card the payment was written
    #       against reads the transaction the Location header addresses.
    BillPaymentResponse:
      type: object
      description: >-
        The outcome of a posted bill payment: the transaction that was written and
        the balance that was paid. The baseline pays the balance in full, so the
        balance reported here is both the figure the screen displays and the amount
        the transaction carries.
      # WHY : Refactoring Rationale: every property below is REQUIRED, including the nullable
      #       ones, and that is a correction rather than a tightening. carddemo-common-defaults.yml
      #       pins default-property-inclusion to always, so every record component is written on
      #       every response and a nullable member arrives as null, NEVER absent. Publishing such
      #       a member as optional described an omission this service cannot produce, and generated
      #       a type that was optional AND nullable -- two states for one fact.
      required: [transactionId, accountId, currentBalance, paid, returnMessage]
      additionalProperties: false
      properties:
        transactionId:
          allOf:
            - $ref: "#/components/schemas/TransactionId"
          description: >-
            The identifier of the transaction the payment wrote. The baseline
            derives it at app/cbl/COBIL00C.cbl L212 to L219 and writes the record
            at L233.
        accountId:
          allOf:
            - $ref: "#/components/schemas/AccountId"
          description: The account that was paid.
        # WHY : Assumptions: this is the balance BEFORE the payment, and statement
        #       order is what fixes it: app/cbl/COBIL00C.cbl L193 moves
        #       ACCT-CURR-BAL into the display field, L224 reuses the same untouched
        #       value as the transaction amount, L233 writes the transaction and only
        #       L234 subtracts. Nothing refills the display field before L242 sends
        #       it, so what the operator sees is the pre-payment figure -- which is
        #       therefore also, exactly, the amount that was paid.
        currentBalance:
          allOf:
            - $ref: "#/components/schemas/AccountBalance"
          description: >-
            The balance as it stood BEFORE the payment, which for this operation is
            also the amount that was paid: app/cbl/COBIL00C.cbl L193 displays it and
            L224 moves the same value into the transaction amount. It is not the
            figure L234 leaves the account holding, which is always zero because
            L234 subtracts the whole balance from itself.
        paid:
          type: boolean
          description: >-
            Always true on this response, stated explicitly so a body read on its
            own is unambiguous about whether money moved. BillPaymentPreview carries
            the same member fixed to false, and BillPaymentResponse.posted is the
            single site that sets this value, so the constant cannot drift.
          const: true
        returnMessage:
          allOf:
            - $ref: "#/components/schemas/ReturnMessage"
          description: >-
            The sentence the baseline emits once the payment is posted, or null
            when it emits none. It is carried verbatim from the program line that
            supplies it, as every message in this contract is.

    # -------------------------------------------------------------------------
    # The problem shape. Every member below mirrors
    # services/common-lib/src/main/java/com/carddemo/common/error/ApiError.java
    # L140 to L151 component for component, because that record is what every
    # migrated service serialises on a failure and this document has to describe
    # what the service actually sends. No annotation there alters a property
    # name, so each name below is the component name there, and its two enum
    # members serialise as their declared constant names.
    # -------------------------------------------------------------------------

    # WHY : Refactoring Rationale: the aggregate sentence and the per-field array
    #       are separate members because the baseline fills them under different
    #       rules and one collection would lose one of the two. The aggregate
    #       sentence latches to the FIRST failure -- app/cpy/CSUTLDPY.cpy writes it
    #       only inside an IF WS-RETURN-MSG-OFF test, so a later failure leaves it
    #       alone -- while the per-field markers are set unconditionally and
    #       therefore accumulate. Deriving the sentence by joining the array would
    #       report the last failure, or all of them, where the baseline reports the
    #       first.
    # WHY : Refactoring Rationale: the per-field array is the migrated form of the
    #       templated red-highlight copybook app/cpy/CSSETATY.cpy L17 to L27, whose
    #       test at L18 and L19 is the FLG-*-NOT-OK or FLG-*-BLANK disjunction and
    #       whose effect at L21 to L22 is to move DFHRED into the field's colour
    #       attribute, with a literal asterisk added at L23 to L25 when the field
    #       is blank. Its L20 additionally requires CDEMO-PGM-REENTER, gating the
    #       highlight on the pseudo-conversational re-entry flag. The migrated
    #       service has no such flag, so the error presentation is driven purely by
    #       this array in the response body and by nothing the server remembers
    #       between requests.
    ApiError:
      type: object
      description: >-
        The problem shape every operation in this contract returns on a failure. It
        carries a stable machine-readable code, a human-readable aggregate sentence
        reproduced verbatim from the baseline paragraph that detected the failure,
        and one entry per offending field.
      # WHY : Refactoring Rationale: `message` and `abend` are REQUIRED and NULLABLE, which is a
      #       different statement from optional and is the one this shape has to make. Both are record
      #       components of ApiError in
      #       services/common-lib/src/main/java/com/carddemo/common/error/ApiError.java, and a record
      #       component is always written, so the key is present with a null value on every response --
      #       `ApiErrorWireShapeTest` asserts exactly that, emitting `"message":null` and `"abend":null`.
      #       An earlier revision omitted them from this list, which told a generated client the keys
      #       might be missing and left it unable to distinguish "not supplied" from "nothing to
      #       report"; a strict validator reading `additionalProperties: false` alongside the omission
      #       had no member to bind the emitted keys to at all.
      # WHY : Alternatives Considered: suppressing the two keys when null, with an inclusion setting, so
      #       the omission became true. Rejected because the aggregate sentence is the reference's own
      #       75-character message field and a client renders the band from it unconditionally, so a
      #       key that comes and goes moves that decision into every client; and because
      #       always-inclusion is PINNED for every service in
      #       services/common-lib/src/main/resources/carddemo-common-defaults.yml, which the
      #       money contract SEPARATELY depends on -- a money member with no value must be
      #       present and null rather than absent, because absent reads as "no balance" where
      #       null reads as "no amount applies". That is a second consumer of the same pin and
      #       NOT the reason these two keys are required here: the reason is the record shape
      #       above, and this schema carries no monetary member at all. An earlier revision ran
      #       the two together, which read as though a problem document's nullability followed
      #       from a money rule.
      # WHY : ⚠️ Refactoring Rationale: that last clause used to read "the services set
      #       default-property-inclusion: always" and it named no place, which is how it came
      #       to be inaccurate -- exactly one of the seven services actually set the key, and
      #       the other six, this one included, rested a published contractual promise on the
      #       serialiser's own default. The key is now set once in the shared defaults every
      #       service imports, so the claim is true for all of them and is verifiable by
      #       reading one file. The reasoning is unchanged; only its subject is now real.
      required: [code, secondaryCode, message, severity, subsystem, status, correlationId, path, timestamp, fieldErrors, abend]
      additionalProperties: false
      properties:
        # WHY : Refactoring Rationale: this bound is THIRTEEN and an earlier revision
        #       declared nine, which made every response this service can send
        #       schema-INVALID. Nine is the width of ERR-CODE-1 PIC X(09) in the
        #       baseline's structured error record, and ApiError.CODE_WIDTH records
        #       it -- but the kernel's own Javadoc records it as PROVENANCE and
        #       states that it is not enforced, because every migrated identifier is
        #       longer by design. CARDDEMO-0400 is thirteen characters, as is every
        #       other CARDDEMO-nnnn code the kernel declares, so the earlier bound
        #       refused every value the member can hold. The word "to match" was the
        #       error: the two numbers were never meant to match.
        # WHY : Alternatives Considered: a closed enum of the kernel's codes, which
        #       would be tighter. Rejected because the kernel may add a code without
        #       every contract being reissued, and a closed enum would then refuse a
        #       response the service sends.
        code:
          type: string
          description: >-
            The stable machine-readable identifier for the failure, matched on by
            clients and by operational tooling and never reworded. Thirteen
            characters is the width the migrated identifiers take; the
            nine-character ERR-CODE-1 the baseline's structured error record
            declares is recorded as ApiError.CODE_WIDTH for provenance and is not
            the bound on this member.
          maxLength: 13
          # WHY : ⚠️ Refactoring Rationale: the bound is 22 and was 13. Thirteen is the width of
          #       `code` above -- `CARDDEMO-` and four digits -- and this member is NOT drawn from that
          #       vocabulary: it carries a subordinate condition name, and the widest the shared writer
          #       can emit is 22, measured on CARD-LOCK-NOT-ACQUIRED and CARD-WRITE-NOT-APPLIED in
          #       services/card-service/src/main/java/com/carddemo/card/api/CardController.java. This
          #       service emits only the empty string today, so 13 was not violated here -- but one
          #       generated client type reads a problem document from any of the seven services, and a
          #       bound that differs between them is a type that differs between them. Bounding it at
          #       the writer's own maximum is what makes the seven agree.
        secondaryCode:
          type: string
          description: >-
            The subordinate machine-readable identifier qualifying code, the
            counterpart of ERR-CODE-2, or the empty string when the failure has no
            second code. It is bounded like code above, because it is drawn from the
            same vocabulary; the kernel normalises an absent value to the empty
            string rather than to null, so the bound is an upper bound only.
          maxLength: 22
        message:
          allOf:
            - $ref: "#/components/schemas/ReturnMessage"
          description: >-
            The human-readable aggregate sentence for this failure, reproduced
            verbatim from the baseline paragraph that detected it, or null where
            the failure has no message of its own. The per-operation responses
            above name the exact literal each status carries.
        severity:
          allOf:
            - $ref: "#/components/schemas/Severity"
          description: The operational level of the failure.
        subsystem:
          allOf:
            - $ref: "#/components/schemas/Subsystem"
          description: The part of the platform the failure arose in.
        # WHY : Assumptions: the status is restated inside the body even though the
        #       response envelope already carries it, because a body that has been
        #       logged or archived away from its envelope has to remain
        #       self-describing. ApiError.java declares the same member for the
        #       same reason.
        status:
          type: integer
          format: int32
          description: >-
            The HTTP status this response carries, restated inside the body so a
            logged or archived payload is self-describing without its envelope.
          minimum: 400
          maximum: 599
        # WHY : Refactoring Rationale: the bound is 24, the width the shared
        #       correlation filter enforces and mints at
        #       (CorrelationIdFilter.CORRELATION_ID_MAX_LENGTH), not the 20 an earlier
        #       revision declared. Twenty is a real number -- it is the baseline's own
        #       ERR-EVENT-KEY PIC X(20) at CCPAUERY.cpy L40, recorded by
        #       ApiError.CORRELATION_ID_WIDTH as provenance -- but that record's own
        #       documentation states the width is not enforced, because the identity
        #       is generated by the transport. A minted identity is exactly 24
        #       characters, so a contract declaring 20 would be contradicted by every
        #       response that carried one.
        correlationId:
          allOf:
            - $ref: "#/components/schemas/CorrelationId"
          description: >-
            The identity of the unit of work that failed, inherited from the
            inbound request rather than invented, or the empty string when the
            request carried none and none had been minted. It is the key to the
            operational record holding the diagnostic detail this response
            withholds.
        path:
          type: string
          description: >-
            The request path that failed, so a client reporting a problem does not
            have to reconstruct which call produced it, or the empty string when no
            path is available. Any run of sixteen or more consecutive digits in it
            is rendered masked, as twelve or more asterisks followed by the final
            four digits, so the masking rules are not circumvented by the
            diagnostic field. A transaction identifier is sixteen digits and is
            therefore masked here as well: it is indistinguishable from a primary
            account number by inspection, and the correlation identifier on the
            same response is what identifies the failed call precisely.
        timestamp:
          allOf:
            - $ref: "#/components/schemas/Timestamp26"
          description: >-
            The instant of the failure, in the same twenty-six-character form the
            record layout uses for its own timestamps.
        # WHY : Assumptions: an entry's presence is itself the evidence of an error,
        #       so the array holds only offending fields and never a clean one. The
        #       nested FieldError refuses the valid state outright, matching the
        #       single disjunction at app/cpy/CSSETATY.cpy L18 and L19, which keeps
        #       the array's length equal to the number of offending fields.
        fieldErrors:
          type: array
          description: >-
            One entry per offending field, each naming the field and carrying that
            field's verbatim baseline message. It is an empty array when the failure
            is not a field-validation failure, never a null.
          items:
            $ref: "#/components/schemas/FieldError"
        abend:
          description: >-
            The structured abend detail, present only when the failure is an abend
            and null otherwise.
          oneOf:
            - $ref: "#/components/schemas/AbendDetail"
            - type: "null"

    FieldError:
      type: object
      description: >-
        One offending field and the reason it was refused, mirroring the nested
        FieldError record at ApiError.java L432. The SPA renders each entry as a
        form-item error state with the message as its help text.
      required: [field, state, message]
      additionalProperties: false
      properties:
        field:
          type: string
          description: >-
            The name of the offending member, as it appears in the request schema,
            so a client can attach the message to the control that produced it.
          minLength: 1
        state:
          allOf:
            - $ref: "#/components/schemas/FieldValidationState"
          description: >-
            Which of the two failing validation states the field is in.
        message:
          type: string
          description: >-
            The field's message, reproduced character for character from the
            baseline line that emits it, trailing ellipsis and emphatic
            capitalisation of NOT included.
          minLength: 1
          maxLength: 75
          examples:
            - "Type CD can NOT be empty..."

    # WHY : Assumptions: the two failing states only. FieldValidationFlag in
    #       com.carddemo.common.validation declares three constants, but the
    #       FieldError record rejects the valid one, because admitting it would
    #       make the array's length stop equalling the number of offending fields
    #       and would give a client two contradictory signals at once. The two that
    #       remain are the two arms of the app/cpy/CSSETATY.cpy L18 and L19
    #       disjunction, and the blank arm is the one that additionally earned the
    #       literal asterisk marker at L23 to L25.
    FieldValidationState:
      type: string
      description: >-
        Why a field was refused: NOT_OK when a supplied value failed a rule, BLANK
        when a required value was absent. The baseline distinguishes the same two
        at app/cpy/CSSETATY.cpy L18 and L19 and treats the blank case specially by
        also writing an asterisk into the field.
      enum: [NOT_OK, BLANK]

    Severity:
      type: string
      description: >-
        The operational level of a failure, drawn from the baseline's own four-value
        domain rather than a newly invented ladder.
      enum: [LOG, INFO, WARNING, CRITICAL]

    Subsystem:
      type: string
      description: >-
        The part of the platform a failure arose in, drawn from the baseline's own
        six-value domain. A failure in this service is normally APPLICATION or
        RELATIONAL; the remaining members exist because the domain is shared across
        every migrated service.
      enum: [APPLICATION, CICS, IMS, RELATIONAL, QUEUE, OBJECT_STORE]

    # WHY : Assumptions: four members at four declared widths, mirroring
    #       app/cpy/CSMSG02Y.cpy, whose ABEND-DATA group runs from L21 to L29 and
    #       declares ABEND-CODE PIC X(4) at L22, ABEND-CULPRIT PIC X(8) at L24,
    #       ABEND-REASON PIC X(50) at L26 and ABEND-MSG PIC X(72) at L28. That file
    #       is 35 lines long in total, so those are the only widths it declares.
    AbendDetail:
      type: object
      description: >-
        The structured abend detail, the migrated form of the ABEND-DATA group at
        app/cpy/CSMSG02Y.cpy L21 to L29. It is present only on an abend, and it
        carries no diagnostic text scraped from an exception.
      required: [abendCode, abendCulprit, abendReason, abendMsg]
      additionalProperties: false
      properties:
        abendCode:
          type: string
          description: >-
            The abend code, at the width ABEND-CODE PIC X(4) declares at
            app/cpy/CSMSG02Y.cpy L22.
          maxLength: 4
        abendCulprit:
          type: string
          description: >-
            What abended, at the width ABEND-CULPRIT PIC X(8) declares at
            app/cpy/CSMSG02Y.cpy L24.
          maxLength: 8
        abendReason:
          type: string
          description: >-
            Why it abended, at the width ABEND-REASON PIC X(50) declares at
            app/cpy/CSMSG02Y.cpy L26.
          maxLength: 50
        abendMsg:
          type: string
          description: >-
            The abend message, at the width ABEND-MSG PIC X(72) declares at
            app/cpy/CSMSG02Y.cpy L28. This is the seventy-two-character regime and
            is not the seventy-five-character message line.
          maxLength: 72
