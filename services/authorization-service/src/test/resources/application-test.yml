# =============================================================================
# services/authorization-service/src/test/resources/application-test.yml
# -----------------------------------------------------------------------------
# Purpose:
#   The Spring `test` profile overlay for authorization-service, the bounded
#   context that owns the pending-authorization summary and detail segments, the
#   fraud marking, the FIFO request consumer and the transactional outbox that
#   closes the baseline's lost-reply window.
#
#   It narrows the base profile in src/main/resources/application.yml to what a
#   containerised, offline test run can actually satisfy. It keeps every
#   production MECHANISM intact -- the same schema, the same migration, the same
#   fixed-point column types, the same messaging bounds -- and replaces only the
#   values that bind the service to deployed infrastructure.
#
# WHY (non-obvious design decisions):
#   - Assumptions: the comment idiom, the ruled header and the four rationale
#     labels below follow docs/CODE_DOCUMENTATION_STANDARD.md, section
#     "Language conventions" -> "YAML" (the folder brief's section 3.4) and
#     section "The `# WHAT:` / `# WHY :` idiom", together with AAP section 0.8.1.
#     That standard is the citable convention for YAML because YAML has no
#     docstring construct, so this file carries its obligation as adjacent
#     justification above each key rather than as a docstring.
#   - Assumptions: that same standard records that NO linter runs over YAML in
#     this repository -- no docstring gate, no schema check. The obligation here
#     is therefore a REVIEW gate, which is why every value that differs from the
#     base, and every deliberate omission, is explained in place rather than
#     left for a reader to infer from a diff.
#   - Trade-offs: a handful of inherited values are restated rather than
#     inherited silently -- the two Flyway schema keys, `ddl-auto` and the two
#     messaging bounds. Restating them adds review surface and a second place to
#     keep in step. It is accepted because each one is load-bearing for a test
#     assertion: silent inheritance would leave a reader unable to tell which
#     schema, which generated DDL and which message bound a passing test
#     actually exercised.
#   - Refactoring Rationale: an earlier overlay resolved the same problems by
#     other means, and three of those means are the reason this one differs.
#     It defined the schema's owning role and granted it privileges from
#     `spring.flyway.init-sqls`, duplicating a definition that belongs to exactly
#     one file and leaving the two free to disagree undetected; it carried a
#     literal issuer address and a literal signing-key value, so a credential- and
#     endpoint-shaped literal sat in source control; and it set `ddl-auto` to
#     `validate`, which emits no DDL and therefore looks equivalent to `none` but
#     adds a startup comparison that can abort a context on a difference the
#     migration intends. Each is replaced here by an omission or an empty value,
#     and each replacement is justified at the key that carries it.
#   - Assumptions: determinism follows the house practice in tests/README.md --
#     business dates are injected rather than read from the wall clock, and
#     timestamps are normalised before comparison. Nothing configured here makes
#     a test outcome depend on when it runs; the one interval that could,
#     `outbox-poll-interval-ms`, is widened precisely so no scheduled sweep can
#     fire inside a test.
#   - Assumptions: THREE leaf paths here are absent from the base profile --
#     `spring.cloud.aws.region.static`, `spring.cloud.aws.sqs.listener.auto-startup`
#     and `logging.level.org.flywaydb`. Each sits under a top-level namespace the
#     base already declares, and each is justified at its own key. They are
#     additions rather than overrides because the base can omit what a build host
#     cannot supply: a deployed task resolves its own region, and it WANTS its
#     consumer to poll.
#   - Assumptions: no credential, endpoint, queue reference, issuer, account
#     identifier or connection string appears anywhere below. A test supplies
#     those at run time through Testcontainers `@ServiceConnection` or
#     `@DynamicPropertySource`, which is the structural reason this repository
#     can hold no secret rather than merely happening to hold none. The closing
#     register at the foot of this file names every value left out on purpose,
#     so an absence cannot be mistaken for an oversight.
# =============================================================================

# WHAT: turns off the TLS listener that the base profile enables.
# WHY : Assumptions: the base obtains its keystore password from
#       `CARDDEMO_SERVER_TLS_KEYSTORE_PASSWORD`, a placeholder carrying NO
#       default, and its keystore from a path a container entrypoint mints. A
#       test JVM has neither, so a profile that left the listener enabled would
#       fail while trying to read unresolved placeholder text as key material --
#       before any assertion ran. Alternatives Considered: committing a
#       throwaway keystore. Rejected because it would place private key material
#       in this repository to serve a loopback hop, and the certificate would not
#       match the container host name in any case. Trade-offs: a test listener is
#       therefore cleartext on a loopback interface only; deployed TLS is
#       untouched, since this override lives in the test profile alone.
server:
  ssl:
    enabled: false

spring:
  # WHAT: pins this profile's imported configuration to the shared classpath
  #       defaults, marked optional, and adds no other source.
  # WHY : Assumptions: the import set is where a test context would otherwise
  #       acquire a dependency on deployed infrastructure. application-dev.yml
  #       and application-prod.yml each add
  #       `optional:aws-parameterstore:/carddemo/.../authorization/` on top of
  #       this same classpath entry; this profile deliberately adds NO
  #       environment-bound source, so no test can reach Parameter Store or
  #       Secrets Manager, hang against an unreachable metadata endpoint, or
  #       depend on a parameter tree existing. Declaring the set explicitly is
  #       what makes that auditable at a glance instead of inferable from which
  #       profiles are inactive.
  # WHY : Alternatives Considered: (a) an empty import list, which would also
  #       add nothing but would drop the shared defaults that supply the
  #       structured-logging fields and the `carddemo.environment` and
  #       `carddemo.version` values other keys interpolate -- logging would then
  #       resolve differently under test than in a deployment; and (b) naming a
  #       stand-in endpoint so the parameter source still resolves, rejected
  #       outright because it would put an endpoint in source, which is the one
  #       thing this file may never do. Trade-offs: `optional:` means a missing
  #       shared-defaults resource degrades to silence instead of aborting
  #       context refresh. The cost is that a genuinely absent resource is not
  #       announced; it is accepted because every key it supplies carries its own
  #       fallback, so a test still starts with defined behaviour.
  config:
    import: "optional:classpath:/carddemo-common-defaults.yml"

  datasource:
    hikari:
      # WHAT: replaces the base profile's certificate-verifying TLS requirement
      #       with an unencrypted connection.
      # WHY : Assumptions: the base sets `sslmode: verify-full` and points
      #       `sslrootcert` at a certificate-authority bundle, because a managed
      #       database endpoint presents a certificate chained to one. A
      #       Testcontainers PostgreSQL instance serves NO TLS and presents no
      #       certificate, so `verify-full` fails the handshake and every
      #       repository test fails at connection time rather than on an
      #       assertion. Trade-offs: test traffic is unencrypted. It is accepted
      #       because the endpoint is a container on the loopback interface whose
      #       lifetime is the test, it holds only fixture rows, and the deployed
      #       posture is unchanged -- this key is overridden in the test profile
      #       only. Alternatives Considered: generating a certificate for the
      #       container and keeping `verify-full`. Rejected because it would add
      #       key material to the repository and a certificate-generation step to
      #       every test run, to verify an identity the test itself created.
      data-source-properties:
        sslmode: disable

      # WHAT: shrinks the connection pool the base sizes for a serving task.
      # WHY : Trade-offs: the base sizes for ten concurrent in-flight messages.
      #       A test drives one thread at a time, so the surplus connections are
      #       idle sockets a container must accept, and a floor of zero lets the
      #       pool release them between classes instead of holding them for the
      #       whole run. Four leaves headroom for a test that opens a second
      #       connection to assert on schema metadata while its own transaction
      #       is open -- a pattern the constraint tests use, and one that
      #       deadlocks against a pool of one.
      maximum-pool-size: 4
      minimum-idle: 0

      # WHAT: triples the time a caller waits for a connection from the pool.
      # WHY : Assumptions: the base value is tuned for an already-warm task
      #       talking to an already-running database, where a wait that long means
      #       something is wrong and failing fast is the right answer. The first
      #       connection of a test run is not that case: it is contending with
      #       container startup, the migration and, on a build host running
      #       several modules at once, other containers competing for the same
      #       cores. At the base value that contention surfaces as a
      #       connection-timeout failure attributed to whichever test asked
      #       first, which reads as a database fault rather than as a busy host.
      #       Trade-offs: a genuinely unreachable database therefore takes three
      #       times as long to report. Accepted because the failure still arrives
      #       with the same message, and a flaky pass is far more expensive to
      #       diagnose than a slow failure. application-dev.yml makes the same
      #       trade for the same reason.
      connection-timeout: 30000

  flyway:
    # WHAT: restates, unchanged, the base profile's migration switch, its
    #       migration source, its two schema keys and its baselining setting.
    # WHY : Assumptions: `schemas` and `default-schema` are restated rather than
    #       inherited because they answer different questions -- which schema
    #       Flyway manages, and where its history table resolves -- and a value
    #       corrected in one but missed in the other would place migration state
    #       in `public` while the tables landed in `authorization`, so a repeated
    #       run would report the wrong history instead of failing outright.
    #       Both are BARE identifiers on purpose: Flyway quotes an identifier
    #       itself, so a value carrying quote characters would name a schema
    #       whose name contains them. The opposite requirement applies to
    #       `spring.datasource.hikari.connection-init-sql` in the base profile,
    #       where the same word is SQL text and MUST stay quoted because
    #       `authorization` is a reserved word. That pairing is asserted for both
    #       profiles by config/FlywaySchemaNamingTest, which reads this document
    #       directly, so a drift here fails a test rather than a deployment.
    enabled: true
    locations: classpath:db/migration
    schemas: authorization
    default-schema: authorization
    baseline-on-migrate: false

    # WHAT: lets Flyway create the `authorization` schema, which the base profile
    #       forbids it from creating.
    # WHY : Assumptions: this is not a preference, it is the difference between a
    #       migration that runs and one that cannot. The base pairs
    #       `create-schemas: false` with a schema-qualified `default-schema`
    #       because a deployment creates the schema and its owning role ahead of
    #       any service, in data-migration/sql/V0__schemas_and_roles.sql, and
    #       db/migration/V1__authorization.sql contains no CREATE SCHEMA of its
    #       own by design. A freshly started container has no such schema, so
    #       under the base setting Flyway resolves its history table into a schema
    #       that does not exist and the FIRST migration fails.
    # WHY : Alternatives Considered: (A) this key, resolving the fork inside the
    #       profile -- the resolution is then visible in the one file a reader of
    #       the test profile opens, at the cost that the test profile no longer
    #       mirrors the deployed posture in which schema creation is deliberately
    #       external; or (B) creating the schema during container initialisation
    #       and leaving `create-schemas: false` -- the deployed posture stays
    #       byte-identical, but the resolution moves into Java container setup
    #       where a reader of this profile will not find it, and every test class
    #       that starts a context must repeat the same initialisation or fail on
    #       its first migration. (A) is chosen because the thing being traded away
    #       is a posture this profile already departs from in three other places
    #       (TLS, connection encryption, role assumption), whereas the thing
    #       gained is that a reader diagnosing a migration failure finds the cause
    #       in the file that caused it. What (A) must NOT do is compensate by
    #       creating the schema's owning role: role and grant definition belongs
    #       solely to data-migration/sql/V0__schemas_and_roles.sql, and a second
    #       definition here would drift from it silently.
    create-schemas: true

    # WHAT: empties the base profile's list of statements run before migration.
    # WHY : Assumptions: the base runs one statement there to assume the schema's
    #       owning role, so that objects the migration creates are owned by that
    #       role and its grants apply to them. That role is created only by
    #       data-migration/sql/V0__schemas_and_roles.sql, which a unit-test
    #       container never runs, so the statement fails against a fresh instance
    #       and takes the whole migration with it. Emptying the list is what
    #       leaves ownership to the connecting user for the lifetime of the
    #       container. Alternatives Considered: defining the role here so the
    #       statement succeeds. Rejected on two independent grounds -- it would
    #       duplicate a definition this repository assigns to exactly one file, so
    #       the two could disagree without anything detecting it; and a test
    #       profile that mints its own privilege structure would assert against a
    #       privilege model it invented rather than the deployed one, which is
    #       worse than not asserting at all. Trade-offs: object ownership under
    #       test therefore differs from a deployment. Accepted because no
    #       assertion in this module concerns ownership or grants, while every
    #       assertion concerns the table shapes the migration produces.
    init-sqls: []

  jpa:
    hibernate:
      # WHAT: keeps schema generation switched off, exactly as the base profile
      #       sets it.
      # WHY : Assumptions: this value is restated deliberately, because the
      #       convenient relaxation is the one that would quietly void this
      #       module's most specific tests. Flyway's V1__authorization.sql is the
      #       only producer of three objects the repository tests assert against:
      #       the check constraint `ck_pending_auth_detail_match_status`, which
      #       admits exactly 'P', 'D', 'E' and 'M'; the check constraint
      #       `ck_pending_auth_detail_auth_fraud`, which admits 'F', 'R', SQL null
      #       AND a single blank; and the index `idx_auth_fraud_card_recent` on
      #       (card_num ASC, auth_ts DESC), whose MIXED direction reproduces the
      #       reference index order. Alternatives Considered: `create-drop` or
      #       `update`, either of which would remove the need to migrate at all.
      #       Rejected because Hibernate generates neither check constraint and
      #       flattens the index to a single direction, so the assertions written
      #       to prove those objects exist would run green against a schema that
      #       does not contain them -- a false pass, which is strictly worse than
      #       a failure. `validate` is rejected for a nearer miss: it emits no DDL
      #       and so looks equivalent, but it adds a startup comparison between
      #       entities and live columns that can abort context refresh on a
      #       difference the migration intends, converting a schema question into
      #       a context-startup failure. Trade-offs: every context-loading test
      #       therefore pays for a migration before its first assertion.
      ddl-auto: none

    # WHAT: restates the base profile's persistence-context and SQL-echo
    #       settings.
    # WHY : Trade-offs: leaving the session open for view rendering is off here as
    #       it is in the base, so a lazy association touched outside a
    #       transactional boundary fails in a test the same way it would in a
    #       deployment, rather than being silently satisfied by an open session and
    #       failing only once deployed. SQL echo stays off because the assertions
    #       in this module read schema metadata and constraint names rather than
    #       statement text, so echoing every statement would bury the one
    #       diagnostic line a failure prints. application-dev.yml turns it on,
    #       which is the profile where reading statements is the point.
    open-in-view: false
    show-sql: false

  cloud:
    aws:
      region:
        # WHAT: names a region for the AWS client builders, which the base
        #       profile leaves unset.
        # WHY : Assumptions: this leaf is ABSENT from the base and the asymmetry
        #       is deliberate. The base enables the queue integration and
        #       supplies neither region nor credentials, because a deployed task
        #       resolves both from its own environment and its task role, which is
        #       what keeps a long-lived credential out of the image. A build host
        #       supplies neither, and a region is needed to BUILD a client rather
        #       than to call one: the client bean is constructed while the context
        #       is, so with no region the resolution chain falls through to
        #       instance-metadata discovery and the context stalls until that
        #       attempt times out, then fails. Credentials behave differently and
        #       are not needed for startup, because they are resolved on first
        #       call -- which is why none appears here. Trade-offs: a region is a
        #       client-side selector, not an endpoint, an account identifier or a
        #       credential, and nothing here sends a request to it: intake is
        #       disabled immediately below and no test publishes.
        static: us-east-1

      sqs:
        listener:
          # WHAT: stops the message listener container from starting with the
          #       application context.
          # WHY : Assumptions: this leaf is absent from the base for the same
          #       shape of reason as the region above, inverted -- consuming the
          #       request queue is this context's entire inbound path, so the base
          #       WANTS the container to start. A test must not: the listener
          #       carries an annotation that registers it during context refresh,
          #       so left at its default it would begin polling a queue reference
          #       this profile deliberately does not supply, and the resulting
          #       failures would arrive on a background thread, interleaved with
          #       unrelated assertions and attributed to whichever test happened
          #       to be running. Alternatives Considered: pointing the listener at
          #       an emulated queue so it could start harmlessly. Rejected because
          #       it would make every test in the module -- including the pure
          #       codec and mapper tests, which are the majority -- depend on an
          #       emulator being up. Trade-offs: consumer behaviour is therefore
          #       proven by driving the listener directly in a unit test rather
          #       than by letting the container deliver to it.
          auto-startup: false


management:
  endpoints:
    web:
      exposure:
        # WHAT: narrows the exposed actuator endpoints to the health endpoint
        #       alone, dropping the metrics endpoint the base also publishes.
        # WHY : Trade-offs: the base publishes metrics because a deployed task is
        #       scraped for them. Nothing scrapes a test JVM, and publishing the
        #       endpoint costs a meter registry populated for every context that
        #       starts. Health is kept rather than dropped too, because it is the
        #       endpoint the module Dockerfile's health check and the load-balancer
        #       target group both probe, so a test that starts a context is the
        #       only place a change breaking that probe would be caught before a
        #       deployment.
        include: health

logging:
  level:
    # WHAT: restates the base profile's log levels and adds the migration logger.
    # WHY : Assumptions: `org.flywaydb` is the third leaf here that the base does
    #       not declare, and the reason it can omit it is that a deployment gates
    #       migration in its own pipeline step, where the outcome is already
    #       visible. Under test the migration is the step most likely to fail
    #       first and the one whose failure is least self-explanatory -- a missing
    #       schema, a statement refused before migration, an out-of-order version
    #       all surface as a bare context-refresh failure. Raising this one logger
    #       makes the applied version list part of the failure output, so the
    #       cause is in the log rather than reconstructed from the effect.
    #       Trade-offs: the root logger stays quiet and the two Hibernate loggers
    #       stay quiet, because parameter binding and statement text at a louder
    #       level would print fixture bytes -- including card numbers -- into
    #       build output that is routinely attached to a build record.
    root: WARN
    com.carddemo: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

carddemo:
  messaging:
    # WHAT: restates the receive wait the base profile configures, in seconds.
    # WHY : Assumptions: five SECONDS, and the unit is the whole point of
    #       restating it. The reference program sets `MOVE 5000 TO
    #       WS-WAIT-INTERVAL` at app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl
    #       L242 and passes it as the message-queue wait interval, a field
    #       expressed in MILLISECONDS -- so the literal 5000 is 5 s, not 5000 s.
    #       It is carried here as 5 because this key's unit is seconds; a reader
    #       who took the baseline literal for seconds would configure a wait three
    #       orders of magnitude too long, and the symptom would be a consumer that
    #       looks stopped rather than one that is waiting. Trade-offs: an empty
    #       receive after this wait is normal and not an error, exactly as the
    #       baseline treats its no-message-available condition, so an idle queue
    #       produces no failure. Restating the value keeps a test that asserts the
    #       wait independent of whether the base profile is loaded.
    poll-timeout-seconds: 5

    # WHAT: restates the per-window processing bound the base profile configures.
    # WHY : Assumptions: 500 is the baseline's DECLARED bound --
    #       `05 WS-REQSTS-PROCESS-LIMIT PIC S9(4) COMP VALUE 500` at COPAUA0C.cbl
    #       L40 -- and it is the value a test should assert is configured. The
    #       baseline's own control flow nevertheless admits 501, and the
    #       arithmetic is written out here because 500 is the number a reader
    #       expects and the off-by-one is invisible without it: the counter is
    #       POST-incremented at L332 (`ADD 1 TO WS-MSG-PROCESSED`, after the
    #       message has been handled) and then tested with a STRICT greater-than at
    #       L339 (`IF WS-MSG-PROCESSED > WS-REQSTS-PROCESS-LIMIT`), so counts 1
    #       through 500 all fail that test and read again, and the loop closes only
    #       once a 501st has been handled.
    # WHY : Alternatives Considered: configuring 501 here so the number in the file
    #       matched the baseline's observed loop exactly. Rejected because the
    #       extra message is an artifact of the ORDER of increment and comparison
    #       rather than a rule any part of the baseline states, and because the
    #       divergence is already registered -- as D-AUTH-REQUEST-WINDOW in
    #       docs/architecture/cobol-to-service-traceability.md, with matching
    #       entries in docs/adr/ADR-004-messaging.md and
    #       docs/architecture/messaging-contracts.md -- so a 501 here would make
    #       the running system contradict its own register. Trade-offs: the
    #       declared bound is what this profile enforces, which is why a test whose
    #       subject is the boundary arithmetic itself must lower this key to a
    #       small value in its own context rather than read 501 out of this file:
    #       the key is exposed here so that behaviour follows from configuration,
    #       and 501 is deliberately not written anywhere as a value.
    request-process-limit: 500

    # WHAT: widens the outbox drain interval far beyond the base profile's.
    # WHY : Assumptions: this is a determinism control, not a tuning value, and it
    #       is the one key here that could otherwise make an outcome depend on
    #       when a test runs. The base drains the outbox on a short cycle because a
    #       deployment wants a reply published promptly; under test a scheduled
    #       drain firing part-way through a case that drives the publisher directly
    #       would consume the very rows that case is about, and the failure would
    #       reproduce only under particular timing. Widening the interval past any
    #       plausible test duration means the scheduled path never races the
    #       direct one, which is the isolation practice tests/README.md describes.
    #       This exact value is asserted acceptable by service/OutboxPublisherTest,
    #       which pins it as an inclusive ceiling so that lowering the publisher's
    #       accepted range would fail a test rather than silently break this
    #       profile. Alternatives Considered: disabling the scheduled drain
    #       outright. Rejected because the publisher's accepted-range validation is
    #       itself under test, and a disabled scheduler would leave that validation
    #       unexercised.
    outbox-poll-interval-ms: 3600000

    # -------------------------------------------------------------------------
    # WHY : Assumptions: NO per-message expiry key appears above, and the absence
    #       is a transport fact rather than an omission. The baseline sets
    #       `MOVE 50 TO MQMD-EXPIRY` at COPAUA0C.cbl L750, and that field is
    #       expressed in TENTHS OF A SECOND -- so 50 is 5.0 SECONDS, not 50
    #       seconds and not 50 milliseconds. The target transport has no
    #       per-message time to live at all: its retention is queue-level and
    #       applies to every message alike, so there is no key in this namespace
    #       that could reproduce the field, and inventing one here would create a
    #       setting nothing reads. The semantic is preserved instead by the
    #       producer carrying the expiry INSTANT as an `expiresAt` message
    #       attribute and the consumer dropping and logging a message whose
    #       instant has passed, with the 5.0 s window held as a parity constant in
    #       common-lib beside the code that applies it. Trade-offs: enforcement
    #       moves from the broker to the consumer, so a consumer that skipped the
    #       check would act on a message the baseline would have discarded --
    #       which is why the check is asserted in code rather than configured here.
    # -------------------------------------------------------------------------

# =============================================================================
# Deliberate omissions
# -----------------------------------------------------------------------------
# WHY : Assumptions: the following base-profile keys are left UNSET on purpose,
#       and the reason is the same for all of them -- each resolves to a
#       credential, an endpoint or an infrastructure identifier, and a test
#       obtains those at run time from Testcontainers `@ServiceConnection` or
#       `@DynamicPropertySource`, never from a committed file. Writing even a
#       plausible stand-in for any of them would put a credential-shaped or
#       endpoint-shaped literal into source control, which is the single
#       prohibition this file exists to respect structurally rather than by
#       review. They are listed rather than silently absent so that a reader
#       adding a context-loading test knows exactly which values that test must
#       supply, and does not conclude the omission was an oversight:
#         - spring.datasource.url, .username, .password
#         - spring.flyway.user, .password
#         - spring.security.oauth2.resourceserver.jwt.issuer-uri
#         - carddemo.security.jwt.expected-client-id
#         - carddemo.messaging.pauth-request-queue
#         - carddemo.messaging.reply-queue-allowlist
#         - carddemo.messaging.hmac-key
#         - carddemo.account-context.base-url
#         - carddemo.internal-identity.signing-key
# WHY : Assumptions: `spring.flyway.clean-disabled` is also left unset, and it is
#       the one omission with the opposite motive. The base disables clean
#       unconditionally, and inheriting that is the intent: a test container is
#       discarded wholesale at the end of its life, so nothing here needs the
#       ability to drop a schema, and a profile that re-enabled clean would make
#       the destructive operation available in the one profile where an accidental
#       invocation is least likely to be noticed. Trade-offs: a test that wants a
#       clean database creates a new container instead, which is slower than
#       cleaning and is the reason the trade is worth naming.
# WHY : Assumptions: no version of any library appears anywhere in this file.
#       Flyway, the database driver and the container library are pinned solely in
#       services/pom.xml and the module's own pom.xml; restating a version here
#       would create a second source of truth that could drift from the build
#       without anything detecting it.
# =============================================================================

