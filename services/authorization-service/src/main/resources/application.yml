# =============================================================================
# services/authorization-service/src/main/resources/application.yml
# -----------------------------------------------------------------------------
# Purpose:
#   Base runtime configuration for authorization-service, the PENDING
#   AUTHORIZATION bounded context. It settles the values every environment
#   shares: the HTTPS listener, the Aurora PostgreSQL datasource and its
#   connection pool, Flyway schema migration and the identity that applies it,
#   JPA behaviour, resource-server identity, the published API contract, the
#   Actuator surface, log levels, and the queue, outbox, account-context and
#   internal-identity settings this context alone carries.
#
#   This file is the property-key contract for the module: the classes under
#   com.carddemo.authorization.config and com.carddemo.authorization.service
#   bind against the keys declared here, and application-dev.yml and
#   application-prod.yml override their VALUES without adding a key, removing a
#   key, or changing the shape of one.
#
#   The behaviour being configured is migrated from the eight REFERENCE-ONLY
#   programs under app/app-authorization-ims-db2-mq/cbl, which are read and
#   never modified: COPAUA0C.cbl (the queue-driven request consumer), COPAUS0C
#   .cbl (pending authorization summary), COPAUS1C.cbl (detail), COPAUS2C.cbl
#   (fraud marking), CBPAUP0C.cbl (purge), and PAUDBLOD.CBL, PAUDBUNL.CBL and
#   DBUNLDGS.CBL (segment load and unload). Their record layouts are
#   cpy/CIPAUSMY.cpy and cpy/CIPAUDTY.cpy, their message payloads are
#   cpy/CCPAURQY.cpy and cpy/CCPAURLY.cpy, and the fraud table is ddl/AUTHFRDS
#   .ddl with its index ddl/XAUTHFRD.ddl. Three CICS transactions name the
#   online programs: TRANSACTION(CPVD) at csd/CRDDEMO2.csd L39, TRANSACTION
#   (CPVS) at L49 and TRANSACTION(CP00) at L59.
#
#   This module owns the PostgreSQL schema "authorization" and its four tables
#   -- pending_auth_summary, pending_auth_detail, auth_fraud and
#   auth_reply_outbox -- created by db/migration/V1__authorization.sql. Those
#   four replace segments the baseline split across an IMS database and a Db2
#   table joined by two-phase commit, so the second resource manager is REMOVED
#   here rather than emulated, and no distributed-transaction or XA setting
#   appears anywhere below.
#
#   NO SECRET, CREDENTIAL, HOSTNAME, ENDPOINT, QUEUE URL, KEY IDENTIFIER OR
#   ACCOUNT IDENTIFIER APPEARS ANYWHERE IN THIS FILE. Every deployment-specific
#   value is a ${...} placeholder resolved at run time from an environment
#   variable that the ECS task definition sets from Parameter Store or from a
#   Secrets Manager container secret.
#
#   Documentation convention: docs/CODE_DOCUMENTATION_STANDARD.md. YAML has no
#   docstring construct, so this header block is the module-entry-point
#   equivalent, and every non-obvious key below carries an adjacent rationale
#   naming at least one of Alternatives Considered, Refactoring Rationale,
#   Assumptions or Trade-offs, as the project's single user-specified rule,
#   Rule 1 "Explainability", requires at its validation gate. No mechanical gate
#   reads this file: config/checkstyle/checkstyle.xml narrows its Checker to
#   fileExtensions="java" at L185, and the plan declares no linter that parses
#   YAML comments. Review carries the obligation, and the discipline is applied
#   here at the rigour it is applied where a build would fail without it.
# -----------------------------------------------------------------------------
# WHY (non-obvious design decisions):
#
#   Assumptions: this is the ONLY context in the repository that is
#     simultaneously a web service and a message consumer, which is why this
#     document carries both a `server:` block and a `spring.cloud.aws:` block
#     where its peers carry one or the other.
#   Trade-offs: the placeholders below carry NO defaults, apart from the four
#     that name a value this service derives rather than receives. An absent
#     datasource URL, issuer or queue reference stops startup rather than
#     falling back to something locally plausible, because a service that starts
#     against the wrong database writes authorization decisions into it, and
#     that is far harder to notice than a service that does not start at all.
#   Assumptions: no client library reads Parameter Store or Secrets Manager from
#     this file, and the sibling POM is why. It declares neither the
#     parameter-store nor the secrets-manager starter, so a non-optional
#     `aws-parameterstore:` import here would abort startup on a config location
#     no resolver claims. The framework maps an injected SPRING_DATASOURCE_URL
#     onto spring.datasource.url by relaxed binding unaided, and the
#     per-environment Parameter Store overlay is declared as an `optional:`
#     import in application-dev.yml and application-prod.yml, where the
#     parameter path can name the environment it belongs to.
# =============================================================================

server:
  # WHY : Assumptions: 8080 is pinned by three other artifacts, so this key
  #       restates a shared contract rather than choosing a value. The image's
  #       HEALTHCHECK probes https://127.0.0.1:8080/actuator/health at
  #       services/authorization-service/Dockerfile L223-L226 beside its EXPOSE
  #       8080 at L169; the load balancer's target group health-checks the same
  #       port and path; and the security group admits ONLY the load balancer to
  #       it. Changing the port here alone leaves all three pointed at a closed
  #       port, which presents as a task that never turns healthy rather than as
  #       a configuration mistake.
  port: 8080

  ssl:
    # WHY : (1) Refactoring Rationale: without this block the
    #       load-balancer-to-task hop would be cleartext while the hop in front of
    #       it is encrypted, so the protected path would stop at the load balancer
    #       and every request would then cross the private application subnets
    #       readable. For this context that traffic carries primary account
    #       numbers, authorization amounts and merchant identity, alongside the
    #       bearer token that authorised each request.
    #       (2) Assumptions: this is one half of a two-part change; the other half
    #       is target_protocol = "HTTPS" in infra/modules/ecs-service. Either half
    #       alone means every probe speaks the wrong protocol and no task turns
    #       healthy, so the two move together.
    enabled: true

    # WHY : Refactoring Rationale: these four properties replace a
    #       `certificate` / `certificate-private-key` pair that read PEM CONTENT
    #       from two environment variables injected from Secrets Manager. The
    #       comment that stood here claimed the material was "not stored in the
    #       task definition, in Terraform state or in plan output"; the first and
    #       last were true and the middle one was FALSE. The pair was produced by
    #       a managed `tls_private_key` resource in each environment root, so the
    #       private key was written to Terraform state, and the SAME key was then
    #       copied into two Secrets Manager entries and injected into every online
    #       task -- one key for all eight services, held by anyone who could read
    #       the state file. The claim is withdrawn and the mechanism is changed
    #       rather than the sentence rewritten.
    # WHY : Assumptions: the keystore is minted by THIS TASK at startup, by
    #       config/docker/generate-listener-material.sh, which is the image's
    #       entry point. It draws a fresh 2048-bit RSA key and a self-signed leaf
    #       with keytool, writes them mode 0600 on the task's own encrypted
    #       ephemeral volume, exports the three placeholders below, and then
    #       `exec`s the JVM. No key is expressible in source, reaches Terraform
    #       state, reaches Secrets Manager, or is shared by two tasks. That
    #       script's header records the three alternatives measured and rejected,
    #       including why an ephemeral `tls_private_key` cannot be used here.
    # WHY : Assumptions: an Application Load Balancer does NOT validate the
    #       certificate a target in an HTTPS target group presents, so a per-task
    #       self-signed leaf is accepted at that hop exactly as the previous
    #       shared self-signed leaf was. The certificate that IS verified -- the
    #       one API Gateway checks against `server_name_to_verify` -- belongs to
    #       the load balancer's own listener and is the operator-supplied ACM
    #       certificate, which this change does not touch.
    # WHY : Alternatives Considered: keeping PEM properties and having the script
    #       write cert.pem and key.pem for `file:` locations, which these
    #       properties also accept. Rejected on a measured limitation rather than
    #       a preference: keytool exports a certificate as PEM but cannot export a
    #       private key at all, so a PEM pair would need openssl, which is absent
    #       from the pinned runtime digest. PKCS#12 is the one format the tooling
    #       already in the image can produce.
    # WHY : Trade-offs: `key-store` and `key-alias` carry defaults matching what
    #       the script writes, so a local `java -jar` run against a hand-made
    #       keystore needs only the password. `key-store-password` deliberately
    #       carries NO default: a literal here would read as a committed secret to
    #       every reader and to the repository's secret scanner, and an absent
    #       password must stop startup rather than fall back to cleartext, which
    #       would present as a healthy service that had quietly stopped meeting
    #       the requirement this block exists for.
    key-store: ${CARDDEMO_SERVER_TLS_KEYSTORE:file:/tmp/carddemo-tls/listener.p12}
    key-store-type: PKCS12
    key-store-password: ${CARDDEMO_SERVER_TLS_KEYSTORE_PASSWORD}
    key-alias: ${CARDDEMO_SERVER_TLS_KEY_ALIAS:carddemo-listener}

    # WHY : (1) Assumptions: the two versions are named rather than left to the
    #       JDK default, which still negotiates the withdrawn TLS 1.1. This holds
    #       the same floor the alb module pins on its listener, so one floor
    #       applies at every hop.
    #       (2) Trade-offs: no `ciphers` list. A hand-written list ages into a
    #       liability, silently permitting a suite the JDK has since deprecated;
    #       the runtime's own default set for these two versions is maintained by
    #       whoever ships it.
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3

  # WHY : Assumptions: for this context draining matters more than for its peers,
  #       because a message being handled at shutdown is midway through a
  #       transaction that has already locked an account's summary row. Draining
  #       lets that transaction reach its commit and its outbox row, so the
  #       requester still gets an answer; killing it mid-flight would roll the
  #       decision back and rely on redelivery to redo it.
  shutdown: graceful

spring:
  application:
    # WHY : Assumptions: this name is the value MetricsConfig in
    #       com.carddemo.common.observability puts on every metric as a common
    #       tag, so it is how one context's error rate is told from another's on a
    #       shared dashboard. It matches the ECR repository and the ECS service
    #       name so that a metric, an image and a task all say the same word.
    name: authorization-service

  config:
    # WHY : (1) Assumptions: it carries the single console log pattern that emits
    #       the correlation identifier and the platform request identifier from the
    #       logging context, which CorrelationIdFilter and the message consumer
    #       both populate. Restating the pattern per service is what let the two
    #       drift apart before this import existed.
    #       (2) Assumptions: this is the ONLY import in the base document, and the
    #       Parameter Store overlay is declared per profile instead --
    #       `optional:aws-parameterstore:/carddemo/<env>/authorization/` in
    #       application-dev.yml and application-prod.yml -- because the parameter
    #       path has to name the environment it reads, which a shared base document
    #       cannot know. Terraform module outputs reach the running service through
    #       that overlay and through environment variables the ECS task definition
    #       sets from Parameter Store and from Secrets Manager container secrets;
    #       nothing here holds a resolved endpoint.
    #       Alternatives Considered: declaring the parameter-store import here
    #       without the `optional:` prefix so a missing overlay failed loudly.
    #       Rejected because the subtree is legitimately EMPTY in a deployment
    #       that delivers every value as an environment variable, and a
    #       non-optional import raises ConfigDataNotFoundException on a claimed
    #       location that holds no resource -- so a correct deployment would fail
    #       to start over the absence of values it was never relying on.
    #       Refactoring Rationale: this note previously gave a different reason --
    #       that the sibling POM declares no parameter-store starter, so no
    #       resolver claims the prefix. That is no longer true and was the reason
    #       the two profile overlays disagreed with each other: pom.xml declares
    #       io.awspring.cloud:spring-cloud-aws-starter-parameter-store, so a
    #       resolver DOES claim the prefix and DOES have the SSM client it needs.
    #       Both overlays now take that one path, and `optional:` is retained for
    #       the reason stated above rather than for a classpath absence that no
    #       longer exists.
    import: "classpath:/carddemo-common-defaults.yml"

  lifecycle:
    # WHY : Trade-offs: twenty seconds against the platform's thirty-second
    #       SIGTERM-to-SIGKILL window. Giving up the last ten seconds buys the
    #       certainty that the JVM finishes and flushes its log buffers inside the
    #       window rather than being terminated mid-transaction.
    timeout-per-shutdown-phase: 20s

  datasource:
    # WHY : (1) Assumptions: all three arrive as environment variables the ECS
    #       task definition sets -- the writer endpoint from Parameter Store, the
    #       credential pair from a Secrets Manager container secret -- and the
    #       framework's relaxed binding maps SPRING_DATASOURCE_URL,
    #       SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD onto these
    #       three keys unaided. None of them is expressible here as a literal, so
    #       no endpoint and no credential is in this file or in the image.
    #       (2) Assumptions: this credential is the RUNTIME role,
    #       carddemo_authorization, which holds USAGE on the schema plus SELECT,
    #       INSERT and UPDATE and has CREATE explicitly revoked. It is NOT the
    #       credential that applies migrations; that one is declared separately
    #       under spring.flyway below, and the reason the two are not
    #       interchangeable is argued there.
    #       (3) Trade-offs: none of the three carries a default. Alternatives
    #       Considered: a localhost fallback so a developer could start the
    #       service without configuring anything. Rejected on the concrete
    #       consequence: this context WRITES authorization decisions and fraud
    #       marks, so a service that silently started against a plausible wrong
    #       database would persist them there, and the damage would be discovered
    #       from the data rather than from the startup log. An unresolved
    #       placeholder fails immediately and names the variable it wanted.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

    hikari:
      # WHY : Assumptions: the pool is named so that a connection-leak or
      #       pool-exhaustion log line, and the pool's own metrics, identify this
      #       context on a dashboard shared with seven peers. Left unset the pool
      #       reports as HikariPool-1, which is what every service would report.
      pool-name: authorization-pool

      # WHY : (1) Assumptions: this is the SINGLE authoritative mechanism that
      #       pins the schema, and it is deliberately the only one. This module
      #       owns exactly one schema, so resolving every unqualified identifier
      #       inside it is what stops a stray query reaching another bounded
      #       context's tables on a cluster that holds all eight schemas. No
      #       second overlapping mechanism is set -- config/DataSourceConfig.java
      #       reads this property and declares no schema of its own -- because two
      #       mechanisms leave a reader unable to tell which one decided.
      #       (2) Assumptions: the schema name is QUOTED here, and it has to be.
      #       `authorization` is a PostgreSQL reserved keyword, so an unquoted
      #       occurrence in SQL TEXT is a syntax error rather than a wrong lookup;
      #       data-migration/sql/V0__schemas_and_roles.sql records the failure and
      #       its misleading message at L716-L737 and quotes the name at every SQL
      #       occurrence of its own from L738. Because this one setting resolves
      #       every unqualified name, the quoting concern lives here and nowhere
      #       else: no entity annotation and no repository query repeats it.
      #       (3) Alternatives Considered: qualifying every identifier in every
      #       query instead, whether through a schema attribute on each entity or
      #       a prefix in each JPQL string. Rejected because it copies the schema
      #       name into every repository method and every annotation, where a
      #       single omission still resolves -- against whatever the search path
      #       happened to be -- so the drift is silent rather than loud.
      #       (4) Alternatives Considered: currentSchema on the JDBC URL. Rejected
      #       because the URL arrives from Parameter Store, so the schema would
      #       become an infrastructure value that a reader of this file could not
      #       see. Trade-offs: this runs one extra statement per new connection,
      #       which the pool amortises across the connection's whole lifetime.
      connection-init-sql: SET search_path TO "authorization"

      # WHY : Trade-offs: ten connections against a task count of two or more.
      #       This context holds a PESSIMISTIC row lock on a summary while it
      #       decides, and the outbox drain holds locks on its claimed rows, so
      #       connections here are held for longer than in a purely
      #       request-response context. Ten leaves headroom for the consumer's
      #       concurrency plus the drain plus the web endpoints without letting one
      #       task monopolise a serverless cluster's connection budget.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000

      data-source-properties:
        # WHY : Assumptions: verify-full, not require. `require` encrypts without
        #       authenticating the server, so it stops an eavesdropper and not an
        #       impostor; verify-full checks the certificate chain and the
        #       hostname, which is what makes the encryption worth having.
        sslmode: verify-full
        sslrootcert: ${CARDDEMO_DB_SSL_ROOT_CERT:/etc/ssl/certs/carddemo-rds-ca-bundle.pem}

  flyway:
    # WHY : Assumptions: flyway-core alone is not enough and the way it fails is
    #       why this needs saying here. Flyway 10 moved database-specific support
    #       out of core, so the sibling POM declares flyway-database-postgresql
    #       beside it; without that artifact the application starts and then aborts
    #       when Flyway cannot resolve a PostgreSQL URL to a database type it
    #       knows, and nothing in the failure names the missing dependency.
    enabled: true
    locations: classpath:db/migration

    # WHY : (1) Assumptions: the schema name is written BARE here, and this is the
    #       one place in this file where the reserved word must NOT be quoted.
    #       Refactoring Rationale: both keys previously read '"authorization"' --
    #       fourteen characters including two literal double quotes -- on the stated
    #       ground that "the schema name is quoted here for the same reason it is
    #       quoted on the init statement above". That reason does not transfer, and
    #       the value was measured to fail. Flyway treats these keys as NAMES, not as
    #       SQL fragments: it takes the string as the identifier and applies the
    #       database's own quoting when it emits DDL, so a value carrying quote
    #       characters is emitted as """authorization""" and PostgreSQL
    #       resolves a schema whose name literally contains two double quotes. Run
    #       against a real PostgreSQL 17 instance holding this schema, the quoted form
    #       fails migration with SQLSTATE 3F000, `schema ""authorization"" does not
    #       exist`; the bare form resolves "authorization"."flyway_schema_history"
    #       and validates. The init statement above is the opposite case and keeps
    #       its quotes: that value is SQL text this application hands to the server
    #       verbatim, where an unquoted reserved word IS a syntax error.
    #       (2) Assumptions: `schemas` names every schema Flyway manages while
    #       `default-schema` decides where its history table and unqualified objects
    #       resolve, so both are set. Setting only one can place migration state in
    #       `public` while tables land in the authorization schema, making a repeated
    #       run report the wrong history.
    #       (3) Assumptions: create-schemas is false because the schema, the three
    #       roles that own and use it, and their grants are all bootstrapped
    #       elsewhere and earlier: data-migration/sql/V0__schemas_and_roles.sql
    #       issues CREATE SCHEMA "authorization" AUTHORIZATION
    #       carddemo_authorization_owner at L738 with the matching ALTER SCHEMA
    #       OWNER TO at L739, and grants USAGE while REVOKEing CREATE from the
    #       runtime role at L940-L946. db/migration/V1__authorization.sql owns the
    #       TABLES ONLY -- four CREATE TABLE and three CREATE INDEX, with no
    #       CREATE SCHEMA, no CREATE ROLE and no GRANT anywhere in it.
    #       Alternatives Considered: letting Flyway create the schema, which is
    #       one fewer bootstrap step. Rejected because Flyway would then create it
    #       owned by whichever role connected and with the default grant set,
    #       so schema ownership would be decided in two places that no mechanism
    #       keeps in agreement, and the ALTER DEFAULT PRIVILEGES clauses V0 keys
    #       on carddemo_authorization_owner would never fire.
    schemas: authorization
    default-schema: authorization

    # WHY : Assumptions: baseline-on-migrate is false because the bootstrap
    #       provisions an EMPTY schema, so there is never pre-existing state to
    #       baseline over. Alternatives Considered: setting it true, which is the
    #       usual accommodation for a database that predates Flyway. Rejected
    #       because it converts the one failure this setting can report -- a
    #       non-empty schema with no history table, which here means the V1
    #       migration did not reach the classpath -- into a silent success that
    #       writes a baseline row and then applies nothing, leaving a service
    #       running against tables no migration in this module created.
    baseline-on-migrate: false

    # WHY : Assumptions: create-schemas is false because the schema is created and
    #       owned by the bootstrap, as argued in full at the `schemas` key above --
    #       V0 L738-L739 create it AUTHORIZATION carddemo_authorization_owner, and
    #       V1 in this module creates tables only. Alternatives Considered: leaving
    #       it at the default true, which would let Flyway create the schema when
    #       it is missing. Rejected because Flyway would create it owned by the
    #       connecting role and with the default grant set, so ownership would be
    #       decided in two places and the ALTER DEFAULT PRIVILEGES clauses V0 keys
    #       on carddemo_authorization_owner would never fire, leaving the runtime
    #       role with no grants on the tables it must read.
    create-schemas: false

    # WHY : Trade-offs: clean is disabled unconditionally, in every profile. It
    #       drops every object in the schema, and the one environment where that
    #       is survivable is the one where an operator is most likely to run it by
    #       accident. Nothing in this repository needs it.
    clean-disabled: true

    # Assumptions: Flyway authenticates as a DIFFERENT database role than the one
    #   the datasource above uses, and the two are not interchangeable.
    #   data-migration/sql/V0__schemas_and_roles.sql creates three tiers of role
    #   per bounded context: a NOLOGIN carddemo_authorization_owner that owns the
    #   schema and everything in it, a carddemo_authorization_migrator login that is a
    #   member of that owner, and the carddemo_authorization login this service serves
    #   requests as. The runtime role holds USAGE on the schema plus SELECT,
    #   INSERT and UPDATE on its tables -- CREATE is explicitly REVOKEd from it --
    #   so it could not apply this migration even if asked to, and equally cannot
    #   drop or alter the tables it reads.
    # Refactoring Rationale: these two keys did not exist, and Flyway therefore
    #   migrated under the runtime credential. That made the runtime role the
    #   owner of the schema and of every table the migration created, so the one
    #   long-lived credential every request ran under also held DDL authority over
    #   the data it served. Naming a separate migration credential here is what
    #   allows the bootstrap SQL to reduce the runtime role to named DML.
    # Trade-offs: no fallback value, for the same reason the datasource
    #   credential above has none -- a default would let the process start against
    #   a credential nobody chose. The consequence is deliberate: a deployment
    #   that injects the runtime credential and forgets this one fails at startup
    #   on an unresolved placeholder, which names the variable it is missing,
    #   rather than migrating as the wrong identity and succeeding.
    # Assumptions: setting spring.flyway.user is also what gives Flyway its own
    #   DataSource. Spring Boot builds a separate SimpleDriverDataSource derived
    #   from the application DataSource whenever this key is set -- verified
    #   against FlywayAutoConfiguration in spring-boot-flyway 4.1.0, whose
    #   getMigrationDataSource falls to a derivedFrom builder when the Flyway URL
    #   is absent and the Flyway user is not -- so the URL, driver and TLS terms
    #   are inherited while the credential is replaced. That separation matters
    #   beyond tidiness: sharing the Hikari pool would leave the SET ROLE below
    #   applied to pooled connections that later serve runtime queries.
    user: ${SPRING_FLYWAY_USER}
    password: ${SPRING_FLYWAY_PASSWORD}

    # Assumptions: this is the other half of the ownership split, and without it
    #   the migration credential alone achieves nothing. V0 grants
    #   carddemo_authorization_migrator its owner WITH INHERIT FALSE, so a session
    #   authenticated as the migrator holds NO privilege at all until it assumes
    #   the owner explicitly. Flyway runs every string here on each connection it
    #   opens, before any migration statement, so every object V1 creates is owned
    #   by carddemo_authorization_owner rather than by the credential that connected.
    # Trade-offs: INHERIT FALSE plus an explicit SET ROLE is more moving parts
    #   than granting the migrator ownership directly, and it buys two properties
    #   that arrangement cannot have. A stolen migrator credential used without
    #   this statement can read and write nothing, and every
    #   ALTER DEFAULT PRIVILEGES FOR ROLE carddemo_authorization_owner clause in the
    #   bootstrap SQL fires -- those clauses are keyed on the CREATING role, so a
    #   migration that created tables as the migrator would leave them all inert
    #   and the runtime role would receive no grants on the tables it must read.
    # Alternatives Considered: ALTER ROLE carddemo_authorization_migrator SET role,
    #   which is a per-role server-side default and needs nothing in this file.
    #   Rejected because it makes a privilege decision invisible at the point it
    #   takes effect: a reader of this configuration would see a migration running
    #   as the migrator and have no way to learn that the server silently
    #   substitutes another identity.
    init-sqls:
    # Assumptions: the statement is TERMINATED. Spring Boot joins this list with a
    #   newline and hands Flyway one script, so an unterminated statement is
    #   concatenated with whatever follows it -- measured against PostgreSQL 17 as
    #   `syntax error at or near "SET"` when a second entry was added under the test
    #   profile. One entry cannot hit that today; the semicolon is what keeps a second
    #   entry from breaking the first.
      - "SET ROLE carddemo_authorization_owner;"


  jpa:
    hibernate:
      # WHY : Assumptions: the provider never emits schema changes, because Flyway
      #       owns every object absolutely. The column types in
      #       db/migration/V1__authorization.sql are derived byte-exactly from
      #       app/app-authorization-ims-db2-mq/cpy/CIPAUSMY.cpy and cpy/CIPAUDTY
      #       .cpy and from ddl/AUTHFRDS.ddl -- packed-decimal money at NUMERIC
      #       scale 2, the five-slot status array as five discrete columns, the
      #       composite packed key as two integer columns.
      #       Alternatives Considered: `update`, or `validate`. Both rejected.
      #       `update` lets the provider infer and apply a change from the entity
      #       mapping, which would widen or re-type a column the record layout
      #       pinned and would diverge the running schema from the migration that
      #       is the contract, with nothing recording that it happened. `validate`
      #       rejects a mismatch but ties startup to the provider's own idea of
      #       type equivalence, which differs from PostgreSQL's for NUMERIC and
      #       CHAR, so it would refuse to start on a schema the migration built
      #       correctly.
      ddl-auto: none

    # WHY : Trade-offs: no default_schema property is set, deliberately, which is
    #       a difference from the peer contexts. Setting it would qualify every
    #       generated statement with the schema name, and the provider does not
    #       quote a qualifier it was handed unquoted -- so with a reserved word for
    #       a schema name, that property turns every generated statement into a
    #       syntax error. Resolution through the pinned search_path avoids the
    #       problem rather than working around it.

    # WHY : Trade-offs: open-in-view is false, and the framework's default is
    #       true. Left at the default, the persistence session is held open for
    #       the whole request INCLUDING response rendering, so every in-flight
    #       request keeps a pooled connection until its body has been written.
    #       This context reaches the account context over HTTP inside a deciding
    #       transaction, so a held session there would add response-serialisation
    #       time to a connection already waiting on a network hop, and the pool
    #       sized at ten would exhaust under load the load balancer treats as
    #       ordinary. The accepted cost is that a mapper touching an unfetched
    #       association raises rather than lazily loading, which is why the
    #       repositories return fully populated projections.
    open-in-view: false

    # WHY : Trade-offs: statement logging is OFF here and turned on only in
    #       application-dev.yml. The parameters bound by this context's statements
    #       are primary account numbers and authorization amounts, so enabling it
    #       in a shared base file would put them in a log stream every operator
    #       can read. The cost is that reproducing a query in a deployed
    #       environment needs a profile change rather than a log filter.
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # WHY : (1) Assumptions: the issuer is a user-pool URI resolved at run
          #       time from a Terraform output, never a literal here. Naming it
          #       makes the filter chain verify the signature and the issuer of
          #       every bearer token before SecurityConfig's path rules are
          #       consulted.
          #       (2) Assumptions: what the verified token then AUTHORIZES is
          #       decided by config/SecurityConfig.java, which converts the
          #       `cognito:groups` claim into authorities through common-lib's
          #       com.carddemo.common.security.JwtRoleConverter. The fraud
          #       state-setting route is guarded by the carddemo-admin group alone
          #       -- FRAUD_PATH_PATTERN with hasAuthority(ADMIN_AUTHORITY) -- while
          #       the read routes admit carddemo-admin or carddemo-user, and the
          #       chain ends in denyAll() so an unnamed path is refused rather
          #       than merely authenticated.
          #       (3) Assumptions: that guard is an INTENTIONAL DOCUMENTED
          #       IMPROVEMENT and is stated as one rather than as a port, because
          #       the baseline carries no resource-level security to port. All
          #       three of this context's transactions are defined
          #       RESSEC(NO) CMDSEC(NO) --
          #       app/app-authorization-ims-db2-mq/csd/CRDDEMO2.csd L46 for
          #       TRANSACTION(CPVD), L56 for TRANSACTION(CPVS) and L66 for
          #       TRANSACTION(CP00) -- so the region performed no resource and no
          #       command check at all, and reaching the fraud program was gated
          #       only by which menu an operator navigated from. The target adds a
          #       check the baseline did not have; the divergence is recorded in
          #       docs/architecture/security-and-identity.md rather than presented
          #       as parity.
          #       (4) Refactoring Rationale: in the baseline the user type
          #       travelled in the COMMAREA as CDEMO-USER-TYPE, storage the
          #       terminal echoed back on every turn, so the claim of being an
          #       administrator was carried in a field the client held. Here the
          #       group claim is inside a signed token this service verifies, so a
          #       client cannot assert its own authority -- which is what makes a
          #       stateless handler safe to expose without a session store.
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

  cloud:
    aws:
      sqs:
        # WHY : Assumptions: this block is present here and absent from most peer
        #       contexts because this one owns the two authorization queues. The
        #       region and credentials are NOT set: the starter resolves both from
        #       the task role and the task's own region, which is what keeps a
        #       long-lived key out of this file and out of the image.
        enabled: true

  # WHY : Refactoring Rationale: this key was absent, and its absence made this
  #       module's published contract unreachable. openapi/authorization-api.yaml is
  #       packaged into the jar and is the interface ui/src/api/authorization.ts is
  #       written against, but the framework serves static content only from the
  #       locations named here and classpath:/openapi/ is not among its four
  #       defaults -- so the contract answered 404 at every URL while being present
  #       in the artifact. The reference and transaction contexts already carried
  #       this list; this context was the outlier.
  #       Assumptions: this key REPLACES the framework's default list rather than
  #       adding to it, which is why all four defaults are restated below. Dropping
  #       classpath:/META-INF/resources/ in particular would stop the Swagger UI
  #       assets being served at all, because they ship inside a webjar under
  #       exactly that path. classpath:/openapi/ is added rather than the class-path
  #       root deliberately: the root would publish this configuration file itself,
  #       placeholders and all, on an HTTP endpoint.
  web:
    resources:
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        - classpath:/openapi/

management:
  endpoints:
    web:
      exposure:
        # WHY : Trade-offs: two endpoints, not the wildcard. Health is required by
        #       the target group and the container probe; prometheus is required by
        #       the metric scrape. Every other endpoint -- including the
        #       write-capable ones -- stays unreachable, because an exposure list is
        #       the only thing standing between a reachable actuator and a runtime
        #       reconfiguration by anyone who can reach the port.
        include: health,prometheus
  endpoint:
    health:
      # WHY : Trade-offs: never show details, in every environment, and neither
      #       profile relaxes it. The detail payload names the database and the
      #       queues this context depends on and reports their reachability, and
      #       the health path is deliberately unauthenticated so the load balancer
      #       can poll it -- so details here would be an unauthenticated topology
      #       disclosure at the edge. Alternatives Considered: `when-authorized`,
      #       which would show detail to a bearer-token holder and hide it from the
      #       probe. Rejected because the probe is the only caller this endpoint
      #       exists for, so the setting would add an authorization path that
      #       nothing uses while still answering the unauthenticated probe from the
      #       same handler. The accepted cost is that diagnosing which dependency
      #       is down needs the log stream rather than the probe response.
      show-details: never

# WHY : Refactoring Rationale: this whole block was absent, so nothing in this
#       context published the hand-authored contract and nothing pinned the
#       document the browser view would show. The sibling POM carries
#       springdoc-openapi-starter-webmvc-ui, so the view and the generated document
#       were both being served on library defaults: the view offered the generated
#       description of a context whose controllers are authored at a later index --
#       an empty paths object today -- and presented it as authoritative, while
#       openapi/authorization-api.yaml was reachable at no URL. Both halves are
#       settled here.
# WHY : Alternatives Considered: switching the generated endpoint off instead of
#       pinning the view at the authored contract. Rejected because the generated
#       document earns its keep as the thing to compare the implementation against
#       when it and the contract are suspected of having diverged; removing it would
#       remove the only mechanical check on that drift. Publishing it as the primary
#       document is what is refused, not producing it.
springdoc:

  api-docs:
    # WHY : Assumptions: stated explicitly because the library's two defaults for
    #       this setting disagree. Its autoconfiguration is conditional on the
    #       property with match-if-missing, so an absent property leaves the endpoint
    #       served; but the backing properties object declares the field as a plain
    #       boolean with no initialiser, so anything reading that object while the
    #       property is absent is told the document is disabled. Setting it true
    #       makes the two agree.
    enabled: true

    # WHY : Assumptions: the library's default path, pinned so the path a contract
    #       comparison fetches cannot move under a library upgrade. A moved path does
    #       not fail a build; it returns 404 to whatever was fetching the document.
    path: /v3/api-docs

    # WHY : Assumptions: pinned rather than inherited. This release already defaults
    #       to the 3.1 form, so the line changes nothing today; it is here because
    #       the contract of record declares openapi 3.1.0 and a future default
    #       reverting to 3.0 would serve a document in a different specification
    #       version than the file it is checked against, and the mismatch would be
    #       reported as contract drift when it was really a library default moving
    #       underneath.
    version: openapi_3_1

  swagger-ui:
    # WHY : Assumptions: the library's default page path, pinned for the same reason
    #       as the document path above. This page is a human entry point only, so it
    #       is declared once here rather than varied per environment.
    path: /swagger-ui.html

    # WHY : Assumptions: this is the path spring.web.resources.static-locations
    #       above resolves openapi/authorization-api.yaml to, so the two move
    #       together: remove classpath:/openapi/ from that list and this URL 404s.
    url: /authorization-api.yaml

    # WHY : Assumptions: without this the view ALSO offers its own bundled sample
    #       definition in the same selector as the contract above, so a reader can
    #       silently end up reading a document that describes nothing in this
    #       service. Disabling it leaves exactly one definition in the selector.
    disable-swagger-default-url: true

  # WHY : Trade-offs: sorting the generated document's keys costs a little
  #       serialisation work on each request for it, and buys a document that is
  #       diffable. Without it the key order follows reflection order, which can
  #       change between builds for reasons that have nothing to do with the API, so
  #       a diff against authorization-api.yaml would report noise and the drift
  #       check that comparison exists to perform would stop being trusted.
  writer-with-order-by-keys: true


logging:
  level:
    # WHY : Trade-offs: WARN at the root, with this context's own packages at INFO.
    #       The consumer's per-message decisions are the audit trail this context
    #       exists to produce, so they are logged; third-party chatter is not.
    root: WARN
    com.carddemo: INFO

    # WHY : Assumptions: the SQL parameter-binding logger is pinned to WARN
    #       explicitly rather than left to inherit. At TRACE it writes every bound
    #       parameter, and the parameters here are primary account numbers and
    #       authorization amounts. Pinning it means no profile can turn it up by
    #       raising a broader level.
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.SQL: WARN

carddemo:
  security:
    # WHY : Assumptions: validating the issuer is not validating the token. The
    #       issuer-uri above makes the filter chain verify the signature, the
    #       issuer and the time claims, and that is where its guarantees end. One
    #       user pool mints TWO token kinds from the same signing key: an access
    #       token, whose token_use claim is `access`, and an identity token, whose
    #       token_use claim is `id`. Both are validly signed by the configured
    #       issuer, so without the three checks below an identity token - meant to
    #       describe a user to a client, never to authorize an API call - would be
    #       accepted here. In this context the consequence is a fraud mark applied
    #       or a pending authorization disclosed on the wrong credential.
    #       Assumptions: these three keys are read by config/SecurityConfig.java,
    #       whose jwtDecoder bean composes the framework's own issuer-and-time
    #       validators FIRST and then a delegating CognitoAccessTokenValidator, so
    #       a token failing any of the three is rejected during decoding and never
    #       reaches JwtRoleConverter. The shape is identical in every context that
    #       publishes a web endpoint, so those chains cannot diverge in what they
    #       accept.
    #       Alternatives Considered: the framework's own
    #       spring.security.oauth2.resourceserver.jwt.audiences key, which is the
    #       obvious declarative route and is wrong here. A Cognito ACCESS token
    #       carries no aud claim at all - the client id travels in client_id
    #       instead - so an audience validator would reject every access token the
    #       sign-on flow issues while accepting the identity tokens these keys
    #       exist to refuse. It would invert the control.
    #       Trade-offs: required-scope names the scope the pool grants to a token
    #       obtained through its authentication API rather than a custom
    #       resource-server scope. Custom scopes are granted only through the
    #       OAuth flows this design does not use, so requiring one would reject
    #       every token the sign-on flow can produce. What the value still buys is
    #       decisive: an identity token carries no scope claim whatsoever, so
    #       requiring any scope at all is a second, independent rejection of the
    #       wrong token kind.
    jwt:
      expected-token-use: access
      expected-client-id: ${CARDDEMO_SECURITY_JWT_EXPECTED_CLIENT_ID}
      required-scope: aws.cognito.signin.user.admin

    # WHY : Refactoring Rationale: a `mask-hmac-key` setting stood here, delivered as
    #       CARDDEMO_MASK_HMAC_KEY and shared with the extract-transform-load image, and it
    #       keyed a SECOND tokeniser bean for the queue identities that
    #       carddemo.messaging.hmac-key below already keys. It is withdrawn, and the
    #       withdrawal is the security-preserving direction rather than the tidy one: the
    #       shared key is held by a one-off migration workload that reads cardholder
    #       extracts, so keying production queue metadata with it would let that workload
    #       compute the group identity of any card's messages, and would couple the
    #       rotation of a migration secret to the ordering guarantee of a running queue.
    #       The property the shared key was chosen for -- one value across every producer,
    #       so equal cards land in equal groups -- is a property of carddemo.messaging.
    #       hmac-key too, which both roots deliver as one secret to every task.

    cognito:
      # WHY : Assumptions: these exist to be COMPARED, not to be chosen.
      #       common-lib's JwtRoleConverter holds the authority vocabulary as
      #       compiled constants and refuses to start when a configured name differs
      #       from its constant, so declaring them here is what turns a pool whose
      #       groups were renamed into a startup failure rather than a service that
      #       authenticates every request and authorizes none of them.
      #       Assumptions: the defaults are the same two names
      #       infra/modules/cognito fixes as non-overridable, and it emits them as
      #       admin_group_name and user_group_name outputs -- so a deployment that
      #       wires those outputs into the two environment variables below cannot
      #       disagree with this file, and one that wires nothing still starts.
      #       Alternatives Considered: hard-coding the constants at the call site,
      #       which is what an earlier revision of this service did by using the
      #       converter's no-argument constructor. Rejected because it removes the
      #       comparison entirely: the service would keep authorizing against names
      #       the deployed pool no longer issues, and every protected request would
      #       return 403 with nothing in the logs naming the cause.
      admin-group-name: ${CARDDEMO_COGNITO_ADMIN_GROUP_NAME:carddemo-admin}
      user-group-name: ${CARDDEMO_COGNITO_USER_GROUP_NAME:carddemo-user}

  # Two properties are deliberately NOT declared in this file and are documented here instead,
  # because mapper/PendingAuthViewMapper.java takes CursorToken as a constructor argument and a
  # bean that is not published cannot be injected:
  #
  #   carddemo.pagination.cursor.signing-key   base64 key material, at least 32 bytes
  #   carddemo.pagination.cursor.lifetime      ISO-8601 duration, defaulting to PT15M
  #
  # CardDemoCommonAutoConfiguration publishes one CursorToken bean and publishes it only when the
  # first property is set, so supplying it IS the wiring. The deployment supplies it from the
  # purpose-scoped secret both Terraform roots create, as the environment variable
  # CARDDEMO_PAGINATION_CURSOR_SIGNING_KEY -- Spring Boot's relaxed binding maps that spelling onto
  # the hyphenated property name, which CardDemoCommonAutoConfigurationIT asserts rather than
  # assumes. infra/modules/ecs-service lists the name in required_secret_environment_names for this
  # service and asserts biconditionally that exactly the four list-publishing services receive it,
  # so a deployment that omits it fails at plan rather than at container start.
  # Trade-offs: no key is written here even as an environment placeholder, and the second half of
  #   that is the part worth stating. A literal default would be a signing key committed to source,
  #   and any deployment failing to override it would accept keyset cursors minted by anyone holding
  #   this repository. A placeholder with no default is no better: the property then EXISTS and
  #   resolves during condition evaluation, so every context that merely imports the
  #   auto-configuration fails on an unresolvable placeholder rather than simply doing without the
  #   sealer -- which would break every repository integration test in this module, none of which
  #   pages anything. Leaving the property absent withholds the bean cleanly, and a deployed task
  #   that omits the variable still fails at startup, because the components named above require it.
  #   This matches services/transaction-service/src/main/resources/application.yml, which reached the
  #   same conclusion first; the reasoning is repeated rather than cross-referenced because a reader
  #   of this file would otherwise see an undeclared property and add the placeholder that breaks it.


  messaging:
    # WHY : (1) Assumptions: the queue is named by an injected value rather than a
    #       literal, because one image runs against every environment's queues.
    #       The variable holds the reference to a FIFO queue following the pattern
    #       carddemo-pauth-request-<env>.fifo, and its reply counterpart follows
    #       carddemo-pauth-reply-<env>.fifo; the reply destination itself is chosen
    #       per request -- COPAUA0C copies MQMD-REPLYTOQ off the request at
    #       app/app-authorization-ims-db2-mq/cbl/COPAUA0C.cbl L413-L414 -- so it is
    #       constrained here by reply-queue-allowlist below rather than by one
    #       static destination key.
    #       (2) Assumptions: the queue is FIFO, and its message group is one group
    #       PER CARD, carried as the keyed opaque derivation described under
    #       hmac-key below and never as the card number itself. Requests for one
    #       card therefore arrive in order while requests for different cards
    #       arrive in parallel, which is what lets the consumer take a row lock on
    #       one account's summary without serialising the whole service.
    #       Deduplication is by transaction identifier, so a redelivered put of the
    #       same transaction is accepted once within the queue's deduplication
    #       window regardless of whether its bytes are identical.
    #       Alternatives Considered: a standard queue, which costs less per message
    #       and has no throughput ceiling per group. Rejected on two concrete
    #       consequences rather than on preference: it offers no ordering guarantee
    #       at all, so two authorizations for one card could be decided against a
    #       summary row in the wrong order and produce a different available
    #       credit than the baseline's serial reads produce; and it offers no
    #       deduplication window, so a duplicate put would be decided twice and
    #       two replies would be sent for one transaction identifier.
    pauth-request-queue: ${CARDDEMO_MESSAGING_PAUTH_REQUEST_QUEUE}

    # WHY : (1) Assumptions: five SECONDS, converted from the baseline rather than
    #       chosen. COPAUA0C sets MOVE 5000 TO WS-WAIT-INTERVAL at L242 and passes
    #       it as MQGMO-WAITINTERVAL at L393 under MQGMO-WAIT at L389, and that
    #       field is expressed in MILLISECONDS -- so the literal 5000 is 5 s, not
    #       5000 s. The conversion is spelled out because a reader who takes the
    #       literal for seconds would configure a wait three orders of magnitude
    #       too long, and the symptom would be a consumer that appears to have
    #       stopped rather than one that is waiting.
    #       (2) Assumptions: an empty receive after this wait is NORMAL and is not
    #       an error. The baseline treats MQRC-NO-MSG-AVAILABLE at L416 by setting
    #       its no-more-messages flag at L417, which ends the loop opened at L326
    #       cleanly; the listener likewise completes its poll cycle and polls
    #       again, so an idle queue produces no error log and no failed health
    #       check.
    poll-timeout-seconds: 5

    # WHY : Assumptions: 10 is the SQS service maximum for a single ReceiveMessage
    #       call, so this is a ceiling the transport fixes rather than a tuning
    #       choice. It must not be confused with request-process-limit below: this
    #       key bounds ONE receive, while that one bounds the count of messages
    #       handled across many receives within a processing window. Conflating
    #       them would either request a batch the transport rejects or shrink the
    #       window to a tenth of the baseline's.
    max-messages-per-poll: 10

    # WHY : Trade-offs: ten messages in flight against a pool of ten connections.
    #       Each in-flight message holds one connection for the length of its own
    #       transaction, so raising this above the pool size converts contention
    #       for connections into connection-timeout failures that look like
    #       database trouble. Expressing it as a property rather than in the
    #       listener annotation is what lets an operator lower concurrency during a
    #       batch window without a rebuild.
    max-concurrent-messages: 10

    # WHY : (1) Assumptions: this is the count of requests one processing window
    #       handles before intake closes and reopens, and the value is the
    #       baseline's DECLARED bound: 05 WS-REQSTS-PROCESS-LIMIT PIC S9(4) COMP
    #       VALUE 500 at COPAUA0C.cbl L40.
    #       (2) Assumptions: the baseline's own control flow admits 501, and the
    #       arithmetic is spelled out because 500 is the number a reader expects
    #       and the off-by-one is invisible without it. The counter is
    #       POST-incremented -- ADD 1 TO WS-MSG-PROCESSED at L332, after the
    #       message has been processed -- and then tested with a STRICT greater-than
    #       at L339, IF WS-MSG-PROCESSED > WS-REQSTS-PROCESS-LIMIT. Counts 1
    #       through 500 all fail that test and read another request, so the loop
    #       ends only once the 501st has been handled.
    #       (3) Trade-offs: the declared 500 is enforced here and the observed 501
    #       is not reproduced, because the extra message is an artifact of the
    #       order of increment and comparison rather than a rule any part of the
    #       baseline states. That is a behavioural divergence and it is registered
    #       as D-AUTH-REQUEST-WINDOW in
    #       docs/architecture/cobol-to-service-traceability.md, with the same
    #       entry in docs/adr/ADR-004-messaging.md and
    #       docs/architecture/messaging-contracts.md, rather than being taken
    #       silently. Alternatives Considered: configuring 501 here to match the
    #       observed loop exactly. Rejected because it would contradict a
    #       divergence already registered in three documents and asserted by
    #       AuthorizationRequestListenerTest, so the register and the running
    #       system would disagree about which number is enforced.
    request-process-limit: 500

    # WHY : (1) Assumptions: no per-message expiry setting appears here, and its
    #       absence is a transport fact rather than an omission. The baseline sets
    #       MOVE 50 TO MQMD-EXPIRY at COPAUA0C.cbl L750, and that field is
    #       expressed in TENTHS OF A SECOND, so 50 is 5.0 s and not 50 s; the
    #       reply beside it is MQPER-NOT-PERSISTENT at L749, so the baseline asks
    #       the queue manager to discard a reply no requester is still waiting for.
    #       SQS HAS NO PER-MESSAGE TIME TO LIVE. Queue-level retention exists and
    #       applies to every message alike, so there is no configuration here that
    #       reproduces MQMD-EXPIRY.
    #       (2) Assumptions: the semantic is preserved in three parts instead. The
    #       producer carries the expiry INSTANT as an expiresAt message attribute,
    #       so the value survives queue time and clock differences; the consumer
    #       honours it by DROPPING the message and LOGGING the drop --
    #       service/AuthorizationRequestListener.java does this through common-lib's
    #       com.carddemo.common.messaging.MessageExpiry, logging
    #       event=auth.request.dropped with reason=expired, and treats an
    #       unparseable attribute as a drop too so a corrupted attribute cannot
    #       fail open; and reply-queue retention is kept short by
    #       infra/modules/sqs, mirroring L749 and L750. The five-second window a
    #       reply carries when a requester named none is a parity constant in that
    #       class, derived from L750.
    #       (3) Trade-offs: ENFORCEMENT MOVES FROM THE BROKER TO THE CONSUMER.
    #       Under the baseline the queue manager discarded an expired message and
    #       no program could act on one; here every consumer must check the
    #       attribute, and one that did not would act on a message the baseline
    #       would have discarded. Alternatives Considered: exposing the window as a
    #       property of this file so a deployment could tune it. Rejected because
    #       the value exists solely to reproduce L750: a deployment that widened it
    #       would change when a reply is considered worth sending with no entry in
    #       any divergence register, and a deployment that shortened it would drop
    #       replies the baseline delivered. The reasoning and the two rejected
    #       broker alternatives are recorded in docs/adr/ADR-004-messaging.md.
    #       (4) Assumptions: no maxReceiveCount key appears here either, for the
    #       same class of reason. Redelivery is bounded at FIVE receives by the
    #       redrive policy on the queue, provisioned by infra/modules/sqs, so it is
    #       queue infrastructure and not a client setting. The consequence for the
    #       listener is that it keeps NO retry counter of its own: two independent
    #       retry budgets would multiply into as many as twenty-five attempts, and
    #       a message would reach its dead-letter queue long after an operator
    #       expected it.
    #       (5) Assumptions: the unit of work is per message. The listener runs
    #       each message in its own REQUIRES_NEW transaction, which is the migrated
    #       form of the baseline's per-message syncpoint -- the EXEC CICS /
    #       SYNCPOINT / END-EXEC block at L334-L336, taken once per message inside
    #       the loop. A transaction shared across a poll batch would let one
    #       malformed message roll back its neighbours' committed decisions.

    # WHY : (1) Trade-offs: a one-second poll rather than a commit-time trigger.
    #       A trigger would publish sooner in the ordinary case and would publish
    #       NOTHING after a crash between commit and trigger -- which is the exact
    #       window the outbox exists to close -- so the poll covers both cases with
    #       one mechanism and bounds the added latency at this interval.
    #       (2) Trade-offs: twenty-five rows per pass. The whole pass runs in one
    #       transaction holding row locks, so a larger batch holds more locks for
    #       longer while a smaller one wastes a round trip per row; twenty-five
    #       drains a normal backlog in one pass without holding locks across a
    #       noticeable interval.
    outbox-poll-interval-ms: 1000
    outbox-batch-size: 25

    # WHY : (1) Assumptions: a PUBLISHED reply is kept for a bounded window and then
    #       deleted by OutboxPublisher.purgePublished, and a PENDING one is never
    #       deleted at all -- the repository's delete predicate requires a
    #       publication instant to be present, because deleting an unpublished row
    #       would lose the reply this table exists to guarantee.
    #       (2) Trade-offs: seven days rather than indefinitely. The window exists so
    #       an operator can answer whether a reply was sent for a given transaction;
    #       a row still carries an encoded reply containing a primary account
    #       number, so keeping one longer than that question needs is a disclosure
    #       surface rather than a safety margin.
    #       (3) Trade-offs: the sweep runs hourly rather than on the drain interval,
    #       because retention is measured in days and a per-second pass would issue a
    #       delete that matched nothing.
    outbox-retention-days: 7
    outbox-retention-sweep-interval-ms: 3600000

    # WHY : (1) Assumptions: this is the set of queue addresses a reply may be sent
    #       to, and the consumer compares the request's reply-to attribute against
    #       it by EXACT match. The attribute is chosen by whoever can put a message
    #       on the request queue, and a reply carries a card number, a transaction
    #       identifier and an authorization outcome -- so without this list the
    #       service would deliver that payload to any address a requester named,
    #       including a queue in another account.
    #       (2) Alternatives Considered: matching the address against a prefix or a
    #       pattern instead. Rejected because the legitimate set is a deployment
    #       fact rather than a shape: any pattern loose enough to cover the reply
    #       queues of several requesters also covers a queue whose name a requester
    #       could arrange to match.
    #       (3) Assumptions: the value is COMMA-SEPARATED and carries no default, so
    #       it can be supplied by the single environment variable the task
    #       definition sets from the sqs module's reply-queue outputs, and an
    #       unset list stops startup rather than leaving every requester silently
    #       unanswered.
    reply-queue-allowlist: ${CARDDEMO_MESSAGING_REPLY_QUEUE_ALLOWLIST}

    # WHY : (1) Assumptions: this is the key the queue GROUP identity and the
    #       queue CORRELATION identity are derived under, and it carries no
    #       default at all. A group identifier is message metadata: it sits
    #       outside the encrypted body, it is reported in queue telemetry, and it
    #       reaches every log and metric that observes the queue. The only
    #       per-card stable value otherwise available is the card number, so
    #       without this key the derivation collapses back to publishing a primary
    #       account number on every message -- which is why an unset value stops
    #       startup instead of falling back.
    #       (2) Alternatives Considered: an unkeyed digest, or a keyed digest with
    #       a published salt. Both rejected for one reason: the protected value is
    #       a sixteen-digit number with a check digit, so the candidate space is
    #       small enough to enumerate, and anyone holding a token could confirm
    #       which card produced it. Only a secret key makes the token
    #       unconfirmable, which is what makes it worth publishing at all.
    #       (3) Assumptions: the SAME key is shared with every other producer on
    #       this queue and is NOT per instance. That sharing is the ordering
    #       guarantee: the group identity has to be equal for equal cards across
    #       producers and across restarts, and a per-instance key would scatter one
    #       card's messages across as many groups as there are running tasks,
    #       removing the per-card ordering silently.
    #       (4) Assumptions: this is a DIFFERENT secret from the extract-transform-
    #       load masking key CARDDEMO_MASK_HMAC_KEY. The two have different
    #       holders and different trust purposes -- that one is held by a one-off
    #       migration workload reading cardholder extracts, this one by a
    #       long-running consumer -- so sharing a single value would let the
    #       migration workload compute production queue group identities and would
    #       make rotating either one require stopping both.
    #       (5) Assumptions: the value arrives as a container secret from the
    #       deployment's secret store, in base64 or as raw text, and it is never a
    #       literal in this file or in any tfvars file. config/
    #       MessagingIdentityConfig.java detects the form and refuses anything
    #       shorter than the tokeniser's minimum key length.
    hmac-key: ${CARDDEMO_MESSAGING_HMAC_KEY}

  account-context:
    # WHY : (1) Assumptions: this context decides an authorization against records
    #       the ACCOUNT context owns -- the card cross-reference, the account master
    #       and the customer master, read by COPAUA0C at its paragraphs 5100, 5200
    #       and 5300. It reaches them over that context's published contract rather
    #       than over a database grant, which is what keeps one owner per schema.
    #       The address arrives from a Terraform output, so it carries no default: a
    #       default would let this service start against a plausible-looking wrong
    #       address and decline every authorization with the not-found reason.
    #       (2) Trade-offs: the two timeouts are short and deliberately so. Both
    #       calls run inside the deciding transaction, which is holding a row lock
    #       on the account's summary by the time the second is made, so an unbounded
    #       read would hold a lock and a pooled connection for as long as the
    #       dependency stayed silent. Three seconds is well beyond the in-network
    #       latency of a keyed read and well inside the queue's own visibility
    #       timeout, so a stalled dependency surfaces as a redelivered message
    #       rather than as an exhausted connection pool.
    base-url: ${CARDDEMO_ACCOUNT_CONTEXT_BASE_URL}

    # WHY : (1) Assumptions: this is the EXACT origin the base address above is
    #       required to equal, and service/RestAccountContextClient.java refuses to
    #       start when the two differ. It exists because the first request that
    #       client makes -- the cross-reference lookup -- carries a primary account
    #       number in its body, so a base address quietly repointed after review
    #       exfiltrates cardholder data on the first authorization rather than
    #       failing visibly.
    #       (2) Alternatives Considered: matching the address against a host suffix
    #       or a pattern rather than an exact origin. Rejected for the same reason
    #       the reply-queue allowlist above is exact: the legitimate value is a
    #       deployment fact published by a Terraform output, not a shape, and any
    #       pattern wide enough to cover a legitimate internal origin also covers a
    #       host an attacker could arrange to control.
    #       (3) Trade-offs: it DEFAULTS to the base address, so a deployment that
    #       configures only the base address still starts and still gets every shape
    #       check -- absolute, HTTPS, no user information, no path, no query, no
    #       fragment. Requiring two values to be typed identically in the ordinary
    #       case would be a step every operator learns to copy without reading. Both
    #       Terraform roots publish the two names from ONE expression, so in a
    #       deployed environment they are pinned to each other rather than to this
    #       default.
    approved-origin: ${CARDDEMO_ACCOUNT_CONTEXT_APPROVED_ORIGIN:${CARDDEMO_ACCOUNT_CONTEXT_BASE_URL}}

    # WHY : Trade-offs: both timeouts are deliberately short, and the reason is
    #       what the calls run inside rather than what the network usually costs.
    #       Each runs within the deciding transaction, which by the second call is
    #       holding a row lock on the account's summary, so an unbounded read would
    #       hold that lock and a pooled connection for as long as the dependency
    #       stayed silent. Three seconds is well beyond the in-network latency of a
    #       keyed read and well inside the queue's own visibility timeout, so a
    #       stalled dependency surfaces as a redelivered message rather than as an
    #       exhausted connection pool. Alternatives Considered: leaving them at the
    #       client default, which is no timeout at all -- rejected because the
    #       failure it produces is a service that looks healthy while every
    #       connection is parked on one unresponsive dependency.
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

  internal-identity:
    # WHY : (1) Assumptions: this is KEY MATERIAL, not a name, an address or an
    #       identifier. It is the symmetric secret this service signs its
    #       machine-to-machine bearer token with, and that the account context
    #       verifies the same token against, so the two services must hold the same
    #       value and nobody else may hold it. It carries NO default for that
    #       reason: a default would be a shared secret published in source, which
    #       would let anything that could read this repository mint a token the
    #       account context accepts for its internal reads.
    #       (2) Alternatives Considered: obtaining a machine token from the managed
    #       identity provider through a client-credentials grant, which is the
    #       conventional answer and would remove this value entirely. It is
    #       unavailable: infra/modules/cognito provisions the user pool with no
    #       hosted domain, so no token endpoint exists for a machine caller to call.
    #       Mutual TLS was considered and rejected as disproportionate for one
    #       caller inside one private network, since it would add certificate
    #       issuance and rotation for two services. A static shared header was
    #       rejected outright: it carries no expiry, names no audience and cannot be
    #       scoped, so one capture would be a permanent credential.
    #       (3) Assumptions: it is a DIFFERENT secret from
    #       carddemo.messaging.hmac-key above, and the separation is deliberate
    #       rather than incidental. That key derives opaque queue-metadata tokens
    #       and is held by this service alone; this one is a signing key shared with
    #       exactly one other service. Sharing a single value would mean rotating
    #       the account context's trust anchor and this service's queue grouping
    #       together, and would let a holder of either capability exercise the
    #       other.
    #       (4) Assumptions: the value arrives as a container secret from the
    #       deployment's secret store, in base64 or as raw text.
    #       common-lib InternalServiceToken refuses anything shorter than the digest
    #       width at construction, so a short value fails startup rather than
    #       weakening the credential silently.
    signing-key: ${CARDDEMO_INTERNAL_IDENTITY_SIGNING_KEY}

    # WHY : (1) Assumptions: the lifetime is expressed in seconds and defaults to
    #       sixty. A token is minted fresh for every request and is used within
    #       milliseconds, so the only thing a longer lifetime buys is a wider window
    #       in which a captured token still works.
    #       (2) Trade-offs: sixty seconds rather than five is chosen so that clock
    #       skew between two tasks cannot make a freshly minted token appear expired
    #       at the receiver, which would present as an intermittent 401 under load
    #       and would be attributed to almost anything else first. common-lib
    #       InternalServiceToken caps the configurable value at five minutes, so this
    #       key cannot be widened into a durable credential by configuration.
    token-lifetime-seconds: 60
