# =============================================================================
# services/authorization-service/src/main/resources/application-dev.yml
# -----------------------------------------------------------------------------
# WHAT: the `dev` profile overlay for authorization-service, the PENDING
#       AUTHORIZATION bounded context. Every key below is a VALUE override of a
#       key the base document application.yml already declares, so the key set
#       here is a strict subset of that document's key set: this profile adds no
#       key, removes no key and changes no key's shape. It varies connection-pool
#       SIZING, diagnostic VERBOSITY and health-detail exposure, and it varies
#       nothing else -- not the listener port, not the transport-security floor,
#       not the actuator exposure list, not the schema resolution, not the
#       datasource or identity endpoints, not the queue settings, and not one of
#       the behavioural contracts transcribed from the REFERENCE-ONLY programs
#       under app/app-authorization-ims-db2-mq/cbl. Each of those is decided in
#       exactly one place, and that place is the base document.
# WHY : Assumptions: the six overrides below trace to exactly two facts about this
#       environment rather than to six separate preferences. Three of them -- the
#       two pool sizes and the connection timeout -- descend from one
#       infrastructure difference between the environments:
#       infra/envs/dev/terraform.tfvars sets aurora_min_capacity to 0 at L38 so the
#       cluster pauses while idle, while infra/envs/prod/terraform.tfvars sets it to
#       2 at L30 so the production cluster never pauses. The other three descend
#       from who the caller is: in this environment it is a developer exercising a
#       path by hand, rather than a load-balancer probe or a message arriving at
#       production rate.
# WHY : Assumptions: NO endpoint, hostname, queue reference, key identifier,
#       account identifier, credential or connection string appears here in any
#       form. Deployment-specific values reach the running service as environment
#       variables the ECS task definition sets from Parameter Store and from
#       Secrets Manager container secrets; none of them is expressible in this
#       file.
# WHY : Refactoring Rationale: this profile imports ONLY the shared defaults
#       document. An `optional:aws-parameterstore:/carddemo/<environment>/authorization/`
#       overlay was considered and is declined, and the reason is measured rather
#       than stylistic: the sibling pom.xml does declare
#       io.awspring.cloud:spring-cloud-aws-starter-parameter-store, so a resolver
#       claims that prefix and builds an SSM client, and that construction resolves
#       a region through the default provider chain. This module pins no
#       `spring.cloud.aws.region.static`, so preparing the profile raised
#       SdkClientException wherever the chain could not answer, and the `optional:`
#       marker does not suppress it -- that marker excuses a claimed location
#       holding no resource, not a resolver that throws while building its client.
# WHY : Assumptions: the prod overlay reaches the same conclusion, so dev and prod
#       differ only in sizing, verbosity and health detail rather than in where
#       their configuration comes from. One mechanism is described in one way
#       across this module: every value arrives as an environment variable the
#       task definition sets.
# WHY : Assumptions: `classpath:/carddemo-common-defaults.yml` is named again as the
#       first entry, matching the prod overlay. It costs one idempotent re-import
#       and it removes any question of whether the shared console pattern -- which
#       is what puts the correlation identifier on every line -- survives a profile
#       document that declares an import of its own.
# -----------------------------------------------------------------------------
# Documentation convention: docs/CODE_DOCUMENTATION_STANDARD.md. YAML has no
# docstring construct, so its YAML section prescribes the two forms used here --
# this framed file header, and a labelled rationale placed directly above the key
# it explains -- which is the analogous obligation AAP 0.8.1 states for a
# language that has none. The four category labels are written in that document's
# one permitted form: plural, unparenthesised, colon retained, no emphasis
# markup. What that document supplies is the FORM; the obligation to carry a
# rationale at all is the second sentence of the validation gate at line 43 of
# the project's single user-specified rule, Rule 1 "Explainability".
# Assumptions: nothing mechanical reads this file. The Checker in
# config/checkstyle/checkstyle.xml is narrowed to fileExtensions="java" at L185,
# no linter in this repository parses YAML comments, and no workflow step
# validates them, so review is the only reader these notes have. They are written
# at the rigour applied where a build would fail without them, because the
# absence of a gate is not a reason for a reader to be given less.
# =============================================================================

spring:
  config:
    # WHY : Assumptions: the path is /carddemo/<environment>/authorization/, the
    #       same three-part shape every context uses, so one Terraform module
    #       writes them all and one policy can grant read on exactly one context's
    #       subtree. The label defaults to `dev` here where the prod overlay
    #       defaults to `prod`, so a task started on this profile with no label set
    #       still reads the subtree belonging to it rather than another
    #       environment's. The full rationale for taking this path at all, and for
    #       the `optional:` marker, is in the file header above.
    # WHY : Refactoring Rationale: the Parameter Store location this overlay declared has been
    #       withdrawn. The reasoning, measured on this tree, is recorded in full below.
    # WHY : Assumptions: this profile declares NO spring.config.import, and neither does
    #       application-prod.yml, and neither does the sibling POM declare a
    #       parameter-store starter. Those three facts are one decision and are stated
    #       together, because each on its own reads as an omission. This context reads no
    #       Parameter Store subtree at all: every deployment value reaches it as an
    #       environment variable the task definition sets, which is what
    #       application.yml's datasource, issuer and queue placeholders bind to.
    #       reference-service, the other context whose only AWS artifact is the queue
    #       starter, takes the identical shape, so the repository holds ONE model for a
    #       queue-only context rather than two.
    #       Refactoring Rationale: an earlier revision put the overlay in production
    #       alone and left this profile without it, on the stated premise that the
    #       location could not resolve here. The premise was right about the failure and
    #       wrong about its scope, and the asymmetry it produced is what is corrected.
    #       The queue starter brings spring-cloud-aws-autoconfigure, whose
    #       spring.factories registers a resolver for the `aws-parameterstore` prefix, so
    #       the location IS claimed in this module; the resolver then builds an SSM
    #       client. With no client artifact that construction failed on
    #       NoClassDefFoundError, and with one it fails on SdkClientException whenever
    #       the region provider chain cannot answer -- and this module deliberately
    #       declines to pin spring.cloud.aws.region.static, resolving region and
    #       credentials from the task instead. Measured on the integrated tree: with the
    #       starter present and no region set, environment preparation raised
    #       SdkClientException for the dev AND the prod profile alike.
    #       Assumptions: the `optional:` marker does not cover either failure. It
    #       suppresses a claimed location that holds no resource; it does not suppress a
    #       resolver that throws while building its own client. The marker therefore
    #       protects against an empty parameter path and against nothing else, which is
    #       why the decision has to be made about the dependency rather than about the
    #       marker.
    #       Alternatives Considered: keeping the starter, adding the overlay to both
    #       profiles, and pinning spring.cloud.aws.region.static to ${AWS_REGION} the way
    #       account-service and batch-service do. Rejected on cost against benefit: it
    #       adds a startup dependency on a resolvable region to a context that reads
    #       nothing from the subtree, and it makes a missing environment variable stop a
    #       service whose every value is already delivered by another route. The
    #       lower-risk option is taken and recorded here.
    #       -----------------------------------------------------------------------------
    #       Documentation convention: docs/CODE_DOCUMENTATION_STANDARD.md. YAML has no
    #       docstring construct, so its YAML section prescribes the two forms used here --
    #       this framed file header, and a labelled rationale placed directly above the key
    #       it explains -- which is the analogous obligation AAP 0.8.1 states for a
    #       language that has none. The four category labels are written in that document's
    #       one permitted form: plural, unparenthesised, colon retained, no emphasis
    #       markup. What that document supplies is the FORM; the obligation to carry a
    #       rationale at all is the second sentence of the validation gate at line 43 of
    #       the project's single user-specified rule, Rule 1 "Explainability".
    #       Assumptions: nothing mechanical reads this file. The Checker in
    #       config/checkstyle/checkstyle.xml is narrowed to fileExtensions="java" at L185,
    #       no linter in this repository parses YAML comments, and no workflow step
    #       validates them, so review is the only reader these notes have. They are written
    #       at the rigour applied where a build would fail without them, because the
    #       absence of a gate is not a reason for a reader to be given less.
    #       =============================================================================
    import:
      - "classpath:/carddemo-common-defaults.yml"

  datasource:
    hikari:
      # WHY : Trade-offs: four connections and one idle, against the base
      #       document's ten and two at L282-L283. Concurrency here is one
      #       developer or one smoke test, so the extra six would never be claimed;
      #       and an open connection is what keeps a zero-minimum cluster from
      #       reaching its auto-pause delay at all, so an idle pool sized for
      #       production would hold capacity awake to serve nothing. The accepted
      #       cost is that a load test pointed at dev queues on the pool, which is
      #       where it should queue rather than on a cluster this profile
      #       deliberately keeps small. Both keys carry that one decision, so one
      #       rationale stands above the pair rather than being restated on each --
      #       two copies of a reason are two places it can be edited apart.
      maximum-pool-size: 4
      minimum-idle: 1

      # WHY : (1) Assumptions: this value exists to clear a RESUME, not a slow
      #       query, and that is the whole reason it differs from production.
      #       infra/envs/dev/terraform.tfvars sets aurora_min_capacity to 0 at L38,
      #       which holds the cost of an idle environment at storage alone. A zero
      #       minimum makes the auto-pause delay mandatory rather than optional --
      #       infra/modules/aurora-postgresql/variables.tf rejects the combination
      #       of a zero minimum with no delay at L722-L723 and states the coupling
      #       at L747 -- and dev sets that delay to 300 seconds at L40. A cluster
      #       that has paused takes roughly fifteen seconds to serve its first
      #       connection again, so at the base document's ten seconds (L284) the
      #       FIRST request after an idle period fails while the cluster is still
      #       coming back. It fails as a connection timeout, which reads as a
      #       database outage rather than as a resume, and it then succeeds on a
      #       retry, so the symptom clears before anyone has looked into it.
      #       (2) Alternatives Considered: holding the dev minimum above zero, as
      #       production does at L30 of its tfvars, so the cluster never pauses and
      #       the base document's ten seconds stays correct everywhere. Rejected on
      #       the concrete consequence: it bills provisioned capacity around the
      #       clock for an environment that is idle for most of it, which is the
      #       one cost this profile's entire sizing set exists to avoid. Paying for
      #       a permanently warm cluster to spare the first caller fifteen seconds
      #       inverts what dev is for.
      #       (3) Trade-offs: the accepted compromise is stated plainly, because
      #       thirty seconds is not free. A database that is genuinely unreachable
      #       -- a wrong security group, a revoked credential -- now takes thirty
      #       seconds to say so instead of ten, so a real fault is slower to
      #       surface here than in production. application-prod.yml restates ten at
      #       L45 rather than inheriting it, so raising the value here cannot be
      #       mistaken for a change that applies to both environments.
      connection-timeout: 30000

  jpa:
    # WHY : (1) Trade-offs: statement echo is on here and nowhere else -- the base
    #       document pins it false at L487 and application-prod.yml restates false
    #       at L59. It earns its cost in this context specifically: the keys this
    #       module reads are a nines-complement encoding and a date-and-time pair
    #       composed into one timestamp, so a wrong value is PLAUSIBLE rather than
    #       obviously broken. A mis-encoded key selects a neighbouring row instead
    #       of no row, and a mis-composed timestamp orders a page differently
    #       rather than failing, so the emitted predicate is the only place either
    #       shows. The accepted cost is a verbose log, and one further cost worth
    #       naming: this property writes through the provider's own stdout printer
    #       rather than the shared console pattern, so a statement line carries no
    #       correlation identifier and has to be read beside the structured lines
    #       around it instead of being filtered by identifier.
    #       (2) Assumptions: what this turns on is statement TEXT, and the bound
    #       VALUES stay off. The base document pins org.hibernate.orm.jdbc.bind at
    #       WARN at L670 precisely so no broader level change can lift it, and this
    #       profile deliberately does not restate that key -- restating a value the
    #       base already pins would create a second place it could be changed. At
    #       TRACE that logger writes every bound primary account number into the
    #       log stream, and a dev database loaded from the baseline extract holds
    #       the same class of data as production, so "it is only dev" is not an
    #       argument here. Statement text names columns; it does not name a
    #       cardholder, and no payload body is logged at any level in this profile.
    show-sql: true

logging:
  level:
    # WHY : (1) Trade-offs: DEBUG on this project's package root, where the base
    #       document holds INFO at L663 and production keeps this context's
    #       packages at INFO. At DEBUG a dropped stale message, a redelivered
    #       request and a reply awaiting publication are each visible while the
    #       messaging path is being exercised by hand; at message rate that same
    #       polling detail buries the per-message decision lines that are the audit
    #       trail this context exists to produce, which is why production does not
    #       carry it.
    #       (2) Alternatives Considered: naming com.carddemo.authorization and
    #       com.carddemo.common as two separate loggers, which is the obvious way
    #       to raise exactly the two packages worth raising. Rejected because the
    #       base document declares neither of them, so the overlay would stop being
    #       a value-only override of the base key set, and a third com.carddemo
    #       package added later would sit at INFO while this block appeared to have
    #       raised everything. Nothing outside this repository publishes under
    #       com.carddemo, so the package root raises precisely those two and pulls
    #       no third-party logger up with it.
    #       (3) Assumptions: root stays at the base document's WARN at L662. Left
    #       unstated a reader might assume DEBUG here widened everything; it
    #       widened one package tree.
    com.carddemo: DEBUG

management:
  endpoint:
    health:
      # WHY : Refactoring Rationale: this overlay used to relax the aggregate to
      #       `when-authorized`, and the relaxation was an information exposure
      #       rather than the narrow concession its own note claimed. The note was
      #       right that an unauthenticated probe would keep receiving the status
      #       word alone, and wrong about who else would. No `roles` key was set,
      #       and with none set the framework authorizes ANY authenticated caller --
      #       so the detail payload, which names this module's health contributors
      #       and reports the state of each, was available to every holder of a
      #       valid user-pool token, including a `carddemo-user` token belonging to
      #       an ordinary cardholder. The dependency it enumerates is the database
      #       holding pending authorizations and fraud marks, and dev is provisioned
      #       with production's topology by design, so the shape disclosed here is
      #       the shape production has. The value is now `never`, identical to
      #       application-prod.yml and to the base document -- whose own note at
      #       L588 states that never is pinned "in every environment, and neither
      #       profile relaxes it", a sentence this file used to falsify.
      # WHY : Alternatives Considered: keeping `when-authorized` and adding
      #       `roles: carddemo-admin` so only an operator saw the detail. Rejected
      #       because it would not work and would read as though it did. The
      #       framework's roles check reaches HttpServletRequest.isUserInRole, which
      #       Spring Security answers by prepending its ROLE_ prefix to the name,
      #       while common-lib's JwtRoleConverter issues the provider's group name
      #       VERBATIM with no prefix -- a decision recorded at its own L118-L126
      #       precisely so routes are written with the authority predicate and never
      #       the role predicate. A roles list here would therefore match nobody: an
      #       administrator would be refused the detail exactly as an ordinary user
      #       is, and the configuration would state an authorization that never
      #       happens.
      # WHY : Alternatives Considered: keeping the aggregate at `never` and
      #       publishing a detailed health GROUP for operators, which is the shape
      #       the finding's own guidance suggests. Rejected on a structural
      #       constraint of this service rather than on preference: SecurityConfig
      #       grants the whole subtree /actuator/health/** to permitAll, at its
      #       HEALTH_PATH constant, so the load balancer and the container
      #       HEALTHCHECK can poll with no credentials -- and every health group
      #       Boot publishes lives under that same subtree. A group would therefore
      #       be exactly as public as the aggregate, and moving it out from under
      #       the subtree needs an `additional-path`, a new chain rule and a path
      #       the load balancer's listener rules do not know, which is a larger
      #       change than the diagnostic is worth in a profile no production task
      #       activates.
      # WHY : Trade-offs: the accepted cost is the one the base document already
      #       names -- telling a paused cluster, a wrong credential and an
      #       unreachable dependency apart means reading the log stream rather than
      #       the probe response. In this profile that cost is small and paid
      #       elsewhere: `logging.level.com.carddemo` is DEBUG above and
      #       `spring.jpa.show-sql` is true, so a dev task already reports far more
      #       about a failing dependency in its log stream than the detail payload
      #       would have carried.
      show-details: never
