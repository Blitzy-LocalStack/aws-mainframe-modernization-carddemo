# =============================================================================
# services/auth-service/src/main/resources/application-dev.yml
# -----------------------------------------------------------------------------
# Purpose:
#   The dev profile overlay for the CardDemo auth bounded context, the migration
#   target of COBOL programs COSGN00C and COUSR00C through COUSR03C. It
#   overrides VALUES ONLY, on keys application.yml beside it already declares,
#   and introduces no key that is absent there. Six keys are set across three of
#   the four axes the profiles may vary: log levels, Hikari pool sizing and
#   actuator exposure breadth. The fourth axis, the Flyway clean flag, is
#   deliberately absent -- clean-disabled belongs to application-prod.yml, and
#   setting nothing here leaves the base behaviour in place, which is the
#   intended outcome for dev.
#
#   Nothing below names an endpoint, identifier or credential, or supplies a
#   working default for one. Every such value stays an unresolved placeholder in
#   application.yml and is injected by the platform, so this overlay cannot
#   point a build at another environment's data.
#
#   Each key below carries the rationale for its own value; the file-wide
#   constraints the whole overlay is held to are stated once immediately after
#   this header.
# =============================================================================

# Assumptions: this profile varies values on three axes and nothing else. It
#       does not vary service topology, route structure, schema ownership, the
#       identity mechanism, queue usage or the datastore type -- the listener
#       port and its TLS terms, the springdoc paths, the auth schema list and
#       the connection search_path all stay as application.yml sets them. The
#       consequence is the point of the constraint: a defect reproduced in dev
#       is reproducible in prod, because the only difference between the
#       environments is the value of a handful of keys.
# Trade-offs: this overlay carries no datasource URL, database credential,
#       Cognito issuer, pool or app client identifier or region, and supplies no
#       stand-in for any, so startup fails on the unresolved placeholder when
#       the platform supplies nothing. That is accepted over the loopback URL a
#       dev profile conventionally carries, which would let the process start
#       and then read or write whichever database the machine it started on
#       happened to reach: a wrong endpoint that resolves presents as a working
#       service, which is the harder fault to notice.
# Assumptions: the active profile and every value named above arrive as
#       environment variables injected from Parameter Store and Secrets
#       Manager. The image bakes in neither an endpoint nor
#       -Dspring.profiles.active, so selecting dev is a deployment act rather
#       than a property of the image -- which is what makes one image runnable
#       in both environments.

logging:
  level:
    # Trade-offs: these three drop to DEBUG, turning a failed sign-on from a
    # stack trace into a readable sequence of handler, migration and statement
    # lines. The cost is not fixed -- each request adds a line per statement it
    # issues -- so at production rates the output dominates log ingestion and
    # buries the WARN and ERROR lines an operator pages on. Hence this file
    # rather than the base one.
    #
    # Assumptions: org.hibernate.SQL is safe to lower and the logger beside it
    # is not. It emits parameterised statements with values still as
    # placeholders; the bound values travel on org.hibernate.orm.jdbc.bind,
    # which application.yml pins at WARN. That pin and the one on
    # org.springframework.security are honoured here by omission -- neither key
    # is restated -- so DEBUG never reaches the loggers that would print the
    # eight-character user identifier, a row's pool subject reference, or a
    # token's claims.
    #
    # Alternatives Considered: root at DEBUG, which asks for the same detail in
    # one line instead of three. Rejected because root also lowers every
    # framework package neither this service nor its diagnosis owns, leaving the
    # lines worth reading a minority of the output.
    com.carddemo: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG

spring:
  datasource:
    hikari:
      # Refactoring Rationale: there is no baseline number to carry forward, so
      # a bare figure here would look arbitrary and is not.
      # app/csd/CARDDEMO.CSD L91 declares FILE(USRSEC) with STRINGS(1) -- one
      # VSAM string -- so every baseline sign-on serialised through a
      # concurrency ceiling of exactly one. Any value above 1 already exceeds
      # what the baseline could do, so the number is justified by what the
      # environment can afford, and that differs per environment while the base
      # value stays conservative.
      #
      # Assumptions: the dev cluster is provisioned with a minimum capacity of
      # zero so it pauses while idle, and Aurora pauses only while no
      # user-initiated connection exists. A pool holding idle connections open
      # would keep capacity awake for the whole time the environment sat unused,
      # cancelling the reason for provisioning a zero minimum.
      #
      # Trade-offs: draining to zero means the next caller pays a handshake,
      # plus a resume of roughly fifteen seconds if the cluster also paused.
      # That is why connection-timeout is NOT restated below the base file's
      # thirty seconds -- the resume must fit inside the first caller's wait, and
      # shortening it in the one profile whose cluster actually pauses would fail
      # precisely the request that triggers the resume. The ceiling of five is
      # sized for one developer plus this module's repository integration test,
      # so a burst queues on the pool rather than widening it; a queue is visible
      # in the pool's own metrics where a pool wide enough to exhaust a small
      # cluster's connection budget is not.
      maximum-pool-size: 5
      minimum-idle: 0

management:
  endpoints:
    web:
      exposure:
        # Assumptions: the four ids application.yml already publishes are
        # RESTATED below rather than added to, and that is load-bearing. This
        # property binds as a Set, and a profile replaces an inherited
        # collection rather than merging into it, so a list naming only the four
        # new ids would remove health -- the endpoint the load balancer target
        # group and the container HEALTHCHECK both poll, neither of which can
        # present a JWT. Losing it would deregister every task and fail
        # container liveness at once. Which principals may reach the other
        # endpoints is still decided in SecurityConfig, not by this key -- and
        # that division is only true because the chain matches the management
        # NAMESPACE. Refactoring Rationale: while it named only info, metrics
        # and prometheus, the three ids added below reached the chain's
        # catch-all instead, which required merely a valid token; a token
        # carrying no CardDemo group satisfies that. SecurityConfig.OPERATOR_PATHS
        # now ends in /actuator/**, so an id added to THIS list is confined to
        # the task-local addresses without this file having to be read alongside
        # that one.
        #
        # Trade-offs: the four added ids are the ones no other profile
        # publishes, and each gives away something nameable. env and configprops
        # report the active profiles, the ordered property-source list, and
        # every property and environment-variable NAME the task received --
        # values stay masked, because show-values defaults to never, so what
        # leaks is the deployment's shape rather than its contents, and that
        # default is one further property away from being removed. flyway
        # reports the migration history, which states the version the auth
        # schema stands at.
        #
        # Refactoring Rationale: `loggers` was on this list and has been REMOVED,
        # and it is the one id whose removal changes a capability rather than a
        # disclosure. Every other id here is read-only; `loggers` carries a WRITE
        # operation, so whoever reaches it can raise
        # org.hibernate.orm.jdbc.bind or org.springframework.security at run time
        # and defeat the level pins those categories carry -- turning a read-only
        # diagnostic surface into a way to make a running process log identity
        # material, with no code change, no deployment and no review. Two facts
        # about this service make that decisive rather than theoretical. It is the
        # SIGN-ON context, so the categories a caller could raise sit directly on
        # the credential path. And the health group beneath this list is
        # deliberately reachable without a token, because the load balancer polls
        # it uncredentialed -- so the actuator base path is demonstrably reachable
        # by something holding no credential, and an exposure list is the only
        # thing that decides which ids under it answer.
        #
        # Refactoring Rationale: the reasoning this replaces weighed an
        # internet-adjacent environment against "a single-developer environment
        # behind a private load balancer", and concluded the convenience won for
        # dev. The flaw is that a profile is a runtime choice, not a topology: the
        # same image with the same profile can be activated anywhere, so the
        # premise that made the trade acceptable is not something this file can
        # assert. A capability whose safety depends on where it happens to run is
        # not confined by being written in a dev file.
        #
        # Trade-offs: what is given up is raising a log level on a running task
        # without redeploying. The compensating path is a task restart with an
        # overridden level -- every service reads its levels from configuration and
        # the platform can pass an override at task start -- which costs one
        # rolling replacement and leaves an audit record of who changed what,
        # which the write endpoint does not.
        #
        # Alternatives Considered: also publishing heapdump and threaddump,
        # which are the conventional next two on a development profile.
        # Rejected: a heap dump contains whatever the process holds in memory
        # when it is taken, which here includes the resolved database credential
        # and any bearer token in flight, and it leaves as a file that outlives
        # the environment it came from -- a far larger disclosure than the four
        # above, and one no diagnostic gain here would offset. beans, mappings
        # and conditions were rejected on the narrower ground that nothing in
        # this service's diagnosis needs them, and an endpoint published without
        # a named use is only surface.
        # Assumptions: every id below is READ-ONLY. That is the property this list
        # is now chosen for, and it is the one a reviewer can check mechanically:
        # an id that carries a write operation does not belong here whatever the
        # profile, and `loggers` was the only one that did.
        include: health,info,metrics,prometheus,env,configprops,flyway
