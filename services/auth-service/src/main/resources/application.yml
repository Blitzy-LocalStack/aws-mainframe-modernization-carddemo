# =============================================================================
# services/auth-service/src/main/resources/application.yml
# -----------------------------------------------------------------------------
# Purpose:
#   Base runtime configuration for the CardDemo auth bounded context, which is
#   the migration target of five COBOL programs -- COSGN00C (sign-on) and
#   COUSR00C through COUSR03C (user list, add, update, delete). The context owns
#   exactly one PostgreSQL schema, auth, standing in for the indexed file
#   defined at app/csd/CARDDEMO.CSD L88-L99, and it is to ship exactly one
#   Flyway migration, V1__auth.sql.
#
#   This file owns the property SHAPES for the whole service. It is the first
#   application.yml in this repository, so it does not follow a Spring
#   convention already established here -- it establishes one. It is therefore
#   the property-key contract that this service's SecurityConfig,
#   DataSourceConfig and OpenApiConfig bind against, rather than each declaring
#   a parallel prefix of its own. Every key below is a standard framework key
#   with one exception: the single carddemo.auth.cognito namespace, which
#   carries the three sign-on values the framework publishes no standard key
#   for. One of the three IS a credential: the user pool's app client is
#   confidential, so client-secret is read from Secrets Manager while the pool
#   and client identifiers come from Parameter Store. No token endpoint appears
#   anywhere in this file, because the pool's OAuth token endpoint implements no
#   password grant; the reasoning is recorded on carddemo.auth.cognito.
#   application-dev.yml and application-prod.yml override VALUES only and
#   introduce no key that is absent here.
#
# WHY (non-obvious design decisions):
#   1. Assumptions: the listener port is fixed by two artifacts outside this
#      file rather than chosen locally. See server.port.
#   1a. Refactoring Rationale: that listener serves HTTPS, so encryption in
#      transit reaches the task rather than stopping at the load balancer. The
#      key material is injected from Secrets Manager as PEM content and the
#      protocol floor matches the two edges in front of it. This is one half of
#      a two-part change whose other half is target_protocol in
#      infra/modules/ecs-service; neither works alone. See server.ssl.
#   2. Trade-offs: every credential and every endpoint is an unresolved
#      placeholder, so an absent value stops startup instead of defaulting.
#      See spring.datasource and carddemo.auth.cognito.
#   3. Alternatives Considered: the connection search_path is pinned through an
#      init statement rather than through the URL. See
#      spring.datasource.hikari.connection-init-sql.
#   3a. Assumptions: verified TLS is required of every connection through driver
#      properties rather than trusted to the injected URL, and it is the client
#      half of a requirement the cluster parameter group enforces on the server.
#      See spring.datasource.hikari.data-source-properties.
#   4. Alternatives Considered: Flyway owns every DDL statement and Hibernate
#      owns none. See spring.jpa.hibernate.ddl-auto.
#   5. Assumptions: the migration bootstrap DDL is the exclusive authority for
#      schemas, roles and grants, and its completion is a precondition of this
#      service starting. Flyway here migrates the schema and never creates it.
#      See spring.flyway.create-schemas.
#   6. Assumptions: /actuator/health is polled by two consumers that cannot
#      present a token. See management.endpoints.web.
#   7. Assumptions: topology is identical in every environment and the profiles
#      differ in values alone. See the note above logging.level.
# =============================================================================

server:
  # Assumptions: this service's Dockerfile declares EXPOSE 8080 and the network
  #   design admits load-balancer-to-application traffic on 8080 alone, so the
  #   number is fixed by two artifacts this file cannot see. Changing it here on
  #   its own leaves the container listening on a port nothing connects to, and
  #   the target group deregisters the task while the process stays healthy.
  port: 8080

  ssl:
    # WHY : (1) Refactoring Rationale: this block did not exist, and its absence
    #       meant the encrypted path stopped at the load balancer. Traffic
    #       reaches the internal Application Load Balancer over TLS -- the alb
    #       module pins a TLS 1.2 floor on its single HTTPS listener, and API
    #       Gateway reaches that listener over a VPC Link -- and every request
    #       then crossed the private application subnets in the clear on its way
    #       here: the bearer token in the Authorization header, the eight-
    #       character user id in the path, and the response bodies. Being inside
    #       a VPC bounds who can observe that traffic; it does not make the
    #       traffic unreadable, and the design requires encryption in transit
    #       end to end rather than up to the edge. This block is the task-side
    #       half of that change; the load-balancer-side half is
    #       target_protocol = "HTTPS" in infra/modules/ecs-service, which sets
    #       both the target group's protocol and its health check's. The two
    #       halves must move together -- enabling one alone means every probe
    #       speaks the wrong protocol and no task ever turns healthy.
    #       (2) Assumptions: the PORT does not change. 8080 is fixed by the
    #       Dockerfile's EXPOSE and by the security group that admits
    #       load-balancer-to-application traffic on 8080 alone, so this
    #       encrypts the existing listener in place rather than moving it to
    #       8443. Renumbering would be the conventional choice and would
    #       require both of those artifacts to change in the same commit; the
    #       port number carries no meaning here beyond agreement between them.
    enabled: true

    # WHY : Refactoring Rationale: these four properties replace a
    #       `certificate` / `certificate-private-key` pair that read PEM CONTENT
    #       from two environment variables injected from Secrets Manager. The
    #       comment that stood here claimed the material was "not stored in the
    #       task definition, in Terraform state or in plan output"; the first and
    #       last were true and the middle one was FALSE. The pair was produced by
    #       a managed `tls_private_key` resource in each environment root, so the
    #       private key was written to Terraform state, and the SAME key was then
    #       copied into two Secrets Manager entries and injected into every online
    #       task -- one key for all eight services, held by anyone who could read
    #       the state file. The claim is withdrawn and the mechanism is changed
    #       rather than the sentence rewritten.
    # WHY : Assumptions: the keystore is minted by THIS TASK at startup, by
    #       config/docker/generate-listener-material.sh, which is the image's
    #       entry point. It draws a fresh 2048-bit RSA key and a self-signed leaf
    #       with keytool, writes them mode 0600 on the task's own encrypted
    #       ephemeral volume, exports the three placeholders below, and then
    #       `exec`s the JVM. No key is expressible in source, reaches Terraform
    #       state, reaches Secrets Manager, or is shared by two tasks. That
    #       script's header records the three alternatives measured and rejected,
    #       including why an ephemeral `tls_private_key` cannot be used here.
    # WHY : Assumptions: an Application Load Balancer does NOT validate the
    #       certificate a target in an HTTPS target group presents, so a per-task
    #       self-signed leaf is accepted at that hop exactly as the previous
    #       shared self-signed leaf was. The certificate that IS verified -- the
    #       one API Gateway checks against `server_name_to_verify` -- belongs to
    #       the load balancer's own listener and is the operator-supplied ACM
    #       certificate, which this change does not touch.
    # WHY : Alternatives Considered: keeping PEM properties and having the script
    #       write cert.pem and key.pem for `file:` locations, which these
    #       properties also accept. Rejected on a measured limitation rather than
    #       a preference: keytool exports a certificate as PEM but cannot export a
    #       private key at all, so a PEM pair would need openssl, which is absent
    #       from the pinned runtime digest. PKCS#12 is the one format the tooling
    #       already in the image can produce.
    # WHY : Trade-offs: `key-store` and `key-alias` carry defaults matching what
    #       the script writes, so a local `java -jar` run against a hand-made
    #       keystore needs only the password. `key-store-password` deliberately
    #       carries NO default: a literal here would read as a committed secret to
    #       every reader and to the repository's secret scanner, and an absent
    #       password must stop startup rather than fall back to cleartext, which
    #       would present as a healthy service that had quietly stopped meeting
    #       the requirement this block exists for.
    key-store: ${CARDDEMO_SERVER_TLS_KEYSTORE:file:/tmp/carddemo-tls/listener.p12}
    key-store-type: PKCS12
    key-store-password: ${CARDDEMO_SERVER_TLS_KEYSTORE_PASSWORD}
    key-alias: ${CARDDEMO_SERVER_TLS_KEY_ALIAS:carddemo-listener}

    # Assumptions: the two protocol versions are named rather than left
    #   to the JDK default, which still negotiates TLS 1.1 and, on some
    #   distributions, TLS 1.0. Both are withdrawn and have practical attacks
    #   against them. Naming 1.2 and 1.3 holds the same floor the alb module
    #   pins on its listener and the cloudfront-spa module enforces for
    #   viewers, so one floor applies at all three hops rather than three
    #   modules each choosing their own.
    # Trade-offs: no `ciphers` list is given. A hand-written list ages
    #   into a liability -- it silently keeps permitting a suite the JDK has
    #   since deprecated, and it excludes suites added later -- whereas the
    #   JDK's own default set for these two protocol versions is maintained
    #   by whoever ships the runtime. The accepted cost is that the exact
    #   suite set is not readable from this file.
    # Assumptions: the load balancer does NOT verify this certificate.
    #   An Application Load Balancer trusts whatever a registered target
    #   presents, so this encrypts the hop without authenticating it; that
    #   residual is recorded on target_protocol in the ecs-service module and
    #   is bounded by target registration and the security groups, not by
    #   this certificate.
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3

  # WHY : (1) Refactoring Rationale: this service omitted graceful shutdown while
  #       five of the seven web contexts declared it -- this and card-service were
  #       the two that did not, the batch task having no web server and correctly
  #       declaring none -- so a task being replaced had its in-flight requests
  #       cut at SIGTERM. Sign-on is exactly the operation
  #       where that is most visible: a caller mid-authentication receives a
  #       transport failure and cannot tell a wrong credential from a replaced
  #       task, so it retries a credential that may have been accepted.
  #       (2) Assumptions: graceful shutdown stops accepting new connections and
  #       lets accepted ones finish, and this service holds no message listener,
  #       so the only work to drain is HTTP.
  shutdown: graceful

spring:
  # WHY : (1) Assumptions: this bounds the graceful shutdown enabled above, and
  #       twenty seconds is the fleet-wide phase budget -- the same value the
  #       other seven contexts set, so one number describes the whole fleet.
  #       (2) Refactoring Rationale: the framework's own default for this key is
  #       thirty seconds and the platform's SIGTERM-to-SIGKILL window is also
  #       thirty (ecs-service pins `stopTimeout = 30`), so leaving it unset made
  #       the drain deadline and the kill deadline the same instant -- a task
  #       could be killed while still draining, which is the failure graceful
  #       shutdown exists to prevent. Twenty gives up the tail of that window to
  #       buy certainty that the drain completes and the JVM flushes its log
  #       buffers first.
  #       (3) Trade-offs: twenty is also below the load balancer's thirty-second
  #       deregistration delay, so a draining task is out of rotation before the
  #       timer starts. A longer value would delay every deployment by the
  #       difference without draining anything the delay had not already covered.
  lifecycle:
    timeout-per-shutdown-phase: 20s

  application:
    # Assumptions: management.metrics.tags.service below reads this property
    #   instead of repeating the literal, so the two cannot drift apart.
    name: auth-service

  # WHY : (1) Refactoring Rationale: this import replaces values that were either
  #       absent here or duplicated per service. The console log pattern naming the
  #       correlation and edge-request context keys, and the two metric tag values
  #       the shared meter filter reads, are identical in every bounded context, and
  #       before this line most services carried neither -- so the correlation
  #       identity the shared filter published reached no log line and the meters
  #       carried the "unspecified" tag fallback. The file lives in common-lib, the
  #       one module every service already depends on and cannot compile without.
  #       (2) Assumptions: config-data imports are resolved BEFORE the logging
  #       system initialises, so a pattern supplied this way is in force for the
  #       first line this service logs. That ordering is the reason the pattern can
  #       live in an imported property file at all rather than in a logging
  #       configuration resource.
  #       (3) Assumptions: an imported document sits BENEATH this file in
  #       precedence, so any key below overrides the shared default rather than
  #       colliding with it, and the override is visible in this service's own file.
  #       (4) Trade-offs: NOT marked optional. An absent classpath resource would
  #       then be silently ignored, leaving the same defect this import corrects and
  #       no error to explain it; a hard failure at startup names the missing
  #       resource instead. The resource ships inside a jar this module's compile
  #       path already requires, so the only way it can be absent is a packaging
  #       defect worth failing on.
  config:
    import: "classpath:/carddemo-common-defaults.yml"

  datasource:
    # Trade-offs: none of the three values below carries a fallback,
    #   so an absent one stops startup with an unresolved-placeholder
    #   failure. That is accepted over a default that would let the process
    #   come up and read or write another environment's data, which is a
    #   fault that presents as a working service. Assumptions: the
    #   platform resolves all three before the process starts. The task
    #   definition injects them from Parameter Store and Secrets Manager as
    #   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and
    #   SPRING_DATASOURCE_PASSWORD, which relaxed environment binding maps
    #   onto these keys ahead of this file; the image deliberately bakes in
    #   neither an active profile nor an endpoint.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Alternatives Considered: accepting the driver pool's generated default
      #   name was rejected. That default is the same string in every service, so
      #   a pool metric or a stack dump of a blocked borrower could not be
      #   attributed to a context without correlating it by hand.
      pool-name: auth-service-pool
      # Assumptions: this context owns exactly one schema, because the one
      #   baseline record it migrates is app/cpy/CSUSR01Y.cpy; reading another
      #   context's schema is not part of its contract, so an unqualified
      #   statement resolving anywhere else is a defect rather than a feature.
      # Alternatives Considered: appending currentSchema to the JDBC URL was
      #   rejected, because the URL arrives from the platform as an opaque string
      #   that may already carry parameters, and editing it here would mean
      #   parsing a value this file does not own. Setting the path per connection
      #   keeps the pin independent of the URL's shape. Setting it to a schema
      #   that does not exist yet is accepted by the engine, so this does not
      #   race the Flyway bootstrap below.
      connection-init-sql: SET search_path TO auth
      # Trade-offs: the pool is sized modestly here and the dev and prod
      #   profiles move these numbers. A pool wider than the cluster's own
      #   connection budget turns a traffic peak into refused connections for
      #   every service sharing that cluster, so the base value is the
      #   conservative one and raising it is a deliberate per-environment act.
      #   The third value bounds how long a caller waits for a connection before
      #   failing: stated explicitly so that raising the pool size in a profile
      #   cannot be read as also relaxing the wait, since the two are what decide
      #   whether a saturated pool sheds load or accumulates blocked threads.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      # Assumptions: the URL above arrives from the platform as an
      #   opaque string, so this file cannot inspect it and cannot rely on it
      #   carrying any TLS parameter. Driver properties set here are handed to
      #   the driver alongside the URL, so a URL with no ssl parameter at all
      #   still negotiates on these terms. Stating them here is therefore the
      #   only way this file can require verified encryption rather than hope
      #   for it. Assumptions: verify-full is the strongest of the
      #   driver's modes and the only one that closes the whole gap. `require`
      #   encrypts and accepts ANY certificate, so it stops a passive listener
      #   and not an active one; `verify-ca` checks the chain but not the name,
      #   so a valid certificate for a different host is accepted. Only
      #   verify-full checks both, which is what makes the endpoint the
      #   connection reaches the endpoint the credential was issued for.
      # Assumptions: this is the CLIENT half of a two-sided
      #   requirement. The cluster parameter group sets rds.force_ssl, so the
      #   server refuses an unencrypted connection outright; that is what
      #   makes the requirement hold even against a URL that deliberately
      #   tried to weaken it, since the two halves cannot be defeated from one
      #   side. Neither half is redundant: without the server flag a
      #   misconfigured client could downgrade, and without these properties a
      #   forced-TLS server would still accept a connection that verified no
      #   certificate at all. Assumptions: verify-full needs a trust
      #   anchor, and this driver has no option to fall back to the JVM trust
      #   store, so the bundle path is explicit. The default names the location
      #   the service image places the managed certificate bundle at; an
      #   environment that stores it elsewhere overrides the variable rather
      #   than editing this file. A missing bundle fails the connection with a
      #   message naming the file, which is the correct outcome: connecting
      #   without a trust anchor is what this setting exists to prevent.
      data-source-properties:
        sslmode: verify-full
        sslrootcert: ${CARDDEMO_DB_SSL_ROOT_CERT:/etc/ssl/certs/carddemo-rds-ca-bundle.pem}

  jpa:
    hibernate:
      # Alternatives Considered: schema generation from the mapped entities was
      #   evaluated and rejected, because it cannot express two things
      #   V1__auth.sql states. First, the fixed-width CHAR(8)
      #   primary key that app/cpy/CSUSR01Y.cpy L18 fixes as SEC-USR-ID PIC X(08)
      #   at offset 0; a generated column would be variable-length, and the
      #   identifier would stop comparing equal to the blank-padded value the
      #   baseline record holds. Second, the CHECK constraint restricting the user
      #   type to A or U, whose authority is app/cpy/COCOM01Y.cpy L26-L28, where
      #   CDEMO-USER-TYPE PIC X(01) carries 88 CDEMO-USRTYP-ADMIN VALUE 'A' and
      #   88 CDEMO-USRTYP-USER VALUE 'U'. Generation emits no such domain, so a
      #   third user type would become insertable and the admin/user split that
      #   guards every administrative route would no longer be total.
      ddl-auto: none
    # Trade-offs: the persistence session closes with the transaction instead of
    #   staying open until the response is written. Touching an unfetched
    #   association in a controller therefore throws rather than quietly issuing
    #   another query, which costs an explicit fetch in the repository for every
    #   association a response needs. The compromise returns the connection to
    #   the pool before serialisation begins, so a slow client cannot occupy one
    #   of the connections counted above.
    open-in-view: false
    properties:
      hibernate:
        # Assumptions: generated statements are schema-qualified here as well as
        #   path-pinned on the connection above. The two mechanisms are
        #   independent, so a pooled connection that somehow reached this service
        #   without its init statement still cannot resolve a table in another
        #   context's schema.
        default_schema: auth

  flyway:
    # Assumptions: this is the other half of the ddl-auto decision above. With
    # entity-driven generation switched off, nothing else in the process would
    # create the auth table, so leaving migration to the framework default
    # rather than stating it here would make the schema's existence depend on
    # which artifacts happen to be on the classpath. V1__auth.sql now occupies
    # the location below and creates the one table this context owns.
    # Refactoring Rationale: the former staged-state note said the location was
    # empty after that migration had landed, which could send an operator
    # looking for a missing artifact when Flyway reported a real migration
    # failure.
    enabled: true
    # Assumptions: exactly one migration exists at this classpath location,
    # V1__auth.sql. There is no seed migration in this context; only the
    # reference context owns one, so a second version here would be an artifact
    # no auth-service requirement produces.
    locations: classpath:db/migration
    # Assumptions: both keys are set because they answer different questions.
    #   The first is the set of schemas this context manages, and the second is
    #   where the migration history table itself lives. Setting only the first
    #   would leave the history table to land in whatever schema the connection
    #   resolved to, which would put this context's migration state outside the
    #   one schema it owns and make it invisible to a reader inspecting auth.
    schemas: auth
    default-schema: auth
    # Assumptions: data-migration/sql/V0__schemas_and_roles.sql is the EXCLUSIVE
    #   authority for schemas, roles and grants in this system. It creates all
    #   eight schemas together with the three tiers of role behind them -- eight
    #   NOLOGIN schema owners, seven migration logins and eight runtime logins --
    #   the credential binding for every login role, and the whole cross-schema
    #   privilege graph. Its completion is a deployment precondition
    #   of this service, not a convenience it can work around, so this flag is
    #   false: Flyway may migrate the `auth` schema and may not create it.
    #
    # Refactoring Rationale: this was true, on the reasoning that a bare
    #   database should still reach a usable state. The reasoning does not survive
    #   what V0 actually does. A schema Flyway creates is owned by whichever role
    #   connected, and it carries none of V0's grants -- so the flag did not
    #   substitute for V0, it produced a second, differently-owned schema that
    #   merely looked like V0 had run. Worse, it made a missing bootstrap
    #   invisible: the service started, migrated, and failed later on a permission
    #   error in a schema nothing had granted anything on. With the flag false the
    #   missing bootstrap aborts startup with a message naming the absent schema,
    #   which is the failure an operator can act on.
    #
    # Trade-offs: the cost is that a bare database -- a fresh local instance, or
    #   a container this module's repository integration test starts -- now needs
    #   its schema created before this service can migrate. The test profile
    #   supplies that for itself, which is a visible, reviewable act in a test
    #   resource rather than a production default that hides a missing
    #   precondition. The alternative of letting this module's own migration
    #   create what it needs was rejected outright: it would put CREATE ROLE and
    #   GRANT statements into V1__auth.sql, which is exactly the cluster-wide
    #   privileged coupling schema-per-service exists to prevent.
    create-schemas: false
    # Alternatives Considered: baselining on migrate was rejected. Against a
    #   schema that already holds objects it marks the history as current and
    #   would skip V1__auth.sql, so the service would report a successful
    #   migration while the table it needs was never created -- a failure that
    #   surfaces later as a missing relation on the first sign-on rather than at
    #   startup.
    baseline-on-migrate: false

    # Assumptions: Flyway authenticates as a DIFFERENT database role than the one
    #   the datasource above uses, and the two are not interchangeable.
    #   data-migration/sql/V0__schemas_and_roles.sql creates three tiers of role
    #   per bounded context: a NOLOGIN carddemo_auth_owner that owns the
    #   schema and everything in it, a carddemo_auth_migrator login that is a
    #   member of that owner, and the carddemo_auth login this service serves
    #   requests as. The runtime role holds USAGE on the schema plus SELECT,
    #   INSERT and UPDATE on its tables -- CREATE is explicitly REVOKEd from it --
    #   so it could not apply this migration even if asked to, and equally cannot
    #   drop or alter the tables it reads.
    # Refactoring Rationale: these two keys did not exist, and Flyway therefore
    #   migrated under the runtime credential. That made the runtime role the
    #   owner of the schema and of every table the migration created, so the one
    #   long-lived credential every request ran under also held DDL authority over
    #   the data it served. Naming a separate migration credential here is what
    #   allows the bootstrap SQL to reduce the runtime role to named DML.
    # Trade-offs: no fallback value, for the same reason the datasource
    #   credential above has none -- a default would let the process start against
    #   a credential nobody chose. The consequence is deliberate: a deployment
    #   that injects the runtime credential and forgets this one fails at startup
    #   on an unresolved placeholder, which names the variable it is missing,
    #   rather than migrating as the wrong identity and succeeding.
    # Assumptions: setting spring.flyway.user is also what gives Flyway its own
    #   DataSource. Spring Boot builds a separate SimpleDriverDataSource derived
    #   from the application DataSource whenever this key is set -- verified
    #   against FlywayAutoConfiguration in spring-boot-flyway 4.1.0, whose
    #   getMigrationDataSource falls to a derivedFrom builder when the Flyway URL
    #   is absent and the Flyway user is not -- so the URL, driver and TLS terms
    #   are inherited while the credential is replaced. That separation matters
    #   beyond tidiness: sharing the Hikari pool would leave the SET ROLE below
    #   applied to pooled connections that later serve runtime queries.
    user: ${SPRING_FLYWAY_USER}
    password: ${SPRING_FLYWAY_PASSWORD}

    # Assumptions: this is the other half of the ownership split, and without it
    #   the migration credential alone achieves nothing. V0 grants
    #   carddemo_auth_migrator its owner WITH INHERIT FALSE, so a session
    #   authenticated as the migrator holds NO privilege at all until it assumes
    #   the owner explicitly. Flyway runs every string here on each connection it
    #   opens, before any migration statement, so every object V1 creates is owned
    #   by carddemo_auth_owner rather than by the credential that connected.
    # Trade-offs: INHERIT FALSE plus an explicit SET ROLE is more moving parts
    #   than granting the migrator ownership directly, and it buys two properties
    #   that arrangement cannot have. A stolen migrator credential used without
    #   this statement can read and write nothing, and every
    #   ALTER DEFAULT PRIVILEGES FOR ROLE carddemo_auth_owner clause in the
    #   bootstrap SQL fires -- those clauses are keyed on the CREATING role, so a
    #   migration that created tables as the migrator would leave them all inert
    #   and the runtime role would receive no grants on the tables it must read.
    # Alternatives Considered: ALTER ROLE carddemo_auth_migrator SET role,
    #   which is a per-role server-side default and needs nothing in this file.
    #   Rejected because it makes a privilege decision invisible at the point it
    #   takes effect: a reader of this configuration would see a migration running
    #   as the migrator and have no way to learn that the server silently
    #   substitutes another identity.
    init-sqls:
    # Assumptions: the statement is TERMINATED. Spring Boot joins this list with a
    #   newline and hands Flyway one script, so an unterminated statement is
    #   concatenated with whatever follows it -- measured against PostgreSQL 17 as
    #   `syntax error at or near "SET"` when a second entry was added under the test
    #   profile. One entry cannot hit that today; the semicolon is what keeps a second
    #   entry from breaking the first.
      - "SET ROLE carddemo_auth_owner;"


  security:
    oauth2:
      resourceserver:
        jwt:
          # Trade-offs: an unresolved placeholder with no fallback, on the same
          #   reasoning as the datasource above and with a sharper consequence. A
          #   default issuer would let this service accept tokens minted by the
          #   wrong user pool, and that fault presents as successful
          #   authentication rather than as an error.
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

  # WHY : (1) Assumptions: this list REPLACES the framework's default static
  #       locations rather than adding to them, so all four defaults are restated
  #       and classpath:/openapi/ is appended. Writing only the fifth entry would
  #       silently drop the four the framework serves from, and dropping
  #       classpath:/META-INF/resources/ in particular would stop the browsable
  #       view's own assets being served at all, because they ship inside a webjar
  #       under exactly that path -- a loss that presents as a broken page rather
  #       than as a missing configuration line.
  #       (2) Refactoring Rationale: classpath:/openapi/ is here so that
  #       openapi/auth-api.yaml -- the contract of record this module's
  #       OpenApiConfig aligns its metadata to -- is reachable over HTTP at
  #       /auth-api.yaml, which is the URL springdoc.swagger-ui.url names below.
  #       Before it was added the contract was packaged and served by nothing, and
  #       nothing in the build noticed: a YAML list is a valid list and a
  #       class-path resource is a class-path resource, so only the RELATIONSHIP
  #       between them was wrong. AuthConfigPackageTest asserts that
  #       relationship rather than either half of it.
  #       (3) Assumptions: this is repeated per module rather than pushed into the
  #       shared defaults deliberately. Each module serves exactly ONE contract and
  #       names it by filename below, so a shared default would have to serve every
  #       contract from every service, and each service would then publish several
  #       documents describing something else.
  web:
    resources:
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        - classpath:/openapi/

management:
  endpoints:
    web:
      # Assumptions: the load balancer target group and this service's
      #   container HEALTHCHECK both request exactly GET /actuator/health,
      #   and neither can present a JWT, so that path has to stay reachable
      #   without one. It reports aggregate status only and no business
      #   data. Both now request it over HTTPS, because server.ssl above
      #   encrypts the listener they share with application traffic: the
      #   target group is configured for HTTPS by target_protocol in
      #   infra/modules/ecs-service, and this service's Dockerfile HEALTHCHECK
      #   must probe https://localhost:8080/actuator/health with certificate
      #   verification disabled for the loopback hop -- the certificate is
      #   issued for the task's registered name, not for localhost, so a
      #   verifying probe fails against a correctly configured service.
      #   Moving the base path, renaming the endpoint, or putting a
      #   credential in front of it breaks target-group registration and
      #   container liveness in the same change, which removes the two
      #   independent signals that a deployment is progressing. Which
      #   principals may reach the remaining endpoints is decided in this
      #   service's SecurityConfig; this file only fixes where they live and
      #   which ones exist.
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        # Assumptions: enabling probes is what creates the liveness and
        #   readiness groups, so the aggregate reported at the path above
        #   distinguishes a task that is alive from one ready to be sent traffic.
        #   Without them both consumers would read a single combined status and a
        #   task still running its migration would be advertised as ready.
        enabled: true
      # Assumptions: the two pollers above act on the aggregate status alone.
      #   Component detail names the datasource and the schema behind it, which
      #   would publish deployment topology on a path that by design carries no
      #   credential.
      show-details: never
  # WHY : Refactoring Rationale: there is deliberately NO metrics.tags block here,
  #       where an earlier revision declared the three common tags. Those exact
  #       three tags are contributed by the shared kernel's MetricsConfig, whose
  #       meter filter is registered for every service by common-lib's own
  #       auto-configuration, and it reads its two configurable values from the
  #       carddemo.environment and carddemo.version properties that the imported
  #       carddemo-common-defaults.yml supplies. Declaring them here as well was
  #       two mechanisms for one concern: a rename in the shared filter would leave
  #       this service publishing the old key alongside the new one, and a
  #       deployment that set only one of the two environment-variable spellings
  #       would produce a service whose tags disagreed with its configuration. One
  #       owner, named here so its absence reads as a decision.

springdoc:
  api-docs:
    # Assumptions: openapi/auth-api.yaml, alongside this file, is the
    # hand-authored contract of record, and ui/src/api/auth.ts is written
    # against that document rather than against this endpoint. The document
    # served here has to agree with it; a difference between the two is a defect
    # in whichever one moved and is not something to reconcile at runtime.
    # Assumptions: the contract declares eight operations and ui/src/api/auth.ts
    # implements exactly those eight, which ui/src/api/contracts.test.ts asserts.
    # The endpoint below describes AuthController and UserController, so what it
    # serves is the generated view of those two adapters and is comparable against
    # the contract of record. The inventory is kept adjacent to the key it explains
    # rather than in a header section, so there is no cross-reference to go stale.
    path: /v3/api-docs
    enabled: true
    # Assumptions: the generated document is pinned to the same specification
    #   version the authored contract declares, 3.1. The generator defaults to
    #   3.0, and a 3.0 stand-in beside a 3.1 contract reports drift on every
    #   schema that uses a 3.1 construct, which would make the comparison this
    #   endpoint exists to enable useless the moment it became possible.
    version: openapi_3_1
  swagger-ui:
    # Trade-offs: the browsable view is published in every environment rather
    #   than switched off outside development. It renders the same document the
    #   path above already serves and adds no endpoint of its own, and the
    #   profiles are not permitted to vary it, so turning it off per environment
    #   would make the surface differ between the environment a change is tested
    #   in and the one it runs in.
    # Assumptions: both keys here publish a path the SECURITY CHAIN refuses, and
    #   the two statements are deliberately left to disagree in favour of the
    #   chain. SecurityConfig ends in denyAll, and neither /v3/api-docs nor
    #   /swagger-ui.html is named by any rule above it, so each answers 403 to
    #   every caller. Trade-offs: what is given up is the browsable view, in
    #   every environment; what it buys is that a route description of the
    #   sign-on service is not readable by anything that merely holds a token
    #   from the pool -- which is what the previous authenticated() catch-all
    #   granted. These keys are retained rather than switched off so the
    #   published surface stays identical across profiles and so a future author
    #   who wants the view has one decision to take, in the chain, rather than a
    #   key to rediscover here.
    path: /swagger-ui.html
    enabled: true
    # Refactoring Rationale: the view is pointed at the CONTRACT OF RECORD rather
    #   than left on its own default, and the class-path folder holding that
    #   contract is added to the served static locations below. Before both
    #   changes the contract was packaged into the jar and served by nothing --
    #   the framework serves static content only from the locations
    #   spring.web.resources.static-locations names -- so the interface of record
    #   answered 404 at every URL while each half stayed valid on its own. This
    #   URL is the path that static-locations entry resolves
    #   openapi/auth-api.yaml to, so the two move together: remove the entry and
    #   this URL 404s again.
    url: /auth-api.yaml
    # Assumptions: without this the view ALSO offers its own bundled sample
    #   definition in the same selector as the contract above, so a reader can
    #   silently end up studying a document that describes nothing in this
    #   service. Disabling it leaves exactly one definition in the selector.
    disable-swagger-default-url: true

logging:
  level:
    # Assumptions: this file owns the property shapes for the
    #   datasource, Flyway, the resource server, Cognito, JPA, the actuator
    #   and observability. application-dev.yml and application-prod.yml
    #   override values only. They may differ in these log levels, in the
    #   pool sizing above, in how broadly the actuator is exposed, and in
    #   the Flyway clean flag -- which is why that flag appears in the prod
    #   profile and nowhere in this file. They may not differ in route
    #   structure, schema ownership, identity mechanism, queue usage or
    #   datastore type, because topology that varies by environment cannot
    #   be verified in one and then trusted in another. Trade-offs: the
    #   two loggers below sit above DEBUG on purpose, which costs a
    #   deliberate override when diagnosing a failing sign-on. At DEBUG they
    #   emit token claims and bound statement parameters respectively, so
    #   leaving them low would put user identifiers and credential material
    #   into log aggregation, where its retention is governed by the log
    #   group rather than by this service.
    root: INFO
    com.carddemo: INFO
    org.flywaydb: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    # Refactoring Rationale: pinning org.hibernate.SQL alone was not enough
    #   and the gap was not obvious. That logger emits parameterised SQL with
    #   the values still as placeholders, so it discloses shape rather than
    #   data; the bound values travel on a DIFFERENT logger, and at TRACE it
    #   prints every parameter of every statement. In this context those
    #   parameters are the eight-character user identifier, the given and
    #   family names, and the pool subject reference of the row being read or
    #   written, so an operator who raised org.hibernate to TRACE while
    #   diagnosing a failing sign-on would ship user identity into log
    #   aggregation and would have no line in this file telling them so. An
    #   explicitly pinned child logger cannot be raised by a broader parent
    #   setting, which is what makes this line a control rather than a
    #   comment.
    # Assumptions: the logger name belongs to the current persistence
    #   provider's package layout and is not the pre-6.x
    #   org.hibernate.type.descriptor.sql spelling; a stale name would bind
    #   to nothing and would look like protection while providing none.
    # Trade-offs: WARN rather than OFF. WARN still lets a genuine binding
    #   failure be reported, which is diagnostically useful and carries no
    #   parameter values; OFF would suppress that too. The two profiles
    #   beside this file may lower the levels above for diagnosis but must
    #   not lower this one or org.springframework.security, because both emit
    #   credential-adjacent material at DEBUG and below.
    org.hibernate.orm.jdbc.bind: WARN

carddemo:
  auth:
    cognito:
      # Alternatives Considered: declaring them as extra children of
      #   spring.security was rejected, because that prefix is bound by the
      #   framework's own configuration properties, so an unrecognised child
      #   there is either ignored without a warning or rejected outright
      #   depending on the release -- and a silently ignored pool
      #   identifier would leave sign-on pointed at nothing. A prefix this
      #   project owns binds predictably and is greppable in one place.
      # Trade-offs: as with the datasource and the issuer above, none
      #   of the three carries a fallback, so startup stops when one is
      #   missing rather than the service coming up bound to another
      #   environment's user pool. Assumptions: the task definition
      #   injects all three, the confidential one out of Secrets Manager and
      #   the other two out of Parameter Store. No value for any of them
      #   exists anywhere in this repository -- not in this file, not in
      #   either profile beside it.
      #
      # Refactoring Rationale: a fourth key, `token-endpoint`, was
      #   declared here and has been removed, because it named a mechanism
      #   that cannot perform this service's job. The pool's OAuth token
      #   endpoint implements the authorization-code, client-credentials and
      #   refresh-token grants; it implements NO password grant, so there is
      #   no request on it that exchanges a user id and a password for a
      #   token. Carrying the key therefore described a sign-on flow that
      #   could never run, and it described one incompatible with the rest of
      #   the design at the same time: a token endpoint plus a client secret
      #   is the confidential authorization-code shape, which requires a
      #   hosted sign-in domain and a browser redirect, while the SPA renders
      #   the baseline's own sign-on screen from app/bms/COSGN00.bms and
      #   posts the credential here. Two incompatible flows half-configured
      #   is worse than either, because each half looks correct beside its
      #   own neighbours.
      #
      # WHY : (5) Assumptions: THE sign-on mechanism, stated once so no later
      #       reader has to reconstruct it. CognitoIdentityService calls the
      #       provider's authentication API directly with the user pool's
      #       USER_PASSWORD_AUTH flow, computing the SECRET_HASH from
      #       `client-id`, the submitted user id and `client-secret`, and drives
      #       any challenge the pool returns (a new password, or a second factor
      #       where the environment enforces one). Three consequences follow and
      #       all three are load-bearing. The client is CONFIDENTIAL and its
      #       secret stays server-side, which is why `client-secret` is read from
      #       Secrets Manager and why nothing resembling it appears in
      #       ui/.env.example. No hosted-UI domain is provisioned, so
      #       infra/modules/cognito leaves `domain_prefix` null. And the three
      #       exact public mapping is deliberate: with Cognito's uniform
      #       user-existence errors enabled, BOTH an unknown user and a bad
      #       password return the baseline string 'Wrong Password. Try again
      #       ...'. 'User not found. Try again ...' remains catalogued for
      #       traceability alone and is returned on no code path;
      #       unrelated provider or integration failures return 'Unable to
      #       verify the User ...'. This loses the baseline's public
      #       user-existence distinction on purpose instead of claiming three
      #       distinguishable responses survive one uniform provider failure.
      # WHY : (6) Refactoring Rationale: the note above used to say the
      #       'User not found' string remained catalogued for traceability "and
      #       an explicitly selected LEGACY provider posture", which implied a
      #       configuration under which the baseline's third sentence would be
      #       returned. No such configuration exists. infra/modules/cognito
      #       hard-codes prevent_user_existence_errors = "ENABLED" and
      #       deliberately refuses to expose it as a module input, so the LEGACY
      #       posture cannot be selected in either environment root. A posture
      #       that cannot be selected is not a documented option; it is a false
      #       statement about the system, so the clause was withdrawn. The
      #       divergence it was half-describing is registered properly, as
      #       D-SIGNON-EXISTENCE-UNIFORM in
      #       docs/architecture/cobol-to-service-traceability.md section 7.4.
      user-pool-id: ${CARDDEMO_AUTH_COGNITO_USER_POOL_ID}
      client-id: ${CARDDEMO_AUTH_COGNITO_CLIENT_ID}
      client-secret: ${CARDDEMO_AUTH_COGNITO_CLIENT_SECRET}

      # WHY : (1) Purpose: where a user created at run time collects its first
      #       credential. The pool account is made in its force-change state with
      #       a generated temporary password, and that password is written to a
      #       managed-secret entry beneath this prefix rather than returned on the
      #       response or written to a log. Without the prefix there is nowhere to
      #       write it, so the account exists holding a credential no principal can
      #       obtain -- a user who can never sign in.
      #       (2) Assumptions: it is the SAME prefix the infrastructure writes the
      #       seed identities' handover entries under, and the two families are
      #       separated by a fixed segment the service appends: /seed-user/ for
      #       Terraform's entries, /runtime-user/ for this service's. One prefix
      #       with two families is what lets the task role be granted write
      #       permission on this family alone, so a defect here cannot overwrite a
      #       seed identity's handover or reach the database credential.
      #       (3) Assumptions: injected with NO fallback, for the same reason the
      #       pool identifier above has none. A default would let the service start
      #       and publish a real user's one-time credential somewhere nobody looks.
      #       (4) Assumptions: this is not a secret and does not belong in the
      #       secret register. It is a name prefix; what protects the values beneath
      #       it is secretsmanager:GetSecretValue together with the key policy of
      #       the key named below.
      credential-secret-prefix: ${CARDDEMO_AUTH_CREDENTIAL_SECRET_PREFIX}

      # WHY : (1) Assumptions: the customer-managed key a created credential entry
      #       is encrypted with, named explicitly rather than letting the store fall
      #       back to the account's default managed key. The value being stored is
      #       the direct replacement for the cleartext SEC-USR-PWD field at
      #       app/cpy/CSUSR01Y.cpy L21, and a customer-managed key carries an
      #       auditable, revocable key policy that the default does not -- so
      #       possession of the entry is not sufficient without the key's
      #       permission. infra/modules/cognito makes the same choice for the seed
      #       entries.
      #       (2) Assumptions: no fallback, because the failure a default would
      #       produce is silent. An entry created under the default key is readable
      #       by every principal with GetSecretValue and no separate key grant,
      #       which is a weaker posture that looks identical from the API.
      credential-secret-kms-key-arn: ${CARDDEMO_AUTH_CREDENTIAL_SECRET_KMS_KEY_ARN}

      # WHY : (1) Assumptions: how many characters a generated temporary password
      #       carries. It has a default because it is a policy preference rather
      #       than a deployment address, unlike the two keys above, and 24 sits
      #       well above the pool's own configured minimum of 14 declared at
      #       infra/modules/cognito/variables.tf so a policy change cannot make
      #       every create fail.
      #       (2) Trade-offs: the service always draws from all four character
      #       classes rather than reading the pool's five policy flags, which
      #       satisfies a policy requiring any SUBSET of them with one property
      #       instead of five that could disagree with the pool's actual
      #       configuration. The one policy that cannot be satisfied is a minimum
      #       length above this value, which is exactly why this value is
      #       configurable and is validated at startup.
      temporary-password-length: ${CARDDEMO_AUTH_TEMPORARY_PASSWORD_LENGTH:24}

      # WHY : (1) Refactoring Rationale: the administrative provider client and the
      #       managed-secret client were built with no override configuration at
      #       all, and the software development kit's default for both deadlines is
      #       NO deadline. The sign-on exchange was bounded and these were not, so
      #       a provider that accepted a connection and stopped answering held the
      #       calling thread until the socket gave up -- and the concrete shape of
      #       that is a create-user request that never returns while the pool
      #       account it asked for has already been made.
      #       (2) Assumptions: the attempt budget must be SMALLER than the
      #       whole-call budget, and config/CognitoIdentityConfig.java refuses the
      #       pair at startup when it is not. The whole-call budget is spent across
      #       every attempt the retry policy makes, so an attempt allowed to consume
      #       all of it leaves the policy no room and retries nothing while
      #       appearing to have a policy.
      #       (3) Trade-offs: one pair serves both clients. They are called in
      #       immediate succession on one provisioning path, so a caller's exposure
      #       is their sum either way, and two pairs would be four numbers whose
      #       only correct relationship is equality.
      api-call-timeout-ms: ${CARDDEMO_AUTH_COGNITO_API_CALL_TIMEOUT_MS:10000}
      api-call-attempt-timeout-ms: ${CARDDEMO_AUTH_COGNITO_API_CALL_ATTEMPT_TIMEOUT_MS:4000}

  # Assumptions: validating the issuer is NOT validating the token.
  #   `spring.security.oauth2.resourceserver.jwt.issuer-uri` above makes the
  #   filter chain verify the signature, the issuer and the time claims, and
  #   that is where its guarantees end. One user pool mints TWO token kinds
  #   from the same signing key: an access token, whose `token_use` claim is
  #   `access`, and an identity token, whose `token_use` claim is `id`. Both
  #   are validly signed by the configured issuer, so without the check
  #   below an identity token -- which is meant to describe a user to a
  #   client, not to authorize an API call -- would be accepted as
  #   authorization here. It is also the token a browser is most likely to
  #   have to hand.
  # Assumptions: the same pool can hold more than one app client, and
  #   a token minted for a different client of this pool carries this pool's
  #   issuer. Binding the accepted client id closes that, and the value has
  #   to be the client this service's own sign-on flow uses, which is why it
  #   is injected rather than defaulted.
  # Alternatives Considered: expressing this through the framework's
  #   own `spring.security.oauth2.resourceserver.jwt.audiences` key, which
  #   is the obvious declarative route and is WRONG here. A Cognito ACCESS
  #   token carries no `aud` claim at all -- the client id travels in
  #   `client_id` instead -- so an audience validator would reject every
  #   access token the sign-on flow issues while accepting the identity
  #   tokens this block exists to refuse. It would invert the control.
  # Assumptions: these keys are read by this service's SecurityConfig,
  #   which installs a delegating token validator ahead of the group
  #   mapping, so a token failing any of the three never reaches
  #   JwtRoleConverter and no authority is derived from it. common-lib's
  #   security package deliberately owns the group mapping alone and no
  #   token validation, so the validator belongs to each service rather than
  #   to the shared kernel; the property shape is identical in every
  #   service so that the eight chains cannot diverge in what they accept.
  # Trade-offs: `required-scope` names the scope the pool grants to a
  #   token obtained through the authentication API rather than a custom
  #   resource-server scope. Custom scopes are only granted through the
  #   OAuth flows this design does not use, so requiring one would reject
  #   every token the sign-on flow can produce. What this value still buys
  #   is decisive: an identity token carries no `scope` claim whatsoever, so
  #   requiring any scope at all is a second, independent rejection of the
  #   wrong token kind, and it is the same claim the API Gateway route
  #   authorization scopes assert at the edge, so the edge and the service
  #   agree rather than each guessing.
  security:
    jwt:
      expected-token-use: access
      expected-client-id: ${CARDDEMO_SECURITY_JWT_EXPECTED_CLIENT_ID}
      required-scope: aws.cognito.signin.user.admin

    # WHY : Assumptions: the two group names are configured rather than left
    #   implicit, and common-lib's JwtRoleConverter compares them with its own
    #   compiled constants and REFUSES TO START on a mismatch. This is therefore
    #   the point at which a deployed pool whose groups were renamed becomes a
    #   startup failure instead of a service that authenticates every request and
    #   authorizes none -- which on THIS context would be the widest possible
    #   failure, because the five operations behind that authority create, alter
    #   and delete the rows that decide who is an administrator. The defaults are
    #   the same two names infra/modules/cognito fixes as non-overridable, so an
    #   environment that sets neither variable still starts correctly.
    # WHY : Trade-offs: the property shape is identical in every service that has
    #   a filter chain, which duplicates two keys per service. The alternative --
    #   one shared configuration source -- was rejected because a service must be
    #   startable on its own, and a missing shared source would fail eight
    #   deployables for one edit.
    cognito:
      admin-group-name: ${CARDDEMO_COGNITO_ADMIN_GROUP_NAME:carddemo-admin}
      user-group-name: ${CARDDEMO_COGNITO_USER_GROUP_NAME:carddemo-user}
