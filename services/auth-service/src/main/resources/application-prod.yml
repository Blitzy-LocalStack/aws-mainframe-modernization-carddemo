# =============================================================================
# services/auth-service/src/main/resources/application-prod.yml
# -----------------------------------------------------------------------------
# Purpose:
#   The prod profile overlay for the CardDemo auth bounded context. It overrides
#   VALUES ONLY on shapes the application.yml beside it already owns, and it
#   introduces exactly one key that file deliberately omits,
#   spring.flyway.clean-disabled. Nothing here restates a value it does not
#   change, because a profile that repeats the base makes the two files read as
#   though they disagreed and hides the handful of lines that actually differ.
#
#   Four axes of variation are permitted between this profile and its dev
#   sibling. This file moves all four and nothing else: log levels, Hikari pool
#   sizing, actuator exposure breadth, and the Flyway clean flag. Six axes are
#   forbidden -- service topology, route structure, schema ownership, identity
#   mechanism, queue usage, datastore type -- and none appears below.
#
#   Each key carries the rationale for its own value; the constraints the whole
#   overlay is held to are stated once immediately after this header.
# =============================================================================

# Assumptions: because the shapes are identical in both environments -- auth
# remains the single schema this context owns, standing in for the single 80-byte
# record at app/cpy/CSUSR01Y.cpy L17-L23; identity stays a Cognito JWT resource
# server; there is no queue; the datastore stays PostgreSQL -- a defect
# reproduced in dev is reproducible in prod, and a failure seen only in prod is
# attributable to data or to capacity rather than to drift between these files.
#
# Trade-offs: this file supplies no value for anything the platform provides, and
# no fallback for one. The datasource URL, its two connection credentials, the
# resource server's issuer URI, and the user pool, app client and confidential
# client credential are all declared in application.yml as unresolved
# placeholders and stay unresolved here, so startup fails fast when
# configuration is absent. That is accepted over a working default, which would
# let this process come up bound to another environment's user pool or reading
# another environment's rows -- a fault that presents as a service that works.
#
# Assumptions: the ECS task definition injects the active profile and every
# endpoint from Parameter Store, and every credential from Secrets Manager where
# hashicorp/random generated it at Terraform apply time, so no such value passes
# through this repository. The image carries no baked-in
# -Dspring.profiles.active, which is what makes THIS file the prod overlay by
# deployment-time selection rather than by image identity: one image runs in both
# environments and the injected profile decides which overlay applies.

spring:
  datasource:
    hikari:
      # Refactoring Rationale: there is no baseline number to carry across, so
      # these are sized from the target's own constraints rather than transcribed
      # from the arrangement they replace. app/csd/CARDDEMO.CSD L91 defines
      # FILE(USRSEC) with STRINGS(1), so the baseline serialised EVERY
      # user-security access through exactly one VSAM string -- a hard
      # concurrency ceiling of one. A reader looking for the legacy value these
      # numbers descend from will not find one.
      #
      # Assumptions: the figure that has to fit the cluster's connection budget
      # is the AGGREGATE, and its multiplier is not the one a reader expects.
      # infra/modules/ecs-service stops tracking desired_count after creation so
      # Application Auto Scaling owns the running count, between min_capacity (2)
      # and max_capacity (6). This context therefore contributes 20 x 6 = 120
      # connections at full scale-out rather than 20 x the initial task count,
      # against 5 x 2 = 10 warm ones at steady state. Raising max_capacity in an
      # environment root without revisiting this number is exactly how a
      # scale-out driven by a fault turns into refused connections for every
      # context sharing the cluster.
      #
      # Assumptions: prod holds the Aurora capacity floor above zero, where a
      # min_capacity of 0 makes auto-pause mandatory and is a dev posture. Warm
      # connections therefore stay useful between requests instead of being
      # severed by a pause, which is what makes minimum-idle worth raising -- and
      # it matters more than the ceiling, because the base file pins
      # sslmode: verify-full with an explicit trust anchor, so every NEW
      # connection pays a full chain-and-hostname-verifying handshake first.
      #
      # Trade-offs: doubling the base ceiling and more than doubling the warm
      # floor absorbs a sign-on burst without borrowers queueing against the
      # 30-second wait, and costs a higher idle footprint plus the 120-connection
      # scale-out ceiling above. A smaller pool would conserve cluster
      # connections and queue under burst instead -- the right trade for dev and
      # the wrong one here, because queueing delays the one request that gates
      # every other screen. connection-timeout is deliberately NOT restated, so
      # the wait stays at the base value and a pool raise cannot be read as also
      # relaxing it.
      maximum-pool-size: 20
      minimum-idle: 5

  flyway:
    # Refactoring Rationale: the arrangement this replaces offered no way back.
    # app/csd/CARDDEMO.CSD L94-L97 defines FILE(USRSEC) -- the indexed file the
    # auth schema stands in for -- with JOURNAL(NO), JNLREAD(NONE),
    # JNLSYNCREAD(NO), JNLUPDATE(NO), JNLADD(NONE), RECOVERY(NONE),
    # FWDRECOVLOG(NO) and BACKUPTYPE(STATIC): no point-in-time recovery path at
    # all, so a destructive operation there was survivable only in the sense that
    # nobody ran one. Inheriting a data domain that historically had no undo, the
    # target refuses the operation at the configuration level rather than relying
    # on operator discipline: with this set, an accidental or scripted
    # flyway:clean against the production datasource fails instead of dropping
    # auth.users and every sign-on identity mapped through it.
    #
    # Assumptions: this is a guardrail against operator error, not the only line
    # of defence -- the Terraform aurora-postgresql module provisions automated
    # backups and encryption at rest, so a recovery capability now exists where
    # the baseline had none.
    #
    # Trade-offs: the pinned framework release already defaults this to true, so
    # the line changes no behaviour today and is kept regardless, because the
    # guarantee is then readable in the profile carrying the production risk
    # instead of being inferable only by knowing a framework default and trusting
    # that no later upgrade revisits it.
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        # Assumptions: the metrics surface cannot be closed in pursuit of a
        # narrower one. micrometer-registry-prometheus is a runtime dependency of
        # this module, and common-lib's MetricsConfig contributes the common tags
        # service, environment and version that every dashboard and alarm the
        # Terraform observability module provisions groups by. Dropping metrics or
        # prometheus would raise no error anywhere: the process would start, serve
        # traffic, and simply stop being scraped, so dashboards would render empty
        # panels and alarms would sit in insufficient-data instead of firing.
        #
        # Assumptions: health stays at exactly /actuator/health and reachable
        # without a token. Both the load balancer target group and the container
        # HEALTHCHECK request that path, NEITHER can present a JWT, and it
        # reports aggregate status carrying no business data. Withdrawing, moving
        # or crediting it would break target-group registration and container
        # liveness in one change. Which principals may reach the endpoints that
        # remain is decided in SecurityConfig; this list only decides which
        # endpoints exist.
        #
        # Trade-offs: info is withdrawn, and the whole diagnostic tier -- env,
        # configprops, loggers, flyway, threaddump, heapdump -- is never published
        # here. The cost falls on diagnosis: an operator cannot read a running
        # task's effective configuration, confirm the applied migration version
        # from the endpoint, or raise a log level at runtime, so an investigation
        # runs first on the metrics series and a correlation-id-scoped log search
        # and escalates to a reviewed configuration change second. Accepted
        # because env and configprops enumerate resolved property values -- the
        # datasource URL, the pool identifiers, the name of everything injected
        # out of Secrets Manager -- on a surface whose health sibling is
        # deliberately reachable with no credential, and because heapdump returns
        # process memory containing whatever a bearer token last occupied.
        include: health,metrics,prometheus

logging:
  level:
    # Trade-offs: root drops to WARN while this context's own packages stay at
    # INFO, a deliberate split rather than one level applied twice. At production
    # rates the framework's INFO output is dominated by per-request and lifecycle
    # detail that says nothing specific about a sign-on, and it is paid for twice
    # -- CloudWatch ingestion and log group retention. The cost is that a defect
    # stops being reproducible from the log alone, so an investigation starts
    # from com.carddemo's own events, pivots on the correlation id common-lib's
    # CorrelationIdFilter puts into the logging context, and escalates to a
    # reviewed level change and a redeploy when that is not enough --
    # /actuator/loggers is not published here.
    #
    # Assumptions: com.carddemo is restated rather than left to inherit. Profile
    # sources merge with the base, so the line is not needed to hold the level it
    # already has; it is here because root moves in the same block, and a reader
    # lowering root for an investigation has to see that this context's own floor
    # is pinned independently of it.
    #
    # Assumptions: the credential-adjacent loggers are absent on purpose.
    # org.springframework.security and org.hibernate.orm.jdbc.bind are pinned at
    # WARN by the base file, which forbids a profile lowering either, because at
    # DEBUG they emit token claims and the values bound into each statement --
    # here the eight-character user id, the given and family names, and the pool
    # subject reference of the row being touched. Restating them at the value they
    # already hold would read as a prod-specific decision and invite a later edit
    # to treat them as this file's to move.
    root: WARN
    com.carddemo: INFO
