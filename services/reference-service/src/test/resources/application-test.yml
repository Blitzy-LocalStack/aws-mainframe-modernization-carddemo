# =============================================================================
# services/reference-service/src/test/resources/application-test.yml
# -----------------------------------------------------------------------------
# Purpose:
#   Supplies the Spring `test` profile overlay for reference-service, the sixth
#   module in the nine-module services reactor. It keeps the production
#   datastore, schema and identity mechanisms while replacing only the
#   environment-bound values that would make an isolated test context contact
#   infrastructure or resolve against the wrong PostgreSQL schema.
#   Refactoring Rationale: "queue mechanisms" is struck from that list, along with
#   the region, queue-strategy, listener-auto-start and three queue-name values
#   this profile used to carry. The module consumes no queue: the baseline drives
#   BOTH of its inquiry programs from ONE request destination at
#   app/app-vsam-mq/README.md L53, and a queue admits exactly one owning consumer,
#   which is in the account context. A profile that kept stand-in queue names would
#   describe a mechanism no class in this module reads.
#
#   Spring's Config Data loader consumes this file whenever profile `test` is
#   active. Repository integration tests supply PostgreSQL container connection
#   coordinates by dynamic property registration; MVC tests consume the
#   security, actuator and logging portions without opening a listener or a
#   database connection. No Java test class is authored in this module, so this
#   profile is FULLY SELF-DESCRIBING and relies on no absent test source for its
#   configuration contract.
#
#   The file has two blocks. `server` disables the base profile's TLS listener for
#   a loopback test hop, and `spring` together with the `carddemo` keys beneath it
#   supplies the environment substitutions that let the Spring context retain
#   production mechanisms without contacting deployed infrastructure. A closing
#   register at the foot of the file records the omissions that are deliberate.
#
# Parameters:
#   Each property key is the YAML analogue of a parameter. Every value that
#   differs from the base profile has an adjacent labelled rationale naming the
#   rejected alternative and the concrete failure that alternative causes.
#
# Return values:
#   The effective configuration handed to the Spring application context after
#   this overlay is merged over src/main/resources/application.yml and the
#   imported carddemo-common-defaults.yml.
#
# Exceptions or errors:
#   A misspelled Spring property is silently ignored. A wrong value can instead
#   open the wrong transport, select `public` or skip a migration. The adjacent
#   comments identify those failure modes at the values that prevent them.
#   Refactoring Rationale: "contact AWS, or keep a queue poller alive" is struck
#   with the queue values it described -- no class in this module builds a queue
#   client or a listener container now, so neither failure is reachable.
#
# WHY (non-obvious design decisions):
#   - Assumptions: user-specified Rule 1 (Explainability) requires Purpose,
#     Parameters, Return values and Exceptions on a module entry point. YAML has
#     no docstring construct, so the mapping is: this header states Purpose;
#     property keys are Parameters; the merged Spring Environment is the Return
#     value; and each adjacent rationale states the failure raised or silently
#     admitted by a wrong value. The trivial-accessor relief has no YAML
#     analogue.
#   - Assumptions: config/checkstyle/checkstyle.xml limits Checkstyle to
#     fileExtensions="java". This profile is therefore a review gate rather
#     than a linter gate, which is why every non-obvious value and every
#     deliberate absence is explained in this file.
#   - Assumptions: every leaf path below matches the base profile verbatim, with
#     no exception. Refactoring Rationale: the one exception this note recorded was
#     spring.cloud.aws.sqs.listener.auto-startup, a key that existed here to stop a
#     listener container starting. Both the key and the container are withdrawn, so
#     the exception is gone rather than merely re-argued; the property-shape proof
#     it carried is no longer needed because nothing in this module binds a key
#     outside the base's own set.
#   - Trade-offs: the overlay repeats several inherited values so the database,
#     migration and identity contracts can be read in one place. The
#     repeated text adds review surface, but silent inheritance would hide which
#     schema and migrations a passing integration test actually exercised.
# =============================================================================

# WHY : (1) Assumptions: the base profile enables TLS and obtains a PEM
#       certificate and key from environment values with no fallback. A test
#       that starts a real listener receives neither value and otherwise fails
#       while trying to load the unresolved text as a file. Mock MVC tests open
#       no listener, so this setting is inert for them. (2) Alternatives
#       Considered: committing a throwaway self-signed pair was rejected because
#       it would add private-key material for a loopback hop and the certificate
#       name would not match localhost. (3) Trade-offs: a real test listener is
#       cleartext. Both ends run on the same host, no load balancer terminates
#       the hop, and deployed TLS remains enabled by the base profile.
server:
  ssl:
    enabled: false

spring:

  # WHY : (1) Alternatives Considered: H2 or another in-process database was
  #       rejected. V1__reference.sql uses PostgreSQL DDL and an ON DELETE
  #       RESTRICT foreign key from transaction_categories.type_cd to
  #       transaction_types.type_cd; the integration contract is that a parent
  #       delete with children is refused. A substitute engine can parse or
  #       enforce that rule differently, making the assertion pass without
  #       testing the deployed dialect. (2) Assumptions:
  #       spring-boot-testcontainers is absent, so @ServiceConnection is not
  #       available. Repository tests register the container-generated JDBC
  #       URL, user name and credential dynamically, and those values take
  #       precedence over the unresolved base properties. (3) Trade-offs: the
  #       suite requires a Docker daemon and pays a PostgreSQL container start
  #       cost. That cost buys an assertion against the same engine and
  #       constraints the migration targets, with no connection literal here.
  datasource:
    hikari:
      # WHY : (1) Assumptions: this inherited statement is repeated as a
      #       belt-and-braces session pin, not as the primary schema mechanism.
      #       The container generates its URL, so this file cannot append a
      #       currentSchema or options parameter. PostgreSQL accepts a search
      #       path naming an absent schema, so the statement can succeed before
      #       Flyway creates `reference`; the explicit Flyway and Hibernate
      #       schema properties below remain the load-bearing controls.
      #       (2) Trade-offs: the repeated statement is redundant after those
      #       controls apply, but it makes any stray unqualified query resolve
      #       only within `reference` instead of falling through to `public`.
      connection-init-sql: SET search_path TO reference

      data-source-properties:
        # WHY : (1) Assumptions: the base profile requires verify-full and a CA
        #       bundle because deployed PostgreSQL serves TLS. The stock
        #       PostgreSQL Testcontainer starts with TLS off, so inheriting that
        #       mode rejects every connection with "The server does not support
        #       SSL" before Flyway can run. (2) Alternatives Considered:
        #       `prefer` was rejected because it changes transport according to
        #       how a container image happens to start and verifies no identity
        #       when TLS is available. (3) Trade-offs: `disable` makes the
        #       loopback database hop cleartext. The container holds only test
        #       data and is discarded with the run; deployed connections keep
        #       verify-full from the base profile.
        sslmode: disable

      # WHY : Trade-offs: four connections with no idle floor replace the
      #       deployed pool's ten-and-two sizing. Repository tests issue no
      #       parallel query load, while reactor test forks can hold several
      #       pools against one container. A fifth concurrent request waits
      #       within the inherited connection timeout instead of opening
      #       another connection.
      maximum-pool-size: 4
      minimum-idle: 0

  jpa:
    hibernate:
      # WHY : (1) Assumptions: Flyway owns schema creation, and `validate`
      #       checks that the JPA mappings agree with the six tables produced
      #       by V1__reference.sql. This is an intentional divergence from the
      #       base value `none`, which is appropriate after a deployment gate
      #       has already checked a migration but would make this migration
      #       test assert nothing about entity drift. (2) Alternatives
      #       Considered: `create`, `create-drop` and `update` were rejected
      #       because they would substitute Hibernate's inferred schema for
      #       Flyway's output; a defective migration could then pass against
      #       tables Hibernate authored. (3) Trade-offs: a mismatch aborts
      #       context startup instead of appearing as a query-time failure.
      #       The startup abort names the mapped object that disagrees.
      ddl-auto: validate

    # WHY : (1) Assumptions: this repeats the base value so a repository test
    #       cannot depend on a persistence session that outlives its service
    #       transaction. With the permissive default, a lazy association can
    #       resolve during response rendering and make a test pass on a query
    #       issued outside the service boundary. (2) Trade-offs: lazy access
    #       outside a transaction fails in the test and requires the repository
    #       to fetch what its caller needs explicitly. That failure is the
    #       signal that keeps test and deployed transaction boundaries aligned.
    open-in-view: false

    # WHY : Trade-offs: provider SQL is not written directly to standard
    #       output. That gives up the shortest way to inspect a generated query,
    #       but this switch bypasses logger levels and would interleave every
    #       statement with the 862-row seed. A developer can raise a logger for
    #       one investigation without making every default run unreadable.
    show-sql: false

    properties:
      hibernate:
        # WHY : (1) Assumptions: the underscore is part of Hibernate's property
        #       name and is not interchangeable with Flyway's hyphenated key.
        #       The container-generated URL carries no schema parameter, so
        #       omitting this value lets unqualified entity tables resolve
        #       against `public`; validation then fails on missing relations, or
        #       queries a same-named table outside the bounded context.
        #       (2) Trade-offs: this repeats the base value and duplicates the
        #       session search path above. The independent pin keeps Hibernate's
        #       mapping target visible even if either other mechanism changes.
        default_schema: reference

  flyway:
    # WHY : (1) Assumptions: Flyway remains enabled because this context is the
    #       executable check of all FOUR migrations. V1__reference.sql creates
    #       the six reference tables; V2__seed_reference.sql inserts 862 rows: 7
    #       transaction types, 18 transaction categories, 51 disclosure groups,
    #       490 phone area codes, 56 states and 240 state/zip prefixes;
    #       V3__reference_inquiry_reply_ledger.sql creates an operational table
    #       for the date-inquiry exchange; and
    #       V4__drop_reference_inquiry_reply_ledger.sql drops it again, because
    #       this module declares no listener and so never wrote to it -- the
    #       exchange's one consumer, and its ledger, live in account-service.
    #       Refactoring Rationale: V3 is NOT deleted, because removing a released
    #       migration makes an already-migrated environment refuse to start, so
    #       the table is created and then withdrawn on every database and the
    #       schema settles at the six reference tables. MigrationHistoryIT
    #       asserts exactly that end state here, against this engine. Narrowing
    #       the location or disabling Flyway would make count, rate and
    #       foreign-key assertions operate on absent or hand-created data, and
    #       would leave the withdrawal unverified. (2) Assumptions:
    #       exactly 17 of the disclosure rows use the CHAR(10) key
    #       'DEFAULT   '. CBACT04C retries a missed account-group lookup with
    #       that key and calls its abend paragraph if the second read also
    #       misses, so deleting those rows produces a failure in batch-service
    #       even though reference-service owns the seed.
    enabled: true
    locations: classpath:db/migration

    # WHY : (1) Assumptions: `schemas` names every schema Flyway manages, while
    #       `default-schema` determines where its history table and unqualified
    #       objects resolve. Setting only one can place migration state in
    #       `public` while tables land in `reference`, making a repeated run
    #       report the wrong history. (2) Trade-offs: both values restate the
    #       base profile. The duplication exposes the complete schema contract
    #       in the test overlay and prevents a base edit from changing what the
    #       integration suite proves without a visible test-profile diff.
    schemas: reference
    default-schema: reference

    # WHY : (1) Assumptions: the base deliberately sets this false because
    #       data-migration/sql/V0__schemas_and_roles.sql owns deployed schemas,
    #       owner roles and grants. A bare PostgreSQL container runs no V0, and
    #       V1 deliberately contains no CREATE SCHEMA, CREATE ROLE or GRANT, so
    #       false makes the first qualified CREATE TABLE fail on an absent
    #       schema. True is the sanctioned test substitute for schema existence.
    #       (2) Trade-offs: the container's connecting role owns the schema and
    #       none of V0's privilege graph is exercised. Reproducing V0 here was
    #       rejected because it would duplicate cluster-level DDL into a
    #       per-service resource and let the copy drift from its authority.
    create-schemas: true

    # WHY : Assumptions: a container starts empty, so there is no populated
    #       schema to adopt as a baseline. Enabling baselining could mark an
    #       unexpected pre-existing schema as migrated and skip V1, leaving the
    #       context to fail against objects Flyway never created.
    baseline-on-migrate: false

    # Assumptions: `user` and `password` are deliberately ABSENT here while
    #   application.yml binds both to SPRING_FLYWAY_* with no fallback, and the
    #   absence resolves rather than conflicts. Boot only reads those two keys
    #   through PropertiesFlywayConnectionDetails, which
    #   FlywayAutoConfiguration creates @ConditionalOnMissingBean
    #   (FlywayConnectionDetails.class). The container below carries
    #   @ServiceConnection, whose JdbcConnectionDetails is adapted into a
    #   FlywayConnectionDetails bean by
    #   JdbcAdaptingFlywayConnectionDetailsFactory -- measured, not assumed: with
    #   the keys added and no SPRING_FLYWAY_USER in the environment, the context
    #   reached Flyway and failed on the SQL below rather than on an unresolved
    #   placeholder. So the container's own generated credential migrates here,
    #   and no stand-in credential has to be invented for a role this profile
    #   never creates with a password.
    #
    # Refactoring Rationale: `init-sqls` IS restated, and it has to be. The base
    #   file's single statement is `SET ROLE carddemo_reference_owner`, naming the
    #   NOLOGIN role data-migration/sql/V0__schemas_and_roles.sql creates and this
    #   container has never heard of; left inherited, every test in the six
    #   *RepositoryIT classes failed context load with
    #   `role "carddemo_reference_owner" does not exist`.
    #
    # Alternatives Considered: overriding this to an empty list, or to a no-op
    #   statement, so the ownership split simply does not happen under test.
    #   Rejected: it would leave the mechanism the deployed configuration depends
    #   on asserted by nothing, and the mechanism is the whole of the control --
    #   objects a migration creates must belong to the NOLOGIN owner, because every
    #   ALTER DEFAULT PRIVILEGES FOR ROLE clause in the bootstrap SQL is keyed on
    #   the CREATING role and is inert otherwise. The statements below reproduce it
    #   instead: the role is created if absent, granted CREATE on whichever
    #   database the container generated, and then assumed -- so Flyway creates the
    #   schema, the history table and every V1 object as carddemo_reference_owner,
    #   exactly as it does in a deployed environment.
    #
    # Assumptions: the first statement is idempotent because Flyway runs every
    #   string here on EACH connection it opens, not once per migration. The role
    #   test and the grant are both re-runnable, and the grant is issued through
    #   `format` with `%I` on `current_database()` rather than a literal, because
    #   Testcontainers generates the database name and no fixed value would match
    #   it. CREATE on the database is required and is not implied by role
    #   creation: a fresh role holds only the PUBLIC grants, which are CONNECT and
    #   TEMPORARY, so without it `CREATE SCHEMA` fails once the SET ROLE takes
    #   effect.
    # Trade-offs: the container's user is a superuser and could therefore assume
    #   this role with no grant at all, which would make the GRANT look
    #   superfluous. It is kept because the grant is what the OWNER needs to create
    #   the schema, not what the connecting user needs to become it -- and
    #   `SET ROLE` drops the superuser attribute for the remainder of the session.
    init-sqls:
      - "DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'carddemo_reference_owner') THEN CREATE ROLE carddemo_reference_owner NOLOGIN; END IF; EXECUTE format('GRANT CREATE ON DATABASE %I TO carddemo_reference_owner', current_database()); END $$;"
      - "SET ROLE carddemo_reference_owner;"


  security:
    oauth2:
      resourceserver:
        jwt:
          # WHY : (1) Alternatives Considered: `jwk-set-uri` was rejected because
          #       it names key material this repository must not carry, and it
          #       removes no startup cost: it fetches the key set while the
          #       context starts exactly as the issuer form fetches the provider
          #       document.
          #       (2) Refactoring Rationale: this note previously said
          #       issuer-based discovery was DEFERRED until a real token was
          #       decoded, and contrasted that with an eager `jwk-set-uri`. Both
          #       halves of that contrast were wrong, and the correction comes
          #       from running the process rather than from re-reading the API.
          #       NimbusJwtDecoder.withIssuerLocation defers nothing: build()
          #       calls processor(), which calls jwkSource(), which invokes the
          #       supplier that issues
          #       GET <issuer>/.well-known/openid-configuration. A context that
          #       creates a decoder bean therefore attempts that request while it
          #       refreshes, and against this issuer it fails with
          #       UnknownHostException naming the host. That is true of the
          #       auto-configured decoder and of the explicit one
          #       config/SecurityConfig.java now declares.
          #       (3) Trade-offs: the consequence is stated plainly so a test
          #       author is not surprised by it. This value satisfies that class's
          #       fallback-free @Value, so every test that does NOT load a Spring
          #       context runs against the deployed property shape; a test that
          #       DOES load one must register a reachable stub issuer through
          #       dynamic properties, exactly as it already registers the
          #       container-generated datasource triple. Keeping an unreachable
          #       `.invalid` value stays deliberate: RFC 2606 reserves it, so the
          #       failure is immediate and local and no unit test can reach a real
          #       provider.
          #       (4) Assumptions: controller tests use spring-security-test mock
          #       JWTs carrying the carddemo-admin group for writes; reads require
          #       authentication but not that group, and common-lib's
          #       JwtRoleConverter maps cognito:groups to authorities without
          #       decoding anything, so none of them needs the decoder at all.
          #       (5) Trade-offs: this keeps the production resource-server
          #       filter-chain shape but proves no signature validation because no
          #       key material backs the stub issuer. Signature verification
          #       belongs to an environment test with an identity provider.
          issuer-uri: https://issuer.invalid/carddemo-reference-test

# WHY : (1) Assumptions: GET /actuator/health is consumed by both the load
#       balancer target group and the container HEALTHCHECK, and neither caller
#       can present a JWT. The application security chain permits that path;
#       this overlay keeps it exposed and changes no base path. A health probe
#       can report not-ready while V1 and V2 run, and the callers retry until
#       migration completion. (2) Trade-offs: info and prometheus are omitted
#       from test exposure because no test reads them. The narrower surface
#       keeps a context test focused while preserving the unauthenticated health
#       contract that deployment requires.
management:
  endpoints:
    web:
      exposure:
        include: health

# WHY : (1) Trade-offs: framework narration is reduced so one assertion or
#       migration failure remains visible beside an 862-row seed. The project
#       package and Flyway stay at INFO so business decisions and both migration
#       versions remain observable. (2) Trade-offs: SQL statements and bind
#       values remain at WARN. Raising them would provide detailed query traces,
#       but the volume would bury the failing assertion; this rationale is
#       signal-to-noise, not credential protection, because the reference seed
#       contains no credentials.
logging:
  level:
    root: WARN
    com.carddemo: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

carddemo:
  security:
    jwt:
      # WHY : (1) Refactoring Rationale: this sub-block did not exist while the
      #       base profile's three carddemo.security.jwt keys had no reader. They
      #       have one now: config/SecurityConfig.java declares an explicit
      #       JwtDecoder bean and takes all three through @Value, so the values are
      #       consumed by constructor injection rather than by
      #       configuration-property binding. That difference decides whether this
      #       profile needs the sub-block at all. Property binding leaves an
      #       unresolvable placeholder as literal text and does not raise, which is
      #       why the base profile's datasource placeholders can stay unset here;
      #       @Value calls resolveRequiredPlaceholders, which DOES raise, so the
      #       base value ${CARDDEMO_SECURITY_JWT_EXPECTED_CLIENT_ID} aborts bean
      #       creation on any host that does not set that variable - which is every
      #       build host. Without these three lines, every context-loading test in
      #       this module fails before its first assertion.
      #       (2) Assumptions: on this module the checks these values enable guard a
      #       WRITE surface. The transaction-type and category routes accept POST,
      #       PUT, PATCH and DELETE, and config/SecurityConfig.java splits
      #       authorization by METHOD - reads authenticated, writes behind
      #       carddemo-admin - so the authority derived from a token's group claim is
      #       what stands between a caller and the reference data every other bounded
      #       context depends on. A Cognito user pool mints an identity token and an
      #       access token from the same signing key and both validate against the
      #       configured issuer, so the token-use and client checks are what stop the
      #       wrong token kind reaching that authority derivation at all.
      #       (3) Assumptions: this string is NOT a credential and NOT a secret. A
      #       Cognito app client id is a public identifier carried in every token
      #       this service accepts; the value below is additionally fabricated and
      #       visibly non-production, so it identifies nothing that exists. What it
      #       buys is that common-lib's CognitoAccessTokenValidator is CONSTRUCTED
      #       with a non-blank client id - the class treats blank as "skip the client
      #       check" - so a test asserting that a token minted for a different client
      #       of the same pool is rejected has a client to differ from.
      #       (4) Trade-offs: the two adjacent claim values are repeated rather than
      #       inherited so the complete accepted-token contract is readable in one
      #       place. The cost is that a
      #       deliberate change to either in the base profile must be mirrored here
      #       or the suite stops exercising the deployed contract. The two
      #       carddemo.security.cognito group names are NOT repeated, because the
      #       base declares each with the default infra/modules/cognito fixes, both
      #       resolve with no environment at all, and JwtRoleConverter compares them
      #       against its own compiled constants and refuses to start on a mismatch -
      #       so overriding them here would test a vocabulary no deployment uses.
      expected-client-id: reference-test-app-client
      expected-token-use: access
      required-scope: aws.cognito.signin.user.admin



# Register of deliberate omissions -- each one is a value a reasonable
# alternative would have set, and each would change what the test profile proves
# or make it contact infrastructure.
#
#   1. No server.port override.
#      Assumptions: the base value 8080 is shared with the Dockerfile and load
#      balancer contract. Mock MVC and repository tests bind no listener, while
#      a real-port test can use the inherited port or request a random port from
#      its test annotation. Moving the configured port here would change a
#      deployment number without solving a test constraint.
#
#   2. No spring.batch key.
#      Assumptions: spring-boot-starter-batch is absent. COBTUPDT is labelled
#      Business logic and reads INPFILE with ORGANIZATION IS SEQUENTIAL,
#      processing add, update and delete records in one loop before returning.
#      Adding a job repository would create batch tables in a schema this
#      service does not own and would describe a runtime mechanism the module
#      cannot load.
#
#   3. No spring.application.name override.
#      Assumptions: the inherited reference-service name is the service identity
#      used by logging and metrics. Changing it under test would make assertions
#      observe a service tag and application identity that no deployed task
#      carries.
#
#   4. No management.metrics.tags key.
#      Assumptions: common-lib derives the service tag from the inherited
#      application name and reads environment and version from the imported
#      shared defaults. Restating tags here would create a second source whose
#      values could disagree with the meter filter while both configurations
#      remain syntactically valid.
#
#   5. No spring.flyway.clean-disabled override.
#      Assumptions: the base profile already keeps destructive clean disabled.
#      A container is discarded as a whole, and no test calls Flyway clean, so
#      changing the inherited control would add no coverage and could normalize
#      a destructive operation that deployment forbids.
#
#   6. No page-size, page-number or offset property.
#      Alternatives Considered: offset pagination was rejected because inserts
#      before an offset make a subsequent page skip or repeat rows, unlike the
#      baseline's key-ordered browse. Assumptions: list endpoints use
#      common-lib PageResponse keyset paging with items, firstKey, lastKey and
#      hasNext. Page size is a service-layer contract transcribed from the COBOL
#      screen capacity, not an environment setting, so this profile has nothing
#      to tune.
#
#   7. No password-shaped property.
#      Assumptions: identity is external. The baseline stores a clear-text
#      password field; the target auth.users table retains only the external
#      subject reference and does not carry that field. The divergence is
#      documented in docs/architecture/cobol-to-service-traceability.md, so no
#      value exists for this profile to stub.
#
#   8. No cloud-service endpoint, credential, ARN, account identifier or
#      registry hostname, and no queue name or region either.
#      Assumptions: the issuer uses the reserved `.invalid` domain and cannot
#      identify a reachable provider, and nothing else here addresses a network
#      location. Refactoring Rationale: this entry used to describe a static region
#      and three stand-in queue names as routing selectors rather than locations.
#      That defence is no longer needed because those values are withdrawn with the
#      module's queue consumer, and the reason is stronger than the defence was: a
#      module that builds no queue client cannot contact a queue service by
#      misconfiguration. Alternatives Considered: a LocalStack endpoint in this
#      shared profile was rejected then and would be rejected now -- it would make
#      every context depend on an emulator when no test in this module exercises
#      messaging at all.
