  /api/v1/reference/transaction-categories:

    description: >-
      The collection of transaction categories, each belonging to exactly one
      transaction type. A category is identified by the pair of its type code and
      its own four-digit code, which is why the single-category path below
      carries two segments rather than one.

    get:
      tags:
        - reference-data
      operationId: listTransactionCategories
      x-required-authority: carddemo-user
      summary: List transaction categories by key, one page at a time
      description: >-
        Returns one page of transaction categories ordered by type code and then
        by category code, optionally narrowed to a single type. That ordering is
        the baseline's own: the composite key of reference.transaction_categories
        is declared in that column order by db/migration/V1__reference.sql, and
        the baseline index at
        app/app-transaction-type-db2/ddl/XTRNTYCAT.ddl declares the same two
        columns ascending in the same sequence.


        Paging follows the identical keyset discipline as the transaction-type
        list, over the composite key rather than a single column, so a cursor
        from one collection is not interchangeable with a cursor from the other.


        This collection DIFFERS from the transaction-type list in one respect,
        deliberately, and the difference is stated here rather than left to be
        discovered. Both declare the same two filters. But a filter matching no
        row is refused there with 400 and succeeds here with an empty page.


        Assumptions: the refusal on the type list is a transcription of one
        specific baseline paragraph -- the cross-edit at
        app/app-transaction-type-db2/cbl/COTRTLIC.cbl lines 1239 to 1266, which
        sets INPUT-ERROR and flags the filter fields before its cursor opens --
        and that paragraph belongs to the transaction-TYPE list screen. There is
        no baseline list screen for categories to transcribe. The extension tree
        holds two maps, COTRTLI.bms for the type list and COTRTUP.bms for the type
        update, and no program in it browses CARDDEMO.TRANSACTION_TYPE_CATEGORY as
        a list at all: both of COTRTLIC's declared cursors, at lines 339 and 355,
        read CARDDEMO.TRANSACTION_TYPE.


        Alternatives Considered: giving this collection the same refusal so the two
        siblings agree. Rejected because it would INVENT a refusal the baseline
        never performs, on a screen the baseline never had -- a behavioural change
        with no reference to justify it, which transformation rule T9 forbids
        without a documented divergence. Alternatives Considered: dropping the
        refusal from the type list so the two agree the other way. Rejected because
        that paragraph is real, is reached on every filtered browse, and its
        sentence is one a user of that screen saw; removing it would discard
        verbatim behaviour to buy symmetry. Trade-offs: two sibling collections
        therefore answer one condition two ways, which is a genuine cost to a
        caller writing one client for both. It is accepted and published rather
        than smoothed over, because both halves are faithful to what the baseline
        does and does not contain, and the register records the decision as
        D-REFDATA-EMPTY-FILTER in
        docs/architecture/cobol-to-service-traceability.md.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PagingDirection'
        - $ref: '#/components/parameters/TypeCodeFilter'
        - $ref: '#/components/parameters/DescriptionFilter'
      responses:
        '200':
          description: >-
            One page of transaction categories with the two cursor positions and
            the forward availability flag. An empty page is returned when a walk is
            exhausted, when the collection holds no row, AND when a supplied filter
            matches no row -- the last of which the transaction-type list refuses
            with 400 instead, for the reason recorded on this operation.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionCategoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - admin-reference-data
      operationId: createTransactionCategory
      x-required-authority: carddemo-admin
      summary: Create a transaction category under an existing type
      description: >-
        Creates one category beneath an existing transaction type. The type must
        already exist: the foreign key declared by
        db/migration/V1__reference.sql refers to reference.transaction_types, so
        a category naming an absent type is refused with 409 rather than stored
        as an orphan. This is the same rule that refuses the parent's delete,
        seen from the other side -- and the two sides carry DIFFERENT sentences,
        because the baseline composes one per statement rather than one per
        constraint. A refused insert here carries
        'Error inserting record into: TRANSACTION_TYPE_CATEGORY Table. SQLCODE:',
        which is the composition at lines 1607 to 1618 of
        app/app-transaction-type-db2/cbl/COTRTUPC.cbl applied to the table this
        insert names; the parent's refused delete carries the referential
        sentence composed at line 1641 of the same program. A duplicate pair of
        codes carries the same insert sentence as an absent parent, because that
        insert paragraph has one failing arm for every non-zero outcome of the
        statement. Both points are registered as
        D-REFERENCE-INTEGRITY-SENTENCE in
        docs/architecture/cobol-to-service-traceability.md.


        The table named in the sentence is the BASELINE's name for it, taken
        from line 1 of app/app-transaction-type-db2/ddl/TRNTYCAT.ddl, and not
        the migrated reference.transaction_categories. The baseline has no
        screen that inserts a category at all -- every INSERT statement in that
        tree names CARDDEMO.TRANSACTION_TYPE -- so what is carried across
        verbatim is the composition, with the table token it is built around
        supplied by the statement that was refused.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        description: >-
          The type code, the category code and the description of the category
          to create. All three are required, because all three columns are
          declared NOT NULL.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCategoryCreateRequest'
      responses:
        '201':
          description: >-
            The category was created, and the stored representation is returned.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            Location:
              description: >-
                The path of the created category, formed from the two codes
                supplied in the request body.
              required: true
              schema:
                type: string
                examples:
                  - /api/v1/reference/transaction-categories/01/0006
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

