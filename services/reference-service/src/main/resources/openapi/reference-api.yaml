      operationId: getUsPhoneAreaCode
      x-required-authority: carddemo-user
      summary: Test whether one phone area code is accepted
      description: >-
        Returns the area code and its classification when the code is accepted,
        and 404 when it is not. The 404 is the answer rather than a failure:
