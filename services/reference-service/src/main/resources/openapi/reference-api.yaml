# =============================================================================
# services/reference-service/src/main/resources/openapi/reference-api.yaml
# -----------------------------------------------------------------------------
# Purpose: this document is the committed OpenAPI 3.1 contract of record for the
#       CardDemo reference bounded context. It is the artifact every other piece
#       of this context is written against, rather than each of those being
#       written against a fresh reading of the baseline.
#
#       What has landed at this checkpoint, and is therefore already bound by
#       what follows: config/SecurityConfig.java, which enforces by HTTP method
#       the authority each operation below declares, and the two Flyway
#       migrations that own the six tables. Planned and NOT yet authored: every
#       controller, request shape, response shape, entity, repository and mapper
#       of this module, the browser client ui/src/api/reference.ts and the shared
#       types in ui/src/api/types.ts. So no operation below is served yet, and a
#       reader should not expect to find a Java type implementing one -- this
#       document is upstream of that code, not a description of it.
#
#       springdoc serves this exact file: application.yml sets
#       springdoc.swagger-ui.url to /reference-api.yaml and includes
#       classpath:/openapi/ among spring.web.resources.static-locations, so a
#       difference between this document and what the running service does is a
#       defect in whichever one moved, not a variation to reconcile at runtime.
#
#       The context owns the reference schema and its six tables, declared by
#       the sibling db/migration/V1__reference.sql and populated by
#       db/migration/V2__seed_reference.sql: transaction_types,
#       transaction_categories, disclosure_groups, us_phone_area_codes,
#       us_states and us_state_zip_prefixes. Those two migrations are the
#       authoritative statement of column type and seeded content; every schema
#       below mirrors them, and where this document and they disagree, they win.
#
#       The behaviour contracted here carries across four baseline programs. The
#       reference-data browse and inline maintenance screen
#       app/app-transaction-type-db2/cbl/COTRTLIC.cbl and the single-record
#       maintenance screen COTRTUPC.cbl in the same tree supply the transaction
#       type and category operations, their page boundaries and their message
#       text. COBTUPDT.cbl in that tree supplies reference-data maintenance.
#       app/app-vsam-mq/cbl/CODATE01.cbl and app/cbl/CSUTLDTC.cbl supply date
#       evaluation, synchronously here and over a queue for the asynchronous
#       path. app/cbl/CBACT04C.cbl is not migrated into this service -- it is
#       batch-service work -- but it is the READER of the disclosure rate this
#       context publishes, and it is cited below because it is what makes that
#       rate an arithmetic operand rather than a value merely displayed.
#
#       Three baseline mechanisms are gone rather than reproduced. Session state
#       is gone: those screens were pseudo-conversational and carried identity,
#       selection and navigation in a buffer the terminal echoed back, so every
#       operation here takes identity from a signed token and selection from the
#       request path. The four-verb cursor browse becomes one keyset-paginated
#       query per request. And the record before-image the maintenance screen
#       carried across the gap between screen turns becomes one server-owned
#       version token surfaced as HTTP 409.
#
# Structure: the purpose of every top-level block is stated here, in the one
#       place a format with no docstring construct has available, so that each
#       block below carries rationale and nothing else.
#       - servers: a single relative entry, so no host, port or environment name
#         is recorded anywhere in this file.
#       - security: the bearer scheme, applied to every operation by default.
#       - x-authority-model: the machine-readable statement of which authority
#         each operation requires, and where that requirement is enforced.
#       - tags: the three groupings -- authenticated reads, administrative
#         writes, and the date utilities.
#       - paths: the nineteen operations of this context across thirteen paths,
#         ordered as a reader meets the data -- transaction types, then the
#         categories that depend on them, then disclosure rates, then the three
#         address lookups, then date evaluation, then reference-data
#         maintenance.
#       - components.securitySchemes: the single authentication scheme every
#         operation requires.
#       - components.parameters: the path, filter, paging and correlation
#         parameters, declared once and referenced rather than re-typed.
#       - components.headers: the correlation header every response returns.
#       - components.responses: the six error responses shared across
#         operations, so that no operation restates one.
#       - components.schemas: the payload shapes of this context, the five page
#         envelopes, the date evaluation shapes, and the error body every
#         failing operation returns together with its nested shapes.
#
# WHY (non-obvious design decisions):
#       (1) Assumptions: the comment conventions of this file, stated once so
#       that no block below has to. Purpose is stated in this header block,
#       which is the analogue of a docstring for a format that has none, and no
#       statement-level "# WHAT:" comment appears anywhere below. That is not a
#       stylistic preference: the "The `# WHAT:` / `# WHY :` idiom -- prose
#       command blocks only" section of docs/CODE_DOCUMENTATION_STANDARD.md
#       confines the twin form to fenced command blocks in prose and forbids it
#       on a statement in a .yaml file, while recording that a file-header use
#       inside a header block such as this one is correct. Rationale below is
#       carried on lines opening with the comment marker, the word WHY, one
#       space and a colon -- eight characters, so the label width matches the
#       paired form the standard defines -- placed at the indentation of the
#       element they explain and continued at the marker plus seven spaces,
#       numbering multi-reason bodies (1), (2) and so on.
#       Trade-offs: describing every block up here costs a reader
#       one jump from a block back to this header, and buys the removal of a
#       narrating line above every key, which the standard forbids outright.
#
#       (2) Assumptions: exactly four rationale labels appear anywhere in this
#       file -- Alternatives Considered, Refactoring Rationale, Assumptions and
#       Trade-offs -- written in that plural, unparenthesised, colon-terminated
#       form with no emphasis markup, because those are the four the project's
#       Explainability rule enumerates and its validation gate is the sentence a
#       reviewer audits. Elsewhere in this repository the same four categories
#       appear in a different shape -- singular rather than plural, and enclosed
#       in brackets after the WHY marker rather than following it as plain text
#       -- at several hundred sites across the code trees. The two spellings name
#       the same four categories and neither carries a meaning the other does
#       not; this file uses the plural bracket-free form throughout and never
#       mixes them, so that a grep for a label finds every site in this file
#       rather than an arbitrary subset of them. The other form is described here
#       rather than quoted, so that searching this file for a label returns only
#       real label uses.
#
#       (3) Alternatives Considered: OpenAPI 3.1.0 rather than 3.0.x, and this
#       choice is load-bearing rather than a preference for the higher number.
#       3.1 adopts JSON Schema as its schema dialect, which is what allows a
#       monetary or rate value to be declared "type: string" and constrained by
#       "pattern" in the same schema object, and allows absence to be declared
#       as "type: 'null'" inside a "oneOf" rather than through a "nullable"
#       keyword. Under 3.0 the money-as-string constraint of decision (4) below
#       could not be expressed as a schema at all: 3.0's subset has no way to
#       pair a numeric format constraint with a string type, so the rule would
#       have degraded into prose that no generator or validator reads, and a
#       generated client would have been free to emit a JSON number. 3.0 also
#       lacks "type: 'null'", so every absent cursor would have needed the
#       "nullable" extension keyword, which JSON Schema does not define and
#       which some validators ignore. springdoc is configured to match, at
#       springdoc.api-docs.version openapi_3_1 in application.yml, so the
#       served document and this one declare the same dialect.
#
#       (4) Assumptions: every path below sits under /api/v1/reference, and that
#       prefix is not chosen here -- it is the only one reachable on the
#       provisioned environment. The load balancer publishes exactly
#       ["/api/v1/reference", "/api/v1/reference/*"] for this service, at
#       infra/envs/dev/main.tf line 119 and infra/envs/prod/main.tf line 119,
#       and the edge declares the matching route keys "ANY /api/v1/reference"
#       and "ANY /api/v1/reference/{proxy+}" at
#       infra/modules/api-gateway-http/variables.tf lines 385 to 386. Publishing
#       any other prefix would produce a contract whose operations answer
#       nowhere, which the acceptance criterion that the business flows work end
#       to end on the provisioned environment does not permit.
#
#       (5) Assumptions: this document declares no /actuator path. Health, info
#       and prometheus are exposed operationally, by
#       management.endpoints.web.exposure.include in application.yml, and are
#       consumed by the load-balancer target group and the container health
#       check rather than by an API client. Declaring them here would publish an
#       operational surface as though it were part of the business contract, and
#       would put the one unauthenticated path of this service -- the health
#       path and everything beneath it, whose matcher SecurityConfig.java
#       declares at its line 64 and permits at line 98 -- into a document whose
#       every declared operation requires a token.
# =============================================================================

openapi: 3.1.0

info:
  title: CardDemo Reference Service API
  version: 1.0.0
  summary: >-
    Reference data of the migrated CardDemo credit-card management application:
    transaction types and their categories, disclosure-group interest rates, the
    three United States address lookups, and date evaluation.
  description: >-
    The reference context owns the data every other context reads and none of
    them writes. It publishes nineteen operations, across thirteen paths, over
    six tables.


    Transaction types and transaction categories are maintained here, and the
    relationship between them is the one referential rule the baseline states
    anywhere in this domain: a category references its type, and the type cannot
    be deleted while a category still references it. That refusal is a
    first-class user outcome in the baseline rather than a fault, and it is
    reported here as 409 for the reason recorded on the Conflict response.


    Disclosure-group rows carry the interest rate the nightly interest
    calculation consumes. That rate is an arithmetic operand, not a display
    value, so it is transported as a JSON string for the reason recorded on the
    InterestRate schema, and the lookup operation documents the DEFAULT-group
    fallback the baseline performs when an account's own group has no matching
    row.


    The three address lookups -- phone area codes, state codes and state and
    postal-prefix combinations -- are seeded here and read from here, but they
    are validated elsewhere: account-service queries them during account
    maintenance. This context therefore exposes them for reading and offers no
    operation that writes them.


    Date evaluation is published twice over, and neither publication replaces
    the other. A synchronous operation evaluates a date against a mask and
    returns the structured verdict. A separate asynchronous contract, described
    on the AsyncDateReplyContract schema, carries the same evaluation over a
    queue and answers in a 1000-byte positional buffer, because that is the
    reply shape the baseline's queue consumers already parse.


    Identifiers and codes travel as strings throughout, never as JSON numbers,
    and every code retains the declared width of the column behind it. The
    reasoning is recorded once on the TransactionCategoryCode schema, where a
    copybook and a set of table definitions genuinely disagree about the type of
    one field.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

# WHY : Assumptions: one relative server entry, and deliberately no absolute
#       URL. The same document is served from the development and production
#       environments and from a developer's own machine, and every path below is
#       appended to whatever origin served it. Recording a host here would name
#       one environment inside an artifact committed to source control, and
#       would go stale the moment a distribution or load-balancer address
#       changed -- while a relative entry cannot go stale because it names
#       nothing.
servers:
  - url: /
    description: >-
      The origin that served this document. Every path below is appended to it
      unchanged, so no host, port, environment name or account identifier is
      recorded in this file.

# WHY : Assumptions: authorization is asserted once at the document level and
#       inherited by every operation, rather than repeated on each one with the
#       risk that a single omission passes review unnoticed. There is no
#       unauthenticated operation in this context: SecurityConfig.java permits
#       only the health path and what lies beneath it without a token, at its
#       line 98, and closes with anyRequest().authenticated() at line 107. No
#       operation below
#       overrides this with an empty requirement, and none may be added that
#       does -- a bearer requirement missing from one operation is invisible in
#       review, whereas a document-level requirement has to be explicitly
#       overridden to be lost.
security:
  - bearerAuth: []

# WHY : Refactoring Rationale: the authority each operation requires is declared
#       as a machine-readable field on the operation itself, and not only in
#       prose and tag membership. Prose and tag membership are not checkable: a
#       reviewer can read that a write is administrative, and a generator or a
#       gateway cannot, so the restriction would be indistinguishable from any
#       other authenticated route. Every operation below carries
#       x-required-authority.
# WHY : Assumptions: the value on each operation is not chosen here. It is
#       derived from what SecurityConfig.java already enforces for this service:
#       POST, PUT, PATCH and DELETE on every path each require
#       JwtRoleConverter.ADMIN_AUTHORITY, at its lines 99 to 106, and every
#       remaining request needs only authentication, at line 107. So every write
#       below carries carddemo-admin and every read carries carddemo-user, and
#       the document describes the filter chain rather than a second opinion
#       about it. The two admitted values are exactly the two the shared token
#       converter recognises, ADMIN_AUTHORITY and USER_AUTHORITY at
#       services/common-lib/src/main/java/com/carddemo/common/security/JwtRoleConverter.java
#       lines 250 and 260, which are the migrated form of the two SEC-USR-TYPE
#       values 'A' and 'U'.
# WHY : Alternatives Considered: expressing the authority as a security-scheme
#       scope, by writing a populated scope list beside bearerAuth on the
#       administrative operations. Rejected because the specification requires
#       that list to be empty for a scheme that is not oauth2 or openIdConnect,
#       and this scheme is type http, so a populated list there is invalid and a
#       validating tool would either reject it or ignore it. Re-declaring the
#       scheme as oauth2 purely to gain a scope list was rejected in turn,
#       because these values are Cognito group names carried in a cognito:groups
#       claim rather than OAuth scopes, and publishing them as scopes would
#       state something untrue about how the token is issued.
x-authority-model:
  field: x-required-authority
  values:
    - carddemo-user
    - carddemo-admin
  enforcedBy: >-
    services/reference-service/src/main/java/com/carddemo/reference/config/SecurityConfig.java
  claim: cognito:groups
  convertedBy: >-
    services/common-lib/src/main/java/com/carddemo/common/security/JwtRoleConverter.java

tags:
  - name: reference-data
    description: >-
      Reading reference data. Any authenticated caller may reach these
      operations, because every user of this system holds one of the two groups
      and reference data carries no cardholder-identifying value. Each operation
      in this group carries x-required-authority carddemo-user.
  - name: admin-reference-data
    description: >-
      Creating, replacing and deleting reference data. Restricted to callers
      holding the administrative authority, matching the baseline arrangement in
      which reference-data maintenance is reached from the administrative menu
      rather than the main one. Each operation in this group carries
      x-required-authority carddemo-admin.
  - name: date-utilities
    description: >-
      Evaluating a date against a mask. These are side-effect-free evaluations
      rather than data operations, and they read no table, which is why they are
      published as reads available to any authenticated caller. Each operation
      in this group carries x-required-authority carddemo-user.

paths:

  /api/v1/reference/transaction-types:

    description: >-
      The collection of transaction types, addressable as a key-ordered sequence
      of pages and as the place a new type is created. A type is the parent of
      the categories beneath it, which is why it is the first collection in this
      document and why its delete operation can be refused.

    get:
      tags:
        - reference-data
      operationId: listTransactionTypes
      x-required-authority: carddemo-user
      summary: List transaction types by key, one page at a time
      description: >-
        Returns one page of transaction types in ascending type-code order,
        optionally narrowed by a type-code filter, a description filter or both.
        This is the migrated form of the browse the baseline drives with a pair
        of declared cursors at app/app-transaction-type-db2/cbl/COTRTLIC.cbl
        lines 338 to 368, and it preserves those cursors' page boundaries
        exactly, including the difference in strictness between reading forward
        and reading backward that is set out on the cursor parameter.


        Paging is by key and never by ordinal. Send no cursor to obtain the
        opening page; thereafter copy lastKey from the page in hand and send
        direction next to advance, or copy firstKey and send direction previous
        to retreat. When the filters exclude every row the page is empty and
        both cursors are null, which the baseline reports with the message text
        recorded on the TransactionTypePage schema.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PagingDirection'
        - $ref: '#/components/parameters/TypeCodeFilter'
        - $ref: '#/components/parameters/DescriptionFilter'
      responses:
        '200':
          description: >-
            One page of transaction types, together with the two cursor
            positions and the forward availability flag needed to walk the set.
            An empty page is a success rather than a 404: a collection with no
            matching row exists and is empty, and the baseline reports the same
            condition on its own list screen rather than as a failure.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionTypePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - admin-reference-data
      operationId: createTransactionType
      x-required-authority: carddemo-admin
      summary: Create a transaction type
      description: >-
        Creates one transaction type from a supplied code and description. This
        is the migrated form of the add path of
        app/app-transaction-type-db2/cbl/COTRTUPC.cbl, whose screen prompts for
        the new details at its line 158 and asks for a confirming key press at
        line 150 before writing.


        The code is supplied by the caller rather than generated, because it is
        a meaningful two-digit business code that appears in stored transaction
        records and in the concatenated category key, not a surrogate. Creating
        a code that already exists is refused with 409 rather than silently
        replacing the existing row.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        description: >-
          The code and description of the type to create. Both are required:
          the description column is declared NOT NULL by
          db/migration/V1__reference.sql, so there is no state in which a type
          exists without one.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionTypeCreateRequest'
      responses:
        '201':
          description: >-
            The type was created, and the stored representation is returned so
            that a caller sees the row as it now stands rather than assuming its
            own request body was stored unchanged.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            Location:
              description: >-
                The path of the created type, formed from the code supplied in
                the request body.
              required: true
              schema:
                type: string
                examples:
                  - /api/v1/reference/transaction-types/08
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            A type already exists with the supplied code. The primary key
            declared by db/migration/V1__reference.sql refuses the duplicate,
            PostgreSQL reports SQLSTATE 23505, and the shared advice inherited
            from common-lib turns that into this status.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/reference/transaction-types/{typeCd}:

    description: >-
      One transaction type, addressed by its own two-digit code. The code is the
      primary key of reference.transaction_types and appears in the path
      directly, because it is a business code a user reads off a screen and
      types back in rather than an internal identifier that has to be concealed.

    parameters:
      - $ref: '#/components/parameters/TypeCdPath'

    get:
      tags:
        - reference-data
      operationId: getTransactionType
      x-required-authority: carddemo-user
      summary: Read one transaction type
      description: >-
        Returns the transaction type stored under the supplied code, together
        with the version token a subsequent replace must carry. This is the
        migrated form of the single-record fetch
        app/app-transaction-type-db2/cbl/COTRTUPC.cbl performs before it
        displays a record for maintenance.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: >-
            The stored transaction type, including its version token.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - admin-reference-data
      operationId: replaceTransactionType
      x-required-authority: carddemo-admin
      summary: Replace the description of one transaction type
      description: >-
        Replaces the description of an existing type. The code itself is not
        replaceable: it is the primary key and the value the category key is
        built from, so changing it would orphan every category beneath it. A
        caller that needs a different code creates a new type and deletes the
        old one, which is exactly what the baseline requires of a user too.


        The request must carry the version token read with the record. When the
        stored row has moved on since that read the write is refused with 409
        and the baseline's own wording, which is the migrated form of the
        before-image comparison the maintenance screen performs across the gap
        between screen turns -- see the Conflict response.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        description: >-
          The replacement description together with the version token read with
          the record.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionTypeReplaceRequest'
      responses:
        '200':
          description: >-
            The type was replaced, and the stored representation is returned
            carrying its new version token, so that a caller can issue a further
            replace without re-reading.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - admin-reference-data
      operationId: deleteTransactionType
      x-required-authority: carddemo-admin
      summary: Delete one transaction type, unless categories still reference it
      description: >-
        Deletes the type stored under the supplied code. The delete is refused
        with 409, and no row is removed, while any transaction category still
        references the type. That refusal is the single load-bearing rule of
        this context and it is not an incidental integrity error -- see the
        Conflict response, which carries the baseline's own wording for it.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '204':
          description: >-
            The type was deleted. No body is returned, because the resource the
            caller addressed no longer exists and there is nothing to represent.
            The baseline reports the same outcome on its screens with the
            wording recorded on the ReferenceMessageCatalogue schema.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /api/v1/reference/transaction-categories:

    description: >-
      The collection of transaction categories, each belonging to exactly one
      transaction type. A category is identified by the pair of its type code and
      its own four-digit code, which is why the single-category path below
      carries two segments rather than one.

    get:
      tags:
        - reference-data
      operationId: listTransactionCategories
      x-required-authority: carddemo-user
      summary: List transaction categories by key, one page at a time
      description: >-
        Returns one page of transaction categories ordered by type code and then
        by category code, optionally narrowed to a single type. That ordering is
        the baseline's own: the composite key of reference.transaction_categories
        is declared in that column order by db/migration/V1__reference.sql, and
        the baseline index at
        app/app-transaction-type-db2/ddl/XTRNTYCAT.ddl declares the same two
        columns ascending in the same sequence.


        Paging follows the identical keyset discipline as the transaction-type
        list, over the composite key rather than a single column, so a cursor
        from one collection is not interchangeable with a cursor from the other.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PagingDirection'
        - $ref: '#/components/parameters/TypeCodeFilter'
        - $ref: '#/components/parameters/DescriptionFilter'
      responses:
        '200':
          description: >-
            One page of transaction categories with the two cursor positions and
            the forward availability flag.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionCategoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - admin-reference-data
      operationId: createTransactionCategory
      x-required-authority: carddemo-admin
      summary: Create a transaction category under an existing type
      description: >-
        Creates one category beneath an existing transaction type. The type must
        already exist: the foreign key declared by
        db/migration/V1__reference.sql refers to reference.transaction_types, so
        a category naming an absent type is refused with 409 rather than stored
        as an orphan. This is the same rule that refuses the parent's delete,
        seen from the other side.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        description: >-
          The type code, the category code and the description of the category
          to create. All three are required, because all three columns are
          declared NOT NULL.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCategoryCreateRequest'
      responses:
        '201':
          description: >-
            The category was created, and the stored representation is returned.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
            Location:
              description: >-
                The path of the created category, formed from the two codes
                supplied in the request body.
              required: true
              schema:
                type: string
                examples:
                  - /api/v1/reference/transaction-categories/01/0006
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            Either a category already exists under the supplied pair of codes,
            or the transaction type named does not exist. The two are
            distinguished by the subordinate code in the body and never merged:
            the first is a duplicate key reported by PostgreSQL as SQLSTATE
            23505, the second a foreign-key violation reported as SQLSTATE
            23503, and a caller acts differently on each -- the first by
            choosing another code, the second by creating the type first.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/reference/transaction-categories/{typeCd}/{catCd}:

    description: >-
      One transaction category, addressed by the pair of codes that forms its
      composite key. Both segments are present because neither alone identifies
      a row: the same four-digit category code recurs under different types, and
      the baseline builds its key by positional concatenation of the two, which
      is why the seed extract app/data/ASCII/trancatg.txt stores the pair as the
      single six-character value "010001".

    parameters:
      - $ref: '#/components/parameters/TypeCdPath'
      - $ref: '#/components/parameters/CatCdPath'

    get:
      tags:
        - reference-data
      operationId: getTransactionCategory
      x-required-authority: carddemo-user
      summary: Read one transaction category
      description: >-
        Returns the category stored under the supplied pair of codes, together
        with the version token a subsequent replace must carry.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: >-
            The stored transaction category, including its version token.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - admin-reference-data
      operationId: replaceTransactionCategory
      x-required-authority: carddemo-admin
      summary: Replace the description of one transaction category
      description: >-
        Replaces the description of an existing category. Neither code is
        replaceable, for the same reason the type code is not: together they are
        the primary key. The request must carry the version token read with the
        record, and a stored row that has moved on since that read is reported as
        409 with the baseline's own wording.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        description: >-
          The replacement description together with the version token read with
          the record.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCategoryReplaceRequest'
      responses:
        '200':
          description: >-
            The category was replaced, and the stored representation is returned
            carrying its new version token.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - admin-reference-data
      operationId: deleteTransactionCategory
      x-required-authority: carddemo-admin
      summary: Delete one transaction category
      description: >-
        Deletes the category stored under the supplied pair of codes. Nothing
        references a category, so this delete is not refused on referential
        grounds the way a type's delete can be: no table in the reference schema
        declares a foreign key to reference.transaction_categories, and
        db/migration/V1__reference.sql records why -- the disclosure-group table
        carries the same type and category columns but the baseline states no
        relationship between them, so none is asserted.


        Deleting a category that no longer exists is reported as 404 rather than
        as success, so that a caller can distinguish having removed the row from
        never having found it.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '204':
          description: >-
            The category was deleted. No body is returned.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /api/v1/reference/disclosure-groups/{acctGroupId}/{tranTypeCd}/{tranCatCd}:

    description: >-
      One disclosure-group interest rate, addressed by the three-part key that
      identifies it: the account group, the transaction type and the transaction
      category. All three segments are required because all three form the
      primary key of reference.disclosure_groups, which
      db/migration/V1__reference.sql declares in that order.

    parameters:
      - $ref: '#/components/parameters/AcctGroupIdPath'
      - $ref: '#/components/parameters/TranTypeCdPath'
      - $ref: '#/components/parameters/TranCatCdPath'

    get:
      tags:
        - reference-data
      operationId: getDisclosureGroupRate
      x-required-authority: carddemo-user
      summary: Look up an interest rate, falling back to the DEFAULT group
      description: >-
        Returns the interest rate that applies to the supplied combination of
        account group, transaction type and transaction category.


        The lookup has two stages, and the second is part of the contract rather
        than an implementation detail. When no row exists for the account group
        supplied, the lookup is retried against the account group DEFAULT and the
        rate found there is returned. This reproduces
        app/cbl/CBACT04C.cbl, which on a lookup miss -- file status 23 at its
        line 436 -- moves the literal 'DEFAULT' into the group-id field at line
        437 and re-reads through the paragraph at line 443. The response states
        which of the two stages answered, in its appliedAcctGroupId and
        defaultGroupApplied members, so a caller is never left inferring whether
        the rate it received was the one it asked for.


        The fallback rows are seeded and are not optional. There are seventeen of
        them, inserted by db/migration/V2__seed_reference.sql, and they are
        carried across from app/data/ASCII/discgrp.txt, in which exactly
        seventeen of the fifty-one rows begin with the account group 'DEFAULT'
        followed by three spaces to fill the ten-character column. When the
        fallback itself finds nothing the baseline does not continue: it reports
        the condition at line 455 and abends through the paragraph invoked at
        line 458. The migrated form of that outcome is 404 carrying the abend
        detail described on the AbendDetail schema, because an absent DEFAULT row
        is a defect in the seeded reference data rather than a request a caller
        can correct.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: >-
            The applicable rate, together with the account group that actually
            supplied it. A caller that asked for a group with no row of its own
            receives the DEFAULT group's rate here with defaultGroupApplied
            true, which is a success and not a partial answer.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclosureGroupRate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            Neither the account group supplied nor the DEFAULT group has a row
            for this transaction type and category. This is the condition the
            baseline treats as unrecoverable at app/cbl/CBACT04C.cbl lines 455
            and 458, so the body carries abend detail alongside the ordinary
            error members, naming the seeded reference data as the subject rather
            than the caller's request.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'

