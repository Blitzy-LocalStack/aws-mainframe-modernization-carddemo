    UsStateZipPrefixPage:
      type: object
      description: >-
        One page of accepted state and postal-prefix combinations in ascending
        order. Two hundred and forty are seeded in total.
      required:
        - items
        - firstKey
        - lastKey
        - hasNext
      additionalProperties: false
      properties:
        # WHY : Assumptions: the upper bound is declared on the ARRAY and not left as
        #       prose above it, and it is the value AddressLookupService.PAGE_SIZE
        #       carries -- twenty, as on UsPhoneAreaCodePage, and for the reason recorded there.
        #       A page carrying one row more would be a defect in this service, which
        #       is worth failing a contract check rather than reaching a client that
        #       had sized its rendering for the published bound. No lower bound is
        #       declared: an empty page is legitimate for an exhausted set and for a
        #       filter that removed every row it read.
        items:
          type: array
          maxItems: 20
          description: >-
            The combinations of this page, in ascending order. Empty, never null,
            when the set is exhausted.
          items:
            $ref: '#/components/schemas/UsStateZipPrefix'
        firstKey:
          oneOf:
