      x-required-authority: carddemo-admin
      summary: Delete one transaction category
      description: >-
        Deletes the category stored under the supplied pair of codes. Nothing
        references a category, so this delete is not refused on referential
        grounds the way a type's delete can be: no table in the reference schema
        declares a foreign key to reference.transaction_categories, and
        db/migration/V1__reference.sql records why -- the disclosure-group table
        carries the same type and category columns but the baseline states no
        relationship between them, so none is asserted.


        Deleting a category that no longer exists is reported as 404 rather than
        as success, so that a caller can distinguish having removed the row from
        never having found it.


        This operation can still answer 409, and the reason is narrower than for a
        type's delete: the referential condition cannot arise here, but the
        pessimistic-lock condition can arise on any write, so the shared Conflict
        response is declared and its lock sentence is the one this operation can
        return.
