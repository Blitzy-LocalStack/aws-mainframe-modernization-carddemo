            - type: 'null'
          description: >-
            The backward paging position, or null when items is empty.
        lastKey:
          oneOf:
            - $ref: '#/components/schemas/CursorToken'
            - type: 'null'
          description: >-
            The forward paging position, or null when items is empty.
        hasNext:
          type: boolean
          description: >-
            Whether a further page of combinations follows. Settled on a forward walk by
            reading one row beyond the page; always true on a page reached by paging
            backward, as recorded in full on the transaction-type page.

      examples:
        - items:
            - stateZipCd: AL35
          firstKey: v2.dXMtc3RhdGUtemlw.REDACTED-EXAMPLE-CIPHERTEXT-not-decipherable-F
          lastKey: v2.dXMtc3RhdGUtemlw.REDACTED-EXAMPLE-CIPHERTEXT-not-decipherable-L
          hasNext: true


    # WHY : Assumptions: the mask is a genuine PARAMETER rather than a constant,
    #       and that is inherited from the baseline rather than introduced. The
    #       date utility app/cbl/CSUTLDTC.cbl receives the mask as its second
    #       argument, declared beside the date at its lines 84 to 86 and taken in
    #       at line 88, and hands it to the platform date service through the
    #       invocation at lines 116 to 120. A service that hard-coded one mask
    #       could not be the migrated form of a utility whose caller chooses one.
    # WHY : Assumptions: a mask parameter exists at all because the baseline
    #       carries TWO INCOMPATIBLE ten-character date shapes, and neither is
    #       privileged over the other. app/app-vsam-mq/cbl/CODATE01.cbl formats
    #       its system date through the platform call at its lines 347 to 353,
    #       requesting the month-day-year ordering at line 349 with a hyphen
    #       separator at line 350, which yields a US-ordered value in the
    #       ten-character field declared at its line 37. The reference-data
    #       maintenance screen
    #       app/app-transaction-type-db2/cbl/COTRTUPC.cbl instead slices its own
    #       ten-character field year-first, through the redefinition at its lines
    #       108 to 114. The same width carries two different orderings, so a value
    #       moved between the two without conversion would be misread rather than
    #       rejected -- which is the whole reason date conversion is a published
    #       operation in this context.
    # WHY : Assumptions: the two RECOGNISED values are exactly the two the shared
    #       validator publishes, and are not chosen here. They are DATE_FORMAT_MASK
    #       and BASELINE_DATE_FORMAT_MASK at
    #       services/common-lib/src/main/java/com/carddemo/common/validation/DateEditValidator.java
    #       lines 627 and 635. Admitting a third here -- the US ordering above, for
    #       instance -- would document a request that validator answers as an
    #       unusable pattern, so the contract would promise a conversion the
    #       migrated system does not perform. The US ordering is not lost: it
    #       survives as the rendering of the asynchronous reply, described on the
    #       AsyncDateReplyContract schema.
    # WHY : Refactoring Rationale: the mask a caller SENDS is now a bounded string
    #       with no enumeration, and the enumeration below names only the masks the
    #       service recognises. An earlier revision used one enumerated schema for
    #       both and then promised, on that same schema and on the mask parameter,
    #       that an unrecognised mask would be answered with 200 carrying the
    #       unusable-pattern verdict. It could not be: a request validator refuses a
    #       value outside an enum before any handler runs, so the promised 200 was
    #       unreachable and the one outcome the baseline defines for a bad pattern
    #       could never be observed. The shared validator does produce it --
    #       DateEditValidator declares BAD_PIC_STRING with severity 3 and message
    #       number 2518 and documents it as what an unrecognised mask YIELDS rather
    #       than raises -- so the contract was describing a capability it then
    #       blocked.
    # WHY : Assumptions: ten characters is the bound, and it is the baseline's own.
    #       app/cbl/CSUTLDTC.cbl declares its mask argument LS-DATE-FORMAT PIC X(10)
    #       at line 85 and echoes it back through WS-DATE-FMT PIC X(10) at line 55,
    #       so ten characters is what the platform date service can be handed and
    #       what a result can carry. No character restriction is added, because the
    #       field has none and because the whole point of the bad-pattern verdict is
    #       that the service is handed a pattern it may not understand.
    # WHY : Alternatives Considered: keeping the enum and answering an unrecognised
    #       mask with 400, deleting the unreachable promise instead. Rejected because
    #       the baseline treats a bad pattern as FEEDBACK on an evaluation that ran,
    #       with its own feedback code, severity and message number, and a caller
    #       that evaluates many dates reads one verdict shape for all of them.
    #       Turning one of the ten declared outcomes into a transport error would
    #       have removed an outcome the baseline defines rather than fixed the
    #       contradiction.
    DateMaskInput:
      type: string
      minLength: 1
      maxLength: 10
      default: YYYY-MM-DD
      description: >-
        The mask describing a date text, as SUBMITTED. Up to ten characters, which is
        the declared width of the mask argument the baseline date service takes at
        app/cbl/CSUTLDTC.cbl line 85, and no character is excluded. Two masks are
        recognised and are named on the DateMask schema; the date sent with a
        recognised mask must be that mask's width, and a width that does not match is
        a request error. A mask outside the recognised set is NOT a request error: it
        is answered with 200 carrying the unusable-pattern verdict, because the
        baseline declares a feedback condition for exactly that case at
        app/cbl/CSUTLDTC.cbl line 68 and returns it like any other feedback.
      examples:
        - YYYY-MM-DD
        - YYYYMMDD
        - DD/MM/YYYY

    # WHY : Assumptions: the recognised set is published as a plain enum on a schema that
    #       is the type of NOTHING. Nothing $refs this schema -- the submitted mask and the
    #       echoed mask both reference DateMaskInput -- so the enum constrains no request
    #       and cannot make the unusable-pattern verdict unreachable, which is the failure
    #       the wider DateMaskInput above exists to avoid. What it does buy is that the two
    #       recognised masks reach a generated client and a rendered document, which is this
    #       schema's only purpose.
    # WHY : Alternatives Considered: carrying the set as an x-recognised-masks vendor
    #       extension beside a bounded string, so that no future edit could $ref this schema
    #       into a request position and re-block the verdict. Rejected because an extension
    #       is invisible to every generator and validator, so it would hide the one fact this
    #       schema exists to state in order to guard against a change nothing has made; the
    #       guard belongs in the contract test, which asserts that the echoed mask references
    #       DateMaskInput and not this schema.
    # WHY : Refactoring Rationale: DD/MM/YYYY has been REMOVED from the examples here. With
    #       the enum present it was an example that violated its own schema, which is what
    #       prompted a revision that dropped the enum rather than the example. It is not lost:
    #       DateMaskInput carries it, and that is where it belongs, because the point of that
    #       mask is that it is admissible as INPUT and is not recognised.
    DateMask:
      type: string
      enum:
        - YYYY-MM-DD
        - YYYYMMDD
      description: >-
        The masks this service RECOGNISES, published so that a caller can send one
        it knows will be interpreted. The separated form is ten characters and
        requires a hyphen at each separator position; the unseparated form is eight
        characters of digits. This schema is not the type of the mask a caller sends
        -- that is DateMaskInput, which is deliberately wider so that the
        unusable-pattern verdict stays reachable.
      examples:
        - YYYY-MM-DD
        - YYYYMMDD

    DateFeedbackCode:
      type: string
      enum:
        - INVALID_DATE
        - INSUFFICIENT_DATA
        - BAD_DATE_VALUE
        - INVALID_ERA
        - UNSUPP_RANGE
        - INVALID_MONTH
        - BAD_PIC_STRING
        - NON_NUMERIC_DATA
        - YEAR_IN_ERA_ZERO
        - OTHER
      description: >-
        The outcome of a date evaluation, named as the baseline names it.


        There is a trap in the first value and it is the baseline's own, carried
        across unaltered: INVALID_DATE is the ACCEPTING outcome. It corresponds to
        the all-zero feedback the platform date service returns when a date is
        usable, and its severity is zero, but the condition name the baseline
        attaches to that feedback reads as though it meant the opposite. Read the
        severity, or read the verdict text, and never read acceptance off this
        name. The naming is preserved rather than improved so that this contract,
        the shared validator and the baseline all use one vocabulary. The hazard is
        recorded here and on the shared validator's own verdict type, and NOT in the
        migration's divergence register, which holds only places the target behaves
        differently from the baseline: preserving this name is parity rather than a
        divergence, so an entry there would assert a difference that does not exist.


        OTHER is declared because the shared validator declares it, but this
        operation does not report it: it arises only where a coarser stand-in
        returns feedback matching none of the nine real outcomes.
      examples:
        - INVALID_DATE
        - INVALID_MONTH

    DateEvaluationResult:
      type: object
      description: >-
        The structured verdict of one date evaluation. Its five members are the
        five variable fields of the eighty-character result
        app/cbl/CSUTLDTC.cbl returns, which that program declares at its lines 42
        to 55 interleaved with constant labels at lines 45, 51 and 54; the labels
        are not reproduced, because they are presentation for a positionally
        addressed field rather than data. The submitted date and mask are echoed
        back so that
        a verdict remains interpretable after it has been logged away from the
        request that produced it.
      required:
        - feedbackCode
        - severity
        - messageNumber
        - verdict
        - date
        - mask
      additionalProperties: false
      properties:
        feedbackCode:
          allOf:
            - $ref: '#/components/schemas/DateFeedbackCode'
          description: >-
            Which outcome the evaluation reached. Note the naming trap recorded on
            that schema before branching on this value.
        severity:
          type: integer
          format: int32
          description: >-
            Zero when the date was accepted, three when it was rejected, and twelve
            for feedback the shared validator does not recognise. These three
            values are the baseline's own severity ladder, published as
            SEVERITY_VALID, SEVERITY_ERROR and SEVERITY_UNRECOGNISED at
            DateEditValidator.java lines 651 to 653. This is the member to branch
            on: zero means usable and anything else means not.
          examples:
            - 0
            - 3
        messageNumber:
          type: integer
          format: int32
          description: >-
            The message number the platform date service reported, zero when the
            date was accepted. The rejecting numbers run from 2507 to 2521 and each
            pairs with exactly one feedback code, so this member and feedbackCode
            never disagree.
          examples:
            - 0
            - 2517
        verdict:
          type: string
          maxLength: 15
          description: >-
            The verdict text for this outcome, as the baseline words it -- for
            example the accepting outcome's own wording, or a named reason for a
            rejection. Fifteen characters is the declared width of the field the
            baseline carries it in, at app/cbl/CSUTLDTC.cbl line 49, so the longer
            texts occupy it exactly and the shorter ones are returned without the
            padding that field would hold.
          examples:
            - Date is valid
            - Invalid month
        date:
          type: string
          minLength: 8
          maxLength: 10
          description: >-
            The date text submitted, echoed back unchanged, matching the field the
            baseline echoes at app/cbl/CSUTLDTC.cbl line 52.
          examples:
            - '2022-07-18'
        mask:
          allOf:
            - $ref: '#/components/schemas/DateMaskInput'
          description: >-
            The mask the evaluation used, echoed back so that a caller which
            omitted it learns which default applied. It matches the field the
            baseline echoes at app/cbl/CSUTLDTC.cbl line 55. It is typed as the
            submitted form rather than as the recognised enumeration, because a mask
            the service could not interpret is echoed here beside the
            unusable-pattern verdict that reports it -- typing it as the enumeration
            would have made that verdict's own result body invalid.
      examples:
        - feedbackCode: INVALID_DATE
          severity: 0
          messageNumber: 0
          verdict: Date is valid
          date: '2022-07-18'
          mask: YYYY-MM-DD
        - feedbackCode: INVALID_MONTH
          severity: 3
          messageNumber: 2517
          verdict: Invalid month
          date: '2022-13-18'
          mask: YYYY-MM-DD

    # WHY : Assumptions: this schema DOCUMENTS a message contract rather than
    #       declaring an HTTP payload, and it is published alongside the
    #       synchronous operation above rather than instead of it, because the
    #       baseline offers both and retiring either would strand a caller.
    #       app/app-vsam-mq/cbl/CODATE01.cbl answers over a queue, and the
    #       consumers already written against it parse a positional buffer of a
    #       known width; the browser client needs JSON over HTTP. The two carry the
    #       same evaluation and neither is derived from the other.
    # WHY : Assumptions: the width is one thousand bytes and never varies.
    #       CODATE01.cbl declares its reply buffer at that width on its line 107,
    #       alongside three sibling buffers of the same width at lines 105, 106 and
    #       108, and on replying it moves the buffer and then states the length as
    #       a literal thousand, at lines 371 and 372 -- so the length is a constant
    #       of the contract rather than the length of the text placed in it. A
    #       consumer reads a thousand bytes and finds the content left-justified
    #       with the remainder blank.
    # WHY : Trade-offs: publishing a positional layout in a JSON contract document
    #       describes something no operation here returns, which costs a reader the
    #       moment it takes to see that this schema is documentation. It is
    #       accepted because the alternative -- describing this contract only in
    #       prose elsewhere -- is what allows a wire format and its consumers to
    #       drift apart, and the two verbatim prefixes below are exactly the kind
    #       of detail that drifts silently.
    AsyncDateReplyContract:
      type: object
      description: >-
        The asynchronous system-date reply, carried over a standard queue rather
        than over HTTP, described here so that the one wire format has one written
        definition. It is not the body of any operation in this document.


        The reply is a single one-thousand-byte positional buffer. Its content is
        two labelled values concatenated in order and left-justified, with the
        remainder of the buffer blank: the date, prefixed by the text given on
        datePrefix below, then the time, prefixed by the text given on timePrefix.
        Both prefixes end in a space and both are reproduced character for
        character from app/app-vsam-mq/cbl/CODATE01.cbl lines 355 and 356, where
        the program concatenates them with its formatted values.


        The date value is rendered month-first with hyphen separators, because that
        is what the platform call at that program's lines 347 to 353 produces --
        the month-day-year request at line 349 with the separator at line 350 --
        and the time value is the eight-character field declared at its line 38.
        This is the one place the US ordering survives in the migrated system; the
        synchronous operation RECOGNISES only the two masks published on the
        DateMask schema's x-recognised-masks field, and answers any other mask it
        is sent with the unusable-pattern verdict rather than converting it.


        The transport is a standard queue and not an ordered one, because a date
        inquiry has no ordering requirement: two replies are independent and
        neither depends on the other having been delivered first. The consumer waits
        five seconds for a message, which is the migrated form of the wait interval
        the baseline sets at CODATE01.cbl line 286 -- five thousand milliseconds,
        as that program's own comment on the preceding line records -- and matches
        the listener poll timeout configured in application.yml, so the two agree
        rather than merely resembling each other.


        Correlation is preserved as a message attribute. The baseline clears the
        correlation and message identifiers before receiving, at CODATE01.cbl lines
        287 and 288, and restores the saved pair before replying, at lines 373 and
        374, so a reply is matched to its request by those values rather than by
        arrival order. No queue name, URL or identifier appears in this document:
        they are supplied to the service through the environment, and application
        .yml resolves each from a variable rather than a literal.
      required:
        - bufferLength
        - datePrefix
        - timePrefix
        - dateFormat
        - timeFormat
      additionalProperties: false
      properties:
        bufferLength:
          type: integer
          format: int32
          const: 1000
          description: >-
            The invariant width of the reply buffer in bytes. Declared as a
            constant because a consumer reads exactly this many bytes regardless of
            how much of them the content occupies.
          examples:
            - 1000
        datePrefix:
          type: string
          const: 'SYSTEM DATE : '
          description: >-
            The verbatim label preceding the date value, including its trailing
            space. Reproduced character for character from
            app/app-vsam-mq/cbl/CODATE01.cbl line 355.
          examples:
            - 'SYSTEM DATE : '
        timePrefix:
          type: string
          const: 'SYSTEM TIME : '
          description: >-
            The verbatim label preceding the time value, including its trailing
            space. Reproduced character for character from
            app/app-vsam-mq/cbl/CODATE01.cbl line 356.
          examples:
            - 'SYSTEM TIME : '
        dateFormat:
          type: string
          const: MM-DD-YYYY
          description: >-
            The ordering of the date value in this reply: month, day then year,
            hyphen-separated, in ten characters. It is deliberately NOT one of the
            masks the synchronous operation admits, and the difference is the point
            -- this reply reproduces what the baseline's platform call renders.
          examples:
            - MM-DD-YYYY
        timeFormat:
          type: string
          const: HH:MM:SS
          description: >-
            The shape of the time value in this reply, in the eight characters the
            baseline field declared at app/app-vsam-mq/cbl/CODATE01.cbl line 38
            holds.
          examples:
            - HH:MM:SS
      examples:
        - bufferLength: 1000
          datePrefix: 'SYSTEM DATE : '
          timePrefix: 'SYSTEM TIME : '
          dateFormat: MM-DD-YYYY
          timeFormat: HH:MM:SS


    MaintenanceActionType:
      type: string
      enum:
        - INSERT
        - UPDATE
        - DELETE
      description: >-
        Which operation a maintenance action performs. These are the three the
        baseline program applies per input record, each reporting its own outcome
        at app/app-transaction-type-db2/cbl/COBTUPDT.cbl lines 153, 179 and 209.
        The baseline reads the same choice as a single record-type character -- 'A',
        'U' or 'D' at its lines 111 to 119 -- and additionally recognises '*' as a
        comment to skip at line 120 and reports anything else as an invalid type at
        line 124. Neither of those last two has a member here: a comment is a
        property of the program's INPUT FILE and has no counterpart in a JSON array,
        and an unrecognised value is refused by this enumeration before any action
        runs, which is why the baseline's ERROR: TYPE NOT VALID sentence is published
        on the ReferenceMessageCatalogue schema but is not an outcome this operation
        can return. That coarser refusal is registered as D-REFERENCE-ACTION-DOMAIN
        in docs/architecture/cobol-to-service-traceability.md, cited by identifier so
        the claim here and the entry there can be reconciled by search.
      examples:
        - INSERT
        - DELETE

    # WHY : Assumptions: an action addresses a transaction TYPE and never a category,
    #       because that is the whole of what the batch program maintains.
    #       app/app-transaction-type-db2/cbl/COBTUPDT.cbl reads a 53-byte record
    #       declared at its lines 71 to 76 -- a one-character action, a two-character
    #       type number and a fifty-character description, with no category position
    #       at all -- includes only the type table's declaration at line 54, and
    #       issues its three statements against CARDDEMO.TRANSACTION_TYPE alone at
    #       lines 138, 172 and 202. A category target would therefore be a
    #       maintenance surface the baseline has no equivalent for.
    #       Alternatives Considered: admitting a category target so that both
    #       reference tables were reachable in bulk. Rejected because the individual
    #       category operations published above already maintain categories, so the
    #       only thing a category target would add here is a bulk path with no
    #       counterpart to be verified against -- and this contract's own parity
    #       claim is that each published operation reproduces a program that exists.
    MaintenanceAction:
      type: object
      description: >-
        One reference-data maintenance action: what to do, and to which transaction
        type. The target is named by its code rather than by a path, because one
        request carries many actions.
      required:
        - action
        - typeCd
      additionalProperties: false
      properties:
        action:
          allOf:
            - $ref: '#/components/schemas/MaintenanceActionType'
          description: >-
            The operation to apply to the row this action names.
        typeCd:
          allOf:
            - $ref: '#/components/schemas/TransactionTypeCode'
          description: >-
            The transaction type this action applies to. Required on every action,
            because it is the whole key of the one table this operation maintains.
        description:
          oneOf:
            - $ref: '#/components/schemas/ReferenceDescription'
            - type: 'null'
          description: >-
            The description to store, required for INSERT and UPDATE and ignored for
            DELETE. Null on a DELETE action rather than absent, so that every action
            in a batch has the same member set and a caller can build them uniformly.
            The requirement is enforced by this schema rather than left to prose --
            see the conditional rule declared beneath these properties.
      if:
        properties:
          action:
            enum:
              - INSERT
              - UPDATE
      then:
        properties:
          description:
            $ref: '#/components/schemas/ReferenceDescription'
        required:
          - description
      else:
        properties:
          description:
            type: 'null'
      examples:
        - action: INSERT
          typeCd: '08'
          description: Chargeback
        - action: DELETE
          typeCd: '01'
          description: null

    # WHY : Refactoring Rationale: this batch is NOT all-or-nothing, and an earlier
    #       revision said it was. The baseline reads its stream in the loop at
    #       app/app-transaction-type-db2/cbl/COBTUPDT.cbl L93-L96 and every failure
    #       path performs 9999-ABEND at L230-L233, which DISPLAYs a message, moves 4
    #       to RETURN-CODE and exits the paragraph -- it does not stop the run. The
    #       loop reads the next record, so a record that found no row, or whose SQL
    #       failed, is soft-rejected while every other record is applied, and the
    #       program has no COMMIT of its own so the successful work commits at
    #       normal termination. An all-or-nothing target would roll back the
    #       records the baseline keeps: a stream of ten whose seventh names an
    #       absent row leaves nine rows changed in the baseline and none in an
    #       atomic target, which is an observable behavioural difference and not a
    #       refinement.
    MaintenanceActionBatchRequest:
      type: object
      description: >-
        The actions to apply, in the order they are to be applied. Each action is
        attempted independently and an action that fails does not stop the ones after
        it, which is what the baseline program does; the order therefore matters only
        where one action's effect is another's precondition, such as deleting a type
        and then inserting it again under a new description.
      required:
        - actions
      additionalProperties: false
      properties:
        actions:
          type: array
          minItems: 1
          maxItems: 500
          description: >-
            The actions, in the order they are to be applied. At least one, because an
            empty batch has no outcome to report, and at most five hundred, which
            bounds the work one request holds open rather than expressing any limit the
            baseline states -- the baseline reads its action stream to end of file at
            app/app-transaction-type-db2/cbl/COBTUPDT.cbl lines 100 to 102 and states
            no bound at all. The ceiling is a documented divergence, registered as
            D-REFDATA-BATCH-CAP in
            docs/architecture/cobol-to-service-traceability.md, which also records how a
            longer stream is split: because each action is applied independently,
            successive requests reach the same end state as one long stream provided a
            dependent action is not separated from the action it depends on into an
            EARLIER request.
          items:
            $ref: '#/components/schemas/MaintenanceAction'
      examples:
        - actions:
            - action: INSERT
              typeCd: '08'
              description: Chargeback
            - action: UPDATE
              typeCd: '07'
              description: Cash advance fee

    MaintenanceActionOutcomeState:
      type: string
      enum:
        - APPLIED
        - NO_ROWS_FOUND
        - FAILED
      description: >-
        Which of the three outcomes the baseline program distinguishes per action this
        outcome is. APPLIED is its zero-SQLCODE arm, which reports one of the three
        success sentences at app/app-transaction-type-db2/cbl/COBTUPDT.cbl lines 153,
        179 and 209. NO_ROWS_FOUND is its +100 arm on the update and delete paths at
        lines 180 and 210, which reports 'No records found.' and sets a warning return
        code. FAILED is its negative-SQLCODE arm at lines 154, 185 and 216, which sets
        the same warning return code. There is no fourth member because the program
        distinguishes no fourth condition: a duplicate key on insert, a restricted
        delete and any other database refusal all reach the negative arm together.
      examples:
        - APPLIED
        - NO_ROWS_FOUND

    MaintenanceActionOutcome:
      type: object
      description: >-
        What one submitted action did, carrying the baseline's own wording for it. The
        four sentences it can carry are reproduced character for character from
        app/app-transaction-type-db2/cbl/COBTUPDT.cbl: an inserted record at its line
        153, an updated record at line 179, a deleted record at line 209, and an
        unmatched key at lines 181 and 211 -- the last stated twice in that program,
        once on the update path and once on the delete path, with identical text.
      required:
        - position
        - action
        - typeCd
        - outcome
        - applied
        - message
      additionalProperties: false
      properties:
        position:
          type: integer
          format: int32
          minimum: 0
          description: >-
            The zero-based index of the action this outcome describes, in the submitted
            list. Present so that a caller can pair outcomes with actions without
            relying on the array orders matching, and so that an unsuccessful action can
            be identified without matching on its key.
          examples:
            - 0
        action:
          allOf:
            - $ref: '#/components/schemas/MaintenanceActionType'
          description: >-
            The operation this action requested, echoed back.
        typeCd:
          allOf:
            - $ref: '#/components/schemas/TransactionTypeCode'
          description: >-
            The transaction type this action addressed, echoed back.
        outcome:
          allOf:
            - $ref: '#/components/schemas/MaintenanceActionOutcomeState'
          description: >-
            Which of the three conditions the baseline distinguishes this action met.
            Read this rather than parsing the sentence: the sentence is baseline text
            kept for display, and two of the three states can carry the same sentence
            on different paths.
        applied:
          type: boolean
          description: >-
            Whether this action changed a row. True exactly when outcome is APPLIED, and
            false for both NO_ROWS_FOUND and FAILED. It is carried alongside outcome
            rather than derived from it by the caller because it is the one question a
            caller always has, and a boolean cannot be got wrong by a client that has
            not been updated for a future state. It is false for any action the baseline
            would report and continue past -- a key that matched nothing, a duplicate key,
            a category naming an absent type, or a type whose delete is refused while
            categories still reference it -- so a response routinely carries a mixture of
            true and false.
          examples:
            - true
        message:
          type: string
          maxLength: 75
          description: >-
            The baseline's wording for this outcome, carried verbatim and keyed to the
            program that owns it. A client displays it rather than composing its own
            sentence, so that the migrated screens read as the baseline screens did.
            For FAILED the sentence names no database detail: the baseline strings its
            SQLCODE and, on the online paths, its SQLERRM into the text, and neither is
            carried onto a body a caller reads -- the correlation identifier is the
            route to the operational record instead.
          examples:
            - RECORD INSERTED SUCCESSFULLY
            - 'No records found.'
      examples:
        - position: 0
          action: INSERT
          typeCd: '08'
          outcome: APPLIED
          applied: true
          message: RECORD INSERTED SUCCESSFULLY
        - position: 1
          action: DELETE
          typeCd: '09'
          outcome: NO_ROWS_FOUND
          applied: false
          message: 'No records found.'

    MaintenanceActionBatchResponse:
      type: object
      description: >-
        One outcome per submitted action, in the submitted order, together with the
        aggregate return code the baseline program leaves behind.
      required:
        - outcomes
        - returnCode
      additionalProperties: false
      properties:
        outcomes:
          type: array
          description: >-
            The outcomes, one per submitted action and in the same order. Its length
            always equals the length of the submitted action list, because every action
            is attempted: one that fails is recorded and the next is attempted, exactly
            as the baseline continues its read loop after reporting a failure.
          items:
            $ref: '#/components/schemas/MaintenanceActionOutcome'
        # WHY : Assumptions: this member exists because without it a caller would have
        #       to derive the aggregate by scanning the outcome list, which is a rule it
        #       would be free to get wrong, and the warn tier is the value an operator
        #       acts on. It is the migrated form of a value the baseline makes visible to
        #       whoever ran the job -- its process return code.
        returnCode:
          type: integer
          format: int32
          enum:
            - 0
            - 4
          description: >-
            The aggregate condition code, carried across from the baseline rather than
            invented: 0 when every action was applied, and 4 when at least one was not.
            The program sets it with MOVE 4 TO RETURN-CODE at
            app/app-transaction-type-db2/cbl/COBTUPDT.cbl line 232, from the one
            paragraph every failure path performs, and it is sticky -- a later success
            does not clear it. Only those two values occur, because that paragraph is
            the only place the program assigns a return code.
          examples:
            - 4
      examples:
        - outcomes:
            - position: 0
              action: INSERT
              typeCd: '08'
              outcome: APPLIED
              applied: true
              message: RECORD INSERTED SUCCESSFULLY
            - position: 1
              action: DELETE
              typeCd: '09'
              outcome: NO_ROWS_FOUND
              applied: false
              message: 'No records found.'
          returnCode: 4

    # WHY : Assumptions: this schema mirrors the shared failure type
    #       services/common-lib/src/main/java/com/carddemo/common/error/ApiError.java
    #       member for member, because that type is what the inherited
    #       GlobalExceptionHandler serialises for every failing operation in this
    #       service. Declaring a narrower shape here would describe a body this
    #       service cannot send, and declaring a wider one would promise members no
    #       advice populates.
    # WHY : Assumptions: two independent channels, and a client must not treat
    #       either as derived from the other. The message member is one aggregate
    #       sentence latched to the first failure detected, and fieldErrors
    #       accumulates an entry for EVERY offending field. Joining the array does
    #       not reconstruct the sentence, and the array is not guaranteed to hold
    #       exactly one entry.
    ApiError:
      type: object
      description: >-
        The single failure shape every operation in this service returns, at every
        status. It carries a machine-readable identifier, an aggregate sentence for
        a person to read, the per-field detail described on the FieldError schema,
        and the correlation identifier that leads to the operational record.
      # WHY : Refactoring Rationale: `message` and `abend` are REQUIRED and NULLABLE, which is a
      #       different statement from optional and is the one this shape has to make. Both are record
      #       components of ApiError in
      #       services/common-lib/src/main/java/com/carddemo/common/error/ApiError.java, and a record
      #       component is always written, so the key is present with a null value on every response --
      #       `ApiErrorWireShapeTest` asserts exactly that, emitting `"message":null` and `"abend":null`.
      #       An earlier revision omitted them from this list, which told a generated client the keys
      #       might be missing and left it unable to distinguish "not supplied" from "nothing to
      #       report"; a strict validator reading `additionalProperties: false` alongside the omission
      #       had no member to bind the emitted keys to at all.
      # WHY : Alternatives Considered: suppressing the two keys when null, with an inclusion setting, so
      #       the omission became true. Rejected because the aggregate sentence is the reference's own
      #       75-character message field and a client renders the band from it unconditionally, so a
      #       key that comes and goes moves that decision into every client; and because
      #       always-inclusion is PINNED for every service in
      #       services/common-lib/src/main/resources/carddemo-common-defaults.yml, which the
      #       money contract SEPARATELY depends on -- a money member with no value must be
      #       present and null rather than absent, because absent reads as "no balance" where
      #       null reads as "no amount applies". That is a second consumer of the same pin and
      #       NOT the reason these two keys are required here: the reason is the record shape
      #       above, and this schema carries no monetary member at all. An earlier revision ran
      #       the two together, which read as though a problem document's nullability followed
      #       from a money rule.
      # WHY : ⚠️ Refactoring Rationale: that last clause used to read "the services set
      #       default-property-inclusion: always" and it named no place, which is how it came
      #       to be inaccurate -- exactly one of the seven services actually set the key, and
      #       the other six, this one included, rested a published contractual promise on the
      #       serialiser's own default. The key is now set once in the shared defaults every
      #       service imports, so the claim is true for all of them and is verifiable by
      #       reading one file. The reasoning is unchanged; only its subject is now real.
      required:
        - code
        - secondaryCode
        - message
        - severity
        - subsystem
        - status
        - correlationId
        - path
        - timestamp
        - fieldErrors
        - abend
      additionalProperties: false
      properties:
          # WHY : Assumptions: 13 is the exact width of every identifier the shared writer emits --
          #       the literal `CARDDEMO-` followed by four digits -- so it is a measurement rather
          #       than a round number, and it is the same bound the six sibling contracts publish.
        code:
          type: string
          maxLength: 13
          description: >-
            The stable machine-readable identifier of the failure, matched on by
            clients and by operational tooling and never reworded. The shared
            identifiers of the kernel are used, whose numeric suffix aligns with the
            HTTP status the shared advice assembles.
          examples:
            - CARDDEMO-0409
          # WHY : ⚠️ Refactoring Rationale: the bound is 22 and was 13. Thirteen is the width of
          #       `code` above -- `CARDDEMO-` and four digits -- and this member is NOT drawn from that
          #       vocabulary: it carries a subordinate condition name, and the widest the shared writer
          #       can emit is 22, measured on CARD-LOCK-NOT-ACQUIRED and CARD-WRITE-NOT-APPLIED in
          #       services/card-service/src/main/java/com/carddemo/card/api/CardController.java. This
          #       service emits only the empty string today, so 13 was not violated here -- but one
          #       generated client type reads a problem document from any of the seven services, and a
          #       bound that differs between them is a type that differs between them. Bounding it at
          #       the writer's own maximum is what makes the seven agree.
        secondaryCode:
          type: string
          maxLength: 22
          description: >-
            A subordinate identifier qualifying code, or the empty string when the
            failure has no second identifier. Every response this service returns
            carries the EMPTY string, because the shared advice composes no second
            identifier: ApiError.ofConflict fixes this member at the empty string,
            and the other factories on that record do the same. The member is
            required rather than optional so that a client parses one shape on every
            status, and it is documented as always empty rather than omitted so that
            a client is not written to branch on a value that never varies. The
            conditions sharing a status are discriminated by the sentence, which is
            selected per condition -- see the Conflict response.
          examples:
            - ''
        message:
          type:
            - string
            - 'null'
          maxLength: 75
          description: >-
            The aggregate sentence, carried verbatim from the baseline program that
            owns it wherever one does. Deliberately nullable: null is the migrated
            form of no-message and the empty string the migrated form of an empty
            message, two states the baseline distinguishes and this shape therefore
            does not merge. Bounded at seventy-five characters, the declared width of
            the message fields the baseline screens carry -- for instance the field
            at app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 249, which every
            sentence on that screen is moved into.
          examples:
            - 'Please delete associated child records first:'
        severity:
          allOf:
            - $ref: '#/components/schemas/Severity'
          description: >-
            How serious this failure is, on the baseline's own four-level ladder.
            Every client-correctable outcome in this context is at the warning level,
            because each is something a caller may act on; the unclassified failure
            reported as 500 is at the critical level. That difference is why this
            member is worth reading rather than assuming.
        subsystem:
          allOf:
            - $ref: '#/components/schemas/Subsystem'
          description: >-
            Which part of the platform the failure arose in, on the baseline's own
            six-value ladder. This service produces only the application and
            relational values; a response naming any of the other four would
            misattribute the failure.
          # WHY : Assumptions: the range is 400 to 599 because the shared writer never leaves it: every
          #       factory of com.carddemo.common.error.ApiError is called with a client-error or
          #       server-error status, and a 2xx or 3xx in this member would describe a response that is
          #       not a problem document at all. Declared rather than left open so a generated client
          #       reading this document gets the same type it gets from the six sibling contracts.
        status:
          type: integer
          minimum: 400
          maximum: 599
          format: int32
          description: >-
            The HTTP status this response carries, restated inside the body so that a
            payload logged or archived away from its response envelope is still
            self-describing. It always equals the status of the response carrying it.
          examples:
            - 409
        correlationId:
          allOf:
            - $ref: '#/components/schemas/CorrelationId'
          description: >-
            Identifies the unit of work that failed, inherited from the inbound
            request rather than generated here, and the empty string when the request
            carried none and none had been minted. It is the intended route from this
            response to the operational record, which is where diagnostic detail
            lives.
        path:
          type: string
          description: >-
            The request path that produced this failure, as received. Carried so that
            a logged body identifies its own request without the surrounding access
            record.
          examples:
            - /api/v1/reference/transaction-types/01
          # WHY : Assumptions: 26 characters and the pattern together, not either alone. The width is the
          #       reference declaration -- TRNX-ORIG-TS and TRNX-PROC-TS are PIC X(26) -- and the pattern
          #       is what makes the six microsecond digits a contract rather than a suggestion. A width
          #       with no pattern admits 26 characters of anything; a pattern with no width leaves a
          #       client sizing a column from prose.
        timestamp:
          type: string
          maxLength: 26
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}$'
          description: >-
            When the failure was assembled, to microsecond resolution in the
            twenty-six-character form the migration uses throughout -- the same form
            the baseline writes into its transaction records, so that a failure and a
            posted record can be ordered against each other without converting
            either.
          examples:
            - '2026-08-06 09:16:44.902355'
        fieldErrors:
          type: array
          description: >-
            One entry per offending field, empty when the failure is not attributable
            to particular fields. Always present, never null, so a client can iterate
            it without a presence test.
          items:
            $ref: '#/components/schemas/FieldError'
        abend:
          oneOf:
            - $ref: '#/components/schemas/AbendDetail'
            - type: 'null'
          description: >-
            The structured abend detail when the failure corresponds to a condition
            the baseline treats as unrecoverable, and null otherwise -- which is the
            usual case. In this context the one operation that populates it is the
            rate lookup, when neither the requested group nor the DEFAULT group has a
            row.


    # WHY : Refactoring Rationale: field-level failures are reported as a
    #       STRUCTURED ARRAY, replacing a mechanism that had no data form at all.
    #       The baseline marks a bad field by writing a colour attribute into the
    #       screen map: the templated copybook app/cpy/CSSETATY.cpy moves a red
    #       attribute into the field's own attribute byte at its lines 21 to 22 when
    #       either the not-ok or the blank flag is set, tested at lines 18 to 19. A
    #       colour in a terminal buffer cannot be returned to a browser or asserted
    #       in a test, so the same information is carried as one entry per field --
    #       which the browser client renders as a form item in the error state with
    #       help text beneath it.
    # WHY : Refactoring Rationale: the target SEVERS a coupling the baseline has,
    #       and this is the substantive behavioural difference rather than a change
    #       of representation. The baseline gates the highlight on a
    #       pseudo-conversational re-entry flag at app/cpy/CSSETATY.cpy line 20, so
    #       whether a bad field is marked depends on whether the program believes it
    #       is being re-entered after a screen turn -- state that survived between
    #       turns in a buffer the terminal echoed back. There is no such flag here
    #       and no turn to count: every operation is stateless, so the marking is
    #       driven purely by the response body. A caller therefore sees field
    #       detail on the first failing request, where the baseline would have
    #       shown none. The divergence is recorded in
    #       docs/architecture/cobol-to-service-traceability.md.
    # WHY : Assumptions: the blank case stays DISTINGUISHABLE from the merely
    #       invalid case, because the baseline distinguishes them. Beyond setting
    #       the colour, it writes a literal asterisk into the field itself when the
    #       blank flag is set, at app/cpy/CSSETATY.cpy lines 23 to 25 -- so a user
    #       could see which fields were empty as against which were wrong. The state
    #       member below preserves that distinction, and the asterisk itself is
    #       described in the FieldValidationState schema's own text rather than left
    #       for each client to guess. Refactoring Rationale: an earlier revision said
    #       the asterisk was published "as a constant on the FieldValidationState
    #       schema", which it never was -- that schema is a string enumeration of
    #       states and has no member to hold a marker character. Saying so sent a
    #       reader looking for a field that does not exist.
    FieldError:
      type: object
      description: >-
        One offending field: which field, in what way, and the sentence to show
        beside it. Mirrors
        services/common-lib/src/main/java/com/carddemo/common/error/ApiError.java's
        nested field-error type member for member.
      required:
        - field
        - state
        - message
      additionalProperties: false
      properties:
          # WHY : Assumptions: a field name is never the empty string. The shared writer names the member
          #       it refused, so an entry with no name would describe a refusal a client cannot place
          #       against a control, which is the one thing this array exists to enable.
        field:
          type: string
          minLength: 1
          description: >-
            The name of the offending member, spelled exactly as it appears in the
            request or response schema it belongs to, so that a client can bind the
            entry to the input it rendered without a translation table. For a
            failure attributable to a submitted batch action rather than to a named
            member, this is the member path including the action's index.
          examples:
            - typeCd
            - description
        state:
          allOf:
            - $ref: '#/components/schemas/FieldValidationState'
          description: >-
            Whether the field was absent or present but unacceptable. The two are
            reported separately because the baseline marks them differently.
          # WHY : Assumptions: a per-field sentence is never the empty string, for the same reason as the
          #       field name beside it: the entry exists to be rendered, and an empty sentence renders
          #       as a highlighted control with no explanation.
        message:
          type: string
          minLength: 1
          maxLength: 75
          description: >-
            The sentence to show beside this field, carried verbatim from the
            baseline program that owns it wherever one does -- for instance the
            wording the maintenance screen gives when a description carries
            characters it will not accept, published on the
            ReferenceMessageCatalogue schema.
          examples:
            - Name can only contain alphabets and spaces
      examples:
        - field: description
          state: BLANK
          message: No input received

    # WHY : Refactoring Rationale: this enumeration publishes TWO values, and an
    #       earlier revision published three by adding the passing state VALID, on
    #       the stated ground that the enumeration should match the shared Java type
    #       rather than a subset of it. That ground was wrong in a way a compiler
    #       cannot see. The shared kernel's own field-error record REFUSES the
    #       passing state at construction -- the compact constructor of
    #       ApiError.FieldError throws when its state is not an error state, because
    #       an entry exists only for an offending field and an array length that no
    #       longer equals the number of offending fields gives a client two
    #       contradictory signals. So a response body carrying VALID here is one the
    #       service cannot construct, and publishing it obliged every generated
    #       client to write a branch for a value it will never receive.
    # WHY : Assumptions: the schema mirrors the WIRE domain of the member that
    #       references it, not the full domain of the Java enum behind it. The enum
    #       has three constants and the shared record admits two of them; this
    #       document describes what crosses the boundary, so two is the correct
    #       number. The sibling authorization contract publishes the same two for the
    #       same reason, so the platform has one answer to this question.
    # WHY : Alternatives Considered: keeping three values and narrowing them at the
    #       one member that uses them, with a not-VALID constraint. Rejected because
    #       JSON Schema expresses that only as a negated enumeration, which reads as
    #       an exclusion rule rather than as a domain and which a code generator
    #       renders as the wider type anyway.
    FieldValidationState:
      type: string
      enum:
        - NOT_OK
        - BLANK
      description: >-
        The state of one OFFENDING field, drawn from the two failing constants the
        shared kernel publishes at
        services/common-lib/src/main/java/com/carddemo/common/validation/FieldValidationFlag.java.
        These two are the migrated form of the condition names the templated
        highlight copybook tests together in one disjunction at app/cpy/CSSETATY.cpy
        lines 18 to 19.


        NOT_OK means the field was supplied and is unacceptable. BLANK means it was
        not supplied at all, and it is the state the baseline additionally marks
        with a literal asterisk written into the field, at app/cpy/CSSETATY.cpy
        lines 23 to 25; a client reproducing that marker uses that single character.
        The enum behind this schema carries a third, passing constant which is
        deliberately NOT published: a passing field contributes no entry at all, and
        the shared field-error record refuses that constant at construction, so no
        response body can ever carry it.
      examples:
        - NOT_OK
        - BLANK

    Severity:
      type: string
      enum:
        - LOG
        - INFO
        - WARNING
        - CRITICAL
      description: >-
        How serious a failure is, on the baseline's four-level ladder as published
        by the shared error type. LOG and INFO are recorded rather than shown;
        WARNING is an outcome a caller may act on, which is every
        client-correctable failure in this context; CRITICAL is an unclassified
        fault, which in this context reaches a caller only as a 500 or as the
        abend-carrying rate-lookup failure.
      examples:
        - WARNING

    Subsystem:
      type: string
      enum:
        - APPLICATION
        - CICS
        - IMS
        - RELATIONAL
        - QUEUE
        - OBJECT_STORE
      description: >-
        Which part of the platform a failure arose in, on the baseline's six-value
        ladder as published by the shared error type. This service produces only
        APPLICATION, for a failure in its own validation or business rules, and
        RELATIONAL, for one the database reported -- the referential refusal and the
        duplicate key among them. The remaining four are published so that the
        enumeration matches the shared type; a response from this service naming one
        of them would misattribute the failure.
      examples:
        - RELATIONAL

    # WHY : Refactoring Rationale: every example below shows the REDUCED EXTERNAL
    #       form, and an earlier revision showed the internal one -- a named
    #       component in abendCulprit, a diagnostic sentence in abendReason and the
    #       baseline's own operator wording in abendMsg. No client can receive that.
    #       The shared kernel's AbendDetail.external() returns
    #       new AbendDetail(abendCode, "", "", EXTERNAL_ABEND_MSG), so the culprit and
    #       the reason are structurally emptied and the message is replaced with one
    #       fixed client-safe line before the block is serialised. Publishing the
    #       internal form documented a body the service cannot emit, and it disclosed
    #       which internal component failed and why -- the exact detail every other
    #       response in this document withholds.
    # WHY : Assumptions: the CONDITION CODE survives the reduction and the other
    #       three do not, so it is the one member whose example is a real value. Four
    #       characters cannot carry a component name, a path or a diagnostic sentence,
    #       and an operator correlating a client report against a log needs something
    #       coarser than nothing.
    # WHY : Trade-offs: the internal wording is still documented -- on the
    #       ReferenceMessageCatalogue schema, where it is labelled as the LOG-side
    #       text -- rather than deleted. It is a verbatim baseline sentence and this
    #       migration carries those across; what changes is that this document no
    #       longer implies a client will read it.
    # WHY : Trade-offs: all four members stay REQUIRED even though two of them are
    #       always the empty string in any body a client can receive. Requiring them
    #       keeps the parsed shape stable -- a client reads four members whatever
    #       happened -- while the descriptions state what will actually be found there.
    #       Making the emptied pair optional was rejected because it would move the
    #       redaction decision out of one factory and into every construction site.
    AbendDetail:
      type: object
      description: >-
        Structured detail for a condition the baseline treats as unrecoverable, in
        the reduced external form a client actually receives. Its four members and
        their declared widths are the four fields of the abend group
        app/cpy/CSMSG02Y.cpy declares at its lines 21 to 29, each of which that
        copybook initialises to spaces on the line following its declaration. It
        mirrors
        services/common-lib/src/main/java/com/carddemo/common/error/AbendDetail.java
        member for member.


        Only the condition code crosses the boundary as a real value. The shared
        kernel emits this block through AbendDetail.external(), which replaces the
        culprit and the reason with the empty string and the message with one fixed
        client-safe sentence, so the internal component name and diagnostic never
        leave the service. Correlate with X-Correlation-Id to reach the log record
        that does carry them.


        The copybook's own internal banner at its line 2 names the file
        differently from its path on disk. The path is the citation used here and
        throughout; the banner is a baseline naming quirk, cited as it stands and
        not altered, because app is read as reference only.
      required:
        - abendCode
        - abendCulprit
        - abendReason
        - abendMsg
      additionalProperties: false
      properties:
        abendCode:
          type: string
          maxLength: 4
          description: >-
            The four-character condition code, from the field at
            app/cpy/CSMSG02Y.cpy line 22. This is the one member the reduced
            external form preserves, so it is the value to quote alongside the
            correlation identifier. The empty string where none was recorded, which
            is that field's own declared initial value.
          examples:
            - RDG1
        abendCulprit:
          type: string
          maxLength: 8
          const: ''
          description: >-
            Always the empty string on the wire. The field at app/cpy/CSMSG02Y.cpy
            line 24 carries the eight-character name of the component that raised
            the condition; AbendDetail.external() clears it, because a component name
            is an internal detail and this response has no reader entitled to it. The
            declared width is retained so the member's provenance stays readable.
          examples:
            - ''
        abendReason:
          type: string
          maxLength: 50
          const: ''
          description: >-
            Always the empty string on the wire. The field at app/cpy/CSMSG02Y.cpy
            line 26 carries a fifty-character diagnostic reason;
            AbendDetail.external() clears it for the same reason as the culprit
            above. The reason is written to the correlated log record instead.
          examples:
            - ''
        abendMsg:
          type: string
          maxLength: 72
          description: >-
            The seventy-two-character message, from the field at
            app/cpy/CSMSG02Y.cpy line 28. This is the widest of the four and is the
            one intended for display, and it is the one sentence the reduction
            SUBSTITUTES rather than clears: AbendDetail.external() replaces whatever
            the baseline composed with the fixed client-safe line below.
          examples:
            - The request could not be completed. Quote the correlation identifier.
      examples:
        - abendCode: RDG1
          abendCulprit: ''
          abendReason: ''
          abendMsg: The request could not be completed. Quote the correlation identifier.

    # WHY : Assumptions: the user-visible sentences of this context are published
    #       as CONSTANTS in one schema, rather than left scattered across the
    #       operations that emit them. The migration reproduces this text character
    #       for character keyed by the program that owns it, and a sentence written
    #       out at each of several sites is a sentence that can differ between two
    #       of them without anything noticing. Gathering them here gives the browser
    #       client one place to read from and a reviewer one place to check against
    #       the baseline.
    # WHY : Assumptions: the irregularities in this text are the baseline's and are
    #       carried across UNALTERED -- a missing space after a full stop, a comma
    #       with no space after it, a trailing space, a capital letter mid-sentence,
    #       four consecutive dots, a two-word spelling of a word usually written as
    #       one. Each is reproduced because a user of the migrated screens should
    #       read what the baseline screens showed, and because normalising them
    #       would make this catalogue disagree with the source it is cited against.
    #       Individual quirks are noted on the members that carry them.
    # WHY : Assumptions: the two near-identical no-change sentences are BOTH
    #       published as separate members and must never be collapsed. They differ
    #       by four words and by which baseline program a user was on --
    #       noChangeDetectedSingleRecord ends "values fetched." at COTRTUPC.cbl line
    #       180, noChangeDetectedList ends "database values." at COTRTLIC.cbl line
    #       262 -- so keeping one would silently retire a string the baseline
    #       distinguishes. The same applies to the two spellings of the deadlock
    #       and data-changed wording: COTRTLIC.cbl line 1874 writes "Someone" as
    #       one word while COTRTUPC.cbl line 184 writes "some one" as two, and both
    #       are correct as declared.
    ReferenceMessageCatalogue:
      type: object
      description: >-
        The user-visible sentences of this context, each carried verbatim from the
        baseline program and line that owns it. This schema declares constants and
        is not the body of any operation: it exists so that the one wire text has
        one written definition, referenced by the browser client and checkable by a
        reviewer against the sources cited on each member.
      additionalProperties: false
      properties:
        noRecordsFoundForSearch:
          type: string
          const: 'No records found for this search condition.'
          description: >-
            Shown when a search matches nothing. From
            app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 254; it ends with a
            full stop and spells "records" in lower case, unlike the filter sentence
            below.
        noRecordsFoundForFilters:
          type: string
          const: 'No Records found for these filter conditions'
          description: >-
            Shown when the supplied filters match nothing. From
            app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 1264; it capitalises
            "Records" and carries no closing full stop, and both differences from
            the sentence above are the baseline's.
        noMorePagesForSearch:
          type: string
          const: 'No more pages for these search conditions'
          description: >-
            Shown when a caller pages forward past the end of a filtered set. From
            app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 256; no closing full
            stop.
        noMorePages:
          type: string
          const: 'No more pages to display'
          description: >-
            Shown when a caller pages forward from a page whose hasNext is false.
            From app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 1539.
        noPreviousPages:
          type: string
          const: 'No previous pages to display'
          description: >-
            Shown when a caller pages backward from a page whose firstKey names the
            start of the set. From app/app-transaction-type-db2/cbl/COTRTLIC.cbl
            line 1534.
        typeCodeFilterMustBeTwoDigits:
          type: string
          const: 'TYPE CODE FILTER,IF SUPPLIED MUST BE A 2 DIGIT NUMBER'
          description: >-
            Shown when the type-code filter is present but not two digits, and
            returned as a field entry on the 400. From
            app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 1116; note there is
            no space after the comma.
        childRecordsExist:
          type: string
          const: 'Please delete associated child records first:'
          description: >-
            Shown when a transaction type's delete is refused because categories
            still reference it, and carried as the 409 message. Declared identically
            in both baseline programs, at
            app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 1919 and
            COTRTUPC.cbl line 1641; the closing colon is retained because the
            baseline prefixes a database diagnostic with it.
        insertRefusedPrefix:
          type: string
          const: 'Error inserting record into:'
          description: >-
            The opening half of the sentence a refused INSERT carries as its 409
            message, from the first literal of the STRING in 9700-INSERT-RECORD at
            app/app-transaction-type-db2/cbl/COTRTUPC.cbl line 1610. It is published
            in two halves because the baseline writes a table name between them:
            line 1611 declares ' TRANSACTION_TYPE Table. SQLCODE:' as one literal,
            whose leading space and trailing text are insertRefusedSuffix below. The
            baseline hardcodes the token because that screen maintains one table;
            this context owns two, so the token is supplied by the statement that
            was refused and every character around it is the baseline's.
        insertRefusedSuffix:
          type: string
          const: ' Table. SQLCODE:'
          description: >-
            The closing half of that same sentence, being the tail of
            app/app-transaction-type-db2/cbl/COTRTUPC.cbl line 1611 after the table
            name, including its leading space. The capitalised 'Table' is that arm's
            own and is not normalised against the lower-case 'table' the read arm
            writes at line 1500 -- each is carried as written. The closing colon is
            retained because the baseline prefixes the database's code and
            diagnostic with it, and nothing is appended after it here: those details
            name the constraint and quote the offending key, so they go to the
            operational record instead of the response.
        deleteFailed:
          type: string
          const: 'Delete failed with message:'
          description: >-
            Shown for a delete that failed for a reason other than the referential
            refusal -- the catch-all arm at
            app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 1929 and
            COTRTUPC.cbl line 1654. The two arms are distinguished in the baseline
            and so map to different statuses here: this text belongs to a 500, while
            the sentence above belongs to a 409.
        recordNotFoundDeletedByOthers:
          type: string
          const: 'Record not found. Deleted by others ? '
          description: >-
            Shown when an update finds no row because another user removed it. From
            app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 1864; it ends with a
            space after the question mark, which is preserved.
        deadlockSomeoneElseUpdating:
          type: string
          const: 'Deadlock. Someone else updating ?'
          description: >-
            Shown when the database reports a deadlock during an update. From
            app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 1874; "Someone" is one
            word here, unlike the two-word spelling in the data-changed sentence
            below.
        recordChangedBySomeOneElse:
          type: string
          const: 'Record changed by some one else. Please review'
          description: >-
            Shown when the row moved on between the read and the replace, and carried
            as the 409 message for the concurrency conflict. From
            app/app-transaction-type-db2/cbl/COTRTUPC.cbl line 184; "some one" is two
            words and there is no closing full stop.
        couldNotLockRecordForUpdate:
          type: string
          const: 'Could not lock record for update'
          description: >-
            Shown when the row could not be taken for update. From
            app/app-transaction-type-db2/cbl/COTRTUPC.cbl line 182, and carried as
            the 409 message for the lock condition. It is a distinct condition from
            the data-changed one and is distinguished by this sentence rather than by
            a subordinate code, because no response carries one. This is also the
            entity-agnostic literal the shared advice emits, so the sentence a caller
            receives is this text and not a paraphrase of it.
        noChangeDetectedSingleRecord:
          type: string
          const: 'No change detected with respect to values fetched.'
          description: >-
            Shown when a replace submits values identical to those read, and carried
            as the 400 message with a field entry naming the unchanged member. From
            app/app-transaction-type-db2/cbl/COTRTUPC.cbl line 180, the
            single-record maintenance screen; ends with a full stop. Distinct from
            noChangeDetectedList and not interchangeable with it. It is a refusal of
            what the caller SENT rather than a contention over a row, which is why it
            is a 400 and not a 409 -- see the Conflict response, where the reasoning
            is recorded.
        noChangeDetectedList:
          type: string
          const: 'No change detected with respect to database values.'
          description: >-
            The list screen's own wording for the same situation, from
            app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 262, and carried on the
            same 400 as its single-record sibling. It differs from
            noChangeDetectedSingleRecord by four words; both are published because
            the baseline declares both.
        recordNotFoundForKey:
          type: string
          const: 'No record found for this key in database'
          description: >-
            Shown when a read finds no row under the supplied key, and carried as
            the 404 message for the maintained collections. From
            app/app-transaction-type-db2/cbl/COTRTUPC.cbl line 176; no closing full
            stop.
        noInputReceived:
          type: string
          const: 'No input received'
          description: >-
            Shown when a required value was not supplied, and carried as a field
            entry whose state is BLANK. From
            app/app-transaction-type-db2/cbl/COTRTUPC.cbl line 178.
        nameMustBeAlphabetic:
          type: string
          const: 'Name can only contain alphabets and spaces'
          description: >-
            Shown when a description carries characters the maintenance screen will
            not accept. From app/app-transaction-type-db2/cbl/COTRTUPC.cbl line 174.
        deleteConfirmPrompt:
          type: string
          const: 'Delete this record ? Press F4 to confirm'
          description: >-
            The single-record screen's delete confirmation prompt, from
            app/app-transaction-type-db2/cbl/COTRTUPC.cbl line 152; note the space
            before the question mark. The key it names is the one that screen uses,
            which differs from the list screen's -- see deleteHighlightedPrompt.
        deleteSuccessful:
          type: string
          const: 'Delete successful.'
          description: >-
            Shown after a successful delete on the single-record screen, and the
            wording a client displays for a 204 from either delete operation. From
            app/app-transaction-type-db2/cbl/COTRTUPC.cbl line 154.
        changesValidatedPrompt:
          type: string
          const: 'Changes validated.Press F5 to save'
          description: >-
            Shown when submitted changes passed validation and await confirmation.
            From app/app-transaction-type-db2/cbl/COTRTUPC.cbl line 161; there is no
            space after the full stop.
        changesCommitted:
          type: string
          const: 'Changes committed to database'
          description: >-
            Shown after a successful replace, and the wording a client displays for a
            200 from either replace operation. From
            app/app-transaction-type-db2/cbl/COTRTUPC.cbl line 163.
        deleteHighlightedPrompt:
          type: string
          const: 'Delete HIGHLIGHTED row ? Press F10 to confirm'
          description: >-
            The list screen's delete confirmation prompt, from
            app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 242. It names a
            different key from the single-record screen's prompt, so a client
            reproducing either must use the one belonging to the screen it renders.
        updateHighlightedPrompt:
          type: string
          const: 'Update HIGHLIGHTED row. Press F10 to save'
          description: >-
            The list screen's inline update prompt, from
            app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 244. It names the same
            key as the delete prompt above, which is the list screen's convention.
        highlightedRowDeleted:
          type: string
          const: 'HIGHLIGHTED row deleted.Hit Enter to continue'
          description: >-
            Shown after an inline delete on the list screen. From
            app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 246; there is no space
            after the full stop.
        highlightedRowUpdated:
          type: string
          const: 'HIGHLIGHTED row was updated'
          description: >-
            Shown after an inline update on the list screen. From
            app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 248.
        maintenanceRecordInserted:
          type: string
          const: 'RECORD INSERTED SUCCESSFULLY'
          description: >-
            The maintenance outcome for an applied insert, from
            app/app-transaction-type-db2/cbl/COBTUPDT.cbl line 153. Upper case, as
            that program declares it.
        maintenanceRecordUpdated:
          type: string
          const: 'RECORD UPDATED SUCCESSFULLY'
          description: >-
            The maintenance outcome for an applied update, from
            app/app-transaction-type-db2/cbl/COBTUPDT.cbl line 179.
        maintenanceRecordDeleted:
          type: string
          const: 'RECORD DELETED SUCCESSFULLY'
          description: >-
            The maintenance outcome for an applied delete, from
            app/app-transaction-type-db2/cbl/COBTUPDT.cbl line 209.
        maintenanceNoRecordsFound:
          type: string
          const: 'No records found.'
          description: >-
            The maintenance outcome for an action whose key matched nothing. Declared
            twice in app/app-transaction-type-db2/cbl/COBTUPDT.cbl with identical
            text, at lines 181 and 211 -- once on the update path and once on the
            delete path -- so one member serves both.
        maintenanceTypeNotValid:
          type: string
          const: 'ERROR: TYPE NOT VALID'
          description: >-
            The maintenance outcome for an action naming a type the program will not
            accept, from app/app-transaction-type-db2/cbl/COBTUPDT.cbl line 124.
        defaultDisclosureGroupUnreadable:
          type: string
          const: 'ERROR READING DEFAULT DISCLOSURE GROUP'
          description: >-
            The LOG-side wording for a rate lookup that finds neither the requested
            group nor the DEFAULT group. From app/cbl/CBACT04C.cbl line 455, which
            the baseline reports immediately before abending through the paragraph
            invoked at line 458. It is carried across verbatim and written to the
            correlated log record; it is NOT the abend message a client receives,
            AbendDetail.external() substituting one fixed client-safe sentence for
            whatever the baseline composed. This constant is published because
            this schema is the catalogue of the baseline's verbatim strings, which is
            a separate obligation from what a failure body carries: a client rendering
            the operator view can show the baseline's own wording wherever it has the
            log record to show it from.
