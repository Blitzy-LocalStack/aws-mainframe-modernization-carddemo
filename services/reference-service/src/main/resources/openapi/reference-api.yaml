  /api/v1/reference/date-evaluations:

    description: >-
      Evaluation of a date against a mask. This is a computation over the values
      supplied in the request, not a resource that is stored, read or listed --
      nothing is persisted and no table is consulted -- which is why the
      collection carries a single read operation and no write.

    # WHY : Assumptions: this is a GET carrying its inputs as query parameters,
    #       and NOT a POST carrying them in a body, even though a POST would read
    #       more naturally for something described as an evaluation. The reason
    #       is that the authority tier is settled by HTTP method for this whole
    #       service: SecurityConfig.java requires the administrative authority
    #       for POST, PUT, PATCH and DELETE on every path, and admits a caller
    #       holding EITHER group through its read rule, businessAccess(), which
    #       requires one of the two group authorities rather than mere
    #       authentication.
    #       Refactoring Rationale: this note previously cited
    #       anyRequest().authenticated() at a fixed line number. Both halves were
    #       liabilities -- the rule was the missing-authorization defect this
    #       contract's authority model was written against, and a line number in
    #       prose goes stale on the next edit -- so the rule is now named by what
    #       it requires and no line is quoted. Publishing this as a POST
    #       would therefore have put a side-effect-free date check behind the
    #       administrative group, so the very users who edit dated fields on the
    #       account and card screens -- the callers this evaluation exists for --
    #       would each have received 403. A GET lands on the business-group tier,
    #       which is where the operation belongs.
    # WHY : Trade-offs: the two inputs travel in a URL, so they appear in access
    #       logs and in browser history, and the mask's literal separators must be
    #       percent-encoded by the client. That is accepted because a date and a
    #       date mask carry no cardholder-identifying value -- unlike the card
    #       numbers and account identifiers that the sibling contracts keep out of
    #       URLs deliberately -- and because being cacheable and safe to retry
    #       matches what this operation actually is.
    get:
      tags:
        - date-utilities
      operationId: evaluateDate
      x-required-authority: carddemo-user
      summary: Evaluate a date against a mask and return the structured verdict
      description: >-
        Evaluates the supplied date text against the supplied mask and returns
        the verdict as a structured result: a severity, a message number, the
        verdict text, and the submitted date and mask echoed back.


        This is the migrated form of app/cbl/CSUTLDTC.cbl, which takes exactly
        these inputs and produces exactly this result. Its linkage declares the
        date and the mask as ten-character fields and the result as eighty
        characters, at lines 84 to 86, and receives all three at line 88; it
        calls the platform date service through the five-line invocation at lines
        116 to 120 and maps that service's feedback onto the outcome set
        described on the DateFeedbackCode schema. The five components of this
        response are the five variable fields of that eighty-character result,
        interleaved there with the constant labels declared at its lines 45, 51
        and 54.


        The rules themselves are not restated here and are not implemented by
        this service. They live in the shared kernel, at
        services/common-lib/src/main/java/com/carddemo/common/validation/DateEditValidator.java,
        whose entry point takes a date and a mask and returns this result. This
        contract describes the request shape, the accepted masks and the result
        shape, and nothing beyond that.


        A mask this service does not recognise is not a request error: it is
        answered with 200 carrying the verdict for an unusable mask pattern --
        feedback code BAD_PIC_STRING, severity 3, message number 2518 -- because the
        baseline date service declares a condition for exactly that case at
        app/cbl/CSUTLDTC.cbl line 68 and returns it like any other feedback. That is
        why the mask parameter is typed as DateMaskInput, a bounded ten-character
        string with no enumeration: an enumerated input would have made this outcome
        unreachable, since a request validator refuses a value outside an enumeration
        before any evaluation runs. The masks this service DOES recognise are
        published separately, on the DateMask schema, so that a caller can send one
        it knows will be interpreted. A date whose width does not match the
        recognised mask it was sent with IS a request error, and is answered with
        400, because the components are read by offset and a shorter text has no
        components to read.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/DateValueQuery'
        - $ref: '#/components/parameters/DateMaskQuery'
      responses:
        '200':
          description: >-
            The verdict. A severity of zero means the date was accepted; any
            other severity means it was rejected and the verdict text names the
            reason. Note the trap recorded on the DateFeedbackCode schema: the
            accepting outcome's own condition name in the baseline reads as
            though it meant the opposite.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateEvaluationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/reference/maintenance-actions:

    description: >-
      Transaction-type maintenance applied as one submitted batch of actions,
      rather than as a sequence of individual requests. This is the migrated
      surface of app/app-transaction-type-db2/cbl/COBTUPDT.cbl, the baseline's
      reference-data maintenance program, which reads a stream of action records
      and applies an insert, an update or a delete for each.

    # WHY : Refactoring Rationale: the batch maintains transaction TYPES only, and
    #       an earlier revision also let an action address a transaction CATEGORY
    #       by carrying a category code. The baseline program has no such reach:
    #       all three of its statements name one table, at
    #       app/app-transaction-type-db2/cbl/COBTUPDT.cbl lines 138, 172 and 202,
    #       and that table is CARDDEMO.TRANSACTION_TYPE in every case. Its input
    #       record carries no category field either. Category writes remain
    #       available on the individual category operations above, so nothing is
    #       lost by removing the member -- what is removed is a capability the
    #       baseline never had, which is why it is deleted rather than registered
    #       as a divergence.
    # WHY : Assumptions: this is an ordinary synchronous administrative
    #       operation that applies the actions and answers with their outcomes.
    #       It is NOT a job-launch API: it does not accept a schedule, return a
    #       job or execution identifier, or offer anything to poll. That is not a
    #       simplification of the baseline program but a consequence of how this
    #       module is built -- pom.xml declares no batch starter and
    #       application.yml declares no spring.batch configuration, so this
    #       service has no job repository to record an execution in and no
    #       launcher to start one. Contracting a job here would describe a
    #       capability the module cannot provide.
    # WHY : Alternatives Considered: leaving this program's function to the
    #       individual create, replace and delete operations above, which between
    #       them cover every action it performs. Rejected because the baseline
    #       applies a whole submitted stream in one run and reports a per-record
    #       outcome for each, and driving the same work as a series of separate
    #       requests would give a caller no aggregate condition code and no single
    #       ordered outcome list to read.
    # WHY : Refactoring Rationale: the batch is NOT all-or-nothing, and an earlier
    #       revision said it was. The baseline continues after a failed action and
    #       keeps the actions that succeeded. Its failure paragraph, 9999-ABEND at
    #       app/app-transaction-type-db2/cbl/COBTUPDT.cbl line 230, is not an
    #       abend at all: it displays the message at line 231, moves 4 to
    #       RETURN-CODE at line 232 and EXITs at line 233. There is no STOP RUN in
    #       it, no EXEC SQL ROLLBACK anywhere in the program, and control returns
    #       to the read loop at lines 94 to 96, which reads the next record. The
    #       program then closes and stops normally at lines 97 to 99, so the
    #       statements that succeeded commit. Reporting all-or-nothing therefore
    #       described a transaction the baseline does not have, and it made the
    #       outcome list unreadable: a caller could not tell an action that DID
    #       something from one that merely would have.
    # WHY : Assumptions: continuing after a failed statement inside ONE database
    #       transaction requires a per-action savepoint, and this is the
    #       non-obvious part of the implementation this contract describes.
    #       PostgreSQL aborts the whole transaction on the first statement error,
    #       so an implementation that simply caught the exception and issued the
    #       next statement would receive an in-failed-transaction error on every
    #       action after the first failure. Each action is therefore attempted
    #       between a savepoint and its release, and a failing action is rolled
    #       back to its own savepoint; the transaction then commits the actions
    #       that succeeded. Alternatives Considered: one transaction per action.
    #       Rejected because the baseline's successes become durable together at
    #       normal termination rather than one at a time, so per-action commits
    #       would expose intermediate states no baseline reader can observe.
    # WHY : Assumptions: an unrecognised ACTION token is a request error here and a
    #       soft reject in the baseline, which is a deliberate divergence rather than
    #       an oversight. COBTUPDT reads a fixed-width file whose type byte can hold
    #       anything, so its EVALUATE at L110-L129 has a WHEN OTHER branch that reports
    #       'ERROR: TYPE NOT VALID' at L124 and continues; a JSON request is
    #       schema-validated before any handler runs, so the same input is refused with
    #       400 naming the offending position. Transformation rule T7 puts field-level
    #       rejection in the response body at 400, so this follows the rule rather than
    #       departing from it, and the divergence is registered as
    #       D-REFDATA-ACTION-TOKEN in
    #       docs/architecture/cobol-to-service-traceability.md -- which also records
    #       that the baseline's '*' comment convention at L120-L121 has no analogue,
    #       because a caller composing a JSON array simply omits an action.
    post:
      tags:
        - admin-reference-data
      operationId: applyReferenceMaintenanceActions
      x-required-authority: carddemo-admin
      summary: Apply a batch of transaction-type maintenance actions
      description: >-
        Applies the submitted actions in the order given and returns one outcome
        per action, each carrying the baseline's own wording for what happened.
        The four sentences the baseline reports are an inserted record at
        app/app-transaction-type-db2/cbl/COBTUPDT.cbl line 153, an updated record
        at line 179, a deleted record at line 209, and an unmatched key at its
        lines 181 and 211. Those texts are reproduced character for character on
        the MaintenanceActionOutcome schema.


        Every action is attempted. An action that fails is recorded as failed and
        the next action is attempted, which is what the baseline does; the actions
        that succeeded are kept. A caller therefore reads the outcome list to learn
        what each action did, and reads returnCode to learn whether any action did
        not -- 0 when all were applied and 4 when at least one was not, which is
        the aggregate the baseline leaves behind.


        A submission refused before any action runs answers 400, and each entry in
        that body's fieldErrors array names the offending member by its position in
        the submitted array rather than by member name alone -- `actions[0].typeCd`,
        `actions[1].description` and so on. This is stated because the array accepts
        up to 500 actions, so an entry naming `description` with no position would
        leave a caller to find the faulty action by bisection. The two conditions a
        caller meets most often are an action whose token is not one of the three
        names, and an INSERT or UPDATE supplying no description: the second carries
        the reference tree's own blank-field sentence, published on the
        ReferenceMessageCatalogue schema as noInputReceived, with the BLANK state.


        A record naming an action the program will not accept is reported by the
        baseline at line 124 with its own sentence. That sentence cannot be an
        outcome here, because the action enumeration refuses an unrecognised value
        before any action runs: such a request is a 400 and no action is attempted.
        The sentence is published on the ReferenceMessageCatalogue schema so it is
        not lost.


        The response status is 200 whenever the submission was well formed and
        authorised, whatever the individual actions did.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        description: >-
          The actions to apply, in the order they are to be applied.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceActionBatchRequest'
      responses:
        '200':
          description: >-
            The batch ran. One outcome is returned per submitted action, in the
            submitted order, together with the aggregate return code. This status
            does not assert that every action succeeded -- returnCode and the
            per-action outcome say that -- because the baseline's own aggregate for
            a batch containing a failed action is a WARNING condition code and not
            a failed run.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceActionBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A JSON Web Token issued by the configured identity provider and validated
        as a resource-server token. Its cognito:groups claim is converted to
        authorities by
        services/common-lib/src/main/java/com/carddemo/common/security/JwtRoleConverter.java,
        where the baseline user type 'A' becomes carddemo-admin and 'U' becomes
        carddemo-user. Presenting no usable token yields 401; presenting a valid
        token that lacks the authority an operation requires yields 403.

  parameters:

    TypeCdPath:
      name: typeCd
      in: path
      required: true
      description: >-
        The two-digit transaction type code identifying the type, or the parent
        type of the category, being addressed. Seven codes are seeded, '01'
        through '07'.
      schema:
        $ref: '#/components/schemas/TransactionTypeCode'

    CatCdPath:
      name: catCd
      in: path
      required: true
      description: >-
        The four-digit transaction category code, unique only within its parent
        type. Sent with its leading zeros exactly as stored.
      schema:
        $ref: '#/components/schemas/TransactionCategoryCode'

    AcctGroupIdPath:
      name: acctGroupId
      in: path
      required: true
      description: >-
        The account group whose rate is sought. Send it without trailing padding;
        the stored column is ten characters and pads on comparison, so 'DEFAULT'
        and its padded form address the same rows.
      schema:
        $ref: '#/components/schemas/AccountGroupId'

    TranTypeCdPath:
      name: tranTypeCd
      in: path
      required: true
      description: >-
        The two-digit transaction type code of the rate being sought. It is the
        second component of the disclosure-group key.
      schema:
        $ref: '#/components/schemas/TransactionTypeCode'

    TranCatCdPath:
      name: tranCatCd
      in: path
      required: true
      description: >-
        The four-digit transaction category code of the rate being sought. It is
        the third component of the disclosure-group key.
      schema:
        $ref: '#/components/schemas/TransactionCategoryCode'

    AreaCdPath:
      name: areaCd
      in: path
      required: true
      description: >-
        The three-digit phone area code whose acceptance is being tested.
      schema:
        $ref: '#/components/schemas/PhoneAreaCodeValue'

    StateCdPath:
      name: stateCd
      in: path
      required: true
      description: >-
        The two-character state code whose acceptance is being tested, in upper
        case.
      schema:
        $ref: '#/components/schemas/StateCodeValue'

    StateZipCdPath:
      name: stateZipCd
      in: path
      required: true
      description: >-
        The four-character combination of a two-character state code and the two
        leading digits of a postal code, in that order and with no separator.
      schema:
        $ref: '#/components/schemas/StateZipPrefixValue'

    # WHY : Alternatives Considered: paging is by key and never by ordinal --
    #       there is no page number, page size, offset or total-pages parameter
    #       anywhere in this document, and none may be added. Offset paging was
    #       rejected on a specific behavioural ground rather than a general
    #       preference: under a concurrent insert or delete, a request for the
    #       next window by ordinal SKIPS rows and REPEATS rows, because the rows
    #       before the offset are re-counted after the set has changed. Browse by
    #       key cannot do either, because the position it resumes from is a key in
    #       the ordered set rather than a count of what preceded it. Reference
    #       data is maintained through the very operations in this document, so a
    #       page walked by one caller while another creates a type is not a
    #       hypothetical case.
    # WHY : Assumptions: the two positions the baseline maintains are what this
    #       parameter carries, so the migration is one-to-one rather than an
    #       approximation. app/app-transaction-type-db2/cbl/COTRTLIC.cbl declares
    #       a forward cursor at its lines 338 to 352 and a backward cursor at
    #       lines 354 to 368, and each is positioned by a single start-key host
    #       variable rather than by any count of rows.
    # WHY : Assumptions: the asymmetry between the two directions is PRESERVED
    #       and must not be normalised. The forward cursor selects rows whose key
    #       is greater than or EQUAL to the position it is given, at line 343, and
    #       orders ascending at line 351; the backward cursor selects rows whose
    #       key is STRICTLY LESS than the position it is given, at line 359, and
    #       orders descending at line 367. The two therefore treat the position
    #       they are handed differently -- inclusive going forward, exclusive
    #       going back -- and that difference is what makes the pages meet exactly
    #       once each. Rewriting both to one convention would shift which record
    #       begins each page by one row, so a caller walking the set forward and
    #       then back would see a row twice or not at all.
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        The paging position to continue from: copy the lastKey member of the page
        in hand to advance past it, or the firstKey member to retreat from it, and
        state the matching direction. Omit it, and the direction, to obtain the
        opening page. The value is opaque and must be echoed exactly as received;
        it is not a type code, a category code or a row ordinal, and it cannot be
        constructed, parsed or compared by a client. A cursor that cannot be
        opened, or one replayed by a different caller or against a different
        filter, a different collection or the direction it was not minted for, is
        reported as 400 rather than answered with the wrong page. A direction sent
        WITHOUT a cursor is likewise a 400, keyed by the direction parameter: the
        pair travels together or not at all, and answering the opening page for a
        backward request would let a client loop over the first page while believing
        it was retreating through the set.
      schema:
        $ref: '#/components/schemas/CursorToken'

    PagingDirection:
      name: direction
      in: query
      required: false
      description: >-
        Which way to move from the supplied cursor. It is meaningful only
        alongside a cursor, and the two are sent together or not at all -- sent
        alone it is refused with 400 rather than silently ignored. Reading
        next takes rows from the cursor's position forward in ascending key order;
        reading previous takes rows before it in descending key order and presents
        them ascending, which is the migrated form of the backward cursor at
        app/app-transaction-type-db2/cbl/COTRTLIC.cbl lines 354 to 368. The two
        differ in whether the cursor's own position is included, as recorded on
        the cursor parameter.
      schema:
        $ref: '#/components/schemas/PageDirection'

    TypeCodeFilter:
      name: typeCode
      in: query
      required: false
      description: >-
        Narrows the page to the single transaction type whose code equals this
        value. This is the migrated form of the optional equality predicate the
        baseline carries in both cursors, at
        app/app-transaction-type-db2/cbl/COTRTLIC.cbl lines 344 to 345 going
        forward and 360 to 361 going back, each gated on an edit flag whose
        unset state passes every row through -- the pass-through arms at lines 346
        and 362. Omitting this parameter is that unset state, and so is sending
        '00': the baseline collapses low values, spaces and zeros into one
        filter-blank state at lines 1101 to 1106. That is why this parameter takes
        TransactionTypeCodeFilter rather than the stored-code schema, which refuses
        '00' outright. A value that is not two digits is reported as 400 carrying the
        baseline's own wording, which is recorded on the ReferenceMessageCatalogue
        schema.
      schema:
        $ref: '#/components/schemas/TransactionTypeCodeFilter'

    DescriptionFilter:
      name: description
      in: query
      required: false
      description: >-
        Narrows the page to rows whose description CONTAINS this text. The baseline
        semantic is a SQL LIKE, at app/app-transaction-type-db2/cbl/COTRTLIC.cbl
        lines 347 to 349 going forward and 363 to 365 going back, gated on a second
        edit flag with the same pass-through arrangement at lines 350 and 366 -- but
        the wildcards are supplied by the SERVICE and not by the caller: the baseline
        strings a percent sign before and after the trimmed input at lines 1155 to
        1163 before binding it. A value with no wildcard of its own therefore matches
        any description containing it, not only one equal to it. Send the text being
        searched for, not a pattern. This parameter takes ReferenceDescriptionFilter
        rather than the stored-description schema, because the baseline applies none
        of its maintenance-screen character rules to a filter.
      schema:
        $ref: '#/components/schemas/ReferenceDescriptionFilter'

    CodeClassFilter:
      name: codeClass
      in: query
      required: false
      description: >-
        Narrows the page to one of the two phone-area-code classifications.
        Omitting it returns the whole seeded list, which is the membership test
        account-service actually performs.
      schema:
        $ref: '#/components/schemas/PhoneAreaCodeClass'

    DateValueQuery:
      name: date
      in: query
      required: true
      description: >-
        The date text to evaluate. Its width must match the mask it is sent with:
        eight characters for the unseparated mask and ten for the separated one,
        and where the mask declares separators those positions must hold a hyphen.
        A width that does not match the mask is reported as 400, because the
        components are read by offset.
      schema:
        type: string
        minLength: 8
        maxLength: 10
        description: >-
          Eight or ten characters of date text, matching the mask sent with it.
        examples:
          - '2022-07-18'
          - '20220718'

    DateMaskQuery:
      name: mask
      in: query
      required: false
      description: >-
        The mask describing the date text. Defaults to the separated ten-character
        mask when omitted. A mask this service does not recognise is answered with
        200 carrying the unusable-pattern verdict rather than 400, for the reason
        given on the evaluation operation -- which is why the schema here is the
        wider DateMaskInput and not the enumeration of recognised masks.
      schema:
        $ref: '#/components/schemas/DateMaskInput'

    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        Identity of the unit of work this request belongs to, propagated into the
        service log record and echoed on the response. Supply a value to tie this
        request to work already in progress upstream; omit it and the service
        mints one. A value that does not fit the published bound and character set
        is refused with 400 before any handler runs. A value whose shape is that of a protected identifier -- only digits and the
        three separators, with nine or more digits -- is refused on the same terms, because this
        identity is echoed and logged. The refusal carries the shared problem body
        and the response correlation header, the same as any other 400, and it names
        the rule it applied without ever repeating the value it refused.
      # WHY : Measured: the shared CorrelationId schema admits the EMPTY string, because
      #       ApiError normalises an absent identity to "" at L619 and every problem
      #       document carries the member, so the schema a BODY member names has to admit
      #       it. A REQUEST header must not: conformsWithin in CorrelationIdFilter
      #       declines an empty value and the filter then answers 400. This parameter
      #       therefore narrows the shared schema by one facet instead of restating its
      #       alphabet and width, which would be a second statement of both. Omitting the
      #       header entirely stays valid -- that is governed by required above.
      schema:
        allOf:
          - $ref: '#/components/schemas/CorrelationId'
          - minLength: 1

  headers:

    XCorrelationId:
      description: >-
        Identity of the unit of work that produced this response. Echoed from the
        request where the caller supplied a conforming value, and minted by the
        service where it did not. Quote it when reporting a failure, because it is
        the route from this response to the operational record.
      required: true
      schema:
        $ref: '#/components/schemas/CorrelationId'

    # WHY : Refactoring Rationale: this header is declared because the service
    #       actually sends it and an earlier revision of this document did not say
    #       so. The 401 is rendered by the shared handler
    #       common/error/ApiErrorSecurityHandlers.UnauthenticatedEntryPoint, which
    #       delegates to the framework's BearerTokenAuthenticationEntryPoint FIRST
    #       and only then writes the body, precisely so this challenge is composed
    #       exactly as the OAuth 2.0 bearer-token specification requires. A client's
    #       token-refresh logic reads this header, so leaving it undeclared left a
    #       generated client with no typed access to the one header it needs on the
    #       one response it needs it on.
    # WHY : Assumptions: the value is not enumerated and no pattern is written for
    #       it. The framework composes it from the error it detected -- a bare
    #       scheme when no token was presented, and a scheme with an error code and
    #       description when one was presented and rejected -- so pinning a shape
    #       here would either be wrong for one of those two cases or would have to
    #       be widened until it constrained nothing.
    WwwAuthenticate:
      description: >-
        The bearer-token challenge for this refusal, composed by the resource
        server from the error it detected. A bare scheme when no token was
        presented; a scheme carrying an error code and description when a token was
        presented and rejected. It accompanies the problem body rather than
        replacing it.
      required: true
      schema:
        type: string
      example: Bearer

  responses:

    BadRequest:
      description: >-
        The request could not be accepted as supplied. This covers a malformed or
        out-of-range path or query value, a body that fails a declared constraint,
        a cursor that cannot be opened or was replayed by another caller or against
        the wrong filter, collection or direction, a paging direction sent without
        the cursor it would move from, a correlation header outside the published
        bound,
        and a write whose submitted values are identical to the ones already stored.
        The fieldErrors array names every offending field rather than only the first,
        for the reason recorded on the FieldError schema.


        The unchanged-submission refusal is the one member of that list that is a
        business rule rather than a syntactic check, and it belongs here rather than
        on 409 because it is decided from the request alone, before any row is
        contended: the baseline compares the submitted values with the ones it
        fetched and re-displays without writing. Its sentence is carried verbatim and
        is published on the ReferenceMessageCatalogue schema in both of the two
        wordings the baseline declares -- noChangeDetectedSingleRecord for a
        single-record replace and noChangeDetectedList for the list screen -- with a
        field entry naming the member that was resubmitted unchanged.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    # WHY : Refactoring Rationale: this response now states WHICH code and sentence
    #       the body carries, because an earlier revision promised the shared problem
    #       shape without naming its contents and the security chain did not produce
    #       one at all. A refusal decided by the filter chain never reaches a
    #       controller, so it never reaches the shared @RestControllerAdvice, and the
    #       framework default answered with a status and a challenge header and no
    #       body -- the exact opposite of what this response declared. The chain now
    #       installs common/error/ApiErrorSecurityHandlers, whose 401 renderer emits
    #       CARDDEMO-0401 with the sentence below.
    # WHY : Assumptions: the correlation identifier in the body is the SAME value as
    #       the header beside it and as the log line for this refusal, the renderer
    #       reading it from the diagnostic context the correlation filter established
    #       ahead of the security chain. That equality is the whole reason the header
    #       is required on a response whose body names no reason.
    Unauthorized:
      description: >-
        No usable bearer token was presented: the header was absent, the token was
        malformed, its signature or issuer did not validate, or it had expired.
        This is distinct from 403 and from 409, and the distinction is not
        cosmetic -- a caller acts on 401 by obtaining a token, on 403 by obtaining
        a different one, and on 409 by changing its request. No body member names
        the group the caller lacks, because at this point no verified identity
        exists to compare against one. The body carries code CARDDEMO-0401 and the
        sentence "Sign on to continue", identically on all four of those causes,
        alongside the bearer-token challenge below.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Forbidden:
      description: >-
        A valid token was presented, but it does not carry the authority this
        operation requires. In practice this is a token holding only carddemo-user
        sent to one of the administrative write operations, which
        SecurityConfig.java restricts by method at its lines 99 to 106. The
        identity is established and the request is well formed; only the authority
        is missing, which is why this is neither 401 nor 400. The body carries code
        CARDDEMO-0403 and the sentence "Not authorized for this operation" -- the
        same pair the shared advice publishes for a denial decided by a
        method-security check, so a caller cannot tell from the response where in
        the stack the authority was checked.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    ServiceUnavailable:
      description: >-
        The operation was refused because the environment is not currently
        accepting mutating work. The nightly batch chain owns the data for the
        duration of its window, and NOTHING WAS APPLIED -- the refusal is issued
        before the handler runs, so no part of the request took effect. A caller
        that repeats the same request unchanged once the window reopens succeeds.


        This is the target equivalent of the reference quiesce. app/jcl/CLOSEFIL.jcl
        lines 26 to 30 closed five VSAM files to the CICS region for the duration of
        the posting chain and app/jcl/OPENFIL.jcl reopened them, so a write attempted
        in between received a file-status error and abended. The migrated bracket
        deliberately closes WRITES only, so every read this service publishes keeps
        answering while the window is closed.


        Assumptions: 503 rather than 409 or 403, because the distinction is the one a
        client acts on. The request is well formed and its caller is entitled to make
        it; only the window in which it may be applied is absent. No Retry-After is
        sent, because the window is reopened by a state machine whose remaining work
        this service cannot see, so any value would be a guess a client would then
        schedule against.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFound:
      description: >-
        No row exists under the key addressed. For the three address lookups this
        is an ANSWER rather than a failure -- absence from a seeded allow-list is
        what the baseline's membership test reports when it evaluates false -- and
        for the maintained collections it is the migrated form of the baseline
        message recorded on the ReferenceMessageCatalogue schema. An empty list
        page is never reported this way: a collection with no matching row exists
        and is empty, so it is a 200 carrying an empty page.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    # WHY : Refactoring Rationale: the referential refusal is reported as 409 and
    #       never as 500, and this reproduces the baseline's own treatment of it
    #       rather than introducing a lenient one. The baseline does not regard
    #       the refusal as a fault: at
    #       app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 1914 it branches on
    #       the specific database code for a restricted delete, sets its
    #       delete-requested state at line 1915, moves an instruction to the user
    #       at line 1919 and leaves through the NORMAL exit at line 1925 --
    #       whereas its catch-all arm at line 1926 reports a failed delete at line
    #       1929 instead. COTRTUPC.cbl takes the same distinguished branch at its
    #       line 1638. Two outcomes, separated by the baseline, and therefore
    #       separated here. A 500 carrying a driver stack trace would collapse the
    #       two and would tell a user that the system had broken when in fact it
    #       had declined, which is the one reading the baseline rules out.
    # WHY : Assumptions: the mapping from database state to this status is
    #       INHERITED and is not implemented in this service. Every link of the
    #       chain is determined elsewhere: the foreign key declared ON DELETE
    #       RESTRICT by
    #       db/migration/V1__reference.sql -- stated in the baseline at
    #       app/app-transaction-type-db2/ddl/TRNTYCAT.ddl lines 6 to 7 and again
    #       as an ALTER TABLE at that tree's ctl/DB2CREAT.ctl lines 96 to 99 --
    #       raises SQLSTATE 23503, Spring surfaces that as
    #       DataIntegrityViolationException, and the GlobalExceptionHandler in
    #       common-lib turns it into this status. reference-service declares no
    #       controller advice of its own, so the mapping cannot drift per service.
    # WHY : Alternatives Considered: 412 for the optimistic-lock conflict, and it
    #       was rejected. 412 states that a precondition the CLIENT supplied in a
    #       request header was not met, which would oblige every caller to send a
    #       conditional header and would make the version an HTTP-level entity tag
    #       rather than a member of the record. The baseline's contract is neither
    #       of those: it compares a before-image it captured itself and reports the
    #       result as an ordinary screen message. 409 says what actually happened
    #       -- the request conflicts with the stored state -- without inventing a
    #       header contract the baseline never had.
    # WHY : Refactoring Rationale: this response carries the SHARED problem shape
    #       and nothing more. An earlier revision declared a ReferenceConflictError
    #       that added a conflictingVersion member to ApiError through allOf. No
    #       document could satisfy that schema: the ApiError branch seals itself
    #       with additionalProperties false, and each branch of an allOf is
    #       evaluated against the WHOLE instance, so the very member the second
    #       branch contributed was rejected by the first. Every example carrying it
    #       was therefore invalid against the schema that declared it, and a
    #       generator would have emitted a type no response could ever validate
    #       against. The version a caller lost to is still reported -- as an entry
    #       in the fieldErrors array, which is exactly what
    #       common-lib/src/main/java/com/carddemo/common/error/GlobalExceptionHandler.java
    #       composes at its conflict builder today.
    # WHY : Alternatives Considered: admitting conflictingVersion on ApiError
    #       itself, or dropping its additionalProperties false. Both were rejected.
    #       The shape is shared by five contracts and by one canonical Java record
    #       of eleven components, so a member added for one status in one context
    #       would have to be declared -- and documented as absent -- on every other
    #       response in all five; and the sealing is what lets a client treat an
    #       unexpected member as a defect rather than as an extension it must
    #       tolerate. One entry inside the array every client already parses says
    #       the same thing and keeps the shape satisfiable.
    # WHY : Refactoring Rationale: the conditions enumerated below are exactly the
    #       ones the shared advice DISTINGUISHES, and each sentence below is the one
    #       it emits. An earlier revision named four conditions, published three
    #       examples that did not match them, and required a per-condition
    #       secondaryCode that nothing composes -- ApiError.ofConflict fixes that
    #       member at the empty string for every conflict, so a client branching on
    #       it would have branched on a value that is always equal. The fourth
    #       condition it named, a key that already exists on create, is not a
    #       condition the baseline distinguishes at all: the insert at
    #       app/app-transaction-type-db2/cbl/COBTUPDT.cbl line 137 has exactly two
    #       arms, a zero SQLCODE at line 152 and a negative one at line 154, so a
    #       duplicate key is reported by the same generic arm as any other negative
    #       code and reaches this status through the same integrity path as the
    #       referential refusal.
    # WHY : Refactoring Rationale: the two sentences that are not entity-specific
    #       are now the BASELINE literals, so the examples below quote text that is
    #       actually returned. The shared advice previously emitted a paraphrase for
    #       both -- an inserted definite article in the lock sentence, and a
    #       restatement of the rule in place of the referential one -- which made
    #       every contract quoting the baseline wording describe a body it would not
    #       return. Both constants were corrected in
    #       common-lib/src/main/java/com/carddemo/common/error/GlobalExceptionHandler.java
    #       against app/cbl/COCRDUPC.cbl lines 205 to 206 with
    #       app/app-transaction-type-db2/cbl/COTRTUPC.cbl lines 181 to 182, and
    #       against COTRTLIC.cbl line 1919 with COTRTUPC.cbl line 1641,
    #       respectively. Neither of those two baseline sentences names a row, so
    #       nothing forced a paraphrase in the first place.
    # WHY : Trade-offs: the referential sentence ends with a bare colon and nothing
    #       follows it. The baseline retains the colon because it prefixes the
    #       database's own diagnostic; appending that diagnostic here would name the
    #       schema, the table and the constraint on a body the caller reads, so the
    #       sentence stops at the colon and the diagnostic goes to the operational
    #       record instead. What is given up is a sentence that reads as though
    #       something were missing; what it buys is verbatim baseline text with no
    #       internal detail disclosed.
    # WHY : Refactoring Rationale: the no-change outcome is reported as 400 and no
    #       longer as 409. It is a refusal of what the caller SENT, decided before
    #       any row is contended -- the baseline compares the submitted values with
    #       the ones it fetched and re-displays without writing -- so it travels the
    #       shared kernel's ClientInputException path, which answers 400 with a
    #       field entry. Publishing it here implied a contention that never occurred
    #       and needed a fifth condition on a status whose subsystem this kernel
    #       fixes at RELATIONAL, which a comparison performed in the application is
    #       not. Both of its verbatim sentences are unchanged and stay on the
    #       ReferenceMessageCatalogue schema.
    # WHY : Assumptions: the two near-identical no-change sentences are BOTH
    #       carried and must never be merged into one. The single-record screen
    #       ends its sentence "values fetched." at
    #       app/app-transaction-type-db2/cbl/COTRTUPC.cbl line 180, and the list
    #       screen ends its own "database values." at COTRTLIC.cbl line 262. They
    #       differ by four words and by which program a user was on when they saw
    #       one, and the migration reproduces user-visible text verbatim keyed by
    #       the program that owns it, so collapsing them would silently retire one
    #       of two strings the baseline distinguishes.
    Conflict:
      description: >-
        The request conflicts with the state already stored. FOUR conditions reach
        this status and are never merged: a row that changed after the caller read
        it, a row that could not be taken for update, a delete refused while rows
        in another table still reference the target, and an insert refused by the
        integrity rules of the table it named. A caller acts differently on each --
        re-read and resubmit, retry unchanged, remove the dependents first, or
        change the key it supplied -- and the sentence is what discriminates them,
        because the shared advice composes one sentence per condition and no
        subordinate identifier. All four therefore carry code CARDDEMO-0409,
        severity WARNING, subsystem RELATIONAL and an EMPTY secondaryCode. Only the
        concurrency conflict reports a version, and it reports it as a fieldErrors
        entry keyed "version" whose message is the version the row now holds, so a
        caller can re-read, compare and resubmit against that value rather than
        guessing; the other three carry an empty fieldErrors array, because none of
        them contends on a version -- a refused insert wrote nothing, so there is no
        revision for a caller to compare against. The body is the shared error
        shape with no additional member.


        The last two are separated because the BASELINE separates them, and it
        separates them by the statement rather than by the constraint. One
        foreign key bites in two directions: a delete of a transaction type that
        categories still reference, and an insert of a category naming a type
        that does not exist. Both arrive as SQLSTATE 23503, and
        app/app-transaction-type-db2/cbl/COTRTUPC.cbl answers them in two
        different paragraphs -- the child-records sentence at line 1641, reached
        only from the code a restricted DELETE raises, and the table-naming
        sentence at lines 1607 to 1618, reached from every non-zero outcome of an
        INSERT. Answering both with the first told a caller that named an absent
        parent, or reused a key, to delete dependent rows it had not created. The
        change is registered as D-REFERENCE-INTEGRITY-SENTENCE in
        docs/architecture/cobol-to-service-traceability.md.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            childRecordsExist:
              summary: The type still has categories beneath it
              description: >-
                The referential refusal, raised by the ON DELETE RESTRICT foreign
                key and surfaced by the shared advice. The sentence is reproduced
                character for character from
                app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 1919 and
                COTRTUPC.cbl line 1641, retaining its closing colon with nothing
                appended after it. The fieldErrors array is empty because this
                condition contends on a relationship rather than on a version, and
                an entry naming a field the advice does not know would be a value
                invented for the shape's sake; the addressed key is already in the
                path.
              value:
                code: CARDDEMO-0409
                secondaryCode: ''
                message: 'Please delete associated child records first:'
                severity: WARNING
                subsystem: RELATIONAL
                status: 409
                correlationId: 4F1C0E423A554D219B7E6C0F
                path: /api/v1/reference/transaction-types/01
                timestamp: '2026-08-06 09:16:44.902355'
                fieldErrors: []
                abend: null
            insertRefusedByTheTable:
              summary: The insert was refused by the table it named
              description: >-
                The insert refusal, raised either by the primary key of the table
                being written or by the foreign key it points at, and surfaced by
                the shared advice. Every character outside the table name is
                reproduced from the two literals the baseline composes at lines
                1610 and 1611 of
                app/app-transaction-type-db2/cbl/COTRTUPC.cbl, retaining the
                capitalised 'Table' that arm writes and the closing colon with
                nothing appended after it -- the baseline follows that colon with
                the database's own code and diagnostic, and carrying those into a
                body would name the constraint and quote the key that violated it
                back to whoever holds the response. The table named is the
                baseline's own unqualified name, so no response discloses the
                schema or table this migration created. The example below is the
                type table; a refused category insert carries
                TRANSACTION_TYPE_CATEGORY in the same position, from line 1 of
                app/app-transaction-type-db2/ddl/TRNTYCAT.ddl. The fieldErrors
                array is empty because nothing was written, so there is no
                revision to report, and the key the caller supplied is already in
                the request it sent.
              value:
                code: CARDDEMO-0409
                secondaryCode: ''
                message: 'Error inserting record into: TRANSACTION_TYPE Table. SQLCODE:'
                severity: WARNING
                subsystem: RELATIONAL
                status: 409
                correlationId: 8B5D2A160E7F4C33A1D94E60
                path: /api/v1/reference/transaction-types
                timestamp: '2026-08-06 09:16:51.318204'
                fieldErrors: []
                abend: null
            recordChangedByAnotherCaller:
              summary: The row changed after the caller read it
              description: >-
                The optimistic-concurrency conflict, raised either by the
                persistence provider's version check or by a service that compared a
                before-image itself. The sentence is reproduced character for
                character from app/app-transaction-type-db2/cbl/COTRTUPC.cbl line
                184, retaining its two-word 'some one' and its absence of a closing
                full stop; the same literal appears at app/cbl/COACTUPC.cbl line
                522, so it is shared rather than context-specific. The version now
                stored is the MESSAGE of the version entry -- the digits and nothing
                else -- which is where the shared problem shape puts it.
              value:
                code: CARDDEMO-0409
                secondaryCode: ''
                message: Record changed by some one else. Please review
                severity: WARNING
                subsystem: RELATIONAL
                status: 409
                correlationId: 6D3E88B17C024A94B5DF1E47
                path: /api/v1/reference/transaction-types/01
                timestamp: '2026-08-06 09:17:02.114820'
                fieldErrors:
                  - field: version
                    state: NOT_OK
                    message: '4'
                abend: null
            couldNotLockRowForUpdate:
              summary: The row could not be taken for update
              description: >-
                The pessimistic-lock refusal. Nothing was compared and nothing was
                written, so there is no version to report and the array is empty; a
                caller retries the same request unchanged rather than re-reading.
                The sentence is reproduced character for character from
                app/app-transaction-type-db2/cbl/COTRTUPC.cbl lines 181 to 182,
                which names no row -- the same literal the card context quotes from
                app/cbl/COCRDUPC.cbl lines 205 to 206. The two row-naming variants
                the baseline also declares, for the account and customer rows,
                belong to the context that knows which row it was writing and are
                not this response's text.
              value:
                code: CARDDEMO-0409
                secondaryCode: ''
                message: Could not lock record for update
                severity: WARNING
                subsystem: RELATIONAL
                status: 409
                correlationId: 9A2B41CE77D0463FA0C5E8B1
                path: /api/v1/reference/transaction-types/01
                timestamp: '2026-08-06 09:18:20.550013'
                fieldErrors: []
                abend: null

    InternalServerError:
      description: >-
        The request could not be completed for a reason the service does not
        attribute to the caller. Nothing in the body names an internal detail: the
        correlation identifier is the route to the operational record, which is
        where diagnostic information lives. None of the outcomes the baseline
        distinguishes reaches this status -- the referential refusal, the
        concurrency conflict, the failed lock and the unmatched key are each
        reported with their own status above -- so a response here means an
        unclassified fault and not a business outcome.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    # WHY : Refactoring Rationale: a SECOND definition of MethodNotAllowed, NotAcceptable and
    #   UnsupportedMediaType stood here and all three are withdrawn. They were a whole earlier
    #   generation of the same three components, merged alongside the surviving generation, and a
    #   duplicate mapping key is the most deceptive shape this can take: YAML resolves a repeated
    #   key to the LAST definition, so one of every pair was dead text that still read as the
    #   contract, and no schema-shaped test could tell -- both copies were well formed and both
    #   carried the correlation header. The survivors are the generation that states the Allow
    #   header's composition rule with an example and attributes the pinned content type to the
    #   shared advice rather than to a per-service handler; the withdrawn copies said only that
    #   Allow is 'comma separated'. Detected with a duplicate-key-aware composer, because
    #   yaml.safe_load hides the condition by construction.
    PayloadTooLarge:
      description: >-
        The request body exceeds the byte ceiling this service accepts, and
        carries the machine code CARDDEMO-0413. The ceiling is 65536 bytes unless
        the deployment names another under carddemo.web.max-request-body-bytes,
        and it is enforced by a servlet filter ordered ahead of the security
        chain rather than by a handler -- which is why it applies to every
        operation that accepts a body and why the refusal reaches a caller that
        presented no token at all.


        Assumptions: the body of this response carries no fieldErrors entry and
        cannot. The refusal is raised before any member is parsed, so there is no
        bound object to have fields; the message names the ceiling and the size
        the request declared, which is what distinguishes a misconfigured client
        from a deliberate flood.


        Assumptions: a body that declares no length is not refused for that alone.
        It is read up to the ceiling and refused only if it exceeds it, and the
        bytes already read are forwarded to the handler when it does not, so a
        chunked request within the bound is served normally. For that case the
        message states that the body declares no length and exceeds the bound,
        because the exact size is the one thing that was never learned.


        Assumptions: this response carries the correlation identifier like every
        other, and that is a property of filter ORDER rather than of this filter.
        The correlation filter is registered one position ahead of it and has
        already put the identifier on the response before the body is written.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'


    # WHY : Refactoring Rationale: the transport refusals below were UNDECLARED while the shared
    #       advice in services/common-lib produces every one of them, so each was reachable on
    #       every operation of this contract with no published shape. A client had no branch for
    #       them: ui/src/api/client.ts could only treat each as an unrecognised body. Declaring
    #       them here and handling them there are two halves of one correction, and declaring one
    #       half alone would have documented a response no caller could recognise.
    # WHY : Assumptions: each carries the same ApiError shape as every other refusal of this
    #       contract, with its own machine code -- CARDDEMO-0405, CARDDEMO-0406 and
    #       CARDDEMO-0415. A distinct code per condition is what lets a client branch without
    #       reading the sentence, which is the same reason the 400 and the 401 do not share one.
    # WHY : Assumptions: the body is declared application/json because that is what the shared
    #       advice writes -- it returns a plain ApiError record and this build registers no
    #       problem+json converter -- and because the 406 arm pins MediaType.APPLICATION_JSON
    #       explicitly, which is the single call that lets a body be produced at all for a caller
    #       whose Accept header matched nothing.
    MethodNotAllowed:
      description: >-
        The route addressed does not publish the method the request named. The response
        carries an Allow header naming the methods it does publish, which is where a client
        reads them; the body does not repeat that list, so the two cannot disagree.


        Assumptions: this has no reference counterpart. A 3270 terminal cannot address a
        transaction with a verb the program did not define, so no reference literal or
        condition name corresponds to this outcome. It exists because a target route is
        addressed by callers this system does not control.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
        Allow:
          description: >-
            The methods the addressed route publishes, joined with a comma and a space.
            Composed from the methods the framework's handler mapping reports, which are
            server-authored; the method the caller USED is echoed nowhere. It is omitted
            rather than sent empty when the framework reported no supported set, because an
            empty Allow states that the route supports no method at all, which would be a
            different and false claim.
          required: false
          schema:
            type: string
            example: 'GET, PUT'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    UnsupportedMediaType:
      description: >-
        The request carried a body in a media type this route does not accept, or carried a
        body with no Content-Type at all. Every operation of this contract that accepts a
        body accepts application/json and nothing else.


        The body carries no fieldErrors entry and cannot: the refusal is raised before any
        member has been parsed, so there is no bound object to have fields. That is why this
        is a distinct code from CARDDEMO-0400 rather than a 400 with an empty array, which a
        caller could not tell from a body it had mis-spelled.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotAcceptable:
      description: >-
        The request's Accept header names no media type this service can produce. The shared
        advice answers with JSON and nothing else.


        Assumptions: the body of this response is itself application/json, which is a type
        the caller has just said it will not accept. That is deliberate. The alternative is
        an empty 406, which carries neither the machine code nor the correlation identifier
        a support enquiry needs and tells the caller nothing about which header to change.
        The content type is set explicitly by the shared advice for a second reason recorded
        there: a body left to content negotiation would be negotiated against the same
        Accept header that already matched nothing, and the request would then be forwarded
        to the container error path, which this service publishes no route for.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'


  schemas:

    # WHY : Assumptions: two digits held as CHARACTERS, and every source in the
    #       baseline agrees, so unlike the category code below there is no tension
    #       to resolve here. The copybook declares it alphanumeric at
    #       app/cpy/CVTRA03Y.cpy line 5; the Db2 table declares CHAR(2) at
    #       app/app-transaction-type-db2/ddl/TRNTYPE.ddl line 2; and the generated
    #       host structure carries it as a character field at that tree's
    #       dcl/DCLTRTYP.dcl line 38. The digits-only pattern is not an invention
    #       either: the baseline refuses a non-numeric filter value with the
    #       message at app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 1116,
    #       which names a two-digit number outright.
    # WHY : Refactoring Rationale: this schema refuses '00', which an earlier
    #       revision admitted. The baseline's own edit for a STORED type code is a
    #       three-part test at app/app-transaction-type-db2/cbl/COTRTUPC.cbl lines
    #       907 to 966: blank is refused at lines 912 to 917, non-numeric at lines
    #       934 to 935, and a value whose NUMVAL is zero at lines 954 to 955, each
    #       with its own composed sentence. Admitting '00' therefore described a key
    #       the baseline will not let a user create, and it did so on the very
    #       schema the create and replace bodies use.
    # WHY : Refactoring Rationale: the same schema was also reused for the
    #       type-code FILTER on the list operations, where '00' is not merely legal
    #       but MEANINGFUL: app/app-transaction-type-db2/cbl/COTRTLIC.cbl lines 1101
    #       to 1106 treat low-values, spaces and ZEROS alike, set the filter-blank
    #       flag and move zeroes into the filter, and the cursor at lines 344 to 346
    #       then applies no type restriction at all. One schema cannot both refuse a
    #       value and give it a meaning, which is why the filter is now
    #       TransactionTypeCodeFilter below.
    # WHY : Alternatives Considered: keeping one schema and expressing the
    #       difference in prose on each parameter. Rejected because a generated
    #       client and a request validator read the schema and not the prose, so the
    #       stored form would have kept accepting a key that cannot exist and the
    #       filter would have kept refusing the value that means "no filter".
    TransactionTypeCode:
      type: string
      minLength: 2
      maxLength: 2
      pattern: '^(?:0[1-9]|[1-9][0-9])$'
      description: >-
        A transaction type code as STORED: exactly two digits, retaining any
        leading zero, and never '00'. Seven values are seeded, '01' through '07',
        mapping to purchase, payment, credit, authorization, refund, reversal and
        adjustment. Zero is excluded because the baseline's numeric edit refuses it
        outright, reporting the composed sentence 'Tran Type code must not be zero.'
        -- the label at app/app-transaction-type-db2/cbl/COTRTUPC.cbl line 826
        followed by the fixed text at line 961. Use TransactionTypeCodeFilter where
        a value of '00' is to mean "no filter".
      examples:
        - '01'
        - '07'

    TransactionTypeCodeFilter:
      type: string
      minLength: 2
      maxLength: 2
      pattern: '^[0-9]{2}$'
      description: >-
        A transaction type code used as a LIST FILTER, where '00' has its own
        meaning: it selects everything, exactly as an omitted or blank filter does.
        The baseline collapses the three at
        app/app-transaction-type-db2/cbl/COTRTLIC.cbl lines 1101 to 1106 -- low
        values, spaces and zeros all set the filter-blank flag -- and its cursors at
        lines 344 to 346 and 360 to 362 apply the type predicate only when the
        filter validated, so a blank filter restricts nothing. A non-numeric value
        is refused with the baseline's own wording, published as
        typeCodeFilterMustBeTwoDigits on the ReferenceMessageCatalogue schema. Any
        other two-digit value selects that one type, including a code that is not
        seeded, which simply matches no row.
      examples:
        - '01'
        - '00'

    # WHY : Assumptions: four digits held as a STRING with a digits-only pattern,
    #       never an integer, and this is the one field in this context where the
    #       baseline's own sources disagree about type. The VSAM-lineage copybooks
    #       declare it NUMERIC -- app/cpy/CVTRA04Y.cpy line 7 and
    #       app/cpy/CVTRA02Y.cpy line 8 both give it a numeric picture of four
    #       digits -- while the Db2 objects that the two programs this service
    #       replaces actually operate on declare it as CHARACTER, and they are
    #       taken as authoritative here for that reason. Four sources carry the
    #       character form: (1) app/app-transaction-type-db2/ddl/TRNTYCAT.ddl line
    #       3 declares CHAR(4) NOT NULL; (2) that tree's ctl/DB2CREAT.ctl restates
    #       the same width when it creates the table; (3) its dcl/DCLTRCAT.dcl
    #       declares CHAR(4) in the SQL at line 30 and generates the COBOL host
    #       variable as an alphanumeric field at lines 42 to 43 -- a character host
    #       variable, which is what the programs read and write through; and (4)
    #       the sibling db/migration/V1__reference.sql declares cat_cd CHAR(4),
    #       recording six corroborating reasons of its own at that column.
    #       An integer would drop the leading zeros every one of those sources
    #       depends on, turning '0001' into 1, and the seed extract
    #       app/data/ASCII/trancatg.txt would then no longer locate its own rows,
    #       because it stores the key by positional concatenation as '010001'. The
    #       divergence between the copybook picture and the type used here is
    #       registered as D-CATEGORY-CODE-TEXT in
    #       docs/architecture/cobol-to-service-traceability.md.
    TransactionCategoryCode:
      type: string
      minLength: 4
      maxLength: 4
      pattern: '^[0-9]{4}$'
      description: >-
        A transaction category code: exactly four digits, retaining leading zeros,
        and unique only within its parent transaction type. It is a character
        field whose content happens to be digits, and it is never arithmetic --
        nothing in the migrated system adds to it or compares it numerically.
      examples:
        - '0001'
        - '0005'

    # WHY : Refactoring Rationale: the uppercase-alphanumeric pattern this schema
    #       used to declare was invented and has been removed. The field is
    #       DIS-ACCT-GROUP-ID PIC X(10) at app/cpy/CVTRA02Y.cpy line 5 and the
    #       column is CHAR(10); neither restricts the character domain, and the
    #       three values the seed extract happens to carry -- A000000000, DEFAULT
    #       and ZEROAPR in app/data/ASCII/discgrp.txt -- are evidence of what the
    #       data contains today and not of what the contract permits. The pattern
    #       made any stored group whose identifier held a lower-case letter, a space
    #       or punctuation UNADDRESSABLE through this API: the request would be
    #       refused as malformed before any row was read, and because the interest
    #       calculation's DEFAULT fallback is reached by looking a group up and
    #       finding nothing, a group that cannot be looked up cannot exercise that
    #       fallback either. Transformation rule T1 makes the copybook normative, so
    #       the domain is the copybook's.
    # WHY : Assumptions: control characters remain excluded, and that is a transport
    #       fact rather than a narrowing of the domain. The column can hold a low
    #       value, but a control character cannot travel in a URI path segment under
    #       RFC 3986 even percent-encoded without ambiguity, and no seeded or
    #       reachable group carries one. Every other octet the column admits is
    #       expressible: a caller percent-encodes any character reserved in a path
    #       segment, which is ordinary HTTP and needs no divergence.
    # WHY : Trade-offs: dropping the pattern means a request can now address a group
    #       that cannot exist, and such a request answers 404 rather than 400. That
    #       is the correct trade: a 404 tells a caller the group is not there, which
    #       is true, whereas the 400 it used to receive told the caller its request
    #       was malformed, which was not.
    AccountGroupId:
      type: string
      minLength: 1
      maxLength: 10
      pattern: '^[^\u0000-\u001F\u007F]{1,10}$'
      description: >-
        An account group identifier, up to ten characters, naming the pricing group
        whose rates apply to an account. The character domain is the copybook's: the
        field is declared PIC X(10) at app/cpy/CVTRA02Y.cpy line 5 and the column is
        CHAR(10), so any printable character is admitted and none is required to be
        upper case. Send it unpadded: the stored column is ten characters and ignores
        trailing blanks on comparison, so 'DEFAULT' and its blank-filled form address
        the same rows. Percent-encode any character reserved in a path segment. The
        value 'DEFAULT' is reserved for the fallback group described on the rate
        lookup.
      examples:
        - A000000000
        - DEFAULT

    # WHY : Refactoring Rationale: this schema now ENFORCES the baseline's edit and
    #       states it correctly, where an earlier revision described it wrongly and
    #       enforced nothing. The edit is 1230-EDIT-ALPHANUM-REQD at
    #       app/app-transaction-type-db2/cbl/COTRTUPC.cbl lines 849 to 899. It
    #       converts every character in the 62-character set declared at lines 230 to
    #       237 -- the 26 upper-case letters, the 26 lower-case letters and the ten
    #       digits -- to spaces at lines 878 to 880, and refuses the value if
    #       anything non-space survives, at lines 882 to 889. Spaces therefore pass
    #       and DIGITS pass; punctuation does not. The earlier text said "letters and
    #       spaces", which omitted digits and would have made 'Regular Sales Draft 2'
    #       look prohibited.
    # WHY : Refactoring Rationale: the message the edit emits was also misstated. It
    #       is COMPOSED, not a fixed literal: the field label followed by
    #       ' can have numbers or alphabets only.' at lines 892 to 893, or by
    #       ' must be supplied.' at lines 865 to 866 when the value is blank. The
    #       schema pointed instead at a ReferenceMessageCatalogue member holding
    #       'Name can only contain alphabets and spaces', which is a DIFFERENT
    #       condition name in a different program and is not what this edit reports.
    # WHY : Assumptions: at least one non-space character is required, which is the
    #       blank arm of the same edit at lines 854 to 859 -- it refuses low values,
    #       all spaces, and any value that trims to nothing. The pattern expresses
    #       that by requiring one admitted character somewhere in the value rather
    #       than by a lookahead, so it stays readable and needs no assertion
    #       features.
    # WHY : Refactoring Rationale: this schema is no longer reused for the
    #       description FILTER on the list operations. The baseline applies NO
    #       character edit to that filter and wraps the user's text in percent signs
    #       itself, at app/app-transaction-type-db2/cbl/COTRTLIC.cbl lines 1155 to
    #       1163, so a filter is a substring rather than a stored value and the two
    #       admit different text. See ReferenceDescriptionFilter below.
    ReferenceDescription:
      type: string
      minLength: 1
      maxLength: 50
      pattern: '^[A-Za-z0-9 ]*[A-Za-z0-9][A-Za-z0-9 ]*$'
      description: >-
        The descriptive text of a transaction type or category, up to fifty
        characters, as STORED. The admitted characters are letters in either case,
        digits and spaces, and at least one character must not be a space -- the
        domain the baseline's own edit enforces at
        app/app-transaction-type-db2/cbl/COTRTUPC.cbl lines 849 to 899 against the
        62-character set it declares at lines 230 to 237. A value carrying anything
        else is refused with the composed sentence '<field> can have numbers or
        alphabets only.', and a blank one with '<field> must be supplied.', both
        assembled from the field's own label. Trailing blanks are not part of the
        value: the baseline holds it in a fifty-byte field padded to a positional
        record length, and the stored column is variable-length for exactly that
        reason, so a description is returned trimmed. Use
        ReferenceDescriptionFilter where a description is being searched for rather
        than stored.
      examples:
        - Purchase
        - Regular Sales Draft

    ReferenceDescriptionFilter:
      type: string
      minLength: 1
      maxLength: 50
      description: >-
        Text to search descriptions FOR, matched as a substring anywhere in the
        stored description. Fifty characters is the width of the field the baseline
        reads it into, WS-IN-TYPE-DESC at
        app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 313, and no character
        restriction applies because the baseline applies none: its edit at lines 1142
        to 1164 only distinguishes blank from supplied, and where the value is
        supplied it wraps it in percent signs at lines 1155 to 1163 before binding it
        to the cursor's LIKE predicate at lines 347 to 349. The wrapping is done by
        the service, so a caller sends the text it is looking for and not a pattern.
        A percent sign or underscore inside the supplied text is passed through to
        the predicate and behaves as the pattern metacharacter it is there, which is
        the baseline's behaviour and not an addition; it is bound as a parameter, so
        it can widen a match but cannot alter the statement. Omitting the parameter,
        or sending it blank, applies no description restriction.
      examples:
        - Sales
        - Purchase

    # WHY : Alternatives Considered: the rate is a JSON STRING, and a JSON number
    #       was rejected outright. Most clients parse a JSON number into an
    #       IEEE-754 binary double, and a rate such as 15.00 or 2.50 has no exact
    #       binary representation, so a value that left this service exact would
    #       arrive slightly wrong -- and it would arrive wrong at the boundary a
    #       user actually sees. A string is parsed by the client into whatever
    #       decimal type it chooses and cannot lose a digit in transit.
    # WHY : Assumptions: this rate is an arithmetic OPERAND and not a value merely
    #       displayed, which is what raises the cost of that inexactness from
    #       cosmetic to monetary. app/cbl/CBACT04C.cbl consumes it in the interest
    #       computation at its lines 464 to 465, multiplying a category balance by
    #       this rate and only then dividing by twelve hundred -- multiply first,
    #       divide second, at full precision -- and accumulates the outcome at line
    #       467 into an amount that is written as a generated interest transaction
    #       and posts to a balance a statement reports. An error introduced here
    #       enters that multiplication before the division and settles into money
    #       a customer is charged.
    # WHY : Assumptions: the scale is not chosen here. app/cpy/CVTRA02Y.cpy line 9
    #       declares the rate with four integer digits and two fractional, which
    #       db/migration/V1__reference.sql carries as NUMERIC(6,2) and the Java
    #       layer as a BigDecimal of scale 2; the serialisation is centralised in
    #       services/common-lib/src/main/java/com/carddemo/common/money/MoneyModule.java
    #       so that no service can emit a different form. The pattern below admits
    #       exactly that shape and no other, so a value of a third scale is a
    #       contract violation rather than a rounding question.
    # WHY : Assumptions: even the seed data is already exact decimal rather than a
    #       readable number, which is independent reinforcement rather than a
    #       coincidence. app/data/ASCII/discgrp.txt stores each rate as zoned
    #       decimal with a sign overpunch in its trailing byte, so the six
    #       characters '00150{' denote positive fifteen and no cents; read as text
    #       it is not a number at all.
    InterestRate:
      type: string
      pattern: '^-?[0-9]{1,4}\.[0-9]{2}$'
      description: >-
        An annual interest rate as an exact decimal string, with up to four
        integer digits and always exactly two fractional digits. The two
        fractional digits are always present, so fifteen percent is '15.00' and
        never '15' or '15.0'. A leading minus sign is admitted because the stored
        column is signed, matching the signed picture the baseline declares. Parse
        it into a decimal type, never into a float or a double.
      examples:
        - '15.00'
        - '25.00'

    PhoneAreaCodeValue:
      type: string
      minLength: 3
      maxLength: 3
      pattern: '^[0-9]{3}$'
      description: >-
        A three-digit North American Numbering Plan area code, retaining leading
        zeros. Held as characters rather than as a number because the baseline
        compares a three-byte field against three-byte literals.
      examples:
        - '201'
        - '800'

    PhoneAreaCodeClass:
      type: string
      enum:
        - G
        - E
      description: >-
        Which of the two baseline sub-lists an area code belongs to. 'G' is the
        general-purpose list of four hundred and ten codes at
        app/cpy/CSLKPCDY.cpy line 521; 'E' is the easily-recognisable list of
        eighty codes at line 931. The two partition the four-hundred-and-ninety
        code list at line 30 exactly -- they sum to it and share no member -- which
        is why one classification suffices where a pair of independent flags would
        have admitted rows that are in both lists or neither, states the copybook
        cannot express. Every accepted code carries one of these two values and
        none carries a third; db/migration/V1__reference.sql enforces that with a
        check constraint.
      examples:
        - G
        - E

    StateCodeValue:
      type: string
      minLength: 2
      maxLength: 2
      pattern: '^[A-Z]{2}$'
      description: >-
        A two-character state code in upper case. The seeded list of fifty-six
        admits the states, the district, the territories and the military mailing
        codes the postal service treats alike, so it is longer than the fifty a
        reader might expect.
      examples:
        - AL
        - 'NY'

    StateZipPrefixValue:
      type: string
      minLength: 4
      maxLength: 4
      pattern: '^[A-Z]{2}[0-9]{2}$'
      description: >-
        A state code followed by the two leading digits of a postal code, as one
        four-character value with no separator, in that order. It is one value
        rather than two fields because the baseline builds the four bytes and tests
        the pair as a unit at app/cpy/CSLKPCDY.cpy line 1073; splitting it would
        oblige every reader to reassemble it before comparing. The postal digits
        are characters, so a prefix beginning with zero is preserved.
      examples:
        - AL35
        - NY10

    # WHY : Refactoring Rationale: this schema is now backed by a real column, and
    #       an earlier revision of this contract published it while nothing
    #       persisted it -- V1__reference.sql created six tables and none of them
    #       carried a version, so a required member of the type and category
    #       representations, and the conflicting version a 409 promises, had no
    #       source. The column reference.transaction_types.version and its twin on
    #       reference.transaction_categories supply them, and the reasoning for the
    #       mechanism, its baseline lineage in COTRTUPC.cbl and the alternatives
    #       rejected are recorded beside those columns rather than repeated here.
    # WHY : Assumptions: only the two tables this contract offers a replace for
    #       carry the column. The three lookup collections and the disclosure-group
    #       rate are read-only here, so no operation of this document sends a
    #       version for them and none returns one.
    RecordVersion:
      type: integer
      format: int64
      minimum: 0
      description: >-
        The version of the stored row, incremented by the service on every
        successful replace. Read it with a record and send it back with the
        replace, so that a write against a row someone else has moved on is
        refused rather than silently overwriting their change. It is a version
        counter and not a timestamp: comparing two values tells a caller only that
        they differ, never when or by whom.
      examples:
        - 1
        - 4

    # WHY : Refactoring Rationale: every cursor example in this document ends in the
    #       exact same forty-three-character placeholder, and an earlier revision
    #       instead ended each one in a hand-written base64-looking string of
    #       forty-one to forty-seven characters. All ten of those violated the
    #       signature rule this schema states, so every page example in the document
    #       was invalid against the very schema it illustrated -- a generated client
    #       or a validating test built from those examples would have failed on data
    #       the service never produces. The placeholder is exactly the length the
    #       pattern requires and is used unchanged in the sibling authorization
    #       contract, so the two documents illustrate one shape.
    # WHY : Assumptions: only the SIGNATURE segment is a placeholder; the middle
    #       segment of each example still carries the readable collection name it
    #       always did, so an example still says which query it belongs to. A
    #       placeholder in the middle segment would have removed that, and the
    #       middle segment was already valid.
    # WHY : Trade-offs: the placeholder reads as obviously-not-a-signature rather
    #       than as plausible random characters, which is deliberate. A realistic
    #       forty-three-character string invites a reader to try it, and it would be
    #       refused -- the token is authenticated, so no example can ever be a usable
    #       one. Saying so in the value itself is cheaper than a caveat nobody reads.
    CursorToken:
      type: string
      maxLength: 256
      pattern: '^v2\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]{1,200}$'
      description: >-
        An opaque paging position minted by this service. It stands for a key in
        the ordered set without disclosing it, and it is sealed to the CALLER, the
        collection, the filters and the direction it was issued for, so replaying it
        by another caller or against a different collection, a changed filter or the
        opposite direction is refused with 400 rather than answered with a page the
        caller did not ask for. It is therefore not transferable between sessions. Treat
        it as a value to echo back unchanged and never parse, construct or
        compare: no part of it is a type code, a category code or a row ordinal.
        Every example of this type in this document carries a placeholder ciphertext
        segment naming itself as redacted; no published example is a usable token,
        the payload being enciphered under a key this service holds.

    PageDirection:
      type: string
      enum:
        - next
        - previous
      default: next
      description: >-
        Which side of a supplied cursor to read. These two lower-case values are
        the single paging vocabulary of this migration -- the sibling service
        contracts publish the same pair, and the browser client sends it -- so a
        client written against one collection pages every other one the same way.
      examples:
        - next
        - previous

    CorrelationId:
      type: string
      maxLength: 24
      pattern: '^$|^(?!(?:[._-]*[0-9]){9,}[._-]*$)[A-Za-z0-9_.-]{1,24}$'
      description: >-
        Identity of one unit of work. At most twenty-four characters drawn from the
        ASCII letters, the digits, the hyphen, the underscore and the full stop. A
        value this service mints is the two-character prefix CD followed by twenty-two upper-case hexadecimal
        characters over eleven bytes of entropy;
        a value a caller supplies need only fit the bound and the character set, so
        that an identity already carried from an upstream system can be propagated
        rather than replaced. The empty string appears only inside an error body,
        and only for a failure raised before any identity had been established. The pattern additionally refuses one narrow class the character set alone
        admits: a value made up only of digits and the three separators, carrying nine
        or more digits. That is the shape of every protected identifier this system
        holds, in contiguous form and in every separated form -- a customer identifier
        and a national identifier are nine digits, an account identifier eleven, a
        card number sixteen -- and the shared correlation filter refuses it because
        this identity is echoed on the response and written to every log line for the
        request, so accepting one would copy a protected identifier into both.
        Ordinary values are unaffected: a date-like 2022-07-18 carries eight digits
        and is accepted, and any value containing a letter is accepted whatever its
        digits. A value the service mints begins CD, which is a non-numeric prefix
        chosen so that a minted identity can never fall into the refused class.
      examples:
        - 4F1C0E423A554D219B7E6C0F


    TransactionType:
      type: object
      description: >-
        One transaction type as stored: its code, its description and the version
        token a replace must carry. This is the migrated form of the sixty-byte
        record app/cpy/CVTRA03Y.cpy declares, less the eight-byte trailing filler
        at its line 7 -- the one filler of that record, dropped because it is
        padding to a positional record length rather than data.
      required:
        - typeCd
        - description
        - version
      additionalProperties: false
      properties:
        typeCd:
          allOf:
            - $ref: '#/components/schemas/TransactionTypeCode'
          description: >-
            The code identifying this type, and the value a category's parent
            reference carries.
        description:
          allOf:
            - $ref: '#/components/schemas/ReferenceDescription'
          description: >-
            What this transaction type means to a user, trimmed of the padding the
            baseline record carries.
        version:
          allOf:
            - $ref: '#/components/schemas/RecordVersion'
          description: >-
            The version of this row when it was read. Send it back on a replace.
      examples:
        - typeCd: '01'
          description: Purchase
          version: 1

    TransactionTypeCreateRequest:
      type: object
      description: >-
        The type to create. No version member appears, because a row that does not
        yet exist has no version to compare against -- the create is refused on a
        duplicate key instead.
      required:
        - typeCd
        - description
      additionalProperties: false
      properties:
        typeCd:
          allOf:
            - $ref: '#/components/schemas/TransactionTypeCode'
          description: >-
            The code to create. Supplied rather than generated, because it is a
            meaningful business code that appears in stored transaction records.
        description:
          allOf:
            - $ref: '#/components/schemas/ReferenceDescription'
          description: >-
            What the new type means to a user.
      examples:
        - typeCd: '08'
          description: Chargeback

    TransactionTypeReplaceRequest:
      type: object
      description: >-
        The replacement description together with the version read with the
        record. The code is absent by design: it is the primary key and the value
        the category key is built from, so it is addressed in the path and cannot
        be changed by a replace.
      required:
        - description
        - version
      additionalProperties: false
      properties:
        description:
          allOf:
            - $ref: '#/components/schemas/ReferenceDescription'
          description: >-
            The description to store in place of the one currently held.
        version:
          allOf:
            - $ref: '#/components/schemas/RecordVersion'
          description: >-
            The version read with the record. A value that no longer matches the
            stored row is reported as 409 rather than overwriting the change
            someone else made.
      examples:
        - description: Purchase of goods
          version: 1

    TransactionCategory:
      type: object
      description: >-
        One transaction category as stored: the pair of codes that identifies it,
        its description and its version token. This is the migrated form of the
        sixty-byte record app/cpy/CVTRA04Y.cpy declares, less the four-byte
        trailing filler at its line 9 -- the one filler of that record. The two
        code members correspond to the fields the copybook groups together at its
        line 5, which is why they form the composite key rather than either one
        standing alone.
      required:
        - typeCd
        - catCd
        - description
        - version
      additionalProperties: false
      properties:
        typeCd:
          allOf:
            - $ref: '#/components/schemas/TransactionTypeCode'
          description: >-
            The transaction type this category belongs to. It must name an
            existing type, which the foreign key enforces.
        catCd:
          allOf:
            - $ref: '#/components/schemas/TransactionCategoryCode'
          description: >-
            The category code, unique within its type rather than globally.
        description:
          allOf:
            - $ref: '#/components/schemas/ReferenceDescription'
          description: >-
            What this category means to a user.
        version:
          allOf:
            - $ref: '#/components/schemas/RecordVersion'
          description: >-
            The version of this row when it was read. Send it back on a replace.
      examples:
        - typeCd: '01'
          catCd: '0001'
          description: Regular Sales Draft
          version: 1

    TransactionCategoryCreateRequest:
      type: object
      description: >-
        The category to create, including the type it belongs beneath. The type
        must already exist: a category naming an absent type is refused with 409
        rather than stored as an orphan.
      required:
        - typeCd
        - catCd
        - description
      additionalProperties: false
      properties:
        typeCd:
          allOf:
            - $ref: '#/components/schemas/TransactionTypeCode'
          description: >-
            The existing transaction type to create this category beneath.
        catCd:
          allOf:
            - $ref: '#/components/schemas/TransactionCategoryCode'
          description: >-
            The category code to create, unique within that type.
        description:
          allOf:
            - $ref: '#/components/schemas/ReferenceDescription'
          description: >-
            What the new category means to a user.
      examples:
        - typeCd: '01'
          catCd: '0006'
          description: Contactless Sales Draft

    TransactionCategoryReplaceRequest:
      type: object
      description: >-
        The replacement description together with the version read with the
        record. Neither code appears, for the same reason the type code is absent
        from its own replace request: together they are the primary key and are
        addressed in the path.
      required:
        - description
        - version
      additionalProperties: false
      properties:
        description:
          allOf:
            - $ref: '#/components/schemas/ReferenceDescription'
          description: >-
            The description to store in place of the one currently held.
        version:
          allOf:
            - $ref: '#/components/schemas/RecordVersion'
          description: >-
            The version read with the record.
      examples:
        - description: Regular Sales Draft Adjusted
          version: 2

    DisclosureGroupRate:
      type: object
      description: >-
        The interest rate that applies to a combination of account group,
        transaction type and category, together with a statement of which account
        group actually supplied it. This is the migrated form of the fifty-byte
        record app/cpy/CVTRA02Y.cpy declares, less the twenty-eight-byte trailing
        filler at its line 10 -- the one filler of that record -- with two members
        added that the baseline has no room for, because the baseline conveys the
        same information by having overwritten its own key field before re-reading.
      required:
        - requestedAcctGroupId
        - appliedAcctGroupId
        - tranTypeCd
        - tranCatCd
        - interestRate
        - defaultGroupApplied
      additionalProperties: false
      properties:
        requestedAcctGroupId:
          allOf:
            - $ref: '#/components/schemas/AccountGroupId'
          description: >-
            The account group the caller asked about, echoed back unchanged.
        # WHY : Refactoring Rationale: the group that answered is reported
        #       EXPLICITLY, where the baseline leaves it implicit. On a miss
        #       app/cbl/CBACT04C.cbl overwrites its own group-id field with the
        #       literal 'DEFAULT' at line 437 before re-reading, so after the
        #       second read the field no longer records which group was asked for
        #       and nothing downstream can tell a fallback rate from a specific
        #       one. Returning both values keeps the same rate selection while
        #       making the substitution visible, so a caller reconciling a charge
        #       against a rate table is not left inferring it. The divergence is
        #       registered as D-APPLIED-GROUP-VISIBLE in
        #       docs/architecture/cobol-to-service-traceability.md.
        appliedAcctGroupId:
          allOf:
            - $ref: '#/components/schemas/AccountGroupId'
          description: >-
            The account group whose row supplied the rate returned. Equal to
            requestedAcctGroupId when that group had a row of its own, and
            'DEFAULT' when the fallback answered.
        tranTypeCd:
          allOf:
            - $ref: '#/components/schemas/TransactionTypeCode'
          description: >-
            The transaction type of the rate returned, echoed back unchanged. The
            fallback substitutes only the account group, never this.
        tranCatCd:
          allOf:
            - $ref: '#/components/schemas/TransactionCategoryCode'
          description: >-
            The transaction category of the rate returned, echoed back unchanged.
        interestRate:
          allOf:
            - $ref: '#/components/schemas/InterestRate'
          description: >-
            The annual rate that applies, as an exact decimal string. It is the
            operand of the interest computation, so parse it into a decimal type.
        defaultGroupApplied:
          type: boolean
          description: >-
            Whether the fallback answered. True exactly when appliedAcctGroupId is
            'DEFAULT' and the caller asked about a different group; false when the
            requested group had its own row, including when the caller asked about
            'DEFAULT' directly.
      examples:
        - requestedAcctGroupId: A000000000
          appliedAcctGroupId: A000000000
          tranTypeCd: '01'
          tranCatCd: '0001'
          interestRate: '15.00'
          defaultGroupApplied: false
        - requestedAcctGroupId: Z999999999
          appliedAcctGroupId: DEFAULT
          tranTypeCd: '01'
          tranCatCd: '0002'
          interestRate: '25.00'
          defaultGroupApplied: true

    UsPhoneAreaCode:
      type: object
      description: >-
        One accepted phone area code and its classification. The presence of the
        row is the whole of the contract: the baseline holds these as a
        condition-name list over a three-byte field rather than as records, so
        membership is the only property there is to report.
      required:
        - areaCd
        - codeClass
      additionalProperties: false
      properties:
        areaCd:
          allOf:
            - $ref: '#/components/schemas/PhoneAreaCodeValue'
          description: >-
            The accepted area code.
        codeClass:
          allOf:
            - $ref: '#/components/schemas/PhoneAreaCodeClass'
          description: >-
            Which of the two baseline sub-lists this code belongs to.
      examples:
        - areaCd: '201'
          codeClass: G
        - areaCd: '800'
          codeClass: E

    UsState:
      type: object
      description: >-
        One accepted state code. A single-member object rather than a bare string,
        so that the shape stays stable if the seeded list ever carries an attribute
        the way the area-code list carries its classification.
      required:
        - stateCd
      additionalProperties: false
      properties:
        stateCd:
          allOf:
            - $ref: '#/components/schemas/StateCodeValue'
          description: >-
            The accepted state code.
      examples:
        - stateCd: AL

    UsStateZipPrefix:
      type: object
      description: >-
        One accepted state and postal-prefix combination, carried as the single
        concatenated value the baseline tests.
      required:
        - stateZipCd
      additionalProperties: false
      properties:
        stateZipCd:
          allOf:
            - $ref: '#/components/schemas/StateZipPrefixValue'
          description: >-
            The accepted combination of state code and two leading postal digits.
      examples:
        - stateZipCd: AL35


    # WHY : Assumptions: every page envelope in this document carries exactly the
    #       FOUR members the shared response type declares -- items, firstKey,
    #       lastKey and hasNext, at
    #       services/common-lib/src/main/java/com/carddemo/common/web/PageResponse.java
    #       -- in that order, and every one of them is required. Publishing a fifth
    #       would describe a body this service cannot send: the shared type has no
    #       such component, so a serialisation of it omits the member, a generated
    #       client would receive an accessor that is always absent, and a strict
    #       client would reject every valid response for missing a member the
    #       contract declared. Absence of a boundary is spelled as a null value on
    #       a present member, never as a missing member, which is why all four are
    #       required and not only items.
    # WHY : Refactoring Rationale: this note said FOUR members and rejected adding a
    #       backward-availability member for symmetry, on the ground that it would be
    #       derivable from firstKey being non-null. The shared type now declares five
    #       and the schemas below declare five, so the note contradicted the document
    #       it annotates. The reasoning it carried was also wrong on its own terms:
    #       firstKey answers WHERE a backward request would be issued from and every
    #       page carrying rows supplies one, including the opening page, so deriving
    #       availability from it made the first page advertise an earlier page and
    #       answer a client that followed the advertisement with an empty page. The
    #       two members do not have to agree, because they state different facts.
    # WHY : Alternatives Considered: a total row count or page count. Rejected
    #       because neither is knowable without a second query over the whole
    #       filtered set, and neither would stay true while it travelled: the set
    #       is maintained through the write operations in this document. Forward
    #       availability is settled the way the baseline settles it, by reading one
    #       row beyond the page and reporting only whether that row existed.
    TransactionTypePage:
      type: object
      description: >-
        One page of transaction types together with everything needed to walk the
        ordered set by key in either direction. When there is no row to return the
        page is empty and both cursors are null.


        Refactoring Rationale: this description previously said an empty page is
        what a caller receives when "the filters match no row". It is not: a
        supplied filter matching no row is refused with 400 before any row is
        read, for the reason set out on the list operation. An empty page means a
        walk that has run out of rows, or a collection holding none, and the
        baseline reports those on a rendered screen with noMorePagesForSearch or
        noRecordsFoundForSearch. This shape carries no message member, so a client
        renders the appropriate sentence from the ReferenceMessageCatalogue
        schema, choosing between those two on whether it was paging forward or
        opening the collection.
      required:
        - items
        - firstKey
        - lastKey
        - hasNext
      additionalProperties: false
      properties:
        # WHY : Assumptions: the upper bound is declared on the ARRAY and not left as
        #       prose above it, and it is the value TransactionTypeService.PAGE_SIZE
        #       carries -- the reference list map's own row count, which is what fixes it at seven
        #       rather than a value chosen here.
        #       A page carrying one row more would be a defect in this service, which
        #       is worth failing a contract check rather than reaching a client that
        #       had sized its rendering for the published bound. No lower bound is
        #       declared: an empty page is legitimate for an exhausted set and for a
        #       filter that removed every row it read.
        items:
          type: array
          maxItems: 7
          description: >-
            The transaction types of this page, in ascending type-code order.
            Empty, never null, when the set is exhausted or the filters matched
            nothing. Its length must not be used to infer the end of the set --
            read hasNext for that.
          items:
            $ref: '#/components/schemas/TransactionType'
        firstKey:
          oneOf:
            - $ref: '#/components/schemas/CursorToken'
            - type: 'null'
          description: >-
            Names the first row actually returned in items, or null exactly when
            items is empty. It is also the position a caller pages backward from:
            send it as the cursor with direction previous. Null here means there is
            no backward position to send, which is the one case a caller handles
            rather than retries.
        lastKey:
          oneOf:
            - $ref: '#/components/schemas/CursorToken'
            - type: 'null'
          description: >-
            Names the last row actually returned in items -- never the extra row
            read to settle hasNext -- or null exactly when items is empty. It is
            also the position a caller pages forward from: send it as the cursor
            with direction next.
        hasNext:
          type: boolean
          description: >-
            Whether a further page follows this one. On a forward walk it is settled
            by reading one row beyond the page and observing whether that row exists,
            never from any tally. On a page reached by paging BACKWARD it is always
            true, because a caller can only page backward from a page it reached by
            paging forward -- the baseline states the same thing unconditionally at
            app/app-transaction-type-db2/cbl/COTRTLIC.cbl line 1738, at the top of its
            backward reader. When it is true, lastKey is present. When it is false, a
            caller that presses forward anyway receives the baseline's own end-of-set
            wording, published on the ReferenceMessageCatalogue schema.

      examples:
        - items:
            - typeCd: '01'
              description: Purchase
              version: 1
            - typeCd: '02'
              description: Payment
              version: 1
          firstKey: v2.dHJhbnNhY3Rpb24t.REDACTED-EXAMPLE-CIPHERTEXT-not-decipherable-F
          lastKey: v2.dHJhbnNhY3Rpb24t.REDACTED-EXAMPLE-CIPHERTEXT-not-decipherable-L
          hasNext: true

    TransactionCategoryPage:
      type: object
      description: >-
        One page of transaction categories, ordered by type code and then by
        category code. The envelope carries the same four members as every other
        page in this document, and its cursors are sealed to this collection, so a
        cursor issued here cannot be replayed against the transaction-type list.
      required:
        - items
        - firstKey
        - lastKey
        - hasNext
      additionalProperties: false
      properties:
        # WHY : Assumptions: the upper bound is declared on the ARRAY and not left as
        #       prose above it, and it is the value TransactionCategoryService.PAGE_SIZE
        #       carries -- the reference list map's own row count, as on TransactionTypePage.
        #       A page carrying one row more would be a defect in this service, which
        #       is worth failing a contract check rather than reaching a client that
        #       had sized its rendering for the published bound. No lower bound is
        #       declared: an empty page is legitimate for an exhausted set and for a
        #       filter that removed every row it read.
        items:
          type: array
          maxItems: 7
          description: >-
            The categories of this page, ordered by type code and then category
            code. Empty, never null, when the set is exhausted or the filters
            matched nothing.
          items:
            $ref: '#/components/schemas/TransactionCategory'
        firstKey:
          oneOf:
            - $ref: '#/components/schemas/CursorToken'
            - type: 'null'
          description: >-
            The backward paging position over the composite key, or null when items
            is empty.
        lastKey:
          oneOf:
            - $ref: '#/components/schemas/CursorToken'
            - type: 'null'
          description: >-
            The forward paging position over the composite key, or null when items
            is empty.
        hasNext:
          type: boolean
          description: >-
            Whether a further page follows. Settled on a forward walk by reading one
            row beyond the page; always true on a page reached by paging backward, as
            recorded in full on the transaction-type page.

      examples:
        - items:
            - typeCd: '01'
              catCd: '0001'
              description: Regular Sales Draft
              version: 1
          firstKey: v2.dHJhbnNhY3Rpb24t.REDACTED-EXAMPLE-CIPHERTEXT-not-decipherable-F
          lastKey: v2.dHJhbnNhY3Rpb24t.REDACTED-EXAMPLE-CIPHERTEXT-not-decipherable-L
          hasNext: true

    UsPhoneAreaCodePage:
      type: object
      description: >-
        One page of accepted phone area codes with their classifications, in
