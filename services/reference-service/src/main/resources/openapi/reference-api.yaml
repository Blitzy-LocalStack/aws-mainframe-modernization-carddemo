  /api/v1/reference/disclosure-groups/{acctGroupId}/{tranTypeCd}/{tranCatCd}:

    description: >-
      One disclosure-group interest rate, addressed by the three-part key that
      identifies it: the account group, the transaction type and the transaction
      category. All three segments are required because all three form the
      primary key of reference.disclosure_groups, which
      db/migration/V1__reference.sql declares in that order.

    parameters:
      - $ref: '#/components/parameters/AcctGroupIdPath'
      - $ref: '#/components/parameters/TranTypeCdPath'
      - $ref: '#/components/parameters/TranCatCdPath'

    get:
      tags:
        - reference-data
      operationId: getDisclosureGroupRate
      x-required-authority: carddemo-user
      summary: Look up an interest rate, falling back to the DEFAULT group
      description: >-
        Returns the interest rate that applies to the supplied combination of
        account group, transaction type and transaction category.


        The lookup has two stages, and the second is part of the contract rather
        than an implementation detail. When no row exists for the account group
        supplied, the lookup is retried against the account group DEFAULT and the
        rate found there is returned. This reproduces
        app/cbl/CBACT04C.cbl, which on a lookup miss -- file status 23 at its
        line 436 -- moves the literal 'DEFAULT' into the group-id field at line
        437 and re-reads through the paragraph at line 443. The response states
        which of the two stages answered, in its appliedAcctGroupId and
        defaultGroupApplied members, so a caller is never left inferring whether
        the rate it received was the one it asked for.


        The fallback rows are seeded and are not optional. There are seventeen of
        them, inserted by db/migration/V2__seed_reference.sql, and they are
        carried across from app/data/ASCII/discgrp.txt, in which exactly
        seventeen of the fifty-one rows begin with the account group 'DEFAULT'
        followed by three spaces to fill the ten-character column. When the
        fallback itself finds nothing the baseline does not continue: it reports
        the condition at line 455 and abends through the paragraph invoked at
        line 458. The migrated form of that outcome is 404 carrying the abend
        detail described on the AbendDetail schema, because an absent DEFAULT row
        is a defect in the seeded reference data rather than a request a caller
        can correct.
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: >-
            The applicable rate, together with the account group that actually
            supplied it. A caller that asked for a group with no row of its own
            receives the DEFAULT group's rate here with defaultGroupApplied
            true, which is a success and not a partial answer.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclosureGroupRate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            Neither the account group supplied nor the DEFAULT group has a row
            for this transaction type and category. This is the condition the
            baseline treats as unrecoverable at app/cbl/CBACT04C.cbl lines 455
            and 458, so the body carries abend detail alongside the ordinary
            error members. The detail is the REDUCED external form: the condition
            code survives while the culprit and the reason are the empty string and
            the message is one fixed client-safe sentence, so the response names the
            seeded reference data as the subject without naming the internal
            component or its diagnostic.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/reference/us-phone-area-codes:

    description: >-
      The seeded list of North American Numbering Plan area codes this platform
      accepts, each carrying the classification that says which of the two
      baseline sub-lists it belongs to. Read-only: this context seeds the list
