        lastKey:
          oneOf:
            - $ref: '#/components/schemas/CursorToken'
            - type: 'null'
          description: >-
            The forward paging position, or null when items is empty.
        hasNext:
          type: boolean
          description: >-
            Whether a further page of area codes follows. Settled on a forward walk by
            reading one row beyond the page; always true on a page reached by paging
            backward, as recorded in full on the transaction-type page.

      examples:
        - items:
            - areaCd: '201'
              codeClass: G
          firstKey: v2.dXMtcGhvbmUtYXJl.REDACTED-EXAMPLE-CIPHERTEXT-not-decipherable-F
          lastKey: v2.dXMtcGhvbmUtYXJl.REDACTED-EXAMPLE-CIPHERTEXT-not-decipherable-L
          hasNext: true

    UsStatePage:
