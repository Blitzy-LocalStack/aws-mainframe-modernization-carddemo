  /api/v1/reference/us-phone-area-codes/{areaCd}:

    description: >-
      One accepted phone area code. Addressing a single code turns the
      membership test the baseline performs against a condition-name list into a
      primary-key probe, so a caller validating one value need not page the whole
      list to do it.

