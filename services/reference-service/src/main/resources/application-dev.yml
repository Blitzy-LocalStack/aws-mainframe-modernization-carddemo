# =============================================================================
# services/reference-service/src/main/resources/application-dev.yml
# -----------------------------------------------------------------------------
# Purpose:
#   The dev profile overlay for the CardDemo reference-data bounded context --
#   module six of the nine in the com.carddemo:carddemo-services reactor, owner
#   of the reference schema and its six tables, and the only module whose
#   migrations carry a reference-DATA SEED rather than schema alone.
#
#   ⚠️ Refactoring Rationale: that clause read "the only module in the migration
#   that carries two migrations", and it was false in the plainest way -- three
#   modules carry two, two carry three, one carries five and one carries one. The
#   count was never the distinguishing fact anyway; the CONTENT is.
#   V2__seed_reference.sql in this module's db/migration directory is the only
#   migration in the whole reactor holding INSERT statements -- six of them, loading
#   the transaction types, the transaction categories, the mandatory DEFAULT
#   disclosure group and the three lookup tables -- and that is why this module's
#   second migration dominates its startup cost, which is the fact the sizing below
#   and in application.yml is actually reasoning from. Assumptions: the inventory
#   moves as schemas evolve, so it is deliberately NOT restated here; the claim
#   above is stated in a form that a directory listing settles.
#
#   It overrides ELEVEN values that
#   application.yml in this same directory already declares, and it declares
#   nothing else. Every key below is a key the base file already has, and every
#   key below carries a value different from the base's; a key that merely
#   repeated a base value would be noise and has been removed rather than left
#   to read as a decision.
#
#   The base file is the property-key contract for this module. This file is an
#   overlay on it, never a replacement, so everything the base settles continues
#   to hold here unrestated: the datasource kind and driver, the owned schema
#   and the pool statement that pins it, the migration locations, the listener
#   port, and the resource-server configuration. What this file varies is size
#   and verbosity, and nothing else.
#   Refactoring Rationale: this sentence also named "the queue family and its
#   message format" among the base settlements. The base settles no queue at all
#   now -- this module consumes none, because the single shared inquiry request
#   queue of app/app-vsam-mq/README.md L53 has exactly one owning consumer, in the
#   account context -- so the phrase named a contract that is no longer there.
#
#   The behaviour being sized belongs to programs that are REFERENCE ONLY and
#   are never modified: app/app-transaction-type-db2/cbl/COTRTLIC.cbl and
#   COTRTUPC.cbl (the transaction-type screens), COBTUPDT.cbl (the sequential
#   reference update, which migrates to a reference-maintenance service method
#   rather than to a batch job). The date-edit rules are not configured here
#   at all: they live in common-lib as
#   com.carddemo.common.validation.DateEditValidator, transcribed from
#   app/cbl/CSUTLDTC.cbl. One baseline citation below is load-bearing and was
#   read from disk rather than recalled: app/cbl/CBACT04C.cbl L436-L439, L455,
#   L458 and L628-L632.
#   Refactoring Rationale: app/app-vsam-mq/cbl/CODATE01.cbl was listed here as a
#   fourth sized program, and its L286 wait as a load-bearing citation. Neither
#   applies: its QUEUE route is answered by the owner of the shared request queue
#   in the account context, and this profile no longer sizes a consumer.
#
# Parameters:
#   SPRING_PROFILES_ACTIVE
#     String. Selects this file. The value dev arrives from the ECS task
#     definition and is deliberately absent from the image, so one built digest
#     is promoted from one environment to the next rather than one image being
#     built per environment. The base file records that decision; this file is
#     the artifact it selects.
#   No other variable is introduced here. Every placeholder this profile
#     resolves is declared, named and described in application.yml, and no value
#     for any of them appears in this file. Because this overlay adds no
#     placeholder of its own, it adds nothing to the set of variables a dev task
#     must supply, and an unset variable still aborts startup naming itself
#     rather than defaulting to something reachable.
#
# Effect:
#   Nine values along three lines. The connection pool is resized and re-ordered
#   for a cluster that is permitted to release ALL of its capacity while idle; the
#   health endpoint's detail is widened from withheld to authorized-only; and two
#   loggers are raised. Nothing here changes what the service does -- only how much
#   of it runs at once and how much of it is written down.
#   Refactoring Rationale: this read eleven values along four lines and counted a
#   pair of queue-consumer bounds among them. Those two keys are withdrawn with the
#   module's consumer, so the count is re-measured against what the file holds.
#
# Failure modes:
#   No override here can abort startup on its own. One of them PREVENTS a failure
#   the base values would produce in this environment and in no other, and it is
#   recorded at its own key: a pool holding idle connections stops the cluster ever
#   reaching its auto-pause threshold. Refactoring Rationale: a second such
#   override, and a pair that had to move together or the task would not start,
#   both belonged to the withdrawn queue-consumer block and are gone with it.
#
# Label form:
#   The four rationale labels used below are written plural, unparenthesised,
#   colon-terminated and free of emphasis markup -- Alternatives Considered:,
#   Refactoring Rationale:, Assumptions:, Trade-offs: -- which is the single form
#   docs/CODE_DOCUMENTATION_STANDARD.md permits and the form the governing
#   Explainability rule itself uses at its own lines 31 to 34.
#   Their singular, parenthesised counterparts mean the same four categories and
#   are the idiom that predominates in the reference-only tree, whose header
#   bullets tag rationale with the singular word inside parentheses -- see
#   .github/workflows/tests.yml lines 19 to 43. That tree is reference-only and is
#   never retyped, so the two trees do read differently on purpose. This file uses
#   the plural form throughout and mixes neither idiom into the other, because the
#   plural is the wording the rule's validation gate is applied against and a
#   category spelled two ways is a category a review cannot count by search. The
#   equivalence is stated once, here, rather than restated at each site.
#
# WHY (non-obvious design decisions):
#   - Refactoring Rationale: this file and application-prod.yml differ from each
#     other, and from the base, ONLY in sizing and verbosity. Neither varies
#     topology: not the datasource kind, not the driver, not the owned schema,
#     not the migration locations, not the listener port, and not the identity
#     mechanism. The failure mode
#     that constraint exists to prevent is specific rather than stylistic: once
#     two environments differ in SHAPE rather than in SIZE, a dev pass stops
#     being evidence about prod, and every defect dev cannot reproduce is first
#     observed in production -- where the cheapest available explanation,
#     configuration drift, has to be excluded before anybody can start looking
#     for the real cause. Holding the shapes identical is what makes a
#     production-only failure attributable to data or capacity instead.
#   - Refactoring Rationale: security is NOT relaxed here. No key below touches
#     spring.security, the resource-server configuration, or the authority model
#     config/SecurityConfig.java builds from it: reference WRITES still require
#     the carddemo-admin authority, reference READS still require one of the two
#     group authorities, and the catch-all is still denyAll. A dev profile that
#     admitted an unauthenticated caller would be easier to work against and
#     would stop rehearsing prod at the one layer where a mistake is not
#     recoverable after the fact. That is not hypothetical for this module: the
#     authority defects this context has already had -- a catch-all that
#     admitted a signed token carrying no group at all -- were found by
#     exercising authorization in a non-production environment, which is only
#     possible while the non-production environment still enforces it.
#   - Trade-offs: the dev cluster is permitted to scale to zero Aurora Capacity
#     Units, and configuring an auto-pause threshold is MANDATORY once the
#     minimum is zero, so this profile accepts a cold-resume cost of roughly
#     fifteen seconds on the first request -- or the first Flyway migration --
#     after an idle period. The saving is real and no interactive user depends on
#     it here. Prod does not accept the same cost: application-prod.yml holds its
#     minimum capacity above zero, which is precisely why its pool keys read
#     differently from these. The two files are one decision recorded twice, and
#     reading either alone makes the values look arbitrary.
#   - Assumptions: no capacity number, auto-pause threshold or provider version
#     constraint is set in this file, and none can be. Those live in
#     infra/modules/aurora-postgresql and infra/envs/dev, and the provider floor
#     that accepts a zero minimum is pinned there. This file configures only the
#     APPLICATION side of the consequence. A reader who added an infrastructure
#     setting to a Spring profile would be configuring nothing at all -- the key
#     would bind to no property and would be silently ignored, which is worse
#     than absent because it reads as configured.
#   - Assumptions: log RETENTION is named as an environment axis but is not a
#     Spring key and is not set here. Retention is a property of the CloudWatch
#     log group, owned by infra/modules/observability. What this file varies is
#     how much is written, not how long it is kept, and the two are set in
#     different places by different tools.
# =============================================================================

spring:

  datasource:
    hikari:

      # WHY : (1) Assumptions: the ceiling this number is charged against is the
      #       connection budget Aurora PostgreSQL Serverless derives from
      #       provisioned capacity, measured at the environment's MINIMUM
      #       capacity setting rather than its maximum. The pool fills during the
      #       quiet period before capacity has scaled up, which is exactly when
      #       that ceiling is lowest, and in dev the minimum is permitted to be
      #       zero -- so the budget is at its very tightest at the moment the
      #       pool is first filled. What is charged against it is
      #       maximum-pool-size multiplied by this service's desired ECS task
      #       count, summed across the eight services doing the same thing. Four
      #       rather than the base's ten keeps that product small while dev task
      #       counts are small.
      #       (2) Assumptions: the consequence of getting this wrong is not
      #       observed here. Raising it in one service spends an allowance the
      #       other seven share, and the failure surfaces as
      #       "FATAL: remaining connection slots are reserved" in whichever
      #       service happens to connect NEXT -- so the service that took the
      #       slots looks healthy and an unrelated one looks broken.
      #       (3) Trade-offs: four connections means a burst beyond four
      #       concurrent database operations queues for a connection rather than
      #       opening a fifth. That is accepted because the workload is reference
      #       lookups against six small tables which hold a connection for
      #       milliseconds. Refactoring Rationale: this reason also cited two
      #       queue-consumer bounds held UNDER this number as a second guarantee
      #       against such a burst. Those keys are withdrawn with the module's
      #       queue consumer, so the only competitors for a connection are the
      #       HTTP handlers, and the burst bound is the listener's own thread
      #       ceiling rather than a consumer's.
      maximum-pool-size: 4

      # WHY : (1) Trade-offs: zero, which the base file names as the development
      #       profile's decision to take. A floor above zero means the pool holds
      #       connections open while nothing is using them, and to the cluster an
      #       open connection is activity: its idle timer never reaches the
      #       auto-pause threshold, so a database permitted to release all of its
      #       capacity never releases any of it. That failure is silent in every
      #       respect that matters -- the service is healthy, queries are fast,
      #       tests pass -- and its only symptom is a charge for capacity nothing
      #       asked for. Naming it at this key is the whole point, because the
      #       setting that defeats auto-pause lives in the application while the
      #       threshold it defeats lives in infra/modules/aurora-postgresql, so
      #       neither file on its own shows the interaction.
      #       (2) Trade-offs: the accepted cost is that the first request after a
      #       quiet period pays connection establishment and the TLS handshake
      #       inside the request, on top of the cluster resume it may also
      #       trigger. connection-timeout below is what makes that survivable
      #       rather than fatal, which is why the two are set as a pair.
      minimum-idle: 0

      # WHY : (1) Trade-offs: thirty seconds rather than the base's ten, and this
      #       is the one value in the file bounded from BELOW rather than from
      #       above. A cluster resuming from zero capacity is unreachable for
      #       roughly fifteen seconds, so a ten-second wait cannot survive the
      #       first connection attempt after an idle period: every request in
      #       that window fails, and it fails AS a connection timeout, which
      #       reads as a database fault rather than as the resume it actually is.
      #       Thirty clears fifteen with enough margin left for the TLS handshake
      #       and the pool's initialisation statement that follow it.
      #       (2) Trade-offs: the accepted cost is exactly the failure the base
      #       chose ten seconds to avoid -- during genuine pool exhaustion each
      #       waiting request now occupies its servlet thread three times as
      #       long, which brings a thread-pool cascade nearer. That is accepted
      #       HERE and nowhere else: application-prod.yml keeps ten seconds,
      #       because prod's minimum capacity is above zero, so no request there
      #       ever waits on a resume and the longer wait would buy nothing while
      #       making the cascade easier to reach.
      connection-timeout: 30000

      # WHY : (1) Assumptions: sixty seconds is what makes minimum-idle: 0 above
      #       take effect within a useful interval. This setting governs how long
      #       a connection ABOVE the floor is kept, and with the floor at zero it
      #       therefore governs how long the pool holds its LAST connection --
      #       which makes it the key that decides when the cluster's idle timer
      #       can begin counting at all. The base's five minutes is as long as
      #       the lowest auto-pause threshold the infrastructure can be
      #       configured with, so the pool and the threshold would race and
      #       auto-pause would engage unpredictably or not at all.
      #       (2) Assumptions: HikariCP DISABLES this setting outright when it
      #       comes within one second of max-lifetime below, logging a notice and
      #       continuing rather than failing. Sixty seconds against that key's two
      #       hundred and forty leaves the two unambiguously ordered, so the value
      #       configured here is the value in force. That ordering is why both
      #       keys are restated in this file instead of one being inherited: the
      #       base's pair is ordered correctly for the base's own numbers and
      #       would not be for these.
      idle-timeout: 60000

      # WHY : (1) Assumptions: a connection must be retired BY THE POOL before
      #       anything between the pool and the engine retires it, and in this
      #       environment the shortest such window is not a network idle timeout
      #       -- it is auto-pause itself. A paused cluster drops EVERY connection
      #       at once, and the auto-pause threshold cannot be configured below
      #       three hundred seconds, so four minutes sits strictly under the
      #       earliest pause the infrastructure is able to perform. No connection
      #       in this pool can outlive it. The base's fifteen minutes is correct
      #       for prod, where no pause occurs, and is longer than this entire
      #       window.
      #       (2) Trade-offs: this profile must tolerate the WHOLE pool being
      #       invalidated in a single event, a condition prod does not have. That
      #       is accepted rather than defended against: with minimum-idle at zero
      #       there is usually nothing to invalidate, and any connection that
      #       does survive into a pause is retired on age before it can be handed
      #       to a caller. The difference that buys is between a pool that
      #       reconnects quietly and a caller that receives a broken-pipe error
      #       and reports it as an application defect.
      max-lifetime: 240000


management:
  endpoint:
    health:

      # WHY : (1) Trade-offs: both are widened from the base's never, and the
      #       pairing is required rather than tidy. The base pins show-components
      #       INDEPENDENTLY of show-details, so widening show-details alone would
      #       still withhold the list of registered contributors and the widening
      #       would appear not to have worked. What the pair buys is the
      #       datasource contributor's own detail, which is where a task that
      #       started but cannot reach the cluster is told apart from one whose
      #       862-row seed is still running -- and that distinction is the
      #       difference between reading a replacement loop as a capacity problem
      #       and reading it as the migration it usually is.
      #       (2) Trade-offs: when-authorized and NOT always. The base rejects
      #       always outright and is right to: /actuator/health is permitted
      #       without a token in config/SecurityConfig.java because the load
      #       balancer's target group and the HEALTHCHECK in
      #       services/reference-service/Dockerfile both poll it and neither can
      #       present one, so always would publish this service's dependency list
      #       to anything that reached the port. Under when-authorized an
      #       unauthenticated probe still receives a status word and nothing else
      #       -- the property that permitted path depends on -- while a caller
      #       carrying a valid token for the configured pool receives the detail.
      #       The accepted cost is that diagnosing this endpoint now requires a
      #       token, which is a smaller cost than describing the dependency graph
      #       to an unauthenticated caller.
      show-details: when-authorized
      show-components: when-authorized

logging:
  level:

    # WHY : (1) Trade-offs: DEBUG on this package and on no other application
    #       package, which the base names as the development profile's decision.
    #       What it buys is this service's own branch decisions logged per
    #       request instead of only per exception -- a transaction-type delete
    #       refused because a category still references the type, a
    #       disclosure-group lookup falling through to DEFAULT. The accepted cost
    #       is request-per-line volume on a lookup path.
    #       (2) Assumptions: root is deliberately left at the base's INFO rather
    #       than raised alongside this. Raising root would add every framework
    #       package's per-request output to the same stream and bury the lines
    #       this override exists to surface, so more logging would yield less
    #       information.
    com.carddemo: DEBUG

    # WHY : (1) Trade-offs: DEBUG here echoes the statement TEXT, which is what
    #       makes a keyset predicate visible -- the ordering columns, the strict
    #       inequality against the last key of the previous page, and the limit of
    #       size-plus-one that decides whether a further page exists. That is the
    #       shape most worth seeing while a paged reference screen is built, and
    #       the text alone carries it: the bound VALUES add no predicate
    #       information. The accepted cost is one line per statement on a hot
    #       lookup path, accepted only here -- application-prod.yml holds this at
    #       WARN.
    #       (2) Alternatives Considered: spring.jpa.show-sql: true, the more
    #       familiar way to ask for the same thing, which is deliberately NOT
    #       used. The base pins it false and records that statement logging is
    #       raised through logging.level in this profile instead, and the reason
    #       is mechanical rather than stylistic: show-sql writes to System.out
    #       directly rather than through the logging pipeline, so with both set
    #       every statement is emitted twice and one of the two copies carries no
    #       correlation identifier. common-lib's
    #       com.carddemo.common.web.CorrelationIdFilter publishes that identifier
    #       into the MDC, and only the logger channel reads it. One correlated
    #       copy is worth more than two copies of which one cannot be tied back to
    #       a request.
    #       (3) Assumptions: org.hibernate.orm.jdbc.bind is deliberately NOT
    #       raised and stays at the base's WARN. This is a ceiling, not an
    #       omission. At TRACE that logger's entire output is bound parameter
    #       values, and while nothing in the reference schema holds a primary
    #       account number, a card verification value, a national identifier or a
    #       government-issued identifier, this service's parameters do carry
    #       disclosure-group interest rates, and it is a framework logger writing
    #       to the same correlated stream every request uses. No log statement
    #       this profile enables may emit an unmasked account number, verification
    #       value or identifier, and the way that is guaranteed is by not enabling
    #       the one logger whose output is nothing but values.
    org.hibernate.SQL: DEBUG

# =============================================================================
# Closing notes: five deliberate absences
# -----------------------------------------------------------------------------
#   Each entry below is a key a reader would reasonably expect this overlay to
#   carry. An absent key has no line of its own to sit beside, so the reasoning
#   is collected here rather than left to be re-derived. Under the governing
#   Explainability rule the PRESENCE of a key in an overlay is itself a decision;
#   so is its absence, when a reasonable author would have written it.
#
# WHY : Assumptions: spring.flyway.clean-disabled is NOT relaxed and no clean is
#       enabled in any form -- not even as a convenience for local iteration,
#       which is the one environment where somebody would reach for it. The base
#       pins it true and this file leaves it there. What a clean would remove is
#       the seed, and the seed carries the mandatory 'DEFAULT' disclosure-group
#       row. The consumer of that row is not this service. app/cbl/CBACT04C.cbl
#       reads a disclosure group per account, and at L436-L439, on file status
#       '23' -- key not found -- it moves 'DEFAULT' into
#       FD-DIS-ACCT-GROUP-ID and performs 1200-A-GET-DEFAULT-INT-RATE to re-read.
#       Should that re-read also fail, L455 displays
#       'ERROR READING DEFAULT DISCLOSURE GROUP' and L458 performs
#       9999-ABEND-PROGRAM, whose body at L628-L632 is DISPLAY 'ABENDING
#       PROGRAM', MOVE 0 TO TIMING, MOVE 999 TO ABCODE, CALL 'CEE3ABD' USING
#       ABCODE, TIMING -- a genuine Language Environment abend that ends the run.
#       The baseline behaves that way; the target keeps the same shape, so the
#       equivalent failure is a crash in batch-service, in a job holding no
#       defect of its own, caused by a row that a DIFFERENT service's profile
#       permitted to be removed. That divergence is recorded in
#       docs/architecture/cobol-to-service-traceability.md.
#
# WHY : Assumptions: no key here skips, reorders, baselines or otherwise defers a
#       migration. A dev task applies V1__reference.sql and then
#       V2__seed_reference.sql on every start, seeding 862 rows -- 76 reference
#       rows across transaction types, categories and disclosure groups, plus 786
#       address-lookup rows -- before this service answers anything, and there is
#       no V3. That cost is what the generous --start-period on the HEALTHCHECK in
#       services/reference-service/Dockerfile is sized for, and in dev it is not
#       the only cost on that path: a cluster resuming from zero capacity is
#       unreachable for roughly fifteen seconds before the first migration
#       statement executes at all, so the interval the probe must tolerate here is
#       the resume PLUS the seed, and it is strictly worse than in prod, where the
#       cluster is already awake and only the seed is paid. Tightening
#       the probe or the target group's grace period on the base file's numbers
#       produces a task killed before it can ever become healthy, and the symptom
#       -- a replacement loop with no error in the application log -- points
#       nowhere near the cause.
#
# WHY : Alternatives Considered: springdoc.swagger-ui.enabled: true, which reads
#       like the obvious dev override and is deliberately NOT set, for two
#       independent reasons. The library already serves the interface when the key
#       is absent, so the base configuration is the SERVED one and the value this
#       file would write is the value already in force -- an override that changes
#       nothing, which is worse than an absent key because it reads as a decision.
#       And the key is not declared in application.yml at all, so writing it here
#       would give this overlay a key the base does not have and break the
#       property that makes an overlay reviewable against its base. Narrowing is
#       the deliberate act and it belongs to the other profile:
#       application-prod.yml sets it false. What the interface renders here is
#       openapi/reference-api.yaml, the hand-authored OpenAPI 3.1 contract of
#       record that ui/src/api/reference.ts is written against, so it exercises
#       the same contract the browser client consumes rather than standing as a
#       second source of truth beside it.
#
# WHY : Alternatives Considered: widening
#       management.endpoints.web.exposure.include, which the base explicitly
#       anticipates a profile doing and which this file does not do. The reason is
#       in the filter chain rather than in the actuator configuration:
#       config/SecurityConfig.java permits /actuator/health/**, grants
#       /actuator/info and /actuator/prometheus by loopback position, matches the
#       reference read surface at /api/v1/reference/**, and then closes with
#       anyRequest().denyAll(). A fourth actuator endpoint named here would
#       therefore be published by the actuator and refused by the chain -- 403 to
#       every caller, including an administrator holding a valid token -- so it
#       would shorten no diagnosis while appearing to. Exposing loggers, env,
#       configprops, beans, mappings, heapdump or threaddump is separately out of
#       the question in EVERY environment, because this task resolves a real
#       database credential from a managed secret store in all of them, and env
#       alone would publish it. The Flyway state such an endpoint would have shown
#       is read from the migration log instead, which the base holds at INFO for
#       exactly that purpose.
#
# WHY : Assumptions: logging.level.org.flywaydb stays at the base's INFO and is
#       not raised with the two loggers above. Its INFO output is the list of
#       applied migrations and their durations, which for this module is the only
#       record that the 862-row seed completed and how long it took -- the
#       measurement both the container probe and the target group's grace period
#       are sized from. At DEBUG that logger emits per-statement output for those
#       862 rows and buries the one line the measurement comes from, so raising it
#       would cost the diagnosis it appears to serve.
# =============================================================================
