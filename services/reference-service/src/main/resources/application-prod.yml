# =============================================================================
# services/reference-service/src/main/resources/application-prod.yml
# -----------------------------------------------------------------------------
# Purpose:
#   The prod profile overlay for the CardDemo reference-data bounded context --
#   module six of the nine in the com.carddemo:carddemo-services reactor, owner
#   of the reference schema and its six tables, and the only module whose
#   migrations carry a reference-DATA SEED rather than schema alone.
#
#   ⚠️ Refactoring Rationale: that clause read "the only module in the migration
#   that carries two migrations", and it was false in the plainest way -- three
#   modules carry two, two carry three, one carries five and one carries one. The
#   count was never the distinguishing fact anyway; the CONTENT is.
#   V2__seed_reference.sql in this module's db/migration directory is the only
#   migration in the whole reactor holding INSERT statements -- six of them, loading
#   the transaction types, the transaction categories, the mandatory DEFAULT
#   disclosure group and the three lookup tables -- and that is why this module's
#   second migration dominates its startup cost, which is the fact the sizing below
#   and in application.yml is actually reasoning from. Assumptions: the inventory
#   moves as schemas evolve, so it is deliberately NOT restated here; the claim
#   above is stated in a form that a directory listing settles.
#
#   It is the paired half of
#   application-dev.yml in this same directory: the two files record ONE
#   capacity decision twice, from the two ends of it, and reading either alone
#   makes its numbers look arbitrary.
#
#   It declares exactly TWO leaf keys: it OVERRIDES one value the base already
#   sets, and ADDS one key the base is silent about, which therefore stood at its
#   library default until now. Refactoring Rationale: this sentence read "it
#   overrides TWO values, and declares one key", which counts three changes where
#   the file makes two -- the overridden value was being counted once as an
#   override and again among the "two values". The distinction is not pedantry:
#   an override is reverted by deleting the line here, and the base value returns,
#   whereas deleting the added key returns the LIBRARY default rather than
#   anything this repository states, so the two are undone with different
#   confidence and a reader has to know which is which. Overstating the overlay by
#   one key is not cosmetic in a file whose whole subject is what it does and does
#   not change: a reader reconciling the count against the payload goes looking for
#   a third key, and the closest candidate is one of the seven absences the closing
#   block deliberately explains. The payload is and always was exactly
#   spring.datasource.hikari.minimum-idle, which the base sets to 2 at
#   application.yml:499 and this file raises to 5, and springdoc.swagger-ui.enabled,
#   which the base does not set at all and this file switches off. That is the whole of it,
#   and the smallness is the design rather than an omission: application.yml
#   beside it already states the deployed posture -- statement echo off, health
#   detail withheld, the actuator surface at three endpoints, both migrations
#   applied, the bind-parameter logger at WARN -- so this profile has almost
#   nothing left to close. What it varies is one pool dimension and one
#   endpoint's reachability. Every key below carries a value the base does not; a key that
#   merely repeated a base value would be noise and is absent rather than left
#   to read as a decision.
#
#   Because so much is inherited, the reasoning for what is NOT written here
#   matters as much as the reasoning for what is. Six keys a reader would
#   reasonably expect this overlay to carry are absent on purpose, and each is
#   accounted for in the closing block, which is where an absent key's rationale
#   can sit adjacent to something. Refactoring Rationale: this read seven. The
#   seventh was the pair of queue-consumer bounds, and it is no longer an ABSENCE
#   of a key this overlay could have set -- the module consumes no queue, so the
#   keys do not exist in the base either. The closing block records that
#   withdrawal separately from the six absences, because the two are different
#   facts: an absence is a value declined, a withdrawal is a capability moved.
#
#   The base file is the property-key contract for this module. This file is an
#   overlay on it, never a replacement, so everything the base settles continues
#   to hold here unrestated: the datasource kind and driver, the owned schema
#   and the pool statement that pins it, the migration locations, the listener
#   port, TLS on it, and the resource-server configuration with the authority model
#   built from it. Refactoring Rationale: this sentence also named "the queue family
#   and its message format" among the base settlements; the base settles no queue at
#   all now, because the single shared inquiry request queue of
#   app/app-vsam-mq/README.md L53 has exactly one owning consumer and that consumer
#   is in the account context.
#
#   The behaviour being sized belongs to programs that are REFERENCE ONLY and
#   are never modified: app/app-transaction-type-db2/cbl/COTRTLIC.cbl and
#   COTRTUPC.cbl (the transaction-type screens), COBTUPDT.cbl (the sequential
#   reference update, which migrates to a reference-maintenance service method
#   rather than to a batch job). The date-edit rules are not configured here
#   at all: they live in common-lib as
#   com.carddemo.common.validation.DateEditValidator, transcribed from
#   app/cbl/CSUTLDTC.cbl. One baseline citation below is load-bearing and was read
#   from disk rather than recalled: app/cbl/CBACT04C.cbl L436-L439, L455, L458 and
#   L628-L632.
#   Refactoring Rationale: app/app-vsam-mq/cbl/CODATE01.cbl was listed here as a
#   fourth sized program and four of its lines as load-bearing citations. Neither
#   applies: its QUEUE route is answered by the owner of the shared request queue,
#   in the account context, and this profile no longer inherits or sizes a
#   consumer.
#
# Parameters:
#   SPRING_PROFILES_ACTIVE
#     String. Selects this file. The value prod arrives from the ECS task
#     definition and is deliberately absent from the image, so one built digest
#     is promoted from one environment to the next rather than one image being
#     built per environment. The base file records that decision; this file is
#     the artifact it selects.
#   No other variable is introduced here. Every placeholder this profile
#     resolves is declared, named and described in application.yml, and no value
#     for any of them appears in this file. Because this overlay adds no
#     placeholder of its own, it adds nothing to the set of variables a prod
#     task must supply, and an unset variable still aborts startup naming itself
#     rather than defaulting to something reachable.
#
# Effect:
#   What this file yields is one thing: the effective configuration the Spring
#   application context is started from, after this overlay is merged over
#   application.yml in this directory and over the carddemo-common-defaults.yml
#   that the base imports from common-lib. That merged result is the return value
#   a docstring would describe, and the merge order is part of it -- a value
#   stated here wins over the base, and every value NOT stated here is the base's.
#   The difference this overlay makes to it is ONE overridden value and ONE added
#   key, on two of the axes the base permits a profile to vary: the connection
#   pool holds a genuine warm floor instead of the base's minimal one -- the
#   override, spring.datasource.hikari.minimum-idle raised from the base's 2 to 5
#   -- and the interactive API browser is switched off, which is the addition,
#   springdoc.swagger-ui.enabled, a key the base never states. Refactoring
#   Rationale: this sentence read "two values and one added key", which is three
#   changes and disagreed with the two keys the file actually declares and with
#   the two-item list in the same sentence; the count and the list now agree, and
#   both name the property they mean so a reader can check them against the YAML
#   below without inferring which axis is which. Nothing here changes what the
#   service does, which endpoints exist, who may reach them, or what any of them
#   returns.
#
# Failure modes:
#   No override here can abort startup on its own, and neither can it report
#   itself: a misspelled Spring property binds to no property at all and is
#   silently ignored, leaving the base value in force while the intended change
#   never happens. That asymmetry is the reason this file is short rather than
#   thorough. Every closure production depends on is asserted in application.yml
#   -- one file, one place, no profile -- so a typo in THIS file can only fail to
#   raise a floor or fail to switch off a browser. Restating the closures here
#   would add a second place each of them could be quietly lost from, which is
#   the opposite of what restating them appears to buy.
#
# Label form:
#   The four rationale labels used below are written plural, unparenthesised,
#   colon-terminated and free of emphasis markup -- Alternatives Considered:,
#   Refactoring Rationale:, Assumptions:, Trade-offs: -- which is the single form
#   docs/CODE_DOCUMENTATION_STANDARD.md permits and the form the governing
#   Explainability rule itself uses at its own lines 31 to 34.
#   Their singular, parenthesised counterparts mean the same four categories and
#   are the idiom that predominates in the reference-only tree, whose header
#   bullets tag rationale with the singular word inside parentheses -- see
#   .github/workflows/tests.yml lines 19 to 43. That tree is reference-only and is
#   never retyped, so the two trees do read differently on purpose. This file uses
#   the plural form throughout and mixes neither idiom into the other, because the
#   plural is the wording the rule's validation gate is applied against and a
#   category spelled two ways is a category a review cannot count by search. The
#   equivalence is stated once, here, rather than restated at each site.
#
# WHY (non-obvious design decisions):
#   - Refactoring Rationale: this file and application-dev.yml differ from each
#     other, and from the base, ONLY in sizing and verbosity. Neither varies
#     topology: not the datasource kind, not the driver, not the owned schema,
#     not the migration locations, not the listener port, and not the identity
#     mechanism. The failure mode
#     that constraint exists to prevent is specific rather than stylistic: once
#     two environments differ in SHAPE rather than in SIZE, a dev pass stops
#     being evidence about prod, and every defect dev cannot reproduce is first
#     observed in production -- where the cheapest available explanation,
#     configuration drift, has to be excluded before anybody can start looking
#     for the real cause. Holding the shapes identical is what makes a
#     production-only failure attributable to data or capacity instead.
#   - Trade-offs: production holds its Aurora minimum capacity ABOVE zero, and
#     every number in this file follows from that one fact. application-dev.yml
#     takes the minimum to zero and accepts a cold resume of roughly fifteen
#     seconds on the first request after an idle period, because the saving is
#     real and no interactive user depends on it there. Production cannot accept
#     the same cost, and the reason is not a preference: its request traffic
#     arrives from the browser client through the API gateway and an internal
#     load balancer, so a fifteen-second stall on the first request is a
#     user-visible outage, and it is also long enough to consume the health
#     probe's own budget -- the container HEALTHCHECK in
#     services/reference-service/Dockerfile allows five seconds per attempt --
#     so the resume would be observed as an unhealthy task and answered with a
#     replacement rather than with a wait. The auto-pause saving is therefore
#     forgone deliberately, in exchange for a cluster that is always awake, and
#     that is what licenses the warm floor below.
#   - Assumptions: no capacity number, auto-pause threshold, backup or log
#     retention period, deletion-protection flag or final-snapshot flag is set in
#     this file, and none can be. Those live in
#     infra/modules/aurora-postgresql, infra/modules/observability and
#     infra/envs/prod, and prod's own values are recorded in
#     infra/envs/prod/terraform.tfvars. Retention is named as an environment axis
#     and is genuinely one, but it is a property of the CloudWatch log group and
#     of the cluster's backup configuration rather than a Spring key: what this
#     file could vary is how much is written, not how long any of it is kept. A
#     reader who added an infrastructure setting to a Spring profile would be
#     configuring nothing at all -- the key would bind to no property and would
#     be silently ignored, which is worse than absent because it reads as
#     configured.
#   - Assumptions: two gates read this file and they cover different halves of
#     the obligation, so neither one passing is evidence about the other.
#     config/checkstyle/checkstyle.xml sets fileExtensions="java" at its Checker
#     element, so the Checkstyle execution bound to the Maven validate phase in
#     services/pom.xml never opens a .yml file and decides nothing here.
#     config/rule1/rule1_gate.py does read this file -- .yml is in its governed
#     suffixes and services/ is not among its excluded prefixes -- and it is
#     fail-closed and self-testing, so it decides the FORM of every label below
#     and that no statement carries a purpose comment outside this header block.
#     Neither gate can decide whether a rationale is TRUE, which is why each one
#     below names the consequence under the alternative rather than asserting a
#     preference: that part is settled by review and by nothing else.
# =============================================================================

spring:

  datasource:
    hikari:

      # WHY : (1) Assumptions: five rather than the base's two, and the licence for
      #       it is the capacity decision in the header rather than anything about
      #       this service. The base keeps the floor low and says why: a connection
      #       held open while nothing is using it reads to the cluster as activity,
      #       so in an environment permitted to release capacity when idle a floor
      #       above zero keeps some of that capacity awake and charges for it. That
      #       cost is CONDITIONAL on the release being reachable, and in production
      #       it is not: infra/envs/prod/terraform.tfvars holds the minimum at two
      #       Aurora Capacity Units, so no capacity is ever released and a floor
      #       cannot keep awake something that never sleeps. What remains of the
      #       cost is connections, and those are counted below.
      #       (2) Assumptions: the arithmetic that bounds this number is the same
      #       product the base names -- pool size multiplied by task count, summed
      #       across the services sharing one cluster -- and every factor in it is
      #       recorded rather than assumed. infra/envs/prod/main.tf declares
      #       max_capacity as twice the desired count for an online workload, and
      #       terraform.tfvars sets that desired count to two, so this context runs
      #       at most four tasks. Against the inherited ceiling of ten that is
      #       forty connections this context can hold at full autoscale, of which
      #       this floor accounts for twenty held permanently. The same root
      #       computes the whole-cluster figure from its map of pool sizes, and
      #       it comes to two hundred and sixty; the four connections batch-service
      #       holds under its own role are inside that figure, and the nightly
      #       window is exactly when this floor is least useful and still occupied.
      #       Twenty of two hundred and sixty is the share this decision spends,
      #       and it is a share of a budget the alarm in
      #       infra/modules/observability is set from.
      #       (3) Trade-offs: five rather than the ceiling of ten, which is the
      #       other obvious choice and would remove connection establishment from
      #       every request instead of most of them. It is declined because a floor
      #       equal to the maximum makes the inherited idle-timeout inert -- the
      #       pool only retires connections ABOVE the floor -- so the pool would
      #       never return capacity after a burst, and the setting that says it
      #       should would still be sitting in the base file reading as though it
      #       did something. Half the ceiling keeps both halves honest: five stay
      #       warm, five are elastic and are returned on the base's timer.
      #       (4) Trade-offs: what the floor buys is worth naming precisely,
      #       because a floor is otherwise easy to read as caution. The base pins
      #       sslmode to verify-full, so opening a connection means a full TLS
      #       handshake with certificate-chain verification against the bundle, and
      #       the pool statement that pins the search path runs after it. Paying
      #       that inside a request is the cost this floor removes, and it is paid
      #       on a path other bounded contexts call into synchronously -- address
      #       validation for account-service, disclosure-group rates for
      #       batch-service -- so the latency lands in their requests, not only in
      #       this service's own.
      minimum-idle: 5

springdoc:
  swagger-ui:

    # WHY : (1) Alternatives Considered: leaving the interactive browser reachable
    #       and relying on the gateway's authorizer plus the filter chain to guard
    #       it, which is a real option rather than a straw one -- the page already
    #       needs a token, because config/SecurityConfig.java matches the reference
    #       surface and closes with denyAll rather than permitting the UI path. It
    #       is declined because the browser adds an untrusted-input surface without
    #       adding a source of truth. The contract of record is
    #       openapi/reference-api.yaml, hand-authored OpenAPI 3.1, and it is
    #       consumed by ui/src/api/reference.ts when that client is built, so the
    #       document a reader needs is already published and already versioned with
    #       the code. What the live page adds over it is a form that composes and
    #       sends requests, against real reference data, from whatever session
    #       reaches it. A deployed surface that can only be justified by the
    #       controls in front of it is a surface worth not having.
    #       (2) Assumptions: this is the ONE key in this file the base does not
    #       declare, and the exception is deliberate and bounded. The base declares
    #       three sibling keys under this same node -- the UI's path, the contract
    #       URL it renders, and the suppression of the library's own default URL --
    #       and leaves enabled at the library's default of true, so switching the
    #       page off cannot be expressed by overriding a value the base already
    #       carries. The base's own rule that a profile overrides values without
    #       adding keys exists to stop a profile changing the module's SHAPE, and
    #       this adds no endpoint, no datasource and no schema: it removes a page.
    #       application-dev.yml records the other side of the same decision at its
    #       closing block -- it declines to write this key as true, because true is
    #       already in force there and an override that changes nothing reads as a
    #       decision that was made -- and names this file as where the narrowing
    #       belongs.
    #       (3) Alternatives Considered: declaring enabled: true in application.yml
    #       purely so this profile could override a declared key and keep the
    #       no-new-key property intact. Rejected: it would put a key in the
    #       property-key contract whose only purpose is to be contradicted once,
    #       and it is precisely the value-already-in-force restatement both
    #       overlays remove everywhere else. The narrower exception is to add one
    #       leaf under a node the base already owns and to say so here.
    #       (4) Assumptions: springdoc.api-docs stays enabled and is NOT switched
    #       off alongside this. The two are separable and only one of them is a
    #       form: the api-docs path serves the document, which is what a client
    #       generator or a reviewer reads, while the UI is the page that submits
    #       requests. Switching both off would take away the machine-readable
    #       contract to remove an interactive form, and the base's static-resource
    #       location publishes that contract deliberately.
    enabled: false

# =============================================================================
# Closing notes: six deliberate absences and one withdrawal
# -----------------------------------------------------------------------------
#   Each entry below is a key a reader would reasonably expect a production
#   overlay to carry. An absent key has no line of its own to sit beside, so the
#   reasoning is collected here rather than left to be re-derived. Under the
#   governing Explainability rule the PRESENCE of a key in an overlay is itself a
#   decision; so is its absence, when a reasonable author would have written it.
#   Four of the six are keys application-dev.yml DOES set -- the pool ceiling, the
#   three pool timeouts, the two health-detail keys and the two logger levels -- so
#   a reader comparing the two files finds a value on one side and this block on
#   the other, which is the comparison that has to be answerable. Refactoring
#   Rationale: this said four of SEVEN, counting the queue-consumer bounds as a
#   fifth dev-set entry among them; the arithmetic and the denominator both move
#   with the withdrawal, so both are re-derived from the two files rather than
#   adjusted by one.
#
# WHY : Assumptions: spring.datasource.hikari.maximum-pool-size is NOT raised and
#       stays at the base's ten, which is the one absence in this block that would
#       be a defect rather than untidiness if it were written differently. The
#       ceiling is not a local decision: infra/envs/prod/main.tf keeps a map of
#       per-service pool sizes, states that the map MIRRORS
#       spring.datasource.hikari.maximum-pool-size in each service's
#       application.yml, and derives the cluster's connection budget and its alarm
#       threshold from the product of that map and the task count. It records the
#       failure mode itself: a value that drifts from a service's application.yml
#       understates the budget. So raising the pool here to twenty would not merely
#       spend an allowance the other contexts share -- the base file names that
#       consequence, and names its symptom, an exhaustion error raised in
#       whichever service connects NEXT rather than in the one that took the slots
#       -- it would also leave the threshold computed from ten while the pools
#       could open twenty, which is the same as switching the alarm off for the
#       case it exists to catch. A profile cannot be the place this number
#       changes, because the infrastructure that budgets it reads the base file
#       and cannot see a profile.
#       Trade-offs: the accepted cost is that a burst beyond ten concurrent
#       database operations queues for a connection here exactly as it does in the
#       base. That is accepted because these are lookups against six small tables
#       holding a connection for milliseconds, and because the warm floor above
#       removes the establishment cost from most of them.
#
# WHY : Assumptions: connection-timeout, idle-timeout and max-lifetime are all
#       inherited, and each is inherited because the base's value is already the
#       production one -- application-dev.yml is the file that moves them, and it
#       records that this file does not. Ten seconds for acquisition is the base's
#       own choice and prod is the environment it was chosen for: no request here
#       waits on a cluster resume, so the thirty seconds dev needs would buy
#       nothing while bringing the thread-pool cascade the base describes nearer.
#       Five minutes of idle life is correctly ordered against fifteen minutes of
#       total life for these numbers, and the pool disables an idle timeout that
#       comes within a second of the lifetime, so the inherited pair is the pair
#       that is actually in force. Fifteen minutes of total life sits below the
#       shortest window in which anything between the pool and the engine may
#       retire a connection, which is the ordering that matters: the pool must
#       retire a connection before the network path or the engine does, or it
#       hands out a socket the server has already dropped and the first statement
#       on it fails as a broken pipe that reads like an application defect. Dev
#       shortens it because its own shortest window is auto-pause, which prod does
#       not have; nothing about prod's path is shorter than the base assumed, so
#       there is no prod-specific number to write.
#
# WHY : Trade-offs: statement echo stays off, and it is off in the base rather than
#       switched off here -- spring.jpa.show-sql is already false, and Hibernate's
#       statement formatting is left at its own default of off, so neither is
#       restated. What that gives up is exactly what application-dev.yml keeps
#       deliberately: the statement text is where a keyset predicate is legible --
#       the ordering columns, the strict inequality against the previous page's
#       last key, and the limit of size-plus-one that decides whether a further
#       page exists -- and that visibility is genuinely useful while a paged
#       reference screen is being built. It is given up in a deployed task for two
#       specific costs rather than one. The volume cost is per-statement output on
#       the lookup path every other bounded context calls into synchronously, held
#       for the retention period the log group is configured with, which
#       infra/envs/prod/terraform.tfvars sets far longer here than in dev. The
#       disclosure cost is the one that settles it: raising statement logging
#       usefully means raising the bind-parameter logger with it, and that logger's
#       entire output is parameter values written to the same correlated stream
#       every request uses. Diagnosis in a deployed task is served by the
#       correlation identifier common-lib's
#       com.carddemo.common.web.CorrelationIdFilter publishes into the MDC and by
#       the metrics com.carddemo.common.observability.MetricsConfig tags, neither
#       of which is configured here and neither of which needs a second mechanism.
#
# WHY : Assumptions: no logger is named in this file at all, and the ceiling that
#       decision draws is deliberate rather than an oversight. The application
#       package stays at the base's INFO, which is the deployed level for it --
#       this service's own decisions, a refused transaction-type delete or a
#       disclosure-group lookup falling through to DEFAULT, are visible without
#       the per-request volume DEBUG produces -- and application-dev.yml is the
#       profile that raises it. The framework packages stay at their own defaults
#       and root stays at INFO, which is the base's stated position and is left
#       alone on purpose: lowering root would discard the startup and lifecycle
#       lines that confirm a task came up while saving nothing measurable, because
#       framework packages emit per-request output at DEBUG and not at INFO. The
#       migration logger stays at INFO because its output is the only record that
#       the seed completed and how long it took. The ceiling is this: no log
#       statement this profile enables may emit an unmasked primary account
#       number, a card verification value, a national identifier or a
#       government-issued identifier. No table in the reference schema holds any
#       of the four, so the ceiling is not about this schema's own columns -- it is
#       about the bind-parameter logger, which is a framework logger on the shared
#       correlated stream, and which stays at the base's WARN here. Dev's own note
#       at that key states the same limit and reaches it the same way, by not
#       raising the one logger whose output is nothing but values.
#
# WHY : Assumptions: nothing here skips, reorders, baselines or otherwise defers a
#       migration, and clean is not enabled in any form. Flyway stays enabled with
#       the base's locations, so a prod task applies V1__reference.sql and then
#       V2__seed_reference.sql on every start, seeding 862 rows -- 76 reference
#       rows across transaction types, categories and disclosure groups, plus 786
#       address-lookup rows -- before this service answers anything, and there is
#       no V3. That cost is what the HEALTHCHECK in
#       services/reference-service/Dockerfile is sized for at
#       --start-period=30s --interval=30s --retries=3, and the target group's grace
#       period has to allow the same interval; here the seed is the whole of it,
#       where dev pays a cluster resume before the first statement as well.
#       Tightening either on the assumption that startup is only process start
#       produces a task killed before it can ever become healthy, and the symptom
#       -- a replacement loop with no error in the application log -- points
#       nowhere near the cause. What a clean would remove is the seed, and the seed
#       carries the mandatory 'DEFAULT' disclosure-group rows. The consumer of
#       those rows is not this service: app/cbl/CBACT04C.cbl reads a disclosure
#       group per account, and at L436-L439, on file status '23' -- key not found
#       -- it moves 'DEFAULT' into FD-DIS-ACCT-GROUP-ID and performs
#       1200-A-GET-DEFAULT-INT-RATE to re-read. Should that re-read also fail, L455
#       displays 'ERROR READING DEFAULT DISCLOSURE GROUP' and L458 performs
#       9999-ABEND-PROGRAM, whose body at L628-L632 is DISPLAY 'ABENDING PROGRAM',
#       MOVE 0 TO TIMING, MOVE 999 TO ABCODE, CALL 'CEE3ABD' USING ABCODE, TIMING
#       -- a genuine Language Environment abend that ends the run. The baseline
#       behaves that way; the target keeps the same shape, so the equivalent
#       failure is a crash in batch-service, in a job holding no defect of its own,
#       caused by rows that a DIFFERENT service's profile permitted to be removed.
#       That divergence is recorded in
#       docs/architecture/cobol-to-service-traceability.md.
#
# WHY : Refactoring Rationale: a paragraph here explained why this overlay inherits
#       the queue-consumer bounds and the long-poll wait rather than varying them,
#       and it is withdrawn rather than reworded because there is nothing left to
#       inherit. This module consumes no queue: the baseline drives BOTH inquiry
#       programs from ONE request destination -- DEFINE
#       QLOCAL('CARDDEMO.REQUEST.QUEUE') at app/app-vsam-mq/README.md L53, aliased
#       to CICS as MQQUEUE(CARDREQ) at L71 -- and a queue admits exactly one owning
#       consumer, because a receive hides the message from every other consumer
#       rather than delivering a copy to each. The owner is
#       com.carddemo.account.service.InquiryMessageListener, which dispatches on the
#       request's four-character function code, so the sizing question and the
#       queue-naming question are both answered in that module's profiles now.
