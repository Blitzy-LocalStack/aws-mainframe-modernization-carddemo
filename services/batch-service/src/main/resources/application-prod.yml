# =============================================================================
# services/batch-service/src/main/resources/application-prod.yml
# -----------------------------------------------------------------------------
# Purpose:
#   The `prod` profile OVERLAY on application.yml for batch-service, the BATCH
#   bounded context of the CardDemo mainframe-to-microservices migration. It is
#   the matched pair of application-dev.yml and holds the same twelve keys that
#   document holds, restated with the values a production workload has a
#   specific reason to hold: which Parameter Store tier the module reads, how
#   long a connection attempt may wait, how many connections stay warm, how
#   tightly a database session is bounded, how many rows and how many statements
#   a round trip carries, and how loudly the module logs.
#
#   The framework activates this document when SPRING_PROFILES_ACTIVE=prod is
#   present in the task environment. infra/modules/ecs-service lists that
#   variable among the container's environment keys and infra/envs/prod sets it
#   from the environment name, so ONE image
#   runs in either environment and the profile stays a deployment-time choice
#   rather than a build-time one. Neither this document nor application.yml sets
#   the variable, because a file that selected its own profile would make both
#   overlays unreachable.
#
#   THE GOVERNING CONSTRAINT: `dev` and `prod` differ ONLY in sizing, pool
#   limits, session bounds, round-trip width, log level and retention -- NEVER
#   in topology. The reason is diagnostic rather than tidy: a defect reproduced
#   in `dev` is evidence about `prod` only while the two run the same shape, and
#   a single structural difference voids that without announcing itself, leaving
#   a batch defect reproducible nowhere but in production. Read this
#   file beside application-dev.yml: the two hold the same keys, and the
#   difference in their values is the whole environment delta.
#
#   This module PUBLISHES NO API. Every invocation is a short-lived container
#   task that one state of the orchestration starts with --job and
#   --business-date as container command arguments; it runs exactly one of the
#   seven jobs and exits, and the orchestration reads its process exit status.
#   Nothing in this file may turn it into a long-running process, and nothing
#   may interfere with that status.
#
#   One precision, because the earlier wording of the sentence above claimed
#   more than is true and a reader acting on it would draw the wrong conclusion
#   about this task's network footprint: the task DOES run an embedded servlet
#   container while a job is running. services/batch-service/pom.xml declares
#   spring-boot-starter-web and spring-boot-starter-actuator so that a health
#   endpoint exists to be read from inside the task while a job runs -- the image
#   itself declares no HEALTHCHECK, for the reason recorded above its ENTRYPOINT --
#   and that endpoint is the whole of the listener's purpose. Two properties keep it from making this a server. It is
#   bound to the loopback address by the server.address key of application.yml,
#   so it is reachable only from inside the task; and it exposes the health
#   endpoint alone, with details suppressed. It also cannot outlive the job:
#   BatchApplication closes the context and calls System.exit with the job
#   status.
#
# Inputs (the "parameters" this document consumes):
#   Activation:
#     SPRING_PROFILES_ACTIVE (string environment variable) -- must equal `prod`;
#       placed by the task definition, never here.
#   Keys it overrides, named by path because a key path locates the base
#   declaration durably where a line number does not. Eleven of the twelve
#   appear in application.yml; the twelfth, connection-timeout, is the same
#   single addition application-dev.yml makes, and it is argued at the key:
#     spring.config.import -- ordered list of config-data location strings.
#     spring.datasource.hikari.connection-timeout -- integer milliseconds;
#       absent from the base, added by both overlays.
#     spring.datasource.hikari.minimum-idle -- integer connection count.
#     spring.datasource.hikari.data-source-properties.options -- PostgreSQL
#       session-option string.
#     spring.jpa.show-sql -- boolean.
#     spring.jpa.properties.hibernate.jdbc.fetch_size -- integer row count.
#     spring.jpa.properties.hibernate.jdbc.batch_size -- integer statement count.
#     logging.level.com.carddemo -- log-level string.
#     logging.level.org.springframework.batch -- log-level string.
#     logging.level.org.flywaydb -- log-level string.
#     logging.level.org.hibernate.SQL -- log-level string.
#     logging.level.org.hibernate.orm.jdbc.bind -- log-level string.
#   Environment variables it reads:
#     CARDDEMO_ENVIRONMENT (string environment variable) -- an environment
#       LABEL, never a location, a credential or an endpoint. It is the one
#       placeholder here carrying a default, for the reason
#       the rationale carried at `spring.config.import` in application.yml records: an unresolved placeholder inside
#       spring.config.import aborts the earliest configuration-loading phase,
#       before the `optional:` prefix can take effect.
#   Values it does NOT supply and must never supply:
#     the Aurora writer endpoint, the database credentials, the dataset bucket,
#     the error-queue URL and every key identifier. Each is an output of a
#     Terraform module, published to Parameter Store or Secrets Manager and read
#     at startup through the import below. That chain is what makes "no secrets
#     committed" a structural property of this file rather than a claim a
#     reviewer has to keep re-checking.
#
# Outputs (what this document establishes, and what it leaves unchanged):
#   Result type: a Spring Environment property overlay whose scalar and list
#   values replace matching base properties during ConfigData merge.
#   It establishes the production connection budget, the warm-connection
#   floor, the session bounds, the two round-trip widths and the log levels, and
#   nothing else. Every element of this module's topology is INHERITED from
#   application.yml and is absent here on purpose, because restating one would
#   fork the decision and trimming one would break the module:
#     the ordered FIVE-schema search path -- batch, ledger, account, card,
#       reference -- carried on the pooled connection's `options`, applied once
#       per PHYSICAL connection, which is what also pins Flyway's own
#       connections without a second declaration;
#     Flyway scoped to classpath:db/migration and to the `batch` schema for both
#       the migration and its history table, creating no schema and with
#       cleaning disabled;
#     `spring.jpa.hibernate.ddl-auto` held to validate, so a mapping that
#       disagrees with a physical table stops the task at startup rather than
#       mid-chunk;
#     the job-repository tables left to resolve through that search path rather
#       than through a table-prefix property;
#     exactly one non-distributed datasource and therefore the single
#       auto-configured transaction manager, which is what keeps the three-write
#       posting unit of work at app/cbl/CBTRN02C.cbl:440-442 a single atomic
#       commit;
#     `spring.datasource.hikari.maximum-pool-size` and
#       `leak-detection-threshold`, both argued as explicit non-overrides under
#       WHY below;
#     TLS at verify-full with its explicit trust anchor, of which only the
#       sibling `options` map entry is replaced below;
#     `spring.batch.job.enabled` left false, so that job selection stays with
#       the container command and nothing here gives the task a second source of
#       truth;
#     and the loopback-bound, health-only listener -- `server.port` 8080 with
#       `server.address` 127.0.0.1, and `management.endpoints.web.exposure.include`
#       narrowed to `health` with details suppressed -- inherited exactly as
#       application.yml declares it.
#       Refactoring Rationale: this entry read "and no listening socket of any
#       kind." It was the last element of a list whose whole purpose is to tell a
#       reader what this overlay inherits, so the one false element was also the
#       one a reader would act on: application.yml declares both server keys, the
#       precision at L39-50 of this file states the listener exists, and the same
#       document therefore asserted both sides of the question. The socket is
#       restated here with the three properties that bound it, because "inherited"
#       is only reassuring if what is inherited is named.
#   It also leaves the process exit-status contract entirely alone -- 0 clean, 4
#   completed with rejects, 8 or more a hard failure -- which
#   BatchApplication.exitStatusOf translates from the BatchReturnCode constants.
#   No key in this file grades anything.
#
# Fails when:
#   - `prod` Aurora capacity is ever scaled to zero. The connection budget below
#     is tightened on the strength of infra/envs/prod/terraform.tfvars:21
#     setting aurora_min_capacity to 2, so the cluster never pauses and no task
#     pays a resume. An operator who lowers that floor to save cost must widen
#     this budget in the same change, or a healthy cold start reports as an
#     unreachable database.
#   - A topology key is overridden here. Nothing errors; `prod` simply stops
#     matching `dev`, and the divergence first surfaces as a parity failure in a
#     run this file gives no reason to suspect.
#   - A key is written that neither application.yml declares nor any framework
#     property matches. Spring accepts an unknown key in SILENCE, so the symptom
#     is a missing behaviour with no diagnostic at all -- in production, a
#     difference no log line explains. Every key below was checked against the
#     base document and against the setter it binds to.
#   - reference.disclosure_groups holds no 'DEFAULT' row. This is a
#     cross-service precondition owned by reference-service, which seeds it in
#     db/migration/V2__seed_reference.sql. app/cbl/CBACT04C.cbl:436-438 moves
#     'DEFAULT' into the group key when the keyed read returns status '23' and
#     the program abends when a read fails outright, so the interest state fails
#     at the database. Neither that table nor its seed belongs to this module,
#     which only reads it through the inherited search path.
#   - Either cardholder-data floor at the foot of this file is raised. Nothing
#     fails; the log stream simply begins carrying unmasked primary account
#     numbers for every record in the input feed.
#
# Deliberate omissions, so that each absence reads as a decision:
#   - Assumptions: no management.* and no server.* in THIS overlay, even though
#     peer overlays in other contexts set
#     management.endpoints.web.exposure.include. Both namespaces ARE declared, and
#     declared exactly once, in application.yml; the inherited-topology list above
#     names the four keys and their values rather than repeating them here, because
#     two copies of a literal value are two places it can be edited apart. They
#     are absent from this overlay because they are TOPOLOGY, and the governing
#     constraint at the head of this file puts topology in the base document alone
#     -- an overlay that restated either namespace would let `prod` drift from
#     `dev` in the one dimension this file is not permitted to vary.
#     Refactoring Rationale: this entry previously explained the absence by
#     asserting that "this module declares neither the actuator nor the web
#     starter -- its pom.xml argues both rejections beside its dependency set --
#     so both namespaces would bind to nothing here". Every clause of that was
#     inverted. pom.xml declares spring-boot-starter-actuator at L188-191 and
#     spring-boot-starter-web at L223-226, and the comments beside them argue why
#     each is PRESENT -- the actuator to publish the health endpoint, the web
#     starter to carry the servlet that answers it -- not why either is
#     rejected. Both namespaces therefore bind to something real, so an override
#     written here would take effect silently rather than be ignored, which
#     reverses the risk the note was warning about: a reader told the keys are
#     inert is a reader who will set one. The absence is still correct; only its
#     stated reason was wrong, so the reason is replaced rather than the entry
#     deleted.
#   - Trade-offs: no logback-spring.xml and no retention key. Retention is a
#     property of the CloudWatch log group infra/modules/observability
#     provisions, not of this artifact: the container writes to standard output
#     and error, and the log driver the task definition configures collects
#     them.
#   - Assumptions: no spring.profiles.active, no default job, no
#     spring.batch.job.name, and no default or canonical format for the
#     business date. The business-date token is an OPAQUE passthrough, because
#     app/cbl/CBACT04C.cbl:476-480 concatenates whatever PARM-DATE holds
#     straight into the transaction identifier under DELIMITED BY SIZE with no
#     editing, and BOTH shapes are committed as goldens --
#     20220718000000010100 in
#     tests/golden/interest/e2e_interest_cycle_transactions.expected, matching
#     app/jcl/INTCALC.jcl:22 PARM='2022071800', against 2024-01-150000010100 in
#     tests/golden/interest/happy_path/transact.expected. A canonical format
#     here would satisfy one golden and break the other. app/jcl/POSTTRAN.jcl:23
#     carries no PARM= at all, so post-transactions needs no business date;
#     which arguments a job requires belongs to the job configuration and to
#     BatchApplication, never to this file.
#   - Assumptions: no rounding, scale or spring.jackson.* key.
#     app/cbl/CBACT04C.cbl:464-465 computes
#     ( TRAN-CAT-BAL * DIS-INT-RATE) / 1200 with NO ROUNDED phrase, so the
#     baseline statement discards its surplus digits and the Java implements
#     that same result at the one divide it applies to; money is otherwise exact
#     base-ten decimal end to end -- NUMERIC(11,2) in the database for the
#     S9(09)V99 amounts carried by app/cbl/CBTRN02C.cbl:187, BigDecimal at scale
#     2 in Java, never a binary floating-point type and never a JSON number. Any
#     divergence between the two is documented in the traceability register
#     rather than introduced here, and no key in this file may disturb either.
#   - Assumptions: no springdoc.* and no spring.security.oauth2.*. This module
#     publishes no API contract and serves no BUSINESS request, so there is
#     nothing to advertise and nothing to authorise; there is no
#     services/batch-service/src/main/resources/openapi/ directory for the same
#     reason, and this module's pom.xml records beside its dependency set why the
#     security starter is absent.
#     Refactoring Rationale: this entry read "serves no request" without
#     qualification, and the loopback health endpoint is a request it does serve.
#     The two words are added because the unqualified form contradicted the
#     precision at L39-50 in the same direction as the two errors corrected above,
#     and because the distinction is the whole justification for the absences: the
#     one request this module answers is deliberately UNAUTHENTICATED and is not
#     part of any published contract, which is why neither springdoc nor a
#     resource-server configuration has anything to act on. "request-driven
#     starters are absent" was also wrong as written -- pom.xml declares
#     spring-boot-starter-web at L214-217 precisely to carry that endpoint; what it
#     declines is the SECURITY starter, under its own "THIS MODULE DECLARES NO
#     SECURITY STARTER" heading, so the claim is narrowed to the dependency that is
#     genuinely absent.
#   - Trade-offs: no statement_timeout, no read replica, no second datasource,
#     no cache and no queue-listener enablement. The first is argued at the
#     session bounds below; the rest are absent from the base as well, so adding
#     any of them here would be a topology change rather than a size change.
#   - Assumptions: no carddemo.* namespace. This module defines no
#     configuration-properties binder under
#     services/batch-service/src/main/java/com/carddemo/batch, so such a key
#     would bind to nothing and be accepted in silence.
#
#   NO LITERAL SECRET, CREDENTIAL, HOSTNAME, ENDPOINT, BUCKET NAME, QUEUE URL,
#   KEY IDENTIFIER OR ACCOUNT IDENTIFIER VALUE APPEARS IN THIS FILE.
#
#   Documentation convention: docs/CODE_DOCUMENTATION_STANDARD.md. YAML has no
#   docstring construct, so this header block is the module-entry-point
#   equivalent, and every key below carries an adjacent rationale under one of
#   the four canonical labels. The same standard fixes the comment FORM used
#   here: the paired what-and-why comment idiom belongs to fenced command blocks
#   in prose and is not written above a statement in a configuration file, so
#   purpose lives in this header and each key comment carries a labelled why and
#   nothing else.
# -----------------------------------------------------------------------------
# WHY (non-obvious design decisions):
#
#   Each key below carries its own labelled rationale at the key itself, so the
#   budget, warm-floor, session-bound, round-trip and logging decisions are
#   argued there rather than summarised twice here. What follows is the set of
#   decisions that have no key to sit on, because each one is either a
#   non-override a reader would plausibly expect to find filled or a constraint
#   spanning the whole document.
#
#   - Trade-offs: this is the only document of the pair whose connection budget
#     can be tightened, and that is a coupling to infrastructure rather than a
#     preference. infra/envs/dev/terraform.tfvars:24 sets aurora_min_capacity to
#     0, so a `dev` cluster pauses while idle and the first connection of an
#     otherwise healthy run pays a resume;
#     infra/envs/prod/terraform.tfvars:21 sets it to 2, so a `prod` cluster
#     never pauses and no task ever waits on one. What that buys is detection
#     speed -- an endpoint that really is unreachable fails its state promptly,
#     the state's catch handler routes the failure, and the batch window is not
#     spent waiting behind a resume-sized grace period. What it gives up is
#     independence: the value is safe only while that capacity floor stays above
#     zero, which is why the coupling is named in the failure list above and
#     again at the key itself rather than left for an operator to rediscover.
#   - Trade-offs: the maximum pool size is deliberately NOT overridden, even
#     though this profile runs the whole production feed rather than a fixture.
#     The base sizes `spring.datasource.hikari.maximum-pool-size` by how many
#     transactions ONE job runs concurrently -- never by feed volume, because a
#     task that runs one job and exits serves no traffic -- and its rationale is
#     carried at that key. Raising it here would draw on a connection budget
#     eight peer roles share without making any job finish, so only the floor of
#     warm connections is raised below.
#   - Trade-offs: the connection leak detector is likewise NOT restated. Its
#     threshold, `spring.datasource.hikari.leak-detection-threshold` in application.yml, is deliberately set ABOVE the
#     server-side idle-in-transaction ceiling, so that a connection stuck INSIDE
#     a transaction is terminated by the server while the client-side detector
#     reports only the checked-out-but-idle case an unclosed streaming read
#     produces. Tightening it for production would warn on every legitimately
#     long step and train an operator to ignore the one warning that matters,
#     and the detector only warns -- it never closes a connection -- so the
#     looser bound is the safe direction to err in. The session bound below is
#     moved in the direction that WIDENS that gap rather than closing it.
#   - Trade-offs: the mainframe condition-code rubric is quarantined. A return
#     code of 4 is a WARN tier that still lets the chain continue -- its single
#     origin is app/cbl/CBTRN02C.cbl:229, reading IF WS-REJECT-COUNT > 0, and
#     :230, reading MOVE 4 TO RETURN-CODE, and
#     tests/golden/posting/reject_102_overlimit/return_code.expected records
#     exactly 4, so a run that produced rejects and reported 0 would be a parity
#     failure rather than a tidier result. That graded scale belongs to the
#     parity oracle under tests/ and to this container's process exit status,
#     because the orchestration reads it, and nowhere else. Maven, the
#     documentation gate and both test runners are binary: describing a Java
#     build as warn-level green would hide a real failure behind a borrowed
#     vocabulary.
#   - Assumptions: raising verbosity is the one change this profile must NOT
#     make, which is why five logging keys appear below holding the base's own
#     values. The base holds this module's categories level with the root and
#     floors statement and bind logging OFF; application-dev.yml raises the
#     first three at those same three keys because a `dev` feed is
#     fixture-sized and the reason to run a job there is to watch it. Under this
#     profile the feed is the whole production feed, so the same raise would
#     emit per-record and per-chunk lines for an entire run; and the two bind
#     categories sit UNDERNEATH the mapper layer that masks the primary account
#     number and suppresses the card verification value, so raising them would
#     defeat that masking without touching it. Restating rather than inheriting
#     silently is what puts the reason in front of an operator who is
#     diagnosing a failed run and reaching for a debug level.
# =============================================================================

spring:

  # WHY : (1) Assumptions: the same MECHANISM as the base and as its matched
  #       pair, addressed at a different tier -- an `optional:aws-parameterstore:`
  #       import, exactly as application.yml declares it at `spring.config.import`, with only the
  #       default environment label changed to `prod`. The path is a logical
  #       Parameter Store prefix, not an endpoint, and it names no value.
  #       (2) Refactoring Rationale: inheriting the base's `local` default
  #       unchanged would let a task started with the `prod` profile and no
  #       CARDDEMO_ENVIRONMENT injected take its SIZING from this file and its
  #       parameter VALUES from the `local` tier. Both paths resolve and the
  #       import is `optional:`, so nothing would report the mismatch -- a
  #       production run would simply use a parameter set nobody
  #       intended. Pinning the default to `prod` makes the profile and the tier
  #       it reads agree by construction, which is the same correction
  #       application-dev.yml:106-112 applies on its side of the pair.
  #       (3) Assumptions: the shared defaults document is named again in this
  #       list. This key REPLACES the base document's list rather than adding to
  #       it, so omitting the classpath entry would drop the shared console log
  #       pattern under this profile only -- and the correlation identifier that
  #       ties the eleven tasks of one orchestration execution together would
  #       vanish from exactly the logs an incident is reconstructed from. It is
  #       listed first so anything the parameter store publishes still wins over
  #       it.
  config:
    import:
      - "classpath:/carddemo-common-defaults.yml"
      - "optional:aws-parameterstore:/carddemo/${CARDDEMO_ENVIRONMENT:prod}/batch/"

  datasource:
    hikari:
      # Trade-offs: this is the one key application.yml does not declare, and the
      #       budget is TIGHTER here than both the framework default and the 45000
      #       application-dev.yml:145 sets, because the two profiles address
      #       differently provisioned clusters. infra/envs/dev/terraform.tfvars:24
      #       sets aurora_min_capacity to 0, so a `dev` cluster pauses while idle
      #       and the first connection of an otherwise healthy run -- taken by
      #       Flyway at startup, before any job step executes -- must wait out a
      #       resume, which is why that file widens the budget instead.
      #       infra/envs/prod/terraform.tfvars:21 sets it to 2, so this cluster
      #       never pauses and no task waits on one; a connection attempt that has
      #       not completed within this budget is therefore evidence of an
      #       unreachable writer rather than of a cold one. What that buys is that
      #       the state fails promptly and its catch handler routes the failure
      #       while the batch window is still open, instead of the window being
      #       spent waiting behind a resume-sized grace period. What it gives up is
      #       independence from the infrastructure: lowering that capacity floor to
      #       zero without widening this value would present a healthy cold start
      #       as an unreachable database, so the two have to move together.
      connection-timeout: 10000

      # Trade-offs: two connections stay warm, where the base keeps one and
      #       application-dev.yml:161 keeps none -- the same capacity floor read
      #       the other way round. A `dev` task holding an idle connection occupies
      #       a slot a floor of zero makes scarce and keeps an idle cluster from
      #       settling into the paused state that floor exists to reach; neither
      #       cost applies to a cluster held at a floor of 2, which never pauses.
      #       Two is also the number of transactions this module has open
      #       CONCURRENTLY at its narrowest, because the job repository writes step
      #       and job execution state in a transaction SEPARATE from the chunk
      #       transaction, as application.yml records at `spring.datasource.hikari.maximum-pool-size`, so pre-warming both
      #       means neither pays its own establishment cost inside the batch
      #       window. What is given up is that a job running only set-based
      #       statements holds a second connection it may never check out, against
      #       a budget eight peer roles share. That is accepted because the
      #       orchestration states run sequentially, so at most one task holds
      #       them at a time. The MAXIMUM is deliberately not raised alongside
      #       this floor, for the reason recorded in the header.
      minimum-idle: 2

      # Trade-offs: two of the three bounds the base sets are tightened and the
      #       third stays absent. Lock waiting and idle-in-transaction are
      #       shortened relative to the base value in application.yml because this is the profile
      #       in which holding the batch window open has a cost: states 1 and 11 of
      #       the orchestrated chain, QuiesceOnlineWrites and ResumeOnlineWrites at
      #       infra/modules/step-functions-batch/main.tf:58, bracket that window,
      #       so a step blocked behind a row lock must fail and be retried by the
      #       state machine rather than sit inside the bracket holding it open.
      #       Both stay LOOSER than the 10000 and 120000 application-dev.yml:185
      #       sets, because a `dev` run competes with no online traffic at all
      #       while a production run can still meet a lock held by a transaction
      #       that began before the write quiesce took effect; a hair-trigger wait
      #       would turn that ordinary, self-clearing contention into a failed
      #       state and spend a retry on it.
      # Trade-offs: statement_timeout stays unset, exactly as in both other
      #       documents. A batch step legitimately runs a single long set-based
      #       statement -- the combine step replaces the sort and merge of
      #       app/jcl/COMBTRAN.jcl with one ordered query -- and the outer bound on
      #       a step is already the per-state TimeoutSeconds the invoking state
      #       machine applies at infra/modules/step-functions-batch/main.tf:156. A
      #       second, shorter bound here would cancel correct work part way through
      #       the chain and report it as a failure, for no outcome the state
      #       machine does not already guarantee.
      # Assumptions: lowering the idle-in-transaction ceiling PRESERVES the base's
      #       ordering invariant, which requires the client-side leak detector to
      #       sit ABOVE the server-side ceiling so that the server terminates a
      #       connection stuck inside a transaction while the detector reports only
      #       the checked-out-but-not-in-transaction case an unclosed stream
      #       produces. Lowering the ceiling widens that gap rather than closing
      #       it.
      # Assumptions: only this map ENTRY is replaced. sslmode and sslrootcert are
      #       separate entries of the same map under `spring.datasource.hikari.data-source-properties` in application.yml and are
      #       inherited unchanged, so verify-full and its explicit trust anchor
      #       still apply under this profile.
      data-source-properties:
        options: "-c lock_timeout=20000 -c idle_in_transaction_session_timeout=180000"

  jpa:
    # Trade-offs: held at the base value in application.yml rather than raised, and restated
    #       rather than merely inherited because this is the profile in which it
    #       would be reached for: after a production run fails, an operator wants
    #       to see the statements. This key echoes them through the
    #       persistence provider straight to standard output, bypassing the logging
    #       framework, so no logger level below can filter it and none of the
    #       mapper-layer masking reaches it; and the values bound into a posting
    #       statement include the primary account number of every transaction in
    #       the feed, which under this profile is the whole production feed rather
    #       than a fixture. What is given up is reading executed SQL from a
    #       production task's log; the accepted substitute is reproducing the
    #       step against a local database container, where the rows are fixture
    #       rows.
    show-sql: false

    properties:
      hibernate:
        jdbc:
          # Trade-offs: a WIDER reader window than the base's 100, and far wider
          #       than the 25 application-dev.yml:215 sets, because this profile
          #       reads the whole production feed rather than a fixture. The
          #       window is what bounds a streaming read's memory. Widening it
          #       trades a larger constant-size buffer for fewer round trips over
          #       the same feed, and the buffer size stays constant however large
          #       the feed grows. What is given up is attribution: a failing read
          #       is narrowed to a wider band of rows than it would be in `dev`.
          #       That is accepted because the record behind a business rejection
          #       is named in the reject stream and the run itself in
          #       batch.batch_run, neither of which
          #       depends on how many rows shared a round trip.
          # Assumptions: the value must stay strictly positive.
          #       application.yml records at `hibernate.jdbc.fetch_size` that the driver opens a
          #       server-side cursor only when a positive fetch size and
          #       auto-commit off BOTH hold, so a zero here would buffer the entire
          #       result in the client and fail on feed size alone rather than on
          #       anything about the data.
          fetch_size: 250

          # Alternatives Considered: a saga, a distributed coordinator or an
          #       outbox-plus-compensating-reversal, so that a wider write
          #       grouping could also commit in pieces. Rejected.
          #       app/cbl/CBTRN02C.cbl commits three
          #       writes as ONE unit of work inside 2000-POST-TRANSACTION -- :440
          #       2700-UPDATE-TCATBAL, :441 2800-UPDATE-ACCOUNT-REC, :442
          #       2900-WRITE-TRANSACTION-FILE -- so committing them separately
          #       would make a state such as a posted transaction whose category
          #       balance has not moved observable. No such state exists in the
          #       baseline, so the golden masters would correctly report it as a
          #       parity failure. This key is behaviour-neutral ONLY because it
          #       changes how many statements of the same type share a round trip
          #       and nothing about the transaction boundary: those three writes
          #       stay inside one commit at every value it can take.
          # Trade-offs: the grouping is wider than the base's 50 and much wider
          #       than the 10 application-dev.yml:232 sets, because the statement
          #       count here is the whole feed's rather than a fixture's. What is
          #       given up is attribution: a constraint violation surfaces against
          #       a wider group of statements. That is accepted because the chunk
          #       transaction rolls back whole either way, so there is no partly
          #       applied work to attribute, and because the validate-only setting
          #       at `spring.jpa.open-in-view` in application.yml exists to stop a schema-contract mismatch
          #       reaching a run at all.
          # Alternatives Considered: hibernate.order_inserts and
          #       hibernate.order_updates are deliberately still NOT set, for the
          #       reason application.yml gives at `hibernate.jdbc.batch_size` -- they raise grouping by
          #       REORDERING statements across entity types, which would move the
          #       physical order further from the transcribed order of those same
          #       three writes and buy nothing the single transaction does not
          #       already guarantee.
          batch_size: 100

logging:
  level:
    # Assumptions: this module's own categories are held at the base's level
    #       rather than raised, the inverse of application-dev.yml:250 and the
    #       whole reason both overlays state a level at all. A job's progress is
    #       recorded durably in batch.batch_run and its outcome in the process exit
    #       status, so per-record output earns nothing in a production run and
    #       costs one log line per record of the input feed. Raising a category
    #       would also never authorise logging a whole record, a primary account
    #       number or a card verification value: the masking that suppresses those
    #       lives in the mapper layer, and a debug statement that formats an
    #       entity directly is the easiest way to defeat it.
    # Trade-offs: the root floor `logging.level.root` in application.yml is deliberately not
    #       touched in EITHER direction, which is why it is absent here. Raising it
    #       would emit third-party debug output for an entire feed; lowering it
    #       below the base's floor would suppress the framework's own step and
    #       migration lines named below, which are the first thing read when a
    #       batch state fails -- and the base reserves that floor to itself for
    #       exactly that reason.
    com.carddemo: INFO

    # Trade-offs: this rationale governs BOTH keys below, which stay at the base's
    #       level where application-dev.yml:261-262 raises them. At this level the
    #       batch framework still logs job and step start, completion and exit
    #       status, and the migration engine still logs which migrations it
    #       applied, which together answer the first two questions a failed
    #       state raises -- which step stopped, and did the schema change.
    #       Raising them would add per-chunk transitions for an entire run, and
    #       that volume buys nothing those two answers do not already give.
    org.springframework.batch: INFO
    org.flywaydb: INFO

    # Trade-offs: this rationale governs BOTH keys below, which preserve the
    #       floor application.yml sets on `org.hibernate.SQL` and `org.hibernate.orm.jdbc.bind` rather than leaving it unset, and it
    #       is a data-protection floor rather than a volume control. A bound
    #       parameter in this module carries the primary account number of every
    #       transaction in the feed. These two categories sit UNDERNEATH the
    #       mapper layer that does the masking, so
    #       they bypass it entirely -- one raised level here would write unmasked
    #       cardholder data to the container's log stream at full feed volume,
    #       defeating the masking without touching it. OFF rather than a higher
    #       threshold because these categories emit at DEBUG and TRACE, so any
    #       level above them merely happens to exclude them and would let one
    #       lowered number re-enable both. They are restated rather than inherited
    #       silently so that this file -- the one an operator opens while
    #       diagnosing a production incident -- carries the reason not to raise
    #       them.
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
