# =============================================================================
# services/batch-service/src/main/resources/application.yml
# -----------------------------------------------------------------------------
# Purpose:
#   Base, profile-independent Spring Boot configuration for batch-service, the
#   BATCH bounded context of the CardDemo mainframe-to-microservices migration.
#   It settles the values every environment shares: the health-only HTTP surface,
#   the datasource and its connection pool, the ordered schema search path,
#   Flyway migration of the one schema this module owns, persistence-provider
#   behaviour, job-launch policy and log levels.
#
#   application-dev.yml and application-prod.yml are OVERLAYS on this document.
#   This document is written to start with no profile active at all, which is why
#   every value a profile would otherwise tune is a concrete literal here. An
#   overlay may differ from this document only in sizing, pool
#   limits, log level and retention, never in topology, so a setting that changes
#   behaviour rather than capacity belongs here and not in a profile. Every
#   statement below about what an overlay MAY and MAY NOT vary is that constraint,
#   which for `prod` is a forward one; a reader can confirm the current state with
#   `ls services/batch-service/src/main/resources`.
#
#   This module is argument-driven rather than request-driven. Every invocation
#   is a short-lived container task whose command arguments select one job; the
#   only listener exists so the Dockerfile can probe actuator health while that
#   job runs. There is no business route or administrative trigger, and
#   BatchApplication closes the context and exits with the job's process status.
#
#   The seven jobs are named as classes at
#   src/main/java/com/carddemo/batch/package-info.java L77 to L82:
#   PreflightDailyTransactionsJob, PostTransactionsJob, CalculateInterestJob,
#   BackupTransactionsJob, CombineTransactionsJob, ExportJob and ImportJob.
#   Their behavioural oracle is the COBOL under app/**, which is read and cited
#   by path and line but never modified.
#
# Inputs (the "parameters" this document consumes):
#   Property namespaces it owns and is the only declarer of:
#     server.port  spring.application.name  spring.config.import  spring.cloud.aws
#     spring.lifecycle  spring.datasource[.hikari]  spring.flyway  spring.jpa
#     spring.batch.job  spring.sql.init  management  logging.level
#   Injected environment variables, every one resolved at run time and none
#   carrying a value committed to this repository:
#     SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
#     SPRING_DATASOURCE_PASSWORD  -- the writer endpoint and its credentials,
#     placed by the task definition from Parameter Store and Secrets Manager,
#     both populated from infrastructure outputs.
#     CARDDEMO_DB_SSL_ROOT_CERT   -- certificate-bundle path inside the image.
#     AWS_REGION                  -- required for the module to START, because the
#     AWS starters build their clients eagerly. See the note at spring.cloud.aws.
#     CARDDEMO_ENVIRONMENT         -- environment label used only to address the
#     Parameter Store prefix.
#     SPRING_PROFILES_ACTIVE       -- read by the framework, never set here, so
#     that the two overlays stay reachable.
#   Command-line arguments this document deliberately does NOT usurp:
#   --job=<one of the seven names above> and --business-date=<10-character token>.
#   Both arrive as container command arguments and are consumed by
#   BatchApplication. No property here selects a job, defaults a job, or defaults
#   or reformats a business date.
#
# Outputs (what this document establishes for every task):
#   An ordered FOUR-schema connection search path -- batch, ledger, account,
#   reference -- applied once per physical pooled connection, so every unqualified
#   table name resolves deterministically and Flyway's own connections are pinned
#   by the same mechanism; Flyway scoped to this module's classpath location and to
#   the `batch` schema for both the migration and its history table, creating no
#   schema and cleaning nothing; the persistence provider held to validate-only, so
#   a mapping that disagrees with a physical table stops the task at startup; the
#   job-repository tables resolved to batch.BATCH_* through that search path rather
#   than a prefix property; exactly one non-distributed datasource and therefore
#   the single auto-configured transaction manager, which is what keeps the
#   three-write posting unit of work at app/cbl/CBTRN02C.cbl:440-442 one atomic
#   commit; and a health-only actuator response on port 8080 for the image probe.
#
# Fails when (the "exceptions" a reader must know about):
#   - Flyway core reaches the classpath without its PostgreSQL companion. Per
#     database support was moved out of Flyway core, so the core artifact alone
#     compiles, packages and passes every test, then aborts on FIRST CONTAINER
#     START with a missing-database-plugin error. Both artifacts are declared side
#     by side in services/batch-service/pom.xml and neither is re-pinned here. This
#     is the one failure mode in this file that no build gate can catch.
#   - The search path omits `reference` or `card`. CalculateInterestJob then cannot
#     resolve disclosure_groups, which app/cbl/CBACT04C.cbl:47 opens as DISCGRP,
#     and PreflightDailyTransactionsJob cannot resolve the card master, which
#     app/cbl/CBTRN01C.cbl:46 opens as CARDFILE to validate the daily feed. Either
#     way the nightly chain fails at the database rather than in this file.
#   - reference.disclosure_groups holds no 'DEFAULT' row. This is a cross-service
#     precondition owned by reference-service, which seeds the row in
#     db/migration/V2__seed_reference.sql; that migration having been applied is a
#     precondition of the interest step rather than of this document.
#     app/cbl/CBACT04C.cbl:437 moves 'DEFAULT' into the group key as its fallback,
#     and :443-459 abends the program at :458 when that read does not return '00'.
#   - A migration owned by another context has not been applied when a task
#     starts. Validate-only then refuses to start rather than failing mid-chunk.
#   - No region is available. The AWS starters build their clients while
#     configuration is still loading, so a context with no region aborts before any
#     parameter is read and before the datasource is touched -- even though nothing
#     in a given job may use AWS at all. The `optional:` prefix does NOT cover
#     this: it makes a missing PARAMETER PATH tolerable, not a client that cannot
#     be constructed.
#   - Any injected environment variable above is absent. The placeholders carry no
#     fallback on purpose, so startup fails loudly instead of quietly selecting
#     something committed here.
#
# Deliberate omissions, so that each absence reads as a decision:
#   - No spring.main.web-application-type override: the web stack must remain
#     active so the actuator route answers the Dockerfile probe.
#   - No spring.security.* and no springdoc.*: no security starter, controller or
#     published business contract ships in this module; management exposure is
#     narrowed to health and cannot trigger a job.
#   - No spring.jackson.* override: the web starter supplies Jackson transitively
#     for actuator infrastructure, but this module publishes no business payload.
#     Money remains NUMERIC(11,2) in the database and BigDecimal scale 2 in Java,
#     never a binary floating-point value, and no key here may weaken that.
#   - No rounding or scale default: app/cbl/CBACT04C.cbl:464-465 computes
#     ( TRAN-CAT-BAL * DIS-INT-RATE) / 1200 with NO ROUNDED phrase, so the
#     reference statement discards its surplus digits. That behaviour belongs to
#     the interest service, and nothing here may disturb it.
#   - No spring.profiles.active: setting it would make both overlays
#     unreachable.
#   - No logback-spring.xml, banner.txt, static/ or templates/ companion: none
#     is in scope, and the container's standard output and error are collected
#     by the log driver the task definition configures, so no appender file is
#     needed.
#
# Assumptions: every key below is declared up front, deliberately. These are the
#   decisions a module author needs settled BEFORE writing the first class, and a
#   schema search path or a migration scope retrofitted afterwards is exactly how a
#   service ends up applying one context's migration into another context's schema.
#   Trade-offs: the cost is a document whose settings cannot all be exercised by
#   one entity mapping, which is accepted because the alternative -- adding each
#   setting as the class that needs it arrives -- is what makes the search path an
#   afterthought.
#
#   NO SECRET, CREDENTIAL, HOSTNAME, ENDPOINT, BUCKET, QUEUE URL, KEY
#   IDENTIFIER OR ACCOUNT IDENTIFIER APPEARS ANYWHERE IN THIS FILE.
#
#   Documentation convention: docs/CODE_DOCUMENTATION_STANDARD.md. YAML has no
#   docstring construct, so this header block is the module-entry-point
#   equivalent, and every non-obvious key below carries an adjacent WHY comment
#   naming at least one of Alternatives Considered, Refactoring Rationale,
#   Assumptions or Trade-offs, as the project's single user-specified rule,
#   Rule 1 "Explainability", requires.
# -----------------------------------------------------------------------------
# WHY (non-obvious design decisions):
#
#   Trade-offs: the web and actuator starters are carried solely so the
#     Dockerfile can probe datasource-aware health while a job is running.
#     A process-only or marker-file probe was evaluated and rejected because it
#     reports a live JVM even when the datasource is unreachable. The accepted
#     cost is a listener in an otherwise one-shot task; BatchApplication closes
#     the context and calls System.exit with the job result, so the listener does
#     not convert a completed job into a long-running service.
#   Assumptions: only actuator health is exposed, with details disabled. No
#     controller, administrative trigger or edge route exists, so job selection
#     remains exclusively in the Step Functions command arguments and the HTTP
#     surface cannot start or alter work.
#   Eight further decisions are argued at the keys that carry them rather than
#     summarised twice here: the two keys spring.batch still exposes and the
#     absent script initialiser; the eager AWS client construction that makes a
#     region a startup requirement while credentials stay lazy; the search-path
#     pin chosen over a currentSchema URL parameter; the single ACID commit
#     chosen over a coordinator, a saga or a compensating reversal; the
#     validate-only persistence provider; and the bounded lock waits left
#     alongside un-tightened statement timeouts.
#   Trade-offs: the mainframe condition-code rubric is quarantined. A return
#     code of 4 is a WARN tier that still lets the chain continue -- its single
#     origin is app/cbl/CBTRN02C.cbl:229, reading IF WS-REJECT-COUNT > 0, and
#     :230, reading MOVE 4 TO RETURN-CODE, and tests/golden/posting/
#     reject_102_overlimit/return_code.expected records exactly 4. That graded
#     scale belongs to the parity oracle under tests/ and to the batch
#     container's process exit status, because the orchestrator reads it, and
#     nowhere else. Maven, the documentation gate and both test runners are
#     binary: describing a Java build as warn-level green would hide a real
#     failure behind a borrowed vocabulary. No key in this file grades anything,
#     and none may interfere with the exit status BatchApplication publishes.
#   Assumptions: a JCL condition code is a SKIP predicate and an orchestration
#     choice is a RUN predicate, so the sense inverts on translation.
#     app/jcl/TRANBKP.jcl:51 reads COND=(4,LT), meaning skip when 4 is less than
#     the return code, which becomes "run when the return code is 4 or lower".
#     The similarly spelled INCLUDE COND= at app/jcl/TRANREPT.jcl:47 is a record
#     selection predicate and becomes a SQL WHERE clause, never a step gate.
#     Neither is expressed in this file; both are recorded because conflating
#     them is the easiest mistake in this translation to make.
#   Refactoring Rationale: the durable job repository and the batch_run step
#     ledger are a strict IMPROVEMENT over the baseline, not a port of it. The
#     only RESTART= in all 38 members of app/jcl is app/jcl/DEFGDGD.jcl:2, which
#     is commented out, and there is no CHKPT= anywhere, so a failed step had to
#     be resubmitted by hand from the top with no record of what had already
#     completed.
# =============================================================================

# WHY : Assumptions: services/batch-service/Dockerfile exposes port 8080 and its
#       health command probes that exact port. No second management port is used,
#       so the listener and probe cannot drift onto different sockets.
# WHY : Refactoring Rationale: the listener is bound to the LOOPBACK address and
#       not to every interface, which is what the framework does when no address
#       is given. The distinction is not cosmetic in this module. The only client
#       of this listener is the container's own HEALTHCHECK, which reaches it at
#       http://127.0.0.1:8080/actuator/health from inside the same network
#       namespace; nothing outside the task has any reason to call it, and
#       nothing is configured to - the edge route table publishes no batch route
#       and the load balancer has no batch target group. Bound to every
#       interface, the same listener would also be reachable on the task's own
#       elastic network interface for the lifetime of every batch run, which on
#       a Fargate task in awsvpc networking means reachable from anything the
#       task's security group admits. Bound to loopback it is reachable only
#       from inside the task, so the health endpoint's exposure is exactly its
#       one consumer.
# WHY : Alternatives Considered: (1) leaving the default all-interfaces bind and
#       relying on the security group to admit nothing, which was the position
#       before this key existed. Rejected because it makes a network reachability
#       property depend on a rule in another repository tree staying correct,
#       where this one line makes it a property of the process. (2) declaring a
#       separate management.server.port on loopback and leaving the main port
#       bound wide, which is the shape a service publishing an API would use.
#       Rejected because this module publishes no API, so the second socket would
#       exist solely to be closed and the probe and the listener could then drift
#       onto different ports. (3) adding the security starters so the endpoint
#       could authenticate instead. Rejected for the reason recorded at
#       services/batch-service/pom.xml:228-239: it would oblige the credential-
#       free image HEALTHCHECK to carry a credential, and it would protect a
#       liveness probe rather than any operation that changes state.
# WHY : Trade-offs: an operator cannot reach this endpoint from outside the task
#       to diagnose a run, and a sidecar in a different network namespace could
#       not scrape it. Both costs are accepted: the run's diagnosis is the job's
#       own log stream and its durable step ledger in batch.batch_run, and no
#       sidecar is deployed alongside this task.
server:
  port: 8080
  address: 127.0.0.1

spring:

  # Assumptions: MetricsConfig in com.carddemo.common.observability turns
  #   this value into a Micrometer common tag on every meter, and the shared
  #   correlation filter emits it beside the correlation identifier it copies
  #   into the logging context. Both read this framework property rather than
  #   holding a constant of their own, so leaving it unset would publish
  #   untagged meters that no dashboard could attribute to this module and log
  #   lines that could not be separated from a peer's. The value matches the
  #   Maven artifactId in services/batch-service/pom.xml so that an image
  #   tag, a log stream and a meter tag all read the same.
  application:
    name: batch-service

  # WHY : (1) Trade-offs: the `optional:` prefix is load-bearing. Without it a
  #       JVM that cannot reach Parameter Store -- a unit-test run, an
  #       integration-test run against a database container, a developer
  #       workstation with no AWS credentials -- fails before any of this module's
  #       own configuration is read, which would make the test tree unrunnable
  #       off-platform. What is given up is that a genuinely missing parameter in
  #       a deployed environment no longer surfaces as an import failure; it
  #       surfaces later, as an unresolved placeholder at bind time. That cost is
  #       paid for deliberately by giving the injected values below no fallback,
  #       so the later failure is still a hard one rather than a silent default.
  #       (2) Assumptions: the environment segment is an environment LABEL, not a
  #       location, a credential or an endpoint, which is why it is the one
  #       placeholder in this file that carries a default. It needs one because an
  #       unresolved placeholder inside this key aborts the earliest
  #       configuration-loading phase, before `optional:` can take effect; a
  #       label that always resolves keeps that phase survivable off-platform
  #       while every VALUE imported through the prefix still has no fallback.
  #       (3) Refactoring Rationale: the label variable was CARDDEMO_ENV and is now
  #       CARDDEMO_ENVIRONMENT. This module was the ONLY place in the repository
  #       reading the short spelling: every other configuration path, every metric
  #       tag through MetricsConfig, and the container overrides the orchestrator
  #       passes all use the long one. Two names for one value means a task
  #       definition can set CARDDEMO_ENVIRONMENT while this key reads
  #       CARDDEMO_ENV, and because the import is `optional:` the mismatch says
  #       nothing at all -- the batch job simply resolves the fallback path,
  #       reads whatever `local` publishes, and runs a production night against a
  #       parameter set nobody intended. That is the exact failure a single
  #       spelling removes.
  #       (4) Assumptions: the shared defaults document is imported FIRST and from
  #       the classpath. It carries the one console log pattern that renders the
  #       correlation identifier from the logging context, which BatchApplication
  #       populates with the orchestrator's run identifier -- so without this
  #       import every line of a batch run would omit the one value that ties the
  #       eleven tasks of a night's chain together. It is listed first so anything
  #       the parameter store publishes still wins over it.
  config:
    import:
      - "classpath:/carddemo-common-defaults.yml"
      - "optional:aws-parameterstore:/carddemo/${CARDDEMO_ENVIRONMENT:local}/batch/"

  # Assumptions: this block exists only because services/batch-service/pom.xml
  #   declares the parameter-store and queue starters. It settles what those
  #   two starters need in EVERY environment and nothing else: no queue name,
  #   no queue URL, no bucket, no key identifier and no account identifier is
  #   named here or anywhere else in this file. Those are outputs of
  #   infra/modules/sqs and its siblings, published to Parameter Store and read
  #   through the import above, which is what keeps this file free of them
  #   rather than merely short of them.
  cloud:
    aws:
      # Assumptions: a region is required for this module to START, not
      #   merely to reach AWS, and that is the non-obvious part. Declaring the
      #   two AWS starters in services/batch-service/pom.xml puts their
      #   auto-configuration on the classpath, and it builds its clients
      #   EAGERLY -- the parameter-store client is constructed while
      #   configuration is still loading, and again as a bean, before any
      #   parameter has been read. A client cannot be built without a region,
      #   so a context with no region fails even when nothing is ever looked
      #   up. Verified by running this module's context with the region
      #   removed: it aborted in the parameter-store client factory, not in
      #   any lookup. Credentials behave differently and are NOT needed to
      #   start, because they are resolved on first call rather than at build
      #   time -- which is what lets the `optional:` import above degrade
      #   cleanly once a region is present.
      # Assumptions: no fallback, deliberately, and no region name
      #   appears in this repository. AWS_REGION is the same variable the
      #   SDK's own resolution chain consults first, so declaring it here
      #   changes nothing about how a deployed task resolves its region; what
      #   it buys is a failure that NAMES the missing variable instead of the
      #   chain's own message, which reports an inability to reach the EC2
      #   instance metadata service and sends a reader looking for an EC2
      #   problem that a Fargate task does not have.
      # Trade-offs: a default such as a single hard-coded region would
      #   let a credential-less JVM start with no environment at all, and is
      #   refused. The deployment is single-region, so a baked default that
      #   disagreed with the deployment would send every parameter lookup to a
      #   region that holds none of them; paired with the `optional:` prefix
      #   above, those lookups would then be SKIPPED rather than reported, and
      #   the first visible symptom would be an unresolved placeholder far
      #   from its cause. A run that needs no AWS supplies this one variable,
      #   or switches the starters off in a test profile, rather than having a
      #   location committed here on its behalf.
      region:
        static: ${AWS_REGION}

      # Assumptions: this module PUBLISHES to the error queue and consumes
      #   nothing, so no listener container should ever start. Leaving the
      #   framework free to start one would reintroduce the exact hazard
      #   services/batch-service/pom.xml:202-222 records for an embedded
      #   servlet container: a queue listener is a non-daemon poller, so it
      #   would keep the JVM alive after the last job step had finished, the
      #   task would never reach a terminal state, the invoking state would
      #   never complete, and the nightly chain would stall at the step that
      #   ran correctly. Turning listener startup off is therefore a lifecycle
      #   requirement, not a tuning choice.
      sqs:
        listener:
          auto-startup: false

  # Trade-offs: the platform allows a fixed window between SIGTERM and
  #   SIGKILL, and the framework default for this key coincides with it
  #   exactly, so a task can be killed at the moment it is still draining.
  #   Shortening it gives up the tail of that window to buy the certainty that
  #   the JVM finishes and flushes its log buffers rather than being
  #   terminated part-way. Abandoning a chunk that is still running is safe
  #   here in a way it would not be in an online service: the chunk
  #   transaction rolls back whole, and the batch_run step ledger plus an
  #   orchestrator redrive resume the step, so the cost of the abandoned chunk
  #   is repeated work rather than lost or half-applied work.
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # Assumptions: each value below is injected as a plain environment
  #   variable by the task definition, which resolves the URL from Parameter
  #   Store and the credentials from Secrets Manager, both populated from
  #   infrastructure outputs. The placeholders carry no fallback on purpose. A
  #   missing injection then fails startup loudly instead of quietly selecting
  #   something committed to this repository, and that is the mechanism by
  #   which this file holds no credential and no endpoint rather than merely
  #   happening not to.
  # Assumptions: the connecting role is carddemo_batch, created by
  #   data-migration/sql/V0__schemas_and_roles.sql, which owns the `batch`
  #   schema (V0:469) and holds narrowly scoped grants on the other four
  #   schemas named in the search path below. This module never grants itself
  #   anything and never creates a role.
  # Alternatives Considered: exactly ONE datasource is configured, and
  #   therefore exactly one auto-configured transaction manager. No XA
  #   datasource, no JTA coordinator, no second transaction manager and no
  #   read replica. A saga with compensating reversals was evaluated for
  #   transaction posting and rejected: app/cbl/CBTRN02C.cbl commits its three
  #   writes as one unit of work at lines 440 to 442
  #   (2700-UPDATE-TCATBAL, then 2800-UPDATE-ACCOUNT-REC, then
  #   2900-WRITE-TRANSACTION-FILE), so a saga would replace one atomic commit
  #   with a sequence of committed steps and make states such as a posted
  #   transaction whose category balance has not moved yet observable. Those
  #   states do not exist in the baseline, so the golden masters would
  #   correctly flag them as a parity failure. One local transaction over
  #   scoped cross-schema grants preserves atomicity and needs no coordinator
  #   at all.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

    hikari:
      # Assumptions: pool metrics arrive at the observability stack tagged
      #   with this name only, and every service plus this module draws on one
      #   Aurora cluster. A name that says which context a saturated pool
      #   belongs to is the difference between a usable alarm and one that
      #   reports the framework default from nine different tasks.
      pool-name: batch-pool

      # Assumptions: unqualified table names in the entity mappings must resolve
      #   to a known schema in a known order. FOUR schemas are reached, each
      #   listed for a verified reason, with `batch` first so the schema this
      #   module OWNS wins any future name collision and so the job-repository
      #   tables, the batch_run ledger and Flyway's own history table all resolve
      #   there:
      #     batch     owned; V0:699 creates it AUTHORIZATION
      #               carddemo_batch_owner -- the NOLOGIN role this module's
      #               migration assumes with SET ROLE -- and
      #               db/migration/V1__batch.sql declares everything in it.
      #     ledger    write under grant; V0:666-667 grants SELECT, INSERT and
      #               UPDATE on all its tables. Owned by transaction-service.
      #     account   read plus one narrow write; V0:719 grants SELECT on all its
      #               tables and V0:730 grants UPDATE on account.accounts alone.
      #     reference read only, V0:766. Required because app/cbl/CBACT04C.cbl:47
      #               opens DISCGRP for the disclosure-group rate, and that
      #               program is CalculateInterestJob.
      #   Omitting `reference` fails the interest state at the database rather
      #   than in this file. No two of the four own a table of the same name, so
      #   the extra resolution candidates cannot shadow anything.
      # Refactoring Rationale: a fifth entry, `card`, stood between `account` and
      #   `reference` and was removed. It was justified on the grounds that
      #   app/cbl/CBTRN01C.cbl validates the daily feed against the card master,
      #   and that reading is wrong: the program OPENS CARD-FILE at
      #   app/cbl/CBTRN01C.cbl:309 and never issues a READ against it, its only
      #   three reads being DALYTRAN at :203, XREF at :229 and ACCOUNT at :243.
      #   The cross-reference it does read is CVACT03Y, which the target maps to
      #   account.card_xref, not to the card schema. No entity in this module
      #   declares @Table(schema = "card") either, so no statement this module
      #   issues could ever have resolved there. A resolution candidate with no
      #   consumer is path surface that can only shadow a future name, so it is
      #   withdrawn rather than kept against a hypothetical reader.
      # Alternatives Considered: a currentSchema parameter on the JDBC URL, and a
      #   role-level search path. Both rejected, and not only by this file. The
      #   URL arrives from the environment and is outside this artifact's
      #   control, so an operator editing the Parameter Store value would
      #   silently drop the pin and every query would resolve against the default
      #   path with no error to show for it; all three peer services reject it on
      #   the same ground. V0:543-552 separately declines a role-level path,
      #   because one setting with two owners drifts and the drift stays
      #   invisible until a query resolves an unqualified name in the wrong
      #   schema. This key is consequently the single owner of schema resolution
      #   for this module.
      # Assumptions: the pool runs this once per PHYSICAL connection, so Flyway's
      #   connections are pinned by the same mechanism as the application's
      #   without a second declaration.
      connection-init-sql: "SET search_path TO batch, ledger, account, reference"

      # Assumptions: this is a correctness requirement for the streaming
      #   readers, not a tuning preference, and it is inseparable from the
      #   fetch size set under spring.jpa.properties below. The driver honours
      #   a fetch size and opens a server-side cursor ONLY when the connection
      #   is not in auto-commit mode; with auto-commit left on it ignores the
      #   fetch size and buffers the entire result in the client. Measured
      #   against PostgreSQL 17 with a deliberately large result and a small
      #   heap, auto-commit off with a positive fetch size returned its first
      #   row promptly, while auto-commit on with the same fetch size, and
      #   auto-commit off with a fetch size of zero, both exhausted the heap.
      #   The daily feed is read one record at a time by the baseline
      #   (app/cbl/CBTRN02C.cbl:202-219 loops on 1000-DALYTRAN-GET-NEXT), so a
      #   reader that materialised the whole feed would fail on feed size
      #   alone rather than on anything about the data.
      auto-commit: false

      # Trade-offs: the floor is what matters here, and the floor is
      #   strictly above one. A pool of one DEADLOCKS this module outright:
      #   the job repository writes step and job execution state in a
      #   transaction SEPARATE from the chunk transaction, so a step holding
      #   the only connection would wait for a connection that only the step
      #   can release. Flyway also holds one for the whole migration at
      #   startup. Four leaves room for the chunk transaction, the job
      #   repository's own transaction and a set-based step without drawing
      #   further on a connection budget the whole cluster shares with eight
      #   peer roles. Sizing is governed by how many transactions ONE job runs
      #   concurrently, not by request throughput: this process starts, runs
      #   exactly one job, and exits, so it never serves traffic and a larger
      #   pool would starve the peers rather than make any job finish.
      maximum-pool-size: 4

      # Trade-offs: a run-and-exit task should not open connections it may
      #   never use. Different jobs in the chain touch different schemas, and
      #   several run only set-based statements, so pre-warming the pool to its
      #   maximum would open connections against the shared cluster budget that
      #   the selected job then never checks out. Keeping one idle connection
      #   accepts that the first checkout of a second connection pays its own
      #   establishment cost, which for a task measured in job steps is not a
      #   cost worth pre-paying.
      minimum-idle: 1

      # Trade-offs: this reports the ONE leak shape the server cannot see. A
      #   streaming reader legitimately holds a connection for the whole of a
      #   step, so the threshold is deliberately set ABOVE the
      #   idle-in-transaction ceiling configured below rather than above a
      #   normal query. That ordering divides the work cleanly: a connection
      #   stuck INSIDE a transaction is terminated by the server-side bound,
      #   while this client-side detector is left to report the case the server
      #   considers healthy -- a connection checked out but in no transaction,
      #   which is exactly the signature of a stream that was never closed.
      #   Setting it below the server bound would instead produce a warning for
      #   every legitimately long step and train a reader to ignore the one
      #   that matters. The detector only warns; it never closes a connection,
      #   so a false positive here could not break a job, and that is why the
      #   looser bound is the safe direction to err in.
      leak-detection-threshold: 600000

      # Assumptions: TLS is the CLIENT half of a two-sided requirement.
      #   The cluster parameter group forces encrypted connections, so the
      #   server refuses an unencrypted one; neither half is redundant, because
      #   without the server flag a misconfigured client could downgrade, and
      #   without these properties a forced-TLS server would still accept a
      #   connection that verified no certificate at all. Only verify-full
      #   checks both the chain and the hostname, which is what makes the
      #   endpoint reached the endpoint the credential was issued for.
      #   verify-full needs a trust anchor and this driver does not fall back
      #   to the JVM trust store, so the bundle path is explicit; it names
      #   where the image places the managed bundle, and an environment
      #   holding it elsewhere overrides the variable rather than editing this
      #   file.
      # Trade-offs: statement_timeout is deliberately NOT set. A batch
      #   step legitimately runs a single long set-based statement -- the
      #   combine step replaces the sort-and-merge of app/jcl/COMBTRAN.jcl with
      #   one ordered query -- and the outer bound on a step is the per-state
      #   timeout the invoking state machine already enforces, which can stop
      #   the task. A statement timeout here would add a SECOND, shorter bound
      #   that cancels correct work mid-statement and reports it as a failure,
      #   for no outcome the state machine does not already guarantee.
      # Trade-offs: lock waiting and idle-in-transaction ARE bounded,
      #   because those two are the shapes that hold the batch window open
      #   rather than doing long work in it. Posting rewrites account.accounts
      #   rows an online service may hold, so an unbounded lock wait would
      #   block until that other holder released, with the nightly chain
      #   waiting behind it; a bounded wait turns that into a failure the
      #   state's retry can act on. Bounding the idle-in-transaction case
      #   likewise stops a task that has stopped making progress from holding
      #   rows against every peer. Both are expressed as server startup options
      #   rather than as init statements so they are established before the
      #   first statement of a session runs, and they were verified to take
      #   effect against PostgreSQL 17 through this driver.
      data-source-properties:
        sslmode: verify-full
        sslrootcert: ${CARDDEMO_DB_SSL_ROOT_CERT:/etc/ssl/certs/carddemo-rds-ca-bundle.pem}
        options: "-c lock_timeout=30000 -c idle_in_transaction_session_timeout=300000"


  # Assumptions: flyway-core on its own is not enough, and the WAY it
  #   fails is why this needs saying in this file and not only in the POM.
  #   Per-database support was moved out of the core artifact into one module
  #   per database, so services/batch-service/pom.xml declares
  #   flyway-database-postgresql alongside the starter. Without that second
  #   artifact the module still compiles, still packages and still passes
  #   every test, then aborts on FIRST CONTAINER START when Flyway cannot
  #   resolve a PostgreSQL URL to any database type it knows -- inside a
  #   batch window, from a build that reported success. A reader of this file
  #   alone would otherwise have no way to connect that startup failure to a
  #   missing dependency. Neither artifact is versioned anywhere in this
  #   module: the parent POM owns both versions, and restating one here would
  #   fork that decision.
  # Assumptions: the keys below are the contract db/migration/V1__batch.sql
  #   is written against. That file states the same four preconditions from the
  #   database side at its lines 27 to 45, so the two documents have to agree
  #   or the module does not start.
  flyway:
    # Assumptions: stated rather than inherited, because this module is the
    #   only one in the reactor whose durable restart capability depends on a
    #   migration having run. batch.batch_run is the step ledger an
    #   orchestrator redrive reads to decide whether a step already completed;
    #   if migration were switched off, the first nightly run would fail on a
    #   missing relation instead of on anything about the data.
    enabled: true

    # Assumptions: exactly one location, holding exactly one migration,
    #   V1__batch.sql. The location is inside this module's own jar, so it
    #   cannot reach another context's migrations even by accident. A location
    #   list that named a second path would be the mechanism by which two
    #   modules became authoritative for one table.
    locations: classpath:db/migration

    # Assumptions: `batch` and nothing else, for BOTH the migration and
    #   Flyway's own schema-history table. This module writes rows into
    #   ledger.* and account.* under grant and reads card.* and reference.*,
    #   but the DDL for all four belongs to the contexts that own them --
    #   transaction-service, account-service, card-service and
    #   reference-service respectively. A schema list that reached beyond
    #   `batch` would let this module create, alter or seed another service's
    #   structure, which is precisely the failure schema-per-service exists to
    #   prevent. Pinning default-schema as well as schemas is what keeps the
    #   history table in the owned schema rather than in whichever schema the
    #   search path happens to resolve first.
    # Assumptions: concurrency is safe without extra configuration.
    #   Flyway takes a lock on its history table, so a second task starting
    #   close behind a first waits rather than corrupting state; and the
    #   orchestration runs these states sequentially in any case, its one
    #   parallel state running the data-migration image rather than this one.
    schemas: batch
    default-schema: batch

    # Assumptions: the schema and its owning role already exist when this
    #   runs. data-migration/sql/V0__schemas_and_roles.sql creates all eight
    #   schemas, the three tiers of per-service role and the cross-schema grants
    #   before any service starts, creating `batch` AUTHORIZATION
    #   carddemo_batch_owner at its line 699. Letting Flyway create the schema
    #   instead would conjure it with whatever owner happened to connect, and the
    #   default privileges V0 grants for objects owned by carddemo_batch_owner
    #   would then never fire. With creation off, a missing schema fails loudly
    #   here instead.
    create-schemas: false

    # Trade-offs: stated explicitly even though the current default already
    #   disables it, because the cost of the redundancy is one line and the
    #   cost of relying on a default is the whole `batch` schema. This module's
    #   role is the only one in the system holding write grants that reach
    #   OUTSIDE its own schema, so it is the worst possible role to leave a
    #   destructive operation reachable from. Naming it here makes the
    #   operation structurally impossible in every environment, including a
    #   developer's, rather than merely improbable in production.
    clean-disabled: true

    # Assumptions: an applied migration must never change on disk.
    #   Validation compares the checksum of each applied migration against the
    #   file, so an edit to V1__batch.sql after it has been applied fails
    #   startup rather than leaving the database silently disagreeing with the
    #   source that supposedly describes it. For a schema whose column types
    #   are half of a two-way contract with the entity mappings -- the other
    #   half being the validate-only setting below -- a silent disagreement is
    #   the failure mode with the longest fuse.
    # Assumptions: baselining is off because there is no pre-existing
    #   populated `batch` schema to adopt. V0 creates the schema EMPTY, so a
    #   baseline would mark V1__batch.sql as already applied and skip the file
    #   that creates batch_run and the job-repository tables, producing exactly
    #   the missing-relation failure that migration exists to prevent.
    validate-on-migrate: true
    baseline-on-migrate: false

    # Assumptions: Flyway authenticates as a DIFFERENT database role than the one
    #   the datasource above uses, and the two are not interchangeable.
    #   data-migration/sql/V0__schemas_and_roles.sql creates three tiers of role
    #   per bounded context: a NOLOGIN carddemo_batch_owner that owns the
    #   schema and everything in it, a carddemo_batch_migrator login that is a
    #   member of that owner, and the carddemo_batch login this service serves
    #   requests as. The runtime role holds USAGE on the schema plus SELECT,
    #   INSERT and UPDATE on its tables -- CREATE is explicitly REVOKEd from it --
    #   so it could not apply this migration even if asked to, and equally cannot
    #   drop or alter the tables it reads.
    # Refactoring Rationale: these two keys did not exist, and Flyway therefore
    #   migrated under the runtime credential. That made the runtime role the
    #   owner of the schema and of every table the migration created, so the one
    #   long-lived credential every request ran under also held DDL authority over
    #   the data it served. Naming a separate migration credential here is what
    #   allows the bootstrap SQL to reduce the runtime role to named DML.
    # Trade-offs: no fallback value, for the same reason the datasource
    #   credential above has none -- a default would let the process start against
    #   a credential nobody chose. The consequence is deliberate: a deployment
    #   that injects the runtime credential and forgets this one fails at startup
    #   on an unresolved placeholder, which names the variable it is missing,
    #   rather than migrating as the wrong identity and succeeding.
    # Assumptions: setting spring.flyway.user is also what gives Flyway its own
    #   DataSource. Spring Boot builds a separate SimpleDriverDataSource derived
    #   from the application DataSource whenever this key is set -- verified
    #   against FlywayAutoConfiguration in spring-boot-flyway 4.1.0, whose
    #   getMigrationDataSource falls to a derivedFrom builder when the Flyway URL
    #   is absent and the Flyway user is not -- so the URL, driver and TLS terms
    #   are inherited while the credential is replaced. That separation matters
    #   beyond tidiness: sharing the Hikari pool would leave the SET ROLE below
    #   applied to pooled connections that later serve runtime queries.
    user: ${SPRING_FLYWAY_USER}
    password: ${SPRING_FLYWAY_PASSWORD}

    # Assumptions: this is the other half of the ownership split, and without it
    #   the migration credential alone achieves nothing. V0 grants
    #   carddemo_batch_migrator its owner WITH INHERIT FALSE, so a session
    #   authenticated as the migrator holds NO privilege at all until it assumes
    #   the owner explicitly. Flyway runs every string here on each connection it
    #   opens, before any migration statement, so every object V1 creates is owned
    #   by carddemo_batch_owner rather than by the credential that connected.
    # Trade-offs: INHERIT FALSE plus an explicit SET ROLE is more moving parts
    #   than granting the migrator ownership directly, and it buys two properties
    #   that arrangement cannot have. A stolen migrator credential used without
    #   this statement can read and write nothing, and every
    #   ALTER DEFAULT PRIVILEGES FOR ROLE carddemo_batch_owner clause in the
    #   bootstrap SQL fires -- those clauses are keyed on the CREATING role, so a
    #   migration that created tables as the migrator would leave them all inert
    #   and the runtime role would receive no grants on the tables it must read.
    # Alternatives Considered: ALTER ROLE carddemo_batch_migrator SET role,
    #   which is a per-role server-side default and needs nothing in this file.
    #   Rejected because it makes a privilege decision invisible at the point it
    #   takes effect: a reader of this configuration would see a migration running
    #   as the migrator and have no way to learn that the server silently
    #   substitutes another identity.
    init-sqls:
    # Assumptions: the statement is TERMINATED. Spring Boot joins this list with a
    #   newline and hands Flyway one script, so an unterminated statement is
    #   concatenated with whatever follows it -- measured against PostgreSQL 17 as
    #   `syntax error at or near "SET"` when a second entry was added under the test
    #   profile. One entry cannot hit that today; the semicolon is what keeps a second
    #   entry from breaking the first.
      - "SET ROLE carddemo_batch_owner;"


  jpa:
    hibernate:
      # Refactoring Rationale: this DIVERGES from the peer services on
      #   purpose, and a reader comparing the two should read this block rather
      #   than align them. services/transaction-service/src/main/resources/
      #   application.yml uses `none`, and its stated reason is sound for a
      #   context that owns its own schema: `validate` would fail startup on a
      #   mapping mismatch that its own next migration was about to resolve,
      #   turning an ordering difference into an outage. That reason does not
      #   transfer here. Only one of this module's eight entity mappings
      #   describes a table it owns; the other seven describe tables in
      #   ledger, account, card and reference, and this module's Flyway is
      #   scoped to `batch`, so no migration of ITS OWN will ever resolve a
      #   drift in those seven. `none` would therefore defer the mismatch to
      #   the first query that touched the drifted column -- mid-chunk, part
      #   way through a posting run, with a partially processed feed -- whereas
      #   `validate` reports it at startup, before the first record is read.
      # Assumptions: `update` and `create` are not merely unused but
      #   unreachable: the connecting role holds no CREATE privilege in any
      #   schema but its own, so an attempt to widen another context's column
      #   would fail on privilege anyway. Declaring `validate` states the
      #   intent rather than relying on a grant to enforce it.
      # Trade-offs: the cost is a startup check on every task in the
      #   chain, and one real ordering dependency -- a task started before the
      #   owning context has applied its migration will not start. That is
      #   accepted, and for a nightly chain it is the better failure: the
      #   invoking state's catch handler routes it to failure notification
      #   with nothing half-applied, which is strictly preferable to
      #   discovering the same mismatch after a run has already committed part
      #   of a feed.
      ddl-auto: validate

    # Assumptions: there is no persistence-backed business request in this
    #   module. The actuator health request needs no open entity manager, so a
    #   persistence context must not outlive the batch transaction that owns it.
    #   The setting is explicit because the framework default is on and otherwise
    #   logs a warning that implies a view-rendering path this module does not have.
    open-in-view: false

    # Trade-offs: this key echoes statements through the provider directly to
    #   standard output rather than through the logging framework, so no logger
    #   level can filter it and the floors set under `logging` at the foot of
    #   this file do not reach it. Turning it off here is therefore the only
    #   place the decision can be made at all. It matters more in this module
    #   than in an online one: a batch statement is executed once per record
    #   across an entire daily feed, and the values bound into it include the
    #   primary account number carried by every posted transaction, so leaving
    #   it on would write cardholder data to the container's log stream at feed
    #   volume. What is given up is the convenience of seeing statements
    #   without attaching a debugger.
    show-sql: false

    properties:
      hibernate:
        jdbc:
          # Trade-offs: a positive value is what makes a streaming reader
          #   actually stream, and it is inseparable from the auto-commit
          #   setting above: the driver opens a server-side cursor only when
          #   BOTH hold, and with either missing it buffers the entire result
          #   in the client -- measured against PostgreSQL 17 as heap
          #   exhaustion on a large result, not as a slowdown. The value is
          #   the number of rows the driver retrieves per round trip, so it
          #   bounds the reader's memory to a fixed window no matter how large
          #   the feed grows. It is set well above one deliberately: one row
          #   per round trip would reproduce the baseline's record-at-a-time
          #   I/O pattern rather than its semantics, and it is the semantics
          #   that parity requires -- app/cbl/CBTRN02C.cbl:202-219 loops one
          #   record at a time because a VSAM read returns one record, not
          #   because the record count per I/O is part of the contract.
          fetch_size: 100

          # Trade-offs: this groups statements the provider was going to
          #   issue anyway into fewer round trips. It is safe for parity
          #   because it changes neither WHICH statements run nor their order:
          #   only adjacent statements of the same type are grouped, and a
          #   statement of a different type ends the group.
          # Alternatives Considered: hibernate.order_inserts and
          #   hibernate.order_updates, the two settings usually paired with
          #   this one, are deliberately NOT set. They increase grouping by
          #   REORDERING statements across entity types, and this module has
          #   one place where statement order is worth protecting: the posting
          #   unit of work transcribed from app/cbl/CBTRN02C.cbl:440-442, whose
          #   three writes follow the baseline's order. The provider's flush
          #   already groups by action type, so that physical order differs
          #   from the transcribed order under any use of a persistence
          #   provider; adding cross-type reordering would move it further
          #   still, and would buy nothing observable, because what the golden
          #   masters compare is the COMMITTED state and the return code, and
          #   atomicity is guaranteed by the single transaction rather than by
          #   the order of statements inside it. The grouping given up is the
          #   accepted cost of keeping the smaller distance.
          batch_size: 50

  batch:
    job:
      # Assumptions: job selection belongs to the container command and
      #   to nothing else. The orchestrator passes --job and --business-date as
      #   command overrides, so the framework's own startup launcher must not
      #   also try to launch something. Left enabled, that launcher runs at
      #   startup and, with seven jobs registered and no name configured,
      #   cannot determine which one was wanted. Disabling it hands selection
      #   to BatchApplication, which reads the argument. No job name and no
      #   default job is set anywhere in this file for the same reason: a
      #   property that named one would give the task a second, silent source
      #   of truth that could disagree with the argument it was started with.
      # Assumptions: this does NOT suppress the exit status. The
      #   framework contributes its startup launcher conditionally on this
      #   property, but contributes its exit-code generator on the separate
      #   condition that the context declares no generator of its own, so
      #   turning the launcher off leaves exit-status translation intact and
      #   still lets BatchApplication supply its own. That matters because the
      #   process exit status is the ONLY channel by which a job reports its
      #   outcome: 0 clean, 4 completed with rejects, 8 or more a hard
      #   failure. The warn tier has a single origin in the baseline,
      #   app/cbl/CBTRN02C.cbl:229 reading IF WS-REJECT-COUNT > 0 and :230
      #   reading MOVE 4 TO RETURN-CODE, and
      #   tests/golden/posting/reject_102_overlimit/return_code.expected
      #   records exactly 4, so a run that produced rejects and reported 0
      #   would be a parity failure rather than a tidier result.
      # Assumptions: neither spring.batch.jdbc.table-prefix nor
      #   spring.batch.jdbc.initialize-schema is set here, because at the pinned
      #   framework version NEITHER KEY EXISTS. The evidence is the binding class
      #   itself: org.springframework.boot.batch.autoconfigure.BatchProperties
      #   declares exactly one nested type, Job, carrying one property, name, so
      #   the whole spring.batch namespace is job.enabled and job.name and there
      #   is no jdbc group beneath it. The module's own
      #   spring-configuration-metadata.json agrees, listing those two keys and
      #   nothing else. A jdbc key written here would bind to nothing, be
      #   accepted in silence, and leave a reader believing a prefix was pinned
      #   when it was not, which is worse than its absence.
      # Assumptions: both settings' INTENT is nevertheless satisfied, by
      #   mechanisms that do exist. The prefix intent -- job-repository tables
      #   resolved to the `batch` schema -- is met because the framework default
      #   prefix is unqualified and the search path above puts `batch` first,
      #   which resolves it to exactly where db/migration/V1__batch.sql:664-739
      #   creates the six job-repository tables and their three sequences. The
      #   initialize-schema intent -- the framework must not create those tables
      #   and race Flyway -- is met because this framework version contributes no
      #   batch schema initialiser at all, and spring.sql.init.mode below is
      #   pinned to never so no script initialiser can become a second creator.
      enabled: false

  sql:
    init:
      # Assumptions: this module ships no schema or data script, so this key
      #   currently governs nothing; it is set so that ADDING one later cannot
      #   silently start a second writer of the same tables. The framework
      #   version in use contributes no batch-specific schema initialiser at
      #   all, so the classic race in which a framework initialiser and Flyway
      #   both create the job-repository tables is not reachable here -- and
      #   stating that is the point, because a reader who expects that race to
      #   need disabling would otherwise look for the setting that disables it
      #   and not find one. V1__batch.sql uses no IF NOT EXISTS anywhere,
      #   precisely so that a second creator would surface as an error rather
      #   than as a silent skip; this key keeps a script from becoming that
      #   second creator.
      mode: never

# WHY : Trade-offs: the actuator web surface is narrowed to health even though
#       the Prometheus registry is present. A run-and-exit task may finish between
#       scrape intervals, so pull metrics are not a dependable record; the durable
#       batch_run ledger and container logs carry that role instead.
management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      # WHY : Assumptions: a probe needs only the aggregate status. Suppressing
      #       details prevents datasource topology or failure diagnostics from
      #       being returned to any caller that can reach the task port.
      show-details: never

  health:
    db:
      # WHY : Assumptions: datasource health remains enabled so an unreachable
      #       database makes the Dockerfile probe fail instead of presenting a
      #       healthy JVM in front of a dependency the selected job cannot use.
      enabled: true

logging:
  level:
    # Assumptions: the base document sets floors and a baseline only.
    #   Per-environment verbosity belongs in application-dev.yml and
    #   application-prod.yml, which may raise a category here but must not
    #   lower either floor below.
    root: INFO

    # Assumptions: the module's own code is left at the same level as the
    #   root rather than raised, because a job's progress is recorded durably
    #   in batch.batch_run and its outcome in the process exit status, so the
    #   log stream is a diagnostic channel rather than the record of what
    #   happened. Raising it here would put per-record lines into every
    #   nightly run at feed volume.
    com.carddemo: INFO

    # Assumptions: this comment governs BOTH keys immediately below, which
    #   are kept at this level deliberately because they are the two
    #   categories an operator reads FIRST when a task fails. The batch
    #   framework logs job and step start, completion and exit status at this
    #   level, and the migration engine logs which migrations it applied,
    #   which together answer "did the schema change, and which step stopped"
    #   without any per-record output.
    org.springframework.batch: INFO
    org.flywaydb: INFO

    # Trade-offs: this comment governs BOTH keys immediately below --
    #   statement logging and bind-parameter logging -- which are floored OFF
    #   rather than merely left unset, and this is a data-protection floor,
    #   not a volume control. A bound parameter in this module carries the
    #   primary account number of every transaction in the feed, and the
    #   masking that suppresses it elsewhere lives in the mapper layer, which
    #   these categories sit underneath and therefore bypass entirely -- a
    #   single raised level here would write unmasked cardholder data to the
    #   container's log stream at feed volume, defeating the masking without
    #   touching it. OFF rather than a higher level because these categories
    #   emit at DEBUG and TRACE, so any threshold above them merely happens
    #   to exclude them and would let a profile re-enable them by lowering one
    #   number. What is given up is the ability to read executed SQL from a
    #   deployed task's log; the accepted substitute is reproducing the step
    #   locally against a database container.
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
