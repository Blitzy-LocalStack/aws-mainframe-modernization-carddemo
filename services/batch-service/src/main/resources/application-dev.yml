# =============================================================================
# services/batch-service/src/main/resources/application-dev.yml
# -----------------------------------------------------------------------------
# Purpose:
#   The `dev` profile overlay for batch-service, the BATCH bounded context of the
#   CardDemo mainframe-to-microservices migration. It narrows five things for a
#   development deployment and nothing else: which Parameter Store tier the
#   module reads, how long a connection attempt may wait, how tightly a database
#   session is bounded, how many rows a round trip carries, and how loudly the
#   module logs.
#
#   The framework activates this document when SPRING_PROFILES_ACTIVE=dev is
#   present in the task environment, which infra/modules/ecs-service places
#   there. Neither this file nor application.yml sets that variable, because a
#   document that selected its own profile would make both overlays unreachable.
#
#   It is an OVERLAY, never a replacement: application.yml settles topology and
#   this file settles size. A setting that changes what the module DOES belongs
#   in the base; only a setting that changes how MUCH belongs here. Every key
#   below is already declared in application.yml except
#   spring.datasource.hikari.connection-timeout, the file's one addition, whose
#   rationale is recorded at the key.
#
# Inputs (the "parameters" this document consumes):
#   Activation:
#     SPRING_PROFILES_ACTIVE=dev  -- placed by the task definition, never here.
#   Keys it overrides, every one of them already declared in application.yml,
#   with the line the base declares each on:
#     spring.config.import                                      L265
#     spring.datasource.hikari.minimum-idle                     L457
#     spring.datasource.hikari.data-source-properties.options    L511
#     spring.jpa.show-sql                                       L653
#     spring.jpa.properties.hibernate.jdbc.fetch_size           L672
#     spring.jpa.properties.hibernate.jdbc.batch_size           L694
#     logging.level.com.carddemo                                L763
#     logging.level.org.springframework.batch                   L772
#     logging.level.org.flywaydb                                L773
#     logging.level.org.hibernate.SQL                           L790
#     logging.level.org.hibernate.orm.jdbc.bind                 L791
#   The ONE key it adds that application.yml does not declare:
#     spring.datasource.hikari.connection-timeout. It is the only addition in
#     this file. Why adding it is correct here, and why it is not simply moved
#     into the base, are both recorded under WHY below and again at the key.
#   Environment variables it reads:
#     CARDDEMO_ENVIRONMENT -- an environment LABEL, never a location, a
#     credential or an endpoint. It is the one placeholder here carrying a
#     default, for the reason application.yml:239-245 records: an unresolved
#     placeholder inside spring.config.import aborts the earliest
#     configuration-loading phase, before the `optional:` prefix can take effect.
#   Values it does NOT supply and must never supply:
#     the writer endpoint, the database credentials, the dataset bucket, the
#     error-queue URL and every key identifier. Each is an output of a Terraform
#     module, published to Parameter Store or Secrets Manager and read at
#     startup through the import this file re-points.
#
# Fails when:
#   - The connection budget is set below the Aurora resume window. A `dev`
#     cluster provisioned at a minimum capacity of zero is paused while idle, so
#     the FIRST connection of an otherwise healthy run pays that resume, and too
#     short a budget presents as an unreachable database rather than a cold one.
#   - A topology key is overridden here. Nothing errors; `dev` simply stops
#     matching `prod`, and the divergence first surfaces as a parity failure in a
#     run this file gives no reason to suspect.
#   - A key is written that application.yml does not declare and no framework
#     property matches. Spring accepts an unknown key in SILENCE, so the symptom
#     is a missing behaviour with no diagnostic. The one addition here was
#     verified against the HikariConfig setter it binds to.
#   - Either cardholder-data category at the foot of this file is raised. Nothing
#     fails; the log stream simply begins carrying unmasked primary account
#     numbers for every record in the feed.
#
# Deliberate omissions, so that each absence reads as a decision:
#   - No management.* and no server.*, even though all three authored peer
#     overlays set management.endpoints.web.exposure.include. This module
#     declares neither the actuator nor the web starter, so both namespaces would
#     bind to nothing and be accepted without complaint.
#   - No logback-spring.xml and no retention key: retention is a property of the
#     CloudWatch log group infra/modules/observability provisions, not of this
#     artifact. The container writes to stdout/stderr and the log driver collects.
#   - No spring.profiles.active, no default job and no default or canonical
#     format for the business date. Assumptions: the business-date token is an
#     OPAQUE passthrough, because app/cbl/CBACT04C.cbl:476-480 concatenates
#     whatever PARM-DATE holds straight into the transaction identifier with no
#     editing, and BOTH shapes are committed as goldens -- 2022071800000001 in
#     tests/golden/interest/e2e_interest_cycle_transactions.expected against
#     2024-01-15000001 in tests/golden/interest/happy_path/transact.expected. A
#     canonical format here would satisfy one golden and break the other.
#   - No rounding, scale or spring.jackson.* key; no springdoc.* and no
#     spring.security.*, since this module publishes no contract and serves no
#     request; and no statement_timeout, for the reason recorded at the session
#     bounds below.
#
#   Documentation convention: docs/CODE_DOCUMENTATION_STANDARD.md. YAML has no
#   docstring construct, so this header is the module-entry-point equivalent and
#   every key below carries an adjacent rationale under one of the four canonical
#   labels, as Rule 1 "Explainability" requires.
# =============================================================================

spring:

  # WHY : (1) Assumptions: the same MECHANISM as the base addressed at a
  #       different tier -- an `optional:aws-parameterstore:` import, exactly as
  #       application.yml:270 declares it, with only the default environment
  #       label changed from `local` to `dev`. The path is a logical Parameter
  #       Store prefix, not an endpoint, and it names no value.
  #       (2) Refactoring Rationale: the base's default exists to keep an
  #       off-platform JVM startable and is correct there, but inheriting it
  #       unchanged under this profile would let a task started with the `dev`
  #       profile and no CARDDEMO_ENVIRONMENT injected take its SIZING from this
  #       file and its parameter VALUES from the `local` tier. Both paths
  #       resolve, so no error reports the mismatch; pinning the default to
  #       `dev` makes the profile and the tier it reads agree by construction.
  #       (3) Refactoring Rationale: the label variable was CARDDEMO_ENV and is now
  #       CARDDEMO_ENVIRONMENT, matching the base document and every other
  #       configuration and metric path in the repository. The rationale is
  #       recorded once at the base document's own config key; what matters here is
  #       that the two documents agree, because a profile that read a different
  #       variable from its base would resolve a different prefix and the `optional:`
  #       import would report nothing.
  #       (4) Assumptions: the shared defaults document is named again in this
  #       list. This key REPLACES the base document's list rather than adding to
  #       it, so omitting the classpath entry would drop the shared console log
  #       pattern in the dev profile only -- and the correlation identifier
  #       would vanish from exactly the logs a developer is reading.
  config:
    import:
      - "classpath:/carddemo-common-defaults.yml"
      - "optional:aws-parameterstore:/carddemo/${CARDDEMO_ENVIRONMENT:dev}/batch/"

  datasource:
    hikari:
      # Trade-offs: this is the one key application.yml does not declare, and the
      #       widened budget is what lets a `dev` task survive an Aurora resume. A
      #       cluster at a minimum capacity of zero pauses while idle and must
      #       resume before accepting a connection, so the first connection of a
      #       run -- taken by Flyway at startup, before any job step executes --
      #       pays that resume. The framework default leaves little margin once a
      #       verify-full handshake is added on top, so a healthy cold start could
      #       fail exactly as though the endpoint were unreachable. What is given
      #       up is detection speed: a `dev` database that really is unreachable
      #       is reported after this wait rather than sooner. Accepted because
      #       `dev` trades detection speed for the cost saving of a capacity floor
      #       of zero, while `prod` holds its floor above zero, never pauses, and
      #       therefore neither needs this value nor inherits it.
      connection-timeout: 45000

      # Trade-offs: the pool is allowed to empty completely, where the base keeps
      #       one connection warm. A run-and-exit task holding an idle connection
      #       against a cluster at its capacity floor occupies a slot the floor
      #       makes scarce, and keeps an idle cluster from settling into the
      #       paused state that floor exists to reach. What is given up is that
      #       the first checkout pays its own establishment cost instead of
      #       finding a warm connection -- paid once for a task that runs one job
      #       and exits, which is why the base's reason for keeping one warm does
      #       not carry into `dev`. The MAXIMUM is deliberately not lowered
      #       alongside it: the base fixes that floor strictly above one because
      #       the job repository writes step and job execution state in a
      #       transaction SEPARATE from the chunk transaction and a streaming
      #       reader holds a third connection for the whole of a step, so a
      #       smaller ceiling would deadlock this module rather than economise.
      minimum-idle: 0

      # Trade-offs: two of the three bounds the base sets are tightened and the
      #       third stays absent. Lock waiting and idle-in-transaction are
      #       shortened because a `dev` run competes with no online traffic, so a
      #       wait that does not clear promptly is a real contention defect rather
      #       than ordinary contention. statement_timeout stays unset because a
      #       single long set-based statement is legitimate batch work -- the
      #       combine step replaces the sort and merge of app/jcl/COMBTRAN.jcl
      #       with one ordered query -- and the outer bound on a step is the
      #       per-state timeout the invoking state machine already enforces, so a
      #       second, shorter bound here would cancel correct work and report it
      #       as a failure.
      # Assumptions: lowering the idle-in-transaction ceiling PRESERVES the
      #       base's ordering invariant, which requires the client-side leak
      #       detector to sit ABOVE the server-side ceiling so the server
      #       terminates a connection stuck inside a transaction while the
      #       detector reports only the checked-out-but-not-in-transaction case an
      #       unclosed stream produces. Lowering the ceiling widens that gap
      #       rather than closing it.
      # Assumptions: only this map ENTRY is replaced. sslmode and sslrootcert are
      #       separate entries of the same map and are inherited unchanged, so
      #       verify-full and its trust anchor still apply here.
      data-source-properties:
        options: "-c lock_timeout=10000 -c idle_in_transaction_session_timeout=120000"

  jpa:
    # Trade-offs: held at the base's value rather than raised, and restated
    #       rather than merely inherited because it is the single most tempting
    #       key to flip in a development profile. This key echoes statements
    #       through the persistence provider straight to standard output,
    #       bypassing the logging framework, so no logger level below can filter
    #       it and none of the masking reaches it -- and in this module the bound
    #       values include the primary account number of every transaction in the
    #       daily feed. What is given up is reading executed SQL from a `dev`
    #       task's log; the accepted substitute is reproducing the step against a
    #       local database container, where the rows are fixture rows.
    show-sql: false

    properties:
      hibernate:
        jdbc:
          # Trade-offs: a narrower reader window than the base's, which bounds a
          #       failing read to fewer rows and makes the record that caused it
          #       easier to identify. It stays well above one deliberately: a
          #       window of a single row per round trip would reproduce the
          #       baseline's record-at-a-time I/O PATTERN rather than its
          #       semantics, and it is the semantics parity requires --
          #       app/cbl/CBTRN02C.cbl:202-219 loops one record at a time because
          #       a VSAM read returns one record, not because the row count per
          #       I/O is part of the contract. The value stays positive because a
          #       positive window and auto-commit off are jointly the condition
          #       under which the driver opens a server-side cursor at all; a zero
          #       would buffer the whole result in the client.
          fetch_size: 25

          # Alternatives Considered: a saga, a distributed coordinator or a
          #       compensating reversal, so a smaller write grouping could also
          #       commit in pieces. Rejected. app/cbl/CBTRN02C.cbl commits three
          #       writes as ONE unit of work inside 2000-POST-TRANSACTION -- :440
          #       2700-UPDATE-TCATBAL, :441 2800-UPDATE-ACCOUNT-REC, :442
          #       2900-WRITE-TRANSACTION-FILE -- so committing them separately
          #       would make a state such as a posted transaction whose category
          #       balance has not moved observable. No such state exists in the
          #       baseline, so the golden masters would correctly report it as a
          #       parity failure. This key is behaviour-neutral ONLY because it
          #       changes how many statements share a round trip and nothing about
          #       the transaction boundary: the three writes stay inside one
          #       commit at every value it can take. The smaller grouping is
          #       chosen so a constraint violation in a `dev` run is attributable
          #       to fewer statements.
          batch_size: 10

logging:
  level:
    # Trade-offs: this module's own categories are raised one step, which is the
    #       reason a `dev` logging profile exists at all. The base holds them
    #       level with the root in every environment because a job's progress is
    #       recorded durably in batch.batch_run and its outcome in the process
    #       exit status, so per-record output earns nothing in a nightly run and
    #       costs feed-volume log lines. In `dev` that inverts: the feed is
    #       fixture-sized and the reason to run a job is to watch it. The root
    #       level is deliberately NOT lowered alongside this one, so third-party
    #       categories stay quiet and this module's own lines are what the raised
    #       level surfaces.
    # Assumptions: raising a category never authorises logging a whole record, a
    #       primary account number or a card verification value. The masking that
    #       suppresses those lives in the mapper layer, and a debug statement that
    #       formats an entity directly is the easiest way to defeat it.
    com.carddemo: DEBUG

    # Trade-offs: this rationale governs BOTH keys below. They are raised because
    #       they answer the first two questions a failing `dev` run raises --
    #       which step stopped, and did the schema change -- adding step and chunk
    #       transitions and the resolved migration set. The extra volume is
    #       accepted only because a `dev` feed is fixture-sized; the same level
    #       against a production feed would emit per-chunk lines for an entire
    #       run, which is why neither is raised in the base.
    # Assumptions: neither category emits a bound parameter, so raising them does
    #       not reach the cardholder data the two keys below hold off.
    org.springframework.batch: DEBUG
    org.flywaydb: DEBUG

    # Assumptions: this rationale governs BOTH keys below, which are held at the
    #       base's value -- a deliberate divergence from all three authored peer
    #       overlays, each of which raises statement or bind logging in `dev`.
    #       That choice is sound for a request-scoped service and does not
    #       transfer here: a bound parameter in this module carries the primary
    #       account number of every transaction in the feed, these categories sit
    #       UNDERNEATH the mapper layer that does the masking and so bypass it
    #       entirely, and the volume is the whole feed rather than one request.
    #       They are restated rather than inherited silently so a reader comparing
    #       this file with a peer's finds the reason here instead of reading the
    #       difference as an oversight. Off rather than a higher threshold because
    #       these categories emit at DEBUG and TRACE, so any level above them
    #       merely happens to exclude them and would let one lowered number
    #       re-enable both.
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
