# =============================================================================
# tests/pytest.ini
# -----------------------------------------------------------------------------
# Purpose:
#   pytest configuration for the AWS CardDemo automated test suite. Placing this
#   file in tests/ makes pytest resolve its rootdir to tests/ when the runner
#   scripts invoke `pytest tests/integration ...` / `pytest tests/e2e ...` from
#   the repo root, so tests/conftest.py (shared fixtures) is discovered for
#   every layer.
#
# WHY:
#   - Assumption: the runner scripts pass explicit marker filters (-m integration
#     / -m e2e); markers are registered below so --strict-markers turns a typo'd
#     or unregistered marker into a HARD ERROR (financial-grade rigor) instead of
#     a silent no-op that would let whole layers go unrun.
#   - Trade-off: junit_family=xunit2 is pinned explicitly (it is pytest's current
#     default) so the emitted reports/*.xml stay on the schema CI expects even if
#     a future pytest changes the default.
#   - Refactoring Rationale (review finding MA-25): the JUnit output is made
#     DETERMINISTIC so byte-diffs of reports/*.xml are meaningful in CI -
#     junit_logging=no keeps captured stdout/stderr OUT of the XML (log text is
#     the largest source of run-to-run churn), junit_duration_report=total drops
#     per-call timing jitter, and a fixed junit_suite_name gives a stable
#     <testsuite name>. The per-layer --junitxml PATH stays a runner-script CLI
#     argument (reports/integration.xml, reports/e2e.xml) because one fixed path
#     here would collide across layers.
#   - Refactoring Rationale (review finding MI-02): pytest-golden is disabled by
#     default via '-p no:pytest-golden'. The AAP designates tests/helpers/
#     golden_compare.py as the primary golden comparator, so loading pytest-
#     golden only emitted a GoldenTestUsageWarning and installed an unused
#     assertion-rewrite hook. 'pytest-golden' (hyphen) is the entry-point name
#     that pytest's '-p no:' actually blocks (verified); the underscore/short
#     forms do not disable it.
# =============================================================================
[pytest]
minversion = 9.0

# Default collection roots for a bare `pytest` run started from tests/. The
# runner scripts still pass explicit paths; cobol-unit is COBOL (GCBLUnit), not
# pytest-collected, so it is intentionally excluded here.
testpaths =
    integration
    e2e

# Registered markers. With --strict-markers any unregistered marker is an error.
markers =
    unit: COBOL/GCBLUnit-level unit tests (fast, isolated program/paragraph logic).
    integration: single-program pytest tests against compiled GnuCOBOL programs.
    e2e: full batch-chain end-to-end golden-master tests.
    localstack: tests requiring the headless LocalStack S3 emulator (opt-in).
    slow: long-running tests (may be deselected for fast local iteration).

# --strict-markers/--strict-config catch marker & config drift early; -ra prints
# a concise summary of skips/xfails for auditability. '-p no:pytest-golden'
# disables the unused pytest-golden plugin (MI-02); golden_compare.py is the
# AAP-designated comparator.
addopts =
    --strict-markers
    --strict-config
    -ra
    -p no:pytest-golden

# Deterministic, CI-ingestible JUnit output (MA-25). junit_family pins the
# xunit2 schema; junit_logging=no and junit_duration_report=total strip the
# run-to-run churn (captured logs, per-call timings); junit_suite_name fixes a
# stable <testsuite name>. The runner scripts still pass --junitxml=<path>.
junit_family = xunit2
junit_logging = no
junit_duration_report = total
junit_suite_name = carddemo

# Enterprise rigor: an xpassed test (an xfail that unexpectedly passed) is a failure.
xfail_strict = True

# No-hidden-skips gate: the companion enforcement for UNEXPECTED skips lives in
# tests/conftest.py (pytest_runtest_logreport + pytest_sessionfinish). WHY it is a
# conftest hook and not declared here (Trade-off): pytest.ini is declarative and
# cannot express "fail iff a genuine skip falls outside the documented allowlist
# (export/import compile-defect; opt-in LocalStack layer) while cobc is present". A
# single conftest gate covers every layer/runner uniformly (and is xdist-safe),
# turning a silently-disabled required test from a green skip into a hard failure.
